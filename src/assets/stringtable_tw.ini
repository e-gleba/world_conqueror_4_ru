event_4111=巴倫支海海戰
event_4112=維斯瓦河-奧得河攻勢
event_4113=拉包爾戰役

event_intro_4111=1942年12月31日，英軍護航艦隊與德國海軍的攔截艦隊在巴倫支海爆發了一場海戰。德軍艦船火力占優，但護航艦隊憑藉快速的反應與及時的增援，成功掩護了前往蘇聯的運輸船隊。德軍艦隊未能擊沉任何一艘運輸船，此役的失敗直接導致德國海軍司令雷德爾辭職，鄧尼茨接任。德國海軍戰略重心徹底轉向潛艇戰。
event_intro_4112=維斯瓦河-奧得河攻勢是蘇聯紅軍實施的一次大規模戰略性進攻。為了回應西線盟軍在阿登戰役中的困境，蘇軍將原定進攻計畫提前了8天，於1945年1月12日從維斯瓦河上的登陸場發起突擊。在朱可夫和科涅夫元帥的指揮下，蘇軍兩個方面軍以絕對優勢兵力突破德軍防線並解放了華沙、克拉科夫等城市，將戰爭直接推進至德國腹地，為最終攻克柏林奠定了決定性基礎。
event_intro_4113=拉包爾戰役是日軍為奪取南太平洋戰略樞紐而發動的關鍵行動。1942年1月初，日軍航母艦載機開始空襲拉包爾。1月23日，日軍地面部隊順利登陸並迅速佔領了拉包爾，隨後將其設為堅固的海空堡壘。對盟軍而言，拉包爾的失守使其與澳大利亞之間的交通線面臨直接威脅。日軍成功獲得了至關重要的前進基地，極大便利了其後在所羅門群島及新幾內亞方向的進一步行動。

dialogue_4253=潛艇部隊發現了英國運輸船隊的動向。
dialogue_4254=艦隊分為兩隊，在引開英軍的護衛艦後全力消滅運輸船隊。
dialogue_4255=英軍艦船發現了西北方的德軍艦隊。前往攔截的同時，護航艦隊施放了煙幕掩護運輸船隊逃離戰場。
dialogue_4256=德國人的兵力已經所剩無幾，而我們的援軍無窮無盡。
dialogue_4257=華沙一帶的防線已經被突破，德國人正在潰退。繼續追擊，全速前進！
dialogue_4258=克拉科夫的德軍已經崩潰。敵人放棄了他們的陣地，開始向西移動。
dialogue_4259=我們佔據了絕對的優勢，不要放走島上的澳軍，封鎖他們的撤離路線。
dialogue_4260=面對人數眾多的日軍登陸部隊，澳大利亞守軍兵力嚴重不足，只能開始向南撤退。
dialogue_4261=通訊效率顯著提升，戰鬥機現在能更快地回應地面部隊的空襲請求。利用好空中優勢，這是屬於戰鬥機的一天。
dialogue_4262=戰況出現了偏差，但還有挽回的餘地。
dialogue_4263=最高統帥部直接下達了命令，要求我們停止前進。
dialogue_4264=我們應該為後續的進攻提前執行一些“強力偵查”行動。裝甲部隊繼續前進。
dialogue_4265=這……這空襲的規模根本無法阻止德軍的地面進攻。
dialogue_4266=如此潰敗的原因到底出在哪裡？
dialogue_4267=阿爾弗雷德已經陣亡，戰況嚴重偏離預期。也許下次應該更早地接管行動。
dialogue_4268=這次的失敗已成定局。但是你們會為此付出代價。
dialogue_4269=我會回來的。
dialogue_4270=隆美爾的部隊已經被我們包圍。
dialogue_4271=永遠不要低估軍人捍衛自己國家的決心。撤退。
dialogue_4272=德軍還在做著無謂的抵抗。拿下卡昂，徹底摧毀敵人的防線。
dialogue_4273=你們的意志值得讚賞。
dialogue_4274=為了軍人的榮譽，為了德意志，我們會繼續戰鬥。
dialogue_4275=只有我們能拯救自己，拯救我們的國家。
dialogue_4276=惡劣的天氣對雙方都極為不利。要想達到預期目標就必須加快進攻的速度。
dialogue_4277=普魯士不會有被俘虜的將軍。
dialogue_4278=暴風雪結束了。反攻現在開始。
dialogue_4279=阿登森林的雪冷得刺骨，我好像已經在這裡倒下過無數次。
dialogue_4280=我會記住你們這些愚蠢而又可敬的對手。你們的讚歌就是勇氣的讚歌。
dialogue_4281=黑蠍在太陽要塞的實驗取得了成功。信標增幅器已經調試完畢。受到影響的人自主意識逐漸被抑制，最終重新加入黑蠍。
dialogue_4282=這樣的做法也許太過直接，他們總有一天會知道的。
dialogue_4283=也許吧，但即便是這樣我也會選擇相信阿爾弗雷德。
dialogue_4284=我們會在這削弱敵人的力量，盡可能地為你們爭取時間。
dialogue_4285=太陽要塞裡的記錄顯示，南美的3個信標增幅器將在10個實驗週期後完成調試。
dialogue_4286=從一開始我就知道結局，我早就選定了自己要走的必經之路。
dialogue_4287=最後殘餘的信標增幅器已經調試完畢。由於黑蠍長期在控制區暗中投放含有Q30物質的納米藥物。鐘聲響起，受到藥物影響的人自主意識逐漸被抑制，最終重新加入黑蠍。
dialogue_4288=我們成功地阻止了這場災難，但是禍根依然沒有被斬斷。
dialogue_4289=必須重新集結部隊，奪回我們的要塞。
dialogue_4290=黑蠍在墨西哥的遺跡太陽要塞被攻破，信標增幅器被佔領。全球各處秘密基地的位置被全部揭示，黑蠍在戰略層面陷入了全面被動。
dialogue_4291=黑蠍在哥倫比亞的遺跡回聲地堡被攻破，信標增幅器被佔領。遺跡中的各項設施已被自行銷毀。但殘留的訪問記錄顯示該設施的重啟時間點為1933年。
dialogue_4292=黑蠍在巴西的遺跡印加之眼被攻破，信標增幅器被佔領。許多特殊的武器裝備沒來得及轉移或銷毀，甚至還有一些從未見過的新式軍備設計圖。
dialogue_4293=黑蠍在巴西的遺跡星軌神殿被攻破，信標增幅器被佔領。美蘇繳獲了大量的加密資料，黑蠍在世界各地的人員名單和軍事部署已完全被揭露。
dialogue_4294=黑蠍的全部遺跡設施均被佔領，倒計時停止。黑蠍在南美洲的計畫被徹底挫敗。
dialogue_4295=奧斯本被徹底擊敗，倒計時停止。黑蠍在南美洲的計畫被徹底挫敗。


