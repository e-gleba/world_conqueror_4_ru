event_intro_401=中途島海戰是太平洋戰爭的轉捩點。1942年6月4日，日美雙方在中途島西北海域展開決戰。由於日軍無線通訊密碼被破譯，美軍迅速制定了反制計畫，以更小的代價使日軍遭受了更多的人員損失。赤城號等4艘航母被擊沉，自此日軍失去了太平洋的戰略主導權。
event_intro_402=盟軍於1944年6月6日正式發起登陸作戰。在各項欺騙行動、軍艦炮擊、空軍轟炸、空降作戰的配合下，近16萬名士兵橫渡英吉利海峽，於諾曼第地區的5個灘頭進行搶灘登陸。霸王行動自此正式展開，也為盟軍的勝利奠定了基礎。
event_intro_403=義大利於1940年6月10日向英法宣戰，並出動了30萬軍隊向阿爾卑斯山區與尼斯地區發動進攻。但在阿爾卑斯防線與馬奇諾防線南部遭到法軍頑強抵抗後，意軍便立刻停止了前進。
event_intro_404=1941年6月15日，為解除軸心國軍隊對圖卜魯格的包圍，英軍再次組織了對昔蘭尼加的佔領行動。英軍佈置了大量空軍壓制德軍空軍及運輸線，但此次行動未能攻下德軍的陣地，反而裝甲部隊遭受到了巨大的損失，且在德軍的反擊下被包圍。艱難撤退後，以失敗告終。
event_intro_405=在艦炮的火力掩護下，美軍於1944年6月15日發起了對塞班島的登陸作戰。島上的日軍拒絕投降，進行了激烈的抵抗，並在最後時刻發起玉碎攻擊。美軍也為這場勝利付出了高昂的代價。
event_intro_406=此役是巴巴羅薩行動第一階段的一場大型包圍戰。德國於1941年6月22日展開進攻，中央集團軍群沿比亞維斯托克—明斯克—斯摩棱斯克軸線向莫斯科方向進攻。德軍裝甲部隊的高速推進使大量蘇軍被包圍。但被圍蘇軍仍堅持抵抗，約25萬人逃出了包圍圈。
event_intro_407=此役是巴格拉季昂行動第一階段的一場重要攻勢。1944年6月25日，蘇軍波羅的海第1方面軍與白俄羅斯第3方面軍將德軍包圍於維捷布斯克。德軍的防線並未堅持太久，維捷布斯克與奧爾沙相繼被解放，巴格拉季昂行動順利展開。
event_intro_408=1942年6月28日，蘇軍調集了預備隊增援沃羅涅日，以攔截向史達林格勒增援的德軍。雙方在沃羅涅日展開了極為慘烈的戰鬥。德軍最終佔領了該城，而蘇軍贏得了更多時間，史達林格勒的防禦得以增強。
event_intro_409=第一次阿拉曼戰役是一場消耗戰，由隆美爾的非洲軍團在1942年7月1日首先發起進攻，但並未突破阿拉曼防線。隨後英軍發起反攻，雙方對多地進行反復爭奪，陷入僵持狀態。德軍佔領亞歷山大港的計畫被挫敗。
event_intro_410=1941年7月6日，因為巴巴羅薩計畫初期的巨大勝利，德軍兵鋒在東歐平原上長驅直入。蘇軍在經歷了前期失利後，任命謝苗·鐵木辛哥在斯摩棱斯克組織新防線，以不斷的反擊削弱德軍攻勢，但未能阻擋德軍將戰線推進到莫斯科。
event_intro_411=1943年7月9日，為了解放地中海航道，推動墨索里尼倒臺，牽制德軍東線兵力；以美、英兩國為主導，盟軍對西西里島發動了兩栖登陸作戰。憑藉各方面的充分準備，此戰成功達成了全部目的。德軍雖然成功撤離，但也未能阻止墨索里尼的倒臺。
event_intro_412=此役是庫爾斯克會戰中最為慘烈的一戰。蘇軍以壓倒性的兵力優勢，於1943年7月12日向奧廖爾的德軍突出部發動進攻。德軍在面臨被蘇軍包圍的風險後，最終放棄了突出部。蘇軍收復了奧廖爾，也奪回了戰略主導權。
event_intro_413=此役是巴巴羅薩行動第三階段的一場包圍戰。德軍南方集團軍群從3個方向挺近烏克蘭，裝甲集群向基輔南面與烏曼北面推進，於1941年7月15日攻佔別爾季切夫。蘇軍因判斷錯誤德軍的進攻方向，錯失撤退良機，導致大量人員被俘。
event_intro_414=諾曼第登陸後，盟軍在卡昂遭到了德軍的頑強抵抗。英軍與加拿大軍於1944年7月18日發起古德伍德行動，向卡昂南部的德軍防禦陣地發起進攻。然而德軍憑藉有利地形與火力優勢重創了盟軍的裝甲部隊。在遭受到巨大損失後，行動被迫終止。
event_intro_415=1942年7月21日，繼珊瑚海戰役失敗後，為了完成佔領莫爾茲比港、切斷美國與澳大利亞的海空聯繫的戰略目標，日軍決心通過陸路攻佔莫爾茲比港。澳大利亞部隊面對人數眾多，訓練和武器都遠勝他們的日軍，初期一度艱難防守。最終憑藉地利與美軍的援助，成功迫使日軍撤離科科達。
event_intro_416=盟軍為了突破諾曼第的德軍防線，發起了多個支援行動，將大部分德軍裝甲預備隊吸引至了英軍與加拿大軍的防線。1944年7月25日，盟軍集中力量在聖洛附近向德軍發起衝擊。由於缺乏人員裝備、士氣低落等原因，德軍無法組織起有效的反攻，諾曼第西部的防線徹底崩潰。
event_intro_417=盟軍利用眼鏡蛇行動的成功，在德軍裝甲部隊撤退的間隙主動出擊，於1944年7月30日發起了藍衣行動。英軍成功牽制並消耗了戰線東側的德軍裝甲部隊，為之後挫敗德軍的反攻以及在法萊斯包圍德軍做出了貢獻。
event_intro_418=蘇軍於1943年8月3日向德國南方集團軍群的北翼發起攻擊，該攻勢旨在奪回別爾哥羅德、哈爾科夫地區。德軍面對數量龐大的蘇軍部隊成功撤退，哈爾科夫再次易手。他們也因庫爾斯克會戰的失利完全喪失了蘇德戰爭的戰略主導權。

event_intro_419=這是太平洋戰場盟軍對日本帝國的第一次重大地面攻勢。1942年8月7日，盟軍在所羅門群島南部的瓜達爾卡納爾島、圖拉吉島和佛羅里達島登陸。日本守軍寡不敵眾，被盟軍壓倒，多次嘗試奪回，最終未能成功。
event_intro_420=在奪取卡昂之後，為了瓦解德軍戰線並切斷其退路，1944年8月8日淩晨，加拿大軍突破了德軍防線，佔領了防線深處的重要陣地，最終在法萊斯以北7英里處止步。
event_intro_421=法萊斯戰役是第二次世界大戰中諾曼第戰役的決定性戰役。1944年8月12日至21日，盟軍通過包圍戰摧毀了塞納河以西的大部分B集團軍群，俘虜了50000多人，為通往巴黎和法德邊境開闢了道路。
event_intro_422=1944年8月15日，為了解決諾曼第登陸後盟軍的補給問題，盟軍決定重新啟用龍騎兵行動以獲取法國南部港口。此次作戰中，盟軍在短短四個星期內解放了法國南部的大部分地區，給德軍造成重大傷亡，使G集團軍群退守孚日山脈一線。
event_intro_423=1942年8月19日，為了測試登陸的可行性並收集情報，盟軍進行了一次試探性的登陸作戰，結果遭受了德軍的強烈阻擊：登陸部隊傷亡率高達68%，只有一支部隊短暫收集了少量軍事情報。此戰被後世視為一次災難性的兩栖攻擊，但戰鬥結果給雙方都提供了教訓，深刻影響了後來的諾曼第登陸。
event_intro_424=基輔戰役是二戰期間的一場大型包圍戰。1941年8月23日至9月26日，德軍集中中央集團軍群和南方集團軍群的軍力，圍繞基輔完成了史上包圍人數最多的包圍圈。戰後統計，德軍以10萬人的損失剿滅了蘇軍70萬人，後世評價為“德軍東方戰線上的最大勝利和紅軍最大的軍事災難”。
event_intro_425=由於蘇聯指揮部判斷失誤，波羅的海艦隊主基地——塔林在巴巴羅薩行動早期迅速陷落。1941年8月27日，塔林剩餘守軍不得不在炮火中登船撤離至列寧格勒。為了阻止蘇軍撤離，德國和芬蘭用艦隊、水雷和空軍封鎖芬蘭灣，造成了50多艘艦艇損毀和1萬多名人員傷亡，但最終波羅的海艦隊的大部分船隻抵達喀琅施塔得並參加了列寧格勒的防禦。
event_intro_426=此戰是北非戰場上軸心國軍隊主動發起的最後一次大規模攻勢。1942年8月30日，隆美爾向阿拉姆哈勒法嶺的第8軍團發動進攻，以避免因補給不利而徹底失去勝利希望。但作戰計畫被英軍提前破獲，蒙哥馬利借此進行了專門的戰術佈置，使隆美爾的最後希望徹底落空。此戰後，軸心國的非洲部隊失去了主動權，在非洲的戰略目標不再可能實現。
event_intro_427=此戰標誌著第二次世界大戰的開始。1939年9月1日，在蘇德秘密簽訂《蘇德互不侵犯條約》後，德軍悍然入侵波蘭，並迅速擊潰了波蘭軍隊。16天后，蘇聯也回應德軍，佔領了波蘭東部。由於裝備和軍力的巨大劣勢，波蘭最終被蘇德兩國迅速瓜分，政府流亡海外。
event_intro_428=1943年9月3日，在西西里島登陸戰役勝利後，盟軍繼續進攻義大利本土。盟軍估計德軍會在塔蘭托以南重點佈防，因此計畫在塔蘭托以南進行佯攻，而主力在薩勒諾登陸以控制那不勒斯。然而，德軍判斷那不勒斯更為重要，使盟軍登陸變得困難。最終，盟軍成功控制了包括薩勒諾在內的義大利南部，但未能佔領那不勒斯。
event_intro_429=此戰是西部沙漠戰役的開端。義大利此前計畫沿海岸線入侵埃及以奪取蘇伊士運河，但多次拖延後，攻勢縮小為推進至西迪巴拉尼。1940年9月9日，意軍出擊，一周內推進至目標並在此駐紮，積累補給等待下一次進攻。
event_intro_430=1944年9月14日，為了解放愛沙尼亞、拉脫維亞和立陶宛，盟軍在波羅的海地區發起了巨大的戰略攻勢，包括里加、塔林等四場標誌性戰役。該地區的德軍在攻勢下頑強抵抗，但損失慘重，最終被包圍在庫爾蘭。
event_intro_431=1944年9月17日，為了嘗試繞過齊格菲防線，入侵魯爾工業區，盟軍向荷蘭投入大量空降部隊與英軍地面推進配合企圖奪下埃因霍至阿納姆的橋樑，為後續行動打開道路。但由於計畫過於激進以及部隊之間的配合問題，盟軍推進了70英里，但沒能奪取阿納姆。
event_intro_432=許特根森林戰役是美軍歷史上持續時間最長的戰役，從1944年9月19日持續至次年2月10日。美軍試圖牽制德軍以防其增援阿亨戰役，向許特根森林發動進攻。然而，德軍為了保護魯爾大壩，成功減緩了盟軍進展，造成重大傷亡。美軍損失至少33,000人，德軍損失28,000人。戰役代價慘重，被形容為盟軍“重大失敗”。
event_intro_433=達卡戰役是盟軍於1940年9月23日至25日試圖奪取法屬西非戰略港口達卡的一次失敗嘗試。戴高樂將軍相信自己能說服達卡的維希法國人改變立場，但達卡總督堅決反對，最終引發了戰鬥。盟軍在幾次進攻後未能取得勝利，最終選擇撤退。
event_intro_434=梅斯戰役是指第二次世界大戰期間，德軍第1集團軍與美軍第3集團軍在梅斯周邊進行的激烈戰鬥。德軍依託一系列堡壘堅決抵抗，將美軍拖入了慘烈的陣地戰。美軍在此地的戰鬥從1944年8月27日持續至12月13日，最終迫使梅斯地區的德軍投降。
event_intro_435=布良斯克戰役於1941年9月30日開始，是德軍在巴巴羅薩計畫中的重要行動，旨在包圍並摧毀蘇聯紅軍的布良斯克方面軍，為進攻莫斯科掃清道路。德軍取得戰術勝利，但蘇軍頑強抵抗並成功拖延了德軍進攻速度，為莫斯科防禦贏得時間。
event_intro_436=1944年10月2日，為了啟用安特衛普港口並保障盟軍補給，盟軍開展了一系列軍事行動，清除控制斯海爾德河口的德軍第15集團軍。然而，由於盟軍此前將重點投入到其他行動，該區域的德軍得到了支援。最終，加拿大第1軍團以20,873名盟軍傷亡的代價，才清除斯海爾德河的敵軍。


dialogue_2712=剿滅敵人的有生力量，目標莫斯科！
dialogue_2713=同志們，莫斯科就在我們身後，一定要將敵人盡數驅逐！
dialogue_2714=指揮官閣下，蘇軍在列佩利附近集結了大批部隊，即將踏入我軍的反坦克防禦系統。
dialogue_2715=列佩利反攻雖然失利，但我們依然會奮戰到底！
dialogue_2716=維捷布斯克已經佔領，第3裝甲集團軍可以配合我們包圍斯摩棱斯克。
dialogue_2717=莫吉廖夫防線已突破，準備突擊斯摩棱斯克！
dialogue_2718=恭賀大勝！指揮官閣下，我方請求第3裝甲集團軍配合，對斯摩棱斯克展開包圍。
dialogue_2719=士兵們，快速行軍，拿下科科達！
dialogue_2720=士兵們，為了莫爾茲比港的安全，務必守住科科達！物資會不斷從後方空投過來！
dialogue_2721=控制周圍區域，打通通往莫爾茲比港的道路。
dialogue_2722=更好的支援馬上到達，奪回科科達！
dialogue_2723=援軍已至！奮戰吧，士兵們！後續的增援會越來越多！
dialogue_2724=根據計畫，我軍和英軍分別自利卡塔和敘拉古附近登陸來控制南部機場。由南向北，次第推進，我們必將勝利！
dialogue_2725=士兵們！雖然強風對登陸不利，但敵軍更不可能預料到我們的進攻。為了國王和祖國！
dialogue_2726=戰線已經崩潰，我們需要準備從墨西拿撤離，保存實力。
dialogue_2727=南部海岸已肅清，物資已從海岸線送達。
dialogue_2728=指揮官閣下，本次作戰我軍難以從佔領區獲取物資，請儘快佔領利卡塔以獲得支援。
dialogue_2729=指揮官閣下，我請求儘快進攻墨西拿以截斷軸心國退路。
dialogue_2730=士兵們，我們的裝備得到了更新，敵方的空軍和運輸線已被我方空軍壓制，此戰必勝！
dialogue_2731=我軍的儲備不足，需要靜候戰機,一擊斃命。
dialogue_2732=時機以至！突擊敵人左翼，準備包圍。
dialogue_2733=繼續突擊，擴大戰果，解圖卜魯格之圍！
dialogue_2734=將士們，快速突進，清除比亞維斯托克南北兩側的蘇軍，形成合圍！
dialogue_2735=同志們，德軍無恥地入侵了我們的國家。為了家鄉，為了蘇維埃，將他們趕出去！
dialogue_2736=繼續突破巴拉諾維奇，準備包圍明斯克。速度要快，要趕在他們重新組織防禦之前！
dialogue_2737=同志們，收縮防線！以明斯克為核心重新組織戰線。
dialogue_2738=最高統帥部命令西南方面軍：在保證安全的同時，全力化解德軍攻勢，務必守住第聶伯河防線。
dialogue_2739=蘇軍兵力多於我方，先消滅敵方有生力量，再突破防線！
dialogue_2740=最高統帥部命令西南方面軍：收縮戰線，避免被包圍，依託第聶伯河防線防守。
dialogue_2741=敵方部隊正在撤出包圍圈，快速行動，消滅他們！
dialogue_2742=依照最高統帥部命令，解放哈爾科夫，消滅第4裝甲集團軍和肯普夫集團軍。
dialogue_2743=注意戒備，養精蓄銳。準備下一次進攻，讓蘇軍徹底崩潰。
dialogue_2744=進攻博霍杜希夫，包圍哈爾科夫！
dialogue_2745=該死！對蘇軍兵力估算失誤，哈爾科夫守軍迅速撤離至第聶伯河防線。
dialogue_2746=法軍主力在德軍裝甲部隊的推進下節節敗退，大量預備隊被調往了北部。現在正是發起全面進攻的好時機。
dialogue_2747=沿著海岸線繼續推進，向尼斯方向進攻。
dialogue_2748=日軍毫無勝算，但他們也不會投降。在佔領整個島嶼前絕對不能放鬆警惕。
dialogue_2749=德軍的攻勢已經徹底失敗了，解放即將來臨。
dialogue_2750=包圍突出部的德軍部隊，解放維捷布斯克和奧爾沙。
dialogue_2751=德軍的防線正在逐漸崩潰，我們即將打通前往明斯克的道路。
dialogue_2752=不要做過多的停留，迅速突破蘇軍防線，向史達林格勒方向前進。
dialogue_2753=攔截住德軍，不要讓他們輕易通過防區。
dialogue_2754=蘇軍正在崩潰，集中力量突破敵人的防線。
dialogue_2755=英軍已經在阿拉曼一帶築好了防線。向亞歷山大港進攻的路線已經被封鎖。
dialogue_2756=我們在補給上具有優勢。拖住德軍的進攻，隨時準備發起反擊。
dialogue_2757=部隊推進受阻，我們已經陷入了一場消耗戰。
dialogue_2758=德軍預測到了我們的進攻，但這根本無濟於事。
dialogue_2759=發揮我們的數量優勢，用潮水般的進攻衝垮敵人的防線。
dialogue_2760=蘇軍向我們發起了總攻。一旦防線被突破，奧廖爾的部隊隨時可能會被包圍！
dialogue_2761=敵人的數量太過龐大了，向布良斯克方向撤退。
dialogue_2762=卡昂南部的德軍陣地是我們前進的最大障礙。在如此密集的空軍轟炸下，敵軍很難組織起有效的反擊。
dialogue_2763=全線進攻，向卡昂南部的各處敵軍陣地發起衝擊！
dialogue_2764=不要畏懼盟軍的裝甲部隊，敵人的坦克不是我們的對手。迅速做好防禦準備。
dialogue_2765=德軍的防禦力量已經被牽制和削弱。尋找敵軍陣地的突破口，集中力量撕開整條防線。
dialogue_2766=可調遣的預備隊已經所剩無幾，我們必須靠現有的力量擋住盟軍的裝甲集群。
dialogue_2767=德軍的主力正在崩潰。不用多久我們就能解放整個諾曼第，向德國邊境推進。
dialogue_2768=美軍發起了眼鏡蛇行動，我們的任務是配合他們向南推進，牽制住戰線東側的德軍。
dialogue_2769=利用好地雷和防禦設施，擋住盟軍的進攻。

