event_stage_intro_20614=部隊已經在列寧格勒周邊集結完畢，這座被圍困了近3年的英雄城市即將迎來完全的解放。不過德軍在西邊建立了一道堅固的防線。必須發動一場攻勢，打敗北方集團軍，打通向西前進的道路。
event_stage_intro_20615=克里米亞無論是對德軍還是我們都有著極為重要的軍事價值。只要突破面前的防線，就能從陸路上孤立整個克里米亞，同時從北面和刻赤半島東面發起進攻。敵人的失敗只是時間問題，塞瓦斯托波爾的要塞終會被我們奪回。
event_stage_intro_20616=在經過庫爾斯克、下第聶伯河與克里米亞的攻勢後，中央集團軍群被暴露了出來。與此同時，德軍被我們的欺騙行動所誤導，將部分兵力調往了南方的北烏克蘭集團軍群。部隊已經集結完畢，現在就是全線進攻的時機，讓敵人為他們在三年前的愚蠢行為付出代價！
event_stage_intro_20617=西線的盟軍被擋在了萊茵河前，德軍正在東線集結最後的力量準備作殊死一搏。不過敵人的精銳已損失殆盡，迅速向西推進，儘快與西線的盟軍會師。柏林的命運早已註定。

dialogue_2900=近身距離作戰效果顯著，德軍在城內已經寸步難行。
dialogue_2901=向德軍側翼的羅馬尼亞軍陣地發起進攻，突破敵人的防線，徹底包圍保盧斯的第6集團軍。
dialogue_2902=蘇軍竟然還有足夠的兵力發動大規模進攻。立即增援史達林格勒方向，讓保盧斯把部隊撤出史達林格勒。
dialogue_2903=敵人的裝甲集群已經沿頓河向史達林格勒開來。我會盡全力擋住他們。
dialogue_2904=羅馬尼亞軍的防線已經被我們突破。完成這個包圍圈，徹底殲滅史達林格勒的德軍。
dialogue_2905=保盧斯沒能在第一時間突圍，救援行動已經失敗。向西撤退，重新組織防線。
dialogue_2906=我們已沒有任何撤退的餘地。
dialogue_2907=向德軍的陣地發起攻擊！打亂敵人的進攻步驟。
dialogue_2908=不要畏懼蘇軍的炮火，繼續實施“堡壘”計畫。突破南北兩側的蘇軍防線。
dialogue_2909=援軍已經抵達，我們要不惜一切代價阻止德軍在別爾哥羅德方向的突破。
dialogue_2910=拖住南北兩側德軍的進攻。為解決奧廖爾突出部爭取時間！
dialogue_2911=奧廖爾已經失守，蘇軍用不了多久就會發起新的一輪進攻。
dialogue_2912=立即撤退，在布良斯克以東重新組織起一條防線。
dialogue_2913=蘇軍的部隊數量遠超我們的預計，我的裝甲部隊遭受了巨大損失，已經無法繼續進攻。
dialogue_2914=乘勝追擊！重新奪回別爾哥羅德與哈爾科夫。
dialogue_2915=德軍在第聶伯河沿岸設立了多個橋頭堡。隨著時間的推移，敵人的防禦工事只會變得更加強大。
dialogue_2916=迅速解決左岸的德軍。把我們的部隊沿第聶伯河展開，發動一場規模龐大的全線進攻。
dialogue_2917=左岸的陣地相繼失守，我們已經來不及構築新的防禦工事了。
dialogue_2918=向第聶伯河沿岸增援，這條天然的防線決不能被蘇軍輕易突破。
dialogue_2919=基輔已被我們奪回，向西進攻的道路已經開啟。
dialogue_2920=我們已從拉多加湖輸送了大量部隊至列寧格勒周邊地區，隨時可以發起進攻。
dialogue_2921=納爾瓦一帶的防禦系統已經較為完善，我們可以憑藉這條防線擋住蘇軍在北方的進攻。
dialogue_2922=列寧格勒北部的德軍已被消滅，但是出海口仍有德軍的艦隊封鎖，我的部隊需要一些時間抵達前線。
dialogue_2923=海上的威脅已經被清除。我的部隊會全力向德軍最後的防線發起進攻。
dialogue_2924=蘇軍人數眾多，進攻比預想中的要更為猛烈。通知列寧格勒周邊要塞據點內的守軍向納爾瓦的防線撤退。
dialogue_2925=指揮部沒有批准我們的撤退計畫，蘇軍的部隊正源源不斷地向克里米亞地區湧來。
dialogue_2926=不要給德軍喘息的機會，繼續進攻，切斷克里米亞到外界的陸上通道。
dialogue_2927=撤回赫爾松，重新組織防線。在第聶伯河沿岸攔住蘇軍的進攻。
dialogue_2928=我的部隊會繼續向西進攻，將德軍趕回第聶伯河右岸。
dialogue_2929=向塞瓦斯托波爾的要塞進攻，不要放走一個德軍。
dialogue_2930=德軍依然在向克里米亞輸送兵力，必須破壞敵軍海上的運輸路線。
dialogue_2931=敵人猜錯了我們的主攻方向。把握住這個機會，快速包圍並消滅明斯克周圍的德軍。
dialogue_2932=蘇軍的推進過於迅猛，我的部隊將立刻出發，全速向明斯克方向增援。
dialogue_2933=我們達成了行動的主要目標，但德軍的防線也已經崩潰。利用好這個機會繼續快速向西推進。
dialogue_2934=蘇軍在北部也發起了進攻。向里加方向派遣增援，不能讓敵人輕易獲得這個出海口。
dialogue_2935=德軍正在節節敗退，敵人根本無法抵擋住我們潮水般的進攻！
dialogue_2936=我們錯失了最佳的戰略防禦時機。但是作為軍人，我會為自己的國家戰鬥到底。
dialogue_2937=全速前進！與美軍會合，把敵人的守軍切割開來。
dialogue_2938=德軍已經準備與我們決戰到底了。繼續向柏林進攻，我的部隊會掃清北方的障礙。
dialogue_2939=勝利屬於我們！繼續進攻，摧毀所有仍在抵抗的德軍！
dialogue_2940=各處的防線均被突破，盟軍正從各處開往柏林。
dialogue_2941=我的部隊會繼續作戰，直到最後一刻。
dialogue_2942=我的失敗不算什麼，柏林的命運已經註定。
dialogue_2943=盟軍成功解放了戰俘營，我們自由了！繼續進攻，消滅德軍！

