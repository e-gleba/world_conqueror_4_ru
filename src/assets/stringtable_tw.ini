feat_desc_85_Lv2=可在航空母艦1格範圍內起飛。無視任何地形對行動力的影響，無視任何地雷、水雷的影響，攻擊時敵軍無法還擊，HP減少後戰鬥力不下降。對陸地單位傷害+{1}%
feat_desc_89_Lv3=在7格範圍內，挖掘一條從當前位置到目標地塊的地道。目標地塊不能是山地，海洋，並且不能穿過海洋。己方步兵、裝甲車、輕型坦克、中型坦克、野戰炮、榴彈炮、火箭炮可通過地道通行。從地道通行後可獲得額外行動，每條地道上限5次。當挖設新地道時，原地道消失。冷卻2回合
