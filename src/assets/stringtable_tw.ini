event_stage_intro_20901=基地已經自毀，我們是最後一批成功撤離的部隊。最後時刻設置的臨時座標應該會把我們帶到南美叢林中的基地附近。這次我們將會有更多的時間籌畫這一切。
event_stage_intro_20902=西班牙的內戰已經全面打響，在德意蘇三方介入後，不干涉協議已經名存實亡。過去的日不落帝國已然分崩離析，新的日不落帝國也會步此後塵。即便這一戰的結局已經無法改寫，但我們還是要投入戰鬥。因為那裡有我們的戰友。
event_stage_intro_20903=二戰後馬歇爾計畫讓美國在中東收穫了土耳其這個盟友。但此時在蘇聯的煽動下，伊朗民族主義情緒日漸高漲，在伊朗生產石油變得越發困難。這嚴重危害了我們的利益！在新總統艾森豪的批准下，中情局與軍情六處合作策劃了一場政變。這次行動必須成功。
event_stage_intro_20904=奧斯本的計畫成功地讓各方勢力在南美叢林中打得不可開交。日本與蘇聯的民族主義者們也利用這個間隙主動攻擊了駐日美軍的基地。據說蘇軍已經研製出了衛星武器，這正是我們搶奪這項技術的好時機！尤丁采夫安排了一位通信衛星方面的專家，他會在庫頁島的蘇軍基地附近與我們會合。
event_stage_intro_20905=馬歇爾計畫加速了西歐的重建，各國經濟飛速發展。但近期義大利國內腐敗滋生，社會動盪，甚至總理都遇刺身亡。與此同時蘇軍迅速佔領了捷克斯洛伐克全境，並持續向巴爾幹半島增兵。東歐這個火藥桶已被我們點燃，歐洲格局即將被重構。
event_stage_intro_20906=美國的分離主義者們因不滿總統的連任而發起了武裝起義。奇怪的是我們並未干預過這次的選舉，而且在我的印象裡也沒有發生過類似的戰爭。現在總統居然主動聯繫我們來平定這場叛亂。這次的行動充滿了不可預知性，要時刻注意各支美軍部隊的動向。
event_stage_intro_20907=盟軍順勢南下突襲了我們位於墨西哥的軍事設施，敵人掌握了我們在太平洋島嶼群上基地的座標，干擾器裝置已經失去了意義。南極的蘇軍遲早會發現我們的基地。現在形勢緊迫，立即集結所有可調動的部隊，向蘇軍的南極研究所發動進攻。
event_stage_intro_20911=基地已經自毀，我們是最後一批成功撤離的部隊。最後時刻設置的臨時座標應該會把我們帶到南美叢林中的基地附近。這次我們將會有更多的時間籌畫這一切。
