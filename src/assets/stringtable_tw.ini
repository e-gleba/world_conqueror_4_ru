skill_info_162=指揮艦船時士氣不會下降，艦船攻擊造成致命一擊時提高[#00FF00#%d%%]傷害。指揮艦船時，周圍2格有友軍航母或自身為航母則自身使用空軍，導彈，核彈時提高30%%傷害，周圍2格友軍航母獲得效果為使用空軍時提高15%%傷害
skill_info_163=指揮艦船時，攻擊和使用空襲時有[#00FF00#%d%%]概率造成致命一擊（擁有該技能時，艦隊指揮官和空軍指揮官效果無效）
skill_info_164=指揮精英步兵時，1格範圍內友軍（含自身）對陸地單位造成傷害+10%%（精英部隊等級不低於9級時，加成變為15%%），範圍內每多1個友軍精英部隊則額外+[#00FF00#%d%%]，合計上限25%%
skill_info_165=指揮步兵進攻後回復造成傷害[#00FF00#%d%%]的HP，周圍1格存在友軍裝甲或火炮時，自身攻擊和反擊射程+1


