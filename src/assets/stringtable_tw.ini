feat_desc_43_Lv2=行動後可再次行動，冷卻1回合,第二次行動殲滅敵軍後有{1}%的概率能夠再次攻擊（僅限一次）
feat_desc_47_Lv3=恢復1個友方目標{1}點HP，並且每回合額外恢復該目標50點HP，持續2回合。使用技能同時恢復自身HP{2}點。冷卻1回合。
feat_desc_50_Lv2=攻擊敵方多個部隊，對其他目標傷害不降低，致命一擊傷害增加{1}%
feat_desc_51_Lv2=下一次攻擊射程+2，攻擊額外使目標城市或要塞HP降低{1}%（最高1200），守城部隊HP降低{2}%（最高500），冷卻2回合
feat_desc_57_Lv2=運輸一個步兵、裝甲車、野戰炮或榴彈炮到目標地塊，運輸途中恢復HP{1}%
feat_desc_60_Lv2=兩格範圍內埋下感應水雷，冷卻1回合
feat_desc_61_Lv2=下次攻擊可額外對目標一格範圍內隨機一個敵軍造成傷害，冷卻2回合
feat_desc_62_Lv2=使自身周圍1格範圍的敵軍陷入不受士氣上升影響的混亂狀態，持續1回合，冷卻3回合。影響3個或以上目標時，冷卻為1回合。
feat_desc_64=溢出的致命一擊概率將轉化為額外傷害,每溢出{2}%，額外造成{1}%傷害
feat_desc_65=無視敵方部隊{1}%防禦力
feat_desc_66=本回合對裝甲單位傷害增加{1}%，冷卻2回合
feat_desc_67=反擊傷害+{1}%
feat_desc_68=攻擊後如果目標被殲滅，有{0}%的幾率再行動一次，上限{2}次
feat_desc_69=自身周圍1格範圍內友軍攻擊時，有{0}%概率自身參與攻擊
feat_desc_69_Lv2=自身周圍1格範圍內友軍攻擊時，有{0}%概率自身參與攻擊，造成的傷害增加{1}%
feat_desc_70=本回合攻擊時對目標1格範圍內其他目標造成{1}%額外傷害，冷卻2回合
feat_desc_71=額外攻擊{1}次
feat_desc_72=可以使用機場內所有普通飛機，飛機點數上限{1}點
feat_desc_72_Lv3=可以使用機場內除運輸機外的大部分飛機，飛機點數上限{1}點
feat_desc_73=艦載機擊對裝甲單位增傷{1}%

