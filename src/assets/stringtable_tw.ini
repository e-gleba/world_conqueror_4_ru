elite_intro_73=RPG火箭兵是一種裝備有反坦克火箭筒（RPG）的步兵單位，通常用於對付裝甲或城防目標。他們可以對敵方發射火箭彈，造成大量傷害。由於其便攜性和大範圍傷害能力，RPG火箭兵在現代戰爭中發揮著重要作用。
elite_intro_74=百夫長坦克是二戰末期由英國設計製造的主戰坦克，於二戰後投入使用。它採用了先進的設計和技術，配備煙幕發射裝置，具有強大的火力和防護能力。它在冷戰以及多次軍事行動中發揮了重要作用，成為了許多國家陸軍的主力裝備之一。
elite_intro_75=颱風級核潛艇是冷戰時期蘇聯建造的彈道導彈核潛艇，也是目前為止世界上人類建造的最大噸位潛艇。為達到“相互保證毀滅”原則，該潛艇配備多枚核彈頭，其射程可以讓颱風打擊到與它同處一個半球的任意目標。同時該潛艇採用複合式雙殼體，具有強大的潛深能力和抗打擊能力。
elite_intro_76=Mi-24雌鹿直升機是由蘇聯製造的武裝直升機。它具有強大的火力，能夠對地面目標進行有效打擊。同時它還具有較強的機動能力，有幾率躲閃一定程度的敵方火力。由於其出色的性能和可靠性，雌鹿直升機已經在許多國家的軍隊中服役，並且在各種複雜環境下表現出色。

