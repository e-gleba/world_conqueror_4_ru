legend_intro_10101=法國戰場上，第7裝甲師以“幽靈師”之名威震四方，而1940年5月21日的阿拉斯戰役，正是其成名之路中最關鍵的一場淬煉。當日，該師作為先頭部隊奉命繞行阿拉斯向北推進，卻意外遭遇英法聯軍預謀的反擊力量，雙方爆發激戰。在突如其來的側翼威脅下，第7裝甲師一度陷入被動。然而，在隆美爾將軍靈活果敢的指揮下，德軍最終逆轉戰局，扭轉危機。“幽靈師”之名，經此一役，愈加顯赫。
legend_intro_10102=伴隨著戰爭方向的調轉，第7裝甲師也開啟了前往莫斯科的戰鬥。然而第一戰“阿利圖斯之戰”就預示了一個慘烈的未來，第7裝甲師與蘇聯第5裝甲師在阿利圖斯爆發一場坦克大戰。第7裝甲師最終擊退了擁有200多輛坦克的蘇聯第5裝甲師，占住了阿利圖斯，打開了前往維爾紐斯的通路。
legend_intro_10103=1941年10月2日，第7裝甲師從蘇軍正面突破，擊潰了補防的蘇軍坦克部隊，與第4裝甲集群的第10裝甲師完成了維亞濟馬包圍圈。成功擊碎了蘇軍的西線防禦，向著巴巴羅薩計畫的最終戰場——莫斯科更近了一步。
legend_intro_10104=風雪呼嘯，莫斯科的寒冬比以往更勝。漫長的補給線拖垮了德軍，使他們不得不把攻克莫斯科的希望放在了這最後一擊。1941年11月15日，第7裝甲師隸屬的第3裝甲集群開始向莫斯科突破。憑藉靈活機動，他們接連攻克克林和亞赫羅馬，曾一度能遙望克里姆林宮，卻最終在蘇軍的洪流中功敗垂成。
legend_intro_10105=1943年，庫爾斯克戰役。久經戰場的第7裝甲師，此時作為一支偏師掩護第4裝甲集團軍的主力部隊。他們依舊能在側翼戰場突破蘇軍防線，牽制住蘇聯近衛第7集團軍，但這樣的努力無法影響大局。隨著主力部隊於普洛霍羅夫卡失利，他們也不得不撤退。戰場態勢改變使他們再也無法像以前一樣縱橫馳騁。
legend_intro_10106=第二次基輔戰役是第7裝甲師最後一次在東線戰場執行大規模機動作戰。由於蘇軍以絕對的兵力優勢進攻，第7裝甲師撤出基輔，在法斯托夫-日托米爾一線靈活阻擊蘇軍，並和援軍奪回一度失守的日托米爾。雖未能扭轉整個戰線頹勢，但為德軍後撤重組爭取了寶貴時間。
legend_intro_20101=美國第3裝甲師的作戰歷史開始於諾曼第登陸。在登陸後，德軍準備的樹籬障礙一度阻礙著這支鋼鐵雄師。直到1944年7月的“眼鏡蛇行動”，美軍調動上千轟炸機對德軍陣地實施“地毯式轟炸”，第3裝甲師——“矛頭師”隨即挺進，憑藉裝甲機動優勢撕裂潰散的德軍防線，實現戰役級別突破，打破了諾曼第僵局。
legend_intro_20102=“眼鏡蛇行動”成功突破後，第3裝甲師奉命揮師北上，直插法萊斯地區，與自北向南推進的加拿大和波蘭部隊形成合圍之勢。被圍困的德軍為求生路，發起了一輪又一輪的突圍衝鋒，卻難以衝破第3裝甲師的戰線。此役近乎粉碎了德軍兩個集團軍，而第3裝甲師也在烈火考驗中，再次證明了自己是盟軍手中最鋒利的長矛之一。
legend_intro_20103=1944年秋，第3裝甲師作為第1集團軍的先鋒，以雷霆之勢突破了齊格菲防線，兵臨阿亨城下。在經歷近兩周慘烈的巷戰，阿亨終於在10月21日被完全攻克。短暫休整後，第3裝甲師於11月開始攻克許特根森林，複雜的森林地形限制了裝甲機動，大量的戰士犧牲在這片戰場。在殘酷巷戰和茫茫密林的淬煉之後，這支部隊不再只是進攻尖鋒，更是一隻適應了各種情況的堅韌之師。
legend_intro_20104=1944年12月16日，德軍在阿登森林發動突然反攻。美國第3裝甲師作為第1集團軍的精銳預備隊，被緊急調往北部戰線，迅速在多個關鍵節點配合其他部隊展開反擊，成功瓦解了德軍攻勢。
legend_intro_20105=1945年3月，第3裝甲師作為第1集團軍先鋒，從雷馬根橋頭堡向東全速突擊，目標合圍德軍魯爾工業區。4月1日，我師在利普斯塔特與北線美軍會師，成功將莫德爾元帥的32萬德軍困于“魯爾口袋”。經半月清剿，德軍抵抗崩潰，莫德爾自殺，18日大規模投降。此役徹底粉碎了西線德軍主力；第3裝甲師以高速機動奠定勝局，卻痛失師長羅斯少將，鑄就勝利的豐碑，亦昭示榮光與犧牲。
legend_intro_20106=1991年2月，第3裝甲師作為第7軍主力，從沙特北部突入伊拉克防線。憑藉M1A1坦克的科技優勢，該師晝夜奔襲260公里，先後擊潰伊軍第9裝甲旅和共和國衛隊“塔瓦卡爾那”師。在諾福克坦克戰中，以極小代價摧毀大量T-72坦克。百小時內，該師協同友軍殲滅伊軍10多個師，粉碎薩達姆精銳，以近乎零傷亡的戰績驗證了現代裝甲部隊的絕對統治力，重塑陸地戰爭模式。
legend_intro_30101=1942年秋，黑海艦隊水兵組成海軍步兵第255旅，緊急馳援高加索戰線。在圖阿普謝方向的山林地帶，他們以刺刀、手榴彈和莫辛納甘步槍死守陣地，粉碎德軍“阿提卡”攻勢。在缺乏重武器的劣勢下，憑藉夜襲和迂回戰術浴血奮戰，於12月13日榮膺紅旗勳章，用鮮血阻斷了德軍通往黑海的道路。
legend_intro_30102=1943年2月6日，海軍步兵第255旅奉命在諾沃羅西斯克附近的梅斯哈科地區強行登陸，奪取並堅守後來被稱為“小地”的登陸場。面對德軍飛機、重炮的日夜猛攻，我們水兵與陸軍兄弟在彈丸之地上掘壕死守，牽制了德軍大量兵力，為後續解放高加索和塔曼半島奠定了關鍵基礎。
legend_intro_30103=1943年9月10日淩晨，海軍步兵第255旅在艦炮掩護下于新羅西斯克港南側強行登陸。面對德軍密集雷區、鐵絲網和岸防炮火，他們一寸寸啃下灘頭陣地，為後續部隊打開突破口。最終在第18集團軍協同作戰下，於9月16日攻克全市。此役為蘇軍奪取塔曼半島、徹底終結高加索戰事奠定基礎，旅隊也因此榮獲“塔曼旅”榮譽稱號。
legend_intro_30104=1943年11月，“塔曼旅”在風暴夜中強攻刻赤半島埃利季根灘頭。頂著德軍探照燈與炮火封鎖，他們涉血水奪取登陸場，死守36晝夜。在彈盡糧絕下，官兵以手榴彈與刺刀擊退數十次反撲，科斯堅科上士更是堵槍殉國。此役雖代價慘重，但成功牽制德軍主力，為北線蘇軍解放克里木奠定勝基。
legend_intro_30105=1944年5月，“塔曼旅”作為獨立濱海集團軍麾下的黑海艦隊精銳，參與了解放塞瓦斯托波爾的復仇之戰。此次行動徹底粉碎德軍在克里米亞的最後堡壘，一雪1942年要塞陷落之恥。
legend_intro_30106=1944年8月，“塔曼旅”在雅西-基什尼奧夫攻勢中強渡德涅斯特灣，夜襲阿克爾曼（今別爾哥羅德-德涅斯特羅夫斯基）灘頭。他們頂著德軍密集岸防火力，撕開德軍防線，與第46集團軍協同攻堅。經激烈巷戰，8月23日攻克要塞，切斷德軍沿海退路，俘獲甚眾。此役為“塔曼旅”贏得二級庫圖佐夫勳章，彰顯海軍步兵兩栖突擊的致命鋒芒。


