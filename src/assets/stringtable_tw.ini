conquest_event_desc_97=黑蠍組織憑藉其龐大的間諜網絡和精密的政治操控，透過精心佈局，成功推動北約與華約在全球範圍內發起代理戰爭與地區衝突，迫使世界重新劃分陣營，構建全新的對抗格局，將全球引向一場無法調和的對立與軍備競賽的漩渦。
conquest_event_desc_98=亞太黑蠍發動代號為「波塞冬之怒」的行動，透過潛艦突襲、無人機打擊和特種部隊登陸，多方協同作戰，徹底癱瘓美國太平洋艦隊並成功佔領珍珠港，為進一步深入滲透亞太地區創造了有利條件。
conquest_event_desc_99=亞太黑蠍秘密向北越軍隊提供支持，以先進的外星科技武器協助其擊退美軍，大幅改變了戰場格局，令局勢朝著不可預測的方向發展。
conquest_event_desc_100=亞太黑蠍在馬裡亞納海溝附近秘密建造了一座深海實驗室，專用於外星科技武器在極限深海壓力下的性能測試。此舉引起了亞太各國的警覺。
conquest_event_desc_101=亞太黑蠍透過深度滲透澳洲的能源產業，精準破壞煤礦生產和港口運輸網絡，切斷主要出口管道，迫使政府妥協，從而實現對當地能源企業的全面掌控。
conquest_event_desc_102=亞太黑蠍支持當地激進派，操控輿論，製造暴力衝突，導致光州事件爆發。在混亂中，黑蠍成功滲透韓國軍方，總統頒布戒嚴令，利用政府暴力鎮壓民眾，進一步加劇了政治動盪和社會分裂。
conquest_event_desc_103=亞太黑蠍透過恐怖攻擊控制了菲律賓南部島嶼，將其轉變為東南亞的關鍵據點，威脅馬六甲海峽的貿易線。
conquest_event_desc_104=亞太黑蠍掌控了整個太平洋海上貿易，勢力膨脹，成為黑蠍全球最強派系。這項舉動激起了其他黑蠍勢力的不滿，隨即聯合發起反擊，導致黑蠍內部的鬥爭爆發。
conquest_event_desc_105=中東黑蠍秘密操控當地組織，成功引爆多個石油精煉廠，製造了一場嚴重的能源危機。
conquest_event_desc_106=中東黑蠍在蘇伊士運河實施精準爆破，擊沉多艘貨輪，導致運河全面封鎖，切斷了英法控制的海上貿易通道，迫使兩國讓步以換取通航權。
conquest_event_desc_107=中東黑蠍在阿富汗山區建立了秘密高科技基地，測試外星武器對複雜地形的影響。蘇聯軍隊發動突襲後被成功擊退。
conquest_event_desc_108=中東黑蠍計劃將沙烏地阿拉伯部分沙漠地區改造成可居住的“綠洲城市”，以吸引更多勢力依賴黑蠍的資源和技術。
conquest_event_desc_109=中東黑蠍壟斷全球石油資源，宣布成立“石油聯盟”，以切斷能源供應威脅其他勢力。這項舉動激起了其他黑蠍勢力的不滿，隨即聯合發起反擊，導致黑蠍內部的鬥爭爆發。
conquest_event_desc_110=歐洲黑蠍秘密滲透東德，策動當地民眾成立“歐洲自由軍”，為黑蠍的軍事工業打開突破口，逐步將其勢力深入歐洲大陸。
conquest_event_desc_111=歐洲黑蠍策劃在東歐關鍵鐵路節點製造連續爆炸，癱瘓蘇聯對東歐地區的交通和物資控制，藉此混亂掩護其勢力全面滲透，為進一步掌控東歐鋪路。
conquest_event_desc_112=歐洲黑蠍組織透過其廣泛的間諜網絡和資訊操控手段，精確計算了英國軍艦的航線，並在海峽中佈設了雷區。此舉導致兩艘英國海軍驅逐艦在科孚海峽觸雷。
conquest_event_desc_113=歐洲黑蠍組織偽裝成捷克改革派，秘密推動布拉格之春抗議活動，意圖在混亂中削弱蘇聯對東歐的控制和影響力。
conquest_event_desc_114=歐洲黑蠍派遣精銳潛水隊滲透北海油田，掌控關鍵設備，切斷英國與挪威的能源供應，試圖透過製造能源危機削弱兩國的經濟和戰略影響力。
conquest_event_desc_115=歐洲黑蠍秘密接觸義大利多個黑社會組織，透過金錢、武器和情報交易建立聯繫，擴大在歐洲的滲透力。
conquest_event_desc_116=歐洲黑蠍秘密發射了一組高性能衛星，成功控制了全球的衛星通訊系統，包括軍事通訊、導航和天氣系統。這項舉動激起了其他黑蠍勢力的不滿，隨即聯合發起反擊，導致黑蠍內部的鬥爭爆發。
conquest_event_desc_117=美洲黑蠍成功滲透美國水門大樓，透過精確監聽獲取機密情報，導致總統在輿論壓力下辭職。美國的政治混亂加速了黑蠍在美洲地區的軍事擴張與滲透。
conquest_event_desc_118=美洲黑蠍組織選擇位於南太平洋深處的「尼莫點」作為其海上秘密科技研發基地，透過一系列隱密工程，將此偏遠海域轉變為全球最具戰略意義的海上研發中心。
conquest_event_desc_119=美洲黑蠍透過操控古巴流亡分子並向美國提供虛假情報，精心策劃了豬灣事件，挑起了美古衝突並加劇了冷戰緊張局勢，同時從中獲得了全球經濟和資源控制的巨大利益。
conquest_event_desc_120=美洲黑蠍透過秘密管道與古巴政府達成協議，協助其在島上建立一套隱密的導彈發射系統。此舉的目的是透過在古巴部署先進導彈設施，威脅美國及拉美地區的安全。
conquest_event_desc_121=美洲黑蠍透過滲透阿根廷政府並提供軍事支持，促使阿根廷在錯誤判斷下發動了對福克蘭群島的攻擊，同時試探了英國的遠洋打擊軍事實力。
conquest_event_desc_122=美洲黑蠍在亞馬遜雨林秘密建立了研究基地，利用外星科技進行試驗，研發小型核反應裝置。
conquest_event_desc_123=美洲黑蠍透過秘密操控巴西和阿根廷的金融市場，利用大規模資本轉移、假訊息傳播和貨幣操控，製造市場恐慌，導致當地貨幣急劇貶值。
conquest_event_desc_124=美洲黑蠍透過精密的金融操控和經濟威脅，成功迫使全球主要國家向其繳納高額金融稅賦，將世界經濟納入其掌控之中。這項舉動激起了其他黑蠍勢力的不滿，隨即聯合發起反擊，導致黑蠍內部的鬥爭爆發。
conquest_event_desc_125=非洲黑蠍暗中扶持剛果礦區的武裝力量，控制豐富的鈾礦和銅礦資源，為其外星科技研發提供關鍵原料。
conquest_event_desc_126=非洲黑蠍支持東非軍事首領發動政變，以獲得對紅海貿易線的控制權，打破了英國和埃及在紅海地區的穩定局面，重塑了該地區的地緣政治格局。
conquest_event_desc_127=非洲黑蠍透過秘密操控尼羅河流域的水資源，逐步取得該地區水源的控制權。北非國家面臨嚴重的水荒和農業崩潰，社會動盪進一步加劇。
conquest_event_desc_128=非洲黑蠍組織在納米比亞的納米布沙漠深處秘密建立了一個高科技研究基地，專門進行外星能量技術與核融合技術的結合實驗。
conquest_event_desc_129=非洲黑蠍成功研發了將沙粒轉化為高純度矽基材料的技術，以極低成本製造出超高性能的半導體和晶片，進而形成晶片供應的全面壟斷。這項舉動激起了其他黑蠍勢力的不滿，隨即聯合發起反擊，導致黑蠍內部的鬥爭爆發。


