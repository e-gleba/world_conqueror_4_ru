skill_info_127=指揮部隊攻擊後，獲得“誘敵”狀態，持續1回合，使自身周圍1格的友軍（不含自身）造成傷害+[#00FF00#%d%%]
skill_info_128=指揮艦船部隊進攻時，有[#00FF00#%d%%]概率使周圍未行動的1個艦船部隊參與攻擊（一回合只能觸發一次）
