elite_intro_93=88公釐36式高射炮是德國在二戰期間廣泛使用的一款多用途火炮，原本用於高射防空，但因其優異的穿甲性能，也被廣泛用於對付坦克，特別是在北非戰場上對抗英軍裝甲部隊時表現突出。這款火炮精准、威力強，被盟軍士兵稱為“坦克殺手”，成為德軍標誌性武器之一。


