;噩梦关规则
operation_nightmare_rule_1=1.本活動劇本限時開啟，建議各位指揮官合理安排時間，通關並獲取獎勵。
operation_nightmare_rule_2=2..噩夢難度劇本中，敵軍會獲得4個增益狀態（活動開啟時隨機4個，直到活動結束），請各位指揮官挑戰噩夢難度劇本時，謹慎規劃行軍路線。
operation_nightmare_rule_3=3.當前難度的劇本，每關中陣亡的將領，下一關中無法上陣，只有重置進度後，才能上陣
operation_nightmare_rule_4=4.關卡勝利後會記錄當前難度最高通關戰績，通關指定關卡可以領取階段獎勵。
operation_nightmare_rule_5=5.進度重置只能重置劇本當前難度的通關進度。

defensive_nightmare_rule_1=1.本活動劇本限時開啟，建議各位指揮官合理安排時間，通關並獲取獎勵。
defensive_nightmare_rule_2=2.噩夢難度劇本中，敵軍會獲得4個增益狀態（活動開啟時隨機4個，直到活動結束），請各位指揮官挑戰噩夢難度劇本時，謹慎規劃行軍路線。
defensive_nightmare_rule_3=3.守住所有關鍵區域才能勝利。關卡失敗或勝利後都會記錄當前難度最高防守回合數，達到指定防守回合數可以領取階段獎勵（全殲敵軍後可領取全部階段獎勵）。
defensive_nightmare_rule_4=4.關卡可以重複挑戰，但關卡中途退出不會記錄當前難度最高防守回合數。

