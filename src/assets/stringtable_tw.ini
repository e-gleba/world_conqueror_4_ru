dialogue_2543=登陸部隊遭到了美軍的襲擊，MI作戰已經暴露。
dialogue_2544=箭已上弦，繼續按原計畫行動。
dialogue_2545=發現日軍航母！ 立刻展開進攻，消滅聯合艦隊的主力。
dialogue_2546=美軍的艦隊規模和航母數量大於了我們的預期，立即發動預備隊進行增援。
dialogue_2547=確認擊沉敵軍航母，繼續追擊！
dialogue_2548=太平洋艦隊早有防備，我的敗局已經無法挽回。
dialogue_2549=我的艦隊會在瓜島周邊發起進攻。 登陸部隊已經就位，在日軍增援趕到前拿下瓜島。
dialogue_2550=我們遭到了美軍的突襲。 護衛艦和援軍部隊即刻出發，重新奪回瓜島。
dialogue_2551=美軍艦隊已經控制住了我們的補給航線，繼續輸送部隊恐怕會遭受巨大的損失。
dialogue_2552=多個島嶼都遭到了美軍的打擊。 必須集結艦隊，進行有效的反擊。
dialogue_2553=我的艦隊已經抵達。 各艦隊做好協同，發動總攻。 把這些日本人趕出所羅門群島。
dialogue_2554=敵人的援軍正源源不斷的向瓜島趕來。 提前做好防禦準備，把敵人攔截在海上。
dialogue_2555=我將盡我最後的努力向莫爾茲比港發起進攻，配合我牽制住美軍的增援。
dialogue_2556=敵人的攻勢愈加迅猛，我的部隊恐怕堅持不了多久了。
dialogue_2557=日軍艦隊居然在沒有航母掩護的情况下發起了進攻。 立即派艦隊增援。
dialogue_2558=我們重新奪回了科科達，日軍的攻勢即將被瓦解。
dialogue_2559=敵軍已經突破了我們的防線。 立刻向萊城方向增援。
dialogue_2560=援軍已經抵達，反擊現在開始。
dialogue_2561=優先奪取塞班島的機場，為進一步的行動做好準備。
dialogue_2562=我們絕不會投降。
dialogue_2563=我們戰鬥到了最後一刻。
dialogue_2564=馬利安納群島的日軍已無處可逃。 我們的艦隊會切斷各地日軍的聯系。
dialogue_2565=美軍相繼攻下了塞班島和天寧島。 必須把敵軍的登陸部隊擋在關島以外。
dialogue_2566=聯合艦隊已經徹底被摧毀，我們的艦隊將為登陸部隊提供掩護。
dialogue_2567=我又回到了這裡！ 我們的軍隊又重新站在了菲律賓的土地上。
dialogue_2568=美軍已在萊特島南部登陸。 現在發動進攻，截斷敵人海上的增援。
dialogue_2569=敵人的陸軍部隊推進迅速，必須加大海上進攻的力度，破壞美軍後續部隊的登陸。
dialogue_2570=繼續追擊，敵人的海軍不堪一擊。
dialogue_2571=向北撤退，把敵艦隊主力引出萊特灣。
dialogue_2572=利用海岸重新組織防禦，不要讓盟軍完成登陸。
dialogue_2573=英軍的太平洋艦隊已經抵達，我們在空軍數量上佔據了絕對的優勢。
dialogue_2574=我們的目標只有一個，就是殲滅島上的所有守軍。
dialogue_2575=敵人的海軍再次主動出擊了。 在這種情況下發起進攻必定是有來無回。
dialogue_2576=大和號已被我們擊沉！
dialogue_2577=戰局已無可挽回。 繼續進攻，戰到最後的一兵一卒。
dialogue_2578=衝鋒！ 集中力量繼續向敵人發起進攻。
dialogue_2579=整個日本島都在空軍的打擊範圍以內。
dialogue_2580=敵人的防衛力量不可小覷。 我們的第一目標依然是佔領日本，逼迫日軍投降。
dialogue_2581=日軍仍在負隅頑抗，摧毀他們的海防工事。
dialogue_2582=我們會為登陸部隊提供炮火和空軍的支援。
dialogue_2583=蘇聯人似乎準備直接發起登陸作戰，進攻日本本土。
dialogue_2584=蘇軍在北部發起了進攻。 注意攔截他們後續的登陸部隊。
dialogue_2585=敵人正在向東京方向開來，我的部隊會立刻出發提供增援。
dialogue_2586=我們將從東岸和南岸發起登陸，分散敵人的防守重心。
dialogue_2587=消滅周邊島嶼的守軍。 利用好島上的機場，為登陸行動做好支援掩護。
dialogue_2588=進攻比預計的更為順利，我們可以搶在英軍前攻佔墨西拿。
dialogue_2589=盟軍已經開始登陸，立刻派遣預備部隊支援前線。
dialogue_2590=墨西拿已經危在旦夕，命令島上的守軍立刻回救，我的空軍部隊會提供掩護。
dialogue_2591=島上的守軍已經被我們分割。 截斷他們的退路，盡可能殲滅更多敵軍的有生力量。
dialogue_2592=我們的兵力處於絕對優勢。 從南往北，海陸並進，徹底將德軍趕出義大利。
dialogue_2593=塔蘭托的防守十分薄弱，登陸後我會以全速向北推進。
dialogue_2594=義大利政府已經與我們秘密商討了投降相關的事宜。 利用好這次投降的契機，一舉消滅義大利的德軍。
dialogue_2595=我們截獲了盟軍的電報，內容顯示義大利正在在向盟軍尋求停戰！ 現在必須密切關注意軍動向。
dialogue_2596=我們已與盟軍達成了協定，各部隊撤入盟軍的戰線。
dialogue_2597=義大利果然投降了。 迅速控制住主要城市，絕不能讓損失繼續擴大。
dialogue_2598=配合空降部隊夾擊敵軍在海岸的防線。
dialogue_2599=登陸後協助各友軍完成灘頭陣地的建設，殲滅岸邊的德軍。
dialogue_2600=大批盟軍已經在諾曼第登陸，必須組織一次反攻，延緩敵人的推進。
dialogue_2601=我的火炮部隊會限制住盟軍的進攻！
dialogue_2602=登陸部隊已經站穩了脚跟，現在向卡昂發動進攻。
dialogue_2603=進攻十分順利，用不了多久我們就能解放巴黎！
dialogue_2604=瑟堡已經失守，整個半島都落入了盟軍之手。
dialogue_2605=羅馬已經陷落，决不能讓盟軍輕易在馬賽登陸。
dialogue_2606=迅速清出一片陣地，為後續部隊的登陸做好準備。
dialogue_2607=保持這樣的進攻勢頭，我們的人民即將迎來解放！
dialogue_2608=盟軍的攻勢异常迅猛。 調集裝甲部隊，重新奪回馬賽。
dialogue_2609=繼續堅守已經沒有意義。 立刻後撤，重新集結。
dialogue_2610=空降部隊已經降落至指定位置，迅速與他們會合。 他們會控制住關鍵位置的橋樑直至主力部隊抵達。
dialogue_2611=援軍正在陸續趕來。 必須消滅這些空降部隊，牢牢控制住萊茵河上的防守節點。
dialogue_2612=地面推進受阻！ 我們遭到了德軍裝甲部隊的反擊！
dialogue_2613=繼續阻擊盟軍，把敵人的主力攔截在萊茵河外。
dialogue_2614=空降部隊成功奪下了萊茵河上的橋樑。 加速前進，他們沒法在德軍後方堅守太久。
dialogue_2615=安特衛普港周邊海域已經在我們的控制之下。 我們的補給即將得到改善。
dialogue_2616=盟軍對我們的進攻毫無防備。 利用這個機會切斷英美主力間的聯系。
dialogue_2617=維持住防線！ 不能讓德軍分割我們的部隊。
dialogue_2618=盟軍的增援正在陸續抵達戰場，必須加快進攻速度了！
dialogue_2619=形勢已經反轉，現在輪到我們進攻了！
dialogue_2620=撤回齊格飛防線，在盟軍發動下波攻勢前重新組織好防禦。
dialogue_2621=繼續追擊，不要放走一個敵人。
dialogue_2622=敵人的補給已被我們切斷，勝利近在眼前！
dialogue_2623=全速前進！ 與蘇軍會合，把敵人的守軍切割開來。
dialogue_2624=德軍並沒有準備投降。 繼續向柏林進攻，我的部隊會掃清北方的障礙。
dialogue_2625=各處的防線均被突破，盟軍正從各處開往柏林。
dialogue_2626=勝利屬於我們！ 繼續進攻，摧毀所有仍在抵抗的德軍！
dialogue_2627=我的部隊會繼續作戰，直到最後一刻。


general_stage_name_171=加裏寧反攻戰
general_stage_name_172=第四次哈爾科夫戰役
general_stage_name_173=第聶伯河會戰
general_stage_name_174=維斯瓦河-奧得河攻勢
general_stage_name_175=柏林戰役
general_stage_intro_171=加裏寧反攻戰是蘇聯紅軍在面臨德軍圍攻莫斯科的情况下進行的一次大規模反攻，它不僅挽救了莫斯科，也為蘇聯贏得了重要的戰畧優勢，為後續的史達林格勒戰役和庫爾斯克戰役奠定了基礎。
general_stage_intro_172=從1943年8月開始，蘇聯發起了第四次哈爾科夫戰役，該行動由一場針對德軍防線的大規模炮擊開始。 德軍頑強反擊，也並不能封锁蘇軍，最終蘇聯成功收復了哈爾科夫。
general_stage_intro_173=它是第二次世界大戰中最大的軍事行動之一，在4個月之內，蘇聯紅軍從德軍手中解放了第聶伯河東岸，進行了多次渡河攻擊並在西岸建立起數個橋頭堡，為之後的基輔戰役奠定了勝利基礎。
general_stage_intro_174=這是蘇聯紅軍在二戰末期發起的一場重大軍事行動。 從1月12日開始，紅軍突破了德軍在波蘭的防線，迅速推進到德國的邊境。 此次攻勢大大加速了戰爭的結束，為蘇聯軍隊佔領柏林鋪平了道路。
general_stage_intro_175=在維斯瓦河-奧得河攻勢結束後，蘇聯紅軍於柏林以東60千米處暫緩推進脚步，3月，德國製定了保衛柏林的計畫後於，但仍然封锁不了蘇聯於4月重啓攻勢，對柏林發起了總攻。

dialogue_2628=士兵們，一鼓作氣向西進軍，我們的目標是拿下史達林格勒。
dialogue_2629=蘇聯的土地是不可侵犯的，我們會把德軍趕出祖國大陸！
dialogue_2630=敵方守衛兵力薄弱，現在是一舉發動反攻的好機會！
dialogue_2631=指揮官閣下，我會率領火炮部隊對德軍陣地發起炮擊，這次一定要從德軍手中奪回哈爾科夫。
dialogue_2632=當心敵人的口袋陣型，如果被德軍的增援包圍，我們將付出不可估量的代價。
dialogue_2633=敵軍的海上增援部隊並不足以構成威脅，迅速將他們消滅，杜絕後患。
dialogue_2634=蘇聯軍隊已經推進到第聶伯河東岸，最高統帥部下達指令，無論如何也要守住西岸，不能讓他們渡河。
dialogue_2635=敵人的守備兵力强大，切記不可盲目進攻。 在西岸駐紮，靜候反攻的機會。
dialogue_2636=德軍盲目的進攻讓他們損失慘重，現在敵人兵力薄弱，迅速渡河，在西岸建立橋頭堡！
dialogue_2637=蘇聯軍隊的攻勢過於兇猛，暫行撤退！
dialogue_2638=不惜一切代價攔住敵人，不要讓他們進入德國！
dialogue_2639=士兵們，這是一場偉大的勝利，我們已將戰線推進至德國境內，想必接下來佔領首都柏林也只是時間問題！
dialogue_2640=我們將與南邊進攻的友軍夾擊，形成鉗形攻勢，向柏林進軍！
dialogue_2641=敵人已經兵臨城下，德意志帝國正面臨前所未有的危機，無論如何也要保護元首的安全！
dialogue_2642=柏林已經陷落，我們即將取得衛國戰爭的勝利，這是偉大的一天。

event_104=阿拉曼戰役
event_intro_104=二戰開始後不久，戰場就蔓延到了北非。 這裡的戰畧地位關係到歐亞之間的重要海上交通線蘇伊士運河，還有中東豐富的石油資源。 1940年，義大利在北非對英軍發動了攻擊，但由於其戰畧的失敗，沒能取得預期的進展。 次年，隨著德軍非洲軍團的介入，北非的戰局會發生怎樣的改觀？

dialogue_2643=感謝上帝，德國友軍已經在戰場完成了全面部署，接下來勝利的天平會向我們傾斜！
dialogue_2644=軸心國的目標是突破防線並奪取亞歷山大港，一旦得逞，整個北非都將被敵人控制，我們必須封锁他們的陰謀。
dialogue_2645=敵人的攻勢過於猛烈，戰場已經陷入了僵局。 指揮官，我們可以依靠地中海的補給艦隊，與他們展開長期的消耗戰。
dialogue_2646=摧毀敵人的海上補給線，不要給他們喘息的機會！
dialogue_2647=軸心國軍隊的補給線過長，他們已經出現了物資匱乏的情况，抓住機會反攻！
dialogue_2648=德軍在中部戰場的防守過於嚴密，指揮官，請帶領我們由南部戰場突破義大利軍隊孱弱的防守，隨後再向北推進。


