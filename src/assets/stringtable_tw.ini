feat_desc_76=攻擊範圍變為2，能夠攻擊敵方多個部隊，攻擊時有{1}%概率使敵軍無法還擊，持續1回合，冷卻2回合
feat_desc_76_Lv3=攻擊範圍變為2，能夠攻擊敵方多個部隊，對其他目標傷害不降低,攻擊時有{1}%概率使敵軍無法還擊，持續1回合，冷卻2回合
feat_desc_77=受到裝甲單位傷害降低{1}%
feat_desc_78=無視閃避和煙幕彈效果，對城防造成傷害提高{1}%
feat_desc_79=發射煙幕彈，使自身籠罩在煙幕中，無法被地面部隊主動攻擊，持續1回合，冷卻3回合
feat_desc_79_Lv2=發射煙幕彈，使自身籠罩在煙幕中，無法被地面部隊主動攻擊，持續1回合，冷卻2回合
feat_desc_79_Lv3=發射煙幕彈，使自身籠罩在煙幕中，無法被地面部隊主動攻擊，有{1}%概率能夠額外攻擊1次，持續1回合，冷卻2回合
feat_desc_80=當處在煙幕彈效果時，無視敵方{1}%防禦力
feat_desc_81=發射導彈時可裝載原子彈彈頭，初始擁有2顆，每{1}回合恢復1顆。上限4顆
feat_desc_81_Lv2=發射導彈時可裝載氫彈彈頭，初始擁有2顆，每{1}回合恢復1顆。上限4顆
feat_desc_81_Lv3=發射導彈時可裝載三相彈彈頭，初始擁有2顆，每{1}回合恢復1顆。上限4顆
feat_desc_82=可發射近程導彈，每回合可發射2次。代替普通攻擊
feat_desc_82_Lv2=可發射中程導彈，每回合可發射2次。代替普通攻擊
feat_desc_82_Lv3=可發射遠端導彈，每回合可發射2次。代替普通攻擊
feat_desc_83=無法成為陸地單位的攻擊目標，受到空軍和導彈攻擊時降低{1}%傷害
feat_desc_84=選擇一條直線，前進最多{1}格（目標位置需為空地，會被空中懸停單位阻擋），沿途造成掃射傷害，冷卻2回合
feat_desc_85=可在航空母艦1格範圍內起飛。無視任何地形對行動力的影響，無視任何地雷、水雷的影響，攻擊時敵軍無法還擊，HP減少後戰鬥力不會下降
feat_desc_87=受到陸軍、海軍攻擊時，有{1}%概率閃避該傷害

event_105=珍珠港事件
event_intro_105=二戰初期，日本對亞太地區的野心不斷增長，試圖通過軍事行動來實現其戰略目標。然而，隨著日本的侵略和擴張，美國逐漸對日本的石油、鋼鐵等各種資源貿易進行了限制。這些限制措施嚴重影響了日本的軍事實力。在這種背景下，日本採取了越來越激進的立場，試圖通過一次隱秘而徹底的突然襲擊，一舉殲滅美國在太平洋的軍事實力。

