event_stage_intro_20201=盟軍的包圍網完全封鎖了我們的經濟與戰略資源。長此以往，帝國必然會在消耗戰中敗於美國。既然戰爭已經註定，那就必須先發制人。用一場空襲摧毀美軍在珍珠港的太平洋艦隊主力。
event_stage_intro_20202=“Z作戰”的成功為南方作戰掃清了障礙。不過英軍又派遣了一支艦隊增援新加坡的守軍。雖然敵人數量眾多，但在部隊機動性上卻遠不如我們。以鉗形攻勢閃擊馬來亞的英軍，最快速度佔領新加坡。
event_stage_intro_20203=菲律賓的美軍缺乏訓練，武器裝備也並不充足。我們將在多地發起登陸作戰，讓敵人南北不能兼顧。航空艦隊會為登陸作戰提供援助。
event_stage_intro_20204=東印度群島有著極為豐富的資源，而盟軍的聯合艦隊卻在這裡增兵集結。他們從屬於不同國家，調度效率低且缺乏統一指揮。優先確保登陸作戰的成功，之後再解決爪哇海上的艦隊。
event_stage_intro_20205=盟軍的艦隊在南太平洋節節敗退。他們正以莫爾茲比港為反擊的支點不斷集結兵力。利用敵軍防備不足的機會，發動MO作戰。不要給盟軍任何反擊的機會。
event_stage_intro_20206=美國人在珊瑚海擋住了我們的進攻，並加強了海上防備。現在的目標仍是拿下莫爾茲比港。佔領防禦薄弱的新不列顛，再向萊城方向前進，從而由陸路發起最終的進攻。
event_stage_intro_20207=太平洋防衛圈終於建立完成，美軍現在只能退守本土。不過據情報顯示，敵人在核武器研發上取得了重大突破。一旦投入實戰，極有可能會扭轉戰局。留給我們的時間不多了。
event_stage_intro_20211=盟軍的包圍網完全封鎖了我們的經濟與戰略資源。長此以往，帝國必然會在消耗戰中敗於美國。既然戰爭已經註定，那就必須先發制人。從空中發起一場突襲，摧毀美軍在珍珠港的太平洋艦隊主力。
event_stage_intro_20212=“Z作戰”的成功為南方作戰掃清了障礙。不過英軍又派遣了一支艦隊增援新加坡的守軍。雖然敵人數量眾多，但在機動性上卻遠不如我們。以鉗形攻勢閃擊馬來亞的英軍，以最快速度佔領新加坡。
event_stage_intro_20213=菲律賓的美軍缺乏訓練，武器裝備也並不充足。我們將在多地發起登陸作戰，讓敵人不能兼顧。航空艦隊會為登陸作戰提供援助。
event_stage_intro_20214=東印度群島有著極為豐富的各種資源，而盟軍的聯合艦隊無疑是這裡最大的威脅。敵軍艦船從屬於不同國家，調度效率低且缺乏統一指揮。優先確保登陸作戰的成功，之後再解決爪哇海上的艦隊。
event_stage_intro_20215=盟軍的艦隊在南太平洋節節敗退。他們正以莫爾茲比港為反擊的支點不斷集結兵力。利用敵軍防備不足的機會，發動MO作戰。不要給盟軍任何反擊的機會。
event_stage_intro_20216=美國人在珊瑚海擋住了我們的進攻，並加強了海上防備。現在的目標仍是拿下莫爾茲比港。佔領防禦薄弱的新不列顛，從那裡出發向萊城方向前進，從而由陸路發起最終的進攻。
event_stage_intro_20217=太平洋防衛圈終於建立完成，美軍現在只能退守本土。不過據情報顯示，敵人在核武器研發上取得了重大突破。一旦投入實戰，極有可能會扭轉戰局。留給我們的時間不多了。

dialogue_2462=第一波攻擊已經獲得了成功！但我們並未在港口發現美軍的航母。
dialogue_2463=發現美軍航母！我的艦隊會發起第三波進攻，盡全力消滅他們！
dialogue_2464=摧毀敵人的戰列艦，徹底癱瘓敵人的海軍。確保南方作戰的順利進行。
dialogue_2465=航母集群正在返港！快速組織起防禦，隨時準備發動反擊。
dialogue_2466=反擊從現在開始！必須讓日軍的第三波進攻付出代價。
dialogue_2467=前兩波攻擊重創了港內的美軍，但我們也遭受了一定的損失。
dialogue_2468=日軍已經在馬來亞北部完成了集結。必須盡全力拖慢敵人南下的速度。為援軍的抵達爭取時間。
dialogue_2469=航空隊的攻擊效果顯著，威爾斯親王號已無路可逃！全速前進！
dialogue_2470=威爾斯親王號已被擊沉！消滅剩餘的英國海軍，控制住馬來亞周邊的海域。
dialogue_2471=我沒有時間俘虜這些英國人。現在必須加速進攻，不要讓敵人組織起有效的防禦。
dialogue_2472=我們嚴重低估了日軍的推進速度。新加坡北部的防線將是我們最後的屏障。
dialogue_2473=新加坡就在眼前。封鎖周邊海域切斷敵人的退路，我們陸軍部隊會給敵人最後一擊。
dialogue_2474=新加坡已經失守，我們失敗了。
dialogue_2475=偵查機在周邊海域發現了大規模的敵軍艦隊。我會拖住英軍的進攻，請迅速截斷敵艦隊的退路。
dialogue_2476=陸軍部隊會在呂宋西岸和馬尼拉東南海域發起登陸。我的航空艦隊將掃清海面的障礙。
dialogue_2477=日軍在多地展開了登陸行動。我會守住馬尼拉北部，立即召集預備隊支持呂宋北部的友軍。
dialogue_2478=日軍攻勢迅猛。現在必須向馬尼拉方向撤退，重新組織防線。
dialogue_2479=馬尼拉北部的防線即將被突破。我剛剛收到了總統的命令。現在向巴丹撤退吧。
dialogue_2480=我離開了巴丹，我會回來的。
dialogue_2481=麥克亞瑟撤走了。剩餘的美軍也只是一盤散沙。
dialogue_2482=拉蒙灣的部隊完成了登陸，他們會從馬尼拉南部配合我們發起進攻。
dialogue_2483=我會以最快的速度完成登陸，攻下巴厘巴板。請配合我的部隊掃清婆羅洲的盟軍。
dialogue_2484=迅速集結艦隊，在日軍入侵爪哇海前攔住他們。
dialogue_2485=美英荷澳的聯合艦隊已經在爪哇海集結，這是一個把盟軍海上力量一舉殲滅的好機會。
dialogue_2486=荷蘭人在婆羅洲的防線已經被我們徹底摧毀。配合海軍消滅爪哇海的敵艦，向泗水和雅加達進攻。
dialogue_2487=婆羅洲的守軍正在節節敗退。爪哇海就是我們保衛蘇門答臘島和爪哇島的最後一道防線。
dialogue_2488=聯合艦隊的主力已被我們擊沉，其他艦船也只是烏合之眾。迅速將他們消滅，為跨海登陸掃清障礙。
dialogue_2489=盟軍的失敗已成定局，隨時準備進行東印度群島資源的開採。
dialogue_2490=日軍最終的目標是莫爾茲比港。一定要在珊瑚海攔截住敵人，阻止日軍艦隊的進一步入侵。
dialogue_2491=美軍已經發現了我們的行動。立刻集結聯合艦隊，在珊瑚海與敵人進行一場決戰。
dialogue_2492=所羅門群島已經在我們的控制之下。以瓜達爾卡納爾島的機場作為支點提供空軍支援。
dialogue_2493=特混艦隊已經抵達。整合我們現有的力量，重新組織反擊。
dialogue_2494=美軍早已有所防備，小心敵人援軍發起的突襲。
dialogue_2495=全速前進！繼續擴大戰果！
dialogue_2496=日軍艦隊的速度太快了！撤退是現在的唯一選擇。
dialogue_2497=我們還是沒能阻止敵人的進攻，現在該撤退了。
dialogue_2498=拉包爾淪陷了。日軍在新不列顛的行動即將威脅到新幾內亞，甚至是澳洲本土。
dialogue_2499=島上的守軍已經開始潰敗，我會封鎖住萊城東部的海域，切斷盟軍的撤退路線。
dialogue_2500=敵海軍正在包圍整個新不列顛！我需要更多的增援以保證新不列顛守軍的有序撤退。
dialogue_2501=我們已經成功地在新幾內亞建立起了立足點。現在的首要目標就是控制住科科達小徑。
dialogue_2502=科科達小徑周邊地勢複雜，行軍困難。注意步步為營，不要過於冒進。
dialogue_2503=我們正在失去對新不列顛南部海域的控制。加固東部海岸的防禦，不能讓日軍有機可乘。
dialogue_2504=日軍已經攻佔了科科達，正向莫爾茲比港前進。
dialogue_2505=堅守陣地，拖住敵人的進攻。我的援軍馬上就到！
dialogue_2506=敵人的核武器就快要研製完成了。憑美國強大的工業能力，一旦投入量產，極有可能會改變當前的世界格局。
dialogue_2507=各艦隊協助陸軍完成登陸，優先解決海防線上的敵軍防禦陣地。
dialogue_2508=日軍的登陸部隊出現在了在溫哥華西岸。我們需要更多的增援。
dialogue_2509=洛杉磯也遭到了襲擊，立刻出發前往增援。
dialogue_2510=我們成功阻止了日軍在加州登陸的企圖。但要注意敵人的後續增援。
dialogue_2511=一味地防守只會在消耗中滅亡。我的裝甲集團會發動一次突襲，為核武器的研發爭取時間。
dialogue_2512=試爆成功了，但我們無法在短期內大量生產。
dialogue_2513=擋住西海岸的陸軍，保護好我們的研究成果。

dialogue_2514=軸心國即將無路可退，向突尼斯進軍，把他們趕出非洲大陸！
dialogue_2515=第二軍團的作戰失敗了，切記不可盲目進攻，掉入敵人的陷阱。
dialogue_2516=德軍正面的防禦過於堅固，利用海上兵力，尋找突破口，英國士兵也會協助我們。
dialogue_2517=尋找敵人海岸線的突破口，一鼓作氣登陸這座島嶼。
dialogue_2518=德軍妄想向義大利本土撤退，不要讓他們得逞！
dialogue_2519=士兵們，這場規模空前的登陸作戰即將開始，迎接你們的是無盡的榮耀。
dialogue_2520=為什麼盟軍會在這裡出現？可惡，一定是情報有誤。準備迎擊敵軍！
dialogue_2521=敵人沿岸的兵力薄弱，就是現在，迅速登陸，建立橋頭堡，打開歐洲大陸的戰線。
dialogue_2522=不要讓盟軍登陸，集結所有兵力，把他們攔截在大海上！
dialogue_2523=敵人的海岸防線相當堅固，利用空軍的靈活性，和地面部隊一齊進攻，佔領他們的要塞。
dialogue_2524=佔領里昂，我們即將獲得這場戰鬥的勝利。
dialogue_2525=魯爾是德國人西線重要的工業區，拿下它，我們將在這場戰爭中取得難以估量的優勢。
dialogue_2526=從南北兩翼迂回到敵人後方，切斷敵人的退路。一旦我們的包圍圈形成，不費吹灰之力便可以拿下魯爾，俘獲所有的德軍。
dialogue_2527=我們會與南部的美軍合作發動鉗形攻勢。
dialogue_2528=就是現在！收緊包圍網，敵人已是甕中之鼈。
dialogue_2529=指揮官，請帶領我們繼續前進，消滅盤踞在半島西側的蘇聯勢力。
dialogue_2530=除了塞瓦斯托波爾要塞，整個克里米亞半島都在我們手中。不要鬆懈，攻下最後一片土地。
dialogue_2531=敵人的海上補給被切斷了，我們會在這場消耗戰中獲得優勢。
dialogue_2532=用古斯塔夫的炮火炸出一條路！
dialogue_2533=最高指揮部下決心要拿下列寧格勒，這將會是一場硬仗。芬蘭的軍隊將從北邊協助我們發起進攻。
dialogue_2534=我們必須承擔抽動兵力的風險，集中兵力優先切斷敵人的湖上補給線，這會直接影響戰局的勝負。
dialogue_2535=我們需要向東發起進攻，吸引敵人的兵力，為第6集團軍爭取時間突圍。
dialogue_2536=發起總攻，一舉拿下史達林格勒，勝利的曙光就在眼前！
dialogue_2537=不惜一切代價，一定要從蘇聯的手中奪回哈爾科夫。
dialogue_2538=敵人的先頭部隊推進過於深入，這是包圍他們的好機會。
dialogue_2539=利用了裝甲部隊機動性，對蘇聯軍隊的側翼發動攻擊，切斷敵人的補給線。
dialogue_2540=指揮官，請帶領我們從南邊逐步突破蘇軍防線，按照計畫，北方的友軍會和我們一起夾擊庫爾斯克。
dialogue_2541=敵人的反抗越來越激烈了，不要鬆懈士兵們。
dialogue_2542=北方的集團軍需要我們的幫助，如果失去他們，我們將無法對庫爾斯克造成任何威脅。

