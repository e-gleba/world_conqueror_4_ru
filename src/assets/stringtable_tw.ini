event_stage_intro_20701=總理一再催促我們向英軍發動攻擊。但是部隊的機械化程度過低，缺乏大量的裝備與物資補給，這場攻勢必然無法持續。現在也只能憑藉我們的人數優勢來彌補其他方面的不足。向埃及前進吧。
event_stage_intro_20702=英軍的反攻速度十分驚人，但是敵人錯估了我們的部隊規模。現在他們已經是強弩之末，我們有足夠的力量可以將昔蘭尼加的守軍逐一擊破。以殲滅英軍的有生力量為主要目標，全速前進，不要放過任何敵人！
event_stage_intro_20703=希臘的盟軍已經被我們全部擊敗，克里特島已是敵人在地中海上的最後一個重要據點。一旦奪取了島嶼，我們便能以此為跳板進而佔領塞浦路斯，甚至是從海上向埃及發動攻擊。
event_stage_intro_20704=英軍發動了新的攻勢以打通前往圖卜魯格的道路。我們早已重新加強了原有的防禦設施，並構築了新的陣地以應對英軍的推進。之後補給和援軍將會陸續抵達，我們將重新掌握北非戰場的主導權。
event_stage_intro_20705=圖卜魯格及其周邊區域的包圍圈即將完成，但是目前我們仍缺乏大量的物資與裝備來發動大規模的攻擊。不過英軍的主動出擊正好幫我們解決了這個問題。速戰速決，消滅敵人的有生力量，避免補給線過長而引發的一連串問題。
event_stage_intro_20706=我們的補給線長度已經到達極限了。敵人的海空軍仍然在地中海海域對我們造成了相當大的威脅。以英軍為首的盟軍部隊也正在透過紅海和蘇伊士運河源源不絕地獲得兵員物資的補充。情況嚴峻，但這就是我們在北非戰場的最後一戰，也是決定我們命運的一戰。
event_stage_intro_20707=盟軍已經在摩洛哥和阿爾及利亞捲土重來。美軍加快了陸路的推進速度，英國海軍也集結了地中海全部的戰力在向突尼斯灣集結，當地維希法國的守軍可能已與盟軍取得了聯繫。危機已經逼近，我們會用剩餘的力量在突尼斯堅守到底，等待隆美爾的主力抵達。
event_stage_intro_20711=總理一再催促我們向英軍發動攻擊。但是部隊的機械化程度過低，缺乏大量的裝備與物資補給，這場攻勢必然無法持續。現在也只能憑藉我們的人數優勢來彌補其他方面的不足。向埃及前進吧。
event_stage_intro_20712=英軍的反攻速度十分驚人，但是敵人錯估了我們的部隊規模。現在他們已經是強弩之末，我們有足夠的力量可以將昔蘭尼加的守軍逐一擊破。以殲滅英軍的有生力量為主要目標，全速前進，不要放過任何敵人！
event_stage_intro_20713=希臘的盟軍已經被我們全部擊敗，克里特島已是敵人在地中海上的最後一個重要據點。一旦奪取了島嶼，我們便能以此為跳板進而佔領塞浦路斯，甚至是從海上向埃及發動攻擊。
event_stage_intro_20714=英軍發動了新的攻勢以打通前往圖卜魯格的道路。我們早已重新加強了原有的防禦設施，並構築了新的陣地以應對英軍的推進。之後補給和援軍將會陸續抵達，我們將重新掌握北非戰場的主導權。
event_stage_intro_20715=圖卜魯格及其周邊區域的包圍圈即將完成，但是目前我們仍缺乏大量的物資與裝備來發動大規模的攻擊。不過英軍的主動出擊正好幫我們解決了這個問題。速戰速決，消滅敵人的有生力量，避免補給線過長而引發的一連串問題。
event_stage_intro_20716=我們的補給線長度已經到達極限了。敵人的海空軍仍然在地中海海域對我們造成了相當大的威脅。以英軍為首的盟軍部隊也正在透過紅海和蘇伊士運河源源不絕地獲得兵員物資的補充。情況嚴峻，但這就是我們在北非戰場的最後一戰，也是決定我們命運的一戰。
event_stage_intro_20717=盟軍已經在摩洛哥和阿爾及利亞捲土重來。美軍加快了陸路的推進速度，英國海軍也集結了地中海全部的戰力在向突尼斯灣集結，當地維希法國的守軍可能已與盟軍取得了聯繫。危機已經逼近，我們會用剩餘的力量在突尼斯堅守到底，等待隆美爾的主力抵達。

dialogue_2944=英國的援軍正在集結。向馬特魯港快速推進！不要做過多的停留。
dialogue_2945=意軍的規模十分龐大。通知前方部隊，且戰且退。在援軍到來後集中力量發動反擊。
dialogue_2946=前方攻擊受阻，我們的補給也無法維持這樣大規模的攻勢。各部隊優先維持住戰線，不要讓英軍突破。
dialogue_2947=我需要更多的支援來阻擋意軍的進攻。
dialogue_2948=援軍正分批陸續抵達。我的艦隊會解決海上的威脅。
dialogue_2949=主力部隊已經順利抵達了利比亞。我們會以最快的速度向東推進，清除昔蘭尼加地區的英軍。
dialogue_2950=我們的增援至今仍未抵達。現在只能盡力拖住敵軍，必要時可以放棄陣地，向東撤退。
dialogue_2951=德軍的攻擊矛頭即將抵達班加西。現在向圖卜魯格撤退，我們的守軍會在那裡建構一道堅固的防線。
dialogue_2952=進攻開展的較為順利，我的部隊會繼續向巴迪亞方向進攻。英軍的主力就交給你們了。
dialogue_2953=傘兵部隊已經抵達了預定位置週邊，迅速攻占敵人的據點城市，並在英國援軍抵達前消滅克里特島上的守軍。
dialogue_2954=英軍正在向克里特島南部的海域集結。我的艦隊會立即向敵軍南岸的集結點發動進攻，阻止他們的撤退。
dialogue_2955=德軍的傘兵已經登島。堅守住島上各地的據點和設施，海軍援軍即將抵達。
dialogue_2956=守軍們戰鬥到了最後一刻，但已經沒有更多的兵力來抵擋克里特島的德軍了。
dialogue_2957=我的艦隊無法在海上擋住德軍的進攻。恐怕現在只剩撤退這一選項了。
dialogue_2958=英軍的反攻來勢兇猛，但敵人並未集結重兵一點進攻。
dialogue_2959=英軍正試圖包圍我們的裝甲部隊。先撤回防線重新補給，為反攻做好準備。
dialogue_2960=英軍仍然有相當數量的裝甲部隊，想要突破塞盧姆南部的防線恐怕沒那麼容易。
dialogue_2961=向塞盧姆方向集結，重新建立一道防線，並攔住東進的德軍。
dialogue_2962=我們的攻勢已經徹底失敗了。現在必須集中剩餘的力量擊潰德軍先頭部隊，重奪塞盧姆。
dialogue_2963=英軍已經利用地形，在各關礙佈置了重兵把守。想從正面突破恐怕會付出較大代價。
dialogue_2964=我的裝甲部隊會從圖卜魯格南部發動進攻，分割盟軍的防守力量。
dialogue_2965=敵軍有著規模龐大的裝甲部隊。正面抵擋我們將毫無勝算。向後方的陣地撤退，依托要塞和雷區進行防禦。
dialogue_2966=德軍已經攻入了我們的腹地，必須立即支援圖卜魯格，加強我們的防線。
dialogue_2967=德軍的規模被嚴重錯估了。但是即便現有的兵力不足以防守整個地區，我們也不能直接放棄圖卜魯格。
dialogue_2968=敵人已經是強弩之末了。繼續向阿拉曼地區派遣援軍，我們將在這裡與德軍決戰。
dialogue_2969=我的部隊會從阿拉曼南部向埃及的中心地帶發動攻擊。
dialogue_2970=反擊進行得十分順利，我們已經突破了意軍的陣地，繼續進攻。
dialogue_2971=敵人正在逼近蘇伊士運河，我們需要更多的部隊來維持住開羅北部的戰線。
dialogue_2972=英軍在開羅周圍仍有多個要塞據點。繼續向東推進，小心敵人後續的增援。
dialogue_2973=封鎖蘇伊士運河，不要讓敵人的艦隊開進蘇伊士灣！
dialogue_2974=盟軍利用他們在地中海的海空軍優勢，不斷干擾我們的補給線和部隊的運輸。
dialogue_2975=在援軍不足的情況下想徹底戰勝盟軍恐怕不太現實，撤退也會變得異常困難。我的裝甲部隊會盡全力守住突尼斯。
dialogue_2976=我們早已與盟軍達成了協議。士兵們，為了法蘭西而戰。
dialogue_2977=全速前進。突破敵軍的防線，重新建立與突尼斯守軍間的連結。
dialogue_2978=一旦德軍的主力回救成功，後果將不堪設想。我們正與時間賽跑，繼續向突尼斯進攻。
dialogue_2979=盟軍的數量過於龐大，我們已經無路可退。
dialogue_2980=消滅突尼斯境內所有的敵人，我們的反擊即將開始。

event_106=史達林格勒保衛戰
event_intro_106=1941年，德國發起「巴巴羅薩」計劃，席捲了蘇聯的廣大領土，紅軍在節節敗退中掙扎求生，家園被摧毀，土地遭淪陷。到1942年，德軍步步逼近，如同一股黑色的鋼鐵洪流湧向蘇聯的心臟。史達林格勒，這座屹立在伏爾加河畔的城市，成為國家生死攸關的防線。對於蘇聯而言，這不僅是保衛一座城市，更是捍衛命運與尊嚴的戰鬥。整個國家仿佛一根繃緊的琴弦，等待即將在史達林格勒上演的命運決戰。

