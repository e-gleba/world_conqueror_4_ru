event_stage_intro_20314=進攻的重點已經從新幾內亞轉向了菲律賓群島，但日軍在中太平洋的軍事基地始終是一大威脅。 必須奪下馬利安納群島，從而獲得進攻菲律賓群島的支點，並為日後轟炸日本本土做好準備。
event_stage_intro_20315=日軍的太平洋防衛圈已經被層層突破，聯合艦隊也在菲律賓海慘敗。 整個西太平洋的海空軍優勢牢牢地掌握在我們手中。 時機已經成熟，現在就是我們重返菲律賓的時候！
event_stage_intro_20316=硫磺島上日軍的玉碎並不會讓我們停下脚步。 沖繩島的情况更為複雜，守軍也會更多。 但敵人同樣也不會獲得任何來自本土的增援。 步步為營，謹慎地向前推進。
event_stage_intro_20317=儘管日本遭到了核打擊，但他們仍然拒絕投降。 指揮部决定執行沒落行動，登陸日本本土作戰。 蘇軍也將配合我們同時在北方發起攻擊。 這就是我們最後的一場戰役了，勝利屬於所有的盟軍戰士們！
event_stage_intro_20401=為了迫使義大利退出戰爭，指揮部决定優先消滅軸心國在地中海的力量。 利用我們的海空優勢，配合登陸部隊攻下西西里島。
event_stage_intro_20402=義大利政府已經與我們秘密商討了投降相關的事宜，但德軍早已控制住了各處的意軍。 利用好這次投降的契機，一舉消滅義大利的德軍。
event_stage_intro_20403=欺騙行動已經奏效，德軍在諾曼第的防禦工事還未完成。 我們即將在歐洲開闢新的戰場，從而徹底改變戰爭的形勢。
event_stage_intro_20404=諾曼第的德軍已經潰敗，敵人在法國的防線正不斷被瓦解，盟軍主力即將在法國大量集結。 為了解决補給問題，指揮部决定在法國南部開闢一條新的補給線。
event_stage_intro_20405=登陸以後的進攻都十分順利，指揮部希望能打開攻入德軍腹地的通路。 地面部隊做好與空降部隊間的協同，一鼓作氣突破萊茵河這個德軍的天然屏障。
event_stage_intro_20406=德軍的大規模進攻的確出乎我們的意料。 但惡劣的天氣同樣限制了德國人的推進速度。 我的部隊已經提前北上，全速趕往戰場。 隨時做好解决這個突出部的準備。
event_stage_intro_20407=德軍的精銳已損失殆盡，但他們仍在柏林集結了最後的力量殊死一搏。 把柏林留給蘇聯人，用最快的速度向東前進與蘇軍會師，圍殲各處的德軍。 柏林的命運早已註定。
event_stage_intro_20411=為了迫使義大利退出戰爭，指揮部决定優先消滅軸心國在地中海的力量。 利用我們的海空優勢，配合登陸部隊攻下西西里島。
event_stage_intro_20412=義大利政府已經與我們秘密商討了投降相關的事宜，但德軍早已控制住了各處的意軍。 利用好這次投降的契機，一舉消滅義大利的德軍。
