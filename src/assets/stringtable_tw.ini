skill_info_152=指揮空中懸停單位時，提升[#00FF00#%d%%]閃避率和4行動力，受到空軍傷害降低30%%。空中懸停單位進攻時，閃避率每有1%%提升1%%致命一擊傷害
skill_info_153=指揮空軍（空降兵除外）和導彈消耗降低20%%。指揮空軍和導彈攻擊後獲得“梯次攻勢”，空軍和導彈攻擊時無視敵軍[#00FF00#%d%%]防禦，對最終防禦力低於20的敵軍必定造成致命一擊（核彈無效），回合結束時清除。
skill_info_154=指揮部隊周圍1格沒有敵軍時，經濟和工業收入+[#00FF00#%d]
skill_info_155=指揮部隊進攻後使目標及其周圍1格2個敵軍有[#00FF00#%d%%]概率獲得“疲乏”，持續1回合。有“疲乏”的部隊受到攻擊和空襲後額外降低6%%HP，並降低士氣。疲乏效果對已士氣混亂的部隊不生效。

army_buff_desc_1461=梯次攻勢：指揮空軍和導彈攻擊时無視敵軍15%防禦力，對最終防禦力低於20的敵軍必定造成致命一擊
army_buff_desc_1462=梯次攻勢：指揮空軍和導彈攻擊时無視敵軍30%防禦力，對最終防禦力低於20的敵軍必定造成致命一擊
army_buff_desc_1463=梯次攻勢：指揮空軍和導彈攻擊时無視敵軍45%防禦力，對最終防禦力低於20的敵軍必定造成致命一擊
army_buff_desc_1464=梯次攻勢：指揮空軍和導彈攻擊时無視敵軍60%防禦力，對最終防禦力低於20的敵軍必定造成致命一擊
army_buff_desc_1465=梯次攻勢：指揮空軍和導彈攻擊时無視敵軍75%防禦力，對最終防禦力低於20的敵軍必定造成致命一擊
army_buff_desc_1471=疲乏：受到攻擊和空襲後額外降低6%HP，並降低士氣。疲乏效果對已士氣混亂的部隊不生效。

