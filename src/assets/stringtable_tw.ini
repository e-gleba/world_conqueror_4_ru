armygroup_event_desc_1=德國採用多兵種機動化閃擊戰術，於1939年迅速侵略波蘭，引發英法對德宣戰，第二次世界大戰正式爆發。
armygroup_event_desc_2=美國向英國和法國提供大量的軍火援助，為其武器裝備提供了重要支援。
armygroup_event_desc_3=蘇聯試圖在寒冷的冬季攻克芬蘭，儘管蘇聯取得了勝利，但也付出了巨大代價。
armygroup_event_desc_4=德國向挪威和丹麥發起進攻。
armygroup_event_desc_5=羅馬尼亞豐富的石油資源為德國提供了戰略性的燃料支援，對軸心國的作戰能力產生了重要影響。
armygroup_event_desc_6=德國採用閃擊戰術入侵低地國家，快速突破荷蘭、比利時防線。
armygroup_event_desc_7=曼施坦因計畫於1940年5月啟動，通過穿越阿登森林，繞過了馬奇諾防線，形成了對英法聯軍的包圍。
armygroup_event_desc_8=邱吉爾成為英國首相，他的領導力和激勵性演講鞏固了英國的抵抗精神。
armygroup_event_desc_9=面對德軍包圍，盟軍在敦克爾克海灘進行了大規模撤退，通過軍、民海路運送約33萬名士兵回到英國，為後續反攻打下關鍵的基礎。
armygroup_event_desc_10=法軍執行縱深防禦行動和拖延戰術，對德軍部隊造成了較大的損耗。
armygroup_event_desc_11=瑞典在二戰期間通過向德國提供大量高品質鐵礦石，對提升軸心國的軍事實力發揮了關鍵作用。
armygroup_event_desc_12=巴黎淪陷象徵著法國的戰敗，西歐戰場以德國的全面勝利而宣告結束，使德國在戰爭初期取得了戰略上的重要勝利。
armygroup_event_desc_13=德軍於1940年制定了全面入侵英國的“海獅計畫”，企圖通過海上和空中進攻，摧毀英國的軍事力量。
armygroup_event_desc_14=1940年在英國上空展開的決定性空戰，英國皇家空軍成功抵擋德國空軍的入侵，標誌著盟軍在歐洲戰場取得了關鍵性的勝利。
armygroup_event_desc_15=德國海軍通過潛艇群體協同行動，對敵方艦隊、商船進行無差別襲擊，對盟軍船隊形成威脅。
armygroup_event_desc_16=二戰期間在大西洋上發生了激烈海上對抗，德國潛艇通過狼群戰術襲擊盟軍艦船，而盟軍則採取護航和反潛作戰。
armygroup_event_desc_17=義大利向英法宣戰，出動了30萬軍隊向阿爾卑斯山區與尼斯地區發動進攻。
armygroup_event_desc_18=波軍擬定了以防禦為主的作戰計畫，通過固守西方領土為重點，等待西線的盟軍對德國發動攻擊。
armygroup_event_desc_19=軸心國軍隊由各方向入侵南斯拉夫，在極短的時間突破了多道防線，對貝爾格萊德發動鉗形攻勢。
armygroup_event_desc_20=C集團軍群調動了大量火炮與人員，跨越萊茵河向馬奇諾防線發起正面進攻。
armygroup_event_desc_21=德國與義大利聯軍在北非戰場集結兵力，向埃及發動大規模進攻，威脅英軍控制的蘇伊士運河。
armygroup_event_desc_22=英軍發動“羅盤行動”，對義大利在埃及的駐軍發起突然襲擊，迅速擊潰其防線，推進至利比亞邊境，扭轉北非戰局。
armygroup_event_desc_23=隆美爾指揮德意聯軍發動猛烈反攻，突破英軍防線，成功佔領亞歷山大港，威脅蘇伊士運河，北非局勢急轉直下。
armygroup_event_desc_24=德意聯軍發起進攻，圍困圖卜魯格港口，試圖切斷英聯邦部隊的補給線，澳軍堅守陣地，局勢陷入拉鋸。
armygroup_event_desc_25=英軍發起“戰斧行動”，多路突擊德意陣地，雖初期取得進展，但遭隆美爾反擊，行動最終受挫。
armygroup_event_desc_26=英聯邦軍發動“十字軍行動”，集結大批坦克部隊展開全面反攻，成功擊退隆美爾，解除圖卜魯格圍困，北非戰局出現轉機。
armygroup_event_desc_27=隆美爾因卓越戰績被授予元帥軍銜，德軍士氣高漲，視其為不敗象徵。
armygroup_event_desc_28=為削弱英軍地中海補給線，軸心國空軍通過西班牙領空對直布羅陀港發動夜間轟炸，雖未造成重大破壞，但迫使英軍加強防禦部署。
armygroup_event_desc_29=隆美爾攻勢直逼埃及腹地，英軍在阿拉曼構築防線死守，雙方激戰且未分勝負，北非戰局陷入僵持。
armygroup_event_desc_30=美英聯軍在法屬北非三地同時登陸，展開“光明行動”，法屬殖民地政權動搖，軸心國西線防線受到巨大威脅。
armygroup_event_desc_31=蒙哥馬利指揮英軍第八軍團發起全面反攻，擊潰隆美爾部隊，軸心國在北非的攻勢徹底崩潰，戰局開始逆轉。
armygroup_event_desc_32=盟軍部隊發起“火炬行動”，在摩洛哥與阿爾及利亞多點登陸，迫使維希法軍停火，軸心國腹背受敵，突尼斯戰線壓力劇增。
armygroup_event_desc_33=火炬行動後，維希法國軍隊選擇倒戈，加入盟軍行列，自由法國勢力迅速擴張，軸心國在北非局勢愈發被動。
armygroup_event_desc_34=盟軍東西夾擊突尼斯，德意聯軍傷亡慘重，數十萬部隊被迫投降，撤出突尼斯。
armygroup_event_desc_35=隆美爾率德軍裝甲部隊突襲卡塞林隘口，美軍遭遇首次大規模戰鬥，指揮失誤損失慘重，盟軍前線被迫後撤。
armygroup_event_desc_36=盟軍切斷北非德軍補給線，燃油與彈藥日益短缺，非洲軍團作戰能力大幅下降，戰局逐漸惡化。
armygroup_event_desc_37=英軍成功恢復蘇伊士運河至前線的補給線，大批物資與裝備運抵，前線部隊戰鬥力迅速回升。
armygroup_event_desc_38=盟軍橫渡地中海發動登陸戰，迅速突破意軍防線，佔領西西里全島，軸心國南翼暴露，義大利本土戰局拉開序幕。
armygroup_event_desc_39=為支援意軍在巴爾幹的失敗，德軍發起“馬里塔行動”，欲閃擊希臘與南斯拉夫，控制整個巴爾幹半島。
armygroup_event_desc_40=德軍空降兵強襲克里特島，儘管遭遇激烈抵抗，最終攻陷全島，但損失慘重。



