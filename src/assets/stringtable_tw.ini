dialogue_4366=儘管德軍已兵臨城下，但他們面對的絕非一座空城。他們企圖以速度結束戰爭，而我們將以意志拖垮他們。
dialogue_4367=紅場的將士們，讓敵人明白：他們每向前邁出一步，都必須付出血的代價！
dialogue_4368=敵軍已自南北兩翼形成夾擊態勢，一旦得手，我軍防線將被切斷。必須穩住陣線，各個擊破，阻止他們合圍！
dialogue_4369=最後一道週邊防線已被突破，我已經能看到克里姆林宮屋頂上的紅星了。
dialogue_4370=沒有什麼能阻擋鋼鐵洪流的前進。道路將被碾平，防線會被撕開，任何抵抗，都不會改變結果。
dialogue_4371=朱可夫將軍已抵達前線！前線各單位注意穩住陣地，讓敵軍在進攻中不斷消耗，時間會站在我們這邊。
dialogue_4372=從戰術角度看，形勢似乎正在向我們傾斜，莫斯科就在不遠的前方。
dialogue_4373=但從現實角度看，我們的裝甲部隊正在被消耗，氣溫持續下降，車輛啟動與維護時間顯著增加，燃料與彈藥補給無法按計劃到位。
dialogue_4374=沒有補給，就沒有機動；沒有機動，裝甲部隊將失去存在意義。
dialogue_4375=曼施坦因將軍、龍德施泰特將軍已奉命率軍前來莫斯科方向支援，前線部隊務必保持陣地，穩定態勢，決不能後退一步！
dialogue_4376=情報確認日本短期內不會進攻蘇聯，遠東增援部隊即將抵達戰場！
dialogue_4377=必須承認，當前條件對我們並不有利，但莫斯科仍是唯一具備決定性戰略意義的目標。即便成功概率下降，也無法找到可替代的行動方向。
dialogue_4378=不惜一切代價，繼續向莫斯科方向推進！
dialogue_4379=拿破崙的教訓他們忘了嗎？不，他們當然記得。他們一定研究過，分析過，甚至嘲笑過當年的失敗。
dialogue_4380=只是他們和當年的拿破崙一樣，相信自己會成為例外。
dialogue_4381=敵軍被迫後撤，但主力尚存。然而，這已足以證明德軍並非不可戰勝，“閃電戰”的神話自此終結。

