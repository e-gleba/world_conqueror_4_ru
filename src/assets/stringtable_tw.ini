conquest_event_desc_36=杜立特帶領的轟炸機群在距離日本約650海裡的海域由航母起飛，向日本本土進行轟炸，作為對日軍突襲珍珠港的報復。
conquest_event_desc_37=中國派出遠征軍入緬援助，共同抵抗日軍侵略軍。
conquest_event_desc_38=中國軍隊與日本侵略軍在長沙及周邊地區進行了一系列激烈戰鬥。 最終成功守住長沙，挫敗日軍進攻。
conquest_event_desc_39=美日兩國海軍在中途島附近海域進行大規模海戰，日本海軍遭受重創。
conquest_event_desc_40=德軍與蘇聯紅軍在史達林格勒進行了激烈戰鬥，雙方傷亡數百萬人，直接造成了蘇聯與德國總體力量對比發生根本變化。
conquest_event_desc_41=位於挪威的重水工廠遭到盟軍空降部隊的突襲，此舉徹底粉碎了德軍製造核武器的計畫。
conquest_event_desc_42=英聯邦軍隊在蒙哥馬利的指揮下，在阿拉曼地區擊敗了缺乏石油和補給的德意聯軍。
conquest_event_desc_43=美軍通過在西非、北非的重要港口登陸來幫助在埃及與德軍對峙的英軍，開闢了北非第二戰線，分散了德軍的力量。
conquest_event_desc_44=大量墨西哥人進入美國填補由於戰爭導致的勞動力缺失，使得墨西哥國民收入得到增長，同時也向美國提供大量重要礦物。
conquest_event_desc_45=美國改善與拉丁美洲國家的關係，提出睦鄰政策，促使拉丁美洲國家加入盟軍陣營，並與美國保持良好關係。
conquest_event_desc_46=盟國海軍在瓜達爾卡納爾島及其周圍島嶼與日本海軍展開激烈作戰。
conquest_event_desc_47=澳大利亞和美國軍隊在巴布亞新磯內亞的科科達小徑極端惡劣的叢林和山地環境下成功阻擊了日本侵略軍，並迫使日軍撤退。
conquest_event_desc_48=德軍與蘇聯紅軍在庫爾斯克投入大量裝甲部隊，進行了一場大規模坦克戰。
conquest_event_desc_49=美國情報機構解密了日本的通信程式碼，在太平洋上空成功伏擊了山本五十六的飛機，削弱了日本海軍的指揮體系。
conquest_event_desc_50=盟軍部隊在地中海發起對西西里島的登陸戰。 此戰改變了地中海戰區格局，加速義大利投降並向德軍宣戰。
conquest_event_desc_51=美國、英國和中國在開羅會議上發表聲明，確認了三國一致對日作戰直到日本無條件投降為止。
conquest_event_desc_52=美英蘇三國在德黑蘭舉行首腦會議，主要討論了盟軍在歐洲對德國的戰略部署和戰後的國際秩序安排。
conquest_event_desc_53=盟軍在法國諾曼第地區發起的大規模海陸空聯合登陸戰，標誌著盟軍在歐洲戰場反攻的開始。
conquest_event_desc_54=由蒙哥馬利主導的盟軍空降部隊進攻駐守荷蘭的德軍，然而由於天氣、情報錯誤和德軍猛烈的抵抗，該行動並沒有取得所期望的成功。
conquest_event_desc_55=美國採用跳島戰術，通過在一些關鍵戰畧位置上建立基地，最終逼近了日本本土。
conquest_event_desc_56=美日海軍在菲律賓海域發生激烈戰鬥，日軍由於飛機數量、效能落後，以及精英飛行員數量銳減被大量擊落，被美軍稱為“馬里亞那射火雞大賽”。
conquest_event_desc_57=一些德國軍官和政治家實施了一次刺殺德國元首的行動，儘管爆炸發生，但行動目的並未達成。
conquest_event_desc_58=美國和澳大利亞盟軍與日本在菲律賓萊特灣進行激烈海戰。 盟軍此戰擊敗日本聯合艦隊，此戰標誌著日本海軍的衰落。
conquest_event_desc_59=德國的V-2火箭飛越海峽轟炸倫敦，是世界上最早投入實戰的彈道導彈，雖然實質損害不大，但對英國社會造成莫大影響。
conquest_event_desc_60=德軍在阿登地區發動突然攻勢，目標是突破英美盟軍戰線。 雖然最初盟軍損失慘重，但最終成功抵禦了德軍的進攻。
conquest_event_desc_61=儘管保加利亞初期選擇加入軸心陣營，但隨著戰爭局勢變化，保加利亞轉而加入盟軍，最大程度維護了國家的安全穩定。
conquest_event_desc_62=蘇軍包圍了由德國匈牙利聯軍防守的布達佩斯，但遭遇了頑強的抵抗。
conquest_event_desc_63=蘇聯紅軍挺進維也納，與駐守德軍展開激烈戰鬥。 這場攻勢標誌著蘇聯對德國的深入推進。
conquest_event_desc_64=美蘇英在雅爾達舉行三國首腦會議，討論了二戰後的歐洲重建和世界格局的安排。
conquest_event_desc_65=蘇聯紅軍對德國首都柏林進行了大規模全面進攻。
conquest_event_desc_66=美國、英國和中國發表聯合聲明，要求日本必須無條件投降，否則將即刻面臨“迅速和徹底之毀滅”。
conquest_event_desc_67=美國秘密發起的龐大計畫，聚集了世界頂級科學家和工程師，研製出世界上第一顆核子弹。 並在阿拉莫戈多沙漠試爆成功。
conquest_event_desc_68=美國相繼在廣島、長崎投下兩顆核子弹，造成數十萬人死亡，迫使日本宣佈無條件投降。

event_stage_intro_20301=日軍無線通訊密碼已被我們部分破譯，敵人企圖在中途島海域設下埋伏以消滅我們的航母主力。 不過約克城號已經完成了緊急搶修，中途島的空軍力量也得到了補充。 各項準備均已盡力，只等聯合艦隊的到來。
event_stage_intro_20302=聯合艦隊在中途島一戰後已經損失殆盡。 敵人為了鞏固所羅門群島區域的防守，開始在瓜島和圖拉吉島上建造機場。 一旦我們奪取了這些據點，就可以獲得反擊的支點並重新掌控周邊的海域。
event_stage_intro_20303=新幾內亞的日軍失去了航母的支援，推進速度已經放緩。 瞭望台行動也成功迫使敵人開始向所羅門群島分兵。 現在反擊的時候到了。 從科科達小徑開始，將日本人的陸軍部隊趕出新幾內亞。
event_stage_intro_20304=進攻的重點已經從新幾內亞轉向了菲律賓群島，但日軍在中太平洋的軍事基地始終是一大威脅。 必須奪下馬利安納群島，從而獲得進攻菲律賓群島的支點，並為日後轟炸日本本土做好準備。
event_stage_intro_20305=日軍的太平洋防衛圈已經被層層突破，聯合艦隊也在菲律賓海慘敗。 整個西太平洋的海空軍優勢牢牢地掌握在我們手中。 時機已經成熟，現在就是我們重返菲律賓的時候！
event_stage_intro_20306=硫磺島上日軍的玉碎並不會讓我們停下脚步。 沖繩島的情况更為複雜，守軍也會更多。 但敵人同樣也不會獲得任何來自本土的增援。 步步為營，謹慎地向前推進。
event_stage_intro_20307=儘管日本遭到了核打擊，但他們仍然拒絕投降。 指揮部决定執行沒落行動，登陸日本本土作戰。 蘇軍也將配合我們同時在北方發起攻擊。 這就是我們最後的一場戰役了，勝利屬於所有的盟軍戰士們！
event_stage_intro_20311=日軍無線通訊密碼已被我們部分破譯，敵人企圖在中途島海域設下埋伏以消滅我們的航母主力。 不過約克城號已經完成了緊急搶修，中途島的空軍力量也得到了補充。 各項準備均已盡力，只等聯合艦隊的到來。
