;;normal texts,tips
;__font_type[font_text_1]
tips_1=升級科技可以使部隊戰鬥力變得更強。
tips_2=奇觀可以通過完成劇本和挑戰關卡來獲得。
tips_3=部分奇觀建設後，可以收穫金錢、能源、工業、科技等資源。
tips_4=出現新的貿易市場，可以兌換不同的資源。
tips_5=可以通過劇本之外的關卡，獲得更多的資源和獎勵。
tips_6=熟練使用空降部隊，可以大幅度提高作戰效率。
tips_7=核武器可以裝配在導彈或者戰略轟炸機上發射，擁有導彈基地的城市可以發射導彈。
tips_8=防空設施可以有效的降低敵軍空襲和導彈的傷害。
tips_9=建造要塞可以提高作戰效率，但是建造需要一定的時間。
tips_10=陸軍在水中需要搭乘運輸船，運輸船儘量避免與敵軍的海軍交戰。
tips_11=能力越強的將領，完成任務獲得的獎勵越多。
tips_12=指揮部等級提高可以獲得更多將領的槽位。
tips_13=高級技能需要在戰鬥中奪取特殊的目標點來獲得。
tips_14=部隊在消滅敵軍後，會有一定的概率出現士氣提升的狀態，這時它們戰鬥力會大幅提升。
tips_15=當敵軍部隊士氣出現下降或者嚴重下降時，請一定要抓緊時機進行攻擊。
tips_16=當部隊被夾擊時，會士氣下降。當部隊被包圍時，士氣會嚴重下降。
tips_17=航母的攻擊範圍和空軍的攻擊範圍是相同的。如果要提升它們的攻擊範圍必須升級對應的空軍科技。
tips_18=用潛艇對付巡洋艦和航母這樣大型戰艦是最好的選擇。
tips_19=擁有工兵特性的步兵部隊，可以大量降低地雷對其造成的傷害。
tips_20=將領、回合和城市數量等因素，會影響征服最終的評分及評價。
tips_21=科研等級影響城市中的建築等級，更高級的建築能生產更高級的部隊。
tips_22=在指揮部中可以雇傭您的部隊來參加演習、入侵、會戰等戰鬥。


