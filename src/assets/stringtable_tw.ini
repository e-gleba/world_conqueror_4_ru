legend_stage_40106=義大利追擊

legend_intro_40101=英國第7裝甲師由駐埃及機動部隊改編，因駐地跳鼠吉祥物得名“沙漠之鼠”。在1940年12月韋維爾將軍發起的羅盤行動中，該師充分發揮裝甲部隊機動優勢，成為進攻主力。他們連續攻佔巴迪亞、圖卜魯格等重鎮，更以大膽的沙漠穿插，成功截擊從班加西撤退的義大利軍團，俘獲大量敵軍。此役第7裝甲師縱橫昔蘭尼加，以卓越戰績首次讓“沙漠之鼠”的威名響徹北非戰場。
legend_intro_40102=1941年，為解救被隆美爾非洲軍團圍困的圖卜魯格，英軍發動“戰斧行動”。在此戰中，第7裝甲師作為進攻矛頭，展現出高度的機動力與突擊能力，成功攻佔卡普佐堡，一度突破德軍防線。雖因友軍進攻受挫及德軍強勢反擊，最終未能扭轉戰局，但第7裝甲師在逆境中仍成功組織撤退，保存了主力，為其後北非戰場的反攻留下關鍵力量。
legend_intro_40103=吸取經驗教訓後，1941年11月18日，新任中東地區總司令奧金萊克策劃了十字軍行動，意圖一舉殲滅包圍圖卜魯格的德軍裝甲部隊，解放圖卜魯格。第7裝甲師作為進攻主力，迅速突進到了西迪雷澤格。隆美爾為防止盟軍突破包圍圈，調集裝甲部隊向西迪雷澤格發起猛攻。面對德軍的包圍，第7裝甲師展現了卓越的韌性和戰鬥力，不但頂住了德軍的反擊，還在沙漠中進行快速穿插，打擊敵軍指揮和後勤補給線，為盟軍的勝利奠定了基礎。
legend_intro_40104=在第二次阿拉曼戰役中，英國第7裝甲師作為英軍第8集團軍的鋒利尖刀，展現了卓越的機動性與突擊能力。戰役初期，該師在戰線南段牽制敵軍。當戰局陷入僵持，英軍指揮部果斷將第7裝甲師北調，以加強主攻方向的力量。在決定性的“增壓”行動中，第7裝甲師與兄弟部隊一同向德軍防線縱深發起猛烈突擊。他們最終成功突破德意聯軍防線，並與第1、第10裝甲師共同投入到廣闊的沙漠追擊戰中，為盟軍贏得這場關鍵戰役的勝利做出了至關重要的貢獻。
legend_intro_40105=在突尼斯戰役中，英國第7裝甲師作為盟軍先鋒部隊，于1943年3月率先向馬雷特防線發起突擊。該師憑藉出色的機動戰術，在崎嶇地形中迅速突破敵軍防線，成功迂回至德軍側翼。在瓦迪阿卡裡特河戰役中，第7裝甲師再次展現其沙漠作戰專長，以精准的裝甲突擊撕開意軍陣地。作為第一支攻入突尼斯城的英軍部隊，"沙漠之鼠"以嫺熟的裝甲協同和快速推進能力，為最終殲滅北非軸心國集團立下赫赫戰功，為其輝煌的戰史再添濃墨重彩的一筆。
legend_intro_40106=1943年，轉戰義大利的第7裝甲師面臨全新挑戰：從開闊沙漠轉入狹窄山地，作戰環境截然不同。然而這支“沙漠之鼠”展現了驚人的適應與攻堅能力。他們自薩勒諾登陸後，不僅頂住德軍猛烈反擊，更一路向北推進，成功攻佔那不勒斯，為加速義大利退出戰爭做出重要貢獻，再次證明其不愧為一支能征善戰的精銳之師。

synergy_tactics_4_1=・所有“沙漠之鼠”單位在沙漠地塊上移動時，行動力消耗-1；
synergy_tactics_4_2=・火炮壓制：炮兵單位攻擊後,自身周圍2格內的敵方單位獲得“火炮壓制”；“火炮壓制”：被“沙漠之鼠”攻擊時，受到傷害提升10%。
synergy_tactics_4_3=・裝甲遊獵：裝甲單位每擊殺一個處於“火炮壓制”狀態的敵方單位，下回合行動力+2。最多增加20點行動力。
synergy_tactics_4_4=・機械維修：每回合結束時，“沙漠之鼠”步兵單位一格範圍內“沙漠之鼠”炮兵和裝甲單位恢復50點HP。

army_buff_desc_1581=火炮壓制：被“沙漠之鼠”攻擊時，受到傷害提升10%。

