event_stage_intro_20917=盟軍順勢南下突襲了我們位於墨西哥的軍事設施，敵人掌握了我們在太平洋島嶼群上基地的座標，干擾器裝置已經失去了意義。南極的蘇軍遲早會發現我們的基地。現在形勢緊迫，立即集結所有可調動的部隊，向蘇軍的南極研究所發動進攻。


