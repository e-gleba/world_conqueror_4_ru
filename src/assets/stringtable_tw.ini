event_intro_108=1941年秋，德軍在東線戰場連戰連捷，迅速逼近蘇聯首都莫斯科。他們試圖用速度與鋼鐵終結戰爭，以一場決定性勝利迫使蘇聯崩潰。然而，隨著戰線不斷拉長，補給日益緊張，嚴寒也正悄然逼近。面對迫近的危局，蘇聯將最後的力量投入莫斯科，將時間、寒冬與犧牲化作武器。這場原本追求速度的進攻，正在被拖入一場以意志與消耗為代價的決戰。這裡沒有退路，只有生死。




