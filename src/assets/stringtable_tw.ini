warzone_rule=戰區規則
warzone_rule_1=1.每個戰區分成普通關卡和首領關卡，只有普通關卡都通過後才能解鎖首領關卡。普通關會顯示本關主要的作戰兵種。
warzone_rule_2=2.戰區切換或者重置需要消耗指令點，指令點每天固定時間恢復。（UTC8:00和20:00）
warzone_rule_3=3.戰區關卡採用積分制，對敵軍造成傷害（包含堡壘及堡壘召喚的援軍）就能獲得積分，關卡結算後無法重複進入。每個戰區的任意一關上陣的將領，本關通過後無法在當前戰區的其他關卡繼續上陣，建議提前規劃分配將領。
warzone_rule_4=4.每個戰區歷史最佳分數達到一定數量可以領取一次性成就獎勵，且每次通過首領關卡都會根據當前總分獲得勳帶獎勵。（具體要求可以點擊寶箱自行查看）
warzone_rule_5=5.每個戰區歷史最佳分數達到一定數量可以解鎖掃蕩功能，消耗一定數量掃蕩券直接通關並獲得勳帶。


