elite_intro_72=P-40是一款美國研發的單座單發平直翼活塞式戰鬥機。 在東亞戰場，美國空軍將領陳納德成立的飛虎隊駕駛P-40戰鬥機與鋒芒正盛的日軍交手並多次贏得勝利，其發動機下顎漆上的鯊魚嘴成為廣為人知的P-40象徵。

