eventgeneral_rule=將領試煉規則
eventgeneral_rule_1=1.本活動劇本限時開啓，建議各位指揮官合理安排時間，通關並獲取獎勵。
eventgeneral_rule_2=2.本活動爲將領傳記模式的困難難度，但是無需通關將領傳記，即可挑戰此模式。
eventgeneral_rule_3=3.敵軍會獲得2個增益狀態（活動開啓時隨機2個，直到活動結束），請各位指揮官挑戰劇本時，謹慎規劃行軍路線。
eventgeneral_rule_4=4.關卡勝利後會記錄最高通關星數，累計一定的星數可以領取階段獎勵。
eventgeneral_rule_5=5.階段獎勵分爲勳帶獎勵和精英部隊碎片獎勵，領取隨機獲得一定數量的獎勵。

challenge_rule=挑戰活動規則
challenge_rule_1=1.本活動挑戰關卡限時開啓，建議各位指揮官合理安排時間，通關並獲取獎勵。
challenge_rule_2=2.活動挑戰關卡分爲普通難度和困難難度，困難難度需要通關普通難度來解鎖。
challenge_rule_3=3.困難難度挑戰關卡中，敵軍會獲得2個增益狀態（活動開啓時隨機2個，直到活動結束）。
challenge_rule_4=4.活動挑戰關卡分爲4種類型：援助友軍、堅守陣地、殲滅敵軍、積攢物資。每次活動會開啓一種類型的挑戰關卡。
challenge_rule_5=5.通關指定關卡可以領取階段獎勵。階段獎勵均爲固定獎勵。
challenge_rule_6=6.在活動挑戰關卡中，無法建造各類防禦設施。

