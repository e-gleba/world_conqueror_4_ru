elite_intro_96=豹2主戰坦克是德國研製的第三代主戰坦克，以性能均衡、可靠性高、服役範圍廣而聞名。其標誌性的120毫米滑膛炮擁有極高的初速與精准度，可發射多種高效穿甲彈，對遠距離目標仍具強大傷害性。強勁的動力系統賦予豹2卓越的機動性能，使其在崎嶇地形中依然保持驚人的速度與靈活性，展現出現代主戰坦克中難以匹敵的綜合戰鬥能力。

