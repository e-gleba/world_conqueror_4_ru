event_intro_472=1942年2月8日，日軍從新加坡防禦最弱的西北部沙灘成功登陸。盟軍雖然在人數和補給上佔有優勢，但缺乏訓練和經驗。日軍因此迅速奪下武吉知馬，控制了盟軍的糧倉、油庫和附近的蓄水池，使島上的盟軍迅速陷入物資短缺。最終，2月15日，盟軍無條件投降。
event_intro_473=為了避開空襲，1942年2月11日至13日，德國軍艦沙恩霍斯特號、格奈森瑙號和歐根親王號在掃雷艦和空軍的支持下，成功從法國布列斯特穿越英吉利海峽，前往德國海軍基地。地獄犬行動令英軍顏面無光。然而，德軍水面艦艇的行動範圍此後被限制在北海，對大西洋航線不再構成威脅。
event_intro_474=為了防止盟軍從西迪布濟德東部的法伊德山口衝擊敵軍控制的沿海平原，切斷突尼斯南北部隊的聯繫，德軍於1943年2月14日向西迪布濟德及其周邊發動進攻，重創了盟軍部隊。盟軍丟失了大量陣地，陣線後撤至卡塞林。
event_intro_475=冰雹行動是美國海軍於1944年2月17日至18日對日本海軍位於中太平洋的特魯克軍事要港實施的一次大規模海空聯合襲擊。雖然行動的主要目標——聯合艦隊主力艦只因提前疏散而躲過一劫，但港內的大量運輸船和輔助艦隻遭到毀滅性打擊，嚴重損害了日軍的海上運輸能力。
event_intro_476=硫磺島戰役是第二次世界大戰太平洋戰爭中美國與日本之間爆發的一場戰役，從1945年2月19日持續到3月26日。在這場戰役中，日軍放棄了在海灘上建立防線以阻止美軍登陸，轉而在島嶼內部建立了複雜的縱深防禦。這使得美軍的進攻極其艱難，原計劃7天的攻佔行動被拖延了一個多月。最終，美軍戰勝了日軍，折缽山頂升起的星條旗成為美國的重要精神象徵。
event_intro_477=為了防止波美拉尼亞的德軍在蘇軍進攻柏林時發起反攻，從而拖延戰爭，1945年2月24日，蘇軍派出羅科索夫斯基率領白俄羅斯第2方面軍和白俄羅斯第1方面軍東翼部隊，清掃了盤踞于蘇軍北方的波美拉尼亞守軍，為進攻柏林鋪平了道路。
event_intro_478=為了佔領爪哇島，1942 年 2 月 27 日，日軍與盟軍艦隊于泗水附近海域爆發海戰。戰鬥持續了兩天，日軍以一艘驅逐艦受損為代價，擊傷擊沉了盟軍多艘軍艦，取得了勝利。這場戰鬥幾乎摧毀了爪哇附近水域的盟軍船隻，極大推動了日軍侵佔爪哇島的進程。
event_intro_479=1943年初，新幾內亞戰役進入盟軍進攻階段。為了扭轉局勢，日軍計畫在新幾內亞增加兵力發動反攻。2月28日，日軍組織艦隊從拉包爾出發，計畫在3月3日將約6900人運送至萊城。然而，盟軍提前獲悉了該計畫，並在3月2日至3日對艦隊發動持續空襲，炸毀了全部運輸船。
event_intro_480=為了延遲英軍對馬雷斯防線的攻擊，德軍計畫在1943年3月6日集中兵力襲擊梅德寧，消滅該地的預備部隊。然而，英軍提前破獲了這一計畫，並調動部隊做好了增援。到襲擊當天，德軍未能迅速攻克陣地。隆美爾判斷，即使勝利，剩餘兵力也不足以防守馬雷斯防線。因此，他決定放棄繼續作戰，英軍最終獲得了勝利。
event_intro_481=為了佔領敵人據點、保衛緬甸並切斷增援路線等“進攻防禦”的戰略目標，日軍於1944年3月8日發起了英帕爾戰役。戰鬥持續到7月初，最終以日軍的慘敗告終。失敗的主要原因歸咎于日軍指揮官牟田口廉也的脫離現實且不負責任的作戰計畫以及逃避指揮責任。在日本，“英帕爾”至今仍是形容某人“有勇無謀”的代名詞。
event_intro_482=為了解放棉蘭老島並消滅島上的日本守軍，發起了勝利者5號計畫，即棉蘭老島戰役。戰鬥從1945年3月10日持續至8月15日。在菲律賓遊擊隊的輔助下，美軍以極少的傷亡清除了島上的全部日軍。
event_intro_483=盟軍在梅德寧戰役後，很快開始攻克馬雷斯防線。1943年3月16日，英軍兵分兩路：一路正面進攻防線，吸引軸心軍注意；一路從西南方山口繞道北上，從側翼發動突襲。在兩面夾擊下，為防止被包圍，軸心軍不得不向北撤離。盟軍成功佔領馬雷斯防線。
event_intro_484=在棉蘭老島戰役開始後，1945年3月18日，麥克亞瑟將軍下令佔領菲律賓中部的米沙鄢群島。此時，各島的菲律賓遊擊隊正在積極反擊，使日軍只能守住大城鎮，難以在全島展開防禦。美軍因此順利解放了米沙鄢群島。
event_intro_485=1943年3月23日，為了突破德軍防線並推進至馬雷斯防線，美軍第二軍團在蓋爾塔與軸心國軍隊展開戰鬥。美軍在初期取得了一些進展，成功擊退了德軍的前哨部隊。然而，德軍迅速反擊，派出坦克和步兵對美軍進行猛烈打擊。雙方在蓋爾塔峽谷陷入僵持，直到盟軍在其他戰線完成突破。
event_intro_486=為了消滅德軍第1裝甲集團軍，1944年3月25日，蘇軍調集烏克蘭第1方面軍和烏克蘭第2方面軍，將其圍困在卡緬涅茨-波多利斯基地區。在這種情況下，OKW最終允許第1裝甲集團軍突圍。德軍在損失大量裝備和人員後成功突圍，但因此失去了在烏克蘭組織防禦的能力。
event_intro_487=為了鞏固日軍在東南亞的控制力並支援入侵緬甸的陸軍，1942年3月31日，日軍派遣海軍第1航空艦隊襲擊錫蘭的艦隊基地，試圖消滅英國東方艦隊。儘管英軍提前破獲情報，但由於決策失誤，印度洋地區的英軍海上力量仍然遭受了嚴重打擊，英國東方艦隊被迫撤出孟加拉灣。
event_intro_488=為了獲得進攻日本本土的跳板，1945年4月1日，美軍開始了沖繩島戰役。戰役初期，美軍迅速佔領了沖繩島中部和北部。然而，在進攻南部的過程中，美軍被日軍利用洞穴、隧道和堅固的防禦工事拖入了慘烈的陣地戰。盟軍在此戰中有約12,000人陣亡，36,000人受傷；日軍則有約77,000人陣亡或失蹤。如此慘烈的結果加速了美國決定投放原子彈的進程，以迫使日本投降。
event_intro_489=葡萄彈行動是第二次世界大戰末期義大利戰役中的最後一次盟軍進攻。1945年4月6日，盟軍向北推進，突破波河兩岸的德軍防線。義大利遊擊隊也開始起義，加速了軸心國部隊的崩潰。最終，1945年5月2日，義大利的德軍和意軍殘餘全部投降，盟軍解放了整個義大利。

