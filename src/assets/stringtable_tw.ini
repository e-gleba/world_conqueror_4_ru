event_intro_455=此戰也稱為日軍攻占關島戰役。1941年12月8日，在珍珠港事件的第二天，日軍趁機突襲關島。關島守軍毫無防備，迅速被日軍擊敗。12月10日，關島守軍放棄抵抗，日軍獲得關島控制權。
event_intro_456=為了救援被圍困在史達林格勒的第6集團軍，1942年12月12日，德軍第4裝甲集團軍向史達林格勒發起突擊。德軍的攻勢讓紅軍措手不及，並在首日取得顯著進展。然而，隨著蘇軍小土星行動的展開以及史達林格勒周邊的積極防禦，德軍無法繼續進攻，只能放棄解救第6集團軍。
event_intro_457=突出部之役，又稱阿登戰役，發生於1944年12月16日至1945年1月25日，是德國在二戰末期於比利時阿登地區發動的攻勢，旨在突破英美盟軍戰線並重新佔領安特衛普。德軍在戰役初期取得了一定戰果，重創了美軍駐守部隊，但由於物資不足，難以進一步推進，使盟軍穩住陣腳並開始反攻。最終，德軍參戰部隊遭到重創，殘餘部隊撤退至齊格菲防線及萊茵河。
event_intro_458=巴斯托涅戰役發生於1944年12月20日至27日，是美軍和德軍在比利時小鎮巴斯托涅進行的一場戰役，是突出部戰役的一部分。由於阿登山區的7條主要道路均通過巴斯托涅，德軍為了保障部隊安全通過阿登山脈，包圍了駐守當地的美軍，試圖佔領巴斯托涅。美軍誓死抵抗，始終保持對巴斯托涅的控制權，最終被喬治·巴頓的第三集團軍所屬單位解圍，獲得戰鬥勝利。
event_intro_459=為了解放烏克蘭和摩爾達維亞，1943年12月24日，蘇軍發動了第聶伯河-喀爾巴阡山脈攻勢。此戰，蘇軍成功收復了大部分烏克蘭和全部摩爾達維亞領土，擊潰了德軍南方集團軍群，將戰線推進至波蘭至羅馬尼亞一線。
event_intro_460=北角海戰發生於1943年12月26日，戰鬥區域大致位於挪威北角外海。在這場戰鬥中，德國海軍艦艇編隊試圖搜尋並攻擊西方盟國向蘇聯運輸戰爭物資的船隊，但由於情報外洩，與準備已久的英國皇家海軍遭遇，導致戰列巡洋艦沙恩霍斯特號被擊沉。此戰後，德國再也沒有能力派出大型戰艦襲擾盟軍的北方航線。北方航線由此變得相對安全，直至戰爭結束。
event_intro_461=1944年12月26日，蘇軍完成了對布達佩斯的合圍，並迅速開始勸降布達佩斯守軍。29日，投降談判破裂，負責談判的蘇軍特使被德軍擊斃。蘇軍安葬其遺體後開始進攻。布達佩斯圍城戰至此開始。蘇軍圍攻布達佩斯50天，耗盡了德國國防軍特別是武裝黨衛隊的資源，最終攻克了布達佩斯，使東部戰線離柏林更近了一步。
event_intro_462=由於突出部之役導致盟軍大部隊向北轉移，德軍計畫對防守薄弱的阿爾薩斯地區發起進攻，以削弱敵軍力量。1945年1月1日，德軍向斯特拉斯堡發動攻勢。儘管盟軍在兵力劣勢下節節敗退，但最終守住了斯特拉斯堡。攻勢結束後，德軍佔領了阿爾薩斯約40%的地區，縮短了西部戰線，但未能實現削弱盟軍力量的目標。
event_intro_463=1941年12月，日軍向呂宋島發起進攻。由於初期布防不利，日軍成功打破海岸防線，迫使美軍和菲律賓守軍撤退至巴丹半島做最後抵抗。1942年1月7日，日軍開始圍剿巴丹半島。因為缺乏補給，守軍節節敗退，最高指揮官麥克阿瑟撤離菲律賓。最終，在堅持抵抗三個月後，1942年4月9日，剩餘的守軍向日軍投降，巴丹半島戰役就此結束。
event_intro_464=萊特灣海戰後，日軍在菲律賓的軍事力量遭受重創。盟軍憑藉制空權和制海權的優勢，開始計畫奪回呂宋島。1945年1月9日，盟軍登陸部隊在艦隊護航下從林加延灣登陸，清掃了海岸駐軍後，向馬尼拉推進。3月3日，馬尼拉解放，日軍殘部撤入山區繼續抵抗。8月15日，日本宣布無條件投降，呂宋島的殘餘日軍逐批接受停火令，呂宋島戰役至此結束。
event_intro_465=1944年1月14日，蘇軍集結列寧格勒方面軍、波羅的海沿岸第2方面軍和沃爾霍夫方面軍，發起了列寧格勒-大諾夫哥羅德攻勢。大約兩週後，紅軍重新控制了莫斯科-列寧格勒鐵路。1944年1月26日，德軍被驅逐出列寧格勒州，列寧格勒圍困被解除。蘇軍繼續追擊至3月1日，將戰線推進至盧加河。
event_intro_466=在1943年9月盟軍登陸義大利後，為阻止盟軍推進，德軍設置了“冬季防線”。為了繼續推進並解放羅馬，1944年1月17日，盟軍向最核心的“古斯塔夫防線”發起了進攻。卡西諾山上的修道院是戰鬥的核心，因其戰略位置使得德軍能夠控制周圍地區。盟軍多次嘗試攻佔修道院，但都遭遇頑強抵抗。最終，盟軍在付出巨大傷亡代價後控制了該地區，獲得了戰役的勝利。
event_intro_467=为了消除科尔马突出部，盟军于1945年1月20日从突出部南北两侧发起进攻，成功包围并重创了德国第19集团军，解放了科尔马。
event_intro_468=科爾遜-契爾卡塞攻勢是第聶伯河-喀爾巴阡山脈攻勢的一部分。在1944年1月初，烏克蘭第1方面軍和烏克蘭第2方面軍從南北兩側包圍了契爾卡塞東北方的德軍突出部。為了剿滅突出部中的6個德軍師，1月24日，蘇軍從南北兩側發起進攻；28日，南北兩路完成會師，形成包圍圈。德軍很快發起突圍，但還是損失了大量軍官和全部重型火力。
event_intro_469=一戰末期，芬蘭尋求獨立，形成了「白色芬蘭」和「紅色芬蘭」兩股政治勢力。雙方都追求芬蘭獨立，但意識形態不同導致矛盾不斷升級。戰火於1918年1月27日點燃，紅色芬蘭搶先動員工人群體，佔領了芬蘭南部幾乎所有城鎮和工業中心，而白色芬蘭退守北部農村地區。然而，由於紅色芬蘭缺乏軍事訓練，白色芬蘭在德國的軍事援助下最終贏得了戰爭。
event_intro_470=1942年2月1日，美國海軍對馬紹爾和吉爾伯特群島的日本帝國海軍守備部隊進行了空襲和炮擊，對島上的日本駐軍造成了輕至中度的破壞。雖然此戰對太平洋戰局影響不大，但在經歷「珍珠港事件」和「威克島失守」後，此次行動有效提升了美國海軍和公眾的信心。
event_intro_471=1944年1月，蘇軍推進到納爾瓦河一線。為了深入愛沙尼亞並獲得進攻芬蘭和東普魯士的基地，蘇軍對納爾瓦地峽發起了一系列進攻，即納爾瓦戰役。此戰從1944年2月2日持續到8月10日。初期，德軍猛烈反攻，蘇軍推進緩慢。直到7月，與利沃夫-桑多梅日攻勢相配合，蘇軍才攻下納爾瓦。德軍退守坦能堡防線，與蘇軍再次僵持。


dialogue_3201=德軍即將打通一條通往沿海方向的走廊。現在必須準備撤退了。
dialogue_3202=讓友軍先行向海峽方向撤退，我的裝甲部隊會盡力拖住德軍的攻擊。
dialogue_3203=堅守陣地！皇家空軍會持續為撤退行動提供空中掩護。
dialogue_3204=陣地戰已經不適合這個時代了！全速前進，把俘虜留給後面的友軍。
dialogue_3205=這……這空襲的規模根本無法阻止德軍的地面進攻。如此潰敗的原因到底出在哪裡？
dialogue_3206=我的軍團已經無法繼續作戰，拋下手頭上的一切，全速撤退吧。
dialogue_3207=我們的軍隊雖然失敗了，但研究成果絕不能落入德軍手中。
dialogue_3208=通往海峽的走廊已經打通，維持住戰線，把英法主力消滅在包圍圈裡。
dialogue_3209=你就是奧斯本？我是本特克，奉命保護你一起撤離。
dialogue_3210=可是我接到的命令是堅守在這裡，直到主力部隊順利撤離！即便情況再危急，我也不能擅自離開陣地。
dialogue_3211=你的命運遠不止於此，你的旅程才剛開始，未來還有無數可能在等著你。但如果你堅持的話，我也會尊重你的決定。選擇權在你手中。
dialogue_3212=里爾也失守了，德軍開始加速收縮包圍圈。阿爾弗雷德，我們得撤退了。
dialogue_3213=別忘了，我們是傭兵。完成任務、活著回來──這才是我們唯一的目標。
dialogue_3214=相信他所做的決定。
dialogue_3215=德軍將被俘的人員關在了幾座臨時監獄內，阿爾弗雷德也一定在其中。
dialogue_3216=你們怎麼才來？再多等幾天，我可真要考慮加入德軍了。
dialogue_3217=你到底是誰？為什麼會出現在這裡？不過現在顧不了那麼多了！敵人的主力已向南方進攻，這是我們唯一的救援機會！
dialogue_3218=居然還想逃跑？沒有一個囚犯能從第三帝國的監獄逃脫！乾脆就在這裡解決了你們，免得夜長夢多。或許我還能趕回前線參戰！
dialogue_3219=營救十分順利，不過接下來才是困難。向南穿過戰線前往西班牙，從那裡坐船能到英國。
dialogue_3220=看來我們得在這裡分開了。遠征軍還有一部分被困在勒阿弗爾，正面臨威脅，我必須盡快趕去與他們匯合。
dialogue_3221=或許你還有一個選擇。從南方撤離，梅斯方向會被打開一個缺口，你可以與在那裡堅守的戴高樂將軍匯合。
dialogue_3222=我們正在與德軍協商停戰協定的相關事項，各部隊現在原地待命，等候新的指示。
dialogue_3223=法國敗了。敗給了德軍的裝甲集群，敗給了優秀的指揮官，敗給了閃電般的進攻速度。能決定正面戰場走向的裝甲部隊才是戰爭未來的發展方向！
dialogue_3224=先進的軍工科技與穩定且充足的產能，這兩者合而為一才是軍事實力的發展方向。我們還有希望！
dialogue_3225=貝當的政府已經拋棄了法國人民。我會為了法蘭西戰鬥至最後一刻！
dialogue_3226=法軍部隊又一次被我們分隔了開來。現在巴黎已經門戶大開，勝利近在眼前！
dialogue_3227=相信他，但是行動要快。德軍留給你們的時間不多了，法國人自會安全撤離。
dialogue_3228=前線部隊的美式裝備已順利抵達。不必道謝，我會在後方等候你們的最新戰報。
dialogue_3229=我們的援軍已經抵達！但德軍突破了阿拉曼的防線，那裡的裝甲部隊隨時有被包圍的危險！
dialogue_3230=阿爾弗雷德·西奧多·奧斯本，你在法國的英勇表現令我印象深刻！但陸地的戰鬥和空中完全不同，這揚起的砂礫會把你的稜角磨平，把你的銳氣消耗殆盡。讓我看看你能否適應這裡的殘酷！
dialogue_3231=敵軍進攻規模的確超乎預期。重新調整防守策略，優先化解敵人的進攻。更多的援軍即將抵達戰場。
dialogue_3232=阿拉曼已經失守，敵人怎麼會有這麼多的裝甲和海軍部隊。我們就要被包圍了。
dialogue_3233=沒想到你還能指揮海軍。先把艦隊撤回亞歷山大港，增援很快就會到達。
dialogue_3234=進攻的速度還不夠快，別忘了我們只有一次機會。配合意軍的進攻拿下開羅，擊潰盟軍的士氣。
dialogue_3235=目標開羅，切斷盟軍的兵員補給。
dialogue_3236=這些兵力就是我們的全部了。既然攻勢已經失敗，那就只剩下一個選擇。撤退！
dialogue_3237=利刃已經出鞘。我的人會在敵軍做出反應前先發制人。
dialogue_3238=我一定竭盡全力，把隆美爾趕出非洲。
dialogue_3239=新設計的兩台車體已成功改進了原型車的缺陷，使其在北非戰場的嚴苛環境中也能充分發揮火砲的威力。
dialogue_3240=空降部隊已經抵達了預定位置。立即發動進攻，在海防線後方擾亂敵人的防禦部署。
dialogue_3241=迅速登陸！協同空降部隊夾擊並瓦解陣地上的敵軍。
dialogue_3242=黃金海灘防守薄弱，我的位置相對有利。可以全力配合我迅速清出一片灘頭陣地。
dialogue_3243=登陸部隊已經站穩了腳跟，現在向卡昂方向發動攻擊。
dialogue_3244=又是隆美爾和他的裝甲部隊！我只是個戰車軍備專家，怎麼這些硬仗都讓我趕上了。
dialogue_3245=沒人會在戰場上在意他人的身份。你可以留在這裡，只要別擋在我們衝鋒的路上。
dialogue_3246=我們是防線上的一道堅實的屏障，絕不能讓盟軍通過這裡。我會死戰到底。
dialogue_3247=大批盟軍已經在諾曼第登陸，必須組織一次反攻，延緩敵人的推進。
dialogue_3248=我的火砲部隊會限制住盟軍的攻擊！
dialogue_3249=有時候我真覺得自己才是這些戰役的主角，應該被印在海報上、印在宣傳冊的封面上。
dialogue_3250=盟軍對我們的進攻毫無防備。利用這個機會切斷英美主力間的聯繫。
dialogue_3251=憑我們手邊的武器裝備根本無能為力。被包圍的友軍恐怕兇多吉少了。
dialogue_3252=加快支援的速度！難道我們只能眼睜睜看著巴斯托涅淪陷嗎？
dialogue_3253=現在有兩個方案可以選擇。直搗德軍後方，切斷敵人的兵員補給。或是從正面擋住德軍主力的進攻，等待美軍援軍的抵達。
dialogue_3254=我來助你！援軍雖然會遲到，但絕對不會缺席。
dialogue_3255=巴頓將軍早就提前調集了兵力，等援軍主力一到就立即發動反攻！
dialogue_3256=相信祢的戰友們。更重要的是，相信自己。行動起來！
dialogue_3257=我從不懷疑自己的判斷。情況即將反轉，我們的優勢就要到來了。
dialogue_3258=英軍向我們的後方發動了突擊，一旦退路被切斷，後果不堪設想。
dialogue_3259=撤回齊格飛防線，在盟軍發動下波攻勢前重新組織好防禦。
dialogue_3260=我們曾經離勝利只有一步之遙，但最後卻功虧一簣。撤退吧。
dialogue_3261=佔領巴斯托涅沉重地打擊了盟軍的士氣。但是我們並沒有更多的兵力來維持這樣的攻勢。
dialogue_3262=巴斯托涅已經失守。趕去支援的奧斯本被德軍裝甲部隊困住了。
dialogue_3263=現在不是分析戰局的時候，我們的機會稍縱即逝。
dialogue_3264=蘇軍再次捲土重來，現在已經佔領了大半個墨西哥灣！陸軍也越過了美墨邊境。形勢十萬火急。
dialogue_3265=我們與美軍一直有著密切的合作，這次行動路線絕對萬無一失。選擇你們也是因為大家在西線戰場上並肩作戰過。
dialogue_3266=聽說這次還提供了許多新式裝備和特殊作戰人員。
dialogue_3267=他們的話只能信一半。這次倒也不是什麼黑色行動。美國那些滑頭不值得我信任，但你，盧卡斯，我完全信任。
dialogue_3268=我們已經抵達了預定地點。目標：摧毀蘇軍的導彈基地與核武工廠。是你們表現出來的時候了！
dialogue_3269=沒有人敢在天空中向我發起挑戰。
dialogue_3270=當然，我們也為你準備了一架。
dialogue_3271=等等，山間似乎有什麼建築設施，看外形不像是蘇軍的軍事基地。
dialogue_3272=那裡似乎有人影。提高警覺！從留下的痕跡來看，這些人的科技水準已經遠遠超過我們了。
dialogue_3273=發生什麼事了？為什麼前線的部隊在向友軍開火！
dialogue_3274=蘇軍部隊好像被人控制了一樣。其中一部分甚至把部隊裝備的控制權交給了我們。
dialogue_3275=阿爾弗雷德，我無法在這裡待太久。利用好這輛戰車，繼續往南前進。我們需要你的幫助。
dialogue_3276=該死，剛剛發生了什麼，通信突然被人切斷了！阿爾弗雷德，你們沒事吧？
dialogue_3277=看來我們可能要去南美一趟了。聽說那裡的局勢相當複雜，戰爭隨時都可能爆發。
dialogue_3278=眼下還有更大的危機要處理。趁蘇軍還沒反應過來，繼續執行作戰計畫。
dialogue_3279=英軍的部隊中發現了奇特的裝甲戰車。我們曾經看過類似的武器，現在問題變得複雜了。
dialogue_3280=放棄吧，你們的計劃是不會成功的。在正面戰場發動攻擊只會讓其他勢力漁翁得利。
dialogue_3281=我已經從基地撤離。這裡就交給你了。
dialogue_3282=蘇軍的勢力早已伸向了南美洲。現在他們發動了全面進攻，我們必須在局勢無法挽回前先發制人。
dialogue_3283=美軍靠著自己的多個海外軍事基地，在短時間內完成了大量部隊的調動。靠武力威脅著地方的政權。
dialogue_3284=看看這個世界，戰爭從來沒有改變。只有強者才有話語權，其他人只能被迫站隊。
dialogue_3285=已經定位到了三個具體的座標。離我們最近的一處附近發現了蘇軍，他們似乎要靠武力佔領。
dialogue_3286=既然你到了這裡，就已經沒辦法回頭了。守住南美的基地，我們將在這裡重新開始。
dialogue_3287=阿爾弗雷德·西奧多·奧斯本，我們並沒有邀請你來這裡。不論這些人是怎麼聯絡上你的，你已經被列為他們的一員了。
dialogue_3288=敵人擁有先進的武器，甚至能改變人的心智。如果無法為我們所用，就必須第一時間徹底摧毀。
dialogue_3289=我們會回來復仇的。奧斯本，你終將無處可逃。
dialogue_3290=從一開始我就知道結局，我早就選定了自己要走的必經之路。問題是，你們呢？
dialogue_3291=我一向只忠於自己和兄弟。而奧斯本，你早就是我們的兄弟了。
dialogue_3292=也許根本就沒有什麼精神控制。是我們早就看清了現狀，早就想要做出改變。
dialogue_3293=你們的訊號干擾裝置還在吧？我相信自己對你的判斷，多個朋友總比多個敵人好。
dialogue_3294=來吧，好戲開場了！
dialogue_3295=也許你們能在南美獲得勝利。但請記住，我們盯上你了。
dialogue_3296=盧卡斯，這是我們所有的精銳了，你知道該怎麼做。
dialogue_3297=這些部隊正在他們的要塞周圍不斷集結。再這樣耗下去我們都不會有好結果。
dialogue_3298=眼下敵人的敵人就是朋友。要遏制住這些人，恐怕只能和蘇軍暫時停戰了。
dialogue_3299=沒人能阻止我。美軍不能，蘇軍不能，任何人都不能。我絕不會讓帝國的失敗重演！
dialogue_3300=我們的戰士早已潛伏在了各地，暗中推動各種軍事行動，改變新世界的格局。
dialogue_3301=我們無法抵擋敵軍的突襲，開羅失守，補給線有被切斷的危險！
dialogue_3302=防線已經無法再繼續維持。現在戰機的油料已經補給完成，我會作為空軍繼續履行我的使命。
dialogue_3303=所有的戰機撤回不列顛本土重新補給，後續的撤離行動需要更多空中力量提供掩護。

promotable_generals=以下將領可以消耗該道具進修

skill_name_145=鐵膽衝鋒
skill_name_146=爭鋒
skill_name_147=協同反擊
skill_name_148=縱深打擊
skill_name_149=領袖
skill_name_150=戰場直覺
skill_name_151=老將

skill_info_145=指揮裝甲部隊時，周圍2格每有1個敵軍，造成傷害+[#00FF00#%d%%]（最高50%%），裝甲部隊士氣高昂時受到傷害降低20%%
skill_info_146=指揮裝甲部隊時對敵軍精英部隊造成傷害+[#00FF00#%d%%]
skill_info_147=指揮火炮部隊時，自身不受無法反擊的技能效果影響，周圍一格友軍進行反擊時，自身也有[#00FF00#%d%%]概率參與反擊。
skill_info_148=指揮火炮部隊進攻和反擊時，對距離2格和以上的敵軍造成傷害+[#00FF00#%d%%]
skill_info_149=指揮部隊對陸地單位造成傷害+[#00FF00#%d%%]。佔領敵方城市時，自身和3格範圍內的其他友軍部隊獲得“嘉獎”，部隊攻擊力提高15%%，持續3回合
skill_info_150=指揮部隊無視煙幕彈和潛行、閃避以及電磁靜默效果，攻擊HP低於50%%的敵軍時造成傷害+[#00FF00#%d%%]
skill_info_151=指揮部隊HP上限+[#00FF00#%d%%]，部隊半血以上時士氣不會混亂


dialogue_3138=我軍兵力遠勝日軍，務必要將其消滅在新加坡。讓美蘇兩國見識英國的尊嚴與榮耀！
dialogue_3139=東岸地勢平坦，方便登陸。一定要嚴防日軍從此處登陸！
dialogue_3140=我軍兵力和補給都遠遜英軍，必須用戰術逼迫他們投降，不能和他們打消耗戰！
dialogue_3141=敵軍居然如此脆弱。全力進攻，擊碎他們的抵抗意志！
dialogue_3142=武吉知馬已被我軍佔領。你們的糧倉水源已經不保。放棄這種毫無意義、絕望的抵抗吧！
dialogue_3143=精銳部隊全力奪回武吉知馬！不然等到物資耗盡，我們絕無可能繼續戰鬥！
dialogue_3144=消滅英軍反攻精銳部隊！等到英軍補給耗盡，他們就會同意無條件投降！
dialogue_3145=新加坡的物資已經耗盡，我們無法再繼續戰鬥了。通知日軍，我們同意投降。
dialogue_3146=此次行動要將主力艦隊安全送達德國港口。通過海峽的機會有限，一定要快！
dialogue_3147=仔細搜查，一定要將他們擊沉！沒有敵方艦隊能在戰時通過英吉利海峽！
dialogue_3148=目標艦隊出現！將他們擊沉！
dialogue_3149=突尼斯中部的各處山口是我們攻擊東部平原的支點。各部隊務必堅守，不容有失！
dialogue_3150=兵分兩路，一路從南部攻擊西迪布濟德，一路向西北進攻。我們不能把這些山口留給敵人！
dialogue_3151=敵軍開始撤退了。繼續進攻，打他個立足未穩！
dialogue_3152=有情報稱日軍聯合艦隊主力艦只停泊在特魯克。士兵們，該讓日本還珍珠港的利息了！
dialogue_3153=日軍灘頭部隊已被炮火壓制，准許登陸！
dialogue_3154=諸君，最後的時刻已經到來！我們一定要把更多的敵人埋葬在這裡！
dialogue_3155=陸地部隊注意：日軍有地堡用來隱藏火力，注意警戒！注意警戒！
dialogue_3156=開火！開火！所有人都不准萬歲衝鋒，必須堅守陣地，戰鬥到最後一刻！
dialogue_3157=面對數量和素質占優的陸海空攻擊，卑職已盡全力，然現在險要盡落敵手，卑職萬分抱歉。
dialogue_3158=德軍的部隊圍在我軍南北兩側，為了防止他們阻礙進攻，我們必須掃清他們！
dialogue_3159=我已盡全力，但勢不可違。現在，我只求有一個有尊嚴的結局。
dialogue_3160=泗水方向發現敵軍艦隊。幹掉他們，爪哇島就是我們的了！
dialogue_3161=各艦注意，日軍艦隊正在接近泗水，準備作戰！
dialogue_3162=敵軍火力兇猛，受損艦隻先撤退修理。
dialogue_3163=我怎能在家鄉的海域裡沉沒？！
dialogue_3164=萊城前線現在急缺兵員。這批部隊到達就能緩解局勢，要確保安全送達！
dialogue_3165=各部隊注意，日軍運兵船已經出動。幹掉他們!為前線減輕壓力。
dialogue_3166=我軍補給不足，不能在防線上打消耗戰。出擊，一定要在防線前把敵軍打退！
dialogue_3167=士兵們，注意警戒！敵軍馬上就要進攻。沒有足夠的物資，他們堅持不了多久！
dialogue_3168=不行，再打下去，剩下的兵力就不夠防守馬雷斯防線了。全軍撤退！
dialogue_3169=戰士們，日軍即將發動進攻。堅守陣地，嚴守紀律。我們一定能獲得勝利！
dialogue_3170=不用擔心，空投足以保證我們的補給。守住英帕爾，廣袤的密林足以讓敵軍補給崩潰！
dialogue_3171=奪回英帕爾！
dialogue_3172=日軍補給不足，攻勢只會越來越疲軟。戰士們，讓我們彰顯勇氣，證明日軍絕非不可戰勝！
dialogue_3173=日軍已經無力反抗。清掃島上日軍，解放棉蘭老島！
dialogue_3174=堅持“永久抵抗”策略，絕不能輕易放棄任何一個據點！
dialogue_3175=法國的防線還是相當可靠的。堅守陣線，我們就不會失敗！
dialogue_3176=正面保持壓力，等待機動部隊從防線左側發起攻擊，用“左勾拳”打破防線！
dialogue_3177=該死，英軍是怎麼到達防線右側的？全軍聽令，放棄防線，向北撤退。
dialogue_3178=這條防線不能再守了。馬雷斯守軍迅速後撤，不要和敵軍糾纏！
dialogue_3179=進攻，把他們徹底擊潰！
dialogue_3180=我為國王流盡了最後一滴血。我的人生已足夠光榮。
dialogue_3181=海面已經清掃，菲律賓的中部群島也必須在我們的控制之下！
dialogue_3182=守島部隊務必用盡一切手段和敵人糾纏，全力阻止敵人奪島！
dialogue_3183=必須保證東部平原的安全，絕不能讓敵軍突破我們的防線！
dialogue_3184=突破敵軍防線，將戰線推進到東部平原！
dialogue_3185=投降，否則不收口袋內任何一個德軍作俘虜。
dialogue_3186=第1裝甲集團軍向西撤退，做出向西南突圍的態勢，隨時呼應西北方向的援軍！
dialogue_3187=解我的職？這個蠢貨！沒有他的胡亂指揮，都不會有現在這種情況！
dialogue_3188=西北方向有德軍援軍？阻止他們，不能讓那裡成為突破口。
dialogue_3189=出擊！這一戰要蕩平東方艦隊！
dialogue_3190=敵軍向我軍駛來？進軍，把敵軍的主力艦全部擊沉！
dialogue_3191=你們是蠢豬嗎？竟然被敵人擊沉了！撤退，先回港修整。
dialogue_3192=沖繩是進攻日本本土的重要跳板，拿下它，我們才能儘快結束這場戰爭。
dialogue_3193=敵人發起了自殺式襲擊，注意回避！
dialogue_3194=義大利遊擊隊會支援我們。越過這道山嶺，便是一馬平川！進軍，解放義大利！
dialogue_3195=為了我國剩餘的領土，我軍會配合德軍防守。
dialogue_3196=封鎖加爾達湖附近的山口，不能讓敵軍逃跑，必須一網打盡！
dialogue_3197=該死，哪兒來的暴民！鎮壓他們，敢干擾軍政行事的全部拘捕！
dialogue_3198=我是義大利軍隊的最高領導。我代表義大利軍隊投降。


