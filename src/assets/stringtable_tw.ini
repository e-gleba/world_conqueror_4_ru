dialogue_2770=此次作戰目標是佔領瓜達爾卡納爾及其附近島嶼的機場。借此，我們將奪回所羅門群島！
dialogue_2771=美軍怎麼會出現在那裡？傳令所有編隊，務必奪回機場！
dialogue_2772=德軍已經被趕出卡昂，乘勝追擊，突破這道防線！
dialogue_2773=將士們，穩固陣線！後方就是我們的生命線！
dialogue_2774=很好！繼續深入，拿下法萊斯！
dialogue_2775=全力進攻，把他們壓回缺口！
dialogue_2776=士兵們，德軍已經陷在了口袋裡，繼續進攻，將他們徹底擊潰！
dialogue_2777=全體士兵，穩步推進，將B集團封死在包圍圈裡！
dialogue_2778=奉元首命令：全力反攻，阻止敵軍繼續推進！
dialogue_2779=戰局已經無力挽回，全軍撤退，保存實力！
dialogue_2780=德軍的動向變了，東部軍隊快速封口，不能讓他們逃脫！
dialogue_2781=全軍整備，此次，我們將奪回我們的故土！
dialogue_2782=此次作戰務必奪取全部港口，保障物資供應。
dialogue_2783=盟軍攻勢兇猛！G集團軍群全體後撤，保存實力。
dialogue_2784=此次作戰，我們要突破第厄普防線，獲取德軍海岸佈防情報。
dialogue_2785=保持戒備，加強巡視！盟軍隨時都有可能登陸！
dialogue_2786=此次作戰，我們要包圍基輔，徹底摧毀西南方面軍!
dialogue_2787=我部會從切爾尼戈夫向南進攻。
dialogue_2788=我部克萊斯特會從切爾卡瑟-克雷門丘克一線向北進攻。
dialogue_2789=最高統帥部命令：不惜一切代價守住陣地！直面、堅守，必要時犧牲。
dialogue_2790=包圍圈完成，全力絞殺敵軍！
dialogue_2791=西北方面軍命令：波羅的海艦隊和第10步兵軍從塔林港撤離至列寧格勒。
dialogue_2792=炮兵營沿岸封鎖。空軍部隊全力轟炸敵軍船隻。我們必須阻止蘇軍從海上撤離！
dialogue_2793=北部佯攻，南部重拳。此戰必須擊敗第8軍團！
dialogue_2794=把坦克固定在陣線上。守住阿拉姆哈勒法嶺，我們必勝！
dialogue_2795=機動作戰，快速行動，要在英法反應過來之前吞併波蘭！
dialogue_2796=我軍負責助攻，保證打通波蘭走廊。
dialogue_2797=我軍負責主攻，一定迅速攻入波蘭核心區。
dialogue_2798=將士們，堅持住！等到英法介入戰局就會逆轉。
dialogue_2799=全軍聽令，為了保護烏克蘭和白俄羅斯居民，清掃波蘭地區的混亂武裝！
dialogue_2800=蘇聯竟然撕毀協約入侵波蘭？看來波蘭已經戰敗了。但我們決不投降！
dialogue_2801=此戰應該先從“腳底”進攻，拖住敵軍主力。我方主力再在薩萊諾登陸佔領那不勒斯。
dialogue_2802=既然美國人相信德軍會重點佈防塔蘭托，那就隨他們吧。我們儘量加快動作，支援登陸。
dialogue_2803=盟軍的主攻方向應該不會放在“腳底”，我們必須集中兵力在羅馬周邊佈置防線。
dialogue_2804=英軍已經開始戰鬥。出發，登陸薩萊諾！
dialogue_2805=好消息！義大利已宣佈向我方投降。
dialogue_2806=解除意軍武裝，義大利由我們來控制。
dialogue_2807=進軍埃及的計畫已經推遲了兩次，總理認為已經不能再推遲了。
dialogue_2808=儘管補給不夠充分，但合適的補給對應合適的目標。出擊，進軍埃及！
dialogue_2809=靈活遏制，我們要爭取時間累積足夠的力量來發動進攻。
dialogue_2810=很好，繼續穩步推進！
dialogue_2811=同志們，反攻之時已至，解放里加！
dialogue_2812=將士們，東普魯士還聯繫著拉脫維亞，支援不會斷絕，堅守陣地！
dialogue_2813=德軍抵抗頑強。我們或許應當進攻克萊佩達，切斷里加與東普魯士的聯繫。
dialogue_2814=該死！分步撤離里加，在庫爾蘭重新組織防線。
dialogue_2815=第一批空降兵已經到位，他們會搶奪並堅守附近橋樑，請儘快支援！
dialogue_2816=士兵們，快速推進，讓美國佬見識我們的厲害！
dialogue_2817=各單位控制住橋樑，無法控制就全力摧毀。裝甲部隊馬上就會支援！
dialogue_2818=阿納姆的橋樑已經失守，我們無法從萊茵河對岸入侵魯爾。
dialogue_2819=向許特根森林方向進攻，務必保障阿亨地區的德軍不會得到支援！
dialogue_2820=依託齊格菲防線防守，一定要阻止美軍繼續推進，保護魯爾大壩！
dialogue_2821=阿亨已經攻克，部隊繼續前進！
dialogue_2822=雖然阿亨淪陷，但我們不能放棄。堅守下去就還有轉機！
dialogue_2823=抱歉，對方看來不願意接受我們的好意。
dialogue_2824=沒事，先生。按照計畫，我們必須要武力逼迫他們了。
dialogue_2825=進攻，擊潰梅斯地區的德軍，佔領梅斯！
dialogue_2826=梅斯守軍，依託堡壘防禦，遲滯美軍推進！
dialogue_2827=第2集團軍從布良斯克西北突破，第2裝甲集團軍從謝夫斯克向奧廖爾推進。此戰，我們要將布良斯克方面軍圍殲！
dialogue_2828=同志們，莫斯科就在我們身後，一定要將敵人阻擋下來。為了祖國和人民！
dialogue_2829=敵人要將我們包圍，全軍突圍！
dialogue_2830=全力進攻，擊潰他們！
dialogue_2831=元首命令第15集團軍不惜一切代價守住斯海爾德河口。
dialogue_2832=加拿大第1軍團負責打通斯海爾德河，盟軍將適當給予支援。
dialogue_2833=通往瓦爾赫倫的走廊必須不惜一切代價保持暢通。附近連隊，加緊支援！

