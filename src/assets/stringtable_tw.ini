event_intro_490=為了確保德國軍事工業的鐵礦石供應，德軍於1940年4月9日凌晨啟動"威瑟堡行動"。丹麥在開戰後迅速投降。挪威雖依託地形優勢並接受盟軍的支援，仍於6月10日淪陷。此役使德國成功控制北海與波羅的海戰略要地，斯堪的納維亞鐵礦運輸線由此得到全面保障。
event_intro_491=由於納爾維克是瑞典鐵礦石運輸的重要北大西洋不凍港，挪威戰役開始後，盟軍和德軍展開了激烈爭奪。1940年4月9日，德國成功入侵併佔領了納爾維克。英軍得知後立即派兵嘗試奪回，並在4月10日和13日爆發了兩場海戰。然而，由於陸戰準備不足，英軍雖然擊毀了多艘德軍艦艇，但未能佔領港口。
event_intro_492=1945年4月16日，蘇軍集結三個主力方面軍向柏林發起最後一次攻勢，史稱柏林戰役。困守柏林的德軍高層負隅頑抗，但隨著蘇軍炮火逼近，其防線逐漸崩潰。4月30日，元首地堡傳來一聲槍響。兩日後，柏林城防司令魏德林簽署投降令，德意志第三帝國徹底覆滅。
event_intro_493=為了鼓舞珍珠港事件後低迷的美國民眾士氣，1942年4月18日，16架B-25轟炸機從“大黃蜂”號航母起飛，成功空襲東京等城市後，1架迫降蘇聯，其餘在中國浙江等地跳傘或迫降。此次行動雖未造成重大破壞，但震懾了日本軍方。
event_intro_494=為拔除軸心國在北非最後據點，1943年4月22日，盟軍發起火神行動。英軍主攻突尼斯市，美軍向比塞大推進。德意軍隊依託山地工事頑強抵抗，但受制於補給短缺以及絕對制空劣勢，防線於5月6日崩潰，最終25萬人於5月13日投降。此役清除地中海航道威脅，使盟軍得以在兩個月後發起哈士奇行動。
event_intro_495=1943年9月意大利投降後，德軍全面接管愛琴海諸島防禦。為配合諾曼第登陸進行戰略欺騙，1944年4月24日，英國皇家海軍特殊舟艇中隊（SBS）突襲聖托里尼島，摧毀德軍海岸觀測站與無線電中繼設施。此次突襲有效干擾德軍愛琴海航運監控，迫使德軍增調駐防島嶼，間接支援了盟軍地中海戰區主力作戰。
event_intro_496=1944年4月28日諾曼第登陸演習期間，因盟軍內部通訊不暢，德軍9艘E艇成功在萊姆灣突襲盟軍T-4護航隊，擊沉2艘、重創1艘LST登陸艦，造成至少749人喪生，成為諾曼第登陸前盟軍單次傷亡最慘重事件。此次慘痛教訓迫使盟軍統一通信頻率，保證了諾曼第登陸時指揮協調。
event_intro_497=婆羅洲戰役是盟軍在西南太平洋戰場的收官之戰。1945年5月1日至7月21日，澳大利亞第1軍分階段實施打拉根、文萊灣及巴釐巴板登陸，旨在奪取油田與機場以切斷日軍燃料供給。然而盟軍戰前轟炸摧毀導致島上基礎設施嚴重受損，加之戰役發起時日軍主力已戰略收縮，最終實際軍事效益有限。
event_intro_498=為奪取南太平洋戰略主動權，日軍決定啟動MO作戰，從海上進攻莫爾茲比港。美軍在破獲情報後，派出第17、第11特混艦隊攔截。於是，1942年5月4日史上首次航母對決——珊瑚海海戰爆發。此戰，美軍擊沉掩護登陸部隊的輕型航母祥鳳號，重創翔鶴號；日軍則擊沉列星頓號，重創約克城號。戰術層面雙方損失相當，但盟軍成功粉碎日軍作戰目標，獲得戰略勝利。
event_intro_499=1940年5月10日，德軍啟動“曼施坦因計劃”，以B集團軍群佯攻荷蘭與比利時中部，A集團軍群主力穿越阿登森林直插盟軍防線薄弱處。盟軍按“D計劃”將法軍第1集團軍群與英國遠征軍前推至迪勒河-佈雷達防線，但德軍第19裝甲軍5月14日突破色當後急速西進，成功將35萬盟軍合圍。比利時國王利奧波德三世在交通樞紐盡失、防線崩潰後，於5月28日單方面投降。
event_intro_4100=1942年5月12日，蘇軍發動第二次哈爾科夫戰役試圖擴大冬季反攻成果，初期推進至哈爾科夫城郊，但因南翼防禦薄弱，5月17日遭德軍“腓特烈行動”南北夾擊。三日內24萬蘇軍被合圍，至5月28日損失超20萬人，導致南線崩潰。此敗局使德軍得以在6月發動'藍色行動'直撲高加索，成為蘇德戰場戰略轉折的關鍵誘因。
event_intro_4101=1941年5月15日，英軍突襲利比亞塞盧姆防線，短暫佔領哈法亞山口與卡普佐要塞。然而，德軍迅速增援並發動反擊奪回了要塞，並在5月27日重新佔領哈法亞山口，導致盟軍必須通過“戰斧行動”重新攻佔哈法亞山口。
event_intro_4102=1941年5月20日，德軍發動史上首次大規模空降作戰“水星行動”，旨在奪取克里特島以阻斷盟軍對巴爾幹地區的空襲威脅。約1.3萬德軍空降兵與山地師強攻島內三處機場，遭英聯邦及希臘守軍頑強抵抗。此戰，德軍雖達成戰略目標，但空降兵傷亡慘重導致後續停止使用同類行動，卻為盟軍後續空降作戰提供關鍵經驗。
event_intro_4103=1940年5月22日，德軍第10裝甲師圍攻加萊。4000名守軍死守古城，與德軍纏鬥至26日。除了200名傷兵撤離，其餘部隊全部戰死或被俘。此戰成功抵抗牽制德軍三天，使敦刻爾克防線得以鞏固，為後續“發電機行動”創造了時間窗口。
event_intro_4104=1940年5月，德軍憑藉修訂版“黃色方案”突破色當防線，將盟軍北翼30餘萬人合圍於佛蘭德斯地區。為了避免被德軍圍殲，5月26日，盟軍啟動“發電機行動”，在9天時間裡成功從敦刻爾克緊急撤離33.8萬人，為後續反攻保留了火種。
event_intro_4105=1940年5月28日，德軍完成對里爾法國第1軍團4萬人的合圍。里爾守軍頑強抵抗，甚至在激戰中俘獲一名德軍中將，直至6月1日才最終投降。這場戰役有效牽制了德軍7個師的兵力，為敦刻爾克大撤退爭取了寶貴時間，使盟軍得以多撤離至少10萬人。
event_intro_4106=1942年5月31日至6月8日，日軍為切斷澳大利亞與美國的戰略物資運輸線，派遣潛艇部隊對雪梨港發動多輪突襲，重點攻擊盟軍艦船。儘管日軍在9天攻勢中僅擊沉1艘海軍補給艦，但此次襲擊意外促使澳軍方全面升級港口防禦體系，為太平洋戰場後期作戰提供了防禦經驗。

dialogue_3016=你們以為，進攻是勇氣的體現，但真正的勇氣，是在知道敵人就在眼前時，仍能保持冷靜的射出每一顆子彈。
dialogue_3017=敵人的數量與力量固然強大，但我們的意志遠比他們更為堅韌。在這片我們捍衛的土地上，每一寸都承載著芬蘭的驕傲與尊嚴。
dialogue_3018=他們的防線看似穩固，但我們有我們的決心和信念。我們並非站在撤退的邊緣，而是站在歷史的起點！
dialogue_3019=我們的計畫遇到了意想不到的阻力，我們必須考慮調整戰略，避免陷入長期作戰。
dialogue_3020=英法說會保護我們，蘇聯說不會侵犯我們，這真是個笑話。
dialogue_3021=蘇波互不侵犯條約在蘇聯人面前就像是一張廢紙。他們比德國人更狡猾，等到我們西線崩潰時，他們才從背後捅刀。
dialogue_3022=感謝蘇聯人重新定義了“互不侵犯”的標準——他們不會攻擊我們，直到他們想攻擊為止。未來還會有人相信蘇聯人口中的“和平”嗎？
dialogue_3023=法國人花了十年建造的防線，我們只用了十天繞過它。
dialogue_3024=所有的戰術預案都沒有考慮過這種情況……我們被徹底欺騙了，我們一直在防守錯誤的地方！
dialogue_3025=我們已經失去了時間，不能再失去勇氣。全體部隊立即集結，穩住陣線。我們必須拖住他們，我們仍然能戰鬥，法蘭西不會輕易倒下！

