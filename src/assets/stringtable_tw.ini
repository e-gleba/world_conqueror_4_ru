legend_army_5=勒克萊爾師

legend_stage_50101=庫夫拉突襲
legend_stage_50102=拳擊手行動
legend_stage_50103=法萊斯合圍
legend_stage_50104=巴黎解放
legend_stage_50105=棟派爾戰役
legend_stage_50106=斯特拉斯堡衝刺

legend_intro_50101=勒克萊爾師，開端自一個男人執著的愛國熱忱。1940年，勒克萊爾抵達北非，成功勸服查德總督，成立了“勒克萊爾縱隊”。為了給自由法國打出聲勢，1941年，勒克萊爾帶領部隊橫跨沙漠突襲了義大利控制的利比亞-庫夫拉機場。在佔領了庫夫拉機場後，勒克萊爾帶領士兵在機場立誓，必將國旗揚于斯德拉斯堡。這就是這段傳奇的起源。
legend_intro_50102=由於自由法國在北非的數次軍事勝利，“勒克萊爾縱隊”聲名也獲得更多的認可。於是，1943年，“勒克萊爾縱隊”獲得增援，加入英第八集團軍參與了突尼斯戰役。在梅德甯戰役和馬雷斯防線戰役中，面對德軍裝甲部隊的輪番進攻，勒克萊爾縱隊成功抵擋。後來，“勒克萊爾縱隊”跟隨盟軍一路打入突尼斯，終結了北非戰役。
legend_intro_50103=北非戰役後，“勒克萊爾縱隊”改編為法國第2裝甲師，依舊由勒克萊爾帶領，又稱為“勒克萊爾師”。該部隊於1944年開往法國，開啟兌現誓言的征途。在法萊茲包圍戰中，第2裝甲師跟隨巴頓的第3軍從南部合圍德軍，幾乎摧毀德軍第9裝甲師和其他單位的實力，為解放法國打下了堅實的地基。
legend_intro_50104=法萊斯包圍戰結束後，“勒克萊爾師”的位置就已經相當接近巴黎了。為了儘快解放巴黎，勒克萊爾強硬請求盟軍高層允許向巴黎進軍，在政治斡旋後獲得同意。勒克萊爾馬上前往已經開始起義的巴黎。8 月 24 日，“勒克萊爾師”在城內起義軍的配合下攻入巴黎。城內的德國守軍在盟軍的壓力下，於25日投降。自此，自由的旗幟重新飄揚在巴黎上空。
legend_intro_50105=收復巴黎後，勒克萊爾師被安排加入阿爾薩斯-洛林地區的收復行動。9月初，缺乏經驗的德軍第 112 裝甲旅遭受了第 2 裝甲師在美國空中支援下的一系列伏擊。法軍裝甲師和美軍轟炸機聯合摧毀了德軍旅的大部分部隊，傷亡很少。德軍被迫撤退，推遲了原定的洛林反攻。
legend_intro_50106=11月22日，得到盟軍指揮部的肯首，法國第2裝甲師和法國第1集團軍一起向斯特拉斯堡發起進攻。第 2 師強行突破薩韋爾訥峽並大膽推進，破壞了德軍在阿爾薩斯北部的防禦，並於 1944 年 11 月 23 日解放了斯特拉斯堡。兌現了“庫夫拉誓言”。

synergy_tactics_5_1=・所有“勒克萊爾師”單位發起攻擊後，為周圍2格內“勒克萊爾師”單位賦予“復國誓約”1回合；復國誓約：不會進入混亂狀態。
synergy_tactics_5_2=・戰鬥鼓舞：“勒克萊爾師”裝甲單位在“復國誓約”狀態下主動擊殺敵軍後，周圍2格內“勒克萊爾師”單位士氣上升1個等級，每單位1回合1次。
synergy_tactics_5_3=・內外策應：“勒克萊爾師”火炮單位在“復國誓約”狀態下，攻擊城市或堡壘時，若攻擊目標周圍1格存在“勒克萊爾師”步兵或裝甲單位，傷害提升10%。
synergy_tactics_5_4=・援護追擊：“勒克萊爾師”步兵單位在“復國誓約”狀態下發起攻擊後，2格範圍內的“勒克萊爾師”部隊本回合移動力+5。

dialogue_4204=法國本土已經陷落於德國手中，我們終有一日，將光復我們的祖國。
dialogue_4205=義大利在庫夫拉有軍用機場，我們需要佔領它。向世界證明法國的不屈。
dialogue_4206=意軍部隊謹守堡壘，並嘗試聯繫援軍支援。
dialogue_4207=敵軍的兵力收縮進堡壘了。保持壓制，不能讓他們聯繫到援軍。
dialogue_4208=意軍放棄抵抗，與法軍協議投降。之後，勒克萊爾在庫夫拉立下了“庫夫拉誓言”。
dialogue_4209=我宣誓：只有當我們的旗幟，我們美麗的旗幟，飄揚在斯特拉斯堡大教堂上空的那一天，才放下武器。
dialogue_4210=接到消息，德軍第9裝甲師明日會通過克薩爾·吉拉內發起攻擊。我建議你部後退80公里避免打擊。
dialogue_4211=不行，現在撤退容易在撤退途中被追擊。我部會依託現有陣地防守，但需要空軍支援。
dialogue_4212=追擊，不能讓他們輕易逃脫！
dialogue_4213=來了，到有效射擊距離再發動進攻。
dialogue_4214=做的好！接下來會有一批部隊經過。掩護好他們的側翼，和他們一起襲擊特巴加隘口。
dialogue_4215=特巴加隘口失守？迅速撤退，不能落入敵人的包圍圈。
dialogue_4216=向北推進到阿讓唐，與加拿大軍會合，將德軍封死在口袋裡！
dialogue_4217=前進！解放我們更多的領土！
dialogue_4218=把第352步兵師調到阿朗松，阻止盟軍繼續推進。
dialogue_4219=成功佔領阿朗松，德軍重要補給基地被佔領，德軍放棄反擊計畫轉入防禦。
dialogue_4220=把第116裝甲師調到阿讓唐，保護好我們的撤退出口。
dialogue_4221=波蘭第1裝甲師成功在奧爾梅爾山脊建立陣地，封堵了德軍的最後出口。
dialogue_4222=指揮權已轉移給我。B集團軍群聽令：捨棄陣地，向東撤退。援軍會全力接應。
dialogue_4223=在法軍積極爭取後，盟軍最終允許法國第2裝甲師和美國第4步兵師一同行動，支援巴黎的起義軍，防止再次出現華沙起義的慘劇。
dialogue_4224=不用等美軍了，迅速突進！巴黎的起義軍已經開始行動了。我們不能讓他們孤立無援！
dialogue_4225=勒克萊爾師抵達巴黎郊外，與巴黎起義軍獲取了聯繫。
dialogue_4226=擊潰郊區防線，給德軍示威！告訴巴黎的人民，我們來了！巴黎將重獲自由！
dialogue_4227=第4步兵師迅速向巴黎推進，不能讓法國人獨佔這份功勳。
dialogue_4228=德國守軍接到總部命令，要求他們死守巴黎。巴黎如果不變成一堆廢墟，就決不能落入敵人手中。
dialogue_4229=這就是讓我們陪葬！先拖住那個瘋子。回電總部：我們會遵照執行。
dialogue_4230=我們要和盟軍談投降條件。我們不能為了別人送死！
dialogue_4231=德國巴黎守軍最終和盟軍談判投降，巴黎城內戰鬥結束。郊外守軍未知曉消息，依然與盟軍交戰。
dialogue_4232=巴黎曾被羞辱！巴黎橫遭摧毀！巴黎飽受折磨！但巴黎終於自由了！
dialogue_4233=接到消息，敵軍派來了精銳裝甲旅支援米爾庫。我們要儘快前往棟派爾阻擊援軍。
dialogue_4234=米爾庫的情況岌岌可危，我們必須迅速支援前線。
dialogue_4235=維泰勒的德軍來阻止我們了，必須儘快解決。不然援軍趕來我們就陷於不利之地。
dialogue_4236=我們搶在援軍到來之前，佔領了棟派爾。通知空軍準備空襲支援，我們要在這裡殲滅敵軍。
dialogue_4237=我們來遲了，迅速支援米爾庫不能讓美軍被內外夾擊。
dialogue_4238=就是現在，開火！
dialogue_4239=尋找掩體，自由反擊！
dialogue_4240=我們已經被包圍了。拋棄坦克，全力撤退！
dialogue_4241=繼續進攻，消滅摩澤爾河西岸德軍。
dialogue_4242=斯特拉斯堡近在眼前，誓言即將兌現。戰士們，奮戰吧！法國萬歲！
dialogue_4243=孚日山脈被重兵把守，我們需要找到一條無人把守的小道突破到後方。
dialogue_4244=後撤入孚日山脈。他們無法通過！
dialogue_4245=他們是怎麼闖過孚日山脈的！
dialogue_4246=把難啃的骨頭丟給美軍，全力向斯特拉斯堡衝刺！
dialogue_4247=電告斯特拉斯堡，孚日山脈被突破，務必做好防守！
dialogue_4248=斯特拉斯堡解放了！我們完成了我們的誓言！
dialogue_4249=拿下周圍據點，斯特拉斯堡不容有失！
dialogue_4250=維持住對孚日山脈的壓力，不能讓德軍支援後方！
dialogue_4251=義大利援軍開始行動。
dialogue_4252=克薩爾·吉拉內那邊肯定氣氛緊張了。那個老好人勒克萊爾，他真是個好人。但現在一切都結束了，我們再也見不到他了。
dialogue_4296=敵軍搶佔了全部的制空權。這裡無法堅守，迅速撤離。
dialogue_4297=義大利守軍放棄求援，堅守堡壘。
dialogue_4298=加大火力，擊碎他們的抵抗意志！
dialogue_4299=巴黎的德軍守軍向盟軍投降，城市獲得解放；但郊外德軍因未獲知消息，仍在與盟軍交戰。



