armygroup_event_desc_68=黑蠍在美國的一系列行動被相繼挫敗，全軍大舉向南撤退。多個國家在美蘇的幫助下脫離了黑蠍的控制。
armygroup_event_desc_69=奧斯本同時啟動了5個信標增幅器，開啟了最終倒計時。在20個週期後，任何意志不堅定的人都會重新加入黑蠍。美蘇英法分別派出各自的精銳部隊，聯合周邊國家準備佔領各地黑蠍的遺跡。
armygroup_event_desc_70=黑蠍在墨西哥的遺跡太陽要塞被攻破，信標增幅器被佔領。全球各處秘密基地的位置被全部揭示，黑蠍在戰略層面陷入了全面被動。
armygroup_event_desc_71=黑蠍在哥倫比亞的遺跡回聲地堡被攻破，信標增幅器被佔領。遺跡中的各項設施已被自行銷毀。但殘留的訪問記錄顯示該設施的重啟時間點為1933年。
armygroup_event_desc_72=黑蠍在巴西的遺跡印加之眼被攻破，信標增幅器被佔領。許多特殊的武器裝備沒來得及轉移或銷毀，甚至還有一些從未見過的新式軍備設計圖。
armygroup_event_desc_73=黑蠍在巴西的遺跡星軌神殿被攻破，信標增幅器被佔領。美蘇繳獲了大量的加密資料，黑蠍在世界各地的人員名單和軍事部署已完全被揭露。
armygroup_event_desc_74=黑蠍在巴西的遺跡颶風燈塔被攻破，信標增幅器被佔領。黑蠍主力部隊與世界各地其他黑蠍成員間的通訊被暫時阻斷。
armygroup_event_desc_75=黑蠍勢力再次迅速發展壯大，美蘇雙方為根除這一威脅決定聯手。華約與北約暫時停戰，結成了新的軍事同盟。
armygroup_event_desc_76=奧斯本被徹底擊敗，倒計時停止。黑蠍在南美洲的計畫被徹底挫敗。
armygroup_event_desc_77=黑蠍的全部遺跡設施均被佔領，倒計時停止。黑蠍在南美洲的計畫被徹底挫敗。
armygroup_event_desc_78=奧斯本被徹底擊敗，倒計時停止。黑蠍在南美洲的計畫被徹底挫敗。所有人都聽到了自由的召喚。
armygroup_event_desc_79=黑蠍的全部遺跡設施均被佔領，倒計時停止。黑蠍在南美洲的計畫被徹底挫敗。所有人都聽到了自由的召喚。
armygroup_event_desc_80=最後殘餘的信標增幅器已經調試完畢。由於黑蠍長期在控制區暗中投放含有Q30物質的納米藥物。鐘聲響起，受到藥物影響的人自主意識逐漸被抑制，最終重新加入黑蠍。
armygroup_event_desc_81=瑪雅遺跡中發現了新的水晶頭骨。它們並非普通文物，而是記錄著神廟資訊與未知文明歷史資料的存放裝置。
armygroup_event_desc_82=新施瓦本集團軍攜帶著黑蠍的軍事裝備在南美叢林中現身。也許是他們與黑蠍達成了軍事合作，又或者黑蠍就是他們存在的原因。
armygroup_event_desc_83=蘇聯向委內瑞拉交付了大量坦克，試圖建立裝甲防線以抵禦美軍及其盟友的進攻。
armygroup_event_desc_84=黑蠍武裝海盜，使其在多個海域大肆劫掠各國商船。此舉激起了美蘇的報復。通過進一步強化海軍的裝備，各國艦隊聯合對海盜進行了全面的清剿。
armygroup_event_desc_85=黑蠍的海軍部隊利用“聲波迷霧”干擾雷達系統，不斷地襲擾巴拿馬運河周邊的航線。各國軍隊的補給線均受到了一定程度的影響。
armygroup_event_desc_86=美國通過哥倫比亞和秘魯向巴西秘密空運導彈部件，這條線路成功地避開了黑蠍與蘇聯的視線。
armygroup_event_desc_87=古巴再次遭到了襲擊，地區平衡被再度打破。與此同時，蘇聯在短時間內向古巴提供了大規模的軍事援助。
armygroup_event_desc_88=美國在加勒比海東部海域部署了大規模的聲呐陣列，監視蘇聯潛艇。
armygroup_event_desc_89=蘇聯測試地殼震盪原型機引發智利、玻利維亞與阿根廷交界地區地震。因極強的不可控性，該武器的研究最終被終止。
armygroup_event_desc_90=蘇聯在古巴測試氣象武器“風暴之眼”，成功引導了颶風襲擊佛羅里達。
armygroup_event_desc_91=黑蠍控制區的各國中陸續出現了反黑蠍組織建立的電臺。這些電臺不斷通過廣播號召佔領區的人民團結起來，推翻黑蠍的統治。
armygroup_event_desc_92=為阻止美蘇間諜衛星對南美地區的全面偵查，黑蠍在各大洋的島嶼上建立起干擾站，從而對信號進行干擾與劫持，竊取美蘇的衛星資料。
armygroup_event_desc_93=英軍在百慕大地區發現了二戰期間的德軍核動力潛艇鸚鵡螺號。這艘U艇與美軍之後建造的鸚鵡螺號完全不同。雖建造于二戰期間，但艦艇仍完好無損，船內設備的技術水準遠超二戰時期，甚至超越現代。
armygroup_event_desc_94=巴西的雨林發現巨型油田，美、蘇、黑蠍在秘魯-巴西邊境針對開採權開始了激烈的爭奪。
armygroup_event_desc_95=黑蠍勢力被驅逐出北美後，美軍利用黑蠍設施的技術重啟了費城實驗。新的驅逐艦埃爾德里奇號再次從眾人眼前消失。
armygroup_event_desc_96=蘇聯在玻利維亞建造“地球望遠鏡”探測地心，意外打通連接地幔的通道，成功開採了地下蘊藏的豐富資源。
armygroup_event_desc_97=亞馬遜河流域突然爆發了黃熱病，各國部隊戰鬥力因此下降。但黑蠍與美蘇軍隊中均未出現感染病例。

