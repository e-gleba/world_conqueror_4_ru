stage_intro_10001=我將在本關為您介紹：單位的移動和攻擊，單位的建造，為單位指派將領，撤回指令以及如何獲得勝利。
stage_intro_10002=我將在本關為您介紹：士氣對部隊的影響，防禦防空設施的建造，如何佔領城市，建設地標建築，以及查看城市資訊。
stage_intro_10003=我將在本關為您介紹：地形的影響，戰機的使用，核彈的生產，導彈的使用，以及海上作戰。
stage_intro_10004=我將在本關為您介紹：精英部隊的技能，綠圈（次要關鍵點）和撤離點的功能。
stage_intro_10101=最高統帥部已經決定向波蘭發起進攻。統帥部要求您和您的軍隊必須以最快的速度突破波蘭的邊境並取得勝利。我們期待著您勝利的消息。
stage_intro_10102=根據最新的情報，最高統帥部認為英國可能會進軍挪威，並威脅到我國的鐵礦供應。統帥部要求您以“威瑟河演習”的名義向挪威和丹麥派遣軍隊，必須確保帝國所需資源掌握在我們自己手中。
stage_intro_10103=為了徹底擊敗法國，統帥部將此次戰役的最終目標定為法國的首都--巴黎。法國人修建了堅固的馬奇諾防線，它是這次我們進攻法國的最大障礙，但是只要繞過它，法國的防禦將變得形同虛設。
stage_intro_10104=法國已經投降，英國目前成為了帝國最大的敵人。它的存在會讓我們無法安心向東進軍。最高統帥部命令您橫渡英吉利海峽，將英國徹底擊敗。解除他們對歐洲大陸的威脅。
stage_intro_10105=近期英國海軍在地中海的活動愈加頻繁，這不但影響著我們北非的作戰計畫，而且還威脅著我國的領土安全。首相命令您重新奪回我們對地中海的控制權。這對我國和我們的盟友都有著十分重大的意義。
stage_intro_10106=盟友節節勝利的消息給了首相很大的信心，他決定重現羅馬帝國的雄風。根據首相的擴張政策，我們將首先向巴爾幹半島展開軍事行動，我們的盟友羅馬尼亞和保加利亞會協助我們。首相希望獲得您勝利的消息！
stage_intro_10107=最高統帥部決定啟動“巴巴羅薩”計畫，這次計畫的最終目標是佔領蘇聯的首都莫斯科。在我們向東進軍時將繼續使用“閃電戰”，用最快的速度擊敗蘇聯。帝國將在蘇聯獲取豐富的石油和大量勞動力，這些是我們迫切需要的資源。
stage_intro_10108=盟軍的進攻阻礙了我們佔領蘇伊士運河以及亞歷山大港的進程。同時我們的補給也變得非常緊張。我們必須擊退盤踞在那裡的盟軍，切斷他們的補給線。這樣一來我們就可以控制整個北非地區。
stage_intro_10109=列寧格勒是蘇聯最重要的城市之一，最高統帥部認為其重要性甚至要高於莫斯科。奪取這座城市，對帝國有著巨大的戰略意義。統帥部調集了整個北方集團軍參戰，而且芬蘭軍團會在側面配合我們的行動。
stage_intro_10110=保盧斯將軍的第6集團軍陷入了蘇軍的重重包圍中。最高統帥部命令您立刻！馬上！不惜一切代價進行救援。統帥部已經調集周邊軍隊前來增援，希望在救援成功的同時，取得對史達林格勒的控制權。
stage_intro_10111=“巴巴羅薩”計畫的部分失敗是我們低估敵軍造成的。最高統帥部認為這並不影響帝國征服整個歐洲的進程。現在帝國距離征服歐洲只有一步之遙，佔領莫斯科！完成“巴巴羅薩”計畫最後未完成的部分。
stage_intro_10201=德軍機械化部隊的快速攻勢使得盟軍的防線幾乎崩潰。目前聯軍的主力被德軍包圍在了敦克爾克，身後的英吉利海峽是我們唯一的退路。指揮部下達命令，不惜一切代價抵擋德軍的進攻，為主力部隊撤退贏得時間。
stage_intro_10202=敦克爾克的撤退讓我們幾乎丟失了所有的重型裝備，這使得我們在德軍的瘋狂進攻下疲于防守，根本無力反擊。指揮部已經將僅剩的精良裝備移交給了您和您周邊的部隊，你們是不列顛最後的希望。
stage_intro_10203=我們擊沉了多艘德軍前往突尼斯的補給艦，如今在北非的德軍缺乏足夠的補給，這是我們把德軍徹底趕出北非的好機會。但是突尼斯地形複雜，並且德軍已經建立起非常完備的防線，這場戰鬥沒有想像中的那麼輕鬆。
stage_intro_10204=北非的軸心國部隊已經被我們擊敗，現在只有讓義大利徹底退出戰爭，才能使地中海徹底在盟軍的控制中。指揮部已經下令，要求您和您的部隊進攻西西里島，這將是盟軍解放歐洲大陸的第一步。
stage_intro_10205=司令部獲得情報顯示，德軍已經集結了大量的火炮和坦克，他們即將要對我們發動一次大規模的進攻。毫無疑問這次戰役將影響今後的形勢，這對您來說是一次巨大的考驗，為了祖國我們需要贏下這場戰役！
stage_intro_10206=德軍的電臺總是宣稱他們是不可戰勝的。但是在我們一連串的勝利面前，這一切都顯得十分可笑。司令部命令您奪回基輔，為了減少部隊的傷亡，我們會用密集的炮火掩護您的進攻。
stage_intro_10207=我們的先頭部隊已經到達白俄羅斯地區，這次要將我國境內的德軍完全消滅。德國正調動後備部隊，補充他們在前期作戰中損失的兵力，您最好趕在他們援軍到達之前突破他們的防線，解放祖國全部的領土。
stage_intro_10208=為了儘快結束戰爭，我們必須在歐洲開闢新的戰場。指揮部最後將進攻地點定在敵人意想不到的諾曼第方向。為了這次登陸作戰我們準備了很久，這將是您一生中參與的最龐大的戰役。
stage_intro_10209=我們的行動已經取得了階段性的勝利，指揮部的最新命令要求您和您的部隊收復法國南部的全部領土，徹底消滅仍在法國抵抗的德軍，讓南部的港口重新運作起來，這將對戰局起到至關重要的作用。
stage_intro_10210=為了能夠直接跨過萊茵河，讓柏林徹底暴露在盟軍的面前，指揮部決定實施一次大規模的空降行動。但德軍一定不會輕易放棄最後的天然屏障。因此行動一旦開始，您和您的部隊將行走在地獄的邊緣。
stage_intro_10211=德軍正在集結它最後的力量，用於保衛他們的首都柏林。雖然盟軍兵力遠遠超過德軍，但是陷入絕境的德軍必定會誓死反抗。指揮部希望您趕在其他國家之前率先佔領柏林。
stage_intro_10301=美國的太平洋艦隊是帝國擴張最大的障礙，它必須被消滅。我們即將執行東京大本營制定的奇襲計畫，目標是美國的珍珠港海軍基地。帝國的航母編隊將會在海上為您提供幫助。攻佔夏威夷，消滅太平洋艦隊。
stage_intro_10302=英國在德國的攻擊下已經無暇顧及他在亞洲地區的利益。為了能夠獲得更多的資源，大本營命令您進攻英國殖民地馬來半島，並攻佔新加坡。小心英國的皇家艦隊，他們擁有強大的火力。
stage_intro_10303=英軍在當地人的幫助下修建了一條公路，他們通過這條公路獲得了源源不斷的物資。為了更好地對抗英國，大本營下令進攻緬甸，切斷他們的補給線路。奪取目標後，請務必堅守陣地，確保公路在帝國的控制之中。
stage_intro_10304=大本營已經將下一個目標鎖定在澳大利亞，但是在進攻澳大利亞之前，我們需要佔領周邊區域並建立一系列的防禦設施，切斷美國和澳大利亞之間的補給線。當我們的艦隊到達指定區域時，登陸作戰將正式開始。
stage_intro_10305=時機已經成熟了，現在就是進攻澳大利亞的最好時機。大本營要求您和您的軍隊從陸地發起進攻，佔領所有的沿海城市。帝國的海軍會從海上給予您全面的支援。注意，我們的兵力有限，必須減少不必要的損失。
stage_intro_10306=帝國進攻英帕爾地區的作戰計畫已經失敗，我們的部隊損失慘重。可是英軍依然追趕著我們。這隨時有可能演變成全線的大潰敗。大本營命令您就地建立防線，抵擋他們的進攻。
stage_intro_10307=德國和蘇聯的戰爭已經進入了最後階段，為了能儘快擊敗蘇聯，德國希望我們能在遠東地區向蘇軍發起攻擊，有效地牽制西伯利亞的蘇軍主力。請注意，我們無法和蘇軍強大的裝甲部隊抗衡。
stage_intro_10308=為了配合德國人進攻北美，大本營決定首先向加拿大發動進攻。這是我們實施的最遠距離的海上行動。您的艦隊需要突破加拿大的海岸防線。小心美國人！不能讓他們發現，否則我們會腹背受敵！
stage_intro_10309=帝國在之前的作戰中取得了輝煌的戰果，但是強大的美國依然沒有被擊敗。根據情報，美國人已經研發出了一種威力巨大的武器，這種武器很有可能會改變戰爭的結果。大本營決定立刻進攻美國本土，時間對我們來說已經不多了。
stage_intro_10401=日軍突襲了珍珠港，這種行為無異於是對我們的宣戰。我們的機場已經被炸毀，停泊在港內的艦船也徹底無力作戰。現在只能依靠在外巡邏的艦隊，這是我們最後的希望。
stage_intro_10402=帝國的部隊在馬來半島遭到了日軍的重創，這絕對是英國史上最大的災難。如今日軍正計畫對新加坡展開新一輪的攻勢，這是指揮部無法容忍的。組織反擊，皇家海軍一旦到達便會立刻加入戰鬥。
stage_intro_10403=技術人員通過破解日本人電報的密碼，得知日軍將要進攻中途島的計畫。指揮部命令您在援軍到達前守住中途島。我們的航母編隊已經以最快的速度趕來支援，希望你能做好充足的準備。
stage_intro_10404=指揮部命令您的部隊進攻瓜達爾卡納爾島，佔領那邊的日軍基地。如果我們控制了那裡，空軍就能夠空襲南太平洋日軍所有的軍事基地，為反攻菲律賓做好準備。相信麥克亞瑟將軍已經等不及那一天的到來了。
stage_intro_10405=日本人企圖奪取英帕爾的計畫已經失敗，盟軍決定乘勢向他們發動反攻。指揮部命令您在雨季過後就向緬甸的日軍發動進攻。日本人正在被疾病折磨，這是進攻的最佳時機。
stage_intro_10406=全面反攻已經開始。這次麥克亞瑟將軍建議我們攻佔菲律賓，阻斷日軍的運輸線路並實現他當初的諾言。指揮部已經採納了他的建議，並且命令您配合麥克亞瑟將軍一起完成這次行動。
stage_intro_10407=為了能夠讓我們的“空中堡壘”有效地轟炸日本本土，司令部命令您佔領硫磺島，奪取日軍的空軍基地。請注意！日軍已經在島上建造了龐大的防禦工事，這會讓我們前進的每一步都付出巨大的代價。
stage_intro_10408=美軍即將對日本本土發動最後的進攻，但我們依舊被眼前的這支敵軍拖在這裡，這是司令部無法容忍的事情。您必須儘快消滅這支部隊，然後趕在美軍之前對日本本土發起進攻，留給我們的時間已經不多了。
stage_intro_10409=雖然我們的超級武器對日本造成了毀滅性的打擊，但是日本仍然拒絕投降。指揮部決定進攻日本本土。這將是一場艱苦的戰鬥，強行登陸日本會給我們造成巨大的傷亡。蘇聯將從北方同時發起進攻，但是他們的目標可能不僅僅是日本……
stage_intro_10501=北約的艦隊出現在了印度洋，司令部認為他們想要進入波斯灣，從那裡對我們在高加索地區的油田發動攻擊。擊退他們，我們部署在中東地區的部隊可以為此次行動提供有效的幫助。
stage_intro_10502=北約對我們在高加索地區的油田覬覦已久。據情報顯示，敵人開始在土耳其境內集結，妄圖對我們的油田發動攻擊。司令部命令您帶領部隊前往高加索地區，消滅那裡的北約部隊，並向土耳其進軍。
stage_intro_10503=北約不會眼睜睜地看著我們佔領土耳其，他們開始在地中海集結艦隊，想要阻止我們在土耳其的軍事行動。佔領土耳其，然後消滅北約艦隊，司令部認為這是徹底控制地中海區域的最好機會。
stage_intro_10504=北約認為我們在北非及地中海區域的活動侵佔了歐洲各國的利益，因此，在美國的引導下，西歐各國組成了聯盟想要對我們發動進攻。形勢對我們非常不利，我們將要面對的，是來自整個歐洲的力量。
stage_intro_10505=在失去了歐洲的盟友之後，美國把目光投向了亞洲，想要在亞洲發展新的盟友和勢力。一旦他們在亞洲發展出新的羽翼，會對我們造成更大的威脅。因此司令部希望您進攻美國的西海岸，切斷他們和亞洲往來的路線。
stage_intro_10506=在取得多次對北約作戰的重大勝利後，我們的勢力已經遍及歐洲、亞洲和非洲。美國是我們最後的目標，只要擊敗美國，我們將贏下整場戰爭。您將要面對的是無論科技還是軍事，都是這個世界上最強大的國家。
stage_intro_10601=蘇聯在東線戰場將德國徹底擊敗之後萌發了更大的野心。很顯然他們想趁歐洲各國元氣大傷的時候獲取更多的利益。目前在歐洲還沒有任何國家能和強大的蘇軍抗衡，因此您必須聯合歐洲其他各國，阻止蘇聯的擴張。
stage_intro_10602=朝鮮半島爆發了全面戰爭，南韓的首都首爾已經淪陷。這已經對我們在亞洲的利益造成威脅。指揮部已經接受了麥克亞瑟將軍的提議，我們的增援部隊將在朝鮮半島的仁川登陸。請時刻保持警惕，我們的敵人不會只有北韓的軍隊。
stage_intro_10603=根據情報顯示，蘇聯近期在古巴和加勒比海附近部署了大量的導彈，這對我國的本土安全造成了巨大的威脅。指揮部已經下令，要求您立刻率領部隊前往古巴，消滅那裡的駐軍並佔領導彈發射井。
stage_intro_10604=蘇聯為了奪取中東的石油已經封鎖了蘇伊士運河，這樣的行為無疑將影響到我們在地中海及中東地區的部署。指揮部要求您聯合我們的英國盟友支援中東地區，將蘇軍趕出中東地區並讓蘇伊士運河恢復通航。
stage_intro_10605=根據情報，蘇軍已經在短短數周內向波蘭地區調動了上萬輛坦克。指揮部認為離蘇軍發起全面進攻的時間已經不遠了，我們必須採取行動支援歐洲。指揮官閣下，您將要面對的是一部強大的戰爭機器。
stage_intro_10606=雖然我們擊敗了蘇聯，但是蘇聯投降得如此乾脆不禁讓我們產生了懷疑。情報組織調查發現，蘇聯很早之前就在南極秘密地進行新式武器的研發工作。指揮部命令您前往南極尋找他們，他們的新武器時刻威脅著我們。
stage_intro_10701=我們在中東地區的油田遭到了攻擊並且已經被佔領，這讓國際油價上升到了前所未有的高度。指揮官閣下，雖然在敵情不明的情況下貿然進攻可能會造成非常嚴重的後果，但是現在我們必須立刻奪回這些油田，否則將會有更多的國家陷入危機之中。
stage_intro_10702=在不明勢力的瘋狂進攻下，歐洲的情況已經非常糟糕。作為世界經濟的中心，歐洲有理由，也必須儘快恢復和平。指揮官閣下，帶領部隊前往歐洲，將那裡的不明勢力徹底消滅。
stage_intro_10703=在西歐遭遇失敗後，他們開始將自己的軍隊向東轉移。這對經濟近乎崩潰的蘇聯來說無疑是巨大的危機。指揮官閣下，蘇聯絕不能被敵人擊敗，他將是我們日後反擊敵人的重要力量之一。
stage_intro_10704=北美地區是最早也是受到攻擊最嚴重的地區之一，紐約更是敵人重點攻擊的對象。如今歐洲戰場的勝利使得紐約的壓力減小了許多。指揮部決定趁此機會進行反擊，把敵人從自由的土地上徹底趕走。
stage_intro_10705=聯合國已經將不明勢力定義為恐怖分子，他們時刻威脅著我們的家園和親人，我們必須將他們在世界各地的勢力全部消滅。伴隨著不斷地勝利，我們將獲得越來越多的支援，消滅他們只是時間問題。
stage_intro_10706=西伯利亞有著豐富的物質資源，情報顯示恐怖分子在那裡建立了用作向亞洲各國進攻的秘密基地。指揮部認為這個基地必須被清除，但是西伯利亞惡劣的環境成為了他們的天然保護傘，這次行動可能比想像中的還要艱難。
stage_intro_10707=他們的行動比我們想像的要快很多，在西伯利亞基地被破壞之後，他們集中剩餘的軍隊向我們亞洲的多個基地發起了進攻。雖然他們的部隊數量並不多，但是剩下的都是精英，要對付這些孤注一擲的敵人會變得非常困難。
stage_intro_10708=我們跟蹤了從華盛頓撤退的恐怖分子，他們分散之後獨自行動，但最終都彙聚到了南美洲地區。指揮部已經確定那裡就是他們的大本營所在。指揮官閣下，決戰的時刻到了，為了世界的和平，消滅他們！
stage_intro_10709=我們太大意了，沒有想到這些恐怖分子居然利用了蘇聯遺留在南極的軍事基地，並且完成了蘇聯當初尚未成功的研發工作，這就是他們的技術來源。如今的南極基地在他們的經營下已經形同要塞，但是我們必須選擇進攻，這樣的技術絕對不能被恐怖分子所掌握。



;序章对话
;__font_type[font_text_]
stage_dialogue_1=指揮官閣下，在進入戰場前，您可以通過教學戰役來瞭解如何作戰。
stage_dialogue_2=我會詳細的告訴您關於作戰的每一個細節。
stage_dialogue_3=如果您已經熟悉如何作戰，也可以跳過這個部分。
stage_dialogue_4=最高指揮部已經下達了作戰命令，我們的軍隊正在源源不斷地向前線集合。敵軍目前無法適應我們新的戰術並節節敗退，相信未來帝國的版圖將不斷擴大。指揮官閣下，您即將在戰場上收穫屬於您的榮譽。
stage_dialogue_5=德軍的裝甲部隊已經繞過了馬奇諾防線，目前很多城市已經被敵軍佔領。指揮官閣下，德軍企圖對我們進行包圍，目前的局勢很危險。當前我們需要建立新的防線，希望您能帶領我們戰勝這些侵略者。
stage_dialogue_6=美國人雖然沒有對我們宣戰，但是他們對我國執行了物資禁運政策。相信用不了多久戰爭就無法維持下去了，我們必須主動向美國發起攻擊。指揮官閣下，唯有消滅美國的太平洋艦隊，我們才能生存下去，這關係著帝國的命運。
stage_dialogue_7=日本已始在遠東地區開展大規模軍事行動，他們已經佔領了我們盟友的很多領土。他們的下一個目標是整個太平洋區域。指揮官閣下，現在我們必須要阻止他們。總統已經下達了動員令，正義的力量必定會贏得勝利。
stage_dialogue_8=美國聯合了一些西歐國家組成了一個新的軍事同盟。很明顯這一切都是在針對我們。而他們的領導人也通過一次次的公開演說表達了對我們的敵意。指揮官閣下，總書記同志對他們的行為表示強烈的不滿。我們可以用一切手段回應他們，包括戰爭！
stage_dialogue_9=雖然戰爭已經過去很久，但是蘇聯的軍工廠一直在源源不斷的研發新式武器。蘇軍擁有全世界最多的坦克，一旦戰爭爆發，這些坦克會讓整個歐洲陷入恐慌之中。最近他們還將導彈部署到離我們很近的區域。指揮官閣下，您應該對我們的安全做些什麼。
stage_dialogue_10=他們起初還是一個小型組織的時候，並沒有引起各國領導人的的注意。
stage_dialogue_11=當世界經濟開始衰退,他們迅速崛起，利用宗教的名義招募了大量失業平民和退伍軍人。
stage_dialogue_12=他們從各國的軍火商那裡購入武器，同時還招募科技人員研發各種高科技裝備。
stage_dialogue_13=在隨後的數年內，他們通過一系列暗殺或者戰爭逐漸控制了很多國家和地區。
stage_dialogue_14=現在他們的勢力已經遍佈全球。指揮官閣下，各國的領導人已經決定聯合起來向他們宣戰。
stage_dialogue_15=只有擊敗他們，這個世界才會獲得真正的和平。




