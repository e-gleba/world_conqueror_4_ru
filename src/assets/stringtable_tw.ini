skill_name_144=聯合攻勢

skill_info_136=根據指揮精英部隊火炮等級，每一級提升造成傷害的[#00FF00#%d%%]轉化為HP回復。精英部隊火炮造成致命一擊傷害提高25%%
skill_info_137=指揮步兵時受到傷害降低[#00FF00#%d%%]，並且受到敵方攻擊後額外增加10%%減傷，持續1回合，最多疊加3次
skill_info_138=攻擊後自身有[#00FF00#%d%%]概率獲得“挑釁”狀態
skill_info_139=指揮裝甲部隊處於敵方領地時，自身和周圍友軍致命一擊傷害+[#00FF00#%d%%]
skill_info_140=攻擊使敵軍士氣低落和士氣衰落時，有[#00FF00#%d%%]概率再次攻擊。攻擊使敵軍士氣下降為混亂則100%%概率再次攻擊（對已混亂的敵軍不生效）
skill_info_141=指揮艦船攻擊後，有50%%概率給敵軍附加“顛簸”狀態，降低[#00FF00#%d%%]行動力，持續2回合。指揮企業號時，除戰鬥機外的其他空軍單位消耗減1
skill_info_142=指揮部隊觸發閃避後，回復自身HP上限的[#00FF00#%d%%]（一回合最多1次）
skill_info_143=指揮裝甲部隊在自身或友軍領地範圍內時，自身-[#00FF00#%d%%]受到傷害，受到敵方將領攻擊時，額外返還本次傷害的50%%
skill_info_144=指揮部隊攻擊後，目標和其周圍1格其他敵軍有[#00FF00#%d%%]機率添加追蹤標記，持續1回合。有追蹤標記的目標受到傷害提高20%%


