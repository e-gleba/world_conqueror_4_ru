dialogue_4000=快速繞過阿拉斯，我們要儘快佔據斯卡爾普河上的橋樑。第5裝甲師已經接到命令，很快就會來支援。
dialogue_4001=此時，法軍和英軍分別接到指令準備在阿拉斯發起一次反攻。
dialogue_4002=接通第25裝甲團，我需要他們停止自由搜索，配合師部行動。
dialogue_4003=點擊組編按鈕。
dialogue_4004=點擊想要組編的軍團。
dialogue_4005=點擊需要編入的單位。
dialogue_4006=點擊確認編入按鈕。
dialogue_4007=第25裝甲團聽令：謹慎前進、保全自己，等待步兵主力一起控制橋樑。
dialogue_4008=該死！敵人坦克的裝甲太厚了！通知前線，把88炮放平當反坦克炮用！
dialogue_4009=正面強攻？…這要付出代價的。但有時候，最直接的路線反而能打亂敵人所有算計！
dialogue_4010=法軍為掩護英軍右翼而向前推進,但因溝通不暢，把英軍也識別成敵軍。
dialogue_4011=衝突後，雙方確認了友軍身份，法軍繼續推進。
dialogue_4012=通知空軍，敵軍攻勢異常猛烈，我部需要轟炸支援！
dialogue_4013=敵軍正在撤退。全體追擊，拿下阿拉斯！
dialogue_4014=快速推進到涅曼河畔，搶佔阿利圖斯。
dialogue_4015=很好，守住阿利圖斯的橋樑，絕不能讓蘇軍奪回！
dialogue_4016=此時，蘇聯第5裝甲師正在迅速趕往阿利圖斯支援。其第一波先頭部隊即將抵達。
dialogue_4017=蘇第5裝甲師主力部隊抵達阿利圖斯。
dialogue_4018=阿利圖斯的情況我已瞭解，已通知空軍轟炸支援。你部務必守住阿利圖斯！
dialogue_4019=空軍偵察到阿利圖斯有大量部隊增援，優先攻擊涅曼河上游橋樑，逼迫敵軍分出部隊支援。
dialogue_4020=不愧是“幽靈師”！蘇軍援軍已潰，通知其他部隊，全力進攻，佔領涅曼河以西城鎮！
dialogue_4021=命令第3、第4裝甲集群從正面突破蘇軍防線，在維亞濟馬後側完成合圍。
dialogue_4022=從第19集團軍和第30集團軍的結合部突破，與第4裝甲集群在維亞濟馬後側會合。
dialogue_4023=調集第19、30、49集團軍的坦克部隊圍堵敵軍，不能讓他們繼續突破！
dialogue_4024=通知前線部隊放棄陣地，向後撤退，避免被敵軍包圍。
dialogue_4025=第4裝甲集群擊退布瓊尼領導的預備隊方面軍，準備攻入維亞濟馬。
dialogue_4026=成功與第4裝甲集群會合，維亞濟馬包圍圈形成。
dialogue_4027=全力向東突圍，絕不能讓德軍俘虜！
dialogue_4028=這是我們最接近勝利的時候。不要考慮其他，你們只有一個任務：攻佔亞赫羅馬，從北面打進莫斯科！
dialogue_4029=士兵們！戰爭已經到了最關鍵的時刻，我們必須勝利，只能勝利！
dialogue_4030=西伯利亞，雪風呼嘯。惡劣的天氣極大的影響了德軍的視野和作戰能力。
dialogue_4031=克林已被第7裝甲師拿下，莫斯科北部防線收窄。
dialogue_4032=通知羅科索夫斯基：不管用什麼辦法，16集團軍必須把克林方向的部隊攔下來！絕不能讓他們打進莫斯科！
dialogue_4033=亞赫羅馬被攻克，德軍完成莫斯科大包圍的北部條件成熟。
dialogue_4034=第1突擊集團軍守住防線，絕不能讓德軍打過紅軍城！
dialogue_4035=克里姆林宮的輪廓依稀可見，但第3裝甲集群的燃料和彈藥已經見底。攻入莫斯科的可能，只剩下奇跡。
dialogue_4036=不可思議！第7裝甲師攻入了莫斯科市區。但這也激發了莫斯科裡最激烈的抵抗力量。
dialogue_4037=莫斯科城防軍隊就位，消滅所有踏入莫斯科的敵人。光榮的時候到來了！我們就是莫斯科！
dialogue_4038=南方集團軍群聽令：以第4裝甲集團軍為主力，肯夫特遣軍團掩護側翼，消滅近衛第6集團軍。
dialogue_4039=隸屬於肯夫特遣軍團的第7裝甲師也接到命令，準備向別爾哥羅德以東發動進攻。
dialogue_4040=第7裝甲師成功強渡北頓涅茲河，成功在近衛第7集團軍防線構建橋頭堡。
dialogue_4041=通知近衛第7集團軍：拖住敵軍，不要讓他們有機會支援主力。
dialogue_4042=橋頭堡進一步擴大，已經可以對主力部隊進行掩護。
dialogue_4043=電告總參謀長：敵人即將向普洛霍羅夫卡發起突擊。請求坦克增援。
dialogue_4044=已調集近衛第5集團軍前往支援。你部不惜一切代價阻止敵軍繼續突破！
dialogue_4045=蘇軍哪來這麼多坦克！撤退，不能把所有部隊都陷阱去。
dialogue_4046=火炮壓制後，全軍出擊。今日，我們要拿下基輔！
dialogue_4047=守住基輔已經不可能。第7裝甲師迅速支援法斯托夫，不能讓我們的退路被堵死。
dialogue_4048=所有部隊撤往法斯托夫組織防線，阻止敵軍進一步擴張。
dialogue_4049=所有部隊撤往白采爾科維。
dialogue_4050=電報柏林：基輔已經失守。
dialogue_4051=迅速回援日托米爾，不能讓鐵路樞紐落到敵人手裡。
dialogue_4052=第48裝甲軍從法斯托夫向北突擊，我們要在日托米爾打一個包圍，才能阻止蘇軍進一步推進。
dialogue_4053=迅速突圍，各部隊穩固戰線，不要輕敵冒進！
dialogue_4054=空軍地毯式轟炸即將到位，轟炸結束後，直接衝破敵軍防線！
dialogue_4055=轟炸結束，進軍！
dialogue_4056=預備隊壓上填補缺口，不能讓他們突破防線。
dialogue_4057=第3裝甲師成功突破防線，德軍被迫收縮收縮防線。
dialogue_4058=抽調第2裝甲師和第116裝甲師馳援，必須阻止敵軍擴大戰果。
dialogue_4059=逐步推進，收窄袋口。不能讓敵軍逃出包圍圈。
dialogue_4060=向東有序撤退，不能讓他們完成合圍。
dialogue_4061=我已經盡力，是時候結束這場戰爭了。再繼續下去，將是德國的災難。
dialogue_4062=炸彈刺殺案事發。克魯格解職，莫德爾接任指揮。
dialogue_4063=全力攻擊包圍圈，給受困部隊製造逃生缺口。
dialogue_4064=包圍圈形成，受困德軍發起決死突圍。
dialogue_4065=阿亨政治意義重大，拿下它，對敵軍士氣有極大打擊。
dialogue_4066=阿亨歸我們了！休整一下，向許特根森林發起進攻。
dialogue_4067=通知後方徵召更多填線部隊，我們必須在許特根森林拖住敵軍
dialogue_4068=許特根森林複雜的地形，極大削弱了第3裝甲師。
dialogue_4069=堅守堡壘，党衛軍正在前往支援。
dialogue_4070=這是關係到國家命運的一戰。只許勝，不許敗！
dialogue_4071=全軍出擊，穿過阿登山區，拿下安特衛普！
dialogue_4072=裝甲部隊迅速向阿登森林支援，阻止敵軍進一步推進。
dialogue_4073=北線和南線受阻，兵力向中部集中，必須打出阿登森林。
dialogue_4074=拿下巴斯托涅，不能讓他擋在我們的進攻路線上。
dialogue_4075=第 101 空降師拒絕投降，堅守巴斯托涅。
dialogue_4076=迅速支援巴斯托涅，絕不能讓德軍控制交通樞紐。
dialogue_4077=巴斯托涅失陷，德軍支援部隊可以迅速行動。德軍攻勢進一步加強。
dialogue_4078=第1集團軍突破萊茵河防線，從南部封鎖魯爾工業區。
dialogue_4079=第3裝甲師接到命令，快速推進至利普斯塔特，與第9集團軍部隊會合。
dialogue_4080=向包圍圈內廣播：繳槍投降，盟軍會保證戰俘的權益。
dialogue_4081=作為帝國的元帥，我不能授權投降，但我會盡力為士兵留下逃生的希望。
dialogue_4082=傳我命令：B集團軍群解散。所有作戰部隊要麼以有組織的隊形突圍，要麼放下武器回家。
dialogue_4083=我至少戰鬥到了生命的最後。
dialogue_4084=第3裝甲師師長在作戰中陣亡，但其勇猛的作戰精神，激勵了部隊的作戰意志。
dialogue_4085=莫德爾拒絕投降，飲彈自盡。
dialogue_4086=1991年2月24日，沙漠風暴行動開始。第3裝甲師作為美軍主力之一向伊拉克發起進攻。
dialogue_4087=科威特被攻克，聯合國軍隊聲勢大振。
dialogue_4088=美軍電子干擾系統啟動，伊拉克軍隊的電子通訊系統失效。
dialogue_4089=伊拉克陸軍大部分被消滅，聯軍取得壓倒性勝利。伊拉克政府請求投降。
dialogue_4090=海軍步兵第255旅被派往第56集團軍和第18集團軍之間的交界處，阻止德軍進一步推進。
dialogue_4091=為拿下圖阿普謝，德軍發動“阿提卡行動”。
dialogue_4092=德軍先鋒部隊抵達圖阿普謝城外，請緊急回援。
dialogue_4093=圖阿普謝被德軍攻佔，蘇軍集中兵力，圍攻占城德軍。
dialogue_4094=收復圖阿普謝，蘇軍乘勢向德軍發動反擊。
dialogue_4095=海軍步兵第255旅成功開闢橋頭堡，蘇軍迅速投入大量援軍。
dialogue_4096=新羅西斯克守軍出動，阻止蘇軍進一步擴大橋頭堡。
dialogue_4097=蘇軍攻勢達到極限，準備固守橋頭堡，作為下一次行動的支點。
dialogue_4098=為消滅橋頭堡，德軍加大進攻兵力。
dialogue_4099=橋頭堡被壓縮。一位政委跟隨物資到來，鼓舞戰士們一定要保住小地。
dialogue_4100=海軍步兵第255旅奉命從新羅西斯克港內登陸，計畫從內側攻克敵軍防線。
dialogue_4101=成功突破週邊防線，與德軍進入巷戰階段。
dialogue_4102=新羅西斯克的週邊堡壘被攻克，蘇軍逐步掌控新羅西斯克。
dialogue_4103=成功解放新羅西斯克，德軍向西北方撤退。蘇軍乘勢展開追擊。
dialogue_4104=第18集團軍突破新羅西斯克北側防線，形成北部合圍。
dialogue_4105=第18集團軍登陸部隊成功突破海軍封鎖，登陸埃利季根。軸心軍迅速集中兵力反撲。
dialogue_4106=埃利季根突出部成功牽制德軍主力。第56集團軍登陸部隊乘勢出擊，登陸科赤東北部。
dialogue_4107=敵軍岸防部隊火力兇猛，科斯堅科上士壯烈殉國。
dialogue_4108=刻赤北部橋頭堡鞏固，德軍全力進攻埃利季根。
dialogue_4109=蘇聯奇兵突襲刻赤，軸心軍緊急回援。
dialogue_4110=成功攻克巴拉克拉瓦，對薩蓬山區的第49山地軍形成包夾。
dialogue_4111=對薩蓬山區的第49山地軍被蘇軍擊退。敵軍退守塞瓦斯托波爾防線。
dialogue_4112=攻克梅肯濟高地。敵軍北部防線崩潰。
dialogue_4113=塞瓦斯托波爾解放，德軍被迫向西撤退，準備從海上逃離。
dialogue_4114=羅馬尼亞艦隊被擊退，撤離部隊士氣崩潰。
dialogue_4115=蘇軍完成對塞瓦斯托波爾的封鎖。困守軸心軍決心拼死防守。
dialogue_4116=海軍步兵第255旅奉命乘夜渡過德涅斯特灣，為46集團軍主力部隊建立登陸橋頭堡。
dialogue_4117=軸心軍岸防部隊發現登陸部隊，搶灘作戰一觸即發。
dialogue_4118=成功建立北部灘塗陣地。拔除阿克爾曼，為主力部隊掃清灘塗陣地。
dialogue_4119=阿克爾曼成功解放，敵軍被迫放棄河口防線。
dialogue_4120=戰場北方的蘇聯第37集團軍取得重大突破，敵軍為避免包圍開始撤軍。

