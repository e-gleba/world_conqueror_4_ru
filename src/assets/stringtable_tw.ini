dialogue_3500=成功擊敗英軍核心軍團，繼續堅守，轉機已經出現！
dialogue_3501=德軍的掙扎只是徒勞。暫停推進，後備軍團到位後繼續進攻!
dialogue_3502=蘇軍的進攻部隊被擋住了，元首的反擊計畫並不是幻夢！
dialogue_3503=重新整編軍隊，柏林，我勢在必得！
dialogue_3504=簡直是奇跡！我們成功破壞了美軍的後勤中轉站，敵人現在手無寸鐵！
dialogue_3505=啟用備用中轉站，前線部隊稍作等待，補給馬上送到。
dialogue_3506=我帶來了我能控制的所有部隊。保證我的安全，義大利的民眾會為盟軍服務。
dialogue_3507=該死，找他的副官來，我們必須安撫義大利人。
dialogue_3508=前線部隊向卡昂集中，阻止敵軍進一步推進。
dialogue_3509=南線情況不妙，出動預備隊制止敵軍進一步推進。向司令部發報，我需要更多部隊才能維持住防線。
dialogue_3510=司令部派我部來支援。前線戰況不佳，我們必須保留更多力量。
dialogue_3511=敵軍的進攻鋒頭折斷了，勝利的天平開始傾斜！
dialogue_3512=維持戰線，繼續進攻。我們沒有下一個機會了！
dialogue_3513=巴斯托涅已經拿下，阿登山區的補給不再是問題。
dialogue_3514=自敵軍登陸以來，失敗一個接著一個。但這一戰，我必須取得勝利。
dialogue_3515=安心回港，接下來由我接管海域！
dialogue_3516=這樣的失敗，我在菲律賓經歷一次，就不怕再來一次。
dialogue_3517=危局已解！我軍需要朝鮮人民的支援來發起反攻。
dialogue_3518=我軍已取得海域控制權，拿下海參崴，奪取蘇軍導彈基地！
dialogue_3519=這次，我不僅回來了，還讓蘇聯人嘗到了失敗的滋味！
dialogue_3520=重新奪回南庫里爾群島，務必保證港口安全！
dialogue_3521=請協助佔領沿岸港口，海軍需要一個鄂霍次克海的進攻支點！
dialogue_3522=很好！艦隊馬上到位，我們將與陸軍一起收復鄂霍次克海！
dialogue_3523=謹守海岸防線，援軍會儘快趕來支援。
dialogue_3524=聖勞倫斯島已經失守，絕不能讓敵人在大陸站穩腳跟！
dialogue_3525=支援海岸防線已失去意義。通知後方援軍，撤軍回防，加固安克雷奇防線。
dialogue_3526=援軍已經抵達，資源無限供應。以逸待勞，擊垮他們。
dialogue_3527=歐洲援軍正在跨洋而來，堅持抵抗，轉機很快出現。
dialogue_3528=成功與友軍達成聯繫，做好補給，我們將解放美利堅！
dialogue_3529=戰爭到了這個地步，跟著美軍繼續打下去毫無意義。通知蘇聯談判，我們要退出這場戰爭！
dialogue_3530=加拿大要退出戰爭？這個叛徒！通知軍隊，將戰線維持在加拿大境內。想走？由不得他！
dialogue_3531=根據中央意見，任何可以統戰的對象，我軍都應當予以幫助。歡迎與我軍一同作戰！
dialogue_3532=為了國家安全，我不得不如此了。
dialogue_3533=歐洲援軍已至！戰士們，為了自由，奪回我們的領土！
dialogue_3534=戰火已經燒到本土，繼續這麼打下去真的值得嗎？
dialogue_3535=國家已經陷入危險，戰士們，保衛我們的祖國！


