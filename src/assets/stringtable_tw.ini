feat_desc_152=受到陸軍或海軍單位攻擊時，有{1}%概率閃避該傷害；受到空襲時，有{2}%概率閃避該傷害(導彈、核彈除外)。
feat_desc_153=攻擊直升機時，傷害增加{1}%。每回合移動後，下回合行動力降低{2}點（下限為可移動2格），在友軍城市或工程部隊1格範圍休整1回合後，可恢復全部行動力
feat_desc_153_Lv2=攻擊直升機時，傷害增加{1}%。每回合移動後，下回合行動力降低{2}點（下限為可移動2格），在友軍城市或工程部隊1格範圍休整1回合後，可恢復全部行動力
feat_desc_153_Lv3=攻擊直升機時，傷害增加{1}%。每回合移動後，下回合行動力降低{2}點（下限為可移動2格），在友軍城市或工程部隊2格範圍休整1回合後，可恢復全部行動力
feat_desc_153_Lv4=攻擊直升機時，傷害增加{1}%。每回合移動後，下回合行動力降低{2}點（下限為可移動2格），在友軍城市或工程部隊2格範圍休整1回合後，可恢復全部行動力
