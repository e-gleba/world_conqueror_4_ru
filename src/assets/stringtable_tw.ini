elite_intro_82=幽靈部隊是由全球頂尖士兵組成的精英單位，以其無聲無息的戰術、先進的隱身科技以及卓越的行動效率而聞名。他們能夠在各種極端環境下迅速且精準地打擊敵人，並具備透過空降實現快速部署與撤離的能力，被認為是世界上最致命的精英力量之一。
elite_intro_83=M1A1主戰坦克是美軍的主力裝甲單位，也是世界上首款廣泛配備貧鈾彈和貧鈾裝甲的坦克。其120毫米滑膛砲能夠發射高穿透力的貧鈾彈，憑藉彈藥的高密度和自銳化特性，可輕鬆摧毀敵方重型裝甲目標。 M1A1採用了貧鈾複合裝甲，大大提升了防禦能力，使其在面對穿甲彈和高爆武器時依然保持卓越的生存能力。
elite_intro_84=B-52戰略轟炸機是美國空軍遠程重型轟炸機，自1950年代服役以來，憑藉其卓越的航程、巨大的載彈量和多用途作戰能力，成為全球空軍力量的重要組成部分。 B-52能夠攜帶常規炸彈、精確導引彈藥以及核武器，適應多種任務需求。其現代化升級使得B-52仍保持競爭力，成為冷戰至今軍事史上最為持久的轟炸機平台之一。由於其龐大的機身和較長的起飛距離要求，無法適應航母有限的甲板空間和起飛條件。
elite_intro_85=AH-64阿帕契是世界上最具代表性的攻擊直升機，以其強大的火力、先進的電子系統和卓越的機動性而聞名。阿帕奇配備30毫米鍊式機關砲、空對地導彈以及先進的光電和紅外線感測器，其強大的防護系統使其能夠在高威脅環境中作戰，成為戰場上致命的空中打擊力量。阿帕契的多功能性和持續的現代化升級，使其成為現代陸軍航空兵的核心作戰平台之一。


