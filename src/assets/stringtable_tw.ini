conquest_event_desc_69=二戰結束後，蘇聯未按協議撤出其佔領的伊朗北部地方。經過國際外交壓力和談判，最終蘇聯撤軍，保障了伊朗的領土完整。這場危機標誌著美蘇在中東地區對抗的開始。
conquest_event_desc_70=軸心國軍隊的撤離導致了希臘出現權力真空。希臘政府軍與民主軍之間爆發內戰，造成希臘社會嚴重分裂和大量平民傷亡。內戰推動希臘在戰後加入西方陣營，成為北約成員國。
conquest_event_desc_71=兩艘英國海軍驅逐艦在克拉基海峽中不慎觸雷，造成數十人傷亡。隨後，英國派遣軍艦前往該海峽進行掃雷行動，這一舉動遭到阿爾巴尼亞的強烈抗議。
conquest_event_desc_72=1952年，埃及自由軍官團體推翻了埃及國王的君主制度，建立了共和國。這一事件結束了長期的君主統治，標誌著埃及現代化的開始。
conquest_event_desc_73=古巴國內的革命運動成功推翻了獨裁政權，建立了一個社會主義國家。這場革命使古巴在冷戰期間成為全球政治的重要焦點之一。
conquest_event_desc_74=1956年，匈牙利爆發了反對蘇聯和本國政權的大規模起義，但最終遭到軍隊鎮壓並失敗。
conquest_event_desc_75=英法等國聯合對埃及發動軍事進攻，旨在奪回蘇伊士運河的控制權。儘管最初進展順利，但在美蘇的強烈反對和外交壓力下，英法最終被迫撤軍。此次戰爭標誌著英法作為世界主導力量的終結。
conquest_event_desc_76=葡萄牙年輕軍官組織發起了一場軍事政變，推翻了葡萄牙長期的獨裁統治政權。革命成功後，葡萄牙迅速轉向民主，並放棄了其在非洲和亞洲的殖民地，結束了葡萄牙長達數世紀的殖民統治。
conquest_event_desc_77=1961年，美國支持的古巴流亡者進行了對古巴的入侵行動。然而，在古巴南部的豬灣登陸後，入侵者迅速被古巴軍隊擊敗。此次事件加劇了美古關係的緊張，並鞏固了古巴領導人的統治地位。
conquest_event_desc_78=為了應對美國在義大利和土耳其部署彈道導彈的舉措，蘇聯在古巴部署了類似的彈道導彈，此舉使得美蘇之間的緊張關係達到了前所未有的高度，瀕臨核戰爭的邊緣。
conquest_event_desc_79=蘇聯派遣軍隊進入阿富汗，鎮壓當地的反政府武裝。這場入侵導致了大量人員傷亡和難民流離失所，給阿富汗帶來了極大的破壞。蘇聯因此遭到了國際社會的強烈譴責。
conquest_event_desc_80=1965年，美國擔心多明尼加可能成為第二個古巴，以保護美國公民為名派遣軍隊進入該國。這一舉動引發了國際輿論的強烈譴責，甚至一些北約組織中的國家也公開表示反對。
conquest_event_desc_81=以色列對埃及、敘利亞和約旦等阿拉伯國家發動了先發制人的打擊，極大地改變了中東地區的地緣政治格局。戰爭的結果引發了長期的阿以衝突和中東地區的持續不穩定。
conquest_event_desc_82=由於主權爭議，阿根廷佔領了福克蘭群島，英國隨即派遣艦隊進行反擊。戰爭導致雙方數百人喪生，並進一步加深了兩國在政治、文化、經濟、體育等方面的敵對關係。
conquest_event_desc_83=1972年，美國當局成員在水門大樓安裝竊聽器時被抓捕。隨著調查深入，揭露了政府的多項違法和掩蓋真相的行為，此舉最終導致了美國歷史上一次總統因醜聞辭職的事件。
conquest_event_desc_84=正式名稱為歐洲復興計畫，是二戰後美國對戰爭破壞後的西歐各國進行經濟援助、協助重建的歷史性計畫。這一舉措對歐洲國家的發展和全球經濟格局產生了深遠的影響。
conquest_event_desc_85=美國和蘇聯之間的戰略對抗中，雙方進行了大規模的軍備競賽，試圖在核武器和導彈技術上保持相對優勢。雙方依靠擁有大規模核武器能力來相互威懾，防止對方採取軍事行動。
conquest_event_desc_86=為了應對蘇聯先進防空系統的威脅，美國成功研製出了世界上首款量產的隱身戰機：F-117“夜鷹”戰鬥機。
conquest_event_desc_87=蘇聯成功發射了世界上第一枚洲際彈道導彈，這次發射也標誌著人類歷史上首次成功將人造物體送入了太空。洲際導彈的出現徹底改變了冷戰時期的軍事戰略格局。
conquest_event_desc_88=二戰後，美國支持的南越與北越不斷發生衝突，最終演變成了一場長期的大規模遊擊戰。這場戰爭也在美國國內引發了社會的分歧和強烈的反戰運動。
conquest_event_desc_89=1970年，中國成功發射了其首顆人造衛星，這標誌著中國在七十年代國防科學技術領域取得了重大成就。同時，中國也因此成為世界上第五個能夠獨立發射人造衛星的國家。
conquest_event_desc_90=中國于1964年成功引爆了獨立研發的第一顆原子彈：“邱小姐”。這一成就標誌著中國成為了世界上第五個擁有核武器的國家，同時也對中國在國際政治和安全領域的地位產生了深遠影響。
conquest_event_desc_91=1967年，中國第一顆氫彈爆炸成功。這是中國繼第一顆原子彈爆炸成功後，在國防科研領域的又一次飛躍。從研製原子彈到氫彈，中國僅用了兩年零八個月，創造了核武器研製史上的奇跡。
conquest_event_desc_92=1984年，洛杉磯以民間方式承辦奧運會，扭轉了前幾屆奧運會巨額虧損的情況。本屆奧運會在投資上的成功成為以後奧運會的楷模。中國在本屆奧運會實現了金牌零的突破。
conquest_event_desc_93=韓國軍政府領導人對民主活動實施了嚴厲鎮壓，引發了光州地區的大規模抗議示威，造成大量平民和學生的死傷。此事件透過德國記者的影像拍攝得以廣為傳播。
conquest_event_desc_94=1964年，日本在東京奧運會開幕之前正式通車了連接東京與大阪之間的東海道新幹線，這條鐵路成為了世界上首條商業運營的高速鐵路系統。
conquest_event_desc_95=1946年，美國成功研發了世界上第一台大規模電子數位電腦：ENIAC。此後幾十年間，電腦技術以驚人的速度發展，對科學、工業和日常生活產生了深遠影響。
conquest_event_desc_96=東歐劇變後，東德政府在國內外壓力下宣佈開放邊境，允許民眾自由穿越柏林牆。這一事件對歐洲乃至世界的政治格局產生了深遠的影響。

