elite_intro_97=獵鷹式攻擊機是西方陣營中最具代表性的多用途垂直/短距起降戰機，也是世界上首款實現實戰化、體系化部署的V/STOL噴氣式飛機。其可旋轉噴口設計使其無需依賴傳統跑道，可在前線簡易機場或臨時起降點靈活部署，顯著提升生存性與機動能力。憑藉穩定的懸停與低空機動性能，獵鷹式攻擊機在近距空中支援和對地打擊任務中具備持續壓制高價值目標的優勢。

elite_intro_98=Su-30V戰鬥機是蘇霍伊設計局在冷戰時期為華約陣營秘密研發的垂直起降戰鬥機專案，其外形與結構繼承自Su-27、Su-30系列成熟平臺，但在動力系統與飛控架構上進行了徹底重構。該機採用雙發推力向量噴口與分流升力系統，使其能夠在缺乏跑道的前線區域完成短距起降，並可在低空狀態下懸停，為地面部隊提供持續空中火力支援。


