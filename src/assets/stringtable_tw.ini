event_rule=規則
;集团军模式规则
armygroup_rule=集團軍模式規則
armygroup_rule_1=1.本活動劇本限時開啟，建議各位指揮官合理安排時間，通關並獲取獎勵。
armygroup_rule_2=2.完成集團軍成就可以獲得成就點數獎勵，達到對應的點數後可領取階段獎勵。
armygroup_rule_3=3.集團軍的規模與難度各不相同。通關後即可獲得對應的通關獎勵。
armygroup_rule_4=4.集團軍模式中，玩家需要擊敗敵對陣營的全部集團軍從而取得勝利。集團軍只有在所有建築被佔領且所有部隊被消滅後才會戰敗。向同國家的其他集團軍宣戰後，將與所有友軍敵對。
armygroup_rule_5=5.各集團軍有自己獨特的援軍與科技。擊敗敵對集團軍後可以獲得該集團軍的援軍，擊敗部分集團軍後可以解鎖對應的兵種科技。
armygroup_rule_6=6.消滅敵軍部隊和佔領敵方建築後會獲得功勳值，通過累計一定數量的功勳值來提升功勳點數。消耗對應的功勳點數來招募援軍、升級兵種科技。
armygroup_rule_7=7.消滅敵軍部隊和佔領敵方建築後，會降低對應集團軍的忠誠度。當忠誠度降至15%以下時，若玩家佔領地區已達一定規模，且敵集團軍城市已全部丟失，此時可透過招降功能強制使該集團軍投降。

