general_stage_name_142=西西里登陸
general_stage_name_143=諾曼第登陸
general_stage_name_144=市場花園行動
general_stage_name_145=阿登戰役

general_stage_intro_141=1942年10月，在“獵狐者”蒙哥馬利將軍的帶領下，盟軍成功打破了德軍的防線，並在埃及北部取得了一系列重要的勝利。阿拉曼戰役是第二次世界大戰中北非戰場的轉折點，爲盟軍將德軍逐出北非奠定了基礎。
general_stage_intro_142=1943年，盟軍在西西里島進行了大規模的海上登陸，迅速佔領了該島，並將德軍逐出。這次行動不僅爲意大利的解放鋪平了道路，而且標誌着盟軍在地中海戰區的重要勝利。
general_stage_intro_143=作爲最高指揮官之一，蒙哥馬利帶領盟軍在法國諾曼第地區發動了大規模的登陸行動，通過空降、海上登陸和陸上推進，成功地建立了橋頭堡並突破了德軍防線。這次勝利爲解放歐洲提供了關鍵的契機。
general_stage_intro_144=盟軍希望通過佔領荷蘭的關鍵橋樑迅速推進德國內陸，並進行了大規模的空降行動，與地面部隊協同作戰。然而，由於意外情況和德軍的堅決抵抗，他們將面臨怎樣的挑戰？
general_stage_intro_145=1944年底，德軍在嚴寒的冬季發動了進攻，試圖切斷盟軍的供應線。然而，盟軍堅守陣地並展開反擊，最終將德軍逼入困境，爲下一步推進鋪平了道路。

dialogue_2401=加快推進的速度！在英軍趕到前擊敗挪威的守軍。
dialogue_2402=敵人試圖把我們分割包圍。突破這些封鎖，阻止他們的行動。
dialogue_2403=希臘的援軍會配合我們從陸路發起進攻。把德國人徹底趕出希臘。
dialogue_2404=配合海軍攔截住增援的敵人，把他們消滅在海上。
dialogue_2405=我會抵擋住敵人裝甲部隊的第一波進攻。請儘快攔截敵人的援軍。
dialogue_2406=美軍爲了掩護麥克阿瑟撤退，主動向我們發起了進攻。
dialogue_2407=小心側翼的敵軍艦隊，阻止敵軍主力撤退。
dialogue_2408=全力阻止日軍陸軍的進攻，守住我們在新幾內亞的據點。
dialogue_2409=日軍已經無路可退。全速前進！殲滅敵軍艦隊的主力！
dialogue_2410=北約的部隊已經完成了登陸，小心敵人從海上發動的第二波進攻。
dialogue_2411=不能讓敵人在亞洲站穩腳跟。消滅他們的航母集羣。
dialogue_2412=敵人的裝甲集羣正從南北兩路發起進攻。我們需要支援。
dialogue_2413=敵軍在我們的後院建立了大規模的導彈基地。
dialogue_2414=擋住敵人的艦隊，徹底解除敵軍導彈基地對我們的威脅。
dialogue_2415=芬蘭的軍隊向我們發動了突然襲擊。一定要堅持到援軍部隊抵達！
dialogue_2416=敵人在北非的補給線已經被我們切斷。向東推進，壓縮德軍的防線。
dialogue_2417=德軍封鎖了大西洋，即將向我們的本土發動全面進攻。
dialogue_2418=西線的盟軍突破了多道防線，我們已經無路可退了。
dialogue_2419=在敵人進攻前率先發動反擊，打他們一個措手不及！
dialogue_2420=我們被英軍包圍了。儘快打破敵人的封鎖線，與援軍匯合。
dialogue_2421=快速集結新的部隊，我們會全力拖住英軍的進攻。
dialogue_2422=日軍放棄了與我們正面交鋒。現在正從兩個方向朝我們後方滲透。
dialogue_2423=擋住敵人的突襲。我們的裝甲集羣會摧毀面前的一切。
dialogue_2424=蘇軍已經把我們包圍了。堅守住陣地，等待海軍的增援。
dialogue_2425=協助盟友們抵禦蘇軍的進攻。我會利用這個機會，繼續加速推進。
dialogue_2426=美軍集中了全部的力量與我們進行決戰。這正是徹底擊潰敵軍的絕佳機會。我們是不可戰勝的！
dialogue_2427=我們已經無路可退，全力堅守到援軍的到來。
dialogue_2428=法軍仍沒有放棄抵抗。摧毀敵艦隊主力，把盟軍趕出地中海。
dialogue_2429=德軍已經沒有能力阻止我們登陸了。全速前進，解放整個歐洲。
dialogue_2430=英軍艦隊來勢洶洶。我們會擋住敵軍艦隊，請儘快攔截敵人的援軍。
dialogue_2431=敵人的援軍正在抵達前線。趁日軍後方空虛，出其不意攻其不備。
dialogue_2432=日軍的艦隊已經所剩無幾，殲滅敵人本土的有生力量，儘快結束這場戰爭。
dialogue_2433=我們的退路被美軍切斷了。只有消滅敵人的航母主力，才能獲得一線生機。
dialogue_2434=危機不會自動解除，我們不能坐以待斃，必須主動出擊。
dialogue_2435=美軍已經順利登陸，配合各路盟友佔領敵人的主要據點。
dialogue_2436=敵軍在前線持續增兵，已經打破了戰場平衡。必須全力遏制他們的擴張。
dialogue_2437=北非意軍的補給已經被我們切斷，拿下他們的據點，打通我們的補給線。
dialogue_2438=英軍牢牢地控制住了這裏的工廠。只有奪取這些據點，我們才能維持這場戰爭。
dialogue_2439=敵軍佔領了我們的城市。我的部隊已經做好了準備，隨時可以發動反擊。
dialogue_2440=德軍已經被逼入了絕境。配合我們一起發動進攻，掃清北非的敵人。
dialogue_2441=拖住敵人的進攻，儘可能地獲取物資，爲將來的反攻做好準備。
dialogue_2442=日軍切斷了我們之間的聯繫，要小心敵軍的突然襲擊，步步爲營。
dialogue_2443=我們已經推進到了敵人的腹地，馬上就能對敵軍主力完成包圍。
dialogue_2444=登陸作戰已經成功，配合我們的艦隊徹底把敵軍驅逐。
dialogue_2445=我們已經無路可退了，唯有堅守陣地纔有獲勝的希望。
dialogue_2446=新的世界格局已經形成。在這動盪的時局中生存，我們必須探索出一條屬於自己的道路。

dialogue_2447=敵人的火力過於兇猛，指揮官，請找到敵人的防線突破口，帶領我軍進攻。
dialogue_2448=不要再讓英軍突破更深的防線了，全力抵抗，等待後方援軍。
dialogue_2449=我們等不到後方支援了，撤退。
dialogue_2450=士兵們，我們即將獲一場偉大的勝利，一鼓作氣，將軸心國驅逐出非洲大陸！
dialogue_2451=趁敵人沒有集中兵力，從島嶼的東南兩側登陸，抓緊時機。
dialogue_2452=盟軍已經大規模登陸西西里島，出動所有部隊攔截，不要讓他們深入島的中心。
dialogue_2453=小心北側的敵方海上援軍部隊！
dialogue_2454=盟軍已經完成初步登陸，建立了據點，指揮官閣下，請帶領我們深入諾曼第地區。
dialogue_2455=不惜一切代價，阻止盟軍的推進，不要讓他們深入腹地！
dialogue_2456=向北推進，友軍的空降兵會降落到敵人後方，和我們形成夾擊。
dialogue_2457=盟軍的計劃已經被我們截獲，士兵們，守住橋頭，不要讓他們得逞！
dialogue_2458=若是不能攻下關鍵的橋樑，我們空中的友軍只會白白送命。指揮官，請助我們一臂之力。
dialogue_2459=友軍深陷敵人的包圍網，指揮官閣下，請務必出兵援助，保障他們的安全。
dialogue_2460=太好了，在英國人的幫助下，我們沒有產生巨大損失。士兵們，一鼓作氣，開始反擊！
dialogue_2461=當心不要被德軍分割了戰場，集結兵力給予他們最後一擊。

elite_intro_63=阿爾卑斯山地部隊成立於1872年，隸屬於意大利陸軍。該軍團裝備了當時較爲先進的武器裝備，在第一次世界大戰和第二次世界大戰期間的戰鬥中均有出色表現。
elite_intro_64=B-4榴彈砲採用特殊的雙重駐退復進系統，炮管口徑爲203毫米。在二戰期間，該炮在對付混凝土加固的重型碉堡中發揮了至關重要的作用，被他的敵人稱之爲“斯大林之錘”。

feat_name_62=牽制
feat_name_63=攻堅

feat_desc_62=使自身周圍1格範圍的敵軍無法移動，持續1回合，冷卻3回合。影響3個或以上目標時，冷卻爲1回合。
feat_desc_63=對城防造成傷害提高{1}%，持續2回合，冷卻3回合

