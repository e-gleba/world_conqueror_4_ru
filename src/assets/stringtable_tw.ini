conquest_event_desc_1=中國軍隊與日本侵略軍在上海及蘇州河一帶激戰。
conquest_event_desc_2=中國軍隊在武漢堅守，抵禦日本侵略軍的進攻。
conquest_event_desc_3=德國採用多兵種機動化閃擊戰術，於1939年迅速侵略波蘭，引發英法對德宣戰。
conquest_event_desc_4=英法與德國之間的相對靜止狀態，雙方宣而未戰，沒有進行大規模的戰役行動。
conquest_event_desc_5=蘇、日雙方的軍隊各自代表蒙古國及偽滿洲國交戰。戰後蘇、日締結《蘇日中立條約》。
conquest_event_desc_6=美國向英國和法國提供大量的軍火援助，為其武器裝備提供了重要支援。
conquest_event_desc_7=蘇聯試圖在寒冷的冬季攻克芬蘭，儘管蘇聯取得了勝利，但也付出了巨大代價。
conquest_event_desc_8=德國向挪威和丹麥發起進攻。
conquest_event_desc_9=羅馬尼亞豐富的石油資源為德國提供了戰略性的燃料支援。
conquest_event_desc_10=德國採用閃擊戰術入侵低地國家，快速突破荷蘭、比利時防線。
conquest_event_desc_11=曼施坦因計畫於1940年5月啟動，通過穿越阿登森林，繞過了馬奇諾防線，形成了對英法聯軍的包圍。
conquest_event_desc_12=瑞典在二戰期間通過向德國提供大量高品質鐵礦石，對提升軸心國的軍事實力發揮了關鍵作用。
conquest_event_desc_13=邱吉爾成為英國首相，他的領導力和激勵性演講鞏固了英國的抵抗精神。
conquest_event_desc_14=馬奇諾防線在德國入侵中未能有效阻擋德國軍隊，導致法國北部戰線崩潰。
conquest_event_desc_15=巴黎淪陷象徵著法國的戰敗，使德國在戰爭初期取得了戰略上的重要勝利。
conquest_event_desc_16=面對德軍包圍，盟軍在敦克爾克海灘進行了大規模撤退，為後續反攻打下關鍵的基礎。
conquest_event_desc_17=德軍於1940年制定了全面入侵英國的“海獅計畫”，企圖通過海上和空中進攻，摧毀英國的軍事力量。
conquest_event_desc_18=1940年德英兩國在英國上空展開的決定性空戰。
conquest_event_desc_19=德國海軍通過潛艇群體協同行動，對敵方艦隊、商船進行無差別襲擊，對盟軍船隊形成威脅。
conquest_event_desc_20=二戰期間在大西洋上發生了激烈海上對抗，德國潛艇通過狼群戰術襲擊盟軍艦船，而盟軍則採取護航和反潛作戰。
conquest_event_desc_21=
conquest_event_desc_22=德國、義大利和日本在共同的政治和軍事利益下逐漸加強合作，結成軍事同盟。
conquest_event_desc_23=在日本入侵泰國後，泰國選擇與日本合作，後正式加入軸心國。
conquest_event_desc_24=德國將部隊派往北非與義大利軍合作，試圖支援義大利在該地區的作戰，形成對英軍的強有力挑戰。
conquest_event_desc_25=1941年，德國廢除蘇德互不侵犯條約，正式發動對蘇聯的入侵。
conquest_event_desc_26=西班牙派遣藍色師團於1941年參與德國東線戰場，支持德國在蘇聯的巴巴羅薩行動。
conquest_event_desc_27=葡萄牙通過保持中立，成功維護了貿易關係，為國家保持相對穩定創造了條件。
conquest_event_desc_28=美英兩國領導人于1941年簽署大西洋憲章，奠定了盟軍在二戰中的聯合原則。
conquest_event_desc_29=美軍將領陳納德組織的美國航空志願隊于中國成立飛虎隊，致力於在中緬印戰場執行空中支持任務，幫助抵禦日本侵略。
conquest_event_desc_30=蘇聯城市列寧格勒被德軍圍困，城內居民在嚴峻的饑餓和寒冷中頑強生存，同時面對持續的德軍炮火和空襲。
conquest_event_desc_31=德軍進攻莫斯科，蘇聯軍民在嚴寒冬季中奮起抵抗德軍入侵。
conquest_event_desc_32=1941年11月蘇聯莫斯科紅場舉行了閱兵式。數十萬紅軍官兵走過主席臺接受蘇聯領導人的檢閱之後，隨即奔赴西部前線戰鬥。
conquest_event_desc_33=冬季嚴寒、物資匱乏和蘇聯軍隊的堅決抵抗，加劇了德軍物資消耗，使德軍的士氣降低。
conquest_event_desc_34=1941年12月日本海軍對美國太平洋艦隊發動偷襲，摧毀了美軍部分艦隊，使得美國正式參與二戰。
conquest_event_desc_35=珍珠港事件後，太平洋戰爭全面爆發。

