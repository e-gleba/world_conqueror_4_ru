feat_desc_110=在山地和森林地形時，受到傷害降低{1}%
feat_desc_111=發射多枚近程導彈，對目標造成近程導彈{1}%傷害，對目標周圍敵軍造成{2}%傷害，冷卻3回合
feat_desc_111_Lv2=發射多枚近程導彈，對目標造成近程導彈{1}%傷害，對目標周圍敵軍造成{2}%傷害，冷卻2回合
feat_desc_111_Lv3=發射多枚中程導彈，對目標造成中程導彈{1}%傷害，對目標周圍敵軍造成{2}%傷害，冷卻2回合
feat_desc_112=每回合開始時回復HP上限的{1}%。滿血時受到傷害降低{2}%
