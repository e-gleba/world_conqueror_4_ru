elite_intro_65=IS-3重型坦克是蘇聯于二戰末期研製的重型坦克，裝備一門強大的122毫米火炮，以其獨特的“楔形裝甲”設計而著稱。這一設計使其在裝甲防護方面具有顯著優勢，在冷戰時期仍然保持一定威力。
elite_intro_66=陸地斯圖卡火箭砲是德軍以半履帶車改裝的附加型多管火箭炮。用於為友軍前線部隊提供低成本、操作簡便、高機動性的大範圍炮火攻擊。
elite_intro_67=以法國歷史上著名紅衣主教的名字黎塞留命名。本艦配置兩座四聯裝380毫米主炮炮塔。在裝甲和水下保護方面，該戰艦堪稱當時的先進水準，僅稍遜於日本大和級戰列艦。
elite_intro_68=赤城號是日本海軍第一航空艦隊的旗艦航空母艦，被視為機動部隊的象徵。其艦載機飛行員均為精英飛行員。該艦參與了多次重要戰役，包括偷襲珍珠港、印度洋戰鬥以及中途島海戰。
elite_intro_70=企業號航空母艦，綽號“灰色幽靈”、“大E”，參與了美國海軍在太平洋戰爭幾乎所有重要戰鬥，擊沉敵艦71艘，擊傷敵艦192艘，擊毀敵機911架。直至今日，美國海軍中沒有任何一艘軍艦戰績能與之相比。

