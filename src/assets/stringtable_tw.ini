dialogue_3199=開始行動！必須搶在英國佬察覺前控制丹麥全境並佔領挪威戰略港口。
dialogue_3600=艦隊出動，港口必須在我們的控制之下！
dialogue_3601=丹麥已經投降。各部隊保持戰備狀態繼續向挪威進軍！
dialogue_3602=英軍之前的襲擊絕非孤立事件，必須全力守住納爾維克！
dialogue_3603=保持戰備狀態，英軍絕不會坐視我們獲得不凍港。務必做好一切防守準備！
dialogue_3604=我已經做完了一切可能的準備工作，但願能抵禦敵人的進攻。
dialogue_3605=我們相較其他軍團有更短的進攻路線，攻佔柏林的光榮使命必須由我們完成！
dialogue_3606=最短的路線有最硬的骨頭。搶先攻下柏林的軍隊，未必不是我們！
dialogue_3607=我的裝甲部隊將在北方為主攻部隊掃除一切障礙。
dialogue_3608=前線已經崩潰了，現在我只能確保更多的人免於戰火。
dialogue_3609=柏林城防部隊聽令：元首已經自殺，立即停止戰鬥，不要再讓更多人無謂犧牲。
dialogue_3610=這次任務是護送杜立特到起飛點。轟炸機升空後，艦隊全速撤離——別跟日軍糾纏，一秒鐘都別浪費！
dialogue_3611=艦隊已經被日軍發現，必須提前行動。轟炸機中隊聽令，即刻登機！
dialogue_3612=杜立特中隊已全部出動，趕緊撤！
dialogue_3613=敵集團已喪失戰略彈性，戰役進入最後階段。命令各部：壓縮敵軍防禦縱深，先攻克突尼斯，再進攻比塞大。
dialogue_3614=我代表非洲集團軍向盟軍投降。
dialogue_3615=不用繼續進攻了，我代表意大利第1集團軍接受無條件投降。
dialogue_3616=不能放任軸心國在愛琴海積蓄力量。必須派特種部隊攻擊島嶼駐軍，破壞海軍觀察站和無線電臺。
dialogue_3617=盟軍近期在德文郡附近海岸有大規模行動。S艇編隊繞過海峽防線前去武裝偵察。
dialogue_3618=日軍的海軍已經不足為慮。解放婆羅洲，回收島上的機場和石油資源！
dialogue_3619=井上中將，這三支航母編隊交由你指揮以執行“MO計劃”，務必確保登陸部隊抵達莫爾茲比港！
dialogue_3620=情報顯示，日軍近期計劃進攻莫爾茲比港。立即將可調動的4艘航母全數調往珊瑚海，務必挫敗日軍企圖！
dialogue_3621=根據偵察機情報，日軍進攻主力已出動。出擊，在喬馬德海峽將敵人葬身大海！
dialogue_3622=我會保護好翔鶴與瑞鶴，並令其將來犯之敵悉數擊潰！
dialogue_3623=B集團軍群聽令：向低地國家實施戰略佯動，誘使英法主力北移比利時，為A集團軍群創造決戰窗口！
dialogue_3624=A集團軍群聽令：阿登森林為主攻方向，形成佛蘭德合圍圈，務必殲滅盟軍重兵集團！
dialogue_3625=裝甲集群全速突擊！三日抵達馬斯河，次日強渡馬斯河！
dialogue_3626=北線部隊立即前出比利時建立阻擊防線，絕不容許德軍突破！
dialogue_3627=遵照貝當元帥命令，法蘭西已與德國簽署停戰協定。各部隊維持現有建制，向指定區域有序轉移。
dialogue_3628=戰爭還沒有結束，法蘭西的抵抗也沒有結束。我要去倫敦，帶領法蘭西人民繼續抵抗！
dialogue_3629=同志們！以伊久姆突出部和沃夫昌斯克為進攻軸線，拿下哈爾科夫！
dialogue_3630=南方集團軍群注意：蘇軍在哈爾科夫前線大規模集結，這是蘇軍進攻的前兆，做好防禦準備。
dialogue_3631=向伊久姆突擊，配合第1裝甲集團軍封閉伊久姆包圍圈。
dialogue_3632=
dialogue_3633=第7裝甲旅沿沙漠側翼推進，第22近衛旅主攻哈爾法亞山口與卡普佐，海岸縱隊奪取塞盧姆。
dialogue_3634=穩住戰線，死守卡普佐要塞！我馬上從圖卜魯格抽調部隊支援！
dialogue_3635=奪回卡普佐要塞和哈爾法亞山口，不能讓圍城的部隊還要經受後方的威脅！
dialogue_3636=卡普佐附近部隊後撤至哈爾法亞山口，不要和德軍糾纏。
dialogue_3637=空降部隊優先控制目標機場，待佔領後迅速投送補給及增援部隊。
dialogue_3638=皇家海軍封鎖周邊海域，嚴防敵軍運輸艦靠岸！
dialogue_3639=第2裝甲師主攻布洛涅，第1、10裝甲師分進合擊加萊！必須快速奪下海峽港口！
dialogue_3640=加萊守軍全體注意：務須死守城區48小時！每拖延德軍一小時，就能為友軍爭取萬人撤離時間！
dialogue_3641=皇家空軍出動，重點截擊斯圖卡轟炸機群，掩護陸軍撤離！
dialogue_3642=A、B集團軍群恢復進攻，迅速形成海岸合圍，絕不能讓敵軍逃走！
dialogue_3643=比利時投降了？該死，立即收縮里斯河防線，補充比利時的缺口！
dialogue_3644=迅速向敦刻爾克推進，不能讓敵軍逃跑！
dialogue_3645=法國第一集團軍聽令：破釜沉舟，決不後退！我們必須保衛我們的國土！
dialogue_3646=快速佔領里爾，我們的腳步不能被拖在這裡！
dialogue_3647=我必須突圍，去其他戰場繼續保衛祖國！
dialogue_3648=偷襲敵方港口，切斷敵海上交通線，壓制其戰略物資投送能力！

