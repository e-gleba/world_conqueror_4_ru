elite_intro_86=白楊-M洲際彈道導彈是在蘇聯設計的RT-2PM 白楊的基礎上進一步研發出來的新型洲際彈道導彈。依靠三級固體燃料火箭提供的巨大推力，飛行速度可達20馬赫以上。可依靠大型運輸車進行移動。
elite_intro_87=阿利伯克驅逐艦是美國海軍新型驅逐艦，至今仍是世界上戰力最強的驅逐艦之一。縱向安裝了Mk 41垂直發射系統，可發射中程導彈和戰斧巡航導彈，同時處理大量目標。在反恐戰爭、第二次波斯灣戰爭中出色的完成了多項護航任務。

