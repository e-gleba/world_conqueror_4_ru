operation_rule_1=1.本活動劇本限時開啟，建議各位指揮官合理安排時間，通關並獲取獎勵。
operation_rule_2=2.劇本分為普通難度和困難難度，困難難度需要通關普通難度來解鎖。
operation_rule_3=3.困難難度劇本中，敵軍會獲得2個增益狀態（活動開啟時隨機2個，直到活動結束），請各位指揮官挑戰困難難度劇本時，謹慎規劃行軍路線。
operation_rule_4=4.當前難度的劇本，每關中陣亡的將領，下一關中無法上陣，只有重置進度後，才能上陣
operation_rule_5=5.關卡勝利後會記錄當前難度最高通關戰績，通關指定關卡可以領取階段獎勵。
operation_rule_6=6.階段獎勵分為勳帶獎勵和精英部隊碎片獎勵兩類，領取獲得一定數量的獎勵。
operation_rule_7_1=7.進度重置只能重置劇本當前難度的通關進度，並重置階段獎勵。活動時限內首次重置為免費，後續可以消耗勳章再重置一次進度。消耗勳章重置進度最多只有1次。（困難和普通難度共用重置次數）
operation_rule_7=7.進度重置只能重置劇本當前難度的通關進度。

defensive_rule_1=1.本活動劇本限時開啟，建議各位指揮官合理安排時間，通關並獲取獎勵。
defensive_rule_2=2.劇本分為普通難度和困難難度，困難難度需要通關普通難度來解鎖。
defensive_rule_3=3.困難難度劇本中，敵軍會獲得2個增益狀態（活動開啟時隨機2個，直到活動結束），請各位指揮官挑戰困難難度劇本時，謹慎規劃行軍路線。
defensive_rule_4=4.守住所有關鍵區域才能勝利。關卡失敗或勝利後都會記錄當前難度最高防守回合數，達到指定防守回合數可以領取階段獎勵（全殲敵軍後可領取全部階段獎勵）。
defensive_rule_5=5.關卡可以重複挑戰，但關卡中途退出不會記錄當前難度最高防守回合數。
defensive_rule_6=6.階段獎勵分為勳帶獎勵和精英部隊碎片獎勵兩類，領取獲得一定數量的獎勵。


event_intro_101=芬蘭耗費10年時間將曼納海姆防線建造成完整的防禦工事體系。它建造于卡累利阿地峽，依託沼澤湖泊等天然障礙物構築了多道防禦地帶。防線構築有大量固定發射工事和土木質火力點。曼納海姆防線後的白衣戰士們正嚴陣以待，準備迎擊敢於入侵芬蘭的任何敵人。
event_intro_102=德國的崛起引發了整個歐洲的關注和擔憂，他們無底線的領土擴張讓戰爭的陰雲籠罩在歐洲。漫長的邊境線讓波蘭成為無法回避的目標。但波蘭似乎並不需要過分擔心，他們得到了英法等盟國口頭上有力的支持。然而，盯上波蘭的只有德國嗎？
event_intro_103=耗費數十億法郎建成的馬奇諾防線可以抵禦多種攻擊，包括空中轟炸和大口徑火炮的轟擊。其內部擁有火炮、壕溝、堡壘、工廠、醫院等各類軍事及生活設施。然而，德軍指揮官們會直面這條堅固的防線嗎？還是轉頭經由低地國家進攻法國？抑或是，他們還有其他計畫呢？

event_stage_intro_20101=西歐大陸已經全部落入德軍控制之下。指揮部制定了巴巴羅薩計畫，要求我們將矛頭轉向蘇聯。明斯克是我們的首要目標，攻佔它將給蘇聯以重大打擊，也對我軍士氣至關重要。
event_stage_intro_20102=德軍大舉進攻蘇聯，對芬蘭來說是個好機會。我們將與德軍協同配合，在列寧格勒北部發起進攻，奪回在冬季戰爭中被蘇聯侵佔的領土。
event_stage_intro_20103=明斯克的勝利讓蘇聯人措手不及，並再次驗證了閃電戰的威力。不能讓我們的坦克停下來！一旦攻下斯摩棱斯克，我們就能夠控制這座交通樞紐和軍事要地，為後續的進攻提供更好的補給和後勤保障。
event_stage_intro_20104=烏克蘭地區是蘇聯的糧倉和重要的工業中心，控制基輔意味著控制了大量的資源和產業。我們的裝甲部隊需要完成對基輔的合圍，奪取這座城市，進一步動搖蘇聯的防禦體系。
event_stage_intro_20105=作為蘇聯在波羅的海地區最重要的港口，列寧格勒也是蘇聯的重要經濟和文化歷史中心。攻佔列寧格勒不僅會削弱蘇聯的防線，還將重創蘇聯內部的士氣和信心。
event_stage_intro_20106=克里米亞作為黑海上的一顆珍珠，具有重要的軍事地位。我們的裝甲師已被調往中央集團軍，目前僅有步兵和火炮可用。然而，增援的古斯塔夫巨砲將助我們轟開塞瓦斯托波爾的要塞。
event_stage_intro_20107=我們的進攻勢如破竹。哈爾科夫是一個重要的工業城市，我們必須加速前進，不要讓蘇聯在我們攻下哈爾科夫之前轉移那些工廠和設備。
event_stage_intro_20108=布良斯克和維亞濟馬是阻擋我們通往莫斯科的最後障礙，我們需要削弱敵軍的防線並擴大戰略空間，以便為進攻莫斯科做好準備。
event_stage_intro_20109=伏爾加河畔的史達林格勒是高加索地區重要的工業中心，擁有大量的石油和天然氣資源。敵軍投入了大量兵力進行防守，只有攻佔史達林格勒才能打擊蘇聯士氣，為東線戰場的勝利鋪平道路。
event_stage_intro_20110=莫斯科的嚴寒對我軍的交通和後勤補給造成了嚴重的影響，敵軍的抵抗已經遠比當初猛烈。然而，這無法阻止我們的前進。我們將在克裡姆林宮品嘗勝利的香檳。

event_stage_intro_20111=西歐大陸已經全部落入德軍控制之下。指揮部制定了巴巴羅薩計畫，要求我們將矛頭轉向蘇聯。明斯克是我們的首要目標，攻佔它將給蘇聯以重大打擊，也對我軍士氣至關重要。
event_stage_intro_20112=德軍大舉進攻蘇聯，對芬蘭來說是個好機會。我們將與德軍協同配合，在列寧格勒北部發起進攻，奪回在冬季戰爭中被蘇聯侵佔的領土。
event_stage_intro_20113=明斯克的勝利讓蘇聯人措手不及，並再次驗證了閃電戰的威力。不能讓我們的坦克停下來！一旦攻下斯摩棱斯克，我們就能夠控制這座交通樞紐和軍事要地，為後續的進攻提供更好的補給和後勤保障。
