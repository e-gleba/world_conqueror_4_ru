feat_desc_88=1格範圍內部署地雷，地雷可以造成{1}點傷害，冷卻1回合
feat_desc_88_Lv3=2格範圍內部署地雷，地雷可以造成{1}點傷害，冷卻1回合
feat_desc_89=在4格範圍內，挖掘一條從當前位置到目標地塊的地道。目標地塊不能是山地，海洋，並且不能穿過海洋。己方步兵、裝甲車、輕型坦克、中型坦克、野戰炮、榴彈炮、火箭炮可通過地道通行。從地道通行後可獲得額外行動，每條地道上限3次。當挖設新地道時，原地道消失。冷卻2回合
feat_desc_89_Lv2=在7格範圍內，挖掘一條從當前位置到目標地塊的地道。目標地塊不能是山地，海洋，並且不能穿過海洋。己方步兵、裝甲車、輕型坦克、中型坦克、野戰炮、榴彈炮、火箭炮可通過地道通行。從地道通行後可獲得額外行動，每條地道上限3次。當挖設新地道時，原地道消失。冷卻2回合
feat_desc_90=周圍一格範圍內的建築物恢復{1}點HP，每回合生效1次
feat_desc_92=每損失{1}點HP，提高{2}點部隊攻擊力
feat_desc_92_Lv2=攻擊範圍+1，每損失{1}點HP，提高{2}點部隊攻擊力
feat_desc_92_Lv3=攻擊範圍+1，每損失{1}點HP，提高{2}點部隊攻擊力
