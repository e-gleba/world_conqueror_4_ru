event_stage_intro_20416=德軍的大規模進攻的確出乎我們的意料。 但惡劣的天氣同樣限制了德國人的推進速度。 我的部隊已經提前北上，全速趕往戰場。 隨時做好解决這個突出部的準備。
event_stage_intro_20417=德軍的精銳已損失殆盡，但他們仍在柏林集結了最後的力量殊死一搏。 把柏林留給蘇聯人，用最快的速度向東前進與蘇軍會師，圍殲各處的德軍。 柏林的命運早已註定。

