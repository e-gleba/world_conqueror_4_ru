event_4108=電擊行動
event_4109=珍珠港事件
event_4110=軍營戰役

event_intro_4107=蘇軍通過實施嚴密的戰役偽裝，包括利用夜間調動部隊、構築假陣地等措施，成功完成了主力的隱蔽集結。1942年11月19日，蘇軍向德軍兩翼的羅馬尼亞軍隊陣地發起大規模進攻，迅速突破防線。德軍對蘇軍的進攻規模與意圖判斷失誤，導致南北兩路蘇軍順利會師，最終將德軍第6集團軍及部分第4裝甲集團軍的單位徹底合圍。此役扭轉了東線戰場的戰略態勢。
event_intro_4108=1943年11月20日，美軍在強大海空火力支援下於塔拉瓦環礁實施兩栖登陸。由於潮汐高度遠低於預期，許多部隊被迫在遠離海岸的地區涉水上岸。與此同時，日軍已針對登陸作戰加強了島上防禦，在灘頭對美軍造成嚴重殺傷。經過四天激戰，美軍以巨大代價全殲守軍。此戰為美軍提供了寶貴的兩栖作戰經驗，潮汐預報與水文勘測的重要性由此被提升至前所未有的高度。
event_intro_4109=為奪取東南亞戰略資源並打破美國的經濟制裁與石油禁運，日本海軍於1941年12月7日對美國夏威夷珍珠港海軍基地發動突襲。日軍出動六艘航空母艦，分兩個波次實施空襲，以極小代價重創美軍太平洋艦隊。儘管擊毀大量飛機與艦艇，但美軍三艘航母均因不在港內而逃脫。次日美國對日宣戰，太平洋戰爭爆發。
event_intro_4110=意軍入侵埃及後在西迪巴拉尼暫停進攻，轉而修築防禦工事並建立多處軍營，等待後續支援。1940年12月8日，英軍對該地意軍營地發動突襲。由於行動前嚴格保密，意軍措手不及、倉促應戰，大批人員被俘。此役成果遠超預期，英軍隨即乘勝追擊，將突襲發展為“羅盤行動”的戰略反攻。

dialogue_4146=在艦炮的掩護下全力完成搶灘登陸！
dialogue_4147=潮汐高度低於預期！登陸艇吃水較深，已經無法再靠近。
dialogue_4148=島上的日軍已經被分割，我們掌握著絕對的優勢。提高警惕，消滅最後的這些敵人。
dialogue_4149=日軍突然向登陸部隊發起猛烈的反擊。
dialogue_4150=這次不是演習！向意軍的軍營發起進攻，打他們一個措手不及！
dialogue_4151=注意敵人的主攻方向。英軍的主力部隊在我們後方的沙漠中。
dialogue_4152=敵人正在全線崩潰。繼續進攻，擴大戰果！
dialogue_4153=意軍的核心兵營逐個失陷，整條防線開始動搖，部隊逐漸陷入混亂。


skill_name_166=遠征軍司令
skill_name_167=霸王行動
skill_name_168=大縱深戰術
skill_name_169=救火隊長

skill_info_166=指揮艦船部隊行動力+5，不受無法反擊效果影響。指揮部隊每有3點行動力提升[#00FF00#%d%%]攻擊和反擊傷害。
skill_info_167=自身周圍3格的敵軍受到傷害提高35%%且斜面裝甲，保護裝置，挑釁，挾持，並肩作戰效果無效。指揮艦艇部隊殲敵後，有[#00FF00#%d%%]概率再次攻擊。
skill_info_168=指揮陸地部隊時，周圍3格內的敵人被消滅則提升自身士氣，且獲得“突破集群”狀態（效果為造成傷害提高[#00FF00#%d%%]，可疊加至42%%），持續至關卡結束。
skill_info_169=指揮火炮部隊時行動力+3，殲敵後有[#00FF00#%d%%]概率再次攻擊，部隊HP每有200點則額外提升10%%概率

promotion_desc_4=進修後將領可提升屬性上限。進修後將領原本固定技能會重置，全額返還學習和升級技能費用。
army_buff_desc_1591=突破集群：造成傷害提高%d%%
army_buff_desc_1592=突破集群：造成傷害提高%d%%
army_buff_desc_1593=突破集群：造成傷害提高%d%%


dialogue_4121=凌晨四點，風暴仍未停歇。所有人都在等待一個答案——推遲，或出發。
dialogue_4122=參謀們還在爭論著潮汐、雲層、月亮。只有我清楚，幾個月的演練就是為了這一刻。猶豫，比敵人的炮彈更致命。
dialogue_4123=出發。願上帝憐憫我們所有人。
dialogue_4124=風浪太大，連巡邏機都無法起飛。參謀部的電文說盟軍不會在這種惡劣天氣裡行動。
dialogue_4125=今天的海霧格外濃。……霧後那是什麼？漁船？一艘、兩艘……等等，我的天啊，整個海面都在移動！
dialogue_4126=盟軍艦隊！是盟軍艦隊！在這種天氣下行動？他們瘋了！立即拉響警報！全員進入一級戰備！通知所有人堅守崗位，不得離開防區，未經命令不得下海出擊！
dialogue_4127=傘兵？他們以為找到了突破口，那片地盡是淺灘與積水正是元帥預先布下的陷阱。他們跳出飛機的那一刻就已經輸了。
dialogue_4128=很好，讓他們在泥水裡游泳！帝國歡迎他們的“冒險精神”。
dialogue_4129=海岸防線比我們預想的更堅固，敵人的機槍火力如同鐵幕！告訴戰列艦和空中部隊，給我掀開那片碉堡！
dialogue_4130=我看到我的士兵們還在水中掙扎！派救援艇過去，不論代價！我不會讓他們孤獨地沉沒在這片海中！
dialogue_4131=每一寸灘頭、每一條戰壕、每一座碉堡，都是通向歐洲大陸的鑰匙。拿下它們！那是我們回家的路。
dialogue_4132=保持與艦隊的聯絡，我們需要空軍支援！按照約定，為我們的飛機做標記！
dialogue_4133=所有部隊注意，德軍裝甲集群正在集結！這是他們最後的反撲，也是我們決定勝負的時刻！
dialogue_4134=他們還在登陸……數不清的艦艇，像海浪一樣一波又一波。天啊，他們瘋了嗎？防線正在崩潰！我們快要抵擋不住了！請求命令……請求命令……！
dialogue_4135=隆美爾元帥此刻不在前線……沒人能給我們命令，也沒有援軍，我們只能靠自己了！
dialogue_4136=隆美爾元帥已經抵達前線！現在，該輪到我們反攻了！英吉利海峽會成為他們的墳墓！
dialogue_4137=士兵們，現在要讓他們明白，德意志的士兵，哪怕倒下，也不曾屈膝。 哪怕只剩一人，也絕不會讓這條防線淪陷！
dialogue_4138=士兵們不再高喊口號，他們在祈禱，只是想活著……空氣裡混合著火藥、汽油、海水和燒焦的肉腥味。
dialogue_4139=登陸失敗……傳令所有部隊撤回艦上。我們輸了這場戰役，但我們不會輸掉戰爭。總有一天，我們還會回來。
dialogue_4140=這是我們犯下的最大錯誤……低估了一個即將崩塌的帝國最後的反擊。
dialogue_4141=我們似乎贏得了這場戰役，但我在想，我們守護的真的是祖國，還是一場已經失去靈魂的幻夢。元首在遠方繪製疆界，卻從未見過一個個士兵倒下的樣子。
dialogue_4142=盲目服從是士兵的本能，但理性的懷疑也是人類該有的權利。若有一天，每個人能學會思考，帝國才可能真正被拯救。
dialogue_4143=我從未恨過那些對岸的人，他們也只是被命令驅使去赴死的父親與兒子。或許我們之間最大的不同，只是被命運安排在了不同方向。
dialogue_4144=希望這場戰役不是戰爭的終點，而是帝國重生的起點。
dialogue_4145=我已履行了軍人的誓言……別讓敵人踏進柏林一步。

event_107=諾曼第防線
event_intro_107=1944年夏，盟軍在英國集結了史無前例的力量，炮火與鋼鐵匯成滔天怒浪，準備重新踏上英吉利海峽的另一岸。德軍駐守在法國北岸，面對這場遲早會到來的風暴，士兵們在沙丘與混凝土碉堡間屏息以待。6月6日清晨，諾曼第的海面被無數登陸艇染成灰白，天空回蕩著飛機的轟鳴。對德軍而言，這不僅是一場防禦戰，更是一場與命運的抗爭。滔滔炮火之下，歐洲的命運在這片灘頭搖搖欲墜，德意志士兵們迎來了他們在西線最漫長、也最孤絕的一天。

dialogue_4154=這是一次有限突襲，首要任務為消滅西迪巴拉尼及其周邊義大利據點，迅速收復並控制西迪巴拉尼海岸。
dialogue_4155=成功攻克西迪巴拉尼，英軍俘虜大量義大利部隊。
dialogue_4156=繼續進攻。義大利利比亞集群大規模被俘，敵軍絕對準備不足。我們應該進一步擴大戰果！
dialogue_4157=各軍團嚴守海岸線，昔蘭尼加不容有失。
dialogue_4158=英軍的攻勢太兇猛，我不能把第10集團軍陷在昔蘭尼加。各部隊整備，準備撤出昔蘭尼加。
dialogue_4159=或許，我們可以橫穿沙漠，阻止班加西守軍向西逃離。
dialogue_4160=狐狸在開闊地帶被擊殺。
dialogue_4161=好，通知各部隊：班加西部隊已滅，全力進攻佔領昔蘭尼加。
dialogue_4162=擊敗西部沙漠的敵軍，將他們趕回圖卜魯格以西。
dialogue_4163=成功佔領卡普佐堡壘。
dialogue_4164=德軍依託88炮和哈爾法亞山口的地勢，成功擋住了英軍的進攻。
dialogue_4165=第15裝甲師迅速支援卡普佐，第5輕裝師從英軍後方穿插，支援哈爾法亞隘口。
dialogue_4166=德軍即將封死我們的退路。我們絕不能讓部隊陷入包圍。通知前線：放棄作戰目標，迅速撤退。
dialogue_4167=英軍成功重奪哈爾法亞山口。海岸公路的咽喉要道回到英軍手中。
dialogue_4168=很好，繼續沿海岸公路推進。
dialogue_4169=通知各部隊，作戰計畫調整：停止支援哈爾法亞山口，全力圍剿山口以西的敵軍部隊。
dialogue_4170=這一戰我們必須戰勝德軍，解除圖卜魯格之圍。
dialogue_4171=第7裝甲師聽令，你們的任務是拿下西迪雷澤格機場，伺機向圖卜魯格進攻。
dialogue_4172=成功拿下西迪雷澤格，圖卜魯格守軍準備突圍。
dialogue_4173=放棄進攻圖卜魯格的計畫，維持住包圍圈。迅速奪回西迪雷澤格，不能讓他們用空襲威脅包圍圈。
dialogue_4174=戰士們，堅持住！支援部隊正在趕來。我們一定要在這個機場，讓“狐狸”流血！
dialogue_4175=英軍進攻部隊太多了，只能進攻英軍後方，逼他們撤軍。
dialogue_4176=裝甲部隊聽令：從南部沙漠，繞行至埃及，全力破壞英軍後方補給站，解救邊境堡壘。
dialogue_4177=機動部隊迅速支援西迪雷澤格，主力部隊全力沿海岸向圖卜魯格推進。
dialogue_4178=巴迪亞部隊向圖卜魯格方向撤退，強化圖卜魯格包圍圈。
dialogue_4179=全軍按計劃行事：南部佯攻吸引敵軍注意，北部集中優勢兵力消滅敵軍主力。
dialogue_4180=我需要回歐洲養病。敵軍近期會有大規模動作，務必嚴格按照防禦計畫執行作戰。
dialogue_4181=意德裝甲軍的臨時指揮官陣亡；隆美爾返回北非重新接管軍隊。
dialogue_4182=我已經恢復了裝甲軍的指揮權。裝甲部隊向北部集中，準備奪回陣地！
dialogue_4183=放棄南部防線，有序向北部海岸線撤退。
dialogue_4184=第7裝甲師調往北部參與主攻，增壓行動開啟。
dialogue_4185=運輸油輪沉沒，軸心軍陷入汽油危機。
dialogue_4186=燃油補給不足，部隊損失慘重。我們必須撤退，保存實力。
dialogue_4187=繼續進攻，攻入海岸平原，破壞敵軍補給線！
dialogue_4188=海岸平原近在眼前。稍作休整，準備攻入海岸平原！
dialogue_4189=裝甲部隊出動，海岸平原補給線不容有失！
dialogue_4190=戰場突遇沙塵暴，戰爭雙方都陷入視野不清的困境。
dialogue_4191=突尼斯局勢不利，為避免突尼斯的失敗損傷隆美爾的威名，進而動搖國內民心。隆美爾被安排離開北非。
dialogue_4192=我代表剩餘的非洲德軍向盟軍投降。
dialogue_4193=德軍崩潰後，義大利向梅塞發送了投降命令。
dialogue_4194=我代表義大利第一集團軍向盟軍投降。
dialogue_4195=沒有預先空襲和海軍火炮壓制，德軍無法確定我們何時突襲。進攻！用奇襲打破德軍的防線！
dialogue_4196=放棄進攻吧！我們已經為你們做好了準備。
dialogue_4197=因為克拉克的錯誤策劃，登陸部隊陷入不利的境地。
dialogue_4198=該死！敵軍居然預判了這次進攻。迅速通知海軍，用火炮壓制敵軍反擊！
dialogue_4199=在海軍火炮的幫助下，盟軍成功登陸薩萊諾。
dialogue_4200=各部隊依託山地防禦，拖延敵軍推進。
dialogue_4201=放棄那不勒斯，各部隊向冬季防線撤退。

