armygroup_event_desc_98=華約裝甲集團軍向萊茵河北岸發起猛烈突擊，試圖在48小時內突破西德“萊茵防禦帶”。美軍工程部隊被迫提前引爆部分橋樑以延緩推進速度。
armygroup_event_desc_99=北約多國艦隊在北海展開協同反潛行動，雙方近距離交火數次，蘇聯多艘潛艇受損。海峽沿岸城市進入一級防禦狀態。
armygroup_event_desc_100=東西柏林同時爆發巷戰，東德守軍依託樓宇與工廠構築多重火力點。西柏林守備軍在美軍空投支援下展開迂回突破。柏林成為歐洲大陸戰火最密集的區域之一。
armygroup_event_desc_101=蘇聯空降師在清晨突襲布魯塞爾以東的機場，試圖癱瘓北約補給中樞。比利時與荷蘭裝甲旅火速趕往反擊，激戰導致歐洲最大彈藥庫之一部分爆炸。
armygroup_event_desc_102=蘇聯炮兵集團使用高密度火炮覆蓋西德前沿陣地，形成一條“灰燼火力帶”。西德城市基礎設施被嚴重破壞。
armygroup_event_desc_103=華約部隊改道突進至捷克西南部，以高速裝甲突破試圖切斷北約南線補給。意法軍隊派出機動部隊增援。
armygroup_event_desc_104=北約空軍針對華約通訊樞紐布達佩斯進行精確轟炸。匈牙利人民軍隨即在布達佩斯部署多重防空陣地，夜空被數百枚防空火箭照亮。整個城市在兩天內進入戰時封鎖。
armygroup_event_desc_105=羅馬尼亞炮兵團與蘇軍聯手在喀爾巴阡山脈構築縱深陣地，試圖封鎖義大利與南德的增援路線。北約山地部隊被迫沿極險峻的替代路線突圍，補給線岌岌可危。
armygroup_event_desc_106=北約對敖得薩實施封鎖，試圖阻斷蘇聯南部補給鏈。華約部隊發射導彈實施反封鎖行動，海岸線多處偵測到導彈軌跡，敖得薩防空體系承受巨大壓力。
armygroup_event_desc_107=瑞典、丹麥與德國海軍聯手封鎖波羅的海出口。蘇聯波羅的海艦隊嘗試從里加、加里寧格勒兩個方向同時突破，但被北約偵察機即時鎖定，兩地同時爆發海空交火。
armygroup_event_desc_108=蘇聯遠端航空兵對倫敦實施飽和式導彈打擊，泰晤士河南岸出現多處燃燒帶。英國戰時內閣緊急下令全國進入最高戰備，倫敦指揮樞紐短暫失聯。
armygroup_event_desc_109=曼徹斯特被攻佔，城市周邊的工業區被迫停產。英國軍工體系短時間內出現“關鍵部件缺口”，北約急調加拿大與美國的工業產能同步補位。
armygroup_event_desc_110=利物浦失守導致北約的大西洋補給航道受限。美軍海運指揮部臨時繞行冰島航路，整個西線部隊的補給節奏被迫調整。
armygroup_event_desc_111=蘇聯航空兵從波羅的海方向實施深度滲透，重創哥德堡港口設施。瑞典全境進入最高級別防空戒備。
armygroup_event_desc_112=哥本哈根被華約突擊旅佔領，丹麥海峽扼控權落入蘇軍手中。北約失去波羅的海出口能力。
armygroup_event_desc_113=華約導彈在香榭麗舍大道上空爆炸，巨大的衝擊波席捲整條大道。愛麗舍宮隨即失去對外通訊，總統緊急轉入地下指揮中心。
armygroup_event_desc_114=華約突擊隊突破布魯塞爾週邊後，北約總部遭到迫近威脅。為避免情報洩露，北約執行“黑夜行動”，部分秘密檔案被緊急銷毀。
armygroup_event_desc_115=鹿特丹港遭受重型導彈與炮火攻擊，大量油庫與集裝箱區化為火海。北約海運能力大幅下降，全線部隊補給普遍延遲。
armygroup_event_desc_116=威尼斯遭海空夾擊，多處歷史城區被迫疏散。義大利軍隊陷入苦戰，仍難以阻擋東歐方向來的裝甲部隊。
armygroup_event_desc_117=塞瓦斯托波爾陷落，黑海艦隊被迫全線北撤，蘇軍南翼防線出現嚴重真空。
armygroup_event_desc_118=明斯克陷落，華約在中線的支撐點被徹底拔除。紅軍指揮部啟動緊急轉移，整條斯摩棱斯克走廊風聲鶴唳。
armygroup_event_desc_119=華沙被北約佔領，波蘭正面戰區瞬間瓦解。蘇軍與波蘭人民軍主力被迫向布列斯特方向潰退，整個華約西翼暴露在敵軍火力之下。
armygroup_event_desc_120=基輔落入北約手中，蘇軍數個集團軍被迫越過第聶伯河重組，整個南中線出現巨大真空。
armygroup_event_desc_121=倫敦淪陷，英國全境進入戒嚴。失去英倫支點的北約西翼搖搖欲墜，海峽防線的崩裂讓整個北海與大西洋方向的平衡隨之傾覆。
armygroup_event_desc_122=華約在中歐方向大規模投放電子干擾，北約雷達在數十公里範圍內全部癱瘓。


