general_stage_intro_151=這是二戰北非戰場的最後一場戰役，艾森豪擔任盟軍指揮官，領導美英軍隊對軸心國在北非的防線進行攻擊，取得了成功，最終在1943年5月收復了突尼斯。
general_stage_intro_152=盟軍各國領袖一致認為下一個目標是義大利，1943年7月，艾森豪被任命為西西里登陸的總指揮，成功指揮了盟軍的登陸和戰鬥，僅花一個多月便佔領了整個西西里島。
general_stage_intro_153=1944年6月，盟軍利用情報欺騙了德國，在諾曼第出其不意地展開了這場二戰中規模最大的登陸活動。艾森豪作為最高指揮官，在他的領導下，盟軍成功在諾曼第建立了橋頭堡，為後續在歐洲大陸的戰鬥打下了基礎。
general_stage_intro_154=在諾曼第登陸成功後，艾森豪又指揮了在法國南部的登陸行動——龍騎兵行動。在這次行動中，盟軍成功打開了歐洲的第二戰線，迫使德軍分散兵力，進一步加速了德軍的敗局。
general_stage_intro_155=阿登戰役取得勝利後，艾森豪考慮儘快與蘇聯軍隊會師，一路向萊茵河進軍。1945年，魯爾包圍戰打響，這場戰役幾乎成為了西線的終局之戰，為最終的勝利奠定了基礎。
general_stage_intro_161=1941年10月，德軍攻入克里米亞半島後，第11集團軍在曼施坦因的指揮下開始進攻塞瓦斯托波爾。這場戰役是曼施坦因軍事生涯中的一次重要成就，並使他獲得了元帥權杖。
general_stage_intro_162=塞瓦斯托波爾一戰的勝利使曼施坦因大放異彩，最高指揮部便命令他北上前往列寧格勒增援。1942年8月，曼施坦因帶領第11集團軍加入了這場近代史上持續最久的圍城戰。
general_stage_intro_163=列寧格勒的戰役尚未結束，最高指揮部便命令曼施坦因前往史達林格勒解救被圍困的第6集團軍。這次他能否順利完成任務？
general_stage_intro_164=史達林格勒戰役的勝利讓蘇聯軍隊繼續向西推進，企圖奪取哈爾科夫。然而，曼施坦因精心策劃的反攻，讓他的軍事才能展現得淋漓盡致，並給德軍帶來了一次重要勝利。
general_stage_intro_165=即使環境惡劣，兵力劣勢，曼施坦因仍然能夠率領部隊突破蘇軍防線，使南部的敵人節節敗退。他能否聯合戰場北方的友軍，在這場二戰最大的坦克會戰中取得最終勝利？

