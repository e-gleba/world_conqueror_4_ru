dialogue_1001=指揮官閣下，下面我將給您介紹一下基本的操作。
dialogue_1002=單位下方的白圈表明這個部隊仍然可以行動。
dialogue_1003=點擊部隊，閃爍的地塊表示可以移動的區域，紅色光圈表示可以攻擊的目標。踩中敵軍的地雷會損失HP。
dialogue_1004=不同的建築可以生產不同的部隊，高等級的建築可以生產更多種類的部隊。
dialogue_1005=生產部隊會消耗物資。不同的單位擁有不同的編隊數量。
dialogue_1006=您可以指派一名已獲得的將領來提高部隊的戰鬥力。
dialogue_1007=如果您覺得您的部隊行動失誤，可以讓他們立即返回。
dialogue_1008=注意：這是一個關鍵據點，佔領或者丟失這裡將直接關係到戰役的勝負。
dialogue_1009=點擊右下方的沙漏，結束你的回合。
dialogue_1010=指揮官閣下，請開始您的軍事生涯！
dialogue_1011=指揮官閣下，下面我來給您介紹一些其他戰術。
dialogue_1012=士氣上升或下降將直接關係到一個部隊的戰鬥力，當部隊被夾擊或被包圍時，會對士氣造成很大的影響。
dialogue_1013=如果部隊陷入混亂，他將完全失去戰鬥力。
dialogue_1014=如果攻擊擊敗了敵方單位，您的部隊將不會受到反擊。
dialogue_1015=建造防禦設施是抵擋進攻的有效手段，防禦設施只能在自己領地建造，並且需要一定的時間才能完成。
dialogue_1016=防空設施能有效地減少空襲和導彈的傷害。
dialogue_1017=佔領城市需要將城市的HP降為0。佔領後，城市管轄的領地都將屬於你。
dialogue_1018=城市規模達到LV3以上時，你可以在城市內建造地標建築。地標建築可以為您的城市帶來特殊效果。
dialogue_1019=您可以通過城市資訊欄查看敵方的城市具體資訊。
dialogue_1020=指揮官閣下，請開始您的軍事生涯！
dialogue_1021=指揮官閣下，下面我來給您介紹一些其他戰術。
dialogue_1022=地形會對戰鬥的結果帶來一些影響。處於山地或者森林的部隊受到來自敵軍裝甲和火炮的傷害時可以減免一部分傷害。
dialogue_1023=有機場的城市可以對敵軍進行空中打擊和空降部隊。
dialogue_1024=擁有核設施的城市可以生產核彈。
dialogue_1025=導彈裝配核武器後，可以對敵軍造成更大的傷害。
dialogue_1026=陸軍單位進入水中時，將搭載運輸船，能力會受到運輸船的限制而下降。
dialogue_1027=在軍港中，您可以建造海軍。
dialogue_1028=指揮官閣下，請開始您的軍事生涯！

dialogue_1029=殲滅敵軍需要將其HP降為0。
dialogue_1030=指揮官閣下，下面我來給您介紹一些其他戰術。
dialogue_1031=大部分精英部隊有主動技能，醫療兵可以使用技能治療隊友。
dialogue_1032=佔領或消滅綠圈會觸發一些事件或者解鎖特定的技能學習（在HQ中學習）。
dialogue_1033=工程部隊挖掘的地道可以讓步兵和大部分裝甲火炮通過，快速轉移陣地。
dialogue_1034=通過地道時如果部隊無法移動，則能獲得額外行動，每個地道觸發次數有限。
dialogue_1035=藍色光圈代表撤離點，只有紅圈關鍵目標可以在撤離點進行撤離。
dialogue_1036=指揮官閣下，請開始您的軍事生涯，護送關鍵目標儘快撤離戰場！

dialogue_1037=指揮官閣下，下面我來給您介紹一下布兵上陣操作。
dialogue_1038=半透明格子才能上陣，底部會展示您帶入戰場的部隊和數量，灰色為當前關卡不能上陣的部隊。
dialogue_1039=點擊一次可以上陣單編的部隊，點擊多次可以增加編隊數，各部隊編隊上限與其他模式中招募部隊最大編隊數一致。
dialogue_1040=戰場內陣亡的部隊會視作消耗，多編隊部隊會損失更多，如需增加帶入戰場的部隊數量，請在統治中招募補充。
dialogue_1041=指揮官閣下，請開始您的軍事生涯，消滅所有敵軍！
dialogue_1042=點擊重置可以一鍵重新佈陣，點擊開戰才正式開始戰鬥。


dialogue_2001=指揮官閣下，我的裝甲集團軍將以最快的速度突破敵軍防線。
dialogue_2002=我沒有時間俘虜你們。
dialogue_2003=北部的敵軍已經被消滅，攻佔華沙只是時間問題。
dialogue_2004=指揮官閣下，我的潛艇部隊將為您解決海上的威脅。
dialogue_2005=敵軍已經無路可退。指揮官閣下，小心他們最後的反擊。
dialogue_2006=敵人已經失去了對海洋的控制權。我將佔領北方的港口，徹底消滅他們的海軍。
dialogue_2007=我的炮兵部隊會配合您的行動，向馬奇諾防線發起進攻。
dialogue_2008=指揮官閣下，我的裝甲部隊已經做好了繞過防線的準備，是時候向巴黎進軍了。
dialogue_2009=敵軍已經擊敗了我們的盟友，現在只能靠我們自己了。
dialogue_2010=迅猛進攻，不要停止!
dialogue_2011=敵軍怎麼會出現在那裡，後方的首都需要增援！
dialogue_2012=英國的遠征軍已經開始撤退。指揮官閣下，請消滅剩餘的敵人，橫渡英吉利海峽。
dialogue_2013=我的部隊會協助您在西面同時發起進攻，登陸英國本土。
dialogue_2014=現在是時候徹底解決英國這個威脅了。
dialogue_2015=戰爭不是靠撤退贏得的，但是這次撤退，卻孕育著勝利。
dialogue_2016=敵方的海軍主力幾乎損失殆盡，現在正是登陸的最佳時機。
dialogue_2017=我們將戰鬥到底，絕不屈服，絕不妥協。
dialogue_2018=敵人艦隊的主力在英吉利海峽損失殆盡，這將是英國海軍在地中海的最後抵抗。
dialogue_2019=他們利用附近的的島嶼群組成了一條防線，企圖布下的水雷來限制我們的行動。
dialogue_2020=這是我們最後的機會，一定要阻止義大利佔領整個地中海。
dialogue_2021=這個港口的位置非常重要，敵軍應該會派出艦隊增援，請務必控制住這一據點。
dialogue_2022=敵軍攻入了我們的腹地，我已經派出了預備艦隊，一定要把他們擋住。
dialogue_2023=敵人的艦隊已經突破了西側的防線，請立刻進行支援。
dialogue_2024=我們的先鋒部隊已經成功登上了巴爾幹半島。指揮官閣下，請您從陸路配合他們發起進攻。
dialogue_2025=敵人已經向我們和友軍發動了全面進攻，集中力量將登陸的敵軍趕回海裡。
dialogue_2026=敵人的海軍不堪一擊，但是絕不能低估他們的山地師。請您迅速支援我們的友軍，守住據點。
dialogue_2027=您擋住了敵人的反撲，現在是時候和盟友們一起發起總攻了。
dialogue_2028=形成重錘，不要分散。
dialogue_2029=雖然蘇聯軍隊規模龐大，但是在帝國的精銳面前也會變得不堪一擊。
dialogue_2030=我的步兵集團軍已經突破了列寧格勒北部防線。
dialogue_2031=基輔正在遭受敵人的攻擊，我們損失慘重，我需要增援！
dialogue_2032=敵軍的第一道防線已經被突破。目標斯摩棱斯克，士兵們，跟上我的步伐。
dialogue_2033=指揮官閣下，我期待與您在莫斯科前會師。
dialogue_2034=我們已經無路可退，身後就是莫斯科，守住這一道最後的防線。
dialogue_2035=基輔已經被敵軍攻佔，我們必須立即在東面組織一道新的防線。
dialogue_2036=我們的援軍正在趕來。指揮官閣下，請您為他們的登陸行動掃清障礙，確保補給順利到達。
dialogue_2037=士兵們，截斷敵人的補給，擴大我軍的數量優勢。
dialogue_2038=援軍開始進行登陸作戰了，請務必快速佔領前方的港口，消滅沿岸的守軍。
dialogue_2039=敵人的防線已經被突破。我的裝甲集團軍正在向亞歷山大港挺進，海軍艦隊也會從另一側進行夾擊。
dialogue_2040=我們失去了最後的海上屏障，亞歷山大港已經暴露在了敵艦的炮火下。
dialogue_2041=我們已經沒有增援了，無論如何都要守住開羅。
dialogue_2042=列寧格勒是座堅固的堡壘，正面發起進攻會付出很大的代價。
dialogue_2043=指揮官閣下，請您優先控制住周邊的城市，封鎖列寧格勒。我們的友軍會在北面發起進攻。
dialogue_2044=敵軍正在逼近列寧格勒。士兵們，火速開往前線進行增援。
dialogue_2045=指揮官閣下，我們已經封鎖了列寧格勒的北部，期待早日與您會師。
dialogue_2046=敵軍已經在列寧格勒以東發起了進攻。阻止他們，守住最後的補給線。
dialogue_2047=列寧格勒的周邊已經完全被我們控制了，現在是時候完成計畫的最後一步了。
dialogue_2048=列寧格勒是我們的！敵軍必須要為他們的行為付出代價。
dialogue_2049=保盧斯元帥的部隊在史達林格勒附近被敵人所包圍，指揮部要求我們立刻前往支援。
dialogue_2050=德軍的戰線很長，他們已經無法兩翼兼顧了，這是我們反攻的好機會。
dialogue_2051=南翼的羅馬尼亞和匈牙利友軍的防線也正遭到猛烈的攻擊，他們撐不了多久了。
dialogue_2052=敵人向我們發動了全線反擊。指揮官閣下，請立即突破北翼的蘇軍防線。
dialogue_2053=我們已經在南翼完成了對第六集團軍的包圍，一定要擋住德國人的援軍。
dialogue_2054=前線部隊的行動拖住了德國人增援，現在消滅第六集團軍的時機已經成熟。
dialogue_2055=保盧斯元帥被擊敗了，我們失去了向史達林格勒發起進攻的要地。
dialogue_2056=距離征服歐洲只剩下最後的一步了，莫斯科就在眼前。士兵們，隨我一起來贏得榮耀。
dialogue_2057=敵人意圖從多個方向對莫斯科發動進攻。但在這之前，他們必須明白這裡是蘇聯的土地！
dialogue_2058=指揮官閣下，小心應對蘇聯人的進攻。配合友軍行動將會加快推進的速率。
dialogue_2059=我們必須抵擋德軍的進攻，直至部隊安全撤離。
dialogue_2060=進攻！迅速佔領所有港口，阻止他們！
dialogue_2061=我們得到了友軍的援助，這是個好消息。
dialogue_2062=敵人的第一道防線已經被突破，全力進攻，把他們全都留下！
dialogue_2063=撤回港口，堅守陣地，部隊很快就能撤離了。
dialogue_2064=德軍正在進攻我們本土，我們需要支援！
dialogue_2065=加大攻勢，整個英國已經唾手可得了。
dialogue_2066=我們擋住了德軍的空襲，反擊的時刻到了！
dialogue_2067=勝利屬於英帝國！
dialogue_2068=我們的海軍封鎖了德軍的補給線，現在是進攻的最佳時機。
dialogue_2069=根據截獲的情報，隆美爾的部隊將對南部城市發動攻擊，注意調集火炮部隊進行防守。
dialogue_2070=我們攻破了德軍前沿陣地，向突尼斯發起進攻。
dialogue_2071=裝甲部隊，發起突襲，消滅敵人！
dialogue_2072=從一開始，我們就沒能使敵人措手不及，所以這次行動就失去了它本身的意義。
dialogue_2073=這次行動的目標是奪取西西里島，迫使義大利退出戰場。
dialogue_2074=這是盟軍首次大規模聯合行動，我的艦隊會配合你進攻島嶼。
dialogue_2075=我們的進展很順利，一定要比英國人搶先一步佔領巴勒莫。
dialogue_2076=盟軍攻勢太強，準備撤離，我們需要援軍從海峽接應。
dialogue_2077=西西里島是我們的了，渡過海峽，徹底擊潰義大利！
dialogue_2078=南北兩翼聯合進攻，摧毀在庫爾斯克的蘇聯軍隊。
dialogue_2079=建立防線，消耗德軍的裝甲兵力，伺機發動進攻。
dialogue_2080=進攻！摧毀敵人裝甲部隊，把他們趕回去！
dialogue_2081=我們奪取了北部地方的制空權，我們會同您一起進攻。
dialogue_2082=庫爾斯克戰役的勝利破滅了德軍的夏季攻勢，現在是我們主動進攻的時候了。
dialogue_2083=一味地防守使我們陷入被動，我將帶領部隊發起一次突襲，阻擊蘇聯人。
dialogue_2084=倫德施泰德將軍的部隊已經失利，我的計畫失敗了。
dialogue_2085=調集西北方向的集團軍，趕往基輔支援。
dialogue_2086=指揮官閣下，我們要收復被德軍佔領的明斯克。羅科索夫斯基將軍和我將協助你完成這個任務。
dialogue_2087=我已經盡我所能，還是無法挽救集團軍的敗局。
dialogue_2088=我們的行動很成功，前面就是明斯克，小心敵人的反撲。
dialogue_2089=經過了周密的計畫和長期的準備，這一天終於來臨，這將是史上規模最大的一次登陸戰！
dialogue_2090=美軍的推進速度很快，但我們也不能落後於他們！
dialogue_2091=前線情況危急，我們必須組織一次有效的反攻，阻止盟軍繼續推進。
dialogue_2092=沒有什麼能阻止我們！
dialogue_2093=為了配合法軍的推進，我們制定了在法國南部對德軍的突襲行動。
dialogue_2094=我的部隊會把盟軍攔在海岸上！
dialogue_2095=看來我低估了他們的實力，派出裝甲部隊，擋住盟軍的攻勢。
dialogue_2096=德軍的殘餘部隊已經沒有威脅，全面進攻，佔領里昂。
dialogue_2097=指揮官，這次計畫如果成功，我們的軍隊將直指德國腹地，勝利指日可待。
dialogue_2098=橋頭堡被攻陷，我們需要派出援軍！
dialogue_2099=很好！繼續進攻，徹底摧毀德軍在此的殘餘勢力。
dialogue_2100=我們要趕在其他部隊之前攻陷柏林，我的火炮部隊會掩護你進攻柏林。
dialogue_2101=我的裝甲部隊將在北方為你掃除一切障礙。
dialogue_2102=柏林就在眼前了，勝利將屬於我們！
dialogue_2103=我的失敗不算什麼，柏林的命運已經註定。
dialogue_2104=我們突襲計畫成功了！敵軍部隊遭到了嚴重的打擊。
dialogue_2105=我們為什麼沒有提前發現日軍的動向？士兵們，立刻回到自己的崗位！
dialogue_2106=指揮官閣下，請您從側翼發起攻擊。我們將對島上的敵軍進行合圍。
dialogue_2107=敵人的援軍開始行動了，我的潛艇部隊會負責攔截他們。
dialogue_2108=偵察機已經探測到了英軍主力戰艦的位置，潛艇部隊隨時可以出發。
dialogue_2109=新加坡是帝國在亞洲的重要戰略城市，絕對不能落入日軍的手中。
dialogue_2110=指揮官閣下，請您迅速完成登陸行動。我們的艦隊將同時向敵人的海軍發動進攻。
dialogue_2111=英軍皇家艦隊已經不復當年之勇，趁敵人混亂之際，給他們致命一擊。
dialogue_2112=日軍距離新加坡僅有一步之遙。出動所有預備隊，無論如何也要守住新加坡。
dialogue_2113=英軍的防線已經崩潰。我們將以仰光為據點，佔領整個緬甸。
dialogue_2114=指揮官閣下，請您在進攻仰光的同時，派遣一支機動部隊，和我一起切斷敵軍的補給線。
dialogue_2115=我們已經無法抵擋日軍的進攻了。撤退！在曼德勒周邊重新建立防線。
dialogue_2116=前線的英國人快要支撐不住了，立刻前往支援。
dialogue_2117=敵人的主力已經開往前線，這是發動突襲，切斷敵軍的補給的最好時機。
dialogue_2118=英軍在緬甸的勢力正在土崩瓦解，一鼓作氣奪取剩下的據點！
dialogue_2119=指揮官閣下，儘快佔領莫爾茲比港。我會為您提供空中支援。
dialogue_2120=航母編隊會同時向所羅門群島上的敵軍發動進攻，掩護部隊登陸。
dialogue_2121=請小心敵人的援軍，避免登陸部隊的過大傷亡。
dialogue_2122=最後一道防線已經被日軍摧毀，澳洲將徹底暴露在敵人的炮火之下！
dialogue_2123=指揮官閣下，我們的兵力有限，在進攻的同時請與海軍部隊密切配合。
dialogue_2124=只有不怕死的人才配活著！我們是太平洋戰場上最後的希望。
dialogue_2125=敵軍似乎仍然想要奪回他們失去的土地。指揮官閣下，請務必做好防禦準備。
dialogue_2126=任何時候都不能失去信心。只要太平洋艦隊還在，就有勝利的希望。
dialogue_2127=在這個關鍵的時刻，撤退就會前功盡棄。
dialogue_2128=我軍的傷亡過大，士兵們早已疲憊不堪。大本營已經決定停止進攻，全軍立即撤退！
dialogue_2129=指揮官閣下，請務必抵擋住英軍的追擊，為我們日後反攻印度保留希望。
dialogue_2130=我們守住了英帕爾，但是只要日軍還在，這場戰役就不算結束。
dialogue_2131=日軍艦隊已經開始回撤，這是奪回失地的大好時機。
dialogue_2132=英軍的進攻難以阻擋，曼德勒危在旦夕。
dialogue_2133=蘇軍的主力已經被德國徹底拖住了，我們在西伯利亞的行動將會影響整個世界。
dialogue_2134=指揮官閣下，請利用我軍的機動優勢，避開蘇軍的主力裝甲部隊，優先佔領防禦薄弱的城市。
dialogue_2135=為了配合您的行動，我的部隊將會從多個方向對蘇軍發動進攻。
dialogue_2136=我們沒有多餘的精力來對付這些日本人。必須儘快找到日軍的主力，速戰速決。
dialogue_2137=敵軍的裝甲集團正朝我的位置前進，我需要增援！
dialogue_2138=指揮官閣下，我們必須迅速突破敵人的海上防線並完成登陸。注意！請務必遠離美軍的偵查範圍。
dialogue_2139=我們無法抵擋日軍的艦隊。必須聯合友軍，集中力量將他們的登陸部隊趕回海裡。
dialogue_2140=就地建立防線，抵擋住他們的進攻。
dialogue_2141=不斷地防守就是自取滅亡。我們必須通過進攻來為最終武器的研發爭取時間。
dialogue_2142=美國人居然率先向我們發起了進攻。儘管出乎意料，但這同樣也是削弱他們實力的一個機會。
dialogue_2143=指揮官閣下，請在抵禦美軍主力的同時，對敵人的研究設施發動突襲。
dialogue_2144=勇敢的人只要尚存一線希望就不會被擊垮。
dialogue_2145=收到急報，日軍偷襲了珍珠港，港內軍艦受損嚴重，立即回航反擊日軍！
dialogue_2146=指揮官，我的部隊將攔截日軍的進攻，請你儘快趕回，支援珍珠港。
dialogue_2147=突襲計畫很成功，準備發動第三次攻擊，徹底消滅太平洋艦隊。
dialogue_2148=敵人的援軍已經趕到，我們需要戰艦支援。
dialogue_2149=突襲部隊損失慘重，我無法接受這樣的“成功”。
dialogue_2150=新加坡對於大本營的計畫有著重大的意義，在英國援軍到來前佔領新加坡。
dialogue_2151=日軍準備發動進攻並佔領新加坡，立即做好準備，不能讓日軍得逞。
dialogue_2152=指揮官，我的艦隊已經抵達，我將協助您發動進攻。
dialogue_2153=英軍攻勢迅猛，請立即派出援軍。
dialogue_2154=進攻中途島的日軍數量龐大，堅守陣地，必須保證中途島始終在我們手中。
dialogue_2155=航母編隊，負責牽制敵人的進攻。
dialogue_2156=敵人防禦力量十分強大，我們的部隊遭到了重創。
dialogue_2157=由於指揮作戰失誤，艦隊接連失利，已經無法挽回敗局。
dialogue_2158=日軍的行動十分迅速，他們的機場已經建成，並且構築了相當完善的防禦工事。
dialogue_2159=指揮官閣下，我將在瓜島東北方向發起進攻，分散他們的注意力。請迅速登陸，消滅島上的守軍。
dialogue_2160=我的艦隊遭到了敵人的突襲。
dialogue_2161=指揮官閣下，日軍正飽受病痛的折磨，士氣低落。這是我們發起進攻的絕佳機會。
dialogue_2162=盟軍三路部隊將同時發起進攻，務必第一時間攻下曼德勒。
dialogue_2163=敵軍攻佔了曼德勒，這不是一個好消息。
dialogue_2164=在這最後的戰場上，我們已經退無可退，衝鋒！
dialogue_2165=盟軍投入了大量海軍掩護部隊登陸，勢必奪回菲律賓。
dialogue_2166=這裡已經被帝國所佔領，把麥克亞瑟趕回海裡，讓他在太平洋繼續遊蕩。
dialogue_2167=我的偵察機發現了日軍主力航母艦隊，徹底消滅他們的航母編隊！
dialogue_2168=小澤成功的拖住了敵人的主力航母艦隊。
dialogue_2169=艦隊再一次失敗，帝國的海軍已經不復存在。
dialogue_2170=堅守陣地，每個士兵至少擊斃十名敵人，直至最後一兵一卒。
dialogue_2171=指揮官，攻下這座島嶼，我們就能對日本本土發起有效的戰略轟炸。
dialogue_2172=情報表明，這座島嶼的防禦力量非同尋常，攻下這座島嶼將付出巨大的傷亡，請小心行事。
dialogue_2173=在戰場上倒下，是身為武士的光榮。
dialogue_2174=指揮官，我們要儘快解決前方的日軍，趕在美軍之前向日本本土發起進攻。
dialogue_2175=蘇聯人妄圖對帝國本土發起進攻，我們要在這裡擋住他們。
dialogue_2176=指揮官，我們時間緊迫，佔領機場能加快我們的攻勢。
dialogue_2177=指揮官，日本人負隅頑抗，我們要對日本本土發起進攻，請加入我的行動。
dialogue_2178=我們需要儘快登陸，建立防禦設施，我們將要面對的可能不僅僅是日本。
dialogue_2179=日本已經投降，這塊土地是蘇聯的，把美國人趕出去！
dialogue_2180=蘇聯的野心在我意料之中，指揮官，我們要面對兩國軍隊，這是一場艱難的戰爭。

dialogue_2181=我的部隊已經完成了登陸行動，他們需要盡可能多的增援來守住前線陣地。
dialogue_2182=皇家艦隊將向敵人的港口發起進攻，同時我會派出陸軍部隊為您提供增援。
dialogue_2183=指揮官閣下，請注意北約援軍的行動，阻止敵人上岸並把他們徹底消滅在海裡。
dialogue_2184=北約的計畫已經失敗，反擊的時刻到了！
dialogue_2185=蘇聯人的軍隊已經在高加索地區集結，我們的進攻路線已經被徹底封鎖。
dialogue_2186=我的艦隊會向蘇聯海軍發起進攻，對敵軍的地面部隊進行牽制。
dialogue_2187=指揮官閣下，請配合我一同消滅敵人的先頭部隊，為進攻土耳其做準備。
dialogue_2188=指揮官閣下，是時候向土耳其發動進攻了。
dialogue_2189=您可以配合我的艦隊，繞過土耳其的防線，優先解決沿海的美軍。
dialogue_2190=北約軍隊已經在向安卡拉推進，我的部隊很難抵擋住他們的進攻。
dialogue_2191=指揮官閣下，請您迅速派遣援軍，務必保證安卡拉在我們的控制之中。
dialogue_2192=我的部隊正在開往前線作為增援。
dialogue_2193=時機已經成熟，北約的陸軍主力已經損失殆盡。下一步作戰目標：佔領土耳其全境。
dialogue_2194=敵人已經布下了嚴密的防線。我們將拿下安卡拉，並以此為據點進攻土耳其。
dialogue_2195=敵軍已經攻入我們的腹地，無論如何也要擋住他們的進攻。
dialogue_2196=北約在西歐組建了聯軍，準備從兩個方向對我們發動大規模進攻。
dialogue_2197=士兵們，展現我們力量的時候到了。把蘇聯人趕回去。
dialogue_2198=指揮官閣下，敵軍的聯盟十分強大。請抓住戰機將他們逐個擊敗，期待能夠在柏林與您會師。
dialogue_2199=我堅守到了最後一刻，華沙已經危在旦夕。
dialogue_2200=北約在西歐的軍隊向我們發動了突然襲擊，我們的盟軍損失慘重。
dialogue_2201=我堅守到了最後一刻，華沙已經危在旦夕。
dialogue_2202=指揮官閣下，我們必須讓敵人為自己的行為付出代價。紅色風暴將席捲整個歐洲！
dialogue_2203=情報顯示，美軍新一批的援軍正從西海岸開往亞洲。
dialogue_2204=我的空軍在附近海域偵察到了大批蘇軍。立即終止行動，向岸上撤退。
dialogue_2205=指揮官閣下，請攔截敵人的運輸船隊，為我們的登陸行動減少阻礙。
dialogue_2206=我們沒能阻止敵人登陸，但是絕不能再讓他們前進一步。
dialogue_2207=北約的海軍突然在後方出現，他們正在一點點地把我們包圍。
dialogue_2208=指揮官閣下，我們的行動早已暴露，必須儘快登陸美國本土，避免消耗。
dialogue_2209=士兵們，進攻！把敵人的計畫徹底粉碎在海洋上。
dialogue_2210=北約已經徹底失敗了，美國人還在做著最後的抵抗。
dialogue_2211=我們的援軍即將抵達東海岸。守住我們的陣地，聯合友軍徹底擊敗美國。
dialogue_2212=我的艦隊會擋住敵人的援軍，現在集中力量擊潰陸上的蘇軍。星條旗永不落！
dialogue_2213=大戰結束，歐洲各國元氣大傷，我們要趁機發動一次進攻，擴大領土。
dialogue_2214=蘇聯人集結了大量軍隊，準備進一步侵佔歐洲，我們要在前線擋住他們。
dialogue_2215=德國受到了蘇聯的猛烈進攻，我們必須支援他們。
dialogue_2216=德國已經不堪一擊，進攻！獲勝輕而易舉。
dialogue_2217=我們成功說服了比利時與荷蘭加入我們圍攻德國。
dialogue_2218=蘇聯推動北韓發起戰爭，佔領了首爾，我們將派部隊從仁川登陸，配合南韓守軍發動反攻。
dialogue_2219=聯合國軍已經抵達南韓。調集部隊消滅他們，這次計畫不容有誤。
dialogue_2220=我們應該乘勝追擊，徹底消滅蘇聯人的野心。
dialogue_2221=蘇聯在古巴附近部署了大量導彈，他們隨時能向我們發射核彈，指揮官閣下，我們必須不惜一切代價奪取並摧毀導彈發射井。
dialogue_2222=總統無法忍受蘇聯人的這種挑釁行為，必須讓他們先嘗點苦頭。
dialogue_2223=進攻！教訓一下那些美國人。
dialogue_2224=蘇聯人封鎖了蘇伊士運河，企圖獨佔中東地區的石油資源，我們絕不能讓他們得逞。
dialogue_2225=進攻，徹底佔領中東地區的石油基地，然後把那些歐洲人趕回去。
dialogue_2226=蘇聯的行動如此之快，情況對我們非常不利。
dialogue_2227=蘇聯軍隊數量龐大，我會同英國盟軍在北面牽制敵人主力。指揮官，請你伺機從南側薄弱點進攻他們的後方，形成合圍。
dialogue_2228=美國的援軍已經接近，發起進攻，在他們趕到前奠定勝局。
dialogue_2229=發動轟炸！不能給他們任何喘息的機會。
dialogue_2230=北約軍隊數量驚人，但是推進速度很慢，集結部隊，準備下一次進攻。
dialogue_2231=看來我們沒能及時趕到，蘇軍已經佔領部分城市。指揮官，我們要趁蘇聯休整軍隊時，發起進攻，奪回失地。
dialogue_2232=指揮官，偵察機發現蘇聯人在南部戰線還未修建防禦工事，這是一個突破口。
dialogue_2233=想不到蘇聯在南極的基地已經具備如此規模，這次行動定要徹底消滅他們！
dialogue_2234=堅守陣地，這是我們發動反擊的最後機會。
dialogue_2235=發射導彈，炸平他們，反擊的時刻到了！

dialogue_2236=敵軍的攻勢十分猛烈。情報顯示，不僅是多處油田被佔領，許多國家的重要城市也正在遭受攻擊。
dialogue_2237=你們來得太晚了。繼續進攻！用不了多久我們就將成為整個海灣地區的主宰。
dialogue_2238=我們的盟友恐怕堅持不了多久了。指揮官閣下，請立刻派遣軍隊，解除海灣地區的危機。
dialogue_2239=我們的優勢顯而易見，任何的抵抗都是徒勞的。
dialogue_2240=敵軍的目標是巴格達，已經有多路敵人在向那裡集結。指揮官閣下，請不惜一切代價阻止他們的計畫。
dialogue_2241=佔領剩下的城市，然後向英國發起進攻，很快我們就能掌控整個歐洲。
dialogue_2242=敵人從各個方向發起進攻，許多城市已經淪陷。指揮官，我們的目的是儘快登陸，解除歐洲的困境。
dialogue_2243=這次撤退只是暫時的，我還會回來的。
dialogue_2244=這次的轉移十分成功，蘇聯人似乎不堪一擊。我們離莫斯科已經沒有多少距離了！
dialogue_2245=敵人以為攻佔了幾座城市就能贏得戰爭的勝利，但是他們錯了。蘇聯從未被徹底擊敗過，這次也不會！
dialogue_2246=第聶伯河已經被敵人封鎖，蘇聯人的情況並不樂觀。優先奪回基輔，再從斯摩棱斯克向莫斯科進軍。
dialogue_2247=我們必須增援哈爾科夫的友軍，他們是奪回史達林格勒和莫斯科的重要力量。
dialogue_2248=莫斯科西面的屏障已經被摧毀，這裡的蘇軍根本不是我們的對手。
dialogue_2249=哈爾科夫已經失守，敵人的部隊即將逼近莫斯科，決戰的時刻就要到了。
dialogue_2250=莫斯科已經危在旦夕，我的部隊會協助您拿下基輔，為全面反攻做好準備。
dialogue_2251=歐洲的失敗不算什麼，這次一定要徹底攻佔北美地區，全體出擊，迅速結束戰鬥。
dialogue_2252=指揮官閣下，雖然我們的壓力減小了許多，但敵人數量還是在我們之上，我們需要你的協助。
dialogue_2253=紐約的敵人已經被消滅，我看到了勝利的曙光！
dialogue_2254=紐約是我們的了，就地建立防禦，小心他們的反擊。
dialogue_2255=敵人數量太多，我並沒有得到及時的援助，華盛頓情況危急。
dialogue_2256=沒想到東南亞和澳洲也已經被恐怖分子襲擊了。但我們的到來就意味著戰局的扭轉。
dialogue_2257=沒有人敢在海洋中向我發起挑戰，你是第一個，也將是最後一個。
dialogue_2258=我們已經佔領了群島中部的島嶼。我的裝甲部隊即刻出發，火速增援澳洲的友軍。
dialogue_2259=指揮官閣下，請您務必確保這座島嶼在我們的控制之下。
dialogue_2260=敵人的援軍正由多個方向朝我們這裡趕來。
dialogue_2261=島上的守軍已經頂不住了，我的艦隊現在就回防，重新奪回這個要地。
dialogue_2262=達爾文已經落入了敵人的手中，澳洲的部隊正在潰退。
dialogue_2263=指揮官閣下，請您優先奪回達爾文並守住澳洲本土。
dialogue_2264=指揮官閣下，敵人的防守非常嚴密，我們應該集合力量，把他們逐個擊破。
dialogue_2265=西伯利亞是我們建設了多年的基地，你們竟然想進攻這裡，我會讓你們後悔做出這個決定。
dialogue_2266=進攻，讓敵人湮滅在我的炮火之下。
dialogue_2267=你們的舉動只會使你們更快滅亡，感受我的憤怒吧。
dialogue_2268=敵人雖然失去了西伯利亞的基地，但是他們的襲擊並沒有停止。我們要發起全面的反擊，不能給敵人喘息的機會。
dialogue_2269=我們的部隊在亞洲節節敗退，但是這裡的諸位都是精英中的精英。蘇聯人會為自己魯莽的進攻付出代價！
dialogue_2270=指揮官閣下，這是敵人最後的基地，決戰的時刻到了，消滅他們。
dialogue_2271=你們竟然能找到這裡，不過也就到此為止了。解決他們！
dialogue_2272=你們既然來到這裡，就別想再回去了。
dialogue_2273=敵人的行動很迅速，不能讓他們再逃走了，乘勝追擊!
dialogue_2274=這裡就是他們的大本營，無論如何這都將是最後一戰了！
dialogue_2275=我們的研究即將完成，讓這些不知死活的人見識一下真正的力量！
dialogue_2276=為什麼蘇聯人會在這時候出現？不過眼下敵人的敵人就是朋友，想獲得最終的勝利還要依靠蘇軍的力量。
dialogue_2277=現在敵人已經群龍無首了，勝利就在眼前。而引發這一切的技術應該被永遠地封存起來。
dialogue_2278=這些技術是蘇聯的財產，任何人都無權下這樣的命令！
dialogue_2279=沒有永遠的朋友，也沒有永遠的敵人，只有永遠的利益。
dialogue_2280=恐怖分子居然利用了我們遺留的軍事基地。指揮官，我們要把恐怖分子徹底消滅，絕不能讓他們掌握這樣可怕的技術。
dialogue_2281=芬蘭拒絕了我們的領土建議，等待他們的是最先進的武器和最無畏的戰士，這場戰爭將會很快以我軍的勝利而結束。
dialogue_2282=我們尊重蘇聯的權利和利益，但我們不會容忍任何人侵犯我們的領土和主權。
dialogue_2283=打仗並不是一次讓人愉快的經歷，但如果我們不上戰場的話，誰來保護這片土地？
dialogue_2284=芬蘭的地形不利於我軍的行進。戰爭是嚴肅的，不能因為自滿和輕敵而犯錯誤。我們的軍隊需要有更加謹慎和明智的指揮，不可輕視敵人的實力和威脅。
dialogue_2285=你們不應該低估我們的實力和決心。芬蘭人民不會屈服於任何人的壓力和威脅，我們會為我們的土地而戰。
dialogue_2286=我們希望通過和平談判解決我們之間的分歧，但如果必要的話，我們會採取一切必要的措施來保衛我們的國家。
dialogue_2291=波蘭人對德國格萊維茨電臺發動攻擊，這是對德軍不可饒恕的挑釁，我們必將採取更激進的措施應對。
dialogue_2292=這場鬧劇是德國人自導自演的。我們需要警惕德國人可能發動的戰爭。
dialogue_2293=勃蘭登堡特種部隊已經提前部署在敵國境內，他們將與我們協同作戰。準備發動攻擊！
dialogue_2294=敵方主要將領已經被消滅，敵軍士氣受到了重大打擊。繼續進攻，勝利已經近在眼前。
dialogue_2295=波蘭在與德國的戰爭中表現混亂並呈現解體狀態。因此，蘇聯先前與波蘭簽訂的協議都將不再有效。
dialogue_2296=蘇聯軍隊將越過邊境，以保護在波蘭境內的俄羅斯民族，並讓他們重返平靜的生活。
dialogue_2301=低地國家的資源和軍事設施對帝國擴張計畫來說是個隱患，因此我們必須要趕在英法之前將這些地區變為帝國領土。
dialogue_2302=在下一步進攻蘇聯之前，德軍必須消除整個西歐的一切威脅。
dialogue_2303=馬奇諾防線看似堅不可摧，但這並不能阻擋我們前進的步伐。盟軍還未真正瞭解機械化部隊的實力，我們的坦克將從敵人意想不到的地方發起攻擊。
dialogue_2304=德軍主力居然繞過馬奇諾防線，出現在阿登森林，這讓我們措手不及。
dialogue_2305=我們不會被這次出人意料的進攻擊倒。我們將會採取一切必要的措施，堅決抵抗德軍的進攻，直到最後一刻。
dialogue_2306=阿登森林的進攻似乎遭受到異乎尋常的阻力，我們需要改變思路，從多個方向發起攻擊！
dialogue_2307=我們已經經歷了太多苦難，我們已經失去了許多親人和朋友。但我們不能放棄，我們必須繼續戰鬥，勝利的曙光就在眼前。
dialogue_2308=進攻蘇聯的軍隊已集結完畢，作為中央集團軍，我們必須首戰告捷，一舉拿下明斯克！
dialogue_2309=德軍公然違反蘇德互不侵犯條約，入侵蘇聯領土。我已經能聽到坦克的轟鳴聲，迅速組織各條戰線進行防守！
dialogue_2310=德軍在蘇聯的進攻勢如破竹，芬蘭也必須收回領土，奪回卡累利阿地峽。
dialogue_2311=德軍將在南部配合我們共同行動。
dialogue_2312=拉多加湖上的機場並沒有太多兵力防守，攻佔這座機場，這對我們至關重要。
dialogue_2313=明斯克的勝利再次證明瞭閃電戰的成功，敵軍無法阻擋我們裝甲集團軍的進攻。
dialogue_2314=決不能讓敵人再前進一步，必須守住斯摩棱斯克！
dialogue_2315=敵軍雖然數量眾多，但並不能形成有效的戰鬥力。
dialogue_2316=基輔是通往高加索地區的必經之路，利用鉗形攻勢拿下這座城市！
dialogue_2317=列寧格勒有敵軍重兵把守，我們需要先對其進行包圍，再一步步攻陷這座城市。
dialogue_2318=芬蘭軍隊會在北方與我們一同發起進攻。
dialogue_2319=蘇聯人通過拉多加湖給列寧格勒源源不斷的帶去補給，這是無法被饒恕的。
dialogue_2320=切斷他們的補給線，然後殲滅他們！
dialogue_2321=壞消息是坦克被抽調走，我們目前只有步兵和火炮可用。
dialogue_2322=好消息是本土增援來的古斯塔夫巨砲將助我們一臂之力。
dialogue_2323=讓他們嘗嘗800毫米口徑的威力，塞瓦斯托波爾將為之顫抖！
dialogue_2324=我們必須搶在敵軍把工廠設備搬離哈爾科夫之前佔領這座城市！
dialogue_2325=小心敵軍的火箭炮，他們的火力壓制給我們造成了不小的損失。
dialogue_2326=敵軍在莫斯科集結了超過100萬部隊，如此數量的部隊和冬日的嚴寒對我們造成很大的威脅。
dialogue_2327=巴巴羅薩能否成功在此一役！
dialogue_2328=繼續前進！我已經能從望遠鏡裡看到克裡姆林宮頂端的紅星了。
dialogue_2329=已經沒有什麼能失去的了，我們不能後退一步，這是蘇聯的生死存亡之戰！
dialogue_2330=史達林格勒的工廠和資源對我們十分重要，指揮部傳來命令，必須拿下這座城市！
dialogue_2331=決不能放棄這座偉大的城市，我們要為這座城市的名字而戰！
dialogue_2332=向南進軍，與西邊的我方集團軍會合。
dialogue_2333=華沙已被佔領。指揮官閣下，消滅蘇聯的軍隊，整個波蘭都將被我們收入囊中。
dialogue_2334=指揮官閣下，他們的防線形同虛設，我們將從南部繞過發起進攻。
dialogue_2335=向巴黎推進！
dialogue_2336=與南方部隊聯合，我們即將橫掃巴黎！
dialogue_2337=不要放棄，堅持下去，我們一定可以拿下這座城。
dialogue_2338=指揮官閣下，請從南部發起進攻，北方的友軍會協助我們包圍庫爾斯克。
dialogue_2339=蘇聯紅軍已經包圍了布達佩斯，指揮官閣下，請帶領部隊抵擋蘇軍的攻勢，守住這座城市。
dialogue_2340=不惜一切代價，消滅湧入城市的蘇軍。他們不會讓任何一個德國人活著成為戰俘。要麼戰，要麼死！
dialogue_2341=敵人太多了，我們撐不住了。
dialogue_2342=大勢已去，布達佩斯即將陷落。指揮官閣下，請帶領我們突圍撤離，絕不能讓蘇軍斷了後路。
dialogue_2343=指揮官閣下，英軍將從東面登陸，協助您發起進攻。一起攻入突尼斯，把德軍軍隊趕出非洲！
dialogue_2344=敵人守衛的兵力薄弱，就是現在！抓緊時機登陸西西里島。
dialogue_2345=西西里島已經在我們的掌控之下，我們扼住了敵人的咽喉，這是一場關鍵性的勝利。
dialogue_2346=經歷了兩年多的準備，這一偉大的時刻即將來臨。指揮官閣下，請帶領盟軍登陸海灘並奪取諾曼第地區。
dialogue_2347=進攻，猛烈進攻！不要讓盟軍順利登陸海灘。
dialogue_2348=菲律賓對我們來說太重要了，我們計畫從呂宋島登陸，發起進攻。指揮官閣下，麥克亞瑟將軍將與您並肩作戰，請奪取呂宋島，恢復對菲律賓的控制，削弱日本在太平洋地區的力量。
dialogue_2349=首都馬尼拉已經被我們佔領。指揮官閣下，請不要大意，繼續追擊殘存的日軍部隊。
dialogue_2350=破壞橋樑，鋪設障礙，阻止美軍的前進。
dialogue_2351=我們的兵力遠超德軍，敵人這是自尋死路。迅速結束這場戰鬥。
dialogue_2352=糟糕，先鋒軍過於大意而失利了。指揮官閣下，請帶領我們挽回局勢。
dialogue_2353=德意志帝國是不可阻擋的。士兵們，前進！目標莫斯科！
dialogue_2354=德軍軍隊居然敢覬覦莫斯科，他們會為自己的傲慢付出代價。指揮官閣下，請帶領人民捍衛我們的首都。
dialogue_2355=德國人戰無不勝的閃電戰神話即將破滅，勝利屬於蘇聯。
dialogue_2356=我們即將贏得戰鬥，可是勝利的代價是巨大的。永遠銘記那些為國捐軀的蘇聯士兵。
dialogue_2357=敵人出動了如此大規模的裝甲部隊，這定將成為一場史詩般的戰役。指揮官閣下，請帶領我們抵禦德軍的進攻。
dialogue_2358=當心來自北方的德軍的夾擊！利用一切資源，堅守防禦陣型。
dialogue_2359=反攻的號角已經吹響。追擊並消滅殘存的德軍！
dialogue_2360=指揮官閣下，您將帶領我們收復蘇聯的失地，吹響反攻德軍德國的號角！
dialogue_2361=白俄羅斯被解放了，我們取得的勝利是巨大的。乘勝追擊，收復更多西邊的失地。
dialogue_2362=我們即將攻入柏林，指揮官閣下，美軍與英軍將協助您發起進攻。
dialogue_2363=不惜一切代價也要阻止敵人進入柏林，保護元首的安全！
dialogue_2364=德國失敗了，是時候結束這場戰爭了。
dialogue_2365=敵人已經無路可退了，這將是他們的末路。
dialogue_2366=士兵們，堅持住！我們的援軍一定會到來。
dialogue_2367=那是英國人的援軍！集中火力進攻，不要讓他們有可乘之機！
dialogue_2368=英軍的規模雖然在我們之上，他們的進攻卻非常笨拙，漏洞百出。指揮官閣下，請化解敵人的攻勢，並帶領我們取得勝利。
dialogue_2369=調動兵力，從側翼繞後發起偷襲，給予敵人重創！
dialogue_2370=英國人的防線從加查拉的海岸一直向南蔓延，從西邊發起正面進攻無疑會遭受巨大損失。指揮官閣下，請帶領我們迂回至敵人後方，發起偷襲。
dialogue_2371=是德軍！他們為什麼會出現在我們後方？
dialogue_2372=圖卜魯格已經失守。士兵們，撤退！
dialogue_2373=向開羅進軍，指揮官閣下，請協助我們搶在盟軍之前佔領埃及。
dialogue_2374=敵人的反抗十分激烈。士兵們，成敗在此一舉，堅信我們一定會戰勝對手！
dialogue_2375=那是敵人的支援部隊！指揮官閣下，請帶領我們突破英軍的包圍圈。
dialogue_2376=敵人的援軍和補給源源不斷，我們有大麻煩了！
dialogue_2377=德意志帝國一定會捲土重來！



