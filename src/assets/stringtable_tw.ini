event_stage_intro_20801=德軍出其不意地繞過了馬奇諾防線，低地國家也相繼淪陷。司令部發起“發電機行動”，命令我們全力掩護法軍主力與遠征軍向敦克爾克和加萊方向撤退。在這個崇尚武力的時代，綏靖政策的惡果只能由我們自己來承擔。無論前方多麼險峻，我們將堅定地執行命令！為了家族的榮耀！為了並肩作戰的戰友！為了皇家空軍！為了大英帝國！
event_stage_intro_20802=我們錯過了最佳撤退時機，阿爾弗雷德在空戰中跳傘逃生，生死未卜。然而，有人卻悄悄向我們提供了目擊情報──阿爾弗雷德和其他被俘虜的戰友暫時被關押在山間小鎮，不久後就會被轉移到柏林。時間已經不多了，無論情報多麼不確定，我們都必須一試，不能放棄自己的戰友。
event_stage_intro_20803=盟軍在西線的失敗證明了地面戰場才是當下戰爭中最重要的一環，而裝甲部隊正是地面戰場的關鍵。此時陸軍在北非戰場的敗退，正如彼時彼刻的歐洲戰場。不同的是德軍攻勢雖然依舊迅猛，但裝備和兵員的補給卻是我們佔優。我們的裝甲師將會在北非戰場所向披靡。
event_stage_intro_20804=欺騙行動成功奏效，德軍在諾曼第的防禦工事尚未完工！我們面前的黃金海灘上也沒有發現敵人的重火力。機會就在眼前！我將迅速清理出一片灘頭陣地，為友軍的登陸鋪路。這一刻，我們將一同奮戰，踏上重奪勝利的旅程！
event_stage_intro_20805=為什麼德軍還能有這麼多的兵力組織大規模的攻擊？巴斯托涅的守軍已被困在包圍圈內，幾乎沒有撤離的可能。除非援軍能預判敵軍的動向，及時向我們支援，否則我們只能將最後的希望寄託在英軍身上了。
event_stage_intro_20806=戰爭徹底改寫了世界格局，美蘇兩極成為新的霸主。各殖民地紛紛獨立，帝國的疆域不斷縮小，往昔的榮耀與輝煌已成過去。在新政府的領導下，我們遲早會淪為美國的附庸。然而，眼前的威脅已經逼近——蘇軍現已佔領墨西哥東部，正沿著陸路北上，意圖入侵美國。新時代的戰爭已然打響，我們必須擁有一支屬於自己的武裝力量，捍衛帝國最後的尊嚴。
event_stage_intro_20807=在遺蹟的發現同時引起了美蘇雙方的注意。這些劃時代的武器與科技足以顛覆全世界，如今他們都展開行動。然而，在神秘信號的引導下，我們的先遣隊搶先一步，發現了南美的遺跡群。不管那些人是誰，他們的目的似乎和我一樣：打破現有格局，重新建立一個全新的世界秩序。
event_stage_intro_20811=德軍出其不意地繞過了馬奇諾防線，低地國家也相繼淪陷。司令部發起“發電機行動”，命令我們全力掩護法軍主力與遠征軍向敦克爾克和加萊方向撤退。在這個崇尚武力的時代，綏靖政策的惡果只能由我們自己來承擔。無論前方多麼險峻，我們將堅定地執行命令！為了家族的榮耀！為了並肩作戰的戰友！為了皇家空軍！為了大英帝國！
event_stage_intro_20812=我們錯過了最佳撤退時機，阿爾弗雷德在空戰中跳傘逃生，生死未卜。然而，有人卻悄悄向我們提供了目擊情報──阿爾弗雷德和其他被俘虜的戰友暫時被關押在山間小鎮，不久後就會被轉移到柏林。時間已經不多了，無論情報多麼不確定，我們都必須一試，不能放棄自己的戰友。
event_stage_intro_20813=盟軍在西線的失敗證明了地面戰場才是當下戰爭中最重要的一環，而裝甲部隊正是地面戰場的關鍵。此時陸軍在北非戰場的敗退，正如彼時彼刻的歐洲戰場。不同的是德軍攻勢雖然依舊迅猛，但裝備和兵員的補給卻是我們佔優。我們的裝甲師將會在北非戰場所向披靡。
event_stage_intro_20814=欺騙行動成功奏效，德軍在諾曼第的防禦工事尚未完工！我們面前的黃金海灘上也沒有發現敵人的重火力。機會就在眼前！我將迅速清理出一片灘頭陣地，為友軍的登陸鋪路。這一刻，我們將一同奮戰，踏上重奪勝利的旅程！
event_stage_intro_20815=為什麼德軍還能有這麼多的兵力組織大規模的攻擊？巴斯托涅的守軍已被困在包圍圈內，幾乎沒有撤離的可能。除非援軍能預判敵軍的動向，及時向我們支援，否則我們只能將最後的希望寄託在英軍身上了。
event_stage_intro_20816=戰爭徹底改寫了世界格局，美蘇兩極成為新的霸主。各殖民地紛紛獨立，帝國的疆域不斷縮小，往昔的榮耀與輝煌已成過去。在新政府的領導下，我們遲早會淪為美國的附庸。然而，眼前的威脅已經逼近——蘇軍現已佔領墨西哥東部，正沿著陸路北上，意圖入侵美國。新時代的戰爭已然打響，我們必須擁有一支屬於自己的武裝力量，捍衛帝國最後的尊嚴。
event_stage_intro_20817=在遺蹟的發現同時引起了美蘇雙方的注意。這些劃時代的武器與科技足以顛覆全世界，如今他們都展開行動。然而，在神秘信號的引導下，我們的先遣隊搶先一步，發現了南美的遺跡群。不管那些人是誰，他們的目的似乎和我一樣：打破現有格局，重新建立一個全新的世界秩序。


