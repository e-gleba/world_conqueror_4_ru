dialogue_2883=諸君，關島現在毫無防備，必須盡快奪下!
dialogue_2884=第4裝甲集團軍向史達林格勒突擊，必須把第6集團軍解救出來！
dialogue_2885=穩住陣地，確保包圍圈完整！
dialogue_2886=第6集團軍，把握機會，盡快突圍！
dialogue_2887=我們已經沒有補給了。全軍聽令，放棄突圍，等待救援。
dialogue_2888=突破敵軍防線，穿過阿登山地，向安特衛普突擊！
dialogue_2889=穩住陣線，絕不能讓德軍威脅補給線！
dialogue_2890=各部隊注意，向迪南集中，抵擋德軍攻勢！
dialogue_2891=補給已經到位！士兵們，復仇的時候到了，剿滅突出部的所有敵人！
dialogue_2892=軍隊已無力完成計劃了。全軍撤退，保存實力。
dialogue_2893=必須拿下巴斯托涅，保障部隊安全通過阿登山區！
dialogue_2894=守住巴斯托涅，第三集團軍很快就會增援！
dialogue_2895=快速突擊，給巴斯托涅解圍！
dialogue_2896=同志們，敵軍的力量已經衰弱，擊潰南方集團軍群，解放烏克蘭!
dialogue_2897=各部隊必須堅守至最後一刻，絕不後撤!
dialogue_2898=奉元首命令，我來接替指揮。各部隊穩固防線，交替後撤，保存實力。
dialogue_2899=瓦圖京大將先行養傷，我來接替。全軍聽令，繼續進攻！
dialogue_3100=德軍沙恩霍斯特號已經出動，正在搜索我軍護航隊。擊沉它!北極航線從此安全。
dialogue_3101=同志們，敵人殘害了我們的同胞，殺害了我們的戰友。我們必須為他們復仇！全軍進攻！
dialogue_3102=敵人虛偽的招降，實際上是要徹底消滅我們。將士們，堅守城市，等待救援，勝利一定屬於我們！
dialogue_3103=布達佩斯已經無法防守了。能突圍就突圍，無法突圍投降吧。國家會記得我們的犧牲。
dialogue_3104=敵軍大部隊已經向北轉移！瞄準薄弱部位，拿下斯特拉斯堡！
dialogue_3105=阿爾薩斯地區兵力薄弱，注意緊密防守。必要時，部隊可撤至孚日山脈組織防線。
dialogue_3106=拿下斯特拉斯堡，把敵人趕出孚日山脈！
dialogue_3107=守住陣線，阿登山區的部隊已經出發支援！
dialogue_3108=援助正在從美國運來，數千名士兵和數百架飛機正在被派遣。我們的部隊必須堅守，直到這些援軍到達。不能再撤退了。
dialogue_3109=我逃脫了，但是我必將回來！
dialogue_3110=老兵永不死，他們只是慢慢消逝。
dialogue_3111=你們可以俘虜我，巴丹也許會淪陷，但全世界熱愛自由的人民的精神不會被擊垮！
dialogue_3112=菲律賓，我回來了！各部隊上岸後向東南推進，解放馬尼拉！
dialogue_3113=遠離海岸作戰，避免敵軍艦砲火支援。守不下來就撤到山區打消耗戰！
dialogue_3114=同志們，列寧格勒人民已經抵抗圍困800多天。我們不能容忍這種境遇繼續下去！進攻！解放列寧格勒！
dialogue_3115=列寧格勒已經解圍，德軍無法阻擋正義的勝利！同志們，繼續追擊！
dialogue_3116=屈希勒將軍已被解職，現在由我來指揮。前線部隊收縮戰線，逐步撤至佩普西湖以西。
dialogue_3117=小部隊從左側吸引敵軍注意力，主力部隊從右側山區發動進攻，用「右勾拳」打穿防線！
dialogue_3118=依託山體和河谷來組織防線，任何一個陣地都不能放棄！
dialogue_3119=卡西諾的修道院很可能是敵軍的觀察點。空軍的轟炸馬上到位。士兵們，拿下那片陣地！
dialogue_3120=士兵們，進攻！奪回法國的領土！
dialogue_3121=第19集團軍馬上撤離，不能被敵軍圍殲。
dialogue_3122=這一戰的首要任務是消滅敵人。先從南北兩側完成包圍，再對包圍圈裡的敵人發動攻擊。
dialogue_3123=包圍圈已經形成。同志們，進攻！消滅包圍圈裡的敵人！
dialogue_3124=迅速突圍！包圍圈外的部隊迅速進攻，協助突圍！
dialogue_3125=突出部部隊快速撤離修整，其他部隊穩固陣地。
dialogue_3126=先壓滅奧盧週邊城鎮的敵軍，再對抗南部敵軍。戰士們，戰鬥吧！為了獨立的芬蘭！
dialogue_3127=德國的支援已經到位，敵軍訓練水準不如我們。戰士們，進攻！
dialogue_3128=敵方也有援軍嗎？戰士們，切斷運輸線，延遲援軍支援，勝利一定屬於我們！
dialogue_3129=我會去國外繼續鬥爭，直到一個獨立和平的芬蘭誕生為止！
dialogue_3130=你們在俄國的幫助下，縱使獲得了勝利，也無法讓芬蘭贏得獨立！
dialogue_3131=日軍的防守力量薄弱，這一戰就讓他們見識美國海軍的厲害！
dialogue_3132=艦載機出動，用他們的身體驗證航空母艦的威力！
dialogue_3133=各單位注意，敵方支援部隊到了。加快行動速度！
dialogue_3134=同志們，敵人妄圖防守河岸負隅頑抗。讓我們用砲火告訴敵人，為什麼正義會勝利！
dialogue_3135=我們正站在祖國領土的邊界上，任何的後退都會把戰火穿過空中及水路引向德國。我們絕不後退！
dialogue_3136=同志們，敵人曾經一度阻礙我們前進。但這一次，他們必須分兵別處。攻克防線，就在此戰！
dialogue_3137=將士們，我們曾一度擋住敵軍的攻勢。這一次，我們依舊能做到！為了祖國！


event_208=黑蠍起源

