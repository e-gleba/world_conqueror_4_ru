skill_info_170=指揮裝甲部隊傷害增加[#00FF00#%d%%]，進攻後回復造成傷害10%%的HP，擁有增益狀態時致命一擊概率提升10%%且無視敵軍30%%防禦。指揮部隊移動時無視敵軍部隊的阻擋。攻擊後若目標未被消滅則可以再次攻擊（一回合1次）
skill_info_171=指揮裝甲部隊士氣不會降低，攻擊時敵軍[#00FF00#%d%%]概率無法反擊，殲敵後獲得持續1回合的“收割”（效果為造成傷害提高20%%，無視閃避）。指揮裝甲部隊攻擊力每有30則提升5%%致命一擊傷害，攻擊力不低於180時自身射程+1
skill_info_172=指揮步兵部隊有[#00FF00#%d%%]概率造成致命一擊，每回合回復上限15%%的HP。指揮步兵時，自身及周圍2格步兵傷害提高30%%，受到傷害降低25%%（擁有該技能時，步兵指揮官效果無效）
skill_info_173=指揮陸軍部隊在場時，回合內已消耗經濟的[#00FF00#%d%%]將會在下回合獲得（上限1200）。指揮陸軍部隊周圍3格內敵人被消滅則獲得40工業和4科技（1回合最多觸發3次）
skill_info_174=指揮潛艇（核潛艇除外）時無視敵軍防禦，進攻時射程+1。指揮潛艇殲敵後有[#00FF00#%d%%]概率再次攻擊，造成致命一擊時額外提升25%%概率。
skill_info_175=指揮潛艇受到傷害降低[#00FF00#%d%%]，受到空軍和導彈攻擊時有50%%概率閃避。指揮潛艇部隊每回合回復5%%上限的HP。

army_buff_desc_1631=收割：造成傷害提高20%，無視閃避



