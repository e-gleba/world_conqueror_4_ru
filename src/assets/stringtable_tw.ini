event_stage_intro_20601=史達林格勒城內的德軍已是強弩之末，每一座建築都是我們的堡壘和要塞，這座英雄城市擋住了德軍最猛烈的進攻！我們的部隊正在不斷集結，敵我兵力已經反轉，反擊的時刻即將到來。
event_stage_intro_20602=德軍重奪了哈爾科夫。情報顯示他們正在集結大量的裝甲部隊，意圖發起一場大規模進攻以消滅我們在庫爾斯克突出部的守軍。我們將構築多條堅固的防線，在這段防禦縱深中安插大量的兵力，打德軍一個措手不及。
event_stage_intro_20603=德軍正在不斷加固第聶伯河兩岸的工事，但大規模的防線絕不可能在短時間內完成。利用這個機會在下第聶伯河發動一場大型攻勢，拿下基輔，把戰線繼續向西推進。小心德軍的反攻，保存好進攻的主力。
event_stage_intro_20604=部隊已經在列寧格勒周邊集結完畢，這座被圍困了近3年的英雄城市即將迎來完全的解放。不過德軍在西邊建立了一道堅固的防線。必須發動一場攻勢，打敗北方集團軍，打通向西前進的道路。
event_stage_intro_20605=克里米亞無論是對德軍還是我們都有著極為重要的軍事價值。只要突破面前的防線，就能從陸路上孤立整個克里米亞，同時從北面和刻赤半島東面發起進攻。敵人的失敗只是時間問題，塞瓦斯托波爾的要塞終會被我們奪回。
event_stage_intro_20606=在經過庫爾斯克、下第聶伯河與克里米亞的攻勢後，中央集團軍群被暴露了出來。與此同時，德軍被我們的欺騙行動所誤導，將部分兵力調往了南方的北烏克蘭集團軍群。部隊已經集結完畢，現在就是全線進攻的時機，讓敵人為他們在三年前的愚蠢行為付出代價！
event_stage_intro_20607=西線的盟軍被擋在了萊茵河前，德軍正在東線集結最後的力量準備作殊死一搏。不過敵人的精銳已損失殆盡，迅速向西推進，儘快與西線的盟軍會師。柏林的命運早已註定。
event_stage_intro_20611=史達林格勒城內的德軍已是強弩之末，每一座建築都是我們的堡壘和要塞，這座英雄城市擋住了德軍最猛烈的進攻！我們的部隊正在不斷集結，敵我兵力已經反轉，反擊的時刻即將到來。
