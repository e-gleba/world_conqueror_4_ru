general_stage_intro_101=1939年9月，古德里安指揮德國的第19裝甲軍團，發動了對波蘭的閃電戰，同時蘇聯也從東部進攻，與德軍形成夾擊之勢，波蘭很快便淪陷。這場戰役標誌著第二次世界大戰的爆發。
general_stage_intro_102=1940年5月，古德里安繼續率領第19裝甲軍團，發動了對法國的閃電戰。德軍穿越阿登森林，繞過法國的馬奇諾防線，以驚人的速度在法國境內推進。
general_stage_intro_103=1941年9月，德軍開始了對蘇聯北方城市列寧格勒長達900天的圍困，期間，城市遭受了嚴重的炮火和斷糧。這場戰役是近代史上時間最長的包圍戰。
general_stage_intro_104=這是二戰中最大規模坦克會戰，也是東部戰線的重要轉捩點，古德里安指揮第二裝甲集團軍參與了進攻，蘇聯嚴密的防線將等待著他。
general_stage_intro_105=這場戰役發生於1944年10月。蘇聯軍隊圍困了匈牙利首都布達佩斯，試圖奪回匈牙利的控制權。德軍在蘇聯強大的炮火壓制下將如何突圍？
general_stage_intro_111=突尼斯是德軍位於北非戰場的最後一個據點。1942年11月，以英美為主的盟軍分別從東西兩個方向發動進攻，擊敗德軍並奪取突尼斯，結束了北非戰役。
general_stage_intro_112=1943年7月，盟軍在西西里島進行了大規模的登陸作戰，以推翻義大利獨裁政權。這場戰役是盟軍在歐洲戰場上的一次重要勝利，為後續進攻義大利本土奠定了基礎。
general_stage_intro_113=1944年6月，盟軍在諾曼第進行了規模空前的登陸行動，以開闢西歐戰場並解放法國。這場登陸行動對德國在西線的戰略地位造成了重大威脅，標誌著盟軍在歐洲的反攻進程開始。
general_stage_intro_114=這是太平洋戰爭中陸軍之間進行的最大的戰役，以日軍的慘敗告終。
general_stage_intro_115=1944年12月，盟軍在阿登戰役中與德軍進行了激烈的戰鬥。德軍試圖發動冬季攻勢，但遭到了盟軍的抵抗。
general_stage_intro_121=1941年10月，德軍企圖佔領莫斯科，朱可夫被任命為總指揮，蘇聯紅軍以堅強的防禦和頑強的反擊，最終擊退了德軍的進攻，保衛了莫斯科。
general_stage_intro_122=戰役從1942年8月開始，次年2月結束。這是二戰中最大規模、最慘烈的戰役，雙方陣亡都超過兩百萬人。朱可夫在戰役中擔任蘇聯紅軍總參謀長，協助指防守和反攻。
general_stage_intro_123=1943年7月，德軍發動最後一次大規模攻勢，朱可夫在庫爾斯克戰役中擔任總參謀長，指揮蘇聯紅軍反擊並使德軍重創。此戰過後，德國完全喪失了主動權。
general_stage_intro_124=這是蘇聯主動發起的一次大規模戰略進攻，開始於1944年6月，旨在解放白俄羅斯和波蘭的部分地區。最終蘇聯如願以償，收復了大部分西部領土。
general_stage_intro_125=1945年4月開始的柏林戰役是是二戰歐洲戰場上的收官戰。朱可夫擔任蘇聯紅軍第一白俄羅斯方面軍總司令，指揮蘇軍攻佔德國首都柏林，迫使德軍德國投降。
general_stage_intro_131=1941年4月，隆美爾帶領的軍隊將英澳聯軍圍困於圖卜魯格要塞，卻遭遇了頑強抵抗。英軍數次發動攻勢施圖解救被困友軍，卻未能成功，戰爭陷入了僵局。
general_stage_intro_132=發生於1941年6月，是北非戰場上德英兩軍第一次真正意義上的坦克戰，隆美爾用機動防禦對付英軍，取得勝利，打破了英國人救援圖卜魯格的幻想。
general_stage_intro_133=一年前，隆美爾曾經在圖卜魯格這座港口要塞失利。如今來到了1942年5月，見證他將使用怎樣的計謀，來贏取他軍旅生涯中最輝煌的勝利。
general_stage_intro_134=軸心國一直希望通過佔領埃及、控制蘇伊士運河，佔有戰略資源豐富的中東地區。1942年10月阿拉曼戰役打響了，盟軍是否能通過這場戰役阻止軸心國的野心？
general_stage_intro_135=這是北非戰場的最後一場重要戰役，1942年11月，軸心國軍隊在突尼斯與盟軍展開激戰，在盟軍龐大的補給供應和持續施壓下，德意聯軍建立防線，拼死抵抗。





