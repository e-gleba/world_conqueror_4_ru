elitepass_rule_1=1.精英戰令每個賽季開啟28天，結束前24小時無法購買高級精英戰令和特級精英戰令。
elitepass_rule_2=2.每日挑戰除了固定的登錄遊戲，剩下2個挑戰任務隨機生成，每天可以刷新3次挑戰任務。
elitepass_rule_3=3.開啟下一賽季的精英戰令後，上一賽季未領取的獎勵可以在打開精英戰令時自動彈出領取。
elitepass_rule_4=4.未使用的高級精英戰令和特級精英戰令解鎖次數，可以在下一賽季的精英戰令開啟後使用。
elitepass_rule_5=5.精英挑戰任務中關於通關活動玩法的統計，以當前賽季開始後通關的次數為准。
elitepass_rule_6=6.解鎖所有精英戰令獎勵後，每獲得60點積分，可以獲得額外獎勵。獎勵次數可以累積。
