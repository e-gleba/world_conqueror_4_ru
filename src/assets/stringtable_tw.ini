dialogue_3536=我們會為你們的部隊持續提供物資保障。
dialogue_3537=做好準備！接下來的一系列戰鬥將比之前任何一場戰役都更加嚴酷。
dialogue_3538=看著眼熟嗎？這樣的場景，此時此刻正在世界各地上演。你們可能就是下一個。
dialogue_3539=敵人並非不可戰勝，反擊從現在開始！
dialogue_3540=敵人從各個方向發起進攻，許多城市已經淪陷。
dialogue_3541=我會向所有人證明自己擁有追求自由的力量與勇氣！
dialogue_3542=指揮部收到了大量關於敵軍部隊和武器裝備的情報。提供這些資料的指揮官也將在之後的行動中與我們並肩作戰。
dialogue_3543=這是我們所有的精銳了，你知道該怎麼做。
dialogue_3544=我們根本無法阻擋住敵人的進攻。
dialogue_3545=先撤回遠東的基地，盯住那裡蘇軍的動向。
dialogue_3546=根據阿爾弗雷德提供的情報顯示，蘇門答臘島的敵軍防禦更為薄弱。
dialogue_3547=我們會在這裡發動突襲，牽制住奧斯本。
dialogue_3548=僅憑這點兵力就敢向新加坡方向發動進攻，英軍的舉動十分可疑。
dialogue_3549=死守核設施周邊的防線！絕不能讓蘇軍佔領那裡！
dialogue_3550=我們會在海上發起進攻，封鎖敵人的撤退路線。
dialogue_3551=儘快實施登陸作戰，消滅南部的敵軍。我們將從這裡向北發動反攻。
dialogue_3552=識時務者為俊傑，通機變者為英豪。
dialogue_3553=你們讓我別無選擇。
dialogue_3554=沿著海岸線的方向進攻！協助友軍夾擊並消滅沿海的守軍。
dialogue_3555=敵人海軍的主力似乎並不在這裡。我們會消滅這裡所有的敵軍艦隊。
dialogue_3556=在援軍抵達前我會死守住自己的位置。
dialogue_3557=你們的勝利毫無意義，我們還會再來的。
dialogue_3558=黑蠍基地裡的資料已經成功恢復。但是並未查到關於奧斯本的資料。
dialogue_3559=阿爾弗雷德，之前的戰役中你已經向我們證明了自己的價值。相信你一定有辦法能徹底解決奧斯本。
dialogue_3560=交給我吧。
dialogue_3561=是時候了，開始行動。
dialogue_3562=黑蠍早已經歷過失敗，也許遠不止兩次。
dialogue_3563=你為什麼會在這裡？
dialogue_3564=為了見證你的結局，那個不惜要獻祭我們所有人來達到的結局。
dialogue_3565=我會替你完成自己的願望。
dialogue_3566=我就是你，我們在另一邊見。
dialogue_3567=我從不懷疑自己的判斷。
dialogue_3568=敵軍的戰鬥力遠超我的預計。
dialogue_3569=天命難違。
dialogue_3570=我們的戰鬥還遠未結束。
dialogue_3571=行動終止，現在撤退吧。
dialogue_3572=到此為止了。
dialogue_3573=美蘇的統治地位依然不可動搖。
dialogue_3574=情報屢次出錯，我們必須對戰場形勢做出自己的判斷。
dialogue_3575=阿爾弗雷德，你成功地終結了一切卻又什麼都沒有終結。
dialogue_3576=設施已經啟動，我們早已做好了離開的準備。再見了另一個我。
dialogue_3577=這裡的設施只會掃描並創造出一個新的你，完全繼承先前的所有。
dialogue_3578=而你只是一縷舊世的餘念。將和我一起在這裡消散。
dialogue_3579=也許你是對的，但即使是在最可怕的夢魘裡，我仍然認為我會是我。
dialogue_3580=也許我們用不了多久還會再見的。
dialogue_3581=你們可以動手了。
dialogue_3582=我們為這個真相而感到遺憾。
dialogue_3583=徹底消滅殘餘的敵軍，重新奪回南極基地！


