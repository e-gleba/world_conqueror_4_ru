event_stage_intro_21001=戰爭的形勢已被改寫。蘇軍在西海岸的攻勢已被成功阻滯。敵人因補給線過度延伸導致戰術進攻效能持續衰減，但集團軍級兵力優勢仍然存在。務必依託預設工事實施梯次防禦，保衛好援軍的集結點直至戰略反攻階段啟動。
event_stage_intro_21002=我們秘密訓練的部隊已經做好了進攻準備。特遣艦隊將針對豬灣實施兩栖奪控，同時確保癱瘓該區域的防空體系。地下抵抗組織也會接應我們的行動。中情局已做出保證，這次突襲將會萬無一失。
event_stage_intro_21003=蘇軍北方艦隊特混編隊已經完成了對紐約外海的封鎖，但形勢並非不可挽回。立即啟動應急通訊協定，執行要塞拔除作戰。聯繫各地的部隊重新組建進攻集群，削弱東海岸蘇軍的力量。
event_stage_intro_21004=蘇軍對我們本土的直接進攻已經被一系列的反擊所挫敗。現在敵人轉移了進攻的重心，把矛頭對準了周邊的國家和地區。歐洲本土早已啟動了防衛措施，但蘇軍仍在極短的時間內佔領了冰島，現在格陵蘭島和加拿大就是他們的下一個目標。
event_stage_intro_21005=加拿大的叛軍與國內的反對勢力組成了聯軍，控制了五大湖地區並向東部發起了進攻。在我們調集部隊的同時，蘇軍趁虛而入重新登陸。情報顯示叛軍與蘇軍雙方並非協同作戰，利用好這兩股勢力發生衝突的間隙，馳援各地的友軍，平定叛亂驅逐外敵。
event_stage_intro_21006=歐洲與蘇聯的衝突已經演變為一場熱戰。北方艦隊的進攻速度令我們始料未及，就連我們最重要的盟友英國也沒能倖免。英國本土已有多地被蘇軍佔領，歐洲需要我們的援助，特遣艦隊與戰略運輸機已經準備就緒，隨時可以集群出動！
event_stage_intro_21007=蘇軍正集結最後戰略預備隊實施困獸之鬥。其方面軍指揮系統已出現明顯裂隙，各成員國之間也許並沒有我們認為的那麼團結。我們必須聯合一切可以聯合的力量向東進攻，把蘇聯人趕回自己的土地。這是個擴大我們在歐洲影響力的絕佳機會。
event_stage_intro_21011=戰爭的形勢已被改寫。蘇軍在西海岸的攻勢已被成功阻滯。敵人因補給線過度延伸導致戰術進攻效能持續衰減，但集團軍級兵力優勢仍然存在。務必依託預設工事實施梯次防禦，保衛好援軍的集結點直至戰略反攻階段啟動。
event_stage_intro_21012=我們秘密訓練的部隊已經做好了進攻準備。特遣艦隊將針對豬灣實施兩栖奪控，同時確保癱瘓該區域的防空體系。地下抵抗組織也會接應我們的行動。中情局已做出保證，這次突襲將會萬無一失。
event_stage_intro_21013=蘇軍北方艦隊特混編隊已經完成了對紐約外海的封鎖，但形勢並非不可挽回。立即啟動應急通訊協定，執行要塞拔除作戰。聯繫各地的部隊重新組建進攻集群，削弱東海岸蘇軍的力量。
event_stage_intro_21014=蘇軍對我們本土的直接進攻已經被一系列的反擊所挫敗。現在敵人轉移了進攻的重心，把矛頭對準了周邊的國家和地區。歐洲本土早已啟動了防衛措施，但蘇軍仍在極短的時間內佔領了冰島，現在格陵蘭島和加拿大就是他們的下一個目標。
event_stage_intro_21015=加拿大的叛軍與國內的反對勢力組成了聯軍，控制了五大湖地區並向東部發起了進攻。在我們調集部隊的同時，蘇軍趁虛而入重新登陸。情報顯示叛軍與蘇軍雙方並非協同作戰，利用好這兩股勢力發生衝突的間隙，馳援各地的友軍，平定叛亂驅逐外敵。
event_stage_intro_21016=歐洲與蘇聯的衝突已經演變為一場熱戰。北方艦隊的進攻速度令我們始料未及，就連我們最重要的盟友英國也沒能倖免。英國本土已有多地被蘇軍佔領，歐洲需要我們的援助，特遣艦隊與戰略運輸機已經準備就緒，隨時可以集群出動！
event_stage_intro_21017=蘇軍正集結最後戰略預備隊實施困獸之鬥。其方面軍指揮系統已出現明顯裂隙，各成員國之間也許並沒有我們認為的那麼團結。我們必須聯合一切可以聯合的力量向東進攻，把蘇聯人趕回自己的土地。這是個擴大我們在歐洲影響力的絕佳機會。

dialogue_3412=蘇軍的攻勢已經在漫長的補給線下顯現出了疲態。
dialogue_3413=援軍正從各處陸續抵達戰場，守住我們的集結點。
dialogue_3414=繼續進攻！讓敵人在我們的鋼鐵洪流面前顫抖！
dialogue_3415=主力部隊已經集結完畢，反擊的時候到了。
dialogue_3416=美軍的反攻在我們的戰線上打開了一道缺口。組織周邊的力量消滅這股進攻部隊。
dialogue_3417=美軍的堡壘已被我們攻破，敵人的援軍已經無法抵達戰場了！
dialogue_3418=行動開始！我的艦隊會掩護後續的援軍完成登陸。
dialogue_3419=向拿索的英軍駐地周邊增兵。封鎖加勒比海海域，擋住英國海軍的增援。
dialogue_3420=該死，蘇軍早有準備！我們的人沒有重型武器，根本無法阻擋敵人裝甲部隊的進攻。
dialogue_3421=行動基本可以宣告失敗了。如果英軍能夠突出重圍，分散蘇軍的兵力部署，那樣我們還有勝利的希望。
dialogue_3422=小心敵軍的空降部隊，各地區的守軍必須做好防禦協同。
dialogue_3423=敵人的登陸部隊與援軍都已被攔截，我們重新控制了哈瓦那南部地區。
dialogue_3424=美軍對這片海域的控制力並沒有我們預期的那麼強，不要畏懼，繼續進攻。
dialogue_3425=我們的目的已經達成。暫且撤回前線的部隊，在重新評估這裡的局勢後我們必將重返墨西哥灣。
dialogue_3426=阿拉斯加的蘇軍已被我們趕回白令海峽。然而那卻是個障眼法，蘇軍在東海岸又捲土重來。
dialogue_3427=古巴的事件成功分散了美軍的注意力。華盛頓方面已經沒有多少部隊可供調遣了。
dialogue_3428=情報屢次出錯，我們必須對戰場形勢做出自己的判斷。在援軍抵達前我會死守住自己的位置。
dialogue_3429=一艘颱風級潛艇突然主動切斷了與我們的聯繫，立即派潛艇部隊進行追擊。
dialogue_3430=紐約已經失守，現在已經到了最危險的時候。我們必須加快進攻速度了。
dialogue_3431=蘇軍颱風級潛艇的指揮權已經移交給了我們，利用好它，摧毀敵人的要塞群。
dialogue_3432=後方的美軍還未集結完畢。現在趁蘇軍立足未穩，我們可以先發制人！
dialogue_3433=格陵蘭島需要我們的援助！
dialogue_3434=在蘇軍徹底佔領那裡前，我們會派更多的部隊保護那裡。
dialogue_3435=蘇軍又少了一個進攻的支點，我的艦隊會向雷克雅維克方向繼續發起進攻。
dialogue_3436=美軍切斷了我們的又一條補給線。是時候考慮撤退的事宜了。
dialogue_3437=將格陵蘭島周圍的艦隊重新整編，向冰島方向撤退。
dialogue_3438=蘇軍的艦隊已經無路可退了，不過歐洲的敵人似乎正在有所行動。必須速戰速決！
dialogue_3439=北美的叛軍適時地發動了進攻。登陸作戰並未遇到過多阻礙，美軍已經無暇顧及我們的行動了。
dialogue_3440=蘇軍並不是我們的盟友，但眼下我們有著同一個敵人。
dialogue_3441=叛軍的攻勢十分迅猛。
dialogue_3442=敵人正在向東海岸快速推進。
dialogue_3443=我們根本無法阻擋住敵人的進攻。
dialogue_3444=前線的部隊怎麼會被如此輕易地擊潰！向加拿大方向增兵，我們會替友軍解決國內的叛亂。
dialogue_3445=盡全力阻止向紐約進攻的蘇軍。我的人會解決西邊的叛軍聯軍。
dialogue_3446=奧斯本剛剛才被擊敗，怎麼會又突然出現在那裡。我們會派更多的部隊在這片區域進行徹底地搜查。
dialogue_3447=事情不會就這麼結束。我終將會奪回我們的遺產。
dialogue_3448=美軍以冰島為基地開始向挪威不斷調集兵力，再次進軍歐洲。
dialogue_3449=格陵蘭島的行動為我們創造了突襲北歐與英國的契機。
dialogue_3450=蘇軍快速的雙線出擊迫使我們在短時間內無法有效分兵援救。
dialogue_3451=必須迅速決定我們的主攻方向。
dialogue_3452=已有大量的蘇聯陸軍完成了登陸，如果不第一時間進行攔截，後果將不堪設想。
dialogue_3453=再不採取行動，形勢將無法挽回。
dialogue_3454=小心英美聯軍趕來支援的艦隊，在我們佔領挪威和瑞典全境前務必拖住敵人的援軍。
dialogue_3455=擋住入侵的蘇軍並繼續向北進攻，不要給美軍干涉歐洲事務的機會。
dialogue_3456=蘇軍先頭部隊已經攻入了西德與丹麥境內。
dialogue_3457=我們早已無路可退。前進！在北約的部隊展開前壓縮他們的進攻空間。
dialogue_3458=無論發生任何事，法蘭西的抵抗火焰不能熄滅，也決不會熄滅！
dialogue_3459=近點的威脅已經解除，各部隊做好出擊準備。
dialogue_3460=蘇軍已經失去了對我們的控制，德國的統一是任何人都不可阻擋的。
dialogue_3461=向東進攻，這次我們絕不會再失敗了！
dialogue_3462=如果蘇軍遲早會捲土重來，那現在就該發動一場反攻，一勞永逸地解決這個問題。
dialogue_3463=北約的聯軍已經突破了我們的第二道防線，調集兵力重新奪回我們的防禦陣地。
dialogue_3464=奧斯陸已經失守，形勢對我們十分不利。
dialogue_3465=蘇軍在波羅的海周邊的軍力已被調走大半，我們出場的時機到了。
dialogue_3466=這與我的預期並不相符，需要更多的作戰資料來進行調整。
dialogue_3467=法國也被擊敗了，再這樣下去我們的聯軍將不復存在。
dialogue_3468=振作起來，繼續進攻。不要因一時的失敗而失去信心！

