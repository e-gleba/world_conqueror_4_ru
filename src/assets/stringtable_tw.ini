event_intro_437=1944年10月6日，蘇聯烏克蘭第2方面軍發動了德布勒森戰役，將盤踞於羅馬尼亞境內的德匈聯軍擊退，並奪取了德布勒森，把戰線推進了160公里。此戰削弱了德軍在匈牙利的軍事力量，為後續進攻布達佩斯鋪平了道路。
event_intro_438=1941年10月10日，德軍第3裝甲集團軍轉向加里寧方向，計畫在行軍中奪取加里寧市，並從西北繞過莫斯科向北進攻，形成包圍圈。蘇軍得知這一消息後，迅速組織加里寧方面軍進行阻擊。加里寧防禦戰由此展開，直到12月才告一段落。此戰中，德軍成功佔領了加里寧，但在嚴冬和蘇軍的頑強阻擊下，其戰鬥力被嚴重消耗，戰線停滯在加里寧，無法繼續推進。
event_intro_439=莫札伊斯克防線是蘇聯於1941年7月底開始建立的，用於保護莫斯科以及其西部通道。然而，直到10月份德軍兵臨莫斯科時，也沒能徹底完成。這讓德軍在10月13日初次進攻就拿下了防線南端的卡盧加，鼓舞了他們對防線正面的進攻。德軍在之後數日奪取了防線上的多個城市，突破了主要防禦區。儘管蘇軍在該防線的作戰未能阻止德軍繼續推進，但為防線後方組織防禦部隊爭取了時間。
event_intro_440=在波羅的海行動後，北方集團軍群被蘇軍圍困在庫爾蘭地區。為防止東普魯士的德軍攻擊包圍圈，蘇軍派白俄羅斯第3方面軍佔領東普魯士，消滅當地德軍。 1944年10月16日，蘇軍在砲火轟炸後開始進攻。然而，東普魯士地區密林、沼澤的地形和德軍的防禦工事有效地阻礙了蘇軍攻勢。蘇軍連續作戰半個月，才將戰線推進至貢賓嫩，但部隊損失嚴重，最後放棄了繼續推進。
event_intro_441=為了切斷日本與其南亞的駐軍的聯繫，使日本在南亞的駐軍得不到補給，1944年10月23日至26日，在菲律賓的萊特灣附近海域，盟軍和日軍進行了第二次世界大戰期間規模最大的一次海戰。此戰後，日本海軍最後的力量被徹底消滅，在中東太平洋的製海權和製空權被徹底剝奪。
event_intro_442=第二次阿拉曼戰役是第二次世界大戰中北非戰場的轉捩點，與史達林格勒戰役和瓜達爾卡納爾戰役一起標誌著同盟國進入戰略反攻階段。這場戰役從1942年10月23日持續到11月3日。盟軍憑藉著人員和坦克數量的優勢以及絕對的製空權，戰勝了軸心國軍隊，迫使其撤退至突尼斯。
event_intro_443=希意戰爭是義大利和希臘之間於1940年10月28日至1941年4月23日爆發的軍事衝突，標誌著第二次世界大戰巴爾幹戰役的開始。義大利軍隊為了擴張領土，從阿爾巴尼亞入侵希臘，但隨後被希臘軍隊反攻，並迫使義大利撤退。到12月中旬，希臘軍隊甚至佔領了阿爾巴尼亞25%的領土。直到4月6日，德軍出兵入侵南斯拉夫和希臘時，義大利軍隊才恢復進攻。
event_intro_444=布干維爾島戰役是盟軍與日軍在所羅門群島附近的布干維爾島進行的一系列戰鬥，時間從1943年11月1日持續到1945年8月21日。戰役分為兩個階段，第一階段從 1943 年 11 月持續到 1944 年 11 月，美軍在托羅基納灘頭陣地登陸並控制週邊。第二階段主要以澳洲軍隊為主發動進攻，掃蕩仍在堅持抵抗的日軍士兵。
event_intro_445=1943年11月3日，蘇軍在基輔南北橋頭堡準備已久，向基輔發動猛烈攻勢。基輔城內的德軍匆忙應對，但在強大攻勢下，不得不撤出基輔。蘇軍趁勢追擊，解放了基輔、日托米爾及其周邊的右岸地區。這場戰役標誌著蘇聯在東線戰場上的進一步勝利，為後續反攻奠定了基礎，同時對德軍士氣造成了嚴重打擊。
event_intro_446=為了回應蘇聯「開闢第二戰線」的要求，盟軍計畫佔領法屬北非，以對北非的軸心國軍隊進行箝制。 1942年11月8日，英美聯軍分三路向卡薩布蘭卡、奧蘭和阿爾及爾發動登陸攻擊。當地的維希法國守軍無力抵抗。 11月16日，三個城市都被盟軍佔領，成為日後盟軍在北非行動的後勤支點。
event_intro_447=為了削弱義軍在地中海的海上力量，英軍計畫使用航空母艦消滅停泊在塔蘭託的義軍主力艦隊。行動在1940 年 11 月 11 日晚上開始，義大利艦隊一夜之間損失了一半的主力艦。這次襲擊是歷史上首次航空母艦艦載機對海軍艦隻的進攻，成功展現了海軍航空兵對戰艦大砲的優勢。此戰也為日軍攻擊珍珠港的作戰計畫提供了參考。
event_intro_448=1942年11月12日至15日，盟軍和日軍在瓜島附近展開了為期四天的海戰和空戰。日軍試圖增援瓜島守軍並運送補給，但最終盟軍成功阻止了這項行動。此戰後，日軍失去了在瓜島海域夜間通行的自由，無力再次發動攻擊以奪取亨德森機場。
event_intro_449=1941年11月18日，為了解救被圍困在圖卜魯格的盟軍部隊，並削弱德意聯軍在北非的力量，英聯邦軍隊對德意聯軍在利比亞展開了一次大規模攻勢。儘管戰鬥激烈且損失慘重，英聯邦軍隊最終成功打破了圍困，迫使德意聯軍撤退。這次行動標誌著盟軍在北非戰場上的重要勝利，為後續的攻擊奠定了基礎。
event_intro_450=1941 年11 月17 日至12 月2 日發生的羅斯托夫戰役是紅軍在蘇德戰爭中首次成功的攻勢之一，與莫斯科戰役一起導致了德國在1941 年冬天停止了對蘇德前線的進攻。此戰中，德軍曾一度佔領羅斯托夫，但守軍的反抗和蘇軍對攻城部隊的包圍行動，使德軍最終放棄了羅斯托夫。
event_intro_451=為了摧毀固守勒熱夫突出部的德軍第9集團軍，蘇軍於1942年11月25日至12月20日從多個方向發動進攻，企圖將其一舉殲滅。然而，此戰並未取得蘇軍預期的結果。蘇軍人員和裝備的損失高於德軍，卻未能佔領多少陣地。這使得此戰在很長一段時間內鮮少提及。
event_intro_452=冬季戰爭是蘇聯與芬蘭在第二次世界大戰初期爆發的一場戰爭。 1939年11月30日，蘇聯入侵芬蘭，戰爭由此展開，最後蘇聯慘勝芬蘭。在終戰和談中，芬蘭割讓並租借部分領土給蘇聯。 1940年3月13日，雙方簽訂《莫斯科和平協定》，戰爭結束。
event_intro_453=1941 年 12 月 1 日，德軍中央集團軍群再次向納羅-福明斯克方向發動進攻，企圖突破中部防線。在德軍進攻之初，蘇聯軍隊僅能裝備主要的防禦陣地，導致德軍很快就突破陣線，在兩天內推進了數公里。然而，蘇軍立即調動前線預備隊並組織反擊。到12月5日，蘇軍成功將戰線推回原始陣地，粉碎了德軍最後一次試圖突入莫斯科的企圖。
event_intro_454=1941年12月5日，隨著德軍在莫斯科戰役中轉入防守，蘇軍加里寧方面軍主動向加里寧發動進攻，企圖解放該地。德軍起初堅決抵抗，使蘇軍推進緩慢，但嚴寒的天氣和補給不足最終迫使德軍撤退。 12月16日，加里寧被解放，加里寧方面軍乘勢追擊，奪回了許多重要陣地。

