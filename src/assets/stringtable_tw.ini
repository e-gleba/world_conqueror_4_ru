event_buff_desc_27=攻擊時有30%概率對地塊施加持續2回合的輻射效果，輻射地塊上的部隊每回合減少當前HP10%
event_buff_desc_28=單位未被夾擊時，每回合開始有80%概率移除自身的混亂和士氣降低狀態
event_buff_desc_29=將領指揮的部隊進攻後有20%概率觸發，使1格範圍內的友軍無法成為敵方陸軍、海軍可選擇的目標，持續1回合

event_stage_intro_20501=戰爭從未改變。美軍的行動再次打破了半島的平衡。敵人已經越界，我們必須解除眼前的威脅。立即組織部隊援助友軍。利用好我們新武器，讓敵人為自己的魯莽付出代價！
event_stage_intro_20502=美國已經聯合日本，控制住了蘇維埃港周邊海域以及薩哈林島的南部。我們低估了美軍入侵的決心，但敵人遠遠低估了我們的力量。任何向偉大祖國發起挑戰的人都註定會被摧毀。
event_stage_intro_20503=美軍的野心已經昭然若揭。為此，我們提前在千島群島周邊海域部署了防禦部隊以應對敵人的擴張。把握好這次機會，清除在日本北部的勢力。
event_stage_intro_20504=勘察加半島南部遭到了美軍的襲擊。這裡臨近阿留申群島，是美國與我們領土接壤的地方。指揮部已經制定了進攻阿拉斯加的方案，不能被美軍的突襲打亂後續的計畫。
event_stage_intro_20505=情報顯示美軍正在研製更大爆炸當量的核武器。他們甚至計畫用這種核武器在阿拉斯加開鑿出一個深水港。位於安克雷奇的研究設施就是我們這次的目標。必須在敵人撤離前控制住周邊地區。
event_stage_intro_20506=安克雷奇的守軍還做困獸之鬥，然而我們也無法輕易突破美軍的防線。現在起密切關注敵軍的動向。同時向內陸方向進攻，三面包圍守軍，徹底切斷他們的退路。
event_stage_intro_20507=美軍在我們的攻擊下節節敗退。雖然防線不斷被突破，但敵人也利用這段時間把軍隊向西海岸集結。最終的決戰即將展開，我們面前的任何障礙都終將被清除。
event_stage_intro_20511=美軍的行動再次打破了半島的平衡。敵人已經越界，我們必須解除眼前的威脅。立即組織部隊援助友軍。利用好我們新武器，讓敵人為自己的魯莽付出代價！
