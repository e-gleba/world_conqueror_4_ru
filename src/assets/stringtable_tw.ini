armygroup_event_desc_123=蘇軍在白令海峽北部率先衝破冰幕，登陸阿拉斯加並佔領了諾姆。美蘇再次全面開戰。
armygroup_event_desc_124=以美英法為首的北約軍隊再度向朝鮮發起了進攻，在日韓的協助下一路北上。朝鮮人民軍頑強抵抗，蘇軍不斷向遠東地區調集兵力，將戰線維持在了蘇維埃港一帶。
armygroup_event_desc_125=黑蠍在遠東與阿拉斯加潛伏的部隊乘勢展開行動，配合在各地扶植的武裝部隊，在各國部隊後方發動突襲。
armygroup_event_desc_126=美、英、澳、蘇多國海軍追擊黑蠍艦隊時，在白令海中部遭遇強烈電磁風暴，一座此前未知的、擁有先進設施的島嶼出現。黑蠍在太平洋的總部遭遇各國艦隊的圍攻。
armygroup_event_desc_127=美、英、澳、蘇的特遣隊對白令海海域各地的黑蠍基地發動了一系列的海空立體突擊，黑蠍的多個要塞據點相繼被摧毀。
armygroup_event_desc_128=黑蠍寒霜軍團的指揮體系被摧毀，極地志願兵團失去了大量的軍備援助，被迫投降，重新加入華約。
armygroup_event_desc_129=黑蠍永夜軍團的指揮體系被摧毀，北境自由同盟的內部產生了混亂，大量士兵潰逃，部隊被迫投降，重新加入北約。
armygroup_event_desc_130=黑蠍暗潮軍團的指揮體系被摧毀，太平洋解放陣線被多國部隊圍困，部隊被迫投降，重新加入北約。
armygroup_event_desc_131=黑蠍勢力再次迅速發展壯大，美蘇雙方為根除這一威脅決定聯手。華約與北約暫時停戰，結成了新的軍事同盟。
armygroup_event_desc_132=奧斯本被徹底擊敗，黑蠍在遠東地區的計畫被徹底挫敗。但各地的黑蠍殘部依然存在，時刻威脅著周邊國家與地區。
armygroup_event_desc_133=蘇聯飛行員駕駛最先進的戰鬥機叛逃，降落在日本。美國宣佈給予他政治庇護。美日的技術人員將戰機拆解並進行了詳細分析。
armygroup_event_desc_134=西伯利亞雅庫特地區正午時分天空突然黑暗持續約三小時，大規模森林火災產生的濃厚煙塵向東飄散，對在附近作戰的部隊產生了嚴重的影響。
armygroup_event_desc_135=在阿拉斯加遭到入侵後，美軍與加拿大軍隊組織了一場大規模反攻。多方勢力在安克雷奇北部展開混戰，蘇軍的進攻矛頭被削弱。
armygroup_event_desc_136=黑蠍組織支援的北境自由同盟同時襲擊了費爾班克斯的空軍基地和安克雷奇的港口，試圖在蘇軍正面發起進攻時偷襲美軍後方，率先控制阿拉斯加。
armygroup_event_desc_137=通古斯河附近再次發生劇烈爆炸。隕石的空爆摧毀了大片森林。在事發後數天內，亞洲與歐洲的夜空呈現出暗紅色。多國的衛星都記錄下了這一過程。
armygroup_event_desc_138=一支由英法特種部隊組成的聯合特遣隊，在千島群島上搜尋並摧毀了黑蠍組織的秘密通訊中繼站。行動短暫中斷了暗潮軍團與太平洋陣線之間的通訊。
armygroup_event_desc_139=美蘇兩國海軍在白令海峽的聖勞倫斯島附近爆發大規模海空戰，雙方均投入了大量戰機與轟炸機。
armygroup_event_desc_140=隨著戰爭陷入僵局，美蘇兩國內部的肅反運動變得愈加殘酷。為清除對方安插在內部的間諜，以及疑似被黑蠍滲透的部隊，導致大量冤案的產生。
armygroup_event_desc_141=一艘搭載有核彈頭的蘇聯潛艇在奉命前往白令海戰區時，突然切斷聯繫並駛向黑蠍控制的“幽靈島”方向。
armygroup_event_desc_142=黑蠍暗潮軍團在撤離札幌前夕，破壞了當地的核電站。大量放射性污水流入大海，導致周邊海域的海洋生物大量死亡，多個港口被長期封閉。
armygroup_event_desc_143=在盟友的支援下，蘇軍向馬加丹地區極地志願兵團控制的戰略導彈基地發動猛攻，引發慘烈巷戰。
armygroup_event_desc_144=太平洋解放陣線在札幌南部和函館周邊發動協同攻擊，成功切斷了北海道與日本本州的聯繫。
armygroup_event_desc_145=韓國軍隊在美軍顧問支持下，向韃靼海峽西岸的蘇聯遠東重要港口蘇維埃港發起突襲。
armygroup_event_desc_146=勘察加半島的多處活火山同時噴發，冰川下的熔岩不斷向外噴湧，打亂了各方的軍事部署。
armygroup_event_desc_147=阿拉斯加灣與白令海南部海域同時發生地震，引發的海嘯席捲了阿拉斯加南部沿海地區，許多軍事設施與軍用裝備遭到了摧毀。
armygroup_event_desc_148=費爾班克斯上空出現異常極光，其範圍內所有電子設備，包括戰機火控雷達，均短暫失靈。
armygroup_event_desc_149=一股異常寒流席捲楚科奇海岸，周圍地區溫度急速降低。各方軍隊緊急採取措施應對惡劣天氣，但均承受了一部分的人員與裝備的損失。
armygroup_event_desc_150=為應對蘇聯導彈與戰略轟炸機的威脅，美加兩國整合並升級了從阿拉斯加到加拿大腹地的遠端預警系統，建立了緊密的北美防空同盟，提升了共同防禦能力。
armygroup_event_desc_151=龐大的軍事需求催生了電子、電腦、航空航太等領域的技術爆炸。這些技術在加利福尼亞等地的工業園迅速實現民用轉化，為美國贏得了新一輪科技和經濟競爭的先機。
armygroup_event_desc_152=蘇聯通過經濟互助委員會體系，向其盟友蒙古、朝鮮等國家提供經濟援助、能源供應和市場，維持了社會主義陣營內部的經濟聯繫和穩定。


event_4114=向日葵行動
event_4115=第三次哈爾科夫戰役
event_4116=春季攻勢
event_4117=馬塔潘角海戰
event_4118=坊之岬海戰
event_4119=霍蘭迪亞戰役

event_intro_4114=因義大利軍隊在北非戰場面對英軍時接連受挫，德國國防軍最高指揮部於2月6日決定介入以穩定戰局。在隨後幾個月，德軍部隊（後整編為非洲軍團）陸續抵達北非，將意軍的潰敗一舉扭轉。隆美爾的進攻決策取得了巨大的成功，但過長的補給線為後續漫長的消耗戰埋下了伏筆。
event_intro_4115=蘇軍在斯大林格勒戰役勝利後乘勝追擊。曼施坦因放棄了正面防禦，先集中裝甲兵力擊潰冒進的蘇軍西南方面軍，再回師北上，經激烈巷戰重新佔領哈爾科夫。整個行動由1943年2月19日開始，蘇軍付出了巨大的代價，但未能改變東線整體劣勢。此戰形成的“庫爾斯克突出部”直接導致了數月後規模空前的庫爾斯克會戰。
event_intro_4116=1941年3月，在希意戰爭陷入僵局之際，為提振士氣並將希臘軍隊逐出義大利控制的阿爾巴尼亞地區，義大利獨裁者于3月9日親自下令發動“春季攻勢”。此次行動中，意軍在前線發射了十萬多發炮彈，累計傷亡逾萬人，卻未能實現任何戰略突破。攻勢的失敗直接導致德國不得不介入巴爾幹戰局，從而徹底改變了希意戰爭的走向。
event_intro_4117=1941年3月底，英國情報機構首次成功破譯義大利海軍使用的恩尼格碼密碼，從而掌握了其艦隊動向。3月27日，英國海軍據此情報在馬塔潘角附近海域實施攔截，擊沉多艘義大利艦船，並將義大利艦隊徹底逐出東地中海控制區。
event_intro_4118=沖繩戰役期間，為吸引盟軍海空力量從而增加神風特攻隊成功的機會，聯合艦隊組建了以戰列艦大和號為旗艦的特攻艦隊，企圖讓其突入沖繩海域，在座礁後作為固定炮臺支援防禦，進行自殺式攻擊。最終大和號在美軍數百架艦載機發起的多波次空襲中被擊沉。此役標誌著日本海軍主力艦隊的徹底覆滅，聯合艦隊基本喪失了作戰能力。
event_intro_4119=為突破日軍在新幾內亞的防線，美軍於1944年4月22日發起登陸作戰。通過戰術欺騙和強大的海空火力準備，美軍成功登陸並迅速佔領機場和港口，切斷了日軍增援，將敵人分割包圍。此役是“跳島戰術”的成功典範，避開了日軍在新幾內亞東部的重兵集團，美軍以較小代價實現了戰略目標。


dialogue_4312=繼續進攻，英軍已無力迅速組織起有效的反擊。
dialogue_4313=蘇軍的側翼已經過分延伸。立刻發動進攻，切斷他們的補給線，包圍哈爾科夫。
dialogue_4314=德軍的攻勢異常兇猛，我軍在哈爾科夫方向已無法繼續堅守。先向東撤退吧。
dialogue_4315=日軍艦隊正在向沖繩前進。立刻出動空中力量阻止敵人，其他艦艇做好海上攔截的準備。
dialogue_4316=大和號已被擊沉，日軍艦船正在撤退。
dialogue_4317=我們擁有絕對的海空優勢，日軍的防禦體系幾乎被瓦解。立即登陸。


skill_name_176=馬雷斯防線
skill_name_177=星隕
skill_name_178=天羅地網
skill_name_179=體系作戰


skill_info_176=自身處於山地和沙漠時，自身和周圍1格友軍受到傷害降低[#00FF00#%d%%]。指揮陸地部隊時“謠言”技能概率提升25%%，回合結束時周圍2格有士氣降低或混亂的敵軍，則自身和周圍1格友軍恢復上限10%%的HP。
skill_info_177=指揮部隊進攻時有[#00FF00#%d%%]概率對目標造成一次Ⅱ級衛星攻擊。指揮空中懸停部隊時額外提高30%%本次衛星攻擊傷害。
skill_info_178=指揮部隊周圍3格的敵軍降低[#00FF00#%d%%]防禦且受到核彈、衛星攻擊、無人機戰術引爆傷害提高20%%
skill_info_179=指揮部隊攻擊和空襲時有[#00FF00#%d%%]概率造成致命一擊。


dialogue_4318=難以置信，義大利人居然真的勸服了元首。這次我們可不能重蹈覆轍。
dialogue_4319=轟炸結束，第一批空降部隊已經到位。預祝作戰順利！
dialogue_4320=敵襲！通知所有備戰部隊進入作戰狀態，務必守住機場！通知皇家海軍，迅速支援馬爾他！
dialogue_4321=皇家海軍艦炮火力支援，掩護登陸部隊。
dialogue_4322=第二批空降部隊到位，儘快攻佔瓦勒他！
dialogue_4323=瓦勒他已被攻克，現在，馬爾他是我們的了！
dialogue_4324=向西北角撤退，皇家海軍會支援我們撤離！
dialogue_4325=奪回機場，一定要保證我們空軍能順利起飛。
dialogue_4326=南部軍隊是攻克敵人的主力，必須保證南部軍隊突破敵人防線。
dialogue_4327=敵人按照預設從南部進攻了，各部隊依計畫行事。依託陣地，打退他們的進攻。
dialogue_4328=成功奪下英軍陣地，協助裝甲部隊繼續前進。
dialogue_4329=報告長官，前線部隊回饋燃料已不夠支撐進攻。
dialogue_4330=功虧一簣啊！通知前線部隊停止進攻，維持戰線，等待補給到位。
dialogue_4331=敵人的燃料快要耗盡，反攻的時機到了。全軍出動，奪回我們的陣地！
dialogue_4332=作為義大利的精銳，必須要守住這個制高點，絕不能讓我們的盟友看了笑話。
dialogue_4333=代爾穆納西蔔的高地對後續的行動十分重要。戰士們，拿下那片陣地！
dialogue_4334=義大利人的火力怎麼這麼兇猛！裝甲部隊趕緊支援，用炮火壓制住他們的反攻！
dialogue_4335=敵軍的反抗十分頑強。以這個陣地做支點，保持火力壓制，繼續搶奪其他的陣地。
dialogue_4336=為奪回陣地，閃電師向後方發電請求支援。
dialogue_4337=代爾穆納西蔔陣地陷入危險，裝甲部隊迅速支援！
dialogue_4338=隆美爾現在因病休假，這是突襲的最好時機。出擊，這一戰我們要擊敗他們！
dialogue_4339=敵襲！全軍進入作戰狀態，絕不能讓敵軍突破陣地！
dialogue_4340=成功佔領前線陣地，依託陣地繼續推進。
dialogue_4341=炮火覆蓋失陷陣地！炮火結束後，立刻嘗試奪回陣地！
dialogue_4342=火炮部隊迅速加入戰場，緩解前沿陣地的壓力。
dialogue_4343=敵方陣地十分堅固，請求火炮支援！
dialogue_4344=隆美爾已經回歸，北部戰區的戰局已經得到緩解。堅守陣線，轉機就在眼前。
dialogue_4345=敵軍正在集中部隊，我們必須搶先出擊，才能守住馬雷斯防線。
dialogue_4346=踏出馬雷斯防線，盡可能多地消滅盟軍部隊。
dialogue_4347=情報部門傳來消息：敵人即將發起進攻。做好戰鬥準備！
dialogue_4348=很好！守住陣地，盡可能為友軍打開進攻缺口。
dialogue_4349=南部第一道防線崩潰，預備隊頂上，絕不能讓敵人打進梅德寧。
dialogue_4350=裝甲部隊損失太大了。必須撤退，不然不夠用於防守馬雷斯防線。
dialogue_4351=前線部隊穩住戰線，後備隊出動，奪回梅德寧！
dialogue_4352=英軍搶佔了恩菲達維爾防線的重要制高點。迅速奪回，絕不能讓這道防線陷落。
dialogue_4353=敵人重新奪回了泰克魯奈高地，請求後方支援。
dialogue_4354=太好了，支援終於到了！還有其他支援嗎？沒有？那看來只有我們了。
dialogue_4355=炮兵部隊瞄準山頂開炮，逼迫敵人放棄山頂陣地。炮火結束後，迅速奪回高地。
dialogue_4356=德軍陣地陷落，泰克魯奈高地防守壓力提高。
dialogue_4357=我們已經盡了最大的努力。堅持下去，或許其他的援軍會來支援。
dialogue_4358=進攻！敵軍絕不會有其他的支援了。拿下高地，恩菲達維爾防線就將形同虛設！
dialogue_4359=戰士們，領袖為我們準備了充足的戰備。在領袖的帶領下，這一戰，我們必將勝利！
dialogue_4360=繼續進攻，加大火力！一定要把731號高地拿下來！
dialogue_4361=該死，希臘人是鐵做的嗎？頂著這麼多炮彈都打反衝鋒！
dialogue_4362=情報中的義大利艦隊已經發現。做好戰鬥準備，爭取將其一舉殲滅！
dialogue_4363=發現英軍巡洋艦隊。巡洋艦試探性進攻，誘導敵艦向戰列艦靠近，用戰列艦的炮火消滅他們！
dialogue_4364=迅速撤退，不能讓我們的艦隊再受損失了。

dialogue_4365=兩地的部隊均已完成登陸。迅速向內陸推進，消滅機場周邊的日軍。

legend_intro_60101=第185傘兵師是義大利為實施空降作戰而專門組建的部隊。成立初期，該師曾為“C3行動”展開備戰演練，計畫與德軍協同空降、奪取馬爾他島。然而，由於此前克里特島登陸戰役損失慘重，原定於1942年7月的行動被高層推遲。同年11月11日圖卜魯格失守後，“C3行動”最終被取消。此時第185傘兵師已于7月調赴北非戰場，此後再未獲得執行空降作戰的機會。
legend_intro_60102=1942年7月，第185傘兵師被調往北非沙漠戰場。這些本該如天際閃電般執行空降突襲的精銳，如今卻要在無垠黃沙中建立功勳。8月29日，這支“閃電師”迎來了他們在北非的首場戰鬥。在阿拉姆哈勒法戰役中，他們負責掩護德軍裝甲部隊側翼，接連攻佔數處高地，於盟軍防線內部建立起一個堅固的橋頭堡。隨後在盟軍發起的“貝雷斯福德行動”中，該師又成功擊退了意圖奪回陣地的盟軍部隊，展現出其出色的作戰素養與戰鬥力。
legend_intro_60103=1942年9月29日，為在即將到來的第二次阿拉曼戰役中奪取有利地形，盟軍發動了“布拉干薩行動”，意圖攻佔由第185“閃電師”駐守的陣地。面對盟軍裝甲部隊的進攻，閃電師憑藉構築完善的戰壕體系與靈活機動的戰術部署，以輕步兵與有限火炮火力，成功擊退了對方的裝甲攻勢，展現出其出色的防禦作戰能力。
legend_intro_60104=1942年10月23日，第二次阿拉曼戰役正式打響。第185“閃電師”奉命固守戰線南段，遭遇了由英軍第13軍（轄有著名的“沙漠之鼠”第7裝甲師等部隊）發起的猛烈攻勢。在持續四天三夜的激烈防禦戰中，該師頑強守住了陣地，致使蒙哥馬利不得不放棄在南線突破的計畫，轉而調整主攻方向。儘管在局部防禦中展現出顯著的戰術韌性，但隨著整體戰局的迅速惡化，閃電師最終仍不得不隨軸心國部隊一同後撤，撤退過程中損失了大量的部隊。
legend_intro_60105=阿拉曼戰役後，殘存的第185“閃電師”被調至馬雷斯防線，擔負阻滯盟軍推進的任務。為拖延英第8軍對該防線的進攻準備，軸心國軍隊於1943年3月發動了“卡普里行動”，向正在梅德寧地區集結的英軍發起突擊。此戰中，閃電師作為突擊精銳，成功滲透並攻佔了部分英軍陣地。然而因作戰情報遭洩露，軸心國方面多數部隊的進攻均告失敗。閃電師雖取得局部突破，卻因無法獲得後續支援而被迫撤退。
legend_intro_60106=突尼斯戰役末期，軸心國軍隊已退入連續防線作最後的頑抗。1943年4月20日，恩菲達維爾防線上的泰克魯奈高地被盟軍攻佔。為穩住防線、遲滯盟軍推進，軸心國指揮部派出第185“閃電師”僅存的部隊發起反擊，任務是奪回高地並拖住敵軍攻勢。這支最後的傘兵部隊成功收復了泰克魯奈高地，並在缺少支援的情況下堅守陣地一晝夜，直至彈藥耗盡，才不得不放下武器。至此，這支本應在天空中實施突擊的精銳力量，最終在一系列錯誤的戰鬥中湮沒在北非的黃沙之中。

