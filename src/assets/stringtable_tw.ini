skill_info_156=指揮裝甲部隊士氣不會降低，+[#00FF00#%d%%]傷害。指揮裝甲部隊殲滅敵軍後獲得“英雄”狀態，提高10%%致命一擊概率，持續1回合。
skill_info_157=指揮裝甲部隊時，對城市駐軍以外的非建築單位+20%%傷害。攻擊後如果無法攻擊且無法移動，則有[#00FF00#%d%%]概率再次攻擊（一回合只能1次），且本回合每次殲敵都將提高20%%概率（最高100%%），使效果變為再次行動。
skill_info_158=指揮陸地部隊進攻後有[#00FF00#%d%%]概率給自己和周圍1格友軍添加持續1回合“協調”。擁有「協調」的部隊傷害+15%%，被添加減益狀態（降低士氣觸發的除外）時抵消該減益狀態，然後清除「協調」。
skill_info_159=在自身領地時攻擊力+15，被致命一擊的概率降低[#00FF00#%d%%]。


