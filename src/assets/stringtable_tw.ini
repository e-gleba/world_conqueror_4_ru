elite_intro_48=勃蘭登堡特種部隊接受了特殊的訓練和裝備，執行任務範圍廣泛，並且具備無與倫比的靈活性。這使得他們能夠在敵後方進行秘密行動，給敵人造成混亂和損失。
elite_intro_49=鷹眼部隊憑藉超凡的耐心和冷靜頭腦，以高精度的射擊技術著稱。他們的主要任務是利用精確的狙擊步槍射擊敵方重要目標，以破壞敵方指揮結構和降低敵軍戰鬥力。
elite_intro_50=醫療兵在戰場上面臨極為艱難和危險的工作環境。他們經常冒著生命危險在敵人的炮火中為傷患提供急救，展現出了出色的行動能力。他們的無私奉獻和專業精神為戰場上的傷患帶來了希望。
elite_intro_51=M7牧師式自行火砲是美國在二戰期間研發的一種自行火炮，在諸多戰役中發揮了重要作用。它裝備了一門105毫米口徑的榴彈炮，炮塔位於車體後部，使得炮手能夠更好地觀察目標並進行瞄準。
elite_intro_52=古斯塔夫巨砲代表了二戰期間德國巨型火炮設計的極致。它採用了800毫米口徑炮管，重達1350噸，可將7噸的炮彈投射到47千米外的目標。由於其巨大的威力，古斯塔夫巨砲主要用於攻擊堡壘、城市等重要目標。
elite_intro_53=BM-21“冰雹”火箭炮是蘇聯在冷戰時期設計的一種口徑為122毫米的多管火箭炮。它採用卡車底盤，具備快速部署和撤離的能力，能夠在短時間內對目的地區域進行齊射，形成火力覆蓋，對敵方陣地造成巨大破壞。
elite_intro_54=T-44坦克是T-34系列坦克的改進型號，旨在提高火力、機動性和防護能力。尤其是繼承了T-34引以為傲的斜面裝甲，其設計在後來的坦克發展中產生了深遠的影響。
elite_intro_55=虎王重型坦克裝備了一門口徑為88毫米的坦克炮，能夠輕易擊穿盟軍坦克的裝甲。它強大的火力和厚重的裝甲防護標誌著坦克技術的進一步發展，成為二戰期間德國坦克設計的巔峰之作。
elite_intro_56=M26“潘興”重型坦克是美軍在二戰末期開發的，用於對抗德軍虎式坦克。它配備一門口徑為90毫米的坦克炮，並具備不錯的機動性。戰後，它仍然在一些衝突和軍事行動中被使用。
elite_intro_57=噴火戰鬥機以優秀的機動性、速度和火力而聞名於世。經過不斷改良，它在不列顛空戰名聲大噪，後轉戰歐洲、北非與亞洲等戰區，成為英國在二戰中最重要且最具代表性的戰鬥機之一。
elite_intro_58=斯圖卡轟炸機獨特的雙折線翼型結構賦予其在俯衝轟炸時出色的穩定性和精確性，在二戰初期展現出強大的對地攻擊能力。起落架上安置的“耶利哥號角”發出獨特的尖嘯聲，能給敵人帶來巨大的精神壓力。
elite_intro_59=C-47也被稱為“空中列車”，具有可靠的性能和出色的適應性，能夠在各種惡劣條件下執行運輸任務。它被廣泛用於運輸士兵、物資和裝備，在二戰期間的多場戰役發揮了重要作用。
elite_intro_60=U Ⅶ型潛水艇具有出色的潛航能力和戰鬥性能，在大西洋海戰中發揮了重要作用。它們採用狼群戰術，即多艘潛艇協同作戰，對盟軍艦隊和商船發動毀滅性襲擊，取得了輝煌戰果。
elite_intro_61=威爾斯親王號是英國皇家海軍在二戰期間服役的一艘重要戰列艦。強大的火力和堅固的裝甲使得它在海戰中可以提供強大的火力支援和防禦能力。該艦曾成功地擊傷並迫使俾斯麥號撤退。

elite_tip=注意：解鎖後的精英部隊可以在戰場中通過消耗資源來招募。空軍（空中懸停單位除外）升級後可以增加在每場戰役中的出動次數，其他每種精英部隊每場戰役只能招募一次。
