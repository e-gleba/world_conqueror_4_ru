army_buff_desc_1362=貧鈾彈：致命一擊概率增加30%，攻擊時無視目標45%的護甲
army_buff_desc_1363=貧鈾彈：致命一擊概率增加40%，攻擊時無視目標60%的護甲
army_buff_desc_1371=地獄火導彈：對目標1格範圍內其他目標造成25%額外傷害
army_buff_desc_1372=地獄火導彈：對目標1格範圍內其他目標造成50%額外傷害
army_buff_desc_1373=地獄火導彈：對目標1格範圍內其他目標造成80%額外傷害
