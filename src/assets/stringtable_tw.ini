help_conquest_desc_6=在挑戰征服中，指揮官可以升級所指揮國家的科技。必須達到相應的科技等級，才能解鎖相應的國家科技，並且各個國家初始科技水準和上限存在一定差異。
help_conquest_desc_7=挑戰征服包含了外交模式。指揮官可以宣戰同陣營國家或中立國家，也可以招降部分敵對國家。現有城市和部隊數量與初始城市和部隊數量對比會影響國家忠誠度，目標國家的城市數量、部隊數量、忠誠度等綜合因素將影響招降成功率。必須與目標國家接壤，並且達到20回合之後，才可以進行招降。
help_conquest_desc_8=在挑戰征服中，指揮官會遇到各種歷史事件，這些事件可能對某些國家帶來正向或反向的影響。

