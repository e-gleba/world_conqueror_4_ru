help_scenario_1=主線劇本
help_scenario_2=陣營
help_scenario_3=關卡難度
help_scenario_4=戰區
help_scenario_5=前線

help_scenario_desc_1=在這裏可以體驗第二次世界大戰以來的各種經典戰役。完成當前章節全部的關卡可以解鎖下一個章節。
help_scenario_desc_2=在“二戰歐洲”、“二戰太平洋”與“冷戰”章節中，有兩個不同的陣營可以選擇。兩個陣營關卡內容獨立，獎勵獨立。
help_scenario_desc_3=劇本的每一關卡擁有不同難度，必須先完成當前難度，纔可以挑戰更高難度。隨着難度提高，獎勵也將隨之變得豐富。
help_scenario_desc_4=戰區主要產出勳章與勳帶，擁有至少8位將領後可以解鎖戰區。完成當前戰區的全部關卡後，指揮官會根據分數獲得獎勵，消滅的敵人越多，總分就越高。同一戰區可以多次挑戰，切換或者刷新戰區需要消耗1個指令點。在一個戰區刷新之前，出戰過的將領無法在該戰區後續關卡繼續出戰，請指揮官謹慎選擇將領。
help_scenario_desc_5=前線模式是一個十分具有挑戰性的玩法，通關主線劇本二戰歐洲後將解鎖。 指揮官在這裏會面對許多堡壘，不斷產生援軍。通關前線模式也將獲得豐厚的獎勵。

help_conquest_1=國家
help_conquest_2=外交
help_conquest_3=科技等級
help_conquest_4=建造建築
help_conquest_5=獲得勝利

help_conquest_desc_1=在征服模式中，國家被分爲1~3星三種梯度，星數越多，代表這個國家在遊戲開始時越強大，遊戲難度越低，反之難度越高。
help_conquest_desc_2=在畫面上方的外交按鈕中，指揮官可以通過贈送各種資源的方式捐助友軍，也可以向中立國宣戰，使其變爲敵對國。
help_conquest_desc_3=征服模式中國家發展將受到科技等級的限制，在科研所中獲得科技點的同時，也將獲得對應的科技等級經驗值。
help_conquest_desc_4=指揮官可以通過建造功能性建築來發展城市，滿足科技等級要求時，可以點擊建造按鈕查看所需資源消耗。
help_conquest_desc_5=征服勝利後，將根據評分判定級別，評分將受到出征將領、佔領城市、消耗回合和使用國家難度的影響。出征將領數量將不再影響挑戰征服評分。

help_domination_1=任務
help_domination_2=補充部隊
help_domination_3=傳奇將領
help_domination_4=入侵
help_domination_5=貿易
help_domination_6=演習

help_domination_desc_1=指揮官可以派遣將領完成任務來獲得資源獎勵，滿足任一條件即可完成任務，滿足條件越多，獎勵越豐富。任務分爲偵察、閱兵、宣傳、建設四個類型，每天UTC8:00和20:00刷新。
help_domination_desc_2=部分統治模式中的玩法（入侵、會戰、傳奇將領）需要指揮官自行部署部隊再開始遊戲，可以在統治界面右上角的部隊按鈕進入並招募。
help_domination_desc_3=通過傳奇將領玩法的戰鬥，可以解鎖對應將領的招募權，隨着戰鬥深入還可以獲得招募折扣。
help_domination_desc_4=指揮官將使用自己組建的部隊進行戰鬥，勝利後可以獲得勳章獎勵。入侵每天UTC8:00和20:00刷新。
help_domination_desc_5=指揮官可以通過貿易交換獲得自己缺少的資源。
help_domination_desc_6=指揮官將使用自己組建的部隊進行戰鬥，勝利後可以獲得勳章獎勵。該玩法不會刷新。

help_hq_1=將領
help_hq_2=培養將領
help_hq_3=勳章
help_hq_4=勳帶
help_hq_5=科技
help_hq_6=地標
help_hq_7=奇觀
help_hq_8=精英部隊
help_hq_9=將領傳記

help_hq_desc_1=HQ是指揮官管理麾下將領的中心，在這裏可以查看並管理已擁有將領的狀態，也可以招募新的將領。將領槽位會隨着HQ等級提升而解鎖，HQ等級經驗值可以在劇本、統治、征服等模式中獲取。
help_hq_desc_2=提升軍銜和晉升可以增加將領帶領部隊的HP上限，另外還可以通過升級將領能力值與技能的方式來提升將領的作戰能力。每完成一個劇本章節，所有將領可以晉升的級別提高一次。
help_hq_desc_3=將領可以佩戴勳章來進一步提升作戰能力，每位將領最多可以佩戴3枚不同的勳章，拖動收藏內的勳章即可佩戴/取下。
help_hq_desc_4=勳帶是提升將領作戰能力的另一種裝備，將領每晉升一次會解鎖一個勳帶槽位，每位將領最多可以佩戴3枚不同的勳帶。3枚相同的勳帶可以合成爲高一級的相同勳帶。
help_hq_desc_5=提升科技可以強化不同兵種在所有模式戰鬥中的各種能力。
help_hq_desc_6=可以通過統治模式解鎖，用於各模式城市建設。
help_hq_desc_7=奇觀可以帶來一些統治模式的收益以及資源產出，奇觀可以通過統治模式的各種玩法解鎖，具體解鎖方式可以通過點擊奇觀查看詳情。
help_hq_desc_8=精英部隊是一種強力的作戰單位，指揮官可以通過積攢兵種碎片來解鎖/升級，精英部隊碎片主要通過活動與內購獲取。除空軍部隊，每個精英部隊在一場戰鬥中只能被招募一次。
help_hq_desc_9=指揮官可以在將領傳記中體驗各位名將經歷過的著名戰役，完成一個將領的全部5個關卡後還可以獲得其專屬稱號獎勵。

help_battle_1=移動
help_battle_2=撤銷
help_battle_3=攻擊
help_battle_4=勝利條件
help_battle_5=派遣將領
help_battle_6=招募部隊
help_battle_7=佔領城市
help_battle_8=防空與碉堡
help_battle_9=地形效果
help_battle_10=士氣

help_battle_desc_1=點擊某個可行動的己方部隊即可選中，此部隊的移動範圍將在地圖上顯示。複雜的的地形（如山地、樹林）會消耗更多行動力。
help_battle_desc_2=操控部隊進行移動後，可以點擊撤銷按鈕回退到行動前的位置，一旦部隊進行了攻擊，或者指揮官點擊了其他位置取消選擇該部隊，則無法再進行撤銷操作。
help_battle_desc_3=選中己方部隊後，若是有敵軍處於其攻擊範圍內，將會用紅圈標記顯示，此時點擊敵軍即可對其發動攻擊。攻擊時，我方部隊處於敵軍攻擊範圍內，會受到反擊傷害，若此次攻擊消滅了敵軍，則不會受到反擊傷害。
help_battle_desc_4=關卡信息界面將在在每回合開始時彈出，指揮官可以在這裏看到關卡勝利所要求的條件，以及派遣將領數量限制和當前回合獲得資源。關鍵據點將以紅圈顯示，佔領或丟失這裏會關係到戰役的勝負。
help_battle_desc_5=選擇某個我方部隊後即可派遣將領帶領此部隊，極大提升這個部隊的作戰能力。
help_battle_desc_6=己方城市在城內沒有部隊的情況下可以招募部隊，補充作戰兵力，招募普通部隊需要對應的工廠等級，而精英部隊可以無視工廠等級直接招募。
help_battle_desc_7=當敵軍城市的耐久值歸零且城中沒有部隊時，即可移動並佔領敵方城市，佔領後我方將獲得這個城市的操控權。
help_battle_desc_8=在我方領土可以建造防空設施來抵禦空中打擊，在我方領土的空地可以建造碉堡來抵禦敵方的地面部隊。
help_battle_desc_9=複雜的地形不僅會影響部隊移動，部隊受到的的傷害也會降低。指揮官可以選中地塊後在畫面左上角查看地塊狀態。
help_battle_desc_10=士氣是影響部隊作戰能力的重要因素，當部隊被敵軍夾擊時，士氣會下降，部隊造成傷害降低。士氣崩潰時部隊將無法進行攻擊或反擊，請指揮官避免此類情況。

help_system_1=雲存檔
help_system_2=語言
help_system_3=戰爭通行證
help_system_4=成就
help_system_5=限時將領

help_system_desc_1=可以通過主菜單右側列表進入雲存檔功能，上傳與下載數據，以便在不同設備上同步遊戲進度。
help_system_desc_2=可以通過主菜單右側列表切換不同語言。
help_system_desc_3=戰爭通行證是獲取大量資源的便捷手段之一，分爲免費獎勵與付費獎勵。可以在任意戰鬥模式的左側列表進入。
help_system_desc_4=在成就列表內可以看到各種富有挑戰性的里程碑任務，更有豐厚的獎勵。可以在任意戰鬥模式的左側列表進入。
help_system_desc_5=當這個圖標出現時，意味着商城內正在限時出售強力的將領，不容錯過！

