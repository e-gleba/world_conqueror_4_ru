feat_desc_98=進入潛行狀態，無法被陸軍、海軍主動攻擊。冷卻2回合。潛行時行動力+{1}，持續1回合。攻擊後解除潛行狀態。
feat_desc_99=攻擊時無法被反擊。攻擊部隊時造成的傷害提高{1}%（潛行狀態下傷害提高{2}%），攻擊建築時傷害降低50%
feat_desc_100=呼叫直升機，將自身運送至5格內的指定位置，冷卻2回合
feat_desc_100_Lv2=呼叫直升機，將自身運送至9格內的指定位置，冷卻2回合
feat_desc_101=部隊損失過半後，下回合回復上限{1}%的HP
feat_desc_102=本回合致命一擊概率增加{1}%，攻擊時無視目標{2}%的護甲，冷卻2回合
feat_desc_103=防禦力增加{1}%
feat_desc_104=防空武器無法防禦來自超高空轟炸的攻擊
feat_desc_105=無法作為航母艦載機。每次發動攻擊時能夠在目標區域內額外造成{1}%傷害效果
feat_desc_106=攻擊攜帶核彈時，核彈造成的傷害增加{1}%
feat_desc_107=本回合攻擊時對目標1格範圍內其他目標造成{1}%額外傷害，冷卻2回合
feat_desc_108=能夠攻擊敵方多個部隊，對裝甲、火砲單位傷害增加{1}%
feat_desc_109=使周圍1格範圍內的敵方部隊大部分增益狀態失效，冷卻3回合
feat_desc_109_Lv2=使周圍2格範圍內的敵方部隊大部分增益狀態失效，冷卻2回合

army_buff_desc_1351=潛行：行動力+2，無法被陸軍、海軍主動攻擊。
