feat_desc_154_Lv3=對裝甲、火炮單位傷害+{0}%。攻擊目標後，若目標未被消滅，使其獲得牽制效果，持續1回合；若目標被消滅，自身可再次行動，但傷害降低{1}%，每回合上限{2}次
