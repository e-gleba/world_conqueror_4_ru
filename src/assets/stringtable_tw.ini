dialogue_3304=迅速與其他人取得聯繫，在座標位置的基地會合。
dialogue_3305=不明身份的武裝勢力突然出現在戰區了！和談已被破壞，立刻發動攻擊！
dialogue_3306=通訊恢復了。奧斯本，你還活著！ ？我的周圍出現了多國部隊，甚至還有大量德軍！
dialogue_3307=我不畏懼死亡，因為我一直都在為自己的信念而戰。這是科爾森和我的秘鑰。奧斯本，剩下的交給你了。
dialogue_3308=我早已經失敗，但也注定會成功！你們的犧牲不會白費的。
dialogue_3309=為什麼威廉姆斯會出現在那裡？他們是哪一邊的？那些是什麼武器？
dialogue_3310=援軍已經抵達戰場。德軍沿路的空襲嚴重拖慢了我們的行軍速度。
dialogue_3311=已與基地周圍的友軍取得了聯繫，各項設施也能正常運作。現在該為死去的戰友報仇了。
dialogue_3312=萊蒂西亞的領土紛爭現在擴大為了全面戰爭。我們會協助哥倫比亞獲得勝利，讓德國的勢力遍佈整個世界。
dialogue_3313=這種形式的衝突與戰爭在這裡不斷上演。這不是第一次，也必然不會是最後一次。
dialogue_3314=為什麼秘魯的軍隊在向我們開火！我們是不會放下武器束手就擒的。
dialogue_3315=該死，剛才你指揮了一支小隊同時攻擊了哥倫比亞和秘魯的軍隊。現在我們得把你弄到一個安全的地方。
dialogue_3316=我知道有個安全的地方，就在三國交界地附近的雨林中。
dialogue_3317=是你們！原來是這樣。
dialogue_3318=優先消滅周圍的德軍部隊，給科爾森他們打開一條通路。
dialogue_3319=你是誰？為什麼要幫我們？
dialogue_3320=因為你們的無知，也因為你們的勇氣。
dialogue_3321=我似乎在哪裡見過你。
dialogue_3322=
dialogue_3323=無論如何有一點十分確定。都是因為你，我們才落到如此境地。
dialogue_3324=等清除了其他威脅後，我會在基地裡向你們解釋這一切。
dialogue_3325=在運輸機的協助下，弗朗哥的非洲軍團已經順利抵達了前線。他們會從南面向馬德里方向發動攻擊。
dialogue_3326=情報顯示德軍的禿鷹軍團主力盡出，在敵人的大規模空襲下，畢爾包恐怕會迅速失守。
dialogue_3327=死守馬德里和巴塞隆納，不要讓叛軍對我們形成夾擊。
dialogue_3328=內戰果然爆發了，一切都與奧斯本所描述的完全一致。
dialogue_3329=為了加速推進，形成對馬德里的包圍，我的空軍部隊將清除北部仍在抵抗的共和國軍。
dialogue_3330=情報顯示一支意軍的精銳部隊已從東部登陸。從他們的行動路線來看，似乎是想穿越沙漠，潛入我們的腹地。
dialogue_3331=不要後退，利用裝甲單位協助步兵防禦，鞏固東側的防線。
dialogue_3332=希望我沒到得太晚。英國那邊的計劃進行地十分順利。
dialogue_3333=佛朗哥已經被我們擊退。但叛軍仍源源不絕地從南部湧來。
dialogue_3334=我們的意圖已被察覺，不過敵軍的防禦部署也被打亂了。行動終止，現在該撤退吧。
dialogue_3335=感謝你們的及時支援。但以我的判斷，共和國軍恐怕正在輸掉這場戰爭。
dialogue_3336=部隊已經承受了大量的傷亡。指揮部命令各志願軍部隊，向東集結，準備撤退。
dialogue_3337=我們還會再見的。希望你們的救世主義情結不會讓你越陷越深。
dialogue_3338=西班牙的黃金時代早已成為歷史，它和過去自己的殖民地一樣陷入了一種循環。我們的出路究竟在哪裡。
dialogue_3339=被殖民者、軍閥、資本家控制的時代已經結束了。這個世界需要一次變革，需要我。而我需要你們。
dialogue_3340=一個支持美國的伊朗政府有助於美國在中東取得地理和戰略優勢。我們決不能重蹈朝鮮戰場的覆轍。
dialogue_3341=我們十分瞭解艾森豪和他的盟友們。因此，我們早就做好了對策。現在開始行動吧。
dialogue_3342=我們被蘇軍擺了一道！他們已經控制住了德黑蘭和其他北部地方城鎮。甚至入侵了伊拉克與土耳其。
dialogue_3343=繼續按計劃執行，我們也有自己的底牌。
dialogue_3344=盧卡斯經常提起你們。我很好奇以你們的立場，這次採取什麼樣的行動。
dialogue_3345=石油生意讓我們在中東各國結識了許多有錢的朋友。而我們有著共同的敵人，光這一點就足夠了。
dialogue_3346=你說的沒錯。但是這次我們在明面上必須保持中立。一點小小的軍費我們還是出得起的。
dialogue_3347=我們不會主動出兵，但是會為你們的部隊持續提供物資保障。
dialogue_3348=情報局早就考慮到了這一點。雇傭兵和武裝人員已經提前潛伏在了各重要城市周圍。
dialogue_3349=這是什麼火炮？
dialogue_3350=這是我的專利。以後可以慢慢向你解釋設計原理。
dialogue_3351=蘇軍的全面進攻已經威脅到了我們的基地。現在立即開始反擊。
dialogue_3352=德黑蘭的行動已經取得了成功。據可靠情報，敵人即將轉移進攻的重心，向伊朗增派大量援軍。
dialogue_3353=蘇聯的勢力正在被我們趕出這片土地。
dialogue_3354=衛星控制權已被成功劫持。衛星武器已上線。
dialogue_3355=消滅周圍的蘇軍部隊，我們會確保你的安全。
dialogue_3356=南美的行動已經公開了我們的存在。沒有偽裝的必要了。
dialogue_3357=叛亂分子佔領了我們在庫頁島的研究基地，調集兵力重新奪回那裡。
dialogue_3358=即使有蘇軍內部人員提供的資料也不可能在這麼短時間內完成劫持。你究竟是怎麼辦到的？
dialogue_3359=匹夫無罪，懷璧其罪。原本科研上的合作已有成果，卻不想招來了殺生之禍。
dialogue_3360=新的美日安保條約出賣了我們的利益！我們會一直一直戰鬥下去，直到勝利或死亡。
dialogue_3361=日本國內的起義分散了美軍的注意力，這正是我們撤退的好時機。
dialogue_3362=不，起義軍的領袖也是我們的營救目標之一。
dialogue_3363=大丈夫生居天地間，豈能鬱鬱久居人下。
dialogue_3364=大業未成，天命難違。
dialogue_3365=敵軍的主要據點已被壓制。加入我們，獨自作戰必然毫無勝算。
dialogue_3366=識時務者為俊傑，通機變者為英豪。我可以加入你們，我們的戰鬥還遠未結束。
dialogue_3367=如今四海飄零，無容身之地。幸得諸位相救，能有安身之所。
dialogue_3368=這些分離主義分子在奧斯本的煽動下不斷破壞著聯盟的團結。必須要採取行動根除東歐的黑蠍勢力。
dialogue_3369=東方集團的內部正在產生分裂，恐怕蘇軍早已計畫好用武力來解決這些問題。
dialogue_3370=任務順利完成，我已經證明了自己和我們家族的實力。如果你們需要，我也可以提供一些額外的軍事服務。
dialogue_3371=蘇軍已經越界，我們不會容忍任何人在自己的領土上駐軍。
dialogue_3372=沒有永遠的朋友，也沒有永遠的敵人。立刻派遣援軍援助南斯拉夫與羅馬尼亞。要小心黑蠍的部隊。
dialogue_3373=蘇軍的情報顯示瓦格納已經投靠了黑蠍組織。必須立即採取行動。
dialogue_3374=這怎麼可能！
dialogue_3375=為了蘇軍而戰或是為了自己而戰。現在選擇權在你手中。
dialogue_3376=該死，怎麼又是你們！要是想要答案，我就給你們一個答案。
dialogue_3377=沒人能預知一切，沒人能憑一己之力決定戰爭的結果。
dialogue_3378=看樣子你們是不會放過我了。
dialogue_3379=繼續進攻。這門火炮將在我手中發揮出它最大的威力。
dialogue_3380=波蘭的蘇軍已經被我們壓制，我的人會繼續向東發起進攻。
dialogue_3381=局部的勝利也無法撼動美蘇在歐洲的勢力。
dialogue_3382=那是當然，但我們不會放過任何一個讓敵人之間互相消耗的機會。
dialogue_3383=東部的戰況趨於白熱化，加州與德州的起義軍在那裡組成了聯盟，逐漸佔據了上風。
dialogue_3384=美國不需要一個軟弱的總統。
dialogue_3385=天下戰術無堅不破，唯快不破。
dialogue_3386=率先控制住起義軍的後方總部，就能提前終結這場戰爭。
dialogue_3387=東部的戰局已經無法挽回。這裡的局勢恐怕也將有新的變數。
dialogue_3388=也許該適時收手，轉攻為守了。
dialogue_3389=我們先撤回墨西哥的基地，盯住德州美軍的動向。
dialogue_3390=華盛頓已經被起義軍聯盟攻佔。這個世界將會重新見證我們的決心與力量。
dialogue_3391=不論你是哪種美國人，奧斯本和他的黑蠍都是我們的敵人。美軍將追你到天涯海角。
dialogue_3392=既然是這樣，那就來吧。
dialogue_3393=隨著國內局勢的穩定，更多盟友加入了我們一同對抗黑蠍。
dialogue_3394=針對南極遺跡的技術解析取得了重大進展。不能讓任何勢力踏上南極一步。
dialogue_3395=我們的研究即將完成，讓這些不知死活的人見識一下真正的力量！
dialogue_3396=不，怎麼會這樣。
dialogue_3397=看來我們的一系列行動並未延緩蘇軍的研發進程。不過現在我們還有時間。
dialogue_3398=黑蠍基地裡的資料已經成功恢復，資料表明我們正在遭受來自未來的襲擊。但是並未查到關於奧斯本的資料。
dialogue_3399=艦隊已經封鎖了島嶼群東側的海域，黑蠍部隊間的聯繫被切斷了。
dialogue_3400=消滅南極的每一個敵人。沒有人能活著離開這裡。
dialogue_3401=新的戰車原型已經完成。這些武器的威力在南美一戰中已經得到了充分的展現。
dialogue_3402=蘇軍的研究成功了，一旦投入量產，後果不堪設想。
dialogue_3403=現在和我們一起阻止蘇軍還來得及。
dialogue_3404=除了這些先進軍事裝備外，還有一項更為驚人的技術。
dialogue_3405=奧斯本，原來無知才是你真正的武器。
dialogue_3406=大軍灰飛煙滅，世界在我腳下燃燒
dialogue_3407=奧斯本你沒事吧，你的狀態有點奇怪。
dialogue_3408=在遙遠的未來，只有戰爭。
dialogue_3409=他仿佛已經變成了另一個人。
dialogue_3410=其他十二份秘鑰已全部集齊並存活，這次是我贏了！
dialogue_3411=戰爭從未改變。

event_209=黒蠍崛起

operation_stage_name_20901=南美洲
operation_stage_name_20902=西班牙
operation_stage_name_20903=中東
