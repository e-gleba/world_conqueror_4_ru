synergy_tactics_1_1=・所有“幽靈師”單位行動力+3
synergy_tactics_1_2=・協同攻勢：裝甲單位自身周圍2格內，每有1個友方“幽靈師”單位，自身攻擊時額外造成2%的傷害。
synergy_tactics_1_3=・追亡逐北：步兵單位相鄰的友方“幽靈師”單位在本回合消滅了1個敵軍，該步兵單位本回合可以額外移動1次（效果一回合一次）。
synergy_tactics_1_4=・前沿觀測：炮兵單位若其相鄰1格內有友方“幽靈師”步兵單位，傷害增加10%。
synergy_tactics_2_1=・所有“矛頭師”單位攻擊力+10
synergy_tactics_2_2=・步坦協同：裝甲單位若其相鄰1格內有友方“矛頭師”步兵單位，則致命一擊傷害+20%。
synergy_tactics_2_3=・集群機動：步兵單位自身周圍2格內，每有1個友方“矛頭師”單位，行動力+2。
synergy_tactics_2_4=・陣地援護：炮兵單位相鄰1格內有友方“矛頭師”單位，受到的傷害減少15%。
synergy_tactics_3_1=・所有“塔曼旅”陸軍單位獲得10%閃避率（空襲無視該閃避）
synergy_tactics_3_2=・兩栖機動：海軍單位周圍2格內的友方“塔曼旅”陸軍單位無視下海時對行動力的影響，行動力+2。
synergy_tactics_3_3=・發射引導：炮兵單位自身周圍2格內，每有1個友方“塔曼旅”單位，致命一擊概率+4%。
synergy_tactics_3_4=・火力支援：步兵單位相鄰1格內有友方“塔曼旅”單位，則射程+1，攻擊最遠距離時傷害-15%。


