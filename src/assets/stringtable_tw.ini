dialogue_2834=同志們，解放克盧日，將德匈聯軍趕出羅馬尼亞！
dialogue_2835=向德布勒森前進，把敵人徹底摧毀！
dialogue_2836=向東北進攻，奪取加里寧！爭取更進一步切斷莫斯科和雅羅斯拉夫爾的聯繫。
dialogue_2837=加里寧方面軍由科涅夫同志領導，一定要阻止德軍突破加里寧！莫斯科會竭力調集資源支持。
dialogue_2838=各單位注意，以積極的方式從各個方向突擊德軍，消耗其力量，阻止敵軍繼續推進！
dialogue_2839=敵人的反抗極為強烈！一定要穩定陣線，避免後路被斷線。
dialogue_2840=莫斯科近在眼前，蘇軍已經疲憊。撕裂他們的防線，攻入莫斯科！
dialogue_2841=同志們，敵人已經逼近莫札伊斯克防線。我們必須守住──我們身後就是莫斯科！
dialogue_2842=同志們，仇敵的國土就在眼前，復仇的時刻已經來到。進攻！洗刷戰敗的恥辱，告慰戰死的亡靈！
dialogue_2843=士兵們，為了普魯士的榮耀，為了我們的家園，要不畏犧牲地抵抗到最後一刻！
dialogue_2844=各艦隊注意，我們要清掃日軍海上力量，為登陸提供空間。拿下菲律賓，日本海軍就再無威脅！
dialogue_2845=士兵們，登島，殺敵，洗刷我們的恥辱！
dialogue_2846=諸君，無論犧牲多少，我們必須打贏這一仗！失去菲律賓，海軍就再無用武之地。
dialogue_2847=諸君繼續奮戰，我部來引導敵人！
dialogue_2848=我方補給遠勝敵軍！步兵開道，戰車殲敵，此戰必勝！
dialogue_2849=我沒回來前，依托地雷區防守。節省物資，等待補給。
dialogue_2850=補給艦即將抵達。裝甲部隊向北部集中，準備奪回陣地！
dialogue_2851=好消息，皇家空軍摧毀了敵軍在圖卜魯格的補給艦！
dialogue_2852=補給不足，部隊的損失太大了。我們已經無法繼續戰鬥，全軍撤退！
dialogue_2853=希軍裝備遠不如我們！士兵們，彰顯義大利的榮耀，佔領希臘！
dialogue_2854=希軍相當有韌性，但仍無法擋住我們。
dialogue_2855=守住陣線，不能讓他們奪回陣地！
dialogue_2856=拿下奧古斯塔皇后灣，守住它！
dialogue_2857=日軍從海上來了一波增援，阻止他們！
dialogue_2858=南部部隊負責吸引火力，北部部隊負責主攻。同志們，解放基輔就在此戰！
dialogue_2859=不惜一切代價守住基輔，戰線不允許再後移了！
dialogue_2860=我們不能被困死在基輔，快速向西南撤退！
dialogue_2861=基輔已經解放，繼續追擊德軍！
dialogue_2862=反攻！阻止敵軍繼續推進！
dialogue_2863=此次行動分為三路並行。雖然當地守軍力量薄弱，但是動作要快，防止港口被破壞。
dialogue_2864=義大利皇家海軍現在停泊在塔蘭托。機會難得，此戰必須摧毀他們！
dialogue_2865=防空砲反擊，躲避空襲！
dialogue_2866=海軍掩護陸軍登陸，務必奪回機場！
dialogue_2867=偵察機傳來報告：日軍正在靠近瓜島。做好戰鬥準備！
dialogue_2868=日軍增援到了，注意防備！
dialogue_2869=敵人在南部的防備空虛。我們從這裡繞過防線，吸引圍城部隊，解放圖卜魯格！
dialogue_2870=圍攻圖卜魯格的部隊繼續作戰。其他部隊在駐地防守，等待補給。
dialogue_2871=圖卜魯格已經拿下，現在全力反擊！
dialogue_2872=繼續進攻，拿下羅斯托夫！
dialogue_2873=向前推進，做好包圍準備。這一戰，我們要重創德軍第1裝甲集團軍！
dialogue_2874=部隊不能覆滅在這裡，第1裝甲集團軍撤出羅斯托夫。
dialogue_2875=同志們，反擊的時刻已經到來。進攻，奪回我們的陣地!
dialogue_2876=守住防線，絕不能放棄任何陣地！
dialogue_2877=同志們，我們不能允許他們倒向德國，為列寧格勒帶來危險。進攻！直到列寧格勒安全為止！
dialogue_2878=各位同胞，為了芬蘭的獨立，為了家鄉的安全，我們要奮戰到底！
dialogue_2879=集中兵力佔領納羅-福明斯克，將戰線繼續向莫斯科推進！
dialogue_2880=同志們，我們一定要守住這條防線，不能讓敵人闖進莫斯科！
dialogue_2881=砲兵支援已經到位。同志們，讓我們奪回加里寧！
dialogue_2882=各部隊注意：依托陣線，沿河防守，確保加里寧不失！

dialogue_3000=先頭部隊已切斷敵人的陸上增援，成功完成對史達林格勒的合圍。
dialogue_3001=第三帝國的命運掌握在我們手中，我們要像機器般冷酷無情地碾壓敵人，史達林格勒將見證我們的不朽！
dialogue_3002=背後是伏爾加河，我們已無退路！任何叛逃者將被處決，而活下來的士兵將獲得越級晉升！
dialogue_3003=儘管我將離開前線，但我的心依然與你們同在，逆境不過是對我們意志的考驗，挺過去，勝利終將屬於我們。
dialogue_3004=我到這裡不是來掩護撤退，而是來徹底擊敗敵人。我們將在每一條街道、每一座工廠、每一塊殘垣斷壁後面阻擋敵人的進攻。
dialogue_3005=從高空俯視，敵人只不過是棋盤上的兵卒。每一次俯衝都將是對敵人的審判！
dialogue_3006=他們以為自己掌控了戰局，卻不知真正的力量正向他們逼近。反攻的狂潮將把他們徹底捲入困境。
dialogue_3007=敵人曾以為他們不可撼動，但我們徹底粉碎了他們的傲慢。拿下卡拉奇，將成為敵人惡夢的開端。
dialogue_3008=敵人的圍困只是暫時的，一旦增援部隊抵達，他們的勝利夢將徹底破滅。不惜一切代價，向史達林格勒方向增援！
dialogue_3009=每一步都是為了勝利鋪路，每一擊都是為敵人敲響的喪鐘。
dialogue_3010=在戰場上，我只做一件事──決定敵人最後一次呼吸的時刻。
dialogue_3011=身為軍人，我盡了最大的努力去履行我的職責，但在絕境面前，我們的選擇已經所剩無幾。
dialogue_3012=我為我的士兵感到驕傲，他們在最艱難的條件下展現了無與倫比的勇氣。願在此犧牲的士兵們得以安息。
dialogue_3013=史達林格勒的每一塊磚石，都將變成敵人的墳墓！
dialogue_3014=天空失去了一隻雄鷹，我的命運在此終結。即使墜落，我也會燃盡最後的光芒。
dialogue_3015=一切...都結束了嗎？這顆子彈或許能奪走我的生命，卻永遠無法熄滅我們復仇的怒火。

