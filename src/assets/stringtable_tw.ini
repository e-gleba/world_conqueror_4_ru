elite_intro_91=M142海馬斯火箭炮基於卡車底盤研發，憑藉其卓越的高機動性、精確打擊能力和快速部署特性，成為現代戰場上極具威脅的武器系統之一。該系統能夠發射多種火箭彈，廣泛應用於支持快速反應部隊執行遠端精確打擊任務。憑藉其出色的戰場適應性，海馬斯在現代戰爭中發揮著至關重要的作用。

