dialogue_2670=部隊推進得十分順利。我們即將突破防線，向蘇軍的基地前進。
dialogue_2671=導彈已經部署完畢，隨時可以對敵軍進行打擊。
dialogue_2672=利用好我們的殺器，摧毀這裡的敵人。
dialogue_2673=立即發起反擊，重新奪回漢城。
dialogue_2674=蘇軍的進攻已經對我們造成了嚴重的威脅，必須採取措施予以還擊。
dialogue_2675=行動取得了階段性的成功。但現在還不能放鬆，隨時準備應對蘇軍的反攻。
dialogue_2676=摧毀蘇軍的海上要塞，阻止敵人的艦隊重新集結。
dialogue_2677=美軍已經展開了全面入侵，留給我們的時間不多了。
dialogue_2678=阻止美軍佔領蘇維埃港，我的援軍即將抵達戰場。
dialogue_2679=美軍的數量十分龐大，進攻異常迅猛，我需要更多的增援。
dialogue_2680=我會繼續戰鬥，等待援軍發動反攻。
dialogue_2681=登陸點已被蘇軍佔領。重新集結力量，封鎖韃靼海峽。
dialogue_2682=登陸部隊已經集結完畢，隨時準備進行奪島作戰。
dialogue_2683=直接向北海道的敵軍據點發起進攻，南庫里爾群島的守軍會為我們的行動爭取時間。
dialogue_2684=我們的進攻失去了重要的支點。向北海道方向撤退！
dialogue_2685=敵人的守軍已被我們擊敗，立即清掃周邊海域的蘇軍艦隊。
dialogue_2686=美軍在三個戰場同時向我們發起了進攻。全力守住各要塞與城市。伺機發動反攻。
dialogue_2687=援軍已經無法抵達戰場，接下來就要靠我們自己了。這將會是一場硬仗。
dialogue_2688=蘇軍的防線並不堅固，用不了多久我們就能清除堪察加半島剩餘的蘇軍基地。
dialogue_2689=我的裝甲部隊會死守這裡，請協助前線部隊撤回防線。
dialogue_2690=聯軍的艦隊正從白令海方向朝這裡趕來，小心敵人後續的登陸部隊。
dialogue_2691=美軍的攻擊重心馬上就會轉移。優先處理敵軍將領，依託有利地形重新組織防禦。
dialogue_2692=我們重新掌握了進攻的主導權。奪回群島上的物資會是一個不錯的開始。
dialogue_2693=美軍將防禦重心全部集中在了安克雷奇周邊，現在就是登陸的好時機。
dialogue_2694=聯合艦隊會從白令海峽南部發起進攻，衝破這層“冰幕”。
dialogue_2695=協助友軍越過白令海峽，迅速控制住安克雷奇周邊地區。
dialogue_2696=各條防線均被層層突破，繼續堅守也只是死路一條。
dialogue_2697=主動出擊，重新奪回我們的陣地。
dialogue_2698=蘇軍海陸並進，已經在阿拉斯加站穩了腳跟。
dialogue_2699=撤退路線全部被蘇軍封死了，現在只能憑藉阿拉斯加山脈的險要地形重新佈置防線。
dialogue_2700=安克雷奇以西的美軍就交給我們處理。繼續向東進攻，完成這個包圍圈。
dialogue_2701=我們攻破了敵軍的要塞，他們已經無路可退了。
dialogue_2702=形勢已經十分危急。立刻調動所有預備部隊，火速救援安克雷奇。
dialogue_2703=研究設施已經被我們控制。利用好這裡的一切，加速敵軍的覆滅。
dialogue_2704=蘇軍攻破了我們最堅固的堡壘。阿拉斯加已經徹底脫離了我們的掌控。
dialogue_2705=絕不能坐以待斃。現在必須主動出擊，重奪費爾班克斯才能有一線生機。
dialogue_2706=迅速包圍蘇軍的先頭部隊，不要讓敵人輕易地展開陣型。
dialogue_2707=敵人的防線切斷了我們與友軍間的聯繫。必須在援軍抵達前突破這層障礙。
dialogue_2708=我們成功阻斷了蘇軍部隊之間的連接，利用好我們的防禦縱深，將敵人徹底拖垮。
dialogue_2709=溫哥華的守軍已被擊潰，西海岸的進攻通道即將開啟。
dialogue_2710=援軍即將抵達戰場。死守住西雅圖，我的部隊會向溫哥華方向發動反攻。
dialogue_2711=繼續進攻！讓敵人在我們的鋼鐵洪流面前顫抖！



dialogue_2651=盟軍各國部隊已集結完畢，勝利的天平會向我們傾斜！
dialogue_2652=盟軍的資源和補給遠遠超過我們，我們面臨著一場艱苦的戰鬥。
dialogue_2653=將88毫米防空炮放平，埋伏在沙漠與戰壕中，給敵軍個措手不及。
dialogue_2654=這不可能，敵軍居然絲毫沒有敗退的跡象。我們必須依靠地中海的補給艦隊，與他們展開長期消耗戰！
dialogue_2655=堅守岸防，不要給援軍任何登陸機會。
dialogue_2656=義大利已遭到盟軍的攻擊，請德軍指揮官予以支援！
dialogue_2657=勝利的曙光已在眼前。堅持住指揮官，我們即將全身而退！

dialogue_2658=取消珍珠港每週日的飛機巡邏，讓我們的飛行員得到充分休整。
dialogue_2659=皇國興廢，在此一戰。各官兵必要盡其職，鞠躬盡瘁！
dialogue_2660="...半晴，山間雲氣較大。港口能見度良好。偏北風十級左右。"檀香山的廣播並無異常，我們的襲擊敵人毫不知曉。
dialogue_2661=這不是演習！珍珠港正在遭受日本襲擊！
dialogue_2662=虎！虎！虎！
dialogue_2663=動用所有防空力量，守住我們的軍艦和港口！
dialogue_2664=若能在這場襲擊中被一槍打死，對我也算慈悲了。
dialogue_2665=我擔心我們所做的一切，不過是喚醒了一位沉睡的巨人，他將會帶著巨大的決心同我們作戰。
dialogue_2666=突！突！突！

