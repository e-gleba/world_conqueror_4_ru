feat_desc_98=잠행 상태로 진입하면 적 육군과 해군의 주동적인 공격을 받을 수 없음. 쿨타임 2턴. 잠행 시 이동력 +{1}. 지속 시간 1턴. 공격 후 잠행 상태 해제됨.
feat_desc_99=반격 받을 수 없음, 부대 공격 시 데미지 {1}% 증가(잠행 상태에서 데미지 {2}% 증가). 건물 공격 시 데미지 50% 감소.
feat_desc_100=헬리콥터를 호출하여 자신을 5칸 내 지정한 위치로 이동함. 쿨타임 2턴.
feat_desc_100_Lv2=헬리콥터를 호출하여 자신을 9칸 내 지정한 위치로 이동함. 쿨타임 2턴.
feat_desc_101=부대 손실이 절반을 초과하면 다음 턴에 상한선의 {1}% 회복.
feat_desc_102=이번 턴 동안 치명타 확률 {1}% 증가, 공격 시 대상의 장갑 {2}% 무시, 쿨타임 2턴.
feat_desc_103=방어력 {1}% 증가.
feat_desc_104=방공 무기는 초고도 폭격의 공격을 방어할 수 없음.
feat_desc_105=항공모함 함재기로 사용할 수 없음. 매번 공격 시 목표 지역 내에 {1}% 추가 피해 입힘.
feat_desc_106=공격 시 핵폭탄을 장착할 경우 핵폭탄의 데미지 {1}% 증가.
feat_desc_107=이번 턴 공격 시 목표의 1칸 범위 내의 다른 대상에게 {1}% 추가 피해 입힘. 쿨타임 2턴.
feat_desc_108=적군의 여러 유닛을 공격할 수 있으며, 탱크와 화포 유닛에 대한 데미지 {1}% 증가.
feat_desc_109=주변 1칸 범위 내 적군의 버프 상태 무효화시킴. 쿨타임 3턴.
feat_desc_109_Lv2=주변 2칸 범위 내 적군의 버프 상태 무효화시킴. 쿨타임 2턴.

army_buff_desc_1351=잠행: 이동력 +2, 육군과 해군의 주동적인 공격을 받을 수 없음.
army_buff_desc_1352=잠행: 이동력 +4, 육군과 해군의 주동적인 공격을 받을 수 없음.
army_buff_desc_1353=잠행: 이동력 +6, 육군과 해군의 주동적인 공격을 받을 수 없음.
army_buff_desc_1361=열화우라늄탄: 치명타 확률 20% 증가, 공격 시 대상의 장갑 30% 무시.
army_buff_desc_1362=열화우라늄탄: 치명타 확률 30% 증가, 공격 시 대상의 장갑 45% 무시.
army_buff_desc_1363=열화우라늄탄: 치명타 확률 40% 증가, 공격 시 대상의 장갑 60% 무시.
army_buff_desc_1371=AGM-114 헬파이어: 목표의 1칸 범위 내 다른 대상에게 25% 추가 피해 입힘.
army_buff_desc_1372=AGM-114 헬파이어: 목표의 1칸 범위 내 다른 대상에게 50% 추가 피해 입힘.
army_buff_desc_1373=AGM-114 헬파이어: 목표의 1칸 범위 내 다른 대상에게 80% 추가 피해 입힘.
army_buff_desc_1381=흔들림: 이동력 30% 감소(동일한 유형 중첩 불가)
army_buff_desc_1382=흔들림: 이동력 40% 감소(동일한 유형 중첩 불가)
army_buff_desc_1383=흔들림: 이동력 50% 감소(동일한 유형 중첩 불가)
army_buff_desc_1384=흔들림: 이동력 60% 감소(동일한 유형 중첩 불가)
army_buff_desc_1385=흔들림: 이동력 70% 감소(동일한 유형 중첩 불가)

