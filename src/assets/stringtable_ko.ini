elite_intro_93=88mm 36식 고사포. 독일이 제2차 세계대전 기간 동안 광범위하게 사용한 다목적 화포로, 원래는 고사 대공포로 사용되었지만, 뛰어난 장갑 관통 성능으로 인해 전차 공격용으로도 널리 사용되었다. 특히 북아프리카 전장에서 영군 기갑 부대를 상대할 때 뛰어난 성능을 보였다. 이 화포는 정확하고 위력이 강해 연합군 병사들에서 '전차 킬러'로 불렸으며, 독일군의 대표적인 무기 중 하나가 되었다.


