feat_desc_76=공격 범위가 2로 변경, 적군 여러 부대 공격 가능, 공격 시 {1}% 확률로 적군이 반격할 수 없음. 지속 시간 1턴, 쿨타임 2턴.
feat_desc_76_Lv3=공격 범위가 2로 변경, 적군 여러 부대 공격 가능, 기타 유닛에 대한 데미지 감소하지 않음, 공격 시 {1}% 확률로 적군이 반격할 수 없음. 지속 시간 1턴, 쿨타임 2턴.
feat_desc_77=장갑 유닛으로부터 받는 피해 {1}% 감소
feat_desc_78=회피 및 연막탄 효과 무시, 도시 방어에 대한 데미지 {1}% 증가
feat_desc_79=연막탄을 발사하여 자신을 연막 속에 숨겨 지상 부대의 공격을 받지 않음. 지속 시간 1턴, 쿨타임 3턴.
feat_desc_79_Lv2=연막탄을 발사하여 자신을 연막 속에 숨겨 지상 부대의 공격을 받지 않음. 지속 시간 1턴, 쿨타임 2턴.
feat_desc_79_Lv3=연막탄을 발사하여 자신을 연막 속에 숨겨 지상 부대의 공격을 받지 않고,  {1}% 확률로 1회 추가 공격 실행. 지속 시간 1턴, 쿨타임 2턴.
feat_desc_80=연막탄 효과에 처했을 경우 적의 방어력 {1}% 무시
feat_desc_81=미사일 발사 시 원자탄두 장착 가능. 초기 2개 보유, 그 후 {1}턴당 1개 회복. 최대 4개 보유.
feat_desc_81_Lv2=미사일 발사 시 수소탄두 장착 가능. 초기 2개 보유, 그 후 {1}턴당 1개 회복. 최대 4개 보유.
feat_desc_81_Lv3=미사일 발사 시 삼상폭탄 탄두 장착 가능. 초기 2개 보유, 그 후 {1}턴당 1개 회복. 최대 4개 보유.
feat_desc_82=근거리 미사일을 발사 할 수 있으며, 턴당 2회 발사 가능. 일반 공격 대체.
feat_desc_82_Lv2=중거리 미사일을 발사 할 수 있으며, 턴당 2회 발사 가능. 일반 공격 대체.
feat_desc_82_Lv3=장거리 미사일을 발사 할 수 있으며, 턴당 2회 발사 가능. 일반 공격 대체.
feat_desc_83=지상 유닛의 공격 대상이 될 수 없으며, 공군으로부터 받는 피해 {1}% 감소
feat_desc_84=직선 1개를 선택하여 최대 {1}칸 까지 전진하고(목표 지점은 공터여야 하고, 공중 대기 중인 유닛에 의해 막힘), 도중에 난사 데미지 입힘, 쿨타임 2턴.
feat_desc_85=항공모함 1헥스 범위 내에서 이륙 가능. 지형이 이동력에 미치는 영향 무시, 지뢰나 수뢰의 영향 무시, 공격 시 적군 반격 불가. 체력이 감소해도 사기가 하락하지 않습니다.
feat_desc_87=육군, 해군의 공격을 받을 때 {1}% 확률로 해당 피해 회피

event_105=진주만 공격
event_intro_105=제2차 세계 대전 초기 아시아 태평양 지역에 대한 야망이 점점 커진 일본은 군사 작전을 통해 전략적 목표를 달성하고자 했다. 그러나 일본의 침략과 확장에 따라 미국은 점차 일본의 석유, 철강 등 다양한 자원 무역을 제한했다. 이런 제한 조치는 일본의 군사력에 심각한 영향을 미쳤다. 이러한 배경에서 일본은 점점 더 급진적인 태도를 취해 은밀하고 철저한 기습 공격을 통해 태평양에서 미국의 군사력을 일거에 소멸시키려고 계획했다.

