event_stage_intro_21001=전황이 역전되었다. 소련군의 서해안 공세는 성공적으로 저지되었다. 적군은 보급선이 지나치게 확장됨에 따라 전술적 공격 능력이 지속적으로 약화되고 있지만, 여전히 군단급 병력 우세를 유지하고 있다. 반드시 사전에 구축된 방어 시설에 의지하여 단계별 방어를 실행하고, 반격 작전이 개시될 때까지 지원군 집결지를 철저히 지켜야 한다.
event_stage_intro_21002=우리가 비밀리에 훈련시킨 부대는 공격 준비를 마쳤다. 특수 함대는 피그스 만을 대상으로 상륙 작전을 수행하는 동시에 해당 지역의 방공 시스템을 무력화시킬 것이다. 지하 저항 조직 또한 우리 작전을 지원할 것이다. CIA는 이번 기습이 완벽하게 이루어질 것이라 보장했다.
event_stage_intro_21003=소련 북방 함대의 특수 혼성 편대는 이미 뉴욕 외해를 봉쇄했지만, 상황이 완전히 절망적인 것은 아니다. 즉시 비상 통신 프로토콜을 가동하여 요새 제거 작전을 수행하라. 각 지역의 부대와 연락하여 공격 집단을 재편성하고 동해안의 소련군 세력을 약화시켜라.
event_stage_intro_21004=우리 본토에 대한 소련군의 침공은 아군의 연속적인 반격으로 좌절되었다. 이제 적군은 공격의 초점을 주변 국가와 지역으로 옮겼다. 유럽 본토는 이미 방어 태세를 갖추었지만, 소련군은 극히 짧은 시간 내에 아이슬란드를 점령했으며, 이제 그들의 다음 목표는 그린란드와 캐나다다.
event_stage_intro_21005=캐나다 반군이 국내 반정부 세력과 연합하여 오대호 지역을 장악하고 동쪽으로 진군했다. 우리가 병력을 재배치하는 동안 소련군은 이를 틈타 재상륙했다. 정보에 따르면 반군과 소련군은 협력 작전을 수행하는 것이 아니므로, 이들 세력 간의 충돌을 이용하여 각 지역의 우군을 지원하고 반란을 진압하며 외적을 몰아내라.
event_stage_intro_21006=유럽과 소련 간의 갈등은 결국 전면전으로 번졌다. 북방 함대의 기습 속도는 우리가 예상했던 것보다 훨씬 빨랐으며, 심지어 가장 중요한 동맹국인 영국조차도 이를 피하지 못했다. 영국 본토의 여러 지역이 이미 소련군에 점령되었으며, 유럽은 우리의 지원이 필요하다. 특수 함대와 전략 수송기는 집단 출격 준비를 마쳤다!
event_stage_intro_21007=마지막 전략 예비대를 동원하여 최후의 결전을 준비하라. 적 전선군의 지휘 체계에 문제가 생겼으며, 각 동맹국 간의 단결력도 우리가 예상했던 것만큼 견고하지 않을 수 있다. 우리는 가능한 모든 힘을 합쳐 동쪽으로 진격하여 소련군을 그들의 땅으로 몰아내야 한다. 이는 유럽에서 우리의 영향력을 확대할 수 있는 절호의 기회다.
event_stage_intro_21011=전황이 역전되었다. 소련군의 서해안 공세는 성공적으로 저지되었다. 적군은 보급선이 지나치게 확장됨에 따라 전술적 공격 능력이 지속적으로 약화되고 있지만, 여전히 군단급 병력 우세를 유지하고 있다. 반드시 사전에 구축된 방어 시설에 의지하여 단계별 방어를 실행하고, 반격 작전이 개시될 때까지 지원군 집결지를 철저히 지켜야 한다.
event_stage_intro_21012=우리가 비밀리에 훈련시킨 부대는 공격 준비를 마쳤다. 특수 함대는 피그스 만을 대상으로 상륙 작전을 수행하는 동시에 해당 지역의 방공 시스템을 무력화시킬 것이다. 지하 저항 조직 또한 우리 작전을 지원할 것이다. CIA는 이번 기습이 완벽하게 이루어질 것이라 보장했다.
event_stage_intro_21013=소련 북방 함대의 특수 혼성 편대는 이미 뉴욕 외해를 봉쇄했지만, 상황이 완전히 절망적인 것은 아니다. 즉시 비상 통신 프로토콜을 가동하여 요새 제거 작전을 수행하라. 각 지역의 부대와 연락하여 공격 집단을 재편성하고 동해안의 소련군 세력을 약화시켜라.
event_stage_intro_21014=우리 본토에 대한 소련군의 침공은 아군의 연속적인 반격으로 좌절되었다. 이제 적군은 공격의 초점을 주변 국가와 지역으로 옮겼다. 유럽 본토는 이미 방어 태세를 갖추었지만, 소련군은 극히 짧은 시간 내에 아이슬란드를 점령했으며, 이제 그들의 다음 목표는 그린란드와 캐나다다.
event_stage_intro_21015=캐나다 반군이 국내 반정부 세력과 연합하여 오대호 지역을 장악하고 동쪽으로 진군했다. 우리가 병력을 재배치하는 동안 소련군은 이를 틈타 재상륙했다. 정보에 따르면 반군과 소련군은 협력 작전을 수행하는 것이 아니므로, 이들 세력 간의 충돌을 이용하여 각 지역의 우군을 지원하고 반란을 진압하며 외적을 몰아내라.
event_stage_intro_21016=유럽과 소련 간의 갈등은 결국 전면전으로 번졌다. 북방 함대의 기습 속도는 우리가 예상했던 것보다 훨씬 빨랐으며, 심지어 가장 중요한 동맹국인 영국조차도 이를 피하지 못했다. 영국 본토의 여러 지역이 이미 소련군에 점령되었으며, 유럽은 우리의 지원이 필요하다. 특수 함대와 전략 수송기는 집단 출격 준비를 마쳤다!
event_stage_intro_21017=마지막 전략 예비대를 동원하여 최후의 결전을 준비하라. 적 전선군의 지휘 체계에 문제가 생겼으며, 각 동맹국 간의 단결력도 우리가 예상했던 것만큼 견고하지 않을 수 있다. 우리는 가능한 모든 힘을 합쳐 동쪽으로 진격하여 소련군을 그들의 땅으로 몰아내야 한다. 이는 유럽에서 우리의 영향력을 확대할 수 있는 절호의 기회다.

dialogue_3412=소련군의 공세는 길어진 보급선으로 인해 지쳐가고 있다.
dialogue_3413=지원군이 각지에서 속속 전장에 도착하고 있다. 집결 지점을 사수하라.
dialogue_3414=계속 공격하라! 적들이 우리 철갑 대군 앞에서 몸서리치게 만들어라!
dialogue_3415=주력 부대가 집결을 완료했다. 이제 반격할 때다.
dialogue_3416=미군의 반격으로 우리 전선에 구멍이 뚫렸다. 주변 병력을 조직하여 이 공격 부대를 섬멸하라.
dialogue_3417=미군의 요새가 격파되었다. 적의 지원군은 더 이상 전장에 도착할 수 없다!
dialogue_3418=작전 개시! 내 함대가 후속 증원군의 상륙을 엄호할 것이다.
dialogue_3419=나소의 영국군 주둔지 주변에 병력을 파견하라. 카리브해 해역을 봉쇄하여 영국 해군의 증원을 차단하라.
dialogue_3420=젠장, 소련군이 이미 대비하고 있었다! 우리 부대는 중화기가 없어 적의 기갑 부대의 공격을 막을 수 없다.
dialogue_3421=작전은 거의 실패했다고 볼 수 있다. 영국군이 포위망을 뚫고 나와 소련군의 병력 배치를 분산시킬 수 있다면, 우리는 승리할 희망이 있다.
dialogue_3422=적의 공수 부대를 조심하라. 각 지역의 수비군은 협력하여 방어해야 한다.
dialogue_3423=적의 상륙군과 증원군을 모두 저지했다! 우리는 다시 하바나 남부 지역을 장악했다!
dialogue_3424=이 해역의 미군 통제력은 예상보다 강하지 않다! 두려워하지 말고 계속 공격하라!
dialogue_3425=우리의 목적은 달성되었다. 일단 전선의 부대를 철수시키고, 이 지역의 상황을 재평가한 후 반드시 멕시코 만으로 다시 돌아올 것이다.
dialogue_3426=알래스카의 소련군을 베링 해협으로 몰아냈다. 하지만 그것은 눈속임이었고, 소련군은 동해안에서 다시 집결하고 있다.
dialogue_3427=쿠바 사건은 미군의 눈길을 끄는데 성공했다. 이제 워싱턴은 더 이상 동원할 수 있는 병력이 거의 없다.
dialogue_3428=정보가 계속해서 틀리고 있다. 우리는 전장의 상황을 스스로 판단해야 한다. 증원군이 도착하기 전까지, 나는 내 위치를 사수할 것이다.
dialogue_3429=타이푼급 잠수함 한 척이 갑자기 우리와의 교신을 차단했다. 즉시 잠수함 부대를 파견하여 추격하라!
dialogue_3430=뉴욕이 함락되었다. 지금이 가장 위험한 시기이다. 공격 속도를 더욱 높여야 한다!
dialogue_3431=소련군의 타이푼급 잠수함의 지휘권이 우리에게 넘어왔다. 이를 활용해 적의 요새들을 파괴하라!
dialogue_3432=후방의 미군은 아직 집결을 완료하지 못했다. 소련군이 아직 자리를 잡지 못한 틈을 타 선제 공격을 할 수 있다!
dialogue_3433=그린란드는 우리의 지원이 필요하다!
dialogue_3434=소련군이 그곳을 완전히 점령하기 전에 더 많은 병력을 보내 그곳을 보호할 것이다.
dialogue_3435=소련군은 또 하나의 공격 거점을 잃었다. 우리 함대는 레이캬비크 방향으로 계속 공격을 감행할 것이다.
dialogue_3436=미군이 우리의 또 다른 보급선을 차단했다. 이제 철수를 고려해야 할 때다.
dialogue_3437=그린란드 주변의 함대를 재편성하여 아이슬란드 방향으로 철수하라.
dialogue_3438=소련 함대는 더 이상 물러설 곳이 없다. 하지만 유럽의 적들은 뭔가 움직임을 보이고 있다. 반드시 속전속결해야 한다!
dialogue_3439=북미 반군이 적절한 시기에 공격을 개시했다. 상륙 작전은 큰 저항 없이 진행되었고, 미군은 우리의 행동에 신경 쓸 겨를이 없다.
dialogue_3440=소련군은 우리의 동맹이 아니지만, 지금 우리에게는 공통의 적이 있다.
dialogue_3441=반군의 공세가 매우 신속하고 거세다.
dialogue_3442=적이 동해안으로 빠르게 진격하고 있다.
dialogue_3443=우리는 적의 공격을 막아낼 방법이 없다.
dialogue_3444=전방 부대가 어째서 이렇게 쉽게 무너진 것인가! 캐나다 방향으로 병력을 증강하라! 우리는 우군을 대신해 국내 반란을 해결할 것이다.
dialogue_3445=뉴욕으로 진격하는 소련군을 전력으로 막아라. 우리 부대는 서쪽의 반군 연합군을 처리할 것이다.
dialogue_3446=오스본은 방금 격파되었는데, 어떻게 다시 그곳에 나타날 수가 있을까? 우리는 더 많은 병력을 보내 이 지역을 철저히 수색할 것이다.
dialogue_3447=이대로 끝나지 않을 것이다. 나는 반드시 우리 유산을 되찾을 것이다.
dialogue_3448=미군이 아이슬란드를 기지로 삼아 노르웨이에 지속적으로 병력을 증강하며 다시 유럽으로 진군하고 있다.
dialogue_3449=그린란드 작전은 우리에게 북유럽과 영국을 기습할 수 있는 기회를 마련했다.
dialogue_3450=소련군의 신속한 양방향 공격으로 인해 우리는 단시간 내에 병력을 분산하여 지원할 수 없다.
dialogue_3451=즉시 주 공격 방향을 결정해야 한다.
dialogue_3452=이미 많은 소련 육군이 상륙을 완료했다. 즉시 저지하지 않으면 상상할 수도 없는 결과를 초래할 것이다.
dialogue_3453=더 이상 조치를 취하지 않으면, 상황을 되돌릴 수 없게 될 것이다.
dialogue_3454=영국-미국 연합군의 지원 함대를 조심하라. 우리가 노르웨이와 스웨덴 전역을 점령하기 전까지 그들의 증원을 저지해야 한다.
dialogue_3455=침공하는 소련군을 막고 계속 북쪽으로 진격하라. 미군이 유럽 문제에 개입할 기회를 주지 마라!
dialogue_3456=소련군의 선봉대가 이미 서독과 덴마크 영토로 진입했다.
dialogue_3457=우리는 더 이상 물러설 곳이 없다. 전진하라! 나토군이 전개하기 전에 그들의 공격 공간을 압축하라.
dialogue_3458=무슨 일이 있어도 프랑스의 저항의 불꽃은 꺼지지 않을 것이며, 절대 꺼지지 않을 것이다!
dialogue_3459=근거리 위협이 해제되었다. 각 부대는 출격 준비를 하라.
dialogue_3460=소련군은 더 이상 우리를 통제할 수 없게 되었다. 독일의 통일은 누구도 막을 수 없다.
dialogue_3461=동쪽으로 진격하라. 이번에는 절대 실패하지 않을 것이다!
dialogue_3462=소련군이 결국 다시 쳐들어올 것이라면, 지금이 반격을 개시하여 이 문제를 영원히 해결할 때다.
dialogue_3463=나토 연합군이 우리의 두 번째 방어선을 돌파했다. 병력을 집결하여 우리의 방어 진지를 다시 탈환하라.
dialogue_3464=오슬로가 함락되었다. 상황이 우리에게 매우 불리하다.
dialogue_3465=소련군이 발트해 주변의 대부분 병력을 철수했다. 이제 우리가 나설 때다.
dialogue_3466=이건 내 예상과 다르다. 전략 조정을 위해 더 많은 작전 데이터가 필하다.
dialogue_3467=프랑스마저 패배했다. 이대로 가면 우리 연합군은 사라질 것이다.
dialogue_3468=정신 차리고 계속 공격하라. 일시적인 패배에 흔들리지 마라!

