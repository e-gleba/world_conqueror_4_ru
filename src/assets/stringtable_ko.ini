feat_desc_150=치명타 발생 시마다 {0}% 확률로 해당 대상에게 {1}%의 추가 피해 입힘.

feat_desc_151=돌격 상태에 진입하여 이번 턴에 가하는 모든 피해 데미지 {1}% 증가, 지형이 이동력에 미치는 영향 무시, 지속 시간 1턴, 쿨타임 3턴.
feat_desc_151_Lv2=돌격 상태에 진입하여 이번 턴에 가하는 모든 피해 데미지 {1}% 증가, 지형이 이동력에 미치는 영향 무시, 지속 시간 1턴, 쿨타임 2턴.
feat_desc_151_Lv3=돌격 상태에 진입하여, 이번 턴에 가하는 모든 피해 데미지 {1}% 증가, 지형 및 입수 시 이동력에 미치는 영향 무시, 지속 시간 1턴, 쿨타임 2턴.

