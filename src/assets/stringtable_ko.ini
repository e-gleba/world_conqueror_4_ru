conquest_event_desc_36=둘리틀이 이끄는 폭격기 편대는 일본의 진주만 기습공격에 대한 보복으로 일본에서 약 650해리 떨어진 항공모함에서 이륙해 일본 본토를 폭격했다.
conquest_event_desc_37=중국은 버마에 원정군을 파견하여 공동으로 일본 침략군에 맞서 싸웠다.
conquest_event_desc_38=중국군은 창사와 그 주변에서 일본 침략군과 치열한 전투를 벌여 성공적으로 창사를 지키고 일본군의 공격을 좌절시켰다.
conquest_event_desc_39=미국과 일본 양국의 해군이 미드웨이 해역에서 대규모 해전을 벌인 결과 일본 해군은 큰 타격을 입었다.
conquest_event_desc_40=스탈린그라드에서 벌어진 독일군과 소련군의 격렬한 전투로, 양측에 수백만 명의 사상자를 내면서 소련과 독일의 전체적인 세력 균형에 근본적인 변화를 가져왔다.
conquest_event_desc_41=연합군 공수 부대가 노르웨이에 위치한 중수 공장을 기습하여 독일군의 핵무기 제조 계획을 완전히 분쇄했다.
conquest_event_desc_42=영연방군은 몽고메리의 지휘 아래 엘 알라메인 지역에서 석유와 보급품이 부족한 독일-이탈리아 연합군을 격파했다.
conquest_event_desc_43=미군은 서아프리카와 북아프리카의 주요 항구에 상륙하여 이집트에서 독일군과 대치하는 영국군을 지원함으로써 북아프리카에 제2전선을 개척하여 독일군의 역량을 분산시켰다.
conquest_event_desc_44=대량의 멕시코인들이 미국으로 입국하여 전쟁으로 인한 노동력 부족을 메우면서 멕시코의 국민소득은 증가했고, 미국에 중요한 광물을 대량으로 공급했다.
conquest_event_desc_45=미국은 선린우호정책을 내세워 라틴아메리카 국가들과의 관계를 개선하고, 라틴아메리카 국가들을 연합군에 합류시켰으며, 그들과 우호적인 관계를 유지했다.
conquest_event_desc_46=연합군 해군은 과달카날과 그 주변 섬에서 일본 해군과 치열한 전투를 벌였다.
conquest_event_desc_47=호주군과 미군은 파푸아뉴기니의 코코다 트랙의 극도로 열악한 정글과 산악지대에서 일본 침략군을 성공적으로 저격하고 일본군을 격퇴시켰다.
conquest_event_desc_48=독일군과 소련군은 쿠르스크에서 많은 기갑 부대를 투입하여 대규모 전차전을 벌였다.
conquest_event_desc_49=미국 정보기관은 일본의 통신 암호를 해독하여 태평양 상공에서 야마모토 이소로쿠의 비행기를 매복 공격하는 데 성공함으로써 일본 해군의 지휘 체계를 약화시켰다.
conquest_event_desc_50=연합군 부대는 지중해에서 시칠리아 섬에 대한 상륙 작전을 개시했다. 이번 전투는 지중해 전선의 형세를 크게 바꾸었고, 이탈리아의 항복과 독일군에 대한 선전 포고를 가속화 하였다.
conquest_event_desc_51=미국, 영국, 중국은 카이로 회의에서 일본이 무조건 항복할 때까지 세 나라가 일제히 대일 전투를 펼칠 것을 확인하는 성명을 발표했다.
conquest_event_desc_52=미국, 영국, 소련은 테헤란에서 정상회담을 열어 유럽 내 연합군의 대독일 전략 배치와 전후 국제 질서에 대해 논의했다.
conquest_event_desc_53=프랑스 노르망디 지역에서 시작된 연합군의 대규모 육해공 합동 상륙작전은 유럽 전선에서 연합군의 반격의 시작을 알렸다.
conquest_event_desc_54=몽고메리가 이끈 연합군 공수부대는 네덜란드에 주둔하고 있는 독일군을 공격했지만, 날씨, 정보 오류, 독일군의 맹렬한 저항 등으로 인해 작전은 기대했던 것만큼 성공적이지 못했다.
conquest_event_desc_55=미국은 거점 확보 전술을 이용하여 중요 전략 거점에 기지를 설치함으로써 일본 본토에 접근했다.
conquest_event_desc_56=미국과 일본의 해군은 필리핀 해역에서 격렬한 전투를 벌였는데, 일본군은 비행기의 수가 적고, 성능이 낙후하고, 엘리트 비행사의 수가 격감했기 때문에 비행기가 대량으로 격추되었다. 미군은 이번 전투를 '마리아나의 칠면조 사냥'이라고 불렀다.
conquest_event_desc_57=일부 독일 장군과 정치인들이 독일 원수 암살을 계획하고 폭발을 일으켰지만, 작전 목표를 달상하지 못했다.
conquest_event_desc_58=필리핀 레이테 만에서 미국-호주 연합군은 일본군과 격렬한 해전을 벌였다. 연합군은 이번 전투에서 일본 연합함대를 격파하였는데, 이번 전투로 인해 일본 해군은 쇠퇴기에 접어들었다.
conquest_event_desc_59=해협을 건너 런던을 폭격한 독일의 V-2 로켓은 세계 최초로 실전에 투입된 탄도 미사일로 실질적인 피해는 크지 않지만 영국 사회에 큰 충격을 안겨주었다.
conquest_event_desc_60=독일군은 영미 연합군의 전선을 돌파하기 위해 아르덴 지역에서 기습을 감행했다. 연합군은 처음에는 큰 피해를 입었지만, 최종 독일군의 공격을 성공적으로 막아냈다.
conquest_event_desc_61=불가리아는 초기에 추축국 진영에 합류했지만, 전황이 변화됨에 따라 연합국 편으로 돌아섬으로써 국가의 안전과 안정을 최대한 유지했다.
conquest_event_desc_62=소련군은 독일-헝가리 연합군이 지키는 부다페스트를 포위했으나 거센 저항에 부딪혔다.
conquest_event_desc_63=소련군은 비엔나로 진군하여 그곳에 주둔한 독일군과 치열한 전투를 벌였다. 이번 공세는 소련이 독일로 깊숙이 진격하는 계기가 되었습니다.
conquest_event_desc_64=미국, 소련, 영국은 얄타에서 3국 정상회의를 열어 제2차 세계대전 후 유럽 재건과 세계 구도 배치에 대해 논의했다.
conquest_event_desc_65=소련군은 독일의 수도  베를린에 대한 대규모 총공격을 개시했다.
conquest_event_desc_66=미국, 영국, 중국은 일본이 무조건 항복하지 않으면 즉시 '신속하고 완전한 파멸'에 직면할 것이라는 공동 성명을 발표했다.
conquest_event_desc_67=세계 최고의 과학자와 공학자들이 모여 세계 최초의 원자폭탄을 개발하기 위해 비밀리에 시작한 미국의 방대한 계획이며, 최종 알라모고드 사막에서 원자폭탄 폭발에 성공했다.
conquest_event_desc_68=미국은 히로시마와 나가사키에 잇따라 두 개의 원자폭탄을 투하하여 수십만 명의 사망자를 내어 일본으로 하여금 무조건 항복을 선언하게 했다.

event_stage_intro_20301=일본군의 무선통신 암호가 일부 해독되었다. 적들은 미드웨이 해역에 매복하여 아군의 주력 항공모함 부대를 섬멸하려 하고 있다. 현재 요크타운급 항공모함은 긴급 수리를 마쳤고 미드웨이의 공군 병력도 보충되었다. 모든 준비를 마쳤으니, 이제 연합 함대를 기다리기만 하면 된다.
event_stage_intro_20302=연합함대는 미드웨이 해전 이후 거의 전멸되었다. 적군은 솔로몬 제도 지역의 수비를 강화하기 위해 과달카날 섬과 툴라기 섬에 비행장을 건설하기 시작했다. 우리가 이 거점들을 탈취하면 반격의 요충지를 확보하고 주변 해역을 다시 장악할 수 있을 것이다.
event_stage_intro_20303=뉴기니의 일본군은 항공모함의 지원을 잃어 진격 속도가 느려졌다. 감시탑 작전 또한 성공적으로 적들이 솔로몬 제도로 군대를 파견하게 하였다. 드디어 반격의 시각이 왔다. 코코다 트랙을 시작으로 뉴기니에서 새로운 일본군의 육군 부대를 몰아내라.
event_stage_intro_20304=공격의 중심이 뉴기니에서 필리핀 제도로 바뀌었지만, 중태평양에 있는 일본군의 기지는 여전히 큰 위협이다. 마리아나 제도를 점령하여 필리핀 제도로 진격할 수 있는 지점을 확보하고, 향후 일본 본토 폭격을 준비해야 한다.
event_stage_intro_20305=일본군의 태평양 방위권은 차례로 무너졌고, 연합함대도 필리핀 해에서 참패했다. 서태평양 전체의 해공군 우세는 우리의 손에 있다. 지금이 바로 다시 필리핀으로 돌아갈 때이다!
event_stage_intro_20306=이오 섬에 있는 일본군의 저항이 아무리 완강하더라도 우리의 발걸음을 멈추게 할 수는 없을 것이다. 오키나와 섬은 상황이 더 복잡하고 수비군도 더 많을 것이다. 그러나 적군은 본토로부터 어떤 지원도 얻지 못할 것이다. 한 걸음씩 신중하게 전진하라.
event_stage_intro_20307=일본은 핵 공격을 받았음에도 불구하고 항복을 거부했다. 지휘부는 다운폴 작전을 실행하여 일본 본토에 상해 싸우기로 결정했다. 소련군은 우리와 협력하여 동시에 북쪽에서 공격을 개시할 것이다. 이것은 우리의 마지막 전투이며, 승리는 모든 연합군 전사들에게 있다!
event_stage_intro_20311=일본군의 무선통신 암호가 일부 해독되었다. 적들은 미드웨이 해역에 매복하여 아군의 주력 항공모함 부대를 섬멸하려 하고 있다. 현재 요크타운급 항공모함은 긴급 수리를 마쳤고 미드웨이의 공군 병력도 보충되었다. 모든 준비를 마쳤으니, 이제 연합 함대를 기다리기만 하면 된다.
event_stage_intro_20312=연합함대는 미드웨이 해전 이후 거의 전멸되었다. 적군은 솔로몬 제도 지역의 수비를 강화하기 위해 과달카날 섬과 툴라기 섬에 비행장을 건설하기 시작했다. 우리가 이 거점들을 탈취하면 반격의 요충지를 확보하고 주변 해역을 다시 장악할 수 있을 것이다.
event_stage_intro_20313=뉴기니의 일본군은 항공모함의 지원을 잃어 진격 속도가 느려졌다. 감시탑 작전 또한 성공적으로 적들이 솔로몬 제도로 군대를 파견하게 하였다. 드디어 반격의 시각이 왔다. 코코다 트랙을 시작으로 뉴기니에서 새로운 일본군의 육군 부대를 몰아내라.
event_stage_intro_20314=공격의 중심이 뉴기니에서 필리핀 제도로 바뀌었지만, 중태평양에 있는 일본군의 기지는 여전히 큰 위협이다. 마리아나 제도를 점령하여 필리핀 제도로 진격할 수 있는 지점을 확보하고, 향후 일본 본토 폭격을 준비해야 한다.
event_stage_intro_20315=일본군의 태평양 방위권은 차례로 무너졌고, 연합함대도 필리핀 해에서 참패했다. 서태평양 전체의 해공군 우세는 우리의 손에 있다. 지금이 바로 다시 필리핀으로 돌아갈 때이다!
event_stage_intro_20316=이오 섬에 있는 일본군의 저항이 아무리 완강하더라도 우리의 발걸음을 멈추게 할 수는 없을 것이다. 오키나와 섬은 상황이 더 복잡하고 수비군도 더 많을 것이다. 그러나 적군은 본토로부터 어떤 지원도 얻지 못할 것이다. 한 걸음씩 신중하게 전진하라.
event_stage_intro_20317=일본은 핵 공격을 받았음에도 불구하고 항복을 거부했다. 지휘부는 다운폴 작전을 실행하여 일본 본토에 상해 싸우기로 결정했다. 소련군은 우리와 협력하여 동시에 북쪽에서 공격을 개시할 것이다. 이것은 우리의 마지막 전투이며, 승리는 모든 연합군 전사들에게 있다!
event_stage_intro_20401=이탈리아를 전쟁에서 물러나게 하기 위해 지휘부는 우선적으로 지중해에서 추축국의 세력을 제거하기로 결정했다. 우리의 해군과 공군의 우세를 바탕으로 상륙 부대와 협력하여 시칠리아 섬을 점령하라.
event_stage_intro_20402=이탈리아 정부는 이미 우리와 비밀리에 항복과 관련된 문제를 논의했지만, 독일군은 도처의 이탈리아군을 장악하고 있다. 이번 항복의 계기를 잘 이용하여 이탈리아의 독일군을 단숨에 격파하라.
event_stage_intro_20403=기만 작전은 효과를 보았다. 노르망디의 독일군 방어 시설은 아직 완성되지 않았다. 우리는 곧 유럽에서 새로운 전장을 개척하여 전쟁의 형세를 완전히 바꿀 것이다.
event_stage_intro_20404=노르망디의 독일군은 섬멸되었고, 프랑스 내 적의 방어선은 점차 무너지고 있으며, 연합군의 주요 부대가 곧 프랑스에 집결할 것이다. 보급 문제를 해결하기 위해 지휘부는 프랑스 남부에 새로운 보급로를 개척하기로 결정했다.
event_stage_intro_20405=상륙 이후의 공격은 순조롭게 진행되었고, 지휘부는 독일군의 중심지로 진군할 수 있는 통로를 열기를 희망했다. 지상군은 공수 부대와 잘 협력하여 독일군의 천연 장벽인 라인강을 단숨에 돌파하라.
event_stage_intro_20406=독일군의 대규모 공격은 확실히 우리의 예상을 벗어났다. 하지만 악천후는 독일군의 진격 속도를 제한할 수 있다. 우리 부대는 이미 북쪽으로 진군하였으며, 전속력으로 전쟁터로 달려가고 있다. 수시로 이 돌출부를 해결할 준비를 해라.
event_stage_intro_20407=독일군의 정예부대는 거의 모두 섬멸되었지만, 그들은 베를린에 마지막 병력을 집결하여 필사적으로 싸우고 있다. 베를린을 소련군에게 남겨두고, 최대한 빨리 동쪽으로 진군하여 소련군과 합류한 후 도처의 독일군을 포위 섬멸하라. 베를린의 운명은 이미 정해져 있다.
event_stage_intro_20411=이탈리아를 전쟁에서 물러나게 하기 위해 지휘부는 우선적으로 지중해에서 추축국의 세력을 제거하기로 결정했다. 우리의 해군과 공군의 우세를 바탕으로 상륙 부대와 협력하여 시칠리아 섬을 점령하라.
event_stage_intro_20412=이탈리아 정부는 이미 우리와 비밀리에 항복과 관련된 문제를 논의했지만, 독일군은 도처의 이탈리아군을 장악하고 있다. 이번 항복의 계기를 잘 이용하여 이탈리아의 독일군을 단숨에 격파하라.
event_stage_intro_20413=기만 작전은 효과를 보았다. 노르망디의 독일군 방어 시설은 아직 완성되지 않았다. 우리는 곧 유럽에서 새로운 전장을 개척하여 전쟁의 형세를 완전히 바꿀 것이다.
event_stage_intro_20414=노르망디의 독일군은 섬멸되었고, 프랑스 내 적의 방어선은 점차 무너지고 있으며, 연합군의 주요 부대가 곧 프랑스에 집결할 것이다. 보급 문제를 해결하기 위해 지휘부는 프랑스 남부에 새로운 보급로를 개척하기로 결정했다.
event_stage_intro_20415=상륙 이후의 공격은 순조롭게 진행되었고, 지휘부는 독일군의 중심지로 진군할 수 있는 통로를 열기를 희망했다. 지상군은 공수 부대와 잘 협력하여 독일군의 천연 장벽인 라인강을 단숨에 돌파하라.
event_stage_intro_20416=독일군의 대규모 공격은 확실히 우리의 예상을 벗어났다. 하지만 악천후는 독일군의 진격 속도를 제한할 수 있다. 우리 부대는 이미 북쪽으로 진군하였으며, 전속력으로 전쟁터로 달려가고 있다. 수시로 이 돌출부를 해결할 준비를 해라.
event_stage_intro_20417=독일군의 정예부대는 거의 모두 섬멸되었지만, 그들은 베를린에 마지막 병력을 집결하여 필사적으로 싸우고 있다. 베를린을 소련군에게 남겨두고, 최대한 빨리 동쪽으로 진군하여 소련군과 합류한 후 도처의 독일군을 포위 섬멸하라. 베를린의 운명은 이미 정해져 있다.

