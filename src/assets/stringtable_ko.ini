event_intro_401=미드웨이 해전은 태평양 전쟁의 전환점이 된 전투이다. 1942년 6월 4일, 일본군과 미군은 미드웨이 북서쪽 해역에서 결전을 벌였다. 일본군의 무선 통신 암호가 해독되었기 때문에 미군은 신속하게 적은 대가로 일본군의 큰 손실을 입히힐 수 있는 반격 계획을 세울 수 있었다. 아카기호를 포함한 항공모함 4척이 침몰되면서 일본군은 태평양에서 전략적 우위를 잃었다.
event_intro_402=연합군은 1944년 6월 6일에 본격적으로 상륙작전을 개시했다. 각종 기만 작전, 군함 포격, 공군 폭격, 공수 작전의 협조 하에 거의 16만 명의 병사가 영국 해협을 건너 노르망디 지역의 5개 해안에 상륙했다. 이로부터 오버로드 작전이 본격적으로 개시되었고, 연합군 승리의 토대를 마련하였다.
event_intro_403=이탈리아는 1940년 6월 10일에 영국과 프랑스에 선전포고를 하고, 30만 군대를 동원하여 알프스와 니스 지역을 공격했다. 그러나 알프스와 마기노 방어선 남부에서 프랑스군의 완강한 저항을 받자 이탈리아군은 즉시 진격을 중단했다.
event_intro_404=1941년 6월 15일, 영국군은 투브루크에 대한 추축군의 포위를 해결하기 위해 또 다시 키레나이카에 대한 점령 작전을 조직했다. 영국군은 독일의 공군과 수송선을 제압하기 위해 대규모 공군을 배치하였으나, 독일군의 진지를 점령하는 데 실패했고, 오히려 기갑부대가 큰 손실을 입었으며, 독일군의 반격으로 포위되었다. 결국 힘든 철수 끝에 작전은 실패로 끝났다.
event_intro_405=1944년 6월 15일, 미군은 함포의 화력 엄호 아래 사이판 섬 상륙 작전을 개시했다. 섬에 있던 일본군은 항복을 거부하고 격렬하게 저항했으며 마지막 순간에는 자살 공격을 감행했다. 미군은 이번 승리에 값비싼 대가를 치렀다.
event_intro_406=이 전투는 바르바로사 작전 첫 단계에서 벌어진 대규모 포위전이다. 독일은 1941년 6월 22일에 공격을 개시하였는데, 중부 집단군은 비아위스토크 - 민스크 - 스몰렌스크 축선을 따라 모스크바 방향으로 진격했다. 독일군 기갑 부대의 빠른 진격으로 대량의 소련군이 포위되었으나, 포위된 소련군은 계속 저항하여 약 25만 명이 포위망을 뚫고 탈출했다.
event_intro_407=이 전투는 바그라티온 작전 첫 단계에서 벌어진 중요한 공세이다. 1944년 6월 25일, 소련군 발트해 제1 방면군과 벨라루스 제3 방면군은 독일군을 비쳅스크에 포위했다. 독일군의 방어선이 오래 버티지 못했고, 비쳅스크와 오르샤는 해방되었으며, 바그라티온 작전이 순조롭게 개시되었다.
event_intro_408=1942년 6월 28일, 소련군은 스탈린그라드에 증원하는 독일군을 요격하기 위해 예비대를 동원하여 보로네시를 증원했다. 양측은 보로네시에서 치열한 전투를 벌였다. 결국 독일군은 도시를 점령하고, 소련군은 더 많은 시간을 쟁취하여 스탈린그라드의 방어를 강화했다.
event_intro_409=제1차 엘 알라메인 전투는 1942년 7월 1일에 롬멜의 아프리카 군단이 선제공격을 했지만, 엘 알라메인 방어선을 돌파하지 못한 소모전이다. 그 후 영국군은 반격을 개시했고, 양측은 여러 지역에 대해 반복적으로 쟁탈전을 벌여 교착 상태에 빠졌다. 결국 독일군의 알렉산드리아 항구 점령 계획은 수포로 돌아갔다.
event_intro_410=1941년 7월 6일, 바르바로사 계획의 초기 대승으로 독일군은 동유럽 평원을 파죽지세로 쳐들어갔다. 소련군은 초기 패배를 겪은 후, 세묜 티모셴코를 임명하여 스몰렌스크에서 새로운 방어선을 조직하고, 지속적인 반격으로 독일군의 공세를 약화시켰지만, 독일군이 모스크바까지 진격하는 것을 막지 못하였다.
event_intro_411=1943년 7월 9일, 지중해 항로를 해방하고, 무솔리니의 실각을 촉진하고, 독일군의 동부 전선 병력을 견제하기 위해 미국과 영국 양국이 이끄는 연합군은 시칠리아에 상륙 작전을 개시했다. 각 방면의 충분한 준비로 이 전투는 소기의 목적을 모두 달성했다. 독일군은 철수에 성공했지만, 무솔리니의 실각을 막지 못했다.
event_intro_412=이 전투는 쿠르스크 전투에서 가장 참혹한 전투이다. 1943년 7월 12일에 소련군은 압도적인 병력 우위로 오룔의 독일군 돌출부를 공격을 개시했다. 독일군은 소련군에 포위될 위험에 직면하자 결국 돌출부를 포기했다. 소련군은 오룔을 탈환하고 전략적 우위를 되찾았다.
event_intro_413=이 전투는 바르바로사 작전 제3 단계의 포위전이다. 독일군 남방 집단군은 세 방향에서 우크라이나로 진군했고, 기갑 집단은 키예프 남쪽과 우만 북쪽으로 진군하여 1941년 7월 15일에 베르디치우를 점령했다. 소련군은 독일군의 공격 방향을 잘못 판단하고 철수할 기회를 놓쳐 대량의 병사가 포로로 잡혔다.
event_intro_414=노르망디 상륙 이후 연합군은 캉에서 독일군의 완강한 저항에 부딪혔다. 영국군과 캐나다군은 1944년 7월 18일에 굿우드 작전을 개시하여 캉 남부의 독일군 방어 진지를 공격했다. 그러나 독일군은 유리한 지형과 화력 우위로 연합군의 기갑 부대에 큰 타격을 입혔다. 엄청난 손실을 입은 후, 작전은 어쩔 수 없이 중단되었다.
event_intro_415=1942년 7월 21일, 산호해 전투의 패배에 이어, 일본군은 모르즈비를 점령하고 미국과 호주의 해상 및 공중 연계를 차단하는 전략적 목표를 달성하기 위해 육로로 모르즈비를 공격하기로 했다. 인원 수가 많고 훈련과 무기가 그들을 능가한 일본군에 직면한 호주군은 전투 초기에 어렵게 수비했다. 결국 유리한 지형과 미군의 원조로 일본군을 코코다에서 몰아내는 데 성공했다.
event_intro_416=연합군은 노르망디의 독일군 방어선을 돌파하기 위해 여러 차례 지원 작전을 실시하여 대부분의 독일군 기갑 예비대를 영국군과 캐나다군의 방어선으로 끌어들였다. 1944년 7월 25일, 연합군은 생로 근처에서 독일군을 향해  집중적으로 공격을 가했다. 병력과 장비 부족, 사기 저하 등 원인으로 독일군은 효과적인 반격을 조직하지 못했고, 노르망디 서부의 방어선은 완전히 무너졌다.
event_intro_417=연합군은 코브라 작전의 성공을 발판으로 1944년 7월 30일, 독일군이 출수하는 틈을 타 주동적으로 출격하여 블루코트 작전을 개시했다. 영국군은 전선 동쪽에 있는 독일군 기갑부대를 성공적으로 견제하고, 이후 독일군의 반격을 격파하고, 팔레즈에서 독일군을 포위하는 데 도움이 되었다.
event_intro_418=소련군은 1943년 8월 3일에 벨고로드, 하르키우 지역을 탈환하기 위한 독일 남부 집단군의 북쪽 측면을 공격했다. 독일군은 방대한 수의 소련군에 맞서 성공적으로 철수했고, 하르키우의 통제권은 다시 바뀌었다. 그들은 쿠르스크 전투의 패배로 소련-독일 전쟁의 전략적 주도권을 완전히 잃었다.

event_intro_419=태평양 전쟁에서 일본 제국에 대한 연합군의 첫 번째 대규모 지상 공세이다. 1942년 8월 7일, 연합군은 솔로몬 제도 남부의 과달카날, 툴라기, 플로리다에 상륙했다. 병력이 적은 일본 수비군은 연합군에게 압도되었고, 여러 차례 탈환을 시도했지만 결국 실패했다.
event_intro_420=캉을 탈취한 후, 독일군의 전선을 와해하고 퇴로를 차단하기 위해, 1944년 8월 8일 새벽, 캐나다군은 독일군의 방어선을 돌파하여 방어선 깊은 곳에 있는 중요한 진지를 점령하였고, 결국 팔레즈에서 북쪽으로 7마일 떨어진 지점에서 멈추었다.
event_intro_421=팔레즈 전투는 제2차 세계 대전에서 노르망디 전투의 결정적인 전투였다. 1944년 8월 12일부터 21일까지 연합군은 포위전을 통해 센 강 서쪽 B군단의 대부분 병력을 포위하여 5만 명 이상을 포로로 잡아 파리 및 프랑스-독일 국경으로 통하는 길을 열었다.
event_intro_422=1944년 8월 15일, 노르망디 상륙 이후 연합군의 보급 문제를 해결하기 위해 연합군은 프랑스 남부 항구를 확보하기 위해 용기병 작전을 다시 가동하기로 결정했다. 이번 작전에서 연합군은 불과 4주 만에 프랑스 남부의 대부분을 해방시켰고, 독일군에게 큰 사상자를 입혔으며, G집단군은 푸르주 산맥 일선으로 물러났다.
event_intro_423=1942년 8월 19일, 연합군은 상륙 가능성을 시험하고 정보를 수집하기 위해 시험적으로 상륙 작전을 실시했지만, 독일군의 강력한 저항에 부딪혀 상륙부대의 사상자 비율은 68%에 달했고 단 한 부대만이 소량의 군사 정보를 수집했다. 이번 작전은 후에 재앙적인 상륙작전으로 간주되었지만, 전투 결과는 양측 모두에게 교훈을 주었고, 이후의 노르망디 상륙작전에 큰 영향을 미쳤다.
event_intro_424=키예프 전투는 제2차 세계 대전 때 벌어진 대규모 포위전이다. 1941년 8월 23일부터 9월 26일까지 독일군은 중앙집단군과 남방집단군의 병력을 집중시켜 키예프를 둘러싸고 역사상 가장 많은 인원을 포위한 포위권을 완성했다. 전후 통계에 따르면, 독일군은 10만 명의 손실로 소련군 70만 명을 섬멸하였는데, 이는 '독일군 동부 전선의 가장 큰 승리이자 붉은 군대의 가장 큰 군사적 재앙'으로 평가받았다.
event_intro_425=발트해 함대의 주요 기지였던 탈린은 소련 지휘부의 판단 착오로 인해 바르바로사 작전 초기에 바로 함락되었다. 1941년 8월 27일, 탈린의 나머지 수비군은 어쩔 수 없이 포화 속에서 배를 타고 레닌그라드로 철수해야 했다. 소련군의 철수를 막기 위해 독일과 핀란드는 함대, 기뢰, 공군 등을 동원해 핀란드 만을 봉쇄하여 50여 척의 함정이 파손되고 1만 명 이상의 사상자가 발생했지만, 결국 발트해 함대의 대부분의 함정은 크론슈타트에 도착하여 레닌그라드 방어에 참가했다.
event_intro_426=이 전투는 북아프리카 전장에서 추축군이 개시한 마지막 대규모 공세이다. 1942년 8월 30일, 롬멜은 보급 부족으로 인해 승리에 대한 마지막 희망을 잃지 않기 위해 알람 엘 할파 고지에 있는 제8군단을 공격하기 시작했다. 그러나 영국군은 이번 작전 계획을 미리 장악했고, 몽고메리는 이를 이용해 전문적인 전술 배치를 하여 롬멜의 마지막 희망을 물거품으로 만들었다. 이번 전투 이후 추축국의 아프리카 부대는 주도권을 잃었고, 아프리카에서의 전략적 목표를 달성할 수 없게 되었다.
event_intro_427=이 전투는 제2차 세계 대전의 시작을 상징한다. 1939년 9월 1일, 소련과 독일이 비밀리에 <독일-소련 불가침 조약>을 체결한 후, 독일군은 공공연하게 폴란드를 침공하여 폴란드군을 신속히 격파했다. 16일 후, 소련도 독일군에 호응하여 폴란드 동부를 점령했다. 장비와 군사력의 큰 열세로 인해 폴란드는 결국 소련과 독일에 의해 빠르게 분할되었고 정부는 망명길에 올랐다.
event_intro_428=1943년 9월 3일, 시칠리아 상륙전에서 승리한 후, 연합군은 계속해서 이탈리아 본토를 공격했다. 연합군은 독일군이 타란토 남쪽에 중점적으로 방어를 배치할 것으로 예상하여 타란토 남쪽에 대해 거짓 공격을 하고 주력은 나폴리를 점령하기 위해 살레르노에 상륙하기로 계획했다. 그러나 독일군은 나폴리가 더 중요하다고 판단하여 연합군의 상륙을 어렵게 만들었다. 결국 연합군은 살레르노를 포함한 이탈리아 남부를 장악하는 데 성공했지만 나폴리는 점령하지 못했다.
event_intro_429=이 전투는 서부 사막 전투의 시작이다. 이탈리아는 수에즈 운하를 탈취하기 위해 해안선을 따라 이집트를 침공할 계획이었으나, 여러 차례 지연 끝에 공세는 시디바라니까지 진격하는 것으로 공격 범위를 좁혔다. 1940년 9월 9일, 이탈리아군은 공격을 시작하여 일주일 내에 목표 지점까지 도착하고, 그곳에 주준하여 다음 공격을 위한 보급품을 축적했다.
event_intro_430=1944년 9월 14일, 연합군은 에스토니아, 라트비아, 리투아니아를 해방하기 위해 발트해 지역에서 리가, 탈린 등 전투를 포함한 네 차례의 대규모 전략 공세를 펼쳤다. 이 지역의 독일군은 공세에 완강하게 저항했지만, 막대한 손실을 입었고 결국 쿠를란트에 포위되었다.
event_intro_431=1944년 9월 17일, 지크프리트선을 우회하여 루르 지방 공업단지를 침공하기 위해 연합군은 네덜란드에 대량의 공수부대를 투입하여 영국군의 지상 추진을 지원함으로써 에인트호벤에서 아른헴으로 가는 다리를 점령하고 후속 작전을 위한 길을 열려고 했다. 그러나 지나치게 급진적인 계획과 부대 간의 협력 문제로 인해 연합군은 70마일을 진격했지만 아른험을 탈취하지 못했다.
event_intro_432=휘르트겐 숲 전투는 미군 역사상 가장 오래 지속된 전투로 1944년 9월 19일부터 이듬해 2월 10일까지 지속되었다. 미군은 독일군이 아헨 전투를 지원하는 것을 막기 위해 휘르트겐 숲을 향해 공격했다. 그러나 독일군은 루르 댐을 지키기 위해 연합군의 진격을 성곡적으로 늦추면서 큰 손상을 입혔다. 이번 전투에서 미군은 최소 33,000명, 독일군은 28,000명을 잃어 연합군의 '중대한 패배'로 표현될 정도로 막대한 대가를 치렀다.
event_intro_433=다카르 전투는 연합군이 1940년 9월 23일부터 25일까지 프랑스령 서아프리카의 전략적 항구 다카르를 탈취하려다 실패한 전투이다. 드골 장군은 다카르의 비시 프랑스군을 설득하여 입장을 바꾸게 할 수 있다고 믿었지만, 결국 다카르 총독은 단호히 반대하여 전투가 발발했다. 연합군은 여러 차례 공격했지만 결국 승리를 거두지 못하고 철수했다.
event_intro_434=메스 전투는 제2차 세계 대전 때 메스 주변에서 독일군 제1집단군과 미군 제3집단군이 치열하게 싸운 전투를 말한다. 독일군은 일련의 요새에 의존하여 단호하게 저항하였으며, 미군을 참혹한 진지 쟁탈전으로 끌어들였다. 미군은 1944년 8월 27일부터 12월 13일까지 지속된 전투끝에 메스 지역의 독일군을 격파했다.
event_intro_435=1941년 9월 30일에 시작된 브랸스크 전투는 독일군의 바르바로사 계획에서 매우 중요한 작전으로 소련 붉은 군대의 브랴스크 방면을 포위 및 격파하여 모스크바를 공격할 수 있는 길을 확보하기 위한 작전이었다. 독일군은 전술적 승리를 거두었지만, 소련군은 완강한 저항을 통해 독일군의 공격을 지연시키는 데 성공하여 모스크바 방어를 위해 시간을 쟁취했다.
event_intro_436=1944년 10월 2일, 앤트워프 항구를 가동하고 연합군의 보급을 보장하기 위해 연합군은 셸드 강 하구를 장악하고 있던 독일군 제15집단군을 제거하는 일련의 군사 작전을 전개했다. 그러나 연합군은 다른 작전에 집중하고 있었기 때문에 이 지역의 독일군은 지원을 받았다. 결국 캐나다 제1군단은 20,873명의 연합군 병사가 희생한 대가로 셸드 강의 적군을 제거했다.


dialogue_2712=적을 섬멸하라. 우리의 목표는 모스크바이다!
dialogue_2713=동지들이여, 모스크바가 바로 우리 뒤에 있다. 반드시 모든 적을 몰아내야 한다!
dialogue_2714=지휘관 각하, 소련군은 리피엘 근처에 대량의 부대를 집결시켰고, 곧 우리 군의 대전차 방어 시스템에 진입하려 합니다.
dialogue_2715=리피엘 반격은 실패했지만, 우리는 여전히 끝까지 싸울 것이다!
dialogue_2716=비쳅스크가 점령되었다. 제3기갑집단군은 우리와 협력하여 스몰렌스크를 포위할 수 있다.
dialogue_2717=마힐료프 방어선이 뚫렸다. 스몰렌스크를 돌격할 준비를 하라!
dialogue_2718=대승을 축하합니다! 지휘관 각하, 스몰렌스크를 포위하기 위해 제3기갑집단군의 협조를 요청합니다.
dialogue_2719=병사들이여, 쾌속 행군하여 코코다를 점령하라!
dialogue_2720=병사들이여, 모르즈비항의 안전을 위하여 코코다를 지켜라! 보급품이 계속 후방에서 공중 투하될 것이다!
dialogue_2721=주변 지역을 통제하고 모르즈비항으로 향하는 길을 열어라.
dialogue_2722=더 강력한 지원이 곧 도착할 것이다. 코코다를 탈환하라!
dialogue_2723=원군이 도착했다! 병사들이여, 싸워라! 점점 더 많은 지원이 도착할 것이다!
dialogue_2724=계획에 따라 우리 군과 영국군은 각각 리카타와 시러큐스 근처에서 상륙하여 남부 공항을 장악했다. 남쪽에서 북쪽으로 차례로 진격하면 우리는 반드시 승리할 것이다!
dialogue_2725=병사들이여! 강풍은 상륙에 불리하지만, 적군은 우리의 공격을 예상할 수 없을 것이다. 왕과 조국을 위하여!
dialogue_2726=전선이 붕괴되었다. 우리는 실력을 보존하기 위해 메시나에서 철수할 준비를 해야 한다.
dialogue_2727=남부 해안이 정리되었다. 해안선으로부터 보급품이 송달되었다.
dialogue_2728=지휘관 각하, 이번 전투에서 아군은 점령지역으로부터 보급품을 얻기 어려우니 가능한 한 빨리 리카타를 점령하여 지원을 받으십시오.
dialogue_2729=지휘관 각하, 추축군의 퇴로를 차단하기 위해 가능한 한 빨리 메시나를 공격할 것을 제안합니다.
dialogue_2730=병사들이여, 우리 장비가 갱신되었고, 적의 공군과 수송선은 우리 공군에 의해 제압되었으니, 이번 전투는 반드시 승리할 것이다!
dialogue_2731=아군의 물자가 부족하기에 단숨에 적을 섬멸할 수 있도록 전투기를 기다려야 한다.
dialogue_2732=기회가 왔다! 적의 좌측을 돌격하고 포위할 준비를 하라.
dialogue_2733=계속 돌격하고, 전과를 늘려 투브루크의 포위를 해결하라!
dialogue_2734=병사들이여, 신속히 돌진하여 비아위스토크 북쪽과 남쪽의 소련군을 섬멸하고 포위망을 형성하라!
dialogue_2735=동지들이여, 독일군은 염치없이 우리 나라를 침공했다. 고향을 위하여, 소비에트를 위하여 그들을 몰아내라!
dialogue_2736=바라나비치를 계속 돌파하고 민스크를 포위할 준비를 하라. 그들이 방어를 재조직하기 전에 서둘러야 한다!
dialogue_2737=동지들이여, 방어선을 수축하라! 민스크를 중심으로 전선을 재배치하라.
dialogue_2738=최고통수부는 남서방면군에게 "안전을 확보하는 동시에 독일군의 공세를 전력으로 해소하고, 드네프르 강 방어선을 지켜야 한다."는 명령을 전달했다.
dialogue_2739=소련군의 병력이 우군보다 많다. 먼저 적 부대를 섬멸하고, 다시 방어선을 돌파하라!
dialogue_2740=최고통수부는 남서방면군에게 "전선을 수축하고, 포위를 피하고, 드네프르 강 방어선을 지켜야 한다."는 명령을 전달했다.
dialogue_2741=적군은 포위권에서 빠져나가고 있다. 빨리 이동하여 적을 섬멸하라!
dialogue_2742=최고통수부의 명령에 따라 하르키우를 해방시키고, 제4기갑집단군과 켐프집단군을 섬멸했다.
dialogue_2743=경각성을 높이고, 힘을 비축하라. 다음 공격을 준비하여 소련군을 완전히 섬멸시켜라.
dialogue_2744=보호두히우를 공격하고, 하르키우를 포위하라!
dialogue_2745=젠장! 소련군의 병력을 잘못 판단했다. 하르키우의 수비군은 즉시 드네프르 강 방어선으로 철수하라.
dialogue_2746=프랑스군의 주력은 독일군 기갑 부대의 진격에 밀려 대량의 예비대가 북부로 이동되었다. 지금이 본격적인 공격을 시작하기에 적합한 시기이다.
dialogue_2747=해안선을 따라 계속 진격하여 니스 방향으로 공격하라.
dialogue_2748=일본군은 이길 가능성이 전혀 없지만, 항복하지 않을 것이다. 섬 전체를 점령하기 전까지 절대 경계를 늦추어서는 안 된다.
dialogue_2749=독일군의 공세는 완전히 실패했다. 해방이 곧 다가올 것이다.
dialogue_2750=돌출부의 독일군을 포위하고 비쳅스크와 오르샤를 해방시켜라.
dialogue_2751=독일군의 방어선이 점차 무너지고 있다. 우리는 곧 민스크로 향하는 길을 열어놓을 것이다.
dialogue_2752=너무 오래 머물지 말고 신속히 소련군의 방어선을 뚫은 후, 스탈린그라드 방향으로 진격하라.
dialogue_2753=독일군이 쉽게 방어 구역을 통과하지 못하도록 막아라.
dialogue_2754=소련군은 무너지고 있다. 적의 방어선을 돌파하기 위해 병력을 집중시켜라.
dialogue_2755=영국군은 엘 알라만 일대에 방어선을 구축했다. 알렉산드리아 항구로 향하는 공격 경로가 봉쇄되었다.
dialogue_2756=우리는 보급에 우세를 가지고 있다. 독일군의 공격을 견제하고 수시로 반격할 준비를 하라.
dialogue_2757=부대의 진격이 막혔다. 우리는 소모전에 빠졌다.
dialogue_2758=독일군은 우리의 공격을 예측했지만, 그들에게 전혀 도움이 되지 않았다.
dialogue_2759=우리의 수량적 우위를 이용하여 조수와 같은 공격으로 적의 방어선을 무너뜨려라.
dialogue_2760=소련군은 우리에게 총공격을 개시했다. 방어선이 뚫리면 오룔의 부대는 수시로 포위될 수 있다!
dialogue_2761=적의 수가 너무 많다. 브랸스크 방향으로 철수하라.
dialogue_2762=캉 남부의 독일군 진지는 아군 진격의 가장 큰 장애물이다. 이처럼 집중적인 공습으로 적군은 효과적인 반격을 조직하기 어려울 것이다.
dialogue_2763=캉 남부의 각 적군 진지를 향해 전체 공격하라!
dialogue_2764=연합군의 기갑 부대를 두려워하지 마라. 적의 탱크는 우리의 상대가 아니다. 신속하게 방어를 준비하라.
dialogue_2765=독일군의 방어력은 견제되고 약화되었다. 적군 진지의 돌파구를 찾고, 집중적으로 공격하여 전체 방어선을 무너뜨려라.
dialogue_2766=파견할 수 있는 예비대가 얼마 남지 않았다. 우리는 기존의 병력으로 연합군의 기갑 부대를 막아야 한다.
dialogue_2767=독일군의 주력이 무너지고 있다. 얼마 지나지 않아 우리는 노르망디 전역을 해방하고 독일 국경으로 진격할 수 있을 것이다.
dialogue_2768=미군은 코브라 작전을 개시했다. 우리의 임무는 미군과 협력하여 남쪽으로 진격하고 전선 동쪽의 독일군을 견제하는 것이다.
dialogue_2769=지뢰와 방어 시설을 충분히 이용하여 연합군의 공격을 막아라.

