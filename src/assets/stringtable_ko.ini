elite_intro_96=레오파드 2 주력전차는 독일이 개발한 3세대 주력전차로, 균형 잡힌 성능과 높은 신뢰성, 그리고 폭넓은 운용 범위로 널리 알려졌다. 이 전차의 상징인 120mm 활강포는 매우 빠른 포구 초속과 정밀한 명중률을 자랑하며, 다양한 고성능 철갑탄을 통해 원거리 표적에 대해서도 강력한 파괴력을 발휘할 수 있다. 또한 강력한 동력계는 레오파드 2에 탁월한 기동성을 부여하여 험지에서도 놀라운 속도와 민첩성을 유지하게 하여 현대 주력전차 중 독보적인 종합 전투 능력을 보여줍니다.

