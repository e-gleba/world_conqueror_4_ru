countrytech_desc_221=경전차와 중형전차를 수송기로 수송 가능.
countrytech_desc_222=장갑 이동력 +4.
countrytech_desc_223=엘리트 장갑 유닛이 공격 시 대상 주변 1칸 내 적군에게 추가로 20% 피해 입힘.
countrytech_desc_224=엘리트 장갑 유닛이 바다에 진입 시 공격력, 방어력, 이동력 등이 변하지 않으며, 바다 진입 시 이동력에 미치는 영향 무시.
countrytech_desc_316=로켓포가 부차적 대상에 대한 데미지 +30%.
countrytech_desc_317=화포 이동력 +3.
countrytech_desc_318=엘리트 유탄포 공격 시 대상 주변 1칸 내의 적군에게 추가로 30% 피해 입힘.
countrytech_desc_319=화포 HP +20%.
countrytech_desc_320=화포 공격 시 사거리가 1칸 증가할 때마다 데미지 +20%.
