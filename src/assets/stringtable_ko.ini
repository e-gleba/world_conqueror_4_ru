army_buff_desc_1664=클러스터 미사일: 대상 주변의 일부 유닛에게 50%의 추가 피해를 입힙니다.


dialogue_4366=독일군은 이미 성문 앞까지 다가왔지만, 그들이 마주한 것은 결코 빈 성이 아니다. 그들은 속도로 전쟁을 끝내려 하지만, 우리는 불굴의 의지로 그들을 지치게 만들 것이다.
dialogue_4367=붉은 광장의 장병들이여, 적에게 분명히 알려라. 그들이 한 걸음 전진할 때마다 반드시 피의 대가를 치르게 될 것이라는 사실을!
dialogue_4368=적군이 남북 양익에서 포위망을 형성하고 있다. 적의 의도가 성공하면 우리 방어선은 절단될 것이다. 반드시 진지를 사수하고 적들을 각개격파하여 포위를 저지하라!
dialogue_4369=마지막 외곽 방어선이 뚫렸다. 이제 크렘린 궁 지붕 위의 붉은 별이 내 눈앞에 보인다.
dialogue_4370=그 무엇도 강철의 물결을 막을 수는 없다. 도로는 짓밟힐 것이고 방어선은 찢겨 나갈 것이다. 어떠한 저항도 결과를 바꿀 수는 없다.
dialogue_4371=주코프 장군이 전선에 도착했다! 전선의 모든 부대는 진지를 굳게 사수하고, 적을 공격 속에서 끊임없이 소모시켜라. 시간은 우리 편이다.
dialogue_4372=전술적인 관점에서 보면 전황은 우리에게 유리하게 흘러가고 있는 것 같다. 모스크바는 바로 눈앞에 있다.
dialogue_4373=하지만 현실적인 관점에서 보면 기갑 부대의 소모가 심각하며, 기온이 계속 떨어지면서 차량 시동과 정비 시간이 대폭 늘어났고, 연료와 탄약 보급 또한 계획대로 이루어지지 않고 있다.
dialogue_4374=보급 없는 기동이란 없으며, 기동 없는 기갑 부대는 존재 의미를 상실하게 된다.
dialogue_4375=만슈타인 장군과 룬트슈테트 장군이 지원을 위해 모스크바로 향하고 있다. 전선 부대는 반드시 진지를 유지하고 태세를 안정시켜라. 단 한 발짝도 물러서지 마라!
dialogue_4376=정보에 따르면 일본은 당분간 소련을 공격하지 않을 것이다. 극동의 증원 부대가 곧 전장에 도착할 것이다!
dialogue_4377=현재 상황이 우리에게 불리하다는 점은 인정해야 한다. 하지만 모스크바는 여전히 유일하고 결정적인 전략 목표다. 성공 확률이 낮아지더라도 이를 대체할 작전 방향은 없다.
dialogue_4378=어떤 대가를 치르더라도 모스크바 진격을 계속하라!
dialogue_4379=나폴레옹의 교훈을 그들은 잊었을까? 아니다. 그들은 분명 기억하고 있다. 연구했고, 분석했고, 어쩌면 과거의 실패를 비웃었을지도 모른다.
dialogue_4380=다만 그들 역시 나폴레옹처럼, 자신만은 예외가 될 것이라 믿었을 뿐이다.
dialogue_4381=적군은 어쩔 수 없이 후퇴했지만, 주력은 여전히 온존하다. 그러나 이것만으로도 독일군이 결코 불패의 군대가 아님을 증명하기엔 충분하다. ‘전격전’의 신화는 이로써 그 종지부를 찍었다.

