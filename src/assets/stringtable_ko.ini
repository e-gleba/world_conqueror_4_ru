skill_info_156=장갑 부대 지휘 시 사기가 떨어지지 않으며, 데미지 +[#00FF00#%d%%]. 장갑 부대로 적군 섬멸 시 '영웅' 상태를 획득하여 크리티컬 공격 확률 10%% 증가, 지속 시간 1턴.
skill_info_157=장갑 부대 지휘 시 도시 주둔군 외의 비건물 유닛에 대한 데미지 +20%%. 공격 후, 공격 및 이동이 불가능할 경우 [#00FF00#%d%%]의 확률로 재공격 (1턴에 1회 한정),  이번 턴에 적을 전멸시킬 때마다 효과를 ‘다시 이동’으로 전환할 확률이 20%%씩 증가함(최고 100%%).
skill_info_158=육상 부대 지휘 시 공격 후, [#00FF00#%d%%]의 확률로 자신과 주변 1칸 내 아군에게 1턴간 지속되는 '협동' 상태를 부여. '협동' 상태에 처한 부대는 데미지 +15%%, 또한 디버프 상태(사기 하락으로 인한 효과 제외)가 발생할 경우 해당 디버프를 무효화하고, '협동' 상태가 해제됨.
skill_info_159=자신 영토 내에 있을 때 공격력 +15, 크리티컬 공격 받을 확률 [#00FF00#%d%%] 감소.


