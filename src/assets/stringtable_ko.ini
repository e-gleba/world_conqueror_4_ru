skill_name_171=낫질 작전
skill_name_172=전쟁 동원
skill_name_173=마셜 플랜
skill_name_174=에이스 잠수함
skill_name_175=심층 잠항 회피

skill_info_170=기갑 부대 지휘 시 부대 데미지 [#00FF00#%d%%] 증가, 공격 후 피해량의 10%% 만큼 HP 회복. 버프 상태일 때 치명타 확률 10%% 증가, 적군 방어력 30%% 무시. 부대 지휘 시 이동 중 적군 부대의 저지 무시. 공격 후 목표가 섬멸되지 않았을 경우, 추가 공격이 가능합니다(턴당 1회).
skill_info_171=기갑 부대 지휘 시 사기 저하되지 않음, 공격 시 적군 [#00FF00#%d%%] 확률로 반격할 수 없음. 적 섬멸 후, 1턴 동안 '수확'(효과: 데미지 20%% 증가, 회피 무시) 버프 획득. 기갑 부대 지휘 시 공격력 30마다 치명타 데미지 5%% 증가, 공격력이 180 이상일 경우 자체 사거리 +1.
skill_info_172=보병 부대 지휘 시 [#00FF00#%d%%] 확률로 치명타 발동, 매 턴 최대 HP의 15%% 회복. 보병 지휘 시 자신 및 주변 2칸 내 보병 데미지 30%% 증가, 받는 피해 25%% 감소. (해당 스킬 보유 시 보병 지휘관 효과 무효)
skill_info_173=육군 부대를 지휘할 때, 해당 턴에 이미 소모한 자금의 [#00FF00#%d%%]를 다음 턴에 획득함(최대 1200). 육군 부대를 지휘할 때, 지휘 부대 주변 3칸 내의 적이 섬멸되면 공업 40과 과학기술 4 획득.(턴당 최대 3회 발동)
skill_info_174=잠수함 (핵잠수함 제외) 지휘 시 적군 방어력 무시, 공격 시 사정거리가 1 증가합니다. 잠수함 지휘 시 적군 섬멸 후 [#00FF00#%d%%] 확률로 재공격 가능, 치명타 발동 시 추가로 25%% 확률 증가.
skill_info_175=잠수함 지휘 시 받는 피해 [#00FF00#%d%%] 감소, 공군 및 미사일 공격 받을 시 50%% 확률로 회피. 잠수함 부대 지휘 시 매 턴 최대 HP의 5%% 회복.

army_buff_desc_1631=수확: 데미지 20% 증가, 회피 무시.



