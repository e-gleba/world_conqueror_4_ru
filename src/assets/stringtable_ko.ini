conquest_event_desc_69=제2차 세계 대전이 끝난 후, 소련은 합의대로 점령한 이란 북부 지역에서 철수하지 않았다. 국제 사회의 외교적 압력과 협상 끝에 소련은 철수하여 이란의 영토 보전을 보장했다. 이 위기는 중동 지역에서 미국과 소련의 대결이 시작되었음을 상징한다.
conquest_event_desc_70=추축군의 철수로 인해 그리스 국내에는 권력 공백기가 나타났다. 이 기간에 그리스 정부군과 민주 세력 사이에 내전이 발발하여 그리스 사회의 심각한 분열과 수많은 민간인 사상자가 발생했다. 이번 내전으로 인해 그리스는 전쟁이 끝난 후 서방 진영에 합류하여 나토 회원국이 되도록 추진했다.
conquest_event_desc_71=영국 해군 구축함 두 척이 케르키라 해협에서 부주의로 기뢰를 건드려 수십 명의 사상자가 발생했다. 그 후 영국은 이 해협으로 군함을 파견하여 지뢰 제거 임무를 수행했는데, 이러한 움직임은 알바니아의 강력한 항의를 받았다.
conquest_event_desc_72=1952년, 이집트 자유 장교 단체는 이집트 국왕의 군주제를 전복하고 공화국을 수립했다. 이 사건은 오랜 군주 통치를 끝내고 이집트 현대화의 시작을 의미한다.
conquest_event_desc_73=쿠바 국내의 혁명 운동은 독재 정권을 전복하고 사회주의 국가를 수립하는 데 성공했다. 이 혁명으로 쿠바는 냉전 시기 세계 정치의 중요한 초점 중 하나가 되었다.
conquest_event_desc_74=1956년, 헝가리에서 소련과 자국 정권에 반대하는 대규모 봉기가 일어났으나 결국 군대에 의해 진압되어 결국 실패로 돌아갔다.
conquest_event_desc_75=영국과 프랑스를 비롯한 연합군은 수에즈 운하의 통제권을 되찾기 위해 이집트에 대한 군사 공격을 개시했다. 처음에는 작전이 순조롭게 진행되었으나, 미국과 소련의 강력한 반대와 외교적 압력으로 인해 영국과 프랑스는 결국 철수해야만 했다. 이번 전쟁은 영국과 프랑스가 세계 주도력으로서의 종말을 상징한다.
conquest_event_desc_76=포르투갈의 젊은 군 장교 단체가 군사 쿠데타를 일으켜 포르투갈의 오랜 독재 정권을 전복시켰다. 혁명이 성공하자 포르투갈은 빠르게 민주주의쪽으로 돌아섰고, 아프리카와 아시아의 식민지를 포기하면서 수세기에 걸친 포르투갈의 식민 통치를 종식시켰다.
conquest_event_desc_77=1961년, 미국의 지원을 받은 쿠바 망명자들이 쿠바에 대한 침공 작전을 벌였으나, 쿠바 남부의 피그스 만에 상륙한 침략자들은 빠르게 쿠바군에게 격파당했다. 이 사건은 미국과 쿠바의 관계를 진일보 악화 시켰으며, 쿠바 지도자의 지배적 지위를 공고히 했다.
conquest_event_desc_78=미국이 이탈리아와 터키에 탄도 미사일을 배치하려는 조치에 대응하여 소련은 쿠바에 비슷한 탄도 미사일을 배치하였다. 이는 미국과 소련 사이의 관계를 핵전쟁 발발 직전까지 갈 정도로 악화 시켰다.
conquest_event_desc_79=소련은 아프가니스탄에 군대를 파견하여 현지의 반정부 세력을 진압했다. 이 침공은 수많은 사상자와 난민을 발생시키고, 아프가니스탄에 큰 피해를 입혔다. 그 결과 소련은 국제사회의 강력한 비난을 받았다.
conquest_event_desc_80=1965년, 미국은 도미니카공화국이 제2의 쿠바가 될 것을 우려하여 미국 시민을 보호한다는 명목으로 도미니카공화국에 군대를 파견했다. 이 움직임은 국제 여론의 강력한 비난을 불러일으켰고, 심지어 나토의 일부 국가도 공개적으로 반대의사를 표명했습니다.
conquest_event_desc_81=이스라엘은 이집트, 시리아, 요르단 등 아랍 국가들에게 선제 공격을 가해 중동 지역의 지정학적 구도를 크게 변화시켰다. 이 전쟁의 결과로 아랍과 이스라엘의 분쟁이 장기화되고 중동 지역의 불안정성이 지속되었다.
conquest_event_desc_82=영유권 분쟁으로 아르헨티나가 포클랜드 제도를 점령하자 영국은 즉시 함대를 파견하여 반격에 나섰다. 이 전쟁으로 양측은 수백 명이 목숨을 잃었고 정치, 문화, 경제, 스포츠 등 방면에서 양국의 적대적 관계가 더 심하되었다.
conquest_event_desc_83=1972년, 미국 당국 관계자들이 워터게이트 빌딩에 도청 장치를 설치하다가 체포되었다. 수사가 깊어짐에 따라 정부의 많은 불법 및 은폐 행위가 들어났고, 결국 미국 역사상 처음으로 스캔들로 인해 대통령이 사임하는 사태로 이어졌다.
conquest_event_desc_84=공식명칭은 유럽 부흥 계획으로, 제2차 세계 대전 이후 미국이 전쟁으로 파괴된 서유럽 각국에 경제 원조를 제공하여 재건을 돕는 역사적 계획이다. 이 계획은 유럽 국가의 발전과 세계 경제 구도에 심대한 영향을 미쳤다.
conquest_event_desc_85=미국과 소련 사이의 전략적 대결에서 양측은 핵무기와 미사일 기술에서 상대적 우위를 유지하지 위해 대규모 군비 경쟁을 벌였다. 양측은 대규모 핵무기 보유에 의존하여 서로의 군사 행동을 억제했다.
conquest_event_desc_86=소련의 첨단 방공 시스템의 위협에 대응하기 위해, 미국은 세계 최초로 양산형 스텔스 전투기인 F-117 '나이트호크' 전투기를 성공적으로 개발했다.
conquest_event_desc_87=소련은 세계 최초의 대륙간탄도미사일을 성공적으로 발사했는데, 이번 발사는 인류 역사상 처음으로 인공 물체를 우주로 보내는 데 성공한 사례가 되었다. 대륙간탄도미사일의 등장은 냉전 시대의 군사 전략 구도를 완전히 바꾸었다.
conquest_event_desc_88=제2차 세계 대전 이후 미국의 지원을 받은 남베트남은 북베트남과 끊임없이 충돌하다가 결국 장기간의 대규모 게릴라전으로 발전했다. 이 전쟁은 또한 미국 내에서 강렬한 사회 분열과 반전 운동을 야기했다.
conquest_event_desc_89=1970년에 중국은 첫 인공위성을 성공적으로 발사하였는데, 이는 중국이 당시 국방 과학 기술 분야에서 중대한 성과를 거두었음을 상징한다. 동시에 중국은 세계에서 독립적으로 인공위성을 발사할 수 있는 다섯 번째 국가가 되었다.
conquest_event_desc_90=중국은 1964년에 독자적으로 개발한 최초의 원자폭탄인 '치우샤오제'를 성공적으로 폭발시켰다. 이 성과로 중국은 세계에서 다섯 번째로 핵무기를 보유한 국가가 되었으며, 국제 정치 및 안보 분야에서 중국의 위상에 심대한 영향을 미쳤다.
conquest_event_desc_91=1967년, 중국 최초의 수소폭탄이 성공적으로 폭발했다. 이는 최초의 원자폭탄 성공에 이어 국방 연구 분야에서 중국의 또 다른 도약이다. 원자폭탄 제작에서 수소폭탄 제작까지, 중국은 불과 2년 8개월밖에 걸리지 않아 핵무기 개발 역사상 기적을 창조했다.
conquest_event_desc_92=1984년, 로스앤젤레스는 민간 주도로 올림픽을 개최함으로써 이전 올림픽의 막대한 적자를 반전시켰다. 투자에서 성공을 거둔 이번 올림픽은 향후 올림픽의 모범이 되었다. 중국은 이번 올림픽에서 첫 금메달을 획득했다.
conquest_event_desc_93=민주화 운동에 대한 한국 군정부 지도자들의 가혹한 탄압으로 광주 지역에서 대규모 항의 시위가 일어나 많은 민간인과 학생들이 사망하고 부상을 입었다. 이 사건은 독일 기자들이 촬영한 영상을 통해 널리 알려졌다.
conquest_event_desc_94=1964년, 일본은 도쿄 올림픽 개막을 앞두고 도쿄와 오사카를 연결하는 도카이도 신칸센을 정식 개통했다. 이 철도는 세계 최초로 상업적으로 운영하는 고속철도가 되었다.
conquest_event_desc_95=1946년, 미국은 세계 최초의 대규모 전자 디지털 컴퓨터인 ENIAC를 성공적으로 개발했다. 그 후 수십 년 동안 컴퓨터 기술은 놀라운 속도로 발전하여 과학, 산업, 일상생활 등에 심대한 영향을 끼쳤다.
conquest_event_desc_96=동유럽 혁명 이후, 동독 정부는 국내외의 압력으로 국경 개방을 선언하고, 국민들이 베를린 장벽을 자유롭게 통과하는 것을 허락했다. 이 사건은 유럽뿐만 아니라 세계의 정치 구도에 심대한 영향을 미쳤다.

