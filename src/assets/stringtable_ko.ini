skill_info_115=핵폭탄 공격 데미지 +[#00FF00#%d%%]
skill_info_116=부대를 지휘하여 공격한 후, 적 유닛을 섬멸하지 못했을 경우 [#00FF00#%d%%]의 확률로 해당 유닛에 추적 표시를 추가할 수 있다. 추적 표시가 추가된 유닛의 경우 피해 20%% 증가.지속 시간 1턴.
skill_info_117=적군 섬멸 후, [#00FF00#%d%%]의 확률로 자신 주변 1칸 범위 내 2개 적군의 사기를 떨어뜨릴 수 있음.
skill_info_118=부대를 지휘하여 이동 후, 1칸씩 이동할 때마다 데미지 +[#00FF00#%d%%](최대 50%%), 지속 시간 1턴.
skill_info_119=공군 부대를 지휘하여 공격 시 공격 받는 목표 유닛 주변 1칸 내 아군 미행동 부대는 [#00FF00#%d%%]의 확률로 공격에 참여.(동시에 공격에 참여할 수 있는 최대 부대 수는 1개)
skill_info_120=공군 부대를 지휘하여 공격 시 공격 받은 목표 유닛은 공황 상태에 빠져 반격 확률이 [#00FF00#%d%%] 감소됨. 지속 시간 1턴.
skill_info_121=장갑 부대 지휘 시 받는 피해 -[#00FF00#%d%%].
skill_info_122=주변 1칸 내 우군 전사 시 자신은 복수 상태를 획득하여 공격력 +[#00FF00#%d], 지속 시간 2턴.
skill_info_123=함선 부대를 지휘하여 공격 시 [#00FF00#%d%%]의 확률로 반격하지 않음.
skill_info_124=함선 부대 지휘 시 자신이 혼란 상태에 빠지지 않고, 자신 및 주변 1칸 내 우군의 데미지 +[#00FF00#%d].
skill_info_125=지휘하는 부대가 공격 받을 시 적군도 해당 피해의 [#00FF00#%d%%]에 해당하는 피해 입음.(타격당 1회 유효)
skill_info_126=함선 부대 지휘 시 공군과 미사일은 적에게 데미지 +[#00FF00#%d%%].
skill_info_127=부대를 지휘하여 공격 후, '적군 유인' 상태 획득하여 1턴 동안 주변 우군(자신 제외)의 데미지 +[#00FF00#%d%%]
skill_info_128=함선 유닛을 지휘하여 공격 시 [#00FF00#%d%%]확률로 전투 중이 아닌 주변 함선 유닛 1개를 공격에 참여시킴 (턴당 1회 발동 가능)
skill_info_129=장갑 부대를 지휘하여 적군 섬멸 후, 목표 주변 1칸의 적군에게 [#00FF00#%d%%]의 추가 피해 입힘
skill_info_130=사기가 저하되고 혼란 상태에 빠진 적에게 대한 데미지 +[#00FF00#%d%%]
skill_info_131=지휘 부대의 편대 수가 1일 경우 데미지 [#00FF00#%d%%] 증가
skill_info_132=부대를 지휘하여 반격 후, 자신과 주변 우군 HP +[#00FF00#%d]
skill_info_133=지휘 부대가 자신의 영토 내에 위치할 경우 경제, 공업, 과학기술 생산량 +[#00FF00#%d%%]




