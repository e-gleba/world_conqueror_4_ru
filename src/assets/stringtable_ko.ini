armygroup_event_desc_41=일본령 태평양 연방은 앨라모고도에 있는 한 폐기된 군사 실험장에서 우연히 제2차 세계대전 당시 미국의 맨해튼 계획 핵심 연구 성과가 담긴 지하 실험실을 발견했다. 이 성과에는 초기 핵분열 반응 장치와 고농축 우라늄 샘플이 포함되어 있었다. 정보가 유출되자, 독일은 일본이 전후 세력 균형을 깨뜨리려 한다고 비난하며 시설의 인계를 강경하게 요구했다. 일본은 통제권 인계를 거부하고 '추축 공동 방위'를 명분으로 핵 기술 공유를 요구했으며, 신로마 제국 역시 같은 요구를 표명했으나 베를린은 이를 단호히 거부했다. 결국 일본과 이탈리아는 새로운 동맹을 맺고 독일과 전면적으로 결렬하게 되었다.
armygroup_event_desc_42=독일령 아메리카 제국 항공공업부는 '흰매호' 초음속 장거리 여객기가 첫 대서양 횡단 시험비행을 성공적으로 완료했다고 발표했으며, 베를린에서 출발하여 뉴욕까지 단 180분밖에 걸리지 않았다. 제국은 이 기술이 '문명 효율성의 정점'을 상징한다고 선언했다.
armygroup_event_desc_43=독일령 아메리카는 허드슨만 핵심 지역에 거대한 인공 섬인 '프로스트크라운 아일랜드'를 건설하고, 최신 V 시리즈 미사일 발사 시스템을 배치했다. 이 미사일들은 미주 북부와 북극 항로 전체를 사정권에 두어 제국의 엄격한 북부 방어선을 구축했다.
armygroup_event_desc_44=신로마 제국은 자유 아메리카 군단의 남부 치와와 사막 보급선을 차단하려 했으나, 작전 계획이 사전에 유출되어 매복 공격을 당했다. 이로 인해 신로마 제국의 북진 의도는 좌절되었다.
armygroup_event_desc_45=신로마 심판 군단은 '이단 정화'를 명분으로 멕시코 내에서 대규모 숙청 작전을 벌이며 고대 문명 유적을 체계적으로 파괴하여 아즈텍 문화의 정신적 뿌리를 완전히 끊으려 했다.
armygroup_event_desc_46=자유 아메리카 비밀 특공대가 계획한 산불이 빠르게 확산되면서 캘리포니아 남부 일대를 불바다로 만들었고, 불길은 결국 로스앤젤레스 시내까지 번져, 짙은 연기와 혼란 속에서 도시의 질서가 무너졌다.
armygroup_event_desc_47=독일군이 미국 동부를 완전히 장악한 후, '신질서 세계 계획'을 가속화하기 위해 제국은 자유의 여신상이 바라보는 곳에 세계에서 가장 높은 전자파 방송 신호탑을 건설하기로 결정했다. 이 탑은 '질서의 탑'으로 명명되었고, 신세계 전체 정보에 대한 제국 의지의 지배를 상징한다.
armygroup_event_desc_48=일본령 태평양 수비군은 앨버타의 오일샌드 자원을 완전히 장악하고, 핵심 지역에 거대한 '정제 운송 센터'를 세운 후, 송유관을 통해 태평양 서부 해안까지 연결하여 태평양 함대에 끊임없이 연료를 공급하고 있다.
armygroup_event_desc_49=한국 광복군이 파견한 잠입 소조는 밴쿠버에서 비밀 기습 작전을 펼쳐 인근 송유관을 폭파하고, 도시의 주요 전력탑을 파괴하여 일본군의 에너지 수송과 서부 해안 방어 체계에 심각한 타격을 입혔다.
armygroup_event_desc_50=북부 자유 단풍 저항군은 밴프 지역 깊숙한 곳에 비밀 산악 기지를 세우고, 오랜 기간 설산과 밀림 사이에 잠복하며 지형적 이점을 활용해 제국군에 대한 지속적인 게릴라전과 파괴 작전을 전개하여 북부 전선에서 뿌리 뽑기 어려운 위협적인 존재가 되었다.
armygroup_event_desc_51=제국 문화 통합 정책'을 추진하기 위해 신로마 성화 군단은 멕시코에서 '맛 통일 계획'이라는 식품 개량 방안을 시험적으로 시행했다. 이에 아즈텍 태양 군단은 공급망에 성공적으로 침투하여 식당과 식자재 구매 과정에 인력을 배치하고, 일부 식자재에 특수 유독물질을 투입했다.
armygroup_event_desc_52=독일령 카리브해 해군 함대는 파나마 운하를 상대로 '철문 작전'을 발동하여 수문 통제권을 장악하고 이 핵심 항로를 독점함으로써 카리브 전역에서의 전략적 주도권을 확립하려 했다.
armygroup_event_desc_53=소련과 쿠바 혁명 세력은 비밀리에 군사 협정을 체결하고, 소련의 잔여 전함과 잠수함을 집결하여 쿠바 현지의 아바나 군단과 함께 플로리다와 멕시코만 연안의 독일령 주요 거점을 대상으로 해상 게릴라식 기습 공격을 감행함으로써 제국의 남부 방어선을 뚫으려고 했다.
armygroup_event_desc_54=독일령 아메리카는 휴스턴에 '제국 우주 연구 센터'를 세워 위성 위치 확인, 궤도 타격, 고고도 정찰 시스템 개발에 주력하고, 우주 기반 우위를 통해 전장 주도권을 장악하고 아메리카 전역을 아우르는 전술 감시 및 타격 네트워크를 구축하려 했다.
armygroup_event_desc_55=독일령 아메리카 제국 군단은 워싱턴에 있는 석비와 백색 궁전 건축군을 철거하고, 미국 동부의 수도를 뉴욕으로 옮기겠다고 발표함으로써 독일이 아메리카 동부 대륙에 대한 주권을 완전히 재편했음을 알렸다.
armygroup_event_desc_56=알곤킨 유격군단은 독일령 아메리카가 이리호에 건설한 '제국 수벽' 댐에 잠입하여 핵심 수문 시스템을 파괴하는 데 성공했고, 심각한 구조적 불균형을 유발했다. 그 후 댐이 무너지면서 발생한 홍수는 동부 해안을 따라 급속히 확산되었고, 클리블랜드가 가장 먼저 피해를 입었다.
armygroup_event_desc_57=독일군 대서양 함대가 다가오자, 영국군 망명 함대 사령관은 가만히 당하고 있지 않기로 했다. 그는 기함에 전속력으로 적을 향해 돌진하여 분노와 강철의 굉음 속에서 적함과 함께 바다 밑으로 침몰하라고 명령했다.
armygroup_event_desc_58=프랑스 부흥군단은 퀘벡의 프랑스계 지도자들과 함께 《신갈리아 선언》을 발표하고 '갈리아 자유 방선'을 결성했다. 이들은 프랑스어 문화와 정체성을 지키고 제국의 고압적인 통치와 강제 동화 정책에 맞서 싸울 것을 맹세했다.
armygroup_event_desc_59=일본 태평양 함대의 기함인 전함 '야마토'가 뉴욕항에 도착해 3일간의 제국 방문을 시작했다. 공식적으로는 '문화 친선 교류'라고 주장했으나, 수면 아래에는 위기가 도사리고 있었으며, 이 방문은 태평양 추축 세력이 대서양의 심장부에 처음으로 발을 들인 것을 의미했다.
armygroup_event_desc_60=여명 선봉군은 중부 평원에서 대규모 농장주들의 봉기를 성공적으로 선동해, 독일령 아메리카의 강제적인 토지 및 식량 징발을 반대했다. 이 폭동으로 수백 개의 곡물 창고와 군용 식량 수송 차량이 불탔고, 제국 중부의 식량 보급 체계는 일시적으로 완전히 마비되었다.
armygroup_event_desc_61=독일령 아메리카 제국은 동부 지역에 고압적인 통치를 펼쳐 주요 도시들을 '범죄 없고 분쟁 없는' 제국의 모범 구역으로 만들었다. 그러나 그 평온함의 이면에는 사회 방방곡곡에 곳에 침투한 비밀 경찰과 전면적인 사상 숙청 체제가 존재하여 모든 반대 목소리는 소리 없이 사라졌다.
armygroup_event_desc_62=일본령 태평양 함대는 진주만 해군 기지에 '야마타노오로치'급 이-400형 원양 잠수 항공모함이 공식적으로 진수되었다고 발표했다. 이 함선은 대양을 횡단할 수 있는 심해 잠항 능력을 갖추었으며, 탐지되지 않은 상황에서 카리브해나 남미 해안에 도달할 수 있는 능력을 갖추어 수중 공습 임무를 통합적으로 수행할 수 있다.
armygroup_event_desc_63=샌프란시스코를 방문 중이던 한 독일군 고위 장성이 자유 아메리카 독립군의 원거리 저격에 의해 사살되었습니다. 일본령 태평양 헌병군이 긴급히 해당 구역을 봉쇄했으나 범인을 잡지 못했다. 이 사건은 독일 측의 강한 불만을 촉발했고, 일본 측의 보안 실패를 규탄하면서 독일-일본 추축 관계에 균열이 생기게 되었다.
armygroup_event_desc_64=플로리다 지역은 명목상으로는 독일군의 관할 하에 있으나, 주민들은 타협을 거부했고, 지역 무장 폭동이 자주 일어났습니다. 이로 인해 독일군은 장기적인 저항의 수렁에 빠졌으며, 정세는 계속해서 불안정하게 흔들렸다.
armygroup_event_desc_65=일본군은 옐로스톤 지하 암반층에 '화산 가스 정제 장치'를 설치하여 지열 에너지에서 전술적 용도의 독성 가스를 추출하려 했다. 그러나 장비 이상으로 황화수소가 대량 누출되면서 주변 지하수와 공기가 광범위하게 오염되어 생태 재앙이 빠르게 확산되었다.
armygroup_event_desc_66=자유 단풍 저항군은 개 썰매를 타고 극지 빙원을 가로질렀고, 잠수로 제국 소나와 해안 방어 시스템을 우회하여 프로스트크라운 아일랜드를 기습하는 데 성공했다. 이들은 섬에 배치된 독일령 아메리카의 V형 미사일 기지를 파괴하고, 북부 전선에 반격의 희망을 불어넣었다.
armygroup_event_desc_67=독일령 아메리카 제국은 재즈와 흑인 문화의 확산을 전면적으로 금지했다. 하지만 뉴올리언스의 지하 음악가들은 '메아리 프로젝트'를 조직해 밤에 단파 라디오 방송으로 금지된 곡을 틀면서 시민들의 저항 의식을 불러일으켰다.


