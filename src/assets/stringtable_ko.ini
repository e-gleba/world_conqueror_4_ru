dialogue_4000=아라스를 빠르게 우회해서 스카르프 강에 있는 다리를 최대한 빨리 점령해야 한다. 제5기갑사단이 이미 지원 명령을 받았으니 곧 도착할 것이다.
dialogue_4001=지금 프랑스군과 영국군은 각각 아라스에서 반격 작전을 시작하라는 지시를 받았다.
dialogue_4002=제25기갑연대와 연락하라. 자유 수색을 중지하고 사단 본부의 작전에 협조하도록 하라.
dialogue_4003=편성 버튼을 클릭하세요.
dialogue_4004=편성할 군단을 클릭하세요.
dialogue_4005=편입할 유닛을 클릭하세요.
dialogue_4006=편입 확인 버튼을 클릭하세요.
dialogue_4007=제25기갑연대 명령: 신중하게 전진하고, 스스로를 보호하며, 보병 주력군이 올 때까지 기다렸다가 함께 다리를 점령하라.
dialogue_4008=젠장! 적 전차 장갑이 너무 두껍다! 88mm 포를 낮춰 대전차포로 사용하라고 전선에 통보하라.
dialogue_4009=정면으로 강습하라고?… 그러면 큰 대가를 치르게 될 것이다. 하지만 때로는 가장 직접적인 루트가 오히려 적의 모든 계획을 무너뜨릴 수 있다!
dialogue_4010=프랑스군은 영국군의 우익을 엄호하기 위해 진격했지만, 소통 문제로 영국군을 적군으로 오인했다.
dialogue_4011=충돌 후, 양측은 아군임을 확인하고 프랑스군은 계속 진격했다.
dialogue_4012=공군에게 통지하라. 적의 공세가 엄청나게 거세서 우리 부대에 폭격 지원이 필요하다!
dialogue_4013=적이 후퇴하고 있다. 전부 추격하여 아라스를 점령하라!
dialogue_4014=네만강 유역으로 급속히 진격해서 알리투스를 점령하라.
dialogue_4015=아주 좋다. 알리투스의 다리를 사수해라. 소련군에게 절대 빼앗기지 말아라!
dialogue_4016=현재 소련 제5기갑사단이 알리투스를 지원하기 위해 신속히 이동 중이다. 그들의 선발대가 곧 도착할 것이다.
dialogue_4017=소련 제5기갑사단 주력 부대가 알리투스에 도착했다.
dialogue_4018=알리투스 상황을 파악했고, 공군에게 폭격 지원을 통보했다. 당신의 부대는 반드시 알리투스를 사수하라!
dialogue_4019=공군이 정찰한 바에 따르면 알리투스에 대규모 부대 증원이 포착되었다. 적군이 지원 부대를 파견하도록 우선 네만 강 상류의 다리를 공격하라.
dialogue_4020=역시 '유령 사단'답군! 소련군 증원 부대가 격파되었다. 다른 부대에게 전력을 다해 공격하고 네만강 서쪽 마을을 점령하라고 통보하라!
dialogue_4021=제3, 제4기갑집단군에게 정면으로 소련군 방어선을 돌파하고, 뱌지마 후방에서 포위망을 형성하라고 명령하라.
dialogue_4022=제19집단군과 제30집단군의 연결부를 돌파하여 뱌지마 후방에서 제4기갑집단군과 합류하라.
dialogue_4023=제19, 제30, 제49집단군의 전차 부대를 소집하여 적을 포위하고, 적이 더 이상 돌파하지 못하게 막아라!
dialogue_4024=전방 부대에게 진지를 포기하고 후퇴하여 적군의 포위를 피하라고 통보하라.
dialogue_4025=제4기갑집단군은 부됸니가 이끄는 예비대 방면군을 격퇴하고 뱌지마로 진격할 준비를 하고 있다.
dialogue_4026=제4기갑집단군과 성공적으로 합류하여 뱌지마 포위망을 형성했다.
dialogue_4027=전력을 다해 동쪽으로 돌파해라. 절대로 독일군에게 포로로 잡혀서는 안 된다!
dialogue_4028=지금이 우리가 승리에 가장 가까운 순간이다. 다른 것은 고려하지 말고 우선 야흐로마를 점령하고 북쪽에서 모스크바로 진격하라!
dialogue_4029=병사들이여! 전쟁은 가장 결정적인 순간에 이르렀다. 우리는 반드시 승리해야 하며, 승리할 수밖에 없다!
dialogue_4030=시베리아에는 눈보라가 휘몰아치고 있다. 이 혹독한 날씨는 독일군의 시야와 작전 능력에 막대한 영향을 끼쳤다.
dialogue_4031=클린은 제7기갑사단에 의해 점령되었고, 모스크바 북부 방어선이 좁혀졌다.
dialogue_4032=로코소프스키에게 어떤 방법을 써서라도 제16집단군은 클린 방면의 적군을 막아야 한다! 절대로 그들이 모스크바로 진격하게 해서는 안 된다!
dialogue_4033=야흐로마가 함락되면서 독일군이 모스크바를 대규모로 포위할 수 있는 북부 조건이 갖춰졌다.
dialogue_4034=제1돌격집단군은 방어선을 사수하라. 절대로 독일군이 크라스노아르메이스크를 통과하지 못하게 해야 한다!
dialogue_4035=크렘린 궁전의 윤곽이 희미하게 보이지만, 제3기갑집단군의 연료와 탄약은 바닥났다. 기적이 일어나지 않는 한 모스크바 진입은 불가능하다.
dialogue_4036=믿을 수 없다! 제7기갑사단이 모스크바 시내에 진입했다. 하지만 이로 인해 모스크바에서 가장 격렬한 저항이 시작되었다.
dialogue_4037=모스크바 성 방어 부대가 배치되었다. 모스크바에 들어오는 모든 적을 섬멸하라. 영광의 순간이 왔다! 우리가 바로 모스크바 그 자체다!
dialogue_4038=남방집단군은 들어라. 제4기갑집단군을 주력으로 하고, 캠프 기동군단이 측면을 엄호하여 근위제6집단군을 섬멸하라.
dialogue_4039=캠프 특수임무군에 소속된 제7기갑사단 역시 명령을 받고, 벨고로드 동쪽으로 공격을 개시할 준비를 하고 있다.
dialogue_4040=제7기갑사단은 북부 도네츠 강을 성공적으로 건너 근위제7집단군 방어선에 교두보를 구축했다.
dialogue_4041=근위제7집단군에게 적군이 주력 부대를 지원하지 못하도록 적을 견제하라고 통보하라.
dialogue_4042=교두보가 더욱 확장되어 주력 부대를 엄호할 수 있게 되었다.
dialogue_4043=총참모장 귀하 전보: 적군이 곧 프로호롭카로 돌격을 개시할 것입니다. 전차 증원을 요청합니다.
dialogue_4044=근위제5집단군을 동원해 지원을 보냈다. 너희 부대는 모든 수단을 동원해 적군이 계속 돌파하지 못하도록 막아야 한다!
dialogue_4045=소련군에게 어찌 이렇게 많은 전차가 있는가! 철수하라. 모든 부대를 위험에 빠뜨릴 순 없다.
dialogue_4046=포격 제압이 끝나면 모두 돌격하라. 오늘 우리는 키이우를 탈취할 것이다!
dialogue_4047=키이우를 지키는 것은 불가능하다. 제7기갑사단은 파스토우로 신속히 지원해 우리의 퇴로를 확보하라.
dialogue_4048=모든 부대는 파스토우로 철수하여 방어선을 구축하고, 적군의 확장을 저지하라.
dialogue_4049=모든 부대는 빌라체르크바로 철수하라.
dialogue_4050=베를린 전보: 키이우가 함락되었습니다.
dialogue_4051=지토미르를 신속히 지원하라. 철도 요충지가 적의 손에 넘어가게 해서는 안 된다.
dialogue_4052=제48기갑군단은 파스토우에서 북쪽으로 돌격하라. 지토미르에서 포위망을 형성해야만 소련군의 추가 진격을 막을 수 있다.
dialogue_4053=신속히 포위망을 돌파하라. 각 부대는 전선을 확고히 하고, 경솔하게 진격하지 마라!
dialogue_4054=공군의 융단 폭격이 곧 시작될 것이다. 폭격이 끝나면 즉시 적 방어선을 돌파하라!
dialogue_4055=폭격이 끝났다. 진격하라!
dialogue_4056=예비 부대를 투입해서 빈틈을 메워라. 적이 방어선을 돌파하게 해서는 안 된다.
dialogue_4057=제3기갑사단이 성공적으로 방어선을 돌파했다. 독일군은 방어선을 축소할 수밖에 없다.
dialogue_4058=제2기갑사단과 제116사단을 긴급 투입하라. 적군이 전과를 확대하지 못하게 막아야 한다.
dialogue_4059=점진적으로 진격하여 포위망을 좁혀라. 적이 포위망을 빠져나가게 해서는 안 된다.
dialogue_4060=동쪽으로 질서 있게 철수하라. 적의 포위망 구축을 막아야 한다.
dialogue_4061=나는 최선을 다했다. 이제 이 전쟁을 끝낼 때가 왔다. 전쟁이 계속되면 독일에게 재앙이 될 것이다.
dialogue_4062=폭탄 암살 사건이 발생했다. 클루게는 해임되고 모델이 지휘권을 넘겨받았다.
dialogue_4063=포위망을 전력으로 공격하여 갇힌 부대에게 탈출구를 만들어줘야 한다.
dialogue_4064=포위망이 형성되자, 갇힌 독일군은 결사적인 돌파전을 개시했다.
dialogue_4065=아헨은 정치적으로 매우 중요한 곳이다. 이곳을 점령하면 적군의 사기에 큰 타격을 줄 수 있다.
dialogue_4066=아헨은 우리 손에 들어왔다! 잠시 재정비 후, 휘르트겐 숲으로 진격하라.
dialogue_4067=후방에 더 많은 병력을 징집하라고 통보하라. 우리는 반드시 휘르트겐 숲에서 적군을 막아야 한다.
dialogue_4068=휘르트겐 숲의 복잡한 지형은 제3기갑사단의 전력을 크게 약화시켰다.
dialogue_4069=요새를 사수해라. 친위대가 지원하러 가고 있다.
dialogue_4070=이것은 국가의 운명이 걸린 전투다. 반드시 승리해야 한다!
dialogue_4071=전군 출격! 아르덴 산악 지대를 통과해 안트베르펜을 점령하라!
dialogue_4072=기갑 부대는 아르덴 숲으로 신속히 지원하여 적의 추가 진격을 저지하라.
dialogue_4073=북부와 남부 전선이 막혔다. 병력을 중부로 집중시켜라. 반드시 아르덴 숲을 뚫고 나가야 한다.
dialogue_4074=바스토뉴를 점령하라. 우리 공격 경로를 가로막게 둬서는 안 된다.
dialogue_4075=제101공수사단은 항복을 거부하고 바스토뉴를 사수하고 있다.
dialogue_4076=바스토뉴를 신속히 지원해라. 독일군이 교통 요충지를 장악하게 둬서는 안 된다.
dialogue_4077=바스토뉴가 함락되어 독일군 지원 부대가 신속하게 움직일 수 있게 되었다. 독일군의 공세가 더욱 강화되었다.
dialogue_4078=제1집단군이 라인강 방어선을 돌파하고 남부에서 루르 공업 지역을 봉쇄했다.
dialogue_4079=제3기갑사단은 리프슈타트로 신속히 진격하여 제9집단군 부대와 합류하라는 명령을 받았다.
dialogue_4080=포위권 내부로 '무기를 버리고 항복하면 연합군은 전쟁포로의 권리를 보장할 것이다.'라고 방송하라.
dialogue_4081=제국의 원수로서 나는 항복을 승인할 수 없습니다. 하지만 병사들에게 탈출의 희망을 남겨주기 위해 최선을 다할 것이다.
dialogue_4082=B 집단군은 해산하고, 모든 작전 부대는 조직적인 대형으로 돌파하거나, 무기를 버리고 집으로 돌아가라고 내 명령을 전하라.
dialogue_4083=나는 적어도 삶의 마지막 순간까지 싸웠다.
dialogue_4084=제3기갑사단 사단장은 전투 중 전사했으나, 그의 용맹한 정신은 부대의 전투 의지를 북돋았다.
dialogue_4085=모델은 항복을 거부하고 자결했다.
dialogue_4086=1991년 2월 24일, 사막의 폭풍 작전이 시작되었다. 제3기갑사단은 미군 주력 부대 중 하나로서 이라크를 공격했다.
dialogue_4087=쿠웨이트가 함락되자 유엔군의 기세가 크게 올랐다.
dialogue_4088=미군의 전자 교란 시스템이 가동되면서 이라크군의 전자 통신 시스템이 무력화되었다.
dialogue_4089=이라크 육군 대부분이 소멸하고 연합군은 압도적인 승리를 거두었다. 이라크 정부는 항복을 요청했다.
dialogue_4090=해군 보병 제255여단은 제56집단군과 제18집단군 사이의 경계 지점으로 파견되어 독일군의 추가 진격을 저지하라.
dialogue_4091=투압세를 점령하기 위해 독일군은 '아티카 작전'을 발동했다.
dialogue_4092=독일군 선봉대가 투압세 성 밖에 도착했다. 즉시 돌아와 지원하라.
dialogue_4093=투압세가 독일군에게 점령되자 소련군은 병력을 집중시켜 도시를 점령한 독일군을 포위 공격했다.
dialogue_4094=투압세를 탈환한 소련군은 기세를 몰아 독일군을 향해 반격을 개시했다.
dialogue_4095=해군 보병 제255여단이 성공적으로 교두보를 확보하자, 소련군은 대규모 증원군을 신속히 파견했다.
dialogue_4096=노보로시스크 수비대가 출동하여 소련군의 교두보 확대를 저지했다.
dialogue_4097=소련군의 공세가 한계에 달하자, 다음 작전의 거점으로 교두보를 고수할 준비를 했다.
dialogue_4098=교두보를 소멸시키기 위해 독일군은 공격 병력을 늘렸다.
dialogue_4099=교두보가 압축되었다. 한 정치위원이 보급품과 함께 도착해 전사들에게 말라야 제믈랴를 반드시 사수하라고 독려했다.
dialogue_4100=해군 보병 제255여단은 노보로시스크 항에서 상륙하라는 명령을 받고, 내부에서 적군 방어선을 돌파할 계획을 세웠다.
dialogue_4101=외곽 방어선 돌파에 성공하여 독일군과 시가전 단계에 돌입했다.
dialogue_4102=노보로시스크 외곽 요새가 함락되면서 소련군이 점차 노보로시스크를 장악해 나갔다.
dialogue_4103=노보로시스크 해방에 성공하자 독일군은 북서쪽으로 철수했다. 소련군은 기세를 몰아 추격에 나섰다.
dialogue_4104=제18집단군이 노보로시스크 북쪽 방어선을 돌파하여 북부 포위망을 형성했다.
dialogue_4105=제18집단군 상륙 부대가 해군의 봉쇄를 뚫고 엘티겐에 상륙했다. 추축군은 즉시 병력을 집중하여 반격에 나섰다.
dialogue_4106=엘티겐의 돌출부가 독일군 주력 부대를 성공적으로 견제했다. 제56집단군 상륙 부대는 기세를 타고 출격하여 케르치 북동부에 상륙했다.
dialogue_4107=적군 해안 방어 부대의 화력이 맹렬하여 코스텐코 상사가 장렬하게 전사했다.
dialogue_4108=케르치 북부 교두보가 굳건해지자, 독일군은 전력을 다해 엘티겐을 공격했다.
dialogue_4109=소련군 특공대가 케르치를 기습하자, 추축군은 긴급히 지원하러 돌아왔다.
dialogue_4110=발라클라바를 성공적으로 함락하여 사푼 산지의 제49산악군단을 양쪽에서 포위했다.
dialogue_4111=사푼 산지의 제49산악군단이 소련군에 의해 격퇴되었고, 적군은 세바스토폴 방어선으로 철수했다.
dialogue_4112=마켄지 고지를 점령하여 적군 북부 방어선이 격파되었다.
dialogue_4113=세바스토폴이 해방되자 독일군은 서쪽으로 후퇴하며 해상 탈출을 준비했다.
dialogue_4114=루마니아 함대가 격퇴되자, 철수 부대의 사기가 무너졌다.
dialogue_4115=소련군은 세바스토폴에 대한 봉쇄를 완수했다. 고립된 추축군은 필사적으로 방어하기로 결심했다.
dialogue_4116=해군 보병 제255여단은 명령을 받고 밤을 틈타 드네스트르만을 건너 제46집단군 주력 부대를 위한 상륙 교두보를 구축했다.
dialogue_4117=추축군 해안 방어 부대가 상륙 부대를 발견하여 해안 쟁탈전이 일촉즉발의 상황에 놓였다.
dialogue_4118=북부 해안 교두보를 성공적으로 구축했다. 아케르만 요새를 격파하여 주력 부대의 진격로를 확보하라.
dialogue_4119=아케르만이 해방되자 적군은 어쩔 수 없이 강어귀 방어선을 포기해야 했다.
dialogue_4120=전장 북쪽에 있던 소련 제37집단군이 큰 성과를 취득하자, 적군은 포위되는 것을 피하기 위해 철수를 시작했다.

