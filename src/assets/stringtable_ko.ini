help_conquest_desc_6=도전 정복에서는 지휘관이 지휘하는 국가의 과학 기술을 업그레이드할 수 있습니다. 국가의 과학 기술을 활성화하기 위해서는 이에 대응하는 과학 기술 레벨에 도달해야 하며, 각 국가의 초기 기술 수준과 상한선에는 약간의 차이가 있습니다.
help_conquest_desc_7=도전 정복에는 외교 모드가 포함되었습니다. 지휘관은 같은 진영의 국가 또는 중립국에 선전포고를 하거나 일부 적대 국가를 항복시킬 수 있습니다. 기존 도시 수 및 병력 수와 초기 도시 수 및 병력 수의 차이는 국가의 충성도에 영향을 미치며, 목표 국가의 도시 수, 병력 수, 충성도 등 종합적인 요소는 항복 촉구에 영향을 미칠 수 있습니다. 항복시키려면 반드시 대상 국가와 국경이 인접해야 하며, 20턴을 초과해야 합니다.
help_conquest_desc_8=도전 정복에서 지휘관님은 다양한 역사적 사건을 접하게 될 것이며, 이러한 사건은 특정 국가에 긍정적 또는 부정적 영향을 미칠 수 있습니다.

induce_info_1=이 나라는 항복할 수 없음
induce_info_2=반드시 대상 국가와 국경이 인접해야 항복 촉구할 수 있습니다.

