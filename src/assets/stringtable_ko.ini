elite_intro_73=RPG 로켓병은 대전차 로켓 발사기(RPG)를 장착한 보병 유닛으로, 보통 장갑 또는 도시 방어 목표물에 대처하는 데 사용된다. RPG 로켓병은 적에게 로켓탄을 발사하여 큰 피해를 입힐 수 있으며, 뛰어난 휴대성과 광범위한 파괴력 때문에 현대 전쟁에서 중요한 역할을 하고 있다.
elite_intro_74=센츄리온 전차 제2차 세계 대전 말기에 영국이 설계 및 제조한 주전 탱크로 제2차 세계 대전 이후 도입되었다. 이 전차는 첨단 디자인과 기술을 사용하고, 연막 발사기를 장착했으며, 강력한 공격력과 방어 능력을 갖추었다. 냉전과 여러 군사 작전에서 중요한 역할을 수행했으며, 많은 국가 육군의 주력 전차 중 하나가 되었다.
elite_intro_75=타이푼급 원자력 잠수함은 냉전 시기 소련이 만든 탄도미사일 핵잠수함이자 지금까지 인류가 건조한 최대 톤수 잠수함이다. '상호 파멸 확보' 원칙을 달성하기 위해, 여러 발의 핵탄두를 장착하고 있으며, 사거리는 그와 같은 반구에 있는 임의의 목표물을 타격할 수 있다. 동시에 잠수함은 복합식 이중 선체를 가지고 있어 뛰어난 잠항 심도와 타격 저항력을 가지고 있다.
elite_intro_76=Mi-24 하인드 헬리콥터는 소련에서 제작한 무장 헬기이다. 강력한 화력뿐만 아니라 지상 목표물도 효과적으로 공격할 수 있다. 또한 기동성이 뛰어나 적의 공격을 어느 정도 피할 수 있다. 뛰어난 성능과 신뢰성으로 인해 이 헬리콥터는 많은 국가의 군대에 복무하고 있으며, 다양하고 복잡한 환경에서 활약하고 있다.

