elite_intro_82=유령부대는 세계 최정예 병사들로 구성된 정예부대로 무소음 전술, 첨단 스텔스 기술, 그리고 뛰어난 작전 효율로 유명하다. 극한의 환경에서도 신속하고 정확하게 적을 타격할 수 있는 능력을 갖추었으며, 공수 작전을 통한 신속한 배치 및 철수 능력도 갖추었다. 이 부대는 세계에서 가장 치명적인 정예부대 중 하나로 평가받고 있다.
elite_intro_83=M1A1 주력 전차는 미군의 주력 장갑차로, 세계 최초로 광범위하게 고농축 우라늄탄과 고농축 우라늄 장갑을 장착한 전차이다. 120mm 활강포는 관통력이 높은 고농축 우라늄탄을 발사하여 탄약의 고밀도와 자폭 특성으로 적의 중장갑 목표를 쉽게 파괴할 수 있으며, M1A1은 고농축 우라늄 복합장갑을 채택하여 방어 능력을 크게 향상시켜 관통탄과 고폭탄에 맞서도 뛰어난 생존 능력을 유지할 수 있다.
elite_intro_84=B-52 전략 폭격기는 미국 공군의 장거리 중형 폭격기로, 1950년대에 취역한 이래 탁월한 항행 거리, 뛰어난 적재량, 다양한 작전 능력 등으로 전 세계 공군력의 중요한 구성 부분이 되었다. B-52는 재래식 폭탄, 정밀 유도 탄약, 핵무기를 장착할 수 있어 다양한 임무 요구에 적응할 수 있다. 꾸준한 현대화 업그레이드로 인해 B-52는 여전히 경쟁력을 유지하고 있으며, 냉전 시대부터 현재까지 군사 역사상 가장 오래 지속된 폭격기 플랫폼 중 하나가 되었다. 방대한 본체와 긴 이륙 거리 요구 때문에 항공모함의 제한된 갑판 공간과 이륙 조건에 적응할 수 없다.
elite_intro_85=AH-64 아파치는  세계에서 가장 대표적인 공격 헬리콥터로, 강력한 화력, 첨단 전자 시스템, 뛰어난 기동성으로 유명하다. 아파치는 30mm 체인 기관포, 공대지 미사일, 첨단 광전 및 적외선 센서를 장착하고 있으며, 강력한 방호 시스템을 통해 위험한 환경에서도 작전할 수 있어 전장에서 치명적인 공중 타격 역량으로 자리잡고 있다. 아파치의 다기능성과 지속적인 현대화 업그레이드 덕분에 현대 육군 항공병의 핵심 작전 플랫폼 중 하나가 되었다.


