eventgeneral_rule=장군 시련 규칙
eventgeneral_rule_1=1. 이벤트 시나리오는 제한된 시간 동안 열립니다. 스테이지를 클리어하여 보상을 얻기 위해 지휘관님들께 시간을 합리적으로 배정하는 것을 권장합니다.
eventgeneral_rule_2=2. 이 이벤트는 장군 전기 모드의 어려움 난이도 모드이지만, 장군 전기 모드의 모든 스테이지를 클리어하지 않아도 이 모드에 도전할 수 있습니다.
eventgeneral_rule_3=3. 적군은 능력 강화 버프 2개를 획득할 수 있으니(이벤트 시작 시 랜덤으로 2개 획득, 이벤트 종료 시점까지 지속), 지휘관님께서 시나리오에 도전하실 때 행군로를 신중하게 계획하십시오.
eventgeneral_rule_4=4. 스테이지 클리어 후, 최고 획득 별 수가 기록되며, 일정한 별 수를 누적하면 단계 보상을 받으실 수 있습니다.
eventgeneral_rule_5=5.스테이지 보상은 리본과 엘리트 부대 조각의 두 가지 유형으로 나뉘며 일정량의 보상을 수령하게 됩니다.

challenge_rule=도전 이벤트 규칙
challenge_rule_1=1. 본 이벤트의 도전 스테이지는 제한된 시간 동안만 진행됩니다. 각 지휘관님께서 시간을 합리적으로 배치하고 스테이지를 클리어하여 보상을 획득하시기를 바랍니다.
challenge_rule_2=2. 이벤트 도전 스테이지는 일반 난이도와 어려움 난이도로 구성되었으며, 일반 난이도를 클리어하셔야 어려움 난이도가 잠금 해제 됩니다.
challenge_rule_3=3. 어려움 난이도 도전 스테이지에서 적군은 능력 강화 버프 2개를 획득할 수 있습니다(이벤트 시작 시 랜덤으로 2개 획득, 이벤트 종료 시점까지 지속).
challenge_rule_4=4. 이벤트 도전 스테이지는 '우군 지원', '진지 방어', '적군 섬멸', '물자 축적' 등 4가지 유형으로 나뉩니다. 이벤트마다 도전 스테이지 한 가지가 열리게 됩니다.
challenge_rule_5=5. 특정 스테이지를 클리어하면 단계 보상을 받을 수 있습니다. 단계 보상은 고정 보상입니다.
challenge_rule_6=6. 이벤트 도전 스테이지에서 방어 시설을 건설할 수 없습니다.

