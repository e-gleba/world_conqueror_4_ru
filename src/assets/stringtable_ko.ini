armygroup_event_desc_68=검은 전갈은 미국에서의 일련의 작전이 잇따라 좌절되자, 대규모로 남쪽으로 철수했다. 여러 국가는 미국과 소련의 도움으로 검은 전갈의 통제에서 벗어났다.
armygroup_event_desc_69=오스본은 5개의 신호 증폭기를 동시에 가동하며 최종 카운트다운을 시작했다. 20 주기가 지나면, 의지가 약한 사람들은 다시 검은 전갈에 합류하게 될 것이다. 미국, 소련, 영국, 프랑스는 각각 정예 부대를 파견하여 주변 국가들과 연합하여 각지의 검은 전갈 유적을 기습했다.
armygroup_event_desc_70=멕시코에 위치한 검은 전갈의 유적 '태양 요새'가 함락되고, 신호 증폭기가 점령되었다. 전 세계의 비밀 기지의 위치가 모두 드러나자, 검은 전갈은 전략적 측면에서 전면적인 수세에 몰렸다.
armygroup_event_desc_71=콜롬비아에 위치한 검은 전갈의 유적 '에코 벙커'가 함락되고, 신호 증폭기가 점령되었다. 유적의 각종 시설은 스스로 파괴되었으나, 남아있는 접속 기록에 따르면 해당 시설의 재가동 시점은 1933년으로 나타났다.
armygroup_event_desc_72=브라질에 위치한 검은 전갈의 유적 '잉카의 눈'이 함락되고, 신호 증폭기가 점령되었다. 다수의 특수 무기 장비가 옮겨지거나 파괴되지 못한 채 남겨졌고, 심지어 본 적 없는 신형 군비 설계도도 발견되었다.
armygroup_event_desc_73=브라질에 위치한 검은 전갈의 유적 '성궤 신전'이 함락되고, 신호 증폭기가 점령되었다. 미국과 소련은 수많은 암호화된 자료를 획득하여, 검은 전갈의 전 세계 인력 명단과 군사 배치가 완전히 노출되었다.
armygroup_event_desc_74=브라질에 위치한 검은 전갈의 유적 '허리케인 등대'가 함락되고, 신호 증폭기가 점령되었다. 검은 전갈 주력 부대와 세계 각지의 다른 검은 전갈 조직원들 간의 통신이 일시적으로 차단되었다.
armygroup_event_desc_75=검은 전갈 세력이 다시 빠르게 성장하고 확장되자, 미국과 소련 양측은 이 위협을 근절하기 위해 손을 잡기로 결정했다. 바르샤바 조약기구와 나토는 임시로 휴전하고 새로운 군사 동맹을 결성했다.
armygroup_event_desc_76=오스본이 완전히 패배하면서 카운트다운이 멈췄다. 검은 전갈의 남미 계획은 완전히 좌절되었고.
armygroup_event_desc_77=검은 전갈의 모든 유적 시설이 점령되면서 카운트다운이 멈췄다. 검은 전갈의 남미 계획은 완전히 좌절되었고.
armygroup_event_desc_78=오스본이 완전히 패배하면서 카운트다운이 멈췄다. 검은 전갈의 남미 계획은 완전히 좌절되었고, 모든 사름은 자유의 부름을 듣게 되었다.
armygroup_event_desc_79=검은 전갈의 모든 유적 시설이 점령되면서 카운트다운이 멈췄다. 검은 전갈의 남미 계획은 완전히 좌절되었고, 모든 사름은 자유의 부름을 듣게 되었다.
armygroup_event_desc_80=마지막 남은 신호 증폭기 조율이 완료되었다. 검은 전갈이 통제 지역 내에서 오랫동안 Q30 물질이 함유된 나노 약물을 몰래 살포했기 때문에, 종소리가 울리자 약물의 영향을 받은 사람들은 자율 의식이 점차 억제되고, 결국 다시 검은 전갈에 합류하게 되었다.
armygroup_event_desc_81=마야 유적에서 새로운 수정 해골이 발견되었다. 이는 단순한 유물이 아니라, 신전 정보와 미지의 문명 역사를 기록한 저장 장치였다.
armygroup_event_desc_82=신슈바벤 집단군이 검은 전갈의 군사 장비를 가지고 남미 정글에 나타났다. 이들은 검은 전갈과 군사적 협력을 맺었거나, 검은 전갈 자체가 그들의 존재 이유일 수도 있다.
armygroup_event_desc_83=소련은 베네수엘라에 대량의 탱크를 지원하여 미군과 그 동맹국의 공격을 막기 위한 기갑 방어선을 구축하려 했다.
armygroup_event_desc_84=검은 전갈은 해적을 무장시켜 여러 해역에서 각국의 상선을 약탈하게 했다. 이로 인해 미국과 소련의 보복이 촉발되었고, 각국은 해군 장비를 강화한 뒤 연합하여 해적을 전면적으로 소탕했다.
armygroup_event_desc_85=검은 전갈의 해군 부대가 '음파 안개'를 이용해 레이더 시스템을 교란하고 파나마 운하 주변 항로를 끊임없이 공격했다. 이로 인해 각국 군대의 보급선이 어느 정도 영향을 받았다.
armygroup_event_desc_86=미국은 콜롬비아와 페루를 통해 브라질로 미사일 부품을 비밀리에 공수했다. 이 경로는 검은 전갈과 소련의 감시망을 성공적으로 피했다.
armygroup_event_desc_87=쿠바가 다시 공격을 받아 지역 균형이 또다시 깨졌다. 동시에 소련은 단기간에 쿠바에 대규모 군사 원조를 제공했다.
armygroup_event_desc_88=미국은 카리브해 동부 해역에 대규모 소나 배열을 배치하여 소련 잠수함을 감시했다.
armygroup_event_desc_89=소련이 지각 진동 원형기를 시험하다가 칠레, 볼리비아, 아르헨티나 접경 지역에 지진을 일으켰다. 통제 불가능성이 매우 높아 이 무기 연구는 결국 중단되었다.
armygroup_event_desc_90=소련은 쿠바에서 기상 무기 '폭풍의 눈'을 실험하여 허리케인을 성공적으로 플로리다로 유도해 현지에 피해를 입혔다.
armygroup_event_desc_91=검은 전갈 통제 지역의 여러 나라에서 검은 전갈을 반대하는 조직이 세운 라디오 방송국이 잇따라 등장했다. 이 방송국들은 점령지의 주민에게 단결하여 검은 전갈의 지배를 뒤엎으라고 계속 호소했다.
armygroup_event_desc_92=미국과 소련의 정찰 위성이 남미 지역을 전면적으로 탐사하는 것을 막기 위해, 검은 전갈은 여러 대양의 섬에 교란 기지를 세워 신호를 교란하고 미국과 소련 양국의 위성 데이터를 빼냈다.
armygroup_event_desc_93=영국군은 버뮤다 해역에서 제2차 세계대전 당시 독일 핵잠수함 노틸러스호를 발견했다. 이 U보트는 이후 미국이 건조한 노틸러스호와는 완전히 달랐다. 제2차 세계대전 중에 건조되었음에도 함정은 온전했고, 선내 장비의 기술 수준은 제2차 세계대전 시기를 훨씬 뛰어넘었고, 심지어 현대 기술 수준을 초월했다.
armygroup_event_desc_94=브라질 열대우림에서 거대한 유전이 발견되자, 미국, 소련, 검은 전갈은 페루-브라질 국경에서 채굴권을 두고 치열한 싸움을 벌였습니다.
armygroup_event_desc_95=검은 전갈 세력이 북미에서 쫓겨난 후, 미군은 검은 전갈 시설의 기술을 이용해 필라델피아 실험을 재개했다. 새로운 구축함 엘드리지호는 다시금 사람들 눈앞에서 사라졌다.
armygroup_event_desc_96=소련은 볼리비아에 '지구 망원경'을 건설하여 지구 중심을 탐사하다가 뜻밖에도 맨틀과 연결된 통로를 뚫고, 지하에 매장된 풍부한 자원을 성공적으로 채굴했다.
armygroup_event_desc_97=아마존 강 유역에서 갑자기 황열병이 발생하여 각국 부대의 전투력이 떨어졌다. 하지만 검은 전갈과 미국 및 소련 양국 군대에서는 감염 사례가 나타나지 않았다.

