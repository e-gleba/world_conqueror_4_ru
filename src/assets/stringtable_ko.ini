conquest_event_desc_1=중국군과 일본 침략군은 상하이 및 쑤저우강 일대에서 격전을 벌였다.
conquest_event_desc_2=중국군은 우한에서 일본 침략군에 맞서 굳건히 버티면서 곤경 속에서 중국군의 강한 저항 의지를 보여주었다. 이로부터 중국의 항일전쟁은 전략적 방어에서 전략적 대립 상태로 전환되었다.
conquest_event_desc_3=독일은 다병종 기동화 전격전 전술을 이용하여 1939년에 신속히 폴란드를 침공하였으며, 이로 인해 영국과 프랑스가 독일에게 선전포고를 하면서 제2차 세계 대전이 공식적으로 발발하였다.
conquest_event_desc_4=영국과 프랑스는 상대적으로 정체 상태를 유지하면서 선전포고만 하고 대규모 전투는 벌이지 않았다.
conquest_event_desc_5=소련과 일본 군대는 각각 몽골국과 위만주국을 대표하여 교전하였다.
conquest_event_desc_6=미국은 영국과 프랑스에 대량의 무기 원조를 제공하여 그들의 무기 장비에 중요한 지원을 제공했다.
conquest_event_desc_7=소련은 추운 겨울에 핀란드를 정복하려고 시도했고, 최종 승리를 거두었지만 엄청난 대가를 치렀다.
conquest_event_desc_8=독일은 노르웨이와 덴마크를 공격했다.
conquest_event_desc_9=루마니아의 풍부한 석유 자원은 독일에 전략적인 연료 지원을 제공했고, 추축국의 전투력에 큰 영향을 미쳤다.
conquest_event_desc_10=독일은 전격전 전술을 이용하여 저지대 국가를 침공하고, 네덜란드와 벨기에의 방어선을 빠르게 뚫었다.
conquest_event_desc_11=1940년 5월에 시작된 만슈타인 계획은 아르덴 숲을 가로질러 마지노선을 우회하여 영국-프랑스 연합군에 대한 포위를 형성했다.
conquest_event_desc_12=스웨덴은 제2차 세계대전 당시 독일에 고품질의 철광석을 대량으로 공급하여 추축국의 군사력 향상에 매우 중요한 역할을 했다.
conquest_event_desc_13=영국 수상이 된 처칠은 그의 리더십과 격려적인 연설로 영국의 저항 의지를 굳혔다.
conquest_event_desc_14=마지노선은 독일의 침공을 막아내지 못하여 프랑스 북부 전선이 붕괴되었다.
conquest_event_desc_15=파리의 함락은 프랑스의 패배를 상징하고, 서유럽 전선은 독일의 전면적인 승리로 끝났다.
conquest_event_desc_16=독일군의 포위 공격에 직면한 연합군은 됭케르크 해안에서 대규모 철수를 감행했는데, 이번 철수 작전에서는 군용과 민용 해상 통로를 통해 약 33만 명의 병사를 영국으로 수송하여 후속 반격을 위한 중요한 토대를 마련했다.
conquest_event_desc_17=1940년, 독일군은 영국을 본격적으로 침공하기 위한 '바다사자 작전' 계획을 수립하여 해상과 공중 공격을 통해 영국의 군사력을 파괴하려 했다.
conquest_event_desc_18=1940년에 영국 상공에서 벌어진 결정적인 공중전에서 영국 공군은 독일 공군의 침공을 성공적으로 막아내어 유럽 전장에서 연합군의 결정적인 승리를 이끌었다.
conquest_event_desc_19=독일 해군은 잠수함의 집단 협동 작전을 통해 적의 함대와 상선에 무차별 공격을 가하여 연합군 함대를 위협했다.
conquest_event_desc_20=제2차 세계대전 당시 대서양에서는 독일 잠수함이 이리떼 전술을 이용하여 연합군 함선을 공격하고, 연합군은 호위 및 대잠수함전을 펼치는 치열한 해전이 벌어졌다.
conquest_event_desc_21=
conquest_event_desc_22=독일, 이탈리아, 일본은 공동의 정치적 및 군사적 이익을 바탕으로 점차 협력을 강화하고 군사 동맹을 맺었다.
conquest_event_desc_23=일본이 태국을 침공한 후, 태국은 일본과 협력하기로 결정했으며, 후에 추축국에 본격적으로 가입했다.
conquest_event_desc_24=독일은 북아프리카에서 이탈리아군의 작전을 지원하여 영국군에 전면적인 위협을 가하기 위해 북아프리카에 군대를 파견하였다.
conquest_event_desc_25=1941년, 독일은 독소 불가침 조약을 파기하고 소련을 공식적으로 침공하면서 유럽 동부 전선의 전쟁이 시작되었다.
conquest_event_desc_26=스페인은 1941년에 독일 동부 전선에 청사단을 파견하여 소련의 바르바로사 작전에 참전한 독일을 지원하였다.
conquest_event_desc_27=포르투갈은 중립을 유지함으로써 무역 관계를 성공적으로 유지하고, 국가가 상대적인 안정을 유지할 수 있는 여건을 마련했다.
conquest_event_desc_28=미국과 영국의 지도자는 1941년에 대서양 헌장에 서명함으로써 제2차 세계대전에서 연합군의 공동 원칙을 세웠다.
conquest_event_desc_29=미공군 장군 셰놀 트가 조직한 미국 항공 의용대는 중국에서 플라잉 타이거스를 창설하여 중국·미얀마·인도 지역에서 일본의 침략을 막기 위한 항공 지원 임무를 수행하였다.
conquest_event_desc_30=소련의 도시 레닌그라드는 독일군에게 포위되었다.
conquest_event_desc_31=독일군이 모스크바를 침공하자 소련의 군인과 국민은 겨울의 혹한 속에서 독일군의 침공에 맞섰다.
conquest_event_desc_32=1941년 11월, 소련 모스크바의 붉은 광장에서는 열병식이 거행되었다. 수십만 명의 붉은 군대 병사와 장교들은 연단을 지나 소련 지도자들의 검열을 받은 후, 바로 서부 전선으로 진군했다.
conquest_event_desc_33=겨울의 혹독한 추위와 보급품 부족, 소련군의 단호한 저항은 독일군의 물자 소모를 가속시키고 사기를 떨어뜨렸다.
conquest_event_desc_34=1941년 12월, 일본 해군이 미국 태평양 함대를 기습 공격하여 미군의 일부 함대를 파괴함으로써 미국의 참전 의향을 자극하였으며 미국은 제2차 세계대전에 공식적으로 참전하게 되었다.
conquest_event_desc_35=진주만 공습 이후, 태평양 전쟁이 전면적으로 발발하자 미국과 동맹국들은 결국 섬돌격 전략을 통해 전선을 점차 일본 본토로 밀어붙여 결국 일본에 큰 타격을 입혔다.

