;活动相关
operation_rule_1=1. 이벤트 시나리오는 제한된 시간 동안 열립니다. 스테이지를 클리어하여 보상을 얻기 위해 지휘관님들께 시간을 합리적으로 배정하는 것을 권장합니다.
operation_rule_2=2. 시나리오는 보통 난이도와 어려움 난이도로 나뉘며, 어려움 난이도를 해제하려면 보통 난이도 시나리오를 클리어해야 합니다.
operation_rule_3=3. 어려움 난이도 시나리오에서 적군은 버프 2개(이벤트가 열릴 때부터 끝날 때까지 무작위 버프 2개)를 획득하므로 지휘관 여러분께서는 어려움 난이도 시나리오에 도전할 때 신중하게 계획해 주시기 바랍니다.
operation_rule_4=4. 현재 난이도의 시나리오에서는 각 스테이지에서 사망한 장군들은 다음 스테이지에 배치될 수 없으며, 진행 상황이 리셋된 후에만 장군들을 다시 배치할 수 있습니다.
operation_rule_5=5. 스테이지 승리 후 현재 난이도의 가장 높은 클리어 결과가 기록됩니다. 특정 스테이지를 클리어하면 보상을 받을 수 있습니다.
operation_rule_6=6. 스테이지 보상은 리본과 엘리트 부대 조각의 두 가지 유형으로 나뉘며 일정량의 보상을 수령하게 됩니다.
operation_rule_7_1=7. 진행 상황 리셋은 현재 난이도 시나리오의 클리어 진행 상황과 스테이지 보상만 리셋할 수 있습니다. 이벤트 기간 내 첫 리셋은 무료이며, 1회 한정으로 메달을 소모하여 진행 상황을 리셋할 수 있습니다. (어려움 난이도와 보통 난이도는 리셋 횟수를 공유합니다.)
operation_rule_7=7. 진행 상황 리셋은 현재 난이도 시나리오의 클리어 진행 리셋할 수 있습니다.

defensive_rule_1=1. 이벤트 시나리오는 제한된 시간 동안 열립니다. 스테이지를 클리어하여 보상을 얻기 위해 지휘관님들께 시간을 합리적으로 배정하는 것을 권장합니다.
defensive_rule_2=2. 시나리오는 보통 난이도와 어려움 난이도로 나뉘며, 어려움 난이도를 해제하려면 보통 난이도 시나리오를 클리어해야 합니다.
defensive_rule_3=3. 어려움 난이도 시나리오에서 적군은 버프 2개(이벤트가 열릴 때부터 끝날 때까지 무작위 버프 2개)를 획득하므로 지휘관 여러분께서는 어려움 난이도 시나리오에 도전할 때 신중하게 계획해 주시기 바랍니다.
defensive_rule_4=4. 모든 미션 크리티컬 영역을 지켜야 승리할 수 있습니다. 해당 스테이지의 패배, 승리에 관계없이 현재 난이도의 가장 높은 방어 턴이 기록되며, 특정 방어 턴을 달성하면 해당 단계 보상을 받을 수 있습니다 (모든 적군이 제거되면, 전체 단계 보상이 획득 가능해집니다).
defensive_rule_5=5. 스테이지는 반복 플레이가 가능하지만, 스테이지 전투 도중 종료하면 최고 방어 턴이 기록되지 않습니다.
defensive_rule_6=6. 단계 보상은 리본과 엘리트 부대 조각의 두 가지 유형으로 나뉘며 일정량의 보상을 수령하게 됩니다.

