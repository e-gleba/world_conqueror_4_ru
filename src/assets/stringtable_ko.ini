event_4105=릴 공방전
event_4106=시드니 하버 공격

event_intro_490=독일 군사 산업의 철광석 공급을 확보하기 위해 1940년 4월 9일 새벽, 독일군은 "베저위붕 작전"을 개시했다. 덴마크는 개전 직후 항복했다. 노르웨이는 지형적 이점과 연합군 지원에도 불구하고 6월 10일 함락되었다. 이 전역으로 독일은 북해와 발트해의 전략적 요충지를 장악해 스칸디나비아 철광석 수송로를 완전히 확보했다.
event_intro_491=나르비크는 스웨덴 철광석 수송의 핵심인 북대서양 부동항이었기에 노르웨이 전역 시작 후 연합군과 독일군이 치열한 쟁탈전을 벌였다. 1940년 4월 9일 독일은 나르비크를 점령했다. 영국군은 즉시 탈환을 시도해 4월 10일과 13일 해전이 발생했다. 그러나 지상전 준비 부족으로 영국군은 독일 함정 여러 척을 격침시켰지만 항구 점령에는 실패했다.
event_intro_492=1945년 4월 16일, 소련군은 3개 주력 전선군을 집결시켜 베를린에 마지막 공세(베를린 전투)를 개시했다. 베를린에 고립된 독군 지도부는 완강히 저항했으나 소련군 포격으로 방어선이 붕괴되었다. 4월 30일, 퓌러러 벙커에서 총성이 울렸다. 이틀 후 베를린 방위사령관 바이틀링이 항복 문서에 서명하며 제3제국은 완전히 멸망했다.
event_intro_493=진주만 공습 이후 침체된 미국 국민의 사기를 고취하기 위해 1942년 4월 18일, 16대의 B-25 폭격기가 항공모함 '호넷'에서 이륙하여 도쿄 등 도시를 성공적으로 공습한 후, 1대는 소련에 불시착하고 나머지는 중국 저장성 등지에 낙하산으로 탈출하거나 불시착했다. 이 작전은 큰 피해를 주지는 못했지만, 일본 군부를 뒤흔들었다.
event_intro_494=1943년 4월 22일, 북아프리카의 마지막 추축국 거점을 제거하기 위해 연합군은 불칸 작전을 개시했다. 영국군은 튀니스를, 미군은 비제르트로 진격했다. 독일-이탈리아군은 산악 요새에 의지하여 완강히 저항했지만, 보급 부족과 절대적인 제공권 열세로 인해 5월 6일에 방어선이 붕괴되었고, 결국 5월 13일에 25만 명이 항복했다. 이 승리로 지중해 항로의 위협이 제거되었고, 연합군은 두 달 후 허스키 작전을 개시할 수 있었다.
event_intro_495=1943년 9월, 이탈리아가 항복한 후, 독일군은 에게해 제도의 방어를 전면적으로 맡게 되었다. 노르망디 상륙 작전을 위한 전략적 기만술을 수행하기 위해 영국 왕립 해군의 특수주정임무대(SBS)는 산토리니 섬을 급습하여 독일군 해안 관측소와 무선 중계 시설을 파괴했다. 이 작전은 독일군의 에게해 해상 감시 체계를 교란시켰고, 독일군이 섬에 추가 병력을 배치하도록 유도하여 지중해 전선의 주력 작전을 간접적으로 지원했다.
event_intro_496=1944년 4월 28일, 노르망디 상륙 작전 연습 중, 연합군 내부 통신 장애로 인해 독일군 E-보트 9척이 라임 만에서 연합군 T-4 호송대를 성공적으로 급습했다. 이로 인해 LST 상륙함 2척이 침몰하고 1척이 심각한 손상을 입었으며, 최소 749명이 사망했다. 이는 노르망디 상륙작전 이전, 단일 사건으로 가장 많은 연합군 사상자가 발생한 사건이었다. 이 비극적인 교훈 이후, 연합군은 통신 주파수를 통일하여 노르망디 상륙 작전 시 지휘 및 조율에 결정적인 역할을 했다.
event_intro_497=보르네오 전투는 연합군이 남서태평양 전역에서 수행한 마지막 대규모 작전이다. 1945년 5월 1일부터 7월 21일까지, 호주 제1군은 일본군의 연료 공급을 차단하기 위해 타라칸, 브루나이 만, 발릭파판에 단계적으로 상륙하여 유전과 공항을 점령하려 했다. 그러나 연합군의 사전 폭격으로 인해 섬의 기반 시설이 심각하게 파괴되었고, , 전투가 시작될 당시 일본군의 주력은 이미 전략적으로 후퇴한 상태였기 때문에 실제 군사적 효과는 제한적이었다.
event_intro_498=남태평양에서의 전략적 주도권을 장악하기 위해, 일본군은 MO 작전을 개시하여 해상에서 포트모르즈비를 공격하려 했다. 이 정보를 입수한 미군은 제17, 제11 혼성 기동 함대를 파견하여 일본군을 저지했다. 그 결과, 1942년 5월 4일, 역사상 최초의 항공모함 대결인 산호해 해전이 발발했다. 이 전투에서 미군은 상륙 부대를 엄호하던 경항공모함 쇼호호를 격침하고, 쇼카쿠호에 심각한 피해를 입혔다. 일본군은 미군 항공모함 렉싱턴호를 격침하고, 요크타운호를 심각하게 손상시켰다. 전술적으로는 양측의 손실이 비슷했지만, 연합군은 일본군의 작전 목표를 분쇄하고 전략적 승리를 거두었다.
event_intro_499=1940년 5월 10일, 독일군은 '만슈타인 계획'을 시작하여 B집단군은 네덜란드와 벨기에 중부로 양동 작전을 수행하며 연합군을 유인했고, A 집단군의 주력은 아르덴 숲을 통과하여 연합군 방어선의 약점을 직접 공략했다. 이에 대응해 연합군은 'D 계획'에 따라 프랑스 제1집단군과 영국 원정군을 딜 강-브레다 방어선에 배치했다. 그러나 독일 제19기갑군은 5월 14일에 스당을 돌파한 후, 서쪽으로 급속히 진격하여 35만 명의 연합군을 포위하는 데 성공했다. 벨기에 국왕 레오폴드 3세는 교통 요충지를 모두 잃고 방어선이 붕괴되자 5월 28일에 단독 항복을 선언했다.
event_intro_4100=1942년 5월 12일, 소련군은 겨울 반격의 성과를 확대하기 위해 제2차 하르키우 공방전을 개시했다. 초기에는 하르키우 교외까지 진격하는 데 성공했으나, 남쪽 측면의 방어가 약했기 때문에 5월 17일에 독일군은 '프리드리히 작전'을 실행하여 남북에서 소련군을 협공했다. 3일 만에 24만 명의 소련군이 포위되었고, 5월 28일까지 20만 명의 손실로 남쪽 전선이 붕괴되었다. 독일군은 이를 계기로 6월에 '청색 작전'을 개시하여 코카서스를 직접 공격했다. 따라서 이 전투는 소련-독일 전선의 전략적 분수령이 되었다.
event_intro_4101=1941년 5월 15일, 영국군은 리비아 살룸 방어선을 급습하여 하파야 고개와 카푸초 요새를 잠시 점령했다. 그러나 독일군은 신속하게 증원군을 투입해 반격하여 요새를 탈환하였으며, 5월 27일에 하파야 고개를 탈환하여 연합군은 '배틀액스 작전'을 통해 하파야 고개를 다시 점령해야 했다.
event_intro_4102=1941년 5월 20일, 독일군은 발칸 반도에 대한 연합군의 공습 위협을 차단하기 위해 크레타 섬을 점령하는 역사상 최초의 대규모 공수 작전인 '수성 작전'을 개시했다. 약 1만 3천 명의 독일 공수부대와 산악 사단이 섬 내 세 곳의 공항을 강습했지만, 영국 연방 및 그리스 수비군의 완강한 저항에 부딪혔다. 이 전투에서 독일군은 전략적 목표를 달성했지만, 공수부대의 막대한 손실로 인해 이후 유사한 작전을 중단했지만, 이는 연합군의 후속 공수 작전에 중요한 경험을 제공했다.
event_intro_4103=1940년 5월 22일, 독일 제10기갑사단은 칼레를 포위 공격했다. 4천 명의 수비군은 결사항전을 펼치면서 26일까지 독일군과 치열하게 싸웠다. 부상병 200명을 제외한 나머지 부대는 모두 전사하거나 포로로 잡혔다. 이 전투는 독일군을 3일 동안 성공적으로 저지하여 됭케르크 방어선을 강화하고 '다이너모 작전'을 준비할 시간을 확보했다.
event_intro_4104=1940년 5월, 독일군은 개정된 '황색 작전'을 통해 스당 방어선을 돌파하고, 30만 명이 넘는 연합군의 북쪽 측면 병력을 플랑드르 지역에 포위했다. 독일군의 포위 공격을 방지하기 위해 연합군은 '다이너모 작전'을 개시하여 단 9일 만에 됭케르크에서 33만 8천 명을 긴급 철수 시켜 후속 반격을 위한 불씨를 남겼다.
event_intro_4105=1940년 5월 28일, 독일군은 릴의 프랑스 제1군단 4만 명을 포위했다. 릴 수비군은 완강히 저항하며 심지어 독일군 중장을 포로로 잡는 성과까지 거두었지만, 결국 6월 1일에 항복했다. 이 전투는 독일군 7개 사단의 병력을 효과적으로 저지하여 됭케르크 철수에 소중한 시간을 확보했기에 연합군은 최소 10만 명을 추가로 철수시킬 수 있었다.
event_intro_4106=1942년 5월 31일부터 6월 8일까지, 일본군은 오스트레일리아와 미국 간의 전략 물자 수송선을 차단하기 위해 잠수함 부대를 파견하여 시드니 하버에 여러 차례 급습을 가하고, 연합군 함선을 집중적으로 공격했다. 9일간의 작전 결과 일본군은 해군 보급함 한 척만 격침했지만, 이번 습격 이후 호주군은 항구 방어 체계를 대대적으로 강화하고, 태평양 후반 작전에 방어 경험을 제공했다.

dialogue_3016=당신들은 공격이 용기의 표현이라고 생각하지만, 진정한 용기는 적이 눈앞에 있다는 것을 알면서도 침착하게 한 발 한 발 총알을 쏘는 것이다.
dialogue_3017=적의 병력과 화력은 확실히 강력하지만, 우리의 의지는 그들보다 훨씬 더 강인하다. 우리가 지키는 이 땅에는 핀란드의 자부심과 존엄이 깃들어 있다.
dialogue_3018=그들의 방어선은 견고해 보이지만, 우리에겐 결의와 신념이 있다. 우리는 후퇴의 벼랑 끝에 서 있는 것이 아니라, 새로운 역사의 출발점에 서 있는 것이다!
dialogue_3019=우리의 계획은 예상치 못한 저항에 부딪혔다. 장기전에 빠지는 것을 피하기 위해 전략 조정을 고려해야 한다.
dialogue_3020=영국과 프랑스는 우리를 보호하겠다고 했고, 소련은 우리를 침략하지 않겠다고 했다. 정말 웃기는 소리이다.
dialogue_3021=소련-폴란드 불가침 조약은 소련에게 그저 휴지조각이나 다름없다. 그들은 독일인보다 더 교활한 자들이다. 우리가 서부 전선에서 무너질 때까지 기다렸다가 뒤통수를 칠 것이다.
dialogue_3022=소련이 '불가침'의 개념을 새롭게 정의해줘서 고맙다. 그들은 공격하고 싶을 때까지 우리를 공격하지 않을 것이다. 앞으로 누가 소련이 말하는 '평화'를 믿겠는가?
dialogue_3023=프랑스가 10년을 들여 건설한 방어선을 우리는 단 10일 만에 우회했다.
dialogue_3024=모든 전술 계획에서 이 상황은 고려되지 않았다... 우리는 완전히 속았다. 우리는 계속 잘못된 곳을 방어하고 있었다!
dialogue_3025=우리는 이미 시간을 잃었다. 더 이상 용기까지 잃어서는 안 된다. 모든 부대는 즉시 집결하여 전선을 지켜라. 반드시 그들을 견제해야 한다. 우리는 아직 싸울 수 있다. 프랑스는 쉽게 무너지지 않는다!

skill_name_152=하늘을 나는 독수리
skill_name_153=공군 전술 마스터
skill_name_154=자강불식
skill_name_155=소모 전술

skill_info_152=공중 부양 유닛 지휘 시 회피율 +[#00FF00#%d%%], 이동력 +4, 적 공군의 공격으로 받는 피해 30%% 감소. 공중 부양 유닛이 공격 시, 회피율 1%%당 치명타 데미지 1%%증가.
skill_info_153=공군 지휘권(공수부대 제외)과 미사일 소모량을 20%% 감소시킨다.공군 및 미사일을 지휘하여 공격 후, '단계적 공세' 획득. 공군 및 미사일 공격 시 적 방어력 [#00FF00#%d%%] 무시, 최종 방어력 20 미만인 적에게 반드시 치명타 발동(핵폭탄 무효). 턴 종료 시 효과 제거됨.
skill_info_154=지휘하는 부대의 주변 1칸 내에 적이 없을 시 경제 및 공업 수입 +[#00FF00#%d].
skill_info_155=지휘하는 부대 공격 후, 대상 및 그 주변 1칸 내 2개 적군이 [#00FF00#%d%%] 확률로 '피로' 상태에 빠지고, 1턴 동안 지속. '피로' 상태에 빠진 부대는 공격 및 공습을 받을 때 HP가 추가로 6%% 감소하고, 사기가 낮아짐. '피로' 효과는 이미 사기 혼란 상태에 빠진 부대에 적용되지 않음.

army_buff_desc_1461=단계적 공세: 공군 또는 미사일을 지휘하여 공격 시 적군 방어력 15% 무시, 최종 방어력이 20 미만인 적에게 반드시 치명타 발동.
army_buff_desc_1462=단계적 공세: 공군 또는 미사일을 지휘하여 공격 시 적군 방어력 30% 무시, 최종 방어력이 20 미만인 적에게 반드시 치명타 발동.
army_buff_desc_1463=단계적 공세: 공군 또는 미사일을 지휘하여 공격 시 적군 방어력 45% 무시, 최종 방어력이 20 미만인 적에게 반드시 치명타 발동.
army_buff_desc_1464=단계적 공세: 공군 또는 미사일을 지휘하여 공격 시 적군 방어력 60% 무시, 최종 방어력이 20 미만인 적에게 반드시 치명타 발동.
army_buff_desc_1465=단계적 공세: 공군 또는 미사일을 지휘하여 공격 시 적군 방어력 75% 무시, 최종 방어력이 20 미만인 적에게 반드시 치명타 발동.
army_buff_desc_1471=피로: 공격 또는 공습 받을 시 HP 6% 추가 감소, 사기 하락. 단, 피로 효과는 이미 사기 혼란 상태에 처한 부대에 적용되지 않음.

