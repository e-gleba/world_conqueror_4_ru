event_stage_intro_20201=연합군의 포위망은 우리의 경제와 전략적 자원을 완전히 봉쇄하였다. 이런 상황이 오래 지속된다면 제국은 소모전에서 미국에게 패배할 것이다. 전쟁이 불가피하게 되었으니 선제공격을 하는 것이 상책이다. 공습으로 진주만의 미군 태평양 함대를 무력화하라.
event_stage_intro_20202=Z 작전'의 성공은 남방 전장의 장애물을 제거했다.
event_stage_intro_20203=필리핀에 있는 미군은 훈련이 부족하고, 무기도 장비도 부족하다. 우리는 여러 지역에서 상륙 작전을 실시하여 적을 남북으로 분산시킬 것이다. 항공 함대가 상륙 작전을 지원할 것이다.
event_stage_intro_20204=동인도는 자원이 매우 풍부한데, 연합군의 연합 함대는 이곳에 병력을 집결하고 있다.
event_stage_intro_20205=연합군의 함대는 남태평양에서 연이어 패퇴했다. 그들은 모르즈비 항을 반격의 지점으로 삼아 병력을 계속 집결시키고 있다.
event_stage_intro_20206=미군은 산호해에서 우리의 공격을 막았고, 해상 방어를 강화했다. 현재의 목표는 여전히 모르즈비항을 점령하는 것이다. 그리고 방어가 취약한 뉴브리튼을 점령하고 라에 쪽으로 진군하여 육로로 최종 공격을 개시하라.
event_stage_intro_20207=태평양 방위권이 드디어 완성되어 미군은 본토로 물러날 수밖에 없다.
event_stage_intro_20211=연합군의 포위망은 우리의 경제와 전략적 자원을 완전히 봉쇄하였다. 이런 상황이 오래 지속된다면 제국은 소모전에서 미국에게 패배할 것이다. 전쟁이 불가피하게 되었으니 선제공격을 하는 것이 상책이다.
event_stage_intro_20212=Z 작전'의 성공은 남방 전장의 장애물을 제거했다.
event_stage_intro_20213=필리핀에 있는 미군은 훈련이 부족하고, 무기도 장비도 부족하다. 우리는 여러 지역에서 상륙 작전을 실시하여 적을 분산시킬 것이다. 항공 함대가 상륙 작전을 지원할 것이다.
event_stage_intro_20214=동인도는 자원이 매우 풍부한데, 연합군의 연합군의 연합 함대는 이곳의 가장 큰 위협이다.
event_stage_intro_20215=연합군의 함대는 남태평양에서 연이어 패퇴했다. 그들은 모르즈비 항을 반격의 지점으로 삼아 병력을 계속 집결시키고 있다.
event_stage_intro_20216=미군은 산호해에서 우리의 공격을 막았고, 해상 방어를 강화했다. 현재의 목표는 여전히 모르즈비항을 점령하는 것이다. 방어가 취약한 뉴브리튼을 점령하고 그곳에서 라에 쪽으로 진군하여 육로로 최종 공격을 개시하라.
event_stage_intro_20217=태평양 방위권이 드디어 완성되어 미군은 본토로 물러날 수밖에 없다.

dialogue_2462=첫 번째 공격은 성공을 거두었다! 그러나 우리는 항구에서 미군의 항공모함을 발견하지 못했다.
dialogue_2463=미군의 항공모함을 발견했다! 우리 함대는 제3차 공격을 개시하여 전력을 다해 그들을 섬멸할 것이다!
dialogue_2464=적 전투함을 격침시켜 적 해군을 완전히 마비시켜라. 남방 작전의 순조로운 진행을 보장하라.
dialogue_2465=항공 모함 전투군이 귀항 중이다! 신속히 방어를 조직하고, 수시로 반격할 준비를 하라.
dialogue_2466=반격은 지금부터 시작이다! 일본군이 세 번째 공격의 대가를 치르게 하라.
dialogue_2467=처음 두 차례의 공격은 항구 내 미군에게 큰 타격을 입혔지만, 우리도 어느 정도 손실을 입었다.
dialogue_2468=일본군은 말라야 북부에서 집결을 완료했다.
dialogue_2469=항공대의 공격이 효과적이어서 프린스 오브 웨일스호는 더 이상 도망갈 곳이 없게 되었다! 전속력으로 전진하라!
dialogue_2470=프린스 오브 웨일스호가 침몰했다! 남은 영국 해군을 격파하고, 말라야 주변 해역을 장악하라.
dialogue_2471=나는 이 영국인들을 포로로 잡을 시간이 없다.
dialogue_2472=우리는 일본군의 추진 속도를 심각하게 과소평가했다. 싱가포르 북부의 방어선은 우리의 마지막 장벽이다.
dialogue_2473=싱가포르가 바로 눈앞에 있다. 주변 해역을 봉쇄하여 적의 퇴로를 차단하면, 우리 육군 부대는 적에게 최후의 일격을 가할 것이다.
dialogue_2474=싱가포르가 함락되었다. 우리는 실패했다.
dialogue_2475=정찰기가 주변 해역에서 적군의 대규모 함대를 발견했다. 내가 영국군의 공격을 지연시킬 테니 신속히 적 함대의 퇴로를 차단해 주십시오.
dialogue_2476=육군 부대가 루손 서안과 마닐라 동남 해역에서 상륙할 것이다. 내 항공 함대는 해상의 장애물을 제거할 것이다.
dialogue_2477=일본군은 여러 곳에서 상륙 작전을 전개했다. 나는 마닐라 북부를 지킬 것이니, 즉시 루손 북부의 우군을 지원할 예비부대를 소집하라.
dialogue_2478=일본군의 공세가 맹렬하다. 이제 마닐라 쪽으로 후퇴하여 방어선을 재정비해야 한다.
dialogue_2479=마닐라 북부의 방어선이 곧 뚫릴 것이다.
dialogue_2480=나는 바탄을 떠났지만, 꼭 돌아올 것이다.
dialogue_2481=맥아더가 철수했다. 남은 미군도 모래알처럼 응집력이라고는 전혀 없을 것이다.
dialogue_2482=라몬 만의 군대가 상륙을 완성했다.
dialogue_2483=나는 최대한 빨리 상륙을 끝내고 발릭파판을 점령할 것이다. 나의 부대를 지원하여 보르네오의 연합군을 소탕해 주십시오.
dialogue_2484=함대를 신속히 집결하여 일본군이 자바해에 침입하기 전에 그들을 막아라.
dialogue_2485=미국, 영국, 네덜란드, 호주의 연합 함대가 이미 자바 해에 집결했다.
dialogue_2486=우리는 네덜란드군이 보르네 섬에 배치한 방어선을 완전히 파괴하였다. 해군과 협력하여 자바해의 적함을 소탕하고, 수라바야와 자카르타로 진격하라.
dialogue_2487=보르네오의 수비군은 연이어 패퇴하고 있다. 자바해는 수마트라 섬과 자바 섬을 지키는 마지막 방어선이다.
dialogue_2488=우리는 연합함대의 주력을 격침했다. 나머지 함선들도 오합지졸에 불과하다.
dialogue_2489=연합군의 실패는 이미 확정된 상태이다. 동인도의 자원 채굴을 위해 준비하라.
dialogue_2490=일본군의 최종 목표는 모르즈비항이다.
dialogue_2491=미군은 이미 우리의 행동을 발견했다. 즉시 연합함대를 집결시켜 산호해에서 적과 결전을 벌여라.
dialogue_2492=우리는 솔로몬 제도를 완전히 장악했다. 과달카날 섬의 공항을 거점으로 공군 지원을 제공하라.
dialogue_2493=특수 기동 함대가 도착했다. 우리의 기존 역량을 재통합하여 반격을 조직하라.
dialogue_2494=미군은 일찍이 눈치챘다.
dialogue_2495=전속력으로 전진하라! 전과를 계속 확대하라!
dialogue_2496=일본군 함대가 너무 빠르다! 철수는 유일한 출로이다.
dialogue_2497=우리는 적의 공격을 막지 못했다.
dialogue_2498=라바울이 함락되었다.
dialogue_2499=섬 위의 수비군은 붕괴하기 시작했다. 나는 라에 동쪽 해역을 봉쇄하여 연합군의 퇴로를 차단할 것이다.
dialogue_2500=적 해군이 뉴브리튼 전역을 포위했다! 뉴브리튼 방어군의 질서 있는 후퇴를 위해 더 많은 지원군이 필요하다.
dialogue_2501=우리는 뉴기니에 성공적으로 발판을 마련했다. 이제 최우선 목표는 코코다 오솔길을 장악하는 것이다.
dialogue_2502=코코다 오솔길 주변은 지세가 복잡하고 행군이 어렵다. 조심하고 무모하게 돌진하지 않도록 주의하라.
dialogue_2503=우리는 뉴브리튼 남부 해역에 대한 통제력을 조금씩 잃고 있다. 동부 해안의 방어를 강화하여 일본군에게 아무런 기회도 주지 말아라.
dialogue_2504=일본군은 코코다를 점령하고, 모르즈비항을 향해 진군하고 있다.
dialogue_2505=진지를 굳게 지키고 적의 공격을 막아라. 내 지원군이 곧 도착할 것이다!
dialogue_2506=적의 핵무기 개발이 거의 완성 단계에 이르렀다. 미국의 막강한 산업력을 감안할 때 대량 생산이 시작된다면 현재의 세계 질서에 큰 변화를 가져올 수도 있다.
dialogue_2507=각 함대는 육군의 상륙 작전을 지원하고, 적군 해안 방어선의 방어 진지를 우선적으로 제거하라.
dialogue_2508=일본군 상륙 부대가 밴쿠버 서안에 나타났다. 우리는 더 많은 지원이 필요하다.
dialogue_2509=로스앤젤레스도 공격 받았다. 즉시 지원군을 파견하라.
dialogue_2510=우리는 일본군의 캘리포니아 상륙을 성공적으로 막았다. 그러나 적의 후속 지원을 주의하라.
dialogue_2511=방어에만 의존한다면 소모전에서 패배할 것이다.
dialogue_2512=폭발 시험은 성공적이었지만, 단기간에 대규모 생산은 불가능 하다.
dialogue_2513=서해안의 육군을 막아라. 우리의 연구 결과를 보호하라.

dialogue_2514=추축국의 퇴로는 곧 차단될 것이다. 튀니지로 진군하여 그들을 아프리카 대륙에서 몰아내라!
dialogue_2515=제2군단의 작전은 실패했다. 무모하게 진격하여 적의 함정에 빠지지 않도록 주의하라.
dialogue_2516=독일군의 정면 방어가 매우 견고하다. 해상 병력을 활용하여 돌파구를 찾아야 한다. 영국군도 우리를 도와줄 것이다.
dialogue_2517=적군 해안선의 돌파구를 찾아 단숨에 이 섬에 상륙하라.
dialogue_2518=독일군은 이탈리아 본토로 철수하려는 망상을 하고 있다. 그들을 놓치지 말아라.
dialogue_2519=병사들이여, 전례 없는 규모의 상륙작전이 곧 시작될 것이다. 무한한 영광이 당신들을 맞이할 것이다.
dialogue_2520=연합군이 왜 여기에 나타났을까? 젠장, 정보가 틀린 것 같다. 적군을 요격할 준비를 하라!
dialogue_2521=적군의 해안 부대가 약하다.
dialogue_2522=연합군의 상륙을 막아라. 모든 병력을 집결시켜 해상에서 그들을 요격하라!
dialogue_2523=적의 해안 방어선은 상당히 견고하다.
dialogue_2524=리옹을 점령하라. 우리는 곧 이 전투의 승리를 거둘 것이다.
dialogue_2525=루르는 독일 서부의 중요한 공업 지역이다. 그곳을 점령하면 우리는 이 전쟁에서 엄청난 우위를 점하게 될 것이다.
dialogue_2526=남북 양쪽에서 적의 후방으로 우회하여 적의 퇴로를 차단하라.
dialogue_2527=우리는 남부의 미군과 협력하여 협공을 수행할 것이다.
dialogue_2528=바로 지금이다! 포위망을 조여라. 적은 독 안에 든 쥐 신세가 되었다.
dialogue_2529=지휘관님, 우리를 이끌고 계속 전진하여 반도 서쪽에 주둔하고 있는 소련군을 제거하게 해주십시오.
dialogue_2530=우리는 세바스토폴 요새를 제외한 크림 반도 전체를 장악했다.
dialogue_2531=적의 해상 보급이 차단되었다. 우리는 이 소모전에서 우위를 점하게 될 것이다.
dialogue_2532=구스타브의 포격으로 길을 열어라!
dialogue_2533=최고 사령부는 레닌그라드를 점령하기로 결정했다. 이것은 격렬한 전투가 될 것이다. 핀란드 군대는 북쪽에서 우리를 도와 공격할 것이다.
dialogue_2534=우리는 병력을 빼돌리는 위험을 감수해야 한다.
dialogue_2535=동쪽으로 진격하여 적의 병력을 끌어들여 제6집단군이 포위망을 뚫을 수 있도록 시간을 쟁취해야 한다.
dialogue_2536=총공격을 개시하여 일거에 스탈린그라드를 점령하라. 승리가 눈앞에 있다.
dialogue_2537=어떤 대가를 치르더라도 소련으로부터 하르키우를 탈환해야 한다.
dialogue_2538=적의 선두 부대는 너무 깊이 침투했다. 그들을 포위할 절호의 기회이다.
dialogue_2539=기갑 부대의 기동성을 이용해 소련군의 측면을 공격하여 적의 보급선을 차단하라.
dialogue_2540=지휘관님, 우리를 이끌고 남쪽에서 소련군 방어선을 점진적으로 돌파하십시오.
dialogue_2541=적의 저항이 점점 더 거세지고 있다. 병사 들이여, 방심하지 말아라.
dialogue_2542=북쪽의 집단군은 우리의 지원이 필요하다. 그들을 잃으면 우리는 쿠르스크에 대한 견제력을 완전히 잃게 될 것이다.

