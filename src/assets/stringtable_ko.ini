elite_intro_91=트럭 섀시를 기반으로 개발된 M-142 하이마스 로켓포는 뛰어난 기동성, 정밀 타격 능력, 신속한 전개 등 특성으로 현대 전장에서 가장 위협적인 무기 시스템 중 하나로 자리 잡았다. 이 시스템은 다양한 로켓탄을 발사할 수 있으며, 신속 대응 부대를 지원해 원거리 정밀 타격 임무를 수행하는 데 널리 사용되고 있다. 뛰어난 전장 적응성을 갖춘 하이마스는 현대 전쟁에서 결정적인 역할을 하고 있다.

