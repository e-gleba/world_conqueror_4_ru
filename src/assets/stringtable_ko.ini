general_stage_name_141=엘 알라메인 전투
general_stage_name_142=시칠리아 상륙작전
general_stage_name_143=노르망디 상륙작전
general_stage_name_144=마켓가든 작전
general_stage_name_145=아르덴 전투

general_stage_intro_141=1942년 10월,'폭스 헌터' 몽고메리 장군의 지휘로 연합군은 독일군의 방어선을 뚫고, 이집트 북부에서 일련의 중요한 승리를 거두었다. 엘 알라메인 전투는 제2차 세계대전 중 북아프리카 전선의 전환점이며, 연합군이 북아프리카에서 독일군을 몰아내는 초석이 되었다.
general_stage_intro_142=1943년, 연합군은 시칠리아 섬에서 대규모 해상 상륙작전을 실시하여 신속히 섬을 점령하고, 독일군을 몰아냈다. 이번 작전은 이탈리아 해방의 초석이 되었으며, 지중해 전투 지역에서 연합군의 중요한 승리를 상징한다.
general_stage_intro_143=최고 사령관 중 한 명인 몽고메리는 연합군을 이끌고 프랑스의 노르망디에서 대규모 상륙작전을 지휘했다. 연합군은 공수, 해상 상륙, 지상 추진 등을 통해 교두보를 구축하고 독일군 방어선을 돌파하여 유럽 해방의 중요한 발판이 되어 주었다.
general_stage_intro_144=연합군은 네덜란드의 중요한 다리를 점령하고 신속히 독일 내륙으로 진군하였으며, 대규모 공수작전과 지상부대와의 협력 작전을 펼쳤다. 그러나 예상치 못한 상황과 독일군의 강력한 저항으로 과연 어떤 시련이 그들을 기다리고 있을까?
general_stage_intro_145=1944년 말, 독일군은 혹독한 추위 속에서 공세를 펼치며 연합군의 보급선을 끊으려 했다. 그러나 연합군은 진지를 굳게 지키며 반격에 나섰고, 결국 독일군을 궁지로 몰아넣어 다음 단계의 진격을 위한 기반을 바련했다.

dialogue_2401=서둘러 진격하라! 영국군이 도착하기 전에 노르웨이의 방어군을 물리쳐라.
dialogue_2402=적은 우리를 분열시키고 포위하려고 한다. 그들의 봉쇄를 뚫고 작전을 막아라.
dialogue_2403=그리스 원군은 지상에서 우리와 함께 공격할 것이다. 독일군을 그리스에서 완전히 몰아내라.
dialogue_2404=해군과 협력하여 적의 원군을 물리치고, 해상에서 그들을 섬멸하라.
dialogue_2405=내가 적 기갑 부대의 첫 번째 공세를 막을 테니 적군의 원군을 즉시 막아라.
dialogue_2406=미군은 맥아더의 철수를 엄호하기 위해 우리에게 공격을 가했다.
dialogue_2407=측면의 적 함대를 조심하고, 적군 주력 부대의 철수를 막아라.
dialogue_2408=일본 육군의 공격을 막아내고, 뉴기니의 거점을 지키는데 전력하라.
dialogue_2409=일본군은 이미 물러설 길이 없다. 전속력으로 전진하라! 그리고 적 함대의 주력부대를 섬멸하라!
dialogue_2410=나토(NATO)군이 상륙하는데 성공했다! 적이 해상에서 두 번째 공세를 펼칠 수도 있으니 조심하라.
dialogue_2411=적이 아시아에서 발을 붙이게 할 수는 없다. 그들의 항공모함 군단을 소멸하라.
dialogue_2412=적의 기갑 부대가 남, 북 양쪽에서 진격을 개시했다. 우리는 지원이 필요하다.
dialogue_2413=적군은 우리 뒷마당에 대규모 미사일 기지를 건설했다.
dialogue_2414=적의 함대를 막아내고, 적의 미사일 기지가 우리에 대한 위협을 철저히 제거하라.
dialogue_2415=핀란드 군대가 우리를 기습했다. 지원군이 도착할 때까지 견지하자!
dialogue_2416=우리는 적군의 북아프리카 보급선을 차단했다. 동쪽으로 진격하여 독일군의 방어선을 압축하라.
dialogue_2417=독일군이 대서양을 봉쇄했다. 그들은 곧 우리의 본토를 전면적으로 공격할 것이다.
dialogue_2418=서부 전선의 연합군은 여러 겹의 방어선을 돌파했다. 우리에게는 더 이상 물러설 길이 없다.
dialogue_2419=적이 공격하기 전에 선제공격으로 그들을 기습하라!
dialogue_2420=우리는 영국군에게 포위당했다. 최대한 빨리 적의 봉쇄선을 뚫고 원군과 합류하자.
dialogue_2421=새로운 부대를 신속히 집결시켜라. 우리는 전력으로 영국군의 진격을 막을 것이다.
dialogue_2422=일본군은 우리와의 정면 충돌을 포기했다. 현재 그들은 두 방향에서 우리의 후방으로 침투하고 있다.
dialogue_2423=적의 기습을 막아라. 우리 기갑 부대는 눈앞의 모든 장애물을 없앨 것이다.
dialogue_2424=우리는 소련군에게 포위당했다. 진지를 굳건히 지키고, 해군의 지원을 기다려라.
dialogue_2425=동맹국들을 도와 소련군의 공격을 막아라. 나는 이 틈을 타 계속 빨리 추진할 것이다.
dialogue_2426=미군은 모든 병력을 집중하여 우리와 결전을 벌이려고 한다. 지금이야말로 적군을 철저히 섬멸할 수 있는 절호의 기회이다. 우리는 무적이다.
dialogue_2427=우리는 더 이상 물러설 길이 없다. 지원군이 도착할 때까지 전력을 다해 버텨내자.
dialogue_2428=프랑스군은 아직 저항을 포기하지 않았다. 적 함대의 주력을 섬멸하고, 연합군을 지중해에서 몰아내자.
dialogue_2429=독일군은 더 이상 우리의 상륙을 막을 힘이 없다. 전속력으로 진군하여 유럽 전체를 해방시키자.
dialogue_2430=영국군 함대가 기세등등하게 다가오고 있다. 우리는 적의 함대를 막을 테니 즉시 적의 지원군을 막아라.
dialogue_2431=적의 원군이 전선에 도착하고 있다. 일본군의 후방이 허술한 틈을 타 기습을 가하라.
dialogue_2432=일본군의 함대는 거의 섬멸되었다. 본토의 적군을 섬멸하여 가능한한 빨리 이번 전쟁을 끝내자.
dialogue_2433=우리의 퇴로가 미군에 의해 차단되었다. 적의 항공모함 주력을 섬멸해야만 유일한 희망이 생길 것이다.
dialogue_2434=위기는 저절로 해결되지 않는다. 우리는 가만히 앉아서 죽음을 기다릴 수 없다. 반드시 주동적으로 출격해야 한다.
dialogue_2435=미군은 상륙하는데 성공했다. 동맹국들과 협력하여 적의 주요 거점을 점령하라.
dialogue_2436=적군은 계속해서 전선에 병력을 증가하여 전장의 균형이 깨졌다. 그들의 세력 확장을 막기 위해 전력을 다해야 한다.
dialogue_2437=우리는 북아프리카 이탈리아군의 보급선을 차단했다. 그들의 거점을 점령하고 우리의 보급선을 구축하라.
dialogue_2438=영국군은 이곳의 공장을 장악했다. 이 거점들을 탈취해야만 우리는 이 전쟁을 유지할 수 있다.
dialogue_2439=적군은 우리 도시를 점령했다. 나의 부대는 언제든지 반격을 시작할 수 있는 준비가 되어 있다.
dialogue_2440=독일군은 이미 궁지에 빠졌다. 우리와 함께 공격을 시작하여 북아프리카의 적을 섬멸하자.
dialogue_2441=적의 공격을 견제하고, 미래 반격에 대비하여 가능한 한 많은 물자를 확보하라.
dialogue_2442=일본군이 우리 사이의 연락을 차단했다. 적군의 기습을 조심하고 가는 곳마다 진을 쳐라.
dialogue_2443=우리는 이미 적의 중심지까지 진격하여 곧 적군 주력을 포위할 수 있을 것이다.
dialogue_2444=상륙작전이 이미 성공했다. 우리의 함대와 협력하여 적군을 철저히 섬멸하라.
dialogue_2445=우리는 더 이상 물러설 길이 없다. 오직 진지를 굳게 지켜야만 승리의 희망이 있다.
dialogue_2446=새로운 세계 구도가 형성되었다. 이 혼란스러운 시기에 살아남기 위해 우리는 반드시 우리만의 길을 모색해야 한다.

dialogue_2447=적의 공세가 너무 강합니다. 지휘관님, 적의 방어선 돌파구를 찾아내어 아군의 진격을 이끄십시오.
dialogue_2448=영국군이 더 깊은 곳의 방어선을 돌파하지 못하도록 최선을 다해 방어하고 후방 지원군을 기다려라.
dialogue_2449=우리는 후방 지원군이 도착할 때까지 버틸 수 없다. 철수하라.
dialogue_2450=병사들이여, 우리는 곧 위대한 승리를 거둘 것이다. 단숨에 추축국을 아프리카 대륙에서 몰아내자!
dialogue_2451=적이 병력을 집중시키기 전에 섬의 동쪽과 남쪽에서 상륙하자.
dialogue_2452=연합군이 시칠리아 섬에 대규모 상륙했다. 모든 부대를 출동시켜 그들이 섬의 중심부로 깊숙이 진입하지 못하도록 막아라.
dialogue_2453=북쪽의 적 해상 지원 부대를 조심하라!
dialogue_2454=연합군은 초기 상륙 작전을 마치고 거점을 구축했습니다. 지휘관 각하, 우리를 이끌고 노르망디 지역으로 깊숙이 진격해 주십시오.
dialogue_2455=어떤 대가를 치르더라도 연합군의 진격을 막고, 그들이 안쪽으로 깊숙이 침입하는 것을 막아야 한다!
dialogue_2456=북쪽으로 진군하십시오. 아군 공수부대가 적의 후방으로 낙하하여 적을 협공합니다.
dialogue_2457=연합군의 계획을 가로챘습니다. 병사 여러분, 다리를 지키고 그들의 목적을 막아야 합니다!
dialogue_2458=전투의 핵심인 다리를 장악하지 못하면 공중의 아군은 헛되이 목숨을 잃게 될 것이다. 지휘관님, 제발 우리에게 힘을 보태주십시오.
dialogue_2459=우군이 적의 포위망에 둘러싸여 있습니다, 지휘관 각하, 그들을 안전하게 보호하기 위해 병사들을 보내주십시오.
dialogue_2460=다행히 영국인의 도움으로 큰 손실을 면할 수 있었습니다. 병사들아, 정신을 가다듬고 반격의 의지를 불태워라!
dialogue_2461=독일군에게 전장이 분열되지 않도록 주의하고, 병력을 모아 최후의 일격을 가하십시오.

elite_intro_63=1872년에 창설된 알피니는 이탈리아 육군 소속이다. 이 부대는 당시 비교적 선진적인 무기와 장비로 무장되었으며, 제1차 세계대전과 제2차 세계대전의 전투에서 활약했다.
elite_intro_64=B-4 곡사포는 특수한 이중 왕복식 시스템이 탑재 되었고, 포구경은 203mm이다. 제2차 세계대전에서 B-4 곡사포는 콘크리트로 보강된 대형 보루를 격파하는 데 중요한 역할을 했으며, 적군은 이를 '스탈린의 망치'라고 불렀다.

feat_name_62=견제
feat_name_63=강습

feat_desc_62=자기 주변 1칸 범위 내의 적군을 움직이지 못하게 한다. 지속 시간은 1턴이고, 쿨타임은 3턴이다. 3개 이상의 유닛에게 효과를 줄 경우 쿨타임은 1턴으로 변한다.
feat_desc_63=성 방어에 대한 데미지 {1}% 증가, 2턴 지속. 쿨타임 3턴.

sort=정렬
sort_general=장군 정렬

help_scenario=시나리오
help_conquest=정복
help_domination=지배
help_hq=HQ
help_battle=전투
help_system=시스템

help_scenario_1=메인 시나리오
help_scenario_2=진영
help_scenario_3=스테이지 난이도
help_scenario_4=전투구역
help_scenario_5=전선

help_scenario_desc_1=이곳에서는 제2차 세계대전 이후의 다양한 역사 속 전투를 체험할 수 있다. 현재 챕터의 모든 스테이지를 클리어하면 다음 장의 잠금을 해제할 수 있다.
help_scenario_desc_2=제2차 세계대전 유럽', '제2차 세계대전 태평양', '냉전' 챕터에서는 두 가지 진영을 선택할 수 있다. 두 진영의 스테이지와 보상은 모두 독립적이다.
help_scenario_desc_3=시나리오의 각 스테이지마다 난이도가 다르며, 더 높은 난이도에 도전하려면 현재 난이도를 클리어해야 한다. 난이도가 높아질수록 보상도 풍부해진다.
help_scenario_desc_4=전투 구역은 주로 훈장과 리본이 산출되며, 8명 이상의 장군을 보유하면 전투 구역을 개방할 수 있다. 현재 전투 구역의 모든 스테이지를 클리어하면 지휘관은 점수에 따라 보상을 받고, 적을 많이 처치할수록 총 점수가 높아진다. 같은 전투 구역은 여러 번 도전할 수 있지만, 전투 구역을 전환하거나 갱신하려면 지령 포인트 1개를 소모해야 하며. 한 전투 구역이 갱신되기 전에 출전했던 장군은 해당 전투 구역의 후속 스테이지에서 계속 전투를 벌일 수 없으므로 지휘관은 신중하게 장군을 선택해야 한다.
help_scenario_desc_5=전선 모드는 매우 도전적인 게임 모드로, 메인 시나리오 '제2차 세계대전 유럽'을 클리어하면 잠금 해제된다. 지휘관은 이곳에서 많은 요새와 끊임없이 나타나는 지원군에 맞서게 될 것이다. 전선 모드를 클리어하면 풍부한 보상을 받을 수 있다.

help_conquest_1=국가
help_conquest_2=외교
help_conquest_3=과학기술 등급
help_conquest_4=건물 건설
help_conquest_5=승리 획득

help_conquest_desc_1=정복 모드에서는 국가가 1~3개의 별로 분류된다. 별의 개수가 많을수록 게임 시작 시 해당 국가가 더 강력하고 게임 난이도가 낮아진다. 반대로 별이 적을수록 난이도가 높아진다.
help_conquest_desc_2=화면 상단의 외교 버튼을 통해 지휘관은 각종 자원을 기부하는 방식으로 우군을 지원하거나, 중립국에 선전포고를 하여 적대국으로 전환시킬 수 있다.
help_conquest_desc_3=정복 모드에서 국가의 발전은 과학기술 수준의 제한을 받는다. 과학연구소에서 기술 과학기술 포인트를 획득하는 동시에 해당 과학기술 레벨 경험치도 얻을 수 있다.
help_conquest_desc_4=지휘관은 기능성 건물을 건설하여 도시를 발전시킬 수 있으며, 과학기술 등급의 요구 사항을 충족하면 건설 버튼을 클릭하여 필요한 자원을 확인할 수 있다.
help_conquest_desc_5=정복 승리 후, 평가 점수에 따라 레벨이 결정된다. 평가 점수는 출전한 장군, 점령한 도시, 소모한 턴 수, 선택한 국가의 난이도의 영향을 받는다. 출정 장군의 수는 도전 정복의 평점에 영향을 미치지 않습니다.

help_domination_1=미션
help_domination_2=부대 보충
help_domination_3=전설의 장군
help_domination_4=침입
help_domination_5=무역
help_domination_6=연습

help_domination_desc_1=지휘관은 장군을 파견하여 임무를 완수하고 자원 보상을 획득할 수 있다. 조건 중 하나만 충족하면 임무를 완성할 수 있으며, 조건을 많이 충족할수록 보상이 더 풍성해진다. 임무는 정찰, 열병, 홍보, 건설 등 4가지 유형으로 나뉘며, 매일 UTC8:00과 20:00에 갱신된다.
help_domination_desc_2=일부 통치 모드의 플레이 방식(침공, 회전, 전설의 장군)은 지휘관이 직접 부대를 배치한 후 게임을 시작해야 하며, 통치 화면 오른쪽 상단의 부대 버튼을 통해 진입 및 모집할 수 있다.
help_domination_desc_3=전설의 장군 모드의 전투를 통해 해당 장군의 모집권을 잠금 해제할 수 있으며, 전투가 진행됨에 따라 모집 할인도 획득 가능하다.
help_domination_desc_4=지휘관은 자신이 직접 조직한 부대로 전투를 벌여 승리하면 훈장 보상을 획득할 수 있다. 침략 모드는 매일 UTC8:00 및 20:00에 갱신된다.
help_domination_desc_5=지휘관은 무역 교환을 통해 자신이 부족한 자원을 획득할 수 있다.
help_domination_desc_6=지휘관은 자신이 조직한 부대로 전투를 벌이고, 승리 후 훈장 보상을 받을 수 있다. 이 플레이 방식은 갱신되지 않는다.

help_hq_1=장군
help_hq_2=장군 육성
help_hq_3=훈장
help_hq_4=리본
help_hq_5=과학기술
help_hq_6=랜드마크
help_hq_7=불가사의
help_hq_8=엘리트 부대
help_hq_9=전기

help_hq_desc_1=HQ는 지휘관이 자신의 장군을 관리하는 중심이다. 이 곳에서는 보유한 장군의 상태를 확인하고 관리할 수 있으며, 새로운 장군을 모집할 수도 있다. 장군 슬롯은 HQ 레벨이 높을수록 잠금이 해제되고, HQ 레벨 경험치는 시나리오, 지배, 정복 등 모드에서 획득할 수 있다.
help_hq_desc_2=계급 승진을 통해 지휘관이 이끄는 부대의 최대 생명을 늘릴 수 있으며, 장군의 전투력을 향상시키기 위해 능력치와 스킬을 업그레이드할 수도 있다. 각 시나리오의 장을 클리어할 때마다 모든 장군은 진급할 수 있는 계급이 1개씩 늘어난다.
help_hq_desc_3=장군은 훈장을 착용하여 전투 능력을 더욱 향상시킬 수 있으며, 장군마다 최대 3개의 훈장을 장착할 수 있다. 컬렉션 내 훈장을 드래그하여 장착/제거할 수 있다.
help_hq_desc_4=리본은 장군의 전투 능력을 향상시키는 또 하나의 장비이다. 장군이 진급할 때마다 리본 슬롯 1개가 활성화되며, 모든 장군은 최대 3개의 서로 다른 리본을 착용할 수 있고, 동일한 리본 3개로 상위 레벨의 리본을 합성할 수 있다.
help_hq_desc_5=과학기술을 향상시키면, 모든 전투 모드에서 각종 병과의 다양한 능력을 강화할 수 있다.
help_hq_desc_6=통치 모드를 통해 잠금 해제할 수 있으며, 각종 모드의 도시 건설에 사용될 수 있다.
help_hq_desc_7=불가사의는 통치 모드의 수익과 자원 생산을 가져다줄 수 있으며, 불가사의는 통치 모드의 다양한 플레이 방식을 통해 잠금 해제할 수 있다. 구체적인 잠금 해제 방법은 기관을 클릭하여 상세 정보를 확인할 수 있다.
help_hq_desc_8=엘리트 부대는 강력한 전투 유닛으로, 병종 조각을 수집하여 잠금 해제/업그레이드할 수 있으며, 엘리트 부대의 조각은 이벤트와 인앱 결제를 통해 획득할 수 있다. 공군 부대를 제외한 각 엘리트 부대는 한 차례의 전투에서 한 번만 모집활 수 있다.
help_hq_desc_9=지휘관은 장군 전기에서 명장들이 겪은 유명한 전쟁을 체험할 수 있다. 장군 한 명당 총 5개의 스테이지를 모두 클리어하면 전용 칭호 보상을 획득할 수 있다.

help_battle_1=이동
help_battle_2=취소
help_battle_3=공격
help_battle_4=승리 조건
help_battle_5=장군 파견
help_battle_6=부대 소집
help_battle_7=도시 점령
help_battle_8=방공과 요새
help_battle_9=지형 효과
help_battle_10=사기

help_battle_desc_1=이동 가능한 아군 유닛을 클릭하면 선정할 수 있으며, 해당 유닛의 이동 범위가 맵에 표시된다. 복잡한 지형(산악지대, 숲 등)은 더 많은 이동력을 소모한다.
help_battle_desc_2=부대를 이동시킨 후, 취소 버튼을 클릭하면 이동 전의 위치로 돌아갈 수 있다. 부대가 공격을 수행하였거나 지휘관이 다른 위치를 클릭하여 해당 부대의 선택을 해제하면 취소 조작이 불가능하다.
help_battle_desc_3=아군 유닛 선택 후, 해당 유닛의 공격 범위 내에 적군이 존재하면 빨간색 원으로 표시된다. 이때 적군을 클릭하면 적군을 공격할 수 있다. 공격 시 아군 유닛이 적군의 공격 범위 내에 있으면 반격 피해를 입게 된다. 단, 이번 공격으로 적군을 격파하면 반격 피해를 받지 않는다.
help_battle_desc_4=각 턴이 시작될 때마다 스테이지 정보 화면이 표시되며, 지휘관은 여기서 스테이지의 승리 조건, 파견 가능한 장군 제한, 해당 턴의 보상 등 정보를 확인할 수 있다. 중요 거점은 빨간색 원으로 표시되며, 이를 점령하거나 빼앗기는 것은 전투의 승패에 영향을 미친다.
help_battle_desc_5=아군의 특정 부대를 선택한 후, 장군을 파견하여 해당 부대를 지휘할 경우 해당 부대의 전투 능력이 크게 향상된다.
help_battle_desc_6=자신의 도시에 부대가 없는 경우, 부대를 모집하여 전투 병력을 보충할 수 있다. 일반 부대를 모집하려면 대응하는 공장 레벨이 필요하지만, 엘리트 부대는 공장 레벨을 무시하고 직접 모집할 수 있다.
help_battle_desc_7=적군 도시의 내구도가 0이 되고, 도시에 부대가 없을 경우 적군 도시를 점령할 수 있다. 점령 후 아군은 해당 도시의 통제권을 획득하게 된다.
help_battle_desc_8=아군 영토 내에 방공 시설을 건설하여 공중 공격을 막을 수 있고, 아군 영토 내의 공지에 토치카를 건설하여 적의 지면 공격을 막을 수 있다.
help_battle_desc_9=복잡한 지형은 부대의 이동뿐만 아니라 부대가 받는 피해에도 영향을 미친다. 지휘관은 지역을 선택한 후 화면 왼쪽 상단에서 해당 지역의 상태를 확인할 수 있다.
help_battle_desc_10=사기는 부대의 전투 능력에 영향을 미치는 중요한 요소로, 부대가 적군에게 포위당하며 사기가 떨어지고, 부대의 데미지가 감소된다. 사기가 떨어지면 부대는 공격과 반격을 할 수 없게 되므로 이런 상황에 빠지지 않도록 주의해야 한다.

help_system_1=클라우드 스토리지
help_system_2=언어
help_system_3=전쟁 통행증
help_system_4=업적
help_system_5=기간 한정 장군

help_system_desc_1=메인 메뉴의 오른쪽 목록을 통해 클라우드 저장 기능에 진입하여 데이터를 업로드 또는 따운로드함으로써 여러 디바이스에서 게임 진행 상황을 동기화할 수 있다.
help_system_desc_2=메인 메뉴의 오른쪽 목록을 통해 다른 언어로 전환할 수 있다.
help_system_desc_3=전쟁 통행증은 대량의 자원을 얻을 수 있는 편리한 수단 중 하나로, 무료 보상과 유료 보상으로 나뉜다. 모든 전투 모드의 왼쪽 목록에서 진입할 수 있다.
help_system_desc_4=업적 목록에서는 도전적인 마일스톤 퀘스트를 확인할 수 있으며, 풍부한 보상이 준비되어 있다. 모든 전투 모드의 왼쪽 목록을 통해 진입할 수 있다.
help_system_desc_5=이 아이콘이 나타날 때면 상점에서 강력한 장군이 기간 한정으로 판매되고 있음을 의미한다!

