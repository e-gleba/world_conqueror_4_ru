card_desc_1=아군 유닛 1개를 지정하여, 3칸 범위 내 모든 아군의 사기를 상승시킴.
card_desc_2=적군 건물 또는 요새 1개를 지정하여, 부대 모집을 할 수 없게 함. 지속 시간 2턴.
card_desc_3=적군 유닛 1개를 지정하여, 사기를 혼란 상태로 만듦. 지속 시간 2턴.
card_desc_4=아군 유닛 1개를 지정하여, HP를 30% 회복시킴.
card_desc_5=다음에 모집하는 원군 부대의 공훈 포인트 소모량 -2.
card_desc_6=배치된 장군 중 임의의 1명을 유닛에서 철수시킬 수 있음.
card_desc_7=공장 1회 업그레이드 가능.
card_desc_8=연구소 1회 업그레이드 가능.
card_desc_9=핵공장 1회 업그레이드 가능.
card_desc_10=미사일 발사대를 1회 업그레이드할 수 있음.
card_desc_11=항구 1회 업그레이드 가능.
card_desc_12=도시 1회 업그레이드 가능.
card_desc_13=위성 무기를 사용하여 1회 공격 발동.
card_desc_14=모든 적이 아군에게 어떤 전략도 사용할 수 없게 함. 지속 시간 2턴.
card_desc_15=적군 도시 1개를 지정하여, 자원 생산을 불가능하게 함. 지속 시간 2턴.
card_desc_16=공장, 연구소, 보급소의 모든 버프를 20% 증가함. 지속 시간 2턴.
card_desc_17=다음에 모집하는 원군 부대의 공훈 포인트 소모량 -8. 단, 해당 유닛의 초기 사기가 심각하게 저하됨.
card_desc_18=적군 유닛 1개를 선택하여, 해당 목표의 연막탄 및 회피 효과를 무효화함. 지속 시간 1턴.
card_desc_19=지휘관이 없는 엘리트 부대(최고 9레벨) 하나를 지정하여, 아군으로 전환함.
card_desc_20=이번 턴 동안 공훈 획득량 2배로 증가.
card_desc_21=공항 1회 업그레이드 가능.

