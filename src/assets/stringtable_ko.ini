armygroup_event_desc_1=독일은 다병종 기동화 전격전 전술을 이용하여 1939년에 신속히 폴란드를 침공하였으며, 이로 인해 영국과 프랑스가 독일에게 선전포고를 하면서 제2차 세계 대전이 공식적으로 발발하였다.
armygroup_event_desc_2=미국은 영국과 프랑스에 대량의 무기 원조를 제공하여 그들의 무기 장비에 중요한 지원을 제공했다.
armygroup_event_desc_3=소련은 추운 겨울에 핀란드를 정복하려고 시도했고, 최종 승리를 거두었지만 엄청난 대가를 치렀다.
armygroup_event_desc_4=독일은 노르웨이와 덴마크를 공격했다.
armygroup_event_desc_5=루마니아의 풍부한 석유 자원은 독일에 전략적인 연료 지원을 제공했고, 추축국의 전투력에 큰 영향을 미쳤다.
armygroup_event_desc_6=독일은 전격전 전술을 이용하여 저지대 국가를 침공하고, 네덜란드와 벨기에의 방어선을 빠르게 뚫었다.
armygroup_event_desc_7=1940년 5월에 시작된 만슈타인 계획은 아르덴 숲을 가로질러 마지노선을 우회하여 영국-프랑스 연합군에 대한 포위를 형성했다.
armygroup_event_desc_8=영국 수상이 된 처칠은 그의 리더십과 격려적인 연설로 영국의 저항 의지를 굳혔다.
armygroup_event_desc_9=독일군의 포위 공격에 직면한 연합군은 됭케르크 해안에서 대규모 철수를 감행했는데, 이번 철수 작전에서는 군용과 민용 해상 통로를 통해 약 33만 명의 병사를 영국으로 수송하여 후속 반격을 위한 중요한 토대를 마련했다.
armygroup_event_desc_10=프랑스군은 종심방어 작전과 지연 전술을 수행하여 독일군에 상당한 손실을 입혔다.
armygroup_event_desc_11=스웨덴은 제2차 세계대전 당시 독일에 고품질의 철광석을 대량으로 공급하여 추축국의 군사력 향상에 매우 중요한 역할을 했다.
armygroup_event_desc_12=파리의 함락은 프랑스의 패배를 상징하고, 서유럽 전선은 독일의 전면적인 승리로 끝났다.
armygroup_event_desc_13=1940년, 독일군은 영국을 본격적으로 침공하기 위한 '바다사자 작전' 계획을 수립하여 해상과 공중 공격을 통해 영국의 군사력을 파괴하려 했다.
armygroup_event_desc_14=1940년에 영국 상공에서 벌어진 결정적인 공중전에서 영국 공군은 독일 공군의 침공을 성공적으로 막아내어 유럽 전장에서 연합군의 결정적인 승리를 이끌었다.
armygroup_event_desc_15=독일 해군은 잠수함의 집단 협동 작전을 통해 적의 함대와 상선에 무차별 공격을 가하여 연합군 함대를 위협했다.
armygroup_event_desc_16=제2차 세계대전 당시 대서양에서는 독일 잠수함이 이리떼 전술을 이용하여 연합군 함선을 공격하고, 연합군은 호위 및 대잠수함전을 펼치는 치열한 해전이 벌어졌다.
armygroup_event_desc_17=이탈리아는 영국과 프랑스에 선전포고하고, 30만 군대를 동원하여 알프스 산맥과 니스 지역으로 진격했다.
armygroup_event_desc_18=폴란드군은 방어 위주의 작전계획을 수립하여 서부 영토를 사수하는 데 중점을 두었으며, 서부 전선의 연합군이 독일을 공격하기를 기다렸다.
armygroup_event_desc_19=추축국 군대는 각 방향에서 유고슬라비아를 침공하여, 짧은 시간 내에 여러 방어선을 돌파했고, 베오그라드에 협공을 가했다.
armygroup_event_desc_20=C집단군은 대량의 포병과 인력을 동원하여 라인강을 건너 마지노선에 정면공격을 감행했다.
armygroup_event_desc_21=독일과 이탈리아 연합군은 북아프리카 전장에서 병력을 집결하여 이집트에 대규모 공격을 개시하고, 영국군이 통제하는 수에즈 운하를 위협했다.
armygroup_event_desc_22=영국군은 '컴퍼스 작전'을 발동하여 이집트에 주둔하고 있는 이탈리아군에 기습공격을 가해 신속하게 방어선을 격파하고 리비아 국경까지 진격하여 북아프리카 전황을 뒤바꾸었다.
armygroup_event_desc_23=롬멜은 독일-이탈리아 연합군을 지휘하여 맹렬한 반격을 개시하여, 영국군 방어선을 돌파하고 알렉산드리아항을 성공적으로 점령하였으며 수에즈 운하를 위협하자 북아프리카 정세가 급변했다.
armygroup_event_desc_24=독일-이탈리아 연합군은 공격을 개시하여 토브룩 항구를 포위하고 영연방 부대의 보급선을 차단하려 했으나, 호주군이 진지를 고수하여 정세가 교착상태에 빠졌다.
armygroup_event_desc_25=영국군은 '배틀액스 작전'을 개시하여 다방면으로 독일-이탈리아 진지를 급습하여 초기에는 진전을 보였으나, 롬멜의 반격으로 작전은 결국 실패로 끝났다.
armygroup_event_desc_26=영연방군은 '크루세이더 작전'을 발동하여 대량의 전차부대를 집결해 전면반격을 전개했다. 그들은 롬멜을 성공적으로 격퇴하고 토브루크 포위를 뚫어 북아프리카 전황에 전환점이 마련되었다.
armygroup_event_desc_27=롬멜은 뛰어난 전공으로 원수 칭호를 수여받았고, 독일군의 사기는 크게 고양되었으며, 그를 불패의 상징으로 여겼다.
armygroup_event_desc_28=영국군의 지중해 보급선을 약화시키기 위해 추축국 공군은 스페인 영공을 통해 지브롤터 항에 야간 폭격을 가했다. 비록 큰 피해는 입히지 못했지만, 영국군이 방어 태세를 강화하도록 만들었다.
armygroup_event_desc_29=롬멜의 공세가 이집트 내륙 깊숙이 도달하자 영국군은 알라메인에 방어선을 구축하고 사수했으나, 쌍방의 치열한 교전에도 승부는 나지 않아 전황은 교착 상태에 빠졌다.
armygroup_event_desc_30=미국-영국 연합군이 프랑스령 북아프리카 3곳에 동시 상륙하여 '광명 작전'을 전개하자 프랑스령 식민지 정권이 흔들렸으며, 추축국 서부전선 방어선은 거대한 위협에 직면했다.
armygroup_event_desc_31=몽고메리가 영국군 제8집단군을 지휘하여 전면반격을 개시하고, 롬멜 부대를 궤멸시키자 추축국의 북아프리카 공세가 완전히 붕괴되고 전황이 역전되기 시작했다.
armygroup_event_desc_32=연합군 부대가 '횃불 작전'을 개시하여 모로코와 알제리의 여러 지점에 상륙하자 비시 프랑스군은 휴전을 선언했고, 추축국은 전후방에서 협공을 받아 튀니지 전선의 압력이 급증했다.
armygroup_event_desc_33=횃불 작전 후, 비시 프랑스군이 변절하여 연합군에 합류하자 자유 프랑스 세력은 신속히 확장되었으며, 추축국의 북아프리카 정세가 더욱 불리해졌다.
armygroup_event_desc_34=연합군이 동서에서 튀니지를 협공하여 독일-이탈리아 연합군에 큰 피해를 입혔고, 수십만 부대는 어쩔 수 없이 항복하여 튀니지에서 철수했다.
armygroup_event_desc_35=롬멜이 독일군 기갑부대를 이끌고 카세린 고개를 기습했다. 미군은 첫 대규모 전투에서 지휘 실수로 참혹한 손실을 입어 연합군 전선은 후퇴할 수밖에 없었다.
armygroup_event_desc_36=연합군이 북아프리카 독일군 보급선을 차단하자 연료와 탄약이 날로 부족해져 아프리카 군단의 작전 능력은 크게 저하되었고 전황은 점차 악화되었다.
armygroup_event_desc_37=영국군이 수에즈 운하에서 전선까지의 보급선을 성공적으로 회복하여 대량의 물자와 장비가 도착하자 전선 부대의 전투력이 신속히 회복되었다.
armygroup_event_desc_38=연합군이 지중해를 건너 상륙전을 감행하여 신속히 이탈리아군 방어선을 돌파하고 시칠리아 전도를 점령했다. 추축국의 남쪽 측면이 노출되면서 이탈리아 본토 전황이 시작되었다.
armygroup_event_desc_39=발칸반도에서 이탈리아군의 실패를 지원하기 위해 독일군은 '마리타 작전'을 개시하여 그리스와 유고슬라비아를 전격전으로 공격하고 발칸반도 전체를 통제하려 했다.
armygroup_event_desc_40=독일군 공수부대가 크레타 섬을 강습하여 격렬한 저항에도 불구하고 결국 섬 전체를 점령했지만, 막대한 손실을 입었다.



