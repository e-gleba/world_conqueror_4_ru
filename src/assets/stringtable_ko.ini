legend_intro_10101=프랑스 전장에서 제7기갑사단은 '유령 사단'이라는 이름으로 이름을 떨쳤으며, 1940년 5월 21일의 알라스 전투는 그 명성을 얻게 된 가장 결정적인 시험이었다. 이날 선봉 부대로서 알라스를 우회해 북쪽으로 진격하라는 명령을 받았으나, 예기치 않게 영국-프랑스 연합군의 반격 부대와 마주쳐 격렬한 전투를 벌이게 되었다. 갑작스러운 측면 공격 위협에 제7기갑사단은 한때 수세에 몰렸지만, 롬멜 장군의 유연하고 과감한 지휘 덕분에 결국 전세를 역전하고 위기를 극복했다.
legend_intro_10102=전쟁의 방향이 바뀌면서 제7기갑사단은 모스크바를 향한 전투에 돌입했다. 하지만 첫 전투인 '알리투스 전투'는 그들의 처참한 미래를 예고했다. 제7기갑사단은 알리투스에서 소련 제5기갑사단과 전차전을 벌였고, 200여 대의 전차를 보유한 소련 제5기갑사단을 격퇴했다. 이로써 알리투스를 점령하고 빌뉴스로 향하는 길을 열었다.
legend_intro_10103=1941년 10월 2일, 제7기갑사단은 소련군 정면을 돌파하여 증원하러 온 소련군 전차 부대를 격파하고, 제4기갑집단군의 제10기갑사단과 함께 뱌지마 포위망을 완성했다. 그들은 소련군의 서부 방어선을 성공적으로 무너뜨리며 바르바로사 작전의 최종 목적지인 모스크바로 한 발 더 다가섰다.
legend_intro_10104=눈보라가 몰아치는 모스크바의 겨울은 그 어느 때보다 혹독했다. 길게 늘어진 보급선은 독일군을 지치게 했고, 그들은 모스크바 점령의 희망을 이 마지막 일격에 걸어야만 했다. 1941년 11월 15일, 제7기갑사단이 소속된 제3기갑집단군은 모스크바를 향해 진격을 시작했다. 기동성을 활용하여 크린과 야흐로마를 연달아 점령하고, 한때 크렘린 궁전을 멀리서 볼 수 있었지만, 결국 소련군의 거센 저항에 부딪혀 실패로 끝났다.
legend_intro_10105=1943년, 쿠르스크 전투. 오랜 전투와 보급 부족에 시달린 제7기갑사단은 더 이상 주공 임무를 맡을 수 없게 되었고, 제4기갑집단군 주력 부대의 측면을 엄호하는 측면 부대로 운용될 수밖에 없었다. 그럼에도 그들은 여전히 측면 전장에서 소련군 방어선을 돌파하며 소련 근위제7집단군을 견제했지만, 이러한 노력은 전황에 큰 영향을 미치지 못했다. 주력 부대가 프로호롭카에서 패배하면서 제7기갑사단 역시 철수할 수밖에 없었다. 전장의 상황이 바뀌면서 이전처럼 자유롭게 종횡무진할 수 없게 되었다.
legend_intro_10106=제2차 키이우 전투는 제7기갑사단이 동부 전선에서 대규모 기동 작전을 수행한 마지막 전투였다. 소련군이 압도적인 병력 우위로 공격해오자, 제7기갑사단은 키이우에서 철수하고 파스토우-지토미르 전선에서 유연하게 소련군을 저지했다. 또한 지원군과 함께 한때 빼앗겼던 지토미르를 탈환했다. 그들은 전체 전선의 열세를 뒤집지는 못했지만, 독일군이 후퇴하여 재정비할 수 있는 소중한 시간을 벌어주었다.
legend_intro_20101=미국 제3기갑사단의 전투 역사는 노르망디 상륙작전에서 시작되었다. 상륙 후, 독일군이 준비한 가시 울타리 장애물은 한때 이 '강철 부대'의 전진을 가로막았다. 1944년 7월 '코브라 작전'이 시작되자, 미군은 수천 대의 폭격기를 동원해 독일군 진지를 융단 폭격했고, 제3기갑사단은 '창끝 사단'으로서 신속하게 진격했다. 기갑 부대의 기동력을 활용해 흩어진 독일군 방어선을 무너뜨리며 전역급 돌파를 달성해 노르망디의 교착 상태를 타파했다.
legend_intro_20102=코브라 작전'의 성공적인 돌파 이후, 제3기갑사단은 명령을 받아 북쪽으로 진격하여 팔레즈 지역으로 향해 북쪽에서 남하하는 캐나다 및 폴란드군과 함께 포위망을 형성했다. 군은 탈출구를 찾기 위해 여러 차례 돌파를 시도했으나, 제3기갑사단의 방어선을 뚫지 못했다. 이 전투로 독일군 두 개 군단이 거의 격파되었고, 제3기갑사단은 불길 속에서 연합군에게 가장 날카로운 창 중 하나임을 다시 한번 증명했다.
legend_intro_20103=1944년 가을, 제3기갑사단은 제1군단의 선봉으로서 지크프리트 방어선을 신속히 돌파하고 아헨 성으로 진격했다. 2주간의 치열한 시가전 끝에 아헨은 마침내 10월 21일 완전히 함락되었다. 잠시 재정비 후, 제3기갑사단은 11월에 휘르트겐 숲을 공격하기 시작했다. 복잡한 산림 지형으로 기갑 부대의 기동성은 제한되었고, 수많은 병사들이 이 전장에서 희생되었다. 가혹한 시가전과 울창한 숲 속에서 단련된 이 부대는 더 이상 단순한 공격의 선봉을 넘어, 모든 상황에 적응할 수 있는 강인한 사단으로 거듭났다.
legend_intro_20104=1944년 12월 16일, 독일군은 아르덴 숲에서 갑작스러운 역습을 감행했다. 미국 제3기갑사단은 제1군단의 정예 예비대으로서 북부 전선으로 긴급 투입되어, 여러 주요 거점에서 다른 부대와 협력해 신속하게 반격에 나섰고, 독일군의 공세를 성공적으로 저지했다.
legend_intro_20105=1945년 3월, 제3기갑사단은 제1군단의 선봉으로서 레마겐 교두보에서 동쪽으로 전속력으로 돌격하여 독일 루르 공업지대를 포위하려 했다. 4월 1일, 제3기갑사단은 리프슈타트에서 북부 미군과 합류하여 모델 원수의 독일군 32만 명을 '루르 포위망'에 가두는 데 성공했다. 반달간의 소탕 작전 후, 독일군의 저항은 무너졌고 모델은 자살했으며, 18일 대규모 항복이 이루어졌다. 이 전투로 서부 전선의 독일군 주력은 완전히 붕괴되었다. 제3기갑사단은 고속 기동력으로 승리를 이끌었지만, 사단장 로스 소장을 잃는 아픔을 겪으며 승리의 기념비에 가장 깊은 영광과 희생의 흔적을 남겼다.
legend_intro_20106=1991년 2월, 제3기갑사단은 제7군단의 주력 부대으로서 사우디아라비아 북부에서 이라크 방어선을 돌파했다. M1A1 탱크의 기술적 우위를 바탕으로, 이 사단은 260km를 주야로 질주하며 이라크군 제9기갑여단과 공화국 수비대 '타와칼나' 사단을 연달아 격파했다. 노퍽 탱크전에서는 최소한의 손실로 다수의 T-72 탱크를 파괴했다. 100시간 만에, 이 사단은 동맹군과 협력하여 10개 이상의 이라크군 사단을 섬멸하고, 사담의 정예 부대를 궤멸시켰으며, 거의 무손실의 전과로 현대 기갑 부대의 절대적인 지배력을 입증하고 지상전의 패러다임을 재정립했다.
legend_intro_30101=1942년 가을, 흑해 함대 수병들로 구성된 해병 제255여단은 코카서스 전선에 긴급 파견되었다. 투압세 방향의 산림 지대에서 그들은 총검, 수류탄, 모신나강 소총으로 진지를 사수하며 독일군의 '아티카' 공세를 분쇄했다. 중화기 부족이라는 열세에도 불구하고, 야간 기습 및 우회 전술로 피를 흘리며 싸웠고, 12월 13일에는 붉은 깃발 훈장을 받으며 독일군이 흑해로 향하는 길을 피로 막아냈다.
legend_intro_30102=1943년 2월 6일, 해병 제255여단은 명령을 받고 노보로시스크 인근의 메스하코 지역에 상륙하여 훗날 '작은 땅'이라 불리는 상륙장을 점령하고 사수했다. 독일군의 항공기와 중포가 밤낮으로 맹렬히 공격해왔지만, 우리 해병과 육군 형제들은 이 조그만 땅에 참호를 파고 사수했다. 이는 독일군의 대규모 병력을 견제하여, 이후 코카서스와 타만 반도를 해방하는 데 중요한 토대를 마련했다.
legend_intro_30103=1943년 9월 10일 새벽, 해병 제255여단은 함포의 엄호 아래 노보로시스크 항구 남쪽에 강제 상륙했습니다. 독일군이 촘촘히 깔아놓은 지뢰밭, 철조망, 해안 포화에 맞서 한 치 한 치 전진하며 교두보를 구축했고, 후속 부대가 돌파할 길을 열어주었다. 최종적으로 제18군단과의 협동 작전으로 9월 16일 도시 전체를 점령했다. 이 전투는 소련군이 타만 반도를 점령하고 코카서스 전쟁을 완전히 종결시키는 데 기반을 마련했으며, 이에 따라 여단은 '타만 여단'이라는 영예로운 칭호를 얻었다.
legend_intro_30104=1943년 11월, '타만 여단'은 폭풍우가 몰아치는 밤에 케르치 반도 엘티겐 해안에 상륙을 시도했다. 독일군의 탐조등과 포화가 쏟아지는 가운데 피로 물든 바닷물을 헤치고 상륙장을 점령한 후 36일 동안 사수했다. 탄약과 식량이 바닥나자, 병사들은 수류탄과 총검으로 수십 차례의 반격을 격퇴했으며, 특히 코스텐코 상사는 총구를 몸으로 막아내며 전사했다. 이 전투는 막대한 희생을 치렀지만, 독일군 주력을 견제하는 데 성공하여 북부 소련군이 크림반도를 해방하는 데 결정적인 승리의 기반을 마련했다.
legend_intro_30105=1944년 5월, '타만 여단'은 독립 해안군 소속 흑해 함대 정예 부대로서 세바스토폴 해방을 위한 복수전에 참전했다. 이 작전은 크림반도에 남아있던 독일군의 마지막 요새를 완전히 격파하고, 1942년 요새 함락의 치욕을 씻어냈다.
legend_intro_30106=1944년 8월, '타만 여단'은 야시-키시뇨프 공세에서 드네스트르 만을 강습으로 건너, 아케르만(현 빌호로드-드니스트로우스키) 해안에 야간 기습 상륙했다. 독일군의 맹렬한 해안 포화 속에서 방어선을 뚫고 제46군단과 협력하여 요새를 공략했다. 그들은 치열한 시가전 끝에 8월 23일 요새를 함락하여 독일군의 해안 퇴로를 차단하고 수많은 포로를 잡았다. 이 전투로 '타만 여단'은 2급 쿠투조프 훈장을 수훈하며 해병대의 상륙 돌격이 얼마나 치명적인지를 증명했다.


