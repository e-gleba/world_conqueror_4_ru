event_buff_name_27=전리 방사선
event_buff_name_28=고무
event_buff_name_29=도발

event_buff_desc_27=공격 시 30% 확률로 2턴 동안 구역에 방사선 효과를 가하고, 매 턴마다 방사선 구역에 처한 부대는 현재 생명력의 10% 감소
event_buff_desc_28=유닛이 협공 받지 않을 경우 매 턴마다 80%의 확률로 자신의 혼란 및 사기 저하 상태를 해소할 수 있음
event_buff_desc_29=장군이 지휘하는 부대가 공격 후 20% 확률로 1칸 범위 내 우군 유닛이 적 육군 및 해군의 선택 대상이 될 수 없게 함. 지속 시간 1턴.

event_stage_intro_20501=전쟁은 변한 적이 없다.미군의 행동은 반도의 균형을 다시 한 번 깨뜨렸다. 적은 이미 경계선을 넘었으니 우리는 반드시 눈앞의 위협을 해결해야 한다. 즉시 부대를 조직하여 우군을 원조하라. 새로운 무기를 잘 이용하여 적들이 대가를 치르게 하라!
event_stage_intro_20502=미국은 일본과 연합하여 소베츠카야가반 주변의 해역과 사할린 섬 남부를 장악했다. 우리는 미군의 침략 결의를 과소평가했지만, 적군 역시 우리의 역량을 과소평가했다. 위대한 조국에 도전하는 자는 누구든 반드시 멸망하게 될 것이다.
event_stage_intro_20503=미군의 야망은 명백히 드러났다. 우리는 적의 확장에 대응하기 위해 쿠릴 열도 주변 해역에 미리 방어 부대를 배치했다. 이번 기회를 이용하여 일본 북부의 세력을 제거하라.
event_stage_intro_20504=캄차카 반도 남부가 미군의 공격을 받았다. 이곳은 알류샨 열도와 인접하고 있으며, 미국이 우리 영토와 접경하는 곳이다. 지휘부는 알래스카 공격을 위한 방안을 마련했으며, 미군의 기습으로 인해 후속 계획이 중단되어서는 안 된다.
event_stage_intro_20505=정보에 따르면 미군은 더 큰 폭발력을 가진 핵무기를 개발하고 있다. 그들은 심지어 이 핵무기를 이용하여 알래스카에 심해항을 개척할 계획이다. 앵커리지에 위치한 연구 시설이 이번의 목표이다. 적이 철수하기 전에 주변 지역을 장악해야 한다.
event_stage_intro_20506=앵커리지의 수비군은 아직도 최후의 발악을 하고 있지만, 우리는 미군의 방어선을 쉽게 뚫을 수 없다. 지금부터 적군의 움직임을 주시하라. 동시에 내륙 방향으로 공격하여 수비군을 세 방향으로 포위하고 그들의 퇴로를 차단하라.
event_stage_intro_20507=미군은 우리의 공격으로 계속 후퇴하고 있다. 방어선이 계속 뚫리고 있지만, 적군은 이 시간을 이용하여 군대를 서해안으로 집결시켰다. 최후의 결전이 곧 시작될 것이며, 우리 앞에 있는 모든 장애물은 결국 제거될 것이다.
event_stage_intro_20511=미군의 행동은 반도의 균형을 다시 한 번 깨뜨렸다. 적은 이미 경계선을 넘었으니 우리는 반드시 눈앞의 위협을 해결해야 한다. 즉시 부대를 조직하여 우군을 원조하라. 새로운 무기를 잘 이용하여 적들이 대가를 치르게 하라!
event_stage_intro_20512=미국은 일본과 연합하여 소베츠카야가반 주변의 해역과 사할린 섬 남부를 장악했다. 우리는 미군의 침략 결의를 과소평가했지만, 적군 역시 우리의 역량을 과소평가했다. 위대한 조국에 도전하는 자는 누구든 반드시 멸망하게 될 것이다.
event_stage_intro_20513=미군의 야망은 명백히 드러났다. 우리는 적의 확장에 대응하기 위해 쿠릴 열도 주변 해역에 미리 방어 부대를 배치했다. 이번 기회를 이용하여 일본 북부의 세력을 제거하라.
event_stage_intro_20514=캄차카 반도 남부가 미군의 공격을 받았다. 이곳은 알류샨 열도와 인접하고 있으며, 미국이 우리 영토와 접경하는 곳이다. 지휘부는 알래스카 공격을 위한 방안을 마련했으며, 미군의 기습으로 인해 후속 계획이 중단되어서는 안 된다.
event_stage_intro_20515=정보에 따르면 미군은 더 큰 폭발력을 가진 핵무기를 개발하고 있다. 그들은 심지어 이 핵무기를 이용하여 알래스카에 심해항을 개척할 계획이다. 앵커리지에 위치한 연구 시설이 이번의 목표이다. 적이 철수하기 전에 주변 지역을 장악해야 한다.
event_stage_intro_20516=앵커리지의 수비군은 아직도 최후의 발악을 하고 있지만, 우리는 미군의 방어선을 쉽게 뚫을 수 없다. 지금부터 적군의 움직임을 주시하라. 동시에 내륙 방향으로 공격하여 수비군을 세 방향으로 포위하고 그들의 퇴로를 차단하라.
event_stage_intro_20517=미군은 우리의 공격으로 계속 후퇴하고 있다. 방어선이 계속 뚫리고 있지만, 적군은 이 시간을 이용하여 군대를 서해안으로 집결시켰다. 최후의 결전이 곧 시작될 것이며, 우리 앞에 있는 모든 장애물은 결국 제거될 것이다.

