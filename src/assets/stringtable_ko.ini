dialogue_2944=영국 지원군이 집결하고 있다. 메르사마트루를 향해 신속히 진군하라! 이곳에 너무 오래 머물지 마라.
dialogue_2945=이탈리아군의 병력이 매우 많다. 전선 부대에게 싸우면서 후퇴하라고 통보하라. 원군이 도착한 후 병력을 집중하여 반격하라.
dialogue_2946=전방 공격이 저지된 지금, 우리의 보급으로는 이 규모의 공격을 유지할 수 없다. 각 부대는 우선 전선을 유지하고, 영국군의 돌파를 막아라.
dialogue_2947=이탈리아군을 막으려면 더 많은 지원이 필요하다.
dialogue_2948=원군이 계속해서 도착하고 있다. 나의 함대는 해상의 위협을 해결할 것이다.
dialogue_2949=주력 부대가 리비아에 성공적으로 도착했다. 우리는 최대한 빨리 동쪽으로 진격하여 키레나이카 지역의 영국군을 제거할 것이다.
dialogue_2950=지원군이 아직 도착하지 않았다. 이제 우리는 최선을 다해 적군을 견제하고, 필요하다면 진지를 포기하고 동쪽으로 철수할 수밖에 없다.
dialogue_2951=독일군의 공격이 곧 벵가지에 도착할 것이다. 우리의 투브루크 수비군은 견고한 방어선을 구축할 것이니 지금 당장 투브루크로 철수하라.
dialogue_2952=공격이 순조롭게 진행되고 있으며, 우리 부대는 계속 바르디아 방향으로 공격할 것이다. 영국군의 주력은 당신에게 맡기겠다.
dialogue_2953=낙하산 부대가 이미 예정된 위치 주변에 도착했다. 적의 거점 도시를 신속히 점령하고, 영국 지원군이 도착하기 전에 크레타 섬의 수비군을 섬멸하라.
dialogue_2954=영국군이 크레타 섬 남부 해역으로 집결하고 있다. 우리 함대는 즉시 적군의 남쪽 연안의 집결지를 공격하여 그들의 퇴로를 막을 것이다.
dialogue_2955=독일군의 낙하산 부대가 섬에 착륙했다. 섬 각지의 거점과 시설을 굳게 지켜라. 해군 지원군이 곧 도착할 것이다.
dialogue_2956=수비군은 마지막 순간까지 싸웠지만, 크레타 섬의 독일군을 방어하기에는 병력이 부족했다.
dialogue_2957=우리 함대는 바다에서 독일군의 공격을 막을 수 없다. 이제 후퇴만이 유일한 선택일 수도 있다.
dialogue_2958=영국군의 반격은 기세가 사나웠지만, 적은 대규모 병력을 집결시켜 한 곳으로 공격하지 않았다.
dialogue_2959=영국군은 우리의 기갑 부대를 포위하려고 시도하고 있다. 먼저 방어선으로 후퇴하여 다시 보급하고 반격을 준비하라.
dialogue_2960=영국군은 여전히 상당한 수의 기갑 부대를 보유하고 있기 때문에 살룸 남부의 방어선을 돌파하는 것은 쉬운 일이 아닐 것이다.
dialogue_2961=살룸 방향으로 집결하여 동진하는 독일군을 막기 위해 방어선을 다시 세워라.
dialogue_2962=우리의 공세는 완전히 실패했다. 이제 남은 힘을 집중하여 독일군의 선두부대를 격파하고 살룸을 탈환해야 한다.
dialogue_2963=영국군은 지형을 이용하여 각 관문에 중병을 배치했다. 따라서 정면에서 돌파하면 큰 대가를 치르게 될 것이다.
dialogue_2964=우리 기갑 부대는 투브루크 남부에서 공격하여 연합군의 수비력을 분할할 것이다.
dialogue_2965=적군은 대규모 기갑 부대를 보유하고 있다. 정면으로 저항하면 승산이 없다. 후방 진지로 후퇴하여 요새와 지뢰밭에 의지하여 방어하라.
dialogue_2966=독일군은 우리 중심지에 침입했으니, 즉시 투브루크를 지원하고 우리의 방어선을 강화해야 한다.
dialogue_2967=독일군의 규모를 잘못 판단했다. 비록 현재의 병력이 지역 전체를 방어하기에 충분하지 않더라도 투브루크를 직접 포기할 수는 없다.
dialogue_2968=적은 힘이 다 빠진 상태이다. 엘 알라메인 지역으로 지원군을 계속 파견하라. 우리는 여기서 독일군과 결전을 벌일 것이다.
dialogue_2969=우리 부대는 엘 알라메인 남부에서 이집트 중심부를 향해 공격할 것이다.
dialogue_2970=반격은 매우 순조롭게 진행되었다. 우리는 이탈리아군의 진지를 뚫고 계속 공격하고 있다.
dialogue_2971=적이 수에즈 운하에 접근하고 있다. 카이로 북부 전선을 지키기 위해 더 많은 병력이 필요하다.
dialogue_2972=영국군은 여전히 카이로 주변에 여러 요새 진지를 보유하고 있다. 계속 동쪽으로 진격하고, 적의 후속 증원을 조심하라.
dialogue_2973=수에즈 운하를 봉쇄하고, 적의 함대가 수에즈 만으로 진입하지 못하게 하라!
dialogue_2974=연합군은 지중해에서 해군과 공군의 우위를 이용하여 우리의 보급선과 부대의 수송을 끊임없이 방해하고 있다.
dialogue_2975=지원군이 부족한 상황에서 연합군을 완전히 물리치는 것은 현실적이지 않고, 철수도 매우 어려워질 것이다. 우리 기갑 부대는 튀니지를 지키기 위해 최선을 다할 것이다.
dialogue_2976=우리는 오래전에 연합군과 합의했다. 병사들이여, 프랑스를 위해 싸워라.
dialogue_2977=전속력으로 전진하라. 적군의 방어선을 뚫고, 튀니지 수비군과의 연락을 회복하라.
dialogue_2978=독일군의 주력이 구조에 성공하면 그 결과는 상상할 수 없을 것이다. 우리는 시간과 싸움을 벌이며 튀니지에 대한 공격을 계속하고 있다.
dialogue_2979=연합군의 병력이 너무 많아서 우리는 물러날 길이 없다.
dialogue_2980=튀니지 내의 모든 적을 제거하면 우리의 반격이 곧 시작될 것이다.

event_106=스탈린그라드 전투
event_intro_106=1941년, 독일은 '바르바로사' 작전을 발동하여 소련의 광활한 영토를 휩쓸었고, 붉은 군대는 계속된 패퇴 속에서 생존을 위해 몸부림치며 고군분투하였으며, 고향은 파괴되고 국토가 점령당했다. 1942년, 독일군은 검은 강철의 홍수처럼 소련의 심장을 향해 다가왔다. 볼가 강변에 우뚝 서 있는 도시, 스탈린그라드는 국가의 생사가 걸린 최후의 방어선이 되었다. 소련에게 그것은 단순한 도시 방어가 아니라 운명과 존엄을 지키기 위한 싸움이 되었다. 국가 전체는 팽팽하게 조여진 끈처럼 스탈린그라드에서 운명적인 결전의 순간을 기다리고 있었다.

