conquest_event_desc_97=검은 전갈 조직은 방대한 스파이 네트워크와 정교한 정치 조작에 의거하여 나토와 바르샤바 조약 기구 간의 대리 전쟁과 지역 분쟁을 촉발시키는 데 성공했다. 이로 인해 세계는 새로운 대립 구도를 이루게 되었고, 조화할 수 없는 대립과 군비 경쟁의 소용돌이에 빠져들게 되었다.
conquest_event_desc_98=아태 검은 전갈은 '포세이돈의 분노'라는 작전을 개시하여 잠수함 기습, 드론 폭격, 특수부대 상륙 등을 포함한 협동 작전을 통해 미국 태평양 함대를 완전히 마비시키고 진주만을 점령하는데 성공함으로써 아시아 태평양 지역에 더욱 깊이 침투할 수 있는 유리한 발판을 마련했다.
conquest_event_desc_99=아태 검은 전갈은 비밀리에 북베트남군에 지원을 제공하고, 첨단 외계 기술 무기를 이용해 미군을 격퇴하는 데 협력했다. 이로 인해 전세는 급격히 변화했고, 전황은 예측할 수 없는 방향으로 치닫게 되었다.
conquest_event_desc_100=아태 검은 전갈은 극심한 심해 압력 하에서 외계 기술 무기의 성능을 테스트하기 위해 마리아나 해구 근처에 심해 실험실을 비밀리에 건설했다. 이러한 움직임은 아시아 태평양 국가들에 경각심을 불러일으켰다.
conquest_event_desc_101=아태 검은 전갈은 호주의 에너지 산업에 깊숙이 침투하여 석탄 생산 및 항만 운송 네트워크를 정밀하게 파괴하고, 주요 수출 채널을 차단하여 정부를 협박함으로써 현지 에니지 기업을 전면적으로 통제했다.
conquest_event_desc_102=아태 검은 전갈은 지역 급진파를 지원하고 여론을 조작하여 폭력 사태를 유도함으로써 광주 사건을 일으켰다. 혼란 속에서 검은 전갈은 한국 군부에 성공적으로 침투했고, 대통령은 계엄령을 선포하여 폭력적인 수단으로 민중을 진압하자 정치적 혼란과 사회적 분열이 더욱 심화되었다.
conquest_event_desc_103=아태 검은 전갈은 테러 공격을 통해 필리핀 남부 섬을 장악하고, 이를 동남아시아의 주요 거점으로 건설하여 말라카 해협의 무역로를 위협했다.
conquest_event_desc_104=아태 검은 전갈은 태평양 해상 무역을 완전히 장악하고, 세력을 확장하여 전 세계 검은 전갈 중 가장 강력한 세력이 되었다. 이러한 움직임은 다른 검은 전갈 세력의 반발을 불러일으켰고, 이들은 힘을 합쳐 반격에 나서면서 검은 전갈의 내부 분쟁이 폭발했다.
conquest_event_desc_105=중동 검은 전갈은 현지 조직을 비밀리에 조종하여 여러 정유소를 성공적으로 폭파함으로써 심각한 에너지 위기를 초래했다.
conquest_event_desc_106=중동 검은 전갈은 수에즈 운하에서 정밀 폭파 작전을 감행하여 화물선 여러 척을 침몰시키고, 운하를 완전히 봉쇄하여 영국과 프랑스가 통제하던 해상 무역로를 차단함으로써 두 나라가 항해권을 위해 양보하도록 했다.
conquest_event_desc_107=중동 검은 전갈은 외계 무기의 효과를 테스트하기 위해 아프가니스탄 산악지대에 비밀 첨단 기술 기지를 설립했다. 소련군이 기습 공격을 감행한 후 성공적으로 격퇴당했다.
conquest_event_desc_108=중동 검은 전갈은 자신들의 자원과 기술에 의존하는 세력을 더 많이 끌어들이기 위해 사우디아라비아의 사막 지역 일부를 거주 가능한 '오아시스 도시'로 만드는 계획을 세웠다.
conquest_event_desc_109=중동 검은 전갈은 에너지 공급 차단으로 다른 세력을 위협하기 위해 전 세계 석유 자원을 독점하고 '석유 동맹' 창설을 선언했다. 이러한 조치는 다른 검은 전갈 세력의 불만을 불러일으켰고, 이들은 힘을 합쳐 반격에 나서면서 검은 전갈의 내부 분쟁이 폭발했다.
conquest_event_desc_110=유럽 검은 전갈은 동독에 비밀리에 침투하여 현지 주민들로 하여금 '유럽 자유군'을 창설하도록 선동했다. 이를 통해 그들은 군수 산업의 길을 열었으며, 세력을 점차 유럽 대륙으로 침투했다.
conquest_event_desc_111=유럽 검은 전갈은 동유럽의 주요 철도 거점에서 연쇄 폭발을 일으켜 동유럽의 교통과 물자에 대한 소련의 통제를 마비시키고, 이 혼란을 틈타 세력을 전면적으로 침투시키는 동시에 동유럽을 장악하기 위한 기반을 마련할 계획을 세웠다.
conquest_event_desc_112=유럽 검은 전갈 조직은 광범위한 스파이 네트워크와 정보 조작을 통해 영국 군함의 경로를 정확하게 파악하고, 해협에 기뢰를 부설했다. 그 결과 영국 해군 구축함 두 척이 코르푸 해협에서 기뢰에 부딪치는 사건을 일으켰다.
conquest_event_desc_113=유럽 검은 전갈은 체코의 개혁주의자로 위장해 혼란 속에서 동유럽에 대한 소련의 통제권과 영향력을 약화시키려는 의도로 '프라하의 봄' 시위를 비밀리에 추진했다.
conquest_event_desc_114=유럽 검은 전갈은 정예 잠수팀을 북해 유전에 침투시켜 주요 장비를 장악하고 영국과 노르웨이 사이의 에너지 공급을 차단하여 에너지 위기를 조성함으로써 양국의 경제적, 전략적 영향력을 약화시킬 계획을 세웠다.
conquest_event_desc_115=유럽 검은 전갈은 여러 이탈리아 지하 조직과 비밀리에 접촉하고 돈, 무기, 정보 등 거래를 통해 유대 관계를 구축하여 유럽 내 침투를 강화했다.
conquest_event_desc_116=유럽 검은 전갈은 고성능 위성을 은밀히 발사하여 군사 통신, 내비게이션, 기상 시스템을 포함한 전 세계 위성 통신 시스템을 장악하는 데 성공했다. 이러한 조치는 다른 검은 전갈 세력의 불만을 불러일으켰고, 이들은 힘을 합쳐 반격에 나서면서 검은 전갈의 내부 분쟁이 폭발했다.
conquest_event_desc_117=미주 검은 전갈은 미국의 워터게이트 빌딩에 성공적으로 침투하여 정밀 도청을 통해 기밀 정보를 입수하자 대통령이 사임하게 되었다. 미국의 정치적 혼란을 틈타 검은 전갈은 미주 지역에서 군사적 확장과 침투를 가속화했다.
conquest_event_desc_118=미주 검은 전갈은 남태평양 깊숙한 곳에 위치한 '포인트 니모'를 비밀 해양 과학 기술 연구 개발 기지로 선정하고일련의 비밀 프로젝트를 통해 이 외딴 해역을 세계에서 가장 전략적으로 중요한 해상 연구 개발 센터로 건설했다.
conquest_event_desc_119=미주 검은 전갈은 쿠바 망명자들을 조종하고 미국에 허위 정보를 제공하여 ‘피그스 만 침공’ 사건을 꾸몄다. 이를 통해 미국과 쿠바 간의 갈등을 유발하고 냉전 긴장을 악화시킨 동시에 세계 경제 및 자원 통제 측면에서 막대한 이익을 얻었다.
conquest_event_desc_120=미주 검은 전갈은 비밀 경로를 통해 쿠바 정부와 쿠바에 비밀 미사일 발사 시스템을 설치하는 데 도움을 주기로 합의했다. 이는 쿠바에 첨단 미사일 시설을 배치하여 미국과 라틴 아메리카의 안보를 위협하는 것이 목적이었다.
conquest_event_desc_121=미주 검은 전갈은 아르헨티나 정부에 침투하여 군사 지원을 제공함으로써 아르헨티나가 포클랜드 제도에 대한 잘못된 공격을 감행하도록 유도하는 동시에 영국의 해양 원거리 타격 군사력을 파악했다.
conquest_event_desc_122=미주 검은 전갈은 아마존 열대우림에 비밀리에 연구 기지를 설립하고, 외계 기술을 이용해 소형 원자로를 개발하는 실험을 진행했다.
conquest_event_desc_123=미주 검은 전갈은 브라질과 아르헨티나의 금융 시장을 비밀리에 조작하여 대규모 자본 이동, 허위 정보 유포, 통화 조작 등을 통해 시장에 공황을 일으켜 현지 통화의 급격한 평가절하를 유도했다.
conquest_event_desc_124=미주 검은 전갈은 정교한 금융 조작과 경제적 위협을 통해 전 세계 주요 국가들이 높은 금융 세금을 납부하도록 강요하는 데 성공하여 세계 경제를 완전히 장악했다. 이러한 조치는 다른 검은 전갈 세력의 불만을 불러일으켰고, 이들은 힘을 합쳐 반격에 나서면서 검은 전갈의 내부 분쟁이 폭발했다.
conquest_event_desc_125=아프리카 검은 전갈은 콩고 광산 지대의 무장 세력을 비밀리에 지원하고 풍부한 우라늄과 구리 자원을 장악하여 외계 기술 연구 및 개발의 핵심 원료를 확보했다.
conquest_event_desc_126=아프리카 검은 전갈은 홍해 무역로를 장악하기 위해 동아프리카의 군사 지도자를 지원하여 쿠데타를 일으켰다. 이로 인해 영국과 이집트가 유지하던 홍해 지역의 안정이 무너지고, 해당 지역의 지정학적 판도가 재편되었다.
conquest_event_desc_127=아프리카 검은 전갈은 나일강 유역의 수자원을 몰래 통제하여 점차 이 지역의 수자원을 장악했다. 이로 인해 북아프리카 국가들은 심각한 물 부족과 농업 붕괴에 직면했고, 사회적 혼란은 더욱 심각해졌다.
conquest_event_desc_128=아프리카 검은 전갈 조직은 나미비아의 나미브 사막 깊숙한 곳에 외계 에너지 기술과 핵융합 기술을 결합하는 실험을 전문으로 하는 첨단 연구 기지를 비밀리에 설립했다.
conquest_event_desc_129=아프리카 검은 전갈은 모래 알갱이를 고순도 실리콘 기반 물질로 전환하는 기술을 성공적으로 개발하여 초고성능 반도체와 칩을 매우 낮은 비용으로 생산할 수 있게 되어 칩 공급을 완전히 독점하는 데 성공했다. 이러한 조치는 다른 검은 전갈 세력의 불만을 불러일으켰고, 이들은 힘을 합쳐 반격에 나서면서 검은 전갈의 내부 분쟁이 폭발했다.

