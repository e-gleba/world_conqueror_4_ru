event_stage_intro_20801=독일군이 마지노선을 우회해 기습 공격을 감행하자 저지 국가들도 연이어 함락당했다. 사령부는 '다이너모 작전'을 발동하여 우리에게 프랑스군 주력과 원정군이 됭케르크와 칼레로 철수할 수 있도록 전력으로 엄호하라는 명령을 내렸다. 무력을 숭상하는 이 시대에 유화 정책의 나쁜 결과는 우리 스스로 감당할 수밖에 없다. 전방이 아무리 험준하더라도 우리는 흔들림 없이 명령을 따를 것이다! 가문의 영광을 위해! 함께 싸우는 전우들을 위해! 영국 왕립 공군을 위해! 대영 제국을 위해!
event_stage_intro_20802=우리는 최고의 철수 기회를 놓쳤다. 알프레드는 공중전에서 낙하산을 사용해 성공적으로 탈출했지만, 그의 생사는 불확실하다. 하지만 누군가가 우리에게 알프레드와 다른 포로로 잡힌 전우들은 현재 산간 마을에 임시로 감금되어 있으며, 조만간 베를린으로 이송될 것이라는 중요한 목격 정보를 몰래 제공했다. 시간이 얼마 남지 않았으니 정보가 아무리 불확실하더라도 반드시 우리 동료를 구출하기 위해 시도해봐야 한다.
event_stage_intro_20803=서부 전선에서의 연합군 패배는 지상 전장이야말로 현대 전쟁의 핵심이며, 기갑 부대가 바로 지상 전장의 관건임을 증명했다. 현재 북아프리카 전장에서의 육군 패퇴는 당시 유럽 전장에서의 상황과 유사하다. 다른 점이라면 독일군의 공세가 비록 여전히 거세지만, 장비와 병력의 보급에서 우리가 우위를 점하고 있다는 것이다. 우리의 기갑 사단은 북아프리카 전장에서 적수를 찾기 어려울 것이다.
event_stage_intro_20804=기만 작전이 성공적으로 효과를 거두었다. 독일군의 노르망디 방어 공사는 아직 완공되지 않았다! 우리 앞의 황금 해변에서도 적의 중화기가 발견되지 않았다. 지금이 기회다! 나는 우군이 상륙할 수 있도록 해변에 거점을 확보할 것이다. 이 순간, 우리는 함께 싸워 승리를 되찾는 길에 들어설 것이다.
event_stage_intro_20805=왜 독일군은 아직도 이렇게 많은 병력으로 대규모 공격을 조직할 수 있는 걸까? 바스토뉴의 수비군은 포위망 안에 갇혀 철수할 수 없게 되었다. 지원군이 적의 동향을 예측하여 제때에 도착하지 않는 한, 우리는 마지막 희망을 영국군에게 걸 수밖에 없다.
event_stage_intro_20806=전쟁은 세계 구도를 완전히 바꾸었고, 미국과 소련은 새로운 패권국이 되었으며, 각 식민지가 잇달아 독립하면서 제국의 영토는 점점 줄어들어 과거의 영광은 아득해졌다. 새 정부의 지도 아래 우리는 조만간 미국의 속국으로 전락할 것이다. 그러나 소련군은 현재 멕시코 동부를 점령하고 육로를 따라 북상하여 미국을 침공하려고 한다. 새로운 시대의 전쟁이 시작되었으니 우리는 제국의 마지막 존엄을 지키기 위해 자체 무장 세력을 갖춰야 한다.
event_stage_intro_20807=유적의 발견은 미국과 소련 양국의 주목을 동시에 끌었다. 이 혁신적인 무기와 기술은 세계를 송두리째 뒤흔들 수 있는 힘을 지녔고, 이제 그들은 모두 움직이기 시작했다. 그러나 신비한 신호에 따라 우리 선발대가 남미의 유적지를 한발 앞서 발견했다. 그들이 누구든, 그들의 목적은 나와 마찬가지로 기존의 질서를 깨고 완전히 새로운 세계 질서를 세우려는 것 같다.
event_stage_intro_20811=독일군이 마지노선을 우회해 기습 공격을 감행하자 저지 국가들도 연이어 함락당했다. 사령부는 '다이너모 작전'을 발동하여 우리에게 프랑스군 주력과 원정군이 됭케르크와 칼레로 철수할 수 있도록 전력으로 엄호하라는 명령을 내렸다. 무력을 숭상하는 이 시대에 유화 정책의 나쁜 결과는 우리 스스로 감당할 수밖에 없다. 전방이 아무리 험준하더라도 우리는 흔들림 없이 명령을 따를 것이다! 가문의 영광을 위해! 함께 싸우는 전우들을 위해! 영국 왕립 공군을 위해! 대영 제국을 위해!
event_stage_intro_20812=우리는 최고의 철수 기회를 놓쳤다. 알프레드는 공중전에서 낙하산을 사용해 성공적으로 탈출했지만, 그의 생사는 불확실하다. 하지만 누군가가 우리에게 알프레드와 다른 포로로 잡힌 전우들은 현재 산간 마을에 임시로 감금되어 있으며, 조만간 베를린으로 이송될 것이라는 중요한 목격 정보를 몰래 제공했다. 시간이 얼마 남지 않았으니 정보가 아무리 불확실하더라도 반드시 우리 동료를 구출하기 위해 시도해봐야 한다.
event_stage_intro_20813=서부 전선에서의 연합군 패배는 지상 전장이야말로 현대 전쟁의 핵심이며, 기갑 부대가 바로 지상 전장의 관건임을 증명했다. 현재 북아프리카 전장에서의 육군 패퇴는 당시 유럽 전장에서의 상황과 유사하다. 다른 점이라면 독일군의 공세가 비록 여전히 거세지만, 장비와 병력의 보급에서 우리가 우위를 점하고 있다는 것이다. 우리의 기갑 사단은 북아프리카 전장에서 적수를 찾기 어려울 것이다.
event_stage_intro_20814=기만 작전이 성공적으로 효과를 거두었다. 독일군의 노르망디 방어 공사는 아직 완공되지 않았다! 우리 앞의 황금 해변에서도 적의 중화기가 발견되지 않았다. 지금이 기회다! 나는 우군이 상륙할 수 있도록 해변에 거점을 확보할 것이다. 이 순간, 우리는 함께 싸워 승리를 되찾는 길에 들어설 것이다.
event_stage_intro_20815=왜 독일군은 아직도 이렇게 많은 병력으로 대규모 공격을 조직할 수 있는 걸까? 바스토뉴의 수비군은 포위망 안에 갇혀 철수할 수 없게 되었다. 지원군이 적의 동향을 예측하여 제때에 도착하지 않는 한, 우리는 마지막 희망을 영국군에게 걸 수밖에 없다.
