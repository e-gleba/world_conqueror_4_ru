;将领关卡
general_stage_intro_101=1939년 9월 구데리안은 독일 19 전차 군단을 지휘해 폴란드를 향해 전격전을 펼쳤고, 동시에 소련도 동쪽에서 공격해 독일군과 협공을 벌여 폴란드는 빠르게 함락되었습니다. 이 전투는 제2차 세계대전의 시작을 알렸다.
general_stage_intro_102=1940년 5월, 구데리안은 계속해서 19 전차 군단을 이끌고 프랑스에 맞서 전격전을 시작했습니다. 독일군은 아르덴 숲을 통해 프랑스 마지노선을 우회하여 놀라운 속도로 프랑스로 진격했습니다.
general_stage_intro_103=1941년 9월, 독일군은 소련 북부 도시인 레닌그라드를 900일간 포위하기 시작했습니다. 이 기간 동안 도시는 심각한 폭격과 식량 부족을 겪었습니다. 이 전투는 현대사에서 가장 긴 포위전이었습니다.
general_stage_intro_104=이 전투는 2차 세계 대전 중 최대 규모의 전차전이자 동부 전선의 중요한 전환점입니다. 구데리안은 2 장갑군을 지휘해 공격에 가담했고 소련의 빈틈없는 방어선이 그를 기다리고 있었습니다.
general_stage_intro_105=1944년 10월, 소련군은 헝가리의 지배권을 쟁취하기 위해 헝가리의 수도 부다페스트를 포위했다. 소련의 강력한 포병 사격을 독일군은 어떻게 돌파할 것인가?
general_stage_intro_111=튀니스는 북아프리카 전선에서 독일의 마지막 요새입니다. 1942년 11월, 주로 영국과 미국으로 이루어진 연합군이 동쪽과 서쪽에서 공격하여 독일군을 물리치고 튀니지를 점령했습니다. 이로써 북아프리카 전역이 마무리 되었습니다.
general_stage_intro_112=1943년 7월, 연합국은 이탈리아 독재 정권을 전복시키기 위해 시칠리아에서 대규모 상륙작전을 벌였습니다. 이 전투는 유럽 전선에서 연합국의 중요한 승리였으며 이탈리아 본토에 대한 후속 공격의 기초가 되었습니다.
general_stage_intro_113=1944년 6월, 연합국은 서부 전선을 개전하고 프랑스를 해방시키기 위해 노르망디에서 전례 없는 규모의 상륙작전을 실시했습니다. 이 상륙 작전은 서부 전선에서 독일의 전략적 위치에 큰 위협이 되었고 유럽에서 연합국의 반격 작전의 시작을 알렸습니다.
general_stage_intro_114=이 전투는 태평양 전쟁에서 육군이 벌인 최대 규모의 전투였으며, 일본군의 참패로 끝났습니다.
general_stage_intro_115=1944년 12월, 연합국은 아르덴에서 독일군과 치열한 전투를 벌였습니다. 독일군은 춘계 공세를 시도했으나 연합국의 저항에 부딪혔습니다.
general_stage_intro_121=1941년 10월, 독일군이 모스크바를 점령하려고 했을 때, 주코프는 총사령관으로 임명되었습니다. 소련군은 강력한 방어와 끈질긴 반격으로 결국 독일의 공격을 물리치고 모스크바를 방어해냈습니다.
general_stage_intro_122=전투는 1942년 8월에 시작되어 이듬해 2월에 끝났습니다. 이 전투는 2차 세계 대전 중 가장 규모가 크고 치명적인 전투였으며 양측 모두 200만 명 이상이 사망했습니다. 주코프는 작전 기간 동안 소련군의 총사령관으로서 방어와 반격을 지원했습니다.
general_stage_intro_123=1943년 7월, 독일군이 마지막 대규모 공세를 시작했을 때, 주코프는 쿠르스크 전투에서 총참모장을 맡았습니다. 그는 소련군에게 반격을 명령했고, 이로 인해 독일군은 큰 손실을 입게 되었습니다. 이 전투 이후 독일은 주도권을 완전히 잃었습니다.
general_stage_intro_124=이 전투는 소련이 1944년 6월 벨라루스와 폴란드 지역 일부를 해방하기 위해 시작한 대규모 전략 공세였습니다. 결국 소련은 그들이 원하는 것을 얻었고 서부 영토 대부분을 회복했습니다.
general_stage_intro_125=1945년 4월 시작된 베를린 전투는 유럽 전역에서 제2차 세계대전의 마지막을 장식했습니다. 소련군 벨라루스 전선의 총사령관인 주코프는 소련군에게 나치 독일에게 항복을 강요하기 위해 독일의 수도 베를린을 점령하라고 명령했습니다.
general_stage_intro_131=1941년 4월, 롬멜의 군대는 토브룩 요새에서 영국-호주 연합군을 포위했지만 격렬한 저항에 부딪혔습니다. 영국군은 갇힌 연합군을 구출하기 위해 여러 차례 성공적이지 못한 공격을 시작했습니다. 그리고 나서 전쟁은 교착상태에 빠졌습니다.
general_stage_intro_132=1941년 6월에 벌어진 이 전투는 북아프리카 전선에서 독일군과 영국군 사이에 벌어진 최초의 실제 전차전이였으며, 롬멜은 영국군에 맞서 기동 방어를 지휘하여 승리를 거두었고, 토브룩을 구조하려는 영국의 환상을 깨뜨렸습니다.
general_stage_intro_133=1년 전, 롬멜은 토브룩의 항구 요새에서 패배했습니다. 이제 1942년 5월, 그가 군대 경력에서 가장 영광스러운 승리를 거두기 위해 어떤 전략을 사용할지 지켜볼 때입니다.
general_stage_intro_134=추축국은 이집트를 점령하고 수에즈 운하를 통제함으로써 전략 자원이 풍부한 중동을 장악하기를 희망했습니다. 엘 알라메인 전투는 1942년 10월에 벌어졌습니다. 연합국이 이 전투로 추축국의 야망을 막을 수 있을까요?
general_stage_intro_135=이 전투는 추축국이 1942년 11월 튀니스에서 연합국과 치열한 전투를 벌이며 연합국의 막대한 병참 보급과 끊임없는 압박에 독일과 이탈리아 연합군이 방어선을 구축하고 죽음까지 저항한 북아프리카 전선의 마지막 주요 전투였습니다.

