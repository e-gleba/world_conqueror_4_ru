event_intro_101=핀란드는 완전한 요새 시스템으로 만네르하임선을 건설하는 데 10년을 보냈습니다. 카렐리야 지협에 건설되었으며, 늪이나 호수와 같은 자연 장벽을 중심으로 여러 방어 구역이 구축되었습니다. 방어선에는 다수의 고정 발사 요새와 민간 화력 지점이 있습니다. 만네르하임선 뒤에는 백의의 전사들이 핀란드를 침공할 수 있는 어떤 적과도 맞서기 위해 빈틈없이 대기하고 있습니다.
event_intro_102=독일의 부상은 유럽 전역에 우려와 걱정을 불러일으켰고, 그들의 무한한 영토 확장은 유럽에 전쟁의 전망을 가져다 주었습니다. 넓은 국경은 폴란드를 피할 수 없는 표적으로 만들었습니다. 하지만 폴란드는 영국과 프랑스와 같은 그들의 동맹국들로부터 강력한 구두 지원을 받아서 너무 걱정할 필요가 없었습니다. 그러나, 폴란드를 눈여겨보는 나라가 독일뿐이었는가?
event_intro_103=수십억 프랑을 들여 건설된 마지노선은 공중 폭격과 대구경 포격을 포함한 다양한 공격을 견뎌낼 수 있었습니다. 내부에는 모든 종류의 화포, 참호, 벙커, 공장, 병원, 그리고 다른 군사 및 생활 시설이 있었습니다. 그러나 독일 지휘관들이 이 요새화된 방어선에 직접 맞설 것인가요? 아니면 저지대를 통해 프랑스를 공격하는 것으로 관심을 돌릴 것인가요? 아니면 다른 계획이 있을까요?

event_stage_intro_20101=서유럽 대륙은 모두 독일군의 지배하에 놓였습니다. 사령부는 바르바로사 계획을 세워 소련에 관심을 돌릴 것을 요구했습니다. 민스크는 우리의 주요 목표이며, 이를 점령하는 것은 소련에 큰 타격이 될 것이며 우리 군대의 사기에 매우 중요할 것입니다.
event_stage_intro_20102=독일군의 대규모 소련 침공은 핀란드에 절호의 기회입니다. 겨울전쟁 당시 소련이 점령한 영토를 탈환하기 위해 레닌그라드 북쪽에서 공세를 펼치는 등 독일군과 합동작전을 펼칠 것입니다.
event_stage_intro_20103=전격전의 힘은 소련의 허를 찌른 민스크에서의 승리에서 재확인되었습니다. 우리는 우리의 전차를 멈출 여유가 없습니다! 스몰렌스크가 정복되면, 우리는 이 보급 중심지와 군사 거점을 통제할 수 있을 것입니다. 이것은 이후의 공격에 더 나은 보급품과 병참 지원을 제공할 수 있습니다.
event_stage_intro_20104=우크라이나 지역은 소련의 곡창지대이자 주요 산업 중심지입니다. 키예프의 통제는 막대한 양의 자원과 산업을 통제하는 것을 의미합니다. 우리의 장갑 부대는 키예프 포위를 완료하고 도시를 점령하여 소련의 방어를 더욱 불안정하게 만들어야 합니다.
event_stage_intro_20105=발트해 지역에서 소련의 가장 중요한 항구인 레닌그라드는 소련의 중요한 경제적, 문화적, 역사적 중심지이기도 했습니다. 레닌그라드 함락은 소련의 방어력을 약화시킬 뿐만 아니라 소련 내부의 사기와 신뢰에도 큰 영향을 미칠 것입니다.
event_stage_intro_20106=크림 반도는 흑해의 진주로서 군사적으로 중요한 의미를 갖고 있습니다. 우리의 전차 사단은 중부 집단군으로 이관되었으며 현재는 보병과 화포만 운용 가능합니다. 하지만 구스타프 열차포의 지원은 우리가 세바스토폴 요새를 폭파하는 데 도움이 될 것입니다.
event_stage_intro_20107=우리의 공세는 막을 수 없습니다. 하르키우는 중요한 산업 도시이므로 우리는 진격을 가속화해야 합니다. 우리가 하르키우를 점령하기 전에 소련이 공장과 장비를 이전하도록 허용하지 마십시오.
event_stage_intro_20108=브랸스크와 뱌지마는 모스크바로 가는 길을 가로막는 최후의 장벽입니다. 모스크바 공격에 대비하기 위해서는 적의 방어를 약화시키고 전략적 공간을 확대해야 합니다.
event_stage_intro_20109=볼가 강의 스탈린그라드는 석유와 천연가스 자원이 풍부한 캅카스 지역의 주요 산업 중심지입니다. 적군은 방어를 위해 많은 병력을 배치했습니다. 오직 스탈린그라드의 함락만이 소련의 사기를 저하시키고 동부 전선에서 우리의 승리를 위한 길을 열 수 있습니다.
event_stage_intro_20110=모스크바의 추운 겨울은 우리의 수송 및 병참 보급에 심각한 영향을 미쳤습니다. 적의 저항은 처음보다 훨씬 더 격렬해졌습니다. 그럼에도 불구하고 이것이 우리의 전진을 막지는 못할 것입니다. 우리는 크렘린에서 승리의 샴페인을 맛보게 될 것입니다.

event_stage_intro_20111=서유럽 대륙은 모두 독일군의 지배하에 놓였습니다. 사령부는 바르바로사 계획을 세워 소련에 관심을 돌릴 것을 요구했습니다. 민스크는 우리의 주요 목표이며, 이를 점령하는 것은 소련에 큰 타격이 될 것이며 우리 군대의 사기에 매우 중요할 것입니다.
event_stage_intro_20112=독일군의 대규모 소련 침공은 핀란드에 절호의 기회입니다. 겨울전쟁 당시 소련이 점령한 영토를 탈환하기 위해 레닌그라드 북쪽에서 공세를 펼치는 등 독일군과 합동작전을 펼칠 것입니다.
event_stage_intro_20113=전격전의 힘은 소련의 허를 찌른 민스크에서의 승리에서 재확인되었습니다. 우리는 우리의 전차를 멈출 여유가 없습니다! 스몰렌스크가 정복되면, 우리는 이 보급 중심지와 군사 거점을 통제할 수 있을 것입니다. 이것은 이후의 공격에 더 나은 보급품과 병참 지원을 제공할 수 있습니다.
event_stage_intro_20114=우크라이나 지역은 소련의 곡창지대이자 주요 산업 중심지입니다. 키예프의 통제는 막대한 양의 자원과 산업을 통제하는 것을 의미합니다. 우리의 장갑 부대는 키예프 포위를 완료하고 도시를 점령하여 소련의 방어를 더욱 불안정하게 만들어야 합니다.
event_stage_intro_20115=발트해 지역에서 소련의 가장 중요한 항구인 레닌그라드는 소련의 중요한 경제적, 문화적, 역사적 중심지이기도 했습니다. 레닌그라드 함락은 소련의 방어력을 약화시킬 뿐만 아니라 소련 내부의 사기와 신뢰에도 큰 영향을 미칠 것입니다.
event_stage_intro_20116=크림 반도는 흑해의 진주로서 군사적으로 중요한 의미를 갖고 있습니다. 우리의 전차 사단은 중부 집단군으로 이관되었으며 현재는 보병과 화포만 운용 가능합니다. 하지만 구스타프 열차포의 지원은 우리가 세바스토폴 요새를 폭파하는 데 도움이 될 것입니다.
event_stage_intro_20117=우리의 공세는 막을 수 없습니다. 하르키우는 중요한 산업 도시이므로 우리는 진격을 가속화해야 합니다. 우리가 하르키우를 점령하기 전에 소련이 공장과 장비를 이전하도록 허용하지 마십시오.
event_stage_intro_20118=브랸스크와 뱌지마는 모스크바로 가는 길을 가로막는 최후의 장벽입니다. 모스크바 공격에 대비하기 위해서는 적의 방어를 약화시키고 전략적 공간을 확대해야 합니다.
event_stage_intro_20119=볼가 강의 스탈린그라드는 석유와 천연가스 자원이 풍부한 캅카스 지역의 주요 산업 중심지입니다. 적군은 방어를 위해 많은 병력을 배치했습니다. 오직 스탈린그라드의 함락만이 소련의 사기를 저하시키고 동부 전선에서 우리의 승리를 위한 길을 열 수 있습니다.
event_stage_intro_20120=모스크바의 추운 겨울은 우리의 수송 및 병참 보급에 심각한 영향을 미쳤습니다. 적의 저항은 처음보다 훨씬 더 격렬해졌습니다. 그럼에도 불구하고 이것이 우리의 전진을 막지는 못할 것입니다. 우리는 크렘린에서 승리의 샴페인을 맛보게 될 것입니다.

