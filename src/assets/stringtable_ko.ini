skill_info_162=함선을 지휘할 때 사기가 떨어지지 않으며, 함선 공격이 치명타일 경우 데미지 [#00FF00#%d%%] 증가. 함선을 지휘할 때 주변 2칸 내에 아군 항공모함이 있거나 자신이 항공모함일 경우 자신이 공군, 미사일, 핵 공격을 사용할 때 데미지 30%% 증가. 주변 2칸 내의 아군 항공모함 공군 사용 시 데미지 15%% 증가.
skill_info_163=함선을 지휘할 때 공격 및 공습 사용 시 [#00FF00#%d%%] 확률로 치명타 발동.(해당 스킬 보유 시 함대 지휘관 및 공군 지휘관 효과 무효)
skill_info_164=엘리트 보병을 지휘할 때 1칸 범위 내 아군 (자신 포함)이 지상 유닛에 대한 데미지 +10%% (엘리트 부대 레벨이 9 이상일 경우, +15%%). 범위 내 아군 엘리트 부대가 1개 더 있을 때마다 추가로 +[#00FF00#%d%%], 최대 누적 25%%.
skill_info_165=보병을 지휘하여 공격 후, 입힌 피해량의 [#00FF00#%d%%]만큼 HP 회복. 주변 1칸 내에 아군 기갑 또는 화포가 존재할 경우, 자신의 공격 및 반격 사정거리 +1.


