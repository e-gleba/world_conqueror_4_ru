general_stage_name_165=쿠르스크 전투

general_stage_intro_151=제2차 세계대전 북아프리카 전선의 마지막 전투이다. 아이젠하워는 연합군 사령관으로서 미영 연합군을 지휘하여 북아프리카의 추축국 방어선을 공격하고 성공을 거두었으며, 최종 1943년 5월에 튀니지를 탈환했다.
general_stage_intro_152=연합군 각국의 지도자들은 모두 다음 목표를 이탈리아라로 결정했다. 1943년 7월에 아이젠하워는 시칠리아 상륙작전의 최고 통수권자로 임명되어 연합군의 상륙과 전투를 성공적으로 지휘하였으며, 불과 한 달 만에 시칠리아 섬 전체를 점령했다.
general_stage_intro_153=1944년 6월, 연합군은 독일을 속이고, 노르망디에서 제2차 세계대전 중 가장 큰 규모의 상륙 작전을 실행했다. 최고 통수권자인 아이젠하워의 지휘 하에 연합군은 성공적으로 노르망디에 교두보를 마련하여 이후 유럽 대륙에서의 전투를 위한 토대를 마련했다.
general_stage_intro_154=노르망디 상륙작전 성공 후, 아이젠하워는 프랑스 남부에서 '용기병 작전'이라는 상륙작전을 추가로 지휘했다. 이 작전에서 연합군은 유럽의 두 번째 전선을 열어 독일군의 병력을 분산시켜 독일군의 패배를 가속화시켰다.
general_stage_intro_155=아르덴 전투에서 승리한 후, 아이젠하워는 가능한 한 빨리 소련군과 합류하여 라인 강으로 진군할 것을 고려했다. 1945년, 루르 포위전이 시작되었다.
general_stage_intro_161=1941년 10월, 독일군이 크림반도를 침공한 후, 제11군단은 만슈타인의 지휘 하에 세바스토폴을 공격했다. 이 전투는 만슈타인의 군사 경력에서 중요한 성과 중 하나이며, 그에게 원수의 지팡이를 안겨주었다.
general_stage_intro_162=만슈타인은 세바스토폴 전투에서 승리를 거두어 이름을 떨치게 되자, 최고사령부로부터 레닌그라드를 증원하라는 명령을 받았다. 1942년 8월, 만슈타인은 제11집단군을 이끌고 현대 역사상 가장 오래 지속된 포위전에 참전했다.
general_stage_intro_163=레닌그라드 전투가 끝나기도 전에 지휘부는 만슈타인에게 포위된 제6집단군을 구출하기 위해 스탈린그라드로 이동하라는 명령을 내렸다. 이번에 그는 순조롭게 임무를 완수할 수 있을까?
general_stage_intro_164=스탈린그라드 전투의 승리로 소련군은 계속 서쪽으로 진군하여 하르키우를 탈환하려 했다.
general_stage_intro_165=환경이 열악하고, 병력이 열세일지라도 만슈타인은 여전히 부대를 이끌고 소련군의 방어선을 돌파하여 남부의 적들을 격퇴시킬 수 있었다.

