feat_desc_116=3칸 범위 내에서 {1}개의 목표를 선택해 로켓포를 발사하여 피해를 입히고, 대상의 방어력 {2}% 감소. 지속 시간 2턴, 쿨타임 3턴.
feat_desc_116_Lv2=3칸 범위 내에서 {1}개의 목표를 선택해 로켓포를 발사하여 피해를 입히고, 대상의 방어력 {2}% 감소. 지속 시간 2턴, 쿨타임 2턴.
feat_desc_116_Lv3=4칸 범위 내에서 {1}개의 목표를 선택해 로켓포를 발사하여 피해를 입히고, 대상의 방어력 {2}% 감소. 지속 시간 2턴, 이번 공격에서 대상의 장갑 50% 무시, 쿨타임 2턴.
feat_desc_117=대상의 생명력이 {1}% 이상일 경우, 이번 공격에서 반드시 치명타 발동.
feat_desc_118=매 턴 시작 시 최대 생명력의 {1}%에 해당하는 생명력 회복. 생명력이 50% 이상일 경우 받는 피해 {2}% 감소.
feat_desc_119=공격 또는 반격 시, {0}% 확률로 대상을 2턴 동안 혼란 상태에 빠뜨림.
feat_desc_120=공격 시 양쪽 포신에서 각각 포탄 한 발씩 발사하여 독립적으로 목표를 명중하고, 각각 {1}%의 기본 피해 입힘.

