feat_desc_43_Lv2=작전 완료 후 다시 작전할 수 있음. 지속 시간 1턴. 두 번째 작전으로 적군을 섬멸할 경우 {1}%의 확률로 다시 공격할 수 있음(한 번만 가능).
feat_desc_47_Lv3=우군 유닛 1개의 체력을 {1}포인트 회복하고, 매 턴마다 추가로 해당 목표 유닛의 생명 50포인트 회복. 지속 시간 2턴. 스킬을 사용하는 동시에 자신의 체력 {2}포인트 회복. 쿨타임 1턴.
feat_desc_50_Lv2=적의 여러 부대 공격 시 기타 목표 유닛에 대한 데미지가 감소하지 않고, 치명타 데미지 {1}% 증가.
feat_desc_51_Lv2=다음 공격 사거리 +2, 공격은 추가로 목표 도시 또는 요새의 체력 {1}% 감소(최대 1200), 도시 수비 부대 체력 {2}% 감소(최대 500). 쿨타임 2턴.
feat_desc_57_Lv2=보병, 장갑차, 야포 또는 곡사포 1개를 목표 지대로 수송하고, 수송 도중 {1}% 체력 회복.
feat_desc_60_Lv2=2칸 범위 내 감응 기뢰 설치. 쿨타임 1턴.
feat_desc_61_Lv2=다음 공격 시 목표 대상 주변 1칸 내 랜덤으로 다른 적군 1개에게 피해 입힘. 쿨타임 2턴.
feat_desc_62_Lv2=자신의 주변 1칸 내 적군을 혼란 상태에 빠지게 함. 지속 시간 1턴, 쿨타임 3턴. 3개 이상의 목표에 영향을 미칠 시 쿨타임 1턴.
feat_desc_64=넘쳐난 치명타 확률은 추가 피해로 전환되며, 넘쳐난 치명타 확률 {2}%당, {1}%의 추가 피해를 입힘.
feat_desc_65=적 부대 방어력  {1}% 무시.
feat_desc_66=이번 턴에서 전차 유닛에 대한 데미지 {1}% 증가, 쿨타임 2턴.
feat_desc_67=반격 데미지 +{1}%.
feat_desc_68=공격 후 상대가 섬멸될 경우 {0}% 확률로 다시 행동할 수 있으며, 최대 {2}회.
feat_desc_69=자기 주변 1칸 범위내의 우군 부대 공격 시, {0}% 확률로 자신도 공격에 참여.
feat_desc_69_Lv2=자기 주변 1칸 범위내의 우군 부대 공격 시, {0}% 확률로 자신도 공격에 참여하며, 데미지 {1}% 증가.
feat_desc_70=공격 시, 대상 유닛 1칸 범위 내 기타 대상에게 {1}%의 추가 피해 입힘, 쿨타임 2턴.
feat_desc_71=추가 공격 {1}회.
feat_desc_72=공항 내 모든 일반 비행기를 사용할 수 있으며, 최대 비행기 포인트 {1}포인트.
feat_desc_72_Lv3=공항 내 수송기를 제외한 대부분의 비행기를 사용할 수 있으며, 최대 비행기 포인트 {1}포인트.
feat_desc_73=일반 공격이 전차 유닛에 대한 데미지 {1}% 증가.

