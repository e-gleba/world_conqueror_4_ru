event_stage_intro_20601=스탈린그라드 도시 내의 독일군은 힘이 다 빠진 상태이며, 모든 건물은 우리의 요새이자 토치가가 되었다. 이 영웅적인 도시는 독일군의 가장 맹렬한 공격을 막아냈다! 우리의 부대는 끊임없이 집결하고 있으며, 적과 아군의 병력은 이미 역전되어 반격의 순간이 곧 다가오고 있다.
event_stage_intro_20602=독일군은 하르키우를 다시 점령했다. 정보에 따르면 그들은 쿠르스크 돌출부에 있는 우리 수비군을 섬멸하기 위해 대량의 기갑 부대를 집결하여 대규모 공격을 개시할 준비를 하고 있다. 우리는 여러 개의 견고한 방어선을 구축하고, 이 방어선에 대량의 병력을 배치하여 독일군을 기습할 것이다.
event_stage_intro_20603=독일군은 드네프르 강 양쪽의 방어 시설을 계속 강화하고 있지만, 대규모 방어선을 단기간에 완성하는 것은 불가능하다. 이 기회를 이용하여 드네프르 강 하류에서 대규모 공세를 개시하여 키예프를 점령하고, 전선을 계속 서쪽으로 밀고 나가라. 이 과정에서 독일군의 반격을 조심하고, 공격의 주력을 보존하라.
event_stage_intro_20604=부대를 레닌그라드 주변에 집결했다. 거의 3년 동안 포위되어 있던 이 영웅 도시는 곧 해방을 맞이할 것이다. 그러나 독일군은 서쪽에 견고한 방어선을 구축했다. 공세를 감행하여 북방 집단군을 물리치고 서쪽으로 진군할 길을 뚫어야 한다.
event_stage_intro_20605=크림반도는 독일군이나 우리에게 모두 군사적으로 중요한 가치를 지녔다. 앞의 방어선을 돌파하기만 하면 크림반도 전체를 육로에서 고립시키는 동시에 북쪽과 케르치 반도 동쪽에서 공격을 가할 수 있다. 적의 패배는 시간문제일 뿐이며, 세바스토폴의 요새는 결국 우리가 탈환할 것이다.
event_stage_intro_20606=쿠르스크, 드네프르 강 하류, 크림반도의 공세를 거친 후 중앙 집단군이 드러났다. 동시에 독일군은 우리의 속임 작전에 넘어가 일부 병력을 남쪽의 북우크라이나 군단으로 이동시켰다. 부대는 이미 집결을 완료했으니 지금이 바로 전면 공세를 감행할 시기이다. 적들이 3년 전의 어리석은 행동에 대가를 치르게 하라!
event_stage_intro_20607=서부 전선의 연합군은 라인 강 앞에 막혔고, 독일군은 동부 전선에서 최후의 힘을 모아 필사적인 싸움을 준비하고 있다. 그러나 적의 정예 병력은 대부분 손실되었으니, 신속히 서쪽으로 진격하여 가능한 한 빨리 서부 전선의 연합군과 합류하라. 베를린의 운명은 이미 정해졌다.
event_stage_intro_20611=스탈린그라드 도시 내의 독일군은 힘이 다 빠진 상태이며, 모든 건물은 우리의 요새이자 토치가가 되었다. 이 영웅적인 도시는 독일군의 가장 맹렬한 공격을 막아냈다! 우리의 부대는 끊임없이 집결하고 있으며, 적과 아군의 병력은 이미 역전되어 반격의 순간이 곧 다가오고 있다.
event_stage_intro_20612=독일군은 하르키우를 다시 점령했다. 정보에 따르면 그들은 쿠르스크 돌출부에 있는 우리 수비군을 섬멸하기 위해 대량의 기갑 부대를 집결하여 대규모 공격을 개시할 준비를 하고 있다. 우리는 여러 개의 견고한 방어선을 구축하고, 이 방어선에 대량의 병력을 배치하여 독일군을 기습할 것이다.
event_stage_intro_20613=독일군은 드네프르 강 양쪽의 방어 시설을 계속 강화하고 있지만, 대규모 방어선을 단기간에 완성하는 것은 불가능하다. 이 기회를 이용하여 드네프르 강 하류에서 대규모 공세를 개시하여 키예프를 점령하고, 전선을 계속 서쪽으로 밀고 나가라. 이 과정에서 독일군의 반격을 조심하고, 공격의 주력을 보존하라.
event_stage_intro_20614=부대를 레닌그라드 주변에 집결했다. 거의 3년 동안 포위되어 있던 이 영웅 도시는 곧 해방을 맞이할 것이다. 그러나 독일군은 서쪽에 견고한 방어선을 구축했다. 공세를 감행하여 북방 집단군을 물리치고 서쪽으로 진군할 길을 뚫어야 한다.
event_stage_intro_20615=크림반도는 독일군이나 우리에게 모두 군사적으로 중요한 가치를 지녔다. 앞의 방어선을 돌파하기만 하면 크림반도 전체를 육로에서 고립시키는 동시에 북쪽과 케르치 반도 동쪽에서 공격을 가할 수 있다. 적의 패배는 시간문제일 뿐이며, 세바스토폴의 요새는 결국 우리가 탈환할 것이다.
event_stage_intro_20616=쿠르스크, 드네프르 강 하류, 크림반도의 공세를 거친 후 중앙 집단군이 드러났다. 동시에 독일군은 우리의 속임 작전에 넘어가 일부 병력을 남쪽의 북우크라이나 군단으로 이동시켰다. 부대는 이미 집결을 완료했으니 지금이 바로 전면 공세를 감행할 시기이다. 적들이 3년 전의 어리석은 행동에 대가를 치르게 하라!
event_stage_intro_20617=서부 전선의 연합군은 라인 강 앞에 막혔고, 독일군은 동부 전선에서 최후의 힘을 모아 필사적인 싸움을 준비하고 있다. 그러나 적의 정예 병력은 대부분 손실되었으니, 신속히 서쪽으로 진격하여 가능한 한 빨리 서부 전선의 연합군과 합류하라. 베를린의 운명은 이미 정해졌다.

dialogue_2900=근거리 전투가 매우 효과적이어서 독일군은 도시 내에서 힘겹게 싸우고 있다.
dialogue_2901=독일군 측면의 루마니아군 진지를 향해 공격하여 적의 방어선을 뚫고, 파울루스의 제6집단군을 완전히 포위하라.
dialogue_2902=소련군이 아직도 대규모 공격을 감행하기에 충분한 병력을 보유하고 있다니 정말 놀라운 일이다. 파울루스가 스탈린그라드에서 군대를 철수하도록 즉시 스탈린그라드 방향을 지원하라.
dialogue_2903=적의 기갑 부대가 돈 강을 따라 스탈린그라드로 진군하고 있다. 나는 최선을 다해 그들을 막을 것이다.
dialogue_2904=우리가 루마니아군의 방어선을 뚫었다. 이 포위망을 완성하고 스탈린그라드의 독일군을 완전히 섬멸하라.
dialogue_2905=파울루스는 적시에 포위망을 뚫지 못하여 구조 작전이 실패했다. 서쪽으로 후퇴하여 방어선을 재조직하라.
dialogue_2906=우리는 더 이상 후퇴할 여지가 없다.
dialogue_2907=독일군의 진지를 공격하라! 적의 공격 계획을 뒤틀어놓아라.
dialogue_2908=소련군의 화력을 두려워하지 말고 '요새' 계획을 계속 실시하라. 남북 양쪽의 소련군 방어선을 돌파하라.
dialogue_2909=지원군이 도착했다. 우리는 어떤 대가를 치르더라도 벨고로드 방향의 독일군의 돌파를 막아야 한다.
dialogue_2910=남북 양쪽 독일군의 공격을 지연시켜라. 오룔 돌출부를 해결하기 위한 시간을 확보하라!
dialogue_2911=오룔이 함락되었다. 소련군은 얼마 지나지 않아 새로운 공세를 개시할 것이다.
dialogue_2912=즉시 후퇴하고 브랸스크 동쪽에서 방어선을 재조직하라.
dialogue_2913=소련군의 병력은 예상보다 훨씬 더 많고, 나의 기갑 부대는 막대한 손실을 입어 더 이상 공격할 수 없다.
dialogue_2914=승승장구하여 벨고로드와 하르키우를 탈환하라!
dialogue_2915=독일군은 드네프르 강 연안에 많은 교두보를 설치했다. 적의 방어는 시간이 지날수록 더욱 강화될 것이다.
dialogue_2916=좌안의 독일군을 신속히 해결하라. 드네프르 강을 따라 우리의 병력을 전개하여 대규모 총공세를 펼쳐라.
dialogue_2917=좌안의 진지가 연이어 함락되어 더 이상 새로운 방어 공사를 구축할 겨를이 없게 되었다.
dialogue_2918=소련군이 이 천연적인 방어선을 쉽게 뚫을 수 없도록 드네프르 강 연안을 지원하라.
dialogue_2919=우리는 키예프를 탈환하여 서쪽으로 공격할 수 있는 길이 열렸다.
dialogue_2920=우리는 라도가 호를 통해 레닌그라드 주변 지역으로 대량의 병력을 수송하였으니 언제든지 공격을 개시할 수 있다.
dialogue_2921=나르바 일대의 방어선은 비교적 완비되었기 때문에 이 방어선에 의존하여 소련군의 공격을 막을 수 있다.
dialogue_2922=레닌그라드 북부의 독일군은 섬멸되었지만, 출해구에는 여전히 독일군의 함대가 있어 나의 부대는 전선에 도달하는 데 시간이 좀 걸릴 것이다.
dialogue_2923=해상의 위협이 제거되었다. 우리 부대는 독일군의 마지막 방어선에 대한 전면 공격을 개시할 것이다.
dialogue_2924=소련군은 병력이 많아서 공격이 예상보다 더 맹렬하다. 레닌그라드 주변 요새 거점 내의 수비군에게 나르바의 방어선으로 철수하라고 통보하라.
dialogue_2925=지휘부는 우리의 철수 계획을 승인하지 않았고, 소련군은 끊임없이 크림 지역으로 몰려들고 있다.
dialogue_2926=독일군에게 숨을 돌릴 기회를 주지 말고 계속 공격하여 크림반도와 외부를 연결하는 육상 통로를 차단하라.
dialogue_2927=헤르손으로 철수하여 방어선을 재조직하라. 그리고 드네프르 강 연안에서 소련군의 공격을 막아라.
dialogue_2928=우리 부대는 서쪽으로 계속 공격하여 독일군을 드네프르 강 우안으로 몰아낼 것이다.
dialogue_2929=세바스토폴의 요새를 공격하고 단 한 명의 독일군도 놓치지 말아라.
dialogue_2930=독일군은 여전히 크림반도로 부대를 수송하고 있기에 반드시 적군의 해상 수송로를 파괴해야 한다.
dialogue_2931=적은 우리의 주요 공격 방향을 잘못 추측했다. 이 기회를 잡아서 민스크 주변의 독일군을 신속히 포위하고 소멸시켜라.
dialogue_2932=소련군의 추진이 너무 급속하니 우리 부대는 즉시 출발하여 전속력으로 민스크 방향으로 증원할 것이다.
dialogue_2933=우리는 주요 작전 목표를 달성했지만, 독일군의 방어선도 붕괴되었다. 이 기회를 잘 이용하여 계속 서쪽으로 빠르게 진격하라.
dialogue_2934=소련군은 북쪽에서도 공격을 개시했다. 적이 이 출해구를 쉽게 장악하지 못하도록 리가 방향으로 원군을 파견하라.
dialogue_2935=독일군은 연속 패퇴하고 있어서 적군은 우리의 조수 같은 공격에 견디지 못할 것이다!
dialogue_2936=우리는 최고의 방어 시기를 놓쳤다. 하지만 군인으로서 나는 조국을 위해 끝까지 싸울 것이다.
dialogue_2937=전속력으로 전진하라! 미군과 합류하여 적의 수비군을 갈라놓아라.
dialogue_2938=독일군은 우리와 끝까지 싸울 준비가 되어 있다. 계속 베를린을 향해 공격하라. 우리 군대는 북쪽의 장애물을 제거할 것이다.
dialogue_2939=승리는 우리의 것이다! 계속 공격하고 여전히 저항하는 모든 독일군을 섬멸하라!
dialogue_2940=곳곳의 방어선이 뚫렸고, 연합군은 사방에서 베르린으로 진군하고 있다.
dialogue_2941=우리 부대는 마지막 순간까지 계속 싸울 것이다.
dialogue_2942=나의 실패는 아무것도 아니다. 베를린의 운명은 이미 정해졌다.
dialogue_2943=연합군은 포로 수용소를 해방하는 데 성공했다. 우리는 자유를 얻었다! 계속 공격하여 독일군을 섬멸하라!

