disband_the_army=부대를 해산하면 부대가 사라집니다. 계속하시겠습니까?


dialogue_3536=당신들이 필요한 물자를 계속 공급할 것이다.
dialogue_3537=준비하라! 앞으로 펼쳐질 전투는 이전 어떤 전투보다도 더욱 혹독할 것이다.
dialogue_3538=익숙한 장면인가? 이런 상황은 지금 이 순간에도 세계 곳곳에서 벌어지고 있다. 그리고 당신이 다음 차례가 될 수도 있다.
dialogue_3539=적은 결코 무적이지 않다. 지금부터 반격이다!
dialogue_3540=적이 사방에서 공격을 개시했고, 많은 도시가 함락되었다.
dialogue_3541=나는 모든 이에게 자신이 자유를 추구할 힘과 용기를 가지고 있음을 증명할 것이다!
dialogue_3542=지휘부는 적군 부대와 무기 장비에 관한 대량의 정보를 입수했다. 이 정보를 제공한 지휘관들 또한 향후 작전에서 우리와 함께 싸울 것이다.
dialogue_3543=이게 우리의 모든 정예 부대이다. 당신은 무엇을 해야 할지 잘 알고 있을 것이다.
dialogue_3544=우리는 적의 공격을 막아낼 방법이 없다.
dialogue_3545=먼저 극동 기지로 철수하여 그곳의 소련군 동향을 감시하라.
dialogue_3546=알프레드가 제공한 정보에 따르면, 수마트라섬에 있는 적군의 방어가 상대적으로 허술하다고 한다.
dialogue_3547=우리는 이곳에서 기습을 감행하여 오스본을 견제할 것이다.
dialogue_3548=겨우 이 정도 병력으로 싱가포르 방면으로 공격을 감행하다니, 영국군의 움직임이 매우 수상하다.
dialogue_3549=핵 시설 주변 방어선을 사수하라! 절대 소련군이 그곳을 점령하게 해서는 안 된다!
dialogue_3550=우리는 해상에서 공격을 개시하여, 적의 퇴로를 차단할 것이다.
dialogue_3551=신속히 상륙 작전을 실행하여 남부의 적군을 섬멸하라. 우리는 이곳에서 북쪽으로 반격을 개시할 것이다.
dialogue_3552=시대의 흐름을 아는 자가 지혜로운 자이고, 변화에 통하는 자가 영웅이다. 우리의 싸움은 아직 끝나지 않았다.
dialogue_3553=나에게는 선택의 여지가 없다.
dialogue_3554=해안선을 따라 공격하라! 아군과 협력하여 해안의 수비대를 협공하고 섬멸하라.
dialogue_3555=적 해군의 주력은 여기에 없는 것 같다. 우리는 이 지역의 모든 적 함대를 섬멸할 것이다.
dialogue_3556=증원군이 도착하기 전까지, 나는 내 위치를 사수할 것이다.
dialogue_3557=너희의 승리는 아무런 의미가 없다. 우리는 다시 돌아올 것이다.
dialogue_3558=검은 전갈 기지의 데이터는 성공적으로 복구되었고. 하지만 오스본에 관한 정보는 발견하지 못했다.
dialogue_3559=알프레드, 지난 전투에서 당신은 이미 당신의 가치를 증명했다. 당신이라면 오스본을 완전히 해결할 수 있을 것이라고 믿는다.
dialogue_3560=내게 맡겨라.
dialogue_3561=바로 지금이다. 작전을 시작하라.
dialogue_3562=검은 전갈은 이미 실패를 겪었고, 아마 두 번 이상일 수도 있다.
dialogue_3563=네가 왜 여기 있는 거냐?
dialogue_3564=너의 결말을 목격하기 위해서다. 우리 모두를 희생시켜서라도 달성하려던 그 결말을 말이다.
dialogue_3565=내가 당신의 소원을 이뤄주겠다.
dialogue_3566=나는 바로 너다. 우리 저편에서 만나자.
dialogue_3567=나는 내 판단을 결코 의심하지 않는다.
dialogue_3568=적군의 전투력은 예상보다 훨씬 강하다.
dialogue_3569=운명은 거스를 수 없다.
dialogue_3570= 우리의 싸움은 아직 끝나지 않았다.
dialogue_3571=작전을 중단하고 철수하라.
dialogue_3572=여기까지다.
dialogue_3573=미국과 소련의 지배적인 지위는 여전히 흔들림이 없다.
dialogue_3574=정보가 계속해서 틀리고 있다. 우리는 전장의 상황을 스스로 판단해야 한다.
dialogue_3575=알프레드, 당신은 모든 것을 끝냈지만, 결국 아무것도 끝내지 못했다.
dialogue_3576=시설은 이미 가동되었고, 우리는 떠날 준비를 마쳤다. 안녕, 또 다른 나여.
dialogue_3577=이곳의 시설은 단지 당신을 스캔해서 새로운 당신을 창조하고, 이전의 모든 것을 완벽히 계승할 것이다.
dialogue_3578=그리고 당신은 그저 옛 시대의 잔상일 뿐, 결국 나와 함께 이곳에서 사라질 것이다.
dialogue_3579=아마 당신 말이 맞을지도 모르지만, 가장 끔찍한 악몽 속에서도, 나는 여전히 내가 나라고 믿는다.
dialogue_3580=어쩌면 우리는 머지않아 다시 만나게 될 것이다.
dialogue_3581=이제 실행하라.
dialogue_3582=우리는 이 진실을 안타깝게 생각한다.
dialogue_3583=남은 적군을 완전히 섬멸하고 남극 기지를 다시 탈환하라!


