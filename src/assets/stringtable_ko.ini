elite_intro_65=IS-3 중전차는 소련이 제2차 세계대전 말기에 개발한 중전차로, 강력한 122mm 화포 하나가 장착되었고, 독특한 '쐐기 장갑' 디자인으로 유명하다. 이러한 디자인 덕분에 장갑 보호 방면에서 상당한 우위를 가지게 되었으며, 냉전 기간에도 일정한 억지력을 유지했다.
elite_intro_66=지상의 슈투카 로켓포는 독일군이 하프트랙 차량으로 개조한 다연장 로켓포이다. 이 로켓포는 우군의 최전방 부대에 원가가 낮고, 조작이 간편하고, 기동성이 뛰어난 광범위 포화 공격을 제공하는데 사용되었다.
elite_intro_67=프랑스 역사상 유명한 추기경인 리슐리외의 이름을 따서 명명하였다. 본 함선은 4중 380mm 주포 포탑 2개를 장착하였다. 장갑과 수중 보호 면에서 이 전함은 당시 첨단 수준이었으며, 일본의 야마토급 전함보다 약간 뒤처진 정도이다.
elite_intro_68=아카기호는 일본 해군 제1항공함대의 주력 항공모함으로 기동 부대의 상징으로 여겨졌다. 이 항공모함의 함재기 조종사들은 모두 엘리트 조종사들이다. 이 항공모함은 진주만 공습, 인도양 전투, 미드웨이 해전을 포함한 여러 중요한 전투에 참여했다.
elite_intro_70='회색 유령', '빅 E' 등 별명을 가진 엔터프라이즈급 항공모함은 태평양 전쟁에서 미 해군의 거의 모든 중요한 전투에 참전하여 적함 71척을 격침시키고, 적함 192척에 부상을 입히고, 적기 911대를 격침시켰다. 오늘날까지 미 해군의 함선 중 그와 비교할 만한 함선이 없다.

