;;normal texts,tips
;__font_type[font_text_1]
tips_1=과학기술을 업그레이드하시면 부대의 전투력이 상승합니다.
tips_2=불가사의는 시나리오 및 도전을 통해 획득하실 수 있습니다.
tips_3=불가사의를 건설하면 금전, 에너지, 공업, 과학기술 등의 자원을 얻을 수 있습니다.
tips_4=무역 시장이 나타났습니다. 무역을 통해 자원을 교환할 수 있습니다.
tips_5=시나리오 외의 미션을 통해 더 많은 자원과 보상을 얻으실 수 있습니다.
tips_6=낙하산병을 잘 이용하면 작전을 보다 효율적으로 수행하실 수 있습니다.
tips_7=핵은 미사일이나 전략폭격기에 장착 후 발사가 가능하며, 미사일 발사대를 가지고 있는 도시의 경우, 미사일을 발사할 수 있게 됩니다.
tips_8=방공 시설은 적군의 공습 및 미사일으로부터 받는 데미지를 감소시킬 수 있습니다.
tips_9=요새를 건설하면 작전의 효율성이 높아지지만 건설에 상당한 시간이 소요됩니다.
tips_10=육군이 해상에서 활동하려면 수송선에 탑승해야 합니다. 수송선을 적 해군과의 교전으로부터 최대한 보호하십시오.
tips_11=장군이 강할수록, 미션 완료로 인한 보상도 늘어나게 됩니다.
tips_12=지휘관 등급을 높일수록 더 많은 장군을 사용하실 수 있습니다.
tips_13=일부 스킬은 전투에서 초록색 목표를 점령하면 획득하실 수 있습니다.
tips_14=부대가 적군을 소멸시키면 확률적으로 사기가 매우 높아지게 되며, 전투력이 대폭 상승하게 됩니다.
tips_15=적 부대의 사기가 하락하거나 심각하게 떨어졌을 때 신속히 공격하십시오.
tips_16=적 부대로부터 협공을 받게 되면 사기가 하락할 수 있습니다. 부대가 포위를 당할 경우 사기가 심각하게 하락합니다.
tips_17=항공모함의 공격 범위와 공군의 공격 범위는 같습니다. 공격 범위를 증가시키려면 공군 기술을 업그레이드해야 합니다.
tips_18=순양함과 항공모함 같은 대형 전함을 상대하기 위해서는 잠수함을 이용하는 것이 최고입니다.
tips_19=엔지니어 특성을 지닌 보병을 보유하고 있으면 대량의 지뢰들로부터 받는 데미지를 줄일 수 있습니다.
tips_20=장군, 턴, 점령한 도시의 수 등의 요인은 정복 후 최종 점수와 등급에 영향을 미치게 됩니다.
tips_21=정복 과학기술 등급이 상승할수록 건물 등이 해금되며 더 높은 등급의 건물로 고급 유닛을 생산할 수 있습니다.
tips_22=사령부에서는 지휘관님의 부대을 고용하여 훈련, 침입, 대규모 전투 등에 참가할 수 있습니다.


challenge_2=우군의 목표 대상을 보호하고, 적군의 목표 대상을 소멸시키십시오.
challenge_3=아군의 목표 구역이 점령당하지 않도록 보호하십시오.
challenge_4=가장 빠른 시간 내에 모든 적군의 목표 대상을 소멸 시키십시오.

