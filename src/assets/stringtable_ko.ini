armygroup_event_desc_98=바르샤바 조약기구의 기갑집단군이 라인강 북안으로 맹렬한 돌격을 개시하여, 48시간 내에 서독의 '라인 방어선'을 돌파하려 시도했다. 미군 공병 부대는 진격 속도를 늦추기 위해 일부 교량을 미리 폭파했다.
armygroup_event_desc_99=나토 다국적 함대가 북해에서 협동 대잠수함 작전을 전개했으며, 양측이 수차례 근거리 교전을 벌여 소련 잠수정 다수가 피해를 입었다. 해협 연안 도시는 1급 방어 태세에 돌입했다.
armygroup_event_desc_100=동서 베를린에서 동시에 시가전이 발발했다. 동독 수비군은 건물과 공장을 이용해 다중 화력 거점을 구축했다. 서베를린 수비대는 미군의 공수 지원 하에 우회 돌파를 전개했다. 베를린은 유럽 대륙에서 전화가 가장 밀집된 지역 중 하나가 되었다.
armygroup_event_desc_101=소련 공수사단이 나토의 보급 중추를 마비시키려 새벽에 브뤼셀 동쪽의 공항을 기습했다. 벨기에와 네덜란드 기갑여단은 즉시 반격에 나섰으며, 격전으로 인해 유럽 최대 탄약고 중 일부가 폭발했다.
armygroup_event_desc_102=소련 포병 집단군이 고밀도 포격으로 서독 전방 진지를 덮쳐 '잿더미 화력 지대'를 형성했다. 서독의 도시 기반 시설은 심각하게 파괴되었다.
armygroup_event_desc_103=바르샤바 조약군 부대가 체코 남서부로 우회 진격하여 나토 남부 전선 보급선을 차단하기 위해 고속 기갑 돌파 전술을 사용했다. 이에 이탈리아와 프랑스 군이 기동 부대를 파견하여 증원했다.
armygroup_event_desc_104=나토 공군이 바르샤바 조약군의 통신 중추인 부다페스트를 대상으로 정밀 폭격을 감행했다. 헝가리 인민군은 즉시 부다페스트에 다중 대공 방어 진지를 배치했으며, 수백 발의 대공 로켓이 밤하늘을 밝혔다. 도시 전체는 이틀 만에 전시 봉쇄 상태에 들어갔다.
armygroup_event_desc_105=루마니아 포병 연대가 소련군과 협력하여 카르파티아 산맥에 종심 진지를 구축하여 이탈리아와 남독일의 증원 경로를 봉쇄하려 했다. 나토 산악 부대는 극히 험준한 대체 경로를 따라 돌파해야 했으며, 보급선이 심각한 위기에 처하게 되었다.
armygroup_event_desc_106=나토는 오데사를 봉쇄하여 소련 남부의 보급로를 차단하려 했다. 이에 대해 바르샤바 조약 기구군은 미사일을 발사하여 역봉쇄 작전을 펼쳤다. 해안선 여러 곳에서 미사일 궤적이 탐지되며 오데사의 방공 체계는 막대한 압력을 받고 있다.
armygroup_event_desc_107=스웨덴, 덴마크, 독일 해군이 연합하여 발트해 출구를 봉쇄했다. 소련 발트해 함대는 리가와 칼리닌그라드 두 방향에서 동시 돌파를 시도했지만, 나토 정찰기에 실시간으로 포착되었고, 두 지역에서 해상 및 공중 교전이 동시에 발발했다.
armygroup_event_desc_108=소련 장거리 항공대가 런던에 포화 미사일 공격을 감행했으며, 템스강 남안에 여러 곳의 연소 지역이 발생했다. 영국 전시 내각은 전국에 비상 최고 대비태세 돌입을 긴급 명령했으며, 런던 지휘 중추는 일시적으로 연락이 끊겼다.
armygroup_event_desc_109=맨체스터가 점령당하자, 도시 주변의 산업 지구는 생산을 중단해야 했다. 이로 인해 영국의 군수 시스템은 짧은 시간 안에 '핵심 부품 부족' 사태가 발생했고, 나토는 캐나다와 미국의 산업 능력을 긴급히 동원해 보충했다.
armygroup_event_desc_110=리버풀 함락으로 인해 나토의 대서양 보급 항로가 제한되었다. 미군 해상 수송 사령부는 임시로 아이슬란드 항로를 우회하였으며, 서부 전선 전체 부대의 보급 일정은 강제로 조정되었다.
armygroup_event_desc_111=소련 항공군은 발트해 방향에서 깊숙이 침투해 예테보리 항구 시설에 막대한 타격을 입혔다. 스웨덴 전역은 최고 등급의 방공 경계 태세에 돌입했다.
armygroup_event_desc_112=코펜하겐이 바르샤바 조약군의 돌격 여단에 점령되면서 덴마크 해협의 통제권이 소련군에게 넘어갔다. 나토는 발트해로의 진출 능력을 상실했다.
armygroup_event_desc_113=바르샤바 조약군의 미사일이 샹젤리제 거리 상공에서 폭발하며, 거대한 충격파가 거리 전체를 휩쓸었다. 엘리제궁은 즉시 외부 통신이 끊겼고, 대통령은 지하 지휘 센터로 긴급히 이동했다.
armygroup_event_desc_114=바르샤바 조약군 특공대가 브뤼셀 외곽을 돌파하자 나토 본부가 위태로워졌다. 정보 유출을 막기 위해 나토는 '흑야 작전'을 실행했고, 일부 비밀 문서가 긴급히 파기되었다.
armygroup_event_desc_115=로테르담 항구가 대형 미사일과 포격 공격을 받아 대규모 유류 저장소와 컨테이너 구역이 불바다가 되었다. 나토의 해상 운송 능력은 크게 감소되었고, 전선 부대의 보급이 전반적으로 지연되었다.
armygroup_event_desc_116=베네치아가 해상 및 공중 협공을 당하면서 여러 역사적 지역이 강제적으로 대피했다. 이탈리아군은 치열한 전투에 돌입했으나 동유럽 방면에서 진격하는 기갑 부대를 막기 어려웠다.
armygroup_event_desc_117=세바스토폴이 함락되면서 흑해 함대는 전면 북쪽으로 철수할 수밖에 없었고, 소련군 남부 전선에 큰 공백지대가 나타났다.
armygroup_event_desc_118=민스크가 함락되면서 바르샤바 조약군의 중부 거점이 완전히 제거되었다. 붉은 군대 지휘부는 긴급 이동을 시작했으며, 스몰렌스크 회랑 전체가 극도의 긴장 상태에 놓이게 되었다.
armygroup_event_desc_119=바르샤바가 나토에 점령되면서 폴란드 정면 전선은 순식간에 와해되었다. 소련군과 폴란드 인민군 주력은 브레스트 방향으로 패주할 수밖에 없었고, 바르샤바 조약군 서부 측면 전체가 적의 화력에 노출되었다.
armygroup_event_desc_120=키예프가 나토의 손에 넘어가면서, 소련군 다수 집단군은 드네프르강을 넘어 재편성해야 했고, 남중부 전선 전체에 거대한 공백지대가 발생했다.
armygroup_event_desc_121=런던이 함락되면서 영국 전역에 계엄령이 선포되었다. 영국 본토의 지지점을 잃은 나토 서부 측면은 흔들리기 시작했으며, 해협 방어선의 붕괴는 북해와 대서양 방면의 균형을 완전히 무너뜨렸다.
armygroup_event_desc_122=바르샤바 조약군이 중부 유럽 방면으로 대규모 전자 교란을 시행하여 나토 레이더가 수십 킬로미터 범위 내에서 모두 마비되었다.


