countrytech_desc_322=엘리트 로켓포를 수송기로 수송 가능.
countrytech_desc_417=구축함, 순양함, 전함 이동력 +4.
countrytech_desc_418=항공모함 함재기 공격 범위 +3.
countrytech_desc_419=구축함, 순양함, 전함 사거리 +1.
countrytech_desc_420=항공모함 함재기가 도시, 요새 등 유닛에 대한 데미지 +30%.
countrytech_desc_421=구축함, 순양함, 전함은 적군 섬멸 후, 100% 확률로 재공격 가능.
countrytech_desc_422=엘리트 항공모함은 공격할 때마다 100% 확률로 대상에게 II 레벨 이온포 1회 발사.
countrytech_desc_517=전투기와 폭격기는 공격 시 50%의 확률로 전리 방사선 효과 추가.
countrytech_desc_518=공중 부양 유닛은 턴당 최대 HP의 15% 회복.
countrytech_desc_519=고정익 공군 생산 비용 -20%.
countrytech_desc_520=공중 부양 유닛 이동력 +3.
countrytech_desc_521=공중 부양 유닛 공격 범위 +1.
countrytech_desc_522=공중 부양 유닛이 적군을 섬멸 후, 100% 확률로 재공격 가능.
countrytech_desc_523=미사일의 데미지 30% 증가.


dialogue_3304=다른 부대와 신속하게 연락하여 좌표 위치의 기지에서 합류하라.
dialogue_3305=전쟁 지역에 정체불명의 군대가 갑자기 나타났다! 평화 회담이 위태로워졌으니, 즉시 공격을 개시하라!
dialogue_3306=통신이 복구되었다. 오스본, 살아있었구나!? 내 주변에 다국적 부대뿐만 아니라, 심지어 독일군까지 나타났다!
dialogue_3307=나는 항상 내 신념을 위해 싸워왔기 때문에 죽음을 두려워하지 않는다. 이건 콜슨과 나의 비밀 열쇠다. 오스본, 나머지 일은 당신에게 맡기겠다.
dialogue_3308=나는 이미 실패했지만, 성공은 나의 운명이다! 너희들의 희생은 헛되지 않을 것이다.
dialogue_3309=윌리엄스가 왜 거기에 나타났지? 그들은 누구 편인가? 저것들은 무슨 무기인가?
dialogue_3310=지원군이 전장에 도착했다. 독일군의 공습은 우리의 행군 속도를 심각하게 지연시켰다.
dialogue_3311=기지 주변의 아군과 연락이 닿았고, 시설들은 정상적으로 작동되고 있다. 이제 쓰러진 전우들을 위해 복수할 때이다.
dialogue_3312=레티시아의 영토 분쟁은 이제 전면전으로 확대되었다. 우리는 콜롬비아를 도와 승리를 거두고, 독일의 세력이 전 세계에 퍼지게 할 것이다.
dialogue_3313=이런 형태의 충돌과 전쟁은 이곳에서 끊임없이 벌어지고 있다. 이번은 처음도 아니고, 마지막도 아닐 것이다.
dialogue_3314=페루 군대가 왜 우리를 향해 총을 쏘는 건가! 우리는 결코 무기를 내려놓고 항복하지 않을 것이다.
dialogue_3315=젠장, 방금 당신은 부대를 지휘하여 콜롬비아와 페루군을 동시에 공격했다. 이제 당신을 안전한 곳으로 이동시켜야 한다.
dialogue_3316=안전한 곳 하나가 있는데, 바로 삼국 국경 근처의 밀림 속에 위치하고 있다.
dialogue_3317=너희였구나! 이제 알겠다.
dialogue_3318=주변의 독일군 부대를 우선적으로 섬멸하여 콜슨과 그의 부하들을 위해 길을 열어줘라.
dialogue_3319=당신들은 누구인가? 왜 우릴 돕는 건가?
dialogue_3320=당신들의 무지와 용기를 위해서.
dialogue_3321=어디선가 당신을 본 것 같네.
dialogue_3322=
dialogue_3323=어쨌든 한 가지는 확실해. 우리가 이 상황에 처한 건 당신 때문이야.
dialogue_3324=다른 위협이 제거되면, 기지에서 이 모든 것을 설명하겠다.
dialogue_3325=프랑코의 아프리카 군단이 수송기의 도움으로 최전선에 성공적으로 도착했다. 그들은 남쪽에서 마드리드를 향해 공격할 것이다.
dialogue_3326=정보에 따르면 독일 콘도르 군단은 주력을 동원했다. 적의 대규모 공습으로 빌바오는 빠르게 함락될 것이다.
dialogue_3327=마드리드와 바르셀로나를 사수하고, 반란군의 협공을 막아라.
dialogue_3328=내전이 발발했고, 모든 것이 오스본이 말했던 대로 진행되고 있다.
dialogue_3329=진격을 가속화하고 마드리드를 포위하기 위해 우리 공군 부대는 북쪽에서 아직 저항하고 있는 공화당군을 섬멸할 것이다.
dialogue_3330=정보에 따르면 이탈리아군의 정예 부대가 동쪽에서 상륙했다. 그들의 행동 경로를 보면 사막을 건너 우리 후방을 노리려는 것으로 보인다.
dialogue_3331=후퇴하지 말고 기갑 부대를 이용해 보병 부대의 방어를 지원하고 동쪽 방어선을 강화하라.
dialogue_3332=너무 늦게 도착한 것은 아니지. 영국 쪽 계획은 아주 순조롭게 진행되고 있다.
dialogue_3333=우리는 프랑코를 격퇴했다. 하지만 반란군은 여전히 남쪽에서 계속 몰려오고 있다.
dialogue_3334=적은 우리의 의도를 눈치챘지만, 동시에 적의 방어 배치도 혼란에 빠졌다. 작전을 중단하고 철수하라.
dialogue_3335=신속한 지원에 감사하다. 하지만 내 판단으로는 공화국군이 이 전쟁에서 패배할 것 같다.
dialogue_3336=부대는 이미 막대한 피해를 입었다. 사령부는 모든 지원 부대에 동쪽으로 집결하여 철수를 준비하라는 명령을 내렸다.
dialogue_3337=우리는 다시 만날 것이다. 당신들의 구세주의적 신념이 당신들을 점점 더 깊은 수렁에 빠지게 하지 않길 바라네.
dialogue_3338=스페인의 황금기는 이미 역사가 되었으며, 과거의 식민지처럼 끝없는 순환 속에 빠져들었다. 우리의 길은 어디에 있는가?
dialogue_3339=식민 통치자, 군벌, 자본가들의 시대는 끝났다. 이 세상은 변혁이 필요하고, 내가 필요하다. 그리고 나는 당신들이 필요하다.
dialogue_3340=미국을 지지하는 이란 정부는 미국이 중동에서 지리적, 전략적 우위를 확보하는 데 크게 기여할 것이다. 우리는 한국전쟁의 실수를 반복해서는 안 된다.
dialogue_3341=우리는 아이젠하워와 그의 동맹국을 너무나 잘 알고 있다. 그렇기 때문에 우리는 이미 대응책을 마련해두었다. 이제 작전을 개시하라.
dialogue_3342=우리는 소련군에게 당했다! 그들은 이미 테헤란과 북부 여러 도시를 장악했으며, 심지어 이라크와 터키를 침공했다.
dialogue_3343=계획대로 계속 진행하라. 우리에게도 숨겨둔 카드가 있다.
dialogue_3344=루카스가 자주 여러분 이야기를 했다. 여러분의 입장과 이번엔 어떤 행동을 취할지 궁금하다.
dialogue_3345=석유 사업 덕분에 우리는 중동 지역에서 여러 부유한 나라와 친구가 되었다. 그리고 우리에게는 공통의 적이 있는데, 그것만으로도 충분하다.
dialogue_3346=당신 말이 맞다. 하지만 이번엔 겉으로는 중립을 유지해야 한다. 약간의 군비 지원 정도는 가능하다.
dialogue_3347=우리는 직접 부대를 파견하지 않을 것이만, 당신들이 필요한 물자를 계속 공급할 것이다.
dialogue_3348=정보국은 이미 그 점을 고려했다. 용병과 무장 병력은 주요 도시 주변에 미리 배치해두었다.
dialogue_3349=이건 무슨 포인가?
dialogue_3350=제 특허입니다. 나중에 설계 원리를 차근차근 설명해드리죠.
dialogue_3351=소련군의 전면적인 공격이 우리 기지를 위협하고 있다. 지금 즉시 반격을 개시하라.
dialogue_3352=테헤란 작전은 이미 성공을 거두었다. 믿을 만한 정보에 따르면 적군은 공격의 중심을 바꾸고, 이란으로 대규모 증원을 보낼 계획이다.
dialogue_3353=소련군은 우리에 의해 이 땅에서 쫓겨나고 있다.
dialogue_3354=위성 통제권을 성공적으로 탈취했다. 위성 무기가 가동되었다.
dialogue_3355=주변의 소련군을 처치하라. 우리는 당신의 안전을 보장하겠다.
dialogue_3356=남미에서의 작전으로 우리의 존재가 알려졌다. 더 이상 위장할 필요가 없다.
dialogue_3357=반란군이 쿠릴열도에 있는 우리 연구 기지를 점령했다. 부대를 집결해 그곳을 탈환하라.
dialogue_3358=소련군 내부 인원이 제공한 자료가 있더라도 이렇게 짧은 시간 내에 탈취를 완료할 수는 없다. 도대체 어떻게 해낸 건가?
dialogue_3359=재능이 있으면 도리어 시샘을 받는구나. 연구 협력에서 성과를 이루었으나, 예상치 못한 살육의 재앙을 불러왔다.
dialogue_3360=새로운 미일 안보 조약은 우리의 이익을 배신했다! 우리는 승리하거나 죽을 때까지 계속 싸울 것이다.
dialogue_3361=일본 국내의 봉기는 미군의 주의를 분산시켰다. 지금이 우리가 철수하기에 좋은 기회이다.
dialogue_3362=아니, 봉기군의 지도자도 우리의 구출 목표 중 하나이다.
dialogue_3363=위대한 사람은 하늘과 땅 사이에서 살기 위해 태어났으니, 어찌 다른 이들 아래에 오래 머물겠는가.
dialogue_3364=대업은 아직 이루어지지 않았고, 천명은 거스릴 수 없다.
dialogue_3365=적의 주요 거점이 진압되었다. 우리와 협력하라. 홀로 싸운다면 승산이 없다.
dialogue_3366=시대의 흐름을 아는 자가 지혜로운 자이고, 변화에 통하는 자가 영웅이다. 당신들과 합류하겠다. 우리의 싸움은 아직 끝나지 않았다.
dialogue_3367=나는 머무를 곳이 없어서 사방으로 떠돌고 있었는데, 여러분이 구해준 덕분에 살 곳을 갖게 되었다.
dialogue_3368=이 분리주의자들은 오스본의 선동으로 연맹의 단결을 계속 파괴하고 있다. 동유럽의 검은 전갈 세력을 뿌리째 없애기 위한 조치가 필요하다.
dialogue_3369=동방 그룹 내에서 분열이 일어나고 있다. 아마도 소련군은 이미 무력을 통해 이 문제를 해결할 계획을 세웠을 것이다.
dialogue_3370=임무는 순조롭게 완료되었고, 나는 우리 가문의 실력을 증명했다. 필요하다면 추가적인 군사적 지원도 제공할 수 있다.
dialogue_3371=소련군은 국경을 넘었다. 우리는 자국 영토에 타국의 군대를 주둔시키는 것을 절대 용납하지 않는다.
dialogue_3372=영원한 친구도, 영원한 적도 없다. 즉시 원군을 파견하여 유고슬라비아와 루마니아를 지원하라. 단, 검은 전갈의 부대를 조심하라.
dialogue_3373=소련군의 정보에 따르면, 바그너는 이미 검은 전갈 조직에 합류했다. 즉시 조치를 취해야 한다.
dialogue_3374=이럴 수가!
dialogue_3375=소련군을 위해 싸울 것인가? 아니면 자신을 위해 싸울 것인가? 이제 선택권은 너희 손에 달렸다.
dialogue_3376=젠장, 또 너희들인가! 답을 원한다면 알려주마.
dialogue_3377=모든 것을 정확하게 예측할 수 있는 사람도 없고, 한 사람의 힘으로 전쟁의 결과를 결정할 수도 없다.
dialogue_3378=보아하니 너희는 나를 놓아주지 않을 모양이군.
dialogue_3379=계속해서 공격해라. 이 포는 내 손에서 최대의 위력을 발휘할 것이다.
dialogue_3380=폴란드의 소련군은 우리에 의해 진압되었으며, 우리 부대는 계속해서 동쪽으로 진격할 것이다.
dialogue_3381=국지적인 승리는 미국과 소련의 유럽 내 세력을 뒤흔들 수 없을 것이다.
dialogue_3382=그건 당연하지만, 우리는 적들이 서로를 소모시킬 수 있는 모든 기회를 놓치지 않을 것이다.
dialogue_3383=동부 전황은 점점 더 치열해지고 있다. 캘리포니아와 텍사스의 반란군은 그곳에서 동맹을 결성하고 점차 우위를 점하고 있다.
dialogue_3384=미국은 나약한 대통령이 필요하지 않다.
dialogue_3385=전술은 모든 것을 깰 수 있으나, 오직 빠른 속도만은 깰 수 없다.
dialogue_3386=반란군의 후방 본부를 먼저 점령하면, 이 전쟁을 미리 끝낼 수 있을 것이다.
dialogue_3387=동부 전황은 되돌릴 수 없게 되었다. 이곳의 상황도 새로운 국면을 맞이할 것이다.
dialogue_3388=이제 적절한 시기에 공격을 멈추고 방어로 전환할 때가 된 것 같다.
dialogue_3389=먼저 멕시코 기지로 철수하고, 텍사스의 미군을 감시하라.
dialogue_3390=워싱턴은 반란군 동맹에 의해 점령되었다. 전 세계가 다시 한 번 우리의 결단력과 힘을 목격하게 될 것이다.
dialogue_3391=네가 어떤 미국인이든, 오스본과 그의 검은 전갈은 우리의 적이다. 미군은 지구 끝까지 너를 쫓아갈 것이다.
dialogue_3392=그렇다면, 덤벼라.
dialogue_3393=국내 상황이 안정되면서 더 많은 동맹들이 우리와 함께 검은 전갈에 맞서 싸우고 있다.
dialogue_3394=남극 유적지에 대한 기술 분석이 중대한 성과를 거두었다. 어떤 세력도 남극에 발을 들여놓게 해서는 안 된다.
dialogue_3395=우리의 연구는 곧 완성될 것이다. 이 무식한 사람들에게 진정한 힘을 보여줘라!
dialogue_3396=아니, 어떻게 이럴 수가 있을까?
dialogue_3397=우리의 일련의 행동은 소련의 연구 과정을 지연시키지 못한 것 같다. 하지만 아직 시간이 있다.
dialogue_3398=검은 전갈 기지의 데이터는 성공적으로 복구되었고, 자료에 따르면 우리는 지금 미래로부터 공격을 받고 있다. 하지만 오스본에 관한 정보는 발견하지 못했다.
dialogue_3399=함대는 섬 군도의 동쪽 해역을 봉쇄했다. 검은 전갈 부대 간의 연락이 끊겼다.
dialogue_3400=남극의 모든 적을 섬멸하라. 아무도 살아서 이곳을 떠날 수 없다.
dialogue_3401=새로운 전차 프로토타입이 완성되었다. 이 무기의 위력은 남미 전투에서 충분히 입증되었다.
dialogue_3402=소련군의 연구가 성공했다. 이것이 양산되면, 그 결과는 상상할 수 없을 것이다.
dialogue_3403=소련군을 막기 위해 우리와 함께하기에는 아직 늦지 않았다.
dialogue_3404=이 첨단 군사 장비 외에도, 더 놀라운 기술이 있다.
dialogue_3405=오스본, 무지가 너의 진정한 무기였구나.
dialogue_3406=대군은 연기가 되어 사라지고, 세계는 내 발밑에서 불타고 있다.
dialogue_3407=오스본, 괜찮은가? 상태가 좀 이상하네.
dialogue_3408=먼 미래에는 전쟁만 있을 뿐이다.
dialogue_3409=그는 마치 다른 사람이 된 것 같다.
dialogue_3410=다른 열두 개의 열쇠는 모두 모았고 살아남았다. 이번엔 내가 이겼다!
dialogue_3411= 전쟁은 결코 변하지 않는다.

event_209=검은 전갈의 부상

