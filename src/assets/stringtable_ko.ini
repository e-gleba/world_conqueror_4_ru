elitepass_not_started=엘리트 통행증 이벤트가 시작되지 않았습니다.
elitepass_rule=엘리트 통행증 규칙
elitepass_rule_1=1. 엘리트 통행증은 시즌당 28일 동안 열리며, 종료 24시간 전에는 고급 엘리트 통행증과 특급 엘리트 통행증을 구매할 수 없습니다.
elitepass_rule_2=2. 일일 도전은 고정된 게임 접속 임무 외에 나무지 2개 도전 임무는 랜덤으로 생성되며, 매일 도전 임무를 3번 새로 고칠 수 있습니다.
elitepass_rule_3=3. 다음 시즌의 엘리트 통행증을 개통한 후, 이전 시즌에 수령하지 않은 보상은 엘리트 통행증을 열 때 자동으로 팝업되어 수령할 수 있습니다.
elitepass_rule_4=4. 사용하지 않은 고급 엘리트 통행증과 특급 엘리트 통행증의 잠금 해제 횟수는 다음 시즌의 엘리트 통행증이 열린 후 사용할 수 있습니다.
elitepass_rule_5=5. 엘리트 도전 미션 중 스테이지 클리어 이벤트의 통계 규칙은 현재 시즌 시작 후 스테이지 클리어 횟수를 기준으로 합니다.
elitepass_rule_6=6. 모든 엘리트 통행증 보상의 잠금을 해제한 후, 60포인트를 획득할 때마다 추가 보상을 받을 수 있습니다. 또한, 보상 횟수는 누적할 수 있습니다.
