event_stage_intro_20701=총리는 우리가 영국군을 공격할 것을 거듭 재촉했다. 그러나 부대의 기계화 정도가 너무 낮고, 대량의 장비와 물자 보급이 부족하기 때문에 이번 공세는 지속될 수 없을 것이다. 지금은 우리의 병력 우위로 다른 방면의 단점을 보충할 수밖에 없다. 이집트를 향해 전진하라.
event_stage_intro_20702=영국군의 반격 속도는 매우 놀랍지만, 적은 우리의 부대의 병력을 잘못 판단했다. 이제 그들은 힘이 다 빠진 상태여서 우리는 키레나이카의 수비군을 하나씩 격파할 수 있다. 영국군의 전투력을 섬멸하는 것을 주요 목표로 삼고, 전속력으로 전진하며 단 한 명의 적도 놓치지 말아라!
event_stage_intro_20703=그리스의 연합군은 전부 격파되었고, 크레타 섬은 지중해에서 적의 마지막 중요한 거점이 되었다. 이 섬을 탈취하면, 우리는 이를 발판으로 키프로스를 점령할 수 있고, 심지어 바다에서 이집트를 공격할 수 있다.
event_stage_intro_20704=영국군은 투브루크로 가는 길을 뚫기 위해 새로운 공세를 개시했다. 우리는 이미 기존의 방어 시설을 다시 보강하고 영국군의 진격에 대비해 새로운 진지를 구축했다. 게다가 보급과 지원군도 속속 도착할 것이니 우리는 북아프리카 전쟁터에서 다시 주도권을 장악할 것이다.
event_stage_intro_20705=투브루크와 그 주변 지역의 포위망이 곧 완성될 예정이지만, 현재 우리는 여전히 대규모 공격을 펼치기 위한 물자와 장비가 부족한 상황이다. 그러나 영국군의 주동적인 출격은 오히려 우리에게 이 문제를 해결할 기회를 주었다. 보급선이 지나치게 길어서 발생할 수 있는 일련의 문제를 방지하기 위해 속전속결로 적의 병력을 섬멸하라.
event_stage_intro_20706=우리의 보급선 길이는 이미 한계에 도달했다. 적의 해군과 공군은 여전히 지중해 해역에서 우리에게 상당한 위협을 가하고 있다. 영국군을 비롯한 연합군 부대는 홍해와 수에즈 운하를 통해 병원 물자를 끊임없이 보충하고 있다. 상황은 심각하지만, 이것이 북아프리카 전쟁터에서 우리의 마지막 전투이자 우리의 운명을 결정할 전투이다.
event_stage_intro_20707=연합군은 모로코와 알제리에서 다시 공세를 일으켰다. 미군은 육로의 추진 속도를 높였고, 영국 해군도 지중해의 모든 전력을 튀니지 만으로 집결시켰다. 현지 비시 프랑스의 수비군은 이미 연합군과 연락을 취했을 수 있다. 위기가 다가오고 있다. 우리는 남은 힘을 다해 튀니지에서 끝까지 지키며 롬멜의 주력이 도착할 때까지 기다릴 것이다.
event_stage_intro_20711=총리는 우리가 영국군을 공격할 것을 거듭 재촉했다. 그러나 부대의 기계화 정도가 너무 낮고, 대량의 장비와 물자 보급이 부족하기 때문에 이번 공세는 지속될 수 없을 것이다. 지금은 우리의 병력 우위로 다른 방면의 단점을 보충할 수밖에 없다. 이집트를 향해 전진하라.
