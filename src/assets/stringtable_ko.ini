achievement 2805=전선 모드의 강철의 영광 챕터 클리어
achievement 2806=전선 모드의 얼음으로 뒤덮인 전선 챕터 클리어
achievement 2807=전선 모드의 최고 지령 챕터 클리어
achievement 2808=전선 모드의 연합 출격 챕터 클리어
achievement 2809=전선 모드의 검은 전갈 제국 챕터 클리어
achievement 2810=전선 모드의 북극광 계획 챕터 클리어
achievement 2901=보통 난이도로 모든 2차 세계대전 시나리오 클리어
achievement 2902=보통 난이도로 모든 2차 태평양 전쟁 시나리오 클리어
achievement 2903=보통 난이도로 모든 냉전 시나리오 클리어
achievement 2904=보통 난이도로 모든 현대전쟁 시나리오 클리어
achievement 3001=어려움 난이도로 모든 2차 세계대전 시나리오 클리어
achievement 3002=어려움 난이도로 모든 2차 태평양 전쟁 시나리오 클리어
achievement 3003=어려움 난이도로 모든 냉전 시나리오 클리어
achievement 3004=어려움 난이도로 모든 현대전쟁 시나리오 클리어


;战役对白
;__font_type[font_text_1,font_text_2]
dialogue_1001=지휘관님께, 제가 기본 조작법을 설명해드리겠습니다.
dialogue_1002=유닛 아래에 표시되는 흰색 테두리는 이 유닛이 행동할 수 있음을 의미합니다.
dialogue_1003=유닛을 클릭하면 이동 가능한 지역이 깜박거리게 됩니다. 적의 지뢰를 밟으면 HP가 감소합니다.
dialogue_1004=각기 다른 건물에서 서로 다른 유닛을 생산할 수 있으며 건물을 업그레이드하여 더욱 다양한 종류의 유닛을 생산할 수 있습니다.
dialogue_1005=유닛을 생산하기 위해서는 자원이 소모됩니다. 유닛 생산 시 종류에 따라 개체 수 및 편제 설정이 가능합니다.
dialogue_1006=지휘관님은 장군을 파견하여 부대의 전투력을 상승시키실 수 있습니다.
dialogue_1007=만약 지휘관님이 이동 명령을 잘못 내리셨다면 즉시 부대를 회군시키실 수 있습니다.
dialogue_1008=주의 : 이곳은 중요 거점으로 점령하거나 적군에게 탈취당할 경우 전쟁의 승패에 직접적인 영향을 미치게 됩니다.
dialogue_1009=우측 하단의 모래시계를 클릭하여 지휘관님의 턴을 마무리 지으십시오
dialogue_1010=지휘관님 군사 활동을 개시하십시오!
dialogue_1011=지휘관님 다음은 기타 전술에 관한 설명입니다.
dialogue_1012=사기가 상승 혹은 하락하게 되면 직접적으로 부대의 전투력에 영향을 미치게 됩니다. 부대가 협공을 받거나 포위를 당하게 되면 사기에 영향을 받습니다.
dialogue_1013=만약 부대가 혼란에 빠지게 되면 전투력을 2턴간 완전히 상실하게 됩니다.
dialogue_1014=적의 유닛을 공격하여 격퇴하면 지휘관님의 유닛은 반격을 받지 않습니다.
dialogue_1015=방어 시설을 세우는 것은 진격을 막는 효율적인 수단입니다. 방어 시설은 자신의 영토에만 건설이 가능하며 상당한 시간이 흘러야 완성됩니다.
dialogue_1016=방공 시설은 효과적으로 공군 및 미사일의 데미지를 줄여줍니다.
dialogue_1017=도시를 점령하기 위해서는 도시의 체력이 0이 되어야 하며 점령 시 도시의 영역이 모두 지휘관님께 귀속됩니다.
dialogue_1018=도시가 레벨3 이상인 경우 지휘관님은 도시 내에 랜드마크를 건설할 수 있습니다. 랜드마크는 지휘관님의 도시에 특수 효과를 부여합니다.
dialogue_1019=좌측 상단의 도시 정보를 통해 도시의 상세 정보를 열람할 수 있습니다.
dialogue_1020=지휘관님 군사 활동을 개시하십시오!
dialogue_1021=지휘관님 아래는 기타 전술에 대한 설명입니다.
dialogue_1022=위치한 지형에 따라 전투 결과에 영향을 미칠 수 있습니다.산지나 숲에 위치한 부대가 적의 장갑차와 포병으로부터 데미지를 받을 때 일부 데미지를 감면할 수 있습니다.
dialogue_1023=공항이 있는 도시에서 낙하산병을 비롯한 공군을 사용할 수 있습니다.
dialogue_1024=핵공장을 갖춘 도시에서는 핵을 생산할 수 있습니다.
dialogue_1025=미사일에 핵을 장착시키면 적군에 더 큰 데미지를 줄 수 있습니다.
dialogue_1026=육군 부대로 바다나 강에 진입하면 수송선으로 변환되어 능력치가 떨어지게 됩니다.
dialogue_1027=항구에서 해군을 생산할 수 있습니다.
dialogue_1028=지휘관님 군사 활동을 개시하십시오!

dialogue_1029=적군을 섬멸하려면 적군의 HP를 0으로 만들어야 합니다.
dialogue_1030=지휘관님, 이제 몇 가지 다른 전술을 소개해드리겠습니다.
dialogue_1031=대부분의 엘리트 부대는 액티브 스킬을 보유하고 있으며, 의무병은 스킬을 사용하여 아군을 치료할 수 있습니다.
dialogue_1032=녹색 원을 점령 또는 섬멸하면 일부 사건이 발생하거나 특정 스킬을 잠금 해제할 수 있습니다(HQ에서 습득 가능).
dialogue_1033=공병 부대가 굴착한 지하 터널은 보병과 대부분의 전차포 유닛이 통과할 수 있어 속한 진지 이동이 가능합니다.
dialogue_1034=지하 터널을 통과할 때 부대가 이동할 수 없을 경우, 추가 이동을 얻을 수 있으며, 각 터널의 발동 횟수는 제한되어 있습니다.
dialogue_1035=파란색 원은 철수 지점을 나타내며, 빨간색 원으로 표시된 중요 목표만이 이 철수 지점에서 철수할 수 있습니다.
dialogue_1036=지휘관님, 이제부터 군사 경력을 시작하시고 주요 목표를 호위하여 최대한 빨리 전장에서 철수하십시오!

dialogue_1037=지휘관님, 이번에는 부대 배치 및 진영 조작에 대해 소개해 드리겠습니다.
dialogue_1038=반투명 칸에만 부대를 배치할 수 있으며, 화면 하단에는 전장에 투입할 부대와 그 수량이 표시됩니다. 회색으로 표시된 부대는 현재 스테이지에서 배치할 수 없는 부대입니다.
dialogue_1039=한 번 클릭하면 단일 편대 부대를 배치하고, 여러 번 클릭하면 편대 수를 늘릴 수 있습니다. 각 부대의 편대 상한은 다른 모드에서 모집하는 부대의 최대 편대 수와 동일합니다.
dialogue_1040=전장에서 전사한 부대는 소모로 간주되며, 다중 편대 부대는 더 큰 손실을 입게 됩니다. 전장에 투입할 부대 수를 늘리시려면 '지배' 메뉴에서 부대를 보충 모집하십시오.
dialogue_1041=지휘관님, 이제부터 군사 경력을 시작하시고 모든 적군을 섬멸하십시오!
dialogue_1042=초기화를 누르면 원클릭으로 부대를 재배치할 수 있으며, 개전을 클릭해야 전투가 정식으로 시작됩니다.


dialogue_2001=지휘관님 저희 장갑 부대가 가장 빠른 속도로 적군의 방어선을 돌파할 것입니다.
dialogue_2002=내겐 너희들을 사로잡을 시간이 없다.
dialogue_2003=북부의 적군들이 소멸하였으므로 바르샤바를 점령하는 것은 시간문제입니다.
dialogue_2004=지휘관님 아군의 잠수함 부대가 해상의 위협으로부터 당신을 보호해줄 것입니다.
dialogue_2005=적군은 사면초가에 처해있습니다. 지휘관님 적군 최후의 반격을 조심하십시오.
dialogue_2006=적군은 해양 통제권을 잃었습니다. 아군은 북방의 항구를 점령하여 철저히 그들의 해군을 소멸시켜야 합니다.
dialogue_2007=아군의 화포 부대가 지휘관님을 따를 것입니다. 마지노선을 향해 진격하십시오
dialogue_2008=지휘관님 아군의 장갑 부대가 방어선을 넘을 준비를 마쳤습니다. 파리로 진군하실 때입니다.
dialogue_2009=적군이 아군의 동맹국인 벨기에를 격파하였다고 합니다. 이제 믿을 것은 아군밖에 없습니다.
dialogue_2010=신속히 진격하라, 멈추지 마라!
dialogue_2011=적군이 어떻게 저기서 나타났지? 후방에 있던 수도에 증원이 필요하다!
dialogue_2012=영국의 원정군이 퇴군을 시작하였습니다. 지휘관님, 남아있는 적군을 섬멸하고 영국 해협을 건너십시오.
dialogue_2013=아군의 부대가 지휘관님의 좌측을 보좌하는 동시에 진격할 것입니다. 영국 본토로 상륙하십시오.
dialogue_2014=지금이야말로 영국의 위협으로부터 철저히 벗어날 때입니다.
dialogue_2015=전쟁은 퇴각을 통해 승리하는 것은 아니지만 이번의 퇴각이 승리를 만들어낼 수 있을지도 모릅니다.
dialogue_2016=적군의 주력 해군이 대부분 전멸하였기 때문에 지금이야말로 상륙할 수 있는 최적의 시기입니다.
dialogue_2017=아군은 끝까지 싸울 것이며 굴복하거나 타협하지 않을 것입니다.
dialogue_2018=적군의 주력 함대가 영국 해협에서 거의 전멸하였습니다. 이로 인해 영국 해군은 지중해에서 최후의 항전을 펼치게 될 것입니다.
dialogue_2019=그들은 부근의 섬들을 이용하여 일대의 방어선을 구축하였습니다. 기뢰를 이용해 아군의 행동을 방해할 모양입니다.
dialogue_2020=이는 아군에게 주어진 마지막 기회입니다. 반드시 이탈리아가 지중해 전역을 손에 넣지 못 하도록 저지해야 합니다.
dialogue_2021=이 항구의 위치는 매우 중요하며 적군은 함대를 증원할 것으로 보입니다. 반드시 이 거점을 지켜내십시오.
dialogue_2022=적이 아군의 중심지로 공격해오는 모양입니다. 제가 예비 함대를 파견해 놓았으니 적들을 반드시 막아주십시오.
dialogue_2023=적들의 함대가 서쪽 방어선을 돌파하였다고 합니다. 지금 즉시 지원을 부탁드립니다.
dialogue_2024=아군의 선봉 부대가 발칸 반도에 상륙했다고 합니다. 지휘관님, 그들과 함께 육로로 진군하십시오.
dialogue_2025=적군이 아군과 우군에 전면 공격을 개시하였다고 합니다. 군세를 집중시켜 상륙한 적군들을 바다로 쫓아내십시오.
dialogue_2026=적 해군은 더 이상의 공격을 버텨내기 힘든 상황입니다.  그러나 절대 그들의 산지 특공대를 얕보지 마십시오. 지휘관님께선 신속히 우군을 지원하고 거점을 수호하십시오.
dialogue_2027=적군의 돌격을 저지하는데 성공하셨습니다. 지금은 동맹국과 함께 총공격을 펼치실 때입니다.
dialogue_2028=작전에 따라 우리는 적을 격파하는 망치가 될 것이니 이 시간 이후로는 결코 흩어지지 마라!
dialogue_2029=비록 소련군의 규모가 크다고는 하나 제국의 날카로움 앞에서는 바람 앞의 등불이다.
dialogue_2030=아군의 보병 부대가 레닌그라드 북부의 방어선을 돌파했다고 한다.
dialogue_2031=키예프가 현재 적군의 공격을 받고 있다. 아군의 손실이 막대하니 내가 직접 증원을 나서겠다!
dialogue_2032=적군의 1차 방어선은 무너졌다. 목표는 스몰렌스크다. 군사들이여 나를 따르라
dialogue_2033=지휘관님, 모스크바 앞에서 합류해주십시오.
dialogue_2034=아군은 퇴로를 잃었습니다. 아군의 후방이 바로 모스크바이니 이곳에서 최후의 방어선을 지켜내야 합니다.
dialogue_2035=키예프가 적의 침공을 받아 점령당했습니다. 아군은 즉시 동쪽으로 새로운 방어선을 구축해내야 합니다.
dialogue_2036=원군이 오고 있습니다. 지휘관님, 원군의 상륙에 방해가 되는 것들을 모두 쓸어버리고 보급로를 확보하십시오.
dialogue_2037=군사들이여 적군의 보급로를 끊는다면 아군이 우세할 것이다.
dialogue_2038=원군이 상륙을 시도하고 있습니다. 서둘러 전방의 항구를 점령하고 연안의 수비대를 섬멸시키십시오.
dialogue_2039=적군의 방어선이 붕괴되었습니다. 아군의 장갑 부대는 현재 알렉산더 항구로 진군하고 있으며 해군 함대 또한 다른 방향에서 협공할 것입니다.
dialogue_2040=아군은 해상의 최후의 보루를 잃어버렸습니다. 알렉산더 항구는 적함의 포화에 노출된 상태입니다.
dialogue_2041=아군은 더 이상 증원을 받을 수 없는 상태이나 어떻게든 카이로를 지켜내야 합니다.
dialogue_2042=레닌그라드는 매우 견고한 보루로, 정공법을 택할 경우 커다란 대가를 치르게 될 것입니다.
dialogue_2043=지휘관님 우선 주변의 도시를 제압한 후 레닌그라드를 봉쇄하십시오. 우군이 북쪽에서 진격해올 것입니다.
dialogue_2044=적군은 현재 레닌그라드 근처에 이른 것으로 보인다. 군사들이여 신속히 전선을 향해 증원을 하라!
dialogue_2045=지휘관님 아군은 이미 레닌그라드의 북부를 봉쇄하였습니다. 얼른 집결하시길 바랍니다.
dialogue_2046=적군은 레닌그라드의 동쪽으로 진격하기 시작했습니다. 그들을 저지하고 최후의 보급선을 지켜내십시오.
dialogue_2047=레닌그라드의 주변은 이미 아군에 의해 제압되었으며 지금이야말로 계획을 완성시킬 수 있는 마지막 단계로 보입니다.
dialogue_2048=레닌그라드는 아군의 것입니다! 적군은 반드시 엄청난 대가를 치러야 할 것입니다.
dialogue_2049=파울루스 원수의 부대가 스탈린그라드 부근에서 적군에 의해 포위 당했다고 합니다. 아군을 지휘하여 즉시 그들을 지원하십시오.
dialogue_2050=독일군은 전선이 늘어나고 있습니다. 그들은 양쪽을 모두 지키기 어려운 형태로 아군에게는 반격의 기회라고 할 수 있습니다.
dialogue_2051=남쪽에 위치한 동맹국인 루마니아와 헝가리 등의 방어선 또한 현재 맹렬한 공격을 받고 있어 오래 버티지 못할 것이라고 합니다.
dialogue_2052=적군이 아군에 반격을 가하고 있는 모양입니다. 지휘관님 즉시 군을 지휘하여 북쪽의 소련군 방어선을 돌파하십시오.
dialogue_2053=아군은 이미 남쪽에 독일 6군에 대한 포위를 완성시켰습니다. 아군은 반드시 독일의 원군을 저지해야 합니다.
dialogue_2054=아군은 독일군의 증원을 저지하고 있으며 이제 독일 6군이 소멸될 시기가 다가온 것 같습니다.
dialogue_2055=파울루스 원수가 공격받았다고 합니다. 아군은 스탈린그라드를 공격할 수 있는 중요 지역을 잃게 되었습니다.
dialogue_2056=유럽을 정복하기까지 한 걸음 남았다. 모스크바가 눈앞에 있구나. 병사들이여 나를 따라 영광의 순간을 쟁취하라!
dialogue_2057=적군의 의도는 여러 방향에서 모스크바로 진격하는 것으로 보이는군. 그러나 그 전에 그들은 반드시 이곳이 소비에트 연방의 토지임을 알아야 할 것이다!
dialogue_2058=지휘관님 소련군의 공격을 조심하십시오. 우군과의 협동이 진격 속도를 높이는 데 도움이 될 것입니다.
dialogue_2059=아군은 반드시 독일군의 진격을 막는 한편 부대를 안전하게 퇴각시켜야 합니다.
dialogue_2060=진격! 신속히 모든 항구를 점령하고 저들을 저지하라!
dialogue_2061=아군은 우군의 원조를 받았습니다. 이는 좋은 소식입니다.
dialogue_2062=적군의 첫 번째 방어선이 무너졌다. 전력으로 진격하여 그들을 사로잡아라!
dialogue_2063=항구로 퇴각하여 진지를 수비한다. 부대는 최대한 신속히 퇴각하라
dialogue_2064=독일군이 현재 아군의 본토로 침공해왔습니다. 아군은 지원이 필요합니다!
dialogue_2065=공세가 강해지고 있으므로 영국 본토는 바람 앞의 등불입니다.
dialogue_2066=우리가 독일군의 기습을 저지하였다. 이제는 반격이다!
dialogue_2067=승리는 대영제국의 것이다!
dialogue_2068=아군의 해군이 독일의 보급선을 봉쇄하였습니다. 지금이야말로 진격하기에 가장 좋은 시기입니다.
dialogue_2069=들어온 정보에 의하면 롬멜의 부대가 남부 도시를 공격할 것으로 보입니다. 집결된 화포 부대를 조심하며 수비하십시오.
dialogue_2070=아군은 독일군의 최전방 방어 진지를 격파하였습니다. 튀니지로 진격할 차례입니다.
dialogue_2071=장갑 부대가 기습을 시작하였습니다. 적들을 섬멸시키십시오!
dialogue_2072=시작부터 아군은 적군을 속수무책으로 만들지 못했기 때문에 이번 활동은 본질적인 의미를 잃어버린 것과 같군.
dialogue_2073=이번 활동의 목표는 시칠리아를 탈취하고 이탈리아를 전쟁에서 몰아내는 것입니다.
dialogue_2074=이는 연합군이 행했던 여러 차례의 대규모 연합 활동으로 당신이 섬으로 진격하는 걸 저의 함대가 보좌할 것입니다.
dialogue_2075=아군의 전진이 매우 순조로우니 반드시 영국 보다 한발 앞서  팔레르모를 손에 넣어야 할 것입니다.
dialogue_2076=연합군의 공세가 매우 강하니 우리는 해협에서 원군과 합류해야 할 것입니다.
dialogue_2077=시칠리아는 우리의 것이다. 해협을 건너 철저히 이탈리아를 괴멸 시켜라!
dialogue_2078=남북 양측에서 연합공격을 펼쳐오고 있습니다. 쿠르스크의 소련 군대를 격파하십시오.
dialogue_2079=방어선을 구축하고 독일군의 장갑 부대를 통해 진격할 틈을 노리고 있습니다.
dialogue_2080=진격! 적군의 장갑 부대를 격파하고 그들을 쫓아내라!
dialogue_2081=아군은 북부 지역의 제공권을 탈취하였습니다. 아군은 지휘관님과 함께 진격할 것입니다.
dialogue_2082=쿠르스크 전쟁의 승리로 인해 독일군의 여름철 공세를 꺾었습니다. 지금이야말로 아군이 직접 진공해야 할 때입니다.
dialogue_2083=무턱대고 수비만 하는 바람에 아군이 수동적으로 변했습니다. 제가 부대를 데리고 기습을 감행하여 소련군을 막겠습니다.
dialogue_2084=룬트슈테트 장군의 부대가 패배하였다고 하니 나의 계획도 실패로군.
dialogue_2085=서북방향에 있는 군대를 소집하여 키예프를 지원하십시오.
dialogue_2086=지휘관님 아군은 독일군에게 점령당한 민스크를 수복해야 합니다. 로코솝스키 장군과 제가 협력하여 귀하의 미션 완수를 돕겠습니다.
dialogue_2087=나는 내가 할 수 있는 최선을 다했다. 그럼에도 불구하고 추축국의 파국을 피할 방법이 없군.
dialogue_2088=아군의 행동은 성공적이었습니다. 앞에는 바로 민스크가 있으니 적군의 반격을 주의하십시오.
dialogue_2089=주도면밀한 계획과 장기적인 준비를 통해 드디어 오늘이 왔군. 오늘의 전투를 역사는 대규모의 상륙전으로 기록할 것이다.
dialogue_2090=미군의 진격 속도가 매우 빠르지만 아군 또한 그들에게 뒤처질 순 없다!
dialogue_2091=전선의 상황이 위급합니다. 아군은 반드시 효과적인 반격을 통해 연합국의 지속적인 진격을 저지해야 합니다.
dialogue_2092=우리를 막을 수 있는 건 아무것도 없다!
dialogue_2093=프랑스군의 진격을 보조하기 위해 아군이 프랑스 남부에 있는 독일군에 기습활동을 실시하였습니다.
dialogue_2094=나의 부대로 연합국을 해안에서 저지할 수 있다!
dialogue_2095=보아하니 내가 저들의 실력을 얕잡아 본 것 같군, 장갑 부대를 출격시켜 연합군의 공세를 저지하라.
dialogue_2096=독일군의 패잔병들은 이제 위협이 되지 않습니다. 전면 공격을 통해 리옹을 점령하십시오.
dialogue_2097=지휘관님 이번 계획이 만약에 성공하게 된다면 아군은 독일의 중심부로 향할 수 있게 됩니다. 승리는 시간 문제입니다.
dialogue_2098=교두보가 함락당했습니다. 아군은 원군이 필요합니다!
dialogue_2099=매우 좋군! 계속 진군하라, 철저히 독일군을 파괴하라.
dialogue_2100=아군은 다른 부대를 쫓기 전에 베를린을 함락시킬 것이오. 나의 화포부대가 당신의 베를린 진격을 엄호할 것이외다.
dialogue_2101=나의 장갑 부대가 북방에서 당신을 위해 모든 장애물들을 쓸어버릴 것이오.
dialogue_2102=베를린이 눈앞에 있다. 승리는 우리의 것이다!
dialogue_2103=나의 실패는 아무것도 아니다. 베를린의 운명은 이미 정해졌다.
dialogue_2104=우리의 기습 계획이 성공적으로 이루어졌습니다! 적군 부대는 심각한 타격을 받았습니다.
dialogue_2105=우리는 왜 사전에 일본군의 움직임을 장악하지 못했는가? 즉시 자신의 자리로 돌아가라!
dialogue_2106=지휘관 각하, 측면으로부터 공격하십시오. 우리는 섬 위의 적군을 포위할 것입니다.
dialogue_2107=적군의 원군이 움직이기 시작했습니다. 저의 잠수함 부대는 그들을 저지할 것입니다.
dialogue_2108=정찰기는 영국군의 주력 전함 위치를 탐지해냈습니다. 잠수함 부대는 언제든 출격할 수 있습니다.
dialogue_2109=싱가포르는 아시아에서 중요한 전략 도시이니 절대로 일본군에 점령당하지 않도록 방어하십시오.
dialogue_2110=지휘관 각하, 신속하게 상륙 작전을 수행하십시오. 저의 함대는 동시에 적들의 해군 함정을 공격할 것입니다.
dialogue_2111=영국 해군은 이전의 실력이 아닙니다. 적군의 혼란을 틈타 그들에게 치명적인 일격을 가합시다.
dialogue_2112=일본군은 거의 싱가포르에 도달하려고 합니다. 모든 예비대를 동원해 싱가포르를 지켜내십시오.
dialogue_2113=영국군의 방어선은 이미 무너졌습니다. 우리는 양곤을 기점으로 버마를 점령할 것입니다.
dialogue_2114=지휘관 각하, 양곤을 진공하는 동시에 적군의 보급선을 차단하기 위한 기동 부대를 파견해 주십시오.
dialogue_2115=우리는 더 이상 일본군의 공격을 감당할 수 없다. 철수하라! 그리고 만달레이 주변에서 새로운 방어선을 구축하라.
dialogue_2116=전선의 영국군들은 이미 견지할 수 없는 상황입니다. 즉시 지원을 제공하십시오.
dialogue_2117=적의 주력 부대는 전방으로 이동하고 있습니다. 이는 기습 공격을 가하여 적군의 보급을 차단하는 최적의 기회입니다.
dialogue_2118=버마의 영국군 세력은 산산이 부서지고 있습니다. 기세를 올려 남은 거점들을 탈취합시다!
dialogue_2119=지휘관 각하, 가능한 한 빠른 시일 내에 모르즈비 항구를 점령하시길 바랍니다. 공중 지원을 하겠습니다.
dialogue_2120=항공모함 편대는 동시에 솔로몬 군도의 적군을 공격하여 부대의 상륙을 엄호할 것입니다.
dialogue_2121=상륙 부대가 큰 타격을 받지 않도록 적군의 원군을 조심하십시오.
dialogue_2122=일본군이 최후의 방어선을 무너뜨렸습니다. 호주는 적군의 포화 속에 철저히 노출되었습니다.
dialogue_2123=지휘관 각하, 우리의 병력은 한계가 있으므로 해군 부대와 긴밀히 협력하시기 바랍니다.
dialogue_2124=죽음을 두려워하지 않는 자만이 살아남을 자격이 있다! 우리는 태평양 전장의 마지막 기회이다.
dialogue_2125=적군은 잃어버린 진지를 되찾으려 하고 있는 것 같습니다. 지휘관 각하, 철저한 방어 태세를 갖추기 바랍니다.
dialogue_2126=어느 때라도 신념을 잃어서는 안 됩니다. 태평양 함대가 있는 한 승리의 희망이 있습니다.
dialogue_2127=이 결정적인 순간에 철수하면 지금까지의 모든 것이 수포로 돌아가게 될 것입니다.
dialogue_2128=아군은 사상자가 너무 많고, 병사들도 극도로 피곤한 상황입니다. 최고 사령부에서는 공격을 멈추고, 철수하기로 결정했습니다.
dialogue_2129=지휘관 각하, 이후의 반격을 위해 영국군의 추적을 막아내십시오.
dialogue_2130=우리는 임팔을 지켜냈습니다. 하지만 일본군이 있는 한 이번 전투는 끝나지 않았습니다.
dialogue_2131=일본 함대가 철수하고 있습니다. 이는 잃었던 진지를 탈환할 수 있는 절호의 기회입니다.
dialogue_2132=영국군의 공격은 막기 어려운 상황입니다. 만달레이는 곧 함락될 위기에 처했습니다.
dialogue_2133=독일군의 주력 부대는 이미 소련군에게 완전히 격파 되었으니, 우리가 시베리아에서 진행하는 행동은 전 세계에 파급을 줄 것입니다.
dialogue_2134=지휘관 각하, 아군의 기동력 우위를 이용하여 소련군의 주력 장갑 부대를 피하면서 방어가 취약한 도시부터 우선적으로 점령하십시오.
dialogue_2135=각하의 행동에 맞추기 위해 저의 부대는 여러 방향으로 소련군을 공격할 것입니다.
dialogue_2136=우리는 더 이상의 일본군을 막을 여력이 없습니다. 일본군의 주력을 빨리 찾아내서 속전속결로 끝내야 합니다.
dialogue_2137=적군의 장갑 부대는 나를 향해 전진하고 있다. 나는 증원이 필요하다!
dialogue_2138=지휘관 각하, 우리는 반드시 적의 해상 방어선을 신속하게 돌파하고 상륙해야 합니다. 하지만 부디 미군의 정찰 범위를 멀리해 주십시오.
dialogue_2139=우리는 일본군의 함대를 막을 수 없습니다. 반드시 우군과 연합하여 그들의 상륙 부대를 바다로 몰아넣어야 합니다.
dialogue_2140=현지에 방어선을 구축하여 그들의 진공을 막아내십시오.
dialogue_2141=계속 방어만 하는 것은 자살행위입니다. 우리는 최종 무기의 개발을 위해 공격으로 시간을 벌어야 합니다.
dialogue_2142=미군이 먼저 우리를 향해 공격을 개시했습니다. 비록 예상치 못했지만 이는 그들의 실력을 약화시킬 수 있는 기회이기도 합니다.
dialogue_2143=지휘관 각하, 미군의 주력 부대를 저항하는 동시에 적군의 연구 시설을 기습하십시오.
dialogue_2144=용감한 사람이라면 희망이 남아 있기만 하면 무너지지 않습니다.
dialogue_2145=일본군이 진주만을 기습하여 항구 내의 군함이 큰 타격을 받았다는 급보를 받았습니다. 즉시 회항하여 일본군을 공격하십시오!
dialogue_2146=지휘관 각하, 저의 부대는 일본군의 진공을 막을 터이니 각하께서는 즉시 진주만을 지원하십시오.
dialogue_2147=기습 계획이 성공적이었습니다. 태평양 함대를 완전히 소멸시킬 제3차 공격을 준비하십시오.
dialogue_2148=적군의 원군이 도착했습니다. 우리는 전함 지원이 필요합니다.
dialogue_2149=돌격 부대의 손실이 막대합니다. 저는 이런 '성공'을 받아들일 수 없습니다.
dialogue_2150=싱가포르는 총사령부의 계획에서 큰 의미를 갖고 있습니다. 영국의 지원군이 도착하기 전에 싱가포르를 점령하십시오.
dialogue_2151=일본군이 싱가포르를 점령하기 위한 공격을 준비하고 있습니다. 즉시 대비하십시오.
dialogue_2152=지휘관 각하, 저의 함대가 도착했습니다. 저는 각하의 공격을 도와 드리겠습니다.
dialogue_2153=영국군의 공세가 맹렬하니 즉시 원군을 파견하십시오.
dialogue_2154=미드웨이섬을 공격하는 일본군의 수량이 아주 많지만 미드웨이섬을 반드시 끝까지 지켜내야 합니다.
dialogue_2155=항공모함 편대는 적군의 공격을 견제하십시오.
dialogue_2156=적군의 방어력이 매우 강하여 아군은 큰 타격을 받았습니다.
dialogue_2157=작전 실패로 함대가 연패하여 실패의 국면을 만회할 길이 없게 되었습니다.
dialogue_2158=일본군의 행동은 아주 신속합니다. 그들은 이미 공항을 건설하였으며, 완벽한 방어 시설을 구축했습니다.
dialogue_2159=지휘관 각하, 저는 과달카날섬의 동북 방향에서 적군을 공격하여 그들의 주의력을 분산시킬 것이니, 신속히 상륙하여 섬 위의 수비군을 소멸하십시오.
dialogue_2160=저의 함대는 적군의 기습을 당했습니다.
dialogue_2161=지휘관 각하, 일본군은 현재 질병의 고통에 시달리고 있어 사기가 떨어진 상태입니다. 이는 우리가 공격할 수 있는 절호의 기회입니다.
dialogue_2162=세 국가의 연합군은 동시에 공격을 개시할 테이니 반드시 가장 빠른 시간 내에 만달레이를 점령하십시오.
dialogue_2163=적군은 만달레이를 점령하였습니다. 이는 절대 좋은 소식이 아닙니다.
dialogue_2164=최후의 전장에서 우리는 더 이상 물러설 길이 없습니다. 돌격해라!
dialogue_2165=연합군은 반드시 필리핀을 탈환하기 위해 대량의 해군 부대를 투입하였습니다.
dialogue_2166=제국은 이미 이곳을 점령하였습니다. 맥아더가 계속 태평양에서 표류하도록 그를 바다로 몰아넣으십시오.
dialogue_2167=저의 정찰기는 일본의 주력 항공모함 편대를 발견했습니다. 그들의 항공모함 편대를 확실하게 소멸시켜 주십시오!
dialogue_2168=오자와는 적의 주력 항공모함 편대를 견제하는데 성공했습니다.
dialogue_2169=함대는 다시 한번 실패하였습니다. 제국의 해군은 완전히 함락되었습니다.
dialogue_2170=진지를 사수하고 사병들은 마지막 한 사람이 남을 때까지 최소한 10명의 적을 사살하십시오.
dialogue_2171=지휘관 각하, 이 섬을 점령한다면 우리는 일본 본토에 대해 효율적인 전략 폭격을 진행할 수 있습니다.
dialogue_2172=정보에 따르면 이 섬의 방어 역량이 아주 강합니다. 이 섬을 점령하는 데에는 큰 대가를 치러야 하니 조심하십시오.
dialogue_2173=전장에서 쓰러지는 것은 무사로서의 영광입니다.
dialogue_2174=지휘관 각하, 우리는 전방의 일본군을 빨리 해결하고 미군보다 먼저 일본 본토를 향해 공격해야 합니다.
dialogue_2175=소련군이 제국의 본토를 공격하려고 합니다. 우리는 이곳에서 그들을 막읍시다.
dialogue_2176=지휘관 각하, 우리의 시간은 많지 않습니다. 공항을 점령하는 것은 우리의 공세를 가속할 수 있습니다.
dialogue_2177=지휘관 각하, 일본군은 험준한 지형을 방패 삼아 완강하게 저항하고 있습니다. 저희의 행동에 참여해 주기 바랍니다.
dialogue_2178=우리는 빨리 상륙하여 방어 시설을 구축해야 합니다. 우리가 직면해야 할 부대는 일본군뿐만 아닐 수 있습니다.
dialogue_2179=일본은 투항했습니다. 이 땅은 이제 소련의 땅입니다. 미군을 몰아냅시다.
dialogue_2180=오래전부터 소련의 야심을 보아왔습니다. 지휘관 각하, 저희는 두 나라를 상대할 것입니다. 이는 아주 어려운 전투가 될 것입니다.

dialogue_2181=제 부대가 이미 상륙을 완료했습니다. 적들은 최선을 다해 원군을 보내어 최전방의 전선을 지키려 할 것입니다.
dialogue_2182=영국 해군이 적군의 항구로 진격할 것입니다. 저도 이와 동시에 육군을 파견하여 귀하를 도울 것입니다.
dialogue_2183=지휘관 각하, NATO의 원군을 주의하십시오 적들의 추가적인 상륙을 저지하고 그들을 해상에서 철저히 소멸시키십시오.
dialogue_2184=NATO의 계획은 수포로 돌아갔습니다. 반격의 시간입니다.
dialogue_2185=소련군이 집결한 상태입니다. 아군의 진격로도 철저히 봉쇄된 상황입니다.
dialogue_2186=아군의 함대가 소련 해군을 향해 공격을 시작했습니다. 소련의 지상군을 견제하십시오
dialogue_2187=지휘관 각하, 저와 함께 적군의 선봉 부대를 전멸시킵시다. 튀르키예로의 진공을 준비하십시오.
dialogue_2188=지휘관 각하 튀르키예를 향해 진공할 때입니다.
dialogue_2189=귀하는 저의 함대와 함께 튀르키예의 방어선을 파괴할 수 있습니다. 우선은 연해의 미군부터 해결하십시오.
dialogue_2190=NATO군이 앙카라로 진격하고 있습니다. 저의 함대로는 적군의 진격을 막아서기 힘듭니다.
dialogue_2191=지휘관 각하, 신속히 원군을 보내어 앙카라에 있는 우리 부대가 포위당하지 않도록 해주십시오.
dialogue_2192=저의 부대는 지금 최전방으로 증원을 가고 있습니다.
dialogue_2193=때가 이르렀습니다. NATO의 지상군은 이제 전멸에 가까운 상태입니다. 다음 작전 목표 : 튀르키예의 모든 지역을 점령하라
dialogue_2194=적군은 이미 두터운 방어선을 구축하였습니다. 아군은 앙카라를 손에 넣고 이 틈에 튀르키예로 진격해야 합니다.
dialogue_2195=적군은 아군의 중심지에 들어섰습니다. 무슨 일이 있어도 그들의 진격을 저지해야 합니다.
dialogue_2196=NATO가 서유럽에서 연합군을 창건하였습니다. 양방향에서 벌어질 대규모의 침공을 대비하십시오.
dialogue_2197=군사들이여 아군의 힘을 보여줄 때다. 소련군을 물리쳐라!
dialogue_2198=지휘관 각하, 적군의 연맹은 매우 강합니다. 기세를 잡아 그들을 추격하여 격퇴하십시오. 베를린에서 합류하길 기대하겠습니다.
dialogue_2199=마지막까지 지켜냈습니다. 바르샤바에는 위기가 닥친 상태입니다.
dialogue_2200=NATO가 서유럽에서 갑자기 우리를 향해 군대를 출격시켰습니다. 아군의 동맹군의 손실이 엄청나게 큰 상황입니다.
dialogue_2201=마지막까지 지켜냈습니다. 바르샤바에는 이제 위기가 닥쳤습니다.
dialogue_2202=지휘관 각하, 아군은 반드시 적군에게 자신의 행동에 대한 대가를 깨닫게 해줘야 합니다. 붉은 폭풍이 유럽 전체를 석권할 것입니다.
dialogue_2203=정보, 미군의 새로운 증원군이 현재 미국 서해안에서 아시아로 오고 있습니다.
dialogue_2204=저의 공군이 부근의 해역에서 정찰을 통해 소련의 대군을 발견해냈습니다. 즉시 행동을 멈추고 지상으로 상륙하십시오.
dialogue_2205=지휘관 각하, 적군의 수송 함대를 저지하고 아군의 상륙을 위해 장애 요소들을 제거하십시오.
dialogue_2206=아군은 적군의 상륙을 막을 수 없었지만 더 이상은 그들이 진격하지 못 하도록 만들 것입니다.
dialogue_2207=NATO의 해군이 갑자기 후방에서 출현하였습니다. 그들은 현재 조금씩 아군에게 포위망을 좁혀들어오고 있습니다.
dialogue_2208=지휘관 각하. 아군의 행동이 모두 탄로 났습니다. 빠르게 미국의 본토로 상륙하여 불필요한 소모를 줄이십시오.
dialogue_2209=군사들이여 진격하라! 적군의 계획은 해안에서 철저히 부서졌도다.
dialogue_2210=NATO는 철저히 패배하였습니다. 미국군은 여전히 최후의 저항을 하고 있는 상황입니다.
dialogue_2211=우리의 원군이 곧 미국 동해안에 이를 전망입니다. 우리의 진지를 지키고 우군과 연합하여 미국을 공격하십시오.
dialogue_2212=아군 함대가 적군의 원군을 저지할 것이다. 이제 힘을 집중하여 소련군을 물리쳐라. 성조기는 영원히 땅에 떨어지지 않는다!
dialogue_2213=대전이 막을 내렸습니다. 유럽 각국은 엄청난 피해를 입었습니다. 우리는 이 기회를 틈타 진격해야 합니다. 영토를 넓히십시오
dialogue_2214=소련군이 대군을 집결시켰습니다. 유럽을 침략할 준비 중입니다. 우리는 최전방에서 그들을 저지해야 합니다.
dialogue_2215=독일이 소련군의 맹렬한 공격을 받았습니다. 우리는 그들을 지원해야 합니다.
dialogue_2216=독일은 이제 바람 앞의 등불이다. 진격하라! 승리는 곧 우리 손에 있다.
dialogue_2217=우리는 벨기에와 네덜란드가 아군의 독일 포위 공격에 가담하도록 설득하는데 성공했습니다.
dialogue_2218=소련군은 북한이 전쟁을 일으켜 서울을 점령하도록 만들었습니다. 우리는 군대를 인천에 상륙시켜 대한민국군과 협력하여 반격을 개시해야 합니다.
dialogue_2219=연합군은 이미 대한민국에 도착하였습니다. 부대를 소집하여 그들을 소멸시키십시오. 이번 계획은 실패해선 안 됩니다.
dialogue_2220=우리는 승리의 여세를 몰아 추격에 나서야 합니다. 소련군의 야심을 철저히 파괴하십시오.
dialogue_2221=소련이 쿠바에 대량의 미사일을 배치하였습니다. 그들은 언제든지 우리에게 핵미사일을 발사할 수 있습니다. 지휘관 각하, 우리는 희생을 두려워하지 않고 미사일 발사대를 탈취해야 합니다.
dialogue_2222=대통령이 소련의 이 같은 도발 행위를 참을 수 없다고 전해왔습니다. 반드시 그들에게 쓴맛을 보여주셔야 합니다.
dialogue_2223=공격하라! 미국인들에게 교훈을 남겨줘라
dialogue_2224=소련군이 수에즈 운하를 봉쇄하였습니다. 중동의 석유를 독점하려는 것 같습니다. 절대 그들에게 빼앗기지 마십시오.
dialogue_2225=진격하라. 철저히 중동의 유전을 점령하고 유럽인들을 쫓아 보내라.
dialogue_2226=소련의 행동이 너무나 빨라 아군의 상황도 매우 불리합니다.
dialogue_2227=소련군의 규모가 매우 큽니다. 저는 영국군과 서쪽에서 적의 주력군을 견제할 것입니다. 지휘관님께서는 시기를 틈타 남쪽에서 적들의 후방을 치고 포위망을 형성하십시오
dialogue_2228=미군의 증원군이 접근하여 진격을 시작했습니다. 그들은 승세를 굳혀나가고 있습니다.
dialogue_2229=폭격하라! 그들에게 조금의 틈도 줘선 안 된다.
dialogue_2230=NATO군의 수는 놀라울 정도입니다. 그러나 진격 속도가 매우 느린 편입니다. 부대를 집결시켜 진격에 대비하십시오.
dialogue_2231=보아하니 우리가 제시간에 도착하지 못한 것 같습니다. 소련군은 이미 일부 도시를 점령하였습니다. 지휘관님 소련군이 군을 정비하는 동안 진격하여 잃어버린 영토를 되찾아 오십시오.
dialogue_2232=지휘관님, 소련군이 남쪽 방어선에서 아직 방어 시설을 구축하지 못했다는 정보입니다. 그곳이 우리의 돌파구가 될 것입니다.
dialogue_2233=소련이 남극에서 이 정도 규모를 갖추고 있었는지 생각지도 못했다. 이번에 철저히 그들을 소멸시키도록 해라!
dialogue_2234=진지를 지키십시오. 이것이 우리가 반격할 수 있는 마지막 기회입니다.
dialogue_2235=미사일을 발사하여 적을 잿더미로 만들어버려라, 반격의 시간이 왔다!

dialogue_2236=적군의 공세가 매우 맹렬합니다. 정보에 따르면 여러 곳의 유전이 점령당했을 뿐만 아니라 많은 국가의 중요 도시도 공격당하고 있습니다.
dialogue_2237=너무 늦었다. 계속 공격하라! 머지않아 우리는 걸프 지역의 주인이 될 것이다.
dialogue_2238=우리의 맹우는 오래 버티지 못할 것 같습니다. 지휘관 각하, 즉시 군대를 파견하여 걸프 지역의 위기를 해결하십시오.
dialogue_2239=우리의 우세는 불 보듯 뻔하다. 모든 저항은 헛수고로 돌아갈 것이다.
dialogue_2240=적군의 목표는 바그다드입니다. 여러 갈래의 적군이 그곳으로 집결하고 있습니다. 지휘관 각하, 어떠한 대가를 치르고서라도 적들의 계획을 파괴하십시오.
dialogue_2241=나머지 도시를 점령한 후, 영국을 공격하면 우리는 유럽 전체를 장악할 수 있을 것입니다.
dialogue_2242=적들은 각 방향에서 공격을 가하고 있으며, 많은 도시는 이미 함락되었습니다. 지휘관 각하, 우리의 목표는 최대한 빨리 상륙하여 유럽을 구하는 것입니다.
dialogue_2243=이번의 철수는 일시적인 것이다. 나는 다시 돌아올 것이다.
dialogue_2244=이번의 철수는 매우 성공적입니다. 소련인들은 일격을 이겨 내지 못할 것 같습니다. 우리는 모스크바까지 거리가 얼마 남지 않았습니다.
dialogue_2245=적들은 몇몇 도시를 점령하면 전쟁의 승리를 거둘 수 있을 거라 망상하고 있다. 하지만 소련은 종래로 실패한 적이 없으며, 이번에도 실패하지 않을 것이다!
dialogue_2246=적군은 이미 드네프르 강을 봉쇄했습니다. 소련군의 상황은 낙관적이지 않습니다. 먼저 키예프를 되찾은 후에 모스크바로 진군합시다.
dialogue_2247=우리는 반드시 하르키우의 우군을 증원해야 합니다. 그들은 스탈린그라드와 모스크바를 되찾는데 중요한 힘입니다.
dialogue_2248=모스크바 서쪽의 장벽이 분쇄되었습니다. 이곳의 소련군은 우리의 상대가 될 수 없습니다.
dialogue_2249=하르키우가 함락되었습니다. 적군은 곧 모스크바를 진공할 것입니다. 결전의 순간이 다가왔습니다.
dialogue_2250=모스크바가 위기에 닥쳤습니다. 저의 부대는 지휘관 각하와 함께 키예프를 점령하여 전면적인 반격을 위해 준비할 것입니다.
dialogue_2251=유럽의 실패는 아무것도 아니다. 이번에는 북미 지역을 철저히 점령할 것이다. 전원이 출격하여 신속하게 전투를 끝냅시다.
dialogue_2252=지휘관 각하, 적의 병력이 많이 줄어들었지만, 적군의 수량은 여전히 우리보다 많습니다. 저희는 지휘관 각하의 협조가 필요합니다.
dialogue_2253=뉴욕의 적군이 소멸되었으니 승리의 서광이 보인다!
dialogue_2254=뉴욕은 우리의 것이다. 제자리에서 적들의 반격을 수비하여라.
dialogue_2255=적군의 수량이 너무 많은데다가 저는 지원을 받지 못했습니다. 워싱턴은 이제 한계입니다.
dialogue_2256=동남아와 호주도 테러리스트들의 공격을 받았다. 하지만 우리가 온 것은 전세가 전환되는 것을 의미한다.
dialogue_2257=아무도 감히 바다에서 나에게 도전을 하지 못했는데 너는 첫 번째이자 마지막 도전자로 될 것이다.
dialogue_2258=우리는 이미 군도 중부의 섬을 점령하였다. 나의 장갑 부대는 즉시 출발하여 호주를 지원하러 갈 것이다.
dialogue_2259=지휘관 각하, 이 섬은 반드시 우리의 점령하에 있어야 합니다.
dialogue_2260=적군의 지원군은 여러 방향에서 우리 쪽을 향해 진군하고 있습니다.
dialogue_2261=섬 위의 육군은 버티지 못했다. 나의 함대는 즉시 돌아가서 요지를 되찾을 것이다.
dialogue_2262=다윈은 적에게 넘어갔고, 호주의 부대는 현재 물러서고 있습니다.
dialogue_2263=지휘관 각하, 우선 다윈을 되찾고 호주 본토를 지켜 주시기 바랍니다.
dialogue_2264=지휘관 각하, 적군의 수비가 매우 엄밀합니다. 우리는 힘을 모아 그들을 하나씩 격파해야 합니다.
dialogue_2265=시베리아는 우리가 오래전부터 건설한 기지인데 감히 이곳을 공격하다니. 너희들이 이런 결정을 내린 것을 후회하게 만들 것이다.
dialogue_2266=공격하라. 적들을 우리의 포화 속에 매장시켜라.
dialogue_2267=너희들의 행동은 자신을 더욱 빨리 멸망시킬 것이다. 나의 분노를 느껴라.
dialogue_2268=적들은 시베리아의 기지를 잃었지만, 그들의 습격은 멈추지 않았다. 우리는 전면적인 반격을 개시하여 적에게 숨 돌릴 틈을 주지 말아야 한다.
dialogue_2269=비록 우리의 부대는 아시아에서 계속 패퇴하고 있지만, 여기에 모인 여러분들은 모두 엘리트 중의 엘리트입니다. 소련군은 자신의 경솔한 공격에 대가를 치르게 될 것입니다!
dialogue_2270=지휘관 각하, 이곳은 적군의 최후의 기지입니다. 결전의 순간이 다가왔습니다. 그들을 섬멸하십시오.
dialogue_2271=너희들이 이곳까지 찾아올 수 있다니, 하지만 여기까지일 뿐이다. 그들을 소멸하라!
dialogue_2272=너희들이 이곳까지 찾아왔으니, 돌아갈 생각은 포기해라.
dialogue_2273=적들의 행동이 신속하다. 그들이 다시는 도망가지 못 하도록 공격하라!
dialogue_2274=이곳이 바로 그들의 근거지이다. 이번이 최후의 일전이다!
dialogue_2275=우리의 연구가 곧 완성될 것이다. 무모한 적들에게 진정한 힘을 보여줄 것이다!
dialogue_2276=소련군이 왜 이 시각에 나타난 것일까? 그러나 적의 적은 친구이니 최후의 승리를 위해서는 소련군의 힘에 의존해야 한다.
dialogue_2277=현재 적들은 우두머리가 없는 오합지졸이 되었으니 승리가 눈앞에 다가오고 있다. 하지만 이러한 국면을 조성한 기술은 영원히 봉인하여 보관해야 한다.
dialogue_2278=이 기술은 소련의 유산이다. 누구도 이런 결정을 내릴 권리가 없다!
dialogue_2279=영원한 친구도, 영원한 적도 없다. 단지 영원한 이익뿐이다.
dialogue_2280=놀랍게도 테러리스트들은 우리가 남겨 놓은 군사 기지를 이용하였습니다. 지휘관 각하, 우리는 그들이 이런 기술을 절대 장악하지 못 하도록 그들을 철저히 소멸시켜야 합니다.
dialogue_2281=핀란드는 우리의 영토 제안을 거부했습니다. 그들을 기다리고 있는 것은가장 진보된 무기를 갖춘 두려움 없는 전사들과 우리 군대의 승리로 곧 끝날 전쟁입니다.
dialogue_2282=우리는 소련의 권리와 이익을 존중하지만, 누구도 우리의 영토와 주권을 침해하는 것을 용납하지 않을 것입니다.
dialogue_2283=전쟁에 나가는 것은 즐거운 경험이 아니지만, 우리가 전쟁터에 가지 않으면 누가 이 땅을 지킬 것인가?
dialogue_2284=핀란드의 지형은 우리 군대의 행군에 유리하지 않습니다. 전쟁은 심각하며 안일함과 무모함으로 인해 실수가 일어나서는 안됩니다. 우리 군대는 더욱 신중하고 현명한 지휘를 받아야 합니다. 우리는 적의 힘과 위협을 과소평가해서는 안 됩니다.
dialogue_2285=우리의 힘과 결의를 과소평가해서는 안 됩니다. 핀란드 국민은 누구의 압력이나 위협에도 굴복하지 않을 것이며, 우리는 우리의 땅을 위해 싸울 것입니다.
dialogue_2286=우리는 평화적인 협상을 통해 이견이 해결되기를 바라지만, 필요하다면 조국을 지키기 위해 가능한 모든 조치를 취할 것입니다.
dialogue_2291=폴란드가 글라이비츠에 있는 독일 라디오 방송국을 공격한 것은 독일인들에게 용서할 수 없는 도발이며, 우리는 반드시 더 과감한 조치로 대응할 것입니다.
dialogue_2292=이 드라마는 독일인들이 직접 연출한 드라마입니다. 독일의 전쟁 가능성에 경각심을 가져야 합니다.
dialogue_2293=브란덴부르크 특수 부대는 적의 영토에 사전 배치되어 있으며 우리와 합동 공격을 가할 것이다. 공격을 시작할 준비를 하라!
dialogue_2294=적의 주요 장군들이 제거되었고 적의 사기는 심각한 타격을 받았다. 계속 공격하라, 승리가 눈앞에 있다.
dialogue_2295=폴란드는 독일과의 전쟁으로 혼란과 붕괴에 빠졌습니다. 결과적으로 이전에 폴란드와 체결한 모든 소련의 협정은 더 이상 유효하지 않습니다.
dialogue_2296=소련군은 폴란드에 있는 러시아 민족을 보호하고 그들의 평화로운 삶을 되찾기 위해 국경을 넘을 것입니다.
dialogue_2301=저지대의 자원과 군사 시설은 제국의 확장 계획에 잠재적인 위험이 되기 때문에 영국과 프랑스보다 먼저 이 영토들을 제국의 땅으로 만드는 것이 필수적입니다.
dialogue_2302=소련을 침공하기 전에 독일군은 서유럽의 나머지 지역에 대한 모든 위협을 제거해야 합니다.
dialogue_2303=마지노선은 파괴할 수 없을 것 같지만 그렇다고 우리가 전진하는 것을 막을 수는 없습니다. 연합국은 아직 기계화된 군대의 힘을 진정으로 이해하지 못했고, 우리의 전차 군단은 적의 예상치 못한 곳에서 공격할 것입니다.
dialogue_2304=독일군의 주력이 마지노선을 우회해 아르덴 숲에 나타난 사실은 우리의 허를 찔렀습니다.
dialogue_2305=우리는 이 기습 공격에 쓰러지지 않을 것입니다. 우리는 마지막 순간까지 독일의 공격에 단호히 저항하기 위해 필요한 모든 조치를 취할 것입니다.
dialogue_2306=아르덴 숲에서의 공격은 비정상적인 양의 저항을 겪고 있는 것 같습니다. 우리는 생각을 바꾸고 여러 방향에서 공격해야 합니다!
dialogue_2307=우리는 너무 많은 고통을 겪었고, 너무 많은 가족과 친구를 잃었습니다. 하지만 우리는 포기해서는 안됩니다. 우리는 계속 싸워야 합니다. 승리가 눈앞에 있습니다.
dialogue_2308=소련을 공격하는 군대가 집결했습니다. 중부 집단군으로서 우리는 첫 번째 전투에서 승리하고 민스크를 한 번에 점령해야 합니다!
dialogue_2309=독일군은 몰로토프-리벤트로프 조약을 명백히 위반하여 소련 영토를 침공했다. 나는 벌써 전차의 포효를 들을 수 있다. 방어를 위한 모든 전선을 재빨리 조직하라!
dialogue_2310=소련에서 독일의 공세는 막을 수 없습니다. 핀란드도 영토를 되찾고 카렐리야 지협을 탈환해야 합니다.
dialogue_2311=독일군은 남부에서 우리의 작전에 함께 협력할 것입니다.
dialogue_2312=라도가 호수의 공항은 많은 군인들이 방어하고 있지 않습니다. 우리가 이 공항을 이용하는 것은 매우 중요합니다.
dialogue_2313=민스크에서의 승리는 전격전의 성공을 다시 한번 입증했습니다. 적은 우리 장갑 부대의 공격을 막을 수 없습니다.
dialogue_2314=적이 한 발짝도 더 나아가게 해서는 안 된다. 스몰렌스크를 반드시 사수해라!
dialogue_2315=적군은 수적으로 많지만 효과적으로 전투력을 발휘할 수 없습니다.
dialogue_2316=키예프는 캅카스로 가는 길이다. 협공 작전으로 도시를 점령하라!
dialogue_2317=레닌그라드는 적군에 의해 엄중하게 방어되고 있습니다. 우리는 먼저 레닌그라드를 둘러싸고 나서 도시를 한 단계씩 포위해야 합니다.
dialogue_2318=핀란드 군대가 북쪽에서 우리와 함께 공격할 것입니다.
dialogue_2319=소련은 라도가 호수를 통해 레닌그라드에 꾸준히 보급품을 공급하는데, 이는 용납할 수 없는 일입니다.
dialogue_2320=그들의 보급로를 차단하고 전멸시켜라!
dialogue_2321=나쁜 소식은 전차가 철수했고 현재 사용할 수 있는 병력은 보병과 포병뿐이라는 것입니다.
dialogue_2322=좋은 소식은 본토 지원군의 구스타프 열차포가 우리를 도울 것이라는 것입니다.
dialogue_2323=그들에게 800mm 구경의 맛을 보여줘라. 세바스토폴이 벌벌 떨 것이다!
dialogue_2324=우리는 반드시 적이 공장 설비를 하르키우 밖으로 옮기기 전에 도시를 점령해야 한다!
dialogue_2325=적의 로켓포를 조심하세요. 그들의 화력 억제는 우리에게 적지 않은 피해를 입혔습니다.
dialogue_2326=적군은 모스크바에 백만 명이 넘는 병력을 집결시켰습니다. 이러한 병력과 혹한의 겨울은 우리에게 큰 위협이 되고 있습니다.
dialogue_2327=바르바로사 작전의 성공 여부는 이 전투에 달려있다!
dialogue_2328=계속 움직여라! 나는 벌써 쌍안경을 통해 크렘린 꼭대기에 있는 붉은 별을 볼 수 있다.
dialogue_2329=더 이상 잃을 것이 없다. 우리는 한 발짝도 물러설 여유가 없다. 이 전투는 소련의 존립을 위한 전투이다!
dialogue_2330=스탈린그라드의 공장과 자원은 우리에게 매우 중요합니다. 사령부로부터 도시를 점령하라는 명령이 내려졌습니다!
dialogue_2331=이 웅장한 도시는 버려져서는 안 된다. 우리는 이 도시의 이름을 위해 싸울 것이다!
dialogue_2332=남쪽으로 진군하여 서쪽에 있는 아군과 합류하십시오.
dialogue_2333=바르샤바가 점령되었습니다. 지휘관 각하, 소련군을 소멸 시키면 폴란드 전역이 우리의 소유가 될 것입니다.
dialogue_2334=지휘관 각하, 그들의 방어는 엉망이 되었습니다. 남쪽에서 우회 공격을 시작하겠습니다.
dialogue_2335=파리로 진격!
dialogue_2336=남쪽의 부대와 연합하여 우리는 곧 파리를 쓸어버릴 것이다!
dialogue_2337=포기하지 마라! 진로를 유지하라! 우리는 반드시 도시를 점령할 것이다.
dialogue_2338=지휘관 각하, 남쪽에서 공격을 개시해 주십시오. 북쪽의 아군이 쿠르스크를 포위하는 것을 도울 것입니다.
dialogue_2339=소련군이 부다페스트를 포위했습니다. 지휘관 각하, 군대를 지휘해 소련의 공세에 맞서 도시를 방어해 주십시오.
dialogue_2340=무슨 수를 써서라도 도시로 밀려드는 소련군을 섬멸하라. 그들은 단 한 명의 독일인도 전쟁 포로로 살려두지 않을 것이다. 싸움이 아니면 죽음뿐이다!
dialogue_2341=적이 너무 많습니다. 우리는 더 이상 버틸 수 없습니다.
dialogue_2342=흐름이 바뀌고 있습니다. 부다페스트가 곧 무너질 예정입니다. 지휘관 각하, 우리의 돌파와 대피를 이끌어 주십시오. 소련이 우리의 후퇴 경로를 차단하도록 놔두어서는 안 됩니다.
dialogue_2343=지휘관 각하, 영국군이 당신의 공격을 돕기 위해 동쪽에서 상륙할 것입니다. 우리는 함께 튀니지를 공격하고 나치 세력을 아프리카에서 몰아낼 것입니다!
dialogue_2344=적의 방어 부대가 약하다. 지금이다! 기회를 놓치지 말고 시칠리아에 상륙하라.
dialogue_2345=시칠리아는 우리의 통제하에 있습니다. 우리는 적을 제압하고 있습니다. 이것은 결정적인 승리입니다.
dialogue_2346=2년 이상의 준비 끝에 이 위대한 순간이 다가오고 있습니다. 지휘관 각하, 연합군을 이끌고 해안에 상륙하여 노르망디 지역을 점령하십시오.
dialogue_2347=공격, 맹렬하게 공격하라! 연합국이 해변에 성공적으로 상륙하지 못하게 하라.
dialogue_2348=필리핀은 우리에게 매우 중요합니다. 우리는 루손에 상륙하여 공격할 계획입니다. 지휘관 각하, 맥아더 장군은 당신과 함께 싸울 것입니다. 루손을 점령하고, 필리핀의 지배권을 회복하고, 태평양에서 일본의 힘을 약화시켜 주십시오.
dialogue_2349=수도 마닐라는 우리가 점령했습니다. 지휘관 각하, 방심하지 마시고 계속해서 남은 일본군을 추격해 주십시오.
dialogue_2350=다리를 파괴하고 장애물을 설치하여 미군의 진격을 막아라.
dialogue_2351=우리의 병력은 독일군을 훨씬 능가합니다. 적은 스스로 죽음을 자초하고 있습니다. 신속하게 전투를 끝내십시오.
dialogue_2352=끔찍하게도 선봉대가 너무 무모해서 전투에서 패했습니다. 지휘관 각하, 상황을 수습할 수 있도록 우리를 지휘해 주십시오.
dialogue_2353=독일 제국은 막을 수 없다. 병사들이여, 앞으로! 우리의 목표는 모스크바다!
dialogue_2354=나치 군대는 대담하게도 모스크바를 탐내고 있습니다. 그들은 그들의 오만함에 대한 대가를 치를 것입니다. 지휘관 각하, 병사들을 이끌고 수도를 지켜 주십시오.
dialogue_2355=무적의 독일 전격전 신화가 곧 산산조각나려 한다. 승리는 소련의 것이다.
dialogue_2356=우리는 곧 전투에서 승리할 것이지만 승리의 대가는 엄청납니다. 국가를 위해 목숨을 바친 소련 군인들을 항상 기억해야 합니다.
dialogue_2357=적이 이렇게 대규모의 장갑 부대를 출동시켰으니, 이 전투는 분명 장대한 전투가 될 것입니다. 지휘관 각하, 독일군의 공세에 맞서 우리를 지휘해 주십시오.
dialogue_2358=북쪽에서 오는 독일군의 협공을 조심하라! 방어 대형을 유지하기 위해 모든 자원을 사용하라.
dialogue_2359=반격의 나팔이 울렸다. 남은 독일군을 쫓아 파괴하라!
dialogue_2360=지휘관 각하, 당신은 우리가 소련의 잃어버린 영토를 되찾고 나치 독일에 대한 반격의 나팔을 불도록 이끌 것입니다!
dialogue_2361=벨라루스는 해방되었습니다. 우리가 이룬 승리는 엄청납니다. 승리를 거듭하여 서부에서 잃은 더 많은 영토를 회복하십시오.
dialogue_2362=우리는 곧 베를린에 진입할 것입니다, 지휘관 각하, 미국과 영국군이 당신의 공세를 도울 것입니다.
dialogue_2363=어떤 대가를 치르더라도 적이 베를린에 진입하는 것을 막아야 하며 총통을 보호해야 한다!
dialogue_2364=독일은 무너졌습니다. 이제 이 전쟁을 끝낼 시간입니다.
dialogue_2365=적들은 후퇴할 방법이 없습니다. 이것이 그들의 최후입니다.
dialogue_2366=병사들이여, 방어를 유지하라! 우리의 지원군이 반드시 도착할 것이다.
dialogue_2367=영국 지원군이다! 공격에 화력을 집중해서, 그들에게 기회를 주지 말아라!
dialogue_2368=영국군은 수적으로는 우리보다 많지만 그들의 공격에는 서투름과 결점이 있습니다. 지휘관 각하, 적의 공세를 막아내고 우리를 승리로 이끌어 주십시오.
dialogue_2369=부대를 동원하여 측면에서 후방으로 기습 공격을 가해 적에게 큰 타격을 입히십시오!
dialogue_2370=영국군의 방어선은 가잘라 해안에서 남쪽으로 뻗어 있어 서쪽에서 정면 공격을 가하면 손실이 클 것이 틀림없습니다. 지휘관 각하, 적의 후방으로 우회하여 기습공격을 가해 주십시오.
dialogue_2371=독일군이다! 그들이 왜 우리 뒤에 있지?
dialogue_2372=토브룩이 함락되었습니다. 병사들이여, 후퇴하라!
dialogue_2373=지휘관 각하, 카이로로 진군하여 연합군보다 먼저 이집트를 점령할 수 있도록 도와주십시오.
dialogue_2374=적의 저항이 치열하다. 병사들이여, 전부가 아니면 아무것도 아니다. 우리가 상대를 이길 것이라는 믿음을 가져라!
dialogue_2375=적의 증원 부대입니다! 지휘관 각하, 영국군의 포위망을 돌파할 수 있도록 우리를 지휘해 주십시오.
dialogue_2376=적의 지원군과 보급품이 끊임없이 도착하고 있습니다. 우리는 위기에 빠졌다!
dialogue_2377=독일 제국은 반드시 돌아올 것이다!





