elite_intro_72=P-40은 단좌, 직선익, 피스톤 전투기이다. 동아시아 전선에서 미 공군 장군 셔놀트가 창설한 플라잉 타이거즈는 P-40 전투기를 몰고 공격적인 일본군을 상대로 맞붙어 여러 차례 승리를 거두었다. 엔진 아래에 칠한 상어 주둥이가 P-40의 상징으로 널리 알려졌다.

