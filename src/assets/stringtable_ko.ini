feat_desc_43_Lv3=이동 후 추가 이동 가능, 추가 이동 시 이동력 +{2}, 쿨타임 1턴, 두 번째 이동으로 적군 섬멸 시 {1}% 확률로 추가 공격 가능(최대 1회).
feat_desc_46_Lv3=치명타 확률 +{1}%, 지속 시간 1턴, 쿨타임 2턴.
feat_desc_47_Lv4=아군 대상 1개 부대 생명력 {1} 회복, 매 턴 추가로 해당 대상 생명력 100 회복, 지속 시간 2턴. 스킬 사용 시 자신의 생명력 {2} 회복. 쿨타임 1턴.
feat_desc_49_Lv3=생명력이 100%인 지상 적군 유닛에 대한 데미지 +{1}%.
feat_desc_50_Lv3=적군 여러 유닛 공격, 기타 유닛에 대한 데미지 감소하지 않음, 데미지 +{2}%, 치명타 데미지 +{1}%.
feat_desc_51_Lv3=이번 턴 공격 사거리 +2, 공격 시 대상 도시 또는 요새의 생명력 {1}% 추가 감소(최대 1200), 수비 부대 생명력 {2}% 추가 감소(최대 500), 쿨타임 2턴.
feat_desc_52_Lv3=육군, 해군의 공격을 받을 때  {0}% 확률로 해당 피해 회피, 지속 시간 1턴, 쿨타임 2턴.
feat_desc_53_Lv3=장갑, 포병 유닛에 대한 데미지 +{1}%, 지속 시간 1턴, 쿨타임 2턴.
feat_desc_54_Lv3=포병 유닛에 대한 데미지 +{1}%, 지속 시간 1턴, 쿨타임 2턴.
feat_desc_55_Lv3=공군 유닛 생산 시 금전 소비 {1}% 감소.
feat_desc_56_Lv3=공격 시 {0}% 확률로 적 유닛의 사기 하락, 동일 확률로 목표에 화재 발생.
feat_desc_57_Lv3=보병, 장갑차, 야포 또는 곡사포 1개를 목표 지대로 수송하고, 수송 도중 {1}% 체력 회복, 공중 수송 시 대공 무기 무시.
feat_desc_58_Lv3=모든 함선 공격 시 데미지 {1}% 증가.
feat_desc_59_Lv3=요새 유닛에 대한 데미지 +{1}%, 지상 유닛에 대한 데미지 +{2}%.
feat_desc_60_Lv3=2칸 범위 내에 최대 2개의 감응 기뢰 설치 가능, 쿨타임 1턴.
feat_desc_61_Lv3=다음 공격 시 추가로 목표 대상 주변 1칸 내 랜덤으로 적군 2개에게 피해 입힘. 쿨타임 2턴.
feat_desc_62_Lv3=속박 또는 혼란 상태에 빠진 대상에 대한 데미지 200% 증가. 사용 시 주변 1칸 내 적군을 사기 영향을 받지 않는 혼란 상태에 빠지게 함. 지속 시간 1턴, 쿨타임 3턴. 2개 이상 대상 영향 시 쿨타임 1턴.
feat_desc_63_Lv4=도시 방어에 대한 데미지 {1}% 증가.
feat_desc_64_Lv3=초과된 치명타 확률이 추가 데미지로 전환. 초과된 치명타 확률 {2}%당 추가 데미지 {1}% 증가, 공격 시 목표 방어력 20% 무시.
feat_desc_65_Lv3=적 부대 방어력 {1}% 무시.
feat_desc_66_Lv3=이번 턴 장갑 유닛에 대한 데미지 +{1}%, 쿨타임 2턴.
feat_desc_67_Lv4=반격 데미지 +{1}%.
feat_desc_68_Lv4=공격 후 대상 섬멸 시 {0}% 확률로 한 번 더 이동 가능, 최대 {2}회.
feat_desc_69_Lv3=자신 주변 1칸 범위 내 우군 공격 시 {0}% 확률로 자신도 공격 참여, 데미지 +{1}%.(파일럿 효과 적용 시 해당 특성 무효)
feat_desc_70_Lv3=공격 시 대상 1칸 범위 내 다른 목표에게 {1}% 추가 데미지 입힘. 지속 시간 1턴, 쿨타임 2턴.
feat_desc_71_Lv4=공격 후 추가 공격 가능, 최대 {1}회 발동. 턴 내 공격할 때마다 다음 공격 데미지 20% 증가, 최대 3회 중첩.
feat_desc_72_Lv4=공항 내 수송기를 제외한 대부분의 비행기를 사용할 수 있으며, 최대 비행기 포인트 {1}포인트.
feat_desc_73_Lv4=함재기가 장갑 유닛에 주는 피해 +{1}%.
feat_desc_74_Lv4={1}% 확률로 도시 방공 시설 파괴, {2}% 확률로 방공 무기의 피해 감소 무시.
feat_desc_75_Lv3=공격받은 목표 주변 1칸 범위 내 아군 사기 상승, 공격력 +{1}%, 지속 시간 3턴.
feat_desc_76_Lv4=공격 범위가 3으로 변경, 적 여러 부대 공격 가능, 다른 목표에 대한 데미지 감소하지 않음. 공격 시 {1}% 확률로 적 반격 불가, 지속 시간 1턴, 쿨타임 2턴, 목표 지점 100% 확률로 화재 발생.
feat_desc_78_Lv3=회피 및 연막탄 효과 무시, 도시 방어에 대한 데미지 {1}% 증가.
feat_desc_79_Lv4=연막탄을 발사하여 자신을 연막으로 가림으로써 육군 및 해군의 주동 공격을 받을 수 없음. {1}% 확률로 추가 공격 1회, 지속 시간 1턴, 쿨타임 2턴, 50% 확률로 회피 효과 무시.
feat_desc_80_Lv4=연막탄 효과 적용 중 공격 시 대상의 방어력 {1}% 무시.
feat_desc_81_Lv4=미사일 발사 시 삼상탄 탄두 장착 가능. 초기 2발 보유, 매 {1}턴마다 1발 회복. 최대 5발 보유 가능. 공격 시 반드시 방사능 효과가 발동됩니다
feat_desc_82_Lv4=대륙간 유도탄 발사 가능. 매 턴 2회 발사 가능. 일반 공격 대신 사용.
feat_desc_83_Lv4=지상 유닛의 공격 대상이 될 수 없으며, 공군에게 받는 피해 {1}% 감소.
feat_desc_84_Lv4=직선 방향을 선택하여 최대 {1}칸 까지 전진하고(목표 지점은 공터여야 하고, 공중 부양 유닛에 의해 막힘), 도중에 난사 데미지 입힘. 쿨타임 1턴. 난사로 목표 처치 시 추가로 난사 제압 한 번 더 사용 가능. 턴당 최대 {2}회.
feat_desc_85_Lv2=항공모함 1헥스 범위 내에서 이륙 가능. 지형이 이동력에 미치는 영향 무시, 지뢰나 수뢰의 영향 무시, 공격 시 적군 반격 불가. 생명력 감소 후 전투력 감소하지 않음. 지상 유닛에 대한 데미지 +{1}%.
feat_desc_89_Lv3=7칸 범위 내에 현재 위치에서 목표 지점까지의 터널 굴착. 목표 지점은 산악 지대나 바다일 수 없으며, 바다를 가로지를 수 없음. 아군의 보병, 장갑차, 경전차, 중형 전차, 야전포, 유탄포, 로켓포, 터널 통과 가능. 터널 통과 후 추가 이동 가능, 각 터널당 최대 5회. 새로운 터널 굴착 시 원래 터널 사라짐. 쿨타임 2턴.
feat_desc_90_Lv4=주변 2칸 범위 내 건물 체력 {1}포인트 회복. 턴당 1회 발동.
feat_desc_92_Lv4=공격 범위 +1, 체력 {1}포인트 손실할 때마다 데미지 {2}포인트 증가.
feat_desc_93_Lv4=체력 감소 후 전투력 감소하지 않음. 빈사 상태에 도달 시 체력이 1 포인트 이하로 감소하지 않음. 지속 시간 3턴, 쿨타임 {2}턴. 보호 장치 종료 시 HP 30% 회복.
feat_desc_94_Lv4=자신 또는 우군 영토 범위 내에 머물 경우, 데미지 {1}% 증가, 이 턴의 첫 번째 공격 시, 공격 범위 +1.
feat_desc_95_Lv4=특수 지형의 이동 영향 무시, 공격 또는 반격 시 지형에 의한 데미지 감소 효과 무시, 적 방어력 및 이동력 {1}% 감소, 지속 시간 2턴.
feat_desc_96_Lv4=직접적인 피해는 자신과 주변 우군이 나누어 분담하며, 분담하거나 회피한 피해 {1}포인트당 기본 데미지 {2}포인트씩 증가, 추가 공격력 최대 300%. 지속 시간 3턴.
feat_desc_97_Lv4=공군의 공격 받을 시 {1}%의 확률로 피해 회피.
feat_desc_98_Lv4=잠행 상태에 진입하여 적 육군과 해군의 주동적인 공격을 받을 수 없음. 쿨타임 2턴. 잠행 시 이동력 +{1}. 지속 시간 1턴. 공격 후 잠행 상태 해제되지 않음.
feat_desc_99_Lv4=공격 시 반격 불가. 부대 공격 시 데미지 {1}% 증가(잠행 상태에서 데미지 {2}% 증가), 건물 공격 시 데미지 50% 감소.
feat_desc_100_Lv3=헬리콥터를 호출하여 자신을 9칸 내 지정한 위치로 이동함. 쿨타임 2턴. 수송기로 운송 시 수송기 사용 횟수 소모하지 않음.(턴당 1회 제한)
feat_desc_102_Lv4=이번 턴 치명타 확률 {1}% 증가, 공격 시 목표 방어력 {2}% 무시, 턴 내 목표 처치할 때마다 치명타 확률 +4%, 쿨타임 2턴.
feat_desc_103_Lv4=방어력 {1}% 증가, 공군 부대에게 받는 피해 {2}% 감소.
feat_desc_105_Lv4=항공모함의 함재기로 사용 가능. 공격할 때마다 목표 지역 내 {1}% 추가 피해 입힘.
feat_desc_106_Lv4=핵탄두 장착 공격 시 핵탄두 데미지 {1}% 증가.
feat_desc_107_Lv4=이번 턴 공격 시 목표의 1칸 범위 내 다른 대상에게 {1}% 추가 피해 입힘. 쿨타임 2턴.
feat_desc_108_Lv4=적 여러 부대 공격 가능, 전차와 포병 유닛에 대한 데미지 {1}% 증가, 목표 처치 시 추가 공격 가능.
feat_desc_109_Lv3=주변 2칸 범위 내 적 부대 대부분의 강화 효과를 해제하고, 사기 크게 저하 시킴, 쿨타임 2턴.
feat_desc_110_Lv4=산악 및 삼림 지형에서 받는 피해 {1}% 감소.
feat_desc_111_Lv4=장거리 미사일을 여러 발 발사하여 대상에게 장거리 미사일 피해 {1}%를 입히고, 목표 주변 적에게 {2}% 피해 입힘. 쿨타임 2턴.
feat_desc_117_Lv4=공격 시 반드시 치명타 발동.

feat_desc_121=적 도시 점령 시 자신 및 3칸 범위 내 우군 사기 상승, 지속 시간 2턴.
feat_desc_122=2칸 범위 내 우군이 직접 피해를 받을 경우, HP {1} 회복.
feat_desc_123=HP가 {1}% 감소할 때마다 받는 피해 {2}% 감소, 최대 25%. 받는 피해 최대 300 포인트(핵폭탄에 효과가 없다).
feat_desc_124=받는 직접 피해의 {1}%를 주변 1칸 내 적 목표에게 분산 시킴.
feat_desc_125=주변 2칸 우군 목표 방어력 +{1}%.
feat_desc_126=육군 유닛의 공격을 받을 경우 {0}% 확률로 주변 1칸 범위 내 임의의 목표에게 해당 피해 이전.(피해를 준 유닛에게는 이전 불가)
feat_desc_127=목표 공격 시 목표가 보유하는 방어력 {1}포인트당 데미지 +{2}%.
feat_desc_128=목표 공격 시 목표에게 매 턴 현재 체력의 10% 감소 효과 부여, 지속 시간 2턴.
feat_desc_129=유닛 1개 처치할 때마다 자신의 공격력 +{1}%, 최대 {2}회 중첩 가능, 지속 시간 2턴.
feat_desc_130=연막탄 효과 적용 시 주변 2칸 내 적 유닛의 공격 사거리를 {1}로 감소.(연막탄 효과 무시 시, 해당 효과도 무시)
feat_desc_131=자신 또는 우군 영토 내에 머물 경우 이동력 +{1}.
feat_desc_132=공수 후, 해당 턴의 데미지 +{1}%.
feat_desc_133=어느 턴에 이동하지 않았을 경우, 다음 턴 이동력 +{1}.
feat_desc_134=수송기로 공중 수송 가능.
feat_desc_135=2칸 범위 내에서 최대 {1}개 목표를 선택하여 어뢰 발사 가능, 쿨타임 2턴.
feat_desc_136=매 턴 종료 시 HP {1}% 회복.
feat_desc_137=회피, 연막탄, 잠행, 전자파 침묵 효과 무시.
feat_desc_138=목표에 대한 데미지 +{1}%.
feat_desc_139=목표 폭격 시 목표 방어력 {1}% 무시.
feat_desc_140=턴 시작 시 주변 1칸 내 적 이동력 {1}% 감소.

army_buff_desc_1023=정밀 저격: 치명타 확률 90% 증가.
army_buff_desc_1043=거포: 공격 사거리 +2, 도시 방어와 수비 부대에 추가 피해 입힘.
army_buff_desc_1053=경사 장갑: 100% 확률로 피해 회피.
army_buff_desc_1063=장갑 킬러: 이번 턴에서 전차와 화포 유닛에 대한 데미지 55% 증가.
army_buff_desc_1073=화포 킬러: 이번 턴에서 화포 유닛에 대한 데미지 65% 증가.
army_buff_desc_1083=탱크 킬러: 이번 턴에서 전차 유닛에 대한 데미지 65% 증가.
army_buff_desc_1093=화력 제압: 목표 유닛 1칸 범위 내 랜덤으로 적 유닛 2개 추가 공격 가능.
army_buff_desc_1202=긴급 구조: 매 턴당 체력 100 포인트 회복.
army_buff_desc_1253=집중 공습: 목표 유닛 1칸 범위 내 기타 목표에게 100% 추가 피해 입힘.
army_buff_desc_1304=로켓 공격: 공격 범위를 3으로 변경, 적 여러 부대 공격 가능, 공격 시 100% 확률로 적 반격 불가.
army_buff_desc_1314=연막탄: 육군과 해군에게 공격 받지 않음. 100% 확률로 추가 공격 1회, 50% 확률로 회피 효과 무시.
army_buff_desc_1323=공동 작전: 공격력 %d 증가.
army_buff_desc_1332=보호 장치: 체력이 1포인트 이하로 감소될 수 없음. 효과 정상 종료 시 체력 30% 회복.
army_buff_desc_1364=열화우라늄탄: 치명타 확률 50% 증가, 공격 시 목표 방어력 70% 무시, 적 유닛 1개 처치할 때마다 치명타 확률 4% 증가.
army_buff_desc_1374=AGM-114 헬파이어: 목표 1칸 범위 내 다른 목표에게 100% 추가 피해 입힘.
army_buff_desc_1421=지속 제압: 매 턴 체력 10% 감소.
army_buff_desc_1431=화력 증강: 공격력 %d%% 증가.
army_buff_desc_1441=시야 방해: 공격 사거리 1로 감소.
army_buff_desc_1451=공수 급습: 데미지 100% 증가.
army_buff_desc_1481=플라잉 타이거 공격: 공격력 10% 증가


