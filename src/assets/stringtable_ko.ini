event_stage_intro_20901=기지는 자폭했다. 우리는 성공적으로 철수한 마지막 부대이다. 마지막 순간에 설정한 임시 좌표는 아마도 우리를 남미 정글에 있는 기지 근처로 인도할 것이다. 이번에는 더 많은 시간을 들여 모든 것을 계획할 수 있게 되었다.
event_stage_intro_20902=스페인 내전이 한창이고 독일, 이탈리아, 소련의 개입으로 불개입 협정은 유명무실하게 되었다. 과거의 '해가 지지 않는 제국'은 이미 붕괴되었고, 새로운 '해가 지지 않는 제국'도 결국 그 뒤를 따를 것이다. 이번 전쟁의 결과는 바꿀 수 없지만, 우리는 여전히 싸워야 한다. 왜냐하면 그곳에 우리의 전우들이 있기 때문이다.
event_stage_intro_20903=제2차 세계 대전 이후 미국은 마셜 플랜을 통해 중동에서 터키라는 중요한 동맹을 얻었다. 그러나 이때 소련의 선동으로 이란의 민족주의 정서가 갈수록 고조되어 이란에서 석유를 생산하는 것이 점점 더 어려워지고 있다. 이는 우리의 이익에 심각한 위협을 가했다! 아이젠하워 신임 대통령의 승인을 받은 CIA는 MI6와 협력하여 쿠데타를 계획했다. 이번 작전은 반드시 성공해야 한다.
event_stage_intro_20904=오스본의 계획은 각 세력들이 남미 정글에서 싸우게 만들었다. 일본과 소련의 민족주의자들도 이 틈을 타서 일본 내 미군 기지를 공격했다. 소련이 위성 무기를 개발했다는 소식이 있는데, 지금은 우리가 그 기술을 탈취할 좋은 기회이다! 유딘체프는 통신 위성 전문가를 파견했으며, 쿠릴 열도의 소련 군사 기지 근처에서 우리와 만나기로 했다.
event_stage_intro_20905=마셜 플랜은 서유럽 재건을 가속화했고, 각국 경제는 급속한 발전을 이루었다. 그러나 최근 이탈리아에서는 부패가 만연하고 사회적 불안이 커지고 있으며, 심지어 총리가 암살당하는 사건이 발생했다. 한편 소련은 체코슬로바키아 전역을 빠르게 점령하고 발칸 반도로 병력을 계속 파견하고 있다. 우리는 동유럽이라는 화약통에 성공적으로 불을 붙였으니 유럽의 구도는 곧 재편될 것이다.
event_stage_intro_20906=미국의 분리주의자들은 대통령의 연임에 불만을 품고 무장 봉기를 일으켰다. 이상한 점은 우리가 이번 선거에 개입하지 않았고, 내 기억에 이런 전쟁은 일어나지 않았다는 것이다. 그런데 대통령은 오히려 우리에게 연락해 이 반란을 진압해달라고 요청했다. 이번 작전은 예측할 수 없는 부분이 많아 미군의 동향을 항상 주의해야 한다.
event_stage_intro_20907=연합군은 남하하여 우리의 멕시코 군사 시설을 기습했다. 적군은 우리가 태평양의 섬에 배치한 기지의 좌표를 파악했으니, 방해 장치는 무의미해졌다. 조만간 남극의 소련군도 우리 기지를 발견할 것이다. 상황이 급박하니 즉시 동원 가능한 모든 병력을 모아 소련의 남극 연구소를 공격하라.
event_stage_intro_20911=기지는 자폭했다. 우리는 성공적으로 철수한 마지막 부대이다. 마지막 순간에 설정한 임시 좌표는 아마도 우리를 남미 정글에 있는 기지 근처로 인도할 것이다. 이번에는 더 많은 시간을 들여 모든 것을 계획할 수 있게 되었다.
event_stage_intro_20912=스페인 내전이 한창이고 독일, 이탈리아, 소련의 개입으로 불개입 협정은 유명무실하게 되었다. 과거의 '해가 지지 않는 제국'은 이미 붕괴되었고, 새로운 '해가 지지 않는 제국'도 결국 그 뒤를 따를 것이다. 이번 전쟁의 결과는 바꿀 수 없지만, 우리는 여전히 싸워야 한다. 왜냐하면 그곳에 우리의 전우들이 있기 때문이다.
