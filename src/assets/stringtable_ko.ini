dialogue_2670=부대 전진이 매우 순조롭다. 우리는 곧 방어선을 돌파하여 소련군의 기지를 향해 진군할 것이다.
dialogue_2671=미사일 배치가 끝났다. 수시로 적군을 공격할 수 있다.
dialogue_2672=우리의 슈퍼 무기를 잘 이용하여 이곳을 적을 섬멸하라.
dialogue_2673=즉시 반격을 시작하여 서울을 탈환하라.
dialogue_2674=소련군의 공세는 우리에게 심각한 위협이 되었기 때문에 반드시 조치를 취해 반격해야 한다.
dialogue_2675=작전은 단계적인 성공을 거두었다. 그러나 지금은 긴장을 풀 여지가 없으며, 소련군의 반격에 대응할 준비가 되어 있어야 한다.
dialogue_2676=소련군의 해상 요새를 파괴하고, 적 함대의 재편성을 막아라.
dialogue_2677=미군은 본격적인 침공을 시작했다. 우리에게 남은 시간이 많지 않다.
dialogue_2678=미군이 소베츠카야가반을 점령하는 것을 막아라. 나의 원군이 곧 전장에 도착할 것이다.
dialogue_2679=미군의 규모는 매우 크고, 공격은 매우 급격하기 때문에 더 많은 지원군이 필요하다.
dialogue_2680=나는 원군이 도착하여 반격할 때까지 계속 싸울 것이다.
dialogue_2681=상륙 지점이 소련군에 의해 점령되었다. 타타르 해협을 봉쇄하기 위한 병력을 재집결하라.
dialogue_2682=상륙 부대의 집결이 완성되었다. 수시로 섬 탈취 작전을 벌일 수 있다.
dialogue_2683=홋카이도의 적군 거점을 직접 공격하라. 남쿠릴 제도의 수비군은 우리의 작전을 위해 시간을 쟁취해줄 것이다.
dialogue_2684=우리의 공격은 중요한 거점을 잃었다. 홋카이도 방향으로 철수하라!
dialogue_2685=적의 수비군은 우리에게 격파되었다. 즉시 주변 해역의 소련군 함대를 섬멸하라.
dialogue_2686=미군은 세 개의 전쟁터에서 동시에 우리를 공격하기 시작했다. 각 요새와 도시를 전력으로 지키고, 기회를 노려 반격하라.
dialogue_2687=지원군이 전쟁터에 도착할 수 없게 되었으니 스스로 싸워야 한다. 어려운 전투일 것이다.
dialogue_2688=소련군의 방어선은 견고하지 않다. 얼마 지나지 않아 캄차카 반도의 나머지 소련군 기지를 제거할 수 있을 것이다.
dialogue_2689=나의 기갑부대는 이곳을 사수할 것이니, 방어선으로 철수하는 전선부대를 도와줘라.
dialogue_2690=연합군의 함대가 베링해 방향에서 이곳으로 다가오고 있다. 적의 상륙 부대를 조심하라.
dialogue_2691=미군의 공격 중심은 곧 바뀔 것이다. 우선 적 장군을 처리하고, 유리한 지형에 의지하여 방어를 다시 조직하라.
dialogue_2692=우리는 공격의 주도권을 되찾았다. 군도의 물자를 탈환하는 것은 좋은 시작이 될 것이다.
dialogue_2693=미군은 앵커리지 주변에 모든 방어력을 집중시켰다. 지금이 상륙하기에 매우 좋은 기회이다.
dialogue_2694=연합 함대는 베링 해협 남부에서 공격을 개시하여 이 '얼음 장막'을 뚫을 것이다.
dialogue_2695=우군이 베링 해협을 건너 앵커리지 주변 지역을 신속하게 장악하도록 지원하라.
dialogue_2696=거의 모든 방어선이 뚫렸다. 계속 지키는 것은 오직 파멸의 길일뿐이다.
dialogue_2697=선제적으로 출격하여 우리의 진지를 탈환하라.
dialogue_2698=소련군은 해로와 육로를 통해 알래스카에 자리를 잡았다.
dialogue_2699=소련군이 모든 퇴로를 봉쇄했기 때문에 알래스카 산맥의 험준한 지형에 의지하여 방어선을 재배치할 수밖에 없다.
dialogue_2700=앵커리지 서쪽의 미군은 우리에게 맡기고, 계속 동쪽으로 공격하여 이 포위망을 완성하라.
dialogue_2701=우리는 적군의 요새를 뚫었다. 그들은 더 이상 물러날 길이 없다.
dialogue_2702=상황이 매우 위급하다. 즉시 모든 예비군을 동원하여 앵커리지를 지원하라.
dialogue_2703=우리는 연구 시설을 장악했다. 이곳의 모든 것을 충분히 이용하여 적의 멸망을 가속시켜라.
dialogue_2704=소련군은 우리의 가장 견고한 요새를 격파했다. 알래스카는 우리의 통제에서 완전히 벗어났다.
dialogue_2705=가만히 앉아서 죽기를 기다려서는 안 된다. 선제적으로 출격하여 페어뱅크스를 탈환해야 살길이 생길 수 있다.
dialogue_2706=적이 쉽게 진형을 전개하지 못하도록 소련군의 선두부대를 신속하게 포위하라.
dialogue_2707=적의 방어선은 우리와 우군간의 연계를 차단했다. 원군이 도착하기 전에 이 장벽을 뚫어야 한다.
dialogue_2708=우리는 소련군의 부대 간 연결을 차단하는데 성공했다. 우리의 방어 깊이를 충분히 이용하여 적을 완전히 격파하라.
dialogue_2709=밴쿠버의 수비군이 격파되었으며, 서해안의 공격 통로가 곧 열릴 것이다.
dialogue_2710=원군이 곧 전쟁터에 도착할 것이다. 내 부대는 밴쿠버 방향으로 반격할 것이니 시애틀을 사수하라.
dialogue_2711=계속 공격하라! 적들이 우리의 강철 물결 앞에서 벌벌 떨게 만들어라!



dialogue_2651=연합군 각국의 부대가 집결되었다. 승리는 우리의 것이다.
dialogue_2652=연합군의 자원과 보급은 우리보다 훨씬 많다. 우리는 힘든 전투에 직면해 있다.
dialogue_2653=88mm 대공포를 평평하게 배치하고, 사막과 참호에 매복하여 적을 기습하라.
dialogue_2654=말도 안 돼. 적군은 전혀 패퇴할 기미가 없다니. 우리는 지중해의 보급 함대에 의존하여 적과 장기적인 소모전을 벌여야 한다!
dialogue_2655=해안 방어선을 지키고 원군에게 상륙할 기회를 주지 말아라.
dialogue_2656=이탈리아가 연합군의 공격을 받았다. 독일군 지휘관에게 지원을 요청하라!
dialogue_2657=승리의 빛이 눈앞에 있다. 지휘관님, 잠시만 버티면 우리는 곧 무사히 빠져나갈 수 있을 것이다!

dialogue_2658=우리의 조종사들이 충분히 휴식을 취할 수 있도록 진주만의 매주 일요일 항공기 순찰을 취소하라.
dialogue_2659=제국의 흥망은 이번 전투에 달렸다. 전체 장군과 병사들은 직무를 다하고 최선을 다해야 한다!
dialogue_2660="… 반청, 산속 구름 많음. 항구 시야 양호. 편북풍 약 10급." 호놀룰루의 방송에 이상이 없다. 적은 우리의 기습 작전을 전혀 모르고 있다.
dialogue_2661=이건 훈련이 아니다! 진주만은 일본의 공격을 받고 있다!
dialogue_2662=호랑이! 호랑이! 호랑이!
dialogue_2663=모든 대공 무기를 동원하여 우리의 군함과 항구를 지켜라!
dialogue_2664=이번 습격에서 총알 한 방에 죽게 된다면, 나에게 자비라고 할 수 있다.
dialogue_2665=우리가 한 모든 것이 잠들고 있는 거인을 깨워 그가 큰 결심을 가지고 우리와 싸울 까봐 걱정이다.
dialogue_2666=도, 도, 도.

