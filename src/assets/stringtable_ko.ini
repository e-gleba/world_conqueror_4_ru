event_intro_472=1942년 2월 8일, 일본군은 싱가포르 방어선 중 가장 취약한 북서부 해안에서 성공적으로 상륙했다. 연합군은 병력과 보급에서 우위를 점하고 있었으나 훈련과 경험이 부족했다. 그러므로 일본군은 빠르게 부킷 티마를 점령하고 연합군의 식량 창고, 유류 저장소, 인근 저수지를 장악하여 섬의 연합군은 급속히 물자 부족에 직면하게 되었다. 결국 2월 15일, 연합군은 무조건 항복을 선언했다.
event_intro_473=1942년 2월 11일부터 13일까지, 공습을 피하기 위해 독일 군함 샤른호르스트, 그나이제나우, 외겐 프린츠는 기뢰 제거선과 공군의 지원을 받아 프랑스 브레스트에서 성공적으로 영국 해협을 통과하고 독일 해군 기지로 향했다. 케르베루스 작전은 영국군에게 수치스러운 일이 되었다. 그러나 그 후 독일 해군 수면 함선의 활동 범위는 북해로 제한되었고, 대서양 항로에 더 이상 위협을 가할 수 없게 되었다.
event_intro_474=연합군이 시디 부지드 동쪽 파이드 협곡에서 적군이 점령한 해안 평원을 습격하고, 튀니지의 북부군과 남부군 사이의 연결 고리를 차단하는 것을 막기 위해 독일군은 1943년 2월 14일, 시디 부지드와 그 주변에 대한 공격을 개시하여 연합군에게 큰 타격을 입혔다. 연합군은 많은 진지를 잃고 카세린으로 철수했다.
event_intro_475=우박 작전은 1944년 2월 17부터 18일까지 미 해군이 중앙 태평양에 있는 일본 해군의 주요 군사 항구인 트럭 섬에 대해 실시한 대규모 해공 연합 공습이다. 비록 작전의 주요 목표였던 연합 함대의 주요 전함들은 미리 대피했지만, 항구에 있던 수많은 수송선과 보조 함정들이 치명적인 타격을 받아 일본 해상 수송 능력은 심각한 타격을 입었다.
event_intro_476=이오지마 전투는 제2차 세계대전 태평양 전쟁 중 1945년 2월 19일부터 3월 26일까지 지속된 미국과 일본 간의 전투이다. 이 전투에서 일본군은 미군의 상륙을 막기 위해 해변에 방어선을 구축하는 것을 포기하고 대신 섬 내부에 복잡한 방어선을 구축했다. 이로 인해 미국의 공격은 극히 어려워졌고, 원래 7일로 예정되었던 점령 작전은 한 달 이상 지연되었다. 결국 미군은 일본군을 물리쳤고, 이오지마의 섬 정상에 성조기가 게양되었다. 이는 미국의 중요한 정신적 상징이 되었다.
event_intro_477=소련군이 베를린을 공격하는 동안 포메라니아의 독일군이 반격을 개시하여 전쟁을 지연시키지 못하도록, 소련은 1945년 2월 24일 로코소프스키를 파견하여 벨라루스 제2방면군과 제1방면군의 동부 부대를 지휘해 소련군 북쪽의 포메라니아에 주둔한 독일군을 섬멸했다. 이로써 이로써 소련군은 베를린으로 향하는 길을 열었다.
event_intro_478=자와 섬을 점령하기 위해 1942년 2월 27일 일본군과 연합군 함대는 수라바야 근처 해역에서 해전을 벌였다. 이틀 동안 지속된 이 전투에서 일본군은 구축함 한 척이 손상된 대가로 연합군 전함 여러 척을 격침시키며 승리를 거우었다. 이 전투는 자와 섬 주변의 연합군 함선에게 큰 타격을 주었고, 일본군의 자와 섬 점령을 가속화했다.
event_intro_479=1943년 초, 뉴기니 전투는 연합군의 공격 단계로 접어들었다. 이런 상황을 반전시키기 위해 일본은 뉴기니에 병력을 추가하여 반격에 나설 계획을 세웠다. 2월 28일, 일본군은 함대를 편성해 라바울에서 출항했고, 3월 3일에 약 6,900명의 병력을 라에로 수송할 계획이었다. 그러나 연합군은 이 계획을 미리 파악하고 3월 2일부터 3일까지 함대에 대한 지속적인 공습을 가해 모든 수송선을 격침시켰다.
event_intro_480=마레스 방어선에 대한 영국의 공격을 지연시키기 위해 독일군은 1943년 3월 6일 메드닌을 집중 공격하여 현지의 예비군을 제거할 계획을 세웠다. 그러나 영국은 이 계획을 미리 파악하고, 병력을 동원해 지원군을 마련헀다. 공격 당일까지 독일군은 진지를 점령하지 못했다. 롬멜은 승리를 거두더라도 남은 병력으로 마레스 방어선을 지키기 어렵다고 판단했다. 결국 그는 작전을 중단하기로 결정했고, 영국군은 최종적으로 승리를 거두었다.
event_intro_481=적의 거점을 점령하고, 미얀마를 방어하며, 증원로를 차단하는 등 '공세와 방어'의 전략적 목표를 위해 1944년 3월 8일 일본군은 임팔 전투를 시작했다. 이 전투는 7월 초까지 지속되었고 일본군의 대패로 끝났다. 실패의 주요 원인은 일본군 사령관 무타구치 렌야의 비현실적이고 무책임한 전투 계획과 지휘 때문이다. 일본에서 '임팔'이라는 단어는 여전히 '용기는 있지만 지혜가 부족한' 사람을 묘사하는 데 사용되고 있다.
event_intro_482=민다나오를 해방하고 섬에 주둔한 일본군을 격파하기 위해 빅터 5호 계획, 즉 민다나오 전투를 시작했다. 이 전투는 1945년 3월 10일부터 8월 15일까지 지속되었다. 필리핀 게릴라의 도움을 받은 미군은 매우 적은 피해로 섬에 주둔한 모든 일본군을 섬멸했다.
event_intro_483=메드닌 전투 이후 연합군은 바로 마레스 방어선을 공격하기 시작했다. 1943년 3월 16일, 영국군은 두 방향으로 진격하였는데, 하나는 방어선을 정면으로 공격하여 추축군의 주의를 끌었고, 다른 하나는 남서쪽 산악지대를 우회하여 북상하며 측면에서 기습 공격을 감행했다. 양측의 협공을 받은 추축군은 포위되는 것을 막기 위해 북쪽으로 철수했다. 결국 연합군은 마레스 방어선을 점령하는 데 성공했다.
event_intro_484=민다나오 전투가 시작된 후, 1945년 3월 18일, 맥아더 장군은 필리핀 중부의 비사야 제도 점령을 명령했다. 당시 각 섬의 필리핀 게릴라들은 적극적으로 반격을 벌였기 때문에 일본군은 주요 도시 외에 전체적인 방어를 소집할 수 없었다. 따라서 미군은 비사야 제도를 성공적으로 해방시켰다.
event_intro_485=1943년 3월 23일, 독일군의 전선을 뚫고 마레스 방어선으로 진격하기 위해 미군 제2군단은 게르타에서 추축군과 전투를 벌였다. 미군은 초반에 어느 정도 성과를 이뤘고 독일군의 전초 부대를 물리쳤다. 그러나 독일군은 재빨리 반격하여 탱크와 보병을 동원해 미군을 공격했다. 연합군이 다른 전선에서 돌파구를 마련할 때까지 양측은 게르타 협곡에서 교착 상태에 빠졌다.
event_intro_486=1944년 3월 25일, 소련군은 독일 제1기갑군을 제거하기 위해 우크라이나 제1방면군과 우크라이나 제2방면군을 동원하여 카미야네치-포딜시키 지역에서 독일군을 포위했다. 이러한 상황에서 OKW는 결국 제1기갑군의 돌파를 허용했다. 독일군은 많은 장비와 병력을 잃으면서 탈출에 성공했지만, 그로 인해 우크라이나에서 방어 조직을 구성할 수 있는 능력을 상실했다.
event_intro_487=동남아시아에서 일본의 지배력을 강화하고 버마 침략군을 지원하기 위해 1942년 3월 31일, 일본은 해군 제1항공함대를 스리랑카의 함대 기지에 파견해 영국 동부 함대를 격파하려 했다. 영국이 사전에 정보를 입수했음에도 불구하고 인도양 지역의 영국 해군은 잘못된 의사 결정으로 심각한 타격을 입었고 영국 동부 함대는 벵골만에서 철수할 수밖에 없었다.
event_intro_488=일본 본토 공격의 발판을 마련하기 위해 1945년 4월 1일, 미군은 오키나와 전투를 시작했다. 전투 초반에 미군은 오키나와의 중부와 북부를 빠르게 점령했으나, 남부 진격 과정에서 일본군은 동굴과 땅굴, 강력한 요새를 이용해 미군을 치열한 진지전에 끌어들였다. 이 전투에서 연합군은 약 12,000명이 전사하고 36,000명이 부상당했으며, 일본군은 약 77,000명이 사망하거나 실종되었다. 이러한 비극적인 결과는 미국이 원자폭탄을 이용해 일본을 항복시키는 결정을 가속화했다.
event_intro_489=포도탄 작전은 제2차 세계대전 말기 연합군의 마지막 이탈리아 공세이다. 1945년 4월 6일, 연합군은 포 강 양쪽의 독일군 전선을 돌파하며 북쪽으로 진군했다. 이탈리아 게릴라들도 반란을 일으켜 추축군의 붕괴를 가속화했다. 결국 1945년 5월 2일, 이탈리아의 모든 독일군과 이탈리아군 잔여 병력이 항복하고 연합군은 이탈리아 전역을 해방시켰다.

event_sweep=소탕
event_sweep_desc_1=어려움 난이도로 클리어하셔야 합니다.
event_sweep_desc_2=즉시 전액 관문 보상과 상자 진도를 획득.
copy_ok=클립보드에 복사됨

dialogue_3199=작전 시작! 영국군이 눈치채기 전에 덴마크 전역을 장악하고 노르웨이 전략 항구를 점령해야 한다!
dialogue_3600=함대를 출동시켜라. 항구는 반드시 우리의 통제 하에 있어야 한다!
dialogue_3601=덴마크는 항복했다. 전 부대 전투 준비 태세 유지하며 노르웨이로 진군 계속!
dialogue_3602=영국군의 공격은 단독 사건이 아니다. 나르비크를 목숨 걸고 사수하라!
dialogue_3603=영국군이 불동항 확보를 방관하지 않을 것이다. 철저히 방어 준비를!
dialogue_3604=나는 적의 공격을 막기 위해 가능한 모든 준비를 마쳤다.
dialogue_3605=우리 군단은 가장 짧은 진격로를 가졌다. 베를린 점령의 영예는 우리 것!
dialogue_3606=가장 짧은 길에 가장 강한 적이 있다. 베를린 선점 부대는 우리가 될지 모른다!
dialogue_3607=북방 기갑 부대가 주공 부대의 장애물을 제거할 것이다.
dialogue_3608=전선이 붕괴했다. 이제 더 많은 생명을 구하는 것만이 목표다.
dialogue_3609=베를린 수비군에 고한다: 총통 자살. 즉시 전투 중지! 더 이상 희생을 허락하지 마라!
dialogue_3610=이번 임무는 둘리틀을 이륙 지점까지 호송하는 것이다. 폭격기가 이륙하면, 함대는 전속력으로 철수하라. 일본군과 싸우지 말고, 단 1초도 낭비하지 마라!
dialogue_3611=함대가 일본군에게 발각되었으니 미리 움직여야 한다. 폭격기 중대는 즉시 비행기에 탑승하라!
dialogue_3612=둘리틀 중대가 모두 출격했다. 어서 철수하라!
dialogue_3613=적 집단군은 전략적 유연성을 상실했고, 전투는 마지막 단계에 접어들었다. 각 부대에게 적 방어선을 압축하고, 먼저 튀니지를 점령한 후 비제르테를 공격하라고 명령하라!
dialogue_3614=나는 아프리카 집단군을 대표하여 연합군에 항복한다.
dialogue_3615=더 이상 공격할 필요 없다. 나는 이탈리아 제1군단을 대표하여 무조건 항복을 받아들이겠다.
dialogue_3616=추축국이 에게해에서 전력을 축적하도록 방치할 수 없다. 특수 부대를 보내 섬 주둔군을 공격하고, 해군 관측소와 무선 기지를 파괴해야 한다.
dialogue_3617=연합군은 최근 데번 근처 해안에서 대규모 작전을 펼치고 있다. S-보트 편대는 해협 방어선을 우회하여 무장 정찰을 수행하라.
dialogue_3618=일본 해군은 더 이상 걱정할 필요가 없다. 보르네오를 해방하고, 섬의 공항과 석유 자원을 탈환하라!
dialogue_3619=이노우에 중장, 이 세 개의 항공모함 편대를 지휘하여 'MO 계획'을 수행하라. 상륙 부대가 무사히 모르즈비 항에 도착하도록 보장하라!
dialogue_3620=정보에 따르면 일본군은 최근 모르즈비 항을 공격할 계획이다. 동원 가능한 4척의 항공모함을 모두 산호해로 이동시켜 일본군의 계획을 철저히 분쇄하라!
dialogue_3621=정찰기 정보에 따르면, 일본군 주력이 출동했다. 출격하여 조마드 해협에서 적을 섬멸하라!
dialogue_3622=쇼카쿠와 즈이카쿠를 안전하게 지키고, 쳐들어오는 적들을 모두 격파하겠다!
dialogue_3623=B 집단군은 저지대 국가에 전략적 양동 작전을 실시하여 영국-프랑스 주력을 벨기에 북쪽으로 유인함으로써 A 집단군을 위해 결전의 기회를 마련하라!
dialogue_3624=A 집단군은 아르덴 숲을 주 공격 방향으로 삼아 플랑드르 포위망을 형성하여 연합군의 주력 부대를 섬멸하라!
dialogue_3625=기갑 부대는 전속력으로 돌격하라! 3일 안에 마스 강에 도착하고, 다음 날 마스 강을 강행 도하하라!
dialogue_3626=북쪽 전선 부대는 즉시 벨기에로 진군하여 방어선을 구축하고, 독일군을 막아라!
dialogue_3627=페탱 원수의 명령에 따라 프랑스는 독일과 휴전 협정을 체결했다. 각 부대는 기존 편제를 유지하며, 지정된 지역으로 질서 있게 이동하라.
dialogue_3628=전쟁은 아직 끝나지 않았고, 프랑스의 저항도 끝나지 않았다. 나는 런던으로 가서 프랑스 국민을 이끌고 계속 저항할 것이다!
dialogue_3629=동지들이여! 이지움 돌출부와 보우찬스크를 공격 축으로 삼아 하르키우를 점령하라!
dialogue_3630=남부 집단군 주의하라. 소련군이 하르키우 전선에 대규모로 집결하고 있다. 이는 소련군의 공격 징후이니 방어 준비를 갖춰라.
dialogue_3631=이지움으로 돌격하라. 제1기갑집단군과 협력하여 이지움 포위망을 완성하라.
dialogue_3632=
dialogue_3633=제7기갑여단은 사막의 측면을 따라 진격하고, 제22근위여단은 하르파야 고개와 카푸초를 주공하라. 그리고 해안 종대는 살룸을 점령하라.
dialogue_3634=전선을 유지하고, 카푸초 요새를 사수하라! 즉시 투브루크에서 지원군을 파견하겠다!
dialogue_3635=카푸초 요새와 하르파야 고개를 탈환하라. 포위된 부대가 후방의 위협을 받도록 둘 수는 없다!
dialogue_3636=카푸초 근처 부대는 독일군과 교전하지 말고, 하르파야 고개로 후퇴하라.
dialogue_3637=공수 부대는 목표 공항을 우선적으로 점령하고, 성공 후 즉시 보급과 증원 병력을 투입하라.
dialogue_3638=왕립 해군은 주변 해역을 봉쇄하고, 적군의 수송선이 상륙하는 것을 철저히 막아라!
dialogue_3639=제2기갑사단은 불로뉴를 주공하고, 제1 및 제10 기갑사단은 칼레를 협공하라! 해협 항구를 신속하게 점령해야 한다!
dialogue_3640=모든 칼레 수비군은 도시를 48시간 사수하라! 독일군을 한 시간 견제할 때마다 만 명의 아군이 철수할 수 있다!
dialogue_3641=왕립 공군 출격! 스투카 폭격기 편대를 집중적으로 요격하여 육군 철수를 엄호하라!
dialogue_3642=A, B 집단군은 공격을 재개하여 신속히 해안 포위망을 형성하라. 절대 적을 놓쳐서는 안 된다!
dialogue_3643=벨기에가 항복했다니? 젠장, 즉시 리스 강 방어선을 축소하고, 벨기에의 공백을 메워라!
dialogue_3644=즉시 됭케르크로 진격하라. 적군을 놓치지 마라!
dialogue_3645=프랑스 제1군단에 명령한다: 퇴로를 끊고 결코 후퇴하지 않겠다! 우리는 조국을 반드시 수호할 것이다!
dialogue_3646=릴을 신속히 점령하라! 이곳에서 발이 묶이게 해서는 안 된다!
dialogue_3647=나는 포위망을 돌파해 다른 전장에서 조국 수호를 계속할 것이다!
dialogue_3648=적의 항구를 기습 공격하여 해상 보급로를 차단하고 전략 물자 수송 능력을 무력화하라!

