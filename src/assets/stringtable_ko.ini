legend_intro_50101=르클레르 사단은 한 남자의 끈질긴 애국심에서 비롯되었다. 1940년, 필리프 르클레르는 북아프리카에 도착하여 차드 총독을 성공적으로 설득해 '르클레르 종대'를 창설했다. 자유 프랑스의 기세를 떨치기 위해, 1941년 르클레르는 부대를 이끌고 사막을 횡단하여 이탈리아가 통제하던 리비아의 쿠프라 비행장을 기습 공격했다. 쿠프라 비행장을 점령한 후, 르클레르는 병사들과 함께 스트라스부르에 반드시 프랑스 국기를 게양하겠다고 맹세했다. 이것이 바로 이 전설적인 이야기의 시작이다.
legend_intro_50102=자유 프랑스가 북아프리카에서 여러 차례 군사적 승리를 거두면서, '르클레르 종대'의 명성은 더욱 널리 알려졌다. 따라서 1943년, 종대는 증원되었고, 영국 제8군에 합류하여 튀니지 전투에 참전했다. 메드닌 전투와 마레트 방어선 전투에서, 독일군 기갑 부대의 파상 공세에 맞서 르클레르 종대는 이를 성공적으로 막아냈다. 이후 '르클레르 종대'는 연합군과 함께 튀니지로 진격하며 북아프리카 전투를 종결시켰습니다.
legend_intro_50103=북아프리카 전투 후, '르클레르 종대'는 프랑스 제2기갑사단으로 개편되었으며, 여전히 르클레르가 지휘하여 '르클레르 사단'으로 불리게 되었다. 이 부대는 1944년에 프랑스로 진군했고, 맹세를 이행하기 위한 여정을 시작하게 되었다. 팔레즈 포위전에서, 제2기갑사단은 패튼의 제3군과 함께 남쪽에서 독일군을 포위하여, 독일군 제9기갑사단과 다른 부대들을 거의 괴멸시켰고, 프랑스 해방의 확고한 초석을 다졌다.
legend_intro_50104=팔레즈 포위전이 끝난 후, '르클레르 사단'은 이미 파리와 상당히 가까운 위치에 이르렀다. 파리를 조속히 해방시키기 위해, 르클레르는 연합군 고위층에 파리 진군 허가를 강력히 요청했고, 정치적 중재 끝에 승인을 받았다. 르클레르는 즉시 이미 봉기가 시작된 파리로 향했다. 8월 24일, '르클레르 사단'은 성내 봉기군의 협력 하에 파리로 진격했다. 도시 내 독일 수비대는 연합군의 압박 속에 25일에 항복했다. 이로써 자유의 깃발이 다시 파리 상공에 휘날리게 되었다.
legend_intro_50105=파리를 수복한 후, 르클레르 사단은 알자스-로렌 지역 수복 작전에 투입되었다. 9월 초, 경험이 부족한 독일군 제112기갑여단은 미국 공중 지원을 받은 제2기갑사단의 연속적인 매복 공격을 받았다. 프랑스 기갑사단과 미군 폭격기는 연합하여 독일군 여단의 대부분을 괴멸시켰고, 프랑스군은 거의 피해가 없었다. 독일군은 어쩔 수 없이 철수했고, 원래 계획했던 로렌 반격은 지연되었다.
legend_intro_50106=11월 22일, 연합군 사령부의 승인을 받은 프랑스 제2기갑사단은 프랑스 제1군과 함께 스트라스부르로 진격했다. 제2사단은 사베르네 협곡을 강제로 돌파하고 과감하게 진군하여 알자스 북부에 있던 독일군의 방어선을 무너뜨렸고, 1944년 11월 23일 스트라스부르를 해방시켰다. 이로써 마침내 '쿠프라의 맹세'를 실현하게 되었다.

synergy_tactics_5_1=・모든 '르클레르 사단' 유닛이 공격을 개시한 후, 주변 두 칸 내 '르클레르 사단' 유닛에게 '국가 재건 맹세' 효과를 1턴 동안 부여함. 국가 재건 맹세: 혼란 상태에 빠지지 않음.
synergy_tactics_5_2=・전투 고무: '르클레르 사단'의 기갑 유닛이 '국가 재건 맹세' 상태에서 적을 공격하여 격파한 후, 주변 두 칸 내 '르클레르 사단' 유닛의 사기가 1레벨 상승. 유닛당 1턴 1회.
synergy_tactics_5_3=・내외 호응: '르클레르 사단' 포병 유닛이 '국가 재건 맹세' 상태에서 도시 또는 요새를 공격할 때, 공격 대상 주변 한 칸 내에 '르클레르 사단' 보병 또는 기갑 유닛이 존재할 경우 데미지 10% 증가.
synergy_tactics_5_4=・지원 추격: '르클레르 사단' 보병 유닛이 '국가 재건 맹세' 상태에서 공격을 개시한 후, 두 칸 범위 내의 '르클레르 사단' 부대는 이번 턴 이동력 +5.

dialogue_4204=프랑스 본토는 독일에 함락되었다. 그러나 우리는 언젠가 반드시 조국을 되찾을 것이다.
dialogue_4205=이탈리아는 쿠프라에 군용 비행장을 보유하고 있다. 우리는 그곳을 점령해야 한다. 전 세계에 프랑스의 불굴의 의지를 증명하자.
dialogue_4206=이탈리아군은 요새를 굳건히 지키며 지원군과 연락을 시도하고 있다.
dialogue_4207=적의 병력이 요새 안으로 철수했다. 압박을 유지하고, 그들이 증원군과 연락하지 못하게 해야 한다.
dialogue_4208=이탈리아군은 저항을 포기하고 프랑스군과의 협상을 통해 항복했다. 이후 르클레르는 쿠프라에서 '쿠프라 맹세'를 선포했다.
dialogue_4209=나는 맹세한다. 우리들의 깃발, 우리의 아름다운 깃발이 스트라스부르 대성당 위로 휘날리는 그날까지 무기를 내려놓지 않을 것이다.
dialogue_4210=입수한 정보에 따르면, 독일군 제9 기갑사단이 내일 크사르 기란을 통해 공격을 개시할 것이다. 타격을 피하기 위해 당신의 부대가 80km 후퇴할 것을 제안한다.
dialogue_4211=안 된다. 지금 후퇴하면 후퇴 중에 추격당할 위험이 크다. 우리 부대는 현 진지를 거점으로 방어하겠지만, 공군 지원이 필요하다.
dialogue_4212=추격하라! 그들이 쉽게 도망치도록 내버려 둘 수 없다!
dialogue_4213=온다. 유효 사격 거리에 도달하면 공격을 개시하라.
dialogue_4214=잘했다! 이제 곧 부대가 지나갈 것이다. 그들의 측면을 잘 엄호하고, 그들과 함께 테바가 협곡을 공격하라.
dialogue_4215=테바가 협곡이 함락되었다고? 즉시 철수하라. 적의 포위망에 빠져서는 안 된다!
dialogue_4216=북쪽 아르장탕까지 진격하여 캐나다군과 합류해 독일군을 포위망에 가두어 버려라!
dialogue_4217=전진하라! 우리의 더 많은 영토를 해방하라!
dialogue_4218=제352 보병사단을 알랑송으로 이동시켜 연합군의 지속적인 진격을 저지하라.
dialogue_4219=알랑송을 성공적으로 점령하여 독일군의 중요 보급 기지를 차지했다. 독일군은 반격 계획을 포기하고 방어로 전환했다.
dialogue_4220=제116 기갑사단을 아르장탕으로 이동시켜 우리의 퇴각로를 확보하라.
dialogue_4221=폴란드 제1기갑사단은 올메르 산맥에에 성공적으로 진지를 구축하여 독일군의 마지막 출구를 차단했다.
dialogue_4222=지휘권이 나에게로 이양되었다. B 집단군은 진지를 포기하고 동쪽으로 철수하라. 지원군이 전력을 다해 지원할 것이다.
dialogue_4223=프랑스군의 적극적인 요청 끝에, 연합군은 바르샤바 봉기와 같은 비극이 재발하는 것을 막기 위해 프랑스 제2기갑사단과 미국 제4보병사단이 함께 파리 봉기군을 지원하는 것을 허락했다.
dialogue_4224=미군을 기다릴 필요 없다! 즉시 돌진하라! 파리의 봉기군은 이미 행동을 시작했다. 우리는 그들을 고립된 채 내버려 둘 수 없다!
dialogue_4225=르클레르 사단은 파리 외곽에 도착하여 파리 봉기군과 연락을 취했다.
dialogue_4226=교외 방어선을 격파하고, 독일군에 대한 시위를 시작하라! 그리고 파리 시민들에게 우리가 왔음을 알려라! 파리는 자유를 되찾을 것이다!
dialogue_4227=제4보병사단은 신속히 파리로 진격하라. 프랑스인들이 이 공로를 독차지하게 놔둘 수 없다.
dialogue_4228=독일 수비군은 본부로부터 파리를 사수하라는 명령을 받았다. 파리가 폐허가 되지 않는 한, 절대로 적의 손에 넘어가서는 안 된다.
dialogue_4229=이건 우리보고 함께 죽으라는 소리다! 먼저 그 미친 놈을 막아라. 그리고 본부에 "명령을 따를 것입니다."라고 답전하라.
dialogue_4230=우리는 연합군과 항복 조건을 협상해야 한다. 우리는 다른 사람들을 위해 죽을 수 없다!
dialogue_4231=독일 파리 수비군은 결국 연합군과 항복 협상을 벌였고, 파리 시내 전투는 끝났다. 하지만 교외 수비군은 이 소식을 알지 못한 채 여전히 연합군과 교전 중이다.
dialogue_4232=파리는 한때 수모를 당했었다! 파리는 심하게 파괴되었다! 파리는 고통을 겪었다! 하지만 파리는 마침내 자유를 되찾았다!
dialogue_4233=적군이 미르쿠를 지원하기 위해 정예 기갑 여단을 파견했다는 소식을 들었다. 우리는 즉시 돔페어로 가서 지원군을 막아야 한다.
dialogue_4234=미르쿠의 상황이 매우 위급하다. 우리는 신속히 전선을 지원해야 한다.
dialogue_4235=비텔의 독일군이 우리를 저지하러 왔다. 최대한 빨리 해결해야 한다. 그렇지 않으면 지원군이 도착하여 우리가 불리한 상황에 처하게 될 것이다.
dialogue_4236=우리는 지원군이 도착하기 전에 돔페어를 점령했다. 공군에 공습 지원을 요청하라. 우리는 이곳에서 적을 섬멸할 것이다.
dialogue_4237=우리가 늦었다. 미르쿠를 신속히 지원하라. 미군이 내외 협공을 당하도록 내버려 둘 수 없다.
dialogue_4238=지금이다, 사격하라!
dialogue_4239=엄폐물을 찾아 자유롭게 반격하라!
dialogue_4240=우리는 포위되었다. 전차를 버리고 전력으로 철수하라!
dialogue_4241=계속 공격하여 모젤 강 서안의 독일군을 섬멸하라.
dialogue_4242=스트라스부르가 눈앞에 있다. 우리의 맹세가 곧 실현될 것이다. 전사들이여, 싸워라! 프랑스 만세!
dialogue_4243=보주 산맥의 방어가 철통 같다. 우리는 방어가 없는 적의 후방으로 돌파할 수 있는 길을 찾아야 한다.
dialogue_4244=보주 산맥으로 후퇴하라. 그들은 통과할 수 없다!
dialogue_4245=그들은 어떻게 보주 산맥을 뚫고 들어왔단 말인가!
dialogue_4246=힘든 전투는 미군에게 맡기고, 전력으로 스트라스부르를 향해 돌진하라!
dialogue_4247=스트라스부르에 보주산맥이 돌파되었으니, 방어 준비를 철저히 하라고 전보를 보내라.
dialogue_4248=스트라스부르가 해방되었다! 우리는 우리의 맹세를 이뤘다!
dialogue_4249=주변 거점을 점령하라. 스트라스부르를 잃어서는 안 된다!
dialogue_4250=보주 산맥에 대한 압박을 유지하라. 독일군이 후방을 지원하지 못하게 해야 한다!
dialogue_4251=이탈리아 지원군이 움직이기 시작했다.
dialogue_4252=크사르 기란 쪽은 분명 분위기가 긴장할 것이다. 르클레르, 그는 정말 좋은 사람이었다. 하지만 이제 모든 것이 끝났다. 우리는 다시 그를 볼 수 없을 것이다.
dialogue_4296=적이 완전한 제공권을 장악했다. 여기는 사수할 수 없다. 신속히 철수하라.
dialogue_4297=이탈리아 수비군은 지원 요청을 포기하고 요새를 사수하고 있다.
dialogue_4298=화력을 강화하여 그들의 저항 의지를 박살 내라!
dialogue_4299=파리에 주둔한 독일 수비군이 연합군에 항복하여 도시가 해방되었지만, 교외의 독일군은 소식을 접하지 못해 여전히 연합군과 교전 중이었다.



