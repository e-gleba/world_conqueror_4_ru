;战区规则
warzone_rule=전역 규칙
warzone_rule_1=1. 각 전역은 일반 스테이지와 보스 스테이지로 나뉘며, 일반 스테이지를 모두 클리어해야 보스 스테이지가 해금됩니다. 일반 스테이지에서는 해당 스테이지의 주요 작전 병종이 표시됩니다.
warzone_rule_2=2. 전역 전환 또는 초기화에는 지령 포인트가 소모되며, 지령 포인트는 매일 정해진 시간(UTC 기준 8:00 및 20:00)에 회복됩니다.
warzone_rule_3=3. 전역 스테이지는 점수제로 운영됩니다. 적군에게 피해를 입히면(요새 및 요새에서 소환된 지원군 포함) 점수를 획득할 수 있으며, 스테이지 완료 후에는 재입장이 불가합니다. 각 전역 내 임의 스테이지에 출전한 장군은 해당 전역의 다른 스테이지에 재출전할 수 없으므로, 사전에 장군 배치를 신중히 계획하는 것이 좋습니다.
warzone_rule_4=4. 각 전역의 역대 최고 점수가 일정량에 도달하면 일회성 업적 보상을 받을 수 있으며, 보스 스테이지를 클리어할 때마다 현재 총 점수에 따라 리본 보상을 획득할 수 있습니다. (자세한 내용은 보물상자 아이콘을 클릭하여 확인할 수 있습니다.)
warzone_rule_5=5. 각 전역의 역대 최고 점수가 일정량에 도달하면 소탕 기능이 해금되며, 일정량의 소탕권을 소모하여 즉시 스테이지를 클리어하고 리본을 획득할 수 있습니다.

mission_to_tutorial=장군이 없으면 임무 진행이 불가하므로, 우선 튜토리얼 3스테이지를 클리어하여 장군을 획득한 후, 임무를 진행하는 것을 권장합니다.

