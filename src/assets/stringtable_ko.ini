elite_intro_97=해리어 전투기는 서방 진영의 가장 대표적인 다목적 수직/단거리 이착륙 전투기이며, 세계 최초로 실전 운용 및 체계적 배치가 이루어진 V/STOL 제트기이다. 특유의 회전식 노즐 덕분에 전통적인 활주로에 의존하지 않고도 전방 간이 비행장이나 임시 이착륙 지점에서 유연하게 운용할 수 있어, 생존성과 기동 능력이 크게 향상되었다. 또한 안정적인 호버링 성능과 저공 기동성을 바탕으로, 해리어는 근접 항공 지원 및 대지 타격 임무에서 고가치 목표를 지속적으로 제압할 수 있는 우위를 지닌다.

elite_intro_98=Su-30V 전투기는 냉전 시기 수호이 설계국이 바르샤바 조약 기구 진영을 위해 비밀리에 개발한 수직 이착륙 전투기 프로젝트이다. 기체의 외형과 구조는 Su-27 및 Su-30 시리즈의 검증된 플랫폼을 계승했으나, 동력 시스템과 비행 제어 아키텍처는 완전히 재설계되었다. 이 전투기는 쌍발 추력 편향 노즐과 분류식 양력 시스템을 채택하여, 활주로가 없는 전방 지역에서도 단거리 이착륙이 가능하다. 또한 저공 상태에서 호버링을 할 수 있어, 지상 부대에 지속적인 공중 화력 지원을 제공할 수 있다.


