event_intro_455=이 전투는 일본군의 괌 점령 전투라고도 불린다. 진주만 공습 다음 날인 1941년 12월 8일, 일본군은 괌을 기습적으로 공격했다. 괌의 수비군은 무방비 상태였고, 일본군에게 빠르게 패배했다. 12월 10일, 괌의 수비군은 저항을 포기했고 일본군은 괌의 통제권을 획득했다.
event_intro_456=1942년 12월 12일, 스탈린그라드에 포위된 제6집단군을 구출하기 위해 독일 제4기갑집단군이 스탈린그라드로 기습 공격을 감행했다. 독일군의 공격은 소련군의 방심을 틈타 첫날 상당한 진전을 이루었다. 그러나 소련의 리틀 새턴 작전과 스탈린그라드 주변의 강력한 방어로 인해 독일군은 공격을 계속할 수 없었고, 제6집단군 구호를 포기할 수밖에 없었다.
event_intro_457=1944년 12월 16일부터 1945년 1월 25일까지 벌어진 아르덴 전투라고도 불리는 벌지 전투는 제2차 세계 대전 말기 벨기에 아르덴 지역에서 영미 연합군의 전선을 돌파하고 앤트워프를 재점령하기 위한 독일군의 공세이다. 독일군은 작전 초반 미군 주둔지에 큰 피해를 입히며 어느 정도 성공을 거두었으나, 보급품 부족으로 인해 더 이상 진격하기 어려워졌고, 연합군은 안정된 상태에서 반격을 시작할 수 있게 되었다. 결국 전투에 참여한 독일군은 크게 패배했으며, 남은 병력은 지크프리트선과 라인강으로 후퇴했다.
event_intro_458=1944년 12월 20일부터 27일까지 벌어진 바스토뉴 전투는 벨기에의 작은 마을 바스토뉴에서 미군과 독일군이 벌인 전투로, 벌지 전투의 일부였다. 아르덴 산맥 지역의 7개의 주요 도로가 모두 바스토뉴를 통과하기 때문에, 독일군은 아르덴 산맥을 안전하게 통과하기 위해 현지에 주둔 중이던 미군을 포위하고 바스토뉴를 점령하려 했다. 미군은 필사적으로 저항하며 바스토뉴에 대한 통제권을 끝까지 유지했고, 결국 조지 패튼의 제3집단군 소속 부대에 의해 포위에서 벗어나 전투에서 승리했다.
event_intro_459=1943년 12월 24일, 우크라이나와 몰도바를 해방하기 위해 소련군은 드네프르-카르파티아 공세를 개시했다. 이 전투에서 소련군은 우크라이나의 대부분 영토와 몰도바 전역을 성공적으로 수복하고 독일군 남부 집단군을 격파했으며, 전선을 폴란드에서 루마니아까지 밀어붙였다.
event_intro_460=노스케이프 해전은 1943년 12월 26일 노르웨이 노스케이프 해안 인근에서 벌어진 전투이다. 이 전투에서 독일 해군 함대는 소련에 전쟁 물자를 수송하는 서방 연합군 호송대를 수색하고 공격하려 했으나, 정보 유출로 오랫동안 준비 중이던 영국 왕립 해군과 충돌하여 전열 순양함 샤른호르스트호가 격침되었다. 이 전투 이후 독일은 더 이상 대형 전함을 파견하여 연합군의 북방 항로를 습격할 능력을 잃게 되었고, 따라서 북방 항로는 전쟁이 끝날 때까지 상대적으로 안전해졌다.
event_intro_461=1944년 12월 26일, 소련군은 부다페스트 포위를 완료하고, 즉시 부다페스트 수비군에게 항복을 권유하기 시작했다. 12월 29일, 항복 협상이 결렬되었고, 협상을 담당하던 소련군 특사가 독일군에 의해 사살되었다. 소련군은 그의 시신을 안장한 후 공격을 개시했으며, 이로써 부다페스트 포위전이 시작되었다. 소련군은 50일 동안 부다페스트를 포위 공격하면서 독일 국방군, 특히 무장친위대의 자원을 소진시켰고, 결국 부다페스트를 점령하여 동부 전선을 베를린으로 추진했다.
event_intro_462=벌지 전투로 인해 연합군의 대부대가 북쪽으로 이동하자, 독일군은 연합군의 전력을 약화시키기 위해 방어가 약한 알자스 지역에 대한 공격을 계획했다. 1945년 1월 1일, 독일군은 스트라스부르를 목표로 공세를 개시했다. 연합군은 병력의 열세로 패퇴했지만, 결국 스트라스부르를 지켜냈다. 공세가 끝날 무렵 독일군은 알자스의 약 40%를 점령하며 서부 전선을 단축하는 데 성공했지만, 연합군을 약화시키려는 목표는 달성하지는 못했다.
event_intro_463=1941년 12월, 일본군은 루손섬을 공격했다. 초기 방어 배치가 불리했기 때문에 일본군은 해안 방어선을 돌파하는 데 성공하여, 미군과 필리핀 수비군은 최후의 항전을 위해 어쩔 수 없이 바탄 반도로 후퇴할 수밖에 없었다. 1942년 1월 7일, 일본군은 바탄 반도에서 토벌 작전을 개시했다. 보급 부족으로 수비군은 계속 패퇴했고, 최고 지휘관인 맥아더는 필리핀에서 철수했다. 결국, 3개월의 저항 끝에 나머지 수비군은 1942년 4월 9일에 일본군에게 항복하면서 바탄 반도 전투가 종료되었다.
event_intro_464=레이테만 전투 이후 필리핀의 일본군은 심각한 타격을 입었다. 연합군은 공군과 해군의 우세를 바탕으로 루손 탈환을 계획하기 시작했고, 1945년 1월 9일 연합군 상륙 부대는 함대의 호위를 받으며 링가옌 만에 상륙해 해안을 확보한 후 마닐라를 향해 진격했다. 3월 3일 마닐라가 해방되고, 일본군의 잔여 부대는 산악 지대로 철수하여 계속 저항했다. 8월 15일 일본이 무조건 항복을 선언하면서 루손 섬의 잔여 일본군은 차례로 휴전령을 받아들였고, 이로써 루손 전투는 종료되었다.
event_intro_465=1944년 1월 14일, 소련군은 레닌그라드 방면군, 발트해 연안 제2방면군, 볼호프 방면군을 집결시켜 레닌그라드-노브고로드 공세를 개시했다. 약 2주 후, 적군은 모스크바-레닌그라드 철도를 다시 장악했다. 1944년 1월 26일, 독일군은 레닌그라드 주에서 축출되고, 레닌그라드 포위는 해제되었다. 소련군은 3월 1일까지 추격을 계속하여 전선을 루가 강까지 밀어붙였다.
event_intro_466=1943년 9월, 연합군이 이탈리아에 상륙한 후, 독일군은 연합군의 진격을 저지하기 위해 '겨울 방어선'을 구축했다. 계속 진격하고 로마로를 해방시키기 위해 1944년 1월 17일, 연합군은 가장 핵심적인 '구스타프 방어선'을 공격했다. 카시노 산의 수도원은 전투의 핵심 지점이었으며, 그 전략적 위치 덕분에 독일군은 주변 지역을 장악할 수 있었다. 연합군은 수도원을 점령하기 위해 여러 차례 시도했지만, 모두 독일군의 완강한 저항에 부딪혔다. 결국 연합군은 막대한 사상자를 내면서 그 지역을 장악해 전투에서 승리했다.
event_intro_467=콜마르 돌출부를 제거하기 위해 연합군은 1945년 1월 20일 돌출부의 남쪽과 북쪽에서 동시에 공격을 개시하여 독일 제19집단군을 포위하고 큰 타격을 입히고 콜마르를 해방시켰다.
event_intro_468=코르순-체르카시 전투는 드네프르-카르파티아 공세의 일부이다. 1944년 1월 초, 우크라이나 제1방면군과 제2방면군은 체르카세 북동쪽의 독일군 돌출부를 남북 양쪽에서 포위했다. 돌출부 중 독일군 사단 6개를 섬멸하기 위해 1월 24일 소련군은 남북 양쪽에서 공격을 개시했고, 1월 28일에 남쪽과 북쪽에서 진격한 두 부대가 합류해 포위망을 형성했다. 독일군은 곧 포위망을 돌파했지만, 많은 장교와 중화기를 잃었다.
event_intro_469=제1차 세계 대전 말기에 핀란드는 독립을 추구하면서 ‘백핀란드’와 ‘적핀란드’라는 두 정치 세력으로 나뉘었다. 양측 모두 핀란드의 독립을 추구했지만, 이념적 차이로 갈등이 고조되었다. 1918년 1월 27일, 전쟁이 시작되면서 적핀란드는 노동자 세력을 결집해 핀란드 남부의 대부분 도시와 산업 중심지를 점령했고, 백핀란드는 북부의 시골 지역으로 물러났다. 그러나 적핀란드가 군사 훈련이 부족했던 반면, 백핀란드는 독일의 군사 지원을 받아 결국 전쟁에서 승리했다.
event_intro_470=1942년 2월 1일, 미국 해군은 마셜 제도와 길버트 제도에 주둔 중인 일본 제국 해군 수비대를 상대로 공습과 포격을 가해 일본군에 일정한 피해를 입혔다. 이 전투는 태평양 전세에 큰 영향을 미치지는 않았지만, '진주만 사건'과 '웨이크 섬 패배'를 겪은 이후 이번 작전은 미 해군과 대중의 자신감을 효과적으로 높였다.
event_intro_471=1944년 1월, 소련군은 나르바 강 전선으로 진격했다. 소련군은 에스토니아로 더 깊숙이 침투하고, 핀란드와 동프로이센을 공격할 거점을 확보하기 위해 나르바 지협에 대한 일련의 공격을 개시했다. 이 전투는 1944년 2월 2일부터 8월 10일까지 지속되었다. 초기에 독일군은 맹렬하게 반격했고, 소련군의 진격은 느리게 진행되었다. 소련군은 7월이 되어서야 리비우-산도미에시 공세와 합류하여 나르바를 점령했다. 독일군은 탄넨베르크 선으로 후퇴해 소련군과 다시 교착 상태에 빠졌다.


dialogue_3201=독일군은 곧 연안으로 통하는 통로를 뚫을 것이다. 이제 철수를 준비해야 한다.
dialogue_3202=우군이 먼저 해협 방향으로 후퇴하도록 하라. 나의 기갑 부대는 독일군의 공격을 막기 위해 최선을 다할 것이다.
dialogue_3203=진지를 지켜라! 왕립 공군은 철수 작전을 위해 지속적으로 공중 엄호를 제공할 것이다.
dialogue_3204=진지전은 더 이상 이 시대에 적합하지 않다! 전속력으로 전진하고, 포로들은 뒤에 있는 우군에게 맡겨라.
dialogue_3205=이... 이 공습의 규모로는 독일군의 지상 공격을 막을 수 없다. 이렇게 패배한 이유는 도대체 무엇인가?
dialogue_3206=우리 군단은 더 이상 싸울 수 없게 되었다. 모든 것을 버리고 전속력으로 철수하라.
dialogue_3207=우리 군대는 패배했지만, 연구 성과가 독일군의 손에 넘어가서는 안 된다.
dialogue_3208=해협으로 통하는 통로가 열렸다. 전선을 유지하고, 영국과 프랑스의 주력 부대를 포위권 안에서 섬멸하라.
dialogue_3209=당신이 오스본인가? 나는 벤테크이다. 당신을 보호하고 함께 철수하라는 명령을 받았다.
dialogue_3210=하지만 내가 받은 명령은 주력 부대가 순조롭게 철수할 때까지 여기서 지키라는 것이다! 아무리 위급한 상황이라도 제멋대로 진지를 떠날 수 없다.
dialogue_3211=당신의 운명은 그뿐이 아니다. 당신의 인생은 이제 막 시작되었고 앞으로 수많은 가능성이 있을 것이다. 그러나 당신이 원한다면 나도 당신의 결정을 존중하겠다. 선택권은 당신에게 있다.
dialogue_3212=릴도 함락되자 독일군은 포위망 수축을 가속화하기 시작했다. 알프레드, 우리는 후퇴해야 한다.
dialogue_3213=우리가 용병이라는 것을 잊지 말아라. 임무를 완수하고 살아 돌아오는 것이 우리의 유일한 목표이다.
dialogue_3214=그가 내린 결정을 믿는다.
dialogue_3215=독일군은 포로로 잡은 사람들을 몇 개의 임시 교도소에 수감했는데, 오스본도 거기에 있을 것이다.
dialogue_3216=당신들 왜 아제 왔는가? 며칠만 더 있으면 독일군에 가입할 생각이었다.
dialogue_3217=당신은 도대체 누구인가? 그리고 왜 여기에 왔는가? 하지만 지금은 걱정할 때가 아니다! 적의 주력부대가 남쪽으로 공격하고 있으니, 지금이 구원의 유일한 기회이다!
dialogue_3218=도망치려고 하다니? 어떤 죄수도 제3제국의 감옥에서 탈출할 수 없다! 문제가 생기지 전에 여기서 너희들을 처리할 것이다. 어쩌면 전선으로 돌아가 싸울 수 있을지도 모른다!
dialogue_3219=구조 작전은 순조롭게 진행되었으나, 그 이후가 문제다. 남쪽으로 전선을 통과해 스페인에 도착한 뒤, 거기서 배를 타고 영국으로 갈 수 있다.
dialogue_3220=보아하니 여기서 우리는 갈라져야 할 것 같다. 원정군의 일부가 르아브르에 갇혀 위협을 받고 있어, 나는 최대한 빨리 그들과 합류해야 한다.
dialogue_3221=어쩌면 너에게 또 다른 선택이 있을 수 있다. 남쪽에서 철수하여 메스 방향에 열릴 빈틈을 통해, 그곳에서 방어하고 있는 드골 장군과 합류할 수 있다.
dialogue_3222=우리는 현재 독일군과 휴전 협정에 관한 사항을 협의 중이며, 각 부대는 현재 위치에서 대기하며 새로운 지시를 기다리고 있다.
dialogue_3223=프랑스는 패배했다. 그들은 독일군의 기갑 부대에 패배했고, 뛰어난 지휘관에게 패배했고, 번개 같은 공격 속도에 패배했다. 전면 전장의 향방을 결정할 수 있는 기갑 부대야말로 전쟁의 미래 발전 방향이다!
dialogue_3224=첨단 군수 기술과 안정적이며 충분한 생산 능력의 결합이야말로 군사력의 발전 방향이다. 우리는 아직 희망이 있다!
dialogue_3225=페탱 정부는 프랑스 국민을 배신했다. 나는 프랑스를 위해 마지막 순간까지 싸울 것이다!
dialogue_3226=프랑스군 부대는 다시 한번 우리에게 의해 분산되었다. 이제 파리는 문이 열렸고, 승리가 눈앞에 다가왔다!
dialogue_3227=그를 믿지만 신속하게 행동해야 한다. 독일군 때문에 남은 시간이 많지 않으며, 프랑스군은 안전하게 철수할 것이다.
dialogue_3228=전선 부대의 미국제 장비가 무사히 도착했다. 고마워할 필요는 없다. 나는 후방에서 너희의 최신 전황을 기다릴 것이다.
dialogue_3229=우리의 지원군이 도착했다! 그러나 독일군은 엘 알라메인의 방어선을 돌파하여 그곳의 기갑 부대는 언제든 포위될 위험에 처해 있다!
dialogue_3230=알프레드, 프랑스에서 보여준 너의 용감한 모습이 인상적이었다! 하지만 지상의 전투는 하늘과 완전히 다르다. 이곳의 모래바람이 네 모서리를 닳게 하고 네 기세를 소모시킬 것이다. 네가 이곳의 혹독함을 잘 견뎌낼지 지켜보자!
dialogue_3231=적군의 공격 규모가 확실히 예상을 뛰어넘었다. 수비 전략을 재조정하여 적의 공격을 우선적으로 차단하라. 더 많은 지원군이 곧 전장에 도착할 것이다.
dialogue_3232=엘 알라메인은 이미 함락되었다. 적은 어떻게 그렇게 많은 기갑과 해군 부대를 보유할 수 있을까? 우리는 곧 포위될 위험에 처했다.
dialogue_3233=네가 해군을 지휘할 줄은 몰랐다. 먼저 함대를 알렉산드리아 항으로 철수시켜라. 지원군이 곧 도착할 것이다.
dialogue_3234=공격 속도가 여전히 느리다. 우리에게 기회는 단 한 번뿐이라는 것을 잊지 말라. 이탈리아군의 공격에 맞춰 카이로를 점령하고 연합군의 사기를 무너뜨려라.
dialogue_3235=카이로를 목표로 하여 연합군의 병력 보급을 차단하라.
dialogue_3236=이 병력이 우리가 가진 전부다. 공세가 실패했으니 이제 남은 선택은 후퇴뿐이다!
dialogue_3237=날카로운 칼날은 이미 칼집에서 벗어났다. 적군이 행동을 취하기 전에 우리 부대가 선제 공격을 감행할 것이다.
dialogue_3238=나는 롬멜을 아프리카에서 몰아내기 위해 최선을 다할 것이다.
dialogue_3239=새로 설계된 두 대의 전차 본체는 프로토타입의 결함을 성공적으로 개선하여 북아프리카 전장의 가혹한 환경에서도 포의 위력을 충분히 발휘할 수 있게 되었다.
dialogue_3240=공수부대는 이미 예정된 위치에 도착했다. 즉시 공격을 개시하여 해상 방어선 후방에서 적의 방어 배치를 교란시켜라.
dialogue_3241=신속히 상륙하라! 공수부대와 협동하여 진지의 적군을 협공해 와해시켜라.
dialogue_3242=골든 비치는 방어가 취약하고, 내 위치는 상대적으로 유리하다. 나와 협력해 신속히 해변 진지를 확보할 수 있다.
dialogue_3243=상륙 부대가 발판을 마련했다. 이제 카온에 대한 공격을 개시하라.
dialogue_3244=또 로멜과 그의 기갑 부대라니! 나는 단지 전차 군비 전문가일 뿐인데, 어떻게 이런 어려운 싸움에 내가 항상 출전해야 하는 건가?
dialogue_3245=전쟁터에서는 아무도 상대의 정체성을 신경 쓰지 않는다. 우리가 돌격하는 길만 막지 않으면 여기 머물러도 괜찮다.
dialogue_3246=우리는 방어선의 든든한 장벽이니, 연합군이 이곳을 통과하게 해서는 안 된다. 나는 끝까지 싸울 것이다.
dialogue_3247=대량의 연합군이 노르망디에 상륙했다. 적의 진격을 지연시키기 위해 반격을 조직해야 한다.
dialogue_3248=내 포병대가 연합군의 공격을 견제할 것이다!
dialogue_3249=가끔은 내가 이 전투의 주인공이고. 포스터나 홍보 책자의 표지에 내 얼굴이 실려야 할 것 같은 기분이 들 때가 있다.
dialogue_3250=연합군은 우리의 공격에 대해 아무런 방비도 하지 않았다. 이 기회를 이용하여 영국과 미국 주력 부대 사이의 연결을 차단하라.
dialogue_3251=우리가 가진 무기와 장비로는 할 수 있는 게 아무것도 없다. 포위된 우군은 아마도 사면초가에 빠졌을 것이다.
dialogue_3252=지원 속도를 높여라! 바스토네가 함락되는 걸 그냥 지켜볼 수 없다.
dialogue_3253=지금 선택할 수 있는 방안은 두 가지이다. 독일군 후방으로 직진하여 적의 병력 보급을 차단하거나, 아니면 독일군 주력의 공격을 정면에서 막으면서 미군 지원군이 도착하기를 기다리는 것이다.
dialogue_3254=내가 지원할 것이다! 지원군은 비록 늦을지라도 반드시 도착할 것이다.
dialogue_3255=패튼 장군은 미리 병력을 동원했다. 지원군 주력이 도착하면 바로 반격을 개시하라!
dialogue_3256=전우를 믿어라. 더 중요한 것은 자신을 믿어라. 움직여라!
dialogue_3257=나는 내 판단을 결코 의심하지 않는다. 전세가 곧 반전될 것이며, 우리에게 유리한 상황이 올 것이다.
dialogue_3258=영국군이 우리의 후방을 기습 공격했다. 일단 퇴로가 차단되면, 그 결과는 상상조차 할 수 없을 것이다.
dialogue_3259=지크프리트선으로 철수하고, 연합군이 다음 공격을 시작하기 전에 방어를 재조직하라.
dialogue_3260=우리는 한때 승리와 한 걸음 거리였지만, 결국 모든 것이 수포로 돌아갔다. 후퇴하라.
dialogue_3261=바스토네 점령은 연합군의 사기에 큰 타격을 입혔다. 그러나 우리는 더 이상 공세를 지속할 병력이 없다.
dialogue_3262=바스토네는 이미 함락되었다. 지원하러 간 오스본은 독일군의 기갑부대에 포위되었다.
dialogue_3263=지금은 전세를 분석할 때가 아니다. 기회는 순식간에 사라질 수 있다.
dialogue_3264=소련군이 다시 세력을 키워 멕시코만의 절반을 점령했다! 육군도 미국-멕시코 국경을 넘었다. 상황이 매우 위급하다.
dialogue_3265=우리는 그동안 미군과 긴밀히 협력해 왔으며, 이번 작전 계획은 완벽하게 준비되었다. 여러분을 선택한 이유는 서부 전선에서 함께 싸웠던 적이 있기 때문이다.
dialogue_3266=이번에는 신식 장비와 특수 작전요원이 많이 제공되었다고 들었다.
dialogue_3267=그들의 말은 절반만 믿으면 된다. 이번는 비밀 작전이 아니다. 교활한 미국놈은 신뢰할 수 없지만, 자네 루카스는 전적으로 믿는다.
dialogue_3268=우리는 이미 목적지에 도착했다. 목표는 소련군의 미사일 기지와 원자력 공장을 파괴하는 것이다. 이제 너희들의 실력을 보여줄 시간이다!
dialogue_3269=하늘에서 감히 나에게 도전하는 자는 없다.
dialogue_3270=물론, 당신을 위해 한 대 준비했다.
dialogue_3271=잠깐. 산속에 어떤 시설이 보이는데, 외형은 소련군의 기지 같지 않다.
dialogue_3272=그곳에 인기척이 들린다. 조심하라! 남겨진 흔적을 보면, 이들의 기술 수준은 우리보다 훨씬 뛰어나다.
dialogue_3273=무슨 일인가? 왜 전선의 군대가 우군을 공격하는 건가!
dialogue_3274=소련군이 누군가에게 조종당하고 있는 것 같다. 그중 일부는 심지어 군사 장비의 통제권을 우리에게 넘겨주었다.
dialogue_3275=알프레드, 나는 이곳에 오래 머물 수 없다. 이 전차를 잘 활용하여 남쪽으로 계속 진군하라. 우리는 당신의 도움이 필요하다.
dialogue_3276=젠장, 방금 무슨 일이 있었는가? 갑자기 통신이 끊겼다! 알프레드, 괜찮은가?
dialogue_3277=우리는 남미로 가야 할 것 같다. 그곳의 상황은 매우 복잡해서 언제든 전쟁이 일어날 수 있다고 들었다.
dialogue_3278=지금 더 큰 위기가 닥쳤다. 소련군이 아직 반응하지 못한 틈을 타 작전 계획을 계속 실행하라.
dialogue_3279=영국군 부대에서 특이한 장갑 전차가 발견되었다. 비슷한 무기를 본 적이 있는데, 상황이 더 복잡해졌다.
dialogue_3280=포기하라. 너희들의 계획은 성공할 수 없다. 정면에서 공격하면 다른 세력이 이득을 볼 것이다.
dialogue_3281=나는 기지에서 철수했다. 여기는 당신에게 맡기겠다.
dialogue_3282=소련군은 오래 전부터 남미에 손을 뻗었다. 이제 그들이 전면적인 공격을 개시했으니, 우리는 돌이킬 수 없는 상황이 벌어지기 전에 선제 공격을 해야 한다.
dialogue_3283=미군은 여러 해외 군사 기지에 의존해 짧은 시간 내에 대규모 병력을 이동시켰고, 무력으로 지역의 정권을 위협했다.
dialogue_3284=이 세상을 보라. 전쟁은 결코 변하지 않는다. 오직 강자만이 말할 권리가 있고, 다른 사람들은 어쩔 수 없이 편을 들 수밖에 없다.
dialogue_3285=이미 세 곳의 구체적인 좌표를 파악했다. 우리와 가장 가까운 곳 근처에서 소련군이 발견되었는데, 그들은 무력으로 점령하려는 것 같다.
dialogue_3286=여기까지 왔으니 돌이킬 수 없다. 남미의 기지를 지켜라. 우리는 여기서 다시 시작할 것이다.
dialogue_3287=알프레드, 우리는 당신을 여기에 초대하지 않았다. 이 사람들이 당신에게 어떻게 연락했든, 이제 당신은 그들 중 한 명으로 등록되었다.
dialogue_3288=적은 심지어 사람의 마음을 조종할 수 있는 첨단 무기를 가지고 있다. 우리가 사용할 수 없다면, 즉시 파괴해야 한다.
dialogue_3289=우리는 복수하러 돌아올 것이다. 오스본, 너는 결국 도망갈 곳이 없을 것이다.
dialogue_3290=처음부터 나는 결과를 알았고, 오래 전에 내가 가야 할 길을 선택했다. 문제는 당신들은 어떻게 할 것인가?
dialogue_3291=나는 항상 나와 형제들에게만 충성했다. 그리고 오스본, 당신은 오래 전부터 우리의 형제였다.
dialogue_3292=어쩌면 정신 통제는 애초에 없었을지도 모른다. 우리가 이미 상황을 잘 알고 있어서 변화가 필요하다고 느꼈기 때문일 수도 있다.
dialogue_3293=신호 방해 장치를 아직 가지고 있는가? 나는 당신에 대한 자신의 판단을 믿는다. 적보다 친구가 많은 게 낫다.
dialogue_3294=자, 재미있는 쇼가 시작되었다!
dialogue_3295=너희들은 남미에서 승리할 수도 있지만, 우리가 당신을 지켜보고 있다는 것을 잊지 말아라.
dialogue_3296=루카스, 이게 우리의 모든 정예 부대이다. 당신은 무엇을 해야 할지 잘 알고 있을 것이다.
dialogue_3297=적군은 그들의 요새 주변에 끊임없이 모여들고 있다. 이대로 가다간 상황이 나빠질 수밖에 없다.
dialogue_3298=적의 적은 바로 친구다라는 말이 있다. 이 사람들을 막기 위해서는 소련군과 잠시 휴전할 수밖에 없을 것 같다.
dialogue_3299=아무도 나를 막을 수 없다. 미군도, 소련군도, 그 누구도 나를 막을 수 없다. 나는 결코 제국의 패배를 반복하지 않을 것이다!
dialogue_3300=우리 전사들은 오래 전부터 각지에 잠복해 암암리에 여러 군사 작전을 추진하며 신세계의 구도를 변화시키고 있다.
dialogue_3301=우리는 적군의 기습을 막을 수 없다. 카이로가 함락되면 보급선이 차단될 위험이 있다!
dialogue_3302=방어선이 더 이상 유지될 수 없습니다. 현재 전투기의 연료 보급이 완료되어, 나는 공군으로서 나의 임무를 계속 수행할 것입니다.
dialogue_3303=모든 전투기, 연료 보급을 위해 본토로 철수하라. 이후의 철수 작전에 추가적인 공중 지원이 필요하다.

promotable_generals=다음 장군들은 이 아이템을 소모하여 연수할 수 있습니다

skill_name_145=강철의 돌격
skill_name_146=격전의 순간
skill_name_147=협동 반격
skill_name_148=종심 타격
skill_name_149=지도자
skill_name_150=전장의 직감
skill_name_151=베테랑 장군

skill_info_145=기갑 유닛 지휘 시, 주변 2칸 내 적군이 존재할 경우 적군 1개당 데미지 +[#00FF00#%d%%](최대 50%%), 기갑 부대의 사기가 높을 시 받는 피해 20%% 감소.
skill_info_146=기갑 유닛 지휘 시, 적 엘리트 유닛에 대한 데미지 +[#00FF00#%d%%].
skill_info_147=포병 유닛 지휘 시, 자신은 반격 불가 스킬 효과의 영향을 받지 않으며, 주변 1칸의 아군 부대가 반격 시 자신도 [#00FF00#%d%%]의 확률로 반격에 참여 함.
skill_info_148=포병 유닛을 지휘하여 공격 및 반격 시, 2칸 및 그 이상 떨어진 적 유닛에 대한 데미지 +[#00FF00#%d%%].
skill_info_149=지휘하는 부대 지상 유닛에 대한 데미지 +[#00FF00#%d%%]. 적군 도시를 점령할 경우 자신 및 3칸 범위 내 아군 부대는 '포상'을 받고, 부대의 공격력 15%% 증가, 지속 시간 3턴.
skill_info_150=지휘 부대는 연막탄과 잠행, 회피, 전자파 침묵 효과를 무시하고, HP가 절반 미만인 적군 공격 시 데미지 +[#00FF00#%d%%].
skill_info_151=지휘 부대의 HP 상한 +[#00FF00#%d%%], 부대의 HP가 절반 이상일 경우 사기가 혼란 상태에 빠지지 않음.


dialogue_3138=우리 군대의 병력은 일본군보다 훨씬 많다. 반드시 싱가포르에서 그들을 전멸시켜야 한다. 미국과 소련의 두 나라에게 영국의 위엄과 영광을 보여줘라!
dialogue_3139=동쪽 해안은 지형이 평탄하여 상륙에 유리하다. 일본군이 이곳에 상륙하는 것을 막아야 한다!
dialogue_3140=우리의 병력과 보급은 영국군에 비해 훨씬 열세다. 그들과 소모전을 벌이지 말고, 전술을 이용해 그들을 항복시켜야 한다.
dialogue_3141=적군이 이렇게까지 취약하다니! 총공격을 감행해 적의 저항 의지를 꺾어버려라!
dialogue_3142=부킷 티마가 아군에게 점령당했다. 너희의 식량 창고와 수원은 이제 끝장났다. 이 무의미하고 절망적인 저항을 포기하라!
dialogue_3143=정예 부대를 파견하여 부킷 티마를 탈환하라! 그렇지 않으면 보급품이 떨어지는 순간 우리는 더 이상 전투를 지속할 수 없게 될 것이다!
dialogue_3144=영국군의 반격 정예 부대를 섬멸하라! 영국군의 보급품이 떨어지면 무조건 항복할 것이다!
dialogue_3145=싱가포르의 보급품이 다 떨어져서 우리는 계속 싸울 수 없게 되었다. 일본군에게 항복에 동의한다고 통보하라.
dialogue_3146=이번 작전의 목표는 주력 함대를 독일 항구로 안전하게 호송하는 것이다. 해협을 통과할 수 있는 기회는 제한되어 있으니 신속히 움직여야 한다!
dialogue_3147=철저히 수색하고, 반드시 적군을 침몰시켜라! 전시에는 어떤 적 함대도 영국 해협을 통과할 수 없다!
dialogue_3148=목표 함대가 나타났다! 즉시 적을 침몰시켜라!
dialogue_3149=튀니지 중부의 주요 산악 통로는 동부 평원을 공략하기 위한 전략적 거점이다. 각 부대는 반드시 이 통로를 사수하라!
dialogue_3150=부대를 양분하여 하나는 남쪽에서 시디 부지드를 공격하고, 다른 하나는 북서쪽으로 진격하라. 이 고개들을 적에게 내줄 수는 없다!
dialogue_3151=적군이 철수하고 있다. 계속 진격해 그들에게 발붙일 틈을 주지 마라!
dialogue_3152=일본 연합 함대의 주요 함선이 트룩에 정박해 있다는 제보가 들어왔다. 병사들이여, 이제 진주만의 빚을 받아낼 시간이다!
dialogue_3153=일본군 해변 부대가 포격으로 제압되었다. 상륙하라!
dialogue_3154=병사들이여, 최후의 순간이 왔다! 더 많은 적을 이곳에 묻어라!
dialogue_3155=지상 부대는 주목하라. 일본군은 벙커를 이용해 화력을 숨기고 있다. 경계하라! 경계하라!
dialogue_3156=발포하라! 발포하라! 아무도 반자이 돌격을 하지 말고, 진지를 사수하며 마지막 순간까지 싸워라!
dialogue_3157=양적으로나 질적으로 우세한 적 육해공군의 공격에 맞서 최선을 다했지만, 요충지가 모두 적의 손에 넘어가서 대단히 송구스럽습니다.
dialogue_3158=독일군이 북쪽과 남쪽으로 우리를 포위하고 있다. 우리의 진격을 방해하지 못하도록 그들을 제거하라!
dialogue_3159=최선을 다했지만 형세를 뒤집을 순 없다. 이제 내가 바라는 건 명예로운 결말뿐이다.
dialogue_3160=수라바야 방향에서 적 함대가 발견되었다! 그들을 격파하면 자와 섬은 우리의 것이다!
dialogue_3161=모든 함선은 주목하라. 일본 함대가 수라바야에 접근하고 있다. 전투를 준비하라!
dialogue_3162=적의 화력이 맹렬하다. 손상된 함선은 후퇴하여 수리하라.
dialogue_3163=내 고향 바다에서 침몰하다니?!
dialogue_3164=라에 전선은 병력이 절실히 부족하다. 이 병력이 도착하면 상황이 완화될 것이니 반드시 안전하게 호송해야 한다!
dialogue_3165=모든 부대는 주목하라. 일본군 수송선이 출동했다. 그들을 격침시켜 전선의 부담을 줄여라!
dialogue_3166=아군의 보급이 부족하니 방어선에서 소모전을 벌일 수 없다. 출격하여 방어선 앞에서 적을 격퇴하라!
dialogue_3167=병사들이여, 경계하라! 적이 곧 공격할 것이다. 보급이 부족한 상황에서 적은 오래 버티지 못할 것이다!
dialogue_3168=안 된다. 계속 싸우면 남은 병력으로 마레스선을 지키지 못할 것이다. 모든 부대는 후퇴하라!
dialogue_3169=병사들이여, 일본군이 곧 공격할 것이다. 진지를 사수하고 규율을 엄격히 지켜라. 우리는 반드시 승리할 것이다.
dialogue_3170=걱정 마라. 공수 보급으로 우리의 물자는 충분할 것이다. 임팔을 사수하라. 울창한 밀림은 적의 보급에 큰 영향을 미칠 것이다.
dialogue_3171=임팔을 탈환하라!
dialogue_3172=일본군은 보급이 부족하기에 공세는 점점 더 약해질 것이다. 병사들이여, 우리의 용기를 보여주고 일본이 결코 무적이 아니라는 것을 증명하자!
dialogue_3173=일본군은 더 이상 저항할 힘이 없다. 섬의 잔여 병력을 소탕하고 민다나오를 해방하라!
dialogue_3174=항상 '영구 저항' 전략을 고수하고, 어떤 거점도 쉽게 포기하지 마라!
dialogue_3175=프랑스 방어선은 여전히 믿을 만하다. 진지를 사수하면 우리는 결코 패배하지 않을 것이다!
dialogue_3176=전방에 대한 압박을 유지하고, 기동 부대가 방어선 왼쪽에서 공격할 때까지 기다렸다가 '레프트 훅'으로 방어선을 뚫어라!
dialogue_3177=젠장, 영국군이 어떻게 방어선 우측으로 들어왔지? 전군은 방어선을 포기하고 북쪽으로 후퇴하라.
dialogue_3178=이 방어선은 더 이상 방어할 수 없다. 마레스의 수비 부대는 신속히 후퇴하고, 적과의 불필요한 교전을 피하라!
dialogue_3179=공격하라! 적을 철저히 격파하라!
dialogue_3180=나는 왕을 위해 마지막 피 한 방울을 흘렸다. 내 삶은 충분히 영광스러웠다.
dialogue_3181=바다는 이미 정리되었고, 필리핀 중부 군도도 반드시 우리가 장악해야 한다!
dialogue_3182=섬 수비 부대는 모든 수단을 동원해 적과 싸우고 최선을 다해 적의 섬 탈환을 저지하라!
dialogue_3183=동쪽 평원의 안전을 보장하고, 적이 우리 방어를 뚫지 못하도록 하라!
dialogue_3184=적의 방어선을 뚫고, 전선을 동쪽 평원으로 밀고 나가라!
dialogue_3185=항복하지 않으면 포위권 내 독일군 포로는 한 명도 받지 않겠다.
dialogue_3186=제1 기갑군은 서쪽으로 후퇴하여 남서쪽으로 돌파하려는 태세를 취하라. 그리고 북서쪽의 지원군과 합류할 준비를 하라!
dialogue_3187=날 해임한다고? 저 멍청한 놈이! 그의 무모한 지휘가 아니었다면 이런 상황은 없었을 거다!
dialogue_3188=북서쪽에 독일군 지원군이 있다고? 그들을 막아라! 그곳이 뚫려서는 안 된다!
dialogue_3189=출격하라! 동부 함대를 전멸시켜라!
dialogue_3190=적군이 아군 쪽으로 다가온다고? 진격하라. 적의 주요 함선을 모두 격침시켜라!
dialogue_3191=바보들인가? 적에게 격침당하다니! 철수하라. 항구로 돌아가서 수리하라.
dialogue_3192=오키나와는 일본 본토를 공격하는 중요한 발판이다. 그곳을 점령해야만 이 전쟁을 빨리 끝낼 수 있다.
dialogue_3193=적이 자살 공격을 감행하고 있다. 조심하라!
dialogue_3194=이탈리아 게릴라들이 우리를 지원할 것이다. 이 산맥만 넘으면 평지가 펼쳐져 있다! 진군하여 이탈리아를 해방하라!
dialogue_3195=조국의 남은 영토를 위해 우리는 독일군과 협력하여 방어할 것이다.
dialogue_3196=적이 도망칠 수 없도록 가르다 호수 근처의 고개를 봉쇄하고, 적군을 전멸시키라!
dialogue_3197=젠장! 저 폭도들은 어디서 온 놈들인가! 그들을 진압하고 군정을 방해하는 자는 모두 체포하라!
dialogue_3198=나는 이탈리아 군대의 최고 지도자다. 나는 이탈리아 군대를 대표하여 항복한다.


