countrytech_desc_123=엘리트 보병 턴당 공격 시 전투기 공격 1회 발동.
countrytech_desc_124=엘리트 보병 공격 시 10%의 확률로 적 부대를 혼란 상태에 빠뜨림. 지속 시간 2턴.
countrytech_desc_125=정예 보병이 장갑 및 포병 유닛으로부터 받는 피해 -50%.
countrytech_desc_218=장갑 유닛이 장갑 유닛에 대한 데미지 +15%.
