skill_info_136=지휘하는 엘리트 부대의 화포 레벨에 따라 1 레벨 업그레이드될 때마다 데미지의 [#00FF00#%d%%]가 HP 회복으로 전환됨. 엘리트 부대 화포의 크리티컬 공격 데미지 25%% 증가.
skill_info_137=보병 지휘 시 받는 피해 [#00FF00#%d%%] 감소. 적의 공격 받은 후, 추가로 10%% 피해 감소효과 증가, 지속 시간 1턴, 최대 3회 중첩 가능.
skill_info_138=공격 후 [#00FF00#%d%%]의 확률로 자신이 '도발' 상태 획득.
skill_info_139=지휘하는 기갑 부대가 적진 내에 있을 때, 자신과 주변 아군의 크리티컬 공격 데미지 +[#00FF00#%d%%].
skill_info_140=공격으로 적의 사기를 떨어뜨리거나 사기 저하로 만들면 [#00FF00#%d%%]의 확률로 재공격함. 공격으로 적의 사기를 혼란 상태로 만들면 100%% 확률로 재공격함.(이미 혼란 상태인 적에게는 무효).
skill_info_141=함선을 지휘하여 공격 후, 50%% 확률로 적에게 '흔들림' 상태를 부여하여 [#00FF00#%d%%]의 이동력 감소시킴. 지속 시간 2턴. 엔터프라이즈급 항공모함 지휘 시 전투기를 제외한 기타 공군 유닛의 소모 1 감소.
skill_info_142=부대를 지휘하여 회피 발동 시, 자신의 HP 상한 [#00FF00#%d%%] 회복. (1턴당 최대 1회).
skill_info_143=지휘하는 기갑 부대가 자기 또는 우군 영역 내에 있을 때, 받는 피해 -[#00FF00#%d%%], 적 장군의 공격 받을 경우 이 피해의 50%% 추가 반환.
skill_info_144=공격 후, 대상 주변 1칸 내의 다른 적들에게 [#00FF00#%d%%] 확률로 추적 태그가 추가 됨. 추적 태그가 있는 대상은 받는 피해 20%% 증가.지속 시간 1턴.


