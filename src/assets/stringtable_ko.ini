feat_desc_144=보병 유닛에 대한 데미지 {1}% 증가.
feat_desc_144_Lv2=보병 유닛에 대한 데미지 {1}% 증가, 적군 섬멸 후 100% 확률로 다시 공격할 수 있음.
feat_desc_144_Lv3=보병 유닛에 대한 데미지 {1}% 증가, 적군 섬멸 후 100% 확률로 다시 공격할 수 있음.
feat_desc_144_Lv4=보병 유닛에 대한 데미지 {1}% 증가, 적군 섬멸 후 100% 확률로 다시 공격할 수 있음.
feat_desc_145=1칸 범위 내에 드론 방출 후, 드론은 즉시 이동 및 공격 가능. 드론은 독립 유닛으로 작동하며 턴당 1회만 적을 공격할 수 있다. 지속 시간 1턴. 쿨타임 1턴.
feat_desc_145_Lv2=1칸 범위 내에 드론 방출 후, 드론은 즉시 이동 및 공격 가능. 드론은 독립 유닛으로 작동하며 턴당 1회만 적을 공격할 수 있다. 지속 시간 2턴. 쿨타임 1턴.
feat_desc_145_Lv3=2칸 범위 내에 드론 방출. 드론 방출 후 즉시 이동 및 공격 가능. 드론은 독립 유닛으로 작동하며 턴당 1회만 적을 공격할 수 있다. 지속 시간 2턴. 쿨타임 1턴.
feat_desc_145_Lv4=2칸 범위 내에 드론 방출, 매 턴 2회 방출 가능. 드론 방출 후 즉시 이동 및 공격 가능. 드론은 독립 유닛으로 작동하며 턴당 1회만 적을 공격할 수 있다. 지속 시간 2턴. 쿨타임 1턴.
feat_desc_146=HP {1} 포인트 회복하고, 전자파 침묵 상태에 들어가 기갑, 화포, 해군 유닛에게 공격받지 않음. 지속 시간 1턴. 쿨타임 2턴. 공격 후 침묵 상태 해제.
feat_desc_146_Lv2=HP {1} 포인트 회복하고, 전자파 침묵 상태에 들어가 기갑, 화포, 해군 유닛에게 공격받지 않음. 지속 시간 1턴. 쿨타임 2턴. 공격 후 침묵 상태 해제.
feat_desc_146_Lv3=HP {1} 포인트 회복하고, 전자파 침묵 상태에 들어가 기갑, 화포, 해군 유닛에게 공격받지 않음. 지속 시간 1턴. 쿨타임 2턴.  공격 후 침묵 상태 해제되지 않음.
feat_desc_146_Lv4=HP {1} 포인트 회복하고, 전자파 침묵 상태에 들어가 기갑, 화포, 해군 유닛에게 공격받지 않음. 지속 시간 1턴. 쿨타임 2턴. 공격 후 침묵 상태 해제되지 않음.
feat_desc_147=기갑, 화포, 해군 유닛에 대한 데미지 {1}% 증가.
feat_desc_148=자폭 프로그램을 가동하여 자신의 모든 HP를 소모하고, 주변 1칸 범위 내의 목표(아군과 적군 포함)에게 드론 자폭 직전 HP의 {1}%에 해당하는 피해 입힘.

