dialogue_3500=영국군 주력 부대를 성공적으로 격파했다. 계속 방어하라. 반전의 기회가 나타났다!
dialogue_3501=독일군의 몸부림은 헛될 뿐이다. 진격을 일시 중단하고, 예비 부대가 도착한 후 다시 공격하라!
dialogue_3502=소련군의 공격 부대가 저지되었다. 총통의 반격 계획은 헛된 꿈이 아니다!
dialogue_3503=군대를 재편성하라. 베를린을 반드시 내 손에 넣을 것이다!
dialogue_3504=정말 기적이다! 우리는 미군의 후방 보급소를 파괴하는 데 성공했다. 적군은 이제 맨주먹이 되었다!
dialogue_3505=예비 중간 거점을 가동하고, 전선 부대는 잠시 대기하라. 보급품이 곧 도착할 것이다.
dialogue_3506=내가 지휘할 수 있는 모든 부대를 데려왔다. 내 안전을 보장하면 이탈리아 국민들은 연합군을 위해 복무할 것이다.
dialogue_3507=젠장, 그의 부관을 데려와라. 우리는 이탈리아 국민을 달래야 한다.
dialogue_3508=전선 부대는 캉으로 집결하여 적군의 추가 진격을 저지하라.
dialogue_3509=남부 전선 상황이 좋지 않다. 예비대를 투입하여 적군의 추가 진격을 저지하라. 방어선을 유지하려면 더 많은 부대가 필요하다고 사령부에 전보를 보내라.
dialogue_3510=사령부에서 우리를 지원군으로 파견했다. 전선 상황이 좋지 않으니 더 많은 전력을 보존해야 한다.
dialogue_3511=적군의 공격 기세가 꺾였다. 승리의 저울이 기울기 시작했다!
dialogue_3512=전선을 유지하고 계속 공격하라. 우리에게 다음 기회는 없다!
dialogue_3513=바스토뉴를 점령했다. 아르덴 산악 지대의 보급은 더 이상 문제가 아니다.
dialogue_3514=적군이 상륙한 이래로 실패가 연속되었지만, 이번 전투만큼은 반드시 승리해야 한다.
dialogue_3515=안심하고 항구로 돌아가라. 이제부터 내가 해역을 접수한다!
dialogue_3516=이런 실패는 필리핀에서 한 번 겪었으니, 다시 겪는 것은 두렵지 않다.
dialogue_3517=위기가 해결되었다! 우리 군은 반격을 개시하기 위해 북한 인민의 지지가 필요하다.
dialogue_3518=우리 군은 해역 통제권을 확보했다. 블라디보스토크를 점령하고 소련군 미사일 기지를 탈취하라!
dialogue_3519=이번에는 내가 돌아왔을 뿐만 아니라, 소련인들에게 실패의 맛을 보여주었다!
dialogue_3520=남쿠릴 열도를 다시 탈환하고, 항구의 안전을 반드시 보장하라!
dialogue_3521=해안 항구 점령을 지원하십시오. 해군은 오호츠크해의 공격 거점이 필요합니다!
dialogue_3522=좋다! 함대가 곧 도착할 것이다. 우리는 육군과 함께 오호츠크해를 수복할 것이다!
dialogue_3523=해안 방어선을 굳게 지켜라. 원군이 최대한 빨리 지원하러 올 것이다.
dialogue_3524=세인트로렌스 섬이 함락되었다. 적이 대륙에 발판을 마련하게 해선 안 된다!
dialogue_3525=해안 방어선 지원은 더 이상 의미가 없다. 후방 원군에게 철수하여 앵커리지 방어선을 보강하라고 통지하라.
dialogue_3526=지원군이 도착했고, 자원은 무한 공급된다. 힘을 비축했다가 그들을 격파하라.
dialogue_3527=유럽 원군이 대양을 건너 오고 있다. 계속 저항하라. 반전의 기회가 곧 올 것이다.
dialogue_3528=아군과 연락하는 데 성공했다. 보급을 철저히 하라. 우리가 미국을 해방시킬 것이다!
dialogue_3529=전쟁이 이 지경이 되었으니, 미군을 따라 계속 싸우는 것은 아무 의미가 없다. 소련에 협상을 통지하라. 우리는 이 전쟁에서 철수할 것이다!
dialogue_3530=캐나다가 전쟁에서 철수한다고? 이 배신자들! 전선을 캐나다 영토 내로 유지하라고 군대에 통보하라. 철수하겠다고? 그럴 수는 없다!
dialogue_3531=중앙의 의견에 따르면, 통일 전선을 형성할 수 있는 모든 대상에게 우리 군은 도움을 제공해야 한다. 우리 군과 함께 싸우는 것을 환영한다!
dialogue_3532=국가 안보를 위해 이렇게 할 수밖에 없다.
dialogue_3533=유럽 원군이 도착했다! 전사들이여, 자유를 위해 우리 영토를 되찾자!
dialogue_3534=전화가 이미 본토까지 번졌는데, 계속 이렇게 싸우는 것이 과연 의미가 있을까?
dialogue_3535=국가가 위기에 빠졌다. 전사들이여, 우리의 조국을 수호하라!


