legend_army_note=해당 부대는 전설, 정복, 집단군 모드에서 해당 국가로 플레이할 때만 편성할 수 있습니다.

synergy_tactics_1_1=・ 모든 '유령 사단' 유닛 이동력 +3.
synergy_tactics_1_2=・ 협동 공세: 기갑 유닛 자신 주변 2칸 내에 아군 '유령 사단' 유닛이 있을 경우 1개당, 공격 시 추가 피해 2% 적용.
synergy_tactics_1_3=・ 패적 추격: 보병 유닛 인접한 아군 '유령 사단' 유닛이 이번 턴에 적군 1개 처치한 경우, 해당 보병 유닛은 이번 턴에 추가로 1회 이동 가능(효과: 한 턴에 1회).
synergy_tactics_1_4=・ 전방 관측: 포병 유닛 인접 1칸 내 아군 '유령 사단' 보병 유닛이 있을 경우, 데미지 10% 증가.
synergy_tactics_2_1=・ 모든 '창끝 사단' 유닛 공격력 +10.
synergy_tactics_2_2=・ 협동 공세: 기갑 유닛 인접한 1칸 내에 아군 '창끝 사단' 보병 유닛이 있을 경우, 치명타 데미지 +20%.
synergy_tactics_2_3=・ 집단 기동: 보병 유닛 자신 주변 2칸 내에 아군 '창끝 사단' 유닛이 있을 경우 1개당, 이동력 +2.
synergy_tactics_2_4=・ 진지 원호: 포병 유닛 인접한 1칸 내에 아군 '창끝 사단' 유닛이 있을 경우, 받는 피해 15% 감소.
synergy_tactics_3_1=・ 모든 '타만 여단' 육군 유닛 회피율 10% 획득.(공습은 해당 회피 무시)
synergy_tactics_3_2=・ 수륙 기동: 해군 유닛 주변 2칸 내의 아군 '타만 여단' 육군 유닛은 바다에 들어갈 때 이동력 영향 무시, 이동력 +2.
synergy_tactics_3_3=・ 발사 유도: 포병 유닛 자신 주변 2칸 내에 아군 '타만 여단' 유닛이 있을 경우 1개당, 치명타 확률 +4%.
synergy_tactics_3_4=・ 화력 지원: 보병 유닛 인접한 1칸 내에 아군 '타만 여단' 유닛이 있을 경우, 사거리 +1, 최대 사거리 공격 시 데미지 -15%.


