event_108=모스크바 공방전
event_intro_108=1941년 가을, 독일군은 동부 전선에서 연전연승하며 소련의 수도 모스크바를 향해 빠르게 진격했다. 그들은 속도와 강철로 전쟁을 종결시키고, 결정적인 승리로 소련을 붕괴시키려 했다. 하지만 전선이 길어짐에 따라 보급은 점차 한계에 다다랐고, 혹독한 추위가 소리 없이 다가오고 있었다. 절체절명의 위기 속에서 소련은 마지막 남은 전력을 모스크바에 쏟아부으며 시간과 겨울, 그리고 희생 그 자체를 무기로 삼았다. 속도전이었던 공세는 이제 의지와 소모를 대가로 한 결전으로 변해가고 있었다. 이곳에 퇴로란 없다. 오직 삶과 죽음만이 존재할 뿐이다.




