feat_desc_88=1칸 범위 내 지뢰 배치. 지뢰는 {1}의 피해 입힘. 쿨타임 1턴.
feat_desc_88_Lv3=2칸 범위 내 지뢰 배치. 지뢰는 {1}의 피해 입힘. 쿨타임 1턴.
feat_desc_89=4칸 범위 내에 현재 위치에서 목표 지점까지의 터널 굴착. 목표 지점은 산악 지대나 바다일 수 없으며, 바다를 가로지를 수 없음. 아군의 보병, 장갑차, 경전차, 중형전차, 로켓포, 야전포, 곡사포 터널 통과 가능. 터널을 통과하면 추가로 이동할 수 있으며, 터널당 최대 3회 가능. 새로운 터널 굴착 시 원래 터널 사라짐. 쿨타임 2턴.
feat_desc_89_Lv2=7칸 범위 내에 현재 위치에서 목표 지점까지의 터널 굴착. 목표 지점은 산악 지대나 바다일 수 없으며, 바다를 가로지를 수 없음. 아군의 보병, 장갑차, 경전차, 중형전차, 로켓포, 야전포, 곡사포 터널 통과 가능. 터널을 통과하면 추가로 이동할 수 있으며, 터널당 최대 3회 가능. 새로운 터널 굴착 시 원래 터널 사라짐. 쿨타임 2턴.
feat_desc_90=주변 1칸 범위 내의 건물 체력 {1}포인트 회복. 턴당 1회 회복.
feat_desc_92=체력 {1}포인트 손실할 때마다 부대 공격력 {2}포인트 증가.
feat_desc_92_Lv2=공격 범위 +1, 체력 {1}포인트 손실할 때마다 부대 공격력 {2}포인트 증가.
feat_desc_92_Lv3=공격 범위 +1, 체력 {1}포인트 손실할 때마다 부대 공격력 {2}포인트 증가.
feat_desc_93=체력이 감소해도 사기가 하락하지 않습니다. 죽기 직전에 2턴 동안 체력이 1포인트 이하로 감소될 수 없음. 쿨타임 {2}턴.
feat_desc_93_Lv2=체력이 감소해도 사기가 하락하지 않습니다. 죽기 직전에 2턴 동안 체력이 1포인트 이하로 감소될 수 없음. 쿨타임 {2}턴.
feat_desc_93_Lv3=체력이 감소해도 사기가 하락하지 않습니다. 죽기 직전에 3턴 동안 체력이 1포인트 이하로 감소될 수 없음. 쿨타임 {2}턴.
feat_desc_94=자신 또는 아군의 영지 범위 내에 있을 때 데미지 {1}% 증가.
feat_desc_95=공격 및 반격 시 지형으로 인한 데미지 감소 효과 무시.
feat_desc_95_Lv2=공격 및 반격 시 지형으로 인한 데미지 감소 효과를 무시하고 적군의 방어력 및 이동력 {1}% 감소. 1턴 지속.
feat_desc_95_Lv3=공격 및 반격 시 지형으로 인한 데미지 감소 효과를 무시하고 적군의 방어력 및 이동력 {1}% 감소. 2턴 지속.
feat_desc_96=직접적인 피해는 자신과 주변 우군이 나누어 분담하며, 분담하거나 회피한 피해 {1}포인트당 기본 데미지가 {2}포인트씩 증가하고, 최대 100%까지 증가 가능. 2턴 지속.
feat_desc_96_Lv2=직접적인 피해는 자신과 주변 우군이 나누어 분담하며, 분담하거나 회피한 피해 {1}포인트당 기본 데미지가 {2}포인트씩 증가하고, 최대 100%까지 증가 가능. 3턴 지속.
feat_desc_96_Lv3=직접적인 피해는 자신과 주변 우군이 나누어 분담하며, 분담하거나 회피한 피해 {1}포인트당 기본 데미지가 {2}포인트씩 증가하고, 최대 200%까지 증가 가능. 3턴 지속.
feat_desc_97=공군의 공격을 받을 때 {1}%의 확률로 피해 회피.

