event_4111=바렌츠해 해전
event_4112=비스와-오데르 공세
event_4113=라바울 전투

event_intro_4111=1942년 12월 31일, 영국 호위 함대와 독일 해군의 차단 함대가 바렌츠해에서 해전이 벌어졌다. 독일군 함정의 화력이 우세했으나, 호위 함대는 신속한 대응과 적시의 증원 덕분에 소련으로 향하던 수송선대를 성공적으로 보호했다. 독일 함대는 수송선 한 척도 격침시키지 못했고, 이 전투의 패배는 곧바로 독일 해군 사령관 레더의 사임으로 이어졌고, 되니츠가 후임으로 취임했다. 이후 독일 해군의 전략적 중심은 잠수함전으로 완전히 전환되었다.
event_intro_4112=비스와-오데르 공세는 소련 붉은 군대가 감행한 대규모 전략적 공격이었다. 서부 전선 연합군의 아르덴 공세에서의 곤경에 대응하기 위해, 소련군은 원래 예정된 공격 계획을 8일 앞당겨 1945년 1월 12일 비스와 강의 상륙 거점에서 돌격을 시작했다. 주코프와 코네프 원수의 지휘 하에, 소련군 두 개 방면군이 절대적인 병력 우위를 바탕으로 독일군 방어선을 돌파하고 바르샤바, 크라쿠프 등 도시를 해방시켰다. 이는 전쟁을 독일의 심장부로 직접 밀고 나갔으며, 최종적인 베를린 점령을 위한 결정적인 기반을 마련했다.
event_intro_4113=라바울 전투는 일본군이 남태평양의 전략적 요충지를 확보하기 위해 감행한 핵심 작전이었다. 1942년 1월 초, 일본군 항공모함 함재기들이 라바울을 공습했다. 1월 23일, 일본군 지상 부대가 순조롭게 상륙하여 라바울을 신속히 점령한 후, 이곳을 견고한 해상 및 공중 요새로 구축했다. 연합군에게 라바울의 상실은 호주와의 교통로가 직접적인 위협을 받게 만든 사건이었다. 일본군은 대단히 중요한 전진 기지를 확보하는 데 성공했으며, 이는 이후 솔로몬 제도 및 뉴기니 방면으로의 추가 작전을 수행하는 데 큰 편의를 제공했다.

dialogue_4253=잠수함 부대가 영국 수송선대의 동향을 포착했다.
dialogue_4254=함대를 두 개로 나누어 영국군 호위함을 유인한 후 수송선단을 전력으로 섬멸하라.
dialogue_4255=영국 함선이 북서쪽에서 독일 함대를 발견했다. 그들을 요격하는 동시에 호위 함대는 수송선대가 전장에서 탈출할 수 있도록 연막탄을 사용했다.
dialogue_4256=독일군의 병력은 이제 얼마 남지 않았으며, 우리에게는 끝없는 지원군이 있다.
dialogue_4257=바르샤바 일대의 방어선이 뚫렸고, 독일군은 도망가고 있다. 계속 추격하라. 전속력으로 전진하라!
dialogue_4258=크라쿠프의 독일군이 이미 붕괴되었다. 적들은 진지를 포기하고 서쪽으로 이동하기 시작했다.
dialogue_4259=우리가 절대적인 우위를 점했다. 섬에 있는 호주군을 놓치지 말고, 그들의 철수 경로를 봉쇄하라.
dialogue_4260=수가 많은 일본군 상륙 부대에 맞서 호주 수비군은 병력이 심각하게 부족하여 남쪽으로 철수할 수밖에 없다.
dialogue_4261=통신 효율이 크게 향상되어, 전투기가 이제 지상 부대의 공습 요청에 더 빠르게 대응할 수 있게 되었다. 공중 우위를 잘 활용하라. 오늘은 전투기의 날이다.
dialogue_4262=전황에 차질이 생겼지만, 아직 만회할 여지가 있다.
dialogue_4263=최고 사령부가 우리에게 전진을 멈추라고 직접 명령을 하달했다.
dialogue_4264=우리는 후속 공격을 위해 미리 '강력 정찰' 작전을 실행해야 합니다. 장갑 부대는 계속 전진하라.
dialogue_4265=이... 이 공습의 규모로는 독일군의 지상 공격을 막을 수 없다.
dialogue_4266=이렇게 패배한 이유는 도대체 무엇인가?
dialogue_4267=알프레드가 전사했으며, 전황은 예상과 크게 달라졌다. 다음번에는 더 일찍 작전을 인수해야 할 것 같다.
dialogue_4268=이번 패배는 이미 확정되었다. 하지만 너희는 그 대가를 치르게 될 것이다.
dialogue_4269=나는 돌아올 것이다.
dialogue_4270=롬멜의 부대는 우리에게 포위되었다.
dialogue_4271=군인이 조국을 수호하려는 결의를 절대 과소평가하지 마라. 철수하라.
dialogue_4272=독일군은 여전히 무의미한 저항을 하고 있다. 캉을 점령하고 적의 방어선을 완전히 파괴하라.
dialogue_4273=너희의 의지는 칭찬할 만하다.
dialogue_4274=군인의 명예를 위해, 그리고 독일을 위해, 우리는 계속 싸울 것이다.
dialogue_4275=오직 우리만이 우리 자신을, 그리고 우리 조국을 구할 수 있다.
dialogue_4276=악천후는 양측 모두에게 극히 불리하다. 예상 목표를 달성하려면 공격 속도를 높여야 한다.
dialogue_4277=프로이센에는 포로로 잡히는 장군이 없을 것이다.
dialogue_4278=눈보라가 끝났다. 지금부터 반격을 개시하라.
dialogue_4279=아르덴 숲의 눈은 뼈를 깎을 듯 차갑다. 나는 여기서 이미 수없이 쓰러졌던 것 같다.
dialogue_4280=나는 너희 같은 어리석지만 존경할 만한 적들을 기억할 것이다. 너희의 찬가는 곧 용기의 찬가이다.
dialogue_4281=검은 전갈은 태양 요새의 실험에서 성공했다.
dialogue_4282=이런 방식은 너무 직접적일 수도 있다. 그들은 언젠가 알게 될 것이다.
dialogue_4283=어쩌면 그럴지도. 하지만 그렇다 해도 나는 알프레드를 믿을 것이다.
dialogue_4284=우리는 여기서 적의 힘을 약화시키고, 최대한 너희에게 시간을 쟁취해 줄 것이다.
dialogue_4285=태양 요새의 기록에 따르면, 남미의 신호 증폭기 3개가 10번의 실험 주기가 지난 후 조정을 완료할 것이다.
dialogue_4286=처음부터 나는 결과를 알았고, 오래 전에 내가 가야 할 길을 선택했다.
dialogue_4287=마지막 남은 신호 증폭기 조율이 완료되었다. 사람들은 자율 의식이 점차 억제되고, 결국 다시 검은 전갈에 합류하게 되었다.
dialogue_4288=우리는 이 재앙을 막는 데 성공했지만, 화근은 여전히 제거되지 않았다.
dialogue_4289=반드시 부대를 재집결하여 우리의 요새를 탈환해야 한다.
dialogue_4290=멕시코에 위치한 검은 전갈의 유적 '태양 요새'가 함락되고, 신호 증폭기가 점령되었다. 전 세계의 비밀 기지의 위치가 모두 드러나자, 검은 전갈은 전략적 측면에서 전면적인 수세에 몰렸다.
dialogue_4291=콜롬비아에 위치한 검은 전갈의 유적 '에코 벙커'가 함락되고, 신호 증폭기가 점령되었다. 유적의 각종 시설은 스스로 파괴되었으나, 남아있는 접속 기록에 따르면 해당 시설의 재가동 시점은 1933년으로 나타났다.
dialogue_4292=브라질에 위치한 검은 전갈의 유적 '잉카의 눈'이 함락되고, 신호 증폭기가 점령되었다. 다수의 특수 무기 장비가 옮겨지거나 파괴되지 못한 채 남겨졌고, 심지어 본 적 없는 신형 군비 설계도도 발견되었다.
dialogue_4293=브라질에 위치한 검은 전갈의 유적 '성궤 신전'이 함락되고, 신호 증폭기가 점령되었다. 미국과 소련은 수많은 암호화된 자료를 획득하여, 검은 전갈의 전 세계 인력 명단과 군사 배치가 완전히 노출되었다.
dialogue_4294=검은 전갈의 모든 유적 시설이 점령되면서 카운트다운이 멈췄다. 검은 전갈의 남미 계획은 완전히 좌절되었고.
dialogue_4295=오스본이 완전히 패배하면서 카운트다운이 멈췄다. 검은 전갈의 남미 계획은 완전히 좌절되었고.


