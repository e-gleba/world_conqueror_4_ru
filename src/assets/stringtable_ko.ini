dialogue_2543=상륙 부대가 미군의 공격을 받았다. MI 작전이 탄로났다.
dialogue_2544=화살이 이미 시위에 걸렸다. 원래 계획대로 진행하라.
dialogue_2545=일본군 항공모함이 발견되었다! 즉시 공격하여 연합함대의 주력을 격파하라.
dialogue_2546=미군의 함대 규모와 항공모함의 수가 우리의 예상보다 많다. 즉시 예비대를 동원하여 지원하라.
dialogue_2547=적 항공모함의 침몰이 확인되었다. 계속 추격하라!
dialogue_2548=태평양 함대는 방비를 하고 있었다. 나의 패배는 이미 돌이킬 수 없게 되었다.
dialogue_2549=우리 함대는 과달카날 섬 주변에서 공격을 개시할 것이다. 상륙부대는 준비가 되었으니 일본군의 증원군이 도착하기 전에 과달카날 섬을 점령하라.
dialogue_2550=우리는 미군에게 습격당했다. 호위함과 원군 부대는 즉시 출발하여 과달카날 섬을 탈환하라.
dialogue_2551=미군 함대는 우리의 보급 항로를 장악했다. 계속 부대를 수송하면 아마 막대한 손실을 입을 수 있을 것이다.
dialogue_2552=여러 섬이 미군의 공격을 받았다. 반드시 함대를 집결시켜 효과적인 반격을 해야 한다.
dialogue_2553=우리 함대가 도착했다. 각 함대는 연합하여 총공격을 개시하라. 솔로몬 제도에서 일본군을 몰아내라.
dialogue_2554=적의 원군이 끊임없이 과달카날 섬으로 몰려오고 있다. 사전에 방어 준비를 하고, 해상에서 적을 막아라.
dialogue_2555=나는 마지막 최선을 다해 포트모르즈비를 공격할 것이니 나를 도와 미군의 지원을 견제하라.
dialogue_2556=적의 공세가 갈수록 맹력해지고 있다. 우리 부대는 아마 오래 버티지 못할 것 같다.
dialogue_2557=일본 함대는 뜻밖에도 항공모함의 엄호 없이 진격을 개시했다. 즉시 함대를 파견하여 지원하라.
dialogue_2558=우리는 코코다를 탈환했다. 일본군의 공세는 곧 무너질 것이다
dialogue_2559=적군은 우리의 방어선을 돌파했다. 즉시 라이성 방향으로 원군을 파견하라.
dialogue_2560=지원군이 도착했다. 지금부터 반격이다.
dialogue_2561=추가 작전을 준비하기 위해 사이판의 비행장을 우선적으로 점령하라.
dialogue_2562=우리는 절대 항복하지 않을 것이다.
dialogue_2563=우리는 최후의 순간까지 싸웠다.
dialogue_2564=마리아나 제도의 일본군은 더 이상 도망갈 곳이 없다. 우리의 함대는 각지의 일본군의 연락을 차단할 것이다.
dialogue_2565=미군이 사이판 섬과 티니언 섬을 차례로 점령했다. 적군의 상륙 부대를 괌 섬 밖에 막아야 한다.
dialogue_2566=연합 함대는 이미 완전히 격파되었다. 우리 함대는 상륙 부대를 엄호할 것이다.
dialogue_2567=내가 이곳에 다시 돌아왔다! 우리 군대가 다시 필리핀 땅에 섰다.
dialogue_2568=미군이 레이테 섬 남부에 상륙했다. 즉시 공격을 시작하여 적의 해상 지원군을 차단하라.
dialogue_2569=적의 육군 부대가 빠르게 움직이고 있다. 미군 후속 부대의 상륙을 방지하기 위해 해군 공격을 강화해야 한다.
dialogue_2570=계속 추격하라. 적의 해군은 매우 허약하다.
dialogue_2571=북쪽으로 후퇴하여 적 함대의 주력을 레이테 만에서 끌어내라.
dialogue_2572=해안을 이용하여 방어를 재정비하고, 연합군의 상륙을 막아라.
dialogue_2573=영국군의 태평양 함대가 도착했다. 우리는 공군 수에서 절대적인 우위를 점하게 되었다.
dialogue_2574=우리의 목표는 단 하나, 섬의 모든 수비군을 섬멸하는 것이다.
dialogue_2575=적의 해군은 다시 주동적으로 출격했다. 이런 상황에서 공격을 가하면 반드시 살아서 돌아가지 못할 것이다.
dialogue_2576=야마토호를 격침했다!
dialogue_2577=전세는 만회할 수 없게 되었다. 계속 진격하여 끝까지 싸워라.
dialogue_2578=돌격! 힘을 모아 적군을 계속 공격하라.
dialogue_2579=일본 섬 전체가 공군의 타격 범위 내에 있다.
dialogue_2580=적의 방어력은 무시할 수 없다. 우리의 첫 번째 목표는 여전히 일본을 점령하고, 일본군을 항복하게 하는 것이다.
dialogue_2581=일본군은 여전히 완강하게 저항하고 있다. 그들의 해안 방어 시설을 파괴하라.
dialogue_2582=우리는 상륙 부대를 위해 포격과 공중 지원을 제공할 것이다.
dialogue_2583=소련군은 일본 본토를 공격하기 위해 직접 상륙작전을 준비하고 있는 것 같다.
dialogue_2584=소련군은 북부에서 공격을 개시했다. 그들의 후속 상륙 부대를 조심하고 요격하라.
dialogue_2585=적은 도쿄 방향으로 진군하고 있다. 우리 부대는 즉시 지원군을 파견할 것이다.
dialogue_2586=우리는 동쪽과 남쪽 해안에서 상륙작전을 벌여 적의 방어 중심을 분산시킬 것이다.
dialogue_2587=주변 섬의 수비군을 섬멸하라. 섬에 있는 비행장을 활용하여 상륙 작전을 위해 엄호를 제공하라.
dialogue_2588=공격은 예상보다 순조롭다. 우리는 영국군보다 먼저 메시나를 점령할 수 있다.
dialogue_2589=연합군이 상륙을 시작했다. 즉시 예비 부대를 파견하여 전선을 지원하라.
dialogue_2590=메시나가 위태로워졌다. 섬 수비군에게 즉시 철수하라고 명랑하라. 우리 공군이 그들을 엄호할 것이다.
dialogue_2591=섬의 수비군은 우리에 의해 분산되었다. 그들의 퇴로를 차단하고, 가능한 한 많은 적군을 섬멸하라.
dialogue_2592=우리의 병력은 절대적인 우위를 차지하게 되었다. 남쪽에서 부쪽으로, 바다와 육지에서 동시에 공격을 가해 독일군을 이탈리아에서 완전히 몰아내라.
dialogue_2593=타란토의 방어는 매우 약하다. 상륙 후 나는 전속력으로 북쪽으로 진격할 것이다.
dialogue_2594=이탈리아 정부는 이미 우리와 비밀리에 항복과 관련된 문제를 논의했지만. 이번 항복의 계기를 잘 이용하여 이탈리아의 독일군을 단숨에 격파하라.
dialogue_2595=우리는 이탈리아가 연합군에게 정전을 요청하는 연합군의 전보를 가로챘다! 이탈리아군의 동향을 주의 깊게 지켜봐야 한다.
dialogue_2596=우리는 연합군과 협정을 체결했다. 각 부대는 연합군의 전선으로 철수하라.
dialogue_2597=이탈리아가 예상대로 항복했다. 즉시 주요 도시를 점령하고, 손실이 확대되는 것을 방지하라.
dialogue_2598=공수 부대와 협력하여 적군의 해안 방어선을 협공하라.
dialogue_2599=상륙 후 우군을 도와 갯벌 진지의 건설을 완성하고, 해안의 독일군을 섬멸하라.
dialogue_2600=대량의 연합군이 노르망디에 상륙했다. 적의 진격을 지연시키기 위해 반격을 조직해야 한다.
dialogue_2601=내 포병대가 연합군의 공격을 견제할 것이다!
dialogue_2602=상륙 부대가 발판을 마련했다. 이제 카온에 대한 공격을 개시하라.
dialogue_2603=공격이 순조롭게 진행되고 있다. 우리는 곧 파리를 해방할 수 있을 것이다!
dialogue_2604=셰르부르가 함락되고, 반도 전체가 연합군의 손에 들어갔다.
dialogue_2605=로마가 함락되었다. 연합군이 마르세유에 쉽게 상륙하도록 내버려둬서는 안 된다.
dialogue_2606=후속 부대의 상륙에 대비하여 신속히 진지를 정리하라.
dialogue_2607=이러한 공격 기세를 유지한다면, 우리의 국민은 곧 해방을 맞이할 것이다!
dialogue_2608=연합군의 공세가 심상치 않게 맹렬하다. 기갑 부대를 동원하여 마르세유를 탈환하라.
dialogue_2609=계속 고수하는 것은 더 이상 의미가 없다. 즉시 철수하고 재집결하라.
dialogue_2610=공수 부대는 이미 지정된 위치에 낙하했으니 신속하게 그들과 합류하라. 그들은 주력 부대가 도착할 때까지 중요 지점의 다리를 지킬 것이다.
dialogue_2611=지원군이 다가오고 있다. 이 공수 부대를 섬멸하고 라인 강의 방어 지점을 확실히 장악해야 한다.
dialogue_2612=지상 진격이 막혔다! 우리는 독일군 기갑부대의 반격을 받았다!
dialogue_2613=계속 연합군을 저격하고, 적의 주력을 라인강 밖에 막아라.
dialogue_2614=공수부대가 라인강의 다리를 점령했다. 서둘러 전진하라. 그들은 독일군 후방에서 오래 견디지 못할 것이다.
dialogue_2615=우리는 앤트워프 항구 주변 해역을 점령했다. 우리의 보급이 곧 개선될 것이다.
dialogue_2616=연합군은 우리의 공격에 대해 아무런 방비도 하지 않았다. 이 기회를 이용하여 영국과 미국 주력 부대 사이의 연결을 차단하라.
dialogue_2617=방어선을 지켜라! 독일군이 우리의 부대를 분산시키게 해서는 안 된다.
dialogue_2618=연합군의 지원군이 계속해서 전장에 도착하고 있으니, 반드시 진격 속도를 높여야 한다!
dialogue_2619=전세가 역전되었다. 이제 우리가 공격할 차례이다!
dialogue_2620=지크프리트선으로 철수하고, 연합군이 다음 공격을 시작하기 전에 방어를 재조직하라.
dialogue_2621=단 한 명의 적도 놓치지 말고 계속 추격하라.
dialogue_2622=적의 보급로를 차단했다. 승리가 눈앞에 다가왔다!
dialogue_2623=전속력으로 전진하라! 소련군과 합류하여 적의 수비군을 분산시켜라.
dialogue_2624=독일군은 아직 항복할 준비가 되어 있지 않다. 베를린으로 계속 진격하라. 우리 부대는 북쪽의 장애를 제거할 것이다.
dialogue_2625=방어선이 여기저기 뚫렸고, 연합군은 사방에서 베를린을 향해 돌진하고 있다.
dialogue_2626=승리는 우리의 것이다! 계속 진격하여 아직 저항하고 있는 독일군을 모두 섬멸하라!
dialogue_2627=나의 부대는 마지막 순간까지 계속 싸울 것이다.

general_stage_name_171=칼리닌 반격전
general_stage_name_172=제4차 하리코프 공방전
general_stage_name_173=드네프르 강 전투
general_stage_name_174=비스와-오데르 대공세
general_stage_name_175=베를린 공방전
general_stage_intro_171=칼리닌 반격전은 소련군이 독일군의 모스크바 포위 공격에 직면한 상황에서 벌인 대규모 반격으로, 모스크바를 성공적으로 지켜냈을 뿐만 아니라 소련에게 중요한 전략적 우위를 가져다주었으며, 이후 스탈린그라드 전투와 쿠르스크 전투의 기초를 마련한 전투이다.
general_stage_intro_172=1943년 8월부터 소련은 독일군 방어선에 대한 대규모 포격으로 시작된 제4차 하리코프 공방전을 개시했다. 독일군은 완강하게 반격했지만, 소련군을 막지 못했고, 결국 소련군은 하리코프 탈환에 성공했다.
general_stage_intro_173=이번 전투는 제2차 세계 대전 중 규모가 가장 큰 군사 작전 중 하나이다. 4개월 만에 소련군은 드네프르 강 동안을 독일군으로부터 해방시키고, 여러 차례의 도강 공격을 감행하였으며, 서안에 여러 개의 교두보를 구축해 키예프 전투에서 승리할 수 있는 기반을 마련했다.
general_stage_intro_174=이번 전투는 제2차 세계 대전 말기에 소련군이 일으킨 대규모 군사 작전이다. 1월 12일부터 소련군은 폴란드의 독일군 방어선을 돌파하여 독일 국경까지 빠르게 진격했다. 이 공세는 전쟁의 종전을 가속화시켰고 소련군이 베를린을 점령할 수 있는 길을 열었다.
general_stage_intro_175=비스와-오데르 대공세가 끝난 후 소련군은 베를린 동쪽 60km 지점에서 진격을 잠시 멈추었다. 3월에 독일은 베를린 방어 계획을 세웠으나 4월 소련이 공세를 재개하여 베를린에 대한 총공세를 펼치는 것을 막지 못했다.

dialogue_2628=병사들이여, 계속해서 동쪽으로 진군하라. 우리의 목표는 스탈린그라드를 점령하는 것이다.
dialogue_2629=소련의 땅은 침범해서는 안 되는 곳이다. 우리는 나치를 조국에서 몰아낼 것이다!
dialogue_2630=적의 수비 병력이 부족하다. 지금이 반격을 개시할 좋은 기회이다!
dialogue_2631=지휘관 각하, 나는 포병 부대를 이끌고 독일군 진지에 포격을 가할 것이며, 이번에는 반드시 나치로부터 하리코프를 탈환할 것이다.
dialogue_2632=적의 포켓 진형을 조심하라. 독일의 지원군에게 포위당하면 우리는 막대한 피해를 입게 될 것이다.
dialogue_2633=적군의 해상 지원 부대는 우리에게 위협이 되지 않는다. 그들을 신속히 섬멸하여 후환을 두절시켜라.
dialogue_2634=소련군은 드네프르 강 동안까지 이르렀다. 최고 사령부는 어떻게 해서든 서안을 지켜야 하며, 그들이 강을 건너지 못하게 하라는 지시를 내렸다.
dialogue_2635=적의 수비 부대 수가 많기에 맹목적으로 공격해서는 안 된다. 서안에 주둔하고 반격의 기회를 도모하라.
dialogue_2636=독일군은 맹목적인 공격으로 막대한 손실을 입었다. 적군이 약해졌으니 즉시 강을 건너 서안에 교두보를 구축하라!
dialogue_2637=소련군의 공세가 너무 맹렬하다. 잠시 후퇴하라!
dialogue_2638=어떤 대가를 치르더라도 적이 독일에 진입하지 못하도록 적을 막아라!
dialogue_2639=병사들이여, 이것은 위대한 승리이다. 우리는 전선을 독일 경내로 밀고 들어갔다. 수도 베를린을 점령하는 것도 시간문제일 것이다!
dialogue_2640=우리는 남쪽에서 공격하는 우군과 함께 협공을 형성하여 베를린으로 진군할 것이다!
dialogue_2641=적군이 쳐들어왔다. 독일 제국은 전례 없는 위기에 직면하고 있다. 무슨 일이 있어도 원수를 보호해야 한다!
dialogue_2642=베를린이 함락되었다. 우리는 곧 나라를 지키는 전쟁에서 승리를 거둘 것이다. 오늘은 위대한 날이다.

event_104=엘 알라메인 전투
event_intro_104=제2차 세계 대전이 발발한지 얼마 지나지 않아 전장은 북아프리카로 확산되었다. 이곳은 유럽과 아시아를 잇는 중요한 해상 교통로인 수에즈 운하와 중동의 풍부한 석유 자원과 관련되어 있다. 1940년에 이탈리아는 북아프리카에서 영국군을 공격했지만, 전략의 실패로 기대했던 목표를 이루지 못했다. 이듬해 독일군의 아프리카 군단이 개입하면서 북아프리카의 전세는 어떻게 바뀔까?

dialogue_2643=하느님, 감사합니다. 독일 우군은 전장에 전면 배치를 마쳤으니 이제 승리의 저울은 우리에게로 기울 것이다!
dialogue_2644=추축국의 목표는 방어선을 돌파하고 알렉산드리아를 탈취하는 것이다. 그들이 성공하면 북아프리카 전체가 적의 손에 들어가게 될 것이다. 우리는 그들의 음모를 막아야 한다.
dialogue_2645=적의 공세가 너무 맹렬하여 전장이 교착 상태에 빠졌다. 지휘관님, 우리는 지중해의 보급 함대에 의존하여 그들과 장기적인 소모전을 벌일 수 있다.
dialogue_2646=적의 해상 보급로를 파괴하고, 그들에게 숨 쉴 틈을 주지 마라!
dialogue_2647=추축국 군대의 보급선이 너무 길어 물자가 부족한 상황이 나타났다. 반격의 기회를 잡아라!
dialogue_2648=중부 전선의 독일군의 방어가 너무 견고합니다. 지휘관님, 우리를 이끌고 남쪽 전장에서 이탈리아군의 취약한 방어를 돌파한 후 북쪽으로 진격하십시


