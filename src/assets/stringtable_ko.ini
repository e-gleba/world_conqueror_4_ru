event_intro_4107=소련군은 야간 부대 이동, 가짜 진지 구축 등의 엄격한 전역 위장 조치를 시행하여 주력 병력을 은밀히 집결시키는 데 성공했다. 1942년 11월 19일, 소련군은 독일군 양익의 루마니아군 진지를 향해 대규모 공격을 개시하여 방어선을 신속히 돌파했다. 독일군은 소련군의 공격 규모와 의도를 잘못 판단하여 남북 양로의 소련군이 순조롭게 합류하게 되었고, 최종적으로 독일 제6집단군과 제4기갑집단군 일부 부대를 완전히 포위했다. 이 전투로 동부전선 전장의 전략 상황이 역전되었다.
event_intro_4108=1943년 11월 20일, 미군은 강력한 해상 및 공중 화력 지원 아래 타라와 환초에 양륙 작전을 감행했다. 그러나 조석 높이가 예상보다 훨씬 낮아, 많은 병력이 해안에서 멀리 떨어진 지점에서 물을 헤치고 상륙해야 했다. 이와 동시에 일본군은 상륙 작전에 대비하여 섬의 방어를 강화했고, 해안에서 미군에게 심각한 피해를 입혔다. 4일간의 격전 끝에 미군은 막대한 대가를 치르고 수비군을 전멸시켰다. 이 전투는 미군에게 귀중한 양륙 작전 경험을 제공했으며, 조석 예보와 수문 측량의 중요성이 전례 없이 높아지는 계기가 되었다.
event_intro_4109=동남아시아의 전략 자원을 확보하고 미국의 경제 제재와 석유 금수 조치를 깨기 위해 일본 해군은 1941년 12월 7일에 미국 하와이 진주만 해군 기지를 기습했다. 일본군은 항공모함 6척을 동원하여 두 차례의 공습을 감행했고, 극히 적은 손실로 미 태평양 함대에 막대한 피해를 입혔다. 이번 기습으로 다량의 미군 항공기와 함선이 파괴되었으나, 미 해군 항공모함 3척은 항구에 없어기에 피해를 면할 수 있었다. 다음 날 미국은 일본에 선전포고를 하고 태평양 전쟁이 발발했다.
event_intro_4110=이탈리아군은 이집트를 침공한 후 시디 바라니에서 진격을 멈추고, 후속 지원을 기다리는 동시에 방어 시설을 구축하고 여러 군영을 설치하는 작업으로 전환했다. 1940년 12월 8일, 영국군은 이 지역의 이탈리아군 군영에 대한 기습 공격을 감행했다. 작전 전 엄격한 보안 유지로 이탈리아군은 황급히 응전했고, 대량의 인원이 포로가 되었다. 이 작전의 성과는 예상을 훨씬 뛰어넘었고, 영국군은 승세를 몰아 기습 공격을 '컴퍼스 작전'이라는 전략적 반격으로 발전시켰다.

dialogue_4146=함포의 엄호 하에 전력을 다해 상륙작전을 완수하라!
dialogue_4147=조석 높이가 예측보다 낮다! 상륙정의 흘수선이 깊어 더 이상 해안에 접근할 수 없다.
dialogue_4148=섬의 일본군은 이미 분산되었고, 우리가 절대적인 우위를 점하고 있다. 경계를 강화하고, 남은 적들을 소탕하라.
dialogue_4149=일본군이 갑자기 상륙 부대에 맹렬한 반격을 가하고 있다.
dialogue_4150=이것은 훈련이 아니다! 이탈리아군 군영을 공격하여 그들을 기습하라!
dialogue_4151=적의 주요 공격 방향에 주의하라. 영국군 주력 부대는 우리 후방의 사막에 있다.
dialogue_4152=적이 전체적으로 붕괴하고 있다. 계속 공격하여 전과를 확대하라!
dialogue_4153=이탈리아군의 핵심 병영들이 하나씩 함락되면서 전체 방어선이 흔들리기 시작하고, 부대가 점차 혼란에 빠지고 있다.


skill_name_166=원정군 사령관
skill_name_167=오버로드 작전
skill_name_168=종심 전술
skill_name_169=소방대장

skill_info_166=함선 부대 지휘 시 이동력 +5 , 반격 불가 효과의 영향 받지 않음. 지휘 부대의 이동력 3포인트당 공격 및 반격 피해 [#00FF00#%d%%] 증가.
skill_info_167=자신 주변 3칸 이내의 적군이 받는 피해 35%% 증가. 경사 장갑, 보호 장치, 도발, 납치, 공동 작전 효과 무효화. 함선 부대 지휘 시, 적 섬멸 후 [#00FF00#%d%%] 확률로 재공격.
skill_info_168=육군 부대 지휘 시 주변 3칸 내의 적군이 섬멸될 경우 사기가 상승하고, 스테이지 종료 전까지 '돌파 집단' 상태(효과: 데미지 [#00FF00#%d%%] 증가, 최대 42%%까지 누적 가능) 획득.
skill_info_169=포병 부대 지휘 시 이동력 +3, 적 섬멸 후 [#00FF00#%d%%] 확률로 재공격, 부대 HP 200포인트당 추가로 10%% 확률 증가.

promotion_desc_4=연수 후 장군의 속성 상한 향상. 연수 후 장군의 기존 고정 스킬이 초기화되며, 스킬 습득 및 업그레이드 비용 전액 반환.
army_buff_desc_1591=톨파 집단: 데미지 %d%% 증가.
army_buff_desc_1592=톨파 집단: 데미지 %d%% 증가.
army_buff_desc_1593=톨파 집단: 데미지 %d%% 증가.


dialogue_4121=새벽 4시, 폭풍은 여전히 멈추지 않고 있다. 모두가 하나의 답을 기다리고 있다. — 연기할 것인가, 출발할 것인가.
dialogue_4122=참모들은 여전히 조석, 구름, 달빛을 두고 논쟁 중이다. 오직 나만이 알고 있다. 수개월간의 훈련이 바로 이 순간을 위한 것이었다는 것을. 주저함은 적의 포탄보다 치명적이다.
dialogue_4123=출발. 신께서 우리 모두에게 자비를 베푸시기를.
dialogue_4124=풍랑이 너무 심해 순찰기조차 이륙할 수 없다. 참모본부의 전문에는 "연합군은 이런 악천후 속에서 행동하지 않을 것이다."라는 내용이 적혀 있었다.
dialogue_4125=오늘의 해무는 유난히 짙다. ...안개 너머 저건 뭐지? 어선인가? 한 척, 두 척...... 잠깐, 세상에! 바다 전체가 움직이고 있다!
dialogue_4126=연합군 함대다! 연합군 함대다! 이런 날씨에 행동하다니? 미쳤군! 즉시 경보를 울려라! 전원 1급 전투 태세 돌입! 포병과 기관총 사수를 배치하라. 상륙이다! 놈들이 상륙하고 있다!
dialogue_4127=공수부대라고? 그들이 돌파구를 찾았다고 생각하겠지만, 그곳의 얕은 물과 웅덩이는 원수께서 미리 설치한 함정이다. 그들이 비행기에서 뛰어내리는 순간 이미 졌다.
dialogue_4128=좋다, 진흙탕에서 수영하게 두어라! 제국은 그들의 '모험 정신'을 환영한다.
dialogue_4129=해안 방어선이 예상보다 견고하다. 적의 기관총 화력은 마치 철의 장막과 같다! 전함과 공군 부대에게 저 벙커들을 날려버려라고 전하라!
dialogue_4130=내 병사들이 아직 물속에서 허우적대는 게 보인다! 대가를 따지지 말고 구조정을 보내라! 나는 그들을 이 바다 속에 외롭게 가라앉게 내버려두지 않을 것이다!
dialogue_4131=해변의 한 치의 땅, 모든 참호, 모든 벙커는 유럽 대륙으로 향하는 열쇠다. 그것들을 점령하라! 그곳이 우리가 집으로 가는 길이다.
dialogue_4132=함대와의 연락을 유지하라. 젠장, 우리는 공중 지원이 필요하다! 약속대로 우리 항공기를 위해 표식을 하라!
dialogue_4133=모든 부대는 주목하라. 독일군 기갑 집단이 집결하고 있다! 이것은 그들의 최후의 반격이자 우리의 승패를 결정지을 순간이다!
dialogue_4134=놈들이 계속 상륙하고 있다... 셀 수 없는 함정들이 파도처럼 끊임없이 몰려오고 있다. 세상에, 놈들이 미쳤나? 방어선이 붕괴하고 있다! 우리는 곧 무너질 것이다! 명을 내려 주십시오... 명을 내려 주십시오...!
dialogue_4135=롬멜 원수는 지금 베를린에 계셔서... 아무도 우리에게 명령을 내릴 수 없으며, 원군도 없다. 우리는 스스로에게 의지할 수밖에 없다!
dialogue_4136=롬멜 원수께서 전선에 도착하셨다! 이제 우리가 반격할 차례다! 영국 해협은 그들의 무덤이 될 것이다!
dialogue_4137=병사들이여, 이제 놈들에게 똑똑히 보여주자. 독일의 병사들은 쓰러질지언정, 결코 무릎 꿇지 않는다는 것을. 단 한 명만 남더라도 이 해변은 쉽게 빼앗기지 않을 것이다.
dialogue_4138=병사들은 기도하고 있다. 그들은 더 이상 구호를 외치지 않고, 단지 살고 싶어 할 뿐이다.... 공기 중에는 화약, 휘발유, 바닷물, 그리고 타버린 고기 냄새가 뒤섞여 풍기고 있다.
dialogue_4139=해변이 함락되고, 상륙은 실패했다... 모든 부대에 함선으로 철수하라고 전하라. 우리는 이 전투에서 졌지만, 전쟁에서는 지지 않을 것이다. 언젠가 우리는 다시 돌아올 것이다.
dialogue_4140=이것이 우리가 저지른 가장 큰 실수다...... 곧 무너질 제국의 최후의 반격을 과소평가했다.
dialogue_4141=우리는 이 전투에서 승리한 것 같지만, 우리가 지키고자 하는 것이 정말 조국인가, 아니면 이미 영혼을 잃은 환상인가? 원수는 먼 곳에서 국경선을 그리고 있지만, 하나둘씩 쓰러지는 병사들의 모습은 본 적이 없다.
dialogue_4142=맹목적인 복종은 군인의 본능이지만, 이성적인 의심 또한 인간이 마땅히 가져야 할 권리이다. 언젠가 모든 사람이 사고하는 법을 배우게 된다면, 제국은 비로소 진정으로 구원받을 수 있을 것이다.
dialogue_4143=나는 저 건너편 사람들을 미워한 적이 없다. 그들 역시 명령에 의해 죽음을 맞이하러 온 아버지이자 아들일 뿐이다. 어쩌면 우리 사이의 가장 큰 차이는, 운명이 우리를 다른 방향에 배치했다는 것뿐일 것이다.
dialogue_4144=이 전투가 전쟁의 종점이 아니라 제국 재생의 시작점이 되기를 바란다.
dialogue_4145=나는 군인으로서의 맹세를 이행했다...... 적들이 베를린 땅 한 치라도 밟지 못하게 하라.

event_107=노르망디 방어선
event_intro_107=1944년 여름, 연합군은 영국에 전례 없는 병력을 집결시켰다. 포화와 강철은 하늘을 뒤덮는 노도가 되어 영국 해협 건너편으로 다시 발을 내딛을 준비를 했다. 프랑스 북쪽 해안에 주둔한 독일군은 조만간 닥쳐올 이 폭풍을 앞두고 모래 언덕과 콘크리트 벙커 사이에서 숨죽이고 기다렸다. 6월 6일 새벽, 노르망디 해면은 수많은 상륙정으로 인해 회백색으로 물들었고, 하늘에는 비행기의 굉음이 울려 퍼졌다. 독일군에게 이것은 단순한 방어전이 아니라, 운명과의 싸움이었다. 쏟아지는 포화 속에서 유럽의 운명은 이 해변에서 위태롭게 흔들렸고, 독일 병사들은 서부전선에서 가장 길고도 가장 고립된 하루를 맞이했다.

dialogue_4154=이번은 제한적 기습 작전이며, 최우선 임무는 시디 바라니와 그 주변의 이탈리아군 거점을 섬멸하고, 시디 바라니 해안을 신속하게 수복 및 장악하는 것이다.
dialogue_4155=시디 바라니 공략에 성공했고, 영국군은 대량의 이탈리아군을 포로로 잡았다.
dialogue_4156=계속 공격하라. 이탈리아 리비아 집단군이 대규모로 포로가 되었다. 적군의 준비가 절대적으로 부족하다. 우리는 전과를 더욱 확대해야 한다!
dialogue_4157=각 군단은 해안선을 엄격히 사수하라. 키레나이카는 결코 잃어서는 안 된다.
dialogue_4158=영국군의 공세가 너무 맹렬하다. 제10군을 키레나이카에 고립시킬 수는 없다. 각 부대는 정비하고, 키레나이카에서 철수할 준비를 하라.
dialogue_4159=아마도 우리는 사막을 가로지르면 벵가지 수비대가 서쪽으로 도주하는 것을 막을 수 있을 것이다.
dialogue_4160=여우가 개활지에서 사살되었다.
dialogue_4161=좋다. 각 부대에 "벵가지 부대가 괴멸되었으니, 전력을 다해 키레나이카를 점령하라."고 통보하라.
dialogue_4162=서부 사막의 적군을 격파하고, 그들을 토브룩 서쪽으로 몰아내라.
dialogue_4163=카푸초 요새 점령에 성공했다.
dialogue_4164=독일군은 88mm 포와 할파야 고개의 지형을 이용해 영국군의 공격을 성공적으로 막아냈다.
dialogue_4165=제15 기갑사단은 신속히 카푸초를 지원하고, 제5경사단은 영국군 후방에서 침투하여 할파야 고개를 지원하라.
dialogue_4166=독일군은 곧 우리의 퇴로를 차단할 것이다. 우리 부대를 포위당하게 해서는 안 된다. 전선에 "작전 목표를 포기하고 신속하게 철수하라."고 통보하라.
dialogue_4167=영국군이 할파야 고개를 성공적으로 탈환했다. 해안 도로의 요충지가 영국군 손에 돌아왔다.
dialogue_4168=좋다, 해안 도로를 따라 계속 진격하라.
dialogue_4169=각 부대에 작전 계획을 조정하여 "할파야 고개 지원을 중단하고, 전력을 다해 고개 서쪽의 적군 부대를 포위 섬멸하라."고 통보하라.
dialogue_4170=이번 전투에서 우리는 반드시 독일군을 격파하고 토브룩 포위를 뚫어야 한다.
dialogue_4171=제7 기갑사단의 병사들이여, 당신들의 임무는 시디 레제그 공항을 점령하고, 기회를 봐서 투브루크로 돌격하는 것이다.
dialogue_4172=시디 레제그를 성공적으로 탈환했다. 투브루크 수비군은 돌파를 준비하고 있다.
dialogue_4173=투브루크 공격 계획을 포기하고, 포위망을 유지하라. 시디 레제그를 신속히 탈환하라. 적들이 공습으로 포위망을 위협하게 두어서는 안 된다.
dialogue_4174=전사들이여, 버텨라! 지원 부대가 오고 있다. 우리는 반드시 이 공항에서 "여우"에게 피를 보게 해야 한다!
dialogue_4175=영군의 공격 부대가 너무 많다. 영군의 후방을 공격하여 그들이 철수하도록 압박할 수밖에 없다.
dialogue_4176=기갑 부대 병사들이여, 남부 사막 방향으로 우회하여 이집트로 진격하고, 영군의 후방 보급기지를 전력으로 파괴하여 변경 요새들을 구원하라.
dialogue_4177=기동 부대는 신속히 시디 레제그를 지원하고, 주력 부대는 해안을 따라 전력으로 토브룩을 향해 진격한다.
dialogue_4178=바르디아 부대는 투브루크 방향으로 철수하여, 투브루크 포위망을 강화하라.
dialogue_4179=전군은 계획대로 "남부는 양동 공격으로 적의 주의를 끌고, 북부는 우세 병력을 집결해 적 주력을 섬멸하라."
dialogue_4180=나는 요양을 위해 유럽으로 돌아가야 한다. 적은 조만간 대규모 작전을 벌일 것이니, 방어 계획에 따라 작전하라.
dialogue_4181=이탈리아-독일 기갑군의 임시 지휘관이 전사했다. 롬멜이 북아프리카로 복귀하여 군대를 재인수했다.
dialogue_4182=내가 기갑군의 지휘권을 되찾았다. 기갑 부대는 북쪽으로 집결하여 진지를 탈환할 준비를 하라!
dialogue_4183=남부 방어선을 포기하고, 질서있게 북부 해안선으로 철수하라.
dialogue_4184=제7 기갑사단은 북부로 이동하여 주공에 참가하고, 수퍼차지 작전을 개시하라.
dialogue_4185=수송 유조선이 침몰하자, 추축군은 연료 위기에 빠졌다.
dialogue_4186=연료 보급이 부족하여 부대 손실이 막대하다. 우리는 철수하여 전력을 보존해야 한다.
dialogue_4187=계속 공격하라. 해안 평원으로 진격하여 적의 보급선을 파괴하라!
dialogue_4188=해안 평원이 눈앞이다. 잠시 휴식 후, 해안 평원으로 진격할 준비를 하라!
dialogue_4189=기갑부대를 출동시켜라. 해안 평원의 보급선을 잃어서는 안 된다!
dialogue_4190=전장에 갑작스럽게 모래 폭풍이 몰아쳐 양측 모두 시야 확보에 어려움을 겪고 있다.
dialogue_4191=튀니지 전황이 불리해지자, 튀니지의 패배가 롬멜의 위신을 훼손하고 국내 여론을 동요시키는 것을 피하기 위해 롬멜을 북아프리카에서 철수시켰다.
dialogue_4192=나는 나머지 아프리카 주둔 독일군을 대표하여 연합군에 항복한다.
dialogue_4193=독일군이 격파된 후, 이탈리아는 메세에게 항복 명령을 내렸다.
dialogue_4194=나는 이탈리아 제1군을 대표하여 연합군에 항복한다.
dialogue_4195=사전 공습과 해군 함포 사격의 지원이 없었기에, 독일군은 우리의 기습 시기를 파악할 수 없다. 공격하라! 기습으로 독일군의 방어선을 무너뜨려라!
dialogue_4196=공격을 포기하라! 우리는 이미 너희들을 맞이할 준비를 마쳤다.
dialogue_4197=클라크의 잘못된 작전 계획 때문에 상륙 부대가 불리한 상황에 빠졌다.
dialogue_4198=젠장! 적이 이번 공격을 예측하다니. 즉시 해군에 통보하여 함포로 적의 반격을 제압하라!
dialogue_4199=해군 함포의 도움으로 연합군은 살레르노 상륙에 성공했다.
dialogue_4200=각 부대는 산악 지형에 의존하여 방어면서, 적의 진격을 지연시켜라.
dialogue_4201=나폴리를 포기하고, 각 부대는 겨울 방어선으로 철수하라.

