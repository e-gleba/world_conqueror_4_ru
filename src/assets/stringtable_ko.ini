;战役简介
;__font_type[font_text_]
stage_intro_10001=본 라운드에서 소개할 내용: 유닛의 이동 및 공격, 유닛의 생산, 유닛에 장군 임명, 회군 지령 및 승리 방법.
stage_intro_10002=본 라운드에서 소개할 내용: 사기가 부대에 미치는 영향, 방어 시설과 방공 시설 건설, 도시 점령 방법, 랜드마크 건설 및 도시 정보 열람.
stage_intro_10003=본 라운드에서 소개할 내용: 지형의 영향, 공군 사용, 핵 생산, 미사일 사용 및 해상 작전.
stage_intro_10004=이 관에서 소개해 드릴 것입니다：엘리트 부대의 스킬, 녹색 원（차순 중요 지점） 및 대피 지점의 기능입니다.
stage_intro_10101=최고 사령부로부터 폴란드 진격을 명 받았습니다. 사령부는 귀하와 귀하의 군대가 최대한 신속하게  폴란드의 외곽을 돌파하고 승리를 쟁취하길 바라고 있습니다. 귀하의 승전보를 기다리고 있겠습니다.
stage_intro_10102=최고 사령부에서 최근 입수한 정보에 따르면 영국이 노르웨이로 진군할 것으로 보이며 본국의 철광 공급에 위협을 가할 것이라고 합니다. 사령부가 귀하에게 "베저위붕 작전"을 명분으로 삼아 노르웨이와 덴마크에 군대를 파견하라는 명령이 내려왔습니다. 반드시 제국에게 필요한 물자를 수중에 넣으십시오.
stage_intro_10103=프랑스를 철저히 격파하기 위해 사령부에서 프랑스의 수도 파리를 목표로 지정했습니다. 프랑스는 이를 대비해 마지노선을 구축한 것으로 알려져 있으며 이는 우리의 프랑스 진격에 최대의 걸림돌이 될 것으로 예상됩니다. 그러나 이것만 무너뜨릴 수 있다면 프랑스는 종이호랑이에 불과할 것입니다.
stage_intro_10104=프랑스는 이미 항복했으며 영국은 이제 제국에 있어 최대의 적이 되었다고 할 수 있을 것입니다. 그들의 존재로 인해 우리가 동쪽으로 마음 놓고 진군할 수 없는 상황입니다. 최고 사령부로부터의 명령입니다. 영국 해협을 지나 영국을 철저히 격파하고 유럽 대륙을 그들의 위협으로부터 벗어나도록 만드십시오.
stage_intro_10105=최근 지중해에서 영국 해군의 활동이 점점 증가하고 있습니다. 이는 본국의 북아프리카 작전 계획에 영향을 미칠 뿐만 아니라 본토의 안전을 위협받는 상황이기도 합니다. 수상께서 귀하에게 지중해 통제권을 되찾아오라 명령하셨습니다. 지중해 통제권은 본국과 동맹국들에게 있어 매우 중요한 의의라 할 수 있습니다.
stage_intro_10106=동맹국들이 차례차례 승전보를 전해옴으로써 동맹국에 대한 수상의 신뢰가 두터워지고 있는 모양입니다. 수상님께선 로마 제국처럼 위풍 있는 태도를 중시하기로 결정하셨습니다. 수상님의 확장 정책에 따라 먼저 발칸 반도로 군사 행동을 전개할 것이며 본국의 동맹국인 루마니아와 불가리아가 우리에게 협조할 것입니다. 수상님께서 귀하의 승전보를 기다리고 계십니다!
stage_intro_10107=최고 사령부가 "바르바로사"작전을 시행하기로 결정했습니다. 이번 작전의 최종 목표는 소련의 수도 모스크바를 점령하는 것입니다. 동쪽으로 진군할 시 지속적으로 "전격전"을 펼치게 될 것입니다. 최대한 신속히 소련을 격파하십시오. 제국은 소련을 통해 본국에 절실한 자원인 풍부한 석유와 노동력 등을 얻길 원합니다.
stage_intro_10108=연합국의 진격이 우리가 수에즈 운하와 알렉산더 항구를 점령하는데 방해가 되고 있는 상황이며 아군의 보급 또한 상당히 불안정한 상황입니다. 우리는 반드시 그곳에 주둔하고 있는 연합군들을 격퇴해야 하며 그들의 보급선을 끊어놔야 합니다. 이렇게 해야만 북아프리카 전체를 우리의 통제권 아래 놓을 수 있습니다.
stage_intro_10109=레닌그라드는 소비에트 연방의 중요 도시 중 하나로 최고 사령부에서는 모스크바보다도 중요한 곳으로 여기고 있습니다. 이 도시를 탈취하는 것은 제국에 거대한 전략적 의의가 될 것입니다. 사령부가 북방의 모든 군단에 소집령을 내린 상황이며 핀란드군이 측면에서 우리를 도울 것입니다.
stage_intro_10110=소련군이 파울루스 장군의 6군을 겹겹으로 포위 중입니다. 최고 사령부로부터 지금 즉시! 어떤 대가를 치러서라도 구원에 성공하시라는 명령입니다. 사령부는 주변 군대에 증원 소집령을 내렸으며 구원 작전이 성공하는 동시에 스탈린그라드에 대한 통제권을 얻길 바라고 계십니다.
stage_intro_10111="바르바로사"작전의 부분적 실패는 적군을 과소평가했기 때문입니다. 최고 사령부는 제국의 유럽 정복 과정에 있어 별다른 지장이 없을 거라 여기고 있습니다. 이번 패배는 제국이 유럽을 정복하는 여정에 있어 한 걸음 정도 더뎌진 수준일 뿐입니다! 모스크바를 점령하여 "바르바로사"작전에서 미완성된 부분을 완성시키십시오.
stage_intro_10201=독일의 장갑 부대가 빠른 속도로 대부분의 연합군 방어선을 붕괴시켰다고 합니다. 현재 연합군의 주력은 독일군에 의해 됭케르크에서 포위당한 상황입니다. 후방의 영국 해협만이 유일한 퇴로입니다. 지휘부에서 내려온 명령입니다. 한시도 지체하지 말고 독일군의 공격을 저지하고 주력군 부대가 후퇴할 시간을 벌어라.
stage_intro_10202=됭케르크에서의 퇴각으로 인해 아군이 소유한 대부분의 장비를 모두 잃었습니다. 이로 인해 아군은 독일의 맹렬한 공격을 막아내기가 버거워졌음은 물론 반격할 여력조차 없어졌음을 의미합니다. 지휘부로부터 내려온 전령입니다. 얼마 남지 않은 장비들을 귀하와 귀하 주변 부대에 보급하였으며 그대들이 브리튼 최후의 희망이다.
stage_intro_10203=아군은 튀니지로 이동하는 여러 척의 독일 보급선을 격침하는데 성공하였습니다. 이로 인해 북아프리카에 주둔하고 있는 독일군들은 물자 보급이 어려워진 상황입니다. 이는 아군이 북아프리카로부터 독일군을 철저히 쫓아낼 좋은 기회입니다. 그러나 튀니지의 복잡한 지형과 독일군이 구축해둔 방어선으로 인해 이번 전투는 생각만큼 간단하지 않을 것으로 보입니다.
stage_intro_10204=아프리카 북부의 추축국 부대들은 이미 아군에게 패퇴하였으며 이제는 이탈리아를 철저히 몰아내야만 연합군이 지중해 통제권을 손에 넣을 수 있습니다. 지휘부의 명령입니다. 귀하와 소속 부대는 시칠리아로 진격하십시오. 이번 전투는 연합군이 유럽 대륙을 해방하는 첫걸음이 될 것입니다.
stage_intro_10205=사령부가 얻은 정보에 따르면 독일군이 대량의 화포와 전차를 집결시켰다고 합니다. 그들은 아군을 향해 대규모 진격을 준비하고 있는 모양입니다. 이번 전투는 장차 향후 형세에 영향을 미치리란 사실은 의심할 여지가 없습니다. 이는 귀하에게 있어 엄청난 시험이 될 것입니다. 조국을 위해 승리를 쟁취하십시오!
stage_intro_10206=독일군의 라디오 방송은 우리가 전쟁에서 승리할 수 없다고 얘기하고 있습니다. 그러나 아군은 연승을 눈앞에 두고 있으며 이는 매우 가소로운 이야기에 지나지 않습니다. 사령부의 명령입니다. 귀하는 키예프를 탈환하고 부대원의 사상을 줄이기 위해 아군은 화포를 밀집시켜 귀하의 진격을 도울 것입니다.
stage_intro_10207=우리의 선봉 부대가 벨로루시 지역에 다다랐다고 합니다. 이번 전투에서는 아군 지역 내에 있는 독일군들을 완전히 섬멸해야 합니다. 독일은 현재 예비 병력을 동원해 병력 손실을 보충하고 있습니다. 귀하께선 그들의 원군이 도착하기 전까지 서둘러 그들의 방어선을 돌파하고 조국의 모든 영토를 해방시키십시오
stage_intro_10208=전쟁을 빠르게 종식시키려면 아군은 유럽에서 새로운 작전을 벌여야만 할 것입니다. 지휘부는 최후의 진격 지점을 적군이 전혀 예상치 못한 장소인 노르망디로 결정했습니다. 이번 작전은 매우 오랫동안 준비해온 것으로 귀하의 일생에 있어 가장 큰 전투가 될 것입니다.
stage_intro_10209=아군은 단계적으로 승리를 거두고 있습니다. 지휘부로부터의 명령입니다. 귀하 및 소속 부대는 프랑스 남부 전역을 수복하고 프랑스에서 저항하는 독일군을 모두 섬멸하십시오. 남부의 항구를 재가동시키는 것이 이번 작전의 키워드가 될 것입니다.
stage_intro_10210=베를린을 점령하려면 먼저 라인강을 도하해야만 합니다. 지휘부 측에선 대규모 공수 활동을 전개하기로 결정하였습니다. 그러나 독일군이 최후의 보루를 그리 쉽게 포기할리 없습니다. 그러니 작전을 개시하게 되면 귀하와 소속 부대는 지옥을 향해 진군하는 형세가 될 것입니다.
stage_intro_10211=독일군은 그들이 가진 마지막 힘을 모두 끌어모아 수도인 베를린을 지키려 하고 있습니다. 연합군의 병력이 독일군보다 많은 것은 사실이나 배수의 진을 친 독일군이 필사적으로 반격할 것은 당연합니다. 지휘부는 귀하가 다른 국가들보다 먼저 베를린을 점령하길 바라고 있습니다.
stage_intro_10301=미국의 태평양 함대는 제국의 영토 확장에 최대의 걸림돌이라 할 수 있습니다. 반드시 그들을 섬멸해야 합니다. 아군은 도쿄 총사령부에서 계획한 기습작전을 따를 계획이며 기습지역은 미군의 진주만 해군기지입니다. 해상에서 제국의 항공모함 편대가 귀하를 도울 것입니다. 하와이를 점령하고 태평양 함대를 섬멸하십시오
stage_intro_10302=미국은 독일의 공격으로 인해 아시아 지역에 신경 쓸 겨를이 없는 상황입니다. 총사령부는 더 많은 자원 확보를 위해 귀하에게 영국의 식민지인 말레이반도와 싱가포르 공격을 명하였습니다. 영국의 함대는 엄청난 화력을 지니고 있으니 조심하십시오.
stage_intro_10303=영국군은 현지인의 도움으로 도로 하나를 닦았으며, 이 도로를 통해 끊임없이 물자를 운송하고 있습니다. 영국군과 대항하기 위해 본부에서는 버마를 공격하여 물자 운송 도로를 차단하라는 명령을 내렸습니다. 목표 진지를 탈취한 후 제국에서 도로를 통제할 수 있도록 반드시 진지를 지키십시오.
stage_intro_10304=총사령부는 다음 목표로 호주를 설정하였습니다. 그러나 호주로 진군하기 전에 아군은 주변 지역을 점령하고 방어 시설을 확충해야 합니다. 미국과 호주 사이의 보급선을 차단하십시오. 아군의 함대가 지정된 구역에 도착하면 상륙 작전을 개시하십시오.
stage_intro_10305=때가 이르렀습니다. 지금이 바로 호주로 진격하기 위한 절호의 기회입니다. 총사령부로부터의 명령입니다. 귀하와 소속 부대는 육로를 통해 연해 도시들을 모두 점령하십시오. 제국의 해군은 해상에서 귀하를 지원할 것입니다. 아군의 병력은 제한적이니 병력 손실을 최소화하십시오.
stage_intro_10306=제국이 임팔 지역에서 작전 수행에 실패하였으며 아군 부대의 피해는 심각한 수준입니다. 그러나 아군은 여전히 영국군으로부터 추격을 당하고 있는 상황입니다.  이로 인해 모든 전선이 궤멸당할 수 있는 상황입니다. 총사령부로부터의 명령입니다. 귀하는 즉각 독립적인 방어선을 구축하여 그들의 진격을 저지하십시오.
stage_intro_10307=독일과 소련의 전쟁은 막바지에 이른 것으로 보입니다. 독일은 소련을 서둘러 격파하길 원하며 시베리아의 소련 주력군을 효과적으로 견제하기 위해 아군이 극동지역에서 소련으로 진군해주길 바란다는 소식입니다. 아군과 소련군의 장갑 부대는 호각지세입니다. 조심하십시오.
stage_intro_10308=사령부에서 독일의 북미 지역 진군을 돕기 위해 다음과 같은 명령을 하달하였습니다. 먼저 캐나다로 진군하십시오. 이는 아군이 경험하는 최대의 원거리 해상작전이 될 것입니다. 그 후 캐나다의 해안 방어선을 돌파하십시오. 미군에게 발각되지 않도록 주의하십시오. 발각될 시 전후방으로 공격을 받게 될 것입니다.
stage_intro_10309=제국은 과거의 작전 실행을 통해 엄청난 전공들을 세워왔습니다. 그러나 미군은 여전히 건재합니다. 정보에 따르면 미군이 엄청난 위력의 신무기를 개발하는데 성공하였으며 이 무기 하나로 전쟁의 결과를 바뀔 수도 있다고 합니다. 총사령부로부터 시간이 촉박하니 지체 없이 미국 본토로 진군하라는 명령입니다.
stage_intro_10401=일본군은 진주만을 선전포고도 없이 기습적으로 공격하였습니다. 이런 행위는 우리와 전쟁을 선포한 것과 다름이 없습니다. 우리의 공항은 이미 폭파되었고, 정박한 함선들도 전투를 할 수 없는 상황입니다. 밖에서 순찰하던 함대는 우리의 마지막 희망입니다.
stage_intro_10402=대영제국의 부대는 말레이반도에서 일본군에게 큰 타격을 받았습니다. 이는 영국 사상 최대의 재앙입니다. 현재 일본군은 싱가포르를 상대로 새로운 공세를 계획하고 있습니다. 이는 지휘부가 용납할 수 없는 일입니다. 반격을 준비하십시오. 영국 해군은 도착하는 데로 전투에 가입할 것입니다.
stage_intro_10403=기술자들이 일본의 전보 암호를 해석하는데 성공하였습니다. 일본군은 미드웨이로 진군할 것으로 보입니다. 지휘부로부터의 명령입니다. 귀하는 원군이 도착할 때까지 미드웨이 섬을 방어하십시오. 아군의 항공모함 편대가 최대한 빠른 속도로 지원을 올 것입니다. 귀하가 만반의 준비를 할 수 있길 바랍니다.
stage_intro_10404=지휘부로부터의 명령입니다. 귀하의 부대는 과달카날 섬으로 진공하여 그곳의 일본기지를 점령하십시오. 만약 그곳을 손에 넣는다면 공군의 남태평양에 있는 모든 일본 기지를 공습할 수 있게 됩니다. 필리핀으로부터의 역습에 대비하십시오. 맥아더 장군이 그날이 오기만을 기다리고 있습니다.
stage_intro_10405=일본군이 임팔을 탈취하려던 계획이 실패하였습니다. 연합군은 그들에게 반격을 개시하기로 결정했습니다. 지휘부에서는 장마가 끝나면 버마의 일본군을 상대로 공격을 발동하라는 명령을 내렸습니다. 일본군은 질병에 시달리고 있으니 공격의 기회입니다.
stage_intro_10406=전면적인 반격이 시작되었습니다. 맥아더 장군이 아군에게 필리핀 점령을 제안하였습니다. 일본군의 운송로를 차단하고 그가 처음 했던 약속을 지키겠다고 합니다. 지휘부는 그의 제안을 받아들였으며 귀하가 맥아더 장군과 함께 이번 임무를 완수하라는 명을 내렸습니다.
stage_intro_10407=아군의 "공중요새"가 일본 본토를 효과적으로 폭격할 수 있도록 사령부는 귀하가 이오 섬을 점령하고 일본군의 공군 기지를 탈취하라는 명을 내렸습니다. 일본군이 이미 섬에 수많은 방어 시설을 설치해 두었다고 합니다. 이로 인해 아군은 진격 시에 엄청난 대가를 치르게 될 것이니 주의하십시오!
stage_intro_10408=미군은 일본 본토를 향해 최후의 진군을 시작하였습니다. 그러나 아군은 여전히 눈앞의 일본군으로 인해 여전히 발이 묶여있는 상황입니다. 이는 사령부에서 용인할 수 없는 일입니다. 귀하께선 최대한 빨리 일본군을 섬멸하고 미군이 일본 본토로 진군하기 전에 따라잡으십시오. 남은 시간이 그리 많지 않습니다.
stage_intro_10409=아군의 핵무기가 비록 일본에 치명적인 타격을 입혔으나 일본은 여전히 투항을 거부하고 있는 상황입니다. 이로 인해 지휘부는 일본 본토로의 진군을 명하였으며 이번 전투에서 상당히 고전할 것으로 예상됩니다. 일본 본토로의 강행군은 아군에 엄청난 사상자를 초래할 것입니다.  소련은 북쪽에서 진격을 시작해올 것이나 그들의 목표는 단순히 일본만이 아닌 것으로 보입니다.
stage_intro_10501=NATO의 함대가 인도양에 나타났습니다. 사령부에서는 그들이 페르시아 만에 진입하여 그곳에서 우리의 캅카스 지역 유전을 공격할 것이라고 판단했습니다. 그들을 격퇴하십시오. 중동 지역에 배치된 우리 부대는 이번 작전에 효과적인 도움을 제공할 것입니다.
stage_intro_10502=NATO가 아군의 캅카스 유전을 노린지는 꽤 오래되었습니다. 정보에 따르면 적군은 튀르키예 지역에 집결하여 아군의 유전을 공격할 것으로 보입니다. 사령부로부터의 명령입니다. 귀하가 부대를 이끌고 캅카스 지역으로 이동하여 그곳의 NATO의 부대를 섬멸하고 튀르키예로 진군하십시오.
stage_intro_10503=NATO는 우리가 튀르키예를 점령하는 모습을 눈 뜨고 지켜보지만은 않을 것입니다. 그들은 지중해에 함대를 집결시키기 시작했으며 우리의 군사 활동을 저지하려 할 것입니다. 튀르키예를 점령하고 NATO의 함대를 섬멸하십시오. 사령부에서는 이번이 지중해 통제권을 손에 넣을 수 있는 적기라고 생각하고 있습니다.
stage_intro_10504=NATO는 우리가 북미 및 지중해 지역에서 유럽 각국의 이익을 침탈하고 있다고 주장합니다. 이로 인해 미국의 인도하에 서유럽 각국이 연맹을 조성하여 우리에게 진격하려 한다는 소식입니다. 그러므로 아군은 다음 전쟁에서 반드시 승리를 거둬야 할 것입니다. 아군은 매우 불리한 상황에 처해있으며 유럽 전체와 맞서야 하는 상황입니다.
stage_intro_10505=유럽의 동맹국들을 잃고 난 후 미국은 아시아로 시선을 돌린 것 같습니다. 아시아에서 새로운 동맹국을 찾고 세력을 양성할 것으로 보입니다. 그들이 아시아에서 새로운 우익들을 양성하는데 성공하면 아군에겐 더 큰 위협이 될 것입니다. 그러므로 사령부의 명은 다음과 같습니다. 귀하는 미국 서해안으로 출진하여 미군과 아시아의 연결을 차단하십시오.
stage_intro_10506=NATO와의 전쟁에서 몇 차례 중요한 승리를 거둔 후 아군의 형세는 유럽, 아시아, 아프리카에까지 영향력을 뻗치고 있습니다. 미국은 아군의 마지막 목표이며 미국을 격파하기만 하면 아군은 이후의 모든 전쟁에서 승리할 수 있습니다. 귀하께선 기술과 군사력을 막론하고 세상에서 가장 강력한 국가와 맞서게 될 것입니다.
stage_intro_10601=소련이 동부 전선에서 독일을 철저히 격파한 후 거대한 야심을 드러내기 시작했습니다. 그들이 유럽 각국에 엄청난 피해를 입은 때를 틈타 엄청난 이익을 손에 넣은 사실이 드러났습니다. 현재는 유럽의 어느 국가도 강대한 소련군을 상대할 수 없는 상황입니다. 이로 인해 귀하께선 반드시 유럽의 기타 국가들을 연합하여 소련의 확장을 저지해야 합니다.
stage_intro_10602=한반도에서 전면 전쟁이 벌어졌습니다. 한국의 수도 서울이 북한에 의해 함락당했다고 합니다. 이는 아군이 아시아에서 얻을 수 있는 이익이 위협받고 있음을 의미합니다. 지휘부는 맥아더 장군의 건의를 받아들여 아군의 증원 부대를 인천에 상륙시키기로 결정하였습니다. 경계를 늦추지 마십시오. 우리의 적은 북한군만이 아닙니다.
stage_intro_10603=정보에 의하면 소련이 최근 쿠바와 멕시코에 대량의 미사일을 배치했다고 합니다. 이는 본국에 거대한 위협이 됩니다. 지휘부의 명령은 다음과 같습니다. 귀하께선 즉각 부대를 통솔하여 쿠바로 이동한 후 그곳의 주둔군을 섬멸하고 미사일 발사대를 점령하십시오.
stage_intro_10604=소련은 중동 국가의 석유를 탈취하기 위해 수에즈 운하를 봉쇄했다고 합니다. 이 같은 행위는 본국의 지중해 및 중동에 대한 군사 배치에 영향을 미칠 것입니다. 지휘부는 귀하께서 우리의 동맹국인 영국과 연합하여 중동을 지원하길 바랍니다. 소련을 중동에서 몰아내고 수에즈 운하를 수복하십시오.
stage_intro_10605=정보에 의하면 소련군은 몇 주 만에 폴란드로 만대의 전차를 집결시켰다고 합니다. 지휘부는 소련군의 전면 공격이 곧 시작될 것으로 보고 있습니다. 아군은 반드시 유럽을 지원해야 합니다. 지휘관 각하께선 강력한 무기들과 맞서 싸우셔야 합니다.
stage_intro_10606=아군은 비록 소련을 격파하는데 성공하였으나 소련의 이렇게 항복을 해오니 아군으로서는 의심스러운 부분이 한두 가지가 아닙니다. 정보 조직에 의하면 소련은 일찍부터 남극 비밀 기지에서 신무기 개발 작업을 진행해오고 있었다고 합니다. 지휘부로부터의 명령입니다. 귀하께선 남극으로 이동하여 그들을 찾아내십시오. 그들의 신무기는 아군에게 큰 위협이 될 것입니다.
stage_intro_10701=중동에 있는 우리의 유전이 적의 공격을 받아 점령당했습니다. 이로 인해 국제 유가가 전에 없을 만큼 많이 치솟았다고 합니다. 지휘관 각하, 비록 적에 대한 정보가 불분명한 상황이라 성급히 공격을 했다간 엄청난 손실을 초래할 수도 있겠지만 아군은 서둘러 이 유전들을 수복해야 합니다. 그렇지 않으면 더 많은 국가들이 위기에 처하게 될 것입니다.
stage_intro_10702=신비세력의 맹렬한 공격으로 인해 유럽은 최악의 상황을 겪고 있습니다. 유럽은 세계 경제의 중심이기 때문에 신속히 평화를 되찾아야 합니다. 지휘관 각하, 부대를 이끌고 유럽으로 이동하여 신비세력을 철저히 섬멸하십시오.
stage_intro_10703=서유럽에서 실패를 겪은 후 그들은 군대를 이끌고 동쪽으로 이동하기 시작했습니다. 이는 경제가 붕괴된 소련에게 있어 거대한 위기라고 할 수 있습니다. 지휘관 각하, 소련은 절대 적군에게 패배해서는 안 됩니다. 소련은 아군이 차후에 적군에 반격을 가하는 데 있어 중요한 국가 중 하나이기 때문입니다.
stage_intro_10704=북미 지역은 아주 이른 시기에 엄청난 타격을 받은 지역 중 하나입니다. 뉴욕은 적군이 공격하고자 하는 주요 대상입니다. 현재 유럽의 승리로 인해 뉴욕에 가해지는 압박이 많이 감소된 모양입니다. 지휘부는 이 기회를 통해 반격을 개시할 예정입니다. 적군을 자유의 땅에서 몰아내십시오
stage_intro_10705=국제 연합은 신비세력을 테러리스트로 지정하였습니다. 그들은 우리의 국가와 가족을 위협하는 존재입니다. 아군은 반드시 세계 각지에 흩어져 있는 테러리스트들을 소멸시켜야 합니다. 끊임없는 승리로 인해 아군은 갈수록 많은 지지를 받고 있습니다. 그들을 섬멸하는 것은 시간문제입니다.
stage_intro_10706=시베리아는 풍부한 자원을 가지고 있습니다. 정보에 따르면 테러리스트들이 그곳에서 아시아 각국을 침공하기 위한 비밀 기지를 건설 중이라고 합니다. 지휘부는 이 기지를 반드시 파괴해야 합니다. 그러나 시베리아의 열악한 자연환경이 그들의 보호막 역할을 해주고 있는 모양입니다. 이번 작전은 생각보다 힘들 것으로 예상됩니다.
stage_intro_10707=그들의 행동은 아군이 예상했던 것보다 많이 빨랐습니다. 시베리아 기지가 파괴된 후 그들은 남아있는 부대를 모아 아시아의 여러 기지로 진격시킨 것으로 보입니다. 비록 그들의 수는 적으나 남아있는 병력은 모두 정예군입니다. 남아 있는 최후의 적들을 상대하기가 쉽지만은 않을 것입니다.
stage_intro_10708=아군은 워싱턴에서 퇴각하는 테러리스트들을 미행하였습니다. 그들은 각자 흩어져 퇴각하다가 남미 지역에서 다시 집결한 것으로 보입니다. 지휘부는 그곳에 테러리스트들의 사령부가 있을 것으로 보고 있습니다. 지휘관 각하, 결전의 시간이 다가왔습니다. 세계의 평화를 위해 그들을 섬멸하십시오!
stage_intro_10709=아군이 너무 방심했습니다. 테러리스트들이 소련이 남긴 남극 군사 기지를 이용할 줄은 생각지도 못했으니까요. 게다가 일찍이 소련이 성공하지 못했던 연구개발을 완성해냈다고 합니다. 이것이 그들의 기술적 원천으로 보입니다. 지금의 남극 기지는 그들의 지배하에 요새화되었다고 합니다. 그러나 아군은 반드시 진격해야 하며 이런 기술들이 절대로 테러리스트들의 손아귀에 들어가게 둬선 안 됩니다.



;序章对话
;__font_type[font_text_]
stage_dialogue_1=지휘관 각하, 귀하께선 전장에 들어가시기 전에 기본 조작 학습을 하실 수 있으시며 이를 통해 조작법을 쉽게 이해하실 수 있습니다.
stage_dialogue_2=저는 귀하에게 조작법과 전술에 대해 상세히 알려드릴 것입니다.
stage_dialogue_3=만일 귀하께서 모든 조작법에 익숙하시다면 이 부분은 넘어가셔도 됩니다.
stage_dialogue_4=최고 지휘관께서 작전 명령을 하달하셨습니다. 아군은 끊임없이 전선을 향해 나아가야 합니다. 적군은 현재 우리의 새로운 전술에 속수무책으로 당하고 있습니다. 미래의 제국에 대한 판도가 끊임없이 커질 것으로 보입니다. 지휘관 각하, 지금 즉시 전장으로 이동하여 영광을 쟁취하십시오.
stage_dialogue_5=독일군의 장갑 부대가 마지노선을 건넜습니다. 많은 도시들이 적군에 의해 점령되었다고 합니다. 지휘관 각하, 독일군이 아군을 포위하려 하고 있습니다. 형세가 매우 위험한 상황입니다. 지금 저희는 새로운 방어선 구축이 시급합니다. 귀하께서 저희를 통솔하여 침략자들로부터 승리를 쟁취해주십시오.
stage_dialogue_6=비록 미국이 우리에게 선전포고를 한 적은 없으나 본국에 물자 운송금지 정책을 시행하고 있습니다. 전쟁을 장기간 끌고 갈 순 없을 겁니다. 반드시 우리가 먼저 미국을 공격해야 합니다. 지휘관 각하, 미국의 태평양 함대를 소멸시키는 것만이 우리가 생존할 수 있는 유일한 방법입니다. 여기에 제국의 운명이 걸려있습니다.
stage_dialogue_7=일본이 극동에서 대규모 군사 행동을 벌였다고 합니다. 일본이 우리 연합국의 영토를 점령하였다고 합니다. 그들의 다음 목표는 태평양 지역 전체입니다. 지휘관 각하, 지금 그들을 막지 않으면 안 됩니다. 대통령님께서 동원령을 내리셨다고 합니다. 정의는 언제나 승리하는 법입니다.
stage_dialogue_8=미국이 서유럽 국가들과 손을 잡고 새로운 군사 동맹을 맺었다고 합니다. 이는 틀림없이 저희를 겨냥한 움직임으로 보입니다. 그들의 지도자들은 번번이 공개 연설을 통해 우리에게 적의를 표출해 왔습니다. 지휘관 각하, 총서기 동지가 그들의 행위에 대해 강력한 불만을 표출하고 있습니다. 저희가 가진 수단을 총동원하여 그들에게 맞서야 합니다. 그것이 설령 전쟁이라도 말이죠!
stage_dialogue_9=비록 대전이 막을 내린 지 오래되었으나 소련군의 군수 공장에서는 여전히 신무기를 개발 중이라고 합니다. 소련군은 전세계에서 가장 많은 전차를 보유하고 있으므로 일단 전쟁이 발생하게 되면 이 전차들로 인해 유럽 전체가 공황에 빠질 수도 있습니다. 최근 그들이 우리와 가까운 지역에 미사일을 배치하였습니다. 지휘관 각하, 당신은 우리의 안전을 위해 어떻게 하시겠습니까?
stage_dialogue_10=처음 그들이 작은 조직이었던 시절에는 각국 지도자들의 관심을 끌지 못했습니다.
stage_dialogue_11=세계 경제가 쇠퇴하면서 그들은 빠른 속도로 일어나기 시작했고 종교라는 미명하에 실직자들과 퇴역 군인들을 모집하기 시작했습니다.
stage_dialogue_12=그들은 각국의 무기상들로부터 무기를 사들이는 동시에 기술자들을 불러들여 각종 고급 장비 등을 연구하였습니다.
stage_dialogue_13=그들은 그 후로 수년간에 걸쳐 암살 혹은 전쟁 등을 통해 많은 국가와 지역들을 장악해냈습니다.
stage_dialogue_14=지금 그들의 세력은 전 세계에 널려 있는 실정입니다. 지휘관 각하, 각국의 지도자들이 연합하여 그들에게 선전포고를 했다고 합니다.
stage_dialogue_15=그들을 물리쳐야만 이 세계에 평화가 찾아올 것입니다.




