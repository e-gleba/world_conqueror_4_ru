elite_intro_48=브란덴부르크 특수 부대는 특별한 훈련을 받았고 특수 장비를 갖춰 임무 반경이 넓고 유연성이 뛰어납니다. 이를 통해 그들은 적의 전선 뒤에서 비밀 작전을 수행하여 적에게 혼란과 손실을 입혔습니다.
elite_intro_49=호크아이 부대는 뛰어난 인내심과 침착함으로 고도의 사격 솜씨로 유명합니다. 그들의 주요 임무는 적의 지휘 구조를 파괴하고 적의 전투 능력을 감소시키기 위해 정밀 저격 소총을 사용해 적의 중요 표적을 사격하는 것입니다.
elite_intro_50=전장에서 의무병들은 유난히 힘들고 위험한 근무 환경에 직면해 있습니다. 적의 총성과 폭발 속에서 부상자들에게 생명을 걸고 응급처치를 하는 경우가 많아 뛰어난 작전 능력을 발휘합니다. 그들의 이타적인 헌신과 전문성은 전장에서 부상당한 군인들에게 희망을 줍니다.
elite_intro_51=M7 프리스트는 미국이 개발한 자주포로 2차 세계대전 당시 많은 전투에서 중요한 역할을 했습니다. 105mm 곡사포가 장착되었고 포탑이 차체 후면에 위치해 포병이 목표물을 더 잘 관찰하고 조준할 수 있었습니다.
elite_intro_52=슈베어 구스타프는 2차 세계대전 당시 독일 중포 설계에서 최상급의 성능으로 설계되었습니다. 800mm 구경 배럴, 무게 1,350톤을 통해 47킬로미터 떨어진 목표물에 7톤 포탄을 발사할 수 있었습니다. 그 엄청난 힘 때문에, 구스타프 열차포는 주로 요새와 도시와 같은 중요한 목표물을 공격하는 데 사용되었습니다.
elite_intro_53=BM-21 "그라드" 로켓포는 냉전 시대 소련이 설계한 122mm 구경 다연장 로켓포입니다. 트럭 차대 위에 제작되었으며 신속한 전개와 철수가 가능합니다. 또한 단기간에 목표 지역에 일제 사격을 가할 수 있어 화망을 만들고 적의 전선에 큰 파괴를 가할 수 있습니다.
elite_intro_54=T-44 전차는 T-34 전차 시리즈의 개선된 버전입니다. 이는 화력, 기동성 및 방어력을 향상시키도록 설계되었습니다. 특히, T-34의 자랑스러운 경사 장갑을 물려받았고, 그 설계는 이후 전차 개발에 지대한 영향을 미쳤습니다.
elite_intro_55=쾨니히스 티거 중전차는 연합국 전차의 갑옷을 쉽게 뚫을 수 있는 88mm 구경의 전차포가 장착되어 있었습니다. 그 강력한 화력과 중장갑 방어력은 전차 기술의 발전을 증명했고 2차 세계 대전 동안 독일 전차 설계의 정점이 되었습니다.
elite_intro_56=M26 퍼싱 중전차는 2차 세계대전 말 미군이 독일 티거 전차에 대항하기 위해 고안한 것입니다. 90mm 구경의 전차포를 장착하고 적절한 기동성을 갖추었습니다. 전쟁 후에도 여전히 일부 분쟁과 군사 작전에 사용되었습니다.
elite_intro_57=스핏파이어는 뛰어난 기동성, 속도 및 화력으로 유명했습니다. 지속적인 개선을 거쳐 영국 본토 항공전에서 상당한 명성을 얻은 후 유럽, 북아프리카 및 아시아 전선으로 이동하여 2차 세계 대전에서 가장 중요하고 대표적인 영국 전투기 중 하나가 되었습니다.
elite_intro_58=슈투카 폭격기 특유의 이중 접이식 날개 구조로 급강하 폭격 시 안정성과 정밀성이 뛰어나고, 2차 세계대전 초기 강력한 지상공격력을 발휘했으며, 랜딩기어에 장착된 '제리코의 나팔'은 특유의 포효 소리를 내 적에게 강한 심리적 스트레스를 안겨줍니다.
elite_intro_59="스카이트레인"으로도 알려진 C-47은 다양한 가혹한 조건에서 수송 임무를 수행할 수 있는 신뢰할 수 있고 적응력이 뛰어난 항공기입니다. 2차 세계 대전 동안 많은 전투에서 중요한 역할을 하며 군인, 보급품 및 장비를 운반하는 데 널리 사용되었습니다.
elite_intro_60=뛰어난 잠수 능력과 전투 성능을 갖춘 7형 유보트는 대서양 해전에서 중요한 역할을 수행했습니다. 그들은 여러 잠수함이 협력하여 연합국 함대와 상선에 파괴적인 공격을 가하는 늑대전술을 사용하여 눈부신 결과를 얻었습니다.
elite_intro_61=HMS 프린스 오브 웨일스는 2차 세계 대전 동안 영국 왕립 해군의 중요한 전함이었습니다. 강력한 화력과 견고한 장갑은 해전에서 강력한 화력 지원과 방어 능력을 제공할 수 있게 했습니다. 이 배는 비스마르크에 손상을 입히고 후퇴하게 만드는 데 성공했습니다.


