feat_desc_152=육군 또는 해군 유닛에게 피격 시 {1}% 확률로 피해 회피, 공습 피격 시 {2}% 확률로 피해 회피(미사일 및 핵폭탄 제외).
feat_desc_153=헬리콥터 공격 시 피해량 {1}% 증가. 이동 후 다음 턴 이동력이 {2}포인트 감소(최소 2칸 이동 가능), 아군 도시 또는 공병 부대 인접 1칸 내에서 1턴 간 정비 후, 모든 이동력 회복.
feat_desc_153_Lv2=헬리콥터 공격 시 피해량 {1}% 증가. 이동 후 다음 턴 이동력이 {2}포인트 감소(최소 2칸 이동 가능), 아군 도시 또는 공병 부대 인접 1칸 내에서 1턴 간 정비 후, 모든 이동력 회복.
feat_desc_153_Lv3=헬리콥터 공격 시 피해량 {1}% 증가. 이동 후 다음 턴 이동력이 {2}포인트 감소(최소 2칸 이동 가능), 아군 도시 또는 공병 부대 인접 2칸 내에서 1턴 간 정비 후, 모든 이동력 회복.
feat_desc_153_Lv4=헬리콥터 공격 시 피해량 {1}% 증가. 이동 후 다음 턴 이동력이 {2}포인트 감소(최소 2칸 이동 가능), 아군 도시 또는 공병 부대 인접 2칸 내에서 1턴 간 정비 후, 모든 이동력 회복.
feat_desc_154=장갑, 포병 유닛에 대한 데미지 +{0}%. 목표 공격 후, 처치하지 못했을 경우 1턴 간 '견제' 효과 부여. 목표를 처치했을 경우 자신은 재공격 가능. 단, 데미지 {1}% 감소. 턴당 최대 {2}회 발동.
feat_desc_154_Lv2=장갑, 포병 유닛에 대한 데미지 +{0}%. 목표 공격 후, 처치하지 못했을 경우 1턴 간 '견제' 효과 부여. 목표를 처치했을 경우 자신은 재공격 가능. 단, 데미지 {1}% 감소. 턴당 최대 {2}회 발동.
feat_desc_154_Lv3=장갑, 포병 유닛에 대한 데미지 +{0}%. 목표 공격 후, 처치하지 못했을 경우 1턴 간 '견제' 효과 부여. 목표를 처치했을 경우 자신은 재행동 가능. 단, 데미지 {1}% 감소. 턴당 최대 {2}회 발동.
feat_desc_154_Lv4=장갑, 포병 유닛에 대한 데미지 +{0}%. 목표 공격 후, 처치하지 못했을 경우 1턴 간 '견제' 효과 부여. 목표를 처치했을 경우 자신은 재행동 가능. 단, 데미지 {1}% 감소. 턴당 최대 {2}회 발동.
feat_desc_155=장갑, 화포, 해군 유닛에게 입히는 피해 {2}% 증가.
feat_desc_155_Lv2=최대 공격 사거리 +{1}, 장갑, 화포, 해군 유닛에게 입히는 피해 {2}% 증가.
feat_desc_155_Lv3=최대 공격 사거리 +{1}, 장갑, 화포, 해군 유닛에게 입히는 피해 {2}% 증가.
feat_desc_155_Lv4=최대 공격 사거리 +{1}, 장갑, 화포, 해군 유닛에게 입히는 피해 {2}% 증가.
feat_desc_156=본 턴 공격 시 피해를 입히면, 대상 주변 1칸 내 최대 {1}개의 유닛에게 추가로 {2}%의 피해를 줍니다. 보병이 아닌 유닛을 우선 타격합니다. 지속 시간 1턴. 쿨타임 3턴.
feat_desc_156_Lv2=본 턴 공격 시 피해를 입히면, 대상 주변 1칸 내 최대 {1}개의 유닛에게 추가로 {2}%의 피해를 줍니다. 보병이 아닌 유닛을 우선 타격합니다. 지속 시간 1턴. 쿨타임 3턴.
feat_desc_156_Lv3=본 턴 공격 시 피해를 입히면, 대상 주변 2칸 내 최대 {1}개의 유닛에게 추가로 {2}%의 피해를 줍니다. 보병이 아닌 유닛을 우선 타격합니다. 지속 시간 1턴. 쿨타임 2턴.
feat_desc_156_Lv4=본 턴 공격 시 피해를 입히면, 대상 주변 2칸 내 최대 {1}개의 유닛에게 추가로 {2}%의 피해를 줍니다. 보병이 아닌 유닛을 우선 타격합니다. 지속 시간 1턴. 쿨타임 2턴.
feat_desc_157=공격 후 추가 공격 가능, 최대 {1}회.
feat_desc_157_Lv4=공격 후 추가 공격 가능, 최대 {1}회. 해당 턴 내 매번 공격 후 다음 공격의 데미지 20% 증가, 최대 3회까지 중첩 가능.

