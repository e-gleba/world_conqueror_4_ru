armygroup_event_desc_123=소련군은 베링 해협 북부에서 처음으로 얼음 장막을 돌파하고 알래스카에 상륙하여 노옴을 점령했다. 이로써 미·소 양국 간의 전면전이 다시금 발발했다.
armygroup_event_desc_124=미국, 영국, 프랑스를 주축으로 한 나토군은 한반도에 대한 공세를 다시 개시했으며, 한국과 일본의 지원 하에 북상했다. 조선인민군은 완강히 저항했고, 소련군은 극동 지역으로 끊임없이 병력을 증파하여 전선을 소비에츠카야 가반 일대에 고착시켰다.
armygroup_event_desc_125=극동과 알래스카에 잠복해 있던 검은 전갈 부대가 각지에서 포섭한 무장 세력과 결탁해 본격적인 행동에 나섰으며, 각국 군대의 후방에서 기습을 감행했다.
armygroup_event_desc_126=미국·영국·호주·소련 다국적 해군이 검은 전갈 함대를 추격하던 중, 베링해 중부에서 강력한 전자기 폭풍에 휘말렸다. 그 과정에서 이전에 알려지지 않았던 첨단 시설이 완비된 섬이 모습을 드러냈다. 태평양에 위치한 검은 전갈 본부는 다국적 함대의 포위 공격을 받았다.
armygroup_event_desc_127=미국·영국·호주·소현 연합 특수임무부대는 베링해 전역의 검은 전갈 기지를 향해 해공 입체 타격 작전을 전개했으며, 검은 전갈의 주요 요새들이 차례로 파괴되었다.
armygroup_event_desc_128=검은 전갈 프로스트 군단의 지휘 체계가 붕괴되자 막대한 군사 원조를 잃은 극지 자원병단은 항복 후 바르샤바 조약기구에 재편입되었다.
armygroup_event_desc_129=검은전갈 에버나이트 군단의 지휘 체계가 붕괴되자 북부 자유 동맹 내부에 혼란이 발생했고, 대규모 탈영병이 속출하며 부대는 항복 후 나토에 재편입되었다.
armygroup_event_desc_130=검은 전갈 다크타이드 군단의 지휘 체계가 붕괴되자 태평양 해방 전선은 다국적군에 포위되었으며, 결국 항복하여 나토에 재편입되었다.
armygroup_event_desc_131=검은 전갈 세력이 다시금 급격히 확장되자, 미소 양국은 이 위협을 뿌리 뽑기 위해 손을 잡기로 결정했다. 바르샤바 조약기구와 나토는 잠정 휴전하고 새로운 군사 동맹을 결성했다.
armygroup_event_desc_132=결국 오스본은 완전히 패배했고, 검은 전갈의 극동 지역 계획은 수포로 돌아갔다. 그러나 각지에 흩어진 검은 전갈 잔존 세력은 여전히 존재하며, 주변 국가와 지역을 끊임없이 위협하고 있다.
armygroup_event_desc_133=소련군 조종사가 최첨단 전투기를 몰고 일본으로 망명하여 착륙했다. 미국은 즉각 그의 정치적 망명을 허가했으며, 미일 합동 기술진은 해당 전투기를 분해하여 세부 기술을 면밀히 분석했다.
armygroup_event_desc_134=시베리아 야쿠트 지역의 정오, 하늘이 갑자기 어두워지더니 약 3시간 동안 암흑이 지속되었다. 대규모 산불로 발생한 짙은 연무가 동쪽으로 확산되면서 인근 부대의 작전 수행에 심각한 영향을 미쳤다.
armygroup_event_desc_135=알래스카 침공 이후, 미군과 캐나다군은 대규모 반격 작전을 전개했다. 앵커리지 북부에서 여러 세력이 얽힌 혼전이 벌어졌고, 이로 인해 소련군의 진격 기세가 꺾였다.
armygroup_event_desc_136=검은 전갈이 배후에서 지원하는 북부 자유 동맹은 페어뱅크스 공군 기지와 앵커리지 항구를 동시에 습격했다. 이들은 소련군이 정면 공격을 수행하는 틈을 타 미군의 후방을 점령하고, 알래스카의 주도권을 먼저 장악하려 했다.
armygroup_event_desc_137=퉁구스카 강 인근에서 다시 한번 강력한 폭발이 발생했다. 운석의 공중 폭발로 인해 광활한 삼림이 초토화되었으며, 사건 발생 후 수일 동안 아시아와 유럽의 밤하늘은 암적색으로 물들었다. 전 세계의 위성이 이 과정을 기록했다.
armygroup_event_desc_138=영국과 프랑스 특수부대로 구성된 연합 특수임무부대가 쿠릴 열도에 잠입하여 검은 전갈의 비밀 통신 중계소를 수색하고 파괴했다. 이 작전으로 인해 다크타이드 군단과 태평양 해방 전선 사이의 통신이 일시적으로 차단되었다.
armygroup_event_desc_139=미소 양국 해군은 베링 해협의 세인트로렌스섬 인근에서 대규모 해공전을 벌였다. 양측 모두 수많은 전투기와 폭격기를 투입하여 치열한 소모전을 펼쳤다.
armygroup_event_desc_140=전쟁이 교착 상태에 빠지자, 미소 양국 내부의 숙청 운동은 더욱 잔혹해졌다. 상대국이 심어 놓은 간첩을 색출하고 검은 전갈에 포섭된 의심 부대를 제거하는 과정에서 수많은 억울한 희생자가 발생했다.
armygroup_event_desc_141=핵탄두를 탑재한 소련 잠수함 한 척이 베링해 전구로 향하던 중 갑자기 교신을 끊고 검은 전갈이 장악한 '유령섬' 방향으로 항로를 변경했다.
armygroup_event_desc_142=검은 전갈 다크타이드 군단은 삿포로에서 철수하기 직전, 현지의 원자력 발전소를 파괴했다. 막대한 양의 방사능 오염수가 바다로 유입되어 주변 해양 생태계가 파괴되었고, 여러 항구는 장기간 봉쇄되었다.
armygroup_event_desc_143=아군의 지원 하에 소련군은 마가단 지역의 극지 자원병단이 점거한 전략 미사일 기지를 향해 맹공을 퍼부었으며, 이는 참혹한 시가전으로 이어졌다.
armygroup_event_desc_144=태평양 해방 전선은 삿포로 남부와 하코다테 주변에서 협동 공격을 전개하여, 홋카이도와 일본 혼슈 사이의 연결망을 차단하는 데 성공했다.
armygroup_event_desc_145=한국군은 미군 고문단의 지원 하에 타타르 해협 서안의 소련 극동 요충지인 소비에츠카야 가반 항구를 향해 기습 작전을 감행했다.
armygroup_event_desc_146=캄차카반도의 활화산들이 동시에 분화하며 빙하 아래의 용암이 솟구쳐 올랐다. 이로 인해 각 진영의 군사 배치 계획은 전면적인 차질을 빚게 되었다.
armygroup_event_desc_147=알래스카만과 베링해 남부 해역에서 동시에 발생한 지진으로 강력한 쓰나미가 알래스카 남부 해안을 휩쓸었으며, 수많은 군사 시설과 장비가 파괴되었다.
armygroup_event_desc_148=페어뱅크스 상공에 비정상적인 오로라가 출현하여 범위 내 전투기의 사격 통제 레이더를 포함한 모든 전자 장비가 일시적으로 마비되었다.
armygroup_event_desc_149=비정상적인 한파가 추코트카 해안을 강타하며 기온이 급격히 하강했다. 각 부대는 긴급 대응에 나섰으나 인명 및 장비 손실을 피할 수 없었다.
armygroup_event_desc_150=소련의 미사일과 전략 폭격기의 위협에 대응하여 미국과 캐나다는 알래스카에서 캐나다 내륙에 이르는 조기 경보 시스템을 통합 및 강화했으며, 긴밀한 북미 방공 연맹을 구축하여 공동 방어 능력을 격상시켰다.
armygroup_event_desc_151=방대한 군사적 수요는 전자, 컴퓨터, 항공우주 분야의 기술 혁신을 촉발했다. 이러한 기술은 캘리포니아 등의 산업 단지를 통해 빠르게 민간 영역으로 전환되었으며, 미국이 새로운 기술 및 경제 경쟁에서 승기를 잡는 발판이 되었다.
armygroup_event_desc_152=소련은 경제상호원조회의 체제를 통해 몽골, 조선 등의 동맹국에 경제 원조와 에너지, 시장을 제공함으로써 사회주의 진영 내부의 경제적 유대와 안정을 유지했다.


event_4114=해바라기 작전
event_4115=제3차 하르키우 전투
event_4116=춘계 공세
event_4117=마타판곶 해전
event_4118=텐고 작전
event_4119=홀란디아 전투

event_intro_4114=이탈리아군이 북아프리카 전선에서 영국군을 상대로 연이어 패배하자, 독일 국방군 최고사령부는 2월 6일 전황 안정을 위해 개입을 결정했다. 이후 수개월 동안 독일군 부대(이 병력은 훗날 아프리카 군단으로 재편됨)가 북아프리카에 순차적으로 도착하며 이탈리아군의 붕괴는 단숨에 만회되었다. 롬멜의 공세적인 의사결정은 거대한 성공을 거두었으나, 지나치게 길어진 보급선은 이후 벌어질 장기 소모전의 복선이 되었다.
event_intro_4115=소련군은 스탈린그라드 전투에서의 승리를 발판 삼아 추격을 이어갔다. 만슈타인은 정면 방어를 포기하고, 먼저 성급히 진격해 온 소련 서남전선군을 기동부대로 격파한 뒤 북상하여 치열한 시가전을 거쳐 하르코프를 재점령했다. 1943년 2월 19일부터 시작된 이 작전에서 소련군은 막대한 피해를 입었으나, 동부전선의 전반적 열세를 뒤집지는 못했다. 이 전투로 형성된 쿠르스크 돌출부는 수개월 뒤 전례 없는 규모의 쿠르스크 전투로 직결되었다.
event_intro_4116=1941년 3월, 그리스–이탈리아 전쟁이 교착 상태에 빠지자 사기 진작과 그리스군을 이탈리아가 점령한 알바니아 지역에서 몰아내기 위해, 이탈리아의 독재자는 3월 9일 직접 ‘춘계 공세’를 명령했다. 이 작전에서 이탈리아군은 전선에서 10만 발이 넘는 포탄을 발사했고, 누적 사상자는 1만 명을 초과했다. 그러나 어떠한 전략적 돌파도 이루지 못했다. 공세의 실패는 독일의 발칸 개입을 불가피하게 만들었고, 이는 그리스–이탈리아 전쟁의 흐름을 근본적으로 바꾸는 계기가 되었다.
event_intro_4117=1941년 3월 말, 영국 정보기관은 이탈리아 해군이 사용하던 에니그마 암호를 처음으로 해독하는 데 성공했다. 3월 27일, 영국 해군은 해당 정보를 바탕으로 마타판곶 인근 해역에서 요격 작전을 실시하여 다수의 이탈리아 군함을 격침시켰다. 이 승리로 영국은 이탈리아 함대를 동지중해에서 완전히 축출했다.
event_intro_4118=오키나와 전투 기간, 연합군의 해공군 전력을 유인해 카미카제 특공대의 성공 가능성을 높이기 위해 일본 연합함대는 전함 야마토를 기함으로 하는 특공 함대를 편성했다. 이들은 오키나와 해역으로 돌입한 뒤 좌초하여 고정 포대로 방어를 지원하는 자살 공격을 시도하고자 했다. 그러나 야마토는 미군 항공모함에서 출격한 수백 대의 함재기가 가한 다차례 공습 끝에 격침되었다. 이 전투는 일본 해군 주력 함대의 완전한 붕괴를 의미했으며, 이로써 연합함대는 작전 능력을 완전히 상실했다.
event_intro_4119=뉴기니에 구축된 일본군의 방어선을 돌파하기 위해 미군은 1944년 4월 22일 상륙 작전을 개시했다. 전술적 기만과 강력한 해공군 화력 준비를 바탕으로 미군은 성공적으로 상륙해 신속히 비행장과 항구를 점령했고, 일본군의 증원을 차단해 적을 분할 포위했다. 이 전투는 ‘섬 건너뛰기 전술’의 성공적인 사례로 평가된다. 미군은 뉴기니 동부에 집결한 일본군 주력을 우회함으로써, 비교적 적은 대가로 전략적 목표를 달성했다.


dialogue_4312=공격을 계속하라. 영국군은 효과적인 반격을 조직할 능력을 상실했다.
dialogue_4313=소련군의 측면이 과도하게 노출되었다. 즉각 공세를 전개하여 보급선을 차단하고, 하르코프를 포위하라.
dialogue_4314=독일군의 공세가 매우 거세다. 하르코프 방면은 더 이상 사수가 불가능하다. 일단 동쪽으로 퇴각하라.
dialogue_4315=일본 함대가 오키나와로 진격 중이다. 즉각 항공 전력을 출격시켜 적을 저지하고, 나머지 함정들은 해상 요격 준비를 갖춰라.
dialogue_4316=야마토함이 격침되었다. 일본 함선들이 퇴각하고 있다.
dialogue_4317=아군이 절대적인 해공군 우위를 점했다. 일본군의 방어 체계는 사실상 와해되었다. 즉시 상륙하라.


skill_name_176=마레스 방어선
skill_name_177=폴링 스타
skill_name_178=천라지망
skill_name_179=체계 작전


skill_info_176=자신이 산악 및 사막 지형 위치 시, 자신과 주변 1칸 내 아군이 받는 피해 [#00FF00#%d%%] 감소. 육상 부대 지휘 시 '루머' 스킬 발동 확률 25%% 상승. 턴 종료 시 주변 2칸 내에 사기 저하 또는 혼란 상태의 적군이 존재할 경우, 자신과 주변 1칸 내 아군의 HP를 최대치의 10%%만큼 회복.
skill_info_177=부대를 지휘하여 공격 시 [#00FF00#%d%%] 확률로 대상에게 Ⅱ단계 위성 공격 발동. 공중 호버링 부대 지휘 시 해당 위성 공격 데미지 30%% 추가 증가.
skill_info_178=지휘 중인 부대 주변 3칸 내 적군의 방어력 [#00FF00#%d%%] 감소. 핵무기, 위성 공격, 드론 전술 폭파로 받는 피해 20%% 상승.
skill_info_179=부대를 지휘하여 공격 및 공습 시 [#00FF00#%d%%] 확률로 치명타 발생.


dialogue_4318=믿기지 않는군, 이탈리아인들이 정말로 총통을 설득해내다니. 이번만큼은 같은 실수를 반복할 수 없다.
dialogue_4319=폭격 종료. 제1진 공수부대가 이미 투입됐다. 작전의 성공을 빈다!
dialogue_4320=적습이다! 모든 대기 부대는 전투 태세로 돌입하라. 반드시 비행장을 사수해야 한다! 왕립 해군에 연락해 즉시 몰타를 지원하라고 전하라!
dialogue_4321=왕립 해군은 함포 사격 지원으로 상륙 부대를 엄호하라.
dialogue_4322=제2진 공정부대가 도착했다. 조속히 발레타를 함락시켜라!
dialogue_4323=발레타가 함락되었다. 이제 몰타는 우리 것이다!
dialogue_4324=북서쪽으로 퇴각하라. 왕립 해군이 우리의 철수를 지원할 것이다!
dialogue_4325=비행장을 탈환하라. 우리 공군이 차질 없이 이륙할 수 있도록 반드시 보장해야 한다.
dialogue_4326=남부군이 적을 격퇴할 주력이다. 남부 부대가 적의 방어선을 돌파할 수 있도록 반드시 보장하라.
dialogue_4327=적이 예상대로 남쪽에서 공격해 왔다. 각 부대는 계획대로 행동하라. 진지에 의지해 적의 공세를 격퇴하라.
dialogue_4328=영국군 진지를 성공적으로 탈취했다. 기갑 부대의 전진을 지원하라.
dialogue_4329=보고드립니다. 전선 부대 확인 결과, 연료 부족으로 공세 지속이 불가능합니다.
dialogue_4330=다 잡은 승기를 놓치다니! 전선 부대에 공세 중단을 하달하고 현 전선을 유지하라.
dialogue_4331=적의 연료가 거의 바닥났다. 반격의 시기다. 전군 출동, 우리의 진지를 탈환하라!
dialogue_4332=이탈리아의 정예로서 이 고지를 반드시 사수해야 한다. 동맹국에게 웃음거리가 되어서는 안 된다.
dialogue_4333=데이르 무나시브 고지는 이후 작전에 매우 중요하다. 전사들이여, 그 진지를 점령하라!
dialogue_4334=이탈리아군의 화력이 어째서 이렇게 거센 거지! 기갑 부대는 즉시 지원하라! 포격으로 그들의 반격을 압도하라!
dialogue_4335=적의 저항이 매우 완강하다. 이 진지를 거점으로 화력 우세를 유지하며 다른 진지들을 계속 탈취하라.
dialogue_4336=진지 탈환을 위해 번개사단이 후방에 지원 요청을 송신했다.
dialogue_4337=데일 엘 무나시브 진지가 위태롭다. 기갑 부대는 신속히 지원하라!
dialogue_4338=롬멜이 병가로 자리를 비운 지금이 기습의 최적기다. 공격하라!
dialogue_4339=적의 공격이다! 전군 전투 태세로 전환하라. 적에게 진지 돌파를 허용하지 마라!
dialogue_4340=전선 진지를 성공적으로 점령했다. 확보한 진지를 거점으로 계속 전진하라.
dialogue_4341=상실된 진지에 포화 사격을 실시하라! 포격 종료 즉시 진지 탈환을 시도하라!
dialogue_4342=포병 부대는 즉시 전장에 투입되어 전방 진지의 압박을 완화하라.
dialogue_4343=적의 진지가 매우 견고합니다. 포격 지원을 요청합니다!
dialogue_4344=롬멜이 복귀하여 북부 전구의 전황이 진정되었다. 전선을 사수하라, 전세를 뒤집을 기회가 머지않았다.
dialogue_4345=적군이 병력을 집결시키고 있다. 마레스 방어선을 지키려면 우리가 먼저 선제 공격을 감행해야 한다.
dialogue_4346=마레스 방어선을 넘어 나가 가능한 한 많은 연합군 부대를 섬멸하라.
dialogue_4347=정보부의 보고에 따르면 적의 공격이 임박했다. 전투 준비에 만전을 기하라!
dialogue_4348=좋다! 진지를 사수하며 아군이 진격할 수 있는 돌파구를 최대한 확보하라.
dialogue_4349=남부 제1방어선이 붕괴되었다. 예비대를 투입하라. 적이 메데닌에 진입하게 해서는 안 된다!
dialogue_4350=기갑 부대의 손실이 너무 크다. 마레스 방어선 방어 병력을 온존하기 위해 지금은 후퇴해야만 한다.
dialogue_4351=전방 부대는 전선을 유지하라. 예비대는 출동하여 메데닌을 탈환하라!
dialogue_4352=영국군이 엔피다빌 방어선의 주요 제고지를 점령했다. 즉각 탈환하라. 이 방어선이 함락되게 둘 수는 없다.
dialogue_4353=적군이 타크루나 고지를 다시 점령했습니다. 후방 지원을 요청합니다!
dialogue_4354=다행이다, 드디어 지원군이 도착했군! 다른 지원은 더 없나? 없다고? 그렇다면 우리끼리 해내는 수밖에 없군.
dialogue_4355=포병 부대는 산정상을 조준 사격하여 적이 진지를 포기하게 만들어라. 포격 종료 즉시 고지를 탈환하라.
dialogue_4356=독일군 진지가 함락되어 타크루나 고지의 방어 부담이 가중되었다.
dialogue_4357=우리는 최선을 다했다. 조금만 더 버텨라. 어쩌면 다른 지원군이 올지도 모른다.
dialogue_4358=공격하라! 적에게 더 이상의 지원은 없다. 고지만 점령하면 엔피다빌 방어선은 사실상 무용지물이 된다!
dialogue_4359=병사들이여, 수령께서 충분한 군수물자를 준비하셨다. 지도자의 영도 아래, 우리는 이번 전투에서 반드시 승리할 것이다!
dialogue_4360=공세를 지속하고, 화력을 더 집중하라! 무슨 일이 있어도 731 고지를 점령해야 한다!
dialogue_4361=젠장, 그리스놈들은 철로 만들었나? 이 포화 속을 뚫고 역습을 감행하다니!
dialogue_4362=첩보에 있던 이탈리아 함대를 발견했다. 전투 준비! 이번 기회에 적들을 일거에 소탕하라!
dialogue_4363=영국 순양함대를 발견했다. 순양함은 견제 사격으로 적함을 아군 전함 쪽으로 유인하라. 전함의 화력으로 격멸하라!
dialogue_4364=즉시 철수하라. 우리 함대에 더 이상의 피해를 입힐 수는 없다.

dialogue_4365=양 지점의 부대가 모두 상륙을 완료했다. 신속히 내륙으로 진격하여 비행장 인근의 일본군을 섬멸하라.

legend_intro_60101=제185 공수사단은 이탈리아가 공중강습 작전을 수행하기 위해 특별히 창설한 부대다. 창설 초기, 사단은 독일군과 협동 공수 작전을 통해 몰타섬을 탈취하려는 'C3 작전'을 위해 실전 훈련을 거듭했다. 그러나 이전 크레타섬 상륙 작전에서의 막대한 손실로 인해 1942년 7월로 예정되었던 작전은 수뇌부에 의해 연기되었다. 같은 해 11월 11일 토브루크가 함락되면서 'C3 작전'은 결국 취소되었다. 이미 7월에 북아프리카 전선으로 배치된 제185 공수사단은 이후 다시는 공수 작전을 수행할 기회를 얻지 못했다.
legend_intro_60102=1942년 7월, 제185 공수사단은 북아프리카 사막 전선으로 급파되었다. 하늘의 번개처럼 강습 작전을 펼쳐야 했던 이 정예병들은 이제 끝없는 황사 속에서 공훈을 세워야 하는 처지가 되었다. 8월 29일, 이른바 '번개사단'은 북아프리카에서의 첫 전투를 맞이했다. 알람 엘 할파 전투에서 이들은 독일 기갑부대의 측면을 엄호하며 주요 고지들을 차례로 점령했고, 연합군 방어선 내부에 견고한 교두보를 구축했다. 이어진 연합군의 '베레스포드 작전'에서도 사단은 진지 탈환을 시도하는 적군을 성공적으로 격퇴하며 뛰어난 전투력을 입증했다.
legend_intro_60103=1942년 9월 29일, 제2차 엘 알라메인 전투를 앞두고 유리한 지형을 확보하려던 연합군은 제185 번개사단이 주둔한 진지를 겨냥해 '브라간자 작전'을 개시했다. 연합군 기갑부대의 공세에 맞서, 번개사단은 잘 구축된 참호 체계와 유연한 전술 배치를 바탕으로 경보병 및 제한된 포병 화력만으로 적의 기갑 공세를 저지해냈으며, 이를 통해 탁월한 방어 작전 능력을 과시했다.
legend_intro_60104=1942년 10월 23일, 제2차 엘 알라메인 전투가 본격적으로 시작되었다. 전선 남부 구간을 고수하라는 명령을 받은 제185 '번개사단'은 악명 높은 '사막의 쥐' 제7기갑사단 등이 포함된 영국 제13군단과 격돌했다. 3박 4일간 이어진 처절한 방어전 끝에 사단은 완강하게 진지를 지켜냈고, 이로 인해 몽고메리는 남부 돌파 계획을 포기하고 주공 방향을 수정해야만 했다. 국지적인 방어전에서 놀라운 전술적 인내력을 보여주었음에도 불구하고, 전체적인 전황이 급격히 악화되면서 사단은 결국 축심국 부대와 함께 후퇴를 결정했으며, 그 과정에서 막대한 병력 손실을 입었다.
legend_intro_60105=엘 알라메인 전투 이후 잔존한 제185 '번개사단'은 마레스 방어선으로 이동하여 연합군의 진격을 저지하는 임무를 맡았다. 영국 제8군의 공격 준비를 지연시키기 위해 축심국 군대는 1943년 3월에 '카프리 작전'을 발동하여 메데닌 지역에 집결 중이던 영국군을 기습했다. 이 전투에서 번개사단은 정예 돌격대로서 영국군 진지 일부를 침투 및 점령하는 성과를 거두었다. 그러나 작전 정보 유출로 인해 대다수 부대의 공격이 실패로 돌아갔고, 번개사단 역시 국지적인 돌파에는 성공했으나 후속 지원을 받지 못해 결국 퇴각해야 했다.
legend_intro_60106=튀니지 전역 말기, 축심국 군대는 최후의 저항선을 구축하고 완강히 버텼다. 1943년 4월 20일, 엔피다빌 방어선의 타크루나 고지가 연합군에 점령되었다. 방어선을 안정시키고 적의 진격을 늦추기 위해 사령부는 번개 사단의 마지막 잔존 병력을 투입해 반격을 명령했다. 이 최후의 공정부대원들은 타크루나 고지를 탈환하는 데 성공했으며, 지원이 끊긴 극한의 상황에서도 탄약이 바닥날 때까지 만 하루 동안 진지를 사수했다. 결국 하늘에서 강습을 펼쳐야 했던 이 정예 부대는, 일련의 잘못된 전략적 선택 속에서 북아프리카의 황사 속으로 영원히 사라지게 되었다.

