event_intro_437=1944년 10월 6일, 소련 우크라이나 제2방면군은 데브레첸 전투를 개시하여 루마니아에 도사리고 있던 독일-헝가리 연합군을 격퇴하고 데브레첸을 탈취하여 전선을 160km 진격시켰다. 이번 전투는 헝가리 내 독일군의 군사력을 약화시켰으며, 부다페스트를 공격하는 데 중요한 기반을 마련했다.
event_intro_438=1941년 10월 10일, 독일군 제3기갑군은 칼리닌 방향으로 돌아섰고, 행군 과정에서 칼리닌 시를 탈취하고 북서쪽에서 모스크바를 우회하여 북쪽으로 공격함으로써 포위권을 형성할 계획이다. 소련군은 이 소식을 듣고 신속히 칼리닌 방면군을 조직하여 저격을 진행하였다. 칼리닌 방어 전투는 이렇게 시작되어 12월까지 이어졌다. 이 전투에서 독일군은 칼리닌을 점령하는 데 성공했지만, 혹독한 겨울과 소련군의 끈질긴 저격 하에 전력이 크게 소모되었고, 전선은 칼리닌에 정체되어 계속 추진할 수 없게 되었다.
event_intro_439=모자이스크 방어선은 소련이 모스크바와 그 서부 통로를 보호하기 위해 1941년 7월 말부터 건설하기 시작한 방어선이다. 그러나 독일군이 모스크바에 진군한 10월까지도 완공하지 못했다. 이로 인해 독일군은 10월 13일 첫 공격으로 방어선 남단의 칼루가를 성공적으로 점령하였는데, 이는 방어선 정면에 대한 그들의 공격 의지를 고무시켰다. 독일군은 그 후 수일 동안 방어선의 여러 도시를 성공적으로 탈취하여 주요 방어 구역을 돌파했다. 이 방어선에서 소련군의 작전은 독일군의 진격을 막지는 못했지만, 방어선 후방에서 방어 부대를 조직할 시간을 확보했다.
event_intro_440=발트해 작전 이후, 북부 집단군은 소련군에 의해 쿠를란트 지역에 포위되었다. 동프로이센의 독일군이 포위권을 공격하는 것을 막기 위해 소련군은 제3벨로루시 전선군을 파견하여 동프로이센을 점령하고, 현지의 독일군을 섬멸했다. 1944년 10월 16일, 소련군은 포격 후 공격을 시작했다. 그러나 동프로이센 지역의 밀림과 늪지대 지형, 그리고 독일군의 방어 시설 등은 소련군의 공세를 효과적으로 방해했다. 소련군은 보름 동안 연속적으로 작전을 펼친 끝에 전선을 굼비넨까지 밀고 나갔지만, 부대의 손실이 심각하여 결국 진격을 포기했다.
event_intro_441=일본군과 그들의 남아시아 주둔군의 연락을 차단하여 남아시아 주둔군이 보급을 받지 못하게 하기 위해 1944년 10월 23일부터 26일까지 필리핀의 레이트 만 부근 해역에서 제2차 세계 대전 기간 중 가장 규모가 큰 해전이 벌어졌다. 이 전투 이후 일본 해군의 마지막 전력이 완전히 소멸되었고, 중동 태평양 지역에서의 제해권과 제공권을 완전히 잃게 되었다.
event_intro_442=제2차 엘 알라메인 전투는 제2차 세계 대전에서 북아프리카 전선의 전환점으로, 스탈린그라드 전투와 과달카날 전투와 함께 연합국이 전략적 반격 단계에 진입했음을 상징한다. 이 전투는 1942년 10월 23일부터 11월 3일까지 지속되었다. 연합군은 병력과 전차 수의 우위와 절대적인 제공권으로 추축국 군대를 격파하고 그들을 튀니지로 쫓아냈다.
event_intro_443=그리스-이탈리아 전쟁은 1940년 10월 28일부터 1941년 4월 23일까지 이탈리아와 그리스 사이에서 발발한 군사 충돌로, 제2차 세계 대전 발칸 전투의 시작을 알리는 사건이다. 이탈리아군은 영토를 확장하기 위해 알바니아에서 그리스를 침공했지만, 그리스군의 반격에 의해 결국 이탈리아군은 철수하게 되었다. 심지어 12월 중순에 이르러 그리스 군대는 알바니아 영토의 25%를 점령했다. 이후 4월 6일 독일군이 유고슬라비아와 그리스를 침공하면서 이탈리아군은 다시 공격을 재개할 수 있었다.
event_intro_444=부게인빌 전투는 솔로몬 제도 근처의 부게인빌 섬에서 벌어진 연합군과 일본군 간의 일련의 전투로, 1943년 11월 1일부터 1945년 8월 21일까지 지속되었다. 전투는 두 단계로 나뉘어졌는데, 첫 번째 단계는 1943년 11월부터 1944년 11월까지로, 미군이 토로키나 해안 상륙지점에 상륙하여 주변 지역을 장악했고, 두번째 단계는 주로 호주군이 주도하여 여전히 저항하고 있는 일본군 병사를 소탕하는 작전이었다.
event_intro_445=1943년 11월 3일, 소련군은 키예프의 남북 교두보에서 오랫동안 준비되어 있었고, 키예프를 향해 맹렬한 공세를 개시했다. 키예프 시내의 독일군은 서둘러 대응했지만, 강력한 공세에 밀려 키예프에서 철수해야 했다. 소련군은 기세를 틈타 추격하여 키예프, 지토미르 및 그 주변의 우안 지역을 해방시켰다. 이번 전투는 동부 전선에서 소련이 추가 승리를 거둔 것으로, 이후 반격 작전의 토대를 마련하고 독일군의 사기에 심각한 타격을 주었다.
event_intro_446=소련의 '제2전선 개척' 요구에 대응하기 위해 연합군은 프랑스령 북아프리카를 점령하여 북아프리카에 있는 추축국군을 견제할 계획을 세웠다. 1942년 11월 8일, 영미 연합군은 카사블랑카, 오랑, 알제를 향해 삼로로 상륙 공격을 개시했고, 현지의 비시 프랑스 수비대는 저항할 힘이 없었다. 11월 16일까지 세 도시는 모두 연합군에 의해 점령되었고, 이후 북아프리카 작전에서 연합군의 중요한 후방 기지 역할을 하게 되었다.
event_intro_447=지중해에서 이탈리아군의 해상 전력을 약화시키기 위해 영국군은 항공모함을 이용해 타란토에 정박 중인 이탈리아 주력 함대를 섬멸할 계획을 세웠다. 작전은 1940년 11월 11일 밤에 시작되었으며, 이탈리아 함대는 하룻밤 사이에 주력 전함의 절반을 잃었다. 이번 공격은 역사상 처음으로 항공모함의 함재기가 해군 함선을 공격한 사례로, 해군 항공병력이 전함의 대포보다 우월하다는 것을 성공적으로 입증했다. 이 전투는 일본군의 진주만 공격 계획에도 참고가 되었다.
event_intro_448=1942년 11월 12일부터 15일까지 연합군과 일본군은 과달카날 섬 근처에서 4일 동안 해전과 공중전을 벌였다. 일본군은 과달카날 주둔군을 지원하고 보급품을 운송하려 시도했지만, 결국 연합군이 이를 성공적으로 차단하였다. 이 전투 이후 일본군은 과달카날 해역에서 야간 통행의 자유를 상실했으며, 더 이상 헨더슨 비행장을 탈환하기 위한 공격을 감행할 수 없게 되었다.
event_intro_449=1941년 11월 18일, 토브룩에 갇힌 연합군 부대를 구출하고 북아프리카에서 독일-이탈리아 연합군의 전력을 약화시키기 위해 영연방군은 리비아에서 독일-이탈리아 연합군을 상대로 대규모 공세를 펼쳤다. 치열한 전투와 막대한 손실에도 불구하고, 영연방군은 결국 포위를 돌파하고 독일-이탈리아 연합군을 물리쳤다. 이 작전은 북아프리카 전선에서 연합군의 중요한 승리를 의미하며, 후속 공격의 기반을 마련했다.
event_intro_450=1941년 11월 17일부터 12월 2일 사이에 발생한 로스토프 전투는 소련-독일 전쟁에서 붉은 군대가 처음으로 성공한 공세 중 하나로, 모스크바 전투와 함께 1941년 겨울 소련-독일 전선에서 독일의 공격을 중단하게 만들었다. 이 전투에서 독일군은 한때 로스토프를 점령했으나, 방어군의 저항과 소련군의 포위 작전으로 인해 결국 로스토프를 스스로 포기하게 했다.
event_intro_451=레제프 돌출부를 고수하고 있던 독일 제9군을 격파하기 위해, 소련군은 1942년 11월 25일부터 12월 20일까지 여러 방향에서 공격을 감행하여 그들을 일거에 전멸시키려 했다. 그러나 이 전투는 소련군이 예상했던 결과를 얻지 못했다. 소련군의 인원과 장비 손실이 독일군보다 더 컸지만, 많은 지역을 점령하지는 못했다. 이로 인해 이 전투는 오랜 기간 동안 거의 언급되지 않았다.
event_intro_452=겨울 전쟁은 제2차 세계 대전 초기에 소련과 핀란드 사이에서 발생한 전쟁이다. 1939년 11월 30일, 소련이 핀란드를 침공하면서 전쟁이 시작되었고, 결국 소련이 핀란드를 격파하고 승리를 거두었다. 종전 협상에서 핀란드는 일부 영토를 소련에 양도하고 임대했다. 1940년 3월 13일, 양측은 <모스크바 평화 협정>을 체결하며 전쟁이 종료되었다.
event_intro_453=1941년 12월 1일, 독일군 중부 집단군이 나로-포민스크 방향으로 다시 공격을 개시하여 중부 방어선을 돌파하려 했다. 독일군의 공격이 시작되었을 때, 소련군은 주요 방어 진지만 장비할 수 있었기 때문에 독일군은 빠르게 방어선을 뚫고 며칠 내에 수 킬로미터 추진했다. 그러나 소련군은 즉시 전선 예비군을 동원하여 반격을 조직했고, 12월 5일까지 소련군은 전선을 원래의 위치로 되돌려 독일군의 마지막 모스크바 돌격 시도를 분쇄했다.
event_intro_454=1941년 12월 5일, 독일군이 모스크바 전투에서 방어세로 돌아서자 소련군 칼리닌 방면군은 칼리닌을 해방하기 위해 칼라닌에 대한 공격을 개시했다. 독일군은 처음에 강력히 저항하여 소련군의 진격을 지연시켰지만, 혹독한 날씨와 보급 부족으로 인해 결국 독일군은 철수하게 되었고, 12월 16일에 칼라닌은 해방되었다. 칼리닌 방면군은 기세를 몰아 여러 중요한 지점을 탈환했다.

