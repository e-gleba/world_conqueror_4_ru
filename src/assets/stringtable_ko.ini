dialogue_2770=이번의 작전 목표는 과달카날과 그 주변 섬의 비행장을 점령하는 것이다. 이를 통해 솔로몬 제도를 탈환할 것이다!
dialogue_2771=미군이 왜 그곳에 나타날 수 있을까? 모든 편대에 반드시 비행장을 탈환하라고 전달하라!
dialogue_2772=독일군은 캉에서 쫓겨났다. 승세를 몰아 추격하여 이 방어선을 뚫어라!
dialogue_2773=장병들이여, 전선을 굳게 지켜라! 후방은 우리의 생명선이다!
dialogue_2774=좋다! 계속 깊이 파고들어 팔레즈를 점령하라!
dialogue_2775=전력을 다해 공격하여 그들을 다시 틈새로 밀어 넣어라!
dialogue_2776=병사들이여, 독일군은 주머니에 갇혔으니 계속 공격하여 그들을 완전히 격파하라!
dialogue_2777=전체 변사들이여, 침착하게 진격하여 B집단을 포위권에 봉쇄하라!
dialogue_2778=총통의 명령: 전력을 다해 반격하여 적의 추진을 막아라!
dialogue_2779=전세는 만회할 수 없게 되었으니 모두 철수하여 실력을 보존하라!
dialogue_2780=독일군의 움직임이 바뀌었다. 동쪽 부대는 독일군이 탈출하지 못하도록 빠르게 돌파구를 막아라!
dialogue_2781=모두 준비하라. 이번에 우리는 고향을 되찾을 것이다!
dialogue_2782=이번 작전은 물자 공급을 보장하기 위해 반드시 모든 항구를 탈환해야 한다.
dialogue_2783=연합군의 공세가 너무 맹렬하다! G집단군 전원은 철수하여 실력을 보존하라.
dialogue_2784=이번 작전에서 우리은 디에프 방어선을 돌파하여 독일 해안 방어선에 관한 정보를 장악해야 한다.
dialogue_2785=경계를 늦추지 말고 순찰을 강화하라! 연합군은 수시로 상륙할 수 있다!
dialogue_2786=이번 작전에서 우리는 키예프를 포위하여 남서방면군을 완전히 섬멸해야 한다!
dialogue_2787=우리 부대는 체르니히우에서 남쪽으로 공격할 것이다.
dialogue_2788=우리 부대의 클라이스트는 체르카시-크레멘추크 선에서 북쪽으로 공격할 것이다.
dialogue_2789=최고 사령부 명령: 어떤 대가를 치르더라도 진지를 사수하라! 직시하고, 굳건히 지키고, 필요 시 희생하라.
dialogue_2790=포위권이 완성되었으니 전력을 다해 적군을 섬멸하라!
dialogue_2791=북서방면군 명령: 발트해함대와 제10보병군은 탈린항에서 레닌그라드로 철수하라.
dialogue_2792=포병은 해안을 봉쇄하고, 공군 부대는 전력을 다해 적 함선을 폭격하라. 우리는 소련군이 해상에서 철수하는 것을 막아야 한다!
dialogue_2793=북쪽은 가짜 공격을 하고, 남쪽은 세게 공격하라. 이번 전투에서 제8군단을 반드시 물리쳐야 한다.
dialogue_2794=탱크를 전선에 고정시켜라. 알람 엘 할파 고지를 지키면 우리는 반드시 승리할 것이다!
dialogue_2795=기동 작전을 수행하고, 신속히 이동하여 영국과 프랑스가 대응하기 전에 폴란드를 병합하라!
dialogue_2796=아군은 폴란드 회랑을 뚫을 수 있도록 공격을 지원할 것이다.
dialogue_2797=아군은 주 공격을 담당하여 신속하게 폴란드 중심부에 진입할 것이다.
dialogue_2798=병사들이여, 버텨라! 영국과 프랑스가 개입하면 전세가 역전될 것이다.
dialogue_2799=전군은 우크라이나와 벨라루스 주민을 보호하기 위해 폴란드 지역의 혼란스러운 무장을 없애라!
dialogue_2800=소련이 감히 협약을 파기하고 폴란드를 침공했다니? 폴란드는 이미 패배했다. 하지만 우리는 절대 항복하지 않을 것이다!
dialogue_2801=이 전투는 우선 '발바닥'부터 공격하여 적의 주력 부대를 견제해야 한다. 그런 다음 아군의 주력이 살레르노에 상륙하여 나폴리를 점령할 것이다.
dialogue_2802=미군은 독일군이 타란토를 방어하는 데 초점을 맞출 것이라고 믿는 이상, 그들에게 맡겨라. 우리는 가능한 한 빨리 움직여 상륙을 지원하자.
dialogue_2803=연합군의 주요 공격 방향은 '발바닥'에 집중하지 않을 것이니 우리는 반드시 병력을 집중하여 로마 주변에 방어선을 배치해야 한다.
dialogue_2804=영국군이 전투를 시작했다. 출발하여 살레르노에 상륙하라!
dialogue_2805=좋은 소식이다! 이탈리아가 우리에게 항복을 선언했다!
dialogue_2806=이탈리아군의 무장을 해제하라. 이탈리아는 우리가 통제할 것이다.
dialogue_2807=이집트 진출 계획은 이미 두 번이나 연기되었다. 총리는 더 이상 연기해서는 안 된다고 본다.
dialogue_2808=보급품은 충족하지 않지만, 적절한 보급품은 적절한 목표에 해당한다. 출격하라. 이집트로 진격하라!
dialogue_2809=원활하게 억제하라. 우리는 공격을 개시하기 위해 충분한 전력을 축적할 시간을 쟁취해야 한다.
dialogue_2810=좋다. 계속 침착하게 추진하라!
dialogue_2811=동지 여러분, 반격할 때가 왔다. 리가를 해방하라!
dialogue_2812=병사들이여, 동프로이센은 아직도 라트비아와 연결되었기에 지원은 끊기지 않을 것이다. 진지를 굳게 지켜라!
dialogue_2813=독일군의 저항은 완강하다. 우리는 클라이페다를 공격하여 리가와 동프로이센의 연결을 차단해야 한다.
dialogue_2814=젠장! 리가에서 단계적으로 철수하고, 쿠를란트에서 방어선을 재구축하라.
dialogue_2815=첫 번째 공수 부대가 이미 도착했다. 그들은 근처의 다리를 점령하고 굳게 지킬 것이니, 가능한 한 빨리 지원하라!
dialogue_2816=병사들이여, 빨리 진격해서 미군에게 우리의 진정한 실력을 보여줘라!
dialogue_2817=각 부대는 다리를 점령하고, 점령할 수 없으면 최선을 다해 파괴하라. 기갑 부대가 곧 지원할 것이다!
dialogue_2818=아른험의 다리가 함락되어 라인 강 건너편에서 루르로 진입할 수 없다.
dialogue_2819=휘르트겐 숲 방향으로 공격하라. 아헨 지역의 독일군이 지원 받지 못하도록 적군을 막아라!
dialogue_2820=지크프리트선에 의지하여 미군의 추진을 막고, 루르 댐을 보호하라!
dialogue_2821=아헨을 점령했다. 계속 전진하라!
dialogue_2822=아헨이 함락되었지만, 우리는 포기할 수 없다. 계속 버티면 기회가 올 것이다!
dialogue_2823=미안합니다. 상대방은 우리의 호의를 받아들이지 않으려는 것 같습니다.
dialogue_2824=괜찮습니다. 계획에 따라 우리는 무력으로 압박해야 할 것 같습니다.
dialogue_2825=공격하라. 메스 지역의 독일군을 격파하고 메스를 점령하라!
dialogue_2826=메스의 수비군은 요새 방어에 의지하여 미군의 추진을 지연시켜라!
dialogue_2827=제2집단군은 브란스크 북서쪽에서 돌파하고, 제2기갑집단군은 셉스크에서 오룔로 진격하라. 이번 전투에서 우리는 브랸스크 방면군을 포위 섬멸할 것이다!
dialogue_2828=동지들이여, 모스크바가 바로 우리 뒤에 있으니 반드시 적을 막아야 한다. 조국과 국민을 위하여!
dialogue_2829=적은 우리를 포위하고 있다. 모두 포위권을 향해 돌격하라!
dialogue_2830=전력을 다해 공격하여 적을 무너뜨려라!
dialogue_2831=총통은 제15집단군이 어떤 대가를 치르더라도 스헬더 강 하구를 지키라고 명령했다.
dialogue_2832=캐나다 제1군단은 스헬더 강을 뚫는 임무를 맡았으며, 연합군은 적절한 지원을 할 것이다.
dialogue_2833=왈헤렌을 연결하는 통로는 어떤 대가를 치르더라도 지켜야 한다. 근처의 중대는 즉시 지원하라!

