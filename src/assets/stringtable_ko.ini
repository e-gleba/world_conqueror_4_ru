event_rule=규칙
;集团军模式规则
armygroup_rule=집단군 모드 규칙
armygroup_rule_1=1. 이벤트 시나리오는 제한된 시간 동안 열립니다. 스테이지를 클리어하여 보상을 얻기 위해 지휘관님들께 시간을 합리적으로 배정하는 것을 권장합니다.
armygroup_rule_2=2. 집단군 업적을 달성하면 업적 포인트 보상을 획득할 수 있으며, 요구 달성 시 단계별 보상을 수령할 수 있습니다.
armygroup_rule_3=3. 집단군의 규모와 난이도는 각기 다릅니다. 클리어 후 해당하는 클리어 보상을 획득하실 수 있습니다.
armygroup_rule_4=4. 집단군 모드에서 플레이어는 적대 진영의 모든 집단군을 격파하여 승리해야 합니다. 집단군은 모든 건물이 점령되고 모든 부대가 전멸되어야 패배합니다. 같은 국가 내의 다른 집단군에 선전포고할 경우, 모든 우군과 적대 관계가 된다.
armygroup_rule_5=5. 각 집단군은 고유한 지원군과 과학기술을 보유하고 있습니다. 적대 집단군을 격파하면 해당 집단군의 원군을 얻을 수 있으며, 일부 집단군을 격파하면 해당하는 병종 과학기술이 활성화됩니다.
armygroup_rule_6=6. 적군 부대를 섬멸하거나 적군 건물을 점령하면 공훈치를 획득하여 공훈 포인트를 적립할 수 있습니다. 해당하는 공훈 포인트를 소모하여 지원군을 모집하거나 병종 과학기술을 업그레이드 할 수 있습니다.
armygroup_rule_7=7. 적군 부대를 섬멸하고 적 건물을 점령하면 해당 집단군의 충성도가 감소한다. 충성도가 15% 이하로 하락했을 때, 플레이어가 점령한 지역이 일정 규모에 도달했으며 적 집단군 도시가 모두 상실된 상태라면, 항복 유도 기능을 통해 해당 집단군을 강제로 투항시킬 수 있다.

