legend_intro_40101=영국 제7기갑사단은 이집트 주둔 기동 부대를 개편하여 창설되었으며, 주둔지의 날쥐 덕분에 '사막의 쥐들'이라는 별명을 얻게 되었다. 1940년 12월 웨이벌 장군이 개시한 컴퍼스 작전에서 이 사단은 기갑 부대의 기동력을 최대한 발휘하여 공격 주력 부대로 활약했다. 그들은 바르디아와 토브루크 등 주요 거점을 연달아 점령했으며, 과감한 사막 종심 침투를 통해 벵가지에서 철수하던 이탈리아 군단을 성공적으로 요격하여 대규모의 적군을 포로로 잡았다. 이 전투에서 제7기갑사단은 키레나이카 전역을 종횡무진하며 뛰어난 전과로 '사막의 쥐들'이라는 명성을 북아프리카 전장에 처음으로 떨쳤다.
legend_intro_40102=1941년, 롬멜의 아프리카 군단에 포위된 토브루크를 구출하기 위해 영국군은 '배틀액스 작전'을 개시했다. 이 전투에서 제7기갑사단은 공격의 선봉으로서 뛰어난 기동력과 돌파 능력을 보여주며 카푸초 요새를 성공적으로 점령했고, 한때 독일군 방어선을 돌파하기도 했다. 비록 우군 공격의 좌절과 독일군의 강력한 반격으로 인해 최종적으로 전세를 뒤집지는 못했지만, 제7기갑사단은 역경 속에서도 성공적으로 철수를 조직하여 주력을 보존함으로써, 훗날 북아프리카 전선의 반격을 위한 핵심 전력을 남겼다.
legend_intro_40103=경험과 교훈을 흡수한 후, 1941년 11월 18일, 신임 중동 지역 총사령관 오킨렉은 '크루세이더 작전'을 계획했다. 이 작전의 목표는 토브루크를 포위한 독일군 기갑 부대를 일거에 섬멸하고, 토브루크를 해방시키는 것이었다. 제7기갑사단은 주공부대로 투입되어 시디 레제그까지 신속하게 돌파했다. 롬멜은 연합군이 포위망을 돌파하는 것을 막기 위해 기갑 부대를 총동원하여 시디 레제그에 맹공격을 가했다. 독일군의 포위에 맞서 제7 기갑사단은 탁월한 끈기와 전투력을 발휘했을 뿐만 아니라, 독일군의 반격을 견뎌내고 사막에서 신속한 종심 침투를 감행하여 적의 지휘 및 군수 보급선을 타격함으로써 연합군의 승리를 위한 기반을 닦았다.
legend_intro_40104=제2차 엘 알라메인 전투에서 영국 제7기갑사단은 영국 제8군의 예봉으로서 탁월한 기동성과 돌파 능력을 보여주었다. 전역 초기에 이 사단은 남부 전선에서 적을 견제했고, 전황이 교착 상태에 빠지자 영국군 사령부는 제7기갑사단을 과감하게 북쪽으로 이동시켜 주공 방향의 전력을 강화했다. 결정적인 '수퍼차지 작전'에서 제7기갑사단은 형제 부대들과 함께 독일–이탈리아 연합군 방어선을 강력히 돌파하고, 제1·제10기갑사단과 함께 광활한 사막 추격전에 투입되었다. 이들의 공세는 연합군이 북아프리카 전역의 승리를 거두는 데 결정적 역할을 했다.
legend_intro_40105=튀니지 전역에서 영국 제7기갑사단은 연합군의 선봉 부대로서 1943년 3월 마레트 방어선을 향해 가장 먼저 돌격을 개시했다. 이 사단은 뛰어난 기동전을 통해 험준한 지형 속에서도 신속하게 적 방어선을 돌파하고 독일군 측면으로 성공적으로 우회했다. 와디 아카리트 전투에서도 제7기갑사단은 다시 한번 사막 작전의 전문성을 발휘하여, 정밀한 기갑 돌격으로 이탈리아군 진지를 찢어 놓았다. 튀니스 시에 가장 먼저 진입한 영국군 부대로서, '사막의 쥐들'은 숙련된 기갑 협동력과 빠른 진격 능력을 통해 북아프리카 추축국 집단을 최종 섬멸하는 데 큰 공을 세워 그들의 빛나는 전사에 굵직한 한 획을 더했다.
legend_intro_40106=1943년, 전장을 이탈리아로 옮긴 제7기갑사단은 새로운 도전에 직면했다. 개활된 사막에서 좁은 산악 지형으로 작전 환경이 완전히 달라졌다. 그러나 이 '사막의 쥐들'은 놀라운 적응력과 공격 능력을 보여주었다. 그들은 살레르노에 상륙한 후, 독일군의 맹렬한 반격을 견뎌냈을 뿐만 아니라 북쪽으로 계속 진격하여 나폴리를 성공적으로 점령함으로써 이탈리아의 조기 항복에 중요한 기여를 했고, 다시 한번 어디서든 싸워 이길 수 있는 부대임을 증명해냈다.

synergy_tactics_4_1=・모든 '사막의 쥐들' 유닛은 사막 지형에서 이동할 때, 이동력 소모 -1.
synergy_tactics_4_2=・화포 제압: 포병 유닛 공격 후, 자신 주변 2칸 이내의 적 유닛은 '포병 제압' 상태 획득. '화포 제압': '사막의 쥐' 유닛에게 공격받을 때, 받는 피해 10% 증가.
synergy_tactics_4_3=・기갑 유격: 기갑 유닛이 '화포 제압' 버프가 있는 적 유닛을 격파할 때마다, 다음 턴 이동력이 +2.최대 이동력을 20까지 증가시킵니다.
synergy_tactics_4_4=・기계 수리: 매 턴 종료 시, 보병 유닛 1칸 범위 내에 있는 '사막의 쥐들' 포병 및 기갑 유닛 체력 50포인트 회복.

army_buff_desc_1581=화포 제압: '사막의 쥐들' 유닛에게 공격받을 때, 받는 피해 10% 증가.

