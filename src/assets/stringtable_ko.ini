dialogue_2834=동지들이여, 클루지를 해방시키고, 독일-헝가리 연합군을 루마니아에서 쫓아내라!
dialogue_2835=데브레첸으로 진격하여 적을 완전히 격파하라!
dialogue_2836=북동쪽으로 공격하여 칼리닌을 탈취하라! 그리고 모스크바와 야로슬라블의 연락을 더 철저히 차단하라.
dialogue_2837=칼리닌 방면군은 코네프 동지가 이끌고 있으니 독일군이 칼리닌을 돌파하지 못하게 막아야 한다! 모스크바는 최선을 다해 자원을 동원해 지원할 것이다.
dialogue_2838=주의, 각 방향에서 적극적으로 독일군을 기습하여 적의 병력을 소모하고, 적의 진격을 막아라!
dialogue_2839=적의 반항은 매우 강렬하다! 퇴로가 끊기지 않도록 전선을 잘 지켜야 한다.
dialogue_2840=모스크바가 코앞에 있고, 소련군은 지쳤다. 그들의 방어선을 뚫고 모스크바를 공격하라!
dialogue_2841=동지들이여, 적이 모자이스크 방어선에 접근했다. 우리는 끝까지 지켜야 한다. 우리 뒤에는 바로 모스크바이다!
dialogue_2842=동지 여러분, 적의 국토가 바로 눈앞에 있고, 복수할 때가 왔다. 공격하라! 패배의 치욕을 씻고, 전사한 망령을 위로하라!
dialogue_2843=병사들이여, 프로이센의 영광을 위하여, 우리의 고향을 위하여, 희생을 두려워하지 말고 마지막 순간까지 저항하라!
dialogue_2844=각 함대는 주의하라. 우리는 상륙을 위한 공간을 확보하기 위해 일본의 해상 역량을 섬멸할 것이다. 필리핀을 점령하면 일본 해군은 더 이상 위협이 되지 않을 것이다!
dialogue_2845=병사들이여, 섬에 상륙하고, 적을 섬멸하고, 우리의 치욕을 씻어라!
dialogue_2846=병사들이여, 어떤 대가를 치르더라도 우리는 이 전투에서 반드시 승리해야 한다! 필리핀을 잃으면 해군은 더 이상 쓸모가 없게 될 것이다.
dialogue_2847=병사들이여, 계속 싸워라. 우리 부대가 적을 유인할 것이다!
dialogue_2848=우리측의 보급은 적군보다 훨씬 낫다! 보병이 길을 열고, 전차가 적을 섬멸하면 이번 전투는 반드시 승리할 것이다!
dialogue_2849=내가 돌아오기 전까지 지뢰밭에 의지하여 방어하라. 물자를 절약하고 보급을 기다려라.
dialogue_2850=보급선이 곧 도착할 것이다. 기갑부대는 진지를 탈환할 수 있도록 북쪽으로 집결하라!
dialogue_2851=좋은 소식이다. 영국 공군이 투브루크에 있는 적군의 보급선을 파괴했다!
dialogue_2852=보급 부족으로 병력 손실이 너무 크다. 더 이상 전투를 계속할 수 없다. 모두 후퇴하라!
dialogue_2853=그리스군의 장비는 우리보다 훨씬 뒤떨어졌다! 병사들이여, 그리스를 점령하여 이탈리아의 영광을 보여줘라!
dialogue_2854=그리스군은 상당히 끈질기지만, 여전히 우리를 막을 수 없다.
dialogue_2855=진지를 지키고, 적이 진지를 탈환하지 못하게 마라!
dialogue_2856=엠프레스 오거스타 만을 점령하고 그곳을 지켜라!
dialogue_2857=일본군이 바다에서 증원을 시도하고 있다. 그들을 막아라!
dialogue_2858=남부 부대는 적의 주의를 끌고, 북부 부대가 주공격을 가한다. 동지들이여, 키예프 해방이 이번 전투에 달렸다!
dialogue_2859=어떤 대가를 치르더라도 키예프를 지켜라! 전선은 더 이상 후퇴할 수 없다!
dialogue_2860=키예프에 갇혀 있을 수 없다. 신속히 남서쪽으로 철수하라!
dialogue_2861=키예프가 해방되었다. 독일군을 계속 추격하라!
dialogue_2862=반격하라! 적군의 진격을 막아라!
dialogue_2863=이번 작전은 세 갈래로 동시에 진행한다. 현지 수비군은 약하지만, 항구가 파괴되는 것을 방지하기 위해 신속하게 움직여야 한다.
dialogue_2864=이탈리아 왕립 해군은 현재 타란토에 정박하고 있다. 이 기회를 놓치지 말고 반드시 그들을 섬멸해야 한다!
dialogue_2865=방공포로 반격하고 공습을 피하라!
dialogue_2866=해군은 육군의 상륙을 엄호하라. 반드시 비행장을 되찾아야 한다!
dialogue_2867=정찰기 보고: 일본군이 과달카날 섬에 접근하고 있다. 전투를 준비하라!
dialogue_2868=일본군의 원군이 도착했다, 조심하라!
dialogue_2869=남쪽 적군의 방어가 허술하다. 여기서 방어선을 우회하여 포위 부대를 끌어들여 투부르크를 해방시켜라!
dialogue_2870=투브루크를 포위하는 부대는 계속 싸우고, 기타 부대는 주둔지에서 수비하면서 보급을 기다려라.
dialogue_2871=투브루크를 탈취했다. 이제 전력을 다해 반격하라!
dialogue_2872=계속 공격하여 로스토프를 탈취하라!
dialogue_2873=전진하여 포위할 준비를 하라. 이번 전투에서 우리는 독일군 제1기갑군에 큰 타격을 입힐 것이다!
dialogue_2874=부대는 여기서 섬멸되어서는 안 된다. 제1기갑군은 로스토프에서 철수하라.
dialogue_2875=동지들이여, 반격할 때가 왔다. 공격하라, 우리 진지를 탈환하라!
dialogue_2876=방어선을 지켜라. 진지를 하나도 포기하지 마라!
dialogue_2877=동지들이여, 그들이 독일에 치우쳐 레닌그라드에 위험을 초래하도록 내버려둘 순 없다. 레닌그라드가 안전할 때까지 공격하라!
dialogue_2878=동포 여러분, 우리는 핀란드의 독립과 조국의 안전을 위해 끝까지 싸워야 한다!
dialogue_2879=병력을 집중하여 나로포민스크를 점령하고, 전선을 계속 모스크바로 추진하라!
dialogue_2880=동지들이여, 우리는 반드시 이 방어선을 지켜야 한다. 적의 모스크바 침입을 막아야 한다!
dialogue_2881=포병의 지원이 준비되었다. 동지들이여, 칼리닌을 탈환하자!
dialogue_2882=각 부대 주의: 전선에 의지하고, 강을 따라 수비하여 칼리닌을 끝까지 지켜라!

dialogue_3000=선두 부대는 적의 육상 증원을 차단하여 스탈린그라드를 성공적으로 포위했다.
dialogue_3001=제3제국의 운명은 우리 손에 달려있다. 우리는 기계처럼 냉혹하고 무자비하게 적을 짓누를 것이다. 스탈린그라드는 우리의 불멸을 목격할 것이다!
dialogue_3002=등 뒤가 바로 볼가 강이다. 우리는 퇴로가 없다! 반역자는 처형될 것이고, 살아남은 병사는 특진의 영예를 받게 될 것이다!
dialogue_3003=비록 나는 전선을 떠날 것이지만, 나의 마음은 여전히 당신들과 함께 할 것이다. 역경은 우리의 의지에 대한 시험일 뿐이며, 이를 극복하면 승리는 결국 우리의 것이다.
dialogue_3004=내가 이곳에 온 이유는 후퇴를 지원하러 온 것이 아니라 적을 철저하게 격파하기 위해서다. 우리는 모든 길목, 모든 공장, 모든 폐허에서 적의 공격을 저지할 것이다.
dialogue_3005=높은 곳에서 내려다보면 적은 체스알에 불과하다. 매번 급강하는 적에 대한 심판이 될 것이다!
dialogue_3006=그들은 자신이 전세를 장악했다고 생각하지만, 진정한 위험이 그들을 향해 다가가고 있다는 것을 깨닫지 못했다. 반격의 광풍은 그들을 완전히 곤경에 빠뜨릴 것이다.
dialogue_3007=적들은 자신이 절대적인 존재라고 생각했지만, 우리는 그 오만함을 완전히 무너뜨렸다. 카라치를 탈취하면, 적의 악몽의 시작이 될 것이다.
dialogue_3008=적의 포위망은 일시적일 뿐이다. 지원군이 도착하면 적의 승리의 꿈은 완전히 깨질 것이다. 어떤 대가를 치르더라도 스탈린그라드를 증원하라!
dialogue_3009=모든 전투는 승리의 길을 닦는 것이며, 모든 타격은 적에게 종말을 알리는 종소리를 울리는 것이다.
dialogue_3010=전쟁터에서 나는 오직 한 가지 일만 한다. 즉, 적이 마지막 숨을 쉬는 순간을 결정한다.
dialogue_3011=군인으로서 나는 내 의무를 다하기 위해 최선을 다했지만, 궁지에 직면한 우리의 선택지는 많지 않다.
dialogue_3012=나는 가장 어려운 조건에서도 엄청난 용기를 보여준 나의 병사들을 자랑스럽게 생각한다. 여기서 희생된 병사들이 편히 잠들 수 있기를 바란다.
dialogue_3013=스탈린그라드의 모든 돌이 적의 묘비가 될 것이다!
dialogue_3014=하늘에 독수리 한 마리가 사라졌고, 나의 운명도 여기서 끝났다. 하지만 쓰러지더라도 나는 마지막 불꽃을 불태울 것이다.
dialogue_3015=모든 것이... 다 끝났는가? 이 총알은 내 목숨을 앗아갈 수 있지만, 우리 복수의 분노는 영원히 사라지지 않을 것이다.

