elite_intro_86=토플-M 대륙 간 탄도 미사일은 소련이 설계한 RT-2PM 토플을 기반으로 개발한 신형 대륙 간 탄도 미사일이다. 3단 고체연료 로켓이 제공하는 엄청난 추진력으로 마하 20 이상의 속도로 비행할 수 있으며, 러시아에서 발사될 경우 미국 본토를 사정권에 둘 수 있다. 대형 수송차로 이동이 가능하다.
elite_intro_87=앨리버크 구축함은 미국 해군의 신형 구축함으로, 지금까지도 세계에서 가장 전력이 강한 구축함 중 하나이다. Mk 41 수직 발사 시스템이 세로로 설치되어 있어 중거리 미사일과 토마호크 순항 미사일을 발사할 수 있는 동시에 대량의 목표물을 처리할 수 있다. 테러와의 전쟁과 제2차 페르시아 만 전쟁에서 여러 호위 임무를 훌륭하게 수행했다.

feat_name_110=위장 보호
feat_name_111=포화 공격
feat_name_112=나노 복구
feat_name_113=레이저
feat_name_114=사격통제 방해
feat_name_115=제압

feat_desc_110=산지와 삼림 지형에서 받는 피해 {1}% 감소.
feat_desc_111=근거리 미사일을 여러 발 발사하여 목표물에 근거리 미사일 피해 {1}% 입히고, 대상 주변의 적에게 피해 {2}% 입힘. 쿨타임 3라운드.
feat_desc_111_Lv2=근거리 미사일을 여러 발 발사하여 목표물에 근거리 미사일 피해 {1}% 입히고, 대상 주변의 적에게 피해 {2}% 입힘. 쿨타임 2라운드.
feat_desc_111_Lv3=중거리 미사일을 여러 발 발사하여 목표물에 중거리 미사일 피해 {1}% 입히고, 대상 주변의 적에게 피해 {2}% 입힘. 쿨타임 2라운드.
feat_desc_112=매 라운드 시작 시 HP 상한의 {1}%를 회복함. HP가 가득 차 있을 경우 받는 피해 {2}% 감소.
feat_desc_113=건물이 아닌 유닛에 대한 데미지 +{1}%.
feat_desc_114=공격 후 적은 {0}% 확률로 일반 공격과 반격을 할 수 없는 상태가 됨. 지속 시간 1라운드.
feat_desc_115=적군 섬멸 후, 대상 주변 1칸의 다른 적군은 {1}% 확률로 사기가 떨어짐.

army_buff_desc_1391=사격통제 방해: 일반 공격과 반격 불가(고정익 항공기와 미사일 공격, 난사 제압은 영향을 받지 않음)


dialogue_2883=여러분, 괌은 지금 무방비 상태이니 가능한 한 빨리 점령해야 한다!
dialogue_2884=제4기갑집단군은 스탈린그라드로 돌격하라. 반드시 제6집단군을 구출해야 한다!
dialogue_2885=진지를 확보하고, 포위망이 완전하게 유지되도록 보장하라!
dialogue_2886=제6집단군은 기회를 잡아 가능한 한 빨리 포위망을 뚫어라!
dialogue_2887=우리의 보급품은 다 떨어졌다. 전군은 포위 돌파를 포기하고 지원을 기다려라.
dialogue_2888=적 방어선을 돌파하고 아르덴 산지를 넘어 앤트워프로 돌격하라!
dialogue_2889=전선을 확보하고 독일군이 보급선을 위협하지 못하게 하라!
dialogue_2890=각 부대는 디난에 집결하고 독일군의 공세를 막아라!
dialogue_2891=보급품이 도착했다! 병사들이여, 복수할 시간이 왔다. 돌출부의 모든 적을 섬멸하라!
dialogue_2892=군대는 계획을 완성할 능력을 잃었다. 전군은 철수하고 실력을 보존하라.
dialogue_2893=군대가 아르덴 산악을 안전하게 통과할 수 있도록 반드시 바스토뉴를 점령해야 한다!
dialogue_2894=바스토뉴를 사수하라. 제3집단군은 곧 지원하러 올 것이다!
dialogue_2895=빠르게 돌격하여 바스토뉴의 포위를 뚫어라!
dialogue_2896=동지들이여, 적이 약해졌다. 남부 집단군을 격파하고 우크라이나를 해방하라!
dialogue_2897=모든 부대는 마지막 순간까지 사수하고 절대 후퇴하지 말아라!
dialogue_2898=원수의 명령에 따라 내가 지휘권을 인수한다. 모든 부대는 방어선을 확고히 하고 교대로 후퇴하여 전력을 보존하라.
dialogue_2899=바투틴 장군은 부상에서 회복 중이니 내가 지휘권을 인수할 것이다. 모든 부대는 계속 공격하라!
dialogue_3100=독일군의 샤른호르스트가 출동해 우리 호위대를 수색하고 있다. 그를 침몰시켜라! 이제 북극 항로는 안전하다.
dialogue_3101=동지들이여, 적은 우리의 동포를 학살하고 전우를 살해했다. 그들을 위해 복수하라! 전군, 공격하라!
dialogue_3102=적의 위선적인 항복 권유는 사실 우리를 완전히 섬멸하려는 계략이다. 병사들이여, 도시를 사수하고 지원을 기다려라. 승리는 반드시 우리의 것이다!
dialogue_3103=부다페스트는 더 이상 지킬 수 없게 되었다. 돌파할 수 있다면 돌파하고, 돌파할 수 없다면 항복하라. 조국은 우리의 희생을 기억할 것이다.
dialogue_3104=적군의 대부대가 북쪽으로 이동하기 시작했다! 적의 약점을 노려 스트라스부르를 점령하라!
dialogue_3105=알자스 지역은 병력이 약하니 조심하여 방어하라. 필요한 경우 부대는 보주 산맥으로 철수하여 방어선을 구축하라.
dialogue_3106=스트라스부르를 점령하고 적을 보주 산맥에서 몰아내라!
dialogue_3107=전선을 지켜라. 아르덴 산지에 있는 부대가 지원을 위해 출발했다!
dialogue_3108=미국에서 수천 명의 군인과 수백 대의 비행기가 파견되어 이쪽으로 다가오고 있다. 우리 부대는 후퇴하지 말고 지원군이 도착할 때까지 버텨야 한다.
dialogue_3109=나는 탈출했지만, 반드시 돌아올 것이다!
dialogue_3110=베테랑은 결코 죽지 않고 단지 천천히 사라질 뿐이다.
dialogue_3111=너희들은 나를 포로로 잡을 수 있고, 바탄은 함락될 수 있으나, 전 세계 자유를 사랑하는 사람들의 정신은 결코 꺾이지 않을 것이다!
dialogue_3112=필리핀, 내가 돌아왔다! 각 부대는 상륙한 후 남동쪽으로 진격하여 마닐라를 해방시켜라!
dialogue_3113=적 함선의 함포 지원을 피하기 위해 해안에서 멀리 떨어져 싸워라. 그리고 지킬 수 없다면 산악지대로 철수하여 소모전을 치러라!
dialogue_3114=동지 여러분, 레닌그라드 시민들은 800일 넘게 포위에 저항했다. 우리는 이런 상황이 계속되는 것을 용납할 수 없다! 공격하라! 레닌그라드를 해방하라!
dialogue_3115=레닌그라드의 포위망이 뚫렸다. 독일군은 정의의 승리를 막을 수 없다! 동지들이여, 계속 추격하라!
dialogue_3116=퀴흘러 장군이 해임되었으니 이제부터 내가 지휘한다. 전선 부대는 전선을 수축하고, 페이푸스 호 서쪽으로 철수하라.
dialogue_3117=소규모 부대는 왼쪽에서 적의 주의를 끌고, 주력 부대는 산의 오른쪽에서 공격하여 '라이트훅'으로 적의 방어선을 뚫어라!
dialogue_3118=산과 계곡에 의지하여 방어선을 구축하고, 어떤 진지도 포기해서는 안 된다!
dialogue_3119=카시노의 수도원은 적의 관측 지점일 가능성이 높다. 공군의 폭격이 곧 도착할 것이다. 병사들이여, 그 진지를 점령하라!
dialogue_3120=병사들이여, 공격하라! 프랑스 영토를 탈환하라!
dialogue_3121=제19집단군은 즉시 철수하라. 적에게 포위되어 섬멸되지 않도록 조심하라.
dialogue_3122=이 전투의 최우선 임무는 적을 섬멸하는 것이다. 먼저 남북 양쪽에서 포위를 완성한 후, 포위망 안의 적을 공격하라.
dialogue_3123=포위망이 형성되었다. 동지들이여, 공격하라! 포위망 안의 적을 섬멸하라!
dialogue_3124=빨리 포위망을 뚫어라! 포위망 밖의 부대는 신속하게 공격하여 포위망 돌파를 지원하라!
dialogue_3125=돌출부 부대는 빠르게 철수하여 재정비하고, 다른 부대는 진지를 확고히 하라.
dialogue_3126=먼저 오울루 주변 도시의 적군을 격퇴한 다음 남부의 적군과 싸워라. 전사들이여, 싸워라! 독립 핀란드를 위하여!
dialogue_3127=독일의 지원이 도착했지만, 적군의 훈련 수준은 우리만 못하다. 전사들이여, 공격하라!
dialogue_3128=적에게도 지원군이 있나? 전사들이여, 수송선을 차단하고 지원군을 지연시키면 승리는 반드시 우리의 것이다!
dialogue_3129=나는 독립적이고 평화로운 핀란드가 탄생할 때까지 해외로 나가 투쟁을 계속할 것이다!
dialogue_3130=너희들은 러시아의 도움으로 승리하더라도 핀란드의 독립을 확보할 수 없다!
dialogue_3131=일본군의 방어력이 약하다. 이번 전투로 그들에게 미국 해군의 맛을 보여줄 것이다!
dialogue_3132=함재기 출동. 항공모함의 위력을 직접 보여줘라!
dialogue_3133=적의 지원군이 도착했으니 모든 부대는 이동 속도를 높여라!
dialogue_3134=동지들이여, 적은 강둑을 지키며 저항하고 있다. 우리 포화로 적에게 정의가 승리하는 이유를 보여주자!
dialogue_3135=우리는 조국 영토의 경계에 서 있다. 어떤 후퇴도 결국 전쟁의 불길을 독일로 끌어들일 것이다. 우리는 절대 후퇴하지 않을 것이다!
dialogue_3136=동지 여러분, 적이 한때 우리의 전진을 방해했다. 하지만 이번에 그들은 병력을 다른 곳으로 분산해야 한다. 이번 전투로 방어선을 공략하라!
dialogue_3137=병사들이여, 우리는 적의 공세를 막아낸 적이 있다. 이번에도 우리는 할 수 있다! 조국을 위하여!


event_208=검은 전갈의 기원

