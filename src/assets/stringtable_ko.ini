synergy_tactics_6_1=・모든 '번개사단' 유닛은 이번 턴에 이동하지 않았을 경우, 턴 종료 시 자신에게 '참호 구축' 상태 부여.(참호 구축: 방어력 +30%, 이동 후 자동 해제.)
synergy_tactics_6_2=・장공의 번개: '번개사단' 유닛 주변 3칸 내 적군이 공군에게 공격받을 경우, 이번 턴 공격력 +20.
synergy_tactics_6_3=경장 기동: '번개사단' 보병 유닛이 이번 턴에 이동하지 않았을 경우, 턴 종료 시 주변 2칸 내 '번개사단' 유닛의 다음 턴 이동력 +6.
synergy_tactics_6_4=대기갑 전술: '번개사단' 포병 유닛 주변 2칸 내에 '번개사단' 보병 유닛이 존재할 경우, 장갑 유닛에 대한 데미지 +30%.

