synergy_tactics_1_1=• Todas las unidades de la División Fantasma reciben +3 de movilidad.
synergy_tactics_1_2=• Ofensiva Conjunta: por cada unidad "División Fantasma" amiga dentro de 2 casillas, las unidades blindadas "División Fantasma" infligen un 2% de daño adicional al atacar.
synergy_tactics_1_3=• Persecución al Enemigo en Huida: si una unidad amiga adyacente de la "División Fantasma" ha eliminado a un enemigo en este turno, las unidades de infantería "División Fantasma" pueden volver a moverse. (Se activa una vez por turno)
synergy_tactics_1_4=• Observaciones Fronterizas: si hay una unidad de infantería "División Fantasma" amiga adyacente, daño de las unidades de artillería "División Fantasma" +10%.
synergy_tactics_2_1=• Ataque de todas las unidades "Punta de Lanza" +10.
synergy_tactics_2_2=• Coordinación Infantería-Tanque: si hay una unidad de infantería "Punta de Lanza" amiga adyacente presente, daño de ataque crítico de las unidades blindadas "Punta de Lanza" +20%.
synergy_tactics_2_3=• Maniobras de Enjambre: por cada unidad "Punta de Lanza" amiga dentro de 2 casillas, movilidad de las unidades de infantería "Punta de Lanza" +2.
synergy_tactics_2_4=• Apoyo de Posición Defensiva: si hay una unidad "Punta de Lanza" amiga adyacente, daño recibido por las unidades de artillería "Punta de Lanza" -15%.
synergy_tactics_3_1=• Todas las unidades terrestres de la "División Tamán" obtienen un 10% de posibilidades de esquivar (no aplica con ataques aéreos).
synergy_tactics_3_2=• Operaciones Anfibias: las unidades terrestres amigas de la "División Tamán" que se encuentren dentro de 2 casillas de otra unidad naval "División Tamán" ignoran la penalización de movilidad al embarcar, movilidad +2.
synergy_tactics_3_3=• Guía de Tiro: por cada unidad "División Tamán" amiga dentro de 2 casillas, probabilidad de ataque crítico de las unidades de artillería "División Tamán" +4%.
synergy_tactics_3_4=• Apoyo de Potencia de Fuego: si hay una unidad "División Tamán" amiga adyacente presente, las unidades de infantería "División Tamán" obtienen alcance +1 pero daño -15% en alcance máximo.


