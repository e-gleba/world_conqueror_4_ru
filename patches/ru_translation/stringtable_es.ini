feat_desc_76=El rango de ataque cambió a 2, capaz de atacar a múltiples tropas enemigas, {1}% de probabilidad de que las tropas enemigas no puedan contraatacar al atacar, dura 1 turno, recuperación de 2 turnos.
feat_desc_76_Lv3=El rango de ataque cambió a 2, capaz de atacar a varias tropas enemigas, el daño a otros objetivos no se reduce, al atacar hay un {1}% de probabilidad de que las tropas enemigas no puedan contraatacar, dura 1 turno, recuperación de 2 turnos.
feat_desc_77=Reduce el daño de las unidades blindadas en un {1}%.
feat_desc_78=Ignora los efectos de esquivo y las bombas de humo y aumenta el daño infligido a las defensas de la ciudad en un {1}%.
feat_desc_79=Dispara una bomba de humo que se envuelve en una cortina de humo y no puede ser atacada activamente por las fuerzas terrestres, dura 1 turno, con un tiempo de recuperación de 3 turnos.
feat_desc_79_Lv2=Dispara una bomba de humo que se envuelve en una cortina de humo y no puede ser atacada activamente por las fuerzas terrestres, dura 1 turno, con un tiempo de recuperación de 2 turnos.
feat_desc_79_Lv3=Dispara una bomba de humo que se envuelve en una cortina de humo, incapaz de ser atacada activamente por las fuerzas terrestres, con una probabilidad del {1}% de poder atacar una vez más por 1 vez, dura 1 turno, con un tiempo de recuperación de 2 turnos.
feat_desc_80=Mientras estás en un efecto de bomba de humo, ignora el {1}% de la defensa enemiga.
feat_desc_81=Al lanzar misiles, puedes cargar ojivas atómicas, inicialmente teniendo dos y restaurando una cada {1} turno. Máximo 4.
feat_desc_81_Lv2=Al lanzar misiles, puedes cargar ojivas de hidrógeno, inicialmente teniendo dos y restaurando una cada {1} turno. Máximo 4.
feat_desc_81_Lv3=Al lanzar misiles, puedes cargar ojivas trifásicas, inicialmente teniendo dos y restaurando una cada {1} turno. Máximo 4.
feat_desc_82=Puede disparar misiles balísticos de corto alcance hasta 2 veces por turno. Reemplaza los ataques normales.
feat_desc_82_Lv2=Puede disparar misiles balísticos de medio alcance hasta 2 veces por turno. Reemplaza los ataques normales.
feat_desc_82_Lv3=Puede disparar misiles balísticos de alcance intermedio hasta 2 veces por turno. Reemplaza los ataques normales.
feat_desc_83=No puede ser atacado por unidades terrestres, el daño recibido por unidades de fuerza aérea disminuye un {1}%.
feat_desc_84=Selecciona una línea recta y avanza hasta máximo {1} casillas (la ubicación del objetivo debe ser un espacio abierto, será bloqueado por unidades flotantes en el aire), infligiendo daño de ametrallamiento en el camino, recuperación de 2 turnos.
feat_desc_85=Puede despegar dentro de 1 hexágono de un portaaviones. Ignora los efectos de cualquier tipo de terreno en la movilidad, ignora los efectos de las minas terrestres o navales y las fuerzas enemigas no pueden contraatacar al atacar. La efectividad del combate no disminuirá cuando se reduzca la salud
feat_desc_87=Cuando es atacado por las fuerzas terrestres o navales, hay un {1}% de probabilidad de esquivar el daño.

event_105=Ataque en Pearl Harbor
event_intro_105=Al comienzo de la Segunda Guerra Mundial, las ambiciones de Japón para la región de Asia-Pacífico creció y trató de alcanzar sus objetivos estratégicos a través de operaciones militares. Sin embargo, con la agresión y expansión japonesa, Estados Unidos impuso gradualmente restricciones al comercio de Japón en diversos recursos, como el petróleo y el acero. Estas restricciones afectaron seriamente el poderío militar de Japón. En este contexto, Japón adoptó una postura cada vez más radical, intentando aniquilar el poder militar estadounidense en el Pacífico de un solo golpe a través de un ataque sorpresa sigiloso pero completo.

