legend_stage_40101=Operación Compass
legend_stage_40102=Operación Battleaxe
legend_stage_40103=Operación Crusader
legend_stage_40104=Avance en El Alamein
legend_stage_40105=Campaña de Túnez
legend_stage_40106=Persecución en Italia

legend_intro_40101=La 7ma División Blindada británica, reformada a partir de las fuerzas móviles estacionadas en Egipto, se ganó el apodo de "Ratas del Desierto" por su mascota, un jerbo. Durante la Operación Compass, lanzada por el general Wavell en diciembre de 1940, la división aprovechó al máximo su movilidad blindada y se convirtió en la principal fuerza de ataque. Capturaron sucesivamente posiciones clave como Bardia y Tobruk y, con audaces maniobras a través del desierto, interceptaron con éxito al cuerpo italiano que se retiraba de Bengasi, capturando a un gran número de tropas enemigas. En esta campaña, la 7ma División Blindada arrasó Cirenaica y, con sus extraordinarios logros, hizo que el nombre de "Ratas del Desierto" resonara por primera vez en los campos de batalla del norte de África.
legend_intro_40102=En 1941, para rescatar Tobruk del asedio del Afrika Korps de Rommel, los británicos lanzaron la Operación Battleaxe. En esta batalla, la 7ma División Blindada sirvió como punta de lanza del ataque, demostrando una notable movilidad y capacidad de asalto al capturar con éxito el Fuerte Capuzzo y romper brevemente las líneas alemanas. Si bien la operación no logró cambiar el curso de la guerra, a pesar de los reveses en los ataques aliados y una fuerte contraofensiva alemana, la 7ma División Blindada se retiró con éxito ante la adversidad, preservando su fuerza principal y manteniendo una unidad crucial para los contraataques posteriores en el frente norteafricano.
legend_intro_40103=Tras analizar las lecciones aprendidas de campañas anteriores, el 18 de noviembre de 1941, el recién nombrado Comandante en Jefe en Oriente Medio, el general Auchinleck, ideó la Operación Crusader con el objetivo de destruir las fuerzas blindadas alemanas que rodeaban Tobruk y liberar la ciudad. La 7ma División Blindada, punta de lanza de la ofensiva, avanzó rápidamente hacia Sidi Rezegh. Para impedir que los Aliados rompieran el cerco, Rommel concentró sus unidades blindadas para lanzar un feroz asalto sobre Sidi Rezegh. Frente al cerco alemán, la 7ma División Blindada demostró una tenacidad y una capacidad de combate extraordinarias, no solo resistiendo los contraataques alemanes, sino también ejecutando rápidas maniobras en el desierto para atacar las líneas de mando y logística enemigas, sentando las bases para la victoria aliada.
legend_intro_40104=Durante la Segunda Batalla de El Alamein, la 7ma División Blindada británica sirvió como punta de lanza del 8vo Ejército británico, demostrando una movilidad y capacidad de asalto excepcionales. En las primeras etapas de la batalla, la división contuvo a las fuerzas enemigas en el sector sur del frente. Cuando la situación se estancó, el mando británico redesplegó decisivamente la 7ma División Blindada hacia el norte para reforzar la dirección principal de la ofensiva. En la decisiva "Operación Supercharge", la 7ma División Blindada, junto con sus unidades hermanas, lanzó un feroz asalto hacia el corazón de la línea defensiva alemana. Finalmente, lograron romper las defensas combinadas germano-italianas del Eje y se unieron a la 1ra y la 10ma Divisiones Blindadas en una amplia persecución por el desierto, contribuyendo así de forma crucial a la victoria final de los Aliados en esta batalla decisiva.
legend_intro_40105=Durante la campaña de Túnez, actuando como vanguardia de las fuerzas aliadas, la 7ma División Blindada británica lanzó un audaz asalto contra la Línea Mareth en marzo de 1943. Haciendo gala de excepcionales tácticas de maniobra, rompieron con rapidez y destreza las líneas enemigas en el inhóspito y accidentado terreno, flanqueando con éxito a las fuerzas alemanas. En la batalla del río Wadi Akarit, la 7ma División Blindada demostró una vez más su pericia en la guerra del desierto, lanzando precisos asaltos blindados que arrasaron las posiciones italianas. Como la primera unidad británica en entrar en Túnez, las "Ratas del Desierto" exhibieron su excelente coordinación blindada y su capacidad de rápido avance, contribuyendo significativamente a la eventual derrota de las potencias del Eje en el norte de África y añadiendo otro brillante capítulo a su distinguida trayectoria en combate.
legend_intro_40106=En 1943, tras su redespliegue a Italia, la 7ma División Blindada se enfrentó a un desafío completamente nuevo: la transición del desierto abierto al terreno montañoso y accidentado, un entorno de combate totalmente distinto. Sin embargo, esta división, conocida como las "Ratas del Desierto", demostró una notable adaptabilidad y capacidad ofensiva. Tras desembarcar en Salerno, no solo resistieron los feroces contraataques alemanes, sino que también avanzaron hacia el norte, capturando con éxito Nápoles. Este logro aceleró significativamente la retirada de Italia de la guerra, demostrando una vez más que merecían su reputación como una formidable fuerza de élite.

synergy_tactics_4_1=• Para todas las unidades "Ratas del Desierto", cuando se mueven sobre casillas de desierto, el consumo de movilidad es -1.
synergy_tactics_4_2=• Supresión de Artillería: Después de que una unidad de artillería "Ratas del Desierto" ataque, las unidades enemigas dentro de 2 casillas reciben "Supresión de Artillería"; Supresión de Artillería: recibe un 10% más de daño cuando es atacado por una unidad "Ratas del Desierto".
synergy_tactics_4_3=• Acecho Blindado: Siempre que una unidad blindada "Ratas del Desierto" elimine a una unidad enemiga que tenga el efecto "Supresión de Artillería", esa unidad blindada obtiene +2 de movilidad en su siguiente turno.Aumenta la Movilidad máxima en 20.
synergy_tactics_4_4=• Mantenimiento Mecánico: Al final de cada turno, cualquier unidad de artillería y blindada "Ratas del Desierto" que se encuentre a una casilla de cualquier unidad de infantería "Ratas del Desierto" recupera 50 PV.

army_buff_desc_1581=Supresión de Artillería: recibe un 10% más de daño al ser atacado por una unidad "Ratas del desierto".

