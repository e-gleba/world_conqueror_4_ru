dialogue_4000=Tras sortear rápidamente Arrás, debemos capturar los puentes sobre el río Scarpe lo antes posible. La 5ta División Blindada ya ha recibido órdenes y llegará pronto para brindar apoyo.
dialogue_4001=En este momento, los ejércitos francés y británico recibieron respectivamente órdenes de prepararse para lanzar una contraofensiva en Arrás.
dialogue_4002=Contacten con el 25to Regimiento Panzer. Necesito que suspendan sus operaciones de búsqueda libre y coordinen sus operaciones con la división.
dialogue_4003=Haz clic en el botón "Formación de Legión".
dialogue_4004=Haz clic en la legión que quieras formar.
dialogue_4005=Haz clic en la unidad que desea incluir.
dialogue_4006=Haz clic en el botón "Confirmar Formación".
dialogue_4007=25to Regimiento Panzer, escuchen, se les ordena avanzar con cautela, preservar sus fuerzas y coordinarse con la fuerza principal de infantería para capturar y asegurar el puente.
dialogue_4008=¡Maldita sea! ¡El blindaje del tanque enemigo es demasiado grueso! ¡Avisen al frente de inmediato! ¡Aplanen el cañón de 88 mm y úsenlo como arma antitanque!
dialogue_4009=¿Un ataque frontal directo? Eso tendrá un coste. Pero a veces, ¡la ruta más directa puede desbaratar todos los planes del enemigo!
dialogue_4010=Las fuerzas francesas avanzaron para proteger el flanco derecho del ejército británico, pero debido a una falla en las comunicaciones, también identificaron erróneamente al ejército británico como el enemigo.
dialogue_4011=Tras el enfrentamiento, ambos bandos han confirmado que son fuerzas amigas y el ejército francés continúa avanzando.
dialogue_4012=Alerten a la Fuerza Aérea. La ofensiva enemiga es extremadamente intensa y nuestra unidad requiere apoyo aéreo.
dialogue_4013=El enemigo se retira. ¡Todas las unidades, tras ellos! ¡Capturen Arrás!
dialogue_4014=Avancen rápidamente a lo largo de la orilla del río Niemen y capturen Alytus.
dialogue_4015=¡Excelente! ¡Defiendan el puente de Alytus y no permitan bajo ninguna circunstancia que el ejército soviético lo recupere!
dialogue_4016=Mientras tanto, la 5ta División de Tanques soviética avanza con rapidez para reforzar Alytus. Su primera vanguardia está a punto de llegar.
dialogue_4017=La fuerza principal de la 5ta División de Tanques soviética llegó a Alytus.
dialogue_4018=Estoy plenamente al tanto de la situación en Alytus. También he solicitado apoyo de la Fuerza Aérea. ¡Su unidad debe defender Alytus a toda costa!
dialogue_4019=El reconocimiento aéreo indica refuerzos sustanciales en Alytus. La prioridad principal es atacar los puentes en el curso superior del río Niemen, obligando al enemigo a dividir sus unidades para brindar apoyo.
dialogue_4020=¡Somos dignos de ser la "División Fantasma"! Los refuerzos soviéticos han sido derrotados. ¡Notifiquen a las demás tropas, ataquen con todas sus fuerzas y ocupen las ciudades al oeste del río Niemen!
dialogue_4021=Ordenen al 3er y 4to Grupo Panzer que rompan las defensas soviéticas en un asalto frontal y completen el cerco desde la retaguardia de Viazma.
dialogue_4022=Hay que abrirse paso entre las tropas combinadas del 19no y el 30mo Ejército y luego unirse con el 4° Grupo Panzer en la retaguardia de Viazma.
dialogue_4023=Desplieguen las unidades de tanques de los Ejércitos 19no, 30mo y 49no para rodear a las fuerzas enemigas. ¡Eviten que sigan avanzando!
dialogue_4024=Informen a las tropas de primera línea que se retiren de sus posiciones inmediatamente para evitar el cerco enemigo.
dialogue_4025=El 4to Grupo Panzer repelió al Frente de Reserva Soviético bajo el mando de Budyonny y se prepara para avanzar sobre Viazma.
dialogue_4026=La exitosa unión con el 4to Grupo Panzer permitió formar el cerco en Viazma.
dialogue_4027=¡Ábranse paso hacia el este con todas nuestras fuerzas! ¡No debemos permitir que las fuerzas alemanas nos capturen!
dialogue_4028=Esto es lo más cerca que hemos estado de la victoria. No piensen en nada más, su única tarea es: ¡capturar Yakhroma y avanzar hacia Moscú desde el norte!
dialogue_4029=¡Soldados! La guerra ha llegado a su punto decisivo. ¡Debemos ganar! ¡La victoria es nuestra única opción!
dialogue_4030=En Siberia, el viento nevado aúlla. El duro clima afectó gravemente el campo de visión y la efectividad en combate de las fuerzas alemanas.
dialogue_4031=La captura de Klin por la 7ma División Panzer ha restringido aún más el perímetro defensivo norte de Moscú.
dialogue_4032=Notifiquen a Rokossovsky: ¡El 16to Ejército debe interceptar a toda costa a las fuerzas enemigas que se dirigen hacia Klin! ¡No se les debe permitir entrar en Moscú!
dialogue_4033=Tras derrotar a las fuerzas soviéticas de Yakhroma, las fuerzas alemanas prepararon el terreno para el cerco a gran escala de Moscú desde el norte.
dialogue_4034=El 1er Ejército de Choque debe mantener la línea defensiva a toda costa. ¡No debe permitir bajo ningún concepto que el ejército alemán atraviese Krasnoarmeisk!
dialogue_4035=La silueta del Kremlin es apenas visible, pero el combustible y la munición del 3er Grupo Panzer están prácticamente agotados. La posibilidad de entrar en Moscú depende de un milagro.
dialogue_4036=¡Increíble! La 7ma División Panzer ha irrumpido en Moscú. Pero esto también ha desencadenado la más feroz resistencia dentro de la ciudad.
dialogue_4037=El Ejército de Defensa de la Ciudad de Moscú está en posición y ha destruido a todos los enemigos que pisan la capital. ¡Ha llegado la hora gloriosa! ¡Somos Moscú!
dialogue_4038=Atención, Grupo de Ejércitos Sur: con el 4° Ejército Panzer como fuerza principal y el Destacamento del Ejército Kempf cubriendo los flancos, destruyan al 6to Ejército de la Guardia.
dialogue_4039=La 7ma División Panzer, bajo el mando del Destacamento del Ejército Kempf, también recibió órdenes de prepararse para una ofensiva al este de Bélgorod.
dialogue_4040=La 7ma División Panzer ha forzado con éxito el cruce del Seversky Donets y ha establecido una cabeza de puente a lo largo de la línea defensiva del 7mo Ejército de la Guardia.
dialogue_4041=Notifiquen al 7mo Ejército de la Guardia: acorralen al enemigo y no permitan que refuerce su fuerza principal de ninguna manera posible.
dialogue_4042=Habiéndose expandido aún más, la cabeza de puente ahora puede proporcionar cobertura para el cuerpo principal de tropas.
dialogue_4043=Envíen un telegrama al Jefe del Estado Mayor: El enemigo está a punto de lanzar una ofensiva contra Prokhorovka. Solicito refuerzos de tanques.
dialogue_4044=El 5to Ejército de la Guardia ha sido desplegado para brindar apoyo. ¡Su unidad tiene órdenes estrictas de impedir que el enemigo continúe su avance a toda costa!
dialogue_4045=¿De dónde demonios sacó el ejército soviético tantos tanques? ¡Retírense! ¡No dejen que nuestras tropas queden atrapadas!
dialogue_4046=Tras reprimirlos con la artillería, todo el ejército ataca. ¡Hoy queremos capturar Kiev!
dialogue_4047=Ya no podemos mantener Kiev. La 7ma División Panzer debe reforzar rápidamente Fastiv. No debemos permitir que el enemigo nos corte la ruta de retirada.
dialogue_4048=Todas las tropas, retírense a Fastiv y establezcan una línea defensiva para detener el avance del enemigo.
dialogue_4049=Todas las tropas se retiran a Bila Tserkva.
dialogue_4050=Telegrama para Berlín: Hemos perdido Kiev.
dialogue_4051=Regresen rápidamente para reforzar Yitomir y garantizar que el centro ferroviario no caiga en manos enemigas.
dialogue_4052=El 48vo Cuerpo Panzer lanzó una ofensiva hacia el norte desde Fastiv; debemos formar un cerco en Yitomir para detener el avance de las fuerzas soviéticas.
dialogue_4053=Avancen rápidamente. Todas las unidades, mantengan la línea del frente. ¡No subestimen al enemigo ni avancen precipitadamente!
dialogue_4054=El bombardeo de alfombra de la Fuerza Aérea está a punto de comenzar, y después del bombardeo, ¡atravesarán directamente la línea de defensa enemiga!
dialogue_4055=El bombardeo ha terminado: ¡avancen!
dialogue_4056=Las reservas deben avanzar para llenar la brecha; no debemos permitirles atravesar la línea defensiva.
dialogue_4057=La 3ra División de Tanques rompió con éxito las líneas defensivas, obligando a los alemanes a acortar sus propias líneas.
dialogue_4058=Redesplieguen la 2da División Panzer y la 116ta División como refuerzos. Debemos impedir que el enemigo siga avanzando.
dialogue_4059=Avancen paso a paso y estrechen la red. No dejen que el enemigo escape del cerco.
dialogue_4060=Retírense al este ordenadamente. No permitan que completen su cerco.
dialogue_4061=He hecho todo lo posible, ya es hora de poner fin a esta guerra. Si continúa, solo traerá un desastre para Alemania.
dialogue_4062=Se produjo un atentado con una bomba contra el Führer. Como consecuencia, Kluge fue relevado del cargo y Model asumió en su lugar.
dialogue_4063=Lancen una ofensiva total sobre el cerco del enemigo para abrir un camino para que las tropas sitiadas puedan escapar.
dialogue_4064=Una vez establecido el cerco, las tropas alemanas atrapadas lanzaron un último intento de fuga.
dialogue_4065=Aquisgrán tiene una gran importancia política. Si la capturamos, la moral del enemigo se verá gravemente afectada.
dialogue_4066=¡Hemos asegurado Aquisgrán! Descansen un poco y lancen una ofensiva en el bosque de Hürtgen.
dialogue_4067=Avisen a la retaguardia para que reclute más tropas para completar la línea. Debemos contener al enemigo en el bosque de Hürtgen.
dialogue_4068=El terreno complejo y accidentado del bosque de Hürtgen debilitó gravemente a la 3ra División Panzer.
dialogue_4069=¡Mantengan la fortaleza! Las SS vienen a reforzarla.
dialogue_4070=Esta es una batalla crucial que decidirá el destino de la nación. ¡Solo se permite la victoria, la derrota no es una opción!
dialogue_4071=¡Todo el ejército lanza una ofensiva, avanzando a través de la región de las Ardenas para apoderarse de Amberes!
dialogue_4072=Las unidades blindadas avanzaron rápidamente hacia el bosque de las Ardenas para brindar apoyo y detener el avance del enemigo.
dialogue_4073=Ahora que los frentes norte y sur están bloqueados y las tropas se concentran en el centro, es imperativo atravesar el bosque de las Ardenas.
dialogue_4074=Capturen Bastoña. No debemos permitir que esa ciudad obstaculice nuestro avance.
dialogue_4075=La 101 División Aerotransportada se ha negado a rendirse y continúa defendiendo Bastoña.
dialogue_4076=Refuercen inmediatamente Bastoña, bajo ninguna circunstancia permitan que los alemanes controlen este importante centro de transporte.
dialogue_4077=Con la pérdida de Bastoña, las unidades de apoyo alemanas ahora pueden moverse rápidamente, intensificando aún más la ofensiva alemana.
dialogue_4078=Tras romper la línea defensiva del Rin, el 1er Ejército avanzó desde el sur para cerrar la región industrial del Ruhr.
dialogue_4079=Se le ordenó a la 3ra División Panzer avanzar rápidamente sobre Lippstadt y unirse con las unidades del 9no Ejército.
dialogue_4080=Transmita a las tropas cercadas: Depongan las armas y ríndanse. Los Aliados garantizarán los derechos de los prisioneros de guerra.
dialogue_4081=Como mariscal del Reich, no puedo autorizar una rendición, pero haré todo lo posible para preservar una posibilidad de que los soldados escapen.
dialogue_4082=Atentos a mis órdenes: El Grupo de Ejércitos B debe disolverse. Todas las unidades de combate deben romper el cerco en formación organizada o deponer las armas y regresar a casa.
dialogue_4083=Al menos luché hasta mi último aliento.
dialogue_4084=El comandante de la 3ra División Panzer cayó en batalla, pero su valiente espíritu de lucha inspiró a las tropas a seguir combatiendo.
dialogue_4085=Al negarse a rendirse, Model se suicidó de un disparo.
dialogue_4086=El 24 de febrero de 1991 comenzó la Operación Tormenta del Desierto. Como una de las principales unidades del Ejército de los Estados Unidos, la 3ra División Blindada lanzó una ofensiva contra Irak.
dialogue_4087=Kuwait fue capturado; como resultado de ello, las fuerzas de las Naciones Unidas aumentaron su impulso.
dialogue_4088=El ejército estadounidense activó su sistema de interferencia electrónica, provocando una falla en los sistemas de comunicaciones electrónicas del ejército iraquí.
dialogue_4089=La mayor parte del ejército iraquí fue destruida y las fuerzas de la coalición lograron una victoria aplastante. El gobierno iraquí solicitó formalmente la rendición.
dialogue_4090=La 255ta Brigada de Infantería de la Marina es enviada a la unión de los 56to y 18vo Ejércitos para detener el avance del ejército alemán.
dialogue_4091=El ejército alemán lanzó la Operación Attika para capturar Tuapsé.
dialogue_4092=Las tropas de vanguardia alemanas han llegado a las afueras de Tuapsé. Por favor, regresen inmediatamente para recibir refuerzos.
dialogue_4093=Tuapsé fue capturado por las fuerzas alemanas y el ejército soviético concentró sus fuerzas para sitiar la guarnición alemana.
dialogue_4094=Después de recuperar Tuapsé, el ejército soviético aprovechó el impulso y lanzó una contraofensiva contra las fuerzas alemanas.
dialogue_4095=La 255ta Brigada de Infantería de la Marina estableció con éxito una cabeza de puente. El ejército soviético desplegó rápidamente importantes refuerzos.
dialogue_4096=Los defensores de Novorosíisk se han movilizado para impedir que el ejército soviético siga ampliando la cabeza de puente.
dialogue_4097=La ofensiva de las fuerzas soviéticas llegó a su punto clave y se prepararon para fortificar la cabeza de puente para que sirviera como punto de partida para su próxima operación.
dialogue_4098=Para eliminar la cabeza de puente del enemigo, las fuerzas alemanas aumentaron sus fuerzas de ataque.
dialogue_4099=La cabeza de puente estaba siendo reprimida. Un comisario político llegó junto con los suministros, inspirando a los soldados a resistir en Málaya Zemlia.
dialogue_4100=Se le ordenó a la 255ta Brigada de Infantería de la Marina desembarcar en el puerto de Novorosíisk, con el objetivo de romper las líneas enemigas desde el interior.
dialogue_4101=Las tropas rompieron con éxito las defensas exteriores y posteriormente entraron en la fase de combate urbano con las fuerzas alemanas.
dialogue_4102=Las fortificaciones exteriores de Novorosíisk fueron capturadas y el ejército soviético ganó gradualmente el control de esta ciudad.
dialogue_4103=La exitosa liberación de Novorosíisk llevó a las tropas alemanas a retirarse hacia el noroeste y las fuerzas soviéticas aprovecharon el impulso para perseguirlas.
dialogue_4104=El 18vo Ejército rompió con éxito la línea defensiva en el lado norte de Novorosíisk, estableciendo un cerco al norte.
dialogue_4105=Las fuerzas de desembarco del 18vo Ejército rompieron con éxito el bloqueo naval y desembarcaron en Eltigen. Las fuerzas del Eje concentraron inmediatamente sus tropas para lanzar un contraataque.
dialogue_4106=El saliente de Eltigen logró contener a las principales fuerzas alemanas. Las fuerzas de desembarco del 56to Ejército aprovecharon el impulso y lanzaron un asalto, llevando a cabo una operación de desembarco en el noreste de Kerch.
dialogue_4107=Durante el ataque de las fuerzas de defensa costera del enemigo, que desataron una intensa potencia de fuego, el sargento Kostenko se sacrificó por su país.
dialogue_4108=Se está fortificando la cabeza de puente del norte de Kerch, mientras las fuerzas alemanas están montando una ofensiva total contra Eltigen.
dialogue_4109=En una rápida maniobra, las fuerzas soviéticas emplearon una táctica inesperada para lanzar un ataque sorpresa sobre Kerch, lo que llevó a las tropas del Eje a proporcionar refuerzos rápidamente.
dialogue_4110=Con la exitosa captura de Balaklava, el 49no Cuerpo de Montaña en las Alturas de Sapun quedó rodeado.
dialogue_4111=El 49no Cuerpo de Montaña estacionado en la cresta de Sapun fue rechazado por las fuerzas soviéticas y, en consecuencia, se retiró a la línea defensiva de Sebastopol.
dialogue_4112=Las Alturas de Mackenzie han sido capturadas. La línea defensiva norte del enemigo ha colapsado.
dialogue_4113=Con la liberación de Sebastopol, las fuerzas alemanas se vieron obligadas a retirarse hacia el oeste y prepararse para evacuar por mar.
dialogue_4114=La flota rumana fue rechazada y la moral de las tropas que se retiraban se desmoronó.
dialogue_4115=El ejército soviético completó el bloqueo de Sebastopol. Las tropas del Eje, asediadas y atrapadas en la ciudad, estaban decididas a defenderla hasta el último hombre.
dialogue_4116=Se le ordenó a la 255ta Brigada de Infantería Naval cruzar el estuario del Dniéster al amparo de la oscuridad para establecer una cabeza de puente para las fuerzas principales del 46to Ejército.
dialogue_4117=Las fuerzas de defensa costera del Eje detectaron las fuerzas de desembarco y un asalto a la playa estaba a punto de estallar.
dialogue_4118=Se estableció con éxito la posición en la zona norte de la marea. Se neutralizó a Akkerman, despejando así la posición para las fuerzas principales.
dialogue_4119=La ciudad de Akkerman fue liberada y las fuerzas enemigas se vieron obligadas a abandonar sus defensas en la desembocadura del río.
dialogue_4120=En el frente norte, el 37mo Ejército soviético logró un avance importante. Las fuerzas enemigas comenzaron a retirarse para evitar el cerco.

