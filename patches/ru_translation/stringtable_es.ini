operation_rule_1=1. La campaña del evento está abierta por tiempo limitado. Se sugiere a los comandantes programar el tiempo de manera razonable para obtener recompensas al pasar etapas.
operation_rule_2=2. La campaña está dividida en dificultades normal y difícil, para desbloquear la dificultad difícil es necesario completar la campaña en dificultad normal.
operation_rule_3=3. En la campaña en la dificultad difícil las fuerzas enemigas obtendrán dos beneficios (Ambos aleatorios desde que comience el evento hasta que termine), así que, compañeros comandantes, por favor, planeen su ruta cuidadosamente cuando estén desafiando una campaña de dificultad difícil.
operation_rule_4=4. En esta dificultad de la campaña, los generales que sean eliminados en cada escenario no podrán ser desplegados en el siguiente, solamente al reiniciar el progreso podrán desplegar esos generales nuevamente.
operation_rule_5=5. Después de lograr la victoria en una etapa, se registrará el resultado victorioso más alto en la dificultad actual. El pasar el nivel específico puede recibir recompensas de sección.
operation_rule_6=6. Las recompensas por etapas se dividen en dos tipos, recompensas de cinta y fragmentos de Fuerza de Élite. Quienes reclamen las recompensas recibirán una cierta cantidad de ello.
operation_rule_7_1=7. El restablecer el progreso eliminará el progreso de la campaña en la actual dificultad y las recompensas por etapas. El primer reinicio dentro del límite de tiempo del evento es gratuito, puedes consumir medallas para restablecer tu progreso una vez más. Solo puedes restablecer tu progreso con medallas 1 vez. (La dificultad normal y difícil comparten el número de reinicios)
operation_rule_7=7. El restablecer el progreso eliminará el progreso de la campaña en la actual dificultad.

defensive_rule_1=1. La campaña del evento está abierta por tiempo limitado. Se sugiere a los comandantes programar el tiempo de manera razonable para obtener recompensas al pasar etapas.
defensive_rule_2=2. La campaña está dividida en dificultades normal y difícil, para desbloquear la dificultad difícil es necesario completar la campaña en dificultad normal.
defensive_rule_3=3. En la campaña en la dificultad difícil las fuerzas enemigas obtendrán dos beneficios (Ambos aleatorios desde que comience el evento hasta que termine), así que, compañeros comandantes, por favor, planeen su ruta cuidadosamente cuando estén desafiando una campaña de dificultad difícil.
defensive_rule_4=4. No importa la derrota o la victoria en la etapa, se registrarán los turnos más altos de defensa actuales. Al lograr ciertos turnos de defensa puede reclamar la recompensa de la sección respectiva (Todos los premios de fase se desbloquearán si se elimina a todas las tropas enemigas).
defensive_rule_5=5. El escenario se puede jugar repetidamente, pero abandonar durante la batalla del escenario no registrará los turnos de defensa más altos actuales.
defensive_rule_6=6. Las recompensas por etapas se dividen en dos tipos, recompensas de cinta y fragmentos de Fuerza de Élite. Quienes reclamen las recompensas recibirán una cierta cantidad de ello

event_intro_101=Finlandia pasó 10 años construyendo la Línea Mannerheim como un sistema completo de fortificaciones. Fue construido en el istmo de Karelia, con múltiples zonas defensivas levantadas alrededor de barreras naturales como pantanos y lagos. Detrás de la línea Mannerheim, los guerreros blancos finlandeses estaban preparados para enfrentarse a cualquier enemigo que se atreviera a invadir Finlandia.
event_intro_102=El ascenso de Alemania causó inquietud y preocupación en toda Europa y su expansión territorial ilimitada trajo una perspectiva de guerra en el continente. Las extensas fronteras convirtieron a Polonia en un objetivo inevitable. Aun así, Polonia no necesitaba preocuparse demasiado ya que contaba con un fuerte apoyo verbal de sus aliados como Gran Bretaña y Francia. Pero ¿era Alemania el único país que tenía la vista puesta en Polonia?
event_intro_103=Construido con un coste de billones de francos, la Línea Maginot era capaz de resistir a una gran variedad de ataques, incluyendo bombardeos aéreos y fuego de artillería de gran calibre. Sin embargo, ¿los comandantes alemanes enfrentarían esta línea de defensa directamente o enfocarían su atención en atacar Francia a través de los países bajos? ¿O tendrían otros planes?

event_stage_intro_20101=Europa Occidental está bajo control alemán. El Cuartel General desarrolló el plan Barbarroja y nos pidió que volviéramos nuestra atención hacia la Unión Soviética. Minsk es nuestro objetivo principal y su captura sería un duro golpe para la Unión Soviética y vital para la moral de nuestras tropas.
event_stage_intro_20102=La invasión masiva de la Unión Soviética por parte del ejército alemán es una gran oportunidad para Finlandia. Realizaremos una operación conjunta con el ejército alemán, lanzando una ofensiva al norte de Leningrado para retomar los territorios ocupados por la Unión Soviética durante la Guerra de Invierno.
event_stage_intro_20103=El poder de la Guerra Relámpago se reafirmó con la victoria en Minsk, que tomó a los soviéticos con la guardia baja. ¡No podemos darnos el lujo de detener nuestros tanques! Una vez que Smolensk sea conquistado, podremos controlar este centro de transporte y fortaleza militar.
event_stage_intro_20104=La región de Ucrania es el granero y un gran centro industrial de la Unión Soviética. Tener el control de Kiev significaría tener una gran cantidad de recursos e industria en nuestro poder. Nuestras fuerzas armadas necesitan completar el cerco de Kiev, apoderarse de la ciudad y desestabilizar aún más las defensas soviéticas.
event_stage_intro_20105=Leningrado es el puerto soviético más crucial en la región Báltica, como así también un centro económico importante y cultural-histórico de la Unión Soviética. La captura de Leningrado no solo debilitaría a las defensas soviéticas, también impactaría enormemente la moral y confianza dentro de la Unión Soviética.
event_stage_intro_20106=Crimea tiene una importancia militar significante como la perla del Mar Negro. Nuestras divisiones blindadas han sido transferidas al Grupo Central; por el momento solo la infantería y artillería están disponibles. Sin embargo, los refuerzos del Gustav pesado nos ayudarán a atravesar las fortalezas de Sebastopol.
event_stage_intro_20107=Nuestra ofensiva es imparable. Járkov es una ciudad industrial importante y debemos acelerar nuestro avance. No dejen que los soviéticos transfieran esas fábricas y equipamiento antes de que nos apoderemos Járkov.
event_stage_intro_20108=Briansk y Viazma son las últimas barreras que bloquean nuestro paso hacia Moscú. Necesitamos debilitar las defensas enemigas y expandir nuestro alcance estratégico en orden de prepararnos para atacar Moscú.
event_stage_intro_20109=Stalingrado, es un importante centro industrial del Cáucaso con importantes recursos como el petróleo y gas natural. El enemigo ha desplegado un gran número de tropas para defenderse. Sólo la captura de Stalingrado podría desmoralizar a la Unión Soviética y allanar el camino para nuestra victoria en el Frente Oriental.
event_stage_intro_20110=El gélido invierno en Moscú ha tenido graves efectos en nuestro transporte y suministros logísticos. La resistencia enemiga ha sido mucho más feroz que al principio. Sin embargo, esto no detendrá nuestro avance. Probaremos el champán de la victoria en el Kremlin
