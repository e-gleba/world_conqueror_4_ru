event_705=Batalla de Alaska (Pesadilla)

dialogue_3500=Después de haber derrotado con éxito a la fuerza central del ejército británico, continuamos firmes: ¡ahora la marea ha cambiado!
dialogue_3501=La lucha de los alemanes fue en vano. ¡Detengan el avance y continúen la ofensiva una vez que el cuerpo de reserva esté en posición!
dialogue_3502=Las fuerzas ofensivas soviéticas fueron detenidas, ¡el plan de contraofensiva del Führer no era una mera ilusión!
dialogue_3503=Reorganicen el ejército, Berlín, ¡estoy destinado a ganar!
dialogue_3504=¡Es un milagro! Logramos penetrar la estación de tránsito logístico del ejército estadounidense, ¡el enemigo ahora está desarmado!
dialogue_3505=Activen el depósito de reserva. Unidades de primera línea, mantengan la posición. Los suministros están en camino.
dialogue_3506=Traje todas las tropas que pude controlar. Protéjanme, el pueblo italiano servirá a los Aliados.
dialogue_3507=¡Maldición! Traigan a su ayudante, debemos tranquilizar a los italianos.
dialogue_3508=¡Unidades de primera línea, converjan en Caen! ¡Detengan el avance enemigo!
dialogue_3509=El frente sur se derrumba. Destinen las reservas para detener su avance. Avisen al cuartel general que se necesitan más tropas para mantener la línea.
dialogue_3510=El Cuartel General ha desplegado nuestra unidad para brindar apoyo. La situación en el frente se está deteriorando y debemos conservar nuestras fuerzas.
dialogue_3511=¡La punta de lanza de la ofensiva del enemigo ha sido destrozada y la balanza de la victoria comienza a inclinarse a nuestro favor!
dialogue_3512=Mantengan el frente y continúen la ofensiva. ¡No tenemos otra oportunidad!
dialogue_3513=Bastoña está asegurada y la situación del abastecimiento en la región de las Ardenas ya no supone un problema.
dialogue_3514=Desde que desembarcaron las tropas enemigas, hemos sufrido una derrota tras otra. Pero en esta batalla, debo prevalecer.
dialogue_3515=Quédense tranquilos y regresen al puerto, ¡desde aquí yo me haré cargo de estas aguas!
dialogue_3516=Ya experimenté un fracaso similar una vez en las Filipinas, no tengo miedo de volver a hacerlo.
dialogue_3517=¡La crisis está resuelta! Nuestro ejército necesita el apoyo del pueblo coreano para lanzar una contraofensiva.
dialogue_3518=¡Nuestras fuerzas han establecido la supremacía naval, han tomado Vladivostok y se han apoderado de la base de misiles soviética!
dialogue_3519=¡Esta vez no sólo regresé sino que además les di a los soviéticos una muestra de la derrota!
dialogue_3520=¡Recuperen el control de las Islas Kuriles del Sur y garanticen la seguridad de los puertos!
dialogue_3521=Por favor, ayuden a capturar los puertos costeros, ¡la Armada necesita una base de operaciones avanzada en el Mar de Ojotsk!
dialogue_3522=¡Excelente! La flota pronto estará en posición y recuperaremos el Mar de Ojotsk junto con el ejército.
dialogue_3523=Manténganse firmes en la línea de defensa costera, los refuerzos llegarán lo más rápido posible.
dialogue_3524=La isla San Lorenzo ha caído, ¡bajo ninguna circunstancia podemos permitir que el enemigo se afiance en el continente!
dialogue_3525=Seguir apoyando la línea defensiva costera ya no tiene sentido. Notifique a los refuerzos de retaguardia que se retiren, se redesplieguen y fortifiquen la línea de defensa de Anchorage.
dialogue_3526=Han llegado los refuerzos. Ya tenemos todos los suministros asegurados. Descansemos mientras ellos se agotan, ¡luego los aplastaremos!
dialogue_3527=Los refuerzos europeos están cruzando el océano. Sigan resistiendo, y pronto llegará un punto de inflexión.
dialogue_3528=¡Una vez que hayamos establecido contacto con éxito con fuerzas amigas y tengamos asegurado nuestros suministros, liberaremos a los Estados Unidos!
dialogue_3529=Esta guerra ha ido demasiado lejos. Ya no tiene sentido luchar junto a los estadounidenses. ¡Contacten a los soviéticos! ¡Nos retiramos!
dialogue_3530=¿Canadá quiere abandonar? ¡Traidores! Ordenen a nuestras fuerzas que mantengan la posición dentro de sus fronteras. ¿Retirarse? ¡No tienen elección!
dialogue_3531=Por el Comando Central: Apoye a todos los aliados potenciales. ¡Les damos la bienvenida a luchar junto a nosotros!
dialogue_3532=Para la supervivencia de la nación, no tengo otra opción.
dialogue_3533=¡Han llegado refuerzos europeos! ¡Soldados, por la libertad, retomen nuestro territorio!
dialogue_3534=Las llamas de la guerra han quemado nuestro suelo. ¿Vale la pena continuar esta lucha?
dialogue_3535=Nuestra nación está en peligro. ¡Soldados, defiendan nuestra patria!


