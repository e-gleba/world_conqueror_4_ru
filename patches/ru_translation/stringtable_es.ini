skill_info_145=Al comandar unidades blindadas, por cada enemigo en un radio de 2 casillas, se inflige daño +[#00FF00#%d%%] (máximo 50%%). Cuando las unidades blindadas tienen la moral alta, el daño recibido se reduce en un 20%%.
skill_info_146=Al comandar unidades blindadas, inflige +[#00FF00#%d%%] daño a la fuerza de élite enemiga.
skill_info_147=Al comandar unidades de artillería, la unidad no se ve afectada por el efecto de habilidad que deshabilita el contrataque. Cuando una unidad amiga circundante contrataca, hay una probabilidad del [#00FF00#%d%%] de unirse al contrataque.
skill_info_148=Al comandar unidades de artillería, inflige +[#00FF00#%d%%] daño a enemigos a 2 o más casillas de distancia.
skill_info_149=Daño infligido de las unidades bajo tu mando contra unidades terrestres +[#00FF00#%d%%]. Al capturar una ciudad enemiga, otorga "elogio" a las unidades amigas en un radio de 3 casillas y a ti mismo, lo que aumenta el ataque de la unidad en un 15%%; dura 3 turnos
skill_info_150=Las unidades comandadas ignoran las bombas de humo, el estado fantasma, el efecto de esquiva y el EMCON. Daño infligido al enemigo que esté por debajo de la mitad de los PV +[#00FF00#%d%%]
skill_info_151=PV máximo de las unidades comandadas +[#00FF00#%d%%], no puede entrar en caos cuando la unidad tiene más de la mitad de los PV


dialogue_3138=Nuestras tropas son muy superiores a las japonesas, debemos destruirlas en Singapur. ¡Que Estados Unidos y Rusia vean la dignidad y el honor de Gran Bretaña!
dialogue_3139=La orilla este es plana, lo que facilita el desembarco. ¡Asegúrense de tener cuidado con los desembarcos japoneses desde aquí!
dialogue_3140=Nuestras tropas son muy inferiores a las británicas en fuerza y suministros. ¡Debemos usar tácticas para obligarlas a rendirse, en lugar de luchar una guerra de desgaste con ellas!
dialogue_3141=El enemigo es muy vulnerable. ¡Ataquen con todas sus fuerzas y destruyan su voluntad de resistir!
dialogue_3142=Nuestras tropas han ocupado Bukit Timah. Sus graneros y fuentes de agua ya no son seguros. ¡Abandonen esta resistencia inútil y desesperada!
dialogue_3143=Las tropas de élite harán todo lo posible para recuperar Bukit Timah. De lo contrario, cuando se acaben los suministros, ¡nunca podremos continuar la lucha!
dialogue_3144=¡Eliminemos la fuerza de contrataque de élite británica! Cuando los británicos se queden sin suministros, aceptarán rendirse incondicionalmente.
dialogue_3145=Los suministros de Singapur se han agotado. No podemos seguir luchando. Informen a los japoneses de que estamos dispuestos a rendirnos.
dialogue_3146=Esta operación tiene como objetivo trasladar la flota principal de forma segura a un puerto alemán. La posibilidad de cruzar el canal es limitada, ¡así que debemos actuar con rapidez!
dialogue_3147=Busquen con cuidado. ¡Deben acabar hundidos! ¡Ninguna flota enemiga puede atravesar el Canal de la Mancha en tiempos de guerra!
dialogue_3148=¡Flota objetivo localizada! ¡Vamos a hundirlos!
dialogue_3149=Los pasos de montaña del centro de Túnez son el eje de nuestro ataque a las llanuras orientales. ¡Las tropas deben mantenerlos y no se aceptará ningún fracaso!
dialogue_3150=Dividan el ejército en dos: uno atacará Sidi Bouzid por el sur y el otro por el noroeste. ¡No podemos dejar estos pasos en manos del enemigo!
dialogue_3151=El enemigo está empezando a retirarse. ¡Continúen el ataque y aseguren un punto de apoyo!
dialogue_3152=Tenemos información de que los principales buques de la flota combinada japonesa están anclados en Truk. ¡Soldados, es hora de que Japón pague por lo que hizo en Pearl Harbor!
dialogue_3153=¡Las fuerzas costeras japonesas han sido silenciadas por el fuego de artillería y ya puede desembarcar!
dialogue_3154=Señores, ¡ha llegado la hora final! ¡Debemos enterrar a más enemigos aquí!
dialogue_3155=Atención a las tropas terrestres: los japoneses tienen búnkeres para ocultar su potencia de fuego. ¡Estén alertas!
dialogue_3156=¡Abran fuego! ¡Disparen! Nadie puede realizar una carga Banzai. ¡Todos deben mantenerse firmes y luchar hasta el final!
dialogue_3157=Ante ataques terrestres, marítimos y aéreos cuantitativa y cualitativamente superiores, he hecho lo mejor que he podido, pero ahora siento mucho haber perdido los pasos críticos en manos del enemigo.
dialogue_3158=Las unidades alemanas están rodeando a nuestro ejército por norte y sur, ¡debemos despejarlas para evitar que obstaculicen el ataque!
dialogue_3159=He hecho mi mejor esfuerzo, pero la situación es abrumadora. Ahora lo único que pido es un final digno.
dialogue_3160=Flota enemiga avistada en dirección a Surabaya. ¡Acaben con ellos y Java será nuestra!
dialogue_3161=Atención a todos los barcos. ¡La flota japonesa se acerca a Surabaya! ¡Prepárense para la batalla!
dialogue_3162=El fuego enemigo fue tan feroz que los barcos dañados fueron los primeros en retirarse para ser reparados.
dialogue_3163=¡¿Cómo puedo hundirme en mis aguas?!
dialogue_3164=El frente de Lae necesita tropas desesperadamente. La llegada de esas tropas aliviará la situación y es importante garantizar su entrega segura.
dialogue_3165=Atención a todas las unidades, los transportes de tropas japoneses se han puesto en marcha. ¡Acaben con ellos y quiten la presión de la línea del frente!
dialogue_3166=Nuestro ejército está escaso de suministros. No podemos librar una guerra de desgaste en la línea de defensa. ¡Ataquen y asegúrense de derrotar al enemigo antes de que llegue a la línea de defensa!
dialogue_3167=Soldados, ¡estén alerta! El enemigo atacará pronto. ¡Sin suficientes suministros, no durarán mucho!
dialogue_3168=No, si seguimos luchando no habrá suficientes tropas para defender la Línea Mareth. ¡Todas las tropas, retírense!
dialogue_3169=Soldados, los japoneses están a punto de atacar. Mantengan sus posiciones y sean disciplinados. ¡Seguro que saldremos victoriosos!
dialogue_3170=No se procupen, las entregas aéreas serán suficientes para mantenernos abastecidos. Mantengan Imphal. ¡Los vastos y densos bosques son suficientes para hacer colapsar los suministros del enemigo!
dialogue_3171=¡Recuperen Imphal!
dialogue_3172=El ejército japonés se está quedando sin suministros y la ofensiva no hará más que debilitarse. Soldados, ¡demostremos nuestro coraje y que los japoneses no son en absoluto invencibles!
dialogue_3173=El ejército japonés está indefenso. ¡Eliminemos las tropas japonesas de la isla y liberemos Mindanao!
dialogue_3174=¡Apliquen la estrategia de “resistencia permanente” y nunca abandonen ninguna fortaleza fácilmente!
dialogue_3175=La línea de defensa francesa sigue siendo bastante fiable. ¡Mantengamos la línea y no perderemos!
dialogue_3176=¡Mantengan la presión en el frente y esperen a que la fuerza de maniobra ataque desde el lado izquierdo de la línea y la destruya con un “gancho de izquierda”!
dialogue_3177=¡Maldita sea! ¿Cómo han llegado los británicos al lado derecho de la línea? Todas las tropas escuchan la orden. Abandonen la línea de defensa y retírense hacia el norte.
dialogue_3178=Esta línea de defensa ya no puede mantenerse. ¡Defensores de Mareth, retírense rápidamente y eviten enfrentarse al enemigo!
dialogue_3179=¡Ataquen y aplástelos por completo!
dialogue_3180=Derramé mi última gota de sangre por el Rey. Mi vida ha sido lo suficientemente honorable.
dialogue_3181=¡El mar ha sido despejado y las islas centrales de las Filipinas deben acabar en nuestro control!
dialogue_3182=¡Las tropas que defienden la isla deben utilizar todos los medios para enfrentarse al enemigo y hacer todo lo posible para evitar se apoderen de la isla!
dialogue_3183=¡Hay que asegurar las llanuras orientales! ¡No se debe permitir que el enemigo atraviese nuestras defensas!
dialogue_3184=¡Rompan las líneas enemigas y avancen el frente hacia las llanuras orientales!
dialogue_3185=Ríndanse o no aceptaremos a ningún alemán como prisionero.
dialogue_3186=El 1.er Ejército Panzer debe retirarse hacia el oeste, abriéndose paso hacia el suroeste, ¡listo para recibir refuerzos desde el noroeste!
dialogue_3187=¡¿Despedirme?! ¡Ese tarado! ¡Sin su orden al azar, nada de esto habría sucedido!
dialogue_3188=¿Hay refuerzos alemanes al noroeste? Deténganlos. No podemos permitir que eso suponga una brecha.
dialogue_3189=¡Ataquen! ¡Esta batalla acabará con la Flota Oriental!
dialogue_3190=¿El enemigo viene hacia nosotros? ¡Avancen y hundan todos los barcos principales del enemigo!
dialogue_3191=¿Acaso son unos cerdos idiotas? ¡Cómo se atreven a dejarse hundir por el enemigo! ¡Retírense! Regresen al puerto para hacer reparaciones.
dialogue_3192=Okinawa es un trampolín importante para un ataque a las islas principales japonesas. Capturarla nos permitirá terminar esta guerra lo más rápido posible.
dialogue_3193=El enemigo ha lanzado una carga suicida. ¡Esquiven el ataque!
dialogue_3194=Los partisanos italianos nos apoyarán. Más allá de esta cresta hay un camino llano. ¡Avancen y liberen Italia!
dialogue_3195=Por el bien del territorio que nos queda, nuestro ejército cooperará con la defensa alemana.
dialogue_3196=Cierren los pasos que rodean el lago de Garda. ¡No se puede permitir que el enemigo escape, hay que eliminarlo!
dialogue_3197=Demonios, ¿de dónde ha salido esa turba? ¡Hay que reprimirlos! ¡Arresten a cualquiera que interfiera con la administración militar!
dialogue_3198=Soy el líder supremo del ejército italiano. Me rindo en nombre del ejército italiano.


