event_stage_intro_20214=Las Indias Orientales poseen abundantes recursos, pero la flota conjunta de los aliados se está reforzando y reuniendo aquí. Como provienen de diferentes naciones, esto resulta en una baja eficiencia de coordinación y una falta de mando unificado entre ellos. Nuestra prioridad es asegurar el éxito de las operaciones anfibias y luego eliminar la flota en el Mar de Java.
event_stage_intro_20215=La flota aliada en el Pacífico Sur sufrió sucesivas derrotas. Están reagrupando sus fuerzas con Puerto Moresby como lugar para un contraataque. Debemos aprovechar la oportunidad de las inadecuadas defensas del enemigo y lanzar la Operación MO. No debemos permitir que las fuerzas aliadas tengan alguna posibilidad de lanzar una contraofensiva.
