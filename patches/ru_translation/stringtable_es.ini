feat_desc_98=Entra en estado de fantasma y no puede ser atacado activamente por fuerzas terrestres o navales, con un tiempo de recuperación de 2 turnos. Mientras está en estado de fantasma, la movilidad +{1} dura 1 turno(s). El estado de fantasma no estará disponible después de atacar.
feat_desc_99=El daño infligido al atacar tropas enemigas aumenta un +{1}% (el daño infligido aumenta un +{2}% mientras se está en estado de fantasma), no puede ser contraatacado. El daño infligido se reduce un 50% al atacar edificios.
feat_desc_100=Solicita helicópteros para que te ayuden y te transporten a la ubicación objetivo dentro de 5 casillas, con un tiempo de recuperación de 2 turnos.
feat_desc_100_Lv2=Solicita helicópteros para que te ayuden y te transporten a la ubicación objetivo dentro de 9 casillas, con un tiempo de recuperación de 2 turnos.
feat_desc_101=Recupera el {1}% de PV máximo en el siguiente turno cuando la tropa tenga más de la mitad de PV perdidos.
feat_desc_102=Probabilidad de ataque crítico +{1}% e ignora el {2}% de defensa del enemigo objetivo cuando ataca durante el turno actual, con un tiempo de recuperación de 2 turnos.
feat_desc_103=Aumenta la defensa en un {1}%
feat_desc_104=Las armas antiaéreas no pueden defenderse de los bombardeos a gran altitud.
feat_desc_105=No puede funcionar como una aeronave con base en portaaviones. Cada ataque inflige un {1}% de daño adicional en el área objetivo.
feat_desc_106=Al atacar con una bomba nuclear, el daño infligido por la bomba nuclear aumenta en un {1}%.
feat_desc_107=Inflige {1}% de daño adicional a otros objetivos dentro de 1 casilla del objetivo cuando ataca este turno, con un tiempo de recuperación de 2 turnos.
feat_desc_108=Capaz de atacar múltiples unidades enemigas, con daño aumentado contra tanques y unidades de artillería en un {1}%.
feat_desc_109=Anula los efectos de mejora en las unidades enemigas dentro de un radio de 1 casilla, con un tiempo de recuperación de 3 turnos.
feat_desc_109_Lv2=Anula los efectos de mejora en las unidades enemigas dentro de un radio de 2 casillas, con un tiempo de recuperación de 2 turnos.

army_buff_desc_1351=Fantasma: movilidad +2, no puede ser atacado activamente por fuerzas terrestres o navales.
army_buff_desc_1352=Fantasma: movilidad +4, no puede ser atacado activamente por fuerzas terrestres o navales.
army_buff_desc_1353=Fantasma: movilidad +6, no puede ser atacado activamente por fuerzas terrestres o navales.
army_buff_desc_1361=Munición de Uranio Empobrecido: aumenta la probabilidad de ataque crítico en un 20% e ignora el 30% de la defensa del enemigo objetivo al atacar.
army_buff_desc_1362=Munición de Uranio Empobrecido: aumenta la probabilidad de ataque crítico en un 30% e ignora el 45% de la defensa del enemigo objetivo al atacar.
army_buff_desc_1363=Munición de Uranio Empobrecido: aumenta la probabilidad de ataque crítico en un 40% e ignora el 60% de la defensa del enemigo objetivo al atacar.
army_buff_desc_1371=Fuego Infernal: Inflige un 25% de daño adicional a otros enemigos dentro de 1 casilla del objetivo.
army_buff_desc_1372=Fuego Infernal: Inflige un 50% de daño adicional a otros enemigos dentro de 1 casilla del objetivo.
army_buff_desc_1373=Fuego Infernal: Inflige un 80% de daño adicional a otros enemigos dentro de 1 casilla del objetivo.
