elite_intro_82=La Fuerza Fantasma es una fuerza de élite compuesta por los mejores soldados de todo el mundo, famosa por sus tácticas silenciosas, su tecnología avanzada de sigilo y su excepcional eficiencia operativa. Son capaces de atacar a los enemigos con rapidez y precisión en diversos entornos extremos y poseen la capacidad de desplegarse y retirarse rápidamente mediante operaciones aéreas. También se los considera una de las fuerzas de élite más letales del mundo.
elite_intro_83=El tanque de batalla principal M1A1 Abrams es la unidad blindada principal del ejército estadounidense y el primer tanque del mundo ampliamente equipado con munición y blindaje de uranio empobrecido. Su cañón de ánima lisa de 120 mm puede disparar munición de uranio empobrecido de alta penetración, destruyendo fácilmente objetivos blindados enemigos pesados con la alta densidad de la munición y las propiedades autoafilantes. El M1A1 utiliza blindaje compuesto de uranio empobrecido, lo que mejora enormemente sus capacidades defensivas y le permite mantener una excelente capacidad de supervivencia contra municiones perforantes y armas de alto poder explosivo.
elite_intro_84=El B-52 Stratofortress es un bombardero estratégico de largo alcance de la Fuerza Aérea de los Estados Unidos. Con su alcance excepcional, su enorme capacidad de carga útil y sus versátiles capacidades operativas, el B-52 ha sido un componente fundamental del poder aéreo mundial desde la década de 1950. El B-52 es capaz de transportar bombas convencionales, municiones de armas guiadas de precisión y armas nucleares para satisfacer una amplia variedad de requisitos de misión. Las mejoras modernas han mantenido al B-52 competitivo, convirtiéndolo en una de las plataformas de bombarderos más duraderas en la historia militar desde la Guerra Fría. Debido a su gran tamaño y a los requisitos de despegue más prolongados, no es adecuado para operaciones basadas en portaaviones con espacio de cubierta y condiciones de lanzamiento limitadas.
elite_intro_85=El AH-64 Apache es el helicóptero de ataque más emblemático del mundo, famoso por su potente potencia de fuego, sus avanzados sistemas electrónicos y su magnífica maniobrabilidad. El Apache está equipado con un cañón de cadena de 30 mm, misiles aire-tierra y avanzados sensores electroópticos e infrarrojos. Sus robustos sistemas defensivos le permiten operar en entornos de alta amenaza, lo que lo convierte en una fuerza de ataque aérea letal en el campo de batalla. La versatilidad del Apache y las continuas actualizaciones de modernización han consolidado su posición como una de las principales plataformas de combate en la aviación militar moderna.


