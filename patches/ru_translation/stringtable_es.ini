event_stage_intro_20201=El cerco de las fuerzas aliadas ha bloqueado completamente nuestras economías y recursos estratégicos. Si esto continúa, el Imperio será inevitablemente derrotado por Estados Unidos en una guerra de desgaste. Puesto que la guerra es inevitable, debemos tomar la iniciativa. Lanza un ataque aéreo para destruir la fuerza principal de la Flota Estadounidense del Pacífico en Pearl Harbor.
event_stage_intro_20202=La exitosa "Operación Z" ha eliminado los obstáculos para las operaciones en el sur. Sin embargo, los británicos enviaron una flota para reforzar las tropas de la guarnición en Singapur. Si bien el enemigo puede tener un mayor número de tropas, carecen de maniobrabilidad en comparación con nuestras fuerzas. Podemos emplear un ataque de pinza y atacar rápidamente a las fuerzas británicas en Malasia. Entonces, ocuparemos Singapur lo más rápido que podamos.
event_stage_intro_20203=Las tropas estadounidenses en Filipinas carecen de entrenamiento y están insuficientemente armadas. Lanzaremos operaciones de desembarco en múltiples ubicaciones para dividir la atención del enemigo entre el norte y el sur. La Flota Aérea brindará apoyo a las operaciones anfibias.
event_stage_intro_20204=Las Indias Orientales poseen abundantes recursos, pero la flota conjunta de los aliados se está reforzando y reuniendo aquí. Como provienen de diferentes naciones, esto resulta en una baja eficiencia de coordinación y una falta de mando unificado entre ellos. Nuestra prioridad es asegurar el éxito de las operaciones anfibias y luego eliminar la flota en el Mar de Java.
event_stage_intro_20205=La flota aliada en el Pacífico Sur sufrió sucesivas derrotas. Están reagrupando sus fuerzas con Puerto Moresby como lugar para un contraataque. Debemos aprovechar la oportunidad de las inadecuadas defensas del enemigo y lanzar la Operación MO. No debemos permitir que las fuerzas aliadas tengan alguna posibilidad de lanzar una contraofensiva.
event_stage_intro_20206=Los estadounidenses han repelido con éxito nuestra ofensiva en el Mar del Coral y han reforzado sus defensas navales. Nuestro principal objetivo sigue siendo la ocupación de Port Moresby. Debemos aprovechar la oportunidad para ocupar la mal defendida Nueva Bretaña y luego avanzar hacia Lae, allanando el camino para una ofensiva terrestre decisiva.
event_stage_intro_20207=Finalmente se ha establecido el perímetro defensivo del Pacífico. No deja a las fuerzas estadounidenses otra opción que retirarse y defender su territorio continental. Sin embargo, según informes de inteligencia, el enemigo ha logrado avances significativos en el desarrollo de armas nucleares. Una vez desplegado en combate, es muy probable que altere el curso de la guerra. El tiempo se nos acaba.
event_stage_intro_20211=El cerco de las fuerzas aliadas ha bloqueado completamente nuestras economías y recursos estratégicos. Si esto continúa, el Imperio será inevitablemente derrotado por Estados Unidos en una guerra de desgaste. Puesto que la guerra es inevitable, debemos tomar la iniciativa. Lanza un ataque aéreo para destruir la fuerza principal de la Flota Estadounidense del Pacífico en Pearl Harbor.
