feat_desc_88=Coloca una mina terrestre en un radio de 1 casilla; la mina terrestre puede causar un {1} de puntos de daño con un tiempo de reutilización de 1 turno.
feat_desc_88_Lv3=Coloca una mina terrestre en un radio de 2 casillas; la mina terrestre puede causar un {1} de puntos de daño con un tiempo de reutilización de 1 turno.
feat_desc_89=Dentro de 4 casillas, cava un túnel desde tu ubicación actual hasta la parcela objetivo. La parcela objetivo no puede ser montañosa ni oceánica. Tu infantería, blindados, tanque ligero, tanque mediano, artillería de Cohetes, artillería de campaña y obuses pueden atravesar el túnel. Obtiene acciones adicionales después de atravesar túneles, con un máximo de 3 veces por túnel. Cuando se excava un nuevo túnel, el túnel original desaparece, con un tiempo de reutilización de 2 turnos.
feat_desc_89_Lv2=Dentro de 7 casillas, cava un túnel desde tu ubicación actual hasta la parcela objetivo. La parcela objetivo no puede ser montañosa ni oceánica. Tu infantería, blindados, tanque ligero, tanque mediano, artillería de Cohetes, artillería de campaña y obuses pueden atravesar el túnel. Obtiene acciones adicionales después de atravesar túneles, con un máximo de 3 veces por túnel. Cuando se excava un nuevo túnel, el túnel original desaparece, con un tiempo de reutilización de 2 turnos.
feat_desc_90=Los edificios dentro de 1 casilla del área circundante recuperan {1} PV, efectivo una vez por turno.
feat_desc_92=Aumenta el ataque de las tropas en {2} puntos por cada {1} PV perdidos.
feat_desc_92_Lv2=Rango de ataque +1, aumenta el ataque de las tropas en {2} puntos por cada {1} PV perdidos.
