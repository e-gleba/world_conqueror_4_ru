event_intro_490=Para garantizar el suministro de mineral de hierro a la industria militar alemana, el 9 de abril de 1940 al amanecer, Alemania lanzó la "Operación Weserübung". Dinamarca se rindió poco después del inicio de la guerra. Aunque Noruega contaba con ventajas geográficas y apoyo aliado, cayó el 10 de junio. Esta campaña permitió a Alemania controlar posiciones estratégicas en el Mar del Norte y Báltico, asegurando las rutas de transporte de hierro escandinavas.
event_intro_491=Al ser Narvik un puerto libre de hielo crucial para el transporte de hierro sueco, aliados y alemanes libraron batallas intensas tras el inicio de la campaña noruega. El 9 de abril de 1940, Alemania ocupó Narvik. Las tropas británicas intentaron recuperarlo de inmediato, desatando batallas navales el 10 y 13 de abril. Sin embargo, por falta de preparación terrestre, los británicos hundieron varios buques alemanes pero no lograron tomar el puerto.
event_intro_492=El 16 de abril de 1945, el Ejército Soviético concentró tres frentes principales para lanzar la ofensiva final contra Berlín (Batalla de Berlín). El alto mando alemán, atrapado, resistió ferozmente, pero los bombardeos soviéticos colapsaron sus defensas. El 30 de abril, un disparo resonó en el Führerbunker. Dos días después, el comandante de la defensa de Berlín, Weidling, firmó la rendición, marcando el fin del Tercer Reich.
event_intro_493=Para levantar la moral del público estadounidense tras el ataque a Pearl Harbor, el 18 de abril de 1942, 16 bombarderos B-25 despegaron del portaaviones USS Hornet y atacaron con éxito Tokio y otras ciudades. Un avión aterrizó de emergencia en la Unión Soviética, mientras que los demás aterrizaron en paracaídas o de emergencia en lugares como Zhejiang, China. Aunque la operación no causó grandes daños materiales, impactó a los militares japoneses.
event_intro_494=Para eliminar las últimas posiciones del Eje en el norte de África, los Aliados lanzaron la Operación Vulcano el 22 de abril de 1943. Las fuerzas británicas se centraron en la captura de Túnez, mientras que las estadounidenses avanzaron hacia Bizerta. Las tropas alemanas e italianas opusieron una férrea resistencia, apoyándose en sus fortificaciones montañosas, pero debido a la escasez de suministros y a la absoluta superioridad aérea de los Aliados, sus líneas defensivas se derrumbaron el 6 de mayo. Finalmente, el 13 de mayo, 250 mil soldados se rindieron. Esta batalla eliminó la amenaza a las rutas marítimas del Mediterráneo, allanando el camino para que los Aliados lanzaran la Operación Husky dos meses después.
event_intro_495=Tras la rendición de Italia en septiembre de 1943, el ejército alemán asumió el control total de la defensa de las islas del Egeo. El 24 de abril de 1944, para llevar a cabo operaciones de engaño estratégico en coordinación con el desembarco de Normandía, el Servicio Especial de Embarcaciones (SBS por sus siglas en inglés) de la Marina Real Británica invadió la isla de Santorini, destruyendo el puesto de observación costero alemán y la instalación de retransmisión de radio. Esta incursión interrumpió eficazmente la vigilancia marítima alemana en el mar Egeo, obligando a los alemanes a desplegar tropas adicionales para guarnecer las islas, contribuyendo así indirectamente a las operaciones aliadas en el Mediterráneo.
event_intro_496=El 28 de abril de 1944, durante un ejercicio para el desembarco de Normandía, debido a una grave falla de comunicación entre las fuerzas aliadas, nueve lanchas torpederas alemanas emboscaron con éxito el convoy aliado T-4 en Lyme Bay, hundiendo dos buques de guerra LST y dañando gravemente a otro, lo que causó al menos 749 muertos. Este fue el incidente más mortífero con bajas aliadas antes del desembarco de Normandía. Esta tragedia obligó a los aliados a estandarizar sus frecuencias de comunicación, garantizando una coordinación de mando eficaz durante el desembarco.
event_intro_497=La Campaña de Borneo fue la última campaña de los Aliados en el frente del Pacífico Sudoeste. Del 1 de mayo al 21 de julio de 1945, el 1.er Cuerpo australiano realizó desembarcos escalonados en Tarakan, la bahía de Brunéi y Balikpapan, con el objetivo de apoderarse de yacimientos petrolíferos y aeródromos para cortar el suministro de combustible a las fuerzas japonesas. Sin embargo, los bombardeos y la destrucción de los Aliados previamente a la invasión provocaron graves daños a la infraestructura de la isla. Además, al comenzar la campaña, las principales fuerzas japonesas ya se habían retirado estratégicamente, lo que resultó en ganancias militares limitadas.
event_intro_498=Para tomar la iniciativa estratégica en el Pacífico Sur, el ejército japonés decidió lanzar la Operación MO, atacando Puerto Moresby desde el mar. Tras descifrar la inteligencia japonesa, la Armada estadounidense envió a las TF 17 y 11 para interceptar a la flota japonesa. Así, el 4 de mayo de 1942, estalló la Batalla del Mar del Coral, la primera batalla entre portaaviones de la historia. En esta batalla, la Armada estadounidense hundió el portaaviones ligero japonés Shōhō, que cubría las fuerzas de desembarco, y causó graves daños al Shōkaku; la Armada japonesa hundió el USS Lexington y causó graves daños al USS Yorktown. Aunque ambos bandos sufrieron pérdidas comparables a nivel táctico, los Aliados frustraron con éxito los objetivos operativos japoneses y lograron una victoria estratégica.
event_intro_499=El 10 de mayo de 1940, el ejército alemán lanzó el "Plan Manstein". El Grupo de Ejércitos B realizó ataques sigilosos contra los Países Bajos y el centro de Bélgica, mientras que la fuerza principal del Grupo de Ejércitos A avanzó a través del Bosque de las Ardenas para abrir una brecha en los puntos débiles de la línea defensiva aliada. Siguiendo el "Plan D", los Aliados avanzaron con el 1.er Grupo de Ejércitos francés y la Fuerza Expedicionaria Británica hasta la línea defensiva de Dyle-Breda. Sin embargo, tras la irrupción de la 19.ª División Panzer alemana en Sedán el 14 de mayo y su avance hacia el oeste, lograron cercar a 350 mil tropas aliadas. Con la pérdida de importantes centros de transporte y el colapso de la línea defensiva, el rey Leopoldo III de Bélgica se rindió unilateralmente el 28 de mayo.
event_intro_4100=El 12 de mayo de 1942, el ejército soviético lanzó la Segunda Batalla de Járkov en un intento de ampliar las ganancias de la contraofensiva invernal. Inicialmente, las fuerzas soviéticas avanzaron hacia las afueras de Járkov, pero debido a las débiles defensas en el flanco sur, el 17 de mayo fueron sorprendidas en un movimiento de pinza por la "Operación Fridericus" alemana desde el norte y el sur. En tan solo tres días, 240 mil soldados soviéticos fueron rodeados, y para el 28 de mayo, el número total de bajas superó las 200 mil, lo que provocó el colapso del frente sur. Esta derrota permitió a los alemanes lanzar la "Operación Azul" en junio, logrando un rápido avance hacia el Cáucaso, lo que se convirtió en un catalizador clave para el punto de inflexión estratégico en el Frente Oriental.
event_intro_4101=El 15 de mayo de 1941, las fuerzas británicas lanzaron un asalto contra la Línea Sollum en Libia, capturando brevemente el Paso de Halfaya y el Fuerte Capuzzo. Sin embargo, el ejército alemán se reforzó rápidamente y contraatacó para recuperar el fuerte. El 27 de mayo, recuperaron el Paso de Halfaya, obligando a los Aliados a lanzar la Operación Battleaxe para recuperarlo.
event_intro_4102=El 20 de mayo de 1941, el ejército alemán lanzó la "Operación Mercurio", la primera operación aerotransportada a gran escala de la historia, con el objetivo de tomar Creta y bloquear las amenazas aéreas aliadas en los Balcanes. Aproximadamente 13 mil paracaidistas y tropas de montaña alemanes lanzaron un feroz asalto a tres aeródromos de la isla, encontrando una férrea resistencia por parte de los defensores de la Commonwealth y de Grecia. Si bien los alemanes lograron sus objetivos estratégicos en esta batalla, las numerosas bajas entre los paracaidistas los llevaron a cesar operaciones similares posteriormente. Sin embargo, esta batalla proporcionó una experiencia táctica crucial para las posteriores operaciones aerotransportadas aliadas.
event_intro_4103=El 22 de mayo de 1940, la 10.ª División Panzer alemana sitió Calais, donde 4 mil guarniciones defendieron la antigua ciudad en una última y desesperada resistencia contra las fuerzas alemanas hasta el 26 de mayo. Salvo 200 soldados heridos que fueron evacuados, el resto de las tropas murieron o fueron capturadas. Esta batalla logró retrasar y contener a las fuerzas alemanas durante tres días, lo que permitió fortificar la línea defensiva en Dunkerque y creó un margen de tiempo para la posterior Operación Dinamo.
event_intro_4104=En mayo de 1940, utilizando el "Plan Manstein" revisado, el ejército alemán rompió las defensas francesas en Sedán, rodeando a más de 300 mil tropas aliadas del flanco norte en la región de Flandes. Para evitar ser aniquiladas por los alemanes, el 26 de mayo, los aliados lanzaron la "Operación Dinamo", una operación de evacuación masiva que logró evacuar a 338 mil soldados de Dunkerque en nueve días, preservando así la fuerza de combate principal y la esperanza de liberación para futuros contraataques.
event_intro_4105=El 28 de mayo de 1940, el ejército alemán completó el cerco de 40 mil soldados del Primer Ejército francés en Lille. Los defensores de la ciudad resistieron tenazmente, incluso capturando a un teniente general alemán durante el feroz combate, y no se rindieron hasta el 1 de junio. Esta batalla desvió eficazmente siete divisiones alemanas, lo que permitió ganar tiempo valioso para la evacuación de Dunkerque y permitir a los aliados evacuar al menos a 100 mil soldados adicionales.
event_intro_4106=Del 31 de mayo al 8 de junio de 1942, Japón envió submarinos para atacar múltiples veces el puerto de Sídney con el objetivo de cortar las líneas de suministro estratégico entre Australia y Estados Unidos, centrándose en buques aliados. Aunque solo hundieron un barco de reaprovisionamiento durante la ofensiva de nueve días, estos ataques impulsaron inesperadamente a Australia a modernizar por completo sus defensas portuarias, aportando experiencia clave para operaciones posteriores en el teatro del Pacífico.

dialogue_3016=Crees que la ofensiva es la personificación del coraje. Sin embargo, el verdadero valor solo reside en la firme disciplina del gatillo: mantengan la compostura para disparar cada bala con precisión, incluso cuando el enemigo se acerque a su posición.
dialogue_3017=El número y la fuerza del enemigo son formidables, pero nuestra voluntad es mucho más resistente que la suya. En esta tierra que defendemos, cada centímetro lleva el orgullo y la dignidad de Finlandia.
dialogue_3018=Sus defensas pueden parecer formidables, pero tenemos determinación y convicción. ¡No estamos al borde de la retirada, sino al comienzo de una gran historia!
dialogue_3019=Nuestro plan encontró una resistencia inesperada; por lo tanto, debemos considerar urgentemente ajustar nuestra estrategia para evitar vernos arrastrados a un conflicto prolongado.
dialogue_3020=Gran Bretaña y Francia juraron protegernos. Los soviéticos se comprometieron a no invadirnos. ¡Menuda farsa!
dialogue_3021=El Pacto de No Agresión Soviético-Polaco era como un trozo de papel desechable a ojos de los soviéticos. Fueron más astutos que los alemanes. Esperaron a que nuestro frente occidental se derrumbara antes de apuñalarnos por la espalda.
dialogue_3022=Agradecemos a los soviéticos por redefinir el principio de "no agresión", no nos atacarán hasta que les dé la gana. ¿Creerá alguien en el futuro en la "paz" de la que hablan los soviéticos?
dialogue_3023=Los franceses tardaron diez años en construir su línea defensiva. Nosotros diez días en flanquearla.
dialogue_3024=Ninguno de nuestros planes de contingencia previó esta situación... ¡Hemos sido completamente engañados, hemos estado defendiendo la posición equivocada todo este tiempo!
dialogue_3025=Ya hemos perdido el tiempo; no podemos permitirnos perder la determinación también. Todas las tropas, reúnanse de inmediato y estabilicen el frente. Debemos contenerlos; aún podemos luchar. ¡Francia no caerá así de fácil!

