;关卡对话
dialogue_2281=Finlandia ha rechazado nuestra propuesta territorial. Lo que les espera son los guerreros con las armas más avanzadas y la personificación de la valentía, en una guerra que pronto terminará con la victoria de nuestro ejército.

dialogue_2282=Nosotros respetamos los derechos e intereses de la Unión Soviética, pero no toleraremos a nadie que infrinja nuestra soberanía territorial.

dialogue_2283=Ir a la guerra no es una experiencia agradable, pero si no vamos al campo de batalla, ¿quién protegerá esta tierra?

dialogue_2284=El paisaje finlandés no es favorable a la marcha de nuestro ejército. La guerra es algo serio y no se pueden cometer errores por complacencia e imprudencia. Nuestro ejército necesita ser más prudente y estar sabiamente comandado. No debemos menospreciar la fuerza y la amenaza del enemigo.

dialogue_2285=No debéis subestimar nuestra fuerza y determinación. El pueblo finlandés no se rendirá ante las presiones ni las amenazas de nadie y lucharemos por nuestra tierra.

dialogue_2286=Esperamos que nuestras diferencias se resuelvan mediante negociaciones pacíficas, pero si es necesario, tomaremos todas las medidas posibles para defender nuestro país.

dialogue_2291=El ataque polaco a la emisora de radio alemana en Gliwice es una provocación imperdonable para los alemanes y seguramente responderemos con medidas más drásticas.

dialogue_2292=Este drama está autodirigido por los alemanes. Necesitamos estar alerta ante la potencial guerra por parte de los alemanes.

dialogue_2293=Las Fuerzas Especiales de Brandeburgo han sido desplegadas previamente en territorio enemigo y atacarán conjuntamente con nosotros. ¡Prepárate para lanzar un ataque!

dialogue_2294=Los generales más importantes del enemigo han sido eliminados y su moral ha sufrido un duro golpe. Continúe el ataque, la victoria está a tu alcance.

dialogue_2295=Polonia estaba sumida en la confusión y la desintegración durante la guerra con Alemania. Como resultado, todos los acuerdos soviéticos anteriores con Polonia ya no son válidos.

dialogue_2296=Las tropas soviéticas cruzarán la frontera para proteger a los grupos étnicos rusos en Polonia y devolverles una vida pacífica.

dialogue_2301=Los recursos y las instalaciones militares de los países bajos son un peligro potencial para los planes de expansión del Imperio, por lo que es esencial que convirtamos estos territorios en tierras del Imperio antes de que lo hagan Gran Bretaña y Francia.

dialogue_2302=Antes de invadir la Unión Soviética, el ejército alemán debe borrar todas las amenazas restantes en Europa occidental.

dialogue_2303=La línea Maginot puede parecer indestructible, pero eso no nos impedirá avanzar. Los Aliados aún tienen que comprender verdaderamente la fuerza de las fuerzas mecanizadas y nuestros tanques atacarán desde lugares que el enemigo nunca esperará.

dialogue_2304=El hecho de que la fuerza principal del ejército alemán lograra sortear la Línea Maginot y apareciera en el bosque de las Ardenas nos tomó por sorpresa.

dialogue_2305=No seremos derribados por este ataque sorpresa. Tomaremos todas las medidas necesarias para resistir el ataque alemán hasta el último momento.

dialogue_2306=El ataque en el bosque de las Ardenas parece estar sufriendo una resistencia inusual. ¡Necesitamos cambiar nuestra forma de pensar y atacar desde muchas direcciones!

dialogue_2307=Hemos pasado por demasiado sufrimiento, hemos perdido tantas familias y amigos. Pero no debemos rendirnos. Debemos seguir luchando. La victoria está a la vista.

dialogue_2308=Se han reunido los ejércitos que atacan a la Unión Soviética. ¡Como Ejército Central, debemos ganar la primera batalla y tomar Minsk de un solo golpe!

dialogue_2309=El ejército alemán ha invadido territorio soviético en flagrante violación del Pacto Ribbentrop-Molotov. Ya puedo escuchar el rugido de los tanques, ¡organice rápidamente todos los frentes para la defensa!

dialogue_2310=La ofensiva alemana en la Unión Soviética es imparable. Finlandia también debe reclamar su territorio y retomar el istmo de Karelia.

dialogue_2311=Los alemanes cooperarán en nuestras operaciones conjuntas en el sur.

dialogue_2312=El aeropuerto del lago Ládoga no está defendido por muchos soldados. Es crucial para nosotros tomar este aeropuerto.

dialogue_2313=La victoria en Minsk demuestra una vez más el éxito de la Guerra Relámpago. El enemigo no puede detener la ofensiva de nuestros grupos blindados.

dialogue_2314=No se debe de permitir que el enemigo dé un paso más hacia adelante. ¡Smolensk debe de ser defendida!

dialogue_2315=Las fuerzas enemigas, aunque numerosas, no son capaces de formar una fuerza de combate activa.

dialogue_2316=Kiev es la ruta hacia el Cáucaso. ¡Utiliza un ataque de pinza para apoderarte de la ciudad!

dialogue_2317=Leningrado está fuertemente defendido por el ejército enemigo, primero debemos rodearlo y luego asediar la ciudad paso a paso.

dialogue_2318=El ejército finlandés se unirá a nosotros en el norte para lanzar un ataque.

dialogue_2319=Los soviéticos traen un flujo constante de suministros a Leningrado a través del lago Ládoga, lo que no se puede perdonar.

dialogue_2320=¡Corta sus líneas de suministro y aniquílalos!

dialogue_2321=La mala noticia es que los tanques han sido retirados y por el momento solo tenemos fuerzas de infantería y artillería disponibles.

dialogue_2322=La buena noticia es que el pesado Gustav de la patria nos ayudará.

dialogue_2323=Dales una probada del calibre de 800 milímetros. ¡Sebastopol temblará ante ello!

dialogue_2324=¡Debemos ocupar la ciudad antes de que el enemigo saque el equipamiento de sus fábricas de Járkov!

dialogue_2325=Cuidado con la artillería de cohetes del enemigo, su fuego de supresión nos ha causado importantes pérdidas.

dialogue_2326=El enemigo ha reunido más de un millón de tropas en Moscú. Tal cantidad de tropas y el gélido invierno representan una gran amenaza para nosotros.

dialogue_2327=¡El éxito o no de la Operación Barbarroja depende de esta batalla!

dialogue_2328=¡Sigue moviéndote! Ya puedo ver la estrella roja en lo alto del Kremlin a través de mis binoculares.

dialogue_2329=No hay nada que perder. No podemos darnos el lujo de dar un paso atrás. ¡Esta es una batalla por la existencia de la Unión Soviética!

dialogue_2330=Las fábricas y los recursos de Stalingrado son muy importantes para nosotros. ¡Han llegado órdenes del comandante del cuartel general de que hay que tomar la ciudad!

dialogue_2331=Esta magnífica ciudad no debe ser abandonada. ¡Lucharemos por el nombre de esta ciudad!

dialogue_2332=Marchen hacia el sur y únanse a nuestro grupo de ejércitos en el oeste.

dialogue_2333=Varsovia ha sido ocupada. Comandante, al eliminar al ejército soviético, toda Polonia estará en nuestra posesión.

dialogue_2334=Su excelencia, comandante, sus defensas están en ruinas. Lanzaremos un ataque a través del sur.

dialogue_2335=¡Avancen hacia París!

dialogue_2336=Únase a las fuerzas del sur. ¡Estamos a punto de arrasar París!

dialogue_2337=¡No te rindas! ¡Mantén el rumbo! Definitivamente lograremos apoderarnos de la ciudad.

dialogue_2338=Su Excelencia, Comandante, por favor, lance el ataque desde el sur. Las fuerzas Aliadas del norte nos ayudarán a rodear Kursk.

dialogue_2339=El Ejército Rojo ha rodeado Budapest. Su Excelencia, comandante, por favor dirija a su ejército para defender la ciudad contra la ofensiva soviética.

dialogue_2340=Eliminen a toda costa la inundación soviética en la ciudad. No permitirán que ningún alemán viva para convertirse en prisionero de guerra. ¡Es luchar o morir!

dialogue_2341=Hay demasiados enemigos. No podemos aguantar más.

dialogue_2342=La marea está cambiando. Budapest está a punto de caer. Su Excelencia, Comandante, por favor, guíenos para una fuga y evacuación. No debemos permitir que los soviéticos nos corten el camino de retirada.

dialogue_2343=Su Excelencia, Comandante, el ejército británico desembarcará desde el este para ayudarle en su ofensiva. ¡Juntos atacaremos Túnez y expulsaremos a las fuerzas nazis de África!

dialogue_2344=La guarnición enemiga es débil. ¡Es ahora! Aproveche la oportunidad de desembarcar en Sicilia.

dialogue_2345=Sicilia está bajo nuestro control. Tenemos al enemigo agarrado al cuello. Esta es una victoria crucial.

dialogue_2346=Después de más de dos años de preparación, se acerca este gran momento. Su Excelencia, Comandante, dirija las fuerzas Aliadas para desembarcar en la costa y apoderarse de la región de Normandía.

dialogue_2347=Ataquen. ¡Ataquen ferozmente! No dejen que los Aliados desembarquen con éxito en las playas.

dialogue_2348=Las Filipinas son demasiado importantes para nosotros. Planeamos desembarcar en Luzón y atacar. Su Excelencia, Comandante, el general MacArthur luchará a su lado. Por favor, tomen Luzón, restablezcan el control de las Filipinas y debiliten la fuerza japonesa en el Pacífico.

dialogue_2349=Manila, la capital, ya fue ocupada por nosotros. Su Excelencia, Comandante, por favor no sea imprudente. Continúe persiguiendo a las unidades japonesas restantes.

dialogue_2350=Destruyan los puentes y creen obstáculos para detener el avance del ejército estadounidense.

dialogue_2351=Los alemanes están siendo muy superados en número por nosotros. El enemigo busca su propia muerte. Termine esta batalla rápidamente.

dialogue_2352=Esto es terrible. La vanguardia ha sido demasiado imprudente y perdió la batalla. Su Excelencia, Comandante, guíenos para salvar la situación.

dialogue_2353=El imperio alemán es imparable. ¡Adelante soldados! ¡Nuestro objetivo es Moscú!

dialogue_2354=El ejército nazi tiene la audacia de codiciar Moscú. Pagarán por su arrogancia. Su Excelencia, Comandante, dirija al pueblo a defender nuestra capital.

dialogue_2355=El mito de la invencible Guerra Relámpago alemana está a punto de hacerse añicos. La victoria pertenece a la Unión Soviética.

dialogue_2356=Estamos a punto de ganar la batalla, pero el precio de la victoria es enorme. Siempre recordaremos a los soldados soviéticos que dieron su vida por el país.

dialogue_2357=Con una fuerza blindada tan grande, ésta será una batalla épica. Su Excelencia, Comandante, guíenos contra la ofensiva alemana.

dialogue_2358=¡Cuidado con el ataque de pinzas de las fuerzas alemanas desde el norte! Utilice todos los recursos para mantener las formaciones defensivas.

dialogue_2359=Ha sonado la trompeta para un contraataque. ¡Persigan y destruyan a los alemanes restantes!

dialogue_2360=¡Su Excelencia, Comandante, usted nos conducirá a recuperar los territorios perdidos de la Unión Soviética y tocará la trompeta del contraataque contra la Alemania nazi!

dialogue_2361=Bielorrusia ha sido liberada. La victoria que hemos logrado es inmensa. Continúen con nuestra persecución victoriosa y recuperen más territorios que hemos perdido en el oeste.

dialogue_2362=Estamos a punto de entrar en Berlín, Su Excelencia, Comandante. Las fuerzas estadounidenses y británicas te ayudarán en la ofensiva.

dialogue_2363=¡Hay que salvaguardar al Führer e impedir a toda costa que el enemigo entre en Berlín!

dialogue_2364=Alemania ha caído. Es hora de poner fin a esta guerra.

dialogue_2365=El enemigo no tiene a donde retirarse. Este será su final.

dialogue_2366=¡Aguanten soldados! Nuestros refuerzos seguramente llegarán.

dialogue_2367=¡Esos son los refuerzos británicos! Concentren su potencia de fuego en el ataque. ¡No les den la oportunidad de aprovecharse!

dialogue_2368=Aunque el ejército británico es más numeroso que el nuestro, su ataque es torpe y defectuoso. Su Excelencia, Comandante, desactive la ofensiva enemiga y llévenos a la victoria.

dialogue_2369=¡Moviliza tus tropas y lanza un ataque sorpresa desde los flancos hacia la retaguardia para asestar un duro golpe al enemigo!

dialogue_2370=La línea de defensa británica se extiende hacia el sur desde la costa de Gazala y lanzar un ataque frontal desde el oeste sin duda sufrirá grandes pérdidas. Su Excelencia, Comandante, guíenos con un desvío hacia la retaguardia enemiga y lance un ataque sorpresa.

dialogue_2371=¡Es el ejército alemán! ¿Por qué están detrás nuestro?

dialogue_2372=Tobruk ha caído. ¡Retirada soldados!

dialogue_2373=Su Excelencia, Comandante, marche sobre El Cairo y ayúdenos a capturar Egipto antes de que lo hagan los Aliados.

dialogue_2374=La resistencia enemiga es feroz. Soldados, es todo o nada. ¡Tened fe en que venceremos a nuestros oponentes!

dialogue_2375=¡Esos son los refuerzos del enemigo! Comandante, por favor, guíenos para romper el cerco británico.

dialogue_2376=Constantemente llegan refuerzos y suministros enemigos. ¡Estamos en un gran problema!

dialogue_2377=¡El impero alemán seguro regresará!

