event_stage_intro_20901=La base se ha autodestruido y somos el último grupo en evacuar con éxito. Las coordenadas temporales establecidas en el último momento deberían llevarnos a una base cerca de la jungla sudamericana. Esta vez, tendremos más tiempo para planificar todo.
event_stage_intro_20902=La Guerra Civil Española ha estallado con toda su fuerza. Con la intervención de Alemania, Italia y la Unión Soviética, el acuerdo de no intervención es ahora sólo una cáscara vacía. El que una vez fue el poderoso Imperio Británico ya se ha derrumbado, y el nuevo imperio seguirá sus pasos. Aunque el resultado de esta guerra no se puede cambiar, todavía debemos luchar. Porque nuestros camaradas están allí.
event_stage_intro_20903=Después de la Segunda Guerra Mundial, el Plan Marshall aseguró a Turquía como aliada de los Estados Unidos en Oriente Medio. Sin embargo, bajo la instigación soviética, el nacionalismo iraní está en aumento, lo que dificulta cada vez más la producción de petróleo en Irán. ¡Esto amenaza gravemente nuestros intereses! Con la aprobación del nuevo presidente Eisenhower, la CIA y el MI6 han cooperado para planificar un golpe de Estado. Esta misión debe tener éxito.
event_stage_intro_20904=El plan de Osborn ha logrado convertir a las facciones en feroces combatientes en la jungla sudamericana. Los nacionalistas japoneses y soviéticos también aprovecharon esta agitación para lanzar ataques contra las bases estadounidenses en Japón. Se dice que los soviéticos han desarrollado armas satelitales: ¡esta es nuestra oportunidad perfecta para apoderarnos de esta tecnología! Yudintsev ha organizado una reunión con un experto en satélites de comunicaciones cerca de la base soviética en la isla de Sajalín.
event_stage_intro_20905=El Plan Marshall aceleró la reconstrucción de Europa occidental y las economías de los países europeos se desarrollaron rápidamente. Sin embargo, la reciente corrupción en Italia ha provocado disturbios sociales que incluso han llevado al asesinato del Primer Ministro. Mientras tanto, el ejército soviético ha ocupado rápidamente la totalidad de Checoslovaquia y sigue desplegando tropas en la península de los Balcanes. Hemos encendido el polvorín de Europa del Este y el paisaje europeo está a punto de redefinirse.
event_stage_intro_20906=Los separatistas estadounidenses, descontentos con la reelección del presidente, han lanzado un levantamiento armado. Curiosamente, no interferimos en estas elecciones y, que yo sepa, nunca antes se había producido un conflicto similar. Ahora, el presidente ha recurrido a nosotros para sofocar esta rebelión. Esta misión está llena de imprevisibilidad, por lo que debemos vigilar constantemente los movimientos de los distintos ejércitos militares estadounidenses.
event_stage_intro_20907=Los aliados aprovecharon la situación y lanzaron un ataque sorpresa contra nuestras instalaciones militares en México. El enemigo ha obtenido las coordenadas de nuestras bases en las islas del Pacífico, lo que hace que nuestros dispositivos de interferencia sean inútiles. Las fuerzas soviéticas en la Antártida pronto descubrirán nuestra base. La situación es urgente; reúnan inmediatamente todas las tropas disponibles y lancen un ataque contra la estación de investigación soviética en la Antártida.
event_stage_intro_20911=La base se ha autodestruido y somos el último grupo en evacuar con éxito. Las coordenadas temporales establecidas en el último momento deberían llevarnos a una base cerca de la jungla sudamericana. Esta vez, tendremos más tiempo para planificar todo.
