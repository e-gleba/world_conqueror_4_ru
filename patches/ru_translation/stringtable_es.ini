skill_info_156=La moral de las unidades blindadas bajo su mando no disminuirá, +[#00FF00#%d%%] de daño. Tras ordenar a una unidad blindada que aniquile a un enemigo, obtiene el estado "Héroe", lo que aumenta la probabilidad de ataque crítico en un 10%% durante 1 turno.
skill_info_157=Al comandar unidades blindadas, inflige +20%% de daño a unidades que no sean edificios, excepto guarniciones de ciudad. Si no puede atacar ni moverse después de atacar, tiene un [#00FF00#%d%%] de probabilidades de volver a atacar (solo una vez por turno). Además, por cada enemigo eliminado en el turno actual, aumenta un 20%% (hasta un 100%%) la probabilidad de que el efecto cambie a "operar de nuevo".
skill_info_158=Tras ordenar a una unidad terrestre que ataque, hay una probabilidad del [#00FF00#%d%%] de otorgar "Coordinación" a los aliados cercanos y tú mismo durante 1 turno. Las unidades con "Coordinación" obtienen +15%% de daño. Anula el estado negativo cuando se aplica a la unidad (a menos que sea provocado por disminución de moral), luego elimina "Coordinación".
skill_info_159=Ataque +15 mientras estés en tu propio territorio; la probabilidad de recibir un ataque crítico se reduce en un [#00FF00#%d%%].


