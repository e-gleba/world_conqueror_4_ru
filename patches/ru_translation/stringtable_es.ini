feat_desc_142=El daño infligido se reduce en un {1}% al atacar o contraatacar a enemigos dentro de 1 casilla; el daño infligido aumenta en un {2}% al atacar o contraatacar a unidades blindadas, de artillería o flotantes a una distancia de 2 casillas o más.
feat_desc_143=Al atacar o contraatacar, ignora los efectos de esquiva y granada de humo.
feat_desc_143_Lv2=Al atacar o contraatacar, ignora los efectos de esquiva y de las granadas de humo. Al atacar o contraatacar unidades flotantes, inflige un {1}% de daño adicional.
feat_desc_143_Lv3=Al atacar o contraatacar, ignora los efectos de esquiva, granada de humo y dispositivo protector. Al atacar o contraatacar unidades flotantes, inflige un {1}% de daño adicional.


