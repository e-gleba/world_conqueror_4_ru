elite_intro_65=IS-3 era un blindado soviético desarrollado al final de la Segunda Guerra Mundial, armado con un potente cañón de 122 mm y conocido por su diseño único de "blindaje de cuña". Este diseño le dio una ventaja significativa en términos de protección y conservó su poder durante la Guerra Fría.
elite_intro_66=El Stuka zu Fuss era un lanzacohetes múltiple complementario del ejército alemán convertido en un vehículo semioruga. Se utilizaba para proporcionar fuego de artillería de gran alcance, de bajo costo, fácil de operar y de gran movilidad a unidades amigas de primera línea.
elite_intro_67=El nombre Richelieu proviene del famoso cardenal de la historia francesa. El barco estaba equipado con dos torretas principales cuádruples de 380 mm. En términos de blindaje y protección submarina, el acorazado era uno de los más avanzados de su época, sólo ligeramente inferior a los acorazados japoneses clase Yamato.
elite_intro_68=El Akagi era el portaaviones insignia de la Primera Flota Aérea de la armada japonesa y era considerado un símbolo de la fuerza de maniobras. Todos los pilotos del portaviones eran de élite. El barco participó en muchas batallas importantes, incluido el ataque a Pearl Harbor, la batalla del Océano Índico y la batalla de Midway.
elite_intro_70=El portaaviones USS Enterprise, apodado "Fantasma Gris" y "Big E", participó en casi todas las batallas importantes de la Armada de los Estados Unidos en la Guerra del Pacífico, hundiendo 71 barcos enemigos, hiriendo a 192 navíos y destruyendo 911 aeronaves enemigas. Hasta hoy, la Marina de los Estados Unidos no tiene ningún buque de guerra que pueda compararse con su historial de guerra.

