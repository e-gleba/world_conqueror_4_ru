help_conquest_5=Obtenga la victoria

help_conquest_desc_1=En el modo Conquista, los países se clasifican en tres categorías de 1 a 3 estrellas, las estrellas representan cuán poderoso es el país al comienzo del juego. Cuantas más haya, menor es la dificultad del juego y viceversa.
help_conquest_desc_2=En el botón Diplomacia en la parte superior de la pantalla, los comandantes pueden donar a fuerzas amigas regalando diversos recursos o declarar la guerra a un país neutral para convertirlo en uno hostil.
help_conquest_desc_3=El desarrollo del país en el Modo Conquista estará limitado por el nivel de tecnología. Al ganar puntos de tecnología en el instituto de investigación, también obtendrás el valor de experiencia de nivel de tecnología correspondiente.
help_conquest_desc_4=Los comandantes pueden desarrollar las ciudades construyendo edificios funcionales y cuando cumplas con los requisitos de nivel tecnológico, puedes hacer clic en el botón Construir para ver el consumo de recursos requerido.
help_conquest_desc_5=Cuando se gana una Conquista, el nivel se determinará en función de la puntuación, que se verá afectada por los generales que participaron en la Conquista, las ciudades capturadas, las rondas gastadas y la dificultad del país utilizado. La cantidad de comandantes aplicados ya no afectará la puntuación de desafío conquista.

help_domination_1=Misión
help_domination_2=Tropas de reserva
help_domination_3=General Famoso
help_domination_4=Invasión
help_domination_5=Comercio
help_domination_6=Ejercicio

help_domination_desc_1=Los comandantes pueden enviar generales a completar misiones para obtener recompensas de recursos, cumpliendo cualquier condición para completar la misión; cuantas más condiciones se cumplan, más ricas serán las recompensas. Hay cuatro tipos de misiones: exploración, desfile, propaganda y construcción, que se actualizan a las 8:00 y 20:00 UTC todos los días.
help_domination_desc_2=Parte del juego en el modo Dominación (invasiones, cónclaves, generales legendarios) requiere que los comandantes desplieguen sus propias tropas antes de comenzar el juego, a las que se puede acceder y reclutar desde el botón Legión en la esquina superior derecha de la pantalla Dominación.
help_domination_desc_3=A través de las batallas en el juego Generales Legendarios, puedes desbloquear el derecho a reclutar a los generales correspondientes y también puedes obtener descuentos en el reclutamiento a medida que avanzas en las batallas.
help_domination_desc_4=Los comandantes lucharán utilizando unidades que hayan formado y serán recompensados con medallas por la victoria. Las invasiones se actualizan diariamente a las 8:00 y 20:00 UTC.
help_domination_desc_5=Los comandantes pueden realizar intercambios para obtener los recursos que les faltan.
help_domination_desc_6=Los comandantes lucharán utilizando unidades que hayan formado y serán recompensados con medallas por la victoria. Esta partida no se actualizará.

help_hq_1=General
help_hq_2=Entrenar generales
help_hq_3=Medalla
help_hq_4=Cinta
help_hq_5=Tecnología
help_hq_6=Referencia
help_hq_7=Maravilla
help_hq_8=Élite
help_hq_9=Biografía

help_hq_desc_1=El HQ es el centro del comandante para gestionar a los generales bajo su mando, donde puede ver y gestionar el estado de los generales que ya tiene, así como reclutar otros nuevos. Los espacios de generales se desbloquean a medida que el HQ suba de nivel y se puede obtener experiencia de nivel del cuartel general en los modos Campaña, Dominación y Conquista.
help_hq_desc_2=Aumentar los rangos y las promociones puede aumentar los PV de las tropas lideradas por un general, además de mejorar la capacidad de combate del general, mejorando sus valores y habilidades. Por cada episodio de la Conquista completado, el nivel al que todos los generales pueden ascender aumenta una vez.
help_hq_desc_3=Los generales pueden usar medallas para mejorar aún más su capacidad de combate y cada general puede usar hasta 3 medallas diferentes, que se pueden usar o quitar arrastrando las medallas dentro de la colección.
help_hq_desc_4=La cinta es otro tipo de equipamiento para mejorar la capacidad de combate de los generales. Cada ascenso de generales desbloqueará un espacio para la cinta y cada general puede usar hasta 3 cintas diferentes. Se pueden sintetizar 3 cintas idénticas en un nivel superior de la misma cinta.
help_hq_desc_5=Mejorar la tecnología puede fortalecer las diversas habilidades de diferentes tipos de tropas en todos los modos de combate.
help_hq_desc_6=Se puede desbloquear a través del modo Dominación y usarse para cada modo de construcción de ciudades.
help_hq_desc_7=Las maravillas pueden generar algunos beneficios del modo Dominación, así como también producción de recursos. Las maravillas se pueden desbloquear a través de varias partidas del modo Dominación. La forma de desbloquear Maravillas se puede ver en detalle haciendo clic en Maravillas.
help_hq_desc_8=Las Tropas de Élite son poderosas unidades de combate que los comandantes pueden desbloquear/mejorar acumulando fragmentos de tropas. Los fragmentos de Tropas de Élite se obtienen principalmente mediante Conquistas y compras internas. A excepción de la Fuerza Aérea, cada unidad de Élite sólo puede ser reclutada una vez en una batalla.
help_hq_desc_9=Los comandantes pueden experimentar famosas batallas vividas por famosos generales en las biografías de los generales y pueden ser recompensados con sus títulos exclusivos después de completar los 5 niveles de un general.

help_battle_1=Mover
help_battle_2=Cancelar
help_battle_3=Atacar
help_battle_4=Términos de victoria
help_battle_5=Despachar general
help_battle_6=Reclutar tropas
help_battle_7=Capturar ciudad
help_battle_8=Defensa Aérea y Búnkeres
help_battle_9=Efecto del terreno
help_battle_10=Moral

help_battle_desc_1=Haz clic en una unidad accionable de tu propia tropa para seleccionarla y el rango de movimiento de esta unidad se mostrará en el mapa. Los terrenos complejos (por ejemplo, montañas o bosques) consumen más movilidad.
help_battle_desc_2=Después de maniobrar una unidad para realizar un movimiento, puedes hacer clic en el botón Deshacer para volver a la posición en la que estabas antes de la acción; Una vez que una unidad ha realizado un ataque, o el comandante ha hecho clic en otra posición para anular la selección de la unidad, la operación de deshacer ya no se puede realizar.
help_battle_desc_3=Después de seleccionar tus propias tropas, si hay tropas enemigas dentro de su rango de ataque, se marcarán con un círculo rojo y podrás atacarlas haciendo clic en ellas. Al atacar, tus tropas recibirán daño de contraataque si están dentro del rango de ataque del enemigo, pero no recibirán daño de contraataque si el enemigo es eliminado en este ataque.
help_battle_desc_4=La pantalla de información de nivel aparecerá al comienzo de cada turno, donde el comandante puede ver las condiciones requeridas para ganar el nivel, así como el límite en la cantidad de generales que se pueden desplegar y los recursos que se pueden obtener en el turno actual. Las posiciones clave se mostrarán como círculos rojos y capturarlas o perderlas influirá en si la batalla se gana o se pierde.
help_battle_desc_5=Al seleccionar una de tus propias tropas, puedes desplegar un general para liderar la tropa, lo que aumentará en gran medida la capacidad de combate de la tropa.
help_battle_desc_6=Tu ciudad puede reclutar tropas para reponer su fuerza de combate si no hay tropas en la ciudad. El reclutamiento de tropas ordinarias requiere el nivel de fábrica correspondiente, mientras que las Tropas de Élite se pueden reclutar directamente independientemente del nivel de fábrica.
help_battle_desc_7=Cuando la durabilidad de una ciudad enemiga es cero y no hay tropas en la ciudad, puedes moverte y capturar la ciudad enemiga y así obtendrás el control de la ciudad después de la captura.
help_battle_desc_8=Se pueden construir defensas aéreas en nuestro territorio para defendernos de los ataques aéreos y se pueden construir búnkeres en los espacios abiertos de nuestro territorio para defendernos de las fuerzas terrestres enemigas.
help_battle_desc_9=El terreno complejo no sólo afecta la movilidad de las tropas, sino que también reduce el daño recibido por las tropas. Los comandantes pueden verificar el estado del terreno en la esquina superior izquierda de la pantalla después de seleccionar el terreno.
help_battle_desc_10=La moral es un factor importante que afecta la capacidad de combate de las tropas. Cuando las tropas son atacadas por fuerzas enemigas, la moral bajará y las tropas causarán menos daño. Las tropas no podrán atacar ni contraatacar cuando la moral se derrumbe, por lo que los comandantes deben evitar este tipo de situaciones.

help_system_1=Archivo en la nube
help_system_2=Idioma
help_system_3=Pase de batalla
help_system_4=Logro
help_system_5=General de tiempo limitado

help_system_desc_1=Se puede acceder a la función Archivo en la nube a través de la lista en el lado derecho del menú principal para cargar y descargar datos y sincronizar el progreso del juego en diferentes dispositivos.
help_system_desc_2=Se pueden cambiar diferentes idiomas a través de la lista en el lado derecho del menú principal.
help_system_desc_3=El Pase de batalla es uno de los medios convenientes para obtener grandes cantidades de recursos, divididos en recompensas gratuitas y de pago. Se puede acceder a él desde la lista en el lado izquierdo de cualquier modo de batalla.
help_system_desc_4=Se pueden encontrar varias misiones de hitos desafiantes dentro de la lista de Logros, con recompensas aún más lucrativas. Se puede acceder a él desde la lista izquierda de cualquier modo de batalla.
help_system_desc_5=Cuando aparece este icono, significa que se están vendiendo generales poderosos en la tienda por tiempo limitado. ¡No te los puedes perder!

