armygroup_event_desc_98=El grupo blindado del Pacto de Varsovia lanzó un feroz asalto hacia la orilla norte del Rin, con el objetivo de atravesar el "Cinturón de Defensa del Rin" de Alemania Occidental en 48 horas. Los ingenieros de combate estadounidenses se vieron obligados a destruir varios puentes para frenar el avance.
armygroup_event_desc_99=Una flota multinacional de la OTAN llevó a cabo una operación antisubmarina coordinada en el Mar del Norte, donde ambas partes libraron varios combates cuerpo a cuerpo, dañando varios submarinos soviéticos. Las ciudades costeras del estrecho han entrado en un estado de preparación defensiva de primer nivel.
armygroup_event_desc_100=Los combates callejeros estallaron simultáneamente en Berlín Oriental y Occidental. Las tropas de Alemania Oriental utilizaron edificios y fábricas para establecer múltiples posiciones donde podrían abrir fuego. Mientras que la guarnición de Berlín Occidental, apoyada por los suministros aéreos estadounidenses, lanzó una maniobra de flanqueo para abrirse paso. Berlín se convirtió en uno de los campos de batalla más feroces del continente europeo.
armygroup_event_desc_101=Al amanecer, las divisiones aerotransportadas soviéticas lanzaron un ataque sorpresa contra un aeropuerto al este de Bruselas, con el objetivo de paralizar un centro de suministro clave de la OTAN. Las brigadas blindadas belgas y holandesas se apresuraron a organizar una contraofensiva, lo que desencadenó un feroz combate que provocó una enorme explosión en uno de los depósitos de municiones más grandes de Europa.
armygroup_event_desc_102=Las fuerzas de artillería soviéticas emplearon fuertes concentraciones de fuego para saturar las líneas del frente de Alemania Occidental, formando un "cinturón de cenizas". La infraestructura urbana de toda Alemania Occidental sufrió graves daños.
armygroup_event_desc_103=Las fuerzas del Pacto de Varsovia redirigieron rápidamente su ofensiva hacia el suroeste de Checoslovaquia, lanzando un avance blindado a toda velocidad para cortar la línea de suministro sur de la OTAN. Las fuerzas francesas e italianas enviaron fuerzas de despliegue rápido como refuerzos.
armygroup_event_desc_104=La fuerza aérea de la OTAN realizó bombardeos de alta precisión sobre Budapest, el centro de comunicaciones del Pacto de Varsovia. El Ejército Popular Húngaro desplegó de inmediato múltiples instalaciones de defensa aérea. Cientos de cohetes antiaéreos iluminaron el cielo nocturno. Como resultado, toda la ciudad quedó bajo ley marcial en dos días.
armygroup_event_desc_105=El regimiento de artillería rumano unió fuerzas con las fuerzas soviéticas para construir líneas defensivas profundas en los Cárpatos, con el objetivo de bloquear las rutas de refuerzo desde Italia y el sur de Alemania. Las tropas de montaña de la OTAN se vieron obligadas a abrirse paso por rutas alternativas extremadamente escarpadas, con sus líneas de suministro al borde del colapso.
armygroup_event_desc_106=La OTAN impuso un bloqueo sobre Odesa en un intento de interrumpir las líneas de suministro del sur de la Unión Soviética. Las fuerzas del Pacto de Varsovia lanzaron misiles para llevar a cabo operaciones de contrabloqueo. Se detectaron trayectorias de misiles en múltiples puntos de la línea costera, lo que ejerció una enorme presión sobre el sistema de defensa aérea de Odesa.
armygroup_event_desc_107=Las armadas de Suecia, Dinamarca y Alemania bloquearon conjuntamente las salidas del mar Báltico. La Flota Soviética del Báltico intentó romper el bloqueo de manera simultánea desde Riga y Kaliningrado, pero fue rastreada en tiempo real por aviones de reconocimiento de la OTAN, lo que desencadenó enfrentamientos navales y aéreos en ambos lugares.
armygroup_event_desc_108=Las Fuerzas de Aviación de Largo Alcance soviéticas lanzaron un ataque con misiles de saturación contra Londres, provocando incendios generalizados en la orilla sur del Támesis. El gabinete británico en tiempos de guerra ordenó urgentemente a la nación que entrara en el nivel máximo de preparación, y la comunicación con el centro de mando de Londres se perdió brevemente.
armygroup_event_desc_109=Manchester cayó, y las zonas industriales circundantes se vieron obligadas a detener la producción. Rápidamente surgió una escasez crítica de componentes clave en la industria de defensa británica, lo que llevó a la OTAN a coordinar urgentemente con las capacidades industriales canadienses y estadounidenses para subsanar esta escasez.
armygroup_event_desc_110=La caída de Liverpool restringió significativamente las rutas de suministro de la OTAN en el Atlántico. El Mando de Transporte Marítimo Militar de EE. UU. desvió temporalmente sus rutas a través de Islandia, lo que obligó a todo el Frente Occidental a revisar sus operaciones de suministro.
armygroup_event_desc_111=La Fuerza Aérea Soviética realizó una incursión en profundidad desde el mar Báltico, causando graves daños a las instalaciones portuarias de Gotemburgo. Lo que obligó a Suecia a entrar en alerta máxima en cuanto a defensa aérea.
armygroup_event_desc_112=Copenhague fue ocupada por la brigada de choque del Pacto de Varsovia y el ejército soviético tomó el control estratégico del estrecho danés. La OTAN perdió su capacidad para salir del mar Báltico.
armygroup_event_desc_113=Un misil del Pacto de Varsovia explotó sobre la Avenida de los Campos Elíseos en París, desatando una enorme onda expansiva que recorrió toda la avenida. El Palacio del Elíseo perdió inmediatamente todas las comunicaciones externas y el presidente francés fue trasladado de urgencia a un centro de mando subterráneo.
armygroup_event_desc_114=Tras la irrupción de las tropas de asalto del Pacto de Varsovia en las afueras de Bruselas, el cuartel general de la OTAN se enfrentó a una amenaza inminente. Para evitar filtraciones de inteligencia, la OTAN llevó a cabo la "Operación Nocturna", durante la cual se destruyeron algunos archivos secretos como medida de emergencia.
armygroup_event_desc_115=El puerto de Róterdam fue objeto de intensos bombardeos con misiles y artillería, convirtiendo numerosos depósitos de petróleo y terminales de contenedores en un infierno. La capacidad de transporte marítimo de la OTAN se ha reducido significativamente, lo que ha provocado retrasos generalizados en el suministro a las unidades de primera línea.
armygroup_event_desc_116=Venecia está siendo atacada por mar y aire, varios distritos históricos han tenido que ser evacuados. El ejército italiano se encuentra enfrascado en una feroz lucha, intentando contener a las fuerzas blindadas que se acercan desde el este.
armygroup_event_desc_117=Con la caída de Sebastopol, la Flota del Mar Negro se vio obligada a realizar una retirada a gran escala hacia el norte, dejando una grave brecha en el flanco defensivo sur del Ejército soviético.
armygroup_event_desc_118=Minsk ha caído, causando la destrucción del bastión central del Pacto de Varsovia. El mando del Ejército Rojo inició una evacuación de emergencia, dejando a todo el corredor de Smolensk sumido en el pánico.
armygroup_event_desc_119=Con Varsovia ocupada por la OTAN, el frente principal polaco se derrumbó instantáneamente. Las principales fuerzas del Ejército Soviético y del Ejército Popular Polaco se vieron obligadas a desbandarse hacia Brest, dejando todo el flanco occidental del Pacto de Varsovia expuesto al fuego enemigo.
armygroup_event_desc_120=Kiev cayó en manos de la OTAN, lo que obligó a varios ejércitos soviéticos a retirarse a través del río Dniéper para reagruparse, dejando un enorme vacío estratégico en todo el frente centro-sur.
armygroup_event_desc_121=Londres ha caído. Todo el Reino Unido se encuentra bajo la ley marcial. Con la pérdida de su presencia en Gran Bretaña, el flanco occidental de la OTAN está al borde del colapso, y el colapso de las defensas del Canal de la Mancha ha alterado el equilibrio en el Mar del Norte y el Atlántico.
armygroup_event_desc_122=El Pacto de Varsovia llevó a cabo operaciones de interferencia electrónica a gran escala a lo largo del frente centroeuropeo, dejando inoperativos todos los radares de la OTAN en un radio de decenas de kilómetros.


