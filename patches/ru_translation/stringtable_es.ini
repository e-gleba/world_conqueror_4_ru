conquest_event_desc_97=La organización Escorpión, aprovechando su vasta red de espionaje y sus sofisticadas maniobras políticas, ha orquestado con éxito guerras por delegación y conflictos regionales entre la OTAN y el PDV a escala global. Su meticulosa planificación ha obligado al mundo a realinear sus fuerzas en nuevas facciones, creando un nuevo panorama de confrontación y hundiendo al planeta en un vórtice irreconciliable de oposición y carrera armamentista.
conquest_event_desc_98=El Escorpión de Asia-Pacífico lanzó una operación con el nombre en código "La Furia de Poseidón". Mediante incursiones submarinas, ataques con drones y desembarcos de fuerzas especiales, coordinaron ataques en múltiples frentes, paralizando por completo la Flota del Pacífico de los EE. UU. y capturando con éxito Pearl Harbor, con el fin de crear condiciones favorables para una mayor infiltración en la región de Asia y el Pacífico.
conquest_event_desc_99=El Escorpión de Asia-Pacífico apoyó en secreto al ejército norvietnamita, ayudándolo a repeler a las fuerzas estadounidenses con armas de tecnología alienígena avanzada. Esto alteró significativamente la dinámica del campo de batalla y llevó la situación actual hacia una dirección impredecible.
conquest_event_desc_100=El Escorpión de Asia-Pacífico construyó en secreto un laboratorio en aguas profundas cerca de la Fosa de las Marianas, dedicado a probar el rendimiento de armas de tecnología alienígena bajo la extrema presión de las profundidades marinas. Esta acción hizo sonar las alarmas entre las naciones de Asia y el Pacífico.
conquest_event_desc_101=El Escorpión de Asia-Pacífico se infiltró profundamente en la industria energética de Australia, saboteando precisamente la producción de carbón y las redes de transporte portuario, cortando los principales canales de exportación y obligando al gobierno a hacer concesiones, logrando así el control total sobre las empresas energéticas locales.
conquest_event_desc_102=El Escorpión de Asia-Pacífico apoyó a los radicales locales, manipuló la opinión pública e incitó a conflictos violentos en Corea del Sur, lo que condujo al Incidente de Gwangju. En medio del caos, el Escorpión logró infiltrarse en el ejército surcoreano, lo que llevó al presidente a declarar la ley marcial y a hacer uso de la autoridad del gobierno para reprimir a la población, lo que intensificó aún más la agitación política y la división social.
conquest_event_desc_103=El Escorpión de Asia-Pacífico controlaba las islas del sur de Filipinas mediante ataques terroristas, transformando las islas en un bastión clave en el sudeste asiático y amenazando las rutas comerciales cerca del estrecho de Malaca.
conquest_event_desc_104=El Escorpión de Asia-Pacífico tomó el control de todo el comercio marítimo del Pacífico, expandiendo su influencia hasta convertirse en la facción más fuerte dentro de la organización global Escorpión. Esta acción provocó el descontento entre las otras facciones del Imperio Escorpión, que unieron sus fuerzas para lanzar un ataque conjunto, lo que provocó conflictos internos dentro de la organización.
conquest_event_desc_105=El Escorpión del Medio Oriente manipuló secretamente varias organizaciones locales, detonando con éxito múltiples refinerías de petróleo y creando una grave crisis energética.
conquest_event_desc_106=El Escorpión del Medio Oriente ejecutó demoliciones precisas en el Canal de Suez, hundiendo varios cargueros y provocando un bloqueo total del canal, lo que cortó las rutas comerciales marítimas controladas por Gran Bretaña y Francia, obligando a ambos países a hacer concesiones a cambio del derecho de navegación.
conquest_event_desc_107=El Escorpión del Medio Oriente estableció una base secreta de alta tecnología en las montañas de Afganistán para probar los efectos de las armas alienígenas en terrenos complejos. Después de un ataque sorpresa del ejército soviético, lograron repeler el ataque.
conquest_event_desc_108=El Escorpión del Medio Oriente planea transformar partes del desierto de Arabia Saudita en "Ciudades Oasis" habitables, atrayendo a más facciones que dependan de los recursos y la tecnología del Imperio Escorpión.
conquest_event_desc_109=El Escorpión del Medio Oriente monopolizó los recursos petrolíferos mundiales y anunció la formación de la "Alianza del petróleo", amenazando a otras facciones con cortarles el suministro de energía. Esta medida provocó el descontento de otras facciones del Imperio Escorpión, que unieron sus fuerzas para lanzar un ataque conjunto, lo que dio lugar a conflictos internos dentro de la organización.
conquest_event_desc_110=El Escorpión Europeo se infiltró secretamente en Alemania del Este, incitando a los lugareños a formar el "Ejército Libre Europeo", creando una brecha para la industria militar del Imperio Escorpión y expandiendo gradualmente su influencia a través del continente europeo.
conquest_event_desc_111=El Escorpión Europeo organizó una serie de explosiones en los principales cruces ferroviarios de Europa del Este, paralizando el control soviético sobre el transporte y los suministros en la región. Este caos permitió que las fuerzas del Imperio Escorpión se infiltraran por completo y allanaran el camino para un mayor dominio en Europa del Este.
conquest_event_desc_112=El Escorpión Europeo utilizó su extensa red de espionaje y sus tácticas de manipulación de la información para calcular con precisión las rutas de los buques de guerra británicos y colocar minas en el canal. Esta acción provocó que dos destructores de la Armada británica se hundieran en el canal de Corfú.
conquest_event_desc_113=El Escorpión Europeo, disfrazado de reformistas checos, impulsó en secreto las protestas de la Primavera de Praga, con el objetivo de debilitar el control y la influencia soviética sobre Europa del Este en medio de la agitación.
conquest_event_desc_114=El Escorpión Europeo desplegó equipos de buceo de élite para infiltrarse en los yacimientos petrolíferos del Mar del Norte, tomando el control de equipos cruciales y cortando el suministro de energía entre el Reino Unido y Noruega. Intentando crear una crisis energética para debilitar la influencia económica y estratégica de ambas naciones.
conquest_event_desc_115=El Escorpión Europeo contactó en secreto con varias mafias italianas, estableciendo conexiones a través de intercambios de dinero, armas e inteligencia para expandir su influencia en Europa.
conquest_event_desc_116=El Escorpión Europeo lanzó en secreto un grupo de satélites de alto rendimiento, controlando con éxito los sistemas de comunicación satelital globales, incluidas las comunicaciones militares, la navegación y los sistemas meteorológicos. Esta medida provocó el descontento entre otras facciones del Imperio Escorpión, que unieron sus fuerzas para lanzar un ataque conjunto, lo que provocó conflictos internos dentro de la organización.
conquest_event_desc_117=El Escorpión de las Américas se infiltró con éxito en el complejo Watergate de los Estados Unidos y obtuvo información clasificada mediante una vigilancia precisa, lo que llevó a la renuncia del presidente bajo presión pública. La agitación política en los EE. UU. aceleró la expansión militar del Imperio Escorpión y su infiltración en las Américas.
conquest_event_desc_118=El Escorpión de las Américas eligió "Punto Nemo", en lo profundo del Pacífico Sur, como su base secreta de investigación tecnológica marítima. Mediante una serie de operaciones encubiertas, transformaron esta zona remota en el centro de investigación marítima de mayor importancia estratégica del mundo.
conquest_event_desc_119=El Escorpión de las Américas orquestó la invasión de Bahía de Cochinos manipulando a los exiliados cubanos y proporcionando información falsa a Estados Unidos, lo que desató conflictos entre Estados Unidos y Cuba e intensificó las tensiones de la Guerra Fría, al tiempo que obtenía importantes beneficios del control económico y de los recursos mundiales.
conquest_event_desc_120=El Escorpión de las Américas llegó a un acuerdo secreto con el gobierno cubano para ayudarlo a establecer un sistema encubierto de lanzamiento de misiles en la isla. Esta maniobra tenía como objetivo amenazar la seguridad de los Estados Unidos y la región latinoamericana mediante el despliegue de instalaciones de misiles avanzados en Cuba.
conquest_event_desc_121=El Escorpión de las Américas se infiltró en el gobierno argentino y brindó apoyo militar, lo que llevó a Argentina a lanzar un ataque a las Islas Malvinas, subestimando y poniendo a prueba las capacidades militares de ataque de largo alcance de los británicos.
conquest_event_desc_122=El Escorpión de las Américas estableció una base de investigación secreta en la selva amazónica, utilizando tecnología extraterrestre para realizar experimentos y desarrollar pequeños reactores nucleares.
conquest_event_desc_123=El Escorpión de las Américas manipuló secretamente los mercados financieros de Brasil y Argentina, utilizando transferencias de capital a gran escala, difusión de información falsa y manipulación de divisas para crear pánico en el mercado, lo que llevó a una fuerte devaluación de las monedas locales.
conquest_event_desc_124=El Escorpión de las Américas, mediante una precisa manipulación financiera y amenazas económicas, logró obligar a las principales naciones del mundo a pagar altos impuestos financieros, poniendo la economía mundial bajo su control. Esta medida provocó el descontento entre las otras facciones del Imperio Escorpión, que unieron sus fuerzas para lanzar un ataque conjunto, lo que provocó conflictos internos dentro de la organización.
conquest_event_desc_125=El Escorpión Africano apoyó de forma encubierta a las fuerzas armadas en las zonas mineras del Congo, obteniendo el control sobre abundantes recursos de uranio y cobre, proporcionándoles materiales cruciales para su investigación de tecnología alienígena.
conquest_event_desc_126=El Escorpión Africano respaldó a los líderes militares del este de África en el lanzamiento de golpes de estado para obtener el control de la ruta comercial del Mar Rojo, perturbando la estabilidad mantenida por Gran Bretaña y Egipto en la región y remodelando el panorama geopolítico.
conquest_event_desc_127=El Escorpión Africano manipuló en secreto los recursos hídricos de la cuenca del Nilo y, poco a poco, fue ganando control sobre el suministro de agua de la región. Los países del norte de África sufrieron una grave escasez de agua y un colapso agrícola, lo que provocó un mayor malestar social.
conquest_event_desc_128=El Escorpión Africano estableció una base secreta de investigación de alta tecnología en las profundidades del desierto del Namib, en Namibia, dedicada a experimentos que combinan tecnología energética alienígena con fusión nuclear.
conquest_event_desc_129=El Escorpión Africano desarrolló con éxito una tecnología para convertir arena en materiales de silicio de alta pureza, fabricando semiconductores y chips de altísimo rendimiento a costos extremadamente bajos, monopolizando así el suministro de chips. Esta medida provocó el descontento entre otras facciones del Imperio Escorpión, que unieron sus fuerzas para lanzar un ataque conjunto, lo que provocó conflictos internos dentro de la organización.


