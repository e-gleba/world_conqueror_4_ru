skill_info_170=Al comandar unidades blindadas, el daño aumenta en [#00FF00#%d%%]. Tras atacar, recupera un 10%% de los PV del daño infligido. Bajo cualquier efecto de mejora, la probabilidad de ataque crítico aumenta en un 10%% e ignoran el 30%% de la defensa enemiga. Las unidades pueden moverse sin ser bloqueadas por los enemigos. Si el objetivo no es eliminado después de un ataque, se realizará un ataque adicional (una vez por turno).
skill_info_171=Al comandar unidades blindadas, su moral no disminuye. Al atacar, hay una probabilidad del [#00FF00#%d%%] de que el enemigo no pueda contraatacar. Tras eliminar a un enemigo, obtiene el efecto "Cosecha" durante 1 turno (este efecto aumenta el daño infligido un 20%% e ignora la esquiva). Por cada 30 de ataque de las unidades blindadas bajo su mando, aumenta el daño crítico un 5%%. Si el ataque de la unidad alcanza al menos 180, su alcance aumenta en 1.
skill_info_172=Al comandar unidades de infantería, hay una probabilidad del [#00FF00#%d%%] de asestar un ataque crítico y recuperas un 15%% de tus PV máximos cada turno. Al mismo tiempo, el comandante y todas las unidades de infantería en un radio de 2 casillas infligen un 30%% más de daño y reciben un 25%% menos. (Si el general posee esta habilidad, los efectos de Líder de Infantería no son aplicables).
skill_info_173=Al comandar unidades del ejército, [#00FF00#%d%%] del dinero gastado durante el turno se reembolsará en el siguiente (hasta 1200). Al comandar unidades del ejército, por cada enemigo eliminado a 3 casillas de las unidades al mando, obtienes 40 de Industria y 4 de Tecnología (se puede activar hasta 3 veces por turno).
skill_info_174=Las unidades submarinas bajo mando (excluyendo submarinos nucleares) ignoran la defensa enemiga, y el alcance de su ataque aumenta en 1; después de eliminar a un enemigo, hay una probabilidad del [#00FF00#%d%%] de atacar nuevamente y la probabilidad aumenta en un 25%% adicional si se realiza un ataque crítico.
skill_info_175=Las unidades submarinas bajo mando reciben [#00FF00#%d%%] menos daño y tienen un 50%% de probabilidades de esquivar ataques aéreos o de misiles. El submarino recupera el 5%% de sus PV máximos cada turno.

army_buff_desc_1631=Cosecha: aumenta el daño infligido en un 20% e ignora la evasión.



