dialogue_4366=Aunque el ejército alemán se encuentra a nuestras puertas, se enfrentan a todo menos a una ciudad vacía. Buscan terminar la guerra rápidamente, pero los venceremos con nuestra determinación inquebrantable.
dialogue_4367=¡Los soldados de la Plaza Roja harán comprender al enemigo una cosa clara: cada paso que den hacia adelante se pagará con sangre!
dialogue_4368=Las fuerzas enemigas han establecido una formación de pinza desde el norte y el sur. Si tienen éxito, nuestra línea defensiva quedará cortada. ¡Debemos mantener la línea, derrotarlos en detalle e impedir que completen su cerco!
dialogue_4369=La última defensa exterior ha sido vulnerada. Ya puedo ver la estrella roja en la azotea del Kremlin.
dialogue_4370=Somos imparables, nada puede detener el avance del torrente de acero. Los caminos serán destrozados, las defensas aplastadas y ninguna resistencia podrá alterar el resultado.
dialogue_4371=El general Zhukov ha llegado al frente. Todas las unidades deben mantener sus posiciones. Dejen que el enemigo se agote en sus ataques. El tiempo está de nuestra parte.
dialogue_4372=Desde un punto de vista táctico, la situación parece estar cambiando a nuestro favor, Moscú no está muy lejos.
dialogue_4373=Desde una perspectiva más realista, nuestras unidades blindadas se están desgastando gradualmente y las temperaturas siguen bajando. Además, los tiempos de arranque y mantenimiento de los vehículos han aumentado considerablemente, mientras que los suministros de combustible y munición no pueden llegar según lo previsto.
dialogue_4374=Sin apoyo logístico no podremos realizar maniobras; sin maniobras, las fuerzas blindadas perderán su razón de ser.
dialogue_4375=Los generales Manstein y Rundstedt han recibido órdenes de avanzar y reforzar el frente de Moscú. Las unidades de primera línea deben mantener sus posiciones y la estabilidad del frente. Bajo ninguna circunstancia deben retirarse.
dialogue_4376=Los servicios de inteligencia han confirmado que Japón no atacará a la Unión Soviética en un futuro próximo. ¡Los refuerzos del Lejano Oriente llegarán pronto al campo de batalla!
dialogue_4377=Debemos reconocer que las circunstancias actuales no nos favorecen, pero Moscú sigue siendo el único objetivo de importancia estratégica decisiva. Incluso si disminuye la probabilidad de éxito, no existe ninguna alternativa viable.
dialogue_4378=¡Sigan avanzando hacia Moscú por todos los medios necesarios!
dialogue_4379=¿Han olvidado la lección que Rusia le dio a Napoleón? No, sin duda la recuerdan. Debieron haber estudiado, analizado e incluso ridiculizado aquella derrota de entonces.
dialogue_4380=Es simplemente que, tal como lo hizo Napoleón en su época, creen que serán la excepción a la regla.
dialogue_4381=Las tropas enemigas no tuvieron más remedio que retirarse, pero sus fuerzas principales permanecieron intactas. Sin embargo, esto por sí solo fue suficiente para demostrar que el ejército alemán no era invencible, y así se puso fin al mito de la Blitzkrieg.

