event_stage_intro_20217=Finalmente se ha establecido el perímetro defensivo del Pacífico. No deja a las fuerzas estadounidenses otra opción que retirarse y defender su territorio continental. Sin embargo, según informes de inteligencia, el enemigo ha logrado avances significativos en el desarrollo de armas nucleares. Una vez desplegado en combate, es muy probable que altere el curso de la guerra. El tiempo se nos acaba.

dialogue_2462=¡La primera ofensiva ha sido un éxito! Sin embargo, no hemos encontrado ningún portaviones estadounidense en el puerto.
dialogue_2463=¡Portaviones estadounidenses avistados! ¡Mi flota lanzará la tercera ofensiva y no escatimará esfuerzos para eliminarlos a todos!
dialogue_2464=Destruyan sus acorazados y paralicen por completo a la armada enemiga. Aseguren las exitosas operaciones en el sur.
dialogue_2465=¡El grupo de portaviones de batalla está regresando al puerto! Debemos organizar una defensa rápidamente y estar preparados para contraatacar en cualquier momento.
dialogue_2466=¡El contraataque comienza ahora! Debemos hacer pagar al ejército japonés por su tercera ofensiva.
dialogue_2467=Las dos primeras oleadas de ataques causaron graves daños a las fuerzas estadounidenses en el puerto, pero también sufrimos algunas pérdidas.
dialogue_2468=Las fuerzas japonesas han reunido sus tropas en el norte de Malasia. Debemos hacer todo lo que esté a nuestro alcance para frenar el avance del enemigo hacia el sur. Hay que ganar tiempo para la llegada de refuerzos.
dialogue_2469=Los ataques de la Fuerza Aérea han sido muy eficaces. ¡El HMS Prince of Wales no tiene forma de escapar! ¡Adelante a máxima velocidad!
dialogue_2470=¡El HMS Prince of Wales ha sido hundido! Elimina las fuerzas navales británicas restantes y hazte con el control de las aguas territoriales circundantes de Malasia.
dialogue_2471=No tenemos tiempo para capturar a estos soldados británicos. Debemos acelerar nuestro avance ahora para evitar que el enemigo organice defensas efectivas.
dialogue_2472=Subestimamos gravemente la velocidad de avance del ejército japonés. Las defensas del norte de Singapur serán nuestra última barrera.
dialogue_2473=Singapur está a nuestro alcance. Bloquea las aguas circundantes para cortar las rutas de retirada del enemigo. Nuestras fuerzas terrestres darán el golpe final.
dialogue_2474=Singapur ha caído. Hemos fracasado.
dialogue_2475=El avión de reconocimiento detectó una gran flota enemiga en las aguas circundantes. Detendré la ofensiva británica mientras tú interceptas rápidamente la ruta de escape de la flota enemiga.
dialogue_2476=Nuestras fuerzas terrestres iniciarán desembarcos a lo largo de la costa occidental de Luzón y las aguas al sureste de Manila. Mi flota aérea eliminará los obstáculos en la superficie del mar.
dialogue_2477=Las fuerzas japonesas han lanzado operaciones de desembarco en múltiples zonas. Defenderé la parte norte de Manila y movilizaré una fuerza de reserva para apoyar de inmediato a nuestros aliados en el norte de Luzón.
dialogue_2478=La ofensiva japonesa es feroz. Debemos retirarnos hacia Manila y reorganizar nuestras defensas.
dialogue_2479=Las defensas en la parte norte de Manila están a punto de ser derribadas. Acabo de recibir las órdenes del Presidente. Debemos retirarnos a Bataan ahora.
dialogue_2480=Me fui de Bataan, pero volveré.
dialogue_2481=MacArthur ha evacuado. Las tropas estadounidenses restantes están dispersas y desorganizadas.
dialogue_2482=Las tropas en la Bahía de Lamón han completado su desembarco. Colaborarán con nosotros desde la parte sur de Manila para lanzar una ofensiva.
dialogue_2483=Completaré el desembarco tan rápido como pueda y tomaré Balikpapan. Por favor coordine con mis fuerzas para barrer a las tropas aliadas en Borneo.
dialogue_2484=Reúnan rápidamente la flota e intercepten al ejército japonés antes de que entren en el mar de Java.
dialogue_2485=La flota conjunta de Estados Unidos, Reino Unido, Países Bajos y Australia se ha reunido en el Mar de Java. Esta es una gran oportunidad para acabar con las fuerzas navales aliadas con una sola acción.
dialogue_2486=Las defensas neerlandesas en Borneo han quedado completamente destruidas. Colabora con la marina para eliminar los barcos enemigos en el mar de Java y lanza un ataque hacia Surabaya y Yakarta.
dialogue_2487=Las fuerzas defensoras en Borneo se encuentran en estado de retirada. El Mar de Java es nuestra última línea de defensa para proteger Sumatra y Java.
dialogue_2488=La fuerza principal de la flota aliada ha sido hundida y los barcos restantes no son más que una multitud desordenada. Acábelos rápidamente y elimina los obstáculos para nuestro desembarco a través del mar.
dialogue_2489=La derrota de los aliados es inevitable. Esté siempre preparado para explotar los recursos de las Indias Orientales.
dialogue_2490=El objetivo final del ejército japonés es el Puerto Moresby. Debemos interceptar al enemigo en el Mar del Coral para evitar nuevas incursiones de la flota japonesa.
dialogue_2491=Las fuerzas estadounidenses han descubierto nuestras acciones. Reúne inmediatamente la flota conjunta y enfréntate al enemigo en una batalla decisiva en el Mar del Coral.
dialogue_2492=Las Islas Salomón están ahora bajo nuestro control. Utilice el aeropuerto de Guadalcanal como base para proporcionar apoyo aéreo.
dialogue_2493=El grupo de portaaviones ha llegado. Consolide nuestras fuerzas existentes y haga una reorganización para un contraataque.
dialogue_2494=El ejército estadounidense se ha preparado durante mucho tiempo. Ten cuidado con los refuerzos enemigos y sus ataques sorpresa.
dialogue_2495=¡Adelante a toda marcha! ¡Continúen ampliando nuestro resultado de la batalla!
dialogue_2496=¡La velocidad de la flota naval japonesa es demasiado rápida! No hay más opción que retirarse ahora.
dialogue_2497=No pudimos detener el avance del enemigo. Es hora de cambiar nuestro objetivo a la retirada.
dialogue_2498=Rabaul ha caído. Las acciones japonesas en Nueva Bretaña representarán una amenaza para Nueva Guinea e incluso para Australia.
dialogue_2499=Las fuerzas defensoras de la isla han comenzado a huir. Bloquearé las aguas orientales de Lae para cortar la ruta de retirada de los aliados.
dialogue_2500=¡La armada enemiga está rodeando toda Nueva Bretaña! Necesito más refuerzos para garantizar que la guarnición de Nueva Bretaña se retire ordenadamente.
dialogue_2501=Hemos establecido con éxito un punto de apoyo en Nueva Guinea. El objetivo principal ahora es controlar el Sendero de Kokoda.
dialogue_2502=El terreno alrededor del Sendero de Kokoda es desafiante y es difícil marchar. Proceda con cautela y evite apresurarse demasiado.
dialogue_2503=Estamos perdiendo el control de las aguas del sur de Nueva Bretaña. Refuercen la defensa a lo largo de la costa oriental e impidan que los japoneses aprovechen estas oportunidades.
dialogue_2504=Los japoneses se han apoderado de Kokoda y ahora avanzan hacia Puerto Moresby.
dialogue_2505=Mantén la posición y frena el avance del enemigo. ¡Mis refuerzos llegarán muy pronto!
dialogue_2506=Las armas nucleares del enemigo están a punto de completarse. Con las poderosas capacidades industriales de Estados Unidos, una vez que comience la producción en masa, podría alterar potencialmente la situación mundial actual.
dialogue_2507=A toda la flota, ayuden al ejército a completar los desembarcos y den prioridad en aniquilar las posiciones defensivas enemigas en la costa.
dialogue_2508=Las fuerzas de desembarco japonesas han aparecido en la costa oeste de Vancouver. Necesitamos más refuerzos.
dialogue_2509=Los Ángeles también está bajo ataque. Salgan inmediatamente para proporcionar refuerzos.
dialogue_2510=Hemos frustrado con éxito el intento del ejército japonés de desembarcar en California. Sin embargo, hay que estar atentos a los refuerzos enemigos.
dialogue_2511=Simplemente defendernos conducirá a nuestra desaparición por desgaste. Mi grupo blindado lanzará un ataque sorpresa para ganar tiempo para el desarrollo de armas nucleares.
dialogue_2512=La prueba de detonación fue exitosa, pero no podemos producirlos en grandes cantidades a corto plazo.
dialogue_2513=Mantengan la costa oeste con nuestro ejército y protejan los resultados de nuestra investigación.

dialogue_2514=Las potencias del Eje no tienen salida. ¡Avancemos hacia Túnez y expulsémoslos del continente africano!
dialogue_2515=La operación del II Cuerpo ha fracasado. Recuerden no atacar a ciegas y caer en la trampa del enemigo.
dialogue_2516=La defensa delantera alemana es demasiado firme. Utilice fuerzas navales para encontrar un punto de avance. Los soldados británicos también nos ayudarán.
dialogue_2517=Busca un punto de avance a lo largo de la costa enemiga y lanza un desembarco decisivo en esta isla.
dialogue_2518=Las fuerzas alemanas están intentando retirarse a la Italia continental. ¡No dejes que lo logren!
dialogue_2519=Soldados, la escala sin precedentes de esta operación anfibia está a punto de comenzar. Lo que os espera es la gloria infinita.
dialogue_2520=¿Por qué han aparecido aquí las fuerzas aliadas? Maldita sea, debe haber habido un error de inteligencia. ¡Estén preparados para contraatacar al enemigo!
dialogue_2521=Las defensas costeras del enemigo son frágiles. Ahora es el momento de desembarcar rápidamente y establecer una cabeza de puente. Además de abrir un frente en el continente europeo.
dialogue_2522=¡No dejen que las fuerzas aliadas desembarquen! ¡Reúnan todas nuestras fuerzas e intercéptenlos en el mar!
dialogue_2523=La primera línea costera del enemigo es formidablemente firme. Utilice la flexibilidad de nuestra fuerza aérea y coordine con las fuerzas terrestres para atacar y capturar sus fortalezas.
dialogue_2524=Captura Lyon y la victoria en esta batalla pronto será nuestra.
dialogue_2525=El Ruhr es una zona industrial vital para los alemanes en el frente occidental. Si lo capturamos, obtendremos una ventaja excepcional en esta guerra.
dialogue_2526=Flanquea la retaguardia enemiga con el flanco norte y sur para cortar sus rutas de retirada. Una vez que se forme nuestro cerco, será fácil apoderarse del Ruhr y capturar todas las fuerzas alemanas.
dialogue_2527=Cooperaremos con las fuerzas estadounidenses en el sur para lanzar un ataque de pinza.
dialogue_2528=¡Ahora es el momento! Si se refuerza el cerco, el enemigo quedará atrapado como un blanco fácil.
dialogue_2529=Comandante, por favor guíenos hacia adelante para eliminar las fuerzas soviéticas atrincheradas en el lado occidental de la península.
dialogue_2530=A excepción de la Fortaleza de Sebastopol, toda la península de Crimea está en nuestras manos. No aflojes antes de que capturemos el último trozo de terreno.
dialogue_2531=Las líneas de suministro navales del enemigo han sido cortadas, lo que nos da una ventaja en esta guerra de desgaste.
dialogue_2532=¡Utiliza el fuego de artillería de Gustav para disparar y abrir un camino!
dialogue_2533=El mando supremo está decidido a capturar Leningrado, pero será una dura batalla. El ejército finlandés nos ayudará a lanzar un ataque desde el norte.
dialogue_2534=Debemos correr el riesgo de desviar fuerzas y concentrar nuestras tropas para priorizar el corte de las líneas de suministro del enemigo en los lagos. Esto afectará directamente el resultado de la guerra.
dialogue_2535=Necesitamos lanzar una ofensiva hacia el este, llamando la atención de las fuerzas enemigas y ganando tiempo para el avance del 6.º Ejército.
dialogue_2536=Lanzad una ofensiva a gran escala y tomad Stalingrado de inmediato. ¡El amanecer de la victoria está a la vista!
dialogue_2537=Tenemos que recuperar Járkov del alcance soviético a toda costa
dialogue_2538=La vanguardia enemiga ha avanzado demasiado. Esto nos brinda una gran oportunidad para rodearlos.
dialogue_2539=Utilice la movilidad de nuestras fuerzas blindadas para lanzar ataques a los flancos de las fuerzas soviéticas y cortar sus líneas de suministro.
dialogue_2540=Comandante, guíenos para atravesar las defensas soviéticas paso a paso desde el sur. Según el plan, nuestros aliados en el norte se unirán a nosotros para flanquear Kursk.
dialogue_2541=La resistencia del enemigo es cada vez más feroz. Soldados, no aflojen.
dialogue_2542=El Grupo Norte del Ejército necesita nuestra ayuda. Sin ellos no podremos representar ninguna amenaza para Kursk.

