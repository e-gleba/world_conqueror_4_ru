conquest_event_desc_36=Un grupo de bombarderos liderados por Doolittle despegó de un portaaviones a unas 650 millas náuticas de Japón y bombardeó el principal territorio japonés en represalia por el ataque sorpresa japonés a Pearl Harbor.
conquest_event_desc_37=China envió una fuerza expedicionaria a Birmania para ayudar a los británicos y resistir conjuntamente a las fuerzas invasoras japonesas.
conquest_event_desc_38=El ejército chino libró una serie de feroces batallas contra las fuerzas de invasión japonesas en Changsha y sus alrededores. Al final, lograron mantener Changsha y frustrar el ataque japonés.
conquest_event_desc_39=Las flotas estadounidense y japonesa participaron en una batalla naval a gran escala en las aguas frente a la isla Midway y la armada japonesa sufrió numerosas bajas.
conquest_event_desc_40=Los feroces combates entre el ejército alemán y el Ejército Rojo soviético en Stalingrado, con millones de bajas en ambos bandos, dieron lugar a un cambio fundamental en el equilibrio general de poder soviético-alemán.
conquest_event_desc_41=La planta de agua pesada en Noruega fue atacada por tropas aerotransportadas aliadas, una medida que destruyó por completo los planes alemanes de construir armas nucleares.
conquest_event_desc_42=Las fuerzas de la Commonwealth bajo el mando de Montgomery derrotaron a la coalición germano-italiana, que carecía de petróleo y suministros, en el área de El Alamein.
conquest_event_desc_43=Al desembarcar en puertos clave del oeste y norte de África para ayudar a las fuerzas británicas que se enfrentaban a los alemanes en Egipto, el ejército estadounidense abrió un segundo frente en el norte de África y dispersó a las fuerzas alemanas.
conquest_event_desc_44=La entrada de un gran número de mexicanos a Estados Unidos para cubrir la falta de mano de obra debido a la guerra provocó un aumento del ingreso nacional de México, así como el suministro de grandes cantidades de minerales importantes a Estados Unidos.
conquest_event_desc_45=Estados Unidos mejoró las relaciones con los países latinoamericanos mediante la implementación de la Política del Buen Vecino, lo que impulsó a los países latinoamericanos a unirse a las Fuerzas Aliadas y mantener buenas relaciones con los Estados Unidos.
conquest_event_desc_46=La flota aliada se enfrentó a la marina japonesa en un feroz combate en Guadalcanal y sus islas circundantes.
conquest_event_desc_47=Las tropas aliadas detuvieron con éxito la fuerza de invasión japonesa en las extremadamente duras condiciones montañosas y de jungla del sendero de Kokoda en Papúa Nueva Guinea y obligaron a los japoneses a retirarse.
conquest_event_desc_48=Los alemanes y el Ejército Rojo de la Unión Soviética enviaron un gran número de tropas blindadas a una masiva batalla de tanques en Kursk.
conquest_event_desc_49=La inteligencia estadounidense descifró los códigos de comunicación japoneses y tendió una emboscada a los aviones que transportaban a Yamamoto sobre el Pacífico, debilitando la cadena de mando de la flota japonesa.
conquest_event_desc_50=Las fuerzas aliadas lanzaron un desembarco en Sicilia en el Mediterráneo. La batalla cambió el panorama del teatro del Mediterráneo, acelerando la rendición de Italia y su declaración de guerra a los alemanes.
conquest_event_desc_51=Estados Unidos, Gran Bretaña y China emitieron una declaración en la Conferencia de El Cairo confirmando que los tres países estarían unidos en la lucha contra Japón hasta conseguir su rendición incondicional.
conquest_event_desc_52=Estados Unidos, Gran Bretaña y la Unión Soviética celebraron una reunión cumbre en Teherán que se centró en el despliegue estratégico de las fuerzas aliadas contra Alemania en Europa y la organización del orden internacional en la posguerra.
conquest_event_desc_53=Los masivos desembarcos aliados combinados por tierra, aire y mar en la región francesa de Normandía marcaron el comienzo de la contraofensiva aliada en el teatro europeo.
conquest_event_desc_54=Las fuerzas aerotransportadas aliadas dirigidas por Montgomery atacaron a las fuerzas alemanas estacionadas en los Países Bajos. Sin embargo, la operación no fue tan exitosa como se esperaba debido al clima, errores de inteligencia y la feroz resistencia alemana.
conquest_event_desc_55=Estados Unidos utilizó tácticas de salto de isla en isla y finalmente se acercó al principal territorio japonés estableciendo bases en varios lugares estratégicos clave.
conquest_event_desc_56=En aguas filipinas tuvo lugar una feroz batalla entre las flotas estadounidense y japonesa. Los japoneses fueron derribados en gran número debido a la disminución en el número y rendimiento de sus aviones, así como las pérdidas en el número de sus pilotos de élite, en lo que el ejército estadounidense llamó "el gran tiroteo del pavo de las Marianas".
conquest_event_desc_57=Varios oficiales y políticos alemanes llevaron a cabo un intento de asesinato contra el Führer, cuyo objetivo no se cumplió a pesar de que se produjo la explosión.
conquest_event_desc_58=Las fuerzas aliadas de Estados Unidos y Australia se enfrentaron a Japón en una feroz batalla naval en el golfo de Leyte, Filipinas. Los aliados derrotaron a la flota combinada japonesa en esta batalla, que marcó el declive de la marina japonesa.
conquest_event_desc_59=Los cohetes alemanes V-2 que cruzaron el Canal de la Mancha para bombardear Londres fueron los primeros misiles balísticos del mundo utilizados en combate real y, aunque el daño real fue menor, tuvo un gran impacto en la sociedad británica.
conquest_event_desc_60=Los alemanes lanzaron una repentina ofensiva en las Ardenas con el objetivo de romper las líneas aliadas británicas y estadounidenses. Aunque los aliados inicialmente sufrieron grandes pérdidas, finalmente lograron defenderse del ataque alemán.
conquest_event_desc_61=Bulgaria inicialmente optó por unirse al bando del Eje, pero a medida que la situación de la guerra cambió, Bulgaria pasó a los Aliados, manteniendo en gran medida la seguridad y estabilidad del país.
conquest_event_desc_62=Los soviéticos rodearon Budapest, que estaba defendida por una coalición germano-húngara, pero encontraron una tenaz resistencia.
conquest_event_desc_63=El Ejército Rojo soviético avanzó hacia Viena y entabló feroces combates contra las tropas alemanas estacionadas allí. Esta ofensiva marcó el profundo avance de la Unión Soviética hacia Alemania.
conquest_event_desc_64=Estados Unidos, la URSS y Gran Bretaña celebraron una cumbre trilateral en Yalta para discutir la reconstrucción de Europa y la organización del panorama global después de la Segunda Guerra Mundial.
conquest_event_desc_65=El Ejército Rojo soviético lanzó un ataque masivo y total contra la capital alemana, Berlín.
conquest_event_desc_66=Estados Unidos, Gran Bretaña y China emitieron una declaración conjunta exigiendo que Japón se rindiera incondicionalmente o enfrentaría una "pronta y total destrucción" inmediata.
conquest_event_desc_67=Un enorme programa lanzado en secreto por Estados Unidos reunió a los mejores científicos e ingenieros del mundo para desarrollar la primera bomba atómica del mundo, que se probó con éxito en el desierto de Alamogordo.
conquest_event_desc_68=Estados Unidos lanzó dos bombas atómicas una tras otra sobre Hiroshima y Nagasaki, matando a cientos de miles de personas y obligando a Japón a declarar una rendición incondicional.

event_stage_intro_20301=Hemos descifrado parcialmente el código de comunicaciones por radio japonés y el enemigo está intentando tendernos una emboscada en las aguas de Midway para eliminar nuestra principal fuerza de portaaviones. Sin embargo, el USS Yorktown ha completado reparaciones de emergencia y la fuerza aérea en Midway ha sido reabastecida. Todos los preparativos se han hecho lo mejor que hemos podido y solo estamos esperando la llegada de la flota combinada.
event_stage_intro_20302=La Flota Combinada se perdió después de la Batalla de Midway. El enemigo ha comenzado a construir aeródromos en Guadalcanal y Tulagi para consolidar sus defensas en la zona de las Islas Salomón. Una vez que capturemos estas fortalezas, podremos obtener un punto de pivote para contraatacar y recuperar el control de las aguas circundantes.
event_stage_intro_20303=Las fuerzas japonesas en Nueva Guinea habían perdido el apoyo de los portaaviones y su avance se había ralentizado. La Operación Watchtower también logró obligar al enemigo a comenzar a dividir sus fuerzas hacia las Islas Salomón. Ahora ha llegado el momento de contraatacar. Comenzando con el Sendero de Kokoda, hay que expulsar a las fuerzas terrestres japonesas de Nueva Guinea.
event_stage_intro_20304=El foco del ataque se había desplazado de Nueva Guinea a las Islas Filipinas, pero las bases militares japonesas en el Pacífico Central seguían siendo una amenaza importante. Las Marianas tuvieron que ser capturadas para obtener un punto de pivote para atacar las Islas Filipinas y preparar el terreno para un futuro bombardeo de las islas principales japonesas.
event_stage_intro_20305=El círculo de defensa japonés del Pacífico se ha roto capa por capa y la Flota Combinada ha sufrido una aplastante derrota en el Mar de Filipinas. La superioridad naval y aérea de todo el Pacífico Occidental está firmemente en nuestras manos. Es el momento oportuno. ¡Ahora es el momento de regresar a Filipinas!
event_stage_intro_20306=La derrota japonesa en Iwo Jima no nos detendrá. Okinawa será más complicado y tendrá más defensores. Pero el enemigo tampoco recibirá refuerzos del continente. Avanza con cautela, paso a paso.
event_stage_intro_20307=A pesar de los ataques nucleares contra Japón, se negaron a rendirse. El Cuartel General ha decidido llevar a cabo la Operación Downfall y desembarcar en suelo japonés para luchar. Los soviéticos también cooperarán con nosotros lanzando un ataque simultáneo en el norte. Esta es nuestra última batalla. ¡La victoria pertenece a todos los soldados aliados!
event_stage_intro_20311=Hemos descifrado parcialmente el código de comunicaciones por radio japonés y el enemigo está intentando tendernos una emboscada en las aguas de Midway para eliminar nuestra principal fuerza de portaaviones. Sin embargo, el USS Yorktown ha completado reparaciones de emergencia y la fuerza aérea en Midway ha sido reabastecida. Todos los preparativos se han hecho lo mejor que hemos podido y solo estamos esperando la llegada de la flota combinada.
event_stage_intro_20312=La Flota Combinada se perdió después de la Batalla de Midway. El enemigo ha comenzado a construir aeródromos en Guadalcanal y Tulagi para consolidar sus defensas en la zona de las Islas Salomón. Una vez que capturemos estas fortalezas, podremos obtener un punto de pivote para contraatacar y recuperar el control de las aguas circundantes.
event_stage_intro_20313=Las fuerzas japonesas en Nueva Guinea habían perdido el apoyo de los portaaviones y su avance se había ralentizado. La Operación Watchtower también logró obligar al enemigo a comenzar a dividir sus fuerzas hacia las Islas Salomón. Ahora ha llegado el momento de contraatacar. Comenzando con el Sendero de Kokoda, hay que expulsar a las fuerzas terrestres japonesas de Nueva Guinea.
event_stage_intro_20314=El foco del ataque se había desplazado de Nueva Guinea a las Islas Filipinas, pero las bases militares japonesas en el Pacífico Central seguían siendo una amenaza importante. Las Marianas tuvieron que ser capturadas para obtener un punto de pivote para atacar las Islas Filipinas y preparar el terreno para un futuro bombardeo de las islas principales japonesas.
event_stage_intro_20315=El círculo de defensa japonés del Pacífico se ha roto capa por capa y la Flota Combinada ha sufrido una aplastante derrota en el Mar de Filipinas. La superioridad naval y aérea de todo el Pacífico Occidental está firmemente en nuestras manos. Es el momento oportuno. ¡Ahora es el momento de regresar a Filipinas!
event_stage_intro_20316=La derrota japonesa en Iwo Jima no nos detendrá. Okinawa será más complicado y tendrá más defensores. Pero el enemigo tampoco recibirá refuerzos del continente. Avanza con cautela, paso a paso.
event_stage_intro_20317=A pesar de los ataques nucleares contra Japón, se negaron a rendirse. El Cuartel General ha decidido llevar a cabo la Operación Downfall y desembarcar en suelo japonés para luchar. Los soviéticos también cooperarán con nosotros lanzando un ataque simultáneo en el norte. Esta es nuestra última batalla. ¡La victoria pertenece a todos los soldados aliados!
event_stage_intro_20401=Para obligar a Italia a salir de la guerra, el cuartel general ha decidido dar prioridad a la eliminación de las fuerzas del Eje en el Mediterráneo. Utiliza nuestra superioridad aérea y marítima, junto con las fuerzas de desembarco, para tomar Sicilia.
event_stage_intro_20402=El gobierno italiano ya ha discutido en secreto con nosotros asuntos relacionados con la rendición, pero hace tiempo que el ejército alemán tomó el control de las tropas italianas en todas partes. Aprovecha esta rendición para destruir al ejército alemán en Italia de un solo golpe.
event_stage_intro_20403=La Operación Fortitude ha funcionado y las fortificaciones alemanas en Normandía aún no están completas. Estamos a punto de revolucionar la guerra abriendo un nuevo teatro en Europa.
event_stage_intro_20404=Los alemanes en Normandía habían sido derrotados, las defensas enemigas en Francia estaban siendo desmanteladas constantemente y las principales fuerzas aliadas estaban a punto de concentrarse en Francia. Para solucionar los problemas de suministro, el alto mando decidió abrir una nueva línea de suministro en el sur de Francia.
event_stage_intro_20405=Los ataques tras el desembarco fueron bien y el cuartel general esperaba abrir el camino hacia el interior de Alemania. Las fuerzas terrestres debían coordinarse con las unidades aerotransportadas para atravesar el Rin, la barrera natural para los alemanes.
event_stage_intro_20406=La masiva ofensiva alemana nos tomó por sorpresa. Pero el mal tiempo también ha limitado la velocidad del avance alemán. Mis tropas se han movido hacia el norte antes de lo previsto y se dirigen al campo de batalla a toda velocidad. Esté preparado para abordar esta saliente en cualquier momento.
event_stage_intro_20407=Los alemanes perdieron a sus mejores tropas, pero reunieron las últimas fuerzas en Berlín para la lucha final a muerte. Dejemos Berlín a los soviéticos. Avancemos hacia el este lo más rápido que podamos para encontrarnos con los soviéticos y rodear a los alemanes por todas partes. El destino de Berlín estaba decidido hace mucho tiempo.
event_stage_intro_20411=Para obligar a Italia a salir de la guerra, el cuartel general ha decidido dar prioridad a la eliminación de las fuerzas del Eje en el Mediterráneo. Utiliza nuestra superioridad aérea y marítima, junto con las fuerzas de desembarco, para tomar Sicilia.
event_stage_intro_20412=El gobierno italiano ya ha discutido en secreto con nosotros asuntos relacionados con la rendición, pero hace tiempo que el ejército alemán tomó el control de las tropas italianas en todas partes. Aprovecha esta rendición para destruir al ejército alemán en Italia de un solo golpe.
event_stage_intro_20413=La Operación Fortitude ha funcionado y las fortificaciones alemanas en Normandía aún no están completas. Estamos a punto de revolucionar la guerra abriendo un nuevo teatro en Europa.
event_stage_intro_20414=Los alemanes en Normandía habían sido derrotados, las defensas enemigas en Francia estaban siendo desmanteladas constantemente y las principales fuerzas aliadas estaban a punto de concentrarse en Francia. Para solucionar los problemas de suministro, el alto mando decidió abrir una nueva línea de suministro en el sur de Francia.
event_stage_intro_20415=Los ataques tras el desembarco fueron bien y el cuartel general esperaba abrir el camino hacia el interior de Alemania. Las fuerzas terrestres debían coordinarse con las unidades aerotransportadas para atravesar el Rin, la barrera natural para los alemanes.
event_stage_intro_20416=La masiva ofensiva alemana nos tomó por sorpresa. Pero el mal tiempo también ha limitado la velocidad del avance alemán. Mis tropas se han movido hacia el norte antes de lo previsto y se dirigen al campo de batalla a toda velocidad. Esté preparado para abordar esta saliente en cualquier momento.
event_stage_intro_20417=Los alemanes perdieron a sus mejores tropas, pero reunieron las últimas fuerzas en Berlín para la lucha final a muerte. Dejemos Berlín a los soviéticos. Avancemos hacia el este lo más rápido que podamos para encontrarnos con los soviéticos y rodear a los alemanes por todas partes. El destino de Berlín estaba decidido hace mucho tiempo.

