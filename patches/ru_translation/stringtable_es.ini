dialogue_2670=Las tropas avanzan sin problemas. Estamos a punto de romper la línea de defensa y marchar hacia la base soviética.
dialogue_2671=Se han completado el despliegue de misiles y están listos para atacar a las fuerzas enemigas.
dialogue_2672=Utiliza nuestra arma letal y destruye a los enemigos aquí.
dialogue_2673=Lanza inmediatamente un contraataque para retomar Seúl.
dialogue_2674=La ofensiva soviética ha supuesto una seria amenaza para nosotros y hay que tomar medidas para contraatacar.
dialogue_2675=La operación ha logrado una gran progresión. Pero ahora no hay lugar para la relajación y siempre estamos listos para responder a una contraofensiva soviética.
dialogue_2676=Destruye las fortalezas marítimas soviéticas y organiza el reagrupamiento de la flota enemiga.
dialogue_2677=El ejército estadounidense ha lanzado una invasión a gran escala y el tiempo se nos acaba.
dialogue_2678=Detengan la ocupación estadounidense de Sovetskaya Gavan. Mis refuerzos están a punto de llegar al campo de batalla.
dialogue_2679=Las fuerzas estadounidenses son de gran escala y atacan extremadamente rápido. Necesito más refuerzos.
dialogue_2680=Seguiré luchando y esperaré refuerzos para lanzar un contraataque.
dialogue_2681=Las tropas soviéticas ocuparon el lugar de desembarco. Reagrupen fuerzas para bloquear el estrecho de Tartaria.
dialogue_2682=Las fuerzas de desembarco se han reunido y están listas para participar en las operaciones para apoderarse de la isla en cualquier momento.
dialogue_2683=Lanza un ataque directo contra las fortalezas enemigas en Hokkaido. Las tropas defensoras de las islas Kuriles del Sur ganarán tiempo para nuestra operación.
dialogue_2684=Nuestro ataque ha perdido su punto de apoyo vital. ¡Retírense hacia Hokkaido!
dialogue_2685=La guarnición enemiga ha sido derrotada. Eliminen inmediatamente a la flota soviética de las aguas circundantes.
dialogue_2686=El ejército estadounidense nos está atacando en los tres campos de batalla al mismo tiempo. Defended las fortalezas y las ciudades con todas nuestras fuerzas. Esperen una oportunidad para lanzar un contraataque.
dialogue_2687=Los refuerzos no han podido llegar al campo de batalla, así que vamos a ir solos. Va a ser una batalla dura.
dialogue_2688=Las defensas soviéticas no son sólidas y no nos llevará mucho tiempo eliminar las bases soviéticas restantes en la península de Kamchatka.
dialogue_2689=Mis unidades blindadas resistirán aquí hasta la muerte. Por favor, ayude a las unidades de primera línea a retirarse a la línea de defensa.
dialogue_2690=La flota aliada se dirige hacia nosotros desde la dirección del mar de Bering. Tenga cuidado con la fuerza de desembarco posterior del enemigo.
dialogue_2691=El foco central del ataque del Ejército de EE.UU. cambiará de inmediato. Se dará prioridad en lidiar con los generales enemigos y a la reorganización de las defensas en función del terreno favorable.
dialogue_2692=Hemos recuperado el control de la ofensiva. Recuperar los suministros en las islas sería un buen punto de partida.
dialogue_2693=El ejército estadounidense ha concentrado todas las defensas en los alrededores de Anchorage. Ahora es el momento oportuno para una operación de desembarco.
dialogue_2694=La flota aliada atacaría desde el sur del estrecho de Bering para romper esta "cortina de hielo".
dialogue_2695=Ayuda a las fuerzas amigas a cruzar el estrecho de Bering y toma rápidamente el control del área alrededor de Anchorage.
dialogue_2696=Todas las líneas de defensa se han destruido y mantener esta posición por más tiempo es un callejón sin salida.
dialogue_2697=Tomen la iniciativa y retomen nuestra posición.
dialogue_2698=El ejército soviético, marchando simultáneamente por tierra y mar, se había establecido en Alaska.
dialogue_2699=Las rutas de retirada fueron prácticamente bloqueadas por los soviéticos y ahora la única forma es reorganizar las defensas con el terreno traicionero de la cordillera de Alaska.
dialogue_2700=Nos encargaremos de las fuerzas estadounidenses al oeste de Anchorage. Continúa el ataque hacia el este y completa este cerco.
dialogue_2701=Hemos roto las fortalezas del enemigo. No hay vuelta atrás para ellos.
dialogue_2702=La situación es crítica. Movilicen inmediatamente a todas las fuerzas de reserva para rescatar Anchorage.
dialogue_2703=El centro de investigación está bajo nuestro control. Utiliza todo aquí para acelerar la destrucción del enemigo.
dialogue_2704=Los soviéticos han irrumpido en nuestra fortaleza más fuerte. Alaska está completamente fuera de nuestras manos.
dialogue_2705=No debemos resignarnos a nuestra suerte. Ahora debemos tomar la iniciativa y retomar Fairbanks para tener una oportunidad de sobrevivir.
dialogue_2706=Rodeen el avance soviético rápidamente y no permitan que el enemigo despliegue sus formaciones fácilmente.
dialogue_2707=Las defensas enemigas nos han aislado de las fuerzas amigas. Esta barrera debe romperse antes de que lleguen los refuerzos.
dialogue_2708=Logramos bloquear la conexión entre las unidades soviéticas. Aprovechen la buena profundidad de nuestras defensas y expulsen al enemigo por completo.
dialogue_2709=Los defensores de Vancouver han sido aniquilados y el pasaje de ataque de la Costa Oeste está a punto de abrirse.
dialogue_2710=Los refuerzos llegarán pronto al campo de batalla. Defiendan Seattle hasta la muerte. Mis tropas lanzarán un contraataque hacia Vancouver.
dialogue_2711=¡Continúa el ataque! ¡Que tiemble el enemigo ante nuestro torrente de acero!



dialogue_2651=¡Se han reunido tropas de naciones aliadas y la balanza de la victoria se inclinará hacia nosotros!
dialogue_2652=Los aliados tienen muchos más recursos y suministros que nosotros y nos enfrentaremos a una batalla cuesta arriba.
dialogue_2653=Aplana los cañones antiaéreos de 88 mm y embosca en el desierto y las trincheras para tomar al enemigo por sorpresa.
dialogue_2654=No hay manera. No es razonable que el enemigo no muestre signos de derrota. ¡Debemos confiar en la flota de suministros en el Mediterráneo para librar una larga guerra de desgaste contra ellos!
dialogue_2655=Mantén la defensa de la costa y no des a los refuerzos ninguna oportunidad de desembarcar.
dialogue_2656=Italia estaba siendo atacada por los aliados. ¡Se le pide al comandante alemán que los apoye!
dialogue_2657=La victoria está a la vista. ¡Agárrate, comandante, estamos a punto de retirarnos ilesos!

dialogue_2658=Cancelen las patrullas aéreas semanales de los domingos en Pearl Harbor para dar a nuestros pilotos un descanso y recuperación completos.
dialogue_2659=El ascenso y la caída del Imperio de Japón dependen de esta batalla. ¡Todos los oficiales y soldados deben cumplir con su deber y dar su máxima dedicación!
dialogue_2660="... Semi-despejado con densa nubosidad sobre las montañas. Buena visibilidad en el puerto. Vientos del norte a eso de las diez." No había nada inusual en la transmisión desde Honolulu; Nuestro ataque era desconocido para el enemigo.
dialogue_2661=¡Esto no es un simulacro! ¡Pearl Harbor está bajo ataque japonés!
dialogue_2662=¡Tora! ¡Tora! ¡Tora!
dialogue_2663=¡Usen todas las defensas aéreas y protejan nuestros buques de guerra y puertos!
dialogue_2664=Sería una misericordia para mí ser asesinado de un solo disparo en este ataque.
dialogue_2665=Me temo que todo lo que hemos hecho es despertar a un gigante dormido que luchará contra nosotros con gran determinación.
dialogue_2666=To, To, To.

