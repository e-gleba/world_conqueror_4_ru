dialogue_2834=¡Camaradas, liberen Cluj y expulsen a la alianza germana-húngara de Rumania!
dialogue_2835=¡Avanza sobre Debrecen y destruyan al enemigo de una vez por todas!
dialogue_2836=¡Ataquen al noreste y capturen Kalinin! El objetivo es aislar aún más a Moscú y Yaroslavl.
dialogue_2837=El Frente Kalininista, dirigido por el camarada Konev, debe impedir que los alemanes avancen hacia Kalinin. Moscú hará todo lo posible para movilizar recursos en apoyo de este frente.
dialogue_2838=Atención a todas las unidades: ¡ataquen a los alemanes desde todas las direcciones de manera agresiva para agotar sus fuerzas y detener el avance continuo del enemigo!
dialogue_2839=La resistencia enemiga es feroz. Debemos estabilizar la línea para evitar una ruptura en la retaguardia.
dialogue_2840=Moscú está al alcance de la mano. Los soviéticos están exhaustos. ¡Rompamos sus defensas y tomemos por asalto Moscú!
dialogue_2841=Camaradas, el enemigo ha cerrado la línea de defensa de Mozhaisk. Debemos defenderla: ¡Moscú está detrás nuestra!
dialogue_2842=Camaradas, la tierra del enemigo está cerca y ha llegado el momento de la venganza. ¡Ataquen! ¡Limpien la vergüenza de la derrota y consuelen a los caídos!
dialogue_2843=¡Soldados, por el honor de Prusia Oriental y de nuestra patria, resistan hasta el último momento sin miedo al sacrificio!
dialogue_2844=Atención a todas las flotas, despejaremos el poder marítimo japonés y proporcionaremos espacio para los desembarcos. ¡Liberen las Filipinas y la marina japonesa ya no será una amenaza!
dialogue_2845=¡Soldados, aborden la isla, maten al enemigo y limpien nuestra vergüenza!
dialogue_2846=Señores, no importa el sacrificio, ¡debemos ganar esta batalla! Si perdemos las Filipinas, la marina volverá a ser inútil.
dialogue_2847=¡Todos ustedes continúen luchando mientras mi división aleja al enemigo!
dialogue_2848=Nuestros suministros son muy superiores a los del enemigo. La infantería liderará el camino, los tanques destruirán al enemigo y ¡esta batalla será ganada!
dialogue_2849=Hasta que regrese, dependan del campo minado para defenderse. Guarden sus suministros y esperen a que llegue el reabastecimiento.
dialogue_2850=El barco de suministros llegará pronto. Las unidades blindadas se están reuniendo en el norte para retomar posiciones.
dialogue_2851=¡Buenas noticias! ¡La RAF destruyó el barco de suministro enemigo en Tobruk!
dialogue_2852=Los suministros se están agotando y las pérdidas de tropas son demasiado grandes. Ya no podemos seguir luchando. ¡Todo el ejército, retirada total!
dialogue_2853=¡El ejército griego está mucho menos equipado que el nuestro! ¡Soldados, representen la gloria de Italia y ocupen Grecia!
dialogue_2854=Los griegos fueron bastante resistentes, pero aún así no pudieron contenernos.
dialogue_2855=Mantengan filas. ¡No podemos permitir que retomen la posición!
dialogue_2856=¡Toma la bahía Emperatriz Augusta y mantenla!
dialogue_2857=Una ola de refuerzos japoneses llegó desde el mar, ¡tenemos que detenerlos!
dialogue_2858=Las unidades del sur atraerán el fuego, las del norte realizarán el ataque principal. Camaradas, ¡en esta batalla está en juego la liberación de Kiev!
dialogue_2859=¡Mantengan Kiev a cualquier precio! ¡No se permitirá que el frente de batalla retroceda más!
dialogue_2860=No podemos quedarnos atrapados en Kiev. ¡Retírense rápidamente al suroeste!
dialogue_2861=Kiev ha sido liberada. ¡Sigan persiguiendo a los alemanes!
dialogue_2862=¡Contraataquen! ¡Detengan al enemigo y eviten que siga avanzando!
dialogue_2863=La operación se dividió en tres caminos paralelos. Aunque la guarnición local es débil, es importante actuar con rapidez para evitar que el puerto quede destruido.
dialogue_2864=La Marina Real Italiana está anclada en Tarento. Es una gran oportunidad. Debemos destruirlos en esta batalla.
dialogue_2865=¡Cañones antiaéreos, contraataquen!¡El resto, esquiven los ataques aéreos!
dialogue_2866=La Marina está cubriendo los desembarcos del Ejército. ¡Es imperativo recuperar el aeródromo!
dialogue_2867=Un avión de reconocimiento informó: las tropas japonesas se acercan a Guadalcanal. ¡Prepárense para la batalla!
dialogue_2868=Los refuerzos japoneses están aquí. ¡Estén alerta!
dialogue_2869=Las defensas del enemigo en el sur están vacías. ¡Evitaremos las defensas aquí, atraeremos a las fuerzas asediadoras y liberaremos Tobruk!
dialogue_2870=Las fuerzas que asedian Tobruk siguen combatiendo. Otras tropas defienden sus posiciones y esperan suministros.
dialogue_2871=¡Tobruk ha sido capturado y ahora todos deben prepararse para un contraataque!
dialogue_2872=¡Continúen la ofensiva y tomen Rostov!
dialogue_2873=Avanza y prepárate para rodear al enemigo. En esta batalla, ¡atacaremos con fuerza al 1.er Ejército Panzer alemán!
dialogue_2874=Las tropas no pueden ser destruidas aquí. El 1.er Ejército Panzer alemán se retira de Rostov.
dialogue_2875=Camaradas, ha llegado el momento de contraatacar. ¡Ataquen y recuperen nuestras posiciones!
dialogue_2876=¡Mantén la línea de defensa y nunca abandones ninguna de tus posiciones!
dialogue_2877=Camaradas, no podemos permitir que caigan en manos de Alemania y pongan en peligro a Leningrado. ¡Ataquen hasta que Leningrado esté a salvo!
dialogue_2878=Compatriotas, ¡lucharemos hasta el final por la independencia de Finlandia y por la seguridad de nuestra patria!
dialogue_2879=¡Concentremos nuestras fuerzas en capturar Naro-Fominsk y continuemos el frente hacia Moscú!
dialogue_2880=¡Camaradas, debemos mantener esta línea de defensa y no permitiremos que el enemigo irrumpa en Moscú!
dialogue_2881=El apoyo de artillería está en marcha. ¡Camaradas, recuperemos Kalinin!
dialogue_2882=Atención a todas las unidades: ¡confíen en la línea y defiendan a lo largo del río para garantizar la seguridad de Kalinin!

dialogue_3000=La vanguardia ha cortado los refuerzos terrestres del enemigo y ha completado con éxito el asedio de Stalingrado.
dialogue_3001=El destino del Tercer Reich está en nuestras manos. Aplastaremos al enemigo con frialdad y Stalingrado será testigo de nuestra inmortalidad.
dialogue_3002=¡Con el Volga a nuestras espaldas, no hay vuelta atrás! ¡Todos los desertores serán ejecutados y los soldados que sobrevivan serán ascendidos a otros rangos!
dialogue_3003=Aunque dejaré el frente, mi corazón sigue estando con ustedes. La adversidad es solo una prueba de nuestra voluntad; supérenla y la victoria será nuestra.
dialogue_3004=No estoy aquí para cubrir una retirada, sino para derrotar al enemigo por completo. Bloquearemos el ataque del enemigo detrás de cada calle, de cada fábrica, de cada muro derrumbado.
dialogue_3005=Mirando desde arriba, el enemigo no es más que un peón en un tablero de ajedrez. ¡Cada ataque será un juicio contra el enemigo!
dialogue_3006=Creían que tenían bajo control la situación de batalla, pero no se dieron cuenta de que el verdadero poder se acercaba a ellos. El frenesí de los contraataques los hundirá en problemas.
dialogue_3007=El enemigo solía pensar que era intocable, pero hemos destruido por completo su arrogancia. Tomar Kalach será el comienzo de la pesadilla del enemigo.
dialogue_3008=El asedio del enemigo es sólo temporal. Una vez que lleguen nuestros refuerzos, sus sueños de victoria se verán completamente destrozados. ¡Refuercen Stalingrado a cualquier precio!
dialogue_3009=Cada paso allana el camino hacia la victoria, cada golpe es una sentencia de muerte para el enemigo.
dialogue_3010=En el campo de batalla sólo hago una cosa: confirmar el momento en que el enemigo da su último aliento.
dialogue_3011=Como soldado, hice lo mejor que pude para cumplir con mi deber, pero ante una situación desesperada, nos quedan pocas opciones.
dialogue_3012=Estoy orgulloso de mis soldados, que demostraron un coraje sin igual en las condiciones más difíciles. Que los soldados que murieron aquí descansen en paz.
dialogue_3013=Cada ladrillo y piedra de Stalingrado se convertirá en una tumba enemiga.
dialogue_3014=El cielo ha perdido un águila, mi destino termina aquí. Aunque caiga, arderé hasta la última llamarada.
dialogue_3015=¿Se… acabó? Esta bala puede quitarme la vida, pero nunca apagará la furia de nuestra venganza.

