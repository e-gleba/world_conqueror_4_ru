legend_intro_50101=La División Leclerc tiene sus orígenes en el inquebrantable fervor patriótico de un hombre. En 1940, Leclerc llegó al norte de África y convenció al gobernador de Chad para que formara la "Columna Leclerc". Para reforzar las Fuerzas Francesas Libres, en 1941, Leclerc condujo a sus tropas a través del desierto para lanzar un ataque sorpresa contra el aeródromo de Kufra, en Libia, controlado por Italia. Tras capturar el aeródromo, Leclerc y sus soldados juraron allí mismo izar algún día la bandera nacional francesa en Estrasburgo. Esto marcó el comienzo de su legendaria trayectoria.
legend_intro_50102=Tras una serie de victorias militares de la Francia Libre en el norte de África, la Columna Leclerc cobró mayor relevancia. En 1943, recibió refuerzos y se unió al Octavo Ejército británico en la Campaña de Túnez. Durante las batallas de Médenine y la Línea Mareth, la columna repelió con éxito repetidas ofensivas blindadas alemanas. Posteriormente, avanzó con los Aliados hacia Túnez, poniendo fin a la Campaña del Norte de África.
legend_intro_50103=Tras la campaña del norte de África, la Columna Leclerc se reorganizó en la 2da División Blindada francesa, aún bajo el mando de Leclerc y pasó a ser conocida como la "División Leclerc". En 1944, esta unidad partió hacia Francia, emprendiendo un viaje para honrar su juramento. Durante la Bolsa de Falaise, la 2da División Blindada siguió al Tercer Ejército de Patton para cercar a las fuerzas alemanas desde el sur, destruyendo casi por completo la 9na División Panzer alemana y otras unidades, sentando así una base sólida para la liberación de Francia.
legend_intro_50104=Tras la Bolsa de Falaise, la División Leclerc ya se encontraba bastante cerca de París. Deseoso de liberar la ciudad cuanto antes, Leclerc solicitó resueltamente permiso al alto mando aliado para avanzar sobre la capital francesa, permiso que le fue concedido tras negociaciones políticas. Leclerc se dirigió inmediatamente hacia París, donde ya había comenzado un levantamiento. El 24 de agosto, con la cooperación de los insurgentes del interior de la ciudad, la División Leclerc entró en París. Bajo la presión aliada, la guarnición alemana estacionada en la ciudad se rindió el 25 de agosto. A partir de ese día, la bandera de la libertad volvió a ondear sobre París.
legend_intro_50105=Tras la reconquista de París, la 2da División Blindada francesa, al mando de Leclerc, fue asignada a la operación para recuperar la región de Alsacia-Lorena. A principios de septiembre, la inexperta 112da Brigada Panzer alemana fue víctima de una serie de emboscadas lanzadas por la 2da División Blindada francesa, que contaba con el apoyo de la aviación estadounidense. Trabajando en coordinación con los bombarderos estadounidenses, la División Leclerc destruyó la mayor parte de la brigada alemana con mínimas bajas aliadas. Las fuerzas alemanas se vieron obligadas a retirarse, lo que retrasó su contraofensiva inicialmente planeada en Lorena.
legend_intro_50106=El 22 de noviembre, con la aprobación del Alto Mando Aliado, la 2da División Blindada francesa, junto con el 1er Ejército francés, lanzó una ofensiva contra Estrasburgo. La División Leclerc atravesó por la fuerza la brecha de Saverne y avanzó con audacia, destrozando las defensas alemanas en el norte de Alsacia. El 23 de noviembre de 1944, liberaron Estrasburgo, cumpliendo así el Juramento de Kufra.

synergy_tactics_5_1=Tras el ataque de cualquier unidad de la "División Leclerc", se le otorga el efecto "Juramento de Restauración" a todas las unidades de la "División Leclerc" en un radio de dos casillas durante un turno. Juramento de Restauración: No puede entrar en caos.
synergy_tactics_5_2=Inspiración de Combate: Cuando una unidad blindada de la División Leclerc destruye una unidad enemiga bajo el efecto del "Juramento de Restauración", la moral de las unidades de la División Leclerc en un radio de dos casillas aumenta en 1 nivel. Este efecto puede ocurrir una vez por unidad durante un turno.
synergy_tactics_5_3=Apoyo Coordinado: cuando las unidades de artillería de la División Leclerc están bajo el estado del "Juramento de Restauración" y atacan una ciudad o fortaleza, si hay una unidad de infantería o blindada de la División Leclerc dentro de una casilla del objetivo, aumenta el daño infligido en un 10%.
synergy_tactics_5_4=Apoyo en la Persecución: cuando las unidades de infantería de la División Leclerc atacan mientras están bajo el estado "Juramento de Restauración", las unidades de la División Leclerc dentro de 2 casillas obtienen +5 de movilidad para este turno.

dialogue_4204=La Francia europea ya ha caído bajo la ocupación alemana, un día devolveremos la libertad a nuestra patria.
dialogue_4205=Italia tiene un aeródromo militar en Kufra y debemos capturarlo. Demostraremos al mundo la inquebrantable determinación de Francia.
dialogue_4206=Las tropas italianas están defendiendo firmemente la fortaleza e intentan llamar a los refuerzos.
dialogue_4207=El enemigo ha consolidado sus fuerzas en la fortaleza. Mantengan la presión e impidan que pidan refuerzos.
dialogue_4208=Las fuerzas italianas cesaron la resistencia y negociaron la rendición con las fuerzas francesas. Posteriormente, Leclerc prestó el Juramento de Kufra en el mismo lugar.
dialogue_4209=Juro solemnemente: sólo el día en que nuestra hermosa bandera ondee sobre la Catedral de Estrasburgo, depondremos las armas.
dialogue_4210=Hemos recibido noticias de que la 9na División Panzer alemana atacará mañana a través de Ksar Ghilane. Sugiero que sus fuerzas se retiren 80 kilómetros para evitar el ataque.
dialogue_4211=No, retirarnos ahora es imposible, nos dejaría vulnerables a una persecución. Nuestras tropas mantendrán las posiciones actuales para la defensa, pero necesitamos apoyo aéreo.
dialogue_4212=¡Persíganlos! ¡No los dejen escapar!
dialogue_4213=Es hora. Dejen que se acerquen a un rango de tiro efectivo antes de lanzar el ataque.
dialogue_4214=¡Buen trabajo! Pronto llegarán refuerzos. Cubran sus flancos y únanse a ellos para atacar el Paso de Tebaga.
dialogue_4215=¿Ha caído el Paso de Tebaga? Retírense de inmediato. No debemos permitir que el enemigo nos rodee.
dialogue_4216=Avancen hacia el norte hasta Argentan, unan fuerzas con las tropas canadienses y rodeen a las fuerzas alemanas en una bolsa.
dialogue_4217=¡Adelante! ¡Liberemos más de nuestra tierra!
dialogue_4218=Desplieguen la 352da División de Infantería en Alençon. Impidan que los aliados sigan avanzando.
dialogue_4219=Alençon fue capturada con éxito y posteriormente se tomó una importante base de suministro alemana. Como resultado, los alemanes abandonaron sus planes de contraofensiva y adoptaron una postura defensiva.
dialogue_4220=Desplieguen la 116 División Panzer en Argentan y protejan nuestra línea de retirada.
dialogue_4221=La 1ra División Blindada polaca aseguró con éxito una posición en la cresta del monte Ormel, bloqueando la última ruta de retirada alemana.
dialogue_4222=He asumido el mando. El Grupo de Ejércitos B debe acatar la orden: abandonen sus posiciones y retírense al este. Los refuerzos les brindarán apoyo total.
dialogue_4223=Después de una persistente presión por parte de las fuerzas francesas, los aliados finalmente acordaron permitir que la 2da División Blindada francesa y la 4ta División de Infantería estadounidense operaran juntas para apoyar a los insurgentes de París y evitar que volviera a ocurrir otra tragedia como la de Varsovia.
dialogue_4224=No esperen más a las fuerzas estadounidenses. ¡Actúen de inmediato! Los rebeldes en París ya han comenzado las hostilidades, ¡no podemos dejarlos sin apoyo!
dialogue_4225=La División Blindada Leclerc llegó a las afueras de París y estableció contacto con los combatientes de la resistencia parisina.
dialogue_4226=¡Derroten las defensas suburbanas y demuestren a los alemanes nuestra fuerza! ¡Díganle al pueblo de París que estamos aquí y que recuperarán su libertad!
dialogue_4227=La 4ta División de Infantería avanzó rápidamente hacia París, asegurándose de que los franceses no se llevaran todo el reconocimiento.
dialogue_4228=La guarnición alemana recibió órdenes estrictas del cuartel general de defender París a toda costa. No se debía permitir que París cayera en manos enemigas aun si esto significaba que la capital francesa quedara reducida a un montón de ruinas.
dialogue_4229=¡Esto nos va a matar a todos! ¡Detengan a ese loco! Llamen al cuartel general: obedeceremos.
dialogue_4230=Queremos negociar los términos de la rendición con las Fuerzas Aliadas. ¡No sacrificaremos nuestras vidas por esta locura!
dialogue_4231=La guarnición alemana en París finalmente negoció su rendición con los Aliados, poniendo fin a los combates en la ciudad. Sin embargo, los alemanes estacionados en las afueras desconocían la rendición negociada y continuaron combatiendo a los Aliados.
dialogue_4232=¡París fue humillada, brutalmente devastada y atormentada! ¡Pero al fin, París es libre!
dialogue_4233=Hemos recibido información de que el enemigo ha desplegado una brigada blindada de élite para apoyar a las fuerzas enemigas en Mirecourt. Debemos avanzar de inmediato hacia Dompaire para interceptar los refuerzos enemigos.
dialogue_4234=La situación en Mirecourt es grave, debemos reforzar urgentemente las líneas del frente.
dialogue_4235=Las fuerzas alemanas provenientes de Vittel vienen a detenernos. Debemos enfrentarlas con rapidez. De lo contrario, una vez que lleguen los refuerzos, estaremos en desventaja.
dialogue_4236=Hemos capturado Dompaire antes de que llegaran los refuerzos enemigos. Notifiquen a la fuerza aérea para que nos brinden apoyo. Destruiremos al enemigo aquí.
dialogue_4237=Llegamos demasiado tarde, por lo que debemos apoyar rápidamente a Mirecourt para evitar que las fuerzas estadounidenses sean atrapadas en un ataque de pinza desde dentro y fuera.
dialogue_4238=¡Ahora! ¡Fuego!
dialogue_4239=¡Pónganse a cubierto y contraataquen!
dialogue_4240=Estamos rodeados. ¡Abandonen los tanques y retírense de inmediato!
dialogue_4241=Continúen la ofensiva para eliminar a los alemanes en la orilla oeste del Mosela.
dialogue_4242=Estrasburgo está a la vista y el juramento está a punto de cumplirse. ¡Guerreros, peleen! ¡Viva Francia!
dialogue_4243=Los montes Vosgos están fuertemente custodiados y debemos encontrar una ruta sin vigilancia para poder atravesar las líneas de retaguardia enemigas.
dialogue_4244=Retírense a los Vosgos. ¡No pasarán!
dialogue_4245=¡¿Cómo diablos lograron atravesar los Vosgos?!
dialogue_4246=¡Dejen los desafíos más difíciles a las fuerzas estadounidenses y avancen hacia Estrasburgo a toda velocidad!
dialogue_4247=Telegrama a Estrasburgo: ¡Se han abierto brechas en los Vosgos! ¡Preparen defensas de inmediato!
dialogue_4248=¡Estrasburgo es libre! ¡Hemos cumplido nuestro juramento!
dialogue_4249=¡Aseguren las fortalezas circundantes, Estrasburgo no debe caer!
dialogue_4250=Mantengan la presión en los Vosgos y no permitan que las fuerzas alemanas apoyen sus líneas de retaguardia.
dialogue_4251=Las tropas de refuerzo italianas se movilizaron.
dialogue_4252=El ambiente en Ksar Ghilane es ciertamente tenso. Ese querido Leclerc... era un buen hombre. Pero ahora todo ha terminado y no lo volveremos a ver.
dialogue_4296=El enemigo ha capturado por completo la superioridad aérea. Esta posición es insostenible. Retirada inmediata.
dialogue_4297=La guarnición italiana ha desistido en pedir refuerzos y ahora se aferra a la fortaleza.
dialogue_4298=¡Aumenten la potencia de fuego y aplasten su voluntad de resistir!
dialogue_4299=La guarnición alemana en París se rindió a las fuerzas aliadas, y la ciudad fue liberada; no obstante, las tropas alemanas en las afueras, al no haber recibido la noticia, seguían combatiendo contra los aliados.



