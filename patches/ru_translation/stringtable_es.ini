elite_intro_93=El Flak 36 de 8,8 cm fue una pieza de artillería multiusos ampliamente utilizada por Alemania durante la Segunda Guerra Mundial. Originalmente diseñado para la defensa antiaérea, su excelente capacidad de penetración de blindaje también lo convirtió en un arma ampliamente utilizada contra tanques, especialmente en la campaña del norte de África contra las fuerzas blindadas británicas, donde demostró ser especialmente eficaz. Este cañón era preciso y potente, lo que le valió el apodo de "matatanques" entre los soldados aliados y se convirtió en una de las armas emblemáticas del ejército alemán.


