dialogue_4121=Son las cuatro de la mañana y la tormenta continúa. Todos esperan la decisión final: ¿aplazamos o seguimos adelante?
dialogue_4122=Los oficiales seguían debatiendo sobre las mareas, la nubosidad y la luna. Yo era el único que se daba cuenta de que meses de simulacros habían culminado en este preciso instante. La vacilación es mucho más letal que los proyectiles enemigos.
dialogue_4123=Vamos a partir. Que Dios tenga misericordia de todos nosotros.
dialogue_4124=El mar está demasiado agitado; ni siquiera los aviones de patrulla pueden despegar. El mensaje del Estado Mayor indica que las fuerzas aliadas no realizarán operaciones en condiciones meteorológicas tan adversas.
dialogue_4125=Hoy la niebla marina es excepcionalmente densa. … ¿Qué es eso detrás de la niebla? ¿Barcos de pesca? Un barco, dos barcos… Un momento… ¡Dios mío, tiembla todo el mar!
dialogue_4126=¡Es la flota aliada! ¡Es la flota aliada! ¿Lanzando una operación con este clima? ¡Deben estar locos! ¡Suenen la alarma, ahora! ¡Todo el personal, en alerta máxima de combate! ¡Avisen inmediatamente a la artillería y a las ametralladoras para que tomen sus posiciones! ¡Es un desembarco! ¡Están desembarcando!
dialogue_4127=¿Paracaidistas? Creían haber encontrado una oportunidad. Aquel terreno, compuesto enteramente de aguas poco profundas y suelo encharcado, era precisamente la trampa que el Mariscal había preparado. Perdieron en el instante en que saltaron del avión.
dialogue_4128=¡Excelente! ¡Que naden en el agua turbia! El Reich da la bienvenida a su "espíritu aventurero".
dialogue_4129=¡La línea de defensa costera es más resistente de lo que esperábamos, el fuego de ametralladoras del enemigo está creando una cortina de acero! ¡Díganles a los acorazados y a la fuerza aérea que arrasen esos búnkeres!
dialogue_4130=¡Veo que mis hombres están estancados en el agua! ¡Envíen los botes de rescate de inmediato, cueste lo que cueste! ¡No los dejaré ahogarse solos en este mar!
dialogue_4131=Cada centímetro de la cabeza de playa, cada trinchera, cada búnker es una llave al continente europeo. ¡Recuperémoslos! Ese es nuestro camino a casa.
dialogue_4132=¡Manténganse en contacto con la flota! ¡Maldita sea, necesitamos apoyo aéreo! ¡Llamen a nuestras aeronaves como acordamos!
dialogue_4133=¡Atención a todas las unidades! ¡El grupo blindado alemán se está reagrupando! ¡Este es su contraataque final, y es nuestro momento de decidir la victoria o la derrota!
dialogue_4134=Siguen llegando a la costa… incontables embarcaciones, llegando en oleadas una tras otra. ¡Dios mío, ¿están locos?! ¡La línea de defensa se derrumba! ¡No podemos contenerlos mucho más! Solicito órdenes… repito, solicito órdenes…
dialogue_4135=El mariscal de campo Rommel se encuentra en Berlín en este preciso momento... Nadie puede darnos órdenes ahora, y no hay refuerzos; ¡solo podemos confiar en nosotros mismos!
dialogue_4136=¡El mariscal Rommel ha llegado al frente! ¡Ahora nos toca contraatacar! ¡El Canal de la Mancha será su tumba!
dialogue_4137=Soldados, ahora debemos hacerles entender: un soldado alemán puede caer, pero nunca se arrodilla; aunque solo quede uno, esta costa no será capturada tan fácilmente.
dialogue_4138=Los soldados rezan. Ya no corean consignas; solo quieren vivir… El aire está impregnado del hedor a pólvora, gasolina, agua de mar y carne carbonizada.
dialogue_4139=Hemos perdido la playa. El desembarco ha fracasado… Ordenen a todas las tropas que se retiren a los barcos. Hemos perdido esta batalla, pero no perderemos la guerra. Un día, volveremos.
dialogue_4140=Este fue el error más grave que cometimos... subestimar la represalia final de un imperio al borde del colapso.
dialogue_4141=Parece que hemos ganado esta batalla, pero me pregunto: ¿estamos defendiendo de verdad nuestra patria, o solo una ilusión vacía? ¿O un simple sueño que hace tiempo perdió su alma? El Führer traza fronteras desde lejos, pero nunca ha visto caer a los soldados, uno a uno.
dialogue_4142=La obediencia ciega es instintiva en los soldados, pero la duda racional es también un derecho humano fundamental. Cuando llegue el día en que todos aprendan a pensar, entonces —y solo entonces— podrá salvarse el Reich.
dialogue_4143=Nunca he odiado a los del bando contrario; ellos también son padres e hijos obligados por órdenes a ir a la muerte. Quizás nuestra única diferencia radica en el bando en el que el destino nos colocó.
dialogue_4144=Que esta batalla no sea el fin de la guerra, sino el comienzo del renacimiento del Reich.
dialogue_4145=He cumplido mi juramento militar… No dejaré que el enemigo ponga un pie en Berlín, ni un solo centímetro.

event_107=El Muro del Atlántico
event_intro_107=En el verano de 1944, los Aliados concentraron una fuerza sin precedentes en Gran Bretaña, con artillería y armamento que se combinaban en una marea imparable, listos para entrar de nuevo en la costa opuesta del Canal de la Mancha. El ejército alemán defendía la costa norte de Francia, enfrentándose a una tormenta que tarde o temprano llegaría. Los soldados aguardaban con el corazón en un puño entre dunas y búnkeres de hormigón. La mañana del 6 de junio, el mar frente a Normandía se transformó en una extensión grisácea por la llegada de innumerables lanchas de desembarco, y el cielo resonó con el rugido de los aviones. Para los alemanes, esto era más que una simple acción defensiva; era una lucha contra el destino mismo. En medio de un bombardeo incesante, el destino de Europa pendía de un hilo en estas playas, mientras los soldados alemanes afrontaban su día más largo y desolador en el Frente Occidental.

dialogue_4154=Esta es una operación de incursión limitada cuyo objetivo principal es eliminar los bastiones italianos en Sidi Barrani y sus alrededores, y recapturar y controlar rápidamente el litoral de Sidi Barrani.
dialogue_4155=Capturamos con éxito Sidi Barrani y a un gran número de tropas italianas.
dialogue_4156=¡Aceleremos la ofensiva! Las fuerzas ítalo-libias han sido capturadas en gran número y el enemigo está completamente desprevenido. ¡Debemos aprovechar aún más nuestra ventaja!
dialogue_4157=Todas las legiones, vigilen atentamente la costa. ¡Cirenaica no debe caer!
dialogue_4158=La ofensiva británica es feroz. No puedo permitir que el 10mo Ejército quede atrapado en Cirenaica. Todas las unidades, reorganícense y prepárense para la retirada de Cirenaica.
dialogue_4159=Quizás podríamos considerar la posibilidad de cruzar el desierto para impedir que las tropas defensoras de Bengasi se retiren hacia el oeste.
dialogue_4160=Un zorro fue cazado en una zona abierta.
dialogue_4161=De acuerdo, notifiquen a todas las unidades: las fuerzas de Bengasi han sido eliminadas, procedan con toda su fuerza a atacar y ocupar Cirenaica.
dialogue_4162=Derroten a las fuerzas enemigas en el Desierto Occidental y luego háganlas retroceder al oeste de Tobruk.
dialogue_4163=El Fuerte Capuzzo fue capturado con éxito.
dialogue_4164=El ejército alemán, aprovechando los cañones antiaéreos de 88 mm y el terreno estratégico del paso de Halfaya, logró contener con éxito la ofensiva británica.
dialogue_4165=La 15ta División Panzer reforzó rápidamente el Fuerte Capuzzo, mientras que la 5ta División Ligera avanzó detrás de las líneas británicas para reforzar el Paso de Halfaya.
dialogue_4166=Las fuerzas alemanas están a punto de cortar nuestra retirada. No debemos permitir que nuestras tropas queden rodeadas. Informen al frente: abandonen los objetivos operacionales y retírense inmediatamente.
dialogue_4167=Las fuerzas británicas recapturaron el paso de Halfaya. El punto estratégico clave de la carretera costera volvió a estar bajo control británico.
dialogue_4168=Genial, sigan avanzando por la carretera costera.
dialogue_4169=Notifiquen a todas las unidades: El plan de batalla ha sido modificado. Suspendan todo el apoyo al Paso de Halfaya y concentren todos los esfuerzos en cercar y eliminar a las fuerzas enemigas al oeste del paso.
dialogue_4170=En esta batalla, debemos derrotar a las fuerzas alemanas y romper el asedio de Tobruk.
dialogue_4171=¡7ma División Blindada, atención! Se les ordena capturar el aeródromo de Sidi Rezegh y estar preparados para lanzar una ofensiva en el momento oportuno contra Tobruk.
dialogue_4172=Tras capturar con éxito Sidi Rezegh, la guarnición de Tobruk se prepara para una ofensiva.
dialogue_4173=Abandonen el plan de asaltar Tobruk y mantengan el cerco. Recapturen Sidi Rezegh de inmediato; no podemos permitir que utilicen ataques aéreos para amenazar el asedio.
dialogue_4174=¡Soldados, resistan! ¡Llegan los refuerzos! ¡Debemos hacer que el "zorro" se desangre en este aeródromo!
dialogue_4175=Las fuerzas británicas atacantes eran abrumadoramente superiores en número. No nos queda más remedio que atacar su retaguardia para forzar su retirada.
dialogue_4176=Atención, tanques: flanqueen desde el desierto del sur hacia Egipto, destruyan con todas sus fuerzas las estaciones de suministro británicas en la retaguardia y liberen las fortalezas fronterizas.
dialogue_4177=Las fuerzas móviles apoyan rápidamente a Sidi Rezegh, mientras que las fuerzas principales avanzan con toda su fuerza a lo largo de la costa hacia Tobruk.
dialogue_4178=Las fuerzas de Bardia se retiraron hacia Tobruk, reforzando el asedio de Tobruk.
dialogue_4179=Todo el ejército debe ejecutar este plan: en el sur, lanzamos una finta para desviar la atención del enemigo; en el norte, concentramos nuestra fuerza superior para destruir el grueso del ejército enemigo.
dialogue_4180=Necesito regresar a Europa para recuperarme. El enemigo podría emprender acciones a gran escala próximamente, y es necesario seguir estrictamente el plan de defensa para llevar a cabo la operación.
dialogue_4181=El comandante interino del Cuerpo Blindado Ítalo-Alemán murió en combate; Rommel regresó al norte de África para asumir nuevamente el mando de las fuerzas.
dialogue_4182=He retomado el mando de los panzers. Los panzers se están reagrupando en el norte, preparándose para recapturar esas posiciones.
dialogue_4183=Retírense de la línea de defensa sur y replieguen de manera ordenada hacia la costa norte.
dialogue_4184=La 7ma División Blindada se redespliega al norte para encabezar la ofensiva principal. Se lanza la Operación Supercharge.
dialogue_4185=El buque petrolero se hundió, sumiendo a los ejércitos del Eje en una crisis de combustible.
dialogue_4186=Con nuestras reservas de combustible agotadas y nuestras fuerzas sufriendo grandes pérdidas, debemos replegarnos para mantener nuestra capacidad de combate.
dialogue_4187=¡Continúen el ataque, avancen hacia las llanuras costeras y destruyan las líneas de suministro enemigas!
dialogue_4188=La llanura costera está a la vista. ¡Tómense un breve descanso y prepárense para avanzar hacia la llanura costera!
dialogue_4189=Las unidades blindadas se han retirado; ¡la línea de suministro en la llanura costera debe permanecer segura!
dialogue_4190=Una repentina tormenta de arena azotó el campo de batalla, sumiendo a ambos bandos en conflicto en una situación de escasa visibilidad.
dialogue_4191=Ante el deterioro de la situación en Túnez, Rommel fue llamado de vuelta del norte de África para evitar que la derrota allí empañara su prestigio y, a su vez, minara la moral en el frente interno.
dialogue_4192=En nombre de las fuerzas alemanas que aún permanecen en África, me rindo a los Aliados.
dialogue_4193=Tras el colapso del ejército alemán, Italia emitió una orden de rendición al general Messe.
dialogue_4194=En nombre del 1er Cuerpo Italiano, me rindo a los Aliados.
dialogue_4195=Sin bombardeos aéreos ni de artillería naval previos, los alemanes no pueden anticipar cuándo lanzaremos un ataque sorpresa. ¡Ataquen! ¡Utilicen un ataque sorpresa para romper las líneas alemanas!
dialogue_4196=¡Abandona tu ataque! Estamos totalmente preparados para enfrentarte.
dialogue_4197=Debido a la planificación defectuosa de Clark, las tropas de desembarco quedaron en desventaja.
dialogue_4198=¡Maldita sea! El enemigo ya anticipó este ataque. ¡Avisen inmediatamente a la armada para que abra fuego de artillería y sofoque el contraataque enemigo!
dialogue_4199=Al amparo del fuego naval de apoyo, las fuerzas aliadas desembarcaron con éxito en Salerno.
dialogue_4200=A todas las unidades, establezcan defensas en terreno montañoso para frenar el avance del enemigo.
dialogue_4201=Abandonen Nápoles. Todas las unidades deben replegarse hacia la Línea de Invierno.

