feat_desc_93=La efectividad del combate no disminuirá cuando se reduzca la salud. Cuando estás cerca de la muerte, los PV no se pueden reducir por debajo de 1 punto durante 2 turnos, con un tiempo de reutilización de {2} turnos.
feat_desc_93_Lv2=La efectividad del combate no disminuirá cuando se reduzca la salud. Cuando estás cerca de la muerte, los PV no se pueden reducir por debajo de 1 punto durante 2 turnos, con un tiempo de reutilización de {2} turnos.
feat_desc_93_Lv3=La efectividad del combate no disminuirá cuando se reduzca la salud. Cuando estás cerca de la muerte, los PV no se pueden reducir por debajo de 1 punto durante 3 turnos, con un tiempo de reutilización de {2} turnos.
feat_desc_94=Cuando estás dentro del alcance de tu propio territorio o del de un aliado, el daño infligido aumenta un {1}%.
feat_desc_95=Ignora los efectos de reducción de daño del terreno al atacar y contraatacar.
feat_desc_95_Lv2=Ignora los efectos de reducción de daño del terreno al atacar y contraatacar, y reduce la defensa y movilidad del enemigo un {1}% durante 1 turno.
feat_desc_95_Lv3=Ignora los efectos de reducción de daño del terreno al atacar y contraatacar, y reduce la defensa y movilidad del enemigo un {1}% durante 2 turnos.
feat_desc_96=El daño directo recibido se divide entre usted y los amigos circundantes, y por cada {1} punto de daño dividido o esquivado, el ataque base aumenta en {2} puntos, con un límite de aumento de ataque del 100%. Dura 2 turnos.
feat_desc_96_Lv2=El daño directo recibido se divide entre usted y los amigos circundantes, y por cada {1} punto de daño dividido o esquivado, el ataque base aumenta en {2} puntos, con un límite de aumento de ataque del 100%. Dura 3 turnos.
