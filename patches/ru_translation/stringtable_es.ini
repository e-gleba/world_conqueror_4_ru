feat_desc_43_Lv2=Después de la acción, puedes realizar una segunda acción. Un {1}% de probabilidad de poder atacar nuevamente después de que la segunda acción destruya al ejército enemigo (solo una vez), tiempo de reutilización de 1 turno.
feat_desc_47_Lv3=Restaura {1} PV a 1 objetivo amistoso y restaura 50 PV adicionales a ese objetivo cada turno durante 2 turnos. Usa la habilidad mientras restauras {2} puntos de tu PV, tiempo de reutilización de 1 turno.
feat_desc_50_Lv2=Ataca a varias tropas enemigas sin reducir el daño a otros objetivos y el daño crítico aumenta un {1} %.
feat_desc_51_Lv2=El siguiente rango de ataque +2, el ataque reduce adicionalmente el HP de la ciudad o fortaleza objetivo en un {1}% (hasta 1200) y el PV de las tropas defensoras en un {2}% (hasta 500), tiempo de reutilización de 2 turnos.
feat_desc_57_Lv2=Transporta una unidad de infantería, vehículo blindado, artillería de campaña o un obús a la ubicación objetivo, recuperando un {1} % de PV durante el transporte.
feat_desc_60_Lv2=Minas sensibles plantadas en dos casillas, tiempo de reutilización de 1 turno.
feat_desc_61_Lv2=El siguiente ataque inflige daño a un enemigo aleatorio adicional dentro de 1 casilla del objetivo, tiempo de reutilización de 2 turnos.
feat_desc_62_Lv2=Provoca que las tropas enemigas dentro de 1 casilla de ti caigan en un estado de Confusión durante 1 turno, con un tiempo de reutilización de 3 turnos. Cuando afecta a 3 o más objetivos, el tiempo de reutilización es de 1 turno.
feat_desc_64=La probabilidad de ataque crítico desbordado se convertirá en daño adicional; por cada {2}% de ataque crítico desbordado, causará un {1}% de daño adicional.
feat_desc_65=Ignora {1}% de la defensa de la tropa enemiga.
feat_desc_66=Incrementa el daño a los tanques por {1}% este turno, 2 turnos de enfriamiento.
feat_desc_67=Daño por contraataque +{1}%
feat_desc_68=Después de un ataque, si el oponente es aniquilado, hay un {0}% de posibilidades de realizar otra acción, con un límite de {2} vez.
feat_desc_69=Cuando un ejército amigo dentro de 1 casilla de ti ataca, hay {0}% de probabilidades de que participes en el ataque.
feat_desc_69_Lv2=Cuando un ejército amigo dentro de 1 casilla de ti ataca, hay {0}% de probabilidades de que participes en el ataque y aumenta un {1}% de daño.
feat_desc_70=Al atacar, inflige un {1}% de daño adicional a otros objetivos dentro de 1 casilla del objetivo, 2 turnos de enfriamiento.
feat_desc_71=Ataques adicionales {1} veces
feat_desc_72=Puede utilizar todos los aviones normales del aeropuerto con un máximo de {1} puntos de avión.
feat_desc_72_Lv3=Puedes usar la mayoría de las aeronaves en el aeródromo, excepto los transportes, con un máximo de {1} puntos de aeronaves.
feat_desc_73=Aumenta el daño normal de ataque a los tanques en un {1}%.

