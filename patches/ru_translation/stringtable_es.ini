conquest_event_desc_1=El ejército chino libró una feroz batalla contra las fuerzas invasoras japonesas en Shanghái y a lo largo del arroyo Suzhóu. La batalla obligó al ejército japonés a cambiar su dirección estratégica de ataque principal y aplastó el plan japonés de "destruir China en tres meses".
conquest_event_desc_2=El ejército chino se mantuvo firme en Wuhan frente a las fuerzas invasoras japonesas, demostrando la voluntad de resistencia del ejército chino ante la adversidad. La guerra de resistencia de China pasó de la defensa estratégica al estancamiento estratégico.
conquest_event_desc_3=Al adoptar la táctica de guerra relámpago móvil multiservicio, Alemania invadió rápidamente Polonia en 1939, lo que provocó que Gran Bretaña y Francia declararan la guerra a Alemania y el estallido oficial de la Segunda Guerra Mundial.
conquest_event_desc_4=La estasis relativa entre Gran Bretaña, Francia y Alemania, donde se declarar la guerra pero no se libró y no se llevaron a cabo operaciones de campaña a gran escala, condujo a un breve estancamiento militar al comienzo de la Segunda Guerra Mundial.
conquest_event_desc_5=Los ejércitos soviético y japonés lucharon en nombre de Mongolia y el pseudo-Manchukuo. Después de la guerra, la Unión Soviética y Japón firmaron el tratado de neutralidad soviético-japonés, tras el cual los dos países permanecieron en paz durante la mayor parte de la Segunda Guerra Mundial.
conquest_event_desc_6=Estados Unidos brindó una importante asistencia armamentística a Gran Bretaña y Francia, lo que significó un importante apoyo para su armamento.
conquest_event_desc_7=La Unión Soviética intentó conquistar Finlandia durante los fríos meses de invierno y aunque salió victoriosa, tuvo un gran coste.
conquest_event_desc_8=Alemania lanzó un ataque en Noruega y Dinamarca
conquest_event_desc_9=Los ricos recursos petroleros de Rumania proporcionaron combustible estratégico a Alemania y tuvieron un impacto significativo en las capacidades operativas del Eje.
conquest_event_desc_10=Alemania utilizó tácticas de guerra relámpago para invadir los Países Bajos, rompiendo rápidamente las líneas de defensa neerlandesas y belgas.
conquest_event_desc_11=Preparado para lanzarse en mayo de 1940, el Plan Manstein consistía en formar un cerco de las fuerzas aliadas anglo-francesas cruzando el bosque de las Ardenas y evitando la Línea Maginot.
conquest_event_desc_12=Suecia jugó un papel clave en el impulso del poder militar de las potencias del Eje durante la Segunda Guerra Mundial al suministrar a Alemania grandes cantidades de mineral de hierro de alta calidad.
conquest_event_desc_13=Churchill se convirtió en Primer Ministro británico y su liderazgo y discursos motivadores cimentaron el espíritu de resistencia en Gran Bretaña.
conquest_event_desc_14=La Línea Maginot fue ineficaz para detener a las fuerzas alemanas durante la invasión, lo que provocó el colapso del frente norte en Francia.
conquest_event_desc_15=La caída de París simbolizó la derrota de Francia y el campo de batalla de Europa occidental terminó con una victoria alemana, lo que le dio a Alemania una victoria estratégicamente importante al comienzo de la guerra.
conquest_event_desc_16=Ante el cerco alemán, los aliados llevaron a cabo una retirada masiva en las playas de Dunkerque, transportando a unos 330.000 soldados de regreso a Gran Bretaña por rutas marítimas militares y civiles, sentando las bases cruciales para una posterior contraofensiva.
conquest_event_desc_17=El ejército alemán formuló el "Plan León Marino" para una invasión a gran escala de Gran Bretaña en 1940, con la intención de destruir el poder militar británico mediante ataques marítimos y aéreos.
conquest_event_desc_18=La decisiva batalla aérea sobre Gran Bretaña en 1940, en la que la RAF logró contener la invasión de la Luftwaffe, marcó una victoria crucial para los aliados en el campo de batalla europeo.
conquest_event_desc_19=La Kriegsmarine amenazó a los convoyes aliados mediante operaciones coordinadas de grupos submarinos y ataques indiscriminados contra flotas enemigas y buques mercantes.
conquest_event_desc_20=Durante la Segunda Guerra Mundial se produjeron feroces enfrentamientos navales en el Océano Atlántico, en los que los submarinos alemanes atacaron a las flotas aliadas mediante tácticas de manada de lobos, mientras que los aliados recurrieron a la guerra de convoyes y antisubmarina.
conquest_event_desc_21=
conquest_event_desc_22=Alemania, Italia y Japón fortalecieron gradualmente su cooperación y formaron una alianza militar basada en intereses políticos y militares comunes.
conquest_event_desc_23=Luego de la invasión japonesa de Tailandia, ésta decidió cooperar con Japón y luego se unió formalmente a las potencias del Eje.
conquest_event_desc_24=Alemania envió tropas al norte de África para cooperar con el ejército italiano, en un intento de apoyar las operaciones italianas en la región y representar un fuerte desafío para el ejército británico.
conquest_event_desc_25=En 1941, Alemania rompió el pacto de no agresión soviético-alemán y lanzó formalmente una invasión de la Unión Soviética, dando inicio al frente oriental en Europa.
conquest_event_desc_26=España envió la División Azul a participar en el campo de batalla del Frente Oriental en 1941 en favor de Alemania, en apoyo de la Operación Barbarroja contra la Unión Soviética.
conquest_event_desc_27=Al permanecer neutral, Portugal ha logrado preservar las relaciones comerciales y crear condiciones para que el país permanezca relativamente estable.
conquest_event_desc_28=Los líderes estadounidenses y británicos firmaron la Carta del Atlántico en 1941, que estableció los principios que unieron a los aliados en la Segunda Guerra Mundial.
conquest_event_desc_29=Los voluntarios aéreos estadounidenses, organizados por el general estadounidense Chennault, crearon los Tigres Voladores en China, dedicados a realizar misiones de apoyo aéreo en el teatro China-Birmania-India para ayudar en la defensa contra la agresión japonesa.
conquest_event_desc_30=La ciudad soviética de Leningrado está asediada por los alemanes y sus habitantes luchan por sobrevivir en medio del hambre y el frío, mientras se enfrentan al constante fuego de artillería y ataques aéreos alemanes.
conquest_event_desc_31=Cuando los alemanes atacaron Moscú, los soldados y civiles soviéticos se levantaron contra la invasión alemana en medio de un invierno extremadamente frío.
conquest_event_desc_32=En noviembre de 1941 se celebró un desfile militar en la Plaza Roja de Moscú, URSS. Cientos de miles de soldados y oficiales del Ejército Rojo cruzaron el podio para ser inspeccionados por los líderes soviéticos y luego partieron a luchar en el frente occidental.
conquest_event_desc_33=El severo invierno, la falta de suministros y la decidida resistencia del ejército soviético exacerbaron el agotamiento de los suministros alemanes y bajaron la moral del ejército alemán.
conquest_event_desc_34=La armada naval japonesa lanzó un ataque furtivo contra la Flota del Pacífico de los EE. UU. en diciembre de 1941, destruyendo una parte de la flota estadounidense e impulsando a los EE. UU. a un compromiso a gran escala con la guerra, lo que llevó a la participación formal de los EE. UU. en la Segunda Guerra Mundial.
conquest_event_desc_35=Después de Pearl Harbor, la Guerra del Pacífico estalló con toda su fuerza y Estados Unidos y sus aliados finalmente asestaron un duro golpe a Japón al empujar gradualmente la línea de batalla hacia el continente japonés mediante la estrategia de ir isla por isla.

