conquest_event_desc_69=Después del final de la Segunda Guerra Mundial, la Unión Soviética no logró retirarse de las zonas del norte de Irán que había ocupado según lo acordado. Después de negociaciones y presiones diplomáticas internacionales, la Unión Soviética finalmente retiró sus tropas, garantizando la integridad territorial de Irán. Esta crisis marcó el comienzo de la confrontación entre Estados Unidos y la Unión Soviética en el Medio Oriente.
conquest_event_desc_70=La retirada de las fuerzas del Eje provocó un vacío de poder en Grecia. Estalló una guerra civil entre las fuerzas del gobierno griego y las Fuerzas Democráticas, lo que provocó una sociedad griega profundamente dividida y un gran número de víctimas civiles. La guerra civil empujó a Grecia a unirse al campo occidental después de la guerra y convertirse en miembro de la OTAN.
conquest_event_desc_71=Dos destructores británicos chocaron sin querer con una mina en el canal de Corfú, provocando decenas de víctimas. Posteriormente, se enviaron buques de guerra británicos al estrecho para realizar operaciones de limpieza de minas, medida que generó fuertes protestas por parte de Albania.
conquest_event_desc_72=En 1952, un grupo de Oficiales Libres egipcios derrocó la monarquía del rey de Egipto y estableció una república. Este acontecimiento puso fin al largo período de gobierno monárquico y marcó el comienzo de la modernización de Egipto.
conquest_event_desc_73=El movimiento revolucionario dentro de Cuba logró derrocar la dictadura y establecer un estado socialista. Esta revolución convirtió a Cuba en uno de los principales puntos focales de la política global durante la Guerra Fría.
conquest_event_desc_74=En 1956, estalló un levantamiento masivo en Hungría contra la Unión Soviética y su propio régimen, pero finalmente fue reprimido por el ejército y derrotado.
conquest_event_desc_75=Gran Bretaña, Francia y otros países lanzaron conjuntamente una ofensiva militar contra Egipto con el objetivo de recuperar el control del Canal de Suez. Aunque inicialmente todo salió bien, Gran Bretaña y Francia finalmente se vieron obligadas a retirar sus tropas bajo una fuerte oposición y presión diplomática de Estados Unidos y la Unión Soviética. El conflicto marcó el fin de Gran Bretaña y Francia como fuerzas dominantes en el mundo.
conquest_event_desc_76=Jóvenes oficiales militares portugueses organizaron y lanzaron un golpe militar que derrocó al antiguo régimen autoritario de Portugal. Tras la revolución exitosa, Portugal rápidamente recurrió a la democracia y abandonó sus colonias en África y Asia, poniendo fin a siglos de dominio colonial portugués.
conquest_event_desc_77=En 1961, los exiliados cubanos apoyados por Estados Unidos invadieron Cuba. Sin embargo, después de desembarcar en la Bahía de Cochinos, al sur de Cuba, los invasores fueron rápidamente derrotados por las fuerzas cubanas. El incidente aumentó las tensiones en las relaciones entre Estados Unidos y Cuba y solidificó el dominio del liderazgo cubano.
conquest_event_desc_78=En respuesta a las medidas estadounidenses para desplegar misiles balísticos en Italia y Turquía, la Unión Soviética desplegó misiles balísticos similares en Cuba, una medida que llevó las tensiones entre Estados Unidos y la Unión Soviética a un nivel sin precedentes, al borde de una guerra nuclear.
conquest_event_desc_79=La Unión Soviética envió tropas a Afganistán para reprimir allí a las fuerzas antigubernamentales. Esta invasión provocó un gran número de víctimas, el desplazamiento de refugiados y una gran destrucción en el país. Como resultado, la Unión Soviética fue condenada enérgicamente por la comunidad internacional.
conquest_event_desc_80=En 1965, Estados Unidos, temiendo que la República Dominicana pudiera convertirse en una segunda Cuba, envió tropas al país con el pretexto de proteger a los ciudadanos estadounidenses. Esta medida provocó una fuerte condena por parte de la opinión pública internacional, e incluso algunos países de la OTAN expresaron públicamente su oposición.
conquest_event_desc_81=Los ataques preventivos de Israel contra los Estados árabes de Egipto, Siria y Jordania han alterado dramáticamente el panorama geopolítico de Medio Oriente. El resultado de la guerra desencadenó el prolongado conflicto árabe-israelí y la inestabilidad continua en Oriente Medio.
conquest_event_desc_82=Como resultado de la disputa de soberanía, Argentina ocupó las Islas Malvinas y Gran Bretaña envió su flota a contraatacar. La guerra provocó la pérdida de cientos de vidas en ambos bandos y profundizó aún más la relación hostil entre los dos países en las esferas política, cultural, económica y deportiva.
conquest_event_desc_83=En 1972, miembros de las autoridades estadounidenses fueron detenidos mientras instalaban una escucha telefónica en el edificio Watergate. A medida que la investigación se profundizó, reveló una serie de violaciones y encubrimientos gubernamentales, una medida que finalmente condujo a la renuncia de un presidente por un escándalo por primera vez en la historia de Estados Unidos.
conquest_event_desc_84=Conocido oficialmente como Programa Europeo de Recuperación, fue un programa histórico de ayuda económica y asistencia en la reconstrucción por parte de Estados Unidos a los países de Europa Occidental tras la devastación de la guerra posterior a la Segunda Guerra Mundial. Esta iniciativa tuvo un profundo impacto en el desarrollo de los países europeos y el panorama económico mundial.
conquest_event_desc_85=La confrontación estratégica entre Estados Unidos y la Unión Soviética se caracterizó por una carrera armamentista masiva en la que ambas partes buscaban mantener una ventaja comparativa en armas nucleares y tecnología de misiles. Ambas partes dependían de la posesión de capacidades de armas nucleares a gran escala para disuadirse mutuamente de emprender acciones militares.
conquest_event_desc_86=En respuesta a la amenaza de los avanzados sistemas de defensa aérea soviéticos, Estados Unidos desarrolló con éxito el primer caza furtivo producido en masa del mundo, el F-117 Nighthawk.
conquest_event_desc_87=La Unión Soviética lanzó con éxito el primer misil balístico intercontinental (ICBM) del mundo, un lanzamiento que también marcó la primera vez en la historia de la humanidad que un objeto fabricado por el hombre se lanza con éxito al espacio. La aparición de los misiles balísticos intercontinentales revolucionó el panorama estratégico militar de la era de la Guerra Fría.
conquest_event_desc_88=Después de la Segunda Guerra Mundial, Vietnam del Sur, respaldado por Estados Unidos, y Vietnam del Norte, estuvieron en constante conflicto, lo que finalmente se convirtió en una guerra de guerrillas prolongada y a gran escala. La guerra también provocó desacuerdos sociales y un fuerte movimiento contra la guerra dentro de Estados Unidos.
conquest_event_desc_89=En 1970, China lanzó con éxito su primer satélite artificial, lo que marcó un logro importante en el campo de la ciencia y la tecnología de defensa nacional en la década de 1970. Al mismo tiempo, China se convirtió en el quinto país del mundo capaz de lanzar por sí solo un satélite artificial.
conquest_event_desc_90=China detonó con éxito su primera bomba atómica desarrollada de forma independiente, "Señorita Qiu", en 1964. Este logro convirtió a China en el quinto país del mundo en poseer armas nucleares y también tuvo un profundo impacto en la posición de China en la esfera política y de seguridad internacional.
conquest_event_desc_91=En 1967, se detonó con éxito la primera bomba de hidrógeno de China. Este fue otro paso adelante para China en el campo de la investigación de la defensa nacional, tras el éxito de la primera bomba atómica. Desde el desarrollo de la bomba atómica hasta la bomba de hidrógeno, China tardó sólo dos años y ocho meses, creando un milagro en la historia del desarrollo de armas nucleares.
conquest_event_desc_92=En 1984, Los Ángeles fue sede de los Juegos Olímpicos de forma cívica, revirtiendo las enormes pérdidas de Juegos anteriores. El éxito de estos Juegos Olímpicos en términos de inversión se convirtió en un modelo para futuros Juegos Olímpicos. China logró un gran avance en medallas de oro en estos Juegos Olímpicos.
conquest_event_desc_93=Una severa represión de las actividades a favor de la democracia por parte de los líderes militares de Corea del Sur desencadenó protestas a gran escala en el área de Gwangju, que resultaron en un gran número de muertos y heridos entre civiles y estudiantes. El incidente fue ampliamente publicitado a través de imágenes de vídeo tomadas por periodistas alemanes.
conquest_event_desc_94=En 1964, antes de la inauguración de los Juegos Olímpicos de Tokio, Japón inauguró oficialmente la línea Tokaido Shinkansen entre Tokio y Osaka, que se convirtió en el primer sistema ferroviario de alta velocidad operado comercialmente del mundo.
conquest_event_desc_95=En 1946, Estados Unidos desarrolló con éxito la primera computadora digital electrónica a gran escala del mundo: ENIAC. En las décadas transcurridas desde entonces, la tecnología informática se ha desarrollado a un ritmo sorprendente, con efectos de gran alcance en la ciencia, la industria y la vida cotidiana.
conquest_event_desc_96=Después de los dramáticos cambios en Europa del Este, el gobierno de Alemania Oriental, bajo presión interna y externa, anunció que abriría sus fronteras y permitiría que la gente cruzara libremente el Muro de Berlín. Este evento tuvo un profundo impacto en el panorama político de Europa e incluso del mundo.

