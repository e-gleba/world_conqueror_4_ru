event_intro_455=Esta batalla, también conocida como la conquista japonesa de Guam, ocurrió el 8 de diciembre de 1941, un día después del ataque a Pearl Harbor, cuando fuerzas japonesas vieron la oportunidad de atacar por sorpresa en Guam. Los defensores de la isla, sorprendidos con la guardia baja, fueron rápidamente sobrepasados y derrotados. El 10 de diciembre la guarnición de Guam se rindió y los japoneses obtuvieron el control de la isla.
event_intro_456=Para rescatar del cerco al 6.° Ejército en Stalingrado, el 12 de diciembre de 1942, el 4.° Ejército Panzer alemán lanzó un asalto a la ciudad. La ofensiva alemana agarró por sorpresa al Ejército Rojo y logró un progreso significativo en el primer día. Sin embargo, con la Operación Pequeño Saturno en marcha y fuertes medidas defensivas soviéticas alrededor de Stalingrado, los alemanes no pudieron avanzar más y tuvieron que abandonar sus esfuerzos por rescatar al 6.° Ejército.
event_intro_457=La Batalla de las Ardenas tuvo lugar del 16 de diciembre de 1944 al 25 de enero de 1945. Fue una gran ofensiva llevada a cabo por Alemania al final de la Segunda Guerra Mundial en la región belga de las Ardenas, cuyo objetivo era romper las líneas aliadas angloamericanas y recuperar Amberes. En las primeras etapas, las fuerzas alemanas lograron algunos éxitos, infligiendo grandes pérdidas a las tropas estadounidenses estacionadas allí. Sin embargo, debido a la falta de suministros, no pudieron avanzar más, lo que permitió que las tropas aliadas se estabilizaran y comenzaran su contraofensiva. Finalmente, las fuerzas alemanas sufrieron bajas significativas y los remanentes se retiraron a la Línea Sigfrido y al río Rin.
event_intro_458=El asedio de Bastoña, que se libró del 20 al 27 de diciembre de 1944, fue un conflicto crucial entre las fuerzas estadounidenses y alemanas en la pequeña ciudad de Bastoña, Bélgica, como parte de la Batalla de las Ardenas. Con siete carreteras principales que atravesaban las montañas de las Ardenas y convergían en la ciudad, las fuerzas alemanas tenían como objetivo asegurar la localidad para garantizar su paso seguro. Rodeando a los defensores estadounidenses estacionados allí, los alemanes intentaron capturar Bastoña. A pesar de estar rodeados, las tropas estadounidenses se mantuvieron firmes y mantuvieron el control de la ciudad. Finalmente, fueron relevados por unidades del Tercer Ejército de George Patton, lo que les permitió obtener una gran victoria.
event_intro_459=El 24 de diciembre de 1943, para liberar Ucrania y Moldavia, las fuerzas soviéticas lanzaron la ofensiva del Dniéper-Cárpatos. En esta batalla, los soviéticos recuperaron con éxito la mayor parte de Ucrania y toda Moldavia, aplastando al Grupo de Ejércitos Sur alemán y empujando las líneas del frente hacia el eje Polonia-Rumania.
event_intro_460=La batalla del Cabo Norte tuvo lugar el 26 de diciembre de 1943 frente a la costa del Cabo Norte de Noruega. En esta batalla, una fuerza naval alemana intentó localizar y atacar los convoyes aliados que transportaban suministros de guerra a la Unión Soviética. Sin embargo, debido a información filtrada, se encontraron con la Marina Real Británica, que estaba bien preparada, lo que provocó el hundimiento del acorazado alemán Scharnhorst. Después de esta batalla, Alemania ya no pudo desplegar grandes acorazados para hostigar las rutas marítimas de los aliados en el norte y se volvieron relativamente seguras hasta el final de la guerra.
event_intro_461=El 26 de diciembre de 1944, las fuerzas soviéticas completaron el cerco de Budapest y rápidamente comenzaron las negociaciones para la rendición de las guarniciones de la ciudad. El día 29, las negociaciones fracasaron y el enviado soviético fue asesinado por las fuerzas alemanas. Después de enterrar al enviado, las tropas soviéticas lanzaron su asalto. El asedio de Budapest había comenzado. Los soviéticos sitiaron la capital durante 50 días seguidos, agotando los recursos alemanes, en particular los de las Waffen-SS, y finalmente capturaron la ciudad y acercaron el Frente Oriental a Berlín.
event_intro_462=Debido a que la ofensiva de las Ardenas atrajo a un gran número de fuerzas aliadas hacia el norte, los alemanes planearon un asalto a la débilmente defendida región de Alsacia para debilitar al enemigo. El 1 de enero de 1945, los alemanes lanzaron una ofensiva hacia Estrasburgo. A pesar de que los aliados se retiraron bajo presión, finalmente lograron mantener la ciudad. Una vez finalizada la ofensiva, los alemanes ocuparon aproximadamente el 40% de Alsacia, acortando el Frente Occidental pero sin lograr su objetivo de debilitar la fuerza de los aliados.
event_intro_463=En diciembre de 1941, los japoneses lanzaron una ofensiva sobre Luzón. Debido a las deficientes defensas iniciales, los japoneses lograron abrir una brecha en las líneas costeras, obligando a las guarniciones estadounidenses y filipinas a retirarse a la península de Bataan para una última defensa. El 7 de enero de 1942, los japoneses comenzaron su asalto a Bataan. A falta de suministros, los defensores se replegaron gradualmente y el comandante supremo, MacArthur, evacuó las Filipinas. Después de tres meses de firme resistencia, el 9 de abril de 1942, los defensores restantes se rindieron ante los japoneses, lo que marcó el final de la batalla de Bataan.
event_intro_464=Tras la batalla del golfo de Leyte, la presencia militar japonesa en las Filipinas sufrió graves pérdidas. Aprovechando su superioridad aérea y marítima, los aliados planearon retomar Luzón. El 9 de enero de 1945, las fuerzas de desembarco aliadas, escoltadas por la marina, desembarcaron en el golfo de Lingayén y despejaron las defensas costeras, avanzando hacia Manila. El 3 de marzo, Manila fue liberada y las fuerzas japonesas restantes se retiraron a las montañas para continuar con su resistencia. El 15 de agosto, Japón anunció su rendición incondicional y las tropas japonesas restantes en Luzón aceptaron gradualmente la orden de alto el fuego, lo que puso fin a la batalla de Luzón.
event_intro_465=El 14 de enero de 1944, las fuerzas soviéticas reunieron en el Frente de Leningrado, al 2.º Frente Báltico y el Frente Voljov, para lanzar la ofensiva Leningrado-Nóvgorod. Unas dos semanas después, el Ejército Rojo recuperó el control del ferrocarril Moscú-Leningrado. El 26 de enero de 1944, los alemanes fueron expulsados de la región de Leningrado, levantando el asedio. Las fuerzas soviéticas continuaron su persecución hasta el 1 de marzo, empujando la línea del frente hasta el río Luga.
event_intro_466=Después de que los aliados desembarcaran en Italia en septiembre de 1943, los alemanes establecieron la "Línea de Invierno" para impedir el avance aliado. Para continuar su avance y liberar Roma, el 17 de enero de 1944, los aliados lanzaron un ataque contra el núcleo de la "Línea Gustav". El monasterio de Montecassino se convirtió en el punto focal de la batalla debido a su posición estratégica, que permitía a los alemanes controlar el área circundante. Los aliados hicieron múltiples intentos de capturar el monasterio, pero se enfrentaron a una feroz resistencia. Finalmente, los aliados obtuvieron el control del área, logrando la victoria a un alto costo y bajas.
event_intro_467=Para eliminar la bolsa de Colmar, los aliados lanzaron un ataque desde los lados norte y sur del saliente el 20 de enero de 1945, logrando rodear y causar graves daños al 19.° Ejército alemán, además de liberar Colmar.
event_intro_468=La ofensiva de Korsun-Cherkasy fue parte de la ofensiva del Dniéper-Cárpatos. A principios de enero de 1944, los frentes ucranianos 1.º y 2.º rodearon el saliente alemán al noreste de Cherkasy tanto por el norte como por el sur. Para aniquilar las seis divisiones alemanas en el saliente, los soviéticos lanzaron un ataque desde ambos lados el 24 de enero; el 28, los dos frentes se encontraron, formando un cerco. Los alemanes intentaron rápidamente escapar, pero sufrieron grandes bajas en oficiales y en todas las armas de fuego pesadas.
event_intro_469=Al final de la Primera Guerra Mundial, Finlandia buscó la independencia, lo que llevó a la formación de dos facciones políticas: "Finlandia Blanca" y "Finlandia Roja". Ambos bandos aspiraban a la independencia finlandesa, pero las diferencias ideológicas intensificaron los conflictos. El 27 de enero de 1918, comenzaron las hostilidades cuando la Finlandia Roja movilizó a los trabajadores y ocupó casi todas las ciudades y centros industriales del sur, mientras que la Finlandia Blanca se retiró a las zonas rurales del norte. Sin embargo, debido a la falta de entrenamiento militar, la Finlandia Roja finalmente fue derrotada por la Finlandia Blanca, que recibió ayuda militar de Alemania.
event_intro_470=El 1 de febrero de 1942, la Armada de los Estados Unidos llevó a cabo ataques aéreos y bombardeos contra las guarniciones de la Armada Imperial Japonesa en las islas Marshall y Gilbert, causando daños leves a moderados a las tropas japonesas estacionadas allí. Aunque esta batalla tuvo poco impacto en el Frente del Pacífico en general, aumentó significativamente la moral de la Armada de los Estados Unidos y del público después del ataque a Pearl Harbor y la caída de la isla Wake.
event_intro_471=En enero de 1944, las fuerzas soviéticas avanzaron hasta la línea del río Narva. Para penetrar en Estonia y asegurarse una base para atacar Finlandia y Prusia Oriental, los soviéticos lanzaron una serie de ataques sobre el istmo de Narva, conocidos como la Batalla de Narva. Esta batalla duró del 2 de febrero al 10 de agosto de 1944. Inicialmente, los alemanes contraatacaron ferozmente, frenando el avance soviético. No fue hasta julio, en coordinación con la ofensiva de Leópolis-Sandomierz, que los soviéticos capturaron Narva. Los alemanes se retiraron a la Línea Tannenberg, donde una vez más frenaron los avances soviéticos.


dialogue_3201=Los alemanes están a punto de abrir un corredor en dirección a la costa. Ahora debemos preparar nuestra retirada.
dialogue_3202=Las fuerzas amigas deben retirarse hacia el Canal. Mis tanques harán todo lo posible para frenar el ataque alemán.
dialogue_3203=¡Mantengan sus posiciones! La RAF seguirá brindando cobertura aérea durante la retirada.
dialogue_3204=¡La guerra de posiciones ya no es apropiada para estos tiempos! Avancen a toda velocidad. Dejen los prisioneros a las fuerzas amigas que están atrás.
dialogue_3205=Cómo… la escala de este ataque aéreo no es ni de lejos suficiente para detener la ofensiva terrestre alemana. ¿De dónde surgió semejante fracaso?
dialogue_3206=Mis legiones ya no pueden seguir luchando. Dejen todo a mano y retrocedan a toda velocidad.
dialogue_3207=Nuestro ejército ha fracasado, pero los resultados de la investigación no deben caer en manos de los alemanes.
dialogue_3208=Se ha abierto el corredor hacia el Canal. Mantengan la línea de batalla y eliminen del cerco a las principales fuerzas británicas y francesas.
dialogue_3209=¿Tú eres Osborn? Yo soy Benteke. Me han ordenado que te proteja durante la evacuación.
dialogue_3210=Pero las órdenes que recibí fueron las de aguantar hasta que la fuerza principal se retirase con éxito. Incluso si la situación es crítica, no puedo abandonar la posición sin autorización.
dialogue_3211=Tu destino es mucho más que eso, tu viaje acaba de comenzar y te esperan innumerables posibilidades en el futuro. Pero si insistes, respetaré tu decisión. La elección es tuya.
dialogue_3212=Lille también está perdida. Los alemanes están empezando a acelerar la contracción del cerco. Alfred, tenemos que retirarnos.
dialogue_3213=No lo olvides, somos mercenarios. Completa la misión y regresa con vida: ese es nuestro único objetivo.
dialogue_3214=Confía en las decisiones que toma.
dialogue_3215=Los alemanes mantuvieron a los hombres capturados en varias prisiones improvisadas y Osborn debe haber estado entre ellos.
dialogue_3216=¿Por qué tardaste tanto? Unos días más y realmente hubiera considerado unirme a la Wehrmacht.
dialogue_3217=¿Quién demonios eres? ¿Por qué estás aquí? ¡Pero eso no nos importa ahora! La fuerza principal del enemigo ha atacado por el sur. ¡Esta es nuestra única oportunidad de rescatarlos!
dialogue_3218=¿Cómo te atreves a intentar escapar? ¡Ningún prisionero puede escapar de la prisión Drittes Reich! ¿Por qué no acabamos contigo aquí, en caso de que haya otras oportunidades para que huyas? ¡Quizás aún pueda volver al frente para unirme a la guerra!
dialogue_3219=El rescate salió muy bien, pero luego llegó la parte difícil: dirigirse hacia el sur a través de la línea hasta España, desde donde se puede llegar a Inglaterra en barco.
dialogue_3220=Parece que tendremos que separarnos. Todavía queda una parte de la fuerza expedicionaria atrapada y amenazada en El Havre y debo llegar allí lo antes posible para unirme a ellos.
dialogue_3221=Quizás tengas otra opción: retirarte por el sur, se abrirá una brecha en dirección a Metz y podrás unirte al general De Gaulle, que resiste allí.
dialogue_3222=Estamos en proceso de negociaciones con los alemanes sobre cuestiones relacionadas con el Acuerdo de Armisticio. Todas las unidades están preparadas y a la espera de nuevas instrucciones.
dialogue_3223=Francia perdió. Fue derrotada por los grupos blindados alemanes, por los buenos comandantes y por la velocidad del ataque. ¡Las fuerzas blindadas que pueden determinar la dirección del campo de batalla frontal son el futuro de la guerra!
dialogue_3224=La combinación de tecnología militar avanzada y capacidad de producción estable y suficiente es la dirección del poder militar. ¡Hay esperanza!
dialogue_3225=El gobierno de Pétain ha abandonado al pueblo francés. ¡Lucharé por Francia hasta el final!
dialogue_3226=Una vez más, hemos dividido a las tropas francesas. Las puertas de París están abiertas de par en par y la victoria está al alcance de la mano.
dialogue_3227=Confíe en él, pero actúen con rapidez. Los alemanes no les han dejado mucho tiempo antes de que los franceses logren evacuar a salvo.
dialogue_3228=El equipo estadounidense para las tropas de primera línea ha llegado sin incidentes. No hace falta que me des las gracias. Estaré esperando tu último informe en la retaguardia.
dialogue_3229=¡Han llegado nuestros refuerzos! Pero los alemanes han atravesado la línea de defensa en El Alamein y las unidades blindadas que se encuentran allí corren el peligro de verse rodeadas en cualquier momento.
dialogue_3230=Alfred, me impresionó tu valor en Francia. Pero luchar en tierra no es como luchar en el aire, y esta arenilla en relieve suavizará tus bordes y consumirá tu agudeza. ¡Déjame ver si puedes adaptarte a la brutalidad de aquí!
dialogue_3231=La magnitud del ataque enemigo superó las expectativas. Reajustamos nuestra estrategia de defensa y priorizamos la desactivación del ataque enemigo. Pronto llegarán más refuerzos.
dialogue_3232=Hemos perdido El Alamein. ¿Cómo puede el enemigo tener tantas unidades blindadas y navales? Estamos a punto de ser rodeados.
dialogue_3233=No sabía que podías comandar una armada naval. Lleve la flota de regreso al puerto de Alejandría. Pronto llegarán los refuerzos.
dialogue_3234=La ofensiva no avanza con la suficiente rapidez. No olvidemos que sólo tenemos una oportunidad. Debemos capturar, junto con el ataque italiano, El Cairo y desmoralizar a los aliados.
dialogue_3235=Apunten a El Cairo y corten el suministro de tropas a los soldados aliados.
dialogue_3236=Estas tropas son todo lo que tenemos. Como la ofensiva ha fracasado, solo nos queda una opción: ¡retirarada!
dialogue_3237=La espada ha sido desenvainada. Mis hombres atacarán antes de que el enemigo pueda reaccionar.
dialogue_3238=Haré todo lo que esté a mi alcance para expulsar a Rommel de África.
dialogue_3239=Los dos cascos de nuevo diseño han conseguido mejorar las deficiencias del prototipo, permitiéndole aprovechar al máximo la potencia del cañón incluso en el duro entorno del campo de batalla del norte de África.
dialogue_3240=Las unidades aerotransportadas han llegado a las posiciones designadas. Lancen un ataque de inmediato para interrumpir el despliegue defensivo del enemigo detrás de las defensas marítimas.
dialogue_3241=¡Desembarquen ya! Colaboren con las fuerzas aerotransportadas para localizar y desintegrar a las fuerzas enemigas en sus posiciones.
dialogue_3242=La Playa Dorada está débilmente defendida y mi posición es relativamente favorable. Pueden cooperar plenamente conmigo para despejar rápidamente una posición de cabeza de playa.
dialogue_3243=La fuerza de desembarco se ha afianzado y ahora lanza un ataque contra Caen.
dialogue_3244=¡Es Rommel y sus unidades blindadas otra vez! Soy un experto en armamento de carros, ¿cómo es posible que todas estas duras batallas me afecten?
dialogue_3245=A nadie le importa la identidad de los demás en el campo de batalla. Puedes quedarte aquí, pero no te interpongas en nuestro ataque.
dialogue_3246=Somos una sólida barrera en la línea. No se debe permitir que los aliados pasen por aquí. Lucharé hasta la muerte.
dialogue_3247=Un gran número de tropas aliadas han desembarcado en Normandía y es necesario organizar una contraofensiva para frenar el avance del enemigo.
dialogue_3248=¡Mis unidades de artillería detendrán el ataque aliado!
dialogue_3249=A veces realmente siento que soy el protagonista de estas batallas y que debería aparecer en carteles y portadas de folletos.
dialogue_3250=Los aliados no están preparados para nuestro ataque. Aprovechen esta oportunidad para cortar el vínculo entre las fuerzas principales británicas y estadounidenses.
dialogue_3251=No podemos hacer nada con las armas que tenemos a mano. Me temo que las fuerzas amigas que están rodeadas se encuentran en una situación delicada.
dialogue_3252=¡Aceleren el apoyo! ¿Podemos simplemente ver Bastoña caer?
dialogue_3253=Ahora hay dos opciones para elegir: atacar directamente la retaguardia alemana y cortar el suministro de tropas al enemigo o bloquear el ataque principal alemán desde el frente y esperar a que lleguen los refuerzos estadounidenses.
dialogue_3254=¡Estoy aquí para ayudarte! Los refuerzos llegarán tarde, pero nunca faltarán.
dialogue_3255=¡El general Patton ya movilizó hace tiempo sus fuerzas y lanzó un contraataque tan pronto como llegó el cuerpo principal de refuerzos!
dialogue_3256=Cree en tus compañeros. Y, lo que es más importante, cree en ti mismo. ¡Actúa!
dialogue_3257=Nunca dudo de mi criterio. La situación está a punto de cambiar y nuestra ventaja está a la vuelta de la esquina.
dialogue_3258=Los británicos lanzaron un ataque sorpresa a nuestra retaguardia, una vez cortada la retirada, las consecuencias serán inimaginables.
dialogue_3259=Regresen a la Línea Sigfrido y reorganicen las defensas antes de que los aliados lancen la próxima ola de ataques.
dialogue_3260=Estuvimos a un paso de la victoria, pero al final todo fue en vano. Retirada.
dialogue_3261=La toma de Bastoña ha supuesto un duro golpe para la moral de los aliados, pero no disponemos de más tropas para sostener una ofensiva de tal calibre.
dialogue_3262=Bastoña cayó. Osborn, quien se había apresurado a prestar su apoyo, quedó atrapado por los blindados alemanes.
dialogue_3263=Ahora no es el momento de analizar la batalla, nuestra oportunidad es fugaz.
dialogue_3264=¡Los soviéticos han vuelto a la carga y se han apoderado de la mitad del Golfo de México! El ejército terrestre también ha cruzado la frontera entre Estados Unidos y México. La situación es desesperada.
dialogue_3265=Siempre hemos tenido una estrecha colaboración con el ejército de los Estados Unidos y esta forma de proceder es absolutamente infalible. También los elegimos porque hemos luchado codo con codo en el frente occidental.
dialogue_3266=Escuché que esta vez también se proporcionaron muchos nuevos tipos de equipos y combatientes especiales.
dialogue_3267=Sus palabras sólo se pueden creer a medias. Esta vez no se trata de una operación encubierta. Esos astutos tipos de Estados Unidos no merecen mi confianza, pero en ti, Lucas, confío plenamente.
dialogue_3268=Hemos llegado al lugar previsto. Objetivo: destruir las bases de misiles y las fábricas nucleares soviéticas. ¡Es hora de que se hagan valer!
dialogue_3269=Nadie se atreve a desafiarme en los cielos.
dialogue_3270=Por supuesto, también tenemos uno para ti.
dialogue_3271=Esperen, parece que hay algún tipo de instalación en las montañas que no parece una base militar soviética.
dialogue_3272=Parece que hay una figura ahí. ¡Presten atención! A juzgar por las huellas que han dejado, el nivel tecnológico de esta gente ha superado con creces el nuestro.
dialogue_3273=¿Qué está pasando? ¿Por qué las tropas en primera línea disparan contra fuerzas amigas?
dialogue_3274=Es como si las tropas soviéticas estuvieran bajo control. Algunos de ellos incluso nos dieron el control del equipamiento de sus tropas.
dialogue_3275=Alfred, no puedo quedarme aquí mucho más tiempo. Utiliza este carro y continúa hacia el sur. Necesitamos tu ayuda.
dialogue_3276=Maldita sea, ¿qué acaba de pasar? ¡Las comunicaciones se cortaron de repente! Alfred, ¿chicos están bien?
dialogue_3277=Parece que tendremos que hacer un viaje a Sudamérica. He oído que la situación allí es bastante complicada y que podría estallar una guerra en cualquier momento.
dialogue_3278=Había una crisis más grave que afrontar en ese momento. Continúen con el plan de batalla antes de que los soviéticos puedan reaccionar.
dialogue_3279=Entre las tropas británicas se han encontrado extraños vehículos blindados de combate. Ya habíamos visto armas similares antes y ahora el problema se ha complicado.
dialogue_3280=Déjalo. Tu plan no funcionará. Lanzar un ataque en un campo de batalla frontal solo permitirá que otras fuerzas obtengan los beneficios.
dialogue_3281=Me acabo de evacuar de la base. Este lugar está ahora en tus manos.
dialogue_3282=Los soviéticos llevan mucho tiempo intentando llegar a Sudamérica. Ahora que han lanzado un ataque total, debemos adelantarnos a la situación antes de que se vuelva irreversible.
dialogue_3283=El ejército estadounidense depende de sus numerosas bases militares en el extranjero para movilizar grandes cantidades de tropas en un corto período de tiempo y, por la fuerza de las armas, amenaza a los regímenes locales.
dialogue_3284=Mire el mundo, la guerra nunca cambia. Sólo los más fuertes tienen voz y los demás se ven obligados a tomar partido.
dialogue_3285=Se han localizado tres coordenadas específicas. Se han avistado tropas soviéticas en las inmediaciones de la más cercana y parece que están intentando capturarla por la fuerza.
dialogue_3286=Ahora que están aquí, no hay vuelta atrás. Aseguren la base en Sudamérica y comenzaremos de nuevo aquí.
dialogue_3287=Alfred, no te invitamos aquí. Independientemente de cómo te hayan contactado estas personas, ya estás incluido entre ellas.
dialogue_3288=El enemigo tiene armas avanzadas que pueden incluso alterar la mente de las personas. Si no pueden utilizarse en nuestro beneficio, deben ser destruidas por completo a la primera oportunidad.
dialogue_3289=Nos vengaremos. Osborn, al final no tendrás adónde huir.
dialogue_3290=Conocía el final desde el principio y hacía tiempo que había elegido el camino que seguramente tomaría. La pregunta es: ¿qué hay de ti?
dialogue_3291=Siempre he sido leal sólo a mí mismo y a mis hermanos. Y Osborn, tú has sido nuestro hermano desde mucho antes.
dialogue_3292=Tal vez no exista el control mental. Tal vez sea que hemos visto el status quo durante mucho tiempo y hemos querido hacer cambios durante mucho tiempo.
dialogue_3293=Todavía tienes tu dispositivo inhibidor de señal, ¿verdad? Confío en mi criterio sobre ti. Muchos amigos son mejores que muchos enemigos.
dialogue_3294=¡Vamos, que empiece el espectáculo!
dialogue_3295=Tal vez puedas ganar en Sudamérica, pero recuerda que te estamos siguiendo.
dialogue_3296=Lucas, esta es toda la élite que tenemos. Ya sabes qué hacer.
dialogue_3297=Estas tropas se están agrupando en torno a sus fuertes. Ninguno de nosotros saldrá bien parado si seguimos así.
dialogue_3298=En este momento, el enemigo de mi enemigo es mi amigo. Me temo que la única manera de contener a esta gente es tener una tregua temporal con los soviéticos.
dialogue_3299=Nadie puede detenerme. Ni el ejército estadounidense, ni el soviético, ni nadie. ¡Jamás permitiré que se repita la derrota del Reich!
dialogue_3300=Nuestros guerreros han estado al acecho durante mucho tiempo, impulsando de forma encubierta diversas operaciones militares para cambiar el panorama del nuevo mundo.
dialogue_3301=No podemos resistir el ataque del enemigo. ¡El Cairo está perdido y la línea de abastecimiento corre el riesgo de quedar cortada!
dialogue_3302=La línea defensiva ya no puede mantenerse. Ahora que las aeronaves han sido reabastecidas de combustible, continuaré cumpliendo mi misión como miembro de la Fuerza Aérea.
dialogue_3303=Todas las aeronaves, retírense a Gran Bretaña para reabastecimiento. Necesitamos más cobertura aérea para las evacuaciones futuras.

promotable_generals=Los siguientes comandantes pueden usar este objeto para entrenamiento

