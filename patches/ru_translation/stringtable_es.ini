eventgeneral_rule=Reglas de las pruebas de generales
eventgeneral_rule_1=1. La campaña del evento está abierta por tiempo limitado. Se sugiere a los comandantes programar el tiempo de manera razonable para obtener recompensas al pasar etapas.
eventgeneral_rule_2=2. Este evento es la versión Difícil del Modo Biografías de General, aunque no es necesario completar las Biografías de General para desafiar este modo
eventgeneral_rule_3=3. Las tropas enemigas tendrán dos ventajas (2 de manera aleatoria desde el comienzo hasta el final de la Conquista), así que planifique cuidadosamente su ruta de marcha cuando desafíe la Conquista, comandante.
eventgeneral_rule_4=4. La mayor cantidad de estrellas se registrará después de ganar el nivel y se puede acumular una cierta cantidad de estrellas para recibir recompensas de etapa.
eventgeneral_rule_5=5. Las recompensas por etapas se dividen en dos tipos, recompensas de cinta y fragmentos de Fuerza de Élite. Quienes reclamen las recompensas recibirán una cierta cantidad de ello.

challenge_rule=Reglas del Evento de Desafío
challenge_rule_1=1. Los niveles de desafío de este evento están abiertos por tiempo limitado, así que, comandantes, organicen su tiempo de manera razonable para pasar el nivel y obtener las recompensas.
challenge_rule_2=2. Los niveles del desafío del evento se dividen en dificultad Normal y Difícil. Para jugar el modo Difícil, primero debe completar la dificultad Normal.
challenge_rule_3=3. En los niveles de desafío de dificultad Difícil, las tropas enemigas obtendrán 2 beneficios (2 de manera aleatoria desde el inicio de la Conquista hasta el final).
challenge_rule_4=4. Los desafíos de eventos están divididos en 4 tipos: asistir a los aliados, aniquilar las fuerzas enemigas, acumular Suministros y mantener la posición. Cada Conquista abrirá un tipo de nivel de desafío.
challenge_rule_5=5. Puedes recibir recompensas de etapa por superar los niveles designados. Las recompensas de etapa están corregidas.
challenge_rule_6=6. No está permitido construir ningún tipo de defensa en los niveles del desafío de evento.

