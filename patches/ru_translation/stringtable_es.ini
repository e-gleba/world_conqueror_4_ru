help_conquest_desc_6=Durante el desafío conquista, los comandantes pueden mejorar la tecnología del país que comandan. Se debe alcanzar el nivel de tecnología correspondiente para desbloquear la tecnología nacional correspondiente y existen algunas diferencias en el nivel de tecnología inicial y el límite superior de cada país.
help_conquest_desc_7=El desafío conquista incluye un modo de diplomacia. Los comandantes pueden declarar la guerra a países del mismo bando o a países neutrales y también pueden hacer que algunos países hostiles se rindan. La comparación del número de ciudades y tropas existentes y el número inicial de ciudades y tropas afectará la lealtad del país. La combinación del número de ciudades, tropas y lealtad del país objetivo afectará la tasa de éxito de la inducción a la rendición. Los comandantes pueden hacer que el país objetivo se rinda después de que compartan frontera por 20 turnos.
help_conquest_desc_8=En desafío conquista, los comandantes se encontrarán con varios eventos históricos que pueden tener efectos positivos o negativos en ciertas naciones.

