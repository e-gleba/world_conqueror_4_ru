event_stage_intro_20716=Nuestras líneas de suministro están al límite. Las fuerzas navales y aéreas enemigas en el Mediterráneo suponen una amenaza importante. Las fuerzas aliadas, lideradas por los británicos, reciben refuerzos continuamente a través del Mar Rojo y el Canal de Suez. La situación es desesperada, pero ésta será nuestra última batalla en el norte de África, un momento decisivo que determinará nuestro destino.
event_stage_intro_20717=Las fuerzas aliadas se han reagrupado en Marruecos y Argelia. Las fuerzas estadounidenses están acelerando su avance por tierra, mientras que la marina británica está reuniendo toda su fuerza en el Golfo de Túnez, donde las fuerzas locales de la Francia de Vichy pueden haber establecido contacto con los aliados. La crisis se avecina, pero resistiremos en Túnez hasta el último momento con las fuerzas que nos quedan, a la espera de la llegada de las fuerzas principales de Rommel.

dialogue_2944=Se están reuniendo refuerzos británicos. ¡Avancen rápidamente hacia Marsa Matruh! Eviten detenerse demasiado.
dialogue_2945=El ejército italiano nos supera en número. Informen a las tropas del frente que deben luchar y retirarse. Concéntrense en lanzar un contraataque cuando lleguen los refuerzos.
dialogue_2946=El ataque frontal está bloqueado y nuestros suministros no pueden sostener una ofensiva de esta magnitud. A todas las unidades, prioricen mantener la línea y no permitan que los británicos avancen.
dialogue_2947=Necesito más apoyo para contener al ejército italiano.
dialogue_2948=Los refuerzos están llegando en pequeños grupos. Mi flota se ocupará de la amenaza en el mar.
dialogue_2949=La fuerza principal ha llegado con éxito a Libia. Avanzaremos hacia el este lo más rápido que podamos para despejar la zona de Cirenaica de tropas británicas.
dialogue_2950=Nuestros refuerzos aún no han llegado. Ahora sólo podemos hacer lo posible para detener al enemigo y, si es necesario, abandonar nuestras posiciones y retirarnos hacia el este.
dialogue_2951=La punta de lanza del ataque alemán está a punto de llegar a Bengasi. Retírense ahora a Tobruk, donde nuestros defensores construirán una sólida línea de defensa.
dialogue_2952=El ataque se desarrolla sin problemas y mis tropas continuarán hacia Badia. La fuerza principal del ejército británico quedará en tus manos.
dialogue_2953=Los paracaidistas llegaron a las posiciones previstas dentro del perímetro y rápidamente capturarán la ciudad fortaleza del enemigo, eliminando a los defensores de Creta antes de que lleguen los refuerzos británicos
dialogue_2954=Las fuerzas británicas se están concentrando en las aguas al sur de Creta. Mi flota atacará de inmediato los puntos de concentración del enemigo en la costa sur para detener su retirada.
dialogue_2955=Los paracaidistas alemanes han aterrizado en la isla. Mantengan las posiciones e instalaciones en toda la isla; pronto llegarán refuerzos navales.
dialogue_2956=Los defensores lucharon hasta el final, pero ya no quedaban tropas para defender Creta de los alemanes.
dialogue_2957=Mi flota no puede resistir los ataques de los alemanes en el mar. Me temo que la única opción que queda ahora es retirarme.
dialogue_2958=El contraataque británico fue feroz, pero el enemigo no reunió una gran fuerza para atacar en un punto.
dialogue_2959=Los británicos están intentando rodear nuestras unidades blindadas. Retírense primero a la línea de defensa para reabastecerse y estén preparados para un contraataque.
dialogue_2960=Los británicos aún tienen un número considerable de unidades blindadas y puede que no sea fácil romper la línea en la parte sur de Sollum.
dialogue_2961=Reúnanse hacia Sollum para restablecer una línea de defensa para detener el avance alemán hacia el este.
dialogue_2962=Nuestra ofensiva ha sido un completo fracaso. Ahora debemos concentrar las fuerzas que nos quedan en derrotar a la vanguardia alemana y retomar Sollum.
dialogue_2963=El ejército británico ya ha aprovechado el terreno y ha instalado fuertes defensas en los distintos pasos. Sería costoso abrirse paso desde el frente.
dialogue_2964=Mis fuerzas blindadas lanzarán un ataque desde el sur de Tobruk, dividiendo la defensa aliada.
dialogue_2965=El enemigo tiene una gran fuerza blindada. No tendremos ninguna posibilidad de ganarles de frente. Retírense a las posiciones de retaguardia y defiéndanse con fortalezas y campos minados.
dialogue_2966=Los alemanes han penetrado en nuestro interior, debemos apoyar inmediatamente a Tobruk y fortificar nuestras defensas.
dialogue_2967=Se ha calculado de forma errónea el tamaño del ejército alemán, pero incluso si las fuerzas disponibles no son suficientes para defender toda la zona, no podemos abandonar Tobruk sin más.
dialogue_2968=El enemigo está al borde del abismo. Seguimos enviando refuerzos a la zona de El Alamein, donde tendremos una lucha decisiva con los alemanes.
dialogue_2969=Mis fuerzas atacarán el corazón de Egipto desde el sur de El-Alamein.
dialogue_2970=El contraataque va muy bien. Hemos atravesado las posiciones italianas, así que seguiremos atacando.
dialogue_2971=El enemigo se acerca al Canal de Suez. Necesitamos más tropas para mantener la línea al norte de El Cairo.
dialogue_2972=Los británicos aún tienen varias fortalezas y bastiones alrededor de El Cairo. Continúen avanzando hacia el este y tengan cuidado con los refuerzos enemigos.
dialogue_2973=¡Bloqueen el Canal de Suez y no permitan que la flota enemiga navegue hacia el Golfo de Suez!
dialogue_2974=Los aliados, utilizando su superioridad naval y aérea en el Mediterráneo, interfieren constantemente en nuestras líneas de suministro y movimientos de tropas.
dialogue_2975=Me temo que no es realista intentar derrotar por completo a los aliados sin suficientes refuerzos y la retirada sería extremadamente difícil. Mis unidades blindadas harán todo lo posible para mantener Túnez.
dialogue_2976=Hicimos un trato con los aliados hace mucho tiempo. Soldados, luchen por Francia.
dialogue_2977=Avancen a toda velocidad. Rompan las líneas enemigas y restablezcan el contacto con los defensores tunecinos.
dialogue_2978=Una vez que la principal fuerza alemana logre regresar al rescate, las consecuencias serán inimaginables. Estamos en una carrera contra el tiempo, así que sigamos con nuestro ataque a Túnez.
dialogue_2979=Las fuerzas aliadas son demasiado grandes y no tenemos vuelta atrás.
dialogue_2980=Eliminen a todos los enemigos en Túnez, nuestro contraataque está a punto de comenzar.

event_106=Batalla de Stalingrado
event_intro_106=En 1941, Alemania lanzó la Operación Barbarroja, que arrasó los vastos territorios de la Unión Soviética. El Ejército Rojo luchó por sobrevivir en una serie de retiradas mientras su patria era destruida y sus tierras ocupadas. En 1942, las fuerzas alemanas se acercaban como una oscura marea de acero que avanzaba hacia el corazón de la Unión Soviética. Stalingrado, que se alzaba en las orillas del río Volga, se convirtió en la línea de defensa más importante para la existencia misma de la nación. Para la Unión Soviética, esta batalla no se trataba solo de defender una ciudad, sino también de salvaguardar su destino y su dignidad. Todo el país era como una cuerda tensa, esperando el destino que estaba a punto de revelarse en la decisiva batalla de Stalingrado.

