general_stage_intro_101=En septiembre de 1939, Guderian, al mando de la 19° Cuerpo Panzer alemán, inició una Guerra Relámpago contra Polonia. Mientras la Unión Soviética atacaba desde el este, formando una fuerza de pinza con los alemanes y Polonia pronto cayó. Esta batalla marcó el inicio de la Segunda Guerra Mundial.
general_stage_intro_102=En mayo de 1940, Guderian continuó al mando de la 19° Cuerpo Panzer  y lanzó una Guerra Relámpago contra Francia. Los alemanes avanzaron a través del bosque de las Ardenas, evitando la Línea Maginot y se adentraron en toda Francia a un ritmo asombroso.
general_stage_intro_103=En septiembre de 1941, el ejército alemán inició un asedio de 900 días a la ciudad de Leningrado, en el norte de la Unión Soviética, durante el cual la ciudad sufrió severos bombardeos y escasez de alimentos. La batalla fue el asedio más largo de la historia moderna.
general_stage_intro_104=Esta fue la batalla de tanques más grande de la Segunda Guerra Mundial y un importante punto de inflexión en el Frente Oriental. Guderian comanda el 2.º Grupo de Ejércitos Blindados en la ofensiva, donde aguarda una línea soviética fuertemente custodiada.
general_stage_intro_105=La batalla tuvo lugar en octubre de 1944. Las fuerzas soviéticas sitiaron Budapest, capital de Hungría, en un esfuerzo por retomar el control del país. ¿Cómo escaparían los alemanes bajo la supresión del intenso fuego de artillería soviético?
general_stage_intro_111=Túnez es el último bastión alemán en el frente del norte de África. En noviembre de 1942, las fuerzas Aliadas, principalmente británicas y americanas, atacaron desde el este y oeste, derrotando a los alemanes y apoderándose de Túnez. Esto puso fin a la campaña en el norte de África.
general_stage_intro_112=En julio de 1943, los Aliados emprendieron una operación de desembarco masivo en Sicilia para derrocar al régimen de dictadura Italiana. La batalla fue una victoria importante para los Aliados en el frente europeo y sentó las bases para el posterior ataque a la Italia continental.
general_stage_intro_113=En junio de 1944, los Aliados llevaron a cabo una operación de desembarco de una magnitud sin precedentes en Normandía para abrir el frente occidental y liberar Francia. Esta operación de desembarco representó una gran amenaza para la posición estratégica de Alemania en el frente occidental y marcó el comienzo de la campaña de contraofensiva de los Aliados en Europa.
general_stage_intro_114=Esta fue la batalla más grande librada entre fuerzas terrestres en la Guerra del Pacífico y terminó con una aplastante derrota para el ejército japonés.
general_stage_intro_115=En diciembre de 1944, los Aliados lucharon ferozmente contra los alemanes en la Batalla de las Ardenas. Los alemanes atentaron con lanzar una ofensiva de invierno pero fue resistida por los Aliados.
general_stage_intro_121=En octubre de 1941, cuando el ejército alemán intentó ocupar Moscú, Zhukov fue nombrado comandante en jefe. El Ejército Rojo, con su dura defensa y tenaces contraataques, finalmente rechazó el ataque alemán y defendió Moscú.
general_stage_intro_122=La batalla comenzó en agosto de 1942 y finalizó en febrero del año siguiente. Fue la batalla más grande y mortífera de la Segunda Guerra Mundial, con más de dos millones de muertos en ambos bandos. Zhukov se desempeñó como Jefe del Estado Mayor del Ejército Rojo soviético durante la campaña, ayudando en la defensa y la contraofensiva.
general_stage_intro_123=En julio de 1943, cuando el ejército alemán lanzó su última gran ofensiva, Zhukov sirvió como Jefe del Estado Mayor en la Batalla de Kursk. Ordenó al Ejército Rojo que contraatacara e hizo que el ejército alemán sufriera grandes pérdidas. Después de esta batalla, Alemania perdió por completo su iniciativa.
general_stage_intro_124=Esta fue una ofensiva estratégica a gran escala, iniciada por la Unión Soviética, que comenzó en junio de 1944 para liberar partes de la región de Bielorrusia y Polonia. Finalmente, la Unión Soviética consiguió lo que deseaba y recuperó la mayor parte de sus territorios occidentales.
general_stage_intro_125=La Batalla de Berlín, que comenzó en abril de 1945, fue el final de la Segunda Guerra Mundial en el teatro europeo. Zhukov, como Comandante en Jefe del Primer Frente Bielorruso del Ejército Rojo, ordenó a las fuerzas soviéticas tomar la capital alemana, Berlín. Obligando a la Alemania nazi a rendirse.
general_stage_intro_131=En abril de 1941, las fuerzas de Rommel sitiaron la coalición anglo-australiana en el fuerte de Tobruk, donde encontraron una feroz resistencia. Los británicos lanzaron varias ofensivas infructuosas para liberar a las fuerzas Aliadas atrapadas. Entonces la guerra llegó a un punto muerto.
general_stage_intro_132=Tuvo lugar en junio de 1941 y fue la primera batalla de tanques entre los ejércitos alemán y británico en el frente norteafricano, con Rommel al mando de una maniobra defensiva contra los británicos en la que logró la victoria, destrozando la ilusión británica de rescatar Tobruk.
general_stage_intro_133=Un año atrás, Rommel había sido derrotado en la fortaleza portuaria de Tobruk. Ahora había llegado el momento, en mayo de 1942, de presenciar qué estrategia utilizaría para obtener la victoria más gloriosa de su carrera militar.
general_stage_intro_134=Las potencias del Eje esperaban tomar el control de Oriente Medio, estratégicamente lleno de recursos, apoderándose de Egipto y controlando el Canal de Suez. La batalla de El Alamein se libró en octubre de 1942. ¿Podrían los Aliados detener las ambiciones del Eje con esta batalla?
general_stage_intro_135=Esta fue la última gran batalla en el frente norteafricano, donde las fuerzas del Eje se enfrentaron al ejército Aliado en una feroz batalla en Túnez en noviembre de 1942, con las fuerzas de la coalición alemana e italiana construyendo sus líneas defensivas y resistiendo a muerte bajo la enorme presión constante y la gran logística Aliada.

