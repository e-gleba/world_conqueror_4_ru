;;normal texts,tips
;__font_type[font_text_1]
tips_1=Mejorar la tecnología hará más fuertes a tus tropas.
tips_2=Las Maravillas pueden ser conseguidas al completar escenarios y niveles de desafío.
tips_3=Luego de construir ciertas maravillas, puede obtener recursos como dinero, energía, industria y ciencia y tecnología.
tips_4=Varios recursos pueden ser intercambiados en los nuevos mercados de comercio.
tips_5=Puedes ganar más recursos y recompensas a través de los niveles más allá de los escenarios.
tips_6=Puedes incrementar grandemente tu efectividad combativa mediante el uso hábil de las fuerzas aerotransportadas.
tips_7=Las armas nucleares pueden ser empleadas en misiles o en bombarderos estratégicos y en ciudades con silos misilísticos.
tips_8=Las instalaciones de defensa aérea pueden reducir efectivamente el daño de los ataques aéreos y los misiles.
tips_9=Construir fuertes puede mejorar la efectividad combativa, pero la construcción lleva tiempo.
tips_10=Las fuerzas armadas necesitan estar en portaaviones para combatir en agua, se recomienda que los portaaviones eviten enfrentar la flota enemiga directamente.
tips_11=Cuanto más poderoso es el general, mejores las recompensas que gana luego de completar la tarea.
tips_12=Incremente el rango del Cuartel General para ganar más asientos para generales.
tips_13=Las habilidades avanzadas son adquiridas por capturar objetivos especiales en la batalla.
tips_14=Hay posibilidades de que la moral suba luego de eliminar al enemigo, en ese entonces, tu efectividad combativa se incrementará enormemente.
tips_15=Cuando la moral del enemigo baje o caiga seriamente, deberás aprovechar la oportunidad y atacar.
tips_16=La moral baja cuando las tropas son flanqueadas y será seriamente afectada cuando estén rodeadas
tips_17=El rango de los portaviones es la misma que la de las fuerzas aéreas. Si quieres expandir su rango, deberás mejorar la tecnología aérea correspondiente.
tips_18=Los submarinos son la mejor opción para pelear contra grandes buques como los cruceros y portaviones.
tips_19=Las unidades de infantería con cualidades de ingenieros pueden reducir en gran medida el daño causado por las minas terrestres.
tips_20=Factores como los generales, rondas y la cantidad de ciudades afectarán el puntaje final y las evaluaciones de la conquista.
tips_21=El rango de la investigación científica influye en el rango de los edificios de la ciudad, y los edificios de mayor nivel pueden producir tropas más avanzadas.
tips_22=Puedes emplear tus legiones en el Cuartel General para ejercicios, invasiones, batallas, etc.


