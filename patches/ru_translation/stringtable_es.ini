dialogue_2543=El ejército estadounidense ha atacado a nuestras fuerzas de desembarco. La estrategia de la Operación MI ha quedado al descubierto.
dialogue_2544=Las flechas han sido ensartadas. Continúe según lo planeado.
dialogue_2545=¡Detecta a los portaaviones japoneses! Ataca inmediatamente y elimina la fuerza principal de la Flota Combinada.
dialogue_2546=El tamaño de la flota estadounidense y el número de portaaviones fueron mayores de lo que esperábamos. Movilicen reservas inmediatamente para el refuerzo.
dialogue_2547=Se confirmó el hundimiento del portaaviones enemigo. ¡Continúen la persecución!
dialogue_2548=La Flota del Pacífico estaba bien preparada y mi derrota es insalvable.
dialogue_2549=Mi flota lanzará un ataque alrededor de Guadalcanal. Las fuerzas de desembarco están en posición de tomar Guadalcanal antes de que lleguen los refuerzos japoneses.
dialogue_2550=Hemos sido atacados por fuerzas estadounidenses. Las fragatas y los refuerzos avanzarán inmediatamente para retomar la isla de Guadalcanal.
dialogue_2551=La flota estadounidense ha tomado el control de nuestras rutas de suministro. Me temo que sufriremos grandes pérdidas si continuamos transportando nuestras tropas.
dialogue_2552=Varias islas han sido atacadas por las fuerzas estadounidenses. Debemos reunir la flota para un contraataque eficaz.
dialogue_2553=Mi flota ha llegado. Todas las flotas prepárense para coordinar y lanzar un ataque general. Expulsaremos a estos japoneses de las Islas Salomón.
dialogue_2554=Los refuerzos del enemigo están llegando a la isla de Guadalcanal en un flujo constante. Prepara tus defensas con antelación y aísla al enemigo en el mar.
dialogue_2555=Haré un último esfuerzo para lanzar un ataque a Puerto Moresby, trabajen conmigo para contener los refuerzos estadounidenses.
dialogue_2556=Los ataques del enemigo son cada vez más rápidos. Temo que mis tropas no duren mucho.
dialogue_2557=La flota japonesa atacó sin cobertura de portaaviones. Envíe refuerzos a la flota inmediatamente.
dialogue_2558=Hemos recuperado Kokoda y la ofensiva japonesa está a punto de ser desmantelada.
dialogue_2559=El enemigo ha atravesado nuestra línea de defensa. Envíen refuerzos hacia Lae inmediatamente.
dialogue_2560=Han llegado refuerzos. Ahora comienza el contraataque.
dialogue_2561=Priorice la captura de los aeródromos en Saipán para prepararse en futuras operaciones.
dialogue_2562=¡Nunca nos rendiremos!
dialogue_2563=Hemos luchado hasta el último minuto.
dialogue_2564=Los japoneses en las Marianas no tienen adónde huir. Nuestra flota cortará las conexiones entre ellos y las fuerzas japonesas en otros lugares.
dialogue_2565=El ejército estadounidense capturó Saipán y Tinian uno tras otro. Las fuerzas de desembarco enemigas deben mantenerse fuera de Guam.
dialogue_2566=La Flota Combinada ha sido completamente destruida y nuestra flota proporcionará cobertura a las fuerzas de desembarco.
dialogue_2567=¡He regresado! ¡Nuestras tropas vuelven a pisar suelo filipino!
dialogue_2568=Las tropas estadounidenses han desembarcado al sur de Leyte. Ahora lancen un ataque para cortar los refuerzos enemigos por mar.
dialogue_2569=Las fuerzas terrestres enemigas están avanzando rápidamente y es necesario intensificar el ataque naval para interrumpir los posteriores desembarcos de las fuerzas estadounidenses.
dialogue_2570=Continúen la persecución; la armada enemiga es vulnerable.
dialogue_2571=Retírense hacia el norte y expulsen a la fuerza principal de la flota enemiga del golfo de Leyte.
dialogue_2572=Utilicen la costa para reorganizar la defensa y no permitan que los aliados completen el desembarco.
dialogue_2573=La Flota Británica del Pacífico ha llegado y ahora tenemos una ventaja numérica decisiva en poder aéreo.
dialogue_2574=Sólo tenemos un objetivo: acabar con todos los defensores de la isla.
dialogue_2575=La armada enemiga ha vuelto a tomar la iniciativa. Lanzar un ataque en estas circunstancias seguramente será un viaje de ida.
dialogue_2576=¡Hemos hundido al Yamato!
dialogue_2577=La batalla es insalvable. Continúen el ataque y luchen hasta el último hombre.
dialogue_2578=¡Carguen! Concentren el poder y continúen el ataque al enemigo.
dialogue_2579=Todas las islas de Japón están a poca distancia de la fuerza aérea.
dialogue_2580=No podemos subestimar las defensas del enemigo. Nuestro primer objetivo sigue siendo ocupar Japón y obligar a los japoneses a rendirse.
dialogue_2581=Los japoneses siguen resistiendo. Destruye sus fortificaciones costeras.
dialogue_2582=Proporcionaremos apoyo aéreo y de artillería a las fuerzas de desembarco.
dialogue_2583=Los soviéticos han aparecido, dispuestos a lanzar una operación de desembarco directo para atacar el territorio principal japonés.
dialogue_2584=Los soviéticos han lanzado una ofensiva en el norte. Observen e intercepten sus posteriores fuerzas de desembarco.
dialogue_2585=El enemigo avanza hacia Tokio. Mis tropas partirán inmediatamente para proporcionar refuerzos.
dialogue_2586=Lanzaremos desembarcos desde las costas este y sur para distraer a las fuerzas defensivas enemigas.
dialogue_2587=Elimine las guarniciones en las islas circundantes. Utilice los aeródromos de las islas para brindar apoyo y cobertura a las operaciones de desembarco.
dialogue_2588=El ataque transcurrió mejor de lo esperado y podemos tomar Mesina antes que los británicos.
dialogue_2589=Los aliados han comenzado a desembarcar, envíen a las reservas inmediatamente para apoyar la línea del frente.
dialogue_2590=Mesina está en juego. Ordenen a la guarnición de la isla que regrese de inmediato. Mi fuerza aérea proporcionará cobertura.
dialogue_2591=Hemos dividido a los defensores de la isla. Corten su retirada y eliminen la mayor cantidad de fuerza activa posible del enemigo.
dialogue_2592=Nuestras fuerzas están en absoluta ventaja. De norte a sur, por mar y por tierra, expulsaremos completamente a los alemanes de Italia.
dialogue_2593=Las defensas de Tarento son muy débiles. Después de desembarcar, avanzaré hacia el norte a toda velocidad.
dialogue_2594=El gobierno italiano ya ha discutido en secreto con nosotros asuntos relacionados con la rendición. Aprovecha esta rendición para destruir al ejército alemán en Italia de un solo golpe.
dialogue_2595=¡Hemos interceptado telegramas aliados que indican que Italia solicita un armisticio a los aliados! Debemos seguir de cerca los movimientos del ejército italiano.
dialogue_2596=Hemos llegado a un acuerdo con los aliados y las unidades se retiran a las líneas aliadas.
dialogue_2597=Italia se rindió. Tomaremos rápidamente el control de las grandes ciudades y no debemos permitir que las pérdidas sigan aumentando.
dialogue_2598=Junto con las fuerzas aerotransportadas, derriben las líneas de defensa enemigas en la costa.
dialogue_2599=Después del desembarco, ayuden a varias fuerzas amigas a completar la construcción de posiciones de cabeza de playa y aniquilen a los alemanes en la costa.
dialogue_2600=Un gran número de tropas aliadas han desembarcado en Normandía y es necesario organizar una contraofensiva para frenar el avance del enemigo.
dialogue_2601=¡Mis unidades de artillería detendrán el ataque aliado!
dialogue_2602=La fuerza de desembarco se ha afianzado y ahora lanza un ataque contra Caen.
dialogue_2603=El ataque va muy bien. ¡No pasará mucho tiempo antes de que liberemos París!
dialogue_2604=Cherburgo-en-Cotentin se ha perdido y toda la península está en manos aliadas.
dialogue_2605=Roma ha caído y no se debe permitir que los aliados desembarquen fácilmente en Marsella.
dialogue_2606=Despeja la posición rápidamente y prepara el terreno para el siguiente desembarco de las tropas.
dialogue_2607=¡Continúen con este impulso ofensivo, nuestro pueblo está al borde de la liberación!
dialogue_2608=La ofensiva aliada es inusualmente rápida. Movilicen tropas blindadas para retomar Marsella.
dialogue_2609=No tiene sentido seguir resistiendo. Retrocedan inmediatamente y reorganícense.
dialogue_2610=Las unidades aerotransportadas han aterrizado en sus posiciones asignadas y rápidamente se unirán a ellas. Mantendrán los puentes en lugares clave hasta que llegue la fuerza principal.
dialogue_2611=Están llegando refuerzos. Hay que eliminar estas tropas aerotransportadas y controlar firmemente los puntos defensivos del Rin.
dialogue_2612=¡El avance terrestre ha sido bloqueado! ¡Estamos siendo contraatacados por panzers alemanes!
dialogue_2613=Continúen manteniendo a raya a los aliados y detengan la fuerza principal del enemigo más allá del Rin.
dialogue_2614=Las tropas aerotransportadas lograron tomar el puente sobre el Rin. Dense prisa. No podrán resistir mucho tiempo en la retaguardia alemana.
dialogue_2615=Las aguas que rodean el puerto de Amberes están bajo nuestro control. Nuestros suministros están a punto de mejorar.
dialogue_2616=Los aliados no están preparados para nuestro ataque. Aprovechen esta oportunidad para cortar el vínculo entre las fuerzas principales británicas y estadounidenses.
dialogue_2617=¡Mantengan la línea de defensa! No podemos permitir que los alemanes dividan nuestras tropas.
dialogue_2618=Los refuerzos aliados están llegando al campo de batalla, ¡hay que acelerar el ataque!
dialogue_2619=Las cosas han cambiado. ¡Ahora es nuestro turno de atacar!
dialogue_2620=Regresen a la Línea Sigfrido y reorganicen las defensas antes de que los aliados lancen la próxima ola de ataques.
dialogue_2621=Continúa la persecución y no dejes escapar a ningún enemigo.
dialogue_2622=¡Hemos cortado los suministros del enemigo y la victoria está al alcance de la mano!
dialogue_2623=¡Máxima velocidad adelante! Encuéntrate con los soviéticos y separa a los defensores enemigos.
dialogue_2624=Los alemanes no están dispuestos a rendirse. Continúen el ataque a Berlín. Mis tropas despejarán el norte.
dialogue_2625=Las defensas han sido sobrepasadas en todos los puntos y las tropas aliadas se están desplazando desde todas partes del país hacia Berlín.
dialogue_2626=¡La victoria es nuestra! ¡Continúa el ataque y destruye todas las tropas alemanas que aún resisten!
dialogue_2627=Mis tropas seguirán luchando hasta el final.

general_stage_name_171=Contraofensiva en Kalinin
general_stage_name_172=Cuarta batalla de Járkov
general_stage_name_173=Batalla del Dniéper
general_stage_name_174=Ofensiva del Vístula-Óder
general_stage_name_175=Batalla de Berlín
general_stage_intro_171=La Contraofensiva de Kalinin fue un contragolpe a gran escala del Ejército Rojo soviético frente al asedio alemán de Moscú, que no sólo salvó a Moscú sino que también le dio a la Unión Soviética una importante ventaja estratégica y sentó las bases para la posterior Batalla de Stalingrado y Batalla de Kursk.
general_stage_intro_172=A partir de agosto de 1943, la Unión Soviética lanzó la una ofensiva en lo que fue la Cuarta Batalla de Járkov, una operación que comenzó con un masivo bombardeo de artillería contra las defensas alemanas. Los tenaces contraataques alemanes no detuvieron a los soviéticos, que finalmente lograron recuperar Járkov.
general_stage_intro_173=En una de las mayores operaciones militares de la Segunda Guerra Mundial, en 4 meses el Ejército Rojo soviético liberó de los alemanes la orilla oriental del río Dniéper, llevó a cabo una serie de ataques a través del río, estableció varias cabezas de puente en la orilla occidental y sentó las bases para la victoria en la posterior Batalla de Kiev.
general_stage_intro_174=Esta fue una importante operación militar lanzada por el Ejército Rojo soviético al final de la Segunda Guerra Mundial. A partir del 12 de enero, el Ejército Rojo rompió las defensas alemanas en Polonia y avanzó rápidamente hacia la frontera alemana. La ofensiva aceleró enormemente el fin de la guerra y allanó el camino para que el ejército soviético ocupara Berlín.
general_stage_intro_175=Tras el final de la ofensiva Vístula-Óder, el Ejército Rojo soviético suspendió el ritmo del avance a 60 km al este de Berlín. En marzo, Alemania desarrolló un plan para la defensa de Berlín, pero aún así no pudo evitar que la Unión Soviética reiniciara la ofensiva en abril, lanzando un ataque general contra Berlín.

dialogue_2628=Soldados, marchen hacia el este de inmediato. Nuestro objetivo es tomar Stalingrado.
dialogue_2629=Las tierras soviéticas son inviolables. ¡Expulsaremos a los nazis de la madre patria!
dialogue_2630=Los guardias enemigos son débiles, ¡así que ahora es una buena oportunidad para lanzar un contraataque de un solo golpe!
dialogue_2631=Comandante, dirigiré un bombardeo de artillería contra las posiciones alemanas. Esta vez debemos recuperar Járkov de las manos de los nazis.
dialogue_2632=Cuidado con las formaciones de bolsillo enemigas. Si nos vemos rodeados de refuerzos alemanes, pagaremos un precio incalculable.
dialogue_2633=Los refuerzos marítimos del enemigo no son suficientes para representar una amenaza. Elimínelos rápidamente para evitar mayores peligros.
dialogue_2634=El ejército soviético ha avanzado hacia la orilla oriental del río Dniéper. El Alto Mando emitió una directiva para controlar la ribera occidental e impedirles cruzar el río, sin importar cómo.
dialogue_2635=La guarnición enemiga es fuerte, así que recuerden no atacar a ciegas. Colóquense en la orilla occidental y esperen una oportunidad para contraatacar.
dialogue_2636=El ataque ciego de los alemanes les ha costado caro y ahora el enemigo está débil. ¡Crucemos rápidamente el río y establezcamos una cabeza de puente en la orilla occidental!
dialogue_2637=La ofensiva del ejército soviético es demasiado feroz. ¡Retirada!
dialogue_2638=Detén al enemigo a toda costa. ¡Que no entren en Alemania!
dialogue_2639=Soldados, ésta es una gran victoria, hemos empujado el frente hacia Alemania. ¡Es sólo cuestión de tiempo que a continuación capturemos la capital, Berlín!
dialogue_2640=¡Atacaremos con fuerzas amigas desde el sur, formando un movimiento de pinza hacia Berlín!
dialogue_2641=El enemigo ya está en la ciudad, el Reich alemán se enfrenta a una crisis sin precedentes. ¡Hay que proteger la seguridad del Führer pase lo que pase!
dialogue_2642=Berlín ha caído. Estamos a punto de ganar la Gran Guerra Patria. Este es un gran día.

event_104=Batalla de El Alamein
event_intro_104=Poco después del inicio de la Segunda Guerra Mundial, el campo de batalla se extendió al norte de África. Su ubicación estratégica tiene que ver con el Canal de Suez, una línea marítima vital de comunicación entre Europa y Asia, y los ricos recursos petroleros de Medio Oriente. En 1940, Italia lanzó un ataque contra los británicos en el norte de África, pero debido al fracaso de su estrategia no pudo lograr los avances deseados. Al año siguiente, con la intervención del Afrika Korps alemán, ¿cómo cambiaría la situación bélica en el norte de África?

dialogue_2643=¡Gracias a Dios, las fuerzas aliadas alemanas han completado su despliegue completo en el campo de batalla y ahora la balanza de la victoria se inclinará a nuestro favor!
dialogue_2644=El objetivo de las potencias del Eje es romper las defensas y capturar el puerto de Alejandría. Si lo logran, todo el norte de África quedará bajo el control del enemigo. Debemos detener su plan.
dialogue_2645=La ofensiva del enemigo es demasiado feroz. El campo de batalla ha llegado a un punto muerto. Comandante, podemos confiar en nuestra flota de suministros en el Mediterráneo para librar una larga guerra de desgaste contra ellos.
dialogue_2646=¡Destruyan las líneas de suministro marítimo del enemigo y no denles la oportunidad de respirar!
dialogue_2647=Las líneas de suministro de los ejércitos del Eje son demasiado largas y ya se están quedando sin suministros. ¡Aprovecharemos la oportunidad para contraatacar!
dialogue_2648=Los alemanes están demasiado defendidos en el campo de batalla central. Comandante, guíenos para romper la débil defensa del ejército italiano desde el campo de batalla del sur y luego avanzar hacia el norte.


