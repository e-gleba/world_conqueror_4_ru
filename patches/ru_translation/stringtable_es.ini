dialogue_1001=Comandante, permítame introducirle en las operaciones básicas.
dialogue_1002=El círculo blanco debajo de las unidades indica que todavía es operable.Pisar una mina enemiga provocará una pérdida de HP.
dialogue_1003=Después de seleccionar la tropa, verás territorios resplandecientes y anillos rojos, los resplandores indican las casillas en las que te puedes mover y los anillos rojos son los objetivos disponibles.
dialogue_1004=Diferentes edificios producen diferentes unidades. Los edificios con mayor nivel pueden producir más tropas diferentes.
dialogue_1005=Producir tropas consume recursos. Las diferentes unidades tienen distintos números de formaciones.
dialogue_1006=Puedes contratar un general adquirido para mejorar la efectividad de combate de tus tropas.
dialogue_1007=Si cometiste un error, puedes retroceder inmediatamente.
dialogue_1008=Nota: Este es un punto clave. Ocupándola o perdiéndola afectará directamente al resultado de la batalla.
dialogue_1009=Termina tu turno clickeando en el reloj de arena que se encuentra al fondo derecho.
dialogue_1010=Comandante, ¡es tiempo de empezar tu conquista militar!
dialogue_1011=Comandante, déjeme introducirle algunas tácticas.
dialogue_1012=El auge o caída de la moral de las tropas es clave en la efectividad de combate de las tropas. Es seriamente afetcada cuando tus tropas son flanqueadas o rodeadas.
dialogue_1013=Si tus tropas caen en caos, estarán indefensas.
dialogue_1014=Si derrotas a las unidades enemigas, estas no contraatacarán.
dialogue_1015=Construir defensas es una forma efectiva frente a los ataques. Pero solo pueden ser construidas en tu territorio en un tiempo limitado.
dialogue_1016=Las defensas aéreas pueden reducir efectivamente el daño de los ataques aéreos y misiles.
dialogue_1017=Necesitas reducir la vida de la ciudad a 0 antes de capturarla. Luego de ocuparla, todos los territorios bajo la misma serán tuyos.
dialogue_1018=Cuando el tamaño de la ciudad llego a Lv3, puedes construir edificios referenciales en la ciudad. Dichos edificios traen efectos especiales a la ciudad.
dialogue_1019=Puedes comprobar los detalles de la ciudad enemiga a través de la barra de información.
dialogue_1020=Comandante, ¡empiece su carrera militar por favor!
dialogue_1021=Comandante, déjeme introducirle algunas otras tácticas.
dialogue_1022=Los terrenos tienen diferentes efectos en el resultado de la batalla. Las tropas ubicadas en montañas o bosques pueden reducir parte del daño cuando reciben daño de la armadura enemiga y la artillería.
dialogue_1023=Las ciudades con aeropuertos pueden realizar ataques aéreos y lanzar paracaidistas contra el enemigo.
dialogue_1024=Las ciudades con edificios nucleares pueden producir bombas nucleares.
dialogue_1025=Los misiles causan más daño al enemigo si se le equipan armas nucleares.
dialogue_1026=Cuando las tropas entren al agua, deberán viajar a través del transporte marítimo, por lo tanto, sus capacidades se verán limitadas por el mismo.
dialogue_1027=En el puerto, puedes construir tu flota naval.
dialogue_1028=Comandante, ¡empiece su carrera militar por favor!

dialogue_1029=Debes reducir los PV de las tropas enemigas a cero para destruirlas.
dialogue_1030=Su Excelencia, Comandante, ahora permítame presentarle algunas otras tácticas.
dialogue_1031=La mayoría de las tropas de élite tienen habilidades activas y los médicos pueden usar las suyas para curar a sus compañeros.
dialogue_1032=Capturar o destruir la zona verde desencadena ciertos eventos o desbloquea habilidades específicas (que se pueden aprender en el cuartel general).
dialogue_1033=Los túneles excavados por las unidades de ingenieros permiten el movimiento de la infantería y la mayor parte de la artillería, lo que facilita un rápido desplazamiento al campo de batalla.
dialogue_1034=Al usar el túnel, si las tropas no pueden moverse, obtienen un movimiento adicional. Cada túnel solo se puede activar un número limitado de veces.
dialogue_1035=Los halos azules indican puntos de evacuación desde donde sólo los objetivos clave marcados con halos rojos pueden ser evacuados.
dialogue_1036=Su Excelencia, Comandante, ¡por favor comience su misión y escolte a los objetivos clave fuera del campo de batalla lo antes posible!

dialogue_1037=Su Excelencia, Comandante, ahora permítame presentarle la combinación de tropas y los procedimientos de despliegue.
dialogue_1038=Solo se pueden desplegar las tropas en los cuadrados translúcidos. Puedes ver qué tropas y cuántas unidades de cada tropa planeas desplegar. Las unidades en gris no se pueden desplegar en el nivel actual.
dialogue_1039=Al hacer clic una vez, se puede desplegar un solo grupo. Al hacer clic varias veces, se añaden más grupos. El número máximo de grupos por tropa es el mismo para otros modos.
dialogue_1040=Las tropas perdidas en el campo de batalla se contabilizan como bajas. Al desplegar varios grupos, se incurrirá en mayores bajas si son destruidos.                                                   Si deseas aumentar el número de tropas que entran en batalla, recluta para obtener suplementos en el modo Dominación.
dialogue_1041=Su Excelencia, Comandante, ¡por favor emprenda su campaña militar de inmediato y aplaste a todas las fuerzas enemigas!
dialogue_1042=Al hacer clic en "Restablecer", puedes redistribuir tu formación. El combate solo comienza oficialmente al hacer clic en el botón "Iniciar Batalla".


dialogue_2001=Comandante, mi ejército Panzer romperá la línea de defensa enemiga tan pronto como sea posible.
dialogue_2002=No tengo tiempo para capturarte.
dialogue_2003=Las tropas enemigas en el norte han sido aniquiladas y es cuestión de tiempo antes de que capturemos Varsovia.
dialogue_2004=Comandante, las amenazas del mar serán atendidas por mis fuerzas submarinas.
dialogue_2005=El enemigo no tiene manera de retirarse. Comandante, tenga cuidado con sus últimos ataques.
dialogue_2006=El enemigo ha perdido su control sobre el mar. Me haré cargo de los puertos del norte y acabaré con su armada por completo.
dialogue_2007=En cooperación con su acción, mis unidades de artillería lanzarán un ataque contra la Línea Maginot.
dialogue_2008=Comandante, mis fuerzas blindadas están listas para eludir la línea de defensa. Es hora de marchar hacia París.
dialogue_2009=El enemigo ha derrotado a nuestros aliados y ahora estamos solos.
dialogue_2010=Sigue atacando. ¡Nunca te detengas!
dialogue_2011=¿Cómo pudo aparecer el enemigo allí? ¡La capital necesita refuerzos en la retaguardia!
dialogue_2012=La Fuerza Expedicionaria Británica comenzó a retirarse. Comandante, elimine a los enemigos restantes y cruce el Canal de la Mancha.
dialogue_2013=Mis tropas lo ayudarán a lanzar un ataque simultáneo en el lado oeste y aterrizar en el continente británico.
dialogue_2014=Es el momento de resolver la amenaza británica de una vez por todas.
dialogue_2015=Las guerras no se ganan con la retirada, pero esta retirada engendra la victoria.
dialogue_2016=Las principales fuerzas navales enemigas están prácticamente aniquiladas, y ahora es el momento perfecto para desembarcar.
dialogue_2017=Lucharemos hasta la muerte. Nunca cedan ni se dobleguen.
dialogue_2018=Las principales fuerzas navales del enemigo se han perdido en el Canal de la Mancha. Esta será su última resistencia en el Mar Mediterráneo.
dialogue_2019=Aprovechan las islas cercanas para formar una línea de defensa y buscan minar bajo el agua para limitar nuestros movimientos.
dialogue_2020=Esta es nuestra última oportunidad. Debemos evitar que Italia se apodere de todo el Mediterráneo.
dialogue_2021=La posición de este puerto es crítica, y el enemigo debe reforzarla enviando flotas. Así que asegúrese de tener control total sobre este sitio.
dialogue_2022=Nuestro interior ha sido atacado y las Flotas de Reserva han sido enviadas. Debemos bloquearlos.
dialogue_2023=Las flotas enemigas han atravesado el lado oeste de la línea. Por favor envíe refuerzos inmediatamente.
dialogue_2024=Nuestras tropas de vanguardia han desembarcado con éxito en la Península Balcánica. Comandante, por favor ayúdelos a lanzar un ataque por tierra.
dialogue_2025=El enemigo ha lanzado un ataque a gran escala contra nosotros y nuestros aliados. Deben mantenerse unidos para llevarlos de regreso al mar.
dialogue_2026=La marina enemiga es vulnerable, pero no podemos subestimar su división de montaña. Ayuda a nuestros aliados lo antes posible y mantén la fortaleza.
dialogue_2027=Has bloqueado el contraataque del enemigo y ahora es el momento de lanzar una ofensiva general junto con nuestros aliados.
dialogue_2028=Formen un martillo pesado y no se dispersen.
dialogue_2029=A pesar del gran tamaño del ejército soviético, se volverán vulnerables frente a las élites del imperio.
dialogue_2030=Mi grupo de infantería ha atravesado la línea norte de Leningrado.
dialogue_2031=Kiev está siendo atacada por el enemigo. Hemos sufrido una gran pérdida. ¡Necesito tropas!
dialogue_2032=La primera línea de defensa del enemigo ha sido perforada. Nuestro objetivo es Smolensk. Mis compañeros soldados, sigan mi ejemplo.
dialogue_2033=Comandante, espero unir fuerzas con usted en Moscú.
dialogue_2034=No hay vuelta atrás: Moscú está detrás de nosotros. Defiende esta última línea de defensa hasta la muerte.
dialogue_2035=Kiev ha sido capturada por el enemigo. Debemos levantar inmediatamente una nueva línea de defensa en el este.
dialogue_2036=Nuestros refuerzos están llegando. Comandante, despeje las barreras para su aterrizaje y asegúrese de que los suministros lleguen sin problemas.
dialogue_2037=Soldados, corten los suministros del enemigo y amplíen nuestro dominio en números.
dialogue_2038=Nuestros refuerzos han comenzado a arrivar. Por favor, ocupe rápidamente el puerto de adelante y destruya las guarniciones costeras.
dialogue_2039=La línea de defensa del enemigo ha sido perforada. Mi grupo Panzer avanza hacia el Puerto de Alejandría y las flotas navales atacarán al enemigo por el otro lado.
dialogue_2040=Hemos perdido la última barrera en el mar. El Puerto de Alejandría está expuesto al fuego del enemigo.
dialogue_2041=No hay refuerzos, pero de todos modos tenemos que defender El Cairo.
dialogue_2042=Leningrado es una fortaleza fuerte, por lo que un ataque frontal nos costaría mucho.
dialogue_2043=Comandante, nuestra prioridad es controlar las ciudades circundantes y bloquear Leningrado. Nuestros aliados atacarán por el norte.
dialogue_2044=Las tropas enemigas avanzan hacia Leningrado. Soldados, corred al frente para reforzar nuestros ejércitos.
dialogue_2045=Comandante, hemos bloqueado la parte norte de Leningrado. Estamos deseando unirnos a usted lo antes posible.
dialogue_2046=El enemigo ha lanzado un ataque al este de Leningrado. Deténgalos y mantenga la última línea de suministro.
dialogue_2047=Hemos ganado el control total sobre el perímetro de Leningrado, y ahora es el momento de hacer el último movimiento de nuestro proyecto.
dialogue_2048=¡Leningrado es nuestro! El enemigo debe pagar el precio por lo que hizo.
dialogue_2049=Las tropas del mariscal Paulus han sido rodeadas por el enemigo en las cercanías de Stalingrado. El cuartel general nos ordena reforzarlos de inmediato.
dialogue_2050=El frente alemán es tan largo que ya no pudieron defender a ambos lados. Esta es una excelente oportunidad para que nosotros luchemos.
dialogue_2051=La línea sur de los aliados rumanos y húngaros está bajo fuerte ataque. No pueden durar mucho más.
dialogue_2052=El enemigo ha lanzado un contraataque a gran escala contra nosotros. Comandante, atraviese el ala norte de la línea soviética.
dialogue_2053=Hemos rodeado completamente al Sexto Ejército en el ala sur. Debemos detener los refuerzos alemanes.
dialogue_2054=Las tropas del frente están reteniendo los refuerzos alemanes. Ha llegado el momento de destruir el Sexto Ejército.
dialogue_2055=El mariscal Paulus ha sido derrotado. Hemos perdido la posición estratégica para atacar Stalingrado.
dialogue_2056=Solo queda un último paso para conquistar Europa. Moscú está a la vista. Soldados, vengan conmigo y ganen la gloria.
dialogue_2057=El enemigo intenta atacar Moscú en varias direcciones. Pero antes de eso, ¡deben recordarles que esta tierra pertenece a la Unión Soviética!
dialogue_2058=Comandante, tenga cuidado con el ataque soviético. Trabajar con tus aliados acelerará el ritmo de avance.
dialogue_2059=Debemos resistir el ataque alemán hasta que las tropas sean evacuadas de forma segura.
dialogue_2060=¡Ataquen! ¡Tomen rápidamente todos los puertos y detengan al enemigo!
dialogue_2061=Tenemos la ayuda de nuestros aliados, y esas son buenas noticias.
dialogue_2062=La primera línea de defensa del enemigo ha sido perforada. ¡Ataquen con todo y no deje nada que respire!
dialogue_2063=Regresa al puerto y mantente firme. Las tropas pronto podrán partir.
dialogue_2064=Los alemanes están atacando nuestra patria. ¡Necesitamos tropas!
dialogue_2065=Siga atacando y toda Gran Bretaña estará a tu alcance.
dialogue_2066=¡Hemos detenido los ataques aéreos alemanes, y es el momento adecuado para contraatacar!
dialogue_2067=¡La victoria pertenece al imperio británico!
dialogue_2068=Nuestra armada naval ha bloqueado las líneas de suministro alemanas y ahora es la mejor oportunidad para atacar.
dialogue_2069=Según lo interceptado por la inteligencia, las fuerzas de Rommel atacarán las ciudades del sur. Manténgase alerta y reúna unidades de artillería para defender.
dialogue_2070=Hemos roto la posición del frente alemán y lanzaremos un ataque contra Túnez.
dialogue_2071=¡Todas las fuerzas blindadas, lancen un ataque sorpresa y destruyan al enemigo!
dialogue_2072=El enemigo no fue sorprendido desde el principio, por lo que esta acción no tiene ningún propósito.
dialogue_2073=El objetivo de esta operación es capturar Sicilia y obligar a Italia a abandonar el campo de batalla.
dialogue_2074=Esta es la primera acción conjunta a gran escala de las fuerzas aliadas, por lo que mis flotas cooperarán con ustedes para atacar la isla.
dialogue_2075=Las cosas van a la perfección y debemos capturar Palermo un paso por delante de los británicos.
dialogue_2076=Las fuerzas aliadas son demasiado fuertes. Preparado para partir. Necesitamos refuerzos del Estrecho.
dialogue_2077=Sicilia es nuestra. ¡Cruza el Estrecho y aplasta a Italia de una vez por todas!
dialogue_2078=Combine el ataque de las alas norte y sur y destruya el ejército soviético en Kursk.
dialogue_2079=Construya líneas de defensa, consuma a las fuerzas blindadas alemanas y espere el momento perfecto para contraatacar.
dialogue_2080=¡Ataquen! ¡Destruyan las fuerzas armadas del enemigo y llévalos a su casa!
dialogue_2081=Hemos ganado la superioridad aérea en las áreas del norte y atacaremos junto con ustedes.
dialogue_2082=La victoria de la campaña de Kursk hace añicos la ofensiva alemana de verano y ahora es el momento de que tomemos la iniciativa.
dialogue_2083=La defensa a ciegas nos ha puesto en una posición pasiva, así que lideraré a mis tropas en un ataque sorpresa para bloquear a los soviéticos.
dialogue_2084=Las fuerzas del general Lund Stadler han fracasado y mi plan tampoco funciona.
dialogue_2085=Movilice el ejército del grupo noroeste y corra a Kiev para apoyar.
dialogue_2086=Comandante, queremos recuperar Minsk, que ahora está ocupada por los alemanes. El general Rokossovsky y yo le ayudaremos a realizar esta tarea.
dialogue_2087=He hecho todo lo que he podido, aún no puedo salvar el día.
dialogue_2088=Nuestra operación es un gran éxito. Minsk está frente a nosotros. Solo ten cuidado con el contraataque del enemigo.
dialogue_2089=Después de una cuidadosa planificación y preparativos a largo plazo, finalmente ha llegado este día. ¡Este será el aterrizaje más grande de la historia!
dialogue_2090=¡Las fuerzas estadounidenses avanzan muy rápido y no podemos quedarnos atrás!
dialogue_2091=El frente se encuentra en una situación crítica y debemos organizar un contraataque eficaz para frenar el avance de las fuerzas aliadas.
dialogue_2092=¡Nada puede detenernos!
dialogue_2093=Para cooperar con el avance del ejército francés, hemos realizado un ataque sorpresa contra los alemanes en el sur de Francia.
dialogue_2094=¡Mis fuerzas impedirán que las fuerzas aliadas pisen la costa!
dialogue_2095=Parece que subestimé su fuerza. Envía fuerzas blindadas y bloquea las fuerzas aliadas.
dialogue_2096=Los restos del ejército alemán ya no son una amenaza. Ataque total y ocupación de Lyon.
dialogue_2097=Comandante, si el plan tiene éxito, nuestras tropas estarán en el corazón de Alemania y la victoria no está lejos.
dialogue_2098=La cabeza de puente ha caído. ¡Necesitamos enviar tropas!
dialogue_2099=¡Bien hecho! Sigan atacando y destruyan por completo al resto del ejército alemán aquí.
dialogue_2100=Tenemos que capturar Berlín antes de que lleguen otras tropas, y mis fuerzas de artillería te cubrirán.
dialogue_2101=Mis fuerzas armadas eliminarán todos tus obstáculos en el norte.
dialogue_2102=¡Berlín está a la vista y la victoria será nuestra!
dialogue_2103=Mi fracaso no significa nada. Berlín está condenado a caer.
dialogue_2104=¡Nuestro ataque sorpresa es un éxito! Las tropas enemigas sufren un duro golpe.
dialogue_2105=¿Por qué no detectamos los movimientos japoneses de antemano? ¡Soldados, volved a vuestros puestos de inmediato!
dialogue_2106=Comandante, flanquee al enemigo. Llevaremos a cabo el cerco del enemigo en la isla.
dialogue_2107=Los refuerzos del enemigo han comenzado a moverse. Mi fuerza de submarinos los interceptará.
dialogue_2108=Los aviones de exploración han detectado la posición de los principales buques de guerra británicos y las unidades de submarinos están listas para partir en cualquier momento.
dialogue_2109=Singapur es una importante ciudad estratégica en Asia y no debe caer en manos de los japoneses.
dialogue_2110=Comandante, por favor desembarque sus unidades rápidamente. Nuestra flota atacará a la armada naval enemiga al mismo tiempo.
dialogue_2111=Las flotas reales británicas ya no tienen su fuerza. Dale al enemigo un golpe fatal mientras está en caos.
dialogue_2112=Los japoneses están a un paso de Singapur. Envíen todas las reservas y defiendan Singapur de todos modos.
dialogue_2113=La línea de defensa británica se ha derrumbado. Tomaremos Rangún como base y nos apoderaremos de toda Birmania.
dialogue_2114=Comandante, cuando ataque Rangún, envíe una unidad móvil conmigo para cortar la línea de suministro del enemigo.
dialogue_2115=No podemos resistir los ataques japoneses. ¡Retirada! Restablezcan una línea de defensa alrededor de Mandalay.
dialogue_2116=Los británicos en el frente ya no pueden aguantar más. Por favor ve inmediatamente y apóyalos.
dialogue_2117=La fuerza principal del enemigo ha ido a la línea del frente. Este es el mejor momento para lanzar un ataque sorpresa y cortar los suministros del enemigo.
dialogue_2118=Las fuerzas británicas en Birmania se están desmoronando. ¡Reúnanse y tomen las fortalezas restantes!
dialogue_2119=Comandante, tome Puerto Moresby lo antes posible. Te proporcionaré apoyo aéreo.
dialogue_2120=Los portaaviones atacarán al enemigo en las islas Salomón y cubrirán las tropas de desembarco.
dialogue_2121=Tenga cuidado con los refuerzos del enemigo y evite bajas innecesarias mientras desembarca tropas.
dialogue_2122=La última línea de defensa ha sido destruida por los japoneses. ¡Australia está completamente expuesta a los disparos del enemigo!
dialogue_2123=Comandante, nuestras tropas son limitadas. Por favor, coopere con la marina cuando ataque.
dialogue_2124=¡Solo son aptos para vivir aquellos que no tienen miedo de morir! Somos la última esperanza del campo del Pacífico.
dialogue_2125=Parece que el enemigo todavía desea recuperar su tierra perdida. Comandante, esté bien preparado para defender.
dialogue_2126=No se puede perder la fe en ningún momento. Mientras la flota del Pacífico siga allí, hay esperanza de victoria.
dialogue_2127=En este momento crítico, la retirada pondrá todo en vano.
dialogue_2128=Las bajas de nuestro ejército son demasiado grandes y los soldados están exhaustos. El cuartel ha decidido detener el ataque. ¡Todas las unidades se retiran!
dialogue_2129=Comandante, continúe y resista la persecución británica, ya que esperamos lanzar un contraataque contra India más tarde.
dialogue_2130=Mantenemos el Imfal, pero mientras los japoneses sigan allí, esta batalla no ha terminado.
dialogue_2131=Las flotas japonesas han comenzado a retirarse. Esta es una gran oportunidad para recuperar nuestro territorio perdido.
dialogue_2132=Los británicos son imparables y Mandalay está al borde de la muerte o la destrucción.
dialogue_2133=La fuerza principal soviética ha sido completamente empantanada por los alemanes. Nuestra operación en Siberia afectará al mundo entero.
dialogue_2134=Comandante, aproveche nuestra maniobra militar para evitar la principal fuerza blindada de la Unión Soviética y tome las ciudades con una defensa débil al principio.
dialogue_2135=Para cooperar con usted, mis tropas atacarán a los soviéticos en varias direcciones.
dialogue_2136=No tenemos energía de sobra para tratar con los japoneses. Debemos encontrar la fuerza principal japonesa lo antes posible.
dialogue_2137=La fuerza blindada del enemigo se está moviendo hacia mi posición. ¡Necesito tropas!
dialogue_2138=Comandante, debemos atravesar rápidamente la línea de defensa marina enemiga y completar el desembarco. ¡Cuidado! Asegúrese de mantenerse alejado de la investigación militar de EE. UU.
dialogue_2139=No podemos resistir a las flotas japonesas. Debemos unirnos junto con las fuerzas aliadas y hacer retroceder al mar a la fuerza de desembarco enemiga.
dialogue_2140=Establece una línea de defensa en el lugar y defiéndete de su ataque.
dialogue_2141=Seguir defendiéndose solo conduce a la muerte. Debemos atacar para ganar tiempo para la investigación y el desarrollo de armas finales.
dialogue_2142=Para nuestra sorpresa, los estadounidenses tomaron la delantera al atacarnos. Es inesperado, pero también es una oportunidad para debilitarlos.
dialogue_2143=Comandante, ataque las instalaciones de investigación del enemigo mientras se resiste a la fuerza principal del ejército de EE. UU.
dialogue_2144=Un hombre valiente no será aplastado mientras haya un rayo de esperanza.
dialogue_2145=Hemos recibido un telégrafo sobre la incursión japonesa en Pearl Harbor y los barcos allí están gravemente dañados. ¡Regrese inmediatamente para luchar contra los japoneses!
dialogue_2146=Comandante, mis tropas interceptarán el ataque japonés. Por favor, date prisa para apoyar a Pearl Harbor.
dialogue_2147=La incursión es un gran éxito y estamos listos para lanzar un tercer ataque. Esta vez acabaremos con la Flota del Pacífico para siempre.
dialogue_2148=Los refuerzos del enemigo han llegado. Necesitamos apoyo de buques de guerra.
dialogue_2149=La fuerza de asalto sufre grandes pérdidas. Esta es una 'victoria' que no puedo aceptar.
dialogue_2150=Singapur tiene una gran importancia para el plan del cuartel general. Tome Singapur antes de la llegada de los refuerzos británicos.
dialogue_2151=El ejército japonés está listo para atacar y ocupar Singapur. Por favor, esté preparado. No podemos permitir que los japoneses triunfen.
dialogue_2152=Comandante, mi flota ha llegado y lo asistiré en el ataque.
dialogue_2153=Los británicos atacan rápidamente. Por favor envíe refuerzos inmediatamente.
dialogue_2154=El número de japoneses que atacan las Islas Midway es enorme. Aférrate a tu posición. Asegúrese de que Midway Islands esté siempre en nuestras manos.
dialogue_2155=Portaaviones, formen columnas y contengan el ataque del enemigo.
dialogue_2156=Las defensas enemigas son tan fuertes que nuestras tropas resultan gravemente dañadas.
dialogue_2157=Debido a fallas de mando, nuestras flotas sufren sucesivas derrotas. Es poco probable que podamos salvar la batalla.
dialogue_2158=Los japoneses actúan muy rápido. Han construido sus aeropuertos y fuertes fortificaciones.
dialogue_2159=Comandante, atacaré por el noreste de la isla de Guadalcanal para distraerlos. Aterriza rápidamente y destruye la guarnición de la isla.
dialogue_2160=Mi flota fue asaltada por el enemigo.
dialogue_2161=Comandante, los japoneses padecen enfermedades y la moral está baja. Esta es una gran oportunidad para que lancemos un ataque.
dialogue_2162=Las fuerzas aliadas atacarán desde tres rutas diferentes al mismo tiempo. Primero debemos capturar Mandalay.
dialogue_2163=El enemigo ha capturado Mandalay. Esta no es una buena noticia.
dialogue_2164=En este último campo de batalla, no tenemos dónde retirarnos. ¡A la carga!
dialogue_2165=Las fuerzas aliadas han invertido una gran cantidad de marina para cubrir el desembarco de tropas. Debemos recuperar Filipinas.
dialogue_2166=Este lugar ha sido ocupado por el Imperio. Envíe a MacArthur de regreso al mar y manténgalo vagando en el océano Pacífico.
dialogue_2167=Mi avión de reconocimiento encontró las principales fuerzas de portaaviones japonesas. Es hora de destruir a sus portaaviones para siempre.
dialogue_2168=Ozawa logró mantener las principales fuerzas de portaaviones del enemigo.
dialogue_2169=La flota ha vuelto a fallar y la armada del Imperio deja de existir.
dialogue_2170=Aguanten en sus puestos. Cada soldado debe matar al menos a diez enemigos y luchar hasta el último.
dialogue_2171=Comandante, tome esta isla y podremos lanzar un bombardeo estratégico efectivo en el continente japonés.
dialogue_2172=La inteligencia muestra que la defensa de la isla es extraordinaria, por lo que la captura de esta isla tiene un alto precio. Sé consciente.
dialogue_2173=Caer en el campo de batalla es la gloria de ser un guerrero.
dialogue_2174=Comandante, debemos acabar con las tropas japonesas frente a nosotros y atacar el Japón Continental antes que lo haga el ejército estadounidense.
dialogue_2175=Los soviéticos intentan atacar la parte continental del Imperio y debemos detenerlos.
dialogue_2176=Comandante, tenemos poco tiempo. Ocupar el aeropuerto acelerará nuestra ofensiva.
dialogue_2177=Comandante, los japoneses siguen resistiendo desesperadamente. Lanzaremos un ataque en el continente japonés. Únase a nuestra operación.
dialogue_2178=Debemos desembarcar lo más pronto posible y construir edificaciones defensivas. Japón no es el único enemigo al que enfrentamos.
dialogue_2179=Japón se ha rendido. Esta tierra pertenece a la Unión Soviética. ¡Expulsa a los estadounidenses!
dialogue_2180=La ambición de los soviéticos está dentro de mis expectativas. Comandante, nos enfrentaremos a tropas de dos países diferentes y esta será una dura batalla.

dialogue_2181=Mis tropas han completado la operación de desembarco, pero aún necesitan tantos refuerzos como sea posible para mantener firme la línea del frente.
dialogue_2182=La flota Real atacará el puerto enemigo, y al mismo tiempo enviaré unidades del ejército como refuerzos.
dialogue_2183=Comandante, vigile los refuerzos de la OTAN. Impide que el enemigo aterrice y acaba con él en el mar.
dialogue_2184=¡El plan de la OTAN ha fracasado y ha llegado el momento de contraatacar!
dialogue_2185=Las tropas soviéticas se han concentrado en el Cáucaso, lo que significa que nuestra línea de ataque ha sido completamente bloqueada.
dialogue_2186=Mi flota atacará a la armada soviética e inmovilizará a las fuerzas terrestres enemigas.
dialogue_2187=Comandante, destruya la punta de lanza del enemigo junto con mis tropas y prepárese para la invasión de Turquía.
dialogue_2188=Comandante, es hora de atacar Turquía.
dialogue_2189=Puedes cooperar con my flota y atravesar la línea de defensa turca. Recuerde que nuestra prioridad es destruir las fuerzas costeras americanas.
dialogue_2190=Las fuerzas de la OTAN ya están avanzando sobre Ankara, y sería bastante difícil para mis tropas defenderse de su ataque.
dialogue_2191=Comandante, envíe refuerzos rápidamente para asegurar nuestro control de Ankara.
dialogue_2192=Mis tropas se dirigen a la línea del frente como refuerzos.
dialogue_2193=Ha llegado el momento ya que la OTAN ha perdido su fuerza principal. Nuestro próximo objetivo es capturar todo el territorio de Turquía.
dialogue_2194=El enemigo tiene una estrecha línea de defensa, pero vamos a tomar Ankara y usarla como base para atacar a Turquía.
dialogue_2195=El enemigo ha invadido nuestro interior. Debemos bloquear su ataque de todos modos.
dialogue_2196=La OTAN ha establecido una coalición en Europa Occidental y está lista para lanzarnos un ataque a gran escala desde dos direcciones.
dialogue_2197=Soldados, es hora de mostrar nuestra fuerza. Hacer retroceder a los soviéticos.
dialogue_2198=Comandante, la alianza del enemigo es bastante fuerte. Aprovecha la oportunidad y derrótalos uno por uno. Estamos deseando reunirnos con usted en Berlín.
dialogue_2199=Me he quedado hasta el último momento. Varsovia está al borde de la muerte o la destrucción.
dialogue_2200=Las fuerzas de la OTAN en Europa Occidental lanzaron un ataque sorpresa contra nosotros y nuestros aliados sufrieron grandes pérdidas.
dialogue_2201=Me he quedado hasta el último momento. Varsovia está al borde de la muerte o la destrucción.
dialogue_2202=Comandante, el enemigo debe pagar el precio de sus acciones. ¡La tormenta roja barrerá toda Europa!
dialogue_2203=La inteligencia muestra que un nuevo lote de refuerzos estadounidenses se está moviendo hacia Asia desde la costa oeste.
dialogue_2204=Mi fuerza aérea ha detectado un gran número de tropas soviéticas en aguas cercanas. Por favor, elimine la acción inmediatamente y regrese a la orilla.
dialogue_2205=Comandante, por favor intercepte a la flota de transporte enemiga, limpiando los lugares para nuestro desembarco.
dialogue_2206=Fallamos en detener al enemigo de desembarcar, pero no debemos dejar que avancen más a fondo.
dialogue_2207=La Marina de la OTAN apareció de repente en la retaguardia, y nos están rodeando poco a poco.
dialogue_2208=Comandante, nuestra acción ya está expuesta y debemos aterrizar en el territorio continental de los Estados Unidos lo antes posible para evitar un mayor consumo.
dialogue_2209=¡Soldados, ataquen! Aplasten los planes del enemigo en el mar.
dialogue_2210=La OTAN ha fracasado por completo, pero los estadounidenses todavía están haciendo su último esfuerzo.
dialogue_2211=Nuestros refuerzos llegarán pronto a la costa este. Mantenga nuestra posición y los aliados derrotarán a Estados Unidos por completo.
dialogue_2212=Mi flota bloqueará los refuerzos del enemigo. Ahora debemos concentrar nuestras fuerzas y aplastar al ejército soviético. ¡El estandarte estrellado nunca caerá!
dialogue_2213=La guerra se acabó. Los países europeos están debilitados y debemos aprovechar esta oportunidad para atacar para expandir nuestro territorio.
dialogue_2214=Los soviéticos han reunido una gran masa de unidades del ejército y están listos para seguir invadiendo Europa. Vamos a bloquearlos en la línea del frente.
dialogue_2215=Alemania es atacada ferozmente por la Unión Soviética y debemos apoyarlos.
dialogue_2216=Alemania es vulnerable. ¡Ataquen! La victoria es pan comido.
dialogue_2217=Hemos logrado persuadir a Bélgica y Países Bajos para que se unan a nosotros en el asedio de Alemania.
dialogue_2218=La Unión Soviética persuadió a Corea del Norte para que lanzara una guerra contra Corea del Sur y Seúl fue tomada. Enviaremos tropas para que desembarquen en Inchon y contraataquen con los defensores de Corea del Sur.
dialogue_2219=Las fuerzas de las Naciones Unidas han llegado a Corea del Sur. Movilice tropas y aplástelas. El fracaso no es una opción.
dialogue_2220=Deberíamos aprovechar nuestra ventaja y aplastar la ambición soviética.
dialogue_2221=La Unión Soviética ha desplegado una gran cantidad de misiles cerca de Cuba. Están listos para disparar bombas nucleares en cualquier momento. Comandante, debemos apoderarnos y destruir los silos de misiles cueste lo que cueste.
dialogue_2222=El presidente apenas puede soportar la provocación soviética. Probarán su propia medicina.
dialogue_2223=¡Ataque! Enséñales una lección a esos estadounidenses.
dialogue_2224=La Unión Soviética ha bloqueado el canal de Suez, tratando de monopolizar los recursos petroleros en el Medio Oriente. Nunca dejaremos que eso suceda.
dialogue_2225=Ataquen. Capturen la base petrolera en el Medio Oriente y expulsen a los europeos.
dialogue_2226=La Unión Soviética actuó tan rápido. La situación es desfavorable para nosotros.
dialogue_2227=El número del ejército soviético es grande y contendré al enemigo en el norte junto con nuestro aliado británico. Comandante, espere el momento adecuado y ataque su retaguardia desde el punto débil del sur, para sitiarlos.
dialogue_2228=Los refuerzos estadounidenses están cerca. Ataquen y obtengan la victoria antes de su llegada.
dialogue_2229=¡Bombardeo! No podemos darles ningún respiro.
dialogue_2230=El número de tropas de la OTAN es asombroso, pero avanzan lentamente. Reúne tropas para el próximo ataque.
dialogue_2231=Parece que no llegamos a tiempo y los soviéticos han ocupado algunas ciudades. Comandante, aprovecharemos los intervalos mientras la Unión Soviética descansa y recuperaremos el territorio perdido.
dialogue_2232=Comandante, los exploradores han descubierto que la Unión Soviética aún no ha construido ninguna fortificación en el frente sur. Este es un gran avance.
dialogue_2233=Nunca se me ocurrió que la base soviética en la Antártida haya crecido tanto. ¡Debemos eliminarlos por completo con esta acción!
dialogue_2234=Mantente firme en tu campo. Esta es nuestra última oportunidad de contraatacar.
dialogue_2235=Lanza misiles y hazlos explotar. ¡Es el momento de luchar!

dialogue_2236=La ofensiva del enemigo es feroz. La inteligencia ha demostrado que se han tomado múltiples campos petroleros y que las principales ciudades de varios países están bajo ataque.
dialogue_2237=Han llegado demasiado tarde. ¡Sigan atacando! No pasará mucho tiempo antes de que nos convirtamos en los amos del Golfo.
dialogue_2238=Me temo que nuestros aliados no durarán mucho. Comandante, envíe tropas de inmediato y alivie la crisis en el Golfo.
dialogue_2239=Nuestras ventajas son obvias y cualquier resistencia es inútil.
dialogue_2240=El objetivo del enemigo es Bagdad, hacia donde se concentran múltiples fuerzas enemigas. Comandante, destruya su plan a toda costa.
dialogue_2241=Toma las ciudades restantes y lanza un ataque contra el Reino Unido. Pronto tomaremos el control de toda Europa.
dialogue_2242=El enemigo ha atacado en todas direcciones y muchas ciudades han caído. Comandante, nuestro objetivo es aterrizar lo antes posible y salvar a Europa de la crisis.
dialogue_2243=Este retiro es solo temporal. Volveré.
dialogue_2244=El cambio es muy exitoso y los soviéticos parecen ser vulnerables. ¡No hemos tenido mucha distancia de Moscú!
dialogue_2245=El enemigo pensó que tomar algunas ciudades garantizaba su victoria, pero está totalmente equivocado. ¡La Unión Soviética nunca ha sido derrotada y tampoco lo será esta vez!
dialogue_2246=El río Dnieper ha sido bloqueado y la situación de la Unión Soviética no es favorable. Dar prioridad a recuperar Kiev y luego marchar desde Smolensk a Moscú.
dialogue_2247=Tenemos que reforzar nuestras fuerzas amigas en Járkov, ya que son fuerzas importantes para retomar Stalingrado y Moscú.
dialogue_2248=La barrera en el lado oeste de Moscú ha sido destruida, y los soviéticos aquí no son rival para nosotros.
dialogue_2249=Járkov ha caído y las tropas enemigas están acercándose a Moscú. La batalla decisiva está llegando.
dialogue_2250=Moscú está al borde de la muerte o destrucción. Mis tropas te ayudarán a tomar Kiev y estar totalmente preparados para un fuerte contraataque.
dialogue_2251=El fracaso de Europa no es gran cosa. Esta vez, debemos capturar completamente América del Norte. Ataque todo y termine la batalla rápidamente.
dialogue_2252=Comandante, aunque nuestra presión ha disminuido, aún nos superan en número. Necesitamos tu ayuda.
dialogue_2253=El enemigo en Nueva York ha sido aniquilado. ¡El amanecer de la victoria ya está a la vista!
dialogue_2254=Nueva York es nuestra. Defiéndete en tus posiciones y evita que el enemigo se defienda.
dialogue_2255=Hay demasiados enemigos y no he recibido ninguna ayuda inmediata. Washington se encuentra en una situación crítica.
dialogue_2256=Nunca esperé que el Sudeste Asiático y Australia fueran atacados por terroristas. Pero nuestra llegada es un punto de inflexión en la batalla.
dialogue_2257=Nadie se atreve a desafiarme en el océano. Eres el primero y el último en vivir.
dialogue_2258=Nos hemos apoderado de las islas centrales. Mis fuerzas blindadas partirán inmediatamente para apoyar a las fuerzas amigas en Australia.
dialogue_2259=Comandante, asegúrese de que la isla esté bajo nuestro control.
dialogue_2260=Los refuerzos del enemigo nos están llegando desde todas las direcciones.
dialogue_2261=La guarnición de la isla ya no aguanta más. Mis flotas están regresando y debemos recuperar este punto estratégico.
dialogue_2262=Darwin ha caído en manos del enemigo y las tropas australianas se retiran.
dialogue_2263=Comandante, por favor dé prioridad a recuperar Darwin y mantener Australia continental.
dialogue_2264=Comandante, la defensa del enemigo está muy apretada. Debemos combinar fuerzas y dividirlas una por una.
dialogue_2265=Siberia es la base donde hemos estado desplegados durante años, y te atreviste a atacar aquí. Haré que te arrepientas de haber tomado esa decisión.
dialogue_2266=Ataquen. Destruyan al enemigo bajo mi fuego.
dialogue_2267=Tus acciones solo te costarán una rápida destrucción. Sientan mi ira.
dialogue_2268=El enemigo ha perdido la base de Siberia, pero sus ataques no se detuvieron. Vamos a lanzar un contraataque a gran escala, sin dejar espacio para que el enemigo se tome un descanso.
dialogue_2269=Nuestras tropas en Asia están perdiendo terreno, pero somos la élite de la élite. ¡Los soviéticos pagarán un precio por su ataque imprudente!
dialogue_2270=Comandante, esta es la última base del enemigo. Se acerca el momento de una batalla decisiva. Destruyelos.
dialogue_2271=Sorpresa sorpresa. Usted puede encontrar aquí, pero eso es todo lo que puede ir. ¡Deshazte de ellos!
dialogue_2272=Ahora que estás aquí, no hay vuelta atrás.
dialogue_2273=La acción del enemigo es rápida. No dejes que se escapen de nuevo. ¡Empuje nuestras ventajas y elimínelas!
dialogue_2274=Esta es su Cuartel General. ¡De todos modos va a ser la última batalla!
dialogue_2275=Nuestra investigación se completará pronto. ¡Muéstrales a estos tontos ciegos nuestra verdadera fuerza!
dialogue_2276=¿Por qué aparecieron los soviéticos en este momento? Pero por el momento el enemigo del enemigo es un amigo, y la victoria final depende de los soviéticos.
dialogue_2277=Ahora que el enemigo no tiene comandante, la victoria está a la vista. Pero la tecnología que causa esto debe sellarse para siempre.
dialogue_2278=¡Estas tecnologías son propiedad de la Unión Soviética, y nadie tiene derecho a tomar tal decisión!
dialogue_2279=No hay amigo perpetuo, ni enemigo perpetuo, solo intereses perpetuos.
dialogue_2280=Para nuestra sorpresa, los terroristas se han aprovechado de nuestras bases militares restantes. Comandante, vamos a eliminar a los terroristas y nunca permitiremos que dominen esta tecnología.


