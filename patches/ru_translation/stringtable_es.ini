feat_desc_110=Cuando se encuentre en terreno montañoso o forestal, el daño recibido se reduce en un {1}%
feat_desc_111=Lanza múltiples misiles balísticos de corto alcance que infligen un {1}% de daño al objetivo y un {2}% de daño a los enemigos alrededor del objetivo, con un tiempo de reutilización de 3 turnos.
feat_desc_111_Lv2=Lanza múltiples misiles balísticos de corto alcance que infligen un {1}% de daño al objetivo y un {2}% de daño a los enemigos alrededor del objetivo, con un tiempo de reutilización de 2 turnos.
feat_desc_111_Lv3=Lanza múltiples misiles balísticos de medio alcance que infligen un {1}% de daño al objetivo y un {2}% de daño a los enemigos alrededor del objetivo, con un tiempo de reutilización de 2 turnos.
feat_desc_112=Recupera un {1}% de los puntos de salud máximos al comienzo del turno. Reduce el daño recibido en un {2}% cuando tienes la salud completa.
feat_desc_113=Daño infligido a unidades que no son edificios +{1}%
feat_desc_114=Después de atacar, hay un {0}% de probabilidades de que el enemigo reciba un estado que le impida realizar un ataque normal o un contraataque, dura 1 turno.
feat_desc_115=Después de aniquilar a un enemigo, hay un {1}% de probabilidad de reducir la moral de otros enemigos dentro de 1 casilla.

army_buff_desc_1391=Control Anti-Disparos: incapaz de realizar ataques y contraataques normales (los aviones de ala fija, ataques con misiles y la Supresión de Ametrallamiento están desafectados)


dialogue_2883=¡Señores, Guam está indefenso y debe ser capturado lo antes posible!
dialogue_2884=¡El 4.º Grupo Panzer ataca Stalingrado y debe liberar al 6.º Ejército!
dialogue_2885=¡Mantengan su posición y asegúrense de que el cerco esté intacto!
dialogue_2886=¡6.º Ejército, aproveche la oportunidad para escapar lo antes posible!
dialogue_2887=Nos hemos quedado sin suministros. Todas las tropas, a sus posiciones, abandonen la fuga y esperen ayuda.
dialogue_2888=¡Romperemos las líneas enemigas con el asalto a Amberes a través de las montañas de las Ardenas!
dialogue_2889=¡Mantengan la línea! ¡No permitan que los alemanes amenacen las líneas de suministro!
dialogue_2890=Atención a todas las unidades. ¡Concéntrense en Dinant para contener la ofensiva alemana!
dialogue_2891=¡Los suministros están listos! Soldados, ha llegado la hora de la venganza. ¡Destruyan a todos los enemigos en el saliente!
dialogue_2892=El ejército ya no es capaz de llevar a cabo el plan. Todo el ejército se retira y conserva sus fuerzas.
dialogue_2893=¡Hay que capturar Bastoña para garantizar el paso seguro de las tropas a través de las montañas de las Ardenas!
dialogue_2894=¡Mantengan Bastoña! ¡El 3.er Ejército llegará pronto con refuerzos!
dialogue_2895=¡Lancen un ataque rápido para aliviar a Bastoña!
dialogue_2896=Camaradas, el enemigo está debilitado, ¡aplastemos al Grupo de Ejércitos Sur y liberemos a Ucrania!
dialogue_2897=¡Todas las unidades deben resistir hasta el último momento y nunca retirarse!
dialogue_2898=Por orden del Führer, asumo el mando. Todas las unidades, aseguren sus defensas, alternen retiradas y conserven sus fuerzas.
dialogue_2899=Mientras el general Vatutin se recupera de sus heridas, yo tomaré el mando. ¡Todo el ejército siga mis órdenes y continuemos el ataque!
dialogue_3100=El Scharnhorst alemán está en la zona de operaciones y busca nuestro convoy. ¡Hay que hundirlo! Así la ruta del Ártico estará segura a partir de ahora.
dialogue_3101=Camaradas, el enemigo ha brutalizado y asesinado a nuestros compatriotas. ¡Debemos vengarlos! ¡Todas las tropas al ataque!
dialogue_3102=El enemigo nos hace señas para que nos rindamos, pero en realidad quiere destruirnos por completo. ¡Soldados, deténganse en la ciudad, esperen el rescate y la victoria será nuestra!
dialogue_3103=Budapest está indefensa. Escapen si pueden o ríndanse si no. El país recordará nuestro sacrificio.
dialogue_3104=¡El ejército enemigo se ha desplazado hacia el norte! ¡Apunten a su punto débil y tomen Estrasburgo!
dialogue_3105=La región de Alsacia es débil. Debemos concentrarnos en una defensa rigurosa. Si es necesario, las tropas pueden retirarse a los Vosgos para reorganizar una línea defensiva.
dialogue_3106=¡Tomen Estrasburgo y expulsen al enemigo de los Vosgos!
dialogue_3107=¡Mantengan la posición! ¡Las tropas de las Ardenas han partido para apoyarlos!
dialogue_3108=La ayuda de Estados Unidos está llegando, se están enviando miles de soldados y cientos de aviones. Nuestras tropas deben resistir hasta que lleguen esos refuerzos. No puede haber más retiradas.
dialogue_3109=Logré escapar, ¡pero regresaré!
dialogue_3110=Los veteranos nunca mueren, sólo se desvanecen lentamente.
dialogue_3111=Podrán capturarme y Bataan podrá caer, ¡pero el espíritu de los amantes de la libertad en todo el mundo no será aplastado!
dialogue_3112=¡He vuelto Filipinas! ¡Las tropas desembarcarán y avanzarán hacia el sudeste para liberar Manila!
dialogue_3113=Luchen lejos de la costa para evitar el apoyo de los barcos enemigos. Si no pueden mantenerlos a raya, retírense a las montañas y peleen en guerras de desgaste.
dialogue_3114=Camaradas, el pueblo de Leningrado ha resistido el asedio durante más de 800 días. ¡No podemos permitir que esta situación continúe! ¡Ataquemos! ¡Liberemos Leningrado!
dialogue_3115=El asedio de Leningrado ha sido levantado. ¡Los alemanes no pueden detener la victoria de la justicia! ¡Camaradas, continúen la persecución!
dialogue_3116=El general Küchler ha sido relevado de sus funciones y el ejército está ahora bajo mi mando. Las tropas de primera línea reducirán sus líneas y se retirarán gradualmente hacia el oeste del lago Peipus.
dialogue_3117=Unas pequeñas unidades atrajeron la atención del enemigo desde la izquierda, mientras que la fuerza principal atacó desde el lado derecho de las montañas, usando un “gancho de derecha” para penetrar la línea de defensa.
dialogue_3118=Apóyense en las montañas y los valles de los ríos para organizar la línea de defensa, ¡ninguna posición puede ser abandonada!
dialogue_3119=La abadía de Montecasino es probablemente un punto de observación enemigo. El bombardeo aéreo se realizará de inmediato. ¡Soldados, tomen esa posición!
dialogue_3120=¡Soldados, ataquen! ¡Recuperemos el territorio francés!
dialogue_3121=El 19.º Ejército se retira inmediatamente. No pueden ser asediados por el enemigo.
dialogue_3122=La primera prioridad en esta batalla es destruir al enemigo. El cerco debe completarse desde el norte y sur, y luego se debe lanzar un ataque contra el enemigo dentro del cerco.
dialogue_3123=Se ha formado el cerco. ¡Camaradas, ataquen! ¡Destruyan al enemigo en el cerco!
dialogue_3124=¡Creen una salida! ¡Las tropas que se encuentren fuera del cerco ataquen rápidamente para ayudar en la fuga!
dialogue_3125=Las fuerzas del saliente se retirarán rápidamente para recuperarse, mientras las demás tropas estabilizan sus posiciones.
dialogue_3126=Primero hay que aplastar a los rebeldes en las ciudades que rodean Oulu, luego hay que acabar con el enemigo en el sur. ¡Peleen soldados! ¡Por una Finlandia independiente!
dialogue_3127=El apoyo alemán está en marcha. El enemigo no está tan bien entrenado como nosotros. ¡Soldados, ataquen!
dialogue_3128=¿El enemigo también tiene refuerzos? ¡Soldados, corten las líneas de transporte, retrasen el apoyo de los refuerzos y la victoria será nuestra!
dialogue_3129=¡Iré al extranjero y continuaré la lucha hasta que nazca una Finlandia independiente y en paz!
dialogue_3130=¡No podrás conseguir la independencia de Finlandia incluso si triunfas con la ayuda de Rusia!
dialogue_3131=¡Las defensas japonesas son débiles y esta batalla les mostrará lo que puede hacer la Armada de los EE. UU.!
dialogue_3132=Los aviones del barco están a punto de despegar. ¡Los enemigos comprobarán físicamente con sus cuerpos el poder del portaaviones!
dialogue_3133=Atención a todas las unidades. Han llegado las unidades de apoyo enemigas. ¡Aceleren sus operaciones!
dialogue_3134=Camaradas, el enemigo está intentando defender la ribera y resistir. ¡Utilicemos el fuego de artillería para demostrarle al enemigo que la justicia prevalecerá!
dialogue_3135=Estamos en la frontera de nuestra patria y cualquier retirada conducirá a la guerra contra Alemania por aire y por agua. ¡Jamás nos retiraremos!
dialogue_3136=Camaradas, el enemigo ya ha impedido nuestro avance, pero esta vez debe dividir sus fuerzas en otros lugares. ¡La batalla para superar sus defensas está al caer!
dialogue_3137=Soldados, ya resistimos una vez el ataque enemigo. ¡Podemos hacerlo de nuevo! ¡Por el bien de la patria!


