synergy_tactics_6_1=• Todas las unidades de la "División Folgore" que no se movieron en este turno obtendrán el estado de "Atrincheramiento" al final del turno. (Atrincheramiento: Defensa +30%. Se retira automáticamente después de moverse).
synergy_tactics_6_2=• Relámpago Celestial: si un enemigo a 3 casillas de una unidad de la “División Folgore” es atacado por la fuerza aérea, la unidad de la “División Folgore” obtiene +20 de Ataque para este turno.
synergy_tactics_6_3=• Maniobra Ligera: si una unidad de infantería de la "División Folgore" no se mueve durante este turno, al finalizar el mismo, todas las unidades de la "División Folgore" alrededor de 2 casillas obtienen +6 de movilidad para el siguiente turno.
synergy_tactics_6_4=• Tácticas Antitanque: cuando una unidad de infantería de la “División Folgore” se encuentra a 2 casillas de una unidad de artillería de la “División Folgore”, el daño infligido por la unidad de artillería a las unidades blindadas aumenta un 30%.

