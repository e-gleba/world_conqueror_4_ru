skill_info_136=Aumenta la recuperación de PV convertida a partir del daño infligido de [#00FF00#%d%%] según el nivel de la fuerza de élite de artillería. El daño de ataque crítico de la fuerza de élite de artillería aumenta un 25%%
skill_info_137=Al comandar infantería, reduce el daño recibido en [#00FF00#%d%%]. Después de ser atacado por el enemigo, aumenta la reducción de daño en un 10%% adicional, dura 1 turno, acumulable hasta 3 veces.
skill_info_138=Después de atacar, hay [#00FF00#%d%%] probabilidades para obtener el efecto "provocación".
skill_info_139=Al comandar tropas blindadas dentro del alcance del territorio enemigo, daño de ataque crítico de las fuerzas propias y amigas cercanas +[#00FF00#%d%%]
skill_info_140=Cuando tu ataque hace que la moral del enemigo baje o se reduzca, hay una probabilidad del [#00FF00#%d%%] de volver a atacar. Cuando tu ataque hace que la moral del enemigo entre en caos, hay una probabilidad del 100%% de volver a atacar (inactivo para enemigos que ya están en caos)
skill_info_141=Después de ordenar a una tropa naval que ataque, hay un 50%% de posibilidades de aplicar un efecto de "sacudida" al enemigo, la movilidad -[#00FF00#%d%%]. Dura 2 turnos. Al comandar al Enterprise, toda la fuerza aérea cuesta -1, excepto los cazas.
skill_info_142=Cuando la tropa comandada activa el efecto esquivar, restaura un [#00FF00#%d%%] de sus PV máximos (hasta 1 vez por turno)
skill_info_143=Al comandar unidades blindadas dentro del alcance de tu propio territorio o de un aliado, -[#00FF00#%d%%] daño recibido. Al ser atacado por generales enemigos, refleja además el 50%% del daño infligido por este ataque.
skill_info_144=Después de atacar, existe una probabilidad de [#00FF00#%d%%] de que se agregue una marca de seguimiento a otros enemigos dentro de 1 casilla del objetivo. Los objetivos con marca de seguimiento reciben un 20%% más daño.Dura 1 ronda.

