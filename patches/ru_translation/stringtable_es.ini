event_intro_4107=Las fuerzas soviéticas completaron con éxito el despliegue clandestino de sus fuerzas principales mediante una rigurosa operación de engaño, que incluyó medidas como el movimiento nocturno de unidades y la construcción de posiciones ficticias. El 19 de noviembre de 1942, lanzaron una ofensiva a gran escala contra las tropas rumanas en los flancos del ejército alemán, rompiendo rápidamente las defensas. Las fuerzas alemanas subestimaron la magnitud y la intención del ataque soviético, lo que permitió que las fuerzas soviéticas del norte y del sur se unieran con éxito, cercando finalmente por completo al 6.to Ejército alemán y a elementos del 4.to Ejército Panzer. Esta operación cambió decisivamente la situación estratégica en el Frente Oriental.
event_intro_4108=El 20 de noviembre de 1943, con el apoyo de una poderosa fuerza naval y aérea, las fuerzas estadounidenses llevaron a cabo un desembarco anfibio en el atolón de Tarawa. Debido a mareas inesperadamente bajas, muchas unidades se vieron obligadas a vadear lejos de la costa. Mientras tanto, las fuerzas japonesas habían reforzado las defensas de la isla preparándose para el asalto anfibio, infligiendo numerosas bajas a las fuerzas estadounidenses durante el desembarco. Tras cuatro días de intensos combates, las fuerzas estadounidenses aniquilaron a los defensores a un alto precio. Esta batalla brindó a las fuerzas estadounidenses lecciones invaluables sobre la guerra anfibia, elevando considerablemente la importancia de la predicción de mareas y los estudios hidrográficos.
event_intro_4109=Para apoderarse de los recursos estratégicos en el sudeste asiático, quebrantar las sanciones económicas y el embargo petrolero estadounidense, la Armada japonesa lanzó un ataque sorpresa contra la base naval estadounidense de Pearl Harbor, Hawái, el 7 de diciembre de 1941. Los japoneses desplegaron seis portaaviones y realizaron bombardeos aéreos en dos oleadas, infligiendo daños considerables a la Flota del Pacífico estadounidense con mínimas pérdidas. Si bien muchos aviones y barcos fueron destruidos, los tres portaaviones estadounidenses se vieron inafectados, ya que no se encontraban en el puerto. Al día siguiente, Estados Unidos declaró la guerra a Japón, dando así comienzo a la Guerra del Pacífico.
event_intro_4110=Tras la invasión italiana de Egipto, el ejército detuvo su avance en Sidi Barrani, centrándose en la construcción de fortificaciones y el establecimiento de varios campamentos a la espera de refuerzos. El 8 de diciembre de 1940, las fuerzas británicas lanzaron un ataque sorpresa contra los campamentos italianos de la zona. Debido al estricto secreto que rodeó la operación, los italianos fueron tomados por sorpresa y respondieron precipitadamente, lo que resultó en la captura de un gran número de soldados. El éxito de este enfrentamiento superó todas las expectativas, lo que impulsó a los británicos a aprovechar de inmediato su victoria y convertir la incursión en una contraofensiva estratégica conocida como "Operación Compass".

dialogue_4146=¡Al amparo del fuego naval, denlo todo para completar el desembarco anfibio!
dialogue_4147=La marea está más baja de lo esperado. Debido al calado relativamente profundo de la lancha de desembarco, no podemos acercarnos más.
dialogue_4148=Las fuerzas japonesas en la isla se han dividido. Tenemos una ventaja absoluta. Manténganse alerta y eliminen la resistencia restante.
dialogue_4149=Los japoneses han lanzado un feroz contraataque contra nuestras fuerzas de desembarco.
dialogue_4150=¡Esta vez no es un simulacro! ¡Ataquen los cuarteles del ejército italiano y tómenlos por sorpresa!
dialogue_4151=Tengan en cuenta la dirección principal de ataque del enemigo. El grueso de las fuerzas británicas está posicionado en el desierto, a nuestra retaguardia.
dialogue_4152=El enemigo se está desmoronando en todo el frente. ¡Continúen la ofensiva y amplíen las ganancias!
dialogue_4153=Los principales bastiones del ejército italiano cayeron uno tras otro, provocando que toda la línea defensiva comenzara a flaquear. Las tropas fueron cayendo gradualmente en el desorden.


