event_intro_472=El 8 de febrero de 1942, los japoneses desembarcaron con éxito en la playa más débilmente defendida de Singapur, en el noroeste. Aunque los aliados tenían ventaja en número y suministros, carecían de entrenamiento y experiencia. Los japoneses capturaron rápidamente Bukit Timah y tomaron el control de los graneros aliados, los depósitos de petróleo y las cisternas cercanas, sumiendo rápidamente a las fuerzas aliadas en la isla en una escasez de suministros. Finalmente, el 15 de febrero, los aliados se rindieron incondicionalmente.
event_intro_473=Para evitar los ataques aéreos, del 11 al 13 de febrero de 1942, los buques de guerra alemanes Scharnhorst, Gneisenau y Prinz Eugen, apoyados por dragaminas y la Luftwaffe, lograron cruzar el Canal de la Mancha desde Brest, Francia, hasta las bases navales alemanas. La evacuación a través del Canal humilló a las fuerzas británicas. Sin embargo, el rango de movilidad de los buques de guerra alemanes se limitó a partir de entonces al Mar del Norte y ya no representaba una amenaza para las rutas marítimas del Atlántico.
event_intro_474=Para impedir que los aliados asaltaran la llanura costera ocupada por el enemigo desde el paso de Faïd, al este de Sidi Bouzid, y cortar la conexión entre las fuerzas del norte y del sur de Túnez, los alemanes lanzaron un ataque sobre Sidi Bouzid y sus alrededores el 14 de febrero de 1943, que golpeó duramente a las fuerzas aliadas. Los aliados perdieron un gran número de posiciones y la línea se retiró a Kasserine.
event_intro_475=La Operación Hailstone fue un ataque aéreo y marítimo combinado a gran escala que llevó a cabo la Armada de los Estados Unidos entre el 17 y el 18 de febrero de 1944 contra el puerto militar clave de la Armada japonesa, Truk, en el Pacífico central. Aunque los principales buques de la flota combinada eran el objetivo principal de la operación, los cuales escaparon de la muerte debido a una evacuación temprana, una gran cantidad de transportes y buques auxiliares en el puerto fueron devastados, lo que dañó gravemente la capacidad de transporte marítimo japonés.
event_intro_476=La batalla de Iwo Jima fue una batalla que duró del 19 de febrero al 26 de marzo de 1945 entre los Estados Unidos y Japón durante la Guerra del Pacífico de la Segunda Guerra Mundial. Durante la batalla, los japoneses abandonaron el establecimiento de líneas defensivas en las playas para detener los desembarcos estadounidenses y, en su lugar, establecieron una compleja defensa en profundidad dentro de la isla. Esto dificultó enormemente el ataque estadounidense y la captura, originalmente planeada para siete días, se retrasó más de un mes. Al final, las fuerzas estadounidenses derrotaron a los japoneses y la bandera de las barras y estrellas izada en la cima del monte Suribachi se convirtió en un importante símbolo espiritual de los Estados Unidos.
event_intro_477=Para evitar que las fuerzas alemanas en Pomerania lanzaran una contraofensiva en caso de un ataque soviético a Berlín y, así, retrasar la guerra, los soviéticos enviaron a Rokossovsky para liderar el 2.do Frente Bielorruso y el flanco oriental del 1.er Frente Bielorruso el 24 de febrero de 1945, para despejar el camino de los defensores de Pomerania que se habían atrincherado al norte de los soviéticos y allanar el camino para un ataque a Berlín.
event_intro_478=El 27 de febrero de 1942, en un intento de capturar la isla de Java, estalló una batalla naval entre las flotas japonesa y aliada en aguas de Surabaya. La batalla duró dos días y los japoneses ganaron al herir y hundir varios buques de guerra aliados a costa de un destructor dañado. La batalla destruyó casi todos los barcos aliados en aguas de Java y facilitó en gran medida la invasión japonesa de la isla.
event_intro_479=A principios de 1943, la campaña de Nueva Guinea entró en la fase ofensiva aliada. Para revertir la situación, los japoneses planearon aumentar el número de tropas en Nueva Guinea para lanzar una contraofensiva. El 28 de febrero, los japoneses organizaron una flota desde Rabaul y planearon transportar unos 6.900 hombres a Lae el 3 de marzo. Sin embargo, los aliados conocieron el plan con antelación y lanzaron un ataque aéreo sostenido contra la flota del 2 al 3 de marzo, destruyendo todos los transportes.
event_intro_480=Para retrasar el ataque británico a la Línea Mareth, los alemanes planearon concentrar sus fuerzas en un ataque a Medenine el 6 de marzo de 1943, para eliminar las fuerzas de reserva que se encontraban allí. Sin embargo, los británicos descifraron este plan con antelación y movilizaron sus fuerzas para estar listos para recibir refuerzos. El día del ataque, los alemanes no habían logrado capturar la posición con la suficiente rapidez. Rommel consideró que, incluso si salía victorioso, las fuerzas restantes no serían suficientes para defender la Línea Mareth. Por lo tanto, decidió abandonar la continuación de la batalla y los británicos finalmente obtuvieron la victoria.
event_intro_481=El 8 de marzo de 1944, los japoneses comenzaron la batalla del Imphal con el objetivo de capturar bastiones enemigos, defender Birmania y cortar las rutas de refuerzo, entre otros objetivos estratégicos “ofensivos y defensivos”. La batalla duró hasta principios de julio y terminó con una aplastante derrota para los japoneses. La principal razón de la derrota fue el plan de batalla poco realista e irresponsable del comandante japonés, Mutaguchi Renya, y su evasión de la responsabilidad de mando. En Japón, el término “Imphaler” todavía se utiliza para describir a alguien que es “valiente pero no ingenioso”.
event_intro_482=Para liberar Mindanao y destruir a los defensores japoneses en la isla, el ejército estadounidense desembarcó en sus costas. La batalla duró del 10 de marzo al 15 de agosto de 1945. Con la ayuda de las guerrillas filipinas, las fuerzas estadounidenses limpiaron la isla de todas las tropas japonesas con muy pocas bajas.
event_intro_483=Después de la batalla de Medenine, los aliados pronto comenzaron a atacar la Línea Mareth. El 16 de marzo de 1943, el ejército británico se dividió en dos: un ataque frontal a la línea para atraer la atención de las fuerzas del Eje, y el otro un ataque sorpresa desde los flancos rodeando la línea desde el paso suroeste hacia el norte. Ante el ataque de ambos lados, las fuerzas del Eje tuvieron que retirarse hacia el norte para evitar ser cercadas. Los aliados capturaron con éxito la Línea Mareth.
event_intro_484=Tras el inicio de la batalla de Mindanao, el 18 de marzo de 1945, el general MacArthur ordenó la ocupación de las islas Visayas, en el centro de las Filipinas. En ese momento, las guerrillas filipinas de las islas contraatacaron agresivamente, lo que dificultó a los japoneses montar una defensa de toda la isla, ya que sólo podían mantener en sus manos las grandes ciudades. De este modo, el ejército estadounidense logró liberar las Visayas.
event_intro_485=El 23 de marzo de 1943, en un esfuerzo por romper las líneas alemanas y avanzar hacia la Línea Mareth, el II Cuerpo del Ejército de los EE. UU. luchó contra las fuerzas del Eje en El Guettar. El ejército estadounidense hizo algunos avances tempranos y logró repeler los puestos avanzados alemanes. Sin embargo, los alemanes contraatacaron rápidamente, enviando tanques e infantería para atacar a las fuerzas estadounidenses. Los dos bandos se encontraban en un punto muerto en el valle de El Guettar hasta que los Aliados completaron avances en otros frentes.
event_intro_486=El 25 de marzo de 1944, para destruir al 1.er Grupo Panzer alemán, los soviéticos movilizaron el 1.er y 2.do Frente Ucraniano y los sitiaron en la zona de Kamianets-Podilski. En estas circunstancias, el OKW finalmente permitió que el 1.er Grupo Panzer se retirara. Los alemanes lograron escapar después de perder una gran cantidad de equipo y personal, pero como resultado, perdieron la capacidad de organizar una defensa en Ucrania.
event_intro_487=Para consolidar el control del ejército japonés en el sudeste asiático y apoyar a las fuerzas terrestres que invadían Birmania, el 31 de marzo de 1942, los japoneses enviaron la 1.ra Flota Aérea Naval para atacar la base de la flota en Ceilán, en un intento de destruir la Flota Oriental Británica. Aunque el ejército británico había descifrado la información de inteligencia con antelación, debido a una mala toma de decisiones, las fuerzas navales británicas en la región del Océano Índico sufrieron un duro golpe y la Flota Oriental Británica se vio obligada a retirarse de la bahía de Bengala.
event_intro_488=El 1 de abril de 1945, con el fin de obtener un trampolín para un ataque al territorio principal japonés, las fuerzas estadounidenses iniciaron la Batalla de Okinawa. En las primeras etapas de la campaña, las fuerzas estadounidenses capturaron rápidamente las partes central y norte de la isla. Sin embargo, durante el ataque al sur, las fuerzas estadounidenses se vieron arrastradas a una agotadora batalla de posiciones por parte de los japoneses, que utilizaron cuevas, túneles y fuertes fortificaciones. Los aliados perdieron alrededor de 12 mil hombres muertos y 36 mil heridos en la batalla, mientras que los japoneses perdieron alrededor de 77 mil hombres muertos o desaparecidos. Este trágico desenlace aceleró la decisión de los Estados Unidos de lanzar la bomba atómica para obligar a Japón a rendirse.
event_intro_489=La Operación Grapeshot fue la última ofensiva aliada de la campaña italiana al final de la Segunda Guerra Mundial. El 6 de abril de 1945, los aliados avanzaron hacia el norte y rompieron las líneas alemanas a ambos lados del río Po. Los partisanos italianos también comenzaron a rebelarse, acelerando el colapso de las fuerzas del Eje. Finalmente, el 2 de mayo de 1945, todos los remanentes alemanes e italianos en Italia se rindieron y los aliados liberaron todo el país.

