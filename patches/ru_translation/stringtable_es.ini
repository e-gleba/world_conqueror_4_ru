armygroup_event_desc_123=Las fuerzas soviéticas tomaron la iniciativa y atravesaron la barrera de hielo en el norte del estrecho de Bering, desembarcaron en Alaska y capturaron Nome. Una vez más, Estados Unidos y la Unión Soviética se vieron envueltos en un conflicto a gran escala.
armygroup_event_desc_124=Las fuerzas de la OTAN, lideradas por Estados Unidos, el Reino Unido y Francia, lanzaron una ofensiva contra Corea del Norte, avanzando hacia el norte con la ayuda de Japón y Corea del Sur. El Ejército Popular de Corea opuso una férrea resistencia, mientras que las fuerzas soviéticas continuaron desplegando tropas en el Lejano Oriente, manteniendo el frente en torno al puerto soviético.
armygroup_event_desc_125=Aprovechando la oportunidad, los Escorpiones emplearon sus fuerzas ocultas en el Lejano Oriente y Alaska. Junto a grupos armados a los que habían apoyado previamente, lanzaron ataques sorpresa tras las líneas enemigas en distintos países.
armygroup_event_desc_126=Las armadas de Estados Unidos, el Reino Unido, Australia y la Unión Soviética perseguían a la flota del Imperio Escorpión cuando se toparon con una severa tormenta electromagnética en el centro del mar de Bering. De repente, emergió una isla previamente desconocida con instalaciones avanzadas. Mientras tanto, el cuartel general del Imperio Escorpión en el Pacífico fue asediado por flotas de múltiples naciones.
armygroup_event_desc_127=Las fuerzas de tarea conjuntas de los Estados Unidos, el Reino Unido, Australia y la Unión Soviética iniciaron una serie de ofensivas combinadas marítimas y aéreas contra las bases del Imperio Escorpión en toda la región del Mar de Bering, lo que llevó a la destrucción de múltiples fortificaciones.
armygroup_event_desc_128=Tras la destrucción de la estructura de mando de la Legión Escarcha del Imperio Escorpión, el Cuerpo de Voluntarios del Ártico perdió una parte sustancial de su apoyo militar. En consecuencia, se vio obligado a rendirse y reincorporarse al Pacto de Varsovia.
armygroup_event_desc_129=La estructura de mando de la Legión Noche Eterna del Imperio Escorpión fue destruida, lo que sumió a la Alianza por la Libertad del Norte en el caos. Muchos soldados desertaron, obligando a las fuerzas restantes a rendirse y reincorporarse a la OTAN.
armygroup_event_desc_130=La estructura de mando de la Legión Marea Oscura del Imperio Escorpión fue destruida. Rodeado por las fuerzas de la coalición, el Frente de Liberación del Pacífico se vio obligado a rendirse y finalmente reincorporarse a la OTAN.
armygroup_event_desc_131=Las fuerzas del Imperio Escorpión se han expandido rápidamente una vez más, lo que ha llevado a Estados Unidos y la Unión Soviética a decidir unir fuerzas para eliminar esta amenaza. El Pacto de Varsovia y la OTAN han declarado un alto el fuego temporal y han establecido una nueva alianza militar.
armygroup_event_desc_132=Osborn fue derrotado por completo y los planes del Imperio Escorpión en el Lejano Oriente se vieron completamente frustrados. Sin embargo, los restos dispersos del ejército Escorpión aún persisten en diversos lugares, representando una amenaza constante para los países y regiones vecinos.
armygroup_event_desc_133=Un piloto soviético llevó el avión de combate más avanzado de la Unión Soviética a Japón y desertó. Estados Unidos anunció que le concederá asilo político. Técnicos estadounidenses y japoneses desmantelaron la aeronave y la analizaron exhaustivamente.
armygroup_event_desc_134=Alrededor del mediodía, el cielo sobre la región siberiana de Yakutia se oscureció repentinamente y permaneció así durante unas tres horas. Una densa humareda procedente de los enormes incendios forestales se extendió hacia el este, afectando gravemente a las tropas que combatían en las cercanías.
armygroup_event_desc_135=Tras la invasión de Alaska, el ejército estadounidense y las fuerzas canadienses organizaron una contraofensiva a gran escala. Varias facciones se enfrentaron en combates caóticos al norte de Anchorage, debilitando la punta de lanza de la ofensiva soviética.
armygroup_event_desc_136=La Alianza por la Libertad del Norte, respaldada por el Imperio Escorpión, atacó simultáneamente la base aérea de Fairbanks y el puerto de Anchorage. Su objetivo era iniciar un ataque sorpresa contra la retaguardia estadounidense mientras las fuerzas soviéticas lanzaban un ataque frontal, con la esperanza de asegurar primero el control de Alaska.
armygroup_event_desc_137=Otra violenta explosión ocurrió cerca del río Tunguska. El impacto de un meteorito arrasó grandes extensiones de los bosques cercanos. En los días posteriores al evento, el cielo nocturno de Asia y Europa se tiñó de un rojo intenso. Los satélites de varios países documentaron este fenómeno.
armygroup_event_desc_138=Un grupo de trabajo conjunto compuesto por fuerzas especiales británicas y francesas localizó y destruyó una estación de retransmisión de comunicaciones secreta del Imperio Escorpión en las Islas Kuriles. La operación interrumpió brevemente las comunicaciones entre la Legión Marea Oscura y el Frente del Pacífico.
armygroup_event_desc_139=Cerca de la isla de San Lorenzo, situada en el estrecho de Bering, se produjo un enfrentamiento marítimo y aéreo a gran escala entre las armadas estadounidense y soviética, en el que ambos bandos desplegaron una gran cantidad de cazas y bombarderos.
armygroup_event_desc_140=A medida que la guerra se estancaba, las purgas políticas tanto en Estados Unidos como en la Unión Soviética se volvieron cada vez más brutales. En un esfuerzo por eliminar a los espías infiltrados por el bando contrario, así como a las unidades sospechadas de filtrar información al Imperio Escorpión, se produjeron numerosas condenas injustas.
armygroup_event_desc_141=Un submarino soviético armado con ojivas nucleares y con órdenes de navegar hacia la zona de guerra del Mar de Bering, cortó repentinamente la comunicación y cambió de rumbo hacia la “Isla Fantasma”, bajo el control del Imperio Escorpión.
armygroup_event_desc_142=La Legión Marea Oscura del Imperio Escorpión saboteó la central nuclear de Sapporo poco antes de evacuar la ciudad. Grandes volúmenes de aguas residuales radiactivas se vertieron al mar, lo que provocó la muerte generalizada de la fauna marina en las aguas circundantes y el cierre prolongado de varios puertos.
armygroup_event_desc_143=Con el respaldo de sus aliados, el ejército soviético lanzó una feroz ofensiva contra la base de misiles estratégicos en la región de Magadán, bajo el control del Cuerpo de Voluntarios del Ártico, lo que desencadenó sangrientas batallas callejeras.
armygroup_event_desc_144=El Frente de Liberación del Pacífico lanzó ofensivas coordinadas en la zona sur de Sapporo y alrededor de Hakodate, cortando con éxito la conexión entre Hokkaido y la isla principal de Japón: Honshu.
armygroup_event_desc_145=El ejército surcoreano, con el apoyo de asesores militares estadounidenses, lanzó un ataque sorpresa contra Sovetskaya Gavan, un importante puerto soviético del Lejano Oriente situado en la costa occidental del Estrecho de Tartaria.
armygroup_event_desc_146=En la península rusa de Kamchatka, varios volcanes activos entraron en erupción simultáneamente y la lava brotó continuamente de debajo de los glaciares, lo que interrumpió los despliegues militares de todas las partes.
armygroup_event_desc_147=Varios terremotos se produjeron de manera simultánea tanto en el Golfo de Alaska como en las aguas meridionales del Mar de Bering, lo que desencadenó un tsunami. Este arrasó las regiones costeras del sur de Alaska, destruyendo numerosas instalaciones y equipos militares.
armygroup_event_desc_148=Una aurora anómala apareció sobre Fairbanks, lo que provocó que todos los dispositivos electrónicos dentro de su alcance, incluidos los radares de control de fuego de los aviones de combate, funcionaran mal durante un breve período.
armygroup_event_desc_149=Una ola de frío anormalmente gélida azotó la costa de Chukotka, provocando un brusco descenso de las temperaturas en las regiones circundantes. Las fuerzas militares de todos los bandos tomaron medidas de emergencia para hacer frente al clima severo, pero todas sufrieron pérdidas significativas de personal y equipo.
armygroup_event_desc_150=Para contrarrestar la amenaza de los misiles y bombarderos estratégicos soviéticos, Estados Unidos y Canadá consolidaron y mejoraron el sistema de alerta de largo alcance que se extiende desde Alaska hasta el interior de Canadá. De esta manera, se estableció una estrecha alianza de defensa aérea, fortaleciendo sus capacidades de defensa colectiva.
armygroup_event_desc_151=Las enormes demandas militares impulsaron una expansión tecnológica en campos como la electrónica, la informática y la industria aeroespacial. Estas tecnologías se aplicaron rápidamente al sector civil en parques industriales de California y otras regiones, lo que proporcionó a Estados Unidos una ventaja competitiva en la siguiente ola tecnológica y económica.
armygroup_event_desc_152=A través del Consejo de Ayuda Económica Mutua (COMECON), la Unión Soviética proporcionó asistencia económica, recursos energéticos y acceso al mercado a sus aliados, incluidos Mongolia y Corea del Norte, manteniendo así las conexiones económicas y la estabilidad dentro del campo socialista.


