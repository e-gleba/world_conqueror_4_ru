armygroup_event_desc_1=Al adoptar la táctica de guerra relámpago móvil multiservicio, Alemania invadió rápidamente Polonia en 1939, lo que provocó que Gran Bretaña y Francia declararan la guerra a Alemania y el estallido oficial de la Segunda Guerra Mundial.
armygroup_event_desc_2=Estados Unidos brindó una importante asistencia armamentística a Gran Bretaña y Francia, lo que significó un importante apoyo para su armamento.
armygroup_event_desc_3=La Unión Soviética intentó conquistar Finlandia durante los fríos meses de invierno y aunque salió victoriosa, tuvo un gran coste.
armygroup_event_desc_4=Alemania lanzó un ataque en Noruega y Dinamarca
armygroup_event_desc_5=Los ricos recursos petroleros de Rumania proporcionaron combustible estratégico a Alemania y tuvieron un impacto significativo en las capacidades operativas del Eje.
armygroup_event_desc_6=Alemania utilizó tácticas de guerra relámpago para invadir los Países Bajos, rompiendo rápidamente las líneas de defensa neerlandesas y belgas.
armygroup_event_desc_7=Preparado para lanzarse en mayo de 1940, el Plan Manstein consistía en formar un cerco de las fuerzas aliadas anglo-francesas cruzando el bosque de las Ardenas y evitando la Línea Maginot.
armygroup_event_desc_8=Churchill se convirtió en Primer Ministro británico y su liderazgo y discursos motivadores cimentaron el espíritu de resistencia en Gran Bretaña.
armygroup_event_desc_9=Ante el cerco alemán, los aliados llevaron a cabo una retirada masiva en las playas de Dunkerque, transportando a unos 330.000 soldados de regreso a Gran Bretaña por rutas marítimas militares y civiles, sentando las bases cruciales para una posterior contraofensiva.
armygroup_event_desc_10=Las fuerzas francesas emplearon operaciones de defensa en profundidad y tácticas dilatorias, lo que infligió un desgaste significativo a las tropas alemanas.
armygroup_event_desc_11=Suecia jugó un papel clave en el impulso del poder militar de las potencias del Eje durante la Segunda Guerra Mundial al suministrar a Alemania grandes cantidades de mineral de hierro de alta calidad.
armygroup_event_desc_12=La caída de París simbolizó la derrota de Francia y el campo de batalla de Europa occidental terminó con una victoria alemana, lo que le dio a Alemania una victoria estratégicamente importante al comienzo de la guerra.
armygroup_event_desc_13=El ejército alemán formuló el "Plan León Marino" para una invasión a gran escala de Gran Bretaña en 1940, con la intención de destruir el poder militar británico mediante ataques marítimos y aéreos.
armygroup_event_desc_14=La decisiva batalla aérea sobre Gran Bretaña en 1940, en la que la RAF logró contener la invasión de la Luftwaffe, marcó una victoria crucial para los aliados en el campo de batalla europeo.
armygroup_event_desc_15=La Kriegsmarine amenazó a los convoyes aliados mediante operaciones coordinadas de grupos submarinos y ataques indiscriminados contra flotas enemigas y buques mercantes.
armygroup_event_desc_16=Durante la Segunda Guerra Mundial se produjeron feroces enfrentamientos navales en el Océano Atlántico, en los que los submarinos alemanes atacaron a las flotas aliadas mediante tácticas de manada de lobos, mientras que los aliados recurrieron a la guerra de convoyes y antisubmarina.
armygroup_event_desc_17=Italia declaró la guerra a Gran Bretaña y Francia, desplegando 300 mil tropas para lanzar una ofensiva en la región alpina y el área alrededor de Niza.
armygroup_event_desc_18=El ejército polaco formuló una estrategia operativa principalmente defensiva, centrándose en la defensa de sus territorios occidentales mientras esperaba que los aliados occidentales lanzaran una ofensiva contra Alemania.
armygroup_event_desc_19=Las fuerzas del Eje invadieron Yugoslavia desde todas las direcciones, rompiendo varias líneas de defensa en un período muy corto y lanzando una ofensiva de pinza contra Belgrado.
armygroup_event_desc_20=El Grupo de Ejércitos C movilizó importantes cantidades de cañones de artillería y personal, cruzando el Rin para montar un asalto frontal sobre la Línea Maginot.
armygroup_event_desc_21=Las fuerzas germano-italianas concentraron sus tropas en el teatro de operaciones del norte de África y lanzaron una gran ofensiva contra Egipto, amenazando el Canal de Suez, que estaba bajo control británico.
armygroup_event_desc_22=Las fuerzas británicas lanzaron la Operación Compass con un ataque sorpresa contra la guarnición italiana en Egipto, destruyendo rápidamente sus líneas de defensa y avanzando hacia la frontera libia, revirtiendo así la situación en el norte de África.
armygroup_event_desc_23=Rommel comandó las fuerzas germano-italianas y lanzó un feroz contraataque. Rompieron las defensas británicas, capturaron Alejandría y amenazaron el Canal de Suez, empeorando repentinamente la situación en el norte de África.
armygroup_event_desc_24=Las fuerzas germano-italianas lanzaron una ofensiva, sitiando el puerto de Tobruk para intentar cortar las líneas de suministro de las Fuerzas de Ocupación de la Mancomunidad Británica. Las unidades australianas defendieron firmemente sus posiciones, y la situación se convirtió en un prolongado tira y afloja.
armygroup_event_desc_25=El ejército británico lanzó la Operación Battleaxe, organizando incursiones multifacéticas contra posiciones de las fuerzas alemanas e italianas. Aunque inicialmente lograron avances, pronto fueron contraatacados por el general Rommel, y la operación finalmente fue frustrada.
armygroup_event_desc_26=Las Fuerzas de Ocupación de la Mancomunidad Británica lanzaron la Operación Crusader, reuniendo una gran fuerza de tanques para un contraataque a gran escala. Repelieron con éxito a Rommel y levantaron el asedio de Tobruk, marcando un punto de inflexión crucial en el teatro de operaciones norteafricano.
armygroup_event_desc_27=Rommel recibió el rango de Mariscal de Campo Alemán por sus notables logros militares. La moral del ejército alemán se elevó y lo consideraban un símbolo de invencibilidad.
armygroup_event_desc_28=Para debilitar la línea de suministro británica en el Mediterráneo, las fuerzas aéreas del Eje realizaron bombardeos nocturnos sobre Gibraltar a través del espacio aéreo español. Aunque no causaron daños importantes, obligaron a los británicos a reforzar sus defensas.
armygroup_event_desc_29=La ofensiva de Rommel avanzó implacablemente hacia el corazón de Egipto. Las fuerzas británicas establecieron líneas defensivas en El Alamein y resistieron tenazmente. Ambos bandos se enfrentaron en feroces batallas sin obtener una victoria decisiva, lo que condujo a un punto muerto en la campaña del norte de África.
armygroup_event_desc_30=Las fuerzas estadounidenses y británicas desembarcaron simultáneamente en tres puntos estratégicos del norte de África francés, lanzando la Operación Torch, que desestabilizó el régimen colonial francés y representó una amenaza significativa para la línea de defensa occidental de las potencias del Eje.
armygroup_event_desc_31=Montgomery comandó al Octavo Ejército británico para lanzar una contraofensiva total que aplastó a las fuerzas de Rommel, provocando el colapso total de la ofensiva de las potencias del Eje en el norte de África. El impulso de la guerra comenzó a cambiar.
armygroup_event_desc_32=Las fuerzas aliadas lanzaron la Operación Torch, desembarcando en múltiples puntos de Marruecos y Argelia, obligando a las fuerzas francesas de Vichy a contener el fuego. Las potencias del Eje se veían amenazadas por múltiples frentes, y la presión en el frente tunecino aumentó.
armygroup_event_desc_33=Tras la Operación Torch, las fuerzas francesas de Vichy optaron por desertar y unirse a los Aliados, lo que condujo a una rápida expansión del poder de la Francia Libre. Las potencias del Eje se vieron aún más perjudicadas en el norte de África.
armygroup_event_desc_34=Atacadas tanto por el este como por el oeste por las fuerzas aliadas, las fuerzas germano-italianas en Túnez sufrieron numerosas bajas, obligando a cientos de miles de soldados a rendirse. Finalmente, se retiraron de Túnez.
armygroup_event_desc_35=Rommel lideró a las fuerzas blindadas alemanas en un ataque sorpresa contra el Paso de Kasserine, un estratégico paso de montaña, donde las tropas estadounidenses se enfrentaron a su primer combate a gran escala. Debido a fallos de mando, sufrieron graves pérdidas, lo que obligó al frente aliado a retirarse.
armygroup_event_desc_36=Los Aliados cortaron las líneas de suministro del Afrika Korps alemán en el norte de África, lo que provocó una escasez cada vez más grave de combustible y municiones. Como resultado, la capacidad de combate del Korps disminuyó drásticamente y la situación bélica empeoró gradualmente.
armygroup_event_desc_37=Las fuerzas británicas restablecieron con éxito la línea de suministro desde el Canal de Suez hasta la línea del frente. Con la llegada de grandes cantidades de suministros y equipos, la eficacia de combate de las tropas de la línea del frente se recuperó rápidamente.
armygroup_event_desc_38=Los aliados cruzaron el Mediterráneo para montar una operación de desembarco, rompieron rápidamente las líneas defensivas italianas y capturaron toda la isla de Sicilia, dejando expuesto el flanco sur de las potencias del Eje y marcando el comienzo de la campaña en suelo italiano.
armygroup_event_desc_39=En un esfuerzo por apoyar a las fuerzas italianas después de su derrota en los Balcanes, el ejército alemán lanzó la Operación Marita, con el objetivo de lanzar una ofensiva relámpago contra Grecia y Yugoslavia y, en última instancia, tomar el control de toda la península balcánica.
armygroup_event_desc_40=Los paracaidistas alemanes lanzaron un feroz asalto sobre Creta y, a pesar de encontrar una intensa resistencia, finalmente capturaron toda la isla, aunque con grandes pérdidas.



