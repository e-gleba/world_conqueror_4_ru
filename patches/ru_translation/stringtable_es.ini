event_stage_intro_20601=El ejército alemán en Stalingrado está al límite de sus fuerzas. Cada edificio es nuestra fortaleza y baluarte, ¡esta heroica ciudad ha repelido los ataques alemanes más feroces! Nuestras tropas se están concentrando y nuestra fuerza y la del enemigo se han revertido. Se acerca el momento del contraataque.
event_stage_intro_20602=Los alemanes han retomado Járkov. Los servicios de inteligencia indican que están reuniendo un gran número de unidades blindadas con la intención de lanzar una ofensiva masiva para eliminar a nuestros defensores en el saliente de Kursk. Construiremos varias líneas defensivas fuertes y colocaremos grandes cantidades de tropas en estas profundidades defensivas para tomar a los alemanes por sorpresa.
event_stage_intro_20603=Los alemanes están continuamente fortificando ambos lados del Dniéper, pero nunca se completará pronto una línea de defensa masiva. Aprovechen esta oportunidad para lanzar una gran ofensiva en el Bajo Dniéper para tomar Kiev y continuar la línea hacia el oeste. Tengan cuidado con los contraataques alemanes y salven la fuerza principal de la ofensiva.
event_stage_intro_20604=Las tropas enemigas se han concentrado alrededor de Leningrado y la heroica ciudad, asediada durante casi tres años, está a punto de ser completamente liberada. Pero los alemanes han establecido una fuerte línea de defensa en el oeste. Es necesario lanzar una ofensiva para derrotar al Grupo de Ejércitos Norte y abrir el camino para un avance hacia el oeste.
event_stage_intro_20605=Crimea tiene un gran valor militar tanto para los alemanes como para nosotros. Al atravesar las defensas que tenemos delante, podremos aislar toda Crimea por tierra y al mismo tiempo lanzar un ataque desde el norte y el este de la península de Kerch. La derrota del enemigo es sólo cuestión de tiempo y la fortaleza de Sebastopol eventualmente será recapturada.
event_stage_intro_20606=Después de las ofensivas de Kursk, el Bajo Dniéper y Crimea, el Grupo de Ejércitos Centro ha quedado expuesto. Al mismo tiempo, los alemanes, engañados por nuestras acciones trampa, han redesplegado algunas de sus fuerzas al Grupo de Ejércitos Norte de Ucrania, en el sur. ¡Se han reunido tropas y ahora es el momento de atacar en todos los frentes y hacer que el enemigo pague por la locura que cometió hace tres años!
event_stage_intro_20607=Los aliados en el frente occidental están retenidos frente al Rin y los alemanes están concentrando sus últimas fuerzas en el frente oriental en preparación para una lucha a muerte. Pero el enemigo ha perdido todas sus fuerzas de élite, por lo que avanzaremos rápidamente hacia el oeste para unirnos a los aliados en el frente occidental lo antes posible. El destino de Berlín está sellado.
event_stage_intro_20611=El ejército alemán en Stalingrado está al límite de sus fuerzas. Cada edificio es nuestra fortaleza y baluarte, ¡esta heroica ciudad ha repelido los ataques alemanes más feroces! Nuestras tropas se están concentrando y nuestra fuerza y la del enemigo se han revertido. Se acerca el momento del contraataque.
