event_intro_401=La Batalla de Midway fue un punto de inflexión en la Guerra del Pacífico. El 4 de junio de 1942, los japoneses y los estadounidenses libraron una batalla decisiva en las aguas al noroeste de la Isla Midway. Como se había descifrado el código de comunicación inalámbrica japonés, las fuerzas estadounidenses formularon rápidamente un plan de contramedidas, que, a un costo menor, causó que los japoneses sufrieran más pérdidas humanas. Cuatro portaaviones, incluido el Akagi, fueron hundidos, y desde entonces los japoneses perdieron su dominio estratégico en el Pacífico.
event_intro_402=Los Aliados lanzaron oficialmente las operaciones de desembarco el 6 de junio de 1944. Con la cooperación de diversas operaciones de engaño, bombardeo de buques de guerra, bombardeo de la fuerza aérea y operaciones aerotransportadas, cerca de 160,000 soldados cruzaron el Canal de la Mancha. Hicieron desembarcos en cinco cabezas de playa en la zona de Normandía. La Operación Overlord se lanzó oficialmente y sentó las bases para la victoria aliada.
event_intro_403=Italia declarar la guerra a Gran Bretaña y Francia el 10 de junio de 1940 y envió 300,000 tropas para atacar los Alpes y Niza. Sin embargo, el ejército italiano detuvo su avance inmediatamente después de encontrar una fuerte resistencia de los franceses en la parte sur de las líneas Alpinas y Maginot.
event_intro_404=El 15 de junio de 1941, para levantar el asedio de Tobruk por parte de las fuerzas del Eje, los británicos organizaron una vez más la ocupación de Cirenaica. Los británicos desplegaron una gran cantidad de fuerzas aéreas para suprimir a la fuerza aérea alemana y las líneas de transporte, pero la operación no logró tomar las posiciones alemanas; en cambio, las unidades blindadas sufrieron grandes pérdidas y fueron rodeadas por los contraataques alemanes. Después de una difícil retirada, terminó en un fracaso.
event_intro_405=Cubiertas por el fuego naval, las fuerzas estadounidenses lanzaron una operación de desembarco en Saipán el 15 de junio de 1944. Las fuerzas japonesas en la isla se negaron a rendirse, ofrecieron una feroz resistencia y lanzaron un ataque kamikaze de último minuto. El ejército estadounidense también pagó un alto precio por la victoria.
event_intro_406=La batalla fue una gran batalla de cerco en la primera fase de la Operación Barbarroja. Alemania inició la ofensiva el 22 de junio de 1941, con el Grupo de Ejércitos Centro atacando a lo largo del eje Białystok-Minsk-Smolensk hacia Moscú. El avance a alta velocidad de las fuerzas blindadas alemanas resultó en el cerco de un gran número de tropas soviéticas. Sin embargo, los soviéticos sitiados persistieron en su resistencia y alrededor de 250,000 escaparon del cerco.
event_intro_407=Esta batalla marca una ofensiva crucial en la primera fase de la Operación Bagration. El 25 de junio de 1944, el 1er Frente Báltico y el 3er Frente Bielorruso soviéticos cercaron con éxito a las fuerzas alemanas en Vítebsk. Las líneas de defensa alemanas no resistieron mucho tiempo, y tanto Vítebsk como Orsha fueron liberadas, allanando el camino para el progreso fluido de la Operación Bagration.
event_intro_408=El 28 de junio de 1942, la Unión Soviética desplegó fuerzas de reserva para reforzar Vorónezh y interceptar a los refuerzos alemanes que se dirigían hacia Stalingrado. Se libró una feroz batalla en Vorónezh, con las fuerzas alemanas ocupando finalmente la ciudad. Sin embargo, la Unión Soviética ganó tiempo valioso, lo que permitió fortificar las defensas en Stalingrado.
event_intro_409=La Primera Batalla de El Alamein fue una guerra de desgaste. El 1 de julio de 1942, el Afrika Korps de Rommel inició el ataque, pero no logró romper las defensas de El Alamein. Posteriormente, los británicos lanzaron una contraofensiva, lo que llevó a repetidos enfrentamientos en múltiples lugares, resultando en un punto muerto. El plan alemán de capturar Alejandría fue frustrado.
event_intro_410=El 6 de julio de 1941, debido al éxito inicial de la Operación Barbarroja, las fuerzas alemanas hicieron avances significativos a través de las llanuras de Europa del Este con poca resistencia. Mientras tanto, después de reveses iniciales, la Unión Soviética designó a Semión Timoshenko para organizar una nueva línea defensiva en Smolensk, lanzando contraataques para debilitar la ofensiva alemana. Sin embargo, no pudieron detener a las fuerzas alemanas de avanzar hacia Moscú.
event_intro_411=El 9 de julio de 1943, con el objetivo de liberar las rutas marítimas del Mediterráneo, facilitar la caída de Mussolini y desviar la fuerza de las tropas alemanas del Frente Oriental, las Fuerzas Aliadas, lideradas por Estados Unidos y Gran Bretaña, lanzaron un asalto anfibio sobre Sicilia. Con preparativos exhaustivos en marcha, la operación logró todos sus objetivos. Aunque las fuerzas alemanas se retiraron con éxito, no pudieron evitar la caída de Mussolini.
event_intro_412=Esta batalla fue la confrontación más brutal durante la Batalla de Kursk. Con una abrumadora superioridad numérica, las fuerzas soviéticas lanzaron una ofensiva el 12 de julio de 1943 contra el saliente alemán cerca de Orel. Ante el riesgo de ser rodeadas por las fuerzas soviéticas, las tropas alemanas finalmente abandonaron el saliente. La Unión Soviética recapturó Orel, recuperando la iniciativa estratégica en la región.
event_intro_413=Esta batalla fue una batalla de cerco en la tercera fase de la Operación Barbarroja. El Grupo de Ejércitos Sur alemán se acercó a Ucrania desde tres direcciones, con formaciones blindadas avanzando hacia el sur de Kiev y el norte de Uman. Capturaron Berdýchiv el 15 de julio de 1941. Debido a un error de juicio soviético sobre la dirección de la ofensiva alemana, perdieron la oportunidad de retirarse, lo que resultó en la captura de un gran número de soldados.
event_intro_414=Tras los desembarcos en Normandía, las fuerzas aliadas enfrentaron una feroz resistencia del ejército alemán en Caen. El 18 de julio de 1944, el ejército británico y canadiense lanzó la Operación Goodwood, iniciando una ofensiva hacia las posiciones defensivas alemanas al sur de Caen. Sin embargo, los alemanes, utilizando el terreno favorable y una potencia de fuego superior, infligieron grandes pérdidas a las unidades blindadas aliadas. Después de sufrir pérdidas significativas, la operación se vio obligada a detenerse.
event_intro_415=El 21 de julio de 1942, después del fracaso de la Batalla del Mar del Coral, las fuerzas japonesas estaban decididas a capturar Port Moresby mediante un avance por tierra para lograr su objetivo estratégico de ocupar la ciudad y cortar las conexiones navales y aéreas entre Estados Unidos y Australia. Las fuerzas australianas inicialmente lucharon para defenderse contra el ejército japonés, superior en número y mejor equipado. Sin embargo, con la ventaja del terreno y la asistencia del ejército estadounidense, finalmente obligaron a los japoneses a retirarse de Kokoda.
event_intro_416=Para romper las defensas alemanas en Normandía, los Aliados lanzaron múltiples operaciones de apoyo, desviando la mayoría de las reservas blindadas alemanas hacia las líneas británicas y canadienses. El 25 de julio de 1944, las fuerzas aliadas concentraron su fuerza cerca de Saint-Lô y lanzaron un poderoso asalto contra las tropas alemanas. Debido a factores como la escasez de personal, la falta de equipo y la baja moral, las fuerzas alemanas no pudieron montar una contraofensiva efectiva, lo que resultó en el colapso total de las defensas occidentales en Normandía.
event_intro_417=Aprovechando el éxito de la Operación Cobra, los Aliados lanzaron la Operación Bluecoat el 30 de julio de 1944, tomando la iniciativa durante la retirada de las unidades blindadas alemanas. Las fuerzas británicas efectivamente contuvieron y desgastaron a las fuerzas blindadas alemanas en el lado oriental del frente, contribuyendo a las derrotas posteriores de los contraataques alemanes y al cerco de las tropas alemanas en el Bolsón de Falaise.
event_intro_418=El 3 de agosto de 1943, la Unión Soviética inició una ofensiva contra el flanco norte del Grupo de Ejércitos Sur alemán, con el objetivo de recapturar las regiones de Bélgorod y Járkov. A pesar de enfrentarse a una enorme fuerza soviética, el ejército alemán logró retirarse con éxito, y Járkov cambió de manos una vez más. La derrota alemana en la Batalla de Kursk también resultó en la pérdida completa de la iniciativa estratégica en el Frente Oriental.

event_intro_419=Esta fue la primera gran ofensiva terrestre aliada contra el Imperio del Japón en el Teatro del Pacífico. El 7 de agosto de 1942, las fuerzas aliadas desembarcaron en las islas de Guadalcanal, Tulagi y Florida en el sur de las Islas Salomón. Superados en número y abrumados por los aliados, los defensores japoneses hicieron varios intentos de retomarlos, pero finalmente no tuvieron éxito.
event_intro_420=Después de capturar Caen, en un esfuerzo por perturbar las líneas alemanas y cortar su retirada, en las primeras horas de la mañana del 8 de agosto de 1944, los canadienses rompieron las defensas alemanas, capturaron posiciones clave en lo profundo de las líneas y finalmente se detuvieron a siete millas al norte de Falaise.
event_intro_421=La Batalla de Falaise fue la batalla decisiva de la Campaña de Normandía en la Segunda Guerra Mundial. Entre el 12 y el 21 de agosto de 1944, los aliados destruyeron la mayor parte del Grupo de Ejércitos B al oeste del río Sena a través del cerco, capturaron a más de 50 mil prisioneros y abrieron el camino a París y la frontera franco-alemana...
event_intro_422=El 15 de agosto de 1944, para solucionar el problema del abastecimiento de las fuerzas aliadas tras el desembarco de Normandía, los aliados decidieron reactivar la Operación Dragoon para acceder a los puertos del sur de Francia. En esta operación, los aliados liberaron la mayor parte del sur de Francia en sólo cuatro semanas, causando numerosas bajas a los alemanes y provocando que el Grupo de Ejércitos G retrocediera hasta una línea en la Cordillera de los Vosgos.
event_intro_423=El 19 de agosto de 1942, para comprobar la viabilidad de los desembarcos y recopilar información de inteligencia, los aliados llevaron a cabo una operación de desembarco exploratoria, que encontró una fuerte resistencia alemana: la tasa de bajas de las fuerzas de desembarco llegó al 68% y sólo una unidad reunió brevemente una pequeña cantidad de inteligencia militar. La batalla fue vista posteriormente como un asalto anfibio desastroso, pero el resultado de la misma proporcionó lecciones para ambos bandos que influyeron profundamente en el posterior desembarco de Normandía.
event_intro_424=La Batalla de Kiev fue una batalla de cerco a gran escala durante la Segunda Guerra Mundial. Del 23 de agosto al 26 de septiembre de 1941, el ejército alemán concentró la fuerza militar del Grupo de Ejércitos Centro y Sur para completar el cerco de Kiev con el mayor número de personas de la historia. Después de la guerra, los alemanes aniquilaron a 700 mil soldados soviéticos con una pérdida de 100 mil hombres, lo que más tarde fue evaluado como "la mayor victoria del ejército alemán en el frente oriental y el mayor desastre militar del Ejército Rojo".
event_intro_425=Tallin, la base principal de la Flota del Báltico, cayó rápidamente en los primeros días de la Operación Barbarroja debido a un error de juicio del mando soviético. El 27 de agosto de 1941, los defensores restantes de Tallin tuvieron que ser evacuados a Leningrado abordando barcos bajo fuego. En un intento por impedir la retirada soviética, Alemania y Finlandia bloquearon el Golfo de Finlandia con sus flotas, minas y fuerzas aéreas, lo que provocó la destrucción de más de 50 barcos y más de 10 mil bajas, pero finalmente, la mayoría de los barcos de la Flota del Báltico llegó a Kronstadt y participó en la defensa de Leningrado.
event_intro_426=La batalla fue la última ofensiva a gran escala iniciada por las fuerzas del Eje en el teatro de operaciones del norte de África. El 30 de agosto de 1942, Rommel lanzó un ataque contra el 8.º Ejército en la cresta Alam el Halfa para evitar perder toda esperanza de victoria debido a suministros desfavorables. Sin embargo, los británicos descubrieron el plan de batalla de antemano y Montgomery lo utilizó para hacer un arreglo táctico especializado que acabó por completo con la última esperanza de Rommel. Después de esta batalla, las fuerzas africanas de las potencias del Eje perdieron la iniciativa y ya no fue posible realizar sus objetivos estratégicos en África.
event_intro_427=Esta batalla marcó el comienzo de la Segunda Guerra Mundial. El 1 de septiembre de 1939, después de que la Unión Soviética y Alemania firmaran en secreto el Pacto de No Agresión, el ejército alemán invadió descaradamente Polonia y rápidamente derrotó al ejército defensor. Dieciséis días después, la Unión Soviética respondió al ejército alemán y ocupó el este de Polonia. Debido a la enorme desventaja en equipamiento y poder militar, Polonia finalmente se dividió rápidamente entre la Unión Soviética y Alemania y el gobierno polaco se exilió.
event_intro_428=El 3 de septiembre de 1943, tras ganar en el desembarco en Sicilia, los aliados continuaron su ataque a la Italia continental. Estimando que los alemanes centrarían sus defensas al sur de Tarento, los aliados planearon una finta al sur de Tarento mientras la fuerza principal desembarcaba en Salerno para tomar el control de Nápoles. Sin embargo, los alemanes consideraron que Nápoles era más importante, lo que dificultó los desembarcos aliados. Al final, los aliados lograron tomar el control del sur de Italia, incluido Salerno, pero no lograron capturar Nápoles.
event_intro_429=Esta batalla fue el comienzo de la Campaña del Desierto Occidental. Italia había planeado previamente invadir Egipto a lo largo de la costa para capturar el Canal de Suez, pero después de muchos retrasos, la ofensiva se redujo a un avance hacia Sidi Barrani. El 9 de septiembre de 1940, las fuerzas italianas atacaron, avanzando hacia el objetivo en una semana y tomar posiciones allí para acumular suministros y esperar el próximo ataque.
event_intro_430=El 14 de septiembre de 1944, en un esfuerzo por liberar Estonia, Letonia y Lituania, los aliados lanzaron una enorme ofensiva estratégica en la región del Báltico, que incluyó cuatro batallas históricas, como las de Riga y Tallin. Las fuerzas alemanas en la región resistieron obstinadamente la ofensiva, pero sufrieron grandes pérdidas y finalmente fueron rodeadas en Curlandia.
event_intro_431=El 17 de septiembre de 1944, en un intento de evitar la Línea Sigfrido e invadir la zona industrial del Ruhr, los aliados enviaron un gran número de tropas aerotransportadas a los Países Bajos junto con un avance terrestre británico en un intento de capturar el puente de Eindhoven a Arnhem y abrir el camino para una operación de seguimiento. Sin embargo, debido a un plan demasiado ambicioso y a problemas con la coordinación de fuerzas, los aliados avanzaron 70 millas pero no lograron capturar Arnhem.
event_intro_432=La Batalla del bosque de Hütgen fue la batalla más larga en la historia militar de los Estados Unidos y duró desde el 19 de septiembre de 1944 hasta el 10 de febrero del año siguiente. Intentando contener a los alemanes para evitar que se reforzaran en la Batalla de Aquisgrán, el ejército estadounidense lanzó un ataque contra el bosque de Hütgen. Sin embargo, los alemanes lograron frenar el avance aliado para proteger la presa del Ruhr, causando muchas bajas. Las pérdidas estadounidenses ascendieron a al menos 33 mil y las alemanas a 28 mil. La batalla fue tan costosa que se describió como una "gran derrota" para los aliados.
event_intro_433=La Batalla de Dakar fue un intento fallido de los aliados del 23 al 25 de septiembre de 1940 para capturar el estratégico puerto de Dakar en el África occidental francesa. El general de Gaulle creyó que podía convencer a los franceses de Vichy en Dakar para que cambiaran su posición, pero el gobernador de Dakar se negó rotundamente, lo que finalmente desencadenó la batalla. Los aliados no lograron ganar después de varios ataques y finalmente optaron por retirarse.
event_intro_434=La Batalla de Metz se refiere a los feroces combates entre el 1.er Grupo de Ejércitos alemán y el 3.er Grupo de Ejércitos estadounidense alrededor de Metz durante la Segunda Guerra Mundial. Los alemanes resistieron resueltamente, apoyándose en una serie de fuertes y arrastraron a las fuerzas estadounidenses a una agotadora batalla de posiciones. Los combates estadounidenses aquí duraron del 27 de agosto al 13 de diciembre de 1944 y finalmente obligaron a los alemanes en el área de Metz a rendirse.
event_intro_435=La Batalla de Briansk, que comenzó el 30 de septiembre de 1941, fue una importante operación alemana en el Plan Barbarroja para rodear y destruir el Frente Briansk del Ejército Rojo soviético y despejar el camino para un ataque a Moscú. Los alemanes obtuvieron una victoria táctica, pero los soviéticos resistieron y lograron retrasar el ataque alemán, ganando tiempo para la defensa de Moscú.
event_intro_436=El 2 de octubre de 1944, para activar el puerto de Amberes y asegurar los suministros aliados, los aliados llevaron a cabo una serie de operaciones militares para despejar el 15º Grupo de Ejércitos alemán que controlaba la desembocadura del Escalda. Sin embargo, las fuerzas alemanas en la zona recibieron apoyo ya que los aliados se habían centrado previamente en otras operaciones. Al final, se necesitó 1 Cuerpo canadiense y 20.873 bajas aliadas para limpiar el Escalda de fuerzas enemigas.


dialogue_2712=Aniquilen las fuerzas enemigas, ¡nuestro objetivo es Moscú!
dialogue_2713=¡Camardas, Moscú está justo detrás de nosotros! ¡Debemos expulsar completamente al enemigo!
dialogue_2714=Comandante, diversas fuerzas enemigas se están concentrando cerca de Lépiel. Se están acercando a nuestros sistemas de defensa antitanque.
dialogue_2715=Aunque la contraofensiva en Lepel fracasó, ¡lucharemos hasta el final!
dialogue_2716=Vítebsk ha sido capturada y el 3er Ejército de Tanques de la Guardia puede ayudarnos a cercar Smolensk.
dialogue_2717=La línea de defensa de Mozháisk ha sido penetrada. ¡Prepárense para asaltar Smolensk!
dialogue_2718=¡Felicidades por la destacada victoria! Comandante, solicitamos la cooperación del 3er Ejército de Tanques de la Guardia para cercar Smolensk.
dialogue_2719=¡Soldados, marchen rápidamente y ocupen Kokoda!
dialogue_2720=¡Soldados, por la seguridad de Port Moresby, debemos mantenernos en Kokoda! ¡Se seguirán lanzando suministros continuamente desde la retaguardia!
dialogue_2721=Controlen las áreas circundantes y abran el camino hacia Port Moresby.
dialogue_2722=Un apoyo más fuerte está en camino; ¡retomemos Kokoda!
dialogue_2723=¡Han llegado refuerzos! ¡Luchen con todas sus fuerzas, soldados! ¡Más refuerzos seguirán llegando!
dialogue_2724=Según el plan, nuestras fuerzas y el ejército británico desembarcarán cerca de Licata y Siracusa para controlar los aeródromos del sur. De sur a norte, avanzaremos paso a paso según corresponda, ¡y la victoria será nuestra!
dialogue_2725=¡Soldados! A pesar de la desfavorable brisa fuerte para el desembarco, es aún menos probable que el enemigo anticipe nuestro ataque. ¡Por el rey y la patria!
dialogue_2726=La línea del frente ha colapsado y necesitamos prepararnos para una evacuación desde Mesina para preservar nuestra fuerza.
dialogue_2727=La costa sur ha sido despejada y se han entregado suministros a lo largo de la costa.
dialogue_2728=Comandante, en esta operación, es difícil para nuestras fuerzas obtener suministros desde el área ocupada. Por favor, priorice la captura de Licata para asegurar apoyo.
dialogue_2729=Comandante, solicito un ataque inmediato en Mesina para cortar la retirada de las fuerzas del Eje.
dialogue_2730=Soldados, nuestro equipo ha sido mejorado y nuestra fuerza aérea ha suprimido la fuerza aérea enemiga y sus líneas de suministro. ¡La victoria es segura en esta batalla!
dialogue_2731=Nuestras reservas son insuficientes; debemos esperar el momento adecuado para asestar un golpe fatal.
dialogue_2732=¡Ha llegado el momento! Asalten el flanco izquierdo del enemigo y prepárense para cercarlos.
dialogue_2733=Continúen el asalto, amplíen nuestras ganancias militares y levanten el asedio de Tobruk.
dialogue_2734=Soldados, avancen rápidamente y eliminen las fuerzas soviéticas tanto en el norte como en el sur de Białystok, ¡cercándolas!
dialogue_2735=Camaradas, los vergonzosos invasores alemanes han entrado en nuestro país. ¡Expúlsenlos por nuestra patria y por la Unión Soviética!
dialogue_2736=Continúen el avance en Baránavichi y prepárense para cercar Minsk. ¡Muevanse rápidamente, antes de que puedan reorganizar sus defensas!
dialogue_2737=Camaradas, contraigan la línea defensiva. Reorganicen nuestro frente con Minsk como núcleo.
dialogue_2738=El Estado Mayor del Alto Mando Supremo ordena al Frente Suroeste: Mientras se aseguran la seguridad, hagan todo lo posible para neutralizar la ofensiva alemana y sostener la línea del río Dniéper a toda costa.
dialogue_2739=La fuerza del ejército soviético nos supera en número. Primero, eliminemos su fuerza militar efectiva, ¡luego rompamos su línea de defensa!
dialogue_2740=El Estado Mayor del Alto Mando Supremo ordena al Frente Suroeste contraer la línea del frente, evitar ser cercado y defender a lo largo de la línea de defensa del río Dniéper.
dialogue_2741=Las fuerzas enemigas están retirándose del cerco. ¡Actúen rápidamente y elimínenlas!
dialogue_2742=De acuerdo con las órdenes del Alto Mando, liberemos Járkov y aniquilemos al 4º Ejército Panzer y al Destacamento de Ejército Kempf.
dialogue_2743=Mantengan la vigilancia y conserven fuerzas. Prepárense para la próxima ofensiva para destrozar por completo las fuerzas soviéticas.
dialogue_2744=¡Ataquen Bohodújiv y cercen Khárkov!
dialogue_2745=¡Maldición! Hubo un error de estimación con respecto a las fuerzas soviéticas. Las tropas defensoras en Járkov se han retirado rápidamente a la línea del río Dniéper.
dialogue_2746=Las principales fuerzas del ejército francés están retrocediendo ante el avance de las unidades blindadas alemanas. Se ha redistribuido un número significativo de fuerzas de reserva hacia el norte. Ahora es el momento oportuno para lanzar una ofensiva a gran escala.
dialogue_2747=Continúen avanzando a lo largo de la costa y lancen un ataque hacia Niza.
dialogue_2748=El ejército japonés no tiene posibilidad de victoria, pero tampoco se rendirá. Debemos mantenernos vigilantes hasta que toda la isla esté ocupada.
dialogue_2749=La ofensiva del ejército alemán ha fracasado por completo y nuestra liberación es inminente.
dialogue_2750=Rodeen a las fuerzas alemanas en el saliente y liberen Vítebsk y Orsha.
dialogue_2751=La línea defensiva alemana está colapsando gradualmente y estamos a punto de abrir el camino hacia Minsk.
dialogue_2752=No se demoren demasiado. Rompan rápidamente las líneas defensivas soviéticas y avancen hacia Stalingrado.
dialogue_2753=Intercepten a las fuerzas alemanas y eviten que crucen la zona defensiva sin esfuerzo.
dialogue_2754=El ejército soviético está colapsando. Concentren nuestras fuerzas y rompan las defensas enemigas.
dialogue_2755=El ejército británico ha fortificado sus posiciones en la región de El Alamein, obstruyendo efectivamente la ruta de avance hacia Alejandría.
dialogue_2756=Tenemos la ventaja en suministros. Retrasen la ofensiva alemana y estén preparados para lanzar una operación de contraataque en cualquier momento.
dialogue_2757=Nuestro avance está siendo obstaculizado y hemos sido arrastrados a una guerra de desgaste.
dialogue_2758=Los alemanes anticiparon nuestro ataque, pero resultó inútil.
dialogue_2759=Utilicen nuestra superioridad numérica y lancen ofensivas implacables para romper las defensas enemigas como una marea.
dialogue_2760=Las fuerzas soviéticas han lanzado una ofensiva a gran escala contra nosotros. Una vez que nuestras defensas sean superadas, ¡las tropas en Orel podrían quedar rodeadas en cualquier momento!
dialogue_2761=El número del enemigo es abrumador. Debemos retirarnos en dirección a Brýansk.
dialogue_2762=Las posiciones alemanas en la parte sur de Caen representan la mayor barrera para nuestro avance. Bajo un bombardeo aéreo tan intenso, será difícil para el enemigo organizar contraataques efectivos.
dialogue_2763=¡Lancen una ofensiva a gran escala y ataquen las posiciones enemigas en todas las áreas al sur de Caen!
dialogue_2764=No teman a las fuerzas blindadas aliadas; los tanques enemigos no son rival para nosotros. Prepárense rápidamente para la defensa.
dialogue_2765=La fuerza defensiva alemana ha sido restringida y debilitada. Busquen brechas en las posiciones enemigas y concentren nuestras fuerzas para abrir por completo su línea defensiva.
dialogue_2766=Las fuerzas de reserva disponibles están disminuyendo; debemos confiar en nuestras fuerzas existentes para contener al grupo blindado aliado.
dialogue_2767=Las principales fuerzas alemanas están colapsando. No pasará mucho tiempo antes de que liberemos toda Normandía y avancemos hacia la frontera alemana.
dialogue_2768=Los estadounidenses han lanzado la Operación Cobra. Nuestra tarea es coordinarnos con ellos y avanzar hacia el sur, manteniendo el flanco oriental del ejército alemán ocupado.
dialogue_2769=Hagan buen uso de minas terrestres y estructuras defensivas para detener el avance de las fuerzas aliadas.

