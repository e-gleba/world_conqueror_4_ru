;噩梦关规则
operation_nightmare_rule_1=1.La campaña del evento está abierta por tiempo limitado. Se sugiere a los comandantes programar el tiempo de manera razonable para obtener recompensas al pasar etapas.
operation_nightmare_rule_2=2.En la campaña en la dificultad pesadilla las fuerzas enemigas obtendrán 4 beneficios (Ambos aleatorios desde que comience el evento hasta que termine), así que, compañeros comandantes, por favor, planeen su ruta cuidadosamente cuando estén desafiando una campaña de dificultad Pesadilla.
operation_nightmare_rule_3=3.En esta dificultad de la campaña, los generales que sean eliminados en cada escenario no podrán ser desplegados en el siguiente, solamente al reiniciar el progreso podrán desplegar esos generales nuevamente.
operation_nightmare_rule_4=4.Después de lograr la victoria en una etapa, se registrará el resultado victorioso más alto en la dificultad actual. El pasar el nivel específico puede recibir recompensas de sección.
operation_nightmare_rule_5=5.El restablecer el progreso eliminará el progreso de la campaña en la actual dificultad.

defensive_nightmare_rule_1=1.La campaña del evento está abierta por tiempo limitado. Se sugiere a los comandantes programar el tiempo de manera razonable para obtener recompensas al pasar etapas.
defensive_nightmare_rule_2=2.En la campaña en la dificultad pesadilla las fuerzas enemigas obtendrán 4 beneficios (Ambos aleatorios desde que comience el evento hasta que termine), así que, compañeros comandantes, por favor, planeen su ruta cuidadosamente cuando estén desafiando una campaña de dificultad Pesadilla.
defensive_nightmare_rule_3=3.No importa la derrota o la victoria en la etapa, se registrarán los turnos más altos de defensa actuales. Al lograr ciertos turnos de defensa puede reclamar la recompensa de la sección respectiva (Todos los premios de fase se desbloquearán si se elimina a todas las tropas enemigas).
defensive_nightmare_rule_4=4.El escenario se puede jugar repetidamente, pero abandonar durante la batalla del escenario no registrará los turnos de defensa más altos actuales.

