event_stage_intro_20814=¡La Operación Fortitude ha funcionado con éxito y las fortificaciones alemanas en Normandía aún no se han completado! Además, no se ha encontrado ninguna potencia de fuego pesada enemiga en las playas doradas frente a nosotros. ¡La oportunidad está a la mano! Despejaré rápidamente una cabeza de playa para allanar el camino para un desembarco amistoso. ¡Este es el momento en que lucharemos juntos y nos embarcaremos en el viaje para recuperar la victoria!
event_stage_intro_20815=¿Por qué los alemanes todavía tienen tantas tropas para organizar un ataque masivo? Los defensores de Bastoña están atrapados en un cerco con poca posibilidad de retirada. A menos que los refuerzos puedan anticipar los movimientos del enemigo y apoyarnos a tiempo, solo podemos depositar nuestra última esperanza en los británicos.
event_stage_intro_20816=La guerra ha reescrito por completo el panorama mundial y los dos polos de Estados Unidos y la Unión Soviética se han convertido en las nuevas potencias hegemónicas. Las colonias ganaron su independencia, el imperio se hunde y la gloria y el esplendor del pasado quedaron atrás. Tarde o temprano, bajo el nuevo gobierno, nos convertiremos en un vasallo de Estados Unidos. Sin embargo, una nueva amenaza comenzó a asomar, los soviéticos se han apoderado del este de México y están avanzando hacia el norte por tierra con la intención de invadir los Estados Unidos. La guerra de esta nueva era ha comenzado y debemos tener un ejército propio para defender los últimos vestigios de la dignidad imperial.
event_stage_intro_20817=El descubrimiento de reliquias atrajo la atención tanto de los Estados Unidos como de la Unión Soviética al mismo tiempo. Estas armas y tecnologías trascendentales son suficientes para poner el mundo patas arriba y ahora ambas potencias están en movimiento. Sin embargo, guiados por una señal misteriosa, nuestro equipo avanzado tomó ventaja y descubrió un grupo de ruinas en Sudamérica. Quienquiera que sean esas personas, sus propósitos parecen ser los mismos que el mío: romper el patrón existente y restablecer un orden mundial completamente nuevo.


