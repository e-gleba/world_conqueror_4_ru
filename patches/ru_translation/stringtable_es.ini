dialogue_3199=¡Iniciar operaciones! Debemos controlar Dinamarca y ocupar los puertos estratégicos de Noruega antes de que los británicos reaccionen.
dialogue_3600=¡La flota zarpa; el puerto debe quedar bajo nuestro control!
dialogue_3601=Dinamarca se ha rendido. ¡Todas las unidades mantengan alerta y avancen hacia Noruega!
dialogue_3602=El ataque británico no fue aislado. ¡Defiendan Narvik a toda costa!
dialogue_3603=Los británicos no permitirán que tomemos puertos libres de hielo. ¡Prepárense para defender!
dialogue_3604=He hecho todo lo posible. Ojalá repelamos al enemigo.
dialogue_3605=Tenemos la ruta más corta a Berlín. ¡La gloria de capturarla es nuestra!
dialogue_3606=¡Ruta corta, lucha dura! ¡Podríamos ser los primeros en tomar Berlín!
dialogue_3607=Mi división blindada despejará obstáculos en el norte para la fuerza principal.
dialogue_3608=El frente colapsó. Ahora solo salvo vidas.
dialogue_3609=¡Defensores de Berlín: El Führer ha muerto! ¡Cesen el fuego y eviten más sacrificios inútiles!
dialogue_3610=Su misión es escoltar al Coronel Doolittle hasta el punto de despegue. Una vez que los bombarderos despeguen, ¡la flota se retirará a toda velocidad! ¡No se enfrenten a las fuerzas japonesas! ¡No pierdan ni un segundo!
dialogue_3611=Las fuerzas japonesas han avistado la flota; ¡debemos actuar con rapidez! ¡Escuadrón de bombarderos, atención! ¡Aborden los aviones de inmediato!
dialogue_3612=Todo el Escuadrón Doolittle ha sido desplegado; ¡retírense inmediatamente!
dialogue_3613=Las fuerzas enemigas han perdido flexibilidad estratégica y la campaña ha entrado en su fase final. Órdenes a todas las unidades: Reduzcan la profundidad de las defensas enemigas; primero hay que asediar Túnez y luego capturar Bizerta.
dialogue_3614=En nombre del Afrika Korps, me rindo ante las Fuerzas Aliadas.
dialogue_3615=No es necesario continuar la ofensiva; en nombre del 1er Ejército italiano, acepto vuestra propuesta de rendición incondicional.
dialogue_3616=No podemos permitir que el Eje acumule fuerzas en el mar Egeo. Es necesario desplegar fuerzas especiales para asaltar la guarnición de la isla y destruir los puestos de observación naval y las estaciones de radio.
dialogue_3617=Los Aliados han desplegado recientemente operaciones a gran escala cerca de la costa de Devon. Los S-Boots alemanes realizarán un reconocimiento armado, sorteando las defensas del Canal.
dialogue_3618=La armada japonesa ya no representa una amenaza. ¡Liberen Borneo y recuperen sus aeródromos y yacimientos petrolíferos!
dialogue_3619=Vicealmirante Inoue, estos tres grupos de portaaviones están bajo su mando para ejecutar la Operación MO. ¡Asegúrese de que las fuerzas de desembarco lleguen a Puerto Moresby!
dialogue_3620=La inteligencia indica que los japoneses planean atacar Puerto Moresby próximamente. ¡Transfieran de inmediato los cuatro portaaviones hacia el Mar del Coral y asegúrense de frustrar el intento japonés!
dialogue_3621=Según la inteligencia de los aviones de reconocimiento, las principales fuerzas del ataque japonés han sido desplegadas. ¡Ataquen y entierren a los enemigos en el Canal de Jomard!
dialogue_3622=¡Protegeré al Shokaku y Zuikaku, y me aseguraré de que aplasten por completo a todos los enemigos invasores!
dialogue_3623=Grupo de Ejércitos B, llegaron órdenes: ¡Realicen una finta estratégica hacia los Países Bajos para atraer a las principales fuerzas británicas y francesas hacia el norte, a Bélgica, para crear una ventana de oportunidad para que el Grupo de Ejércitos A se involucre en una batalla decisiva!
dialogue_3624=Grupo de Ejércitos A, recibieron órdenes: El Bosque de las Ardenas será el eje principal del ataque. ¡Establezcan un cerco en Flandes y aniquilen a las principales fuerzas aliadas!
dialogue_3625=¡Divisiones Panzer, avancen a toda velocidad! ¡Hay que llegar al Mosa en tres días y forzar un cruce del río al día siguiente!
dialogue_3626=Grupo Norte: entren inmediatamente en Bélgica. Establezcan posiciones de bloqueo. ¡No habrá avance alemán! ¡Resistan a toda costa!
dialogue_3627=Por orden del Mariscal Pétain, Francia ha firmado un armisticio con Alemania. Todas las unidades mantendrán su integridad actual y se desplegarán ordenadamente a las zonas designadas.
dialogue_3628=Esta guerra no ha terminado, mucho menos la resistencia de Francia. ¡Parto hacia Londres para liderar al pueblo francés en este desafío continuo!
dialogue_3629=¡Camaradas! ¡Tomen el saliente de Izium y Vovchansk como eje ofensivo y recuperen Járkov!
dialogue_3630=Atención, Grupo de Ejércitos del Sur: El ejército soviético se está concentrando en gran número en el frente de Járkov, lo que indica un ataque soviético inminente. Realicen preparativos exhaustivos para la defensa.
dialogue_3631=Asalten Izium y coordinen con la 1.ª División de Tanques para cerrar el cerco.
dialogue_3632=
dialogue_3633=La 7ª Brigada Blindada avanzará a lo largo del flanco del desierto, la 22ª Brigada de Guardias encabezará el ataque al Paso de Halfaya y Capuzzo y la Columna Costera capturará Sollum.
dialogue_3634=¡Mantengan la línea y defiendan el Fuerte Capuzzo a toda costa! ¡Reorganizaré inmediatamente las tropas de Tobruk para apoyarlos!
dialogue_3635=Recuperemos el Fuerte Capuzzo y el Paso Halfaya, ¡debemos asegurarnos de que las tropas sitiadoras se vean aliviadas de las posibles amenazas en la retaguardia!
dialogue_3636=Tropas cerca de Capuzzo, retrocedan al paso de Halfaya; no entren en combate con las fuerzas alemanas.
dialogue_3637=Las tropas aerotransportadas tienen como prioridad la toma del aeropuerto objetivo y, después de la ocupación, desplegaremos rápidamente suministros y tropas de refuerzo.
dialogue_3638=¡La Royal Navy bloqueará las aguas circundantes, impidiendo estrictamente el desembarco de buques de transporte enemigos!
dialogue_3639=La 2.ª División Panzer liderará el ataque principal sobre Boulogne; las 1.ª y 10.ª Divisiones Panzer avanzarán por rutas separadas para atacar conjuntamente Calais. ¡Debemos capturar rápidamente los puertos del Canal!
dialogue_3640=A todos los defensores de Calais: ¡Mantengan la ciudad a toda costa durante 48 horas! ¡Cada hora de retraso permitirá que decenas de miles de nuestras fuerzas aliadas evacuen!
dialogue_3641=La Real Fuerza Aérea se ha desplegado, interceptarán las formaciones de bombarderos en picado Stuka para cubrir la evacuación del ejército.
dialogue_3642=Grupos de Ejércitos A y B, reanuden la ofensiva, formen rápidamente un cerco costero y no permitan que el enemigo escape bajo ninguna circunstancia.
dialogue_3643=¿Bélgica se ha rendido? ¡Maldita sea! ¡Acorten inmediatamente la línea defensiva a lo largo del Lye y llenen el hueco que dejó Bélgica!
dialogue_3644=Avancen rápidamente hacia Dunkerque, ¡no permitan que el enemigo escape!
dialogue_3645=¡Primer Cuerpo del Ejército francés, escuchen la orden: ¡Sin retirada ni rendición! ¡Debemos defender nuestra patria!
dialogue_3646=¡Tomen Lille rápidamente! ¡No podemos quedar estancados aquí!
dialogue_3647=¡Debo romper el cerco y continuar defendiendo la nación en otros frentes!
dialogue_3648=¡Lanzad un ataque sorpresa a los puertos enemigos, cortad sus líneas de suministro marítimas y neutralizad su capacidad logística estratégica!

