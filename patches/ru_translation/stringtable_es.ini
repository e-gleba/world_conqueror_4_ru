event_buff_name_28=Estimulación
event_buff_name_29=Provocación

event_buff_desc_27=Al atacar, hay un 30% de probabilidad de aplicar un efecto de radiación a la casilla objetivo que dura 2 turnos. Las tropas en la casilla radiactiva reducen un 10% de sus PV actuales en cada turno.
event_buff_desc_28=Cuando una unidad no está flanqueada, tiene un 80% de probabilidad de eliminar su propio estado de Caos y Desmoralización al comienzo de cada turno.
event_buff_desc_29=Después de atacar, las tropas bajo el mando del general tienen un 20% de probabilidad de activar un efecto que evita que las tropas amigas dentro de 1 hexágono sean el objetivo de las fuerzas terrestres y navales enemigas durante 1 turno.

event_stage_intro_20501=La guerra nunca cambia. Las acciones de los militares estadounidenses han vuelto a alterar el equilibrio en la península. El enemigo ha cruzado la frontera y debemos neutralizar la amenaza inmediata. Organicen las tropas para ayudar a las fuerzas amigas inmediatamente. ¡Utilicen nuestras nuevas armas y hagan que el enemigo pague por su imprudencia!
event_stage_intro_20502=Estados Unidos había unido fuerzas con Japón para tomar el control de las aguas alrededor de Sovetskaya Gavan y la parte sur de Sajalín. Subestimamos la determinación de la invasión estadounidense, pero el enemigo subestimó mucho nuestra fuerza. Cualquiera que desafíe a la Gran Madre Patria está condenado a la destrucción.
event_stage_intro_20503=Las ambiciones de las fuerzas armadas de los Estados Unidos se han hecho evidentes. Por esta razón, hemos desplegado fuerzas de defensa por adelantado en las aguas alrededor de las islas Kuriles en respuesta a la expansión del enemigo. Aprovecha esta oportunidad para acabar con las fuerzas del norte de Japón.
event_stage_intro_20504=La parte meridional de la península de Kamchatka ha sido atacada por las fuerzas estadounidenses. Esto está cerca de las Islas Aleutianas, donde los Estados Unidos limitan con nuestro territorio. El comando ha formulado un plan para atacar Alaska y los planes posteriores no pueden ser interrumpidos por un ataque sorpresa de las tropas estadounidenses.
event_stage_intro_20505=La inteligencia indica que el ejército estadounidense está desarrollando armas nucleares con un mayor rendimiento explosivo. Incluso planean usarlos para crear un puerto de aguas profundas en Alaska. Esta vez nuestro objetivo es el centro de investigación en Anchorage. El área circundante debe ser controlada antes de que el enemigo se retire.
event_stage_intro_20506=Los defensores de Anchorage siguen luchando desesperadamente, pero no podemos romper fácilmente las defensas estadounidenses. A partir de ahora, vigila de cerca los movimientos del enemigo. Al mismo tiempo, ataca tierra adentro, rodea a los defensores en tres lados y corta su retirada.
event_stage_intro_20507=El ejército estadounidense está retrocediendo bajo nuestros ataques. Aunque las líneas de defensa continúan siendo perforadas, el enemigo también está utilizando este tiempo para aumentar sus fuerzas hacia la costa oeste. La batalla final está a punto de comenzar y cualquier obstáculo que se nos presente acabará siendo purgado.
event_stage_intro_20511=La guerra nunca cambia.Las acciones de los militares estadounidenses han vuelto a alterar el equilibrio en la península. El enemigo ha cruzado la frontera y debemos neutralizar la amenaza inmediata. Organicen las tropas para ayudar a las fuerzas amigas inmediatamente. ¡Utilicen nuestras nuevas armas y hagan que el enemigo pague por su imprudencia!
event_stage_intro_20512=Estados Unidos había unido fuerzas con Japón para tomar el control de las aguas alrededor de Sovetskaya Gavan y la parte sur de Sajalín. Subestimamos la determinación de la invasión estadounidense, pero el enemigo subestimó mucho nuestra fuerza. Cualquiera que desafíe a la Gran Madre Patria está condenado a la destrucción.
event_stage_intro_20513=Las ambiciones de las fuerzas armadas de los Estados Unidos se han hecho evidentes. Por esta razón, hemos desplegado fuerzas de defensa por adelantado en las aguas alrededor de las islas Kuriles en respuesta a la expansión del enemigo. Aprovecha esta oportunidad para acabar con las fuerzas del norte de Japón.
event_stage_intro_20514=La parte meridional de la península de Kamchatka ha sido atacada por las fuerzas estadounidenses. Esto está cerca de las Islas Aleutianas, donde los Estados Unidos limitan con nuestro territorio. El comando ha formulado un plan para atacar Alaska y los planes posteriores no pueden ser interrumpidos por un ataque sorpresa de las tropas estadounidenses.
event_stage_intro_20515=La inteligencia indica que el ejército estadounidense está desarrollando armas nucleares con un mayor rendimiento explosivo. Incluso planean usarlos para crear un puerto de aguas profundas en Alaska. Esta vez nuestro objetivo es el centro de investigación en Anchorage. El área circundante debe ser controlada antes de que el enemigo se retire.
event_stage_intro_20516=Los defensores de Anchorage siguen luchando desesperadamente, pero no podemos romper fácilmente las defensas estadounidenses. A partir de ahora, vigila de cerca los movimientos del enemigo. Al mismo tiempo, ataca tierra adentro, rodea a los defensores en tres lados y corta su retirada.
