feat_desc_116_Lv2=En un radio de 3 casillas, elige {1} objetivos para lanzar misiles cohete, lo que inflige daño y reduce la defensa del objetivo en un {2}% durante 2 turnos. Con un tiempo de recuperación de 2 turnos.
feat_desc_116_Lv3=En un radio de 4 casillas, elige {1} objetivos para lanzar misiles cohete, lo que inflige daño y reduce la defensa del objetivo en un {2}% durante 2 turnos. Este ataque ignora el 50% de la defensa del objetivo. Con un tiempo de recuperación de 2 turnos.
feat_desc_117=Si los PV del objetivo no son inferiores al {1}%, este ataque será un crítico garantizado.
feat_desc_118=Al comienzo de cada turno, recupera el {1}% de los PV máximos. Cuando los PV superan el 50%, el daño recibido se reduce en un {2}%.
feat_desc_119=Al atacar o contratacar, hay un {0}% de probabilidades de provocar caos en el objetivo durante 2 turnos.
feat_desc_120=Al atacar, ambos cañones disparan un proyectil cada uno. Cada proyectil impacta al objetivo de forma independiente y causa un {1}% del daño base por proyectil.

