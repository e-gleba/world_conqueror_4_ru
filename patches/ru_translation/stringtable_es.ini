dialogue_2770=Esta operación tiene como objetivo capturar los aeródromos de Guadalcanal y sus islas vecinas. ¡A través de esto, retomaremos las Islas Salomón!
dialogue_2771=¿Cómo llegó allí el ejército estadounidense? ¡Ordenen a todas las formaciones que recapturen el aeródromo!
dialogue_2772=Los alemanes han sido expulsados de Caen. ¡Persíguelos y superemos esta línea de defensa!
dialogue_2773=¡Soldados, estabilicen la línea! ¡La retaguardia es nuestro salvavidas!
dialogue_2774=¡Muy bien! ¡Sigan profundizando y capturen Falaise!
dialogue_2775=¡Ataquen con todas sus fuerzas y mándenlos de regreso a la brecha!
dialogue_2776=Soldados, los alemanes están en el bolsillo. ¡Sigan atacando y aplástalos por completo!
dialogue_2777=¡Todos los soldados, avancen firmemente para sellar el Grupo de Ejércitos B en el cerco!
dialogue_2778=Por orden del Führer: ¡Contraataquen con todas sus fuerzas y eviten que el enemigo continúe su avance!
dialogue_2779=¡La batalla fue irreversible y todo el ejército se retiró para salvar fuerzas!
dialogue_2780=El movimiento alemán ha cambiado. Los ejércitos del este necesitan ser sellados rápidamente. ¡No se les puede permitir escapar!
dialogue_2781=Todo el ejército está preparado. ¡Esta vez recuperaremos nuestra patria!
dialogue_2782=Es imperativo que se capturen todos los puertos y se aseguren los suministros en esta operación.
dialogue_2783=¡El ataque aliado es feroz! Todo el Grupo de Ejércitos G se retira para salvar fuerzas.
dialogue_2784=En esta operación atravesaremos la Línea Dieppe y obtendremos información sobre la defensa costera alemana.
dialogue_2785=¡Manténganse alerta y aumenten las patrullas! ¡Los aliados desembarcarán en cualquier momento!
dialogue_2786=¡Rodearemos Kiev y destruiremos completamente el Frente Sudoeste en esta operación!
dialogue_2787=Mi división atacará al sur desde Chernígov.
dialogue_2788=Kleist, de mi división, atacará al norte desde la línea Cherkasy-Kremenchuk.
dialogue_2789=Órdenes del Stavka: ¡Mantengan la posición a toda costa! Enderecen, sostengan y sacrifiquen de ser necesario.
dialogue_2790=El cerco está completo. ¡Estrangulen al enemigo con todas sus fuerzas!
dialogue_2791=Orden del Frente Noroeste: la Flota del Báltico y el 10.º Ejército de Infantería se retiran del puerto de Tallin hacia Leningrado.
dialogue_2792=Los batallones de artillería armaron un bloqueo a lo largo de la costa y las unidades aéreas bombardean los barcos enemigos con todas sus fuerzas. ¡Debemos impedir que los soviéticos se retiren por mar!
dialogue_2793=El ataque en el norte será una distracción, nuestro verdadero avance será en el sur. ¡El 8.º Ejército debe ser derrotado en esta batalla!
dialogue_2794=Aseguren los tanques en línea. Mantengan la cresta de Alam el Halfa. ¡Ganaremos!
dialogue_2795=¡Maniobren y avancen rápidamente para anexar Polonia antes de que Gran Bretaña y Francia puedan reaccionar!
dialogue_2796=Nuestro ejército es responsable de ayudar en el ataque y garantizar la apertura del corredor polaco.
dialogue_2797=Nuestro ejército está a cargo del ataque principal y debe penetrar rápidamente el núcleo polaco.
dialogue_2798=¡Aguanten soldados! Cuando Inglaterra y Francia intervengan, la situación cambiará.
dialogue_2799=¡Escuchen soldados! ¡Para proteger a las poblaciones ucraniana y bielorrusa, limpiaremos las regiones polacas de las fuerzas armadas desorganizadas!
dialogue_2800=¿Cómo se atreve la Unión Soviética a romper la Entente e invadir Polonia? Parece que Polonia ha perdido la guerra. ¡Pero nunca nos rendiremos!
dialogue_2801=La batalla debe librarse principalmente desde las "plantas de los pies" para frenar la fuerza principal del enemigo. Nuestra fuerza principal desembarcará en Salerno y entonces capturará Nápoles.
dialogue_2802=Dado que los estadounidenses creen que los alemanes se centrarán en fortificar Tarento, déjenlos en paz. Intentaremos acelerar nuestros movimientos en apoyo de los desembarcos.
dialogue_2803=El ataque principal de los aliados no debe ser en las "plantas de los pies" y debemos concentrar nuestras fuerzas en las defensas alrededor de Roma.
dialogue_2804=El ejército británico ha comenzado a luchar. ¡Salgan y desembarquen en Salerno!
dialogue_2805=¡Buenas noticias! Italia nos ha anunciado su rendición.
dialogue_2806=Desarmen al ejército italiano e Italia estará bajo nuestro control.
dialogue_2807=La marcha hacia Egipto se ha pospuesto dos veces y el Primer Ministro cree que ya no se puede posponer más.
dialogue_2808=A pesar de que los suministros sean inadecuados, debemos cumplir los objetivos con lo que tenemos. ¡Ataquen, marchen hacia Egipto!
dialogue_2809=Establezcan una línea flexible para lidiar con el enemigo. Necesitamos ganar tiempo para acumular suficiente poder para lanzar un ataque.
dialogue_2810=Genial, ¡sigan con el constante progreso!
dialogue_2811=¡Compañeros, ha llegado el momento de lanzar una contraofensiva para liberar Riga!
dialogue_2812=Soldados, Prusia Oriental todavía está en contacto con Letonia. El apoyo no se cortará. ¡Mantengan sus posiciones!
dialogue_2813=La resistencia alemana es tenaz. Probablemente deberíamos atacar Klaipeda y cortar el contacto entre Riga y Prusia Oriental.
dialogue_2814=¡Maldita sea! Evacúen Riga en tandas y reorganicen la línea de defensa en Curlandia.
dialogue_2815=Las primeras tropas aerotransportadas están en su lugar, tomarán y mantendrán los puentes cercanos, ¡por favor denles apoyo lo antes posible!
dialogue_2816=¡Soldados, empujen rápido y demuestren a los yanquis de qué estamos hechos!
dialogue_2817=A todas las unidades, tomen el control del puente. Si no pueden, destrúyanlo con todas sus fuerzas. ¡Las unidades blindadas estarán de apoyo en breve!
dialogue_2818=El puente de Arnhem se ha perdido y no podemos invadir el Ruhr desde el otro lado del Rin.
dialogue_2819=¡Ataquen en dirección al bosque de Hütgen y eviten que llegue apoyo a las fuerzas alemanas en la zona de Aquisgrán!
dialogue_2820=¡Confiando en la defensa de la Línea Sigfrido, es imperativo impedir que el ejército estadounidense continúe su avance para proteger la presa del Ruhr!
dialogue_2821=¡Aquisgrán ha sido capturada y las tropas siguen adelante!
dialogue_2822=Aunque Aquisgrán haya caído, no podemos rendirnos. ¡Si aguantamos, todavía podemos dar vuelta la situación!
dialogue_2823=Lo siento, la otra parte no parece querer aceptar nuestras buenas intenciones.
dialogue_2824=Está bien, señor. Según el plan, tendremos que forzarlos por la fuerza.
dialogue_2825=¡Ataquen, derroten a los alemanes en el área de Metz y capturen la ciudad!
dialogue_2826=¡La guarnición de Metz, apoyándose en las defensas del fuerte, retrasó con éxito el avance americano!
dialogue_2827=El 2.º Grupo de Ejércitos avanza al noroeste de Briansk y el 2.º Grupo Blindado avanza desde Sevsk a Orel. ¡En esta batalla, rodearemos el Frente Briansk!
dialogue_2828=Camaradas, Moscú está atrás nuestro. Hay que contener al enemigo. ¡Por el bien de la patria y del pueblo!
dialogue_2829=El enemigo nos va a rodear. ¡Todos ustedes, cierren la brecha!
dialogue_2830=¡Ataquen con todas sus fuerzas y aplástelos!
dialogue_2831=El Führer ordenó al 15º Grupo de Ejércitos que controlen la desembocadura del Escalda a toda costa.
dialogue_2832=El Primer Ejército Canadiense fue responsable de alcanzar el río Escalda, con el apoyo aliado adecuado.
dialogue_2833=El corredor hacia Walcheren debe permanecer abierto a toda costa. ¡Las tropas cercanas deben intensificar su apoyo!

