event_intro_437=El 6 de octubre de 1944, el 2.º Frente Ucraniano de la Unión Soviética lanzó una ofensiva que inició la Batalla de Debrecen, haciendo retroceder a las fuerzas germano-húngaras atrincheradas en Rumania, tomando Debrecen y avanzando 160 kilómetros en la línea del frente. Esta batalla debilitó significativamente la presencia militar alemana en Hungría, allanando el camino para la posterior invasión de Budapest.
event_intro_438=El 10 de octubre de 1941, el 3.er Grupo Panzer alemán se desvió hacia Kalinin, con el objetivo de capturar la ciudad durante su marcha y luego maniobrar desde el noroeste para rodear Moscú. Al enterarse de esto, las fuerzas soviéticas organizaron rápidamente el Frente Kalinin para contrarrestar el avance. La Defensa de Kalinin se prolongó hasta diciembre, durante la cual los alemanes lograron apoderarse de Kalinin. Sin embargo, al enfrentarse a duras condiciones invernales y a la feroz resistencia soviética, su eficacia en el combate se vio muy disminuida, lo que llevó a un punto muerto en Kalinin, que detuvo el avance.
event_intro_439=La Línea Defensiva de Mozhaisk, establecida por la Unión Soviética a fines de julio de 1941, fue diseñada para proteger a Moscú y sus accesos occidentales. Sin embargo, en octubre, cuando las fuerzas alemanas se acercaron a Moscú, la línea no había sido completamente fortificada. Esto permitió a los alemanes capturar rápidamente Kaluga en el extremo sur de la línea el 13 de octubre, lo que aumentó enormemente su moral para un asalto al frente de la misma. En los días siguientes, los alemanes capturaron varias ciudades a lo largo de la línea, penetrando la zona de defensa primaria. Si bien las operaciones de las fuerzas soviéticas en la línea no lograron detener el avance alemán, ganaron tiempo crucial para organizar fuerzas defensivas en la retaguardia.
event_intro_440=Tras la operación en el Báltico, el Grupo de Ejércitos Norte se encontró rodeado por fuerzas soviéticas en la Bolsa de Curlandia. Para evitar un posible ataque alemán desde Prusia Oriental y asegurar el cerco, la Unión Soviética envió al 3.er Frente Bielorruso para tomar el control de Prusia Oriental y eliminar a las fuerzas alemanas locales. El 16 de octubre de 1944, las fuerzas soviéticas iniciaron su ofensiva después de un intenso bombardeo de artillería. Sin embargo, los densos bosques y pantanos de Prusia Oriental, junto con las fortificaciones defensivas alemanas, impidieron eficazmente el avance soviético. Después de dos semanas de combates continuos, las fuerzas soviéticas lograron hacer avanzar la línea del frente hasta Gumbinnen, pero sufrieron grandes pérdidas y finalmente abandonaron el avance.
event_intro_441=En un esfuerzo por cortar el contacto entre Japón y sus guarniciones en el sudeste asiático, cortando el suministro a las tropas japonesas en la región, los aliados participaron en la batalla naval más grande de la Segunda Guerra Mundial cerca del Golfo de Leyte en Filipinas del 23 al 26 de octubre de 1944. Después de esta batalla, la fuerza restante de la Armada japonesa fue aniquilada, despojándolos del dominio naval y aéreo en el Pacífico centro-oriental.
event_intro_442=La Segunda Batalla de El Alamein marcó un punto de inflexión en la campaña del norte de África de la Segunda Guerra Mundial, junto con batallas como Stalingrado y Guadalcanal, significó la entrada de los Aliados en la fase estratégica de la contraofensiva. Esta batalla duró del 23 de octubre al 3 de noviembre de 1942. Aprovechando su superioridad numérica en personal y tanques, junto con la superioridad aérea absoluta, los Aliados derrotaron a las fuerzas del Eje, obligándolas a retirarse a Túnez.
event_intro_443=La invasión italiana de Grecia que duró del 28 de octubre de 1940 al 23 de abril de 1941, marcó el inicio de la Campaña de los Balcanes en la Segunda Guerra Mundial. Las fuerzas italianas atacaron desde Albania para expandir su territorio, pero posteriormente fueron contraatacadas por las fuerzas griegas, lo que obligó a los italianos a retirarse. A mediados de diciembre, las tropas griegas habían capturado incluso el 25% del territorio albanés. No fue hasta el 6 de abril, cuando las fuerzas alemanas invadieron Yugoslavia y Grecia, que el ejército italiano reanudó su ofensiva.
event_intro_444=La batalla de la isla de Bougainville fue una serie de enfrentamientos entre fuerzas aliadas y japonesas cerca de las Islas Salomón, que duraron desde el 1 de noviembre de 1943 hasta el 21 de agosto de 1945. Esta batalla comprendió dos fases. En la primera fase, de noviembre de 1943 a noviembre del año siguiente, las fuerzas estadounidenses desembarcaron en la playa de Torokina y aseguraron la zona. En la segunda fase, las fuerzas australianas lanzaron ataques para eliminar la resistencia japonesa restante.
event_intro_445=El 3 de noviembre de 1943, las fuerzas soviéticas lanzaron un intenso asalto, largamente preparado, contra las cabezas de puente al norte y al sur de Kiev. Las fuerzas alemanas que se encontraban dentro de la ciudad respondieron rápidamente, pero finalmente se vieron obligadas a retirarse de Kiev ante la abrumadora ofensiva soviética. Los soviéticos persiguieron y liberaron Kiev, Zhitomir y las áreas circundantes en la orilla derecha. Esta campaña sentó las bases para contraofensivas posteriores y minó gravemente la moral de las fuerzas alemanas.
event_intro_446=En respuesta a la petición de la Unión Soviética de abrir un segundo frente, los Aliados idearon un plan para ocupar el norte de África francés y contener a las fuerzas del Eje en la región. El 8 de noviembre de 1942, las fuerzas angloamericanas lanzaron ataques anfibios sobre Casablanca, Orán y Argel. Las guarniciones de la Francia de Vichy en la zona no pudieron resistir. Para el 16 de noviembre, las tres ciudades habían sido capturadas por los Aliados, que sirvieron como bases logísticas para futuras operaciones de las fuerzas aliadas en el norte de África.
event_intro_447=Para debilitar el poder naval italiano en el Mediterráneo, los británicos planearon utilizar portaaviones para atacar a la principal flota italiana anclada en Tarento. La operación comenzó la noche del 11 de noviembre de 1940 y la flota italiana perdió la mitad de sus principales acorazados en una sola noche. Este ataque marcó el primer ataque exitoso desde portaaviones contra buques de guerra en la historia, mostrando la superioridad de la aviación naval sobre la artillería de los acorazados. Esta batalla también sirvió como referencia para los japoneses en la planificación del ataque a Pearl Harbor.
event_intro_448=Del 12 al 15 de noviembre de 1942, los aliados libraron una batalla naval y aérea de cuatro días cerca de Guadalcanal con las fuerzas japonesas. Los japoneses intentaron reforzar su guarnición en la isla y entregar suministros, pero finalmente los aliados frustraron sus planes. Después de esta batalla, los japoneses perdieron la capacidad de navegar libremente por las aguas que rodeaban Guadalcanal durante la noche, lo que les impidió lanzar otro asalto para apoderarse del campo Henderson.
event_intro_449=El 18 de noviembre de 1941, en un intento de aliviar a las fuerzas aliadas asediadas y atrapadas en Tobruk y de reducir la fuerza de las potencias del Eje en el norte de África, las fuerzas de la Commonwealth lanzaron una ofensiva a gran escala contra las fuerzas del Eje en Libia. A pesar de los intensos combates y las numerosas bajas, las fuerzas de la Commonwealth finalmente lograron romper el asedio, obligando a las fuerzas del Eje a retirarse. Esta operación marcó una victoria significativa para los aliados en el frente del norte de África, sentando las bases para futuras ofensivas.
event_intro_450=La batalla de Rostov, que tuvo lugar del 17 de noviembre al 2 de diciembre de 1941, fue una de las primeras ofensivas exitosas del Ejército Rojo en la guerra germano-soviética. Junto con la batalla de Moscú, provocó la detención del avance alemán en el frente soviético en el invierno de 1941. Durante esta batalla, las fuerzas alemanas ocuparon brevemente Rostov, pero la resistencia de los defensores y el cerco soviético de las unidades de asalto alemanas finalmente obligaron a los alemanes a abandonar la ciudad.
event_intro_451=En un intento de destruir al 9.º Ejército alemán atrincherado en el saliente de Rzhev, las fuerzas soviéticas lanzaron ofensivas desde múltiples direcciones desde el 25 de noviembre al 20 de diciembre de 1942, con el objetivo de aniquilar al enemigo. Sin embargo, esta batalla no produjo los resultados esperados por los soviéticos. Además de sufrir más bajas en personal y equipo en comparación con los alemanes, no lograron capturar un terreno significativo. En consecuencia, esta batalla permaneció en gran parte en silencio durante un período prolongado.
event_intro_452=La Guerra de Invierno fue un conflicto que estalló en las primeras etapas de la Segunda Guerra Mundial entre la Unión Soviética y Finlandia. El 30 de noviembre de 1939, la Unión Soviética invadió Finlandia, iniciando la guerra que finalmente terminó en una victoria pírrica soviética. En las negociaciones de paz finales, Finlandia cedió y arrendó partes de su territorio a la Unión Soviética. El 13 de marzo de 1940, ambas partes firmaron el Tratado de Paz de Moscú, poniendo fin a la guerra.
event_intro_453=El 1 de diciembre de 1941, el Grupo de Ejércitos Centro alemán lanzó otra ofensiva en dirección a Naro-Fominsk, con el objetivo de romper las defensas centrales. Al principio, las fuerzas soviéticas sólo estaban fortificadas con posiciones defensivas principales, lo que llevó a un rápido avance de las fuerzas alemanas, que avanzaron varios kilómetros en dos días. Sin embargo, el ejército soviético movilizó rápidamente reservas y organizó un contraataque. El 5 de diciembre, los soviéticos lograron hacer retroceder con éxito la línea del frente a sus posiciones originales, frustrando el último intento alemán de abrir una brecha en Moscú.
event_intro_454=El 5 de diciembre de 1941, cuando las fuerzas alemanas pasaron a una posición defensiva en la batalla de Moscú, el Frente Kalininista soviético inició una ofensiva hacia Kalinin, buscando liberar la zona. Al principio, los alemanes resistieron ferozmente, lo que hizo que el ejército soviético avanzara lentamente, pero el duro clima invernal y los suministros inadecuados finalmente obligaron a las fuerzas alemanas a retirarse. El 16 de diciembre, Kalinin fue liberada y el Frente Kalininista, aprovechando el impulso y persiguiendo a los invasores, recuperó muchas posiciones vitales.

