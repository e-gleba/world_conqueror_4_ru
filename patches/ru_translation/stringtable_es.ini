feat_desc_152=Al ser atacado por fuerzas terrestres o navales, hay un {1}% de probabilidades de esquivar el daño. Al ser atacado por un ataque aéreo, hay un {2}% de probabilidades de esquivar el daño (excepto Misiles y Bombas Nucleares).
feat_desc_153=El daño contra helicópteros aumenta un {1}%. En cada turno que se haga un movimiento, la movilidad del siguiente se reduce en {2} (con un movimiento mínimo de 2 casillas). La movilidad completa se recupera tras descansar 1 turno a una casilla de una ciudad o unidad de ingeniería aliada.
feat_desc_153_Lv2=El daño contra helicópteros aumenta un {1}%. En cada turno que se haga un movimiento, la movilidad del siguiente se reduce en {2} (con un movimiento mínimo de 2 casillas). La movilidad completa se recupera tras descansar 1 turno a una casilla de una ciudad o unidad de ingeniería aliada.
feat_desc_153_Lv3=El daño contra helicópteros aumenta un {1}%. En cada turno que se haga un movimiento, la movilidad del siguiente se reduce en {2} (con un movimiento mínimo de 2 casillas). La movilidad completa se recupera tras descansar 1 turno a dos casillas de una ciudad o unidad de ingeniería aliada.
feat_desc_153_Lv4=El daño contra helicópteros aumenta un {1}%. En cada turno que se haga un movimiento, la movilidad del siguiente se reduce en {2} (con un movimiento mínimo de 2 casillas). La movilidad completa se recupera tras descansar 1 turno a dos casillas de una ciudad o unidad de ingeniería aliada.
feat_desc_154=El daño contra unidades blindadas y de artillería aumenta en un {0}%. Tras atacar a un objetivo, si este no es eliminado, se le aplicará el efecto Impedir por 1 turno. Si es eliminado, puedes volver a atacar inmediatamente, pero el daño de cada ataque posterior se reduce un {1}%, hasta {2} veces por turno.
feat_desc_154_Lv2=El daño contra unidades blindadas y de artillería aumenta en un {0}%. Tras atacar a un objetivo, si este no es eliminado, se le aplicará el efecto Impedir por 1 turno. Si es eliminado, puedes volver a atacar inmediatamente, pero el daño de cada ataque posterior se reduce un {1}%, hasta {2} veces por turno.
feat_desc_154_Lv3=El daño contra unidades blindadas y de artillería aumenta en un {0}%. Tras atacar a un objetivo, si este no es eliminado, se le aplicará el efecto Impedir por 1 turno. Si es eliminado, puedes volver a mover inmediatamente, pero el daño de cada ataque posterior se reduce un {1}%, hasta {2} veces por turno.
feat_desc_154_Lv4=El daño contra unidades blindadas y de artillería aumenta en un {0}%. Tras atacar a un objetivo, si este no es eliminado, se le aplicará el efecto Impedir por 1 turno. Si es eliminado, puedes volver a mover inmediatamente, pero el daño de cada ataque posterior se reduce un {1}%, hasta {2} veces por turno.
feat_desc_155=Aumenta el daño infligido a unidades blindadas, de artillería y navales en un {2}%.
feat_desc_155_Lv2=Aumenta el alcance de ataque máximo en {1} y el daño infligido a unidades blindadas, de artillería y navales en un {2}%.
feat_desc_155_Lv3=Aumenta el alcance de ataque máximo en {1} y el daño infligido a unidades blindadas, de artillería y navales en un {2}%.
feat_desc_155_Lv4=Aumenta el alcance de ataque máximo en {1} y el daño infligido a unidades blindadas, de artillería y navales en un {2}%.
feat_desc_156=En este turno, cuando tu ataque inflige daño, también infligirá un {2}% de daño a hasta {1} unidades en un radio de 1 casilla alrededor del objetivo, priorizando las unidades que no sean de infantería. La duración es de 1 turno. Tiempo de reutilización: 3 turnos.
feat_desc_156_Lv2=En este turno, cuando tu ataque inflige daño, también infligirá un {2}% de daño a hasta {1} unidades en un radio de 1 casilla alrededor del objetivo, priorizando las unidades que no sean de infantería. La duración es de 1 turno. Tiempo de reutilización: 3 turnos.
feat_desc_156_Lv3=En este turno, cuando tu ataque inflige daño, también infligirá un {2}% de daño a hasta {1} unidades en un radio de 2 casillas alrededor del objetivo, priorizando las unidades que no sean de infantería. La duración es de 1 turno. Tiempo de reutilización: 2 turnos.
feat_desc_156_Lv4=En este turno, cuando tu ataque inflige daño, también infligirá un {2}% de daño a hasta {1} unidades en un radio de 2 casillas alrededor del objetivo, priorizando las unidades que no sean de infantería. La duración es de 1 turno. Tiempo de reutilización: 2 turnos.
feat_desc_157=Tras realizar un ataque, puedes atacar nuevamente. Este efecto puede activarse hasta {1} veces por turno.
feat_desc_157_Lv4=Tras realizar un ataque, puedes atacar nuevamente. Este efecto puede activarse hasta {1} veces por turno. Por cada ataque que realices durante tu turno, el daño del siguiente aumenta un 20%, acumulándose hasta tres veces.

