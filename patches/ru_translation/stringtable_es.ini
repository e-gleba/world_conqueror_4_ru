elite_intro_72=El P-40 era un caza monoplaza de alas planas con un motor de combustión desarrollado en Estados Unidos. En el teatro de Asia Oriental, los Tigres Voladores, fundados por el general Chennault de la Fuerza Aérea de los EE. UU., volaron el P-40 contra el floreciente ejército japonés y obtuvieron muchas victorias. La boca de tiburón pintada en la mandíbula inferior del motor se convirtió en un símbolo ampliamente conocido del P-40.

