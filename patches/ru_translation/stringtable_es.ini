feat_desc_43_Lv3=Opera de nuevo después de una acción, +{2} movilidad al actuar de nuevo, con un tiempo de reutilización de 1 turno, {1}% de probabilidades de poder atacar de nuevo después de eliminar al ejército enemigo en la segunda acción (una sola vez).
feat_desc_46_Lv3=Probabilidad de ataque crítico +{1}%, dura 1 turno, con un tiempo de reutilización de 2 turnos.
feat_desc_47_Lv4=Restaura {1} PV a un objetivo aliado y le restaura 100 PV adicionales cada turno durante 2 turnos. Usar esta habilidad puede restaurar {2} de tus propios PV simultáneamente. Tiempo de reutilización: 1 turno.
feat_desc_49_Lv3=Daño infligido a objetivos terrestres con los PV al máximo +{1}%
feat_desc_50_Lv3=Ataca a varias tropas enemigas, el daño a otros objetivos no se reducirá, daño infligido +{2}%, el daño de ataque crítico +{1}%.
feat_desc_51_Lv3=Alcance de ataque +2 durante este turno. Los ataques reducen adicionalmente los PV de la ciudad o fortaleza objetivo en un {1}% (hasta 1200) y los PV de las tropas de guarnición en un {2}% (hasta 500), con un tiempo de reutilización de 2 turnos.
feat_desc_52_Lv3=Cuando es atacado por las fuerzas terrestres o navales, hay un {0}% de probabilidades de esquivar este daño durante 1 turno, con un tiempo de reutilización de 2 turnos.
feat_desc_53_Lv3=Daño infligido a unidades blindadas y de artillería +{1}% durante 1 turno, con un tiempo de reutilización de 2 turnos.
feat_desc_54_Lv3=Daño infligido a unidades de artillería +{1}% durante 1 turno, con un tiempo de reutilización de 2 turnos.
feat_desc_55_Lv3=Reduce el consumo de dinero en la utilización de una unidad de la Fuerza Aérea en un {1}%.
feat_desc_56_Lv3=Al atacar, hay un {0}% de probabilidades de desmoralizar a una unidad enemiga y la misma probabilidad de incendiar el objetivo.
feat_desc_57_Lv3=Transporta una unidad de infantería, coche blindado, artillería de campaña o un obús a una ubicación objetivo, restaura un {1}% de los PV mientras se transporta, ignorando las armas antiaéreas durante el transporte aéreo.
feat_desc_58_Lv3=Aumenta el daño en un {1}% al atacar toda clase de barcos.
feat_desc_59_Lv3=Daño infligido fortalezas +{1}%, daño infligido a unidades terrestres +{2}%.
feat_desc_60_Lv3=Se pueden plantar hasta 2 minas de contacto naval en dos casillas, con un tiempo de reutilización de 1 turno.
feat_desc_61_Lv3=El siguiente ataque inflige daño adicional a 2 tropas enemigas aleatorias dentro de una casilla del objetivo, con un tiempo de reutilización de 2 turnos.
feat_desc_62_Lv3=Aumenta el daño un 200% contra objetivos inmovilizados o en caos. Cuando utilice la habilidad, las tropas enemigas a 1 casilla de sí mismo entrarán en caos, sin que la moral se vea afectada durante 1 turno, con un tiempo de reutilización de 3 turnos. Al afectar a 2 o más objetivos, el tiempo de reutilización será de 1 turno.
feat_desc_63_Lv4=Aumenta el daño infligido a la defensa de la ciudad en un {1}%.
feat_desc_64_Lv3=El exceso de probabilidad de ataque crítico se convertirá en daño adicional. Por cada {2}% de exceso, inflige un {1}% de daño adicional. Ignora el 20% de la defensa del objetivo al atacar.
feat_desc_65_Lv3=Ignora el {1}% de la defensa de las tropas enemigas.
feat_desc_66_Lv3=Daño infligido a unidades blindadas en este turno +{1}%, con un tiempo de reutilización de 2 turnos.
feat_desc_67_Lv4=Daño de contraataque +{1}%.
feat_desc_68_Lv4=Después de atacar, si el objetivo es aniquilado, hay un {0}% de probabilidades de actuar nuevamente, con un límite de {2} veces.
feat_desc_69_Lv3=Cuando una tropa amiga dentro de 1 casilla de ti ataca, hay un {0}% de probabilidades de que participes en el ataque, daño infligido +{1}% (este rasgo es ineficaz cuando te veas afectado por el efecto de Navegación).
feat_desc_70_Lv3=Los ataques infligen {1}% de daño adicional a otros objetivos dentro de 1 casilla del objetivo durante 1 turno, con un tiempo de reutilización de 2 turnos.
feat_desc_71_Lv4=Se puede lanzar un ataque adicional tras atacar, efectivo hasta {1} veces. Tras cada ataque durante el turno, el daño infligido por el siguiente ataque aumenta un 20%, acumulándose hasta un máximo de 3 veces.
feat_desc_72_Lv4=Puedes usar la mayoría de las aeronaves en el aeródromo, excepto los transportes, con un máximo de {1} puntos de aeronaves.
feat_desc_73_Lv4=Daño infligido a unidades blindadas por aeronaves lanzadas desde portaaviones +{1}%.
feat_desc_74_Lv4=Hay un {1}% de probabilidades de destruir las instalaciones antiaéreas de la ciudad y un {2}% de probabilidades de ignorar la reducción de daño de las armas antiaéreas.
feat_desc_75_Lv3=Aumenta la moral de nuestras tropas amigas dentro de un casilla del objetivo atacado y su ataque +{1}%, dura 3 turnos.
feat_desc_76_Lv4=El rango de ataque alcanza a 3, puede atacar a varias tropas enemigas, el daño infligido a otros objetivos no se reduce, hay un {1}% de probabilidades de que las tropas enemigas no puedan contraatacar cuando estás atacando, dura 1 turno, con un tiempo de reutilización de 2 turnos. La casilla objetivo tiene un 100% de probabilidades de ignición.
feat_desc_78_Lv3=Ignora los efectos de esquivo y de bomba de humo y aumenta el {1}% del daño infligido a las defensas de la ciudad.
feat_desc_79_Lv4=Dispara una bomba de humo, envolviéndose en una cortina de humo, no puede ser atacado activamente por las fuerzas terrestres y navales, tiene un {1}% de probabilidades de atacar una vez más durante 1 turno, con un tiempo de reutilización de 2 turnos, y un 50% de probabilidades de ignorar los efectos de esquivo.
feat_desc_80_Lv4=Mientras está bajo el efecto de la bomba de humo, los ataques ignoran el {1}% de la defensa del objetivo.
feat_desc_81_Lv4=Al lanzar misiles, puedes cargar ojivas trifásicas, que inicialmente posees 2 y recuperas 1 cada {1} turnos. Máximo de 5. Los ataques activan siempre efectos de radiación
feat_desc_82_Lv4=Puede lanzar misiles balísticos intercontinentales hasta 2 veces por turno. Reemplaza los ataques normales.
feat_desc_83_Lv4=Las unidades terrestres no pueden atacarlo y el daño recibido por ataques de la fuerza aérea se reducirá en un {1}%.
feat_desc_84_Lv4=Selecciona una línea recta y avanza hasta {1} casillas (la ubicación del objetivo debe ser un espacio abierto, ya que estará bloqueada por unidades suspendidas en el aire), infligiendo daño por ametrallamiento con un tiempo de reutilización de 1 turno. Después de que el ataque de ametrallamiento elimine a un objetivo, puedes volver a usar Supresión de Ametrallamiento hasta {2} veces por turno.
feat_desc_85_Lv2=Puede despegar dentro de 1 hexágono de un portaaviones. Ignora los efectos de movilidad sobre cualquier tipo de tierra y los efectos de cualquier mina terrestre o naval. Las tropas enemigas no pueden devolver el fuego al atacar y la efectividad en combate no disminuye al reducirse la salud. Daño a unidades terrestres +{1}%.
feat_desc_89_Lv3=En un radio de 7 casillas, excava un túnel desde tu ubicación actual hasta la casilla objetivo. La casilla objetivo no puede ser montañosa ni oceánica, ni puede cruzar un océano. Tu infantería, coches blindados, tanques ligeros, tanques medianos, artillería de campaña, obuses y artillería de cohetes pueden atravesar el túnel. Atravesar túneles otorga una acción adicional, con un límite de 5 veces por túnel. Al excavar un nuevo túnel, el original desaparece. Tiempo de reutilización: 2 turnos.
feat_desc_90_Lv4=Los edificios dentro de 2 casillas del área circundante recuperan {1} PV, efectivo una vez por turno.
feat_desc_92_Lv4=Alcance de ataque +1. Por cada {1} PV perdido, aumenta el ataque de las tropas en {2} puntos.
feat_desc_93_Lv4=La efectividad en combate no disminuye al reducirse los PV. Al estar cerca de la muerte, los PV no pueden reducirse por debajo de 1 punto durante 3 turnos con un tiempo de reutilización de {2} turnos. Restaura un 30% de los PV cuando falla el dispositivo de protección.
feat_desc_94_Lv4=Cuando se encuentra dentro del alcance de su propio territorio o del de un aliado, el daño infligido aumenta en un {1}%. Alcance de ataque +1 en el primer ataque de este turno
feat_desc_95_Lv4=Ignora los efectos de movilidad sobre terreno especial, ignora los efectos de reducción de daño del terreno al atacar y contraatacar, y reduce la defensa y la movilidad del enemigo en un {1}% durante 2 turnos.
feat_desc_96_Lv4=El daño directo recibido se divide entre tú y los aliados circundantes, y por cada {1} puntos de daño dividido o esquivado, el ataque base aumenta en {2} puntos, con un límite del 300%. Dura 3 turnos.
feat_desc_97_Lv4={1}% de probabilidades de esquivar el daño cuando es atacado por la Fuerza Aérea.
feat_desc_98_Lv4=Entra en estado fantasma y no puede ser atacado activamente por las fuerzas terrestres ni navales, con un tiempo de reutilización de 2 turnos. Movilidad +{1} mientras está en estado fantasma, dura 1 turno. El estado fantasma no se eliminará tras atacar.
feat_desc_99_Lv4=Al atacar no podrá ser contratacado. El daño infligido al atacar tropas aumenta un {1}% (un {2}% en sigilo) y se reduce un 50% al atacar edificios.
feat_desc_100_Lv3=Solicita un helicóptero para transportarte a una ubicación designada en un radio de 9 casillas, con un tiempo de reutilización de 2 turnos. No consume número de envíos mientras es transportado por una aeronave de transporte (limitado a una vez por turno).
feat_desc_102_Lv4=Aumenta la probabilidad de ataque crítico en un {1}% en este turno, ignora el {2}% de la defensa del objetivo al atacar, +4% de probabilidad crítica por cada objetivo destruido durante el turno, con un tiempo de reutilización de 2 turnos.
feat_desc_103_Lv4=La defensa aumenta en un {1}% y el daño recibido de la fuerza aérea se reduce en un {2}%
feat_desc_105_Lv4=Puede usarse como aeronave de portaaviones. Cada ataque inflige un {1}% de daño adicional en el área objetivo.
feat_desc_106_Lv4=Al atacar con una bomba nuclear, el daño infligido aumenta en un {1}%.
feat_desc_107_Lv4=Inflige {1}% de daño adicional a otros objetivos dentro de 1 casilla del objetivo cuando ataca este turno, con un tiempo de reutilización de 2 turnos.
feat_desc_108_Lv4=Capaz de atacar múltiples unidades enemigas, aumenta el daño infligido a unidades de tanques y artillería en un {1}% y permite atacar nuevamente después de eliminar el objetivo.
feat_desc_109_Lv3=Deshabilita la mayoría de los estados de beneficio de las tropas enemigas dentro de 2 casillas y las desmoraliza severamente, con un tiempo de reutilización de 2 turnos.
feat_desc_110_Lv4=Cuando se encuentre dentro de terreno montañoso o forestal, el daño recibido se reduce en un {1}%.
feat_desc_111_Lv4=Lanza múltiples misiles de largo alcance que infligen un {1}% de daño de misiles balísticos de largo alcance al objetivo y un {2}% de daño a las fuerzas enemigas alrededor del objetivo, con un tiempo de reutilización de 2 turnos.
feat_desc_117_Lv4=El ataque siempre será crítico

feat_desc_121=Al capturar una ciudad enemiga, aumenta la moral de tus propias tropas y de las amigas dentro de 3 casillas durante 2 turnos.
feat_desc_122=Los objetivos amigos dentro de dos casillas recuperan {1} PV después de recibir daño directo.
feat_desc_123=Por cada {1}% de PV perdido, el daño recibido se reduce en un {2}%, con un máximo del 25%. El daño recibido por cada ataque tiene un límite de 300 puntos (Inválido para una bomba nuclear).
feat_desc_124=Distribuye el {1}% del daño directo recibido a objetivos enemigos dentro de 1 casilla a tu alrededor.
feat_desc_125=Defensa +{1}% para objetivos amigos a 2 casillas dentro de ti.
feat_desc_126=Al recibir daño de unidades terrestres, existe un {0}% de probabilidades de que este daño se transfiera a cualquier objetivo dentro de una casilla de él (No se puede transferir a la unidad fuente del daño).
feat_desc_127=Al atacar, por cada {1} defensa del objetivo, daño infligido +{2}%.
feat_desc_128=Al atacar, el objetivo recibe un efecto que reduce sus PV actuales en un 10% por turno, dura 2 turnos.
feat_desc_129=+{1}% de ataque propio por cada unidad destruida, acumulable hasta {2} veces durante 2 turnos.
feat_desc_130=Mientras esté bajo el efecto de una bomba de humo, el alcance de ataque de las unidades enemigas dentro de 2 casillas se reduce a {1} (cuando se ignora el efecto de la bomba de humo, este efecto también se ignora).
feat_desc_131=Cuando estés en tu propio territorio o amigo, movilidad +{1}.
feat_desc_132=Después de un transporte aéreo, el daño de la unidad aumenta en +{1}% en el turno actual.
feat_desc_133=Cuando no se realiza ningún movimiento en un turno determinado, la movilidad del siguiente turno +{1}.
feat_desc_134=Puede ser transportado por aire mediante aviones de transporte.
feat_desc_135=Dentro de 2 casillas, puede seleccionar hasta {1} objetivos a los que disparar torpedos, con un tiempo de reutilización de 2 turnos.
feat_desc_136=Restaura {1}% de PV al final de cada turno.
feat_desc_137=Ignora los efectos de esquiva, bomba de humo, estado fantasma y EMCON.
feat_desc_138=Daño infligido al objetivo +{1}%.
feat_desc_139=Al bombardear un objetivo, ignora el {1}% de la defensa del objetivo.
feat_desc_140=Los enemigos que se encuentren a 1 casilla al comienzo del turno verán su movilidad reducida en un {1}%.

army_buff_desc_1023=Disparo Preciso: aumenta la probabilidad de un ataque crítico en un 90%.
army_buff_desc_1043=Artillería Gigante: +2 de alcance de ataque, inflige daño adicional a las defensas de la ciudad y su guarnición.
army_buff_desc_1053=Blindaje Inclinado: 100% de probabilidad de esquivar daño.
army_buff_desc_1063=Cazacarros: aumenta el daño a las unidades blindadas y de artillería en este turno en un 55%.
army_buff_desc_1073=Asesino de Artillería: aumenta el daño a las unidades de artillería en este turno en un 65%.
army_buff_desc_1083=Asesino de Tanques: aumenta el daño a las unidades blindadas en este turno en un 65%.
army_buff_desc_1093=Fuego Supresor: ataca adicionalmente a 2 tropas enemigas aleatorias que se encuentren dentro de una casilla del objetivo.
army_buff_desc_1202=Rescate de Emergencia: restaura 100 PV por turno.
army_buff_desc_1253=Ataque Aéreo Intensivo: 100% de daño adicional a otros objetivos dentro de 1 casilla del objetivo principal.
army_buff_desc_1304=Ataque con Cohete: el alcance de ataque cambia a 3, capaz de atacar a varias tropas enemigas, 100% de probabilidades de que las tropas enemigas no puedan contraatacar al atacar.
army_buff_desc_1314=Bomba de Humo: no puede ser atacada activamente por las fuerzas terrestres y navales, tiene un 100% de probabilidades de atacar una vez más y un 50% de probabilidad de ignorar los efectos de esquiva.
army_buff_desc_1323=Luchando Juntos: ataque aumentado en %d.
army_buff_desc_1332=Dispositivo de Protección: los PV no se pueden reducir por debajo de 1 y restaura el 30% de los PV cuando falla.
army_buff_desc_1364=Munición de Uranio Empobrecido: probabilidad de ataque crítico +50%, los ataques ignoran el 70% de la defensa del objetivo y cada eliminación aumenta la probabilidad de un ataque crítico en un 4%.
army_buff_desc_1374=Fuego Infernal: inflige 100% de daño adicional a todos los objetivos dentro de 1 casilla del objetivo principal.
army_buff_desc_1421=Supresión Constante: -10% PV cada turno.
army_buff_desc_1431=Mejora de Potencia de Fuego: aumenta el ataque en un %d%%.
army_buff_desc_1441=Interferencia Visual: alcance reducido a 1.
army_buff_desc_1451=Asalto Aéreo: aumenta el daño infligido en un 100%.
army_buff_desc_1481=Ataque de los Tigres Voladores: aumenta el ataque en un 10%.


