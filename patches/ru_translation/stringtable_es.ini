elitepass_rule=Reglas del Pase de Élite
elitepass_rule_1=1. El Pase de Élite está abierto durante 28 días por temporada y no se puede comprar ningún pase 24 horas antes del final de la misma.
elitepass_rule_2=2. Además del desafío diario fijo de inicio de sesión en el juego, las 2 tareas de desafío restantes se generan aleatoriamente y las tareas de desafío se pueden actualizar 3 veces al día.
elitepass_rule_3=3. Después de adquirir el Pase de Élite para la próxima temporada, las recompensas no reclamadas en la temporada anterior pueden aparecer automáticamente para reclamarse cuando se abra el Pase de Élite.
elitepass_rule_4=4. Los intentos de desbloqueo del Pase de Élite Premium y del Pase de Élite Definitivio que no se usaron se pueden utilizar cuando se abra el Pase de Élite de la próxima temporada.
elitepass_rule_5=5. Las estadísticas de juego de "Cantidad de intentos de evento" en Misiones de Desafío de Élite se contarán desde la hora de inicio de la temporada actual.
