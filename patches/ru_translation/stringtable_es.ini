event_stage_intro_20701=El Primer Ministro nos ha instado en repetidas ocasiones a lanzar un ataque contra las fuerzas británicas. Sin embargo, debido a nuestro bajo nivel de mecanización y a la falta de equipo y suministros suficientes, esta ofensiva está destinada a ser insostenible. Por ahora, debemos confiar en nuestra superioridad numérica para compensar estas deficiencias. Avancemos hacia Egipto.
event_stage_intro_20702=La velocidad del contraataque británico es asombrosa, pero el enemigo ha subestimado el tamaño de nuestras fuerzas. Ahora son una fuerza agotada y poseemos suficiente fuerza para dividir y romper las defensas de Cirenaica. Nuestro objetivo principal es aniquilar la fuerza efectiva de las unidades británicas. ¡Avancen a toda velocidad y no perdonen a ningún soldado enemigo!
event_stage_intro_20703=Hemos derrotado a todas las fuerzas aliadas en Grecia y Creta es ahora el último bastión importante del enemigo en el Mediterráneo. Una vez que capturemos la isla, podremos utilizarla como trampolín para apoderarnos de Chipre e incluso lanzar un ataque a Egipto desde el mar.
event_stage_intro_20704=Las fuerzas británicas han lanzado una nueva ofensiva para abrirse paso hacia Tobruk. Ya hemos reforzado nuestras fortificaciones existentes y construido nuevas posiciones para contrarrestar el avance británico. Seguirán llegando suministros y refuerzos. Para entonces, podremos recuperar el control del teatro de operaciones del norte de África.
event_stage_intro_20705=El cerco de Tobruk y sus alrededores está a punto de completarse. Sin embargo, actualmente carecemos de los recursos y el equipo necesarios para una ofensiva a gran escala. La buena noticia es que la iniciativa británica juega a nuestro favor, brindándonos la oportunidad de lograr una victoria rápida y decisiva eliminando la fuerza efectiva del enemigo y evitando los problemas asociados con las líneas de suministro demasiado extendidas.
event_stage_intro_20706=Nuestras líneas de suministro están al límite. Las fuerzas navales y aéreas enemigas en el Mediterráneo suponen una amenaza importante. Las fuerzas aliadas, lideradas por los británicos, reciben refuerzos continuamente a través del Mar Rojo y el Canal de Suez. La situación es desesperada, pero ésta será nuestra última batalla en el norte de África, un momento decisivo que determinará nuestro destino.
event_stage_intro_20707=Las fuerzas aliadas se han reagrupado en Marruecos y Argelia. Las fuerzas estadounidenses están acelerando su avance por tierra, mientras que la marina británica está reuniendo toda su fuerza en el Golfo de Túnez, donde las fuerzas locales de la Francia de Vichy pueden haber establecido contacto con los aliados. La crisis se avecina, pero resistiremos en Túnez hasta el último momento con las fuerzas que nos quedan, a la espera de la llegada de las fuerzas principales de Rommel.
event_stage_intro_20711=El Primer Ministro nos ha instado en repetidas ocasiones a lanzar un ataque contra las fuerzas británicas. Sin embargo, debido a nuestro bajo nivel de mecanización y a la falta de equipo y suministros suficientes, esta ofensiva está destinada a ser insostenible. Por ahora, debemos confiar en nuestra superioridad numérica para compensar estas deficiencias. Avancemos hacia Egipto.
