skill_info_152=Aumenta [#00FF00#%d%%] la probabilidad de esquivar, añade 4 puntos de movilidad al comandar una unidad aérea flotante y reduce un 30%% el daño recibido de las fuerzas aéreas. Aumenta el daño crítico un 1%% por cada 1%% de tasa de evasión cuando unidades aéreas flotantes atacan.
skill_info_153=Reduce el consumo de recursos al atacar con unidades de la fuerza aérea y misiles (excepto las tropas aerotransportadas) en un 20%%. Obtienes "Ofensiva Escalonada" tras comandar ataques aéreos y con misiles. Cuando ataques con fuerza aérea y misiles, ignoras la defensa enemiga un [#00FF00#%d%%] y se garantizan ataques críticos contra cualquier enemigo con menos de 20 de defensa (las armas nucleares son ineficaces). El efecto se remueve al finalizar del turno.
skill_info_154=Ingresos económicos e industriales +[#00FF00#%d] cuando no hay tropas enemigas en 1 casilla alrededor de la fuerza comandada.
skill_info_155=Tras ordenar a una unidad que ataque, el objetivo y 2 unidades enemigas a 1 casilla a su alrededor tienen una probabilidad del [#00FF00#%d%%] de sufrir "Fatiga" durante 1 turno. Las tropas con "Fatiga" sufren una reducción adicional del 6%% de los PV máximos por ataques convencionales y aéreos, y su moral disminuye. El efecto de Fatiga no afecta a las tropas que ya están en caos.

army_buff_desc_1461=Ofensiva Escalonada: al comandar ataques con fuerza aérea y misiles, se ignora el 15% de la defensa del enemigo y se garantizan ataques críticos a cualquier enemigo con menos de 20 de defensa.
army_buff_desc_1462=Ofensiva Escalonada: al comandar ataques con fuerza aérea y misiles, se ignora el 30% de la defensa del enemigo y se garantizan ataques críticos a cualquier enemigo con menos de 20 de defensa.
army_buff_desc_1463=Ofensiva Escalonada: al comandar ataques con fuerza aérea y misiles, se ignora el 45% de la defensa del enemigo y se garantizan ataques críticos a cualquier enemigo con menos de 20 de defensa.
army_buff_desc_1464=Ofensiva Escalonada: al comandar ataques con fuerza aérea y misiles, se ignora el 60% de la defensa del enemigo y se garantizan ataques críticos a cualquier enemigo con menos de 20 de defensa.
army_buff_desc_1465=Ofensiva Escalonada: al comandar ataques con fuerza aérea y misiles, se ignora el 75% de la defensa del enemigo y se garantizan ataques críticos a cualquier enemigo con menos de 20 de defensa.
army_buff_desc_1471=Fatiga: Tras ser atacado (incluyendo ataques aéreos), reduce un 6% adicional de los PV máximos y baja su moral. El efecto de Fatiga no afecta a las unidades que ya están en caos.

