skill_info_166=Al comandar unidades navales, obtienes +5 de movilidad y eres inmune a los efectos que deshabilitan el contraataque. Al comandar unidades, aumenta el daño de ataque y contraataque en un [#00FF00#%d%%] por cada 3 de movilidad.
skill_info_167=Las unidades enemigas dentro de un radio de 3 casillas reciben un 35%% de daño adicional y quedan anuladas de los efectos de blindaje inclinado, dispositivo protector, provocación, secuestro y luchando al lado. Tras eliminar a un enemigo con una unidad naval, existe una probabilidad del [#00FF00#%d%%] de otorgar un ataque adicional.
skill_info_168=Mientras estés al mando de unidades terrestres, cada vez que se elimine a un enemigo dentro de un radio de 3 casillas, tu moral aumentará y obtendrás el estado “Grupo de Ruptura” (aumenta el daño infligido por [#00FF00#%d%%] y se acumula hasta un 42%%), que dura hasta el final del escenario.
skill_info_169=Al comandar unidades de artillería, obtienes +3 de movilidad. Tras eliminar a un enemigo, hay una probabilidad del [#00FF00#%d%%] de atacar de nuevo, que aumenta un 10%% adicional por cada 200 PV que tenga la unidad comandada.

promotion_desc_4=Tras un entrenamiento avanzado, los generales pueden mejorar aún más sus atributos. Las habilidades fijas originales del general se restablecerán y se reembolsará el coste total necesario para aprenderlas y mejorarlas.
army_buff_desc_1591=Grupo de Ruptura: Aumenta el daño en un %d%%
