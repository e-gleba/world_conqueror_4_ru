;战区规则
warzone_rule=Reglas de la Zona de Guerra
warzone_rule_1=1. Cada zona de batalla se divide en niveles normales y un nivel de jefe. El nivel de jefe se desbloquea solo después de completar todos los niveles normales. Los niveles normales mostrarán las principales unidades de combate presentes en el nivel actual.
warzone_rule_2=2. Para cambiar o reiniciar la zona de batalla se necesitan puntos de mando, que se restauran a horas fijas cada día (UTC+8 a las 08:00 y a las 20:00).
warzone_rule_3=3. Los niveles de la zona de guerra utilizan un sistema de puntos. Se ganan puntos al infligir daño a las fuerzas enemigas (incluyendo fortalezas y refuerzos que invoquen). Una vez completado un nivel, no se puede volver a entrar. Los generales que hayan sido desplegados en batallas anteriores no podrán ser desplegados nuevamente en las posteriores. Es recomendable planificar el despliegue de los generales con antelación.
warzone_rule_4=4. Cuando tu puntuación más alta en cada zona de guerra alcance cierto límite, recibirás una recompensa única por logro. Cada vez que superes un nivel de jefe, también recibirás una medalla según tu puntuación total actual. (Puedes consultar los requisitos específicos haciendo clic en el Cofre del Tesoro).
warzone_rule_5=5. Una vez que tus mejores puntuaciones acumuladas en cada zona de guerra alcancen cierto límite, podrás desbloquear la función de barrido. Al consumir una cantidad específica de boletos de barrido, podrás saltar niveles inmediatamente y recibir las cintas.

mission_to_tutorial=La misión no puede comenzar sin un general. Recomendamos completar primero los tres niveles del tutorial para obtener un general y luego continuar con la misión.

