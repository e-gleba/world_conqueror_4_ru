help_scenario_desc_1=Aquí podrás experimentar varias batallas clásicas desde la Segunda Guerra Mundial. Completa todos los niveles del episodio actual para desbloquear el siguiente.
help_scenario_desc_2=Hay dos campos diferentes para elegir en los episodios "SGM Europa", "SGM Pacífico" y "Guerra Fría". Los dos campamentos tienen contenidos separados de niveles y recompensas correspondientes.
help_scenario_desc_3=Cada nivel del escenario tiene una dificultad diferente y debes completar la dificultad actual antes de desafiar las superiores. A medida que aumenta la dificultad, las recompensas también serán más abundantes.
help_scenario_desc_4=Las Zonas de Guerra producen principalmente medallas y cintas. Después de completar todos los niveles en la Zona de Guerra actual, los comandantes pueden ser recompensados según sus puntuaciones y cuantos más enemigos destruyas, mayor será su puntuación total. La misma Zona de Guerra puede ser desafiada varias veces, cambiar o actualizar Zonas de Guerra consume 1 punto de comando. Antes de que se actualice una Zona de Guerra, los generales que han luchado en la misma no pueden continuar luchando en los niveles posteriores de esa zona de batalla.
help_scenario_desc_5=El modo Primera Línea es un juego muy desafiante que se desbloqueará después de pasar la Conquista principal de SGM Europa. Los comandantes se enfrentarán a muchos fuertes aquí, generando refuerzos constantemente. Pasar el modo Primera línea también te otorgará grandes recompensas.

