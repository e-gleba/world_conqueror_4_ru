skill_info_116=Después de ordenarle a una unidad que ataque, si el objetivo no es aniquilado, existe un [#00FF00#%d%%] de probabilidad de que se agregue una marca de seguimiento a ese objetivo. Los objetivos con marcas de seguimiento reciben un 20%% más de daño.Dura 1 ronda.
skill_info_117=Después de aniquilar tropas enemigas, [#00FF00#%d%%] probabilidad de bajar la moral de 2 enemigos dentro de 1 cuadrícula de ti.
skill_info_118=Al ordenar a las tropas que se muevan, se inflige daño +[#00FF00#%d%%] (hasta un 50%%) por cada casilla movida durante 1 turno.
skill_info_119=Al ordenar que una unidad de la fuerza aérea ataque, existe un [#00FF00#%d%%] de probabilidad de que nuestras unidades inactivas que están a 1 cuadrícula alrededor de la unidad enemiga bajo ataque se unan al ataque (hasta 1 tropa participará simultáneamente).
skill_info_120=Después de ordenarle a una unidad de la fuerza aérea que ataque, el objetivo adquiere el estado aterrorizado con una probabilidad de contraataque reducida de [#00FF00#%d%%] durante 1 turno.
skill_info_121=Al comandar tropas blindadas, daño recibido - [#00FF00#%d%%].
skill_info_122=Cuando las tropas amigas dentro de 1 cuadrícula a tu alrededor mueren en batalla, obtendrás el estado Venganza, con ataque +[#00FF00#%d] durante 2 turnos.
skill_info_123=[#00FF00#%d%%] probabilidad de que el enemigo no contraataque cuando comande unidades de barcos.
skill_info_124=Al comandar una unidad de barco, no caerás en Caos. Ataque tuyo y de tropas amigas de 1 cuadrícula a tu alrededor +[#00FF00#%d].
skill_info_125=Cuando la fuerza al mando es atacada y recibe daño, el enemigo también recibe [#00FF00#%d%%] de ese daño.(Cada ataque solo entra en vigor una vez)
skill_info_126=Al comandar una unidad de barco, las unidades aéreas y de misiles causan +[#00FF00#%d%%] daño al enemigo al atacar.
skill_info_127=Después de ordenar a una tropa que ataque, obtiene el estado "Señuelo Enemigo", que dura 1 turno y hace que las tropas amigas dentro de 1 casilla inflijan +[#00FF00#%d%%] de daño (excluyéndose a sí mismo).
skill_info_128=Al ordenar a una unidad naval que ataque, existe un [#00FF00#%d%%] de posibilidades de que una de las unidades navales inactivas circundantes participe en el ataque. (Una vez por ronda)
skill_info_129=Después de comandar a una unidad blindada que aniquile a una tropa enemiga, inflige un [#00FF00#%d%%] más de daño a los enemigos 1 casilla alrededor del objetivo.
skill_info_130=Inflige +[#00FF00#%d%%] de daño a enemigos desmoralizados y en caos.
skill_info_131=El daño aumenta en un [#00FF00#%d%%] cuando el número de formaciones de tropas al mando es 1.
skill_info_132=Después de ordenar a una tropa que contraataque, +[#00FF00#%d] PV a ti y a las tropas aliadas circundantes.
skill_info_133=Al comandar tropas en tu territorio, producción de económica, industria y tecnología +[#00FF00#%d%%].



