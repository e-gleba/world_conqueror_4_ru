feat_desc_144=El daño a las unidades de infantería aumenta en un {1}%.
feat_desc_144_Lv2=El daño a las unidades de infantería aumenta en un {1}%. Hay un 100% de probabilidades de volver a atacar después de destruir al enemigo.
feat_desc_144_Lv3=El daño a las unidades de infantería aumenta en un {1}%. Hay un 100% de probabilidades de volver a atacar después de destruir al enemigo.
feat_desc_144_Lv4=El daño a las unidades de infantería aumenta en un {1}%. Hay un 100% de probabilidades de volver a atacar después de destruir al enemigo.
feat_desc_145=Despliega un dron en un radio de una casilla. Tras el despliegue, el dron puede moverse y atacar inmediatamente. Funciona como una unidad independiente y puede atacar una vez por turno. Su efecto dura 1 turno. Tiempo de reutilización de 1 turno.
feat_desc_145_Lv2=Despliega un dron en un radio de una casilla. Tras el despliegue, el dron puede moverse y atacar inmediatamente. Funciona como una unidad independiente y puede atacar una vez por turno. Su efecto dura 2 turno. Tiempo de reutilización de 1 turno.
feat_desc_145_Lv3=Despliega un dron en un radio de dos casillas. Tras el despliegue, el dron puede moverse y atacar inmediatamente. Funciona como una unidad independiente y puede atacar una vez por turno. Su efecto dura 2 turno. Tiempo de reutilización de 1 turno.
feat_desc_145_Lv4=Despliega un dron en un radio de dos casillas, hasta dos veces por turno. Tras el despliegue, el dron puede moverse y atacar inmediatamente. Funciona como una unidad independiente y puede atacar una vez por turno. Su efecto dura 2 turno. Tiempo de reutilización de 1 turno.
feat_desc_146=Restaura {1} PV y entra en estado EMCON, lo que impide que la unidad sea atacada activamente por unidades blindadas, de artillería y navales durante 1 turno, con un tiempo de reutilización de 2 turnos. El estado EMCON finaliza al atacar.
feat_desc_146_Lv2=Restaura {1} PV y entra en estado EMCON, lo que impide que la unidad sea atacada activamente por unidades blindadas, de artillería y navales durante 1 turno, con un tiempo de reutilización de 2 turnos. El estado EMCON finaliza al atacar.
feat_desc_146_Lv3=Restaura {1} PV y entra en estado EMCON, lo que impide que la unidad sea atacada activamente por unidades blindadas, de artillería y navales durante 1 turno, con un tiempo de reutilización de 2 turnos. El estado EMCON sigue vigente después del ataque.
feat_desc_146_Lv4=Restaura {1} PV y entra en estado EMCON, lo que impide que la unidad sea atacada activamente por unidades blindadas, de artillería y navales durante 1 turno, con un tiempo de reutilización de 2 turnos. El estado EMCON sigue vigente después del ataque.
feat_desc_147=Aumenta el daño infligido a unidades blindadas, de artillería y navales en un {1}%.
feat_desc_148=Inicia el programa de autodestrucción, consume todos los PV restantes para infligir daño equivalente al {1}% de los PV del dron antes de la autodestrucción a todos los objetivos dentro de un radio de una casilla, lo que afecta tanto a aliados como a enemigos.

army_buff_desc_1511=EMCON: No puede ser atacado activamente por unidades blindadas, de artillería o unidades navales.

event_buff_desc_2481=Rompe relaciones diplomáticas con Japón e Italia.
event_buff_desc_2491=Rompe relaciones diplomáticas con Alemania.


