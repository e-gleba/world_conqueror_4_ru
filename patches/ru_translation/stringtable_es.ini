elite_intro_86=El misil balístico intercontinental Topol-M es una versión avanzada del Topol RT-2PM de diseño soviético. Gracias al enorme empuje que proporciona su cohete de combustible sólido de tres etapas, puede alcanzar velocidades superiores a Mach 20 y un alcance capaz de cubrir la totalidad de los Estados Unidos desde Rusia. Es trasladado por un gran vehículo de transporte.
elite_intro_87=El Arleigh Burke es un destructor moderno perteneciente a la Armada de los Estados Unidos y sigue siendo uno de los más poderosos del mundo. Equipado con el sistema de lanzamiento vertical Mk 41, puede disparar misiles de medio alcance y misiles de crucero Tomahawk mientras ataca varios objetivos simultáneamente. Ha completado con éxito numerosas misiones de escolta en la Guerra contra el Terrorismo y en la Segunda Guerra del Golfo.

