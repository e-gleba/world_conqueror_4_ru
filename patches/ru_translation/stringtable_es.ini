event_stage_intro_20801=Los alemanes nos sorprendieron al sobrepasar la Línea Maginot y al derrotar de manera exitosa a los Países Bajos. El Comando lanzó la Operación Dinamo, nos ordenaron cubrir la retirada del ejército principal francés y la Fuerza Expedicionaria hacia Dunkerque y Calais. En esta era de adoración a la fuerza, las consecuencias del apaciguamiento solo nosotros los podemos soportar. No importa cuán peligroso sea el frente, ¡cumpliremos diligentemente nuestras órdenes! ¡Por el honor de la familia! ¡Por el bien de nuestros compañeros de armas! ¡Por la Real Fuerza Aérea y por el Imperio Británico!
event_stage_intro_20802=Perdimos la mejor oportunidad de retirada. Alfred se lanzó con éxito en paracaídas durante la batalla aérea, pero su destino sigue siendo incierto. Sin embargo, se nos ha susurrado información de testigos oculares: Alfred y otros camaradas capturados están retenidos temporalmente en un pueblo de montaña y pronto serán trasladados a Berlín. El tiempo se acaba y no importa cuán incierta sea la inteligencia, tenemos que intentarlo, no podemos renunciar a nuestros hermanos.
event_stage_intro_20803=La derrota de los Aliados en el Frente Occidental demostró que el campo de batalla terrestre es crítico para esta guerra y las unidades blindadas son la clave. La derrota del ejército en el norte de África es como la derrota del campo de batalla europeo al mismo tiempo. La diferencia está en que, aunque los alemanes siguen atacando rápidamente, nosotros tenemos una ventaja en el suministro de equipos y hombres. Nuestras divisiones blindadas serán invencibles en el teatro norteafricano.
event_stage_intro_20804=¡La Operación Fortitude ha funcionado con éxito y las fortificaciones alemanas en Normandía aún no se han completado! Además, no se ha encontrado ninguna potencia de fuego pesada enemiga en las playas doradas frente a nosotros. ¡La oportunidad está a la mano! Despejaré rápidamente una cabeza de playa para allanar el camino para un desembarco amistoso. ¡Este es el momento en que lucharemos juntos y nos embarcaremos en el viaje para recuperar la victoria!
event_stage_intro_20805=¿Por qué los alemanes todavía tienen tantas tropas para organizar un ataque masivo? Los defensores de Bastoña están atrapados en un cerco con poca posibilidad de retirada. A menos que los refuerzos puedan anticipar los movimientos del enemigo y apoyarnos a tiempo, solo podemos depositar nuestra última esperanza en los británicos.
event_stage_intro_20806=La guerra ha reescrito por completo el panorama mundial y los dos polos de Estados Unidos y la Unión Soviética se han convertido en las nuevas potencias hegemónicas. Las colonias ganaron su independencia, el imperio se hunde y la gloria y el esplendor del pasado quedaron atrás. Tarde o temprano, bajo el nuevo gobierno, nos convertiremos en un vasallo de Estados Unidos. Sin embargo, una nueva amenaza comenzó a asomar, los soviéticos se han apoderado del este de México y están avanzando hacia el norte por tierra con la intención de invadir los Estados Unidos. La guerra de esta nueva era ha comenzado y debemos tener un ejército propio para defender los últimos vestigios de la dignidad imperial.
event_stage_intro_20807=El descubrimiento de reliquias atrajo la atención tanto de los Estados Unidos como de la Unión Soviética al mismo tiempo. Estas armas y tecnologías trascendentales son suficientes para poner el mundo patas arriba y ahora ambas potencias están en movimiento. Sin embargo, guiados por una señal misteriosa, nuestro equipo avanzado tomó ventaja y descubrió un grupo de ruinas en Sudamérica. Quienquiera que sean esas personas, sus propósitos parecen ser los mismos que el mío: romper el patrón existente y restablecer un orden mundial completamente nuevo.
event_stage_intro_20811=Los alemanes nos sorprendieron al sobrepasar la Línea Maginot y al derrotar de manera exitosa a los Países Bajos. El Comando lanzó la Operación Dinamo, nos ordenaron cubrir la retirada del ejército principal francés y la Fuerza Expedicionaria hacia Dunkerque y Calais. En esta era de adoración a la fuerza, las consecuencias del apaciguamiento solo nosotros los podemos soportar. No importa cuán peligroso sea el frente, ¡cumpliremos diligentemente nuestras órdenes! ¡Por el honor de la familia! ¡Por el bien de nuestros compañeros de armas! ¡Por la Real Fuerza Aérea y por el Imperio Británico!
