;战役简介
;__font_type[font_text_]
stage_intro_10001=En este nivel, te mostraré cómo mover unidades y atacar, construir unidades, asignar generales a las unidades, retirar instrucciones y, lo que es más importante, cómo ganar.
stage_intro_10002=En este nivel, te mostraré el impacto de la moral en el ejército, la construcción de instalaciones defensivas de defensa aérea, cómo capturar ciudades, construir puntos de referencia y ver información de la ciudad.
stage_intro_10003=En este nivel, te mostraré los efectos de los terrenos, el uso de aviones de guerra, la producción de bombas nucleares, el uso de misiles y las operaciones navales.
stage_intro_10004=En este nivel les presentaré: las habilidades de las tropas élite, y las funciones de los círculos verdes (puntos clave secundarios) y los puntos de evacuación.
stage_intro_10101=El Mando Supremo ha decidido lanzar un ataque contra Polonia. El Comando te ordena que lideres a tu ejército para atravesar la frontera de Polonia a la velocidad más rápida. Esperamos escuchar de su victoria.
stage_intro_10102=Según los últimos datos de inteligencia, el Mando Supremo cree que las tropas británicas pueden marchar hacia Noruega y amenazar nuestros suministros de mineral de hierro. El Comando te ordena desplegar tropas en Noruega y Dinamarca en nombre de la 'Operación Weserubung' y asegurarte de que los recursos necesarios para el imperio estén en nuestras propias manos.
stage_intro_10103=En un esfuerzo por aniquilar a Francia, el Comando estableció París, la capital francesa, como el objetivo final de esta batalla. Los franceses han construido la fuerte línea Maginot, que es el mayor obstáculo para nuestra invasión. Pero mientras lo pasemos por alto, la defensa francesa será inútil.
stage_intro_10104=Ahora que Francia se ha rendido, Gran Bretaña se convierte en nuestro mayor enemigo. Su presencia hará que nos resulte imposible movernos hacia el este con facilidad. El Mando Supremo te ordena cruzar el Canal de la Mancha y eliminar a los británicos de una vez por todas. Quitar las amenazas al continente europeo.
stage_intro_10105=Recientemente, la armada británica se ha vuelto cada vez más activa en el mar Mediterráneo. Esto no solo afecta nuestros planes operativos en el norte de África, sino que también amenaza nuestra seguridad territorial. El Primer Ministro le ordena recuperar el control del Mediterráneo. Es de gran importancia para nuestro país y nuestros aliados.
stage_intro_10106=Las victorias de nuestros aliados traen una gran confianza al Primer Ministro. Decide revivir la gloria del imperio de Roma. De acuerdo con su política de expansión, comenzaremos nuestras operaciones militares en la península de los Balcanes. Nuestros aliados, Rumanía y Bulgaria, nos ayudarán. ¡El primer ministro espera sus buenas noticias!
stage_intro_10107=El Mando Supremo ha decidido lanzar la operación Barbarroja. Su objetivo final es capturar Moscú, la capital de la Unión Soviética. Continuaremos usando 'Blitzkrieg' y venceremos a la Unión Soviética a la velocidad más rápida. El imperio obtendrá mucho petróleo y una gran cantidad de mano de obra, los cuales son recursos críticos para nosotros.
stage_intro_10108=Los ataques de los aliados nos impiden tomar el Canal de Suez y Puerto Alejandría. Al mismo tiempo, nuestros suministros son cada vez más escasos. Debemos luchar contra los aliados atrincherados allí y cortar sus líneas de suministro, para que podamos controlar toda la región del norte de África.
stage_intro_10109=Leningrado es una de las ciudades más importantes de la Unión Soviética. El Mando Supremo considera su importancia superior a la de Moscú. La captura de la ciudad tiene una gran importancia estratégica para el imperio. El Comando ha movilizado a todo el ejército del norte y el regimiento de Finlandia luchará con nosotros.
stage_intro_10110=El Sexto Ejército del General Paulus ha caído en el estrecho cerco del ejército soviético. ¡El Comando Supremo te ordena rescatarlos a toda costa de inmediato! El Comando ha movilizado a las tropas de los alrededores como refuerzos. Espero que obtengas el control de Stalingrado mientras rescatas con éxito.
stage_intro_10111=El fracaso parcial del plan Barbarroja proviene del hecho de que subestimamos al enemigo. El Comando Supremo cree que no tiene ningún efecto en la conquista del imperio de toda Europa. ¡Ahora solo queda un paso para conquistar Europa! Toma Moscú y cumple con la parte restante del plan Barbarroja.
stage_intro_10201=La línea de defensa de nuestros aliados está a punto de colapsar bajo el rápido ataque del ejército alemán. Ahora que las fuerzas de la coalición están sitiadas en Dunkerque, el canal de la Mancha detrás es la única salida. El cuartel general ha dado la orden de que debemos resistir al ejército alemán a toda costa y ganar más tiempo para la fuerza principal.
stage_intro_10202=La retirada en Dunkerque nos cuesta casi todo el equipo pesado. El loco ataque de los alemanes nos agota de defender y hace imposible que nuestro ejército se defienda. El cuartel general te ha entregado el equipo superior restante a ti y a las tropas que te rodean. Eres la última esperanza de Gran Bretaña.
stage_intro_10203=Hemos hundido muchos barcos de suministro alemanes en su camino a Túnez. Ahora el ejército alemán en el norte de África carece de suministros. Esta es una buena oportunidad para expulsar completamente a los alemanes. Pero el terreno en Túnez es complejo y los alemanes han construido una gran línea de defensa. Esta batalla no es tan fácil como parece.
stage_intro_10204=Las fuerzas del eje en el norte de África han sido derrotadas. Solo cuando Italia se retire de la guerra, el mar Mediterráneo estará completamente bajo nuestro control. El cuartel general te ha ordenado a ti y a tus tropas atacar Sicilia. Este será el primer paso de los aliados para liberar el continente europeo.
stage_intro_10205=El Comando ha recibido información de que los alemanes han reunido una gran cantidad de artillería y tanques y están a punto de lanzarnos un ataque a gran escala. No hay duda de que esta campaña afectará la situación en el futuro. Esta es una gran prueba para ti. ¡Hay que vencer por nuestra patria querida!
stage_intro_10206=La radio alemana siempre afirma que son invencibles. Pero todo parece bastante ridículo en presencia de nuestras continuas victorias. El Comando te ordena recuperar Kiev. Te respaldaremos con disparos intensivos para evitar posibles bajas.
stage_intro_10207=Nuestras unidades avanzaron hasta el área de Bielorrusia. Esta vez eliminaremos al ejército alemán de nuestro territorio. Alemania movilizó sus tropas de reserva para suplementar sus pérdidas en las anteriores batallas. Será mejor que te abras a través de sus defensas antes de que lleguen sus refuerzos y liberar cada lugar de nuestra nación.
stage_intro_10208=Para un rápido cierre de la guerra, debemos abrir un nuevo campo de batalla en Europa. El cuartel general ha tomado la decisión final de establecer el sitio de ataque en la dirección de Normandía, inesperadamente por el enemigo. Nos hemos estado preparando para esta operación durante mucho tiempo. Esta será la batalla más grande en la que hayas participado.
stage_intro_10209=Nuestras acciones han logrado la victoria escénica. El cuartel general ha dado la última orden de que usted y sus fuerzas recuperen todas las tierras del sur de Francia y destruyan las tropas alemanas restantes allí, volviendo a poner en funcionamiento el puerto del sur. Esto jugará un papel crucial en la situación de guerra.
stage_intro_10210=Para cruzar el Rin directamente y exponer Berlín por completo frente a nuestros aliados, el cuartel general decide implementar una operación aerotransportada a gran escala. Pero los alemanes no abandonarán fácilmente su última barrera natural. Entonces, una vez que comience la acción, tú y tus tropas lucharán en el infierno.
stage_intro_10211=Los alemanes están reuniendo sus últimas fuerzas para defender su capital, Berlín. Aunque los aliados superan en número al ejército alemán, los alemanes desesperados definitivamente lucharán. El cuartel general espera que puedas tomar la iniciativa en el control de Berlín antes de que lleguen otros países.
stage_intro_10301=La flota del Pacífico de los Estados Unidos es el mayor obstáculo para la expansión del imperio, por lo que debe ser destruida. Estamos a punto de lanzar un ataque sorpresa dibujado por la sede de Tokio. Nuestro objetivo es Pearl Harbor de la base naval de los Estados Unidos. La flota del imperio te ayudará en el mar. Capture Hawái y haga pedazos la flota del Pacífico.
stage_intro_10302=Bajo el feroz ataque alemán, Gran Bretaña no tiene tiempo para tomar en cuenta sus intereses en Asia. En aras de obtener más recursos, el cuartel general le ordena atacar la colonia británica, la península malaya y capturar Singapur. Cuidado con las flotas reales británicas. Tienen una poderosa potencia de fuego.
stage_intro_10303=Los británicos han construido una carretera con la ayuda de los lugareños a través de la cual se asegura un flujo constante de mercancías. Para luchar mejor contra Gran Bretaña, el cuartel general ordena atacar Birmania, cortando sus líneas de suministro. Después de capturar el objetivo, asegúrate de mantenerte firme y mantener la carretera bajo control imperial.
stage_intro_10304=El cuartel general fijó su próximo objetivo en Australia, pero antes de atacar Australia, debemos capturar las áreas circundantes y construir una serie de instalaciones de defensa, cortando las líneas de suministro entre los Estados Unidos y Australia. Las operaciones de aterrizaje comenzarán tan pronto como nuestra flota llegue al área designada.
stage_intro_10305=Es el momento oportuno. Ahora es el mejor momento para atacar Australia. El cuartel general requiere que tú y tus tropas ataquen desde tierra, ocupando todas las ciudades costeras. La armada del imperio te dará pleno apoyo desde el mar. ¡Cuidado! Nuestras fuerzas son limitadas, por lo que debemos reducir costos innecesarios.
stage_intro_10306=La operación de ataque a la región de Imfal ha fracasado. Nuestras tropas sufren grandes pérdidas y el ejército británico sigue persiguiéndonos. Es probable que esto se convierta en una derrota a gran escala. El cuartel general te ordena que construyas una línea de defensa en el lugar para detener su ataque.
stage_intro_10307=La guerra entre Alemania y la Unión Soviética ha entrado en la etapa final. Para derrotar a la Unión Soviética lo antes posible, Alemania espera que podamos atacar a los soviéticos en el Lejano Oriente para inmovilizar efectivamente a sus fuerzas principales en Siberia. ¡Cuidado! No somos rival para las poderosas fuerzas blindadas de la Unión Soviética.
stage_intro_10308=Con la intención de invadir América del Norte con los alemanes, el cuartel general ha decidido atacar primero Canadá. Esta es la operación marina de mayor distancia que jamás hayamos realizado. Su flota necesita atravesar la línea de defensa costera de Canadá. ¡Cuidado con los americanos! ¡No nos expongas, de lo contrario seremos atacados por delante y por detrás!
stage_intro_10309=El imperio ha logrado resultados brillantes en las batallas anteriores, pero los fuertes Estados Unidos aún no han sido derrotados. Según la inteligencia, los estadounidenses han desarrollado un arma poderosa que probablemente cambiará el resultado de la guerra. El cuartel general decidió atacar a los Estados Unidos de inmediato. El reloj está corriendo.
stage_intro_10401=Los japoneses han asaltado Pearl Harbor. Tal comportamiento no es diferente a la declaración de guerra. Nuestros aeropuertos están destruídos y los barcos en el puerto no pueden luchar. Ahora solo podemos confiar en las flotas de patrulla, que es nuestra última esperanza.
stage_intro_10402=Las fuerzas imperiales fueron gravemente golpeadas por los japoneses en Malasia. Este es un gran desastre en la historia británica. Ahora los japoneses están planeando una nueva ronda de ataque contra Singapur, algo que no podemos soportar. Organiza el contraataque y una vez que llegue la Armada Real, se unirá inmediatamente a la batalla.
stage_intro_10403=El personal técnico ha descifrado los códigos de los telégrafos japoneses y se ha enterado de que Japón planea atacar las islas Midway. El Comando te ordena mantener el sitio antes de la llegada de los refuerzos. Nuestra flota de portaaviones ha sido enviada para apoyarlo a la velocidad más rápida. Espero que esté completamente preparado.
stage_intro_10404=El cuartel general ordenó a sus tropas que ataquen la isla de Guadalcanal y ocupen allí la base militar japonesa. Si ganamos el control de la isla, la fuerza aérea podrá atacar todas las bases militares japonesas en el Pacífico Sur, mejor preparados para la contraofensiva en Filipinas. Creo que el general MacArthur no puede esperar ese día.
stage_intro_10405=El intento japonés de capturar Imfal ha fracasado, por lo que las fuerzas aliadas decidieron aprovechar la oportunidad y lanzar un contraataque. El Cuartel General te ordena atacar a los japoneses en Birmania después de la temporada de lluvias. Los japoneses están sufriendo enfermedades, por lo que es el mejor momento para atacar.
stage_intro_10406=Ha comenzado un contraataque integral. El general MacArthur sugiere que capturemos Filipinas, bloqueando la línea de transporte japonesa y cumpliendo su promesa. El Comando ha seguido su consejo y le ordena que coopere con el General MacArthur para asegurar una operación exitosa.
stage_intro_10407=Para que nuestra "fortaleza aérea" pueda bombardear con eficacia las islas principales japonesas, el cuartel general le ordena capturar Iwo Jima y apoderarse de la base de la fuerza aérea japonesa. ¡Cuidado! Los japoneses han construido una enorme fortificación en la isla, y esto nos costará cada paso del camino.
stage_intro_10408=El ejército de los EE. UU. está a punto de lanzar un ataque final en Japón, pero el enemigo todavía nos arrastra aquí. Esto es insoportable para la sede. Debes destruir el ejército enemigo lo antes posible y atacar Japón antes de que lleguen los estadounidenses. El tiempo que queda se está acabando.
stage_intro_10409=Aunque nuestras súper armas han causado un golpe devastador a Japón, todavía se niega a rendirse. Así que el cuartel general decidió atacar las islas principales de Japón. Esta será una pelea dura, y desembarcar en Japón por la fuerza causará grandes bajas. La Unión Soviética lanzará un ataque desde el norte, pero sus objetivos probablemente no sean simplemente Japón...
stage_intro_10501=Las flotas de la OTAN aparecieron en el océano Índico y los cuarteles generales creen que pretenden entrar en el Golfo Pérsico, donde pueden atacar nuestros campos petroleros en el Cáucaso. Para repelerlos, nuestras tropas desplegadas en Oriente Medio pueden prestar una ayuda eficaz.
stage_intro_10502=La OTAN ha codiciado durante mucho tiempo nuestros campos petroleros en la región del Cáucaso. Según la inteligencia, el enemigo ha comenzado a reunirse en Turquía, tratando de atacar nuestros campos petroleros. El cuartel general le ordena que dirija sus tropas al Cáucaso, elimine las tropas de la OTAN allí y marche hacia Turquía.
stage_intro_10503=La OTAN no se quedará quieta mientras capturamos Turquía. Han comenzado a reunir una flota en el mar Mediterráneo en un intento de detener nuestras operaciones militares en Turquía. Ocupa Turquía y destruye la flota de la OTAN. El cuartel general considera que esta es una excelente oportunidad para hacerse con el control de la región mediterránea.
stage_intro_10504=La OTAN cree que nuestras actividades en el norte de África y la región del Mediterráneo ocupan los intereses de los países europeos. Entonces los países occidentales, encabezados por los Estados Unidos, forman una alianza para luchar contra nosotros. La situación es desfavorable para nosotros. Estamos a punto de enfrentarnos al poder de toda Europa.
stage_intro_10505=Después de perder a sus aliados europeos, Estados Unidos se ha vuelto hacia Asia, buscando formar nuevas alianzas y fuerzas. Mientras desarrollen nuevas fuerzas en Asia, representarán una amenaza mayor para nosotros. Así que el cuartel general espera que ataquen la costa oeste de los Estados Unidos, cortando su ruta a Asia.
stage_intro_10506=Después de una serie de importantes victorias contra la OTAN, nuestras fuerzas se han extendido por Europa, Asia y África. Estados Unidos es nuestro objetivo final. Mientras derrotemos a Estados Unidos, ganaremos toda la guerra. Te enfrentarás a la nación más poderosa del mundo, ya sea en tecnología o fuerza militar.
stage_intro_10601=La Unión Soviética tiene mayores ambiciones tras su victoria contra Alemania en el campo de batalla del Este. Obviamente, buscan ganar más intereses mientras se aprovechan de los países europeos debilitados. En la actualidad, todos los países de Europa no son rival para la poderosa Unión Soviética, por lo que debe combinar fuerzas con otros países europeos para detener su expansión.
stage_intro_10602=Ha estallado una guerra a gran escala en la península de Corea y Seúl, la capital de Corea del Sur, ha caído. Esto ha representado una gran amenaza para nuestros intereses en Asia. El Comando ha aceptado la propuesta del General MacArthur de que nuestros refuerzos desembarquen en la Península de Corea en Inchon. Por favor, mantenga los ojos bien abiertos. Nuestros enemigos no son solo el ejército de Corea del Norte.
stage_intro_10603=Según la inteligencia, la Unión Soviética ha desplegado recientemente una gran cantidad de misiles en Cuba y cerca del Caribe. Esto representa una gran amenaza para nuestra seguridad nacional. El Comando le ha ordenado que dirija sus tropas para marchar a Cuba inmediatamente, eliminando allí las tropas y ocupando los silos de misiles.
stage_intro_10604=Para apoderarse del petróleo en el Medio Oriente, la Unión Soviética bloqueó el canal de Suez. Este tipo de comportamiento sin duda afectará a nuestro despliegue en la región del Mediterráneo y Oriente Medio. El Comando requiere que te unas a nuestros aliados británicos en apoyo del Medio Oriente. Expulsar a los soviéticos y restaurar la navegación del Canal de Suez.
stage_intro_10605=Según la inteligencia, los soviéticos han movilizado decenas de miles de tanques en Polonia en tan solo unas pocas semanas. El Comando cree que no queda mucho tiempo antes de que la Unión Soviética lance un ataque integral. Debemos tomar medidas para apoyar a Europa. Comandante, tendrás que enfrentarte a una poderosa máquina de guerra.
stage_intro_10606=Aunque hemos derrotado a la Unión Soviética, su rápida rendición es sospechosa. Según Inteligencia, la Unión Soviética ha estado desarrollando en secreto nuevas armas en el polo sur desde hace mucho tiempo. El Comando te ordena que busques a los soviéticos allí. Sus nuevas armas nos amenazan.
stage_intro_10701=Nuestros campos petroleros en el Medio Oriente han sido atacados y ocupados. Esto ha impulsado el precio internacional del petróleo a un máximo histórico. Comandante, puede haber graves consecuencias si nos apresuramos a atacar, pero debemos recuperar los campos petroleros ahora, de lo contrario habrá más y más países en crisis.
stage_intro_10702=La situación en Europa ha sido muy mala bajo el ataque de fuerzas desconocidas. Como centro de la economía mundial, Europa tiene motivos para restablecer la paz lo antes posible. Comandante, dirija sus tropas a Europa y aplaste a las fuerzas desconocidas.
stage_intro_10703=Tras el fracaso de Europa occidental, han comenzado a marchar sus tropas hacia el este. Esta es una gran crisis para la Unión Soviética, cuya economía está al borde del colapso. Comandante, la Unión Soviética nunca será derrotada por el enemigo. Será una de las muchas fuerzas importantes cuando lancemos un contraataque en los próximos días.
stage_intro_10704=América del Norte es una de las áreas más antiguas y más fuertemente atacadas y Nueva York es el principal objetivo del enemigo. La reciente victoria en Europa ha reducido en gran medida la presión sobre Nueva York. El cuartel general decidió aprovechar esta oportunidad y contraatacar, expulsando al enemigo de la tierra libre para siempre.
stage_intro_10705=Las Naciones Unidas han definido a las fuerzas desconocidas como terroristas. Siempre son una amenaza para nuestros hogares y seres queridos, por lo que tenemos que acabar con ellos en todo el mundo. Con las victorias constantes, obtendremos cada vez más apoyo. Es solo cuestión de tiempo antes de que sean completamente destruidos.
stage_intro_10706=Siberia tiene una gran cantidad de recursos materiales. La inteligencia muestra que los terroristas han establecido una base secreta con el objetivo de atacar países asiáticos. El cuartel general cree que la base debe ser despejada, pero el duro entorno de Siberia se convierte en su protección natural. Este movimiento podría ser más difícil de lo que esperábamos.
stage_intro_10707=Sus acciones son mucho más rápidas de lo que pensábamos. Tras la destrucción de la base de Siberia, han concentrado las tropas restantes para atacar nuestras bases en Asia. Aunque tienen una pequeña cantidad de tropas, el resto son tropas de élite, por lo que lidiar con estos enemigos desesperados se volverá bastante difícil.
stage_intro_10708=Rastreamos a los terroristas que se retiraron de Washington y descubrimos que se dispersaron y luego se movieron solos, pero eventualmente todos llegaron a Sudamérica. El Cuartel General ha confirmado que es su base. Comandante, es hora de una batalla decisiva. ¡Destrúyelos por la paz mundial!
stage_intro_10709=Somos demasiado descuidados. No hubiéramos pensado que estos terroristas podrían haberse aprovechado de la base militar antártica dejada por la Unión Soviética y completar la investigación y el desarrollo inconclusos de la Unión Soviética. Esta es la fuente de su tecnología. Ahora que la base antártica se ha convertido en una fortaleza en su negocio, debemos atacar. Tecnología como esta nunca puede caer en manos de terroristas.



;序章对话
;__font_type[font_text_]
stage_dialogue_1=Comandante, antes de ingresar al campo de batalla, puede aprender a luchar a través de la campaña tutorial.
stage_dialogue_2=Te mostraré cada detalle de la operación.
stage_dialogue_3=Si ya sabes pelear, también puedes saltarte esta parte.
stage_dialogue_4=El Comando Supremo ha emitido orden de operación. Nuestras tropas se dirigen al frente. Las tropas enemigas no pueden adaptarse a nuestras nuevas tácticas y una y otra vez se retiran. Creo que nuestro territorio seguirá expandiéndose. Comandante, está a punto de cosechar su honor en el campo de batalla.
stage_dialogue_5=Las fuerzas blindadas alemanas han pasado por alto la línea Maginot. Ahora muchas ciudades han sido tomadas por el enemigo. Comandante, los alemanes están tratando de rodearnos. La situación es crítica. Ahora necesitamos construir una nueva línea de defensa. Deseo que nos lleves a la victoria, aplastando a esos invasores.
stage_dialogue_6=Los estadounidenses no nos han declarado la guerra, pero aplican un embargo a nuestras fuentes materiales. Creo que no pasará mucho tiempo antes de que termine la guerra. Debemos tomar la iniciativa para atacar a los Estados Unidos. Comandante, no podemos sobrevivir a menos que aplastemos la flota del Pacífico de los Estados Unidos. El destino del imperio depende de ello.
stage_dialogue_7=Japón ha lanzado una operación militar a gran escala en el Lejano Oriente. Han ocupado muchos territorios de nuestros aliados. Su próximo objetivo es toda la región del Pacífico. Comandante, debemos detenerlos ahora. El presidente ha dado su orden de movilización. La justicia triunfará.
stage_dialogue_8=Estados Unidos ha combinado fuerzas con varios países de Europa occidental para formar un nuevo aliado militar. Aparentemente esto está en nuestra contra. Y sus líderes han expresado una y otra vez su hostilidad contra nosotros a través de varios discursos públicos. Comandante, el secretario general ha expresado un fuerte descontento por sus acciones. ¡Debemos responder por todos los medios, incluida la guerra!
stage_dialogue_9=La guerra terminó hace mucho tiempo, pero el arsenal de la Unión Soviética ha estado desarrollando nuevas armas continuamente. La Unión Soviética tiene la mayor cantidad de tanques en el mundo. Una vez que estalle la guerra, estas máquinas convertirán a toda Europa en una tierra de pánico. Recientemente han desplegado misiles en regiones cercanas a nosotros. Comandante, debe hacer algo por nuestra seguridad.
stage_dialogue_10=Cuando comenzaron como una pequeña organización, no atrajeron la atención de los líderes mundiales.
stage_dialogue_11=Pero cuando la economía comenzó a declinar, subieron rápidamente. Bajo el nombre de religión, reclutaron a un gran número de civiles y veteranos desempleados.
stage_dialogue_12=Compraron armas de los traficantes de armas de todo el mundo, mientras reclutaban personal científico y técnico para desarrollar una variedad de equipos de alta tecnología.
stage_dialogue_13=Durante los años siguientes, gradualmente ganaron el control de muchos países y regiones a través de una serie de asesinatos o campañas.
stage_dialogue_14=Ahora su poder se ha extendido por todo el mundo. Comandante, los líderes mundiales han decidido unir fuerzas y declararles la guerra.
stage_dialogue_15=Solo derrotándolos podemos recuperar la paz mundial.




