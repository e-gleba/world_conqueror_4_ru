dialogue_3304=Establezcan contacto rápidamente con los demás y reúnanse en la base de la ubicación de coordenadas.
dialogue_3305=¡Fuerzas armadas no identificadas han aparecido de repente en la zona de guerra! Las conversaciones de paz se han visto comprometidas. ¡Lancen un ataque de inmediato!
dialogue_3306=Las comunicaciones se han restablecido. ¡Osborn, estás vivo! ¡Estoy rodeado de fuerzas multinacionales, incluso de un gran número de alemanes!
dialogue_3307=No temo a la muerte porque siempre he luchado por lo que creo. Esta es la clave secreta para Coulson y para mí. Osborn, el resto es tuyo.
dialogue_3308=Fracasé hace mucho tiempo, pero también estoy destinado a triunfar. Sus sacrificios no serán en vano.
dialogue_3309=¿Por qué está Williams allí? ¿De qué lado están? ¿Cuáles son esas armas?
dialogue_3310=Los refuerzos han llegado al campo de batalla. Los ataques aéreos alemanes a lo largo del camino han ralentizado seriamente nuestra marcha.
dialogue_3311=Se ha establecido contacto con fuerzas amigas en los alrededores de la base y las instalaciones funcionan con normalidad. Ahora es el momento de vengar la muerte de nuestros camaradas.
dialogue_3312=La disputa territorial en Leticia se está extendiendo hasta convertirse en una guerra total. Ayudaremos a Colombia a lograr la victoria y a extender el poder alemán por todo el mundo.
dialogue_3313=Este conflicto se repite constantemente aquí. No es la primera vez y, sin duda, no será la última.
dialogue_3314=¿Por qué el ejército peruano nos dispara? No vamos a deponer las armas ni a rendirnos.
dialogue_3315=Maldita sea, hace un momento comandaste un escuadrón que atacó tanto al ejército colombiano como al peruano. Ahora tenemos que llevarte a un lugar seguro.
dialogue_3316=Conozco un lugar seguro, justo en la selva tropical, cerca de la triple frontera
dialogue_3317=¡Son ustedes chicos! Así es.
dialogue_3318=Prioricen la eliminación de las unidades alemanas circundantes para abrir un camino para Coulson y sus hombres.
dialogue_3319=¿Quién eres? ¿Por qué nos ayudas?
dialogue_3320=Por tu ignorancia y coraje.
dialogue_3321=Me parece que te he visto en alguna parte.
dialogue_3322=
dialogue_3323=En cualquier caso, una cosa es segura: es por su culpa que estamos en esta situación.
dialogue_3324=Explicaré todo en la base cuando se hayan eliminado las otras amenazas.
dialogue_3325=La Legión Española de Franco ha llegado con éxito a la línea del frente con la ayuda de aviones de transporte. Atacarán desde el sur en dirección a Madrid.
dialogue_3326=Los servicios de inteligencia indican que la Legión Cóndor alemana se encuentra en plena campaña y temen que Bilbao se pierda rápidamente bajo un ataque aéreo enemigo masivo.
dialogue_3327=Defiendan Madrid y Barcelona con sus vidas. No dejen que los rebeldes nos ganen en ambos lados.
dialogue_3328=La Guerra Civil Española estalló y todo fue exactamente como Osborn lo describió.
dialogue_3329=Para acelerar el avance y formar un cerco sobre Madrid, mis unidades aéreas despejarán las fuerzas republicanas que aún resisten en el norte.
dialogue_3330=Los servicios de inteligencia indican que una unidad de tropas de élite italianas ha desembarcado desde el este. A juzgar por su forma de actuar, parece tratarse de un intento de cruzar el desierto e infiltrarse en nuestro interior.
dialogue_3331=No den ni un paso atrás, utilicen las unidades blindadas para ayudar a la defensa de la infantería y consolidar el flanco oriental.
dialogue_3332=Espero no haber llegado demasiado tarde. El programa en Inglaterra va muy bien.
dialogue_3333=Hemos rechazado a Franco, pero los rebeldes siguen llegando desde el sur.
dialogue_3334=Nuestras intenciones han sido detectadas, pero el despliegue defensivo del enemigo ha sido interrumpido. La operación ha terminado. Es hora de retirarse.
dialogue_3335=Gracias por su oportuno apoyo, pero, a mi juicio, me temo que los ejércitos republicanos están perdiendo la guerra.
dialogue_3336=Las tropas han sufrido numerosas bajas. El mando ordenó a todas las unidades de voluntarios que se reúnan en el este y se preparen para la retirada.
dialogue_3337=Nos veremos de nuevo. Espero que tu plan de salvador-justiciero no te lleve cada vez más lejos.
dialogue_3338=La época dorada de España ya pasó hace tiempo y está atrapada en un ciclo, como sus propias colonias del pasado. ¿Dónde exactamente está nuestra salida?
dialogue_3339=La era del control de los colonizadores, los caudillos y los capitalistas ha terminado. El mundo necesita un cambio y me necesita a mí. Y yo te necesito a ti.
dialogue_3340=Un gobierno iraní pro estadounidense ayuda a Estados Unidos a obtener una ventaja geográfica y estratégica en Oriente Medio. No debemos repetir los errores del teatro de operaciones coreano.
dialogue_3341=Conocemos muy bien a Eisenhower y a sus aliados, por lo que hace tiempo que preparamos una contramedida. Ahora, pongámonos en marcha.
dialogue_3342=¡Los soviéticos nos han tendido una trampa! Han tomado el control de Teherán y otras ciudades del norte. Incluso han invadido Irak y Turquía.
dialogue_3343=Continuemos con el plan. Tenemos nuestras propias cartas.
dialogue_3344=Lucas habla mucho de ustedes. Tengo curiosidad, dada su posición, qué tipo de acción tomarán esta vez.
dialogue_3345=El negocio del petróleo nos ha permitido hacer muchos amigos ricos en los países del Medio Oriente. Tenemos un enemigo común y eso por sí solo es suficiente.
dialogue_3346=Tienes razón, pero esta vez debemos mantenernos neutrales en la superficie. Un gasto militar tan pequeño todavía es asequible.
dialogue_3347=No enviaremos tropas voluntariamente, pero proporcionaremos suministros constantes para sus fuerzas.
dialogue_3348=La Agencia de Inteligencia ha tenido esto en cuenta desde hace tiempo. Mercenarios y hombres armados han estado acechando en las principales ciudades con antelación.
dialogue_3349=¿Qué clase de artillería es ésta?
dialogue_3350=Esta es mi patente. Puedo explicarte gradualmente los principios de diseño más adelante.
dialogue_3351=Un ataque total soviético ha amenazado nuestra base. Los contraataques comenzarán de inmediato.
dialogue_3352=La operación en Teherán ha sido un éxito. Según información fidedigna, el enemigo está a punto de desplazar el centro de gravedad de su ataque y enviar refuerzos importantes a Irán.
dialogue_3353=Estamos expulsando el poder soviético de esta tierra.
dialogue_3354=Hemos tomado el control del satélite con éxito. Las armas satelitales están en línea.
dialogue_3355=Las unidades soviéticas que los rodean serán eliminadas y nos aseguraremos de que estén a salvo.
dialogue_3356=Nuestras operaciones en Sudamérica ya han revelado nuestra presencia. Ya no hay necesidad de disimular.
dialogue_3357=Los insurgentes han tomado nuestra base de investigación en Sajalín, movilizaremos nuestras fuerzas para recuperarla.
dialogue_3358=Incluso con la información proporcionada por los expertos soviéticos, era imposible llevar a cabo el secuestro en tan poco tiempo. ¿Cómo demonios lo hiciste?
dialogue_3359=El éxito de la investigación atrajo la atención de la gente que estaría dispuesta a aprovecharse de ello o arrebatarlo. Es el resultado de la codicia y la envidia. Ahora quieren mi cabeza para poder tomar el control.
dialogue_3360=¡El nuevo tratado de seguridad entre Estados Unidos y Japón traiciona nuestros intereses! Seguiremos luchando hasta la victoria o la muerte.
dialogue_3361=El levantamiento interno en Japón ha distraído al ejército de Estados Unidos, lo que es un buen momento para retirarnos.
dialogue_3362=No, el líder de la insurrección también es uno de nuestros objetivos de rescate.
dialogue_3363=Un hombre nace entre el cielo y la tierra. ¿Cómo puede vivir deprimido bajo el yugo de otros por tanto tiempo?
dialogue_3364=La gran obra aún está por realizarse y la voluntad de Dios es difícil de desobedecer.
dialogue_3365=Los principales bastiones del enemigo han sido suprimidos. Únanse a nosotros. Luchar en soledad no nos dará ninguna posibilidad de victoria.
dialogue_3366=Los que conocen los tiempos son sabios y los que comprenden las oportunidades son valientes. Puedo unirme a ustedes. Nuestra lucha está lejos de terminar.
dialogue_3367=Estaba a la deriva en todas direcciones sin ningún lugar donde quedarme. Afortunadamente, ustedes me han salvado y tengo un lugar para mí.
dialogue_3368=Estos separatistas, incitados por Osborn, siguen socavando la unidad de la Unión. Es necesario tomar medidas para erradicar las fuerzas del Escorpión Negro en Europa del Este.
dialogue_3369=El Bloque Oriental está creando divisiones en su seno y me temo que los soviéticos llevan mucho tiempo planeando resolver estos problemas por la fuerza.
dialogue_3370=La misión se ha completado con éxito y he demostrado mi valía y la de nuestra familia. También puedo proporcionar algunos servicios militares adicionales si los necesita.
dialogue_3371=El ejército soviético ha cruzado la línea y no toleraremos que nadie coloque tropas en nuestro territorio.
dialogue_3372=No hay amigos permanentes ni enemigos permanentes. Envíen refuerzos de inmediato para ayudar a Yugoslavia y Rumania. Tengan cuidado con las fuerzas del Escorpión Negro.
dialogue_3373=La inteligencia soviética indica que Wagner se ha unido a la organización Escorpión Negro. Se deben tomar medidas inmediatas.
dialogue_3374=¡¿Cómo es posible?!
dialogue_3375=Luchen por los soviéticos o peleen por ustedes mismos. Ahora la elección es suya.
dialogue_3376=¡Maldita sea, son ustedes otra vez! Si quieren una respuesta, se la daré.
dialogue_3377=Nadie puede preverlo todo, nadie puede decidir por sí solo el resultado de una guerra.
dialogue_3378=Parece que ustedes no me dejarán ir.
dialogue_3379=Continúen el ataque. Esta artillería en mis manos estará a su máxima potencia.
dialogue_3380=Hemos reprimido a los soviéticos en Polonia y mis hombres continuarán su ataque hacia el este.
dialogue_3381=Las victorias localizadas tampoco pudieron quebrantar el poder de Estados Unidos y los soviéticos en Europa.
dialogue_3382=Eso es seguro, pero no vamos a dejar pasar ninguna oportunidad que permita que nuestros enemigos se desgasten entre sí.
dialogue_3383=La guerra en el Este ha escalado y los insurgentes de California y Texas formaron una alianza que gradualmente ganó ventaja.
dialogue_3384=Estados Unidos no necesita a un presidente débil.
dialogue_3385=Ninguna táctica es indestructible si se actúa con la suficiente rapidez.
dialogue_3386=Sean los primeros en tomar el control del cuartel general de los insurgentes en la retaguardia. Así terminarán la guerra antes de lo previsto.
dialogue_3387=La guerra en el Este es irreparable. Temo que la situación aquí tome un nuevo rumbo también.
dialogue_3388=Tal vez sea momento adecuado de retirarse y pasar de la ofensiva a la defensiva.
dialogue_3389=Regresemos a nuestras bases en México y estemos atentos al ejército de Estados Unidos en Texas.
dialogue_3390=Washington ha sido capturado por la Alianza Insurgente. El mundo será testigo una vez más de nuestra determinación y fortaleza.
dialogue_3391=No importa qué clase de estadounidenses son, Osborn y su Escorpión Negro son nuestros enemigos. El ejército de Estados Unidos los perseguirá hasta los confines de la Tierra.
dialogue_3392=Tal como están las cosas, hagámoslo.
dialogue_3393=A medida que la situación en el país se estabiliza, más aliados se unen a nosotros en la lucha contra el Escorpión Negro.
dialogue_3394=Se han logrado avances importantes en el análisis técnico de las reliquias antárticas. No se debe permitir que ninguna fuerza ponga un pie en la Antártida.
dialogue_3395=Nos estamos acercando al final de nuestra investigación, ¡así que mostrémosle a esta gente ignorante algo de verdadero poder!
dialogue_3396=No, ¿cómo es posible?
dialogue_3397=Parece que nuestra serie de acciones no ha ralentizado el proceso de I+D soviético, pero aún estamos a tiempo.
dialogue_3398=Los datos de la base del Escorpión Negro se han recuperado con éxito y la información indica que estamos siendo atacados desde el futuro. Pero no se ha encontrado información sobre Osborn.
dialogue_3399=La flota ha bloqueado las aguas al este del complejo de las islas y se cortó el contacto entre las fuerzas del Escorpión Negro.
dialogue_3400=Destruyan a todos los enemigos en la Antártida. Ningún enemigo saldrá vivo de aquí.
dialogue_3401=Se ha completado el prototipo del nuevo tanque. El poder de esta arma quedó plenamente demostrado en la Primera Batalla por Sudamérica.
dialogue_3402=La investigación soviética se completó con éxito y, una vez puesta en producción en masa, las consecuencias son inimaginables.
dialogue_3403=No es demasiado tarde para detener a los soviéticos en este instante.
dialogue_3404=Además de este avanzado equipamiento militar, hay otra tecnología aún más sorprendente.
dialogue_3405=Osborn, resulta que la ignorancia es tu verdadera arma.
dialogue_3406=El ejército se ha desintegrado. El mundo arde a mis pies.
dialogue_3407=Osborn, ¿estás bien? Te encuentras en un estado un poco extraño.
dialogue_3408=En el futuro lejano, solo hay guerra.
dialogue_3409=Es como si se hubiera convertido en una persona diferente.
dialogue_3410=Ya he conseguido las otras doce llaves secretas y aún estoy con vida. ¡Esta vez gané!
dialogue_3411=La guerra nunca cambia.

