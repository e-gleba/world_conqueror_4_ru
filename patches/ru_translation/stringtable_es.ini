armygroup_event_desc_68=Las operaciones del Imperio Escorpión en Estados Unidos fueron frustradas una tras otra y todo su ejército emprendió una importante retirada hacia el sur. Con la ayuda de Estados Unidos y la Unión Soviética, varios países se independizaron del control del Imperio Escorpión.
armygroup_event_desc_69=Osborn activó simultáneamente cinco amplificadores de baliza, iniciando la cuenta regresiva final. Tras 20 ciclos, cualquiera que no tuviera una firme determinación se reincorporaría al Imperio Escorpión. Estados Unidos, la Unión Soviética, el Reino Unido y Francia enviaron sus respectivas fuerzas de élite, en colaboración con países vecinos, para lanzar incursiones en las ruinas del Imperio Escorpión en todo el mundo.
armygroup_event_desc_70=La Fortaleza Solar del Imperio Escorpión, ubicada en las ruinas mexicanas, ha sido asaltada y el amplificador de la baliza ha sido confiscado. La ubicación de bases secretas en todo el mundo ha sido completamente expuesta, dejando al Imperio Escorpión en una posición estratégica totalmente vulnerable.
armygroup_event_desc_71=El Eco Búnker del Imperio Escorpión, en las ruinas de Colombia, ha sido asaltado y el amplificador de la baliza ha sido confiscado. Todas las instalaciones en las ruinas estaban configuradas para autodestruirse. Sin embargo, los registros de acceso restantes indican que la instalación se reactivó en 1933.
armygroup_event_desc_72=La antigua ruina del Imperio Escorpión en Brasil, el Ojo del Inca, ha sido asaltada y el amplificador de la baliza ha sido confiscado. De manera crítica, muchas armas y equipos especializados no se transfirieron o destruyeron a tiempo, e incluso existen planos nunca antes vistos de nuevo armamento militar.
armygroup_event_desc_73=Las ruinas del Templo del Rastro Estelar del Imperio Escorpión en Brasil fueron asaltadas y el amplificador de la baliza fue confiscado. Posteriormente, Estados Unidos y la Unión Soviética obtuvieron una gran cantidad de datos cifrados, exponiendo por completo las listas de personal y los despliegues militares globales del Imperio Escorpión.
armygroup_event_desc_74=El Faro del Huracán del Imperio Escorpión, en las ruinas de Brasil, ha sido asaltado y el amplificador de la baliza ha sido confiscado. La comunicación entre las fuerzas principales del Imperio Escorpión y sus miembros en todo el mundo se interrumpió temporalmente.
armygroup_event_desc_75=La facción Escorpión ha vuelto a expandirse rápidamente, lo que ha impulsado a Estados Unidos y la Unión Soviética a unir fuerzas para erradicar esta amenaza. El Pacto de Varsovia y la OTAN han suspendido temporalmente las hostilidades y formado una nueva alianza militar.
armygroup_event_desc_76=Osborn fue derrotado por completo, deteniendo la cuenta regresiva. Los planes sudamericanos del Escorpión también fueron completamente aplastados.
armygroup_event_desc_77=Todas las instalaciones en ruinas del Imperio Escorpión han sido ocupadas y la cuenta regresiva se ha detenido. Los planes de Escorpión Negro en Sudamérica han sido completamente frustrados.
armygroup_event_desc_78=Osborn fue derrotado por completo, deteniendo la cuenta regresiva. Los planes sudamericanos del Escorpión también fueron completamente aplastados. Todos escucharon el llamado de la libertad.
armygroup_event_desc_79=Todas las instalaciones en ruinas del Imperio Escorpión han sido ocupadas y la cuenta regresiva se ha detenido. Los planes de Escorpión Negro en Sudamérica han sido completamente frustrados. Todos han escuchado el llamado de la libertad.
armygroup_event_desc_80=El último amplificador de baliza restante se ha instalado por completo. Debido a la liberación encubierta a largo plazo de nanomedicina con Q30 por parte del Imperio Escorpión en el área de control, al sonar la campana, los afectados por la nanomedicina pierden gradualmente su consciencia autónoma, regresando finalmente a las filas del Imperio.
armygroup_event_desc_81=Se han descubierto nuevos cráneos de cristal entre las ruinas mayas. Lejos de ser artefactos comunes, son dispositivos de almacenamiento que registran información sobre el templo y datos históricos de civilizaciones desconocidas.
armygroup_event_desc_82=El Cuerpo de Neuschwabenland apareció en la selva sudamericana, portando el equipo militar del Imperio Escorpión. Quizás hayan formado una alianza militar con el Escorpión, o quizás sea el motor de su existencia.
armygroup_event_desc_83=La Unión Soviética entregó grandes cantidades de tanques a Venezuela para establecer una línea defensiva blindada contra las ofensivas del ejército estadounidense y sus aliados.
armygroup_event_desc_84=El Imperio Escorpión armó a los piratas, lo que les permitió saquear barcos mercantes de diversos países en múltiples mares. Esto provocó represalias tanto de Estados Unidos como de la Unión Soviética. Al reforzar aún más sus capacidades navales, flotas de diversas naciones unieron fuerzas para lanzar una campaña a gran escala contra los piratas.
armygroup_event_desc_85=Las fuerzas navales del Imperio Escorpión utilizan la "niebla acústica" para interrumpir los sistemas de radar, atacando continuamente las rutas marítimas alrededor del Canal de Panamá. Las líneas de suministro de los ejércitos de varias naciones se han visto gravemente afectadas.
armygroup_event_desc_86=Estados Unidos transportó por aire en secreto componentes de misiles a Brasil a lo largo de esta ruta vía Colombia y Perú, evadiendo con éxito la detección del Imperio Escorpión y la Unión Soviética.
armygroup_event_desc_87=Cuba fue atacada de nuevo y el equilibrio regional se vio nuevamente perturbado. Mientras tanto, la Unión Soviética brindó rápidamente ayuda militar masiva a Cuba.
armygroup_event_desc_88=Estados Unidos desplegó un enorme conjunto de sonares en el Caribe oriental para detectar y rastrear submarinos soviéticos.
armygroup_event_desc_89=Las pruebas de un aparato experimental de oscilación cortical por parte de la Unión Soviética provocaron un terremoto en la triple frontera entre Chile, Bolivia y Argentina. Debido a su naturaleza extremadamente incontrolable, la investigación sobre esta arma finalmente se suspendió.
armygroup_event_desc_90=La Unión Soviética probó el arma de control meteorológico “Ojo de Tormenta” en Cuba, guiando con éxito un huracán que azotó Florida.
armygroup_event_desc_91=Las estaciones de radio establecidas por organizaciones anti-Escorpión han aparecido gradualmente en países bajo control del Imperio Escorpión en toda la región. Estas estaciones transmiten repetidos llamados a la gente que vive oprimida para que se unan y derroquen al Imperio.
armygroup_event_desc_92=Con el fin de evitar que los satélites espías de los Estados Unidos y la Unión Soviética realicen un reconocimiento exhaustivo de la región sudamericana, el Imperio Escorpión construyó estaciones de interferencia en islas a lo largo de los principales océanos del mundo para interferir y secuestrar señales, interceptando así datos satelitales de las dos superpotencias.
armygroup_event_desc_93=La Marina Real Británica descubrió en la región de las Bermudas un submarino nuclear alemán llamado Nautilus, construido durante la Segunda Guerra Mundial. Este submarino es completamente diferente del Nautilus fabricado posteriormente por la Marina de los Estados Unidos. El submarino permaneció intacto desde ese entonces y el nivel tecnológico de su equipo a bordo supera con creces la de esa época e incluso la tecnología moderna.
armygroup_event_desc_94=El descubrimiento de un enorme yacimiento petrolífero en la selva brasileña ha desatado una feroz competencia por los derechos de extracción entre Estados Unidos, la Unión Soviética y el Imperio Escorpión en la frontera entre Perú y Brasil.
armygroup_event_desc_95=Tras la expulsión de la facción Escorpión de Norteamérica, el ejército estadounidense aprovechó la tecnología de las instalaciones del Imperio Escorpión para reiniciar el Experimento Filadelfia. El nuevo USS Eldridge desapareció una vez más ante la mirada de todos.
armygroup_event_desc_96=La Unión Soviética construyó en Bolivia un dispositivo experimental llamado "Telescopio Terrestre" para sondear el núcleo de la Tierra, abriendo accidentalmente un canal hacia el manto y aprovechando con éxito los abundantes recursos subterráneos.
armygroup_event_desc_97=La cuenca del río Amazonas se vio repentinamente afectada por un brote de fiebre amarilla, lo que provocó una disminución de la eficacia combativa de varias fuerzas nacionales. Sin embargo, no se reportaron infecciones entre las fuerzas Escorpión ni entre las tropas estadounidenses y soviéticas.

