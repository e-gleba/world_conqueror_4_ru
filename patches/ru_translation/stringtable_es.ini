event_108=La Defensa de Moscú
event_intro_108=En el otoño de 1941, el ejército alemán obtuvo sucesivas victorias en el Frente Oriental, acercándose rápidamente a la capital soviética, Moscú. Buscaban terminar la guerra con una velocidad vertiginosa y una fuerza de hierro, forzando a la Unión Soviética a derrumbarse mediante una victoria decisiva. Sin embargo, a medida que se extendía la línea del frente, los suministros se volvían cada vez más escasos y el crudo invierno se acercaba sigilosamente. Enfrentando esta crisis inminente, la Unión Soviética comprometió sus últimas fuerzas en Moscú, convirtiendo el tiempo, el invierno y el sacrificio en armas. Esta ofensiva, inicialmente concebida para ser rápida, se estaba convirtiendo en una agotadora batalla de desgaste y voluntad. No había retirada, solo vida o muerte.



