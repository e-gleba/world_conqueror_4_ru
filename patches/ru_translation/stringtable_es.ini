event_4111=Batalla del Mar de Barents
event_4112=Ofensiva del Vístula-Óder
event_4113=Batalla de Rabaul

event_intro_4111=El 31 de diciembre de 1942, estalló una batalla naval en el mar de Barents entre la flota de escolta británica y la fuerza de asalto de la Armada alemana. A pesar de la superior potencia de fuego de los buques alemanes, la flota de escolta, gracias a sus rápidas reacciones y oportunos refuerzos, protegió con éxito el convoy con destino a la Unión Soviética. La flota alemana no hundió ni un solo buque de transporte y esta derrota provocó directamente la dimisión de Erich Raeder, comandante en jefe de la Armada alemana, siendo reemplazado por Karl Dönitz. Como resultado, el enfoque estratégico de la Kriegsmarine se centró por completo en la guerra submarina.
event_intro_4112=La Ofensiva del Vístula-Óder fue una ofensiva estratégica a gran escala llevada a cabo por el Ejército Rojo Soviético. Ante las dificultades que enfrentaron los aliados occidentales durante la Batalla de las Ardenas, el Ejército Rojo adelantó ocho días su ataque planeado, lanzando asaltos desde las cabezas de puente del río Vístula el 12 de enero de 1945. Bajo el mando de los mariscales Gueorgui Zhukov e Ivan Konev, dos frentes soviéticos rompieron las defensas alemanas con una fuerza abrumadora y liberaron ciudades como Varsovia y Cracovia, avanzando el frente directamente hacia el corazón de Alemania y allanando el camino para la captura final de Berlín.
event_intro_4113=La Batalla de Rabaul fue una operación crucial lanzada por las fuerzas japonesas para apoderarse de un centro estratégico en el Pacífico Sur. A principios de enero de 1942, aviones japoneses con base en portaaviones iniciaron ataques aéreos sobre Rabaul. El 23 de enero, las tropas terrestres japonesas desembarcaron con éxito y capturaron rápidamente Rabaul, fortificándola posteriormente como bastión naval y aéreo. Desde la perspectiva aliada, la pérdida de Rabaul representaba una amenaza directa para sus líneas de comunicación con Australia. Los japoneses aseguraron con éxito una base avanzada vital, lo que facilitó enormemente sus operaciones posteriores en las Islas Salomón y Nueva Guinea.

dialogue_4253=Los submarinos han detectado los movimientos del convoy de transporte británico.
dialogue_4254=La flota se dividirá en dos; después de haber atraído a los barcos de escolta británicos, lanzarán un asalto a gran escala contra la flota de transporte.
dialogue_4255=Los buques de guerra británicos detectaron la flota alemana en el noroeste. Mientras avanzaban para interceptarla, la flota de escolta tendió una cortina de humo para ocultar la retirada del convoy de transporte del campo de batalla.
dialogue_4256=Las tropas alemanas están casi agotadas, pero nuestros refuerzos son inagotables.
dialogue_4257=Las defensas en la zona de Varsovia han sido perforadas y los alemanes se retiran. ¡Continúen la persecución! ¡Avancen a toda velocidad!
dialogue_4258=Las tropas alemanas en Cracovia se han desintegrado. El enemigo ha abandonado sus posiciones y ha comenzado a retirarse hacia el oeste.
dialogue_4259=Tenemos una ventaja absoluta. No permitan que las tropas australianas en la isla escapen. Cierren sus rutas de evacuación.
dialogue_4260=Ante las abrumadoras fuerzas de desembarco japonesas y sufriendo una grave escasez de personal, los defensores australianos se vieron obligados a retirarse hacia el sur.
dialogue_4261=Los sistemas de comunicaciones han mejorado significativamente, lo que permite a los aviones de combate responder con mayor rapidez a las solicitudes de ataque aéreo de las fuerzas terrestres. Lograr la superioridad aérea absoluta es clave, y el futuro pertenece a los aviones de combate.
dialogue_4262=Aunque la situación de la batalla ha empeorado, todavía hay posibilidades de cambiar las cosas.
dialogue_4263=El Alto Mando emitió una orden directa, instruyéndonos a detener nuestro avance.
dialogue_4264=Debemos realizar operaciones intensivas de reconocimiento en previsión de ataques posteriores. Las unidades blindadas siguen avanzando.
dialogue_4265=Cómo… la escala de este ataque aéreo no es ni de lejos suficiente para detener la ofensiva terrestre alemana.
dialogue_4266=¿De dónde surgió semejante fracaso?
dialogue_4267=Alfred ha muerto en combate y el curso de la batalla se ha desviado significativamente de lo previsto. Quizás la próxima vez deberíamos cambiar de mando antes.
dialogue_4268=Este fracaso es inevitable. Pero pagarás por ello.
dialogue_4269=Volveré.
dialogue_4270=Hemos rodeado las fuerzas de Rommel.
dialogue_4271=Nunca subestimen la determinación de los soldados para defender su patria. ¡Retírense!
dialogue_4272=Las fuerzas alemanas siguen oponiendo una resistencia inútil. Capturen Caen y aplasten por completo las líneas defensivas enemigas.
dialogue_4273=Su fuerza de voluntad es verdaderamente admirable.
dialogue_4274=Por el honor de nuestros soldados y por Alemania seguiremos luchando.
dialogue_4275=Solo nosotros podemos rescatarnos. Solo nosotros podemos rescatar a nuestro país.
dialogue_4276=El mal tiempo perjudica gravemente a ambos bandos. Para lograr nuestros objetivos, debemos acelerar la ofensiva.
dialogue_4277=Ningún general prusiano será hecho prisionero.
dialogue_4278=La nevada ha terminado. La contraofensiva comienza ahora.
dialogue_4279=La nieve en los bosques de las Ardenas es de un frío glacial. Siento como si me hubiera desplomado aquí incontables veces.
dialogue_4280=Los recordaré, adversarios insensatos pero admirables. Su himno es, sin duda, un homenaje a la valentía.
dialogue_4281=El experimento del Imperio Escorpión en la Fortaleza del Sol ha demostrado ser un éxito.
dialogue_4282=Tal enfoque podría ser demasiado directo. Quizás algún día se den cuenta.
dialogue_4283=Puede que sea así, pero aun así seguiría confiando en Alfred.
dialogue_4284=Haremos todo lo posible para debilitar las capacidades del enemigo aquí para brindarle el mayor tiempo posible.
dialogue_4285=Los registros de la Fortaleza del Sol indican que los tres amplificadores de baliza en Sudamérica completarán el proceso de depuración después de 10 ciclos experimentales.
dialogue_4286=Conocía el final desde el principio y hacía tiempo que había elegido el camino que seguramente tomaría.
dialogue_4287=El último amplificador de baliza restante se ha instalado por completo. Debido a la liberación encubierta a largo plazo de nanomedicina con Q30 por parte del Imperio Escorpión en el área de control, al sonar la campana, los afectados por la nanomedicina pierden gradualmente su consciencia autónoma, regresando finalmente a las filas del Imperio.
dialogue_4288=Hemos evitado con éxito el desastre, pero aún no hemos erradicado la fuente del problema.
dialogue_4289=Debo reagrupar mis fuerzas y retomar nuestra fortaleza.
dialogue_4290=La Fortaleza Solar del Imperio Escorpión, ubicada en las ruinas mexicanas, ha sido asaltada y el amplificador de la baliza ha sido confiscado. La ubicación de bases secretas en todo el mundo ha sido completamente expuesta, dejando al Imperio Escorpión en una posición estratégica totalmente vulnerable.
dialogue_4291=El Eco Búnker del Imperio Escorpión, en las ruinas de Colombia, ha sido asaltado y el amplificador de la baliza ha sido confiscado. Todas las instalaciones en las ruinas estaban configuradas para autodestruirse. Sin embargo, los registros de acceso restantes indican que la instalación se reactivó en 1933.
dialogue_4292=La antigua ruina del Imperio Escorpión en Brasil, el Ojo del Inca, ha sido asaltada y el amplificador de la baliza ha sido confiscado. De manera crítica, muchas armas y equipos especializados no se transfirieron o destruyeron a tiempo, e incluso existen planos nunca antes vistos de nuevo armamento militar.
dialogue_4293=Las ruinas del Templo del Rastro Estelar del Imperio Escorpión en Brasil fueron asaltadas y el amplificador de la baliza fue confiscado. Posteriormente, Estados Unidos y la Unión Soviética obtuvieron una gran cantidad de datos cifrados, exponiendo por completo las listas de personal y los despliegues militares globales del Imperio Escorpión.
dialogue_4294=Todas las instalaciones en ruinas del Imperio Escorpión han sido ocupadas y la cuenta regresiva se ha detenido. Los planes de Escorpión Negro en Sudamérica han sido completamente frustrados.
dialogue_4295=Osborn fue derrotado por completo, deteniendo la cuenta regresiva. Los planes sudamericanos del Escorpión también fueron completamente aplastados.


