elite_intro_96=El Leopard 2 es un tanque de batalla principal de tercera generación desarrollado por Alemania, reconocido por su rendimiento equilibrado, alta fiabilidad y amplia vida útil. Su icónico cañón de ánima lisa de 120mm ofrece una velocidad inicial y precisión extremadamente altas, capaz de disparar diversos proyectiles perforantes de gran eficacia que ejercen un gran poder destructivo contra objetivos a larga distancia. Su sistema de alta potencia confiere al Leopard 2 una movilidad excepcional, lo que le permite mantener una velocidad y agilidad impresionantes incluso en terrenos difíciles, demostrando un rendimiento de combate incomparable entre los tanques de batalla principales modernos.

