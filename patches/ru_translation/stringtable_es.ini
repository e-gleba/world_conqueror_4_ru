elite_intro_97=El Harrier es el avión multifunción V/STOL más representativo de Occidente y el primer avión a reacción V/STOL del mundo en estar plenamente operativo y desplegado sistemáticamente. Gracias a su diseño de tobera giratoria, que permite el control vectorial del empuje, puede operar sin depender de pistas tradicionales, lo que permite un despliegue flexible en aeródromos improvisados de vanguardia o zonas de aterrizaje temporales, mejorando significativamente su capacidad de supervivencia y maniobrabilidad. Con su estabilidad en vuelo estacionario y sus capacidades de maniobra a baja altitud, el Harrier destaca en misiones de apoyo aéreo cercano y ataque terrestre, proporcionando una ventaja sostenida en la supresión de objetivos de alto valor.

elite_intro_98=El caza Su-30V fue un proyecto secreto de despegue y aterrizaje vertical (VTOL) desarrollado por la Oficina de Diseño de Sukhoi para el Pacto de Varsovia durante la Guerra Fría. Su apariencia y estructura se derivan de las probadas plataformas Su-27 y Su-30, pero su sistema de propulsión y la arquitectura de control de vuelo se han rediseñado por completo. El avión cuenta con toberas bimotores con empuje vectorial y un sistema de sustentación aumentada, lo que le permite realizar despegues y aterrizajes cortos (STOL) en zonas de primera línea sin pistas, así como mantener el vuelo estacionario a baja altitud para proporcionar apoyo aéreo sostenido a las fuerzas terrestres.


