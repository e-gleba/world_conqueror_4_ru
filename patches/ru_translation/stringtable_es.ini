elite_intro_73=El lanzacohetes RPG es una unidad de infantería equipada con un lanzacohetes antitanque (RPG), generalmente utilizado contra objetivos blindados o de defensa de la ciudad. Pueden disparar granadas cohete al enemigo, causando gran daño. Debido a su portabilidad y capacidad para infligir grandes daños, los lanzacohetes RPG juegan un papel importante en la guerra moderna.
elite_intro_74=El tanque Centurión fue un tanque de batalla principal diseñado y construido por el Reino Unido al final de la Segunda Guerra Mundial y entró en servicio después de la contienda. Utilizaba un diseño y tecnología avanzados, estaba equipado con un lanzador de cortina de humo y tenía una poderosa potencia de fuego y capacidades de protección. Desempeñó un papel importante en la Guerra Fría, así como en muchas operaciones militares y se convirtió en uno de los pilares de muchos ejércitos nacionales.
elite_intro_75=El submarino nuclear de la clase Typhoon fue un submarino nuclear de misiles balísticos construido por los soviéticos durante la Guerra Fría y, por mucho, el submarino de mayor tonelaje jamás construido por la humanidad. Con el fin de lograr el principio de "Destrucción Mutua Asegurada", el submarino está equipado con múltiples ojivas nucleares, cuyo alcance permite al Typhoon atacar cualquier objetivo en el mismo hemisferio que él. Al mismo tiempo, el submarino tiene un doble casco compuesto, lo que le proporciona una gran capacidad de profundidad y resistencia a los ataques.
elite_intro_76=Mil Mi-24 Hind es un helicóptero de combate de fabricación soviética. Tiene una poderosa potencia de fuego y es capaz de atacar eficazmente objetivos terrestres. También es muy maniobrable y tiene la posibilidad de esquivar un cierto nivel de fuego enemigo. Debido a su excelente rendimiento y fiabilidad, el helicóptero Hind ha estado en servicio con los ejércitos de muchos países y se ha desempeñado bien en una variedad de entornos complejos.

