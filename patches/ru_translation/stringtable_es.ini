elite_intro_48=La División Brandeburgo fue sometida a un entrenamiento especial con una equipación única. Lideraron una gran variedad de misiones, teniendo una flexibilidad incomparable. Esto les permitió ejecutar operaciones secretas atrás de las líneas enemigas, causando caos y bajas al enemigo.
elite_intro_49=La Fuerza Ojo de Halcón es conocida por sus habilidades de disparo de alta precisión con extraordinaria paciencia y tranquilidad. Su principal misión es utilizar rifles de francotirador precisos para disparar a importantes objetivos enemigos en orden de alterar a las estructuras de comando enemigas y reducir la habilidad combativa del enemigo.
elite_intro_50=Los Médicos de Combate enfrentaron condiciones extraordinariamente difíciles y peligrosos trabajos en el campo de batalla. Constantemente arriesgaban sus vidas para dar primeros auxilios a los heridos en medio del fuego enemigo y explosiones, demostrando capacidades operacionales excepcionales. Su desinteresada dedicación y profesionalismo brindó esperanza a los soldados heridos en el campo de batalla.
elite_intro_51=El M7 Priest fue un vehículo de artillería autopropulsada desarrollada por los Estados Unidos que jugó un rol significativo en muchas batallas durante la Segunda Guerra Mundial. Estaba equipado con un obús de 105mm y la torreta estaba ubicada en la parte trasera del cuerpo, permitiendo al artillero observar y apuntar al objetivo de mejor manera.
elite_intro_52=El pesado Gustav representó la superlatividad de los diseños alemanes de artillería pesada durante la Segunda Guerra Mundial. Contaba con un cañón de calibre de 800mm, pesado en 1.350 toneladas. Podía disparar munición de 7 toneladas a un objetivo que se encontrase a 47 Km. Debido a su inmenso poder, el pesado Gustav fue usado principalmente para atacar importantes objetivos como fuertes y ciudades.
elite_intro_53=El lanzacohetes BM-21 "Grad" contaba con cohetes de 122mm, diseñado por la Unión Soviética durante la Guerra Fría. Fue construido en un chasis de camión y tiene la habilidad de desplegarse y de evacuar rápidamente. También era capaz de disparar salvas en un área designada en un período corto de tiempo, creando fuego de cobertura y causando una gran destrucción en el frente enemigo.
elite_intro_54=El tanque T-44 fue una versión mejorada de la serie de tanques T-34. Fue diseñado para incrementar su poder de fuego, maniobrabilidad y protección. Notablemente, heredó el famoso blindaje inclinado del T-34, cuyo diseño tuvo un profundo impacto en el desarrollo posterior del tanque.
elite_intro_55=El tanque pesado King Tiger estaba equipado con un cañón calibre 88mm que fácilmente podía penetrar el blindaje de los tanque aliados. Su poderosa potencia de fuego y su fuerte blindaje marcaron el mayor desarrollo de la tecnología de tanques y se convirtió en el pináculo del diseño de tanques alemanes durante la Segunda Guerra Mundial.
elite_intro_56=El tanque pesado M26 Pershing fue ideado por la Armada de los EE. UU. al final de la Segunda Guerra Mundial para contrarrestar al tanque alemán Tiger. Estaba equipado con un cañón de 90mm con una maniobrabilidad decente. Luego de la guerra, se continuó usando en algunos conflictos y operaciones militares.
elite_intro_57=El Spitfire era renombrado por su excelente maniobrabilidad, velocidad y potencia de fuego. Luego de continuas mejoras ganó una significante fama en la Batalla de Gran Bretaña. Posteriormente estuvo en el frente europeo, norte de África y Asia, convirtiéndose en uno de los cazas británicos más importantes y representativos de la Segunda Guerra Mundial.
elite_intro_58=La exclusiva estructura de ala doblemente plegada del bombardero Stuka le proporcionó una excelente estabilidad y precisión durante el bombardeo en picado. Demostró una poderosa capacidad de ataque terrestre en los primeros años de la Segunda Guerra Mundial. Las "Trompetas de Jericó" en el tren de aterrizaje producían un aullido único que generaban un fuerte estrés psicológico al enemigo.
elite_intro_59=El C-47, también conocido como "Skytrain", es un avión confiable y adaptable capaz de ejecutar misiones de transporte en una variedad de duras condiciones. Fue ampliamente usado para transportar soldados, suministros y equipamiento, jugando un importante rol en muchas batallas durante la Segunda Guerra Mundial.
elite_intro_60=Los submarinos Tipo Ⅶ, con su excelente capacidad de sumersión y rendimiento de combate, jugaron un rol importante en la Batalla del Atlántico. Estos adoptaron las tácticas de manada de lobo, lo que significaba múltiples submarinos en conjunto para lanzar ataques destructivos a la flota de los Aliados y sus barcos mercantes, consiguiendo brillantes resultados.
elite_intro_61=El HMS Prince of Wales fue un gran acorazado al servicio de la Royal Navy durante la Segunda Guerra Mundial. Su poderosa potencia de fuego y su sólido blindaje le permitió proporcionar un fuerte fuego de soporte y una defensa competitiva en batallas navales. Este buque logró con éxito dañar al Bismarck y forzar su retirada.


