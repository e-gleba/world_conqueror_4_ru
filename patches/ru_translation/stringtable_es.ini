event_stage_intro_21001=El rumbo de la guerra ha cambiado. La ofensiva soviética en la costa oeste ha sido detenida con éxito. La capacidad ofensiva táctica del enemigo ha disminuido constantemente debido a la sobreextensión de sus líneas de suministro, pero su superioridad numérica a nivel de grupo de ejércitos se mantiene. Es imperativo utilizar fortificaciones preparadas para implementar una defensa escalonada y defender los puntos de concentración de refuerzos hasta el inicio de la contraofensiva estratégica.
event_stage_intro_21002=Nuestras unidades, entrenadas encubiertamente, están listas para la ofensiva. La brigada llevará a cabo una toma anfibia de Bahía de Cochinos, asegurando al mismo tiempo la paralización de la red de defensa aérea de la región. La resistencia clandestina también se coordinará con nuestra acción. La CIA ha asegurado que la incursión será impecable.
event_stage_intro_21003=La Flota del Norte soviética ha completado el bloqueo frente a las aguas de Nueva York, pero la situación aún es recuperable. Activen los protocolos de comunicación de emergencia de inmediato e inicien las operaciones de desmantelamiento de la fortaleza. Contacten con las fuerzas de todas las regiones para reorganizar los grupos ofensivos y debilitar a las fuerzas soviéticas en la Costa Este.
event_stage_intro_21004=El ataque directo del ejército soviético a nuestra patria ha sido frustrado por una serie de contraataques. Ahora el enemigo ha reorientado su enfoque hacia países y territorios vecinos. Aunque Europa ya había iniciado medidas defensivas, el ejército soviético se apoderó de Islandia en un plazo extremadamente corto. Groenlandia y Canadá son ahora sus próximos objetivos.
event_stage_intro_21005=Los rebeldes canadienses han formado una coalición con las fuerzas de la oposición dentro de nuestro país, tomando el control de la región de los Grandes Lagos y lanzando una ofensiva hacia el este. Mientras movilizábamos nuestras tropas, el ejército soviético aprovechó nuestra vulnerabilidad e inició otro desembarco. La inteligencia indica que no hay coordinación entre los rebeldes y las fuerzas soviéticas. Debemos aprovechar esta oportunidad, los conflictos entre estas dos fuerzas pueden ayudarnos a reforzar rápidamente a nuestras fuerzas aliadas en diversas regiones, sofocar la rebelión y expulsar a los invasores extranjeros.
event_stage_intro_21006=El conflicto entre Europa y la Unión Soviética se ha convertido en una guerra a gran escala. El rápido avance de la Flota del Norte soviética nos tomó por sorpresa, e incluso a nuestro principal aliado, el Reino Unido, que ahora sufre la ocupación soviética en múltiples regiones de Gran Bretaña. Europa necesita nuestra ayuda inmediata. ¡Nuestras brigadas especiales y aviones de transporte estratégico están completamente preparados y listos para un despliegue masivo en cualquier momento!
event_stage_intro_21007=El ejército soviético está empleando sus últimas reservas estratégicas para luchar como una bestia desesperada y acorralada. Existen claras fallas en su sistema de mando frontal, y sus naciones aliadas podrían no estar tan unidas como creemos. Debemos reunir todas las fuerzas posibles y lanzar una ofensiva hacia el este para hacer retroceder a las fuerzas soviéticas hasta sus fronteras. Esta es una oportunidad de oro para expandir nuestra influencia en Europa.
event_stage_intro_21011=El rumbo de la guerra ha cambiado. La ofensiva soviética en la costa oeste ha sido detenida con éxito. La capacidad ofensiva táctica del enemigo ha disminuido constantemente debido a la sobreextensión de sus líneas de suministro, pero su superioridad numérica a nivel de grupo de ejércitos se mantiene. Es imperativo utilizar fortificaciones preparadas para implementar una defensa escalonada y defender los puntos de concentración de refuerzos hasta el inicio de la contraofensiva estratégica.
