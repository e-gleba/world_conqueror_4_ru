general_stage_intro_151=Esta fue la batalla final en el frente norteafricano de la Segunda Guerra Mundial. El general Eisenhower sirvió como comandante aliado, liderando las fuerzas estadounidenses y británicas en una ofensiva contra las líneas de defensa de las potencias del Eje en el norte de África. Lograron el éxito y finalmente recuperaron Túnez en mayo de 1943.
general_stage_intro_152=Los líderes aliados acordaron unánimemente que el próximo objetivo era Italia. En julio de 1943, Eisenhower fue nombrado comandante en jefe de la invasión de Sicilia. Lideró con éxito a las fuerzas aliadas en el desembarco y las batallas posteriores, ocupando toda Sicilia en poco más de un mes.
general_stage_intro_153=En junio de 1944, los aliados engañaron a los alemanes con inteligencia y lanzaron la mayor operación anfibia de la Segunda Guerra Mundial en Normandía. Con Eisenhower como comandante en jefe, las fuerzas aliadas establecieron una cabeza de puente en Normandía bajo su liderazgo, sentando las bases para campañas posteriores en el continente europeo.
general_stage_intro_154=Después del exitoso desembarco en Normandía, Eisenhower comandó otra operación anfibia en el sur de Francia: la Operación Dragón. En esta operación, los aliados abrieron un segundo frente en Europa, lo que obligó a los alemanes a dividir sus fuerzas y aceleró aún más su derrota.
general_stage_intro_155=Tras la victoria en la Ofensiva de las Ardenas, Eisenhower consideró la importancia de una rápida unión con las fuerzas soviéticas y avanzar hacia el río Rin. En 1945, comenzó la Batalla del Ruhr, que casi se convirtió en la última batalla decisiva en el frente occidental y sentó las bases para la victoria definitiva.
general_stage_intro_161=En octubre de 1941, después de la invasión alemana de la península de Crimea, el 11.º ejército bajo el mando del general Manstein lanzó una ofensiva contra Sebastopol. Esta batalla fue un logro significativo en la carrera militar de Manstein y le valió el rango de mariscal de campo.
general_stage_intro_162=La victoria en la Batalla de Sebastopol puso a Manstein en el centro de atención. El mando supremo le ordenó trasladarse al norte para reforzar el asedio de Leningrado. En agosto de 1942, Manstein dirigió el 11.º Ejército para unirse al asedio más largo de la historia moderna.
general_stage_intro_163=Mientras continuaba la batalla por Leningrado, el mando supremo ordenó a Manstein que se dirigiera a Stalingrado para rescatar al 6.º Ejército asediado. ¿Completará esta misión con éxito?
general_stage_intro_164=El éxito de la Batalla de Stalingrado impulsó a las fuerzas soviéticas a continuar su avance hacia el oeste, con el objetivo de capturar Járkov. Sin embargo, la contraofensiva meticulosamente planificada de Manstein mostró sus destacadas capacidades militares y aseguró una importante victoria para el ejército alemán.
general_stage_intro_165=A pesar de las duras condiciones y las fuerzas inferiores, Manstein pudo liderar a sus tropas para romper las defensas soviéticas, obligando al enemigo a retirarse en el sector sur. ¿Podrá unirse con las fuerzas amigas en la parte norte del campo de batalla y lograr la victoria definitiva en la batalla de tanques más grande de la Segunda Guerra Mundial?

