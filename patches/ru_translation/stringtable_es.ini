event_stage_intro_20613=Los alemanes están continuamente fortificando ambos lados del Dniéper, pero nunca se completará pronto una línea de defensa masiva. Aprovechen esta oportunidad para lanzar una gran ofensiva en el Bajo Dniéper para tomar Kiev y continuar la línea hacia el oeste. Tengan cuidado con los contraataques alemanes y salven la fuerza principal de la ofensiva.
event_stage_intro_20614=Las tropas enemigas se han concentrado alrededor de Leningrado y la heroica ciudad, asediada durante casi tres años, está a punto de ser completamente liberada. Pero los alemanes han establecido una fuerte línea de defensa en el oeste. Es necesario lanzar una ofensiva para derrotar al Grupo de Ejércitos Norte y abrir el camino para un avance hacia el oeste.
event_stage_intro_20615=Crimea tiene un gran valor militar tanto para los alemanes como para nosotros. Al atravesar las defensas que tenemos delante, podremos aislar toda Crimea por tierra y al mismo tiempo lanzar un ataque desde el norte y el este de la península de Kerch. La derrota del enemigo es sólo cuestión de tiempo y la fortaleza de Sebastopol eventualmente será recapturada.
event_stage_intro_20616=Después de las ofensivas de Kursk, el Bajo Dniéper y Crimea, el Grupo de Ejércitos Centro ha quedado expuesto. Al mismo tiempo, los alemanes, engañados por nuestras acciones trampa, han redesplegado algunas de sus fuerzas al Grupo de Ejércitos Norte de Ucrania, en el sur. ¡Se han reunido tropas y ahora es el momento de atacar en todos los frentes y hacer que el enemigo pague por la locura que cometió hace tres años!
event_stage_intro_20617=Los aliados en el frente occidental están retenidos frente al Rin y los alemanes están concentrando sus últimas fuerzas en el frente oriental en preparación para una lucha a muerte. Pero el enemigo ha perdido todas sus fuerzas de élite, por lo que avanzaremos rápidamente hacia el oeste para unirnos a los aliados en el frente occidental lo antes posible. El destino de Berlín está sellado.

dialogue_2900=El combate cuerpo a cuerpo es tan efectivo que los alemanes se encuentran en una situación extremadamente difícil dentro de la ciudad.
dialogue_2901=Lancen un ataque contra las posiciones del ejército rumano en el flanco alemán, atraviesen las defensas enemigas y rodeen por completo al 6.º Grupo de Ejércitos de Paulus.
dialogue_2902=Es sorprendente que los soviéticos todavía tengan suficientes tropas para lanzar un ataque a gran escala. Refuercen inmediatamente en dirección a Stalingrado y díganle a Paulus que retire sus tropas de la ciudad.
dialogue_2903=Los grupos blindados del enemigo han impulsado el Don hacia Stalingrado. Haré lo mejor que pueda para mantenerlos a raya.
dialogue_2904=Hemos traspasado las defensas rumanas. Completen este cerco y aniquilen totalmente al ejército alemán en Stalingrado.
dialogue_2905=Paulus no logró escapar en primer lugar. La operación de rescate ha fracasado. Retírense hacia el oeste y reorganicen la línea defensiva.
dialogue_2906=No tenemos lugar a dónde retirarnos.
dialogue_2907=¡Lanzad un ataque a las posiciones alemanas! Interrumpan los pasos ofensivos del enemigo.
dialogue_2908=No le teman a la artillería soviética. Continúen con la operación Ciudadela. Rompan las defensas soviéticas hacia el norte y el sur.
dialogue_2909=Han llegado refuerzos. Debemos detener a toda costa el avance alemán en dirección a Bélgorod.
dialogue_2910=Detengan los ataques alemanes al norte y al sur. ¡Ganen tiempo para resolver el saliente de Orel!
dialogue_2911=Orel fue capturado y los soviéticos no tardarán mucho en lanzar una nueva ofensiva.
dialogue_2912=Retírense inmediatamente y reorganicen una línea defensiva al este de Briansk.
dialogue_2913=El número de tropas soviéticas superó con creces nuestras expectativas. Mis unidades blindadas sufrieron grandes pérdidas y ya no pudieron continuar el ataque.
dialogue_2914=¡Súbanse a la ola de la victoria! Recuperen Bélgorod y Járkov.
dialogue_2915=Los alemanes han establecido múltiples cabezas de puente a lo largo del río Dniéper. Las fortificaciones enemigas sólo se hicieron más fuertes con el paso del tiempo.
dialogue_2916=Eliminen rápidamente las fuerzas alemanas en el margen izquierdo. Distribuyan nuestras fuerzas a lo largo del Dniéper y lancen una ofensiva total y masiva.
dialogue_2917=Las posiciones en el margen izquierdo se fueron perdiendo una tras otra y ya era demasiado tarde para construir nuevas fortificaciones.
dialogue_2918=Refuercen el río Dniéper. Los soviéticos no deben traspasar fácilmente esta línea defensiva natural.
dialogue_2919=Hemos recuperado Kiev y el camino está abierto para un ataque hacia el oeste.
dialogue_2920=Hemos transportado un gran número de tropas desde el lago Ladoga al perímetro de Leningrado, listas para atacar en cualquier momento.
dialogue_2921=El sistema de defensa alrededor de Narva ya está más completo y con esta línea podremos defendernos de los ataques soviéticos en el norte.
dialogue_2922=Las fuerzas alemanas al norte de Leningrado han sido eliminadas, pero la frontera marítima todavía está bloqueada por la flota alemana y mis tropas tardarán algún tiempo en llegar al frente.
dialogue_2923=La amenaza en el mar ha sido eliminada. Mis fuerzas lanzarán un ataque total contra las últimas defensas alemanas.
dialogue_2924=Los soviéticos nos superaban en número y atacaron con más ferocidad de lo esperado. Se les informó a los defensores de las fortalezas alrededor de Leningrado que se retiraran hacia la línea de defensa de Narva.
dialogue_2925=El cuartel general no aprobó nuestro plan de retirada. Las tropas soviéticas están invadiendo Crimea.
dialogue_2926=No den a los alemanes la oportunidad de recuperar el aliento, continúen el ataque y corten la ruta terrestre desde Crimea al resto de Europa.
dialogue_2927=Retírense a Jersón y reorganicen la línea defensiva. Detengan el ataque soviético a lo largo del Dniéper.
dialogue_2928=Mis tropas continuarán el ataque hacia el oeste y harán retroceder a los alemanes a la orilla derecha del Dniéper.
dialogue_2929=Atacad las fortalezas de Sebastopol. No dejen escapar ni un solo alemán.
dialogue_2930=Los alemanes siguen enviando tropas a Crimea y es necesario destruir las rutas marítimas enemigas.
dialogue_2931=El enemigo adivinó erróneamente la dirección de nuestro ataque principal. Aprovechen esta oportunidad para rodear y destruir rápidamente a las fuerzas alemanas alrededor de Minsk.
dialogue_2932=El avance soviético ha sido demasiado rápido y mis tropas partirán inmediatamente para reforzar el frente a toda velocidad en dirección a Minsk.
dialogue_2933=Logramos el objetivo principal de la operación y las defensas alemanas también se han derrumbado. Aprovechen esta oportunidad para continuar el rápido avance hacia el oeste.
dialogue_2934=Los soviéticos también lanzaron una ofensiva en el norte. Se enviaron refuerzos en dirección a Riga y no se debe permitir que el enemigo acceda fácilmente a la frontera marítima.
dialogue_2935=¡Los alemanes están retrocediendo y el enemigo simplemente no puede resistir nuestra oleada de ataques!
dialogue_2936=Nos perdimos el mejor momento para la defensa estratégica. Pero como soldado, lucharé por mi país hasta el final.
dialogue_2937=¡Adelante, a toda marcha! Encuéntrense con el ejército estadounidense y separen a los defensores enemigos.
dialogue_2938=Los alemanes están dispuestos a luchar contra nosotros hasta el final. Continúen el ataque a Berlín. Mis tropas despejarán los obstáculos del norte.
dialogue_2939=¡La victoria es nuestra! ¡Continúen el ataque y destruyan todas las tropas alemanas que aún resisten!
dialogue_2940=Las líneas de defensa han sido perforadas en todos los puntos y las tropas aliadas se están trasladando a Berlín.
dialogue_2941=Mis tropas seguirán luchando hasta el último minuto.
dialogue_2942=Mi fracaso no significa nada. Berlín está condenado a caer.
dialogue_2943=Los aliados lograron liberar el campo de prisioneros de guerra. ¡Somos libres! ¡Continúen el ataque y destruyan a los alemanes!

