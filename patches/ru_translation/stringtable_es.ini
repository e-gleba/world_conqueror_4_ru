event_4117=Batalla del Cabo Matapán
event_4118=Operación Ten-Gō
event_4119=Batalla de Hollandia

event_intro_4114=Debido a los repetidos reveses que sufrió el ejército italiano contra las fuerzas británicas en el teatro de operaciones norteafricano, el Alto Mando alemán decidió intervenir el 6 de febrero de 1941 para estabilizar la situación. En los meses siguientes, las tropas alemanas (posteriormente reorganizadas en el Afrika Korps) llegaron en oleadas sucesivas al norte de África, revirtiendo decisivamente la retirada italiana. La decisión de Rommel de lanzar una ofensiva tuvo un gran éxito, pero la sobrecarga de las líneas de suministro finalmente presagió una prolongada guerra de desgaste.
event_intro_4115=Tras la victoria soviética en la Batalla de Stalingrado y la presión constante del Ejército Rojo, Manstein abandonó la defensa frontal, concentrando sus fuerzas blindadas para derrotar al impetuoso avance del Frente Sudoeste soviético. Posteriormente, avanzó hacia el norte para retomar Járkov mediante feroces combates callejeros. La operación comenzó el 19 de febrero de 1943. Los soviéticos sufrieron numerosas bajas, pero no lograron modificar la desventaja general en el Frente Oriental. El "Saliente de Kursk" que resultó de esta operación condujo directamente a la Batalla de Kursk, de una magnitud sin precedentes, unos meses después.
event_intro_4116=En marzo de 1941, al llegar la guerra ítalo-griega a un punto muerto, el dictador italiano Benito Mussolini ordenó personalmente la "Ofensiva de Primavera" el 9 de marzo para levantar la moral y expulsar a las fuerzas griegas en Albania. Durante esta operación, el ejército italiano disparó más de 100 mil proyectiles de artillería contra el frente, causando más de 10 mil bajas, pero sin lograr ningún avance estratégico. El fracaso de esta ofensiva condujo directamente a la intervención forzada de Alemania en el conflicto de los Balcanes, lo que cambió radicalmente el curso de la guerra ítalo-griega.
event_intro_4117=A finales de marzo de 1941, las agencias de inteligencia británicas descifraron con éxito por primera vez el código Enigma utilizado por la Armada italiana, lo que les permitió conocer los movimientos de su flota. El 27 de marzo, utilizando la información obtenida, la Marina Real Británica realizó una interceptación cerca del cabo Matapán, hundiendo varios buques y expulsando a la flota italiana del Mediterráneo Oriental.
event_intro_4118=Durante la Batalla de Okinawa, para desviar las fuerzas navales y aéreas aliadas y aumentar las probabilidades de éxito de los ataques kamikaze, la Flota Combinada formó una fuerza especial de ataque suicida con el acorazado Yamato como buque insignia. El plan era que irrumpiera en las aguas cercanas a Okinawa y, tras encallar, sirviera como plataforma de artillería estacionaria para apoyar la defensa y llevar a cabo un ataque suicida. El Yamato finalmente se hundió luego de múltiples oleadas de ataques aéreos por parte de cientos de aviones estadounidenses con base en portaaviones. Esta batalla marcó la destrucción definitiva de la principal fuerza naval japonesa, dejando a la Flota Combinada prácticamente incapacitada para realizar nuevas operaciones.
event_intro_4119=Para romper las defensas japonesas en Nueva Guinea, el ejército estadounidense lanzó una operación de desembarco anfibio el 22 de abril de 1944. Mediante engaños tácticos e intensos bombardeos navales y aéreos, las fuerzas estadounidenses desembarcaron con éxito y capturaron rápidamente los aeródromos y puertos, cortando el paso a los refuerzos japoneses y rodeando al enemigo, atrapándolo eficazmente. Esta operación fue un ejemplo exitoso de "saltar de isla en isla", sorteando al grueso de las tropas japonesas en el este de Nueva Guinea, lo que permitió a las fuerzas estadounidenses alcanzar objetivos estratégicos a un coste relativamente bajo.


dialogue_4312=Continúen con el ataque. Las fuerzas británicas ya no pueden montar un contraataque rápido y efectivo.
dialogue_4313=Los flancos del ejército soviético ya están muy desbordados. Ataquen de inmediato, corten sus líneas de suministro y rodeen Járkov.
dialogue_4314=La ofensiva alemana es extremadamente feroz y nuestras fuerzas ya no pueden mantener la defensa en dirección a Járkov. Tendremos que retirarnos al este por ahora.
dialogue_4315=La flota japonesa avanza hacia Okinawa. Envíen a la fuerza aérea para detener al enemigo y tengan a los buques listos de inmediato para interceptarlos.
dialogue_4316=El acorazado Yamato se ha hundido y la flota japonesa se retira.
dialogue_4317=Tenemos absoluta superioridad naval y aérea, y las defensas japonesas están al borde del colapso. ¡Desembarquen de inmediato!


skill_name_176=Línea Mareth
skill_name_177=Lluvia de Estrellas
skill_name_178=Red Ineludible
skill_name_179=Operaciones Aeroterrestres


skill_info_176=En terreno montañoso o desértico, tú y tus aliados en un radio de 1 casilla reciben [#00FF00#%d%%] menos daño. Al comandar unidades terrestres, la probabilidad de activación de la habilidad "Rumor" aumenta un 25%%. Al final del turno, si hay enemigos en un radio de 2 casillas con la moral baja o en caos, tú y tus aliados en un radio de 1 casilla recuperan un 10%% de sus PV máximos.
skill_info_177=Al ordenar a las tropas que ataquen, existe una probabilidad del [#00FF00#%d%%] de activar un ataque satelital de nivel II contra el objetivo. Al comandar unidades de vuelo estacionario, el daño infligido por este ataque satelital aumenta un 30%% adicional.
skill_info_178=Las unidades enemigas dentro de 3 casillas de la unidad comandada tienen su defensa reducida en un [#00FF00#%d%%] y también reciben un 20%% más de daño por bombas nucleares, ataques de satélites y explosiones tácticas de drones.
skill_info_179=Al ordenar a las tropas que ataquen y realicen ataques aéreos, existe una probabilidad del [#00FF00#%d%%] de asestar un ataque crítico.


dialogue_4318=Es increíble que los italianos lograran persuadir al Führer. Esta vez, no debemos permitir que se repita el mismo error.
dialogue_4319=El bombardeo aéreo ha finalizado y el primer contingente de paracaidistas ya está en posición. ¡Le deseamos mucho éxito a la operación!
dialogue_4320=¡Ataque enemigo! Llamen a todas las unidades, que estén listas para el combate. ¡Mantengan el aeropuerto a toda costa! ¡Notifiquen a la Marina Real para que brinde apoyo a Malta!
dialogue_4321=El apoyo de la Regia Marina proporciona fuego de cobertura para las fuerzas de desembarco.
dialogue_4322=¡El segundo grupo de tropas aerotransportadas está en su lugar para capturar La Valeta lo antes posible!
dialogue_4323=La Valeta ha caído. ¡Malta es nuestra!
dialogue_4324=Retírense inmediatamente a la esquina noroeste. ¡La Marina Real cubrirá nuestra evacuación!
dialogue_4325=Recuperen el aeropuerto de inmediato. Debemos asegurarnos de que nuestra fuerza aérea pueda despegar sin obstáculos.
dialogue_4326=El ejército sur es la fuerza principal para conquistar al enemigo. Es imperativo garantizar que el ejército rompa las líneas defensivas enemigas.
dialogue_4327=El enemigo atacó desde el sur, como se había previsto, y todas las unidades procedieron según el plan. Apoyándose en sus posiciones defensivas, repelieron el ataque enemigo.
dialogue_4328=Lograron apoderarse con éxito de las posiciones del ejército británico, lo que permitió a las unidades blindadas seguir avanzando.
dialogue_4329=Señor, las tropas de primera línea informan que nuestro combustible ya no es suficiente para sostener la ofensiva.
dialogue_4330=Estábamos muy cerca, ¡pero nos quedamos cortos en el último momento! Ordenen a las tropas del frente que detengan la ofensiva, mantengan la línea y esperen el reabastecimiento.
dialogue_4331=¡El combustible del enemigo está casi agotado! ¡Es hora de nuestro contraataque! ¡Vayamos todos a recuperar nuestras posiciones!
dialogue_4332=Como fuerzas de élite de Italia, debemos defender de manera implacable esta altura dominante y no debemos permitir que nos convirtamos en el hazmerreír de nuestros aliados.
dialogue_4333=Las alturas de Deir el Munassib son cruciales para las operaciones posteriores. ¡Guerreros, capturen esa posición!
dialogue_4334=¿Cómo puede ser tan feroz la potencia de fuego de los italianos? ¡Unidades blindadas, avancen rápidamente y brinden apoyo! ¡Utilicen fuego de artillería para sofocar su contraataque!
dialogue_4335=El enemigo opone una resistencia tenaz. Utilicen esta posición como punto de apoyo, mantengan el fuego de supresión y continúen capturando otras posiciones.
dialogue_4336=En un esfuerzo por recuperar la posición, la División Folgore pidió apoyo por radio a la retaguardia.
dialogue_4337=La posición en Deir el Munassib está en peligro; ¡las unidades blindadas proporcionarán apoyo rápidamente!
dialogue_4338=Rommel está de baja por enfermedad. Es el mejor momento para atacar. ¡Ataquen, vamos a derrotarlos en esta batalla!
dialogue_4339=¡Ataque enemigo! ¡Todas las unidades, prepárense para el combate! ¡No debemos permitir que el enemigo rompa nuestras posiciones!
dialogue_4340=Capturaron con éxito las posiciones de primera línea y, apoyándose en el territorio recién conquistado, continuaron avanzando.
dialogue_4341=¡El bombardeo de artillería cubre las posiciones perdidas! En cuanto termine, ¡recuperen las posiciones inmediatamente!
dialogue_4342=Las unidades de artillería se desplegaron rápidamente en el campo de batalla, aliviando así la presión sobre las posiciones avanzadas.
dialogue_4343=Las defensas enemigas están fuertemente fortificadas. ¡Soliciten apoyo de artillería!
dialogue_4344=Rommel ha regresado y la situación en el teatro de operaciones norte se ha aliviado. Manténganse firmes. Un punto de inflexión está a la vuelta de la esquina.
dialogue_4345=El enemigo está concentrando sus tropas y debemos lanzar un ataque preventivo para defender la Línea Mareth.
dialogue_4346=Salgan de la Línea Mareth y destruyan tantas tropas aliadas como puedan.
dialogue_4347=Llegaron noticias del servicio de inteligencia: el enemigo está a punto de atacar. ¡Prepárense para la batalla!
dialogue_4348=¡Excelente! Manténganse firmes y creen una brecha para las fuerzas amigas tanto como sea posible.
dialogue_4349=La primera línea de defensa del frente sur ha colapsado. Las reservas han intervenido. Bajo ninguna circunstancia podemos permitir que el enemigo entre en Medenine.
dialogue_4350=Las unidades blindadas han sufrido grandes pérdidas. Debemos retirarnos o no tendremos suficientes tropas para defender la Línea Mareth.
dialogue_4351=Las tropas de primera línea estabilizarán sus posiciones. ¡Las fuerzas de reserva atacarán y retomarán Medenine!
dialogue_4352=Las fuerzas británicas han tomado las posiciones de mando cruciales de la Línea Enfidaville. Recupérenlas de inmediato. ¡Bajo ninguna circunstancia podemos permitir que esta línea defensiva caiga!
dialogue_4353=El enemigo ha recuperado los Altos de Takrouna y ha solicitado refuerzos desde la retaguardia.
dialogue_4354=¡Genial, por fin llegaron los refuerzos! ¿Hay más refuerzos? ¿No? Entonces supongo que solo quedamos nosotros.
dialogue_4355=Las unidades de artillería apuntaron a la cima de la montaña y abrieron fuego, obligando al enemigo a abandonar la posición. Tras el bombardeo, retomaremos rápidamente las alturas.
dialogue_4356=Las posiciones alemanas se han derrumbado. Como resultado, la presión defensiva sobre los Altos de Takrouna se ha intensificado.
dialogue_4357=Hemos hecho todo lo posible. Manténganse fuertes; quizás lleguen refuerzos pronto.
dialogue_4358=¡Ataquen! El enemigo no tendrá más refuerzos. ¡Capturen los altos y la Línea Enfidaville quedará prácticamente indefensa!
dialogue_4359=Guerreros, nuestro líder nos ha preparado abundantes provisiones de guerra. ¡Bajo su guía, estamos destinados a ganar esta batalla!
dialogue_4360=¡Continúen el asalto e intensifiquen su potencia de fuego! ¡Deben capturar la Colina 731!
dialogue_4361=¡Maldición! ¿Acaso estos griegos están hechos de hierro? ¡A pesar del intenso bombardeo, lanzaron una contraofensiva!
dialogue_4362=Según inteligencia, la flota italiana ha sido avistada. ¡Prepárense para la batalla y hagan todo lo posible por aniquilarlos de un solo golpe decisivo!
dialogue_4363=Hemos avistado la flota de cruceros británica. ¡Lancen un ataque de sondeo con nuestros cruceros para atraer al enemigo hacia nuestros acorazados y luego destrúyanlos con sus cañones principales!
dialogue_4364=¡Retírense de inmediato! No debemos permitir que nuestra flota sufra más pérdidas.

dialogue_4365=Las tropas de ambos lugares han completado con éxito su desembarco. Están avanzando rápidamente tierra adentro para neutralizar al Ejército Imperial Japonés en los alrededores del aeropuerto.

legend_intro_60101=La 185ª División Paracaidista fue una unidad formada específicamente por Italia para llevar a cabo operaciones aerotransportadas. En sus primeras etapas, la división realizó entrenamientos para la Operación C3 (Hércules), un plan para coordinarse con las fuerzas alemanas en un asalto aerotransportado para capturar Malta. Sin embargo, debido a las cuantiosas pérdidas sufridas durante la invasión aerotransportada de Creta, el alto mando pospuso la operación, originalmente programada para julio de 1942. Tras la caída de Tobruk el 11 de noviembre de ese mismo año, la Operación Hércules finalmente fue cancelada. Para entonces, la 185ª División Aerotransportada ya había sido transferida al teatro de operaciones del norte de África en julio y nunca más tuvo la oportunidad de realizar operaciones aerotransportadas.
legend_intro_60102=En julio de 1942, la 185ª División Paracaidista, posteriormente renombrada como la 185ª División de Infantería "Folgore" fue desplegada en el campo de batalla del desierto norteafricano. Estas tropas de élite, originalmente concebidas para ejecutar asaltos aéreos como relámpagos, ahora tenían la tarea de forjar su renombre en las interminables arenas del desierto. El 29 de agosto, esta "División Folgore" libró su primer combate en el norte de África. Durante la Batalla de Alam el Halfa, se encargaron de cubrir el flanco de los blindados alemanes, capturando varias alturas estratégicas y estableciendo una sólida cabeza de puente dentro de las líneas aliadas. Posteriormente, durante la "Operación Beresford" aliada, la división repelió con éxito los intentos de las fuerzas aliadas de recuperar sus posiciones, demostrando su excepcional competencia operativa y eficacia en combate.
legend_intro_60103=El 29 de septiembre de 1942, preparándose para la inminente Segunda Batalla de El Alamein, los Aliados lanzaron la "Operación Braganza" con el objetivo de tomar las posiciones guarnecidas por la 185ª División Folgore. Ante la ofensiva blindada aliada, la División Folgore repelió con éxito el asalto mediante un sistema de trincheras bien construido y un despliegue táctico flexible y ágil, basado principalmente en infantería ligera y una limitada potencia de fuego de artillería, demostrando así su notable destreza en el combate defensivo.
legend_intro_60104=El 23 de octubre de 1942, comenzó oficialmente la Segunda Batalla de El Alamein. La 185ª División Folgore recibió la orden de defender la sección sur de la línea y se enfrentó a una feroz ofensiva lanzada por el XIII Cuerpo británico, que incluía a las famosas "Ratas del Desierto" de la 7ma División Blindada. Durante cuatro días y tres noches de intenso combate defensivo, la división mantuvo su posición con tenacidad, obligando a Montgomery a abandonar sus planes de avance hacia el sur y a redirigir su ofensiva principal. A pesar de demostrar una notable resiliencia táctica en operaciones defensivas localizadas, la División Folgore finalmente tuvo que retirarse junto con las fuerzas del Eje ante el rápido deterioro de la situación general, sufriendo grandes pérdidas durante la retirada.
legend_intro_60105=Tras la Segunda Batalla de El Alamein, los restos de la 185ª División Folgore fueron transferidos a la Línea Mareth para contener el avance aliado. Para frenar los preparativos del Octavo Ejército británico que planeaba asaltar la línea defensiva, las fuerzas del Eje lanzaron la Operación Capri en marzo de 1943, atacando a las tropas británicas que se concentraban en la zona de Medenine. Debido a que la inteligencia operativa se vio comprometida, la mayoría de los ataques de las fuerzas del Eje fracasaron, lo que debilitó la operación en su conjunto. Aunque la División Folgore logró una ruptura local, se vio obligada a retirarse por falta de apoyo posterior.
legend_intro_60106=Hacia el final de la campaña tunecina, las fuerzas del Eje se habían retirado tras líneas defensivas conectadas para oponer una resistencia definitiva. El 20 de abril de 1943, las fuerzas aliadas capturaron los Altos de Takrouna en la Línea Enfidaville. Para estabilizar el frente y retrasar el avance aliado, el mando del Eje envió a las últimas tropas de la 185ª División Folgore a lanzar un contraataque con el objetivo de recuperar los altos y detener el avance enemigo. Esta última unidad recuperó con éxito los Altos de Takrouna y se mantuvo firme durante un día entero. Sin embargo, ante la falta de apoyo, acabó rindiéndose tras agotarse la munición. Así, esta fuerza de élite, originalmente destinada a asaltos aerotransportados, se perdió en una serie de operaciones fallidas, desapareciendo en las abrasadoras arenas del norte de África.

