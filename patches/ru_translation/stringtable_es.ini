feat_name_63=Asalto

feat_desc_62=Inmoviliza las tropas enemigas dentro de 1 unidad circundante durante 1 turno, con un tiempo de reutilización de 3 turnos. Cuando afecta a 3 o más objetivos, el tiempo de reutilización es de 1 turno.
feat_desc_63=El daño infligido a la defensa de la ciudad aumenta un {1}% durante 2 turnos, con un tiempo de reutilización de 3 turnos.

