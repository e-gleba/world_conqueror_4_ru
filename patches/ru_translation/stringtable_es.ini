event_rule=Reglas
;集团军模式规则
armygroup_rule=Reglas del modo Grupo de Ejércitos
armygroup_rule_1=1. La campaña del evento está abierta por tiempo limitado. Se sugiere a los comandantes programar el tiempo de manera razonable para obtener recompensas al pasar etapas.
armygroup_rule_2=2. Al completar los logros del grupo del ejército, puedes ganar puntos de logro. Una vez que alcances el umbral de puntos requerido, podrás reclamar las recompensas de la etapa correspondiente.
armygroup_rule_3=3. La escala y la dificultad de cada grupo de ejército varían y, después de completar la etapa, recibirás las recompensas correspondientes por la misma.
armygroup_rule_4=4. En el modo Grupo de Ejércitos, los jugadores deben derrotar a todos los ejércitos de la facción enemiga para obtener la victoria. El grupo de ejércitos solo será derrotado después de capturar todos los edificios y eliminar todas las unidades. Al declarar la guerra a otros Ejércitos del mismo país, todas las fuerzas aliadas se volverán hostiles hacia ti.
armygroup_rule_5=5. Cada grupo de ejércitos cuenta con sus propios refuerzos y tecnología. Al derrotar a un grupo de ejércitos enemigo, obtienes acceso a sus refuerzos. Derrotar a ciertos grupos de ejércitos desbloquea la tecnología militar correspondiente.
armygroup_rule_6=6. Al destruir unidades y capturar bases enemigas, obtienes puntos de valor y de mérito. Estos últimos pueden usarse para reclutar refuerzos o mejorar tecnologías específicas de la unidad.
armygroup_rule_7=7. Eliminar unidades enemigas y ocupar edificios enemigos reducirá la Lealtad del Ejército correspondiente. Cuando la Lealtad baje por debajo del 15%, si el jugador ha ocupado un territorio de cierta escala y todas las ciudades del Ejército enemigo se han perdido, se activará la función de rendición para forzar la capitulación de dicho Ejército.

