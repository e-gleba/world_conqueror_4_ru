legend_intro_10101=En los campos de batalla de Francia, la 7ma División Panzer sembró el miedo en toda la región como la formidable "División Fantasma", y la Batalla de Arrás, el 21 de mayo de 1940, se convirtió en la prueba más importante de su ascenso a la fama. Ese día, la división recibió la orden de rodear Arrás y avanzar hacia el norte como vanguardia, pero inesperadamente se topó con un contraataque planeado por las fuerzas anglo-francesas, lo que desencadenó un intenso combate. Ante una repentina amenaza en su flanco, la 7ma División Panzer se encontró brevemente a la defensiva. Sin embargo, bajo el mando flexible y decisivo del general Rommel, las fuerzas alemanas finalmente revirtieron la situación y evitaron la crisis. Este enfrentamiento consolidó aún más la temible reputación de la "División Fantasma".
legend_intro_10102=A medida que el enfoque de la guerra cambiaba, la 7ma División Panzer también inició su ofensiva hacia Moscú. Sin embargo, el primer enfrentamiento, la "Batalla de Alytus", ya presagiaba un futuro brutal. La 7ma División Panzer y la 5ta División Blindada soviética se enfrentaron en una batalla de tanques a gran escala en Alytus. La 7ma División Panzer logró repeler a la 5ta División Blindada soviética, que contaba con más de 200 tanques, capturando así Alytus y abriendo el camino hacia Vilna.
legend_intro_10103=El 2 de octubre de 1941, la 7ma División Panzer lanzó un ataque frontal contra las fuerzas soviéticas y derrotó a los refuerzos de tanques soviéticos recién llegados. Junto con la 10ma División Panzer del 4to Grupo Panzer, completó el cerco en Viazma. Este avance destrozó con éxito las defensas occidentales soviéticas, acercando a las fuerzas alemanas al último campo de batalla de la Operación Barbarroja: Moscú.
legend_intro_10104=El viento y la nieve aullaban mientras el invierno moscovita se volvía aún más severo que en años anteriores. Las largas rutas de suministro habían sometido a una gran presión al ejército alemán, obligándolo a depositar sus esperanzas de capturar Moscú en este ataque decisivo. El 15 de noviembre de 1941, el 3er Grupo Panzer, al que pertenecía la 7ma División Panzer, inició su avance hacia Moscú. Con rápidas ofensivas y ágiles maniobras, capturaron sucesivamente Klin y Yakhroma, llegando incluso a vislumbrar el Kremlin en un momento dado. Sin embargo, finalmente flaquearon ante la abrumadora oleada de fuerzas soviéticas.
legend_intro_10105=En 1943, durante la Batalla de Kursk, la 7.ª División Panzer, curtida en numerosas batallas, en ese momento solo pudo servir como una fuerza lateral para cubrir a las unidades principales del 4.º Ejército Panzer. Aún pudieron romper las líneas soviéticas por el flanco y contener al 7ma Ejército de la Guardia soviética, pero tales esfuerzos ya no pudieron alterar el curso general de la batalla. Con las principales fuerzas alemanas derrotadas en Prokhorovka, también tuvieron que retirarse. Las cambiantes condiciones del campo de batalla significaron que ya no podían moverse libremente como antes.
legend_intro_10106=La Segunda Batalla de Kiev fue la última operación de maniobra a gran escala llevada a cabo por la 7ma División Panzer alemana en el Frente Oriental. Debido a la abrumadora superioridad numérica de las fuerzas soviéticas, la división se retiró de Kiev y realizó maniobras de bloqueo flexibles a lo largo de la línea Fastiv-Yitomir, recuperando finalmente Yitomir con refuerzos tras su pérdida temporal. Si bien no pudieron frenar el declive general del frente, ganaron un tiempo valioso para que las fuerzas alemanas se retiraran y se reorganizaran.
legend_intro_20101=La historia de combate de la 3ra División Blindada estadounidense comenzó con el desembarco de Normandía en junio de 1944. Tras el desembarco, los obstáculos de setos preparados por los alemanes obstaculizaron inicialmente a esta formidable fuerza blindada. No fue hasta la Operación Cobra, en julio de 1944, que el ejército estadounidense movilizó miles de bombarderos para realizar ataques masivos sobre posiciones alemanas. La 3ra División Blindada, conocida como la "División Punta de Lanza", avanzó entonces, aprovechando la ventaja de su movilidad blindada para desgarrar las defensas alemanas, que se desintegraban, logrando así un avance a nivel operativo y rompiendo el estancamiento en Normandía.
legend_intro_20102=Tras el exitoso avance de la Operación Cobra, la 3ra División Blindada recibió la orden de avanzar hacia el norte, penetrando directamente en la región de Falaise y formando un cerco con las fuerzas canadienses y polacas que avanzaban desde el norte. Las tropas alemanas cercadas lanzaron oleadas de intentos de ruptura y asaltos en un intento desesperado por sobrevivir, pero no lograron penetrar las líneas de la 3ra División Blindada. Esta batalla casi aniquiló a dos ejércitos alemanes, y la 3ra División Blindada demostró una vez más ser una de las más afiladas de los Aliados en esta prueba de fuego.
legend_intro_20103=En el otoño de 1944, la 3ra División Blindada, como vanguardia del 1er Ejército, atravesó la Línea Sigfrido con una fuerza impresionante y alcanzó las afueras de Aquisgrán. Tras casi dos semanas de intensos combates callejeros, Aquisgrán finalmente fue capturada por completo el 21 de octubre. Tras un breve respiro, la 3ra División Blindada inició su asalto al bosque de Hürtgen en noviembre. El complejo terreno forestal limitó la movilidad de los blindados, y muchos soldados cayeron en combate en este campo de batalla. Tras soportar la brutal guerra urbana y los vastos y densos bosques, esta unidad se convirtió no solo en la punta de lanza de cualquier ofensiva, sino también en una fuerza tenaz capaz de adaptarse a una amplia gama de condiciones de combate.
legend_intro_20104=El 16 de diciembre de 1944, el ejército alemán lanzó un contraataque sorpresa en el Bosque de las Ardenas. La 3ra División Blindada estadounidense, como reserva de élite del 1er Ejército, fue enviada urgentemente al frente norte. Se coordinó rápidamente con otras unidades en varios puntos estratégicos clave para lanzar una contraofensiva, interrumpiendo con éxito la ofensiva alemana.
legend_intro_20105=En marzo de 1945, la 3ra División Blindada, a la vanguardia del 1er Ejército, lanzó un avance a toda velocidad hacia el este desde la cabeza de puente de Remagen para rodear la región industrial alemana del Ruhr. El 1 de abril, nuestra división se unió a las fuerzas estadounidenses del frente norte en Lippstadt, atrapando con éxito a los 320 mil soldados alemanes del mariscal de campo Model en la "Bolsa del Ruhr". Tras dos semanas de operaciones de limpieza, la resistencia alemana se derrumbó, Model se suicidó y, el 18 de abril, se produjo una rendición a gran escala. Esta batalla aplastó por completo a las principales fuerzas del ejército alemán en el Frente Occidental. La 3ra División Blindada se aseguró la victoria mediante maniobras a gran velocidad, pero perdió a su comandante, el mayor general Rose, lo que inmortalizó su profunda gloria y sacrificio en los laureles de la victoria.
legend_intro_20106=En febrero de 1991, la 3ra División Blindada, principal fuerza del 7mo Ejército, lanzó una ofensiva desde el norte de Arabia Saudita contra las defensas iraquíes. Aprovechando la superioridad tecnológica de los tanques M1A1, la división avanzó 260 kilómetros día y noche, derrotando sucesivamente a la 9na Brigada Blindada iraquí y a la División Tawakalna de la Guardia Republicana. Durante la Batalla de Norfolk, destruyeron un gran número de tanques T-72 con un coste mínimo. En cien horas, en coordinación con las fuerzas aliadas, la división aniquiló más de diez divisiones iraquíes, aplastó a las fuerzas de élite de Saddam Hussein y demostró con eficacia el dominio absoluto de las unidades blindadas modernas con casi cero bajas, revolucionando la guerra terrestre moderna.
legend_intro_30101=En el otoño de 1942, marineros de la Flota del Mar Negro formaron la 255ta Brigada de Infantería Naval y fueron desplegados con urgencia para apoyar el frente del Cáucaso. En la región boscosa cercana a Tuapsé, resistieron con firmeza con bayonetas, granadas y fusiles Mosin-Nagant, aplastando la ofensiva alemana "Attika". A pesar de carecer de armamento pesado, libraron una cruenta batalla, empleando incursiones nocturnas y tácticas de flanqueo. El 13 de diciembre, recibieron la Orden de la Bandera Roja por haber bloqueado el paso alemán hacia el Mar Negro a costa de su propia sangre.
legend_intro_30102=El 6 de febrero de 1943, la 255ta Brigada de Infantería de Marina recibió la orden de realizar un desembarco anfibio en la zona de Mysjako, cerca de Novorosíisk, para tomar y mantener el lugar de desembarco conocido posteriormente como "Málaya Zemlia". Ante el incesante bombardeo diurno y nocturno de la aviación y la artillería pesada alemanas, nuestros hermanos de la marina y el ejército terrestre cavaron trincheras y se mantuvieron firmes en esta pequeña extensión de tierra, acorralando a un gran contingente de fuerzas alemanas y sentando así las bases cruciales para la posterior liberación del Cáucaso y la península de Tamán.
legend_intro_30103=En la madrugada del 10 de septiembre de 1943, la 255ta Brigada de Infantería Naval lanzó un asalto de desembarco en el lado sur del puerto de Novorosíisk, bajo la cobertura de la artillería naval. Enfrentándose a densos campos de minas alemanes, alambradas y fuego de artillería costera, capturaron minuciosamente la cabeza de playa poco a poco, allanando el camino para las fuerzas subsiguientes. Finalmente, gracias a los esfuerzos coordinados del 18vo Ejército, lograron tomar la ciudad entera el 16 de septiembre. Esta victoria decisiva sentó las bases para que las fuerzas soviéticas capturaran la península de Tamán y pusieran fin a la campaña del Cáucaso. Posteriormente, la brigada recibió el título honorífico de "Brigada de Tamán".
legend_intro_30104=En noviembre de 1943, la "Brigada Tamán" lanzó un feroz asalto a la cabeza de playa de Eltigen, en la península de Kerch, durante una noche tempestuosa. Desafiando los reflectores y la artillería alemanes, se abrían paso entre las aguas ensangrentadas para tomar el lugar de desembarco, manteniéndolo durante 36 días y 36 noches. Agotados sus municiones y suministros, los soldados repelieron docenas de contraataques con granadas y bayonetas, y el sargento Kostenko dio su vida bloqueando la boca de un cañón enemigo con su cuerpo. Aunque la batalla se cobró un alto precio, logró contener a las principales fuerzas alemanas, sentando las bases para que las fuerzas soviéticas en el frente norte liberaran Crimea.
legend_intro_30105=En mayo de 1944, la "Brigada Tamán", una unidad de élite de la Flota del Mar Negro que operaba bajo el mando del Ejército Costero Independiente, participó en una ofensiva de represalia para liberar Sebastopol. Esta operación derrotó decisivamente al último bastión alemán en Crimea, vengando así la humillación causada por la caída de esta fortaleza estratégicamente vital en 1942.
legend_intro_30106=En agosto de 1944, durante la Ofensiva Jassy-Kishinev, la "Brigada Tamán" se abrió paso con audacia a través del estuario del Dniéster y lanzó un asalto nocturno sobre la cabeza de playa de Akkerman (ahora Bilhorod-Dnistrovskyi). Bajo un intenso fuego defensivo costero alemán, destrozaron las líneas alemanas y se coordinaron con el 46to Ejército para una ofensiva conjunta. Tras feroces combates urbanos, tomaron la fortaleza el 23 de agosto, cortando la ruta de retirada costera alemana y tomando un gran número de prisioneros. Esta operación le valió a la "Brigada Tamán" la Orden de Segunda Clase de Kutuzov, demostrando la letal eficacia de la infantería naval soviética en operaciones anfibias.


