skill_info_162=Al comandar unidades navales, la moral no disminuye. Al realizar un ataque naval crítico, el daño aumenta en [#00FF00#%d%%]. Si un portaaviones amigo se encuentra a 2 casillas o si el comandante está desplegado en un portaaviones, los ataques aéreos, misiles y bombas nucleares infligen un +30%% de daño. Todos los portaaviones amigos a 2 casillas obtienen un +15%% de daño por ataque aéreo.
skill_info_163=Al comandar unidades navales, existe un [#00FF00#%d%%] de probabilidades de asestar un ataque crítico al atacar convencionalmente o al lanzar ataques aéreos. (Si el general posee esta habilidad, los efectos de Líder de Flota y Líder de Fuerza Aérea no son aplicables).
skill_info_164=Al comandar una fuerza de élite de infantería, las unidades amigas (incluida la propia unidad al mando) en un radio de 1 casilla infligen un +10%% de daño a las unidades terrestres (si el nivel de la fuerza de élite es al menos 9, la bonificación es del 15%%). Por cada fuerza de élite amiga adicional dentro del alcance, se aplica una bonificación de daño adicional del [#00FF00#%d%%], hasta un 25%%.
skill_info_165=Tras ordenar a la infantería que ataque, recupera los PV equivalentes al [#00FF00#%d%%] del daño infligido. Si una unidad blindada o de artillería amiga se encuentra a 1 casilla de usted, el alcance de la unidad de infantería cuando ataque y contraataque aumenta en +1.


