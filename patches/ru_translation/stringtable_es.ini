dialogue_3536=Proporcionaremos suministros constantes para sus fuerzas.
dialogue_3537=¡Prepárense! Las batallas que se avecinan serán más brutales que cualquier otra que hayan enfrentado.
dialogue_3538=¿Te suena? Escenas como estas están sucediendo en todo el mundo ahora mismo. Tú podrías ser el próximo.
dialogue_3539=¡El enemigo no es invencible! ¡Nuestra contraofensiva comienza ya!
dialogue_3540=El enemigo lanzó ofensivas simultáneas desde todas las direcciones y muchas ciudades ya fueron sobrepasadas.
dialogue_3541=¡Demostraré a todos que tengo el poder y el coraje para luchar por la libertad!
dialogue_3542=Nuestro Cuartel General ha recibido gran cantidad de información de inteligencia sobre las fuerzas enemigas, sus armas y equipo. Los comandantes que proporcionaron información también lucharán junto a nosotros en las próximas operaciones.
dialogue_3543=Esta es toda la élite que tenemos. Ya sabes qué hacer.
dialogue_3544=Somos absolutamente incapaces de contener la ofensiva del enemigo.
dialogue_3545=Retiren las tropas de las bases en el Lejano Oriente. Vigilen de cerca a las fuerzas soviéticas allí.
dialogue_3546=Según la información proporcionada por Alfred, las defensas del enemigo en Sumatra son significativamente más débiles.
dialogue_3547=Lanzaremos un ataque aquí para atrapar a Osborn.
dialogue_3548=Es extremadamente sospechoso que las fuerzas británicas se atrevan a montar una ofensiva contra Singapur con tan poco número de tropas.
dialogue_3549=¡Defiendan la línea defensiva alrededor de la instalación nuclear! ¡No permitan que el ejército soviético la ocupe!
dialogue_3550=Lanzaremos una ofensiva en el mar y sellaremos las rutas de retirada del enemigo.
dialogue_3551=Implementen la operación de desembarco lo antes posible para eliminar las fuerzas enemigas en el sur. Lanzaremos un contraataque hacia el norte desde aquí.
dialogue_3552=Los que conocen los tiempos son sabios y los que comprenden las oportunidades son valientes. Nuestra lucha está lejos de terminar.
dialogue_3553=No me dejas otra opción.
dialogue_3554=¡Ataquen por la costa! Coordínense con las fuerzas aliadas para lanzar un ataque de pinza y neutralizar a los defensores costeros.
dialogue_3555=Parece que la fuerza principal de la armada enemiga no está aquí. Eliminaremos todas las flotas enemigas en esta zona.
dialogue_3556=Mantendré mi posición hasta que lleguen los refuerzos.
dialogue_3557=Tu victoria no significa nada. Volveremos.
dialogue_3558=Los datos de la base del Escorpión Negro se han recuperado con éxito. Pero no se ha encontrado información sobre Osborn.
dialogue_3559=Alfred, durante la batalla anterior, ya nos demostraste tu valía. Confío en que encontrarás la manera de derrotar por completo a Osborn.
dialogue_3560=Déjenmelo a mí.
dialogue_3561=Es hora. ¡Empecemos!
dialogue_3562=El Escorpión Negro ha experimentado durante mucho tiempo múltiples fracasos, tal vez muchos más de dos.
dialogue_3563=¿Cómo es que estás aquí?
dialogue_3564=Para poder presenciar tu final, el mismo final por el cual no dudarías en sacrificarnos a todos.
dialogue_3565=Te ayudaré a lograr tus propios deseos.
dialogue_3566=Soy tu otro yo. Nos vemos en el otro lado.
dialogue_3567=Nunca dudo de mi criterio.
dialogue_3568=La fuerza del enemigo supera enormemente mis estimaciones.
dialogue_3569=El destino aguarda.
dialogue_3570=Nuestra lucha está lejos de terminar.
dialogue_3571=La operación ha terminado. Es hora de retirarse.
dialogue_3572=Déjalo así.
dialogue_3573=Los Estados Unidos y la Unión Soviética mantienen firmemente su dominio.
dialogue_3574=La inteligencia ha sido errónea repetidamente y debemos replantearnos sobre la situación en el campo de batalla.
dialogue_3575=Alfred, has conseguido cerrar todo con éxito, aunque en realidad no has terminado nada en absoluto.
dialogue_3576=Las instalaciones ya están operativas y hace tiempo que estamos listos para partir. Adiós, mi otro yo.
dialogue_3577=Los dispositivos aquí le realizarán un escaneo y luego crearán una nueva versión únicamente de usted, conservando todas sus características y recuerdos anteriores.
dialogue_3578=Eres solo un vestigio del viejo mundo y desaparecerás aquí conmigo.
dialogue_3579=Quizás tengas razón, pero incluso en las peores pesadillas, sigo pensando que me mantendré fiel a quien soy.
dialogue_3580=Quizás nos volvamos a ver pronto.
dialogue_3581=Todos pueden empezar ya.
dialogue_3582=Sentimos pena por esta verdad.
dialogue_3583=¡Aniquilen completamente todas las fuerzas enemigas restantes y recuperen la base antártica!


