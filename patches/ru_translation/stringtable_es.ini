dialogue_3412=Debido a la tensión de las líneas de suministro sobrecargadas, la ofensiva soviética ya ha mostrado signos de fatiga.
dialogue_3413=Los refuerzos llegan continuamente al campo de batalla desde todas las direcciones. Mantengan nuestro punto de concentración.
dialogue_3414=¡Sigan avanzando! ¡Que el enemigo tiemble ante nuestras olas de hierro!
dialogue_3415=La fuerza principal se ha reunido por completo, es hora de contraatacar.
dialogue_3416=La contraofensiva estadounidense abrió una brecha en nuestro frente. Organicen las reservas cercanas y destruyan esta brecha.
dialogue_3417=¡Hemos penetrado la fortaleza militar de los EE.UU. y sus refuerzos ya no pueden llegar al campo de batalla!
dialogue_3418=¡La operación ha comenzado! Mi flota cubrirá a los refuerzos para que completen el desembarco.
dialogue_3419=Desplieguen tropas adicionales alrededor de la guarnición británica en Nassau y establezcan un bloqueo a través del Mar Caribe para interceptar los refuerzos navales británicos.
dialogue_3420=¡Demonios, el ejército soviético estaba preparado! Nuestros hombres carecen de armas pesadas. No hay manera de detener la ofensiva blindada del enemigo.
dialogue_3421=La operación es un fracaso casi asegurado. A menos que las fuerzas británicas logren abrirse paso y dispersar las concentraciones de tropas soviéticas, la victoria sigue siendo inalcanzable.
dialogue_3422=Tenga cuidado con las fuerzas aerotransportadas enemigas. Los defensores de todas las regiones deben coordinar sus fuerzas de manera efectiva.
dialogue_3423=Las fuerzas de desembarco y los refuerzos enemigos han sido interceptados. También hemos recuperado el sur de La Habana.
dialogue_3424=El control del ejército estadounidense sobre estas aguas no es tan fuerte como esperábamos, así que continúen el ataque, ¡sin mostrar vacilación!
dialogue_3425=Objetivos principales asegurados. Las unidades de primera línea se retirarán temporalmente. Una vez que reevaluemos la situación, regresaremos al Golfo de México.
dialogue_3426=Las fuerzas soviéticas en Alaska han sido repelidas hasta el estrecho de Bering. Sin embargo, se trataba de un señuelo; los soviéticos se han reagrupado de nuevo a lo largo de la costa este.
dialogue_3427=Los acontecimientos en Cuba han logrado desviar la atención del ejército estadounidense y las reservas de Washington se están agotando.
dialogue_3428=La inteligencia ha sido errónea repetidamente y debemos replantearnos sobre la situación en el campo de batalla. Mantendré mi posición hasta que lleguen los refuerzos.
dialogue_3429=Un submarino de la clase Typhoon cortó repentinamente el contacto con nuestro ejército. Envíen inmediatamente fuerzas submarinas para cazarlo.
dialogue_3430=Nueva York ha caído y ahora estamos al borde del abismo. Aceleren la producción y el despliegue de todas las unidades, la velocidad es nuestra única aliada.
dialogue_3431=El mando de los submarinos soviéticos de la clase Typhoon nos ha sido entregado, úsenlo bien y destruyan las fortalezas del enemigo.
dialogue_3432=Las tropas estadounidenses en la retaguardia aún no se han concentrado por completo. Ahora que el ejército soviético aún no ha establecido una posición firme, ¡podemos tomar la iniciativa!
dialogue_3433=¡Groenlandia necesita nuestra ayuda!
dialogue_3434=Enviaremos más tropas para defender la zona antes de que el ejército soviético la ocupe completamente.
dialogue_3435=El ejército soviético ha perdido otro punto estratégico en su ofensiva. Mi flota seguirá lanzando ataques hacia Reikiavik.
dialogue_3436=El ejército estadounidense ha cortado otra de nuestras líneas de suministro. Es hora de considerar la retirada.
dialogue_3437=Reagrupen la flota que rodea Groenlandia. Deben retirarse hacia Islandia.
dialogue_3438=La flota soviética no tiene adónde retirarse. Sin embargo, el enemigo en Europa parece estar tomando medidas. Debemos aplastarlos aquí rápidamente.
dialogue_3439=Los rebeldes norteamericanos atacaron en el momento oportuno. La operación anfibia encontró mínima resistencia. Las fuerzas estadounidenses ya estaban demasiado ocupadas como para atender nuestras acciones.
dialogue_3440=El ejército soviético no es nuestro aliado, pero en la actualidad compartimos el mismo enemigo.
dialogue_3441=La ofensiva rebelde fue extremadamente rápida y feroz.
dialogue_3442=El enemigo avanza rápidamente hacia la costa este.
dialogue_3443=Somos absolutamente incapaces de contener la ofensiva del enemigo.
dialogue_3444=¡¿Cómo se desintegraron nuestras tropas de primera línea con tanta facilidad?! Redireccionen las reservas hacia Canadá y pondremos fin a la rebelión interna en nombre de nuestros aliados.
dialogue_3445=Hagan todo lo posible para impedir que las fuerzas soviéticas ataquen Nueva York. Mis hombres se encargarán de la coalición rebelde en el oeste.
dialogue_3446=Osborn acababa de ser derrotado. ¿Cómo pudo reaparecer allí tan de repente? Desplieguen más unidades de reconocimiento para realizar una búsqueda exhaustiva de la zona.
dialogue_3447=Las cosas no terminarán así. Con el tiempo reclamaré nuestra legítima herencia.
dialogue_3448=El ejército estadounidense, utilizando Islandia como base, ha estado movilizando fuerzas hacia Noruega, avanzando una vez más hacia Europa.
dialogue_3449=La operación en Groenlandia nos brindó la oportunidad de lanzar ataques sorpresa contra el norte de Europa y el Reino Unido.
dialogue_3450=La rápida ofensiva en dos frentes de las fuerzas soviéticas nos dejó al descubierto, haciendo imposible dividir eficazmente nuestras fuerzas para proporcionar alivio en un corto período de tiempo.
dialogue_3451=Debemos decidir rápidamente la dirección principal de nuestra ofensiva.
dialogue_3452=Un gran número de tropas del ejército soviético ya ha desembarcado. Si no se logra una interceptación inmediata, las consecuencias serán inimaginables.
dialogue_3453=Si no se toman medidas inmediatamente, la situación será irreversible.
dialogue_3454=Tengan cuidado con la flota aliada angloamericana que viene a brindar apoyo. Retrasen los refuerzos enemigos hasta que hayamos ocupado toda Noruega y Suecia.
dialogue_3455=Detengan a las fuerzas soviéticas invasoras y avancen hacia el norte. No permitan que el ejército estadounidense interfiera en los asuntos europeos.
dialogue_3456=La vanguardia soviética ya ha penetrado en Alemania Occidental y Dinamarca.
dialogue_3457=No nos queda dónde retirarnos. ¡Avancen! ¡Compriman su avance antes de que se movilicen las fuerzas de la OTAN!
dialogue_3458=¡Pase lo que pase, la llama de la resistencia francesa jamás se extinguirá aunque intenten apagarla!
dialogue_3459=La amenaza cercana ha sido neutralizada. Todas las unidades, prepárense para atacar.
dialogue_3460=El ejército soviético ya ha perdido el control sobre nosotros. Nadie puede detener la reunificación de Alemania.
dialogue_3461=Avanza hacia el este. ¡Esta vez no se repetirá el fracaso del pasado!
dialogue_3462=Si el ejército soviético está a punto de regresar, entonces deberíamos lanzar ahora una contraofensiva y resolver este problema de una vez por todas.
dialogue_3463=Las fuerzas aliadas de la OTAN ya han penetrado nuestra segunda línea de defensa: reúnan tropas inmediatamente para recuperar nuestras posiciones defensivas.
dialogue_3464=Oslo ya ha caído. La situación es terrible para nosotros.
dialogue_3465=El ejército soviético alrededor del Mar Báltico se ha quedado sin fuerzas, ha llegado el momento de atacar.
dialogue_3466=Esto difiere de mis resultados esperados. Requiero datos de combate adicionales para recalibrar las tácticas.
dialogue_3467=Francia se ha derrumbado. A este ritmo, nuestra coalición se fractura sin remedio.
dialogue_3468=Mantengan la calma y sigan luchando. ¡No dejen que un revés temporal debilite su confianza!

