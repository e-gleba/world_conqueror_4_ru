general_stage_name_141=Campaña de El Alamein
general_stage_name_142=Desembarco en Sicilia
general_stage_name_143=Desembarco en Normandía
general_stage_name_144=Operación Market Garden
general_stage_name_145=Campaña de las Ardenas

general_stage_intro_141=En octubre de 1942, bajo el liderazgo del general Montgomery "El Cazador de Zorros", los aliados lograron romper las defensas alemanas y obtuvieron una serie de importantes victorias en el norte de Egipto. La batalla de El Alamein fue un punto de inflexión en el teatro del norte de África durante la Segunda Guerra Mundial, sentando las bases para que los aliados expulsaran a los alemanes del norte de África.
general_stage_intro_142=En 1943, los aliados realizaron un desembarco marítimo masivo en Sicilia, capturando rápidamente la isla y expulsando a los alemanes. Esta operación no solo allanó el camino para la liberación de Italia sino que también marcó una importante victoria aliada en el teatro del Mediterráneo.
general_stage_intro_143=Como uno de los comandantes supremos, Montgomery dirigió a los aliados en una operación de desembarco masiva en la región francesa de Normandía, donde los desembarcos aéreos, marítimos y terrestres lograron establecer cabezas de puente y romper las defensas alemanas. Esta victoria brindó una oportunidad clave para la liberación de Europa.
general_stage_intro_144=Los aliados esperaban lograr un avance rápido hacia el interior de Alemania capturando puentes clave en los Países Bajos y emprendieron una operación aérea masiva para luchar en conjunto con las fuerzas terrestres. Sin embargo, ¿qué desafíos enfrentarán debido a circunstancias imprevistas y la decidida resistencia alemana?
general_stage_intro_145=A finales de 1944, los alemanes lanzaron una ofensiva durante el frío invierno en un intento de cortar las líneas de suministro aliadas. Sin embargo, los aliados se mantuvieron firmes y contraatacaron, arrinconando a los alemanes y allanando el camino para el siguiente avance.

dialogue_2401=¡Aceleren el avance! Derroten a las tropas defensoras de Noruega antes de la llegada del ejército británico.
dialogue_2402=El enemigo está tratando de dividirnos y rodearnos. Rompan estos bloqueos y deténganlos.
dialogue_2403=Los refuerzos de Grecia cooperarán con nosotros y atacarán desde tierra. Expulsen a los alemanes de Grecia de una vez por todas.
dialogue_2404=Cooperen con la Armada para interceptar al enemigo reforzado y destrúyanlos en el mar.
dialogue_2405=Detendré la primera oleada de blindados enemigos. Intercepten los refuerzos enemigos lo antes posible.
dialogue_2406=Para cubrir la retirada de MacArthur, el ejército americano tomó la iniciativa de atacarnos.
dialogue_2407=Tenga cuidado con la flota enemiga en los flancos y evite que las fuerzas principales del enemigo se retiren.
dialogue_2408=Hagamos todo lo posible para detener el ataque de las fuerzas terrestres japonesas y mantener nuestra posición en Nueva Guinea.
dialogue_2409=Los japoneses no tienen vuelta atrás. ¡Adelante, a máxima velocidad! ¡Destruyan la fuerza principal de la flota enemiga!
dialogue_2410=Las fuerzas de la OTAN han completado sus desembarcos. Tenga cuidado con la segunda ola de ataques enemigos desde el mar.
dialogue_2411=No se puede permitir que el enemigo se afiance en Asia. Eliminen sus grupos de portaaviones.
dialogue_2412=Grupos blindados enemigos están atacando desde el norte y el sur. Necesitamos apoyo.
dialogue_2413=El enemigo ha instalado un enorme silo de misiles en nuestro patio trasero.
dialogue_2414=Detenga a la flota enemiga y eliminen la amenaza del silo de misiles enemigo de una vez por todas.
dialogue_2415=El ejército finlandés ha lanzado un ataque sorpresa contra nosotros. ¡Debemos resistir hasta que lleguen las tropas de refuerzo!
dialogue_2416=Hemos cortado las líneas de suministro enemigas en el norte de África. Empujen hacia el este y compriman la línea de defensa alemana.
dialogue_2417=Los alemanes han bloqueado el Atlántico y están a punto de lanzar un ataque a gran escala contra nuestro territorio.
dialogue_2418=Los aliados en el frente occidental han atravesado múltiples líneas de defensa y ya no hay vuelta atrás para nosotros.
dialogue_2419=¡Sé el primero en lanzar un contraataque antes de que el enemigo ataque y tómalos por sorpresa!
dialogue_2420=Estamos rodeados por el ejército británico. Rompan la línea de bloqueo enemiga lo antes posible y únanse a los refuerzos.
dialogue_2421=Reúnan nuevas tropas rápidamente y haremos todo lo posible para detener el ataque británico.
dialogue_2422=Los japoneses han dejado de luchar frontalmente contra nosotros. Ahora se están infiltrando hacia nuestra retaguardia desde dos direcciones.
dialogue_2423=Bloqueen el ataque sorpresa del enemigo. Nuestros grupos blindados destruirán todo lo que se les presente.
dialogue_2424=Los soviéticos nos tienen rodeados. Mantengan la posición y esperen refuerzos navales.
dialogue_2425=Ayuda a los aliados a defenderse de los soviéticos. Aprovecharé esta oportunidad para seguir acelerando el avance.
dialogue_2426=El ejército estadounidense ha concentrado todas sus fuerzas en un duelo con nosotros. Esta es la oportunidad perfecta para aplastar completamente al enemigo. ¡Somos invencibles!
dialogue_2427=No hay vuelta atrás. Aguantaremos con todas nuestras fuerzas hasta que lleguen refuerzos.
dialogue_2428=Los franceses todavía no han abandonado su resistencia. Destruyan la fuerza principal de la flota enemiga y expulsen a los aliados del Mediterráneo.
dialogue_2429=Los alemanes ya no son capaces de impedirnos el desembarco. Avancemos a toda velocidad y liberemos a toda Europa.
dialogue_2430=La flota británica está entrando en acción. Mantendremos a raya a la flota enemiga. Intercepten los refuerzos enemigos lo antes posible.
dialogue_2431=Los refuerzos enemigos están llegando al frente. Aprovechen el vacío en la retaguardia japonesa y atáquenlos por sorpresa.
dialogue_2432=Queda poco de la flota japonesa. Aniquilen las fuerzas vitales locales del enemigo y pongan fin a esta guerra lo más rápido posible.
dialogue_2433=Nuestra vía de retirada ha sido cortada por el ejército estadounidense. Sólo destruyendo la principal fuerza de portaviones del enemigo podremos tener una oportunidad de sobrevivir.
dialogue_2434=La crisis no se resolverá automáticamente. No podemos sentarnos y esperar, debemos tomar la iniciativa.
dialogue_2435=Las fuerzas estadounidenses han desembarcado con éxito, trabajando con varios aliados para capturar los principales bastiones del enemigo.
dialogue_2436=El continuo refuerzo del enemigo en la línea del frente ha alterado el equilibrio del campo de batalla. Deben hacerse todos los esfuerzos posibles para frenar su expansión.
dialogue_2437=Hemos cortado el suministro al ejército italiano en el norte de África. Tomen sus fortalezas y atraviesen nuestras líneas de suministro.
dialogue_2438=Los británicos tienen un firme control sobre las fábricas aquí. Sólo capturando estas fortalezas podremos sostener esta guerra.
dialogue_2439=Las fuerzas enemigas han ocupado nuestra ciudad. Mis tropas están listas para lanzar un contraataque en cualquier momento.
dialogue_2440=Los alemanes están acorralados. Coopere con nosotros y elimine a los enemigos del norte de África.
dialogue_2441=Detén el ataque del enemigo, consigue tantos suministros como puedas y prepárate para un futuro contraataque.
dialogue_2442=Los japoneses han cortado el contacto entre nosotros. Cuidado con los ataques repentinos del enemigo, consolídate paso a paso.
dialogue_2443=Hemos avanzado hacia el interior del enemigo y pronto completaremos el cerco de la fuerza principal del enemigo.
dialogue_2444=La operación de desembarco fue un éxito y en conjunto con nuestra flota hemos expulsado por completo al enemigo.
dialogue_2445=No hay otra manera para nosotros. La única forma en que podemos esperar ganar es manteniendo nuestra posición.
dialogue_2446=Ha tomado forma un nuevo paisaje mundial. Para sobrevivir en estos tiempos turbulentos, debemos explorar nuestro propio camino.

dialogue_2447=La potencia de fuego del enemigo es demasiado feroz. Comandante, encuentre un avance en las defensas enemigas y dirija nuestro ataque.
dialogue_2448=No dejen que los británicos se adentren más en la línea de defensa, resistan con todas sus fuerzas y esperen refuerzos desde la retaguardia.
dialogue_2449=No podemos esperar al apoyo en la retaguardia. Retirada.
dialogue_2450=Soldados, estamos al borde de una gran victoria. ¡Expulsen a las potencias del Eje del continente africano de una vez!
dialogue_2451=Desembarquen desde los lados sur y este de la isla y aprovechen el momento mientras el enemigo no concentra sus fuerzas.
dialogue_2452=Los aliados han desembarcado masivamente en Sicilia, envíen todas las tropas para interceptarlos, no dejen que se adentren en el centro de la isla.
dialogue_2453=¡Cuidado con las tropas de refuerzo marítimo enemigas en el flanco norte!
dialogue_2454=Los aliados completaron sus desembarcos iniciales y establecieron sus posiciones. Su Excelencia, comandante, por favor llévenos hacia el área de Normandía.
dialogue_2455=¡Detengan el avance aliado a toda costa y no les permitan penetrar profundamente en el interior del país!
dialogue_2456=Avanzando hacia el norte, las tropas aerotransportadas amigas aterrizarán detrás del enemigo y formarán un ataque de pinza con nosotros.
dialogue_2457=Hemos interceptado los planes de los aliados. Soldados, sostengan la cabeza de puente. ¡No les dejen triunfar!
dialogue_2458=Si no podemos capturar el puente clave, nuestros amigos en el aire sólo morirán en vano. Comandante, por favor ayúdenos.
dialogue_2459=Las fuerzas amigas están profundamente arraigadas en el asedio enemigo. Su Excelencia, comandante, envíe tropas para ayudar y garantizar su seguridad.
dialogue_2460=¡Excelente! Con la ayuda de los británicos no sufrimos grandes pérdidas. ¡Soldados, todos a la vez, inicien el contraataque!
dialogue_2461=Tenga cuidado de no dejar que los alemanes dividan el campo de batalla y reúna a sus tropas para darles el golpe final.

elite_intro_63=Los Alpini fueron fundados en 1872 y formaban parte del ejército italiano. Equipados con el armamento más avanzado de la época, la legión se distinguió en combate tanto durante la Primera Guerra Mundial como durante la Segunda Guerra Mundial.
elite_intro_64=El obús B-4 tiene un sistema especial de doble estacionamiento y retorno y un cañón de calibre 203 mm. Durante la Segunda Guerra Mundial, el arma jugó un papel vital contra fuertes reforzados con hormigón y sus enemigos lo llamaron el "martillo de Stalin".

