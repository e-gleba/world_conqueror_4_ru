;战区规则
warzone_rule=戦区ルール
warzone_rule_1=1. 各戦区は通常ステージとボスステージに分かれており、通常ステージをすべてクリアしなければボスステージは解放されません。通常ステージでは、そのステージで主に使用される兵種が表示されます。
warzone_rule_2=2. 戦区の切り替えやリセットには指令ポイントを消費します。指令ポイントは毎日決まった時間（UTC 8:00および20:00）に回復します。
warzone_rule_3=3. 戦区ステージはポイント制を採用しています。敵軍（要塞および要塞が召喚する援軍を含む）にダメージを与えることでポイントを獲得できます。ステージクリア後は再挑戦できません。また、同じ戦区内で一度出撃した武将は、その戦区の他のステージには出撃できませんので、事前に武将の配置計画を立てることをお勧めします。
warzone_rule_4=4. 各戦区での歴代最高スコアが一定数に達すると、一度きりの実績報酬を受け取ることができます。また、ボスステージをクリアするたびに、現在の総スコアに応じてリボン報酬を獲得できます。（詳細条件は宝箱をクリックしてご確認ください）
warzone_rule_5=5. 各戦区での歴代最高スコアが一定数に達すると、掃討機能が解放されます。掃討券を一定数消費することで、ステージを即時クリアし、リボンを獲得できます。

mission_to_tutorial=将領がいない場合、任務を実行できません。まずはチュートリアルステージ3をクリアし、将領を獲得してから任務を行いましょう。

skill_unlock=ロック解除条件：シナリオモード \{0}\{1}\ 第{2}関 \{3} {4} 緑サークルを占領
HQ_level_desc=HQのレベル経験値はシナリオ、統治、征服などのモードで獲得することができます。
general_stage_unlock=このモードを開放するには、第二次世界大戦の太平洋をクリアする必要があります。
general_src_cp=ロック解除条件：チャレンジ征服 \ 征服通行証
