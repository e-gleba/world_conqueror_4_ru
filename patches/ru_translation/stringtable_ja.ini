synergy_tactics_1_1=・すべての「幽霊師団」ユニットの行動力+3
synergy_tactics_1_2=・協同攻勢：装甲ユニットは、自身の周囲2マス以内に味方の「幽霊師団」ユニットが1体いるごとに、攻撃時に追加で2%のダメージを与える。
synergy_tactics_1_3=・敗走追撃：歩兵ユニットは、隣接する味方の「幽霊師団」ユニットがこのターンに敵ユニットを1体撃破した場合、その歩兵ユニットはこのターン中に追加で1回移動できる（効果は1ターンに1回）。
synergy_tactics_1_4=・前線観測：砲兵ユニットは、隣接する1マス以内に味方の「幽霊師団」歩兵ユニットがいる場合、与ダメージが10％上昇。
synergy_tactics_2_1=・すべての「スピアヘッド師団」ユニットの攻撃力+10
synergy_tactics_2_2=・歩戦協同：装甲ユニットは、隣接する1マス以内に味方の「スピアヘッド師団」歩兵ユニットがいる場合、会心の一撃のダメージが20％上昇。
synergy_tactics_2_3=・集団機動：歩兵ユニットは、自身の周囲2マス以内に味方の「スピアヘッド師団」ユニットが1体いるごとに、行動力＋2。
synergy_tactics_2_4=・陣地援護：砲兵ユニットは、隣接する1マス以内に味方の「スピアヘッド師団」ユニットがいる場合、受けるダメージが15％減少。
synergy_tactics_3_1=・すべての「タマン旅団」陸軍ユニットは回避率+10%（空襲はこの回避を無視する）
synergy_tactics_3_2=・水陸機動：海軍ユニットの周囲2マス以内にいる味方の「タマン旅団」陸軍ユニットは、海へ進入する際に行動力の減少効果を受けず、行動力＋2。
synergy_tactics_3_3=・射撃誘導：砲兵ユニットは、自身の周囲2マス以内に味方の「タマン旅団」ユニットが1体いるごとに、会心の一撃発生率が4％上昇。
synergy_tactics_3_4=・火力支援：歩兵ユニットは、隣接する1マス以内に味方の「タマン旅団」ユニットがいる場合、射程が＋1されるが、最遠距離への攻撃時のダメージが15％減少。


