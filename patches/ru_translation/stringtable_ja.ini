event_intro_108=1941年秋、東部戦線で連戦連勝を重ねたドイツ軍は、速度と鋼鉄による決定的勝利を狙い、ソビエト連邦の首都モスクワへ急速に迫ったが、戦線の伸長に伴い補給は逼迫し、厳冬も静かに近づいていた。迫り来る危機に直面したソビエトは、最後の力をモスクワ防衛に投入し、時間と寒さ、そして犠牲そのものを武器として抗戦する。速度を旨としたこの攻勢は、やがて意志と消耗を代償とする決戦へと引きずり込まれ、もはや退路はなく、生か死かのみが残されたのである。




