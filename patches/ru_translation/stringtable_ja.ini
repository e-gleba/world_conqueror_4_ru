dialogue_3500=英軍の中核軍団を打ち破った！このまま守り抜け、反撃の好機が訪れている！
dialogue_3501=ドイツ軍のもがきは徒労だ。進軍を一時停止、予備軍団が到着次第、再び進撃せよ！
dialogue_3502=ソ連軍の攻撃部隊は食い止められた。総統の反撃計画は幻想などではなかった！
dialogue_3503=軍隊を再編成せよ。ベルリンは、必ず我が手に！
dialogue_3504=まさに奇跡だ！我々は米軍の補給拠点を破壊した。敵はもはや丸腰も同然！
dialogue_3505=予備の補給基地を起動。前線部隊はしばし待機せよ、補給は間もなく届く。
dialogue_3506=指揮下のすべての部隊を連れてきた。私の安全を保障してくれ。イタリア国民は連合軍に協力するだろう。
dialogue_3507=くそっ、副官を呼べ。イタリア国民を宥めねばならない。
dialogue_3508=前線部隊をカーンに集中させ、敵のさらなる進撃を阻止せよ。
dialogue_3509=南部戦線が危うい。予備隊を出動し、敵の進撃を止めろ。司令部に増援を要請する。
dialogue_3510=司令部の命により、我が部隊が支援に来た。前線は厳しい状況だ。戦力を温存せよ。
dialogue_3511=敵の進撃の勢いが止まった、勝利が我々に傾いてきた！
dialogue_3512=戦線を維持し、進撃を続けよ。我々に次の機会はない！
dialogue_3513=バストーニュは制圧された。アルデンヌの補給はもはや問題ではない。
dialogue_3514=敵軍の上陸以降、敗北が続いている。しかしこの戦い、絶対に勝たねばならない。
dialogue_3515=安心して帰港せよ。ここからは私が海域を指揮する！
dialogue_3516=こんな敗北、フィリピンで一度経験済みだ。もはや恐れるものはない。
dialogue_3517=危機は去った！我が軍は朝鮮の民衆の支援を受け、反攻に転じる。
dialogue_3518=我が軍は海域の制圧に成功。ウラジオストクを奪取し、ソ連のミサイル基地を攻略せよ！
dialogue_3519=今回はただ戻ってきただけじゃない。ソ連に敗北の味をしっかりと味わわせてやった！
dialogue_3520=南クリル列島を奪還し、必ず港の安全を確保せよ！
dialogue_3521=沿岸の港を占領するのを手伝ってくれ。海軍はオホーツク海への拠点を必要としている！
dialogue_3522=よし！艦隊はまもなく到着する。陸軍とともにオホーツク海を奪還するぞ！
dialogue_3523=海岸防衛線を守り抜け。援軍はすぐに到着する！
dialogue_3524=サンローレンス島が陥落した。敵を本土に定着させるわけにはいかない！
dialogue_3525=海岸防衛の支援はもはや意味がない。後方に撤退し、アンカレッジの防衛線を強化せよ。
dialogue_3526=援軍が到着した。資源は無限に供給される。体勢を整え、敵を打ち砕け。
dialogue_3527=欧州からの援軍が海を越えて向かっている。耐えろ、希望は目前だ。
dialogue_3528=友軍との連絡がついた。補給の準備を整えよう、アメリカを解放するのだ！
dialogue_3529=この戦争、ここまで来たらアメリカと戦い続ける意味はない。ソ連と交渉し、戦争から手を引こう！
dialogue_3530=カナダが戦争から脱退？この裏切り者め！軍に通達せよ、戦線はカナダ国内で維持する。逃がすものか！
dialogue_3531=中央の方針により、統一戦線に取り込める相手には我が軍も支援を行うべきだ。共に戦ってくれることを歓迎する！
dialogue_3532=国家の安全のためには、こうするしかなかった。
dialogue_3533=欧州からの援軍が到着した！兵士たちよ、自由のために我が領土を奪還せよ！
dialogue_3534=戦火はすでに本土に及んでいる。このまま戦い続ける価値は本当にあるのか？
dialogue_3535=国家は危機に瀕している。兵士たちよ、祖国を守れ！


