feat_desc_76=攻撃範囲が2に変更されました、敵軍複数部隊を攻撃可能、攻撃時{1}%の確率で敵軍の反撃を無効化する。1ターン継続、クールダウン2ターン。
feat_desc_76_Lv3=攻撃範囲が2に変更されました、敵軍複数部隊を攻撃可能、他の目標にダメージ減少なし、攻撃時{1}%の確率で敵軍の反撃を無効化する。1ターン継続、クールダウン2ターン。
feat_desc_77=装甲ユニットからのダメージを{1}% 減少
feat_desc_78=回避と煙幕弾の効果を無視し、城防へのダメージを{1}%増加
feat_desc_79=煙幕弾を発射し、自身を煙幕で覆い、地上部隊の攻撃を受けない。1ターン継続、クールダウン3ターン。
feat_desc_79_Lv2=煙幕弾を発射し、自身を煙幕で覆い、地上部隊の攻撃を受けない。1ターン継続、クールダウン2ターン。
feat_desc_79_Lv3=煙幕弾を発射し、自身を煙幕で覆い、地上部隊からの主動攻撃を受けない、{1}% の確率で追加攻撃を行う。1ターン継続、クールダウン2ターン。
feat_desc_80=煙幕弾の効果中は、敵の防御力を{1}% 無視
feat_desc_81=ミサイルを発射する際、原子弾頭を装填することができ、初期状態では2つ、{1}ターンごとに1つ回復する。最大4つまで装填可能。
feat_desc_81_Lv2=ミサイルを発射する際、水素弾頭を装填することができ、初期状態では2つ、{1}ターンごとに1つ回復する。最大4つまで装填可能。
feat_desc_81_Lv3=ミサイルを発射する際、三相爆弾頭を装填することができ、初期状態では2つ、{1}ターンごとに1つ回復する。最大4つまで装填可能。
feat_desc_82=通常攻撃に代わって近接ミサイルを発射する。毎ターン2回発射できる。
feat_desc_82_Lv2=通常攻撃に代わって中距離ミサイルを発射する。毎ターン2回発射できる。
feat_desc_82_Lv3=通常攻撃に代わって遠距離ミサイルを発射する。毎ターン2回発射できる。
feat_desc_83=陸上ユニットの攻撃対象にならず、空軍からのダメージが{1}% 減少
feat_desc_84=直線を選択し、{1}マスまで前進する（目標地点は空き地の必要があり、空中で待機しているユニットに阻まれる）、途中で掃射ダメージを与える、クールダウン2ターン。
feat_desc_85=空母の1ヘクス圏内で離陸可能。行動力に対する地形効果をすべて無視し、地雷や水雷の効果も無視する。攻撃時に敵軍は反撃できない。HPが減っても戦闘力は下がらない
feat_desc_87=陸軍や海軍の攻撃を受けた際、{1}% の確率でそのダメージを回避。

event_105=真珠湾攻撃
event_intro_105=第二次世界大戦初期、日本はアジア太平洋地域への野心を募らせ、軍事作戦を通じてその戦略的目標を達成しようとした。しかし日本の侵略と拡張に伴い、米国は次第に石油や鉄鋼など様々な資源の貿易を制限する措置をとった。こうした制限は日本の軍事力に深刻な影響を与えた。この背景から、日本はますます過激な姿勢をとり、隠密だが徹底的な奇襲攻撃によって、太平洋における米国の軍事力を一挙に消滅させようとした。

army_buff_desc_1271=誘敵：周囲の友軍のダメージ＋3%
army_buff_desc_1272=誘敵：周囲の友軍のダメージ＋6%
army_buff_desc_1273=誘敵：周囲の友軍のダメージ＋9%
