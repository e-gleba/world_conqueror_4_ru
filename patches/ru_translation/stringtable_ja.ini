help_scenario_desc_1=ここでは第二次世界大戦以降のさまざまな歴史に残る戦闘を体験できます。現在の章のすべてのステージをクリアすると、次の章が開放されます。
help_scenario_desc_2=「第二次世界大戦のヨーロッパ」、「第二次世界大戦の太平洋」、「冷戦」の章では、2つの異なる陣営から選択できます。各陣営のステージは独立しており、報酬も独立しています。
help_scenario_desc_3=ストーリーの各ステージには異なる難易度があり、より高い難易度に挑戦するには現在の難易度をクリアする必要があります。難易度が上がるにつれ、報酬も豊富になります。
help_scenario_desc_4=戦区は主に勲章とリボンを獲得でき、8人以上の指揮官を持っていると開放できます。現在の戦区のすべてのステージをクリアすると、指揮官はスコアに応じて報酬を受け取り、倒した敵が多いほどトータルスコアが高くなります。同じ戦区は何度も挑戦できますが、戦区の切り替えやリセットには1コマンドポイントが必要です。戦区を切り替える前に戦った指揮官は、その戦区の後続ステージで引き続き戦うことはできません。
help_scenario_desc_5=前線モードは非常に挑戦的なゲームモードで、メインストーリー「第二次世界大戦のヨーロッパ」をクリアすると開放されます。指揮官はここで多くの要塞と連続的な援軍に立ち向かうことになります。前線モードをクリアすると、豪華な報酬を獲得できます。

help_conquest_1=国家
help_conquest_2=外交
help_conquest_3=技術レベル
help_conquest_4=建造物の建設
help_conquest_5=勝利を獲得

help_conquest_desc_1=征服モードでは、国家が1つから3つの星で分けられており、星の数が多いほど、ゲームの開始時にその国がより強力で、ゲーム難易度が低くなります。逆に、星の数が少ないほど難易度が高くなります。
help_conquest_desc_2=画面の上部にある外交ボタンでは、指揮官は各種資源を友軍に寄付する方法で援助を行ったり、中立国に宣戦布告して敵対国に変えたりすることができます。
help_conquest_desc_3=征服モードにおける国家の発展は、技術レベルによる制限を受けます。研究施設で技術ポイントを獲得すると同時に、対応する技術レベルの経験値も得られます。
help_conquest_desc_4=指揮官は機能性建築物を建設することで都市を発展させることができ、技術レベルの要件を満たした時に、建設ボタンをクリックして必要な資源の消費を確認することができます。
help_conquest_desc_5=征服勝利後には、評価スコアによってレベルが決定されます。このスコアは出撃した将軍、占領した都市、消費したターン数、選択した国家の難易度に影響されます。出征する将軍の数が、挑戦征服の評価に影響を与えなくなります。

help_domination_1=ミッション
help_domination_2=部隊補充
help_domination_3=伝説の将軍
help_domination_4=侵入
help_domination_5=貿易
help_domination_6=演習

help_domination_desc_1=指揮官は将軍を派遣して任務を完了させ、資源の報酬を獲得することができます。いずれかの条件を満たすだけで任務は完了となりますが、条件をより多く満たせば満たすほど、報酬は豊富になります。任務は偵察、閲兵、宣伝、建設の4つのタイプに分けられ、毎日UTC 8:00と20:00にリセットされます。
help_domination_desc_2=部分統治モードにおけるゲームプレイ（侵攻、会戦、伝説将軍）では、指揮官が自ら部隊を配置してからゲームを開始する必要があり、統治画面右上隅にある部隊ボタンから入って兵士を召募することができます。
help_domination_desc_3=伝説の将軍モードの戦闘を通じて、対応する将軍の召募権利を開放でき、戦闘が進行するにつれて召募割引を獲得できます。
help_domination_desc_4=指揮官は自身で編成した部隊で戦闘を行い、勝利した場合に勲章報酬を獲得できます。侵略モードは毎日UTC 8:00および20:00にリセットされます。
help_domination_desc_5=指揮官は、不足している資源を貿易交換を通して獲得することができます。
help_domination_desc_6=指揮官は自身が編成した部隊で戦闘し、勝利後に勲章報酬を受け取ることができます。このゲームモードはリセットされません。

help_hq_1=将軍
help_hq_2=将軍育成
help_hq_3=勲章
help_hq_4=リボン
help_hq_5=技術
help_hq_6=特別な建物
help_hq_7=奇観
help_hq_8=精鋭部隊
help_hq_9=伝記

help_hq_desc_1=HQは指揮官が自らの将軍を管理する中心です。ここでは、保有している将軍の状態を確認と管理、また新たな将軍の召募もできます。将軍のスロットはHQのレベルが上がるにつれて開放され、HQのレベル経験値はシナリオ、統治、征服などのモードで獲得することができます。
help_hq_desc_2=階級の昇進により、指揮官が率いる部隊の最大HPを増やすことができます。さらに、将軍の戦闘力を向上させるために、能力値とスキルをアップグレードすることもできます。各シナリオのチャプターを完了するたびに、すべての将軍が昇進できる階級が1つ増えます。
help_hq_desc_3=将軍は勲章を装着して戦闘能力をさらに向上させることができ、各将軍は最大で3つの異なる勲章を装着することができます。コレクション内の勲章をドラッグすることで装着/取り外しができます。
help_hq_desc_4=勲章は将軍の戦闘能力を向上させるもう一つの装備です。将軍が昇進するたびに、勲章スロットが1つずつ開放され、各将軍は最大3つの異なる勲章を身に着けることができます。3つの同じ勲章は、同勲章の高レベルのものに合成できます。
help_hq_desc_5=科技の向上により、全てのモードの戦闘において、各種兵種のさまざまな能力を強化することができます。
help_hq_desc_6=統治モードで開放でき、各モードの都市建設に役立ちます。
help_hq_desc_7=奇観は統治モードの収益と資源の産出をもたらし、統治モードのさまざまなゲームプレイから開放できます。奇観をクリックすると開放方法の詳細を確認できます。
help_hq_desc_8=精鋭部隊は強力な戦闘ユニットで、兵種の破片を集めて開放/アップグレードできます。精鋭部隊の破片は、主にイベントやアプリ内課金から入手できます。空軍部隊を除く各精鋭部隊は一度の戦闘で一度のみ召募可能です。
help_hq_desc_9=指揮官は、伝記より名立たる将軍たちが経験した有名な戦争を体験することが可能です。将軍一人につき5つのステージをすべてクリアすると、専用の称号報酬を獲得できます。

help_battle_1=移動
help_battle_2=取り消し
help_battle_3=攻撃
help_battle_4=勝利条件
help_battle_5=将軍派遣
help_battle_6=部隊召募
help_battle_7=都市占拠
help_battle_8=防空と要塞
help_battle_9=地形効果
help_battle_10=士気

help_battle_desc_1=行動可能な自軍ユニットをクリックで選択でき、そのユニットの移動範囲はマップ上に表示されます。複雑な地形（山岳地帯、森林など）はより多くの行動力を消耗します。
help_battle_desc_2=部隊の移動操作をした後、撤回ボタンをクリックすると移動前の位置に戻ることができます。部隊が攻撃を実行したり、指揮官が別の位置を選択してそのユニットの選択を解除した場合、撤回操作はできなくなります。
help_battle_desc_3=自軍ユニットを選択したうえで、そのユニットの攻撃範囲内に敵軍がいる場合、赤い円で表示されます。この時、敵軍をクリックすると攻撃できます。攻撃時、自軍ユニットが敵軍の攻撃範囲内にいると、反撃ダメージを受けます。ただし、この攻撃で敵軍を撃破した場合、反撃ダメージは受けません。
help_battle_desc_4=各ターンの開始時にステージ情報画面が表示され、指揮官はここでステージの勝利条件、派遣可能な将軍の制限、およびそのターンの報酬を確認できます。重要な拠点は赤い円で表示され、これを占拠または喪失することが戦局の勝敗に関わります。
help_battle_desc_5=特定の自軍部隊を選択後、将軍を派遣してその部隊を指導することにより、その部隊の戦闘能力が大幅に向上します。
help_battle_desc_6=自軍の都市に部隊がいない場合、戦闘兵力を補充するために部隊を召募できます。通常部隊を召募するには対応する工場レベルが必要ですが、精鋭部隊は工場レベルと関係なく直接召募可能です。
help_battle_desc_7=敵軍の都市の耐久値がゼロになり、都市内に部隊がいない場合、敵軍の都市を占拠することができます。占拠後、その都市の統制権を獲得します。
help_battle_desc_8=領土内では、空中攻撃から守るための対空施設を建設できます。また、領土内の空地には、敵の陸上部隊から守るための砦を建設できます。
help_battle_desc_9=複雑な地形は部隊の移動だけでなく、部隊が受けるダメージにも影響を与えます。指揮官はエリアを選択した後、画面左上から当該エリアの状態を確認できます。
help_battle_desc_10=士気は部隊の戦闘能力に影響を与える重要な要因で、部隊が敵軍に挟撃されると士気が低下し、部隊の与えるダメージが減少します。士気が崩壊すると、部隊は攻撃や反撃ができなくなるため、このような状況に陥るのを避けましょう。

help_system_1=クラウドストレージ
help_system_2=言語
help_system_3=戦争通行証
help_system_4=アチーブメント
help_system_5=期間限定の将軍

help_system_desc_1=メインメニューの右側のリストからクラウドアーカイブ機能にアクセスすると、データのアップロードとダウンロードを行うことができ、異なるデバイス間でゲームの進行状況を同期させることができます。
help_system_desc_2=メインメニューの右側のリストから異なる言語に切り替えることができます。
help_system_desc_3=戦争通行証は大量の資源を入手するための便利な手段の一つで、無料報酬と有料報酬に分かれています。どの戦闘モードでも左側のリストからアクセスできます。
help_system_desc_4=実績リストでは、挑戦的なキークエストを確認することができ、豊富な報酬が用意されています。どの戦闘モードでも左側のリストからアクセスできます。
help_system_desc_5=このアイコンは、ストアにて強力な将軍が期間限定で販売されていることを意味します。お見逃しなく！

