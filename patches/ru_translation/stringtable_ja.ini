dialogue_4000=アラスを迅速に迂回し、できるだけ早くスカルプ川の橋梁を占拠しなければならない。第5装甲師団はすでに命令を受けており、まもなく支援に到着するだろう。
dialogue_4001=この時、フランス軍とイギリス軍はそれぞれ命令を受け、アラスにおいて反攻を開始する準備を整えた。
dialogue_4002=第25装甲連隊と通信を確立せよ。自由行動を中止し、師団本部の作戦に協力するよう要請する。
dialogue_4003=編成ボタンをクリック
dialogue_4004=編成したい軍団をクリック
dialogue_4005=編入させたい部隊をクリック
dialogue_4006=編入確認ボタンをクリック
dialogue_4007=第25装甲連隊に告ぐ：慎重に前進し、自らを保全せよ。歩兵主力と共に橋梁を制圧するのを待て。
dialogue_4008=くそっ！敵戦車の装甲が厚すぎる！ 前線に通達せよ、88ミリ砲を水平に構え、対戦車砲として使え！
dialogue_4009=正面強攻？…これは代償を伴うだろう。だが時に最も直接的な進路こそ、敵の全ての計算を乱すことができる！
dialogue_4010=フランス軍はイギリス軍右翼を掩護するために前進したが、連絡不備によりイギリス軍を敵と誤認した。
dialogue_4011=交戦後、双方は友軍であることを確認し、フランス軍は前進を続けた。
dialogue_4012=空軍に通知せよ。敵の攻勢は異常に激しい。我が軍は爆撃支援を必要とする！
dialogue_4013=敵軍が撤退している。全軍追撃し、アラスを奪取せよ！
dialogue_4014=迅速にネマン川岸へ進出し、アリートゥスを占拠せよ。
dialogue_4015=よし、アリートゥスの橋を死守せよ！ ソ連軍に奪い返されてはならない！
dialogue_4016=この時、ソ連第5装甲師団が急速にアリートゥスへ増援に向かっており、その第一波先遣部隊がまもなく到着する。
dialogue_4017=ソ連第5装甲師団の主力部隊がアリートゥスに到着した。
dialogue_4018=アリートゥスの状況は把握した。空軍に爆撃支援を要請済みだ。貴部は必ずアリートゥスを守り抜け！
dialogue_4019=空軍はアリートゥスに大量の増援部隊を確認。ネマン川上流の橋梁を優先して攻撃し、敵に兵力を割かせよ。
dialogue_4020=さすがは「幽霊師団」だ！ ソ連軍の援軍は潰走した。全軍に通達せよ、全力で攻撃を行い、ネマン川西岸の町を占領せよ！
dialogue_4021=第3、第4装甲集団に命じ、正面からソ連軍防衛線を突破し、ヴャジマ背後で包囲を完成させよ。
dialogue_4022=第19集団軍と第30集団軍の結合部を突破し、第4装甲集団とヴャジマ背後で合流せよ。
dialogue_4023=第19・30・49集団軍の戦車部隊を集結させ、敵を包囲し、突破を阻止せよ！
dialogue_4024=前線部隊に通達せよ、陣地を放棄して後退し、敵軍に包囲されるのを避けろ。
dialogue_4025=第4装甲集団はブジョーンヌイ率いる予備方面軍を撃退し、ヴャジマへ攻撃進入の準備を整えた。
dialogue_4026=第4装甲集団と合流に成功し、ヴャジマ包囲環が形成された。
dialogue_4027=全力で東へ突破せよ、ドイツ軍に捕虜にされることは断じて許されない！
dialogue_4028=これは我々が最も勝利に近づいた時だ。他のことは考えるな。任務はただ一つ――ヤフロマを攻略し、北からモスクワへ突入せよ！
dialogue_4029=兵士たちよ！戦争はすでに最も重要な局面に達した。我々は勝たねばならない、勝利するしかない！
dialogue_4030=シベリアには吹雪が荒れ狂い、過酷な天候はドイツ軍の視界と戦闘能力を大きく奪った。
dialogue_4031=クリンは第7装甲師団によって占領され、モスクワ北部防衛線は狭まった。
dialogue_4032=ロコソフスキーに通達せよ。どんな手を使ってでも、第16集団軍はクリン方面の敵を阻止するのだ！ ドイツ軍をモスクワに入れるな！
dialogue_4033=ヤフロマが陥落し、ドイツ軍はモスクワ大包囲の北部条件を整えた。
dialogue_4034=第1突撃集団軍は防衛線を死守せよ、ドイツ軍に赤軍の城を突破させるな！
dialogue_4035=クレムリンの輪郭がかすかに見えている。しかし第3装甲集団の燃料と弾薬は底を尽き、モスクワへ突入する可能性は奇跡に賭けるのみとなった。
dialogue_4036=信じ難い！ 第7装甲師団がモスクワ市街へ突入した。しかしそれは同時に、モスクワ内部における最も激烈な抵抗を呼び起こした。
dialogue_4037=モスクワ城防軍は持ち場についた。市内に侵入した敵を殲滅せよ。栄光の時が来た！ 我々こそモスクワだ！
dialogue_4038=南方集団軍群に告ぐ：第4装甲集団軍を主力とし、ケンプフ軍支隊は側面を掩護し、親衛第6集団軍を撃滅せよ。
dialogue_4039=ケンプフ軍支隊隷下の第7装甲師団にも命令が下り、ベルゴロド東方への攻撃準備を整えた。
dialogue_4040=第7装甲師団はセヴェルスキー・ドネツ川の渡河に成功し、親衛第7集団軍の防衛線に橋頭堡を築いた。
dialogue_4041=親衛第7集団軍に通達：敵軍を引きつけ、主力への支援を許すな。
dialogue_4042=橋頭堡はさらに拡大し、主力部隊の掩護が可能となった。
dialogue_4043=総参謀長へ電報：敵はまもなくプロホロフカへ突撃を仕掛けてくる。戦車の増援を要請する。
dialogue_4044=親衛第5集団軍を支援に動員した。貴部はどんな犠牲を払っても敵軍の突破を阻止せよ！
dialogue_4045=ソ連軍は一体どれほど戦車を持っているのだ！ 撤退せよ、全軍を罠にかけてはならない。
dialogue_4046=砲撃制圧の後、全軍突撃せよ。本日、我々はキエフを奪取する！
dialogue_4047=キエフを死守することはもはや不可能だ。第7装甲師団は速やかにファスチフを支援せよ。我々の退路を塞がせてはならない。
dialogue_4048=全軍ファスチフへ撤退し、防衛線を構築して敵の拡張を阻止せよ。
dialogue_4049=全軍ビーラ・ツェールクヴァへ撤退せよ。
dialogue_4050=ベルリンへ電報を送れ：キエフは失陥した。
dialogue_4051=速やかにジトーミルへ増援せよ。鉄道の要衝を敵に奪わせるな。
dialogue_4052=第48装甲軍はファスチフから北へ突撃せよ。我々はジトーミルで包囲を行い、ソ連軍の更なる前進を阻止する。
dialogue_4053=迅速に突破せよ。各部隊は戦線を固め、敵を侮って軽挙するな！
dialogue_4054=空軍の絨毯爆撃がまもなく実施される。爆撃終了後、直ちに敵防線を突破せよ！
dialogue_4055=爆撃終了、前進！
dialogue_4056=予備隊を投入して欠陥を補え。敵に防線を突破させるな！
dialogue_4057=第3装甲師団は防線突破に成功し、ドイツ軍は防衛線の収縮を余儀なくされた。
dialogue_4058=第2装甲師団と第116師団を抽出して急行させよ。敵の戦果拡大を必ず阻止せねばならない。
dialogue_4059=徐々に前進し、包囲口を狭めよ。敵を包囲網から脱出させてはならない。
dialogue_4060=秩序を保って東方へ撤退せよ。敵に包囲を完成させてはならない。
dialogue_4061=私は最善を尽くした。この戦争を終わらせる時だ。これ以上続ければ、ドイツにとって破滅となる。
dialogue_4062=爆弾暗殺事件が発生。クルーゲは解任、モーデルが指揮を引き継ぐ。
dialogue_4063=包囲網を全力で攻撃し、孤立した部隊に脱出路を作るのだ。
dialogue_4064=包囲網が形成され、孤立したドイツ軍は死を覚悟して突囲を開始した。
dialogue_4065=アーヘンは政治的意義が極めて大きい。これを奪えば敵軍の士気に大打撃を与えられる。
dialogue_4066=アーヘンは我々の手に落ちた！ 小休止の後、ヒュルトゲンの森へ進攻せよ。
dialogue_4067=後方に通知し、さらなる補充兵を徴発せよ。我々はヒュルトゲンの森で敵を食い止めねばならない。
dialogue_4068=ヒュルトゲンの森の複雑な地形は、第3装甲師団の力を大きく削いだ。
dialogue_4069=要塞を死守せよ。武装親衛隊が支援に向かっている。
dialogue_4070=これは国家の命運を懸けた戦いだ。勝利あるのみ、敗北は許されない！
dialogue_4071=全軍突撃せよ。アルデンヌ山地を突破し、アントワープを奪取せよ！
dialogue_4072=装甲部隊を急ぎアルデンヌの森に向かわせ、敵の更なる進撃を阻止せよ。
dialogue_4073=北部戦線と南部戦線が阻まれ、兵力は中部へ集中した。我々は必ずアルデンヌの森を突破しなければならない。
dialogue_4074=バストーニュを奪取せよ。我々の進撃路を塞がせてはならない。
dialogue_4075=第101空挺師団は降伏を拒否し、バストーニュを死守した。
dialogue_4076=速やかにバストーニュを支援せよ。ドイツ軍に交通の要衝を握らせるな。
dialogue_4077=バストーニュは陥落し、ドイツ軍増援部隊は迅速に行動可能となった。ドイツ軍の攻勢はいっそう強まった。
dialogue_4078=第1集団軍はライン川防衛線を突破し、南方からルール工業地帯を封鎖した。
dialogue_4079=第3装甲師団は命令を受け、迅速にリップシュタットへ進出し、第9集団軍と合流した。
dialogue_4080=包囲網内に向けて放送せよ：武器を捨てて投降せよ。連合軍は捕虜の権利を保障する。
dialogue_4081=帝国の元帥として、私は降伏を許可できない。しかし兵士たちに脱出の希望を残すために最善を尽くそう。
dialogue_4082=私の命を伝えよ：B集団軍群を解散する。全ての戦闘部隊は、統制ある隊形で突破するか、武器を置いて帰郷するか選択せよ。
dialogue_4083=たとえここで力尽きるとしても、私は最後まで戦った。
dialogue_4084=第3装甲師団師団長は戦闘中に戦死した。しかしその勇猛な戦いぶりは部隊の戦意を奮い立たせた。
dialogue_4085=モーデルは降伏を拒み、自決した。
dialogue_4086=1991年2月24日、砂漠の嵐作戦が開始された。第3装甲師団はアメリカ軍の主力の一つとしてイラクに進攻した。
dialogue_4087=クウェートは攻略され、国連軍の士気は大いに高まった。
dialogue_4088=アメリカ軍の電子妨害システムが起動し、イラク軍の電子通信システムは機能を失った。
dialogue_4089=イラク陸軍の大部分が壊滅し、連合軍は圧倒的勝利を収めた。イラク政府は降伏を要請した。
dialogue_4090=海軍歩兵第255旅団が派遣され、第56集団軍と第18集団軍の結合部に投入され、ドイツ軍の更なる進撃を阻止した。
dialogue_4091=トゥアプセを攻略するため、ドイツ軍は「アッティカ作戦」を発動した。
dialogue_4092=ドイツ軍の先鋒部隊がトゥアプセ城外に到達した。至急の増援を要請する。
dialogue_4093=トゥアプセはドイツ軍に占領され、ソ連軍は兵力を集中し、占領部隊を包囲攻撃した。
dialogue_4094=トゥアプセを奪回し、ソ連軍はその勢いでドイツ軍に反撃を開始した。
dialogue_4095=海軍歩兵第255旅団は橋頭堡の確保に成功し、ソ連軍は大量の援軍を迅速に投入した。
dialogue_4096=ノヴォロシースクの守備ドイツ軍は出撃し、ソ連軍の橋頭堡拡大を阻止しようとした。
dialogue_4097=ソ連軍の攻勢は限界に達し、橋頭堡を維持して次の攻勢の足掛かりとする準備を整えた。
dialogue_4098=橋頭堡を消滅させるため、ドイツ軍は攻撃兵力を増強した。
dialogue_4099=橋頭堡は圧縮されていった。物資と共に到着した政治委員が兵士を鼓舞し、必ずこの狭い土地を守り抜けと訴えた。
dialogue_4100=海軍歩兵第255旅団は命を受け、ノヴォロシースク港から上陸し、内側から敵防衛線を突破する作戦に出た。
dialogue_4101=外縁の防衛線を突破し、ドイツ軍との市街戦に突入。
dialogue_4102=ノヴォロシースクの外郭要塞が陥落し、ソ連軍は徐々に市街の主導権を掌握した。
dialogue_4103=ノヴォロシースクは解放され、ドイツ軍は北西へ撤退した。ソ連軍は追撃を開始する。
dialogue_4104=第18集団軍はノヴォロシースク北側防衛線を突破し、北部包囲を形成した。
dialogue_4105=第18集団軍上陸部隊は海軍封鎖を突破してアルディンゲンに上陸。枢軸軍は迅速に兵力を集中し反撃を開始した。
dialogue_4106=アルディンゲン突出部はドイツ軍主力を巧みに牽制した。第56集団軍上陸部隊はこの機を捉えて行動し、ケルチ北東部に上陸した。
dialogue_4107=敵軍の沿岸防御部隊の火力は猛烈であり、コステンコ軍曹は壮烈なる戦死を遂げる。
dialogue_4108=ケルチ北部の橋頭堡が固められ、ドイツ軍は全力でアルディンゲンへ攻撃を集中した。
dialogue_4109=ソ連の奇襲部隊がケルチを急襲し、枢軸軍は緊急に増援を差し向けた。
dialogue_4110=バラクラヴァを攻略し、サポン山地の第49山岳軍を包囲する形勢を作り出すことに成功。
dialogue_4111=サポン山地の第49山岳軍はソ連軍に撃退され、敵はセヴァストポリ防衛線へ退却した。
dialogue_4112=メケンジー高地を攻略。敵の北部防衛線は崩壊した。
dialogue_4113=セヴァストポリが解放され、ドイツ軍は西方へ撤退、海上からの脱出を準備した。
dialogue_4114=ルーマニア艦隊は撃退され、撤退部隊の士気は崩壊した。
dialogue_4115=ソ連軍はセヴァストポリの封鎖を完了。孤立した枢軸軍は死守を決意した。
dialogue_4116=海軍歩兵第255旅団は命を受け、夜陰に乗じてドニエストル川を渡り、第46集団軍主力のために上陸橋頭堡を築こうとした。
dialogue_4117=枢軸軍の沿岸防御部隊が上陸部隊を発見し、上陸戦闘がまさに勃発しようとしている。
dialogue_4118=北部の湿地帯に陣地を確立することに成功。アッカーマンを排除し、主力部隊のために湿地帯陣地を掃討せよ。
dialogue_4119=アッカーマンは解放され、敵軍は河口防衛線の放棄を余儀なくされた。
dialogue_4120=戦場北方のソ連第37集団軍は大きな突破を達成し、敵軍は包囲を避けるために撤退を開始した。

