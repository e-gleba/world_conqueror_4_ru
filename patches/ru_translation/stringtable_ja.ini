event_stage_intro_20701=総理は繰り返し、英国に対して攻勢をかけるよう促してきた。しかし部隊の機械化程度は非常に低く、大量の装備や物資の補給が不足しており、この攻勢を保つのは厳しいだろう。目下は人数の優勢で他の不足を補うしかない。エジプトへ進軍しよう。
event_stage_intro_20702=イギリス軍の反撃の速さは驚異的だが、敵は我々の部隊規模を誤って評価している。敵が疲弊している今、我々は十分な戦力を持ってキレナイカの守備隊を一つずつ打ち破ることができる。イギリス軍の有力な戦力を殲滅することを主な目標とし、全速で前進せよ。敵を一人たりとも逃がすな！
event_stage_intro_20703=ギリシャの連合軍は我々によって全滅し、クリティ島は地中海における敵の最後の重要な拠点となっている。島を奪取すれば、それを足場としてキプロスを占領し、さらには海上からエジプトへの攻撃を開始することも可能だ。
event_stage_intro_20704=イギリス軍はトゥブルクへの道を切り開くために新たな攻勢を開始した。我々は元の防御施設を強化し、イギリス軍の進攻に備えて新たな陣地を構築している。今後も補給と援軍が次々と到着する。我々が再び北アフリカ戦線の主導権を握る日も近い。
event_stage_intro_20705=トゥブルクとその周辺地域の包囲網はまもなく完成するが、現在のところ我々には大規模な攻撃を行うための物資や装備がまだ不足している。しかし、イギリス軍が自ら攻勢を仕掛けてきたことで、この問題は解決された。速戦即決で敵の有力な戦力を殲滅し、補給線が長くなることで発生する一連の問題を回避せよ。
event_stage_intro_20706=我々の補給線の長さはすでに限界へと達した。敵の海空軍は地中海で依然として我々に大きな脅威を与えている。イギリス軍を中心とする連合軍は、紅海とスエズ運河を通じて兵力と物資の補給を絶えず受けている。情勢は厳しいが、これは北アフリカ戦線における我々の最後の戦いであり、我々の運命を決する一戦でもあるのだ。
event_stage_intro_20707=連合軍はモロッコとアルジェリアで巻き返しを図っている。米軍は陸路での進撃速度を加速させ、イギリス海軍も地中海の全戦力を集結させてチュニス湾に向かっている。現地のヴィシー政権下の守備隊はすでに連合軍と連絡を取っている可能性が高い。危機は迫っているが、我々は残された力を使ってチュニスで最後まで守り抜き、ロンメル主力の到着を待つ。
event_stage_intro_20711=総理は繰り返し、英国に対して攻勢をかけるよう促してきた。しかし部隊の機械化程度は非常に低く、大量の装備や物資の補給が不足しており、この攻勢を保つのは厳しいだろう。目下は人数の優勢で他の不足を補うしかない。エジプトへ進軍しよう。
event_stage_intro_20712=イギリス軍の反撃の速さは驚異的だが、敵は我々の部隊規模を誤って評価している。敵が疲弊している今、我々は十分な戦力を持ってキレナイカの守備隊を一つずつ打ち破ることができる。イギリス軍の有力な戦力を殲滅することを主な目標とし、全速で前進せよ。敵を一人たりとも逃がすな！
event_stage_intro_20713=ギリシャの連合軍は我々によって全滅し、クリティ島は地中海における敵の最後の重要な拠点となっている。島を奪取すれば、それを足場としてキプロスを占領し、さらには海上からエジプトへの攻撃を開始することも可能だ。
event_stage_intro_20714=イギリス軍はトゥブルクへの道を切り開くために新たな攻勢を開始した。我々は元の防御施設を強化し、イギリス軍の進攻に備えて新たな陣地を構築している。今後も補給と援軍が次々と到着する。我々が再び北アフリカ戦線の主導権を握る日も近い。
event_stage_intro_20715=トゥブルクとその周辺地域の包囲網はまもなく完成するが、現在のところ我々には大規模な攻撃を行うための物資や装備がまだ不足している。しかし、イギリス軍が自ら攻勢を仕掛けてきたことで、この問題は解決された。速戦即決で敵の有力な戦力を殲滅し、補給線が長くなることで発生する一連の問題を回避せよ。
event_stage_intro_20716=我々の補給線の長さはすでに限界へと達した。敵の海空軍は地中海で依然として我々に大きな脅威を与えている。イギリス軍を中心とする連合軍は、紅海とスエズ運河を通じて兵力と物資の補給を絶えず受けている。情勢は厳しいが、これは北アフリカ戦線における我々の最後の戦いであり、我々の運命を決する一戦でもあるのだ。
event_stage_intro_20717=連合軍はモロッコとアルジェリアで巻き返しを図っている。米軍は陸路での進撃速度を加速させ、イギリス海軍も地中海の全戦力を集結させてチュニス湾に向かっている。現地のヴィシー政権下の守備隊はすでに連合軍と連絡を取っている可能性が高い。危機は迫っているが、我々は残された力を使ってチュニスで最後まで守り抜き、ロンメル主力の到着を待つ。

dialogue_2944=イギリスの援軍が集結している。マトルー港に向けて迅速に進軍せよ！この地に留まりすぎるな。
dialogue_2945=イタリア軍の規模は非常に大きい。前線部隊に通告せよ、戦いながら退却しろ。援軍到着後に力を集中して反撃を開始する。
dialogue_2946=前方攻撃が阻止された今、我々の補給ではこの規模の攻撃を維持できない。各部隊は戦線を維持することを最優先し、英国の突破を許すな。
dialogue_2947=イタリア軍を食い止めるには、もっと支援が必要だ。
dialogue_2948=援軍が段階的に到着している。 我が艦隊は海上で脅威に対処する。
dialogue_2949=主力部隊は無事にリビアに到着した。最速で東進し、シランニカ地域のイギリス軍を排除せよ。
dialogue_2950=援軍はまだ到着していない。今は敵を足止めすることに全力を尽くすしかない。必要があれば、陣地を放棄して東に退却するのだ。
dialogue_2951=ドイツ軍の攻撃の先鋒がバンガージーに近づいている。今すぐトゥブルクに撤退せよ、そこで守備部隊が堅固な防衛線を構築する。
dialogue_2952=攻勢は順調だ。我が部隊はバディーアに向かって前進する。イギリス軍の主力については諸君に任せる。
dialogue_2953=パラシュート部隊は目的の陣地の周囲に到達した。迅速に敵の拠点都市を占拠し、イギリスの増援が到着する前にクリティ島の守備隊を壊滅せよ。
dialogue_2954=イギリス軍がクリティ島南部の海域に集結している。我が艦隊は直ちに敵軍の南岸集結地点に攻撃を仕掛け、撤退を阻止する。
dialogue_2955=ドイツ軍のパラシュート部隊が島に上陸した。島内の各地の拠点と施設を守り抜くのだ、海軍の増援がまもなく到着する。
dialogue_2956=守備隊は最後の一刻まで戦い抜いたが、もはやクリティ島のドイツ軍に対抗するための兵力は残っていない。
dialogue_2957=我が艦隊では海上でのドイツ軍の進攻を阻止することができない。 撤退しか残された道はないだろう。
dialogue_2958=イギリス軍の反撃は勢いよく始まったが、敵は一点に重兵を集めて攻撃しているわけではない。
dialogue_2959=イギリス軍が我々の装甲部隊を包囲しようとしている。まず防衛線まで後退し、補給して反撃に備えよ。
dialogue_2960=イギリス軍はまだかなりの装甲部隊を残している。サルーム南部の防線を突破するのは容易ではないだろう。
dialogue_2961=サルーム方向に集結し、新たに防線を築き、東進するドイツ軍を阻止するのだ。
dialogue_2962=我々の攻撃は完全に失敗した。今はドイツ軍の前進を阻止し、サルームを奪還するために残存兵力を集中しなければならない。
dialogue_2963=イギリス軍は地形を利用して、各要塞に重兵を配置している。正面突破を試みると、かなりの代償を払うことになるだろう。
dialogue_2964=私の装甲部隊はトゥブルク南部から攻撃を開始し、連合軍のの守備を分断する。
dialogue_2965=敵軍は大規模な装甲部隊を持っている。正面からの抵抗では勝算がない。後方の陣地に撤退し、要塞と地雷原で守備を固めよ。
dialogue_2966=ドイツ軍が我々の腹地に侵入した。直ちにトゥブルグへの支援を行い、防御線を強化するのだ。
dialogue_2967=ドイツ軍の規模は大きく見誤られている。現有の兵力では全地域を守りきれないとしても、トゥブルグを直接放棄するわけにはいかない。
dialogue_2968=敵はもう限界だ。 引き続きアラメイン地区に援軍を派遣し、ここでドイツ軍と戦おう。
dialogue_2969=我が部隊はアラメイン南部からエジプトの中心部に向けて攻撃する。
dialogue_2970=反撃は非常に順調に進んでいる。イタリア軍の陣地を突破し、攻撃を続けるのだ。
dialogue_2971=敵がスエズ運河に迫ってきている。カイロ北部の戦線を維持するために、さらに部隊を増強する必要がある。
dialogue_2972=イギリス軍はカイロ周辺にまだいくつかの要塞を構えている。引き続き東進を続け、後続の敵増援に注意せよ。
dialogue_2973=スエズ運河を封鎖し、敵の艦隊がスエズ湾に航行させるな！
dialogue_2974=連合軍は地中海における海軍・空軍の優勢を利用し、我々の補給線と部隊の輸送を絶えず妨害している。
dialogue_2975=不十分な増援で連合軍を完膚なきまでに打ち負かすのは現実的ではない。撤退も困難を極めるだろう。我が装甲部隊は全力を尽くしてチュニジアを守るために全力を尽くす。
dialogue_2976=連合軍との合意に至った。兵士たちよ、フランスのために戦うのだ。
dialogue_2977=全速前進だ。敵軍の防線を突破し、チュニジア守備隊と再び繋がりを構築するのだ。
dialogue_2978=もしドイツ軍の主力が成功裏に救援されれば、その結末は想像を絶するものになるだろう。チュニジアへの攻撃を継続するため、今は時間との戦いなのだ。
dialogue_2979=連合軍の兵力はあまりにも大きい。もはや我々に退路などない。
dialogue_2980=チュニジアの敵をすべて殲滅せよ。我々の反撃が始まるのだ。

event_106=スターリングラード攻防戦
event_intro_106=1941年、ドイツは「バルバロッサ作戦」を発動し、広大なソ連領土を席巻した。赤軍の必死の抵抗も虚しく、故郷は破壊され土地は占領された。1942年には、黒い鋼鉄の洪水がソ連の心臓に向かって流れ込んでくるかのようにドイツ軍が迫る。スターリングラード——このヴォルガ川沿いに立つ都市は、国家の生死にかかわる防線となった。ソ連にとって、それは単なる都市の防衛ではなく、運命と尊厳を守るための戦いだった。国全体が、ピンと張った弦のようになり、スターリングラードでの運命的な決戦の時を待っていた。


item_sword=支配の剣
item_sceptre=支配の杖
item_desc_ticket=戦区と侵入掃討に使用する道具
item_desc_sword=将軍の修行に使用する通常の道具（紫の名札に昇格させる必要があります）
