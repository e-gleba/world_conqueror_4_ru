armygroup_event_desc_68=黒蠍のアメリカにおける一連の行動は相次いで挫折し、全軍は大規模に南方へ撤退した。複数の国家が米ソの援助を受け、黒蠍の支配から離脱した。
armygroup_event_desc_69=オズボーンは同時に5基のビーコン増幅器を起動し、最終カウントダウンを開始した。20サイクル後、意志の揺らぐ者はすべて再び黒蠍に加わることとなる。米・ソ・英・仏はそれぞれ自国の精鋭部隊を派遣し、周辺諸国と連合して各地の黒蠍の遺跡へ一斉攻撃を仕掛けた。
armygroup_event_desc_70=黒蠍のメキシコにある遺跡「太陽要塞」は突破され、ビーコン増幅器は占領された。世界各地の秘密基地の所在がすべて露見し、黒蠍は戦略的次元において全面的に受動の立場に追い込まれた。
armygroup_event_desc_71=黒蠍のコロンビアにある遺跡「エコー堡塁」は突破され、ビーコン増幅器は占領された。遺跡内の各種施設はすでに自壊していた。しかし残されたアクセス記録によれば、当該施設の再起動時点は1933年とされていた。
armygroup_event_desc_72=黒蠍のブラジルにある遺跡「インカの眼」は突破され、ビーコン増幅器は占領された。多くの特殊兵器装備は移送も破壊も間に合わず、さらにはこれまで見たことのない新型軍備の設計図までもが残されていた。
armygroup_event_desc_73=黒蠍のブラジルにある遺跡「星軌神殿」は突破され、ビーコン増幅器は占領された。米ソは大量の暗号化資料を押収し、黒蠍の世界各地における人員名簿と軍事配備が完全に暴露された。
armygroup_event_desc_74=黒蠍のブラジルにある遺跡「颶風灯台」は突破され、ビーコン増幅器は占領された。黒蠍主力部隊と世界各地の他の黒蠍構成員との通信は一時的に遮断された。
armygroup_event_desc_75=黒蠍勢力は再び急速に発展・拡大し、米ソ双方はこの脅威を根絶するために協力することを決定した。ワルシャワ条約機構とNATOは一時的に停戦し、新たな軍事同盟を結成した。
armygroup_event_desc_76=オズボーンは徹底的に撃破され、カウントダウンは停止した。黒蠍の南米における計画は完全に挫折した。
armygroup_event_desc_77=黒蠍の全ての遺跡施設は占領され、カウントダウンは停止した。黒蠍の南米における計画は完全に挫折した。
armygroup_event_desc_78=オズボーンは徹底的に撃破され、カウントダウンは停止した。黒蠍の南米における計画は完全に挫折した。すべての人々が自由への呼び声を聞いた。
armygroup_event_desc_79=黒蠍の全ての遺跡施設は占領され、カウントダウンは停止した。黒蠍の南米における計画は完全に挫折した。すべての者が、自由の呼び声を耳にした。
armygroup_event_desc_80=最後に残ったビーコン増幅器の調整が完了した。黒蠍が長期にわたり支配地域で密かにQ30物質を含むナノ薬剤を投与していたため、鐘の音が鳴り響くと、薬剤の影響を受けた者の自律的な意識は次第に抑制され、最終的には再び黒蠍に加わった。
armygroup_event_desc_81=マヤ遺跡で新たな水晶髑髏が発見された。それは単なる遺物ではなく、神殿の情報や未知の文明の歴史データを記録する記憶装置であった。
armygroup_event_desc_82=ノイシュヴァーベン集団軍は黒蠍の軍事装備を携えて南米の密林に姿を現した。彼らが黒蠍と軍事協力を結んだのか、あるいは黒蠍こそが彼らの存在理由なのかもしれない。
armygroup_event_desc_83=ソ連はベネズエラに大量の戦車を引き渡し、アメリカ軍およびその同盟軍の攻撃に対抗するための装甲防衛線を築こうとした。
armygroup_event_desc_84=黒蠍は武装海賊を使い、複数の海域で各国の商船を大規模に略奪させた。この行為は米ソの報復を招いた。各国は海軍装備をさらに強化し、艦隊を連合して海賊に対する全面的な掃討を行った。
armygroup_event_desc_85=黒蠍の海軍部隊は「音波の霧」を利用してレーダーシステムを妨害し、パナマ運河周辺の航路を繰り返し襲撃した。各国軍の補給線はいずれも一定の影響を受けた。
armygroup_event_desc_86=アメリカはコロンビアとペルーを経由してブラジルへミサイル部品を秘密裏に空輸し、このルートは黒蠍とソ連の監視を巧みに回避することに成功した。
armygroup_event_desc_87=キューバは再び攻撃を受け、地域の均衡は再度崩された。同時に、ソ連は短期間のうちにキューバへ大規模な軍事援助を提供した。
armygroup_event_desc_88=アメリカはカリブ海東部海域に大規模なソナーアレイを配備し、ソ連潜水艦を監視した。
armygroup_event_desc_89=ソ連は地殻震動の試作機を実験し、チリ・ボリビア・アルゼンチンの国境地帯で地震を引き起こした。その制御不能性が極めて強いため、この兵器の研究は最終的に中止された。
armygroup_event_desc_90=ソ連はキューバで気象兵器「嵐の目」を実験し、フロリダへの颶風襲来を誘導することに成功した。
armygroup_event_desc_91=黒蠍支配地域の各国で次々と反黒蠍組織によって設立されたラジオ局が現れた。これらの局は占領地の民衆に向けて絶えず放送を行い、団結して黒蠍の支配を打倒するよう呼びかけ続けた。
armygroup_event_desc_92=米ソの偵察衛星による南米地域の全面的な監視を阻止するため、黒蠍は各大洋の島々に妨害基地を設置し、信号を妨害・傍受して米ソの衛星データを盗み取った。
armygroup_event_desc_93=英国軍はバミューダ地域で第二次世界大戦期のドイツ軍原子力潜水艦「ノーチラス号」を発見した。このUボートはその後アメリカ軍によって建造されたノーチラス号とは全く異なるものであった。第二次世界大戦期に建造されたにもかかわらず、艦艇は依然として完全な状態にあり、艦内装備の技術水準は大戦期をはるかに凌ぎ、さらには現代をも超越していた。
armygroup_event_desc_94=ブラジルの熱帯雨林で巨大油田が発見され、米・ソ・黒蠍はペルー＝ブラジル国境において採掘権をめぐり激しい争奪戦を開始した。
armygroup_event_desc_95=黒蠍勢力が北米から駆逐された後、アメリカ軍は黒蠍施設の技術を利用してフィラデルフィア実験を再始動した。新型駆逐艦エルドリッジ号は再び人々の眼前から姿を消した。
armygroup_event_desc_96=ソ連はボリビアに「地球望遠鏡」を建設し、地球の中心を探査した際、偶然マントルへ通じる通路を開通させ、地下に眠る豊富な資源の採掘に成功した。
armygroup_event_desc_97=アマゾン河流域で突如として黄熱病が発生し、各国部隊の戦闘力はそのために低下した。しかし黒蠍および米ソ軍隊の中には感染例は確認されなかった。

