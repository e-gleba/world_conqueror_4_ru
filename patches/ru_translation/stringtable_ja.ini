event_intro_472=1942年2月8日、日本軍はシンガポールの防衛が最も手薄だった北西部の海岸から上陸に成功した。連合軍は兵力と補給物資の面で優勢だったが、訓練と経験が不足していたため、日本軍の進撃を止められなかった。日本軍はすぐにブキッ・ティマを制圧し、連合軍の食料倉庫、燃料庫、および近くの貯水池を掌握した。これによって、島内の連合軍は急速に物資不足に陥った。最終的に、2月15日、連合軍は無条件降伏した。
event_intro_473=1942年2月11日から13日にかけて、空襲を避けるため、ドイツ軍の戦艦「シャルンホルスト」、「グナイゼナウ」、重巡洋艦「プリンツ・オイゲン」は、掃海艇と空軍の支援を受けながら、フランスのブレストからイギリス海峡を通過してドイツの海軍基地へと移動することに成功した。この「ケルベロス作戦」は、イギリス軍の威信を失墜させた。しかしその後、ドイツ軍の水上艦艇の活動範囲は北海に限定されるようになり、大西洋航路への脅威とはならなくなった。
event_intro_474=1943年2月14日、連合軍がスィディブジド東部のファイド峠から攻勢を仕掛け、ドイツ軍の支配下にある沿岸平原を突破しようとするのを防ぐため、ドイツ軍はスィディ ブジドとその周辺に攻撃を開始した。この作戦で連合軍部隊に大打撃を与えた。連合軍は多くの陣地を失い、戦線はゲタールまで後退した。
event_intro_475=ヘイルストーン作戦は、1944年2月17日から18日にかけて、アメリカ海軍が日本海軍の中部太平洋の要衝であるトラック島の軍事基地に対して実施した大規模な海空合同攻撃である。この作戦では、主要な目標であった日本海軍の主力艦隊は事前に疎開しており、大きな被害を免れた。しかし、港内に停泊していた大量の輸送船や補助艦艇が壊滅的な打撃を受け、これによって日本軍の海上輸送能力は大きく損なわれた。
event_intro_476=硫磺島の戦いは、第二次世界大戦の太平洋戦争において、アメリカ軍と日本軍の間で繰り広げられた戦いである。戦闘は1945年2月19日から3月26日まで続いた。この戦いでは、日本軍はアメリカ軍の上陸を浜辺で阻止する防衛線を放棄し、島の内部に複雑な縦深防御を構築する戦術を採用した。これにより、アメリカ軍の攻撃は非常に困難なものとなり、当初7日間での制圧を計画していた作戦は1か月以上にわたって遅延した。最終的に、アメリカ軍は日本軍を打ち破り、摺鉢山の頂上に掲げられた星条旗は、アメリカの重要な精神的象徴となった。
event_intro_477=1945年2月24日、ソ連軍は、ベルリン攻勢の際にポメラニアに駐留するドイツ軍が反撃を行い、戦争を長引かせるのを防ぐため、ロコソフスキー元帥指揮下の第2白ロシア方面軍と第1白ロシア方面軍の東側部隊を派遣した。この作戦により、ソ連軍北側のポメラニア守備隊を一掃し、ベルリンへの進攻路を確保することに成功した。
event_intro_478=1942年2月27日、ジャワ島占領を目指す日本軍は、スラバヤ近海で連合軍艦隊と海戦を繰り広げた。この戦闘は2日間にわたり続き、日本軍は駆逐艦1隻が損傷するにとどまる一方で、連合軍の多数の艦艇を撃沈・撃破し、勝利を収めた。この戦闘により、ジャワ島周辺海域の連合軍艦船はほぼ壊滅し、日本軍のジャワ島侵攻が大きく進展した。
event_intro_479=1943年初、新幾内亞戦役は連合軍の攻勢段階に入った。これに対抗し、日本軍は新幾内亞への兵力増強による反攻を計画した。1943年2月28日、日本軍はラバウルから艦隊を出発させ、3月3日までに約6900名をライエに輸送する予定だった。しかし、連合軍はこの計画を事前に察知し、3月2日から3日にかけて艦隊に対する継続的な空襲を実施。結果として、輸送船は全て撃沈され、日本軍の反攻計画は頓挫した。
event_intro_480=1943年3月6日、イギリス軍によるマレスラインへの攻撃を遅らせるため、ドイツ軍はメドニンに集中攻撃を仕掛け、現地の予備部隊を壊滅させる計画を立てた。しかし、イギリス軍はこの計画を事前に察知し、部隊を増強して防衛体制を整えた。攻撃当日、ドイツ軍は迅速に陣地を突破することができず、進軍は停滞した。指揮官のロンメルは、たとえ勝利しても残存兵力ではマレスラインを守りきれないと判断し、作戦続行を断念した。結果として、イギリス軍が最終的な勝利を収めた。
event_intro_481=1944年3月8日、日本軍は敵の拠点を占領し、ビルマを防衛するとともに、補給路を断つという「攻撃的防御」を目的とした戦略のもと、インパール作戦を開始した。この戦闘は7月初めまで続き、最終的に日本軍の壊滅的な敗北に終わった。敗北の主な原因は、指揮官牟田口廉也による現実離れした無責任な作戦計画と指揮責任の放棄にあったとされる。この作戦の失敗は、日本軍に大きな損失をもたらし、日本において「インパール」という言葉は現在でも「無謀な行動」の代名詞として使われている。
event_intro_482=ミンダナオ島を解放し、島内の日本軍守備隊を壊滅させるために、アメリカ軍はヴィクター5号を発動、後にミンダナオ島の戦いと呼ばれた。この戦いは1945年3月10日から8月15日まで続いた。フィリピンのゲリラ部隊の支援を受けたアメリカ軍は、極めて少ない犠牲で島内の全日本軍を排除することに成功した。この戦闘の勝利により、フィリピン全体の解放が現実のものとなり、太平洋戦争の終結に向けて大きく前進した。
event_intro_483=メドニンの戦いの後、連合軍はすぐにマレスラインの攻略に着手した。1943年3月16日、イギリス軍は二手に分かれた。一方は防衛線の正面を攻撃し、枢軸軍の注意を引き付ける役割を担った。他方は南西の峠を迂回し、北上して側面から攻撃を仕掛けた。連合軍の両面攻撃に直面した枢軸軍は包囲を避けるため、北への撤退を余儀なくされた。結果として、連合軍はマレスラインを占領することに成功した。
event_intro_484=ミンダナオ島の戦いが始まった後の1945年3月18日、マッカーサー将軍はフィリピン中部のビサヤ諸島を占領するよう命令を下した。この時、各島のフィリピンゲリラ部隊は積極的に反撃を行っており、日本軍は大都市のみを守るのが精一杯で、全島規模の防御を展開することが困難な状況だった。そのため、アメリカ軍はほとんど抵抗を受けることなくビサヤ諸島を解放した。
event_intro_485=1943年3月23日、アメリカ第2軍団はドイツ軍の防衛線を突破し、マレスラインへの進軍を目指して、ゲルタで枢軸国軍と交戦した。アメリカ軍は初期段階でいくらかの進展を見せ、ドイツ軍の前哨部隊を撃退することに成功した。しかし、ドイツ軍は素早く反撃に転じ、戦車と歩兵を投入してアメリカ軍に激しい攻撃を加えた。この結果、ゲルタ峡谷では双方の戦力が拮抗し、戦闘は膠着状態に陥った。その後、連合軍が他の戦線での突破に成功したことで、ゲルタの戦局は動き始めた。
event_intro_486=1944年3月25日、ソ連軍はドイツ第1装甲軍を壊滅させるため、第1ウクライナ方面軍と第2ウクライナ方面軍を動員し、カメネツ＝ポドリスキー地域で包囲作戦を展開した。この状況下、ドイツ国防軍最高司令部は最終的に第1装甲軍の突破を許可。ドイツ軍は大量の装備と人員を失いながらも包囲からの脱出に成功した。しかし、この損失により、ドイツ軍はウクライナで効果的な防御を組織する能力を喪失した。
event_intro_487=1942年3月31日、日本軍は東南アジアでの支配力を強化し、ビルマ侵攻中の陸軍を支援するため、第1航空艦隊を派遣してセイロンの英海軍基地を攻撃し、イギリス東洋艦隊の壊滅を図った。イギリス軍は事前にこの計画を察知していたものの、指揮判断の誤りによって対応が遅れた結果、インド洋地域の海軍力は深刻な打撃を受けた。イギリス東洋艦隊はベンガル湾からの撤退を余儀なくされた。
event_intro_488=1945年4月1日、アメリカ軍は日本本土への足掛かりを得るため、沖縄戦を開始した。戦闘初期、アメリカ軍は迅速に沖縄本島の中部と北部を制圧した。しかし、南部への進攻では、日本軍が洞窟やトンネル、強固な防御施設を利用したため、アメリカ軍は激しい陣地戦に引きずり込まれた。この戦闘で連合軍は約12,000人が戦死し、36,000人が負傷。一方、日本軍は約77,000人が戦死または行方不明となった。この凄惨な戦いの結果、アメリカは原子爆弾を使用して日本の降伏を早める決定を加速させた。
event_intro_489=グレープショット作戦は、第二次世界大戦末期のイタリア戦役における連合軍の最後の攻勢である。1945年4月6日、連合軍は北へ向けて進軍を開始し、ポー川両岸に築かれたドイツ軍の防衛線を突破した。同時に、イタリアのパルチザンは一斉蜂起し、枢軸国軍の崩壊を加速させた。最終的に、1945年5月2日、イタリアに駐留していたドイツ軍とイタリア軍の残存部隊はすべて降伏し、連合軍はイタリア全土を解放した。

