feat_desc_43_Lv2=行動後に再度行動可能、クールダウン1ターン、2回目の行動で敵軍を殲滅した後、{1}%の確率で再度攻撃できる（1回のみ）
feat_desc_47_Lv3=1体の友軍のHPを{1}ポイント回復し、その標的に毎ターン追加で50ポイントのHPを回復、2ターン継続。また、このスキルの使用時に自身のHPを{2}ポイント回復する。クールダウン1ターン
feat_desc_50_Lv2=複数の敵部隊に攻撃し、他の標的に対するダメージは減少せず、会心の一撃の威力が{1}%増加する
feat_desc_51_Lv2=次回の攻撃射程+2、攻撃は標的の都市または要塞のHPを{1}%減少させる（最大1200）。同時に、守備部隊のHPを{2}%減少させる（最大500）。クールダウン2ターン
feat_desc_57_Lv2=目的地に歩兵、装甲車、野戦砲、または榴弾砲を輸送する際、輸送中にHPを{1}%回復
feat_desc_60_Lv2=自軍の周囲2マスに高級機雷を敷設する。クールダウン1ターン
feat_desc_61_Lv2=次回の攻撃時に、標的の1マス範囲内のランダムな敵に追加のダメージを与えることができる。クールダウン2ターン
feat_desc_62_Lv2=1ターンの間、自身の周囲1マス範囲の敵軍を混乱状態にする、クールダウン3ターン。3つ以上の標的に影響を与えた場合、クールダウン1ターン
feat_desc_64=会心率の余剰分が追加ダメージに変換される。余剰分の{2}%ごとに{1}%が追加ダメージとなる。
feat_desc_65=敵部隊の{1}%の防御力を無効化
feat_desc_66=このターンでのタンクユニットへのダメージが{1}%増加。クールダウン2ターン
feat_desc_67=反撃ダメージ+{1}%
feat_desc_68=攻撃後に相手が撃破された場合、{0}%の確率で再度行動が可能。最大{2}回
feat_desc_69=自身の周囲1マス範囲内の友軍が攻撃する時、{0}%の確率で自身も攻撃に参加する
feat_desc_69_Lv2=自身の周囲1マス範囲内の友軍が攻撃する時、{0}%の確率で自身も攻撃に参加し、ダメージが{1}%増加
feat_desc_70=攻撃時、目標の1マス範囲内の他の目標に対して{1}%の追加ダメージを与える。クールダウン2ターン
feat_desc_71=追加で{1}回攻撃する
feat_desc_72=空港内のすべての通常飛行機を使用可能。飛行機の上限{1}ポイント
feat_desc_72_Lv3=輸送機を除き、飛行場でほとんどの航空機を使用でき、最大{1}航空機ポイントまで使用可能です。
feat_desc_73=通常攻撃によるタンクユニットへのダメージが{1}%増加

