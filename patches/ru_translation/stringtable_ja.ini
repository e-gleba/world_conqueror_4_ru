skill_info_136=指揮する精鋭部隊火砲のレベルに応じて、レベル毎に与えたダメージの[#00FF00#%d%%]のHPを回復する。精鋭部隊火砲の会心の一撃のダメージが25%%増加する。
skill_info_137=歩兵を指揮している時、受けるダメージが[#00FF00#%d%%]減少。敵の攻撃を受けた後、追加で10%%のダメージ軽減。1ターン継続、最大で3回まで重複可能。
skill_info_138=攻撃後、自身が[#00FF00#%d%%]の確率で「挑発」状態を獲得する。
skill_info_139=装甲部隊を指揮し敵の領土内にいる場合、自身と周囲の友軍の致命的な一撃のダメージ+[#00FF00#%d%%]
skill_info_140=攻撃が敵の士気を低下させ、士気が衰退した場合、[#00FF00#%d%%]の確率で再度攻撃を行う。攻撃が敵の士気を混乱状態にした場合、100%%の確率で再度攻撃する。（既に混乱状態の敵には効果がない）。
skill_info_141=艦船を指揮して攻撃後、50%%の確率で敵に「揺れ」状態を付与し、行動力を[#00FF00#%d%%]減少。2ターン継続。エンタープライズを指揮している場合、戦闘機以外の空軍ユニットの消費が1減少する。
skill_info_142=部隊を指揮して回避を発動した場合、自身のHP上限の[#00FF00#%d%%]を回復する（1ターンにつき最大1回）
skill_info_143=指揮装甲部隊が自身または友軍の領地内にいる際、受けるダメージを-[#00FF00#%d%%]。また、敵の将領からの攻撃を受けた際には、さらにダメージの50%%が返還される。
skill_info_144=攻撃後、目標と周囲1マス以内にいる他の敵に[#00FF00#%d%%]の確率で追跡マークが付与される。追跡マークが付与された敵は、受けるダメージが20%%増加する。1ターン継続。


