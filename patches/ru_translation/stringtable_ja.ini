event_stage_intro_20601=スターリングラードのドイツ軍はすでに風前の灯火だ。すべての建物が我々の砦と要塞となっている。この英雄都市はドイツ軍の最も激しい攻撃を阻止した！我々の部隊は続々と集結しつつある。敵と我々の兵力は逆転し、反撃の時が間もなく訪れるだろう。
event_stage_intro_20602=ドイツ軍は再びハルキウを奪還した。情報によると、彼らは大規模な攻勢を仕掛け、クルスク突出部にいる我々の守備隊を殲滅しようと大量の装甲部隊を集結している。我々は複数の堅固な防衛線を構築し、この防御深度に大量の兵力を配置して、ドイツ軍を不意打ちにするつもりだ。
event_stage_intro_20603=ドイツ軍は絶えずドニエプル川両岸の工事を強化しているが、大規模な防衛線を短期間で完成させることは不可能だ。この機会を利用して、ドニエプル下流川で大規模な攻勢をかけ、キエフを奪取し、戦線をさらに西へと進めよう。ドイツ軍の反攻に注意し、攻撃の主力をしっかりと保持するのだ。
event_stage_intro_20604=部隊はすでにレニングラード周辺に集結し、この三年間包囲されていた英雄都市は完全解放を目前にしている。しかし、ドイツ軍は西側に堅固な防衛線を築いている。攻勢をかけ、北方軍集団を打ち破り、西への進路を開かなければならない。
event_stage_intro_20605=クリミアはドイツ軍にとっても我々にとっても非常に重要な軍事的価値を持っている。目の前の防衛線を突破すれば、陸路でクリミア全体を孤立させ、北側とケルチ半島の東側から攻撃を開始できる。敵の敗北は時間の問題に過ぎない。セバストポリの要塞は最終的に我々の手に落ちるだろう。
event_stage_intro_20606=クルスク、ドニエプル下流、クリミア攻防戦の後、陸軍中央集団は露呈した。 同時に、ドイツ軍は我々の欺瞞的行動に惑わされ、軍の一部を南部の北ウクライナ軍集団に再配置した。 兵力が集結した今こそ、全戦線で攻撃を仕掛け、敵に三年前の愚行を償わせる時である！
event_stage_intro_20607=西部戦線の連合軍はライン川の手前で足止めされ、ドイツ軍は死闘に備えて東部戦線に最後の兵力を集結させていた。 しかし、敵は精鋭をすべて失い、西部戦線の連合軍に一刻も早く合流するため、急速に西へ進軍していた。 ベルリンの運命は既に決まっている。
event_stage_intro_20611=スターリングラードのドイツ軍はすでに風前の灯火だ。すべての建物が我々の砦と要塞となっている。この英雄都市はドイツ軍の最も激しい攻撃を阻止した！我々の部隊は続々と集結しつつある。敵と我々の兵力は逆転し、反撃の時が間もなく訪れるだろう。
