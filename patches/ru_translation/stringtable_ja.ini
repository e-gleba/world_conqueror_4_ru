operation_rule_1=1. イベントキャンペーンは期間限定で開催されます。ステージをクリアして報酬を手に入れるため、指揮官は余裕を持ったスケジュールを立てることをお勧めします。
operation_rule_2=2. キャンペーンは普通難易度と困難難易度に分かれており、困難難易度は普通難易度のキャンペーンをクリアすることで解放されます。
operation_rule_3=3. 困難難易度のキャンペーンでは、敵軍に2つのバフが付与される（イベント開放時にランダムで2つのバフがイベント終了まで付与される）ので、指揮官方が困難難易度のキャンペーンに挑戦する際は、進軍ルートを慎重に決定してください。
operation_rule_4=4. この難易度のキャンペーンでは、各ステージで撃破された将軍は次のステージに配置することができず、進行状況をリセットすることでしか、これらの将軍を再び配置することはできません。
operation_rule_5=5. ステージを制覇すると、現在の最高通過難易度が記録されます。特定のレベルをクリアすると区間報酬を受け取ることができます。
operation_rule_6=6. 区間の報酬は、リボン報酬とエリート部隊の破片の2種類に分かれており、報酬を受け取る時ランダムで一定量の報酬をもらえます。
operation_rule_7_1=7. 進行状況のリセットは、現在の難易度のキャンペーンクリアの進行状況と区間報酬のみリセットすることができます。イベント制限時間内の1回目のリセットは無料で、メダルを消費してもう1回リセットを行うことができます。メダルでリセットできるのは1回のみです。(普通難易度と困難難易度のリセット回数は共通です。）
operation_rule_7=7. 進度リセットは、現在の難易度のシナリオ進度のみをリセットすることができます。


defensive_rule_1=1. イベントキャンペーンは期間限定で開催されます。ステージをクリアして報酬を手に入れるため、指揮官は余裕を持ったスケジュールを立てることをお勧めします。
defensive_rule_2=2. キャンペーンは普通難易度と困難難易度に分かれており、困難難易度は普通難易度のキャンペーンをクリアすることで解放されます。
defensive_rule_3=3. 困難難易度のキャンペーンでは、敵軍に2つのバフが付与される（イベント開放時にランダムで2つのバフがイベント終了まで付与される）ので、指揮官方が困難難易度のキャンペーンに挑戦する際は、進軍ルートを慎重に決定してください。
defensive_rule_4=4. すべてのクリティカルエリアを守ることで勝利する。ステージの勝敗に関係なく、現在の最長防衛ターンが記録される。一定の防衛ターンを達成すると、それぞれの区間報酬を受け取ることができる（敵軍を全滅させた場合、全段階報酬が解除されます）。
defensive_rule_5=5. ステージは繰り返しプレイできるが、途中で終了すると現在の最大防御ターンは記録されない。
defensive_rule_6=6. 区間の報酬は、リボン報酬とエリート部隊の破片の2種類に分かれており、報酬を受け取る時ランダムで一定量の報酬をもらえます。

