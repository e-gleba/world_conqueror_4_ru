dialogue_3199=作戦開始！英国軍が気付く前にデンマーク全域を制圧し、ノルウェーの戦略港を占領せよ！
dialogue_3600=艦隊を出動させよ。港は我々の支配下に置かねばならない！
dialogue_3601=デンマークは降伏した。全軍、戦闘態勢を維持しノルウェーへ進軍継続！
dialogue_3602=英軍の攻撃は単発ではない。ナルヴィクは死守せよ！
dialogue_3603=不凍港確保を英軍は許さぬ。万全の防備を整えよ！
dialogue_3604=敵の攻撃を防ぐため、可能な限りの準備は完了した。
dialogue_3605=我が軍団は最短進攻路を有す。ベルリン攻略の栄誉は我らのものだ！
dialogue_3606=最短ルートに最強の敵あり。ベルリン占領の先陣は我らが掴む！
dialogue_3607=北方面の装甲部隊が主力部隊の障害を一掃する。
dialogue_3608=戦線崩壊。今は多くの命を救うことのみを考える。
dialogue_3609=ベルリン防衛軍へ：総統自決。直ちに戦闘停止せよ！無駄な犠牲を出すな！
dialogue_3610=今回の任務はドーリットルを発進地点まで護送することだ。爆撃機が発進したら艦隊は全速で撤退しろ──日本軍と交戦するな、一秒たりとも無駄にするでない！
dialogue_3611=艦隊が日本軍に発見された。計画を前倒しする。爆撃機中隊、搭乗せよ！
dialogue_3612=ドーリットル中隊、全機発進完了。全艦撤退開始！
dialogue_3613=敵軍は戦略的柔軟性を失い、作戦は最終段階に入った。各部隊に告ぐ――敵の防衛陣を切り崩し、まずチュニスを包囲せよ。その後、ビゼルテを制圧せよ。
dialogue_3614=私はアフリカ集団軍を代表し、連合軍に降伏する。
dialogue_3615=攻撃はもう不要だ。私はイタリア第1集団軍を代表し、無条件降伏を受け入れる。
dialogue_3616=枢軸国がエーゲ海で力を蓄えるのは看過できん。特別部隊を派遣し、島嶼部の守備隊を破壊しろ。海軍の観測所と無線中継基地を破壊せよ。
dialogue_3617=最近、連合軍がデヴォン州付近の海岸で大規模な動きを見せている。Sボート部隊は海峡防衛線を回避し、偵察を兼ねた武装行動を取れ。
dialogue_3618=日本海軍はもはや脅威ではない。ボルネオを解放し、島の飛行場と石油資源を確保せよ！
dialogue_3619=井上中将、この三つの空母部隊は君が指揮しろ。MO作戦を遂行し、必ずや上陸部隊をポートモレスビーへ送り届けよ！
dialogue_3620=情報によれば、日本軍はポートモレスビーへの進撃を計画している。即座に動員可能な4隻の空母を珊瑚海に投入せよ、敵の野望を打ち砕け！
dialogue_3621=偵察機の情報によれば、日本軍の主力がすでに出撃したようだ。攻撃を仕掛け、ジョーマード海峡で敵を葬り去れ！
dialogue_3622=翔鶴と瑞鶴を守り抜き、侵入してくる敵軍を徹底的に粉砕してみせよう！
dialogue_3623=B軍集団に告ぐ：低地諸国を目標に戦略的な陽動攻撃を実施し、イギリス・フランス軍の主力を北のベルギーへおびき寄せ、A軍集団が決戦を行う好機を作り出せ！
dialogue_3624=A軍集団に告ぐ：アルデンヌの森を攻撃の主軸とし、フランドルで包囲を形成して連合軍主力を殲滅せよ！
dialogue_3625=機甲集団は全速力で突撃せよ！3日目までにマース川へ到達し、翌日には渡河を強行せよ！
dialogue_3626=北部部隊は直ちにベルギー前線へ前進し、遮断線を築け。ドイツ軍の突破は断じて許すな！
dialogue_3627=ペタン元帥の命令により、フランスはドイツと休戦協定を結んだ。各部隊は現行体制を維持し、指定された地域へ秩序正しく移動せよ。
dialogue_3628=戦争はまだ終わっていない。フランスの抵抗もまだ終わっていない。私はロンドンへ赴き、フランス国民を率いて戦い続ける！
dialogue_3629=同志たちよ！イジューム突出部とヴォフチャンスクを進撃軸に、ハリコフを奪取せよ！
dialogue_3630=南方軍集団は注意：ソ軍がハリコフ前線で大規模に集結中。攻撃の兆候だ、防御体制を整えよ。
dialogue_3631=イジュームへ突進せよ。第1装甲集団軍と協同で包囲を完成させろ。
dialogue_3632=
dialogue_3633=第7装甲旅団は砂漠の側面から前進せよ。第22近衛旅団はハルファヤ峠とカプッツォ要塞を主攻、沿岸部隊はサルームを奪取せよ。
dialogue_3634=戦線を維持しろ、カプッツォ要塞を死守せよ！私はすぐにトブルクから部隊を抽出して支援に向かう！
dialogue_3635=カプッツォ要塞とハルファヤ峠を奪還しろ、包囲された部隊が背後からの脅威にさらされ続けるわけにはいかん！
dialogue_3636=カプッツォ周辺の部隊はハルファヤ峠へ後退せよ、ドイツ軍に付き合うな。
dialogue_3637=空挺部隊はまず目標の飛行場を制圧しろ、確保後は迅速に補給と増援部隊を投下する。
dialogue_3638=王立海軍が周辺海域を封鎖し、敵の輸送船の上陸を厳重に阻んでいる！
dialogue_3639=第2機甲師団はブローニュへの主攻を担当し、第1機甲師団と第10機甲師団はそれぞれ別のルートを進んでカレーを共同攻撃せよ！海峡の港を一刻も早く制圧するのだ！
dialogue_3640=カレー守備隊全員に告ぐ：48時間、市街を死守せよ！ドイツ軍の進軍を1時間でも遅らせれば、友軍の撤退者を万単位で救える！
dialogue_3641=イギリス空軍が出撃し、地上軍の撤退を援護するためにシュトゥーカ急降下爆撃機編隊を重点的に迎撃している！
dialogue_3642=A軍集団、B軍集団は攻勢を再開せよ。迅速に海岸線の包囲網を完成させろ、敵を逃がすな！
dialogue_3643=ベルギーが降伏しただと？くそっ、すぐにリス川防衛線を縮小し、ベルギーの空白を埋めろ！
dialogue_3644=ダンケルクへ急げ、敵を逃がすな！
dialogue_3645=フランス第1軍団へ命ず：退路を断ち、決して後退せぬ！我々は祖国の国土を守り抜く！
dialogue_3646=リールを迅速に占領せよ！この地で足止めされることは許されぬ！
dialogue_3647=包囲網を突破し、他の戦場で祖国防衛を継続する！
dialogue_3648=敵の港湾を奇襲し、海上補給路を遮断し、戦略物資輸送能力を圧殺せよ！

