feat_desc_88=1マス以内に地雷を設置し、{1}のダメージを与える、クールダウン1ターン。
feat_desc_88_Lv3=2マス以内に地雷を設置し、{1}のダメージを与える、クールダウン1ターン。
feat_desc_89=現在地から目標の地点まで4マス以内にトンネルを掘る。目標地は山岳地帯、海洋地帯、または海を横切ることはできない。自軍の歩兵、装甲車、軽戦車、中戦車、ロケット砲、野戦砲、榴弾砲はトンネルを通過できる。 地下道を通過することで追加行動が可能、各地下道は最大で3回まで使用できる。新しいトンネルが掘られると、元のトンネルは消滅する。 クールダウン2ターン。
feat_desc_89_Lv2=現在地から目標の地点まで7マス以内にトンネルを掘る。目標地は山岳地帯、海洋地帯、または海を横切ることはできない。自軍の歩兵、装甲車、軽戦車、中戦車、ロケット砲、野戦砲、榴弾砲はトンネルを通過できる。 地下道を通過することで追加行動が可能、各地下道は最大で3回まで使用できる。新しいトンネルが掘られると、元のトンネルは消滅する。 クールダウン2ターン。
feat_desc_90=周囲1マス以内の建物はHPを{1}回復、1ターンに1回のみ有効。
feat_desc_92=HPを{1}失うごとに、部隊攻撃力が{2}上昇。
feat_desc_92_Lv2=攻撃範囲+1、HPを{1}失うごとに、部隊攻撃力が{2}上昇。
feat_desc_92_Lv3=攻撃範囲+1、HPを{1}失うごとに、部隊攻撃力が{2}上昇。
feat_desc_93=HPが減っても戦闘力は下がらない。瀕死時、HPは1点以下には減少せず、2ターン継続。クールダウン{2}ターン。
feat_desc_93_Lv2=HPが減っても戦闘力は下がらない。瀕死時、HPは1点以下には減少せず、2ターン継続。クールダウン{2}ターン。
feat_desc_93_Lv3=HPが減っても戦闘力は下がらない。瀕死時、HPは1点以下には減少せず、3ターン継続。クールダウン{2}ターン。
feat_desc_94=自身または友軍の領土内にいるとき、与えるダメージが{1}%増加。
feat_desc_95=攻撃および反撃時、地形によるダメージ軽減効果を無視する
feat_desc_95_Lv2=攻撃および反撃時、地形によるダメージ軽減効果を無視し、さらに敵の防御力と行動力を{1}%減少、1ターン継続。
feat_desc_95_Lv3=攻撃および反撃時、地形によるダメージ軽減効果を無視し、さらに敵の防御力と行動力を{1}%減少、2ターン継続。
feat_desc_96=受ける直接ダメージを自身および周囲の友軍と分担。分担または回避したダメージ{1}ごとに、基礎攻撃力が{2}増加する。増加する攻撃力の上限は100%、効果は2ターン継続。
feat_desc_96_Lv2=受ける直接ダメージを自身および周囲の友軍と分担。分担または回避したダメージ{1}ごとに、基礎攻撃力が{2}増加する。増加する攻撃力の上限は100%、効果は3ターン継続。
feat_desc_96_Lv3=受ける直接ダメージを自身および周囲の友軍と分担。分担または回避したダメージ{1}ごとに、基礎攻撃力が{2}増加する。増加する攻撃力の上限は200%、効果は3ターン継続。
feat_desc_97=空軍の攻撃を受けた際、{1}%の確率でダメージを回避する。

