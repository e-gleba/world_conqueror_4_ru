general_stage_intro_101=1939年9月、ドイツの第19戦車師団を指揮するグデーリアンはポーランドに対する電撃戦を開始した。一方、ソ連は東側から攻撃し、ドイツ軍と挟撃体制を形成、ポーランドは間もなく陥落した。この戦いが第二次世界大戦の始まりである。

general_stage_intro_102=1940年5月、グデーリアンは引き続き第19戦車師団を率い、フランスに対する電撃戦を開始した。ドイツ軍はアルデンヌの森を進み、フランスのマジノ線を迂回し、驚異的な速度でフランスを縦断した。

general_stage_intro_103=1941年9月、ドイツ軍はソ連北部の都市レニングラードの900日間にわたる包囲を開始した。この戦いは近代史上最長の包囲戦となった。

general_stage_intro_104=これは第二次世界大戦最大の戦車戦であり、東部戦線の大きな転換点となった。グデーリアンが第2装甲軍集団を率いて攻勢に出ると、そこには厳重に防衛されたソ連の陣地が待ち受けていた。

general_stage_intro_105=戦いは1944年10月に行われた。ソ連軍がハンガリーの首都ブダペストを包囲し、ハンガリーの支配権を奪還しようとした。ソ連軍の激しい砲撃の中、ドイツ軍はどう戦況を打開したのか。

general_stage_intro_111=チュニスは北アフリカ戦線におけるドイツ軍最後の拠点である。1942年11月、英米を中心とする連合軍は東西から攻撃を仕掛け、ドイツ軍を撃破してチュニジアを占領、これにより北アフリカ戦線は幕を閉じた。

general_stage_intro_112=1943年7月、連合国はイタリアの独裁政権を打倒するため、シチリア島で大規模な上陸作戦を展開した。この戦いは連合国にとって欧州戦線における重要な勝利であり、その後のイタリア本土攻撃の足がかりとなった。

general_stage_intro_113=1944年6月、連合国は西部戦線を展開しフランスを解放するため、ノルマンディーで未曾有の上陸作戦を実施した。この上陸作戦は、西部戦線におけるドイツの戦略に大きな脅威をもたらし、ヨーロッパにおける連合国の反攻作戦の幕開けとなった。

general_stage_intro_114=この戦いは、太平洋戦争における 陸軍同士の戦いとしては最大のものであり、日本軍の大敗に終わった。

general_stage_intro_115=1944年12月、連合軍はアルデンヌの戦いでドイツ軍と激戦を繰り広げた。ドイツ軍は冬季攻勢を試みたが、連合軍の抵抗に遭った。

general_stage_intro_121=1941年10月、ドイツ軍がモスクワを占領しようとしたとき、ジューコフは総司令官に任命された。ソ連赤軍は強靭な守備と粘り強い反撃で、最終的にドイツ軍の攻撃を撃退し、モスクワを守り抜いた。

general_stage_intro_122=この戦いは1942年8月に始まり、翌年2月に終結した。第二次世界大戦最大の激戦で、双方で200万人以上の死者が出た。ジューコフは作戦中、ソ連赤軍の参謀総長を務め、防衛と反攻を指揮した。

general_stage_intro_123=ドイツ軍が最後の大攻勢を開始した1943年7月、ジューコフはクルスクの戦いで参謀総長を務めた。彼はソ連赤軍の反撃を指揮し、ドイツ軍に大きな損害を与えた。この戦いの後、ドイツは完全に東部戦線の主導権を失った。

general_stage_intro_124=これは、ソ連がベラルーシとポーランド地域の一部を解放するために1944年6月に開始した大規模な 戦略的攻勢であった。最終的にソ連は目論見どおり、西部領土の大半を回復した。

general_stage_intro_125=1945年4月に始まったベルリンの戦いは、欧州戦線における第二次世界大戦の最終決戦であった。ジューコフはソ連赤軍第一ベラルーシ方面軍の総司令官として、ソ連軍を率いてドイツの首都ベルリンを占領しナチス・ドイツに降伏を余儀なくさせた。

general_stage_intro_131=1941年4月、ロンメル軍は英豪連合軍をトブルク要塞で包囲したが、激しい抵抗に遭った。イギリス軍は、窮地に陥った友軍を解放するため、何度か攻勢をかけたが失敗に終わった。その後、戦況は膠着状態に陥った。

general_stage_intro_132=1941年6月に行われたこの戦車戦は、北アフリカ戦線におけるドイツ軍とイギリス軍の最初の戦闘であり、ロンメルはイギリス軍を相手に機動防御を指揮して勝利を飾り、イギリス軍のトブルク奪還の幻想を打ち砕いた。

general_stage_intro_133=1 年前、ロンメルは港湾拠点であるトブルクで敗北した。1942年5月、ロンメルがどのような戦略で彼の軍歴の中で最も輝かしい勝利を挙げるかを目の当たりにするときが来た。

general_stage_intro_134=枢軸国は、エジプトを占領し、スエズ運河を支配することで、戦略的資源の豊富な中東を掌握しようとしていた。エル・アラメインの戦いは1942年10月に行われた。連合国はこの戦いで枢軸国の野望を阻止できるのだろうか？

general_stage_intro_135=これは北アフリカ戦線における最後の決戦であり、枢軸軍は1942年11月にチュニスで連合軍と激戦を繰り広げ、ドイツ・イタリア連合軍は防衛線を構築し、連合軍の圧倒的な物量と絶え間ない圧力の下で死にものぐるいで抵抗した。


