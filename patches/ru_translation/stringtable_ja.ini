conquest_event_desc_36=ドーリットル率いる爆撃機群は、日本から約650海里離れた空母から離陸し、日本の真珠湾奇襲攻撃への報復として日本本土を爆撃した。
conquest_event_desc_37=中国が遠征軍を派遣してミャンマーに援助し、共に日本の侵略軍に抵抗した。
conquest_event_desc_38=中国軍は長沙とその周辺で、日本軍の侵攻部隊と激戦を繰り返し、最終的に長沙を押さえ、日本軍の攻撃を阻止することに成功した。
conquest_event_desc_39=ミッドウェー海域で日米海軍が大規模な海戦を繰り広げた末、日本海軍は敗走した。
conquest_event_desc_40=スターリングラードでのドイツ軍とソ連赤軍の激戦は、双方に数百万人の死傷者を出し、ソ連とドイツのパワーバランス全体の根本的な変化をもたらした。
conquest_event_desc_41=ノルウェーの重水工場は連合軍の空挺部隊によって急襲され、ドイツの核兵器製造計画を完全に破壊した。
conquest_event_desc_42=モンゴメリー指揮下の英連邦軍は、石油と物資に乏しい独伊連合軍をエル・アラメイン地区で撃破した。
conquest_event_desc_43=西アフリカと北アフリカの主要港に上陸し、エジプトでドイツ軍と対峙するイギリス軍を支援することで、アメリカ軍は北アフリカに第二戦線を開き、ドイツ軍を分散した。
conquest_event_desc_44=戦争による労働力不足を補うために大量のメキシコ人が米国に入国したことで、メキシコの国民所得は増加し、米国には重要な鉱物が大量に供給された。
conquest_event_desc_45=米国は善隣政策を提唱してラテンアメリカ諸国との関係を改善し、ラテンアメリカ諸国は連合軍に参加。米国との良好な関係を維持するようになった。
conquest_event_desc_46=連合国海軍は、ガダルカナルとその周辺の島々で日本海軍と激しい戦闘を繰り広げた。
conquest_event_desc_47=オーストラリア軍とアメリカ軍は、パプアニューギニアのココダ道のジャングルと山岳地帯という極めて過酷な状況下で、日本軍の侵攻を食い止め、撤退に追い込むことに成功した。
conquest_event_desc_48=ドイツ軍とソ連赤軍は、クルスクでの大規模な戦車戦に大量の機甲部隊を投入した。
conquest_event_desc_49=アメリカの諜報機関は日本の通信暗号を解読し、太平洋上で山本五十六の飛行機を待ち伏せすることに成功し、日本の海軍指揮系統を弱体化させた。
conquest_event_desc_50=連合軍が地中海のシチリア島に上陸を開始した。この戦いは地中海戦線の情勢を大きく変え、イタリアの降伏とドイツへの宣戦布告までのカウントダウンを加速させる。
conquest_event_desc_51=米英中はカイロ会議で声明を発表し、日本が無条件降伏するまで戦争を継続するという三ヵ国の合意を確認した。
conquest_event_desc_52=米英ソはテヘランで首脳会談を開き、欧州における連合軍の対独戦略的展開や戦後の国際秩序について協議した。
conquest_event_desc_53=フランスのノルマンディー地方における空・海・陸の連合軍による大規模な上陸作戦は、ヨーロッパ戦線における連合軍の反攻の幕開けとなった。
conquest_event_desc_54=モントゴメリー率いる連合軍の空挺部隊は、オランダに駐留するドイツ軍を攻撃したが、天候、情報の誤り、ドイツ軍の激しい抵抗などにより、作戦は思うように成功しなかった。
conquest_event_desc_55=アメリカはアイランドホッピングを駆使し、多くの重要な戦略拠点に基地を設置することで、最終的に日本本土に迫った。
conquest_event_desc_56=日米両海軍はフィリピン海域で激戦を繰り広げ、日本軍は飛行機の数と性能の後進性、精鋭パイロットの減少から大量に撃墜され、米軍は「マリアナの七面鳥撃ち」と呼んだ。
conquest_event_desc_57=多くのドイツ軍将校や政治家が首相暗殺を企て、爆発を起こしたにもかかわらず、目的は達成されなかった。
conquest_event_desc_58=アメリカとオーストラリアの連合軍が、フィリピンのレイテ湾で日本と激しい海戦を繰り広げる。連合軍は日本海軍の衰退を示す戦いで日本連合艦隊を撃破した。
conquest_event_desc_59=海峡を渡ってロンドンを爆撃したドイツのV-2ロケットは、世界で初めて実戦配備された弾道ミサイルであり、物的被害は軽微であったが、英国社会に大きな衝撃を与えた。
conquest_event_desc_60=ドイツ軍は英米連合軍の戦線を突破する目的で、アルデンヌ地方に突如攻勢をかけた。連合軍は当初大きな損害を受けたが、最終的にはドイツの攻撃を退けることに成功した。
conquest_event_desc_61=ブルガリアは初期に枢軸陣営への参加を選択したが、戦況が変化するにつれて連合国側に鞍替えし、国の安全と安定を可能な限り維持した。
conquest_event_desc_62=ソ連軍はドイツとハンガリーの連合軍が守るブダペストを包囲したが、激しい抵抗に遭った。
conquest_event_desc_63=ソ連赤軍がウィーンに進攻し、駐留ドイツ軍と激戦を繰り広げる。この攻勢により、ソ連はドイツに深く進軍した。
conquest_event_desc_64=米ソ英はヤルタで三ヵ国首脳会議を開催し、第二次世界大戦後のヨーロッパの復興と世界体制の取り決めについて協議した。
conquest_event_desc_65=ソ連赤軍はドイツの首都ベルリンに大規模な総攻撃を開始した。
conquest_event_desc_66=米国、英国、中国は共同声明を発表し、日本が無条件降伏しなければ直ちに「迅速かつ完全な破壊」に直面することを要求した。
conquest_event_desc_67=米国が秘密のうちに開始した巨大計画は、世界初の原子爆弾を開発するために世界最高の科学者と技術者を結集し、アラモゴード砂漠で原爆実験に成功した。
conquest_event_desc_68=米国は広島と長崎に相次いで原爆を投下し、数十万人を殺害し、日本に無条件降伏を宣言させた。

event_stage_intro_20301=日本軍の無線通信暗号は一部解読されており、敵はミッドウェー海域で待ち伏せを仕掛けて主力空母部隊を排除しようとしている。現在、ヨークタウンは緊急修理を終え、ミッドウェーの航空兵力も補充された。準備は万全であり、あとは連合艦隊の到着を待つのみだ。
event_stage_intro_20302=連合艦隊はミッドウェー海戦の後失われていた。敵はソロモン諸島地域の防衛を固めるため、グアとトゥラギに飛行場を建設し始めた。これらの拠点を占領すれば、反撃の要衝を確保し、周辺海域の制海権を取り戻すことができるだろう。
event_stage_intro_20303=ニューギニアの日本軍は空母の支援を失い、進撃が鈍化した。監視塔作戦はまた、敵にソロモン諸島方面への兵力分割を開始させることに成功した。いよいよ反撃の時が来た。ココダ道から始め、新日本軍の陸上部隊をニューギニアから追い出すのだ。
event_stage_intro_20304=攻撃の中心はニューギニアからフィリピン諸島に移ったが、中部太平洋の日本軍基地は常に大きな脅威である。マリアナ諸島を占領してフィリピン諸島攻撃の基軸を確保し、後の日本本土砲撃に備えよ。
event_stage_intro_20305=日本の太平洋防衛網は次々と破られ、連合艦隊はフィリピン海で大敗を喫した。西太平洋全域の海と空の優位は、我々の手にしっかりと握られている。機は熟した。今こそフィリピンに戻る時である！
event_stage_intro_20306=硫黄島での日本の大虐殺は、我々を止めることはできない。沖縄はより複雑で、より多くの守備兵がいるだろう。しかし、敵も同様に、本土からの援軍は来ないだろう。一歩一歩、慎重に進もう。
event_stage_intro_20307=日本は核攻撃を受けたにもかかわらず、降伏を拒否した。司令部はダウンフォール作戦決行し、日本本土に上陸して戦うことを決定。ソ連軍も北方同時攻撃で我々に協力する。これは我々の最後の戦いであり、勝利はすべての連合軍兵士の手中にある！
event_stage_intro_20311=日本軍の無線通信暗号は一部解読されており、敵はミッドウェー海域で待ち伏せを仕掛けて主力空母部隊を排除しようとしている。現在、ヨークタウンは緊急修理を終え、ミッドウェーの航空兵力も補充された。準備は万全であり、あとは連合艦隊の到着を待つのみだ。
event_stage_intro_20312=連合艦隊はミッドウェー海戦の後失われていた。敵はソロモン諸島地域の防衛を固めるため、グアとトゥラギに飛行場を建設し始めた。これらの拠点を占領すれば、反撃の要衝を確保し、周辺海域の制海権を取り戻すことができるだろう。
event_stage_intro_20313=ニューギニアの日本軍は空母の支援を失い、進撃が鈍化した。監視塔作戦はまた、敵にソロモン諸島方面への兵力分割を開始させることに成功した。いよいよ反撃の時が来た。ココダ道から始め、新日本軍の陸上部隊をニューギニアから追い出すのだ。
