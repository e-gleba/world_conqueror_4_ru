armygroup_event_desc_123=ソ連軍はベーリング海峡北部においていち早く氷幕を突破し、アラスカに上陸してノームを占領した。これにより、米ソは再び全面戦争へと突入したのである。
armygroup_event_desc_124=アメリカ、イギリス、フランスを中心とする北大西洋条約機構軍は、再び朝鮮に対する攻勢を開始し、日本および韓国の支援を受けながら北上した。朝鮮人民軍は頑強に抵抗し、ソ連軍も極東地域へ継続的に兵力を増派することで、戦線をソ連港一帯に維持した。
armygroup_event_desc_125=黒蠍は、極東およびアラスカに潜伏していた部隊を動かし、好機と見て作戦を開始した。各地で育成してきた武装勢力と連携し、各国軍の後方に対して相次いで奇襲を敢行したのである。
armygroup_event_desc_126=アメリカ、イギリス、オーストラリア、ソ連の多国籍海軍が黒蠍艦隊を追撃する中、ベーリング海中部で激しい電磁嵐に遭遇し、これまで未確認であった高度な施設を備える島が出現した。同時に、太平洋における黒蠍の本部は各国艦隊による包囲攻撃を受けることとなった。
armygroup_event_desc_127=アメリカ、イギリス、オーストラリア、ソ連の特遣部隊は、ベーリング海海域各地に展開する黒蠍の拠点に対し、海空一体の立体攻撃を連続して実施した。その結果、黒蠍が築いていた複数の要塞拠点は次々と破壊されたのである。
armygroup_event_desc_128=黒蠍寒霜軍団の指揮体系が完全に破壊され、補給網も遮断された結果、極地志願兵団は大規模な軍備支援を喪失した。戦闘継続は不可能と判断され、同兵団は降伏を選択し、ワルシャワ条約機構へ再編・復帰するに至った。
armygroup_event_desc_129=黒蠍永夜軍団の指揮体系が破壊されたことで、北境自由同盟の内部に深刻な混乱が発生し、多数の兵士が潰走した。統制を失った部隊は戦闘継続を断念して降伏し、最終的に北大西洋条約機構へ再編・復帰するに至った。
armygroup_event_desc_130=黒蠍暗潮軍団の指揮体系が破壊されたことを受け、太平洋解放戦線は多国籍部隊による包囲下に置かれた。戦線の維持は不可能と判断され、同部隊は降伏を選択し、最終的に北大西洋条約機構へ再編・復帰するに至った。
armygroup_event_desc_131=黒蠍勢力は再び急速に拡大・強化され、これを根絶するため、アメリカとソ連は協力に踏み切る決断を下した。ワルシャワ条約機構と北大西洋条約機構は一時的に停戦し、共通の脅威に対抗するための新たな軍事同盟を結成するに至った。
armygroup_event_desc_132=オズボーンは完全に敗北し、極東地域における黒蠍の計画は徹底的に挫折した。しかし、各地にはなお黒蠍の残存勢力が点在しており、周辺諸国および地域に対する恒常的な脅威となり続けている。
armygroup_event_desc_133=ソ連のパイロットが最先端の戦闘機を操縦して離反し、日本に着陸した。これを受けてアメリカは当該パイロットに政治亡命を認め、米日両国の技術者は当該機体を分解して詳細な分析を実施した。
armygroup_event_desc_134=シベリアのヤクート地域では正午頃、空が突如として暗転し、その状態が約三時間にわたって続いた。大規模な森林火災によって発生した濃密な煙塵が東方へ漂流し、周辺で作戦行動中の部隊に深刻な影響を及ぼした。
armygroup_event_desc_135=アラスカが侵攻を受けた後、アメリカ軍とカナダ軍は大規模な反攻作戦を組織した。アンカレジ北部では複数勢力が入り乱れて激戦を繰り広げ、ソ連軍の攻勢の主軸は大きく削がれることとなった。
armygroup_event_desc_136=黒蠍組織の支援を受けた北境自由同盟は、フェアバンクスの空軍基地とアンカレジの港湾を同時に攻撃した。ソ連軍が正面から攻勢をかける隙を突き、アメリカ軍の後方を奇襲することで、アラスカの主導権を先んじて掌握しようとしたのである。
armygroup_event_desc_137=ツングース川付近で再び激しい爆発が発生し、隕石の空中爆発によって広範な森林が破壊された。事案発生後数日間にわたり、アジアおよびヨーロッパの夜空は暗赤色に染まり、多数の国の人工衛星がこの現象を記録した。
armygroup_event_desc_138=イギリスおよびフランスの特殊部隊で編成された合同特遣部隊は、千島列島において黒蠍組織の秘密通信中継施設を捜索・破壊した。この作戦により、黒蠍暗潮軍団と太平洋解放戦線との間の通信は一時的に遮断されることとなった。
armygroup_event_desc_139=米ソ両国の海軍は、ベーリング海峡のセントローレンス島周辺海域において大規模な海空戦を展開し、双方ともに大量の戦闘機および爆撃機を投入する激戦となった。
armygroup_event_desc_140=戦争が膠着状態に陥るにつれ、米ソ両国では国内の粛清運動が一段と苛烈化した。相手国が送り込んだスパイや、黒蠍に浸透された疑いのある部隊を排除する目的で行われたこれらの動きは、多数の冤罪を生み出す結果となった。
armygroup_event_desc_141=核弾頭を搭載したソ連の潜水艦一隻が、ベーリング海戦区への出動命令を受けて航行中、突如として通信を遮断し、黒蠍が支配する「幽霊島」方面へ進路を取った。
armygroup_event_desc_142=黒蠍暗潮軍団は札幌から撤退する直前、現地の原子力発電所を破壊した。大量の放射性汚染水が海へ流出し、周辺海域では海洋生物の大規模な死滅が発生した。その影響により、複数の港湾が長期にわたり閉鎖される事態となった。
armygroup_event_desc_143=同盟国の支援を受け、ソ連軍はマガダン地区において極地志願兵団が掌握していた戦略ミサイル基地へ猛攻を加えた。この作戦は激しい市街戦へと発展し、極めて苛烈な戦闘が繰り広げられた。
armygroup_event_desc_144=太平洋解放戦線は、札幌南部および函館周辺において協同攻撃を実施し、これにより北海道と日本本州との連絡線を断つことに成功した。
armygroup_event_desc_145=アメリカ軍顧問の支援を受けた韓国軍は、タタール海峡西岸に位置するソ連極東の重要港湾、ソ連港に対して奇襲を敢行した。
armygroup_event_desc_146=カムチャツカ半島各地で複数の活火山が同時に噴火し、氷河の下から溶岩が次々と噴出した。この自然災害により、各勢力の軍事配置は大きく混乱することとなった。
armygroup_event_desc_147=アラスカ湾およびベーリング海南部海域で同時に地震が発生し、それに伴う津波がアラスカ南部の沿岸地域を襲った。この災害により、多数の軍事施設や軍用装備が破壊される甚大な被害が生じた。
armygroup_event_desc_148=フェアバンクス上空で異常なオーロラが出現し、その影響範囲内では、戦闘機の火器管制レーダーを含むすべての電子機器が一時的に機能不全に陥った。
armygroup_event_desc_149=異常な寒波がチュクチ沿岸を席巻し、周辺地域の気温は急激に低下した。各勢力の軍隊は悪天候への緊急対処を余儀なくされたが、それでもなお人員および装備に一定の損失を被る結果となった。
armygroup_event_desc_150=ソ連のミサイルおよび戦略爆撃機による脅威に対応するため、アメリカとカナダはアラスカからカナダ内陸部に至る長距離早期警戒システムを統合・近代化し、緊密な北米防空同盟を構築した。これにより、両国の共同防衛能力は大幅に強化されることとなった。
armygroup_event_desc_151=膨大な軍事需要は、電子工学、計算機、航空宇宙といった分野における技術の爆発的発展を促した。これらの技術はカリフォルニアなどの工業団地を中心に急速な民生転用を遂げ、アメリカは新たな技術競争および経済競争において先手を取ることとなった。
armygroup_event_desc_152=ソ連は経済相互援助委員会の枠組みを通じて、モンゴルや朝鮮などの同盟国に対し、経済援助、エネルギー供給、市場へのアクセスを提供した。これにより、社会主義陣営内部の経済的結び付きと安定は維持されることとなった。


event_4114=ゾネンブルーメ作戦
event_4115=第三次ハリコフ攻防
event_4116=春季攻勢
event_4117=マタパン岬沖海戦
event_4118=坊ノ岬沖海戦
event_4119=ホーランジアの戦い

event_intro_4114=イタリア軍が北アフリカ戦線でイギリス軍に対して相次いで敗退したことを受け、ドイツ国防軍最高司令部は2月6日、戦局の安定化を目的に介入を決定した。その後数か月にわたり、ドイツ軍部隊（のちにアフリカ軍団として再編）が相次いで北アフリカに到着し、イタリア軍の崩壊的状況を一挙に覆した。ロンメルの攻勢判断は大きな成功を収めたが、過度に延伸した補給線は、やがて長期にわたる消耗戦の伏線となったのである。
event_intro_4115=スターリングラード戦で勝利を収めた後、ソ連軍はその勢いに乗って追撃に転じた。マンシュタインは正面防御を放棄し、まず装甲戦力を集中して突出してきたソ連軍南西方面軍を各個撃破し、その後転進して北上、激しい市街戦の末にハリコフを奪回した。一連の作戦は1943年2月19日に開始され、ソ連軍は甚大な損害を被ったものの、東部戦線全体における劣勢を覆すには至らなかった。この戦いの結果形成された「クルスク突出部」は、数か月後に前例のない規模で行われるクルスク会戦へと直結することとなった。
event_intro_4116=1941年3月、ギリシャ・イタリア戦争が膠着状態に陥る中、士気の高揚とイタリア占領下のアルバニア地域からギリシャ軍を排除することを目的として、イタリアの独裁者は3月9日、自ら「春季攻勢」の発動を命じた。この作戦において、イタリア軍は前線で十万発を超える砲弾を発射し、累計で一万人以上の死傷者を出したものの、いかなる戦略的突破も達成できなかった。攻勢の失敗は、ドイツがバルカン戦局に介入せざるを得ない状況を招き、結果としてギリシャ・イタリア戦争の趨勢を根本的に変えることとなった。
event_intro_4117=1941年3月末、イギリスの情報機関は初めてイタリア海軍が使用していたエニグマ暗号の解読に成功し、同艦隊の行動を把握するに至った。3月27日、イギリス海軍はこの情報に基づき、マタパン岬付近の海域で迎撃作戦を実施し、複数のイタリア艦艇を撃沈するとともに、イタリア艦隊を東地中海の制海権から完全に排除した。
event_intro_4118=沖縄戦の最中、連合軍の海空戦力を引き付けて神風特攻隊の成功機会を高めるため、連合艦隊は大和を旗艦とする特攻艦隊を編成し、沖縄海域への突入を企図した。同艦を座礁させて固定砲台として防御を支援し、事実上の自殺的攻撃を行う計画であったが、最終的に大和は米軍の数百機に及ぶ艦載機による多波次の空襲を受けて撃沈された。この戦いは、日本海軍主力艦隊の完全な壊滅を象徴するものであり、連合艦隊はほぼ戦闘能力を喪失した。
event_intro_4119=日本軍が築いたニューギニアの防衛線を突破するため、アメリカ軍は1944年4月22日に上陸作戦を開始した。戦術的欺瞞と圧倒的な海空火力による事前準備の下、米軍は上陸に成功すると同時に空港と港湾を迅速に制圧し、日本軍の増援線を遮断して敵部隊を分断・包囲した。この戦いはアイランドホッピング戦術の成功例として知られ、ニューギニア東部に展開していた日本軍の大兵力を回避しつつ、比較的小さな犠牲で戦略目標を達成することに成功したのである。


dialogue_4312=攻勢を継続せよ。イギリス軍はもはや迅速に有効な反撃を組織する余力を失っている。
dialogue_4313=ソ連軍の側翼は過度に延伸している。直ちに攻勢を開始し、敵の補給線を遮断してハリコフを包囲せよ。
dialogue_4314=ドイツ軍の攻勢は異常なほど激烈だ。我が軍はハリコフ方面でこれ以上持ちこたえることができない。ひとまず東方へ撤退せよ。
dialogue_4315=日本艦隊が沖縄へ向けて進撃している。直ちに航空戦力を出動させて敵を阻止せよ。その他の艦艇は海上迎撃の準備を整えよ。
dialogue_4316=戦艦大和は撃沈された。日本軍艦艇は現在、撤退を開始している。
dialogue_4317=我が方は圧倒的な海空優勢を確保し、日本軍の防御体制はほぼ崩壊している。直ちに上陸を開始するのだ。


skill_name_176=マレスライン
skill_name_177=星墜
skill_name_178=天羅地網
skill_name_179=体系的作戦


skill_info_176=山地または砂漠地形にいる場合、自身および周囲1マス以内の友軍が受けるダメージが[#00FF00#%d%%]減少。陸上部隊を指揮している間、「流言」スキルの発動確率が25%%上昇。ターン終了時、自身の周囲2マス以内に士気低下または混乱状態の敵軍が存在する場合、自身および周囲1マス以内の友軍は最大HPの10%%を回復。
skill_info_177=部隊を指揮して攻撃する際、[#00FF00#%d%%]の確率で目標にⅡ級衛星攻撃を1回発動。空中悬停部隊を指揮している場合、今回の衛星攻撃の与えるダメージがさらに30%%増加。
skill_info_178=指揮している部隊の周囲3マス以内にいる敵軍の防御力が[#00FF00#%d%%]低下。さらに核弾頭、衛星攻撃、ドローン戦術爆破によって受けるダメージが20%%増加。
skill_info_179=部隊を指揮して攻撃および空襲を行う際、[#00FF00#%d%%]の確率で会心の一撃を与える。


dialogue_4318=信じがたいことだが、イタリア人は本当に元首を説得してしまった。今回は決して同じ轍を踏むわけにはいかない。
dialogue_4319=爆撃は終了し、第一陣の空挺部隊はすでに所定位置に展開を完了した。作戦の成功を祈る。
dialogue_4320=敵襲だ！直ちに全待機部隊へ通達し、戦闘態勢に入れ。何としても飛行場を死守せよ！王立海軍に連絡し、マルタへの迅速な支援を要請せよ！
dialogue_4321=王立海軍の艦砲火力で上陸部隊を支援し、掩護せよ。
dialogue_4322=第二陣の空挺部隊は配置に就いた。速やかにバレッタを攻略せよ！
dialogue_4323=バレッタを制圧した。これで、マルタは我らのものだ！
dialogue_4324=北西角へ撤退せよ。王立海軍が我々の離脱を支援する！
dialogue_4325=飛行場を奪還せよ。必ず航空部隊が支障なく離陸できるよう確保するのだ。
dialogue_4326=南部部隊こそが敵を撃破する主力だ。必ず南部部隊に敵防衛線を突破させよ。
dialogue_4327=敵は想定どおり南部から攻勢をかけてきた。各部隊は計画に従って行動せよ。陣地に依拠し、敵の進攻を撃退せよ。
dialogue_4328=イギリス軍陣地の制圧に成功した。装甲部隊の前進を支援し、引き続き進撃せよ。
dialogue_4329=長官、前線部隊より、燃料が攻勢を維持するには不足しているとの報告が入りました。
dialogue_4330=あと一歩のところだった！前線部隊に通達せよ。攻勢を停止し、戦線を維持したまま、補給が整うのを待て。
dialogue_4331=敵の燃料は間もなく枯渇する。反撃の好機が訪れた。全軍出撃し、我らの陣地を奪還せよ！
dialogue_4332=イタリアの精鋭として、この要衝を必ず守り抜かねばならない。盟友に笑われるようなことがあってはならぬ。
dialogue_4333=デル・ムナシブの高地は今後の作戦にとって極めて重要だ。戦士たちよ、あの陣地を奪取せよ！
dialogue_4334=イタリア軍の火力はなぜこれほど激しいのだ！装甲部隊は直ちに支援に向かい、砲火で敵の反撃を押さえ込め！
dialogue_4335=敵軍の抵抗はきわめて頑強だ。この陣地を支点として火力による圧制を維持しつつ、引き続き他の陣地を奪取せよ。
dialogue_4336=陣地を奪回するため、電撃師団は後方へ支援要請の電報を送った。
dialogue_4337=デル・ムナシブ陣地が危機に陥っている。装甲部隊は直ちに支援に向かえ！
dialogue_4338=ロンメルは現在、病気療養のため離脱している。今こそ奇襲の絶好機だ。出撃だ、この一戦で必ずや奴らを打ち破る！
dialogue_4339=敵襲だ！全軍ただちに戦闘態勢に入れ。決して敵に陣地突破を許すな！
dialogue_4340=前線陣地の占領に成功した。この陣地を足場として、引き続き前進せよ。
dialogue_4341=失陥した陣地に砲火を集中するのだ！砲撃終了次第、直ちに奪還を試みよ！
dialogue_4342=砲兵部隊は速やかに戦場に投入され、前線陣地の圧力を緩和せよ。
dialogue_4343=敵の陣地は極めて堅固だ。砲兵支援を要請する！
dialogue_4344=ロンメルが復帰し、北部戦区の戦況は改善されつつある。陣線を堅守せよ。転機は目前に迫っている。
dialogue_4345=敵軍は部隊を集中させつつある。我らが先んじて攻勢に出なければ、マレスラインを守り抜くことはできない。
dialogue_4346=マレスラインを踏み出し、可能な限り多くの連合軍部隊を殲滅せよ。
dialogue_4347=情報部門より通報あり：敵は間もなく攻勢を開始する見込みだ。戦闘準備を整えよ！
dialogue_4348=よし！陣地を死守し、可能な限り友軍のために攻勢の突破口を切り開け。
dialogue_4349=南部の第一防衛線が崩壊した。予備隊を投入せよ。敵を決してメドニンへ侵入させるな。
dialogue_4350=装甲部隊の損害があまりにも大きい。このままではマレスラインの防衛に必要な戦力が不足する。直ちに撤退だ。
dialogue_4351=前線部隊は戦線を安定させよ。後備隊を投入し、メドニンを奪還せよ！
dialogue_4352=イギリス軍がエンフィダヴィル防衛線の重要な制高点を占拠した。直ちに奪還せよ。この防衛線を決して崩壊させてはならない。
dialogue_4353=敵がタクルナ高地を奪回した。後方からの支援を要請する。
dialogue_4354=よし、支援がようやく到着したか！ほかに増援は？ないのか？どうやら残るは我々だけのようだな。
dialogue_4355=砲兵部隊は山頂を照準に砲撃を開始し、敵に山頂陣地を放棄させろ。砲撃終了次第、速やかに高地を奪還せよ。
dialogue_4356=ドイツ軍の陣地が陥落し、タクルナ高地における防衛圧力が増大している。
dialogue_4357=最善は尽くしている。持ちこたえ続けろ、ほかの援軍が支援に駆け付けるかもしれない。
dialogue_4358=攻撃！敵にこれ以上の増援はない。高地を奪取すれば、エンフィダヴィル防衛線はもはや形骸化する！
dialogue_4359=戦士たちよ、指導者は我らのために十分な戦備を整えてくれた。その導きのもと、この戦いで必ずや勝利を掴み取るのだ！
dialogue_4360=攻勢を継続せよ。火力をさらに集中し、必ずや731号高地を奪取するのだ！
dialogue_4361=くそっ、ギリシャ軍は鉄でできているのか？これほどの砲弾を浴びせられてなお、逆襲に出てくるとは！
dialogue_4362=情報で確認されていたイタリア艦隊を発見した。戦闘準備を整え、一気に殲滅を狙え！
dialogue_4363=イギリス軍の巡洋艦部隊を発見した。巡洋艦の攻撃で敵艦を誘導し、戦艦に接近させて主砲火力で一気に殲滅するぞ！
dialogue_4364=速やかに撤退せよ。これ以上、我が艦隊に損害を出すわけにはいかない。

dialogue_4365=両地点の部隊はいずれも上陸を完了した。速やかに内陸へ進撃し、飛行場周辺の日本軍を掃討せよ。

legend_intro_60101=第185空挺師団は、空挺作戦の実施を目的としてイタリアが特別に編成した部隊である。創設当初、本師団は「C3作戦」に向けた準備・演習を重ね、ドイツ軍と協同して空挺降下を行い、マルタ島を奪取する計画が立てられていた。しかし、クレタ島上陸作戦における甚大な損害を受け、1942年7月に予定されていた同作戦は上層部によって延期された。その後、同年11月11日にトブルクが陥落すると、「C3作戦」は最終的に中止となった。この時点で第185空挺師団はすでに7月に北アフリカ戦線へ転用されており、以後、空挺作戦に投入される機会を再び得ることはなかった。
legend_intro_60102=1942年7月、第185空挺師団は北アフリカの砂漠戦線へと転用された。本来であれば天際を裂く電光のごとく空挺奇襲に投入されるはずだったこの精鋭部隊は、果てしない黄砂の中で戦功を立てることを求められたのである。8月29日、「電撃師団」と称された同師団は北アフリカでの初陣を迎えた。アラム・エル・ハルファの戦いにおいて、同師団はドイツ軍装甲部隊の側面を掩護し、連続して複数の高地を攻略、連合軍防衛線の内部に強固な橋頭堡を築き上げた。続く連合軍の「ベレスフォード作戦」では、陣地奪還を企図する敵部隊を撃退し、その高い練度と戦闘力を鮮明に示したのである。
legend_intro_60103=1942年9月29日、来る第二次エル・アラメイン会戦に備えて有利な地形を確保するため、連合軍は「ブラガンサ作戦」を発動し、第185「電撃師団（第185空挺師団）」が守備する陣地の攻略を図った。連合軍装甲部隊の攻撃に対し、電撃師団は周到に構築された塹壕体系と機動的な戦術配置を活用し、軽歩兵と限られた砲兵火力のみをもって敵の装甲攻勢を撃退することに成功し、その卓越した防御戦闘能力を示したのである。
legend_intro_60104=1942年10月23日、第二次エル・アラメイン会戦が正式に開幕した。第185「電撃師団（第185空挺師団）」は戦線南部の死守を命じられ、英軍第13軍（名高い「砂漠の鼠」第7装甲師団などを擁する部隊）による激しい攻勢を受けることとなった。四日三夜に及ぶ熾烈な防御戦の末、同師団は陣地を堅持し、モントゴメリーに南部突破の企図を断念させ、主攻方向の修正を余儀なくさせた。しかし、局地的防御で顕著な戦術的粘り強さを示した一方、戦局全体の急速な悪化には抗しきれず、電撃師団は最終的に枢軸軍とともに後退を開始し、その撤退過程で多大な損害を被る結果となった。
legend_intro_60105=エル・アラメイン会戦後、残存する第185「電撃師団（第185空挺師団）」はマレスラインへと転用され、連合軍の進撃を阻止する任務を担った。英第8軍による同防衛線への攻勢準備を遅延させるため、枢軸軍は1943年3月、「カプリ作戦」を発動し、メドニン地区に集結中の英軍に対して攻撃を開始した。この戦いにおいて、電撃師団は突撃部隊として投入され、英軍陣地の一部への浸透および占拠に成功した。しかし、作戦情報が事前に漏洩していたため、枢軸軍の攻勢は各地で失敗に終わり、電撃師団も局地的な突破を果たしたものの、後続支援を得られず、最終的には撤退を余儀なくされた。
legend_intro_60106=チュニジア戦線の最終局面において、枢軸軍は連続防衛線へ後退し、最後の抵抗を続けていた。1943年4月20日、エンフィダヴィル防衛線上のタクルナ高地は連合軍に占領された。防衛線を安定させ、連合軍の進撃を遅滞させるため、枢軸軍司令部は第185「電撃師団（第185空挺師団）」の残存部隊に反撃を命じ、高地の奪還と敵攻勢の拘束を任務とした。この最後の空挺部隊は支援に乏しい状況下でタクルナ高地の奪回に成功し、その後も一昼夜にわたり陣地を死守したが、弾薬が尽きた時点でやむなく武器を置くこととなった。かくして、本来は天空からの突撃に投入されるはずだったこの精鋭部隊は、一連の誤った戦いの果てに、北アフリカの黄砂の中へと消えていったのである。

