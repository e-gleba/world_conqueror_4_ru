elite_intro_86=RT-2PM2大陸間弾道ミサイルは、ソ連で設計されたRT-2PMを基にさらに開発された新型ICBMである。3段階の固体燃料ロケットによる強大な推力で、飛行速度は20マッハ以上に達し、ロシアからの発射でアメリカ本土を射程に収めることができる。また、大型輸送車両によって移動が可能で、機動性が高い。
elite_intro_87=アーレイ・バーク級ミサイル駆逐艦は、アメリカ海軍の新型駆逐艦であり、現在でも世界で最も強力な駆逐艦の一つである。船体に縦列でMk 41垂直発射システムを搭載し、中距離ミサイルやトマホーク巡航ミサイルの発射が可能で、多数の目標に同時対応できる能力を持つ。対テロ戦争や第2次湾岸戦争において、多数の護衛任務を優れた成果で遂行した。


