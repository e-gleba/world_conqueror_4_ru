help_conquest_desc_6=挑戦征服では、操作する国の国家技術をアップグレードすることができます。国家技術を開放するためには対応する技術レベルに到達する必要があります。しかし、国より初期技術レベルや技術上限には若干の違いがあるので、ご注意下さい。
help_conquest_desc_7=挑戦征服には外交モードがあります。 指揮官は同陣営の国や中立国に宣戦布告したり、一部の敵対国を招降させることができます。 初期都市数と兵力数を比較した既存の都市数と兵力数が国の忠誠度に影響し、都市数、兵力数、対象国の忠誠度の組み合わせが勧誘と招降の成功率に影響します。 招降を行うには、対象国と国境が隣接し、20ターン経過する必要があります。
help_conquest_desc_8=挑戦征服の中で、指揮官はさまざまな歴史事件に遭遇します。これらの事件は、特定の国に対してプラスまたはマイナスの影響をもたらす可能性があります。

induce_info_1=この国は招降できません
induce_info_2=招降するには、その国と国境が隣接している必要があります。

