feat_desc_66_Lv3=このターン、装甲ユニットへのダメージ+{1}%、クールダウン2ターン。
feat_desc_67_Lv4=反撃ダメージ+{1}%
feat_desc_68_Lv4=攻撃後に目標を殲滅すると、{0}%の確率で再行動可能、最大{2}回まで。
