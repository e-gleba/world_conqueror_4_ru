event_471=ナルヴァの戦い

event_intro_455=この戦いは「日本軍によるグアムの占領」とも呼ばれる。1941年12月8日、真珠湾攻撃の翌日、日本軍はグアムを奇襲した。全く備えていなかったグアムの守備隊は、日本軍に迅速に撃破された。12月10日、グアムの守備隊は抵抗を断念し、日本軍がグアムの支配権を獲得した。
event_intro_456=包囲された第6軍を救援するため、1942年12月12日、ドイツ軍第4装甲軍はスターリングラードへの突撃を開始した。この攻勢は赤軍の不意を突き、初日には顕著な進展を遂げた。しかし、ソ連軍の「小土星作戦」の開始とスターリングラード周辺での積極的な防御により、ドイツ軍は進撃を続けることができなくなり、第6軍の救出を断念せざるを得なかった。
event_intro_457=「バルジの戦い」、または「アルデンヌの戦い」は、1944年12月16日から1945年1月25日にかけて行われた戦闘で、第二次世界大戦末期にドイツ軍がベルギーのアルデンヌ地域で発動した攻勢である。この作戦は、英米連合軍の戦線を突破してアントウェルペンを再占領することを目的としていた。戦闘初期にはドイツ軍が一定の成果を上げ、アメリカ軍の駐留部隊に大打撃を与えたが、物資不足によりこれ以上の進軍が困難となり、連合軍は態勢を立て直して反撃を開始した。最終的にドイツ軍は大損害を受け、生存部隊はジークフリート線およびライン川まで撤退した。
event_intro_458=バストーニュの戦いは、1944年12月20日から27日にかけてベルギーの小さな町バストーニュでアメリカ軍とドイツ軍の間で行われた戦闘であり、バルジの戦いの一部でもある。アルデンヌ山地を貫く7本の主要道路がバストーニュを通過するため、ドイツ軍は部隊が安全にアルデンヌを通過できるよう、駐留するアメリカ軍を包囲し、町を占領しようとした。アメリカ軍は激しく抵抗し続け、バストーニュの支配権を保持した。最終的にジョージ・パットンの第3軍によって包囲が解かれ、アメリカ軍が勝利を収めた。
event_intro_459=ウクライナとモルダヴィアの解放を目指して、1943年12月24日、ソ連軍はドニエプル・カルパチア山脈攻勢を開始した。この戦いで、ソ連軍はウクライナの大部分とモルダヴィア全土を奪還し、ドイツ南方軍集団を撃破して、前線をポーランドからルーマニアにかけて大きく押し上げた。
event_intro_460=北岬沖海戦は1943年12月26日にノルウェーの北岬沖で行われた戦闘である。この戦闘で、ドイツ海軍の艦艇部隊は、ソ連へ戦争物資を輸送する西側連合国の船団を捜索し攻撃しようと試みたが、情報の漏洩により準備万端のイギリス海軍と遭遇した。結果として、ドイツの戦艦シャルンホルストが撃沈された。この戦い以降、ドイツは大型戦艦を派遣して連合軍の北方航路を襲撃する能力を失い、北方航路は戦争が終結するまで比較的安全となった。
event_intro_461=1944年12月26日、ソ連軍はブダペストの包囲を完了し、守備軍に降伏を促し始めた。12月29日、降伏交渉は決裂し、交渉にあたったソ連軍の使者はドイツ軍に殺害された。ソ連軍は遺体を埋葬した後、攻撃を開始し、これによりブダペスト包囲戦が本格的に始まった。ソ連軍は50日間にわたりブダペストを包囲し、特に武装親衛隊を含むドイツ国防軍の資源を消耗させた。最終的にブダペストを攻略し、東部戦線はベルリンにさらに近づいた。
event_intro_462=バルジの戦いによって連合軍の大部隊が北方へ移動したため、ドイツ軍は防衛が手薄になったアルザス地域への攻撃を計画し、連合軍の戦力を削ぐことを目指した。1945年1月1日、ドイツ軍はストラスブールに向けて攻勢を開始した。連合軍は兵力で劣勢となり後退を余儀なくされたが、最終的にストラスブールの防衛に成功した。攻勢終了後、ドイツ軍はアルザスの約40%を占領し、西部戦線を短縮したものの、連合軍の戦力を大幅に削ぐという目的は達成できなかった。
event_intro_463=1941年12月、日本軍はルソン島に侵攻を開始。不十分な初期防御のため、日本軍は海岸線の防衛線を突破し、アメリカ軍とフィリピン守備隊をバターン半島に撤退させ、最後の抵抗を強いる形となった。1942年1月7日、日本軍はバターン半島への包囲攻撃を開始。補給不足の中で守備隊は後退を続け、最高司令官のマッカーサーはフィリピンを離れることとなった。最終的に、3か月間の抵抗を経て、1942年4月9日に残存の守備隊が日本軍に降伏し、バターン半島の戦いは終結した。
event_intro_464=レイテ湾海戦後、日本軍はフィリピンにおける軍事力に大きな打撃を受けた。連合軍は制空権と制海権の優位を生かしてルソン島奪還を計画し、1945年1月9日、上陸部隊は艦隊の護衛の下でリンガエン湾から上陸し、海岸の守備隊を掃討してマニラに向かって進軍した。3月3日、マニラは解放され、日本軍の残存部隊は山岳地帯に撤退して抵抗を続けたが、8月15日に日本が無条件降伏を宣言したことで、ルソン島の残存日本軍は順次停戦命令を受け入れ、これによりルソン島の戦いは終結した。
event_intro_465=1944年1月14日、ソ連軍はレニングラード方面軍、第2バルト方面軍、ヴォルホフ方面軍を集結し、レニングラード・ノヴゴロド攻勢を開始した。約2週間後、赤軍はモスクワ・レニングラード鉄道の再確保に成功した。1944年1月26日、ドイツ軍はレニングラード州から駆逐され、長らく続いたレニングラード包囲が解かれた。その後、ソ連軍は追撃を続け、3月1日には戦線をルーガ川まで押し上げた。
event_intro_466=1943年9月に連合軍がイタリアに上陸した後、ドイツ軍は連合軍の進軍を阻止するために「冬季防衛線」を築いた。ローマを解放するために進撃を続けるべく、1944年1月17日、連合軍はその中核である「グスタフライン防衛戦」への攻撃を開始した。モンテ・カッシーノの修道院は戦闘の中心地となり、その戦略的な位置からドイツ軍は周辺地域を掌握していた。連合軍は修道院の制圧を何度も試みたが、激しい抵抗に直面した。最終的に、連合軍は大きな犠牲を払いながらもこの地域を制圧し、戦闘で勝利を収めた。
event_intro_467=コルマール突出部を排除するため、1945年1月20日、連合軍は突出部の南北両側から攻撃を開始し、ドイツ第19軍を包囲して大打撃を与え、コルマールを解放した。
event_intro_468=コルスン包囲戦は、ドニエプル・カルパチア山脈攻勢の一部である。1944年1月初旬、ウクライナ第1方面軍とウクライナ第2方面軍が南北からチェルカッスイ北東のドイツ軍突出部を包囲した。突出部内にいるドイツ軍6個師団を殲滅するため、ソ連軍は1月24日に南北から攻撃を開始し、28日に両軍が合流して包囲網を完成させた。ドイツ軍はすぐに突破を試みたが、多くの将校とすべての重火力を失った。
event_intro_469=第一次世界大戦末期、フィンランドは独立を目指し、「右派白衛軍」と「左派赤衛軍」という二つの政治勢力が形成された。両者はフィンランドの独立を求めていたが、異なるイデオロギーにより対立が激化した。戦火は1918年1月27日に始まり、左派赤衛軍が労働者層を動員して南部のほぼすべての都市と産業拠点を占拠し、右派白衛軍は北部の農村地帯に退いた。しかし、左派赤衛軍は軍事訓練が不足しており、最終的に右派白衛軍はドイツの軍事支援を受けて戦争に勝利した。
event_intro_470=1942年2月1日、アメリカ海軍はマーシャル諸島とギルバート諸島に駐留していた日本海軍守備隊に対して空襲と砲撃を行い、島の日本軍駐留部隊に軽度から中程度の損害を与えた。この戦闘自体は太平洋戦局に大きな影響を及ぼさなかったものの、「真珠湾攻撃」や「ウェーク島の陥落」を経験した後のアメリカ海軍と一般市民の士気を大きく高める効果があった。
event_intro_471=1944年1月、ソ連軍はナルヴァ川まで進軍し、エストニアに進出してフィンランドや東プロイセンへの攻撃拠点を確保するため、ナルヴァ地峡で一連の攻撃を開始。この戦闘は1944年2月2日から8月10日まで続いた。序盤ではドイツ軍の激しい反撃によりソ連軍の進軍は遅れたが、7月にリヴォフ＝サンドミール攻勢と連携する形でソ連軍はナルヴァを攻略した。その後、ドイツ軍はタンネンベルク防衛線へと後退し、ソ連軍と再び膠着状態に陥った。


dialogue_3201=ドイツ軍が沿岸への回廊を開こうとしている。今すぐ撤退の準備をするのだ。
dialogue_3202=友軍を先に海峡方向へ撤退させよ。私の装甲部隊が全力でドイツ軍の進撃を食い止める。
dialogue_3203=陣地を死守せよ！王立空軍が撤退作戦のために引き続き空中掩護を提供する。
dialogue_3204=陣地戦はもはや時代遅れだ！全速前進、捕虜は後方の友軍に任せる。
dialogue_3205=この……この空襲の規模ではドイツ軍の地上攻撃を阻止するには到底足りない。この惨敗の原因は一体どこにあるのか？
dialogue_3206=我が軍団はもはや戦闘を続行できない。手元のすべてを放棄し、全速で撤退せよ。
dialogue_3207=我が軍は敗れたが、研究成果だけは決してドイツ軍の手に渡らせるな。
dialogue_3208=海峡への回廊は確保した。この戦線を維持し、英仏の主力を包囲網内で殲滅せよ。
dialogue_3209=あなたがオズボーンか？私はベンテケだ。あなたを護衛して共に撤退するよう命令を受けている。
dialogue_3210=だが、私が受けた命令はここで堅守し、主力部隊が無事に撤退するまで持ちこたえることだ。どれほど状況が切迫していても、勝手に陣地を離れるわけにはいかない。
dialogue_3211=あなたの運命はここで終わるものではない。あなたの旅路はまだ始まったばかりで、未来には無数の可能性が待っている。しかし、あなたがどうしてもここに留まると決意するなら、その選択を尊重しよう。選ぶ権利はあなたの手の中にある。
dialogue_3212=リールも陥落し、ドイツ軍が包囲網を急速に縮めてきている。アルフレート、我々も撤退しなければ。
dialogue_3213=忘れるな、俺たちは傭兵だ。任務を完遂し、生きて戻る——それが唯一の目標だ。
dialogue_3214=彼の決断を信じよう。
dialogue_3215=ドイツ軍は捕虜となった者たちをいくつかの臨時収容所に収監している、オズボーンもその中にいるはずだ。
dialogue_3216=やっと来たのか？もう少し遅かったら、本気でドイツ軍に入ることを考え始めてたかもしれないよ。
dialogue_3217=一体あなたは何者なんだ？なぜここにいる？いや、今はそんなことを気にしている場合じゃない！敵の主力が南方へ進軍している。これが唯一の救援のチャンスだ！
dialogue_3218=逃げようとしているのか？第三帝国の監獄から逃げられる囚人などいない！いっそのこと、ここで片付けてしまおう。そうすれば厄介事もなくなるし、前線に戻って再び戦えるかもしれない！
dialogue_3219=救出は順調だったが、これからが本当の難関だ。南へ進んで前線を突破し、スペインへ向かうんだ。そこから船でイギリスへ渡れるはずだ。
dialogue_3220=どうやらここでお別れのようだ。遠征軍の一部がル・アーブルで孤立し、危機に瀕している。急いで彼らと合流しなければならない。
dialogue_3221=もしかしたら別の選択肢があるかもしれない。南方から撤退するんだ。メス方面に突破口が開かれる予定だ、そこを守っているド・ゴール将軍と合流できるだろう。
dialogue_3222=我々は現在、ドイツ軍と停戦協定の詳細について協議を行っている。各部隊は現地で待機し、新たな指示を待て。
dialogue_3223=フランスは敗れた。ドイツ軍の装甲集団に、優れた指揮官に、そして電撃のごとき進攻速度に屈したのだ。正面戦場の行方を決定づける装甲部隊こそが、戦争の未来を担う存在だ！
dialogue_3224=先進的な軍事工業技術と安定した十分な生産能力、この二つが一つに合わさってこそ、軍事力の発展の方向だ。我々にはまだ希望がある！
dialogue_3225=ペタン政府はフランスの人々を見捨てた。私はフランスのために最後の瞬間まで戦う！
dialogue_3226=フランス軍の部隊は再び我々に分断された。今やパリは開かれ、勝利は目前に迫っている！
dialogue_3227=彼を信じよう、しかし行動は迅速に。ドイツ軍があなたたちに残した時間は少ない。フランス人は自ずと安全に撤退するだろう。
dialogue_3228=前線部隊のアメリカ製装備が無事に到着した。感謝の言葉は必要ない。私は後方であなたたちの最新の戦況報告を待っている。
dialogue_3229=我々の援軍が到着した！しかし、ドイツ軍がアラメインの防衛線を突破し、そこにいる装甲部隊は包囲される危険にさらされている！
dialogue_3230=アルフレート、あなたのフランスでの勇敢な行動には感銘を受けた！しかし、陸上の戦闘と空中戦はまったく異なる。この舞い上がる砂塵があなたの鋭さを磨り減らし、精力を奪い去るだろう。ここでの厳しさに適応できるか、見せてもらおう！
dialogue_3231=敵軍の攻撃規模は確かに予想を超えている。防御戦略を再調整し、敵の攻撃を優先的に無力化せよ。さらに多くの援軍が戦場に到着する予定だ。
dialogue_3232=アラメインが陥落した。敵がこれほど多くの装甲部隊と海軍を持っているとは。我々が包囲される時も近いだろう。
dialogue_3233=海軍まで指揮できるとはな。まずは艦隊をアレクサンドリア港に撤退させよ。増援がすぐに到着するはずだ。
dialogue_3234=攻撃の速度がまだ遅い。忘れるな、チャンスは一度きりだ。イタリア軍の攻撃と連携してカイロを奪取し、連合軍の士気を打ち砕け！
dialogue_3235=目標はカイロだ。連合軍の兵員補給を切断せよ。
dialogue_3236=これが我々の全ての兵力だ。攻勢が失敗した以上、残された選択肢は一つだけ。撤退！
dialogue_3237=刀は鞘から抜かれた。私の部隊は敵軍が反応する前に先手を打つ。
dialogue_3238=私は全力を尽くしてロンメルをアフリカから駆逐する。
dialogue_3239=新しく設計された2台の車両は、原型車の欠陥を見事に改善し、北アフリカ戦場の厳しい環境下でも火砲の威力を十分に発揮できるようになった。
dialogue_3240=空降部隊が予定位置に到着した。直ちに攻撃を開始し、海防線の後方で敵の防御配置を混乱させよ。
dialogue_3241=迅速に上陸せよ！空降部隊と連携して、陣地にいる敵軍を挟撃し、瓦解させるのだ。
dialogue_3242=ゴールド・ビーチの防衛は手薄で、私の位置は相対的に有利だ。協力し、迅速に上陸地点の陣地を確保しよう。
dialogue_3243=上陸部隊は盤石だ、次はカーンへの攻撃を開始せよ。
dialogue_3244=またロンメルと奴の装甲部隊か！ただの戦車軍備の専門家である私が、これほど厳しい戦闘に巻き込まれるとは。
dialogue_3245=誰も戦場では他人の身分など気にしない。ここに留まっていても構わないが、我々の突撃の進路を妨げないでくれ。
dialogue_3246=我々は防衛線の堅固な壁だ。決して連合軍をここを通すわけにはいかない。最後まで戦い抜く覚悟だ！
dialogue_3247=大量の連合軍がノルマンディーに上陸し、敵の進撃を遅らせるために反攻作戦を組織せよ。
dialogue_3248=私の砲兵部隊は連合軍の攻撃を抑えるだろう！
dialogue_3249=時々、自分こそがこれらの戦役の主役であり、ポスターやパンフレットの表紙に載るべきだと感じることがある。
dialogue_3250=連合軍は我々の攻撃に備えていない。この機会を利用して、英米主力部隊の連携を断ち切れ。
dialogue_3251=我々の手元にある武器装備ではどうしようもない。包囲されている友軍は恐らく危険な状況に陥っているだろう。
dialogue_3252=支援を急げ！まさかバストーニュが陥落するのを指をくわえて見ているしかないのか？
dialogue_3253=選択肢は二つある。ドイツ軍の後方を攻撃し、敵の兵員補給を切断するか、あるいは正面からドイツ軍の主力の攻撃を防ぎ、アメリカ軍の援軍の到着を待つかだ。
dialogue_3254=支援に来た！援軍は遅れることがあっても、決して欠席することはない。
dialogue_3255=パットン将軍は兵力を前もって集結させている。援軍の主力が到着次第、直ちに反攻を開始する！
dialogue_3256=仲間たちを信じろ。そして、何より自分自身を信じるんだ。行動を起こせ！
dialogue_3257=私は自分の判断を決して疑わない。状況は間もなく好転し、我々の優位が訪れようとしている。
dialogue_3258=イギリス軍が我々の後方に突撃を仕掛けてきた。退路が遮断されれば、その結果は想像を絶するものになる。
dialogue_3259=連合軍が次の攻撃を開始する前に、ジークフリート線まで撤退し、守備を再編成せよ。
dialogue_3260=我々はかつて勝利まであと一歩のところにいたが、最後にすべてを無にしてしまった。撤退しよう。
dialogue_3261=バストーニュを占領したことで連合軍の士気に大きな打撃を与えた。しかし、我々にはこの攻勢を維持するためのさらなる兵力がない。
dialogue_3262=バストーニュは陥落した。支援に向かっていたオズボーンがドイツ軍の装甲部隊に包囲されてしまった。
dialogue_3263=今は戦局を分析している時間ではない。チャンスは一瞬で失われてしまう。
dialogue_3264=ソ連軍が再び姿を現し、メキシコ湾の大半を占拠した！陸軍はアメリカ・メキシコ国境を越えてきている。状況は非常に緊急だ。
dialogue_3265=我々はアメリカ軍と常に緊密な協力関係にあった。この作戦のルートは絶対に問題ない。君たちを選んだのは、西部戦線で共に戦った仲間だからだ。
dialogue_3266=今回、数多くの新型装備や特殊作戦要員が提供されると聞いている。
dialogue_3267=奴ら言葉を完全に信用してはならない。この任務は特に秘匿作戦というわけではない。アメリカの狡猾な連中は信頼に値しないが、君、ルーカスに対しては全幅の信頼を寄せている。
dialogue_3268=我々は予定地点に到着した。目標は、ソ連軍のミサイル基地と核施設を破壊することだ。君たちの出番だ！
dialogue_3269=空の上で私に挑戦できる者はいない。
dialogue_3270=もちろん、君のためにも一機用意している。
dialogue_3271=待て、山間に何か建築物があるようだ。外見はソ連軍の軍事基地には見えない。
dialogue_3272=そこには人影があるようだ。警戒を高めろ！残された痕跡から見ると、彼らの技術水準は我々をはるかに上回っている。
dialogue_3273=一体何が起こった？なぜ前線の部隊が味方に向けて発砲している！
dialogue_3274=ソ連軍の部隊はまるで誰かに操られているかのようだ。一部は、装備の制御権さえも我々に委ねている。
dialogue_3275=アルフレート、ここに長くは留まれない。この戦車をうまく活用して、南へ進め。君の助けが必要だ。
dialogue_3276=くそ、何が起こったんだ？通信が突然切断された！アルフレート、君たちは無事か？
dialogue_3277=どうやら南米に行くことになりそうだ。そこの状況は相当複雑で、戦争がいつ発生してもおかしくない。
dialogue_3278=今はさらに大きな危機に対処しなければならない。ソ連軍が反応する前に、作戦計画を続行しろ。
dialogue_3279=イギリス軍の部隊に奇妙な装甲戦車が見つかった。以前に似たような武器を見たことがあるが、これで問題はさらに複雑になった。
dialogue_3280=諦めろ、お前たちの計画は成功しない。正面戦場で攻撃を仕掛けるだけでは、他の勢力に利益を与えるだけだ。
dialogue_3281=基地から撤退した。ここは君に任せる。
dialogue_3282=ソ連軍の勢力は南米にまで広がっている。今、彼らは全面的な攻勢を開始した。我々は状況が挽回不可能になる前に先制攻撃を仕掛けなければならない。
dialogue_3283=アメリカ軍は、自国の複数の海外軍事基地を利用して、短期間で大量の部隊を動員した。武力で地方政府に対して威圧的な態度を取っている。
dialogue_3284=この世界を見てみろ、戦争は決して変わらない。強者だけが発言権を持ち、他の者はただ立場を決めざるを得ない。
dialogue_3285=3つの具体的な座標が特定された。最も近い地点付近でソ連軍を発見した。奴らは武力で占拠しようとしているようだ。
dialogue_3286=ここに到達した以上、もう引き返すことはできない。南米の基地を守り、この地で再出発しよう。
dialogue_3287=アルフレート、私たちは君をここに招待したわけではない。この者たちとどう繋がったのかは知らないが、君はもう奴らの一員として見なされている。
dialogue_3288=敵は高度な武器を持ち、人の心も操ることができる。もし我々のために使えないのであれば、最初にそれを完全に破壊しなければならない。
dialogue_3289=私たちは必ず復讐に戻る。オスボーン、お前は最終的に逃げ場を失うだろう。
dialogue_3290=結末は最初から知っていた。私は自分が辿るべき道を決めている。問題はお前たちだ。
dialogue_3291=私はいつも自分と仲間たちに忠実だ。そしてオスボーン、君はもう俺たちの仲間だ。
dialogue_3292=もしかしたら精神的なコントロールなんて最初からなかったのかもしれない。私たちは最初から現状を見抜いていて、変化を望んでいたのかもしれない。
dialogue_3293=君たちの信号干渉装置はまだあるだろう？私は君の判断を信じている。友達が多い方が、敵が多いよりずっといい。
dialogue_3294=さあ、楽しいショーの始まりだ！
dialogue_3295=お前たちは南米で勝利するかもしれない。しかし、覚えておけ。我々はお前を決して逃がさない。
dialogue_3296=ルーカス、これが私たちのすべての精鋭だ。君が何をすべきかは分かっているだろう。
dialogue_3297=これらの部隊は、要塞の周囲で不断に集結している。このまま時間を無駄にしていると、私たちには良い結果が待っていない。
dialogue_3298=今は敵の敵が味方だ。これらの人々を抑制するためには、しばらくの間、ソ連軍と停戦するしかないだろう。
dialogue_3299=誰も私を止めることはできない。アメリカ軍も、ソ連軍も、誰もだ。帝国の敗北が繰り返されることは絶対にない！
dialogue_3300=私たちの戦士たちはすでに各地に潜伏し、密かに様々な軍事行動を進めて、新しい世界の枠組みを変えようとしている。
dialogue_3301=敵軍の急襲を防ぎきれず、カイロが陥落した。補給線が切断される危険に晒されている！
dialogue_3302=防衛線はもう維持できません。今、戦闘機の燃料補給が完了し、私は空軍として任務を遂行し続けます。
dialogue_3303=全機、本土に戻って燃料補給を行え。今後の撤退にはさらなる空中支援が必要だ。

promotable_generals=以下の将軍がこの道具を消費して訓練を受けることができる

