skill_info_115=核弾攻撃の標的に対するダメージ+[#00FF00#%d%%]
skill_info_116=指揮する部隊が攻撃した後、標的を完全に殲滅しなかった場合、[#00FF00#%d%%]の確率でその標的に追跡マークを付与。追跡マークの付いた標的は、受けるダメージが20%%増加する。1ターン継続。
skill_info_117=敵軍を殲滅した後、[#00FF00#%d%%]の確率で自身周囲の1マス内にいる2体の敵の士気を下げる。
skill_info_118=指揮する部隊が移動した後、1マス移動するごとに与えるダメージが+[#00FF00#%d%%]（最大50%%）増加、1ターン継続。
skill_info_119=空軍ユニットを指揮する際、[#00FF00#%d%%]の確率で標的の周囲1マスにいる未攻撃の自軍ユニット1体と共に攻撃を行う。（同時に攻撃に参加できる部隊は最大1つまで）
skill_info_120=指揮する空軍部隊が攻撃した後、攻撃を受けた標的は恐慌状態になり、反撃の確率が[#00FF00#%d%%]低下、1ターン継続
skill_info_121=装甲部隊を指揮する際、受けるダメージ-[#00FF00#%d%%]
skill_info_122=周囲1マスの友軍が倒れた後、自身が復讐状態になり、攻撃力+[#00FF00#%d]、2ターン継続
skill_info_123=指揮する戦艦部隊が攻撃する際、[#00FF00#%d%%]の確率で反撃しない
skill_info_124=艦船部隊を指揮する際、自身は混乱せず、自分と周囲1マスの友軍の攻撃力+[#00FF00#%d]
skill_info_125=指揮する部隊が攻撃を受けた際、敵も同じダメージの[#00FF00#%d%%]を受ける（攻撃1回につき1回のみ有効）
skill_info_126=艦船部隊を指揮する際、空軍部隊とミサイルが敵に与えるダメージ+[#00FF00#%d%%]
skill_info_127=指揮部隊が攻撃した後、「誘敵」の状態を得る。1ターン継続、自身を除く周囲1マスの友軍のダメージが[#00FF00#%d%%]増加
skill_info_128=指揮下の艦船部隊が攻撃する際、周囲未行動の艦船部隊1つが[#00FF00#%d%%]の確率で攻撃に参加（1ターンに1回のみ発動可能）
skill_info_129=指揮する装甲部隊が敵を殲滅した後、目標の周囲1マスの敵に追加で[#00FF00#%d%%]のダメージを与える
skill_info_130=士気低下や混乱状態の敵に対するダメージ+[#00FF00#%d%%]
skill_info_131=指揮下の部隊編成数が1の場合、ダメージが[#00FF00#%d%%]増加
skill_info_132=指揮する部隊が反撃した後、自身と周囲の友軍のHP＋[#00FF00#%d]
skill_info_133=指揮部隊が自分の領土にいる場合、経済、工業、技術の産出量＋[#00FF00#%d%%]





