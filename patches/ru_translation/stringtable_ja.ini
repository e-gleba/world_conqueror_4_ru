dialogue_2670=部隊は順調に進んでいる。防衛線を突破し、ソ連の基地に向かって進軍しているところだ。
dialogue_2671=ミサイルが配備された、敵軍を攻撃する準備は整っている。
dialogue_2672=我が武器を最大限に活用し、ここにいる敵を殲滅せよ。
dialogue_2673=すぐに反撃を開始し、漢城を奪還せよ。
dialogue_2674=ソ連の攻勢は我々に大きな脅威を与えている。反撃するための措置を取る必要がある。
dialogue_2675=作戦は一応の成功を収めた。しかし、今、手を緩めることはできない。ソ連軍の反撃に備えて常に準備しておく必要がある。
dialogue_2676=ソ連の海上要塞を破壊し、敵艦隊の再編成を阻止せよ。
dialogue_2677=米軍は本格的な侵攻を開始した、我々に残された時間は多くない。
dialogue_2678=米軍がソ連港を占領するのを阻止せよ。我が援軍が戦場に到達間近だ。
dialogue_2679=米軍は数が多く、猛烈に進攻している。より多くの援軍が必要だ。
dialogue_2680=戦い続け、増援を待って反撃を始める。
dialogue_2681=上陸地点はソ連軍に占領された。間宮海峡を封鎖するために部隊を再編成せよ。
dialogue_2682=上陸部隊の編成は完了し、いつでも島を占領する作戦を開始できる。
dialogue_2683=北海道の敵拠点を直接攻撃することで、南千島列島の守備軍は我々の作戦のための時間を稼ぐことができる。
dialogue_2684=我々は攻撃における重要な支点を失った。北海道方面へ後退せよ！
dialogue_2685=敵の守備軍は我々が撃破した。ソ連艦隊をすぐに周辺海域から排除せよ。
dialogue_2686=米軍は3つの戦場で同時攻撃を仕掛けてきた。要塞と都市を全力で守れ。反撃の機会を待て。
dialogue_2687=援軍が戦場に到着できず、次は我々だけの戦いになる。厳しい戦いになるだろう。
dialogue_2688=ソ連の防衛は強固ではない、カムチャツカ半島に残っているソ連の基地を除去するのにさほど時間は掛からないだろう。
dialogue_2689=我が軍の装甲部隊はここで持ちこたえる。前線が防衛線まで撤退するのを支援してほしい。
dialogue_2690=連合艦隊はベーリング海方面からこちらに向かっている。後続の敵上陸部隊に注意せよ。
dialogue_2691=米軍の攻撃の重心はすぐに変わる。敵将軍への対処と、有利な地形に基づく守備の再編成を優先せよ。
dialogue_2692=我々は攻撃の主導権を取り戻した。島々の物資を奪還することが手始めになる。
dialogue_2693=米軍がアンカレジ周辺に防衛の全力を集中している今が、上陸するには絶好の機会だ。
dialogue_2694=連合艦隊は、この氷のカーテンを突破するため、ベーリング海峡南部から攻撃する。
dialogue_2695=友軍がベーリング海峡を横断し、アンカレジ周辺を迅速に制圧するのを支援する。
dialogue_2696=防衛線はすべて突破されている。このまま持ちこたえ続けても行き詰まるだけだ。
dialogue_2697=先手を打って、我々の陣地を奪い返すのだ。
dialogue_2698=ソ連軍は海路と陸路でアラスカに進駐した。
dialogue_2699=ソ連軍がすべての退却路を封鎖したため、アラスカ山脈の危険な地形を利用して防衛網を再編成するほかないだろう。
dialogue_2700=アンカレジより西の米軍は我々に任せろ。この包囲網を完成させるため、東への攻撃を続けよ。
dialogue_2701=敵の要塞を突破した、奴等はもはや袋の鼠だ。
dialogue_2702=状況は非常に危険だ。全予備兵力をすぐに集結させ、アンカレジを救援せよ。
dialogue_2703=研究施設は我々の支配下にある。敵の殲滅を早めるために、ここにあるすべてのものを使え。
dialogue_2704=ソ連軍が我々の一番強固な要塞を破った。アラスカは完全に我々の手から離れた。
dialogue_2705=カモにされてはいけない。生き残るチャンスを得るためには、先手を打ってフェアバンクスを奪還するしかない。
dialogue_2706=ソ連軍の前進を素早く包囲し、敵が陣形を広げるのを許すな。
dialogue_2707=敵の防衛線によって友軍から遮断されている。増援が到着する前に、この障壁を突破する必要がある。
dialogue_2708=我々は、ソ連軍部隊間の連結を阻止することに成功し、守備の深さを生かして敵を引きずり下ろした。
dialogue_2709=バンクーバーの守備軍は壊滅し、西海岸の攻勢が始まろうとしている。
dialogue_2710=もうすぐ援軍が戦場に到着する。シアトルを死守すれば、我が軍はバンクーバーに向けて反撃を始める。
dialogue_2711=攻撃を続けろ！鋼鉄の奔流の前に敵を震え上がらせよ！



dialogue_2651=同盟国の軍隊が集結した、勝利の天秤は我々に有利に傾くだろう！
dialogue_2652=連合国は我々よりはるかに多くの資源と物資を持っている、我々は苦戦を強いられるだろう。
dialogue_2653=88ミリ高射砲を水平にし、砂漠や塹壕で待ち伏せして敵を奇襲するのだ。
dialogue_2654=あり得ない、敵軍は一向に退却の兆候を見せないとは。地中海の補給艦隊に頼って、彼らと長い消耗戦をするしかない！
dialogue_2655=海岸の守りを固め、援軍に上陸の機会を与えるな。
dialogue_2656=イタリアは連合軍の攻撃を受けている。ドイツの指揮官、どうか支援を！
dialogue_2657=勝利の光は目の前にある。指揮官，どうか持ちこたえてください、もうすぐここから無事に出られます！

dialogue_2658=パイロットに十分な休養と回復を与えるため、真珠湾での毎週日曜日の航空機パトロールを中止とする。
dialogue_2659=帝国の興亡はこの戦いにかかっている。すべての将校と兵士は義務を果たし、最善を尽くせ！
dialogue_2660=「...半晴、山間の雲が多く、港の視界は良好です。北風はおおよそ10級です。」ホノルルからの放送に変わった様子はなく、我々の攻撃は敵に知られていないだろう。
dialogue_2661=これは演習ではない ！真珠湾は日本の攻撃を受けている！
dialogue_2662=トラ・トラ・トラ！
dialogue_2663=すべての防空を駆使し、軍艦と港を守れ！
dialogue_2664=この襲撃で一発の銃弾で死ぬことは、私にとって慈悲と言えるのか。
dialogue_2665=我々は眠れる巨人を起こしてしまったかもしれない。その巨人はとてつもない決意を持って我々と戦うだろう。
dialogue_2666=ト、ト、ト。

