feat_desc_152=陸軍または海軍ユニットから攻撃を受ける際、{1}%の確率でそのダメージを回避する。空襲を受ける際は、{2}%の確率でそのダメージを回避する(ミサイル及び核爆弾を除く)。
feat_desc_153=ヘリコプターを攻撃する際、与えるダメージが{1}%増加。毎ターン移動後、次ターンの行動力が{2}低下する（最低2マス移動可能）。友軍都市または工兵部隊の1マス以内で1ターン休整すると、行動力が全回復する。
feat_desc_153_Lv2=ヘリコプターを攻撃する際、与えるダメージが{1}%増加。毎ターン移動後、次ターンの行動力が{2}低下する（最低2マス移動可能）。友軍都市または工兵部隊の1マス以内で1ターン休整すると、行動力が全回復する。
feat_desc_153_Lv3=ヘリコプターを攻撃する際、与えるダメージが{1}%増加。毎ターン移動後、次ターンの行動力が{2}低下する（最低2マス移動可能）。友軍都市または工兵部隊の2マス以内で1ターン休整すると、行動力が全回復する。
feat_desc_153_Lv4=ヘリコプターを攻撃する際、与えるダメージが{1}%増加。毎ターン移動後、次ターンの行動力が{2}低下する（最低2マス移動可能）。友軍都市または工兵部隊の2マス以内で1ターン休整すると、行動力が全回復する。
feat_desc_154=装甲・火砲ユニットに対するダメージ+{0}%。攻撃後、目標が撃破されなかった場合、目標に牽制効果を付与する（1ターン）。目標を撃破した場合、自身は再度攻撃を行えるが、与えるダメージが{1}%低下する。この再攻撃は、1ターンあたり最大{2}回まで。
feat_desc_154_Lv2=装甲・火砲ユニットに対するダメージ+{0}%。攻撃後、目標が撃破されなかった場合、目標に牽制効果を付与する（1ターン）。目標を撃破した場合、自身は再度攻撃を行えるが、与えるダメージが{1}%低下する。この再攻撃は、1ターンあたり最大{2}回まで。
feat_desc_154_Lv3=装甲・火砲ユニットに対するダメージ+{0}%。攻撃後、目標が撃破されなかった場合、目標に牽制効果を付与する（1ターン）。目標を撃破した場合、自身は再度行動を行えるが、与えるダメージが{1}%低下する。この再攻撃は、1ターンあたり最大{2}回まで。
feat_desc_154_Lv4=装甲・火砲ユニットに対するダメージ+{0}%。攻撃後、目標が撃破されなかった場合、目標に牽制効果を付与する（1ターン）。目標を撃破した場合、自身は再度行動を行えるが、与えるダメージが{1}%低下する。この再攻撃は、1ターンあたり最大{2}回まで。
feat_desc_155=装甲、砲兵、海軍ユニットに与えるダメージが{2}%増加する。
feat_desc_155_Lv2=最大射程+{1}。装甲、砲兵、海軍ユニットに与えるダメージが{2}%増加する。
feat_desc_155_Lv3=最大射程+{1}。装甲、砲兵、海軍ユニットに与えるダメージが{2}%増加する。
feat_desc_155_Lv4=最大射程+{1}。装甲、砲兵、海軍ユニットに与えるダメージが{2}%増加する。
feat_desc_156=今ターンの攻撃がダメージを与える時、対象の1マス以内にいる最大{1}体のユニットに追加で{2}%のダメージを与える。歩兵以外のユニットを優先的に対象とする。効果持続時間は1ターン。クールダウンは3ターン。
feat_desc_156_Lv2=今ターンの攻撃がダメージを与える時、対象の1マス以内にいる最大{1}体のユニットに追加で{2}%のダメージを与える。歩兵以外のユニットを優先的に対象とする。効果持続時間は1ターン。クールダウンは3ターン。
feat_desc_156_Lv3=今ターンの攻撃がダメージを与える時、対象の2マス以内にいる最大{1}体のユニットに追加で{2}%のダメージを与える。歩兵以外のユニットを優先的に対象とする。効果持続時間は1ターン。クールダウンは2ターン。
feat_desc_156_Lv4=今ターンの攻撃がダメージを与える時、対象の2マス以内にいる最大{1}体のユニットに追加で{2}%のダメージを与える。歩兵以外のユニットを優先的に対象とする。効果持続時間は1ターン。クールダウンは2ターン。
feat_desc_157=攻撃後、追加で攻撃を行うことができる（最大{1}回）。
feat_desc_157_Lv4=攻撃後、追加で攻撃を行うことができる（最大{1}回）。同一ターン内において、攻撃を行うたびに次の攻撃の与えるダメージが20%増加し、この効果は最大3回まで累積する。

