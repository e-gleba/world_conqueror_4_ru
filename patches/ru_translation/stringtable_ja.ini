feat_desc_98=ファントム状態になり、陸海軍からの自発的な攻撃を受けることはなくなる。クールダウン2ターン。ステルス状態の時、行動力+{1}。1ターン継続。攻撃後にステルス状態が解除される。
feat_desc_99=反撃を受けることはない。部隊を攻撃する際のダメージが{1}%（ファントム状態では{2}%）増加し。建物を攻撃する際のダメージは50%減少する。
feat_desc_100=ヘリコプターを呼び出し、自身を指定した5マス以内の位置に移動させる。クールダウン2ターン。
feat_desc_100_Lv2=ヘリコプターを呼び出し、自身を指定した9マス以内の位置に移動させる。クールダウン2ターン。
feat_desc_101=部隊の損失が半分を超えた後、次のターンに最大HPの{1}%を回復する。
feat_desc_102=このターン中、会心率が{1}%増加し、攻撃時に対象の{2}%の装甲を無視する。クールダウン2ターン。
feat_desc_103=防御力が{1}%増加する
feat_desc_104=対空兵器は、超高高度からの爆撃攻撃に対して防御することができない。
feat_desc_105=航空母艦の艦載機として使用することはできません。攻撃を行うたびに、目標区域内で追加で{1}%のダメージ効果。
feat_desc_106=核弾を搭載して攻撃する際、核弾のダメージが{1}%増加。
feat_desc_107=このターンの攻撃時に、対象の1マス範囲内の他の目標に{1}%の追加ダメージを与える、クールダウン2ターン。
feat_desc_108=複数の敵部隊に攻撃でき、戦車や火砲ユニットに対するダメージが{1}%増加。
feat_desc_109=周囲1マス以内の敵部隊のバフ効果を無効化する。クールダウン3ターン。
feat_desc_109_Lv2=周囲2マス以内の敵部隊のバフ効果を無効化する。クールダウン2ターン。

army_buff_desc_1351=ファントム：行動力+2、陸軍や海軍からの攻撃を受けない。
army_buff_desc_1352=ファントム：行動力+4、陸軍や海軍からの攻撃を受けない。
