;噩梦关规则
operation_nightmare_rule_1=1.イベントキャンペーンは期間限定で開催されます。ステージをクリアして報酬を手に入れるため、指揮官は余裕を持ったスケジュールを立てることをお勧めします。
operation_nightmare_rule_2=2.悪夢難易度のキャンペーンでは、敵軍に4つのバフが付与される（イベント開放時にランダムで4つのバフがイベント終了まで付与される）ので、指揮官方が悪夢難易度のキャンペーンに挑戦する際は、進軍ルートを慎重に決定してください。
operation_nightmare_rule_3=3.この難易度のキャンペーンでは、各ステージで撃破された将軍は次のステージに配置することができず、進行状況をリセットすることでしか、これらの将軍を再び配置することはできません。
operation_nightmare_rule_4=4.ステージを制覇すると、現在の最高通過難易度が記録されます。特定のレベルをクリアすると区間報酬を受け取ることができます。
operation_nightmare_rule_5=5.進度リセットは、現在の難易度のシナリオ進度のみをリセットすることができます。

defensive_nightmare_rule_1=1.イベントキャンペーンは期間限定で開催されます。ステージをクリアして報酬を手に入れるため、指揮官は余裕を持ったスケジュールを立てることをお勧めします。
defensive_nightmare_rule_2=2.悪夢難易度のキャンペーンでは、敵軍に4つのバフが付与される（イベント開放時にランダムで4つのバフがイベント終了まで付与される）ので、指揮官方が悪夢難易度のキャンペーンに挑戦する際は、進軍ルートを慎重に決定してください。
defensive_nightmare_rule_3=3.すべてのクリティカルエリアを守ることで勝利する。ステージの勝敗に関係なく、現在の最長防衛ターンが記録される。一定の防衛ターンを達成すると、それぞれの区間報酬を受け取ることができる（敵軍を全滅させた場合、全段階報酬が解除されます）。
defensive_nightmare_rule_4=4.ステージは繰り返しプレイできるが、途中で終了すると現在の最大防御ターンは記録されない。

