event_rule=ルール
;集团军模式规则
armygroup_rule=軍集団イベントのルール
armygroup_rule_1=1. イベントキャンペーンは期間限定で開催されます。ステージをクリアして報酬を手に入れるため、指揮官は余裕を持ったスケジュールを立てることをお勧めします。
armygroup_rule_2=2.軍集団イベントでは、【軍集団アチーブメント】を達成するとアチーブメントポイントが手に入ります。このポイントが一定数に達するごとに、段階報酬を受け取れます。
armygroup_rule_3=3.各ステージには異なる規模と難易度の軍集団が存在し、勝利を達成すると、対応するクリア報酬を獲得できます。
armygroup_rule_4=4.軍集団イベントでの勝利条件は、敵対陣営のすべての軍集団を撃破することです。各軍集団が敗北となるのは、すべての建物が占領され、かつすべての部隊が殲滅された時です。同一国家の他の軍集団に宣戦布告すると、全ての友好勢力と敵対関係になる。
armygroup_rule_5=5.各軍集団はそれぞれ独自の援軍と技術を持っています。敵の軍集団を撃破すると、その軍集団が持っていた援軍を獲得できます。さらに、特定の軍集団を撃破することで、対応する兵種技術を解放することも可能です。
armygroup_rule_6=6.敵部隊を撃破し、敵の建物を占領すると功勲値を獲得できる。功勲ポイントを消費して援軍を招集したり、兵種テクノロジーを強化したりすることができる。
armygroup_rule_7=7.敵部隊を殲滅し、敵施設を占領すると、対応する軍集団の忠誠度が低下する。忠誠度が15%まで低下した際、プレイヤーの占領地域が一定規模に達し、かつ敵軍集団の都市がすべて喪失している場合、招降機能を発動し当該軍集団を強制的に投降させることが可能である。

