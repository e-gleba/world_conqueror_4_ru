event_intro_401=ミッドウェー海戦は太平洋戦争の転換点となった。1942年6月4日、日本とアメリカはミッドウェー島北西の海域で決戦を繰り広げる。日本軍の無線通信暗号が解読されると、アメリカ軍はすぐに対抗策を打ち出し、日本軍はより少ない犠牲でより多くの人的損害を被った。赤城を含む4隻の空母が撃沈され、それ以来、日本は太平洋の戦略的優位を失うこととなる。
event_intro_402=連合国は1944年6月6日、正式に上陸作戦を開始。さまざまな偽装作戦、軍艦による砲撃、空軍による空爆、空挺作戦の連携により、16万人近い兵士がイギリス海峡を渡り、ノルマンディー地域の5つの浜頭に上陸した。これによりオーヴァーロード作戦が正式に開始され、連合軍勝利の礎が築かれた。
event_intro_403=イタリアは1940年6月10日、英仏に宣戦布告し、30万人の軍隊を動員してアルプス山脈とニース地域への進攻を開始した。しかし、アルプス防衛線とマジノ防衛線南部においてフランス軍の激しい抵抗にあうと、進撃はすぐに停止した。
event_intro_404=1941年6月15日、枢軸国軍によるトブルクの包囲を解くため、イギリスは再びキレナイカの占領を組織した。イギリス軍はドイツ軍の航空部隊と輸送路を制圧するために多数の航空部隊を投入したが、作戦はドイツ軍の陣地を奪うことができず、代わりに装甲部隊は大きな損害を被り、ドイツ軍の反撃に包囲された。困難な撤退の末、作戦は失敗に終わった。
event_intro_405=1944年6月15日、米軍は艦砲射撃に隠れてサイパン上陸作戦を開始。島内の日本軍は降伏を拒否し、激しい抵抗を続けた末に玉砕覚悟の攻撃を仕掛けた。米軍もまた、この勝利のために高い代償を払った。
event_intro_406=この戦いは、バルバロッサ作戦の第一段階における大規模な包囲戦であった。ドイツ軍の攻撃は1941年6月22日に開始され、中央軍がビャウィストク-ミンスク-スモレンスクを軸にモスクワに向かって攻撃した。ドイツ軍装甲部隊の高速前進は、多数のソ連軍を包囲する結果となった。しかし、包囲されたソ連軍は抵抗を続け、約25万人が包囲から脱出した。
event_intro_407=この戦いはオルシャ作戦の第一段階における重要な攻勢の一つであった。1944年6月25日、ソ連軍の第1バルト戦線と第3白ロシア戦線は、ドイツ軍をヴィテブスクで包囲する。ドイツ軍の防御は長くは続かず、ヴィテブスクとオルシャは次々と解放され、オルシャ作戦は順調に進展した。
event_intro_408=1942年6月28日、ソ連はスターリングラードへ向かうドイツ軍の増援を阻止するため、予備軍を動員してヴォロネジを増援。両軍はヴォロネジで激しい戦闘を繰り広げた。ドイツ軍は最終的にヴォロネジを占領したが、ソ連軍はさらに時間を稼ぎ、スターリングラードの防衛を強化する。
event_intro_409=第一次エル・アラメインの戦いは消耗戦で、ロンメル率いるアフリカ軍団が1942年7月1日に先攻したが、エル・アラメイン線は突破できなかった。その後、イギリス軍が反撃を開始し、両軍は多くの陣地をめぐって何度も戦闘を繰り返し、膠着状態が続いた。ドイツ軍のアレクサンドリア港占領計画は失敗に終わる。
event_intro_410=1941年7月6日、バルバロッサ作戦の初期段階での大勝利の結果、ドイツ軍は東ヨーロッパの平原を前進した。ソ連は初期の敗戦後、セミョーン・チモシェンコをスモレンスクの新防衛線の編成に任命し、絶え間ない反撃でドイツ軍の攻勢を弱めたが、ドイツ軍のモスクワへの前線進出を阻止することはできなかった。
event_intro_411=1943年7月9日、地中海航路を解放し、ムッソリーニの失脚を促し東部戦線のドイツ軍を食い止めるため、米英を中心とする連合国はシチリア島への水陸両用上陸作戦を開始した。すべての準備を整えたこの戦いは、その目的を完全に達成することに成功した。ドイツ軍は撤退に成功したものの、ムッソリーニの崩壊を阻止することはできなかった。
event_intro_412=この戦いはクルスクの戦いの中で最も苛烈なものであった。ソ連軍は1943年7月12日、圧倒的な戦力でオリョールのドイツ軍塹壕に攻撃を開始した。ドイツ軍は最終的に、ソ連軍に包囲される危険を冒して塹壕を放棄した。ソ連軍はオリョールを奪回し、戦略的優位を取り戻した。
event_intro_413=この戦いは、バルバロッサ作戦の第3段階における包囲戦であった。ドイツ軍南方集団は三つの方向からウクライナに接近し、装甲集団はキーウの南とウーマニの北に進撃し、1941年7月15日にベルディエフを占領した。ソ連軍はドイツ軍の攻撃方向を見誤り、退却の機会を逃したため、多数の兵士が捕虜となった。
event_intro_414=ノルマンディー上陸作戦の後、連合軍はカーンでドイツ軍の頑強な抵抗に遭う。イギリス軍とカナダ軍は1944年7月18日、カーン南方のドイツ軍防御陣地を攻撃するため、グッドウッド作戦を開始した。しかし、ドイツ軍は優れた地形と火力を駆使し、連合軍の装甲に大きな損害を与えた。大損害を被り、作戦は終了を余儀なくされた。
event_intro_415=1942年7月21日、珊瑚海海戦の失敗を受け、日本軍はポートモレスビーを占領し、米豪間の海と空の連絡を断つという戦略目標を達成するため、陸路でポートモレスビーを占領する決意を固めた。数、練度、武装すべてにおいて劣るオーストラリア軍は日本軍に対する防衛に苦戦を強いられた。結局、日本軍は米軍の支援を受けてココダからの撤退を迫られた。
event_intro_416=ノルマンディーにおけるドイツ軍の戦線を突破するため、連合軍はいくつかの支援作戦を展開し、ドイツ軍の予備兵力のほとんどをイギリスとカナダの戦線に引き寄せた。1944年7月25日、連合軍はサン＝ロー付近のドイツ軍に全力を傾注する。人員と装備の不足と士気の低下により、ドイツ軍は効果的な反撃を組織することができず、ノルマンディー西部の防衛線は完全に崩壊した。
event_intro_417=コブラ作戦の成功に乗じて、連合軍は1944年7月30日、ドイツ軍の後退の隙をついてブルーコート作戦を開始した。イギリス軍は戦線の東側でドイツ軍装甲の保持と消耗に成功し、その後のドイツ軍の反攻阻止とファレーズでのドイツ軍包囲に貢献した。
event_intro_418=ソ連軍は1943年8月3日、ベルゴロド、ハリコフ地域の奪回を目的としたドイツ軍南方集団の北側面への攻撃を開始した。ドイツ軍は膨大な数のソ連軍部隊の前に退却に成功し、ハリコフは再び手を離れた。また、クルスクの戦いの敗北により、独ソ戦の戦略的優位を完全に失った。

event_intro_419=これは太平洋戦線における連合軍が日本帝国に対して行った初めての大規模な地上攻勢である。1942年8月7日、連合軍はソロモン諸島南部のガダルカナル島、ツラギ島、フロリダ諸島に上陸した。日本の守備隊は数で劣っていたため、連合軍に圧倒され、何度も奪還を試みたが最終的には成功しなかった。
event_intro_420=カーンを奪取した後、ドイツ軍の戦線を瓦解し退路を断つために、1944年8月8日未明、カナダ軍はドイツ軍の防衛線を突破し、防衛線の奥深くにある重要な陣地を占領した。最終的にはファレーズの北7マイルの地点で止まった。
event_intro_421=ファレーズ戦役は第二次世界大戦中のノルマンディー戦役における決定的な戦いである。1944年8月12日から21日にかけて、連合軍は包囲戦によってセーヌ川以西のB軍集団の大部分を壊滅させ、5万人以上を捕虜にした。この戦いにより、パリや仏独国境への道が開かれた。
event_intro_422=1944年8月15日、ノルマンディー上陸後の連合軍の補給問題を解決するため、連合軍はドラグーン作戦を再開し、フランス南部の港を確保することを決定した。この作戦で、連合軍はわずか4週間でフランス南部の大部分を解放し、ドイツ軍に大きな損害を与え、G軍集団をヴォージュ山脈の一線まで退かせた。
event_intro_423=1942年8月19日、上陸の可行性をテストし情報を収集するために、連合軍は試験的な上陸作戦を実施した。しかし、ドイツ軍の強力な阻止に遭遇し、上陸部隊の損害率は68%にも達したにも関わらず、一部の部隊がわずかに軍事情報を収集したに過ぎなかった。この戦いは後に災難的な上陸作戦として見なされたが、その結果は双方に教訓を与え、後のノルマンディー上陸作戦に深い影響を与えた。
event_intro_424=キエフ戦役は第二次世界大戦中の大規模な包囲戦である。1941年8月23日から9月26日にかけて、ドイツ軍は中央軍集団と南方軍集団の兵力を集中させ、キエフを包囲し史上最大の包囲網を形成した。戦後の統計によると、ドイツ軍は10万人の損失でソ連軍70万人を壊滅させた。この戦いは「ドイツ軍の東部戦線での最大の勝利であり、赤軍にとって最大の軍事的惨事」と評価されている。
event_intro_425=バルチック艦隊の主要拠点であったタリンは、ソ連軍司令部の判断ミスにより、バルバロッサ作戦の初期に急速に陥落し、1941年8月27日、タリンに残っていた守備兵は、砲火を浴びながら乗船してレニングラードへ避難しなければならなかった。 ソ連の撤退を阻止するため、ドイツとフィンランドは艦隊、機雷、空軍でフィンランド湾を封鎖し、50隻以上の艦船が破壊され、1万人以上の死傷者を出したが、最終的にバルチック艦隊のほとんどの艦船がクロンシュタットに到着し、レニングラードの防衛に参加した。
event_intro_426=この戦いは北アフリカ戦線で枢軸国軍が最後に主導権を持って発起した大規模攻勢でした。1942年8月30日、ロンメルは第8軍団に対してアラム・ハーラフ丘陵で攻撃を開始し、補給不足から完全な勝利の希望を失うことを避けようとした。しかし、作戦計画が英軍によって事前に露見し、モンゴメリはこれを利用して特別な戦術配置を行い、ロンメルの最後の希望を完全に打ち砕きた。この戦いの後、枢軸国のアフリカ部隊は主導権を失い、アフリカにおける彼らの戦略的目標はもはや実現不可能となった。
event_intro_427=この戦いは第二次世界大戦の始まりを象徴である。1939年9月1日、ソ連とドイツが秘密裏に締結した「ソ連・ドイツ不可侵条約」の後、ドイツ軍はポーランドに侵攻し、迅速にポーランド軍を撃破した。16日後、ソ連もドイツに応じてポーランド東部を占領した。装備と軍事力の巨大な不利を受けて、ポーランドは最終的にソ連とドイツによって迅速に分割され、政府は海外に亡命した。
event_intro_428=1943年9月3日、シチリア島上陸作戦の勝利後、連合軍はイタリア本土への攻勢を続けた。連合軍はドイツ軍がターラント以南に重点的に布陣すると予想し、ターラント以南での誘攻を計画したが、主力はサレルノに上陸してナポリを制圧することを目指した。しかし、ドイツ軍はナポリの重要性を強く認識しており、これが連合軍の上陸を困難になった。最終的に、連合軍はサレルノを含むイタリア南部を成功裏に制圧したが、ナポリを占領することはできなかった。
event_intro_429=この戦いは西部砂漠作戦の始まりであった。 イタリアは以前、スエズ運河を攻略するために海岸沿いのエジプト侵攻を計画していたが、何度も延期された結果、攻勢はシディ・バラニへの進撃に絞られた。1940年9月9日、イタリア軍は攻撃を仕掛け、1週間以内に目的地まで前進し、そこに居を構えて次の攻撃を待つために物資を蓄えた。
event_intro_430=1944年9月14日、連合軍はエストニア、ラトビア、リトアニアの解放を目指し、バルト海地域で大規模な戦略攻勢を開始した。この攻勢にはリガ、タリンを含む4つの象徴的な戦いが含まれている。この地域のドイツ軍は攻勢に頑強に抵抗したが、大きな損害を被り、最終的にはクールランドに包囲された。
event_intro_431=1944年9月17日、西部戦線のジークフリートラインを迂回し、ルール工業地帯を攻撃するため、連合軍は大量の空挺部隊を投入し、イギリスの地上部隊と連携して、後続作戦の道を開くため、アイントホーフェンからアーネムへの橋の攻略を試みた。 しかし、あまりに強引な計画と部隊間の連携に問題があったため、連合軍は70マイル前進したにもかかわらず、結局アーネムを占領することはできなかった。
event_intro_432=ヒュトゲンの森の戦いは、1944年9月19日から翌年2月10日まで続いたアメリカ陸軍史上最長の戦いである。 ドイツ軍がアーヘンの戦いを強化するのを阻止するため、アメリカ軍はヒュトゲンの森への攻撃を開始した。 しかし、ドイツ軍はルール・ダムを守るために連合軍の進行を遅らせ、多大な犠牲者を出した。 アメリカ軍の損害は少なくとも33、000人、ドイツ軍の損害は28、000人であった。 この戦いは連合軍にとって「大敗北」と評されるほど犠牲が大きかった。
event_intro_433=ダカールの戦いは、1940年9月23日から25日にかけて、連合国軍がフランス領西アフリカの戦略的港湾ダカールを占領しようとした試みの失敗である。 ドゴール将軍はダカールのヴィシー・フランス軍を説得し、彼らの立場を変えることができると考えていたが、ダカール総督は断固として反対し、それが最終的に戦闘の引き金となった。 連合軍は何度かの攻撃にも勝利できず、最終的に撤退を選択した。
event_intro_434=メスの戦いとは、第二次世界大戦中のメス周辺におけるドイツ第1軍集団とアメリカ第3軍集団の激戦を指す。 ドイツ軍は一連の砦を頼りに断固として抵抗し、アメリカ軍を過酷な陣取り合戦に引きずり込んだ。 ここでのアメリカ軍の戦闘は1944年8月27日から12月13日まで続き、最終的にメッツ地区のドイツ軍を降伏に追い込んだ。
event_intro_435=1941年9月30日に始まったブリャンスクの戦いは、ソ連赤軍のブリャンスク戦線を包囲、破壊し、モスクワ攻撃の道を開くというバルバロッサ計画におけるドイツの主要作戦であった。 ドイツ軍は戦術的勝利を収めたが、ソ連軍は抵抗し、ドイツ軍の攻撃を遅らせることに成功し、モスクワ防衛のための時間を稼いだ。
event_intro_436=1944年10月2日、安全保障と補給確保のため、連合軍はアントウェルペン港を使用可能にし、シェルデ川口のドイツ第15軍団を排除する一連の軍事行動を開始した。しかし、連合軍は以前に他の作戦に重点を置いていたため、この地域のドイツ軍は援軍を受けた。最終的に、カナダ第1軍団は20、873名の連合軍の死傷者を出す代価を払い、シェルデ川の敵を排除した。


dialogue_2712=敵の主力部隊を壊滅させ、モスクワを狙え！
dialogue_2713=同士よ、我々の後方にはモスクワがある。敵を一人残らず駆逐するのだ！
dialogue_2714=指揮官閣下、ソビエト軍はレペリ近郊に大軍を集結させ、我が軍の対戦車防御網に踏み込もうとしています。
dialogue_2715=レペリの反撃は敗れたが、我々は最後まで戦うぞ！
dialogue_2716=ヴィーツェプスクは占領し、第3装甲集団はスモレンスク包囲に協力できる態勢だ。
dialogue_2717=モギリョフ防衛線を突破した、スモレンスクを攻撃する準備を整えろ！
dialogue_2718=大勝をお祝い申し上げます！指揮官閣下、我々はスモレンスク包囲作戦のため、第3装甲集団軍のご協力を要請します。
dialogue_2719=兵士たちよ、速やかに進軍し、ココダを占領せよ！
dialogue_2720=兵士たち、ポートモレスビーの安全のために、必ずココダを死守せよ！物資は後方より空輸される！
dialogue_2721=周辺地域を統制し、ポートモレスビーへの道を開くのだ。
dialogue_2722=ココダ奪回のため、より強力な支援が直ちに到着する！
dialogue_2723=援軍が到着した！兵士たちよ、戦え！後の増援は続々と増えるぞ！
dialogue_2724=計画によれば、我が軍はリカータ近郊に、イギリス軍はシラクーザ近郊にそれぞれ上陸し、南部の飛行場を制圧する。南から北へ順番に前進すれば、勝利は目前だ！
dialogue_2725=兵士たちよ！強風は上陸には不利だが、敵が我々の攻撃を予測する可能性はさらに低い。王と祖国のため、進め！
dialogue_2726=戦線は崩壊している。メッシーナからの避難を準備し、体力を蓄えよ。
dialogue_2727=南部の海岸は開拓され、海岸から物資が届けられた。
dialogue_2728=指揮官閣下、この戦いで我々の部隊は占領地からの物資の調達に苦労しています。どうか一刻も早くリカータを占領し、支援を獲得しましょう。
dialogue_2729=指揮官閣下、枢軸国の退路を断つため、一刻も早くメッシーナを攻撃してください。
dialogue_2730=兵士たちよ、新たな装備により、敵の空軍と輸送線は我々の空軍によって制圧された！この戦いの勝利も近い！
dialogue_2731=我が軍の備蓄は不足している。撃つ機会を待つべきでしょう。
dialogue_2732=時が来た！敵の左翼に突撃し、包囲の準備をせよ。
dialogue_2733=突撃を続け、戦闘を拡大し、トブルクの包囲を解き放て！
dialogue_2734=諸君、早く突破口を開き、ビャウィストクの北と南でソ連軍を撃退し、包囲陣を形成せよ！
dialogue_2735=同士達よ、恥知らずなドイツ軍が我が国を侵略している。祖国のために、ソビエトのために、彼らを追い払え！
dialogue_2736=このままバラナヴィーチを突破し、ミンスクを包囲する準備を進めよ。彼らが守備を再編成する前に急げ！
dialogue_2737=同士たち、防衛線を縮小せよ！ミンスクを中心に戦線を再編成せよ。
dialogue_2738=最高指揮部が西南方面軍に命令する：安全を確保しつつ、全力でドイツ軍の攻勢を撃退し、必ずやドニエプル川の防衛線を守るのだ。
dialogue_2739=ソ連軍の兵力は我々より上だ。防衛線を突破する前に敵の重要な戦力を排除せよ！
dialogue_2740=最高指揮部が西南方面軍に命令する：戦線を縮小し、包囲を避け、ドニエプル川の防衛線を頼りに防御せよ。
dialogue_2741=敵軍は包囲網から撤退している。敵軍を撃破するため、いち早く行動せよ！
dialogue_2742=最高指揮部の命令に従い、ハリコフを解放し、第4装甲集団とケンプフ軍支隊を排除するのだ。
dialogue_2743=警戒を怠らず、精力を蓄えよ。次の攻撃に備え、ソ連を完全に崩壊させるのだ。
dialogue_2744=ボホドゥヒウを攻撃し、ハリコフを包囲せよ！
dialogue_2745=くそっ！ソ連軍の兵力を見誤った、ハリコフの守備隊はすぐにドニエプル川防衛線まで撤退せよ。
dialogue_2746=フランス軍主力はドイツ軍の進撃を受け後退、大量の予備兵が北部に移動している。今こそ全力で攻撃を仕掛ける絶好の機会だ。
dialogue_2747=海岸線に沿って進み、ニース方面に攻撃せよ。
dialogue_2748=日本に勝ち目はないが、降伏もしないだろう。全島を占領するまで、油断は禁物だ。
dialogue_2749=ドイツ軍の攻撃は完全に失敗し、解放は目前に迫っている。
dialogue_2750=ドイツ軍部隊を包囲し、ヴィーツェプスクとオルシャを解放せよ。
dialogue_2751=ドイツの守備は徐々に崩れ、ミンスクへの道が開かれようとしている。
dialogue_2752=長くとどまらず、すぐにソ連軍の戦線を突破してスターリングラードへ向かえ。
dialogue_2753=ドイツ軍を食い止めろ。防衛ゾーンを簡単に通過させるな。
dialogue_2754=ソ連軍は崩壊しつつある、敵の防衛網を突破することに集中せよ。
dialogue_2755=イギリス軍はエル・アラメインの周囲に防衛線を築いた。アレクサンドリア港への攻撃ルートは封鎖された。
dialogue_2756=補給は我々の方が有利だ。ドイツの攻勢を食い止め、反撃の準備を整えろ。
dialogue_2757=軍隊の前進は妨げられ、我々は消耗戦に陥っている。
dialogue_2758=ドイツ軍は我々の攻撃を予測していたが、もはや手遅れだ。
dialogue_2759=数的優勢を活かして、津波のような攻撃で敵の守備を決壊させるのだ。
dialogue_2760=ソ連軍が我々への総攻撃を開始した。防衛線が突破されると、オリョールの部隊は包囲される可能性が高い！
dialogue_2761=敵の数があまりにも多い、ブリャンスク方向へ撤退するぞ。
dialogue_2762=カーン南方のドイツ軍陣地は、我々の前進にとって最大の障害となっている。これほど集中的な空爆では、敵も効果的な反撃を起こすのは困難だろう。
dialogue_2763=すべての戦線を攻撃し、カーン南部の各所にある敵の陣地に突撃せよ！
dialogue_2764=連合軍の装甲を恐れるな！敵の戦車は我々に敵わない。防衛の準備を急げ。
dialogue_2765=ドイツ軍の防衛線は牽制され弱まっている。敵陣の突破口を探し、防衛線全体を引き裂くことに集中せよ。
dialogue_2766=出動できる予備兵力はほとんど残っておらず、手持ちの兵力で連合軍の装甲集団を食い止めるほかない。
dialogue_2767=ドイツ軍の主力は崩壊しつつある。ノルマンディー全域を解放し、ドイツ国境に向かって前進するのに時間はかからないだろう。
dialogue_2768=米軍はコブラ作戦を開始した。我々の任務は、彼らの南下作戦に協力し、ドイツ軍を戦線の東側で食い止めることだ。
dialogue_2769=地雷や防衛線をうまく利用して連合軍の攻撃を食い止めよう。

