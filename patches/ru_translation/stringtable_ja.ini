event_intro_437=1944年10月6日、ソ連ウクライナ第2方面軍はデブレツェン作戦を開始し、ルーマニアに駐留していたドイツ・ハンガリー連合軍を撃退した。デブレツェンを奪取し、戦線を160キロメートル前進させた。この戦闘はハンガリーにおけるドイツ軍の軍事力を削弱し、ブダペストへの後続攻撃のための道を開いた。
event_intro_438=1941年10月10日、ドイツ軍第3装甲軍団はカリーニン方面に転進。行軍中にカリーニンを占領し、北西からモスクワを回り込んで北方に攻撃を行い、包囲網を形成する計画を立てた。この情報を受けたソ連軍は、迅速にカリーニン方面軍を編成し阻止。カリーニン防衛戦は12月まで続いた。この戦闘でドイツ軍はカリーニンを占領したが、厳冬とソ連軍の粘り強い封鎖の下で、戦闘力は著しく低下し、戦線はカリーニンに停滞し前進を続けることができなかった。
event_intro_439=モジャイスク防衛線は、モスクワとその西側アプローチを守るため、ソ連が1941年7月末に着手した。しかし10月にドイツ軍がモスクワに迫った時点でも完成に至らず、ドイツ軍は10月13日に防衛線南端のカルーガを初めて攻撃し占領した。これにより、ドイツ軍は防衛線正面に対する攻撃の士気を高めた。その後、数日内にドイツ軍は防衛線上の複数の都市を奪取し、主要な防御区を突破。ソ連軍はこの防衛線での戦闘によってドイツ軍の進撃を止めることはできなかったが、防衛線後方で防御部隊を組織するための時間を稼ぐことができた。
event_intro_440=バルト海作戦の後、北方軍集団はソ連軍にクールラント地区で包囲された。東プロイセンのドイツ軍による包囲網への攻撃を防ぐため、ソ連軍はベラルーシ第3方面軍を派遣。東プロイセンを占領し、現地のドイツ軍を壊滅させた。1944年10月16日、ソ連軍は砲撃の後に攻撃を開始。しかし、東プロイセンの密林や湿地の地形とドイツ軍の防御工事がこれを効果的に妨げる。ソ連軍は連続して半月間戦闘を続け、グンビネンまで戦線を前進させるまでの半月間、部隊の損失が大きく、ついに進撃の継続を断念した。
event_intro_441=日本を南アジアの守備隊から切り離し、補給を奪うために、連合国と日本は1944年10月23日から26日まで、フィリピンのレイテ湾近海で、連合軍と日本軍は第二次世界大戦最大の海戦を戦った。この戦闘の結果、日本海軍の最後の戦力は完全に壊滅し、中部太平洋における制海権と制空権は完全に奪われた。
event_intro_442=第二次エル・アラメインの戦いは、第二次世界大戦の北アフリカ戦線における転換点であり、スターリングラード戦役やガダルカナル戦役とともに、連合国が戦略的反攻に転じたことを示すものであった。この戦役は1942年10月23日から11月3日まで続いた。連合軍は、兵力と戦車の数での優位性と絶対的な制空権を活かして枢軸国軍を打ち破り、彼らをチュニジアへ撤退させることに成功した。
event_intro_443=ギリシャ・イタリア戦争は、1940年10月28日から1941年4月23日まで発生した軍事衝突であり、第二次世界大戦におけるバルカン戦役の始まりを示すものであった。イタリア軍は領土拡張のため、アルバニアからギリシャに侵攻したが、ギリシャ軍の反撃に遭い撤退を余儀なくされた。12月中旬までにギリシャ軍はアルバニア領の25%を占領した。しかし、4月6日にドイツ軍がユーゴスラビアとギリシャに侵攻すると、イタリア軍は再び攻勢に転じた。
event_intro_444=ブーゲンビル島の戦いは、1943年11月1日から1945年8月21日まで、ソロモン諸島近くのブーゲンビル島で連合軍と日本軍の間で行われた一連の戦闘である。この戦いは二つの段階に分けられ、第1段階は1943年11月から1944年11月まで続き、米軍がトロキナ海岸に上陸し、周辺地域を掌握した。第二段階では主にオーストラリア軍が中心となり、抵抗を続ける日本軍を掃討する作戦が行われた。
event_intro_445=1943年11月3日、ソ連軍はキエフの南北両端の橋頭堡で長らく準備を整え、キエフに対し激しい攻勢を開始する。キエフ市内のドイツ軍は急いで対応したが、強力な攻撃の前にキエフから撤退せざるを得なかった。ソ連軍はその勢いを利用して追撃、キエフ、ジトーミル、およびその周辺の右岸地域を解放した。この戦役は、ソ連が東部戦線でさらなる勝利を収めたことを示し、後の反攻作戦の基礎を築くとともに、ドイツ軍の士気に大きな打撃を与えた。
event_intro_446=ソ連の「第二戦線開設」の要求に応えるため、連合軍はフランス領北アフリカを占領し、北アフリカの枢軸国軍を牽制する計画を立てた。1942年11月8日、イギリスとアメリカの連合軍はカサブランカ、オラン、アルジェに向けて三方向から上陸攻撃を開始した。現地のヴィシー政権下のフランス軍は抵抗できず、11月16日までにこれら3つの都市はすべて連合軍に占領された。この占領は、その後の北アフリカにおける連合軍の作戦において、重要な後方支援拠点となった。
event_intro_447=イタリア軍の地中海での海上戦力を弱体化させるため、イギリス軍は空母を使用して、ターラントに停泊しているイタリア主力艦隊を壊滅させる計画を立てた。作戦は1940年11月11日夜に開始され、イタリア艦隊は一夜にして主力戦艦の半数を失った。この攻撃は、航空母艦搭載機による海軍艦艇への初めての攻撃であり、戦艦の大砲に対する海軍航空兵の優位性を見事に示した。さらにこの戦いは日本軍による真珠湾攻撃の作戦計画にも影響を与えることとなる。
event_intro_448=1942年11月12日から15日にかけて、連合軍と日本軍はガダルカナル島周辺で4日間にわたる海戦と空戦を繰り広げた。日本軍はガダルカナル島守備隊を増援し物資を輸送しようとしたが、連合軍は最終的にこれを阻止することに成功。この戦いの後、日本軍はガダルカナル海域での夜間通行の自由を失い、ヘンダーソン飛行場を奪取の機会を逃してしまった。
event_intro_449=1941年11月18日、トゥブルクで包囲されていた連合軍部隊を救出し、北アフリカにおけるドイツ・イタリア軍の戦力を弱体化させるため、イギリス連邦軍はリビアのドイツ・イタリア軍に対して大規模な攻勢を開始した。激しい戦闘と多大な損失にもかかわらず、イギリス連邦軍は最終的に包囲を破り、ドイツ・イタリア連合軍を撤退させることに成功。この作戦は北アフリカにおける連合国軍の重要な勝利となり、その後の攻勢の礎となった。
event_intro_450=1941年11月17日から12月2日にかけて行われたロストフの戦いは、独ソ戦において赤軍が初めて成功を収めた攻勢の一つであり、モスクワの戦いと並んで、1941年冬におけるドイツ軍の東部戦線での攻勢停止をもたらした。この戦いでは、ドイツ軍が一時的にロストフを占領したが、守備隊の反撃とソ連軍による包囲作戦によって、最終的にドイツ軍はロストフを放棄した。
event_intro_451=1942年11月25日から12月20日にかけて、ソ連軍はルジェフ突出部に固守するドイツ第9軍を壊滅させるため、複数の方向から攻勢を仕掛けた。この作戦でソ連軍は敵を一挙に殲滅しようとした。しかし、この戦いはソ連軍が期待した結果をもたらさなかった。ソ連軍はドイツ軍よりも大きな人員と装備の損失を被り、わずかな陣地しか奪取できなかった。このため、この戦いについてほとんど言及されない時期が長く続いた。
event_intro_452=冬戦争は、第二次世界大戦初期にソ連とフィンランドの間で勃発した戦争であり、1939年11月30日にソ連がフィンランドに侵攻し始まった。最終的にソ連はフィンランドに対し惨勝で終わった。 終戦の交渉において、フィンランドはソ連に対して一部の領土を譲渡し租借した。1940年3月13日に、両国は「モスクワ平和協定」を締結し、戦争が終わる。
event_intro_453=1941年12月1日、ドイツ軍中央軍集団は再びナロ＝フォミンスク方面に向けて攻撃を開始し、中部防線を突破しようとした。ドイツ軍の攻撃開始時、ソ連軍は主に防御陣地を装備するだけであり、これによりドイツ軍は迅速に防線を突破し数キロメートル進撃した。しかし、ソ連軍は直ちに前線予備隊を動員し反撃を組織。12月5日までに、ソ連軍は戦線を元の位置に押し戻し、モスクワへの最後の突入を粉砕した。
event_intro_454=1941年12月5日、ドイツ軍がモスクワ戦役で防御に転じると、ソ連軍のカリーニン方面軍は自ら積極的にカリーニンに攻撃を仕掛け、その解放を試みた。ドイツ軍は初めは頑強に抵抗し、ソ連軍の進撃は遅々として進めなかったが、厳しい寒さと補給不足が最終的にドイツ軍を撤退させた。12月16日にはカリーニンが解放され、カリーニン方面軍はその勢いを利用して多くの重要な陣地を奪回した。

