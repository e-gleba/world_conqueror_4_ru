event_stage_intro_20801=ドイツ軍はマジノ線を奇襲で迂回し、低地諸国も次々と陥落した。司令部は「ダイナモ作戦」を発動し、我々にフランス軍主力と遠征軍がダンケルクとカレー方面へ撤退するのを全力で掩護するよう命じた。この武力が尊ばれる時代、宥和政策の悪果は我々自身で背負うしかない。前方がどれほど険しくとも、我々は命令を堅く遂行する！一族の名誉のために！共に戦う仲間のために！イギリス空軍のために！大英帝国のために！
event_stage_intro_20802=我々は最良の撤退機会を逃してしまった。アルフレッドは空中戦でパラシュートを使って無事に脱出したが、生死は不明だ。しかし、ある者が密かに目撃情報を提供してくれた——アルフレートと他の捕虜となった仲間たちは、山間の小さな町に一時的に収容され、間もなくベルリンに移送されるという。時間は残されていない。情報の確実性がどれほど不明であろうと、試みなければならない。仲間を見捨てるわけにはいかない。
event_stage_intro_20803=連合軍の西部戦線での敗北は、地上戦こそが現代戦争において最も重要な要素であり、装甲部隊こそが地上戦の要であることを証明した。今、陸軍が北アフリカ戦線で撤退している状況は、かつてのヨーロッパ戦線を彷彿とさせるものだ。しかし異なる点は、ドイツ軍の攻勢は依然として迅速だが、装備と兵員の補給面ではこちらが優位に立っていることだ。我が装甲師団は北アフリカ戦線で無敵の進撃を遂げるだろう。
event_stage_intro_20804=偽装作戦が功を奏し、ドイツ軍のノルマンディーでの防御工事はまだ完成していない！目の前のゴールド・ビーチにも敵の重火器は見当たらない。絶好の機会が訪れた！私は迅速に浜辺に陣地を確保し、友軍の上陸のために道を開く。共に戦い、勝利を取り戻す時が来たのだ！
event_stage_intro_20805=なぜドイツ軍がこれほどの兵力で大規模な攻勢を仕掛けることができるのか？バストーニュの守備隊は包囲網の中に閉じ込められており、撤退の可能性はほぼない。援軍が敵の動向を予測し、迅速に我々を支援しない限り、我々は最後の望みをイギリス軍に託すしかない。
event_stage_intro_20806=戦争は世界の勢力図を完全に塗り替え、米ソの二極が新たな覇権を握った。植民地は次々と独立し、帝国の領土は縮小の一途を辿り、かつての栄光は過去のものとなった。新政府の指導下で、我々は遅かれ早かれアメリカの属国に成り下がるだろう。しかし、目の前には迫り来る脅威がある——ソ連軍がメキシコ東部を占領し、陸路で北上しアメリカ侵攻を目論んでいる。新時代の戦争はすでに幕を開けた。我々は帝国の最後の尊厳を守るため、自らの武装勢力を持つのだ。
event_stage_intro_20807=遺跡の発見は米ソ双方の注目を同時に引きつけた。その画期的な武器と技術は、世界全体を揺るがすほどの力を秘めており、今や彼らも行動を開始した。しかし、謎の信号に導かれた我々の先遣隊が一歩先んじて、南米の遺跡群を発見した。あの者たちが何者であれ、その目的は私と同じように思える——現状を打破し、新たな世界秩序を築き上げることを目指しているのだ。
event_stage_intro_20811=ドイツ軍はマジノ線を奇襲で迂回し、低地諸国も次々と陥落した。司令部は「ダイナモ作戦」を発動し、我々にフランス軍主力と遠征軍がダンケルクとカレー方面へ撤退するのを全力で掩護するよう命じた。この武力が尊ばれる時代、宥和政策の悪果は我々自身で背負うしかない。前方がどれほど険しくとも、我々は命令を堅く遂行する！一族の名誉のために！共に戦う仲間のために！イギリス空軍のために！大英帝国のために！
