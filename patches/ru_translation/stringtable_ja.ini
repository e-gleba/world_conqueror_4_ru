skill_info_160=部隊が駐守する都市の経済産出が100以上の場合（将領が「不屈の自己鍛錬」または「軍需調度」を有する場合は70以上）、ターンごとの経済収入が+[#00FF00#%d]となる。
skill_info_161=空襲を指揮してクリティカルを発動した際、与えるダメージ+[#00FF00#%d%%]。

disband=部隊解散
disband_the_army=部隊は解散すると消滅します。続けますか？


dialogue_3536=君たちの部隊に物資を継続的に支援するつもりだ。
dialogue_3537=準備を整えろ！これからの一連の戦いは、これまでのどの戦役よりも苛烈になる。
dialogue_3538=見覚えがあるか？こんな光景が、今この瞬間も世界各地で繰り広げられている。次はお前たちかもしれない。
dialogue_3539=敵は決して無敵ではない、反撃は今から始まる！
dialogue_3540=敵はあらゆる方向から攻撃を仕掛け、多くの都市がすでに陥落している。
dialogue_3541=自分には自由を追い求める力と勇気があることを、必ず皆に証明してみせる！
dialogue_3542=司令部は敵軍の部隊や兵器装備に関する大量の情報を受け取った。これらの資料を提供した指揮官も、今後の作戦で我々と肩を並べて戦うことになる。
dialogue_3543=これが私たちのすべての精鋭だ。君が何をすべきかは分かっているだろう。
dialogue_3544=我々には敵の進撃を止める力がない。
dialogue_3545=まず極東の基地へ撤退し、そこにいるソ連軍の動向を監視せよ。
dialogue_3546=アルフレッドが提供した情報によれば、スマトラ島の敵軍防御はさらに手薄だ。
dialogue_3547=ここで奇襲を仕掛け、オズボーンを牽制する。
dialogue_3548=この程度の兵力でシンガポール方面への攻撃を敢行するとは、英軍の動きは実に怪しい。
dialogue_3549=核施設周辺の防衛線を死守せよ！ソ連軍にそこを占領させてはならない！
dialogue_3550=我々は海上から攻撃を開始し、敵の退路を封鎖する。
dialogue_3551=速やかに上陸作戦を実施し、南部の敵軍を殲滅する。ここから北への反攻を開始するのだ。
dialogue_3552=時勢を見極める者こそ俊傑であり、機を読み変化に対応する者こそ英雄だ。我々の戦いはまだ終わっていない。
dialogue_3553=私に選択の余地はない。お前たちがそうさせた。
dialogue_3554=海岸線に沿って進撃せよ！ 友軍と協力し、沿岸の守備隊を包囲殲滅するのだ。
dialogue_3555=敵海軍の主力はここにはいないようだ。ここにいる敵艦隊をすべて殲滅する。
dialogue_3556=援軍が来るまで、私はこの場所を死守する。
dialogue_3557=お前たちの勝利には何の意味もない。我々は必ず再び現れる。
dialogue_3558=黒蠍基地のデータが無事に復元された。しかし、オズボーンに関する情報は見つからなかった。
dialogue_3559=アルフレッド、これまでの戦役で君は自らの価値を示してくれた。君なら必ずオズボーンを完全に片付ける方法を見つけられると信じている。
dialogue_3560=お任せください。
dialogue_3561=時は来た、作戦を開始する。
dialogue_3562=黒蠍はすでに敗北を経験している。おそらく二度や三度ではないだろう。
dialogue_3563=なぜお前がここにいる？
dialogue_3564=お前の結末を見届けるためだ。我々全員を犠牲にしてでも到達しようとした、その結末を。
dialogue_3565=お前の願いは私が代わりに果たす。
dialogue_3566=私はお前だ。またあちら側で会おう。
dialogue_3567=私は自分の判断を決して疑わない。
dialogue_3568=敵軍の戦闘力は私の予測をはるかに超えている。
dialogue_3569=天命に逆らうことはできない。
dialogue_3570=我々の戦いはまだ終わっていない。
dialogue_3571=作戦を中止し、撤退する時だ。
dialogue_3572=ここまでだ。
dialogue_3573=米ソの支配的地位はいまだ揺るがない。
dialogue_3574=情報は何度も誤っていた。これからは戦場の状況を自ら判断するしかない。
dialogue_3575=アルフレッド、お前はすべてを終わらせたつもりだろうが、結局何も終わってはいない。
dialogue_3576=施設はすでに起動している。立ち去る準備はとっくにできている。もう一人の私よ、さらばだ。
dialogue_3577=ここにある施設は、ただ君をスキャンし、新しいお前を創り出すだけだ。そしてこれまでのすべてを完全に継承する。
dialogue_3578=だがお前は旧き世界の残滓にすぎない。私と共にここで消え去るだろう。
dialogue_3579=お前が正しいのかもしれない。しかし、たとえ最悪の悪夢の中にあっても、私は私であると信じている。
dialogue_3580=またすぐに再び会うことになるだろう。
dialogue_3581=始めてくれて構わない。
dialogue_3582=この真実を私たちは遺憾に思う。
dialogue_3583=残存する敵軍を完全に殲滅し、南極基地を奪還せよ！


