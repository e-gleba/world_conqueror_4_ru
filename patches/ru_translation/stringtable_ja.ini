legend_stage_50101=クフラ奇襲
legend_stage_50102=ボクシング作戦
legend_stage_50103=ファレーズ包囲戦
legend_stage_50104=パリ解放
legend_stage_50105=ドンペールの戦い
legend_stage_50106=ストラスブール突進

legend_intro_50101=ルクレール師団の物語は、ひとりの男の揺るぎない愛国心から始まった。1940年、ルクレールは北アフリカに到着し、チャド総督を説得して「ルクレール縦隊」を創設することに成功した。自由フランスの名を高く掲げるため、1941年、彼は部隊を率いて砂漠を横断し、イタリア軍が掌握していたリビア・クフラ飛行場への奇襲を敢行する。クフラ飛行場を占領した後、ルクレールは兵士たちを集め、いつか必ずフランス国旗をストラスブールに掲げると誓いを立てた。この誓いこそが、のちに語り継がれる伝説の幕開けである。
legend_intro_50102=北アフリカにおける自由フランス軍の度重なる勝利により、「ルクレール縦隊」の名声はさらに高まっていった。こうして1943年、ルクレール縦隊は増強を受け、イギリス第8軍に編入されてチュニジア戦役に参加することとなった。メドニンの戦い、そしてマレス防衛線の戦いでは、ドイツ装甲部隊の激しい攻勢が続いたが、ルクレール縦隊はこれを見事に防ぎ切った。その後、縦隊は連合軍とともに進撃を続け、ついにはチュニジアへ突入。こうして北アフリカ戦役は決定的な終結を迎えるのであった。
legend_intro_50103=北アフリカ戦役の後、「ルクレール縦隊」はフランス第2機甲師団へと再編され、引き続きルクレールが率いることとなった。この部隊は「ルクレール師団」とも呼ばれ、1944年にはついにフランス本土へ向けて出発し、かつて誓った約束を果たすための道を歩み始めた。ファレーズ包囲戦では、第2機甲師団はパットン第3軍とともに南側から包囲網を形成し、ドイツ第9装甲師団をはじめとする多くの部隊を壊滅寸前に追い込んだ。これらの戦果は、フランス解放に向けた重要な土台となったのである。
legend_intro_50104=ファレーズ包囲戦が終結すると、「ルクレール師団」はすでにパリへと至る位置に迫っていた。パリを一刻も早く解放するため、ルクレールは連合軍上層部に強硬に進軍許可を求め、政治的な調整を経てついに承認を得ることに成功した。ルクレールはただちに、すでに蜂起の始まっていたパリへ向けて行軍を開始する。8月24日、「ルクレール師団」は市内のレジスタンスと連携し、ついにパリへ突入。翌25日、ドイツ守備軍は連合軍の圧力の下で降伏し、自由の旗は再びパリの空に翻ったのである。
legend_intro_50105=パリを奪還した後、ルクレール師団はアルザス＝ロレーヌ地域の解放作戦に投入されることとなった。9月初旬、経験不足のドイツ第112装甲旅団は、第2機甲師団がアメリカ軍の航空支援を受けて仕掛けた一連の待ち伏せ攻撃を受ける。フランス機甲師団とアメリカ軍爆撃機の連携攻撃により、ドイツ旅団の大部分は壊滅し、味方側の損害はごくわずかであった。この打撃によりドイツ軍は撤退を余儀なくされ、予定されていたロレーヌ反攻は大きく遅れることとなった。
legend_intro_50106=11月22日、連合軍司令部の正式な承認を受け、フランス第2機甲師団はフランス第1軍とともにストラスブールへの総攻撃を開始した。第2師団はサヴェルヌ峡谷を強行突破し、大胆な前進を続けることでアルザス北部におけるドイツ軍の防衛線を崩壊させた。そして1944年11月23日、ついにストラスブールを解放。これはまさに、クフラの地でルクレールと兵士たちが立てた「クフラの誓い」が果たされた瞬間であった。

synergy_tactics_5_1=・すべての「ルクレール師団」ユニットは攻撃後、周囲2マス以内の「ルクレール師団」ユニットに1ターンの「復国の誓約」を付与する；復国の誓約：混乱状態にならない。
synergy_tactics_5_2=・戦闘鼓舞：「ルクレール師団」の装甲ユニットが「復国の誓約」状態で敵軍を主动撃破した場合、周囲2マス以内の「ルクレール師団」ユニットの士気が1段階上昇（各ユニット1ターンに1回）。
synergy_tactics_5_3=・内外策応：「ルクレール師団」の砲兵ユニットが「復国の誓約」状態で都市または要塞を攻撃する際、攻撃対象の周囲1マス以内に「ルクレール師団」の歩兵または装甲ユニットが存在する場合、与えるダメージが10%上昇。
synergy_tactics_5_4=・援護追撃：「ルクレール師団」の歩兵ユニットが「復国の誓約」状態で攻撃を行った際、周囲2マス以内の「ルクレール師団」部隊のこのターンの行動力＋5。

dialogue_4204=フランス本土はドイツの手に落ちた。だが、いつの日か必ず我らの祖国を取り戻す。
dialogue_4205=イタリア軍はクフラに軍用飛行場を置いている。敵の手から奪取し、フランスの不屈を世界に示すのだ。
dialogue_4206=イタリア軍部隊は要塞に籠り、援軍を呼ぼうと試みている。
dialogue_4207=敵軍は兵力を要塞内へ撤収した。制圧を維持し、援軍を呼ばせるな。
dialogue_4208=イタリア軍は抵抗を放棄し、フランス軍との降伏協定に応じた。その後、ルクレールはクフラで「クフラの誓い」を立てた。
dialogue_4209=宣誓する。我らの旗、我らの美しき旗が、ストラスブール大聖堂の上空にはためくその日まで、決して武器を置かぬことを。
dialogue_4210=報せによると、ドイツ第9装甲師団が明日、クサール・ギラーヌから攻撃してくる。部隊は80キロ後方へ下がって攻撃を避けるべきだ。
dialogue_4211=ダメだ。今退けば、撤退中に追撃される。私の部隊は現陣地に拠って防御する。ただし、空軍の支援が必要だ。
dialogue_4212=追撃しろ！逃がすな！
dialogue_4213=来たか。有効射程に入ったら攻撃開始だ。
dialogue_4214=よくやった！これから部隊が通過してくる。側面をしっかりと援護し、共にテバガ峠を攻撃せよ。
dialogue_4215=テバガ峠が落ちただと？敵に包囲される前に、直ちに撤退するのだ。
dialogue_4216=北へ進み、アルジャンタンでカナダ軍と合流する。ドイツ軍を袋の中に閉じ込めろ！
dialogue_4217=前進だ！より多くの領土を解放せよ！
dialogue_4218=第352歩兵師団をアランソンへ回せ。連合軍の進撃を止めるんだ。
dialogue_4219=アランソンの占領に成功した。ドイツ軍の重要補給拠点を奪ったことで、敵は反撃計画を放棄し、防御へと転じた。
dialogue_4220=第116装甲師団をアルジャンタンへ回せ。撤退路を確保しろ。
dialogue_4221=ポーランド第1装甲師団がオルメール山稜に陣地を築くことに成功し、ドイツ軍の最後の脱出口を塞いだ。
dialogue_4222=指揮権は私に移った。B軍集団へ告ぐ：陣地を捨て、東へ撤退する。援軍が全力で支援に向かう。
dialogue_4223=フランス軍の強い働きかけにより、連合軍はついに第2機甲師団とアメリカ第4歩兵師団の共同行動を承認した。パリのレジスタンスを支援し、ワルシャワ蜂起の悲劇を二度と繰り返させないためだ。
dialogue_4224=もうアメリカ軍を待つ必要はない。急いで突入する！パリの蜂起軍はすでに動き始めている。孤立させるわけにはいかない！
dialogue_4225=ルクレール師団はパリ郊外に到達し、パリのレジスタンスとの連絡を確保した。
dialogue_4226=郊外の防衛線を突破し、ドイツ軍に見せつけろ！パリの民に伝えろ、我々が来たと！パリは自由を取り戻す！
dialogue_4227=第4歩兵師団が急速にパリへ進んでいる。フランス軍だけに功績を独占させるわけにはいかない。
dialogue_4228=ドイツ守備隊は総司令部からの命令を受けた。パリを死守せよ。廃墟にならぬ限り、敵に渡してはならないと。
dialogue_4229=こんなのは道連れだ。まずあの狂人を止めろ。本部に返信しろ、命令には従うと。
dialogue_4230=我々は連合軍と降伏条件を交渉する。他人のために死ぬつもりはない！
dialogue_4231=ドイツのパリ守備隊はついに連合軍との交渉に応じ、降伏した。市内の戦闘は終結したが、郊外の守備隊はこの知らせを知らず、なお連合軍と交戦を続けている。
dialogue_4232=パリは辱められ！パリは破壊され！パリは苦しめられた！だが、パリはついに自由を取り戻した！
dialogue_4233=報せによると、敵がミルクール支援のため精鋭装甲旅団を派遣してきている。急いでドンペールへ向かい、援軍を阻止しよう。
dialogue_4234=ミルクールの状況は危機的だ。前線を急ぎ支援しなければならない。
dialogue_4235=ヴィテルのドイツ軍が進路を塞いできた。早く片をつけろ。援軍が来れば形勢が一気に不利になる。
dialogue_4236=援軍が到着する前に、ドンペールを占領した。空軍に伝えろ：空襲支援の準備だ。ここで敵を殲滅する。
dialogue_4237=遅くなった。急いでミルクールを支援せよ、アメリカ軍に内外から挟撃させるわけにはいかない！
dialogue_4238=今だ、撃て！
dialogue_4239=掩蔽を取れ！自由射撃で応戦しろ！
dialogue_4240=包囲された！戦車を捨てて全力で撤退だ！
dialogue_4241=攻撃を続けろ。モーゼル川西岸のドイツ軍を殲滅する！
dialogue_4242=ストラスブールは目前だ。誓いがついに果たされる。兵たちよ、戦え！フランス万歳！
dialogue_4243=ヴォージュ山脈は重兵に守られている。裏へ抜けるため、無警戒の小道を探し出すぞ。
dialogue_4244=後退してヴォージュ山脈に入れ。敵はここを突破できん！
dialogue_4245=どうやってヴォージュ山脈を突破したんだ！
dialogue_4246=厄介な相手はアメリカ軍に任せろ。全力でストラスブールへ突っ込む！
dialogue_4247=ストラスブールへ電報だ！ヴォージュ山脈が突破された。防衛を固めろ！
dialogue_4248=ストラスブールは解放された！ついに誓いを果たしたぞ！
dialogue_4249=周囲の拠点を押さえろ。ストラスブールを失うわけにはいかない！
dialogue_4250=ヴォージュ山脈への圧力を維持しろ。ドイツ軍に後方支援をさせるな！
dialogue_4251=イタリアの援軍が動き始めた。
dialogue_4252=クサール・ギラーヌの空気は、今ごろ間違いなく張りつめているはずだ。あのルクレールは善人だった。だがもう終わりだ。もう彼に会うことはない。
dialogue_4296=敵が完全な制空権を掌握した。ここは防御不能である。至急撤退せよ。
dialogue_4297=イタリア守備軍は援軍を求めるのを諦め、要塞に立てこもっている。
dialogue_4298=火力を強化し、やつらの抵抗意志を打ち砕け！
dialogue_4299=パリに駐留するドイツ守備軍は連合軍に降伏し、都市は解放された。しかし、郊外のドイツ軍は情報を受け取っておらず、依然として連合軍と交戦中であった。



