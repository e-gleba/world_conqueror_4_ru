feat_desc_116=3マス以内の{1}つのターゲットを選択してロケット砲を発射する。一定のダメージを与えるとともに、ターゲットの防御を{2}%低下させる。2ターン継続。クールダウン3ターン。
feat_desc_116_Lv2=3マス以内の{1}つのターゲットを選択してロケット砲を発射する。一定のダメージを与えるとともに、ターゲットの防御を{2}%低下させる。2ターン継続。クールダウン2ターン。
feat_desc_116_Lv3=4マス以内の{1}つのターゲットを選択してロケット砲を発射する。一定のダメージを与えるとともに、ターゲットの防御を{2}%低下させる。2ターン継続。この攻撃ではターゲットの装甲を50%無視する。クールダウン2ターン。
feat_desc_117=ターゲットのHPが{1}%以上の場合、この攻撃は必ず会心になる。
feat_desc_118=各ターン開始時にHP上限の{1}%を回復。HPが50%以上の場合、被ダメージが{2}%軽減される。
feat_desc_119=攻撃または反撃時、{0}%の確率でターゲットを混乱状態にする。2ターン継続。
feat_desc_120=攻撃時に双砲身からそれぞれ1発ずつ砲弾を発射する。各砲弾は独立して目標に命中し、各自{1}%の基礎ダメージを与える。

