event_stage_intro_20316=硫黄島での日本の大虐殺は、我々を止めることはできない。沖縄はより複雑で、より多くの守備兵がいるだろう。しかし、敵も同様に、本土からの援軍は来ないだろう。一歩一歩、慎重に進もう。
event_stage_intro_20317=日本は核攻撃を受けたにもかかわらず、降伏を拒否した。司令部はダウンフォール作戦決行し、日本本土に上陸して戦うことを決定。ソ連軍も北方同時攻撃で我々に協力する。これは我々の最後の戦いであり、勝利はすべての連合軍兵士の手中にある！
event_stage_intro_20401=イタリアを戦争から撤退させるため、司令部は地中海における枢軸国軍の排除を優先することを決定した。空海の優勢を利用し、上陸部隊とともにシチリアを占領するのだ。
event_stage_intro_20402=イタリア政府はすでに我々と降伏に関する事項を内密に協議しているが、ドイツ軍は至る所のイタリア軍をすでに掌握している。この降伏を利用して、イタリア国内のドイツ軍を一挙に壊滅させよ。
event_stage_intro_20403=欺瞞作戦は功を奏し、ノルマンディーにおけるドイツの要塞はまだ完成していない。我々はヨーロッパに新たな戦場を開き、戦況を一変させる寸前にいる。
event_stage_intro_20404=ノルマンディーのドイツ軍は敗走し、フランス国内の敵の防衛線は着実に解体され、連合軍の主力部隊がフランスに集結しようとしていた。補給問題を解決するため、司令部は南フランスに新たな補給線を開設することを決定した。
event_stage_intro_20405=上陸作戦の後、作戦は順調に進み、司令部はドイツ内陸部への道を開くことを期待した。地上部隊は空挺部隊とうまく連携し、ドイツ軍にとっての天然の障壁であるライン川を一気に突破するのだ。
event_stage_intro_20406=ドイツの大規模な攻勢は我々を驚かせた。しかし、悪天候も同様に、ドイツの進撃速度を制限した。我が軍は予定より早く北上し、全速力で戦場に向かっている。この前哨基地の攻略に備えるのだ。
event_stage_intro_20407=ドイツ軍は精鋭部隊を失ったが、それでも最後の兵力をベルリンに集めて死闘を繰り広げた。ベルリンをソ連に任せ、ソ連を迎え撃つために全速力で東へ進軍し、ドイツ軍を一網打尽にせよ。ベルリンの運命はすでに決まっていたのだ。
event_stage_intro_20411=イタリアを戦争から撤退させるため、司令部は地中海における枢軸国軍の排除を優先することを決定した。空海の優勢を利用し、上陸部隊とともにシチリアを占領するのだ。
