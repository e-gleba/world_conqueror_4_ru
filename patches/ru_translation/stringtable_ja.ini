feat_desc_84_Lv4=直線を指定して最大{1}マス前進（目標マスは空き地でなければならず、空中空中停止状態のユニットで妨害される）通過地点に掃射ダメージを与える。クールダウン1ターン。掃射で敵を撃破した場合、もう一度掃射圧制を発動可能。各ターン最大{2}回まで
feat_desc_85_Lv2=空母の1ヘクス圏内で離陸可能。地形による行動力の制限を無視。地雷・水雷の影響を受けない。攻撃時に敵は反撃不可。HPが減少しても戦闘力は下がらない。陸上ユニットへのダメージ+{1}%
feat_desc_89_Lv3=7マス以内に現在地から目標地点までのトンネルを掘削可能。目標地点は山地・海洋であってはならず、海洋を通過できない。友軍の歩兵・装甲車・軽戦車・中戦車・野戦砲・榴弾砲・ロケット砲が通行可能。通行時に追加行動を得る。1本のトンネルで最大5回使用可能。新たなトンネルを掘ると旧トンネルは消失。クールダウン2ターン。
feat_desc_90_Lv4=周囲2マス以内の建物のHPを毎ターン{1}回復、1ターンに1回のみ発動
feat_desc_92_Lv4=攻撃範囲＋1、HPを{1}失うごとに攻撃力＋{2}
feat_desc_93_Lv4=HPが減っても戦闘力は低下しない。瀕死時、HPは1以下にならない。3ターン継続、クールダウンは{2}ターン。防護装置が終了するとHPを30%回復する
feat_desc_94_Lv4=自身または友軍領地内にいる時、与ダメージが{1}%増加し。このターン最初の攻撃時、攻撃範囲+1
feat_desc_95_Lv4=特殊地形による移動制限を無視。攻撃・反撃時に地形によるダメージ軽減を無視し、敵の防御力と行動力を{1}%減少。2ターン継続。
feat_desc_96_Lv4=受ける直接ダメージを自身と周囲の友軍で分担。{1}ダメージを分担または回避するごとに基礎攻撃力が{2}増加し、攻撃力増加の上限は300%。3ターン継続。
feat_desc_97_Lv4=空軍の攻撃を受けた際、{1}%の確率でダメージを回避
feat_desc_98_Lv4=潜行状態に入る。陸軍・海軍からの能動的な攻撃を受けない。クールダウン2ターン。潜行中は行動力+{1}、1ターン継続。攻撃しても潜行状態は解除されない。
feat_desc_99_Lv4=攻撃時に反撃されない。部隊を攻撃する際のダメージが{1}%増加（潜行中は{2}%増加）、建物を攻撃する際のダメージが50%減少
feat_desc_100_Lv3=ヘリを呼び、9マス以内の指定位置に移動する。クールダウン2ターン。輸送機で輸送される際、輸送機の使用回数を消費しない（1ターンに1回のみ）
feat_desc_102_Lv4=このターン、クリティカル率が{1}%増加し、攻撃時に敵の防御力を{2}%無視。ターン内に敵を1体撃破するたびに会心率＋4%。クールダウン2ターン。
feat_desc_103_Lv4=防御力が{1}%増加すると、空軍ユニットから受けるダメージを{2}%減少する
feat_desc_105_Lv4=空母艦載機として使用可能。攻撃時、目標エリアに追加で{1}%のダメージ効果を与える。
