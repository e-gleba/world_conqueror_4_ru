;战役对白
;__font_type[font_text_1,font_text_2]
dialogue_1001=指揮官閣下、これからはゲームの基本操作方法についてご紹介します。
dialogue_1002=白い丸はこの部隊がまだ行動できるということを表しています。
dialogue_1003=部隊をタッチすれば操作できます。点滅するエリアは部隊の移動できる範囲で、赤い丸は攻撃できるターゲットです。敵の地雷を踏むと HP が減少します。
dialogue_1004=建物により生産できる部隊も違います。建物のレベルが高ければ生産できる部隊のタイプも多くなります。
dialogue_1005=部隊を作ることにより物資は消耗されます。ユニットによれば編成できる数も違います。
dialogue_1006=自分の部隊に雇用した将軍を派遣して部隊の戦闘力を増やすことができます。
dialogue_1007=間違った所に移動させた部隊を直ちに帰還させることができます。
dialogue_1008=ご注意：ここは重要な拠点です。ここを制圧する或は制圧されることは戦争の結果に直接影響します。
dialogue_1009=右下の小さな砂時計をタッチすると次のターンに切り替えることができます。
dialogue_1010=指揮官閣下、自分の軍事キャリアを始めてください！
dialogue_1011=指揮官閣下、これからは他の戦術についてご紹介します。
dialogue_1012=士気の上下は部隊の戦闘力に直接影響します。挟み撃ちや包囲されたら部隊の士気に大きな影響が出ます。
dialogue_1013=部隊が混乱状態に陥ったら、戦闘力を失います。
dialogue_1014=敵ユニットを消滅すると、敵からの反撃は受けません。
dialogue_1015=防御施設は敵の攻撃を有効に防げます。しかし、防御施設は自分の領地でしか作れないし、建造するのに時間がかかります。
dialogue_1016=対空施設は空襲やミサイルによるダメージを大幅に減少できる。
dialogue_1017=都市を占領するには都市のHPを0まで下げなければなりません。
dialogue_1018=都市の規模がLV3に到達すれば、ランドマーク建造物を建造することができます。ランドマーク建造物は都市に特殊な効果を与えます。
dialogue_1019=都市の情報欄で敵都市の詳しい情報を確認できます。
dialogue_1020=指揮官閣下、自分の軍事キャリアを始めてください！
dialogue_1021=指揮官閣下、これからは他の戦術についてご紹介します。
dialogue_1022=地形は戦闘に影響をもたらしてくれます。山地または森林にいる部隊が、敵の装甲や火砲からのダメージを受ける際、一部のダメージを減免できます。
dialogue_1023=空港を有する都市で敵部隊に空襲を仕掛けたり、部隊を降下させたりすることができます。
dialogue_1024=核施設を有する都市を占領すれば原爆を生産できるようになります。
dialogue_1025=核兵器をミサイルに搭載すれば敵部隊により大きなダメージを与えられます。
dialogue_1026=陸ユニットが水エリアに入る時、輸送船を搭乗しなければならないので、部隊の戦闘力は下がります。
dialogue_1027=軍港で海軍を生産できます。
dialogue_1028=指揮官閣下、自分の軍事キャリアを始めてください！

dialogue_1029=敵部隊を撃破するには、HPをゼロにする必要があります。
dialogue_1030=指揮官閣下、これよりその他の戦術をご提案いたします。
dialogue_1031=ほとんどの精鋭部隊はアクティブスキルを持ちます。例えば、衛生兵はスキルを使って仲間を回復できます。
dialogue_1032=緑のエリアを占領または破壊すると、特定のイベントが発生したり、特定のスキルが解放されます（HQで習得可能）。
dialogue_1033=工兵部隊が掘削したトンネルにより、歩兵と大半の装甲自走砲が通過でき、戦場での迅速な再配置が可能になります。
dialogue_1034=トンネル通過時に部隊が移動できない場合、追加行動を獲得できます。各トンネルの発動回数には制限があります。
dialogue_1035=青い円は撤退ポイントを示し、赤い円の主要目標のみがその撤退ポイントで撤退できます。
dialogue_1036=指揮官閣下、あなたの軍歴が今、始まります。重要目標を護衛し、速やかに戦場から撤退しましょう！

dialogue_1037=指揮官閣下、これより部隊配置の操作についてご説明いたします。
dialogue_1038=半透明のマスにのみ部隊を配置することができます。画面下部には、戦場に投入可能な部隊とその数が表示され、灰色で表示されているものは、当該ステージで出撃できない部隊です。
dialogue_1039=一度クリックすると単一編成の部隊を配置でき、複数回クリックすると編成数を増やすことが可能です。各部隊の編成上限は、他のモードでの部隊最大編成数と同一です。
dialogue_1040=戦場で戦死した部隊は消耗として扱われ、複数編成の部隊はより多く損失します。戦場に投入する部隊数を増やしたい場合は、統治画面にて部隊を追加で募集・補充してください。
dialogue_1041=指揮官閣下、どうぞ軍歴を開幕させ、全敵軍を殲滅してください！
dialogue_1042=リセットをクリックすると一括で布陣をやり直すことができ、開戦をクリックすると正式に戦闘が開始されます。


dialogue_2001=指揮官閣下、わが装甲集団は最速で敵の防衛線を突破する。
dialogue_2002=捕虜にする時間はない。
dialogue_2003=北部の敵軍を全滅させた。ワルシャワを制圧するのも時間の問題だ。
dialogue_2004=指揮官閣下、わが潜水艇部隊は海上からの脅威を追い払ってくれる。
dialogue_2005=敵軍の退路は絶たれた。指揮官閣下、彼らの最後の反撃に気をつけてください。
dialogue_2006=敵は海洋に対する支配権を失った。われはこれから北側の港を制圧して彼らの海軍を全滅させるのだ。
dialogue_2007=わが火砲部隊は貴官の行動に合わせてマジノ線に攻勢を仕掛ける。
dialogue_2008=指揮官閣下、わが装甲部隊は敵の防衛線を迂回する準備を整えた。パリに進軍する時が来た。
dialogue_2009=我々の友軍は敵に敗れた。これから我々は自分自身に頼るしかない。
dialogue_2010=迅速かつ猛烈に攻撃せよ！
dialogue_2011=なぜ敵はあそこに現れた？後方にある首都に増援を送らないと！
dialogue_2012=イギリスの遠征軍は撤退し始めた。指揮官閣下、残りの敵を消滅してイギリス海峡を渡ったください。
dialogue_2013=わが部隊は貴官に協力して西側から攻勢を仕掛けて、イギリス本土に上陸する。
dialogue_2014=イギリスを徹底的に潰す時が来たのだ。
dialogue_2015=撤退だけで戦争に勝てないが、今回の撤退は勝利を育んでいる。
dialogue_2016=敵の海軍は殆ど全滅した。上陸するなら今しかないんだ。
dialogue_2017=最後まで戦うのだ。決して屈したり、妥協したりしない。
dialogue_2018=敵の艦隊はイギリス海峡でほぼ全滅した。今回はイギリス海軍にとって地中海での最後の抵抗になる。
dialogue_2019=付近の島々を利用して防衛線を作り上げた。そして水中に機雷を配置することで我々の進軍を食い止めようとしていた。
dialogue_2020=今回は我々の最後のチャンスだ。必ずやイタリアがすべての地中海を占領するのを阻止しなければならないのだ。
dialogue_2021=この港は極めて重要な位置を占めている。敵は増援艦隊を派遣すると思うが、この拠点だけは死守しなければならない。
dialogue_2022=敵は我々の奥地まで攻め込んだ。われはすでに予備艦隊を派遣した。必ず彼らを食い止めるのだ。
dialogue_2023=敵の艦隊は西側の防衛線を突破した。直ちに増援を送ってください。
dialogue_2024=我々の先兵部隊はすでにバルカン半島に上陸した。指揮官閣下、陸から攻撃を開始してください。
dialogue_2025=敵は我々とわが友軍に全面攻撃を仕掛けた。力を集中して敵を海に追い払ってください。
dialogue_2026=敵の海軍は雑魚ばかりが、彼らの山岳師団を侮ってはいけない。速やかにわが友軍に支援して拠点を守ってください。
dialogue_2027=敵の反撃を食い止めた。今は同盟軍と一緒に総攻撃を仕掛ける時だ。
dialogue_2028=部隊を集中させるのだ。分散してはいけない。
dialogue_2029=ソ連軍は人数は多いが、帝国の精鋭部隊の前で、ひとたまりもなく負けるのだ。
dialogue_2030=わが歩兵集団はレニングラードの北防衛線を突破した。
dialogue_2031=キエフは今、敵の攻撃を受けている。わが部隊の被害は甚大だ。いますぐ貴官からの救援が必要だ。
dialogue_2032=敵はすでに最初の防衛線を突破した。彼らの目標はスモレンスクだ。兵士たちよ、われに続け。
dialogue_2033=指揮官閣下、貴官とモスクワで合流することを期待している。
dialogue_2034=我々に退く道はない。背後にはモスクワがある。最後の防衛線を死守してください。
dialogue_2035=キエフは敵の手に落ちた。彼らを食い止めるために、東側で新たな防衛線を作らなければならない。
dialogue_2036=我々の援軍はまもなく到着する。指揮官閣下、彼れらが無事に上陸できるように敵を掃討し、補給品を確保してください。
dialogue_2037=兵士たち、敵の補給品を奪って、わが軍の優勢を拡大するのだ。
dialogue_2038=援軍は上陸作戦を始めた。速やかに前方の港を制圧し、沿岸守備隊を消滅してください。
dialogue_2039=敵の防衛線を突破した。わが装甲集団はアレクサンドリア港に進軍している。海軍の艦隊も反対側から攻撃を仕掛ける。
dialogue_2040=我々は海上の砦を失った。アレクサンドリア港は敵の砲火に晒された。
dialogue_2041=我々に増援はないが、カイロだけは死守しなければならない。
dialogue_2042=レニングラードは難攻不落の砦。正面から攻めると甚大な被害を被る事になる。
dialogue_2043=指揮官閣下、先に周辺都市を制圧して、レニングラードを包囲してください。我々の友軍は北から攻撃を始める。
dialogue_2044=敵はレニングラードに迫っている。兵士たち、速やかに救援せよ。
dialogue_2045=指揮官閣下、レニングラードの北部を封鎖した。貴官と早く合流することを期待する。
dialogue_2046=敵はレニングラードの東部から攻勢を始めた。彼らを食い止めて最後の補給線を死守してください。
dialogue_2047=レニングラードの周辺都市は我々の手に落ちた。最後の計画を実行する時が来た。
dialogue_2048=レニングラードは我々の都市だ！敵は自分のやったことに対して対価を支払わなければならない。
dialogue_2049=パウルス元帥の部隊はレニングラードの付近で敵軍に包囲された。司令部は直ちに救援せよと命じていた。
dialogue_2050=戦線がどんどん長くなったせいで、ドイツ軍には両翼を構える余裕はなくなった。今は我々が反撃に出る絶好のチャンスだ。
dialogue_2051=我々の友軍ルーマニアとハンガリーは南部で敵からの猛烈な攻撃を受けている。彼らは長く持ちこたえない。
dialogue_2052=敵は総攻撃を始めた。指揮官閣下、速やかに北部のソ連軍の防衛線を突破してください。
dialogue_2053=我々はすでに南翼のドイツ第6軍を包囲した。指揮官閣下、ドイツ人の援軍を阻止してください。
dialogue_2054=前線部隊はドイツ軍の援軍を食い止めた。敵第6軍を殲滅する時が来た。
dialogue_2055=パウルス元帥は倒された。我々はレニングラードに攻撃を仕掛ける要地を失った。
dialogue_2056=ヨーロッパを完全制服するまであと一歩だ。モスクワは前にある。兵士たち、我と共に栄光を掴もう。
dialogue_2057=敵軍は多方向からモスクワを攻撃するつもりだ。しかし、彼らはここがソ連の土地だということを忘れた！
dialogue_2058=指揮官閣下、ソ連人の攻撃に気を付けてください。友軍と共に行動すれば効率が上がる。
dialogue_2059=ほかの部隊が無事に撤退したまで、我々はドイツ軍の攻撃を食い止めなければならない。
dialogue_2060=攻撃せよ！すべての港を占領して彼らを阻止してくれ！
dialogue_2061=友軍からの援助が届いた。良い知らせだ。
dialogue_2062=敵の第一防衛線を突破した。全力で攻撃して彼らを一人でも逃がすな！
dialogue_2063=港に撤退して陣地を死守するのだ。
dialogue_2064=ドイツ軍は我々の本土を攻撃している。至急救援を求む。
dialogue_2065=もっと攻撃してくれ。まもなくイギリスを手に入れるのだ
dialogue_2066=ドイツの空襲を食い止めた。反撃の時が来た！
dialogue_2067=勝利はイギリスにあり！
dialogue_2068=我々の海軍はドイツの補給線を封鎖した。今は反撃に出る絶好のチャンスだ。
dialogue_2069=情報により、ロンメルの部隊はまもなく南部都市に攻撃を仕掛けるようだ。火砲部隊を集中させて防御を固めてください。
dialogue_2070=ドイツ軍の前線陣地を突破した。これからチュニジアに攻撃を始める。
dialogue_2071=装甲部隊、奇襲を仕掛けて敵を消滅するのだ！
dialogue_2072=最初から先手を取れなかったせいで、今回の作戦は本来の意味を失った。
dialogue_2073=今度の目標はシチリア島の奪還だ。シチリア島を奪還してイタリアを戦場から追い払うのだ。
dialogue_2074=今度は連合軍にとっての大規模な連合作戦だ。わが艦隊は貴官の行動に合わせて島々を攻撃する。
dialogue_2075=作戦は順調に進んでいる。必ずイギリス人より先にパレルモを制圧しなければならない。
dialogue_2076=連合軍の攻撃が強すぎる。撤退の準備だ。海峡から我々を援護できる援軍がほしい。
dialogue_2077=シチリア島は我々の物になった。海峡を渡ったイタリアを徹底的に潰すのだ！
dialogue_2078=南北より同時に攻撃を開始してクルスクのソ連軍を消滅する。
dialogue_2079=防衛線を作り上げてドイツ軍の装甲部隊を食い止める。そして機を伺って反撃するのだ。
dialogue_2080=攻撃せよ！敵の装甲部隊を消滅してここから追い払うのだ！
dialogue_2081=北地域の制空権を奪取した我々は貴官と共に攻撃を仕掛けるのだ。
dialogue_2082=クルスクの戦いで勝利した我々はドイツの夏の攻勢を粉砕した。今は我々が反撃に出る時だ。
dialogue_2083=防御に専念することで我々は受動的な立場に陥った。ソ連人を阻止するために、我はこれから部隊を率いて突撃を仕掛ける。
dialogue_2084=ルントシュテット将軍の部隊は負けた。我の計画は失敗した。
dialogue_2085=西北の軍集団を調達し、キエフ救援に向かせるのだ。
dialogue_2086=指揮官閣下、ドイツ軍の制圧されたミンスクを奪還しなければならない。この任務を達成するために、ロコソフスキー将軍と我は貴官に協力する。
dialogue_2087=やれることはすべてやった。しかし、敗北することを免れなかった。
dialogue_2088=作戦は順調に進んでいる。ミンスクは前方にある。敵の反撃に気をつけてください。
dialogue_2089=厳密な計画と長い準備期間に加えて、この日はようやく来た。これは史上最大規模の上陸作戦になる！
dialogue_2090=米軍の進軍は早い。しかし、彼らに遅れを取るわけにはいかない。
dialogue_2091=前線の状況は悪化した。反撃に出るチャンスを伺って、連合軍の進軍を食い止めなければならない。
dialogue_2092=もはや我らの行く手を阻むものはなし！
dialogue_2093=フランス軍の進軍に合わせるために、フランス南部に滞在するドイツ軍に対する奇襲作戦を作成した。
dialogue_2094=わが部隊は海岸で連合軍を足止めしてやる！
dialogue_2095=彼らの実力を見くびったようだ。装甲部隊を出して連合軍の攻撃を食い止める。
dialogue_2096=ドイツ軍の残存部隊は戦力を失った。全面攻撃してリヨンを占領する。
dialogue_2097=指揮官閣下、計画通りに進めば、我々の部隊はドイツの奥地まで侵入できる。
dialogue_2098=橋頭堡は攻め落とされた。援軍を送らなければならない。
dialogue_2099=よし！このまま進軍してここに滞在するドイツの残存勢力を一掃するのだ。
dialogue_2100=ほかの部隊が到着する前にベルリンを占領しなければならない。わが火砲部隊は貴官を援護する。
dialogue_2101=わが装甲部隊は北側で敵軍を一掃してくれる。
dialogue_2102=ベルリンは目の前にある。勝利は我らの手にある。
dialogue_2103=失敗なんて怖くない。ベルリンの運命は決まった。
dialogue_2104=我々の奇襲は成功した！敵部隊は甚大なダメージを被った。
dialogue_2105=なぜ日本軍の動向に気付いてなかった？兵士たち、自分の位置に付け！
dialogue_2106=指揮官閣下、側面から攻撃してください。島に駐屯する敵部隊を包囲する。
dialogue_2107=敵の援軍が動いた。わが潜水艇部隊は彼らを止めてみせる。
dialogue_2108=偵察機によりイギリスの主力戦艦の位置が分かった。潜水艇部隊はいつでも出撃できる。
dialogue_2109=帝国にとってシンガポールはアジアでの重要な戦略都市なので、日本軍の手に落ちてはいけない。
dialogue_2110=指揮官閣下、上陸作戦を速やかに終わらせてください。わが艦隊は敵の海軍に攻撃を仕掛ける。
dialogue_2111=イギリスのロイヤル艦隊も当時と比べられないくらい衰弱していた。この機に乗じて彼らに致命な一撃を与える。
dialogue_2112=日本軍はまもなくシンガポールに到着する。予備隊も出して、なんとしてもシンガポール守らなければならない。
dialogue_2113=イギリス軍の防衛線は崩れた。ヤンゴンを拠点にしてビルマを占領するのだ。
dialogue_2114=指揮官閣下、ヤンゴンを攻撃する時に機動隊を派遣してわが部隊と共に敵の補給線を切断してください。
dialogue_2115=日本軍の攻撃を防ぎきれない。撤退だ！マンダレーの周りで新たな防衛線を築くのだ。
dialogue_2116=前線のイギリス人はもう持ちこたえられない。直ちに支援へ向けて動き出してください。
dialogue_2117=敵の主力部隊は前線に向かっていた。今は奇襲を仕掛けて敵の補給線を切断する絶好のチャンスだ。
dialogue_2118=ビルマに駐屯するイギリス軍は崩壊し続けている。残りの拠点を一気に奪還するのだ！
dialogue_2119=指揮官閣下、ポートモレスビーを早く占領してください。わが部隊上空から貴官を援護する。
dialogue_2120=空母艦隊はソロモン諸島に駐屯する敵部隊を攻撃して他部隊の上陸を援護する。
dialogue_2121=敵の援軍に気をつけて上陸部隊が大きな被害を被らないようにしてください。
dialogue_2122=最後の防衛線が日本軍に突破された。オーストラリアは敵の砲火に呑まれる。
dialogue_2123=指揮官閣下、我々の兵力は多くないので海軍と協力して攻撃してください。
dialogue_2124=死を恐れぬ者だけが生き残れる！我々が太平洋戦場においての最後の希望なのだ。
dialogue_2125=どうやら敵軍は失った土地を取り戻そうと考えている。指揮官閣下、応戦の準備を整えてください。
dialogue_2126=どんな時でも希望を捨ててはいけない。太平洋艦隊が存在する限り、勝利する可能性はある。
dialogue_2127=肝心な時に撤退するとすべてが無駄になっちゃう。
dialogue_2128=わが軍は甚大な被害を被った。兵士たちもヘタヘタだ。大本営は攻撃を止めて全軍直ちに撤退せよと命じた！
dialogue_2129=指揮官閣下、イギリス軍の追撃をなんとしても食い止めてください。今度、我々がインドに反抗する希望を残してください。
dialogue_2130=インパールを守った。しかし、日本軍がここにいる限り、戦いは終わってない。
dialogue_2131=日本軍の艦隊は撤退を始めた。これは失った土地を奪還する絶好のチャンスだ。
dialogue_2132=イギリス軍の進攻を防ぎきれない。マンダレーはまもなく敵の手に落ちる。
dialogue_2133=ソ連軍の主力部隊はドイツ軍に足止めされた。我々がシベリアでの行動が世界を揺るがすことになる。
dialogue_2134=指揮官閣下、わが軍の機動性を活かしてソ連軍の主力装甲部隊を避けて防御の薄い都市を先に占領してください。
dialogue_2135=貴官の行動に合わせるために、わが部隊は多方面からソ連軍に攻撃を仕掛ける。
dialogue_2136=日本人を一人一人相手する余裕はない。早く日本軍の主力を見つけて決戦しなければならない。
dialogue_2137=敵の装甲軍集団がこっちに向かっています。援軍が必要です！
dialogue_2138=指揮官閣下、我々は速やかに敵の海上防衛線を突破し、上陸しなければならない。しかし、米軍の偵察に引っ掛からないようにしてください。
dialogue_2139=日本軍の艦隊と対抗できない。友軍と協力して力を集中させて彼らの上陸部隊を海に追い払わなければならない。
dialogue_2140=その場で防衛線を作って彼らの進攻を食い止めるのだ。
dialogue_2141=防御に没頭することは自滅することと同じだ。攻撃を仕掛けて最終兵器の研究に時間を稼がなければならない。
dialogue_2142=アメリカ人が先に攻撃を仕掛けてくるとは思わなかった。しかし、これは彼らを兵力を削るチャンスだ。
dialogue_2143=指揮官閣下、アメリカ軍の主力と戦う同時に敵の研究施設に奇襲を仕掛けてください。
dialogue_2144=勇敢なる人間は希望がある限り、負けないんだ。
dialogue_2145=情報により、日本軍は真珠湾を奇襲した。直ちに帰航して日本軍を攻撃してください。
dialogue_2146=指揮官閣下、わが部隊は日本軍の攻勢を食い止めるのだ。貴官は早く戻って真珠湾を助けてください。
dialogue_2147=奇襲は成功した。第三次攻撃を開始せよ。米軍の太平洋艦隊を徹底的に殲滅する。
dialogue_2148=敵の援軍は到着した。戦艦からの援護が必要だ。
dialogue_2149=奇襲部隊は甚大なダメージを被った。こんな「成功」を納得できない。
dialogue_2150=大本営にとってシンガポールは重要な拠点である。イギリスからの援軍が到着する前にシンガポールを占領しなければならない。
dialogue_2151=日本軍は攻勢を仕掛けてシンガポールを占領しようと考えている。日本軍の思い通りにはさせない。
dialogue_2152=指揮官閣下、わが艦隊は到着した。これから貴官を援護する。
dialogue_2153=イギリスの攻勢はすさまじい。至急援軍を要請する。
dialogue_2154=ミッドウェー島を攻撃してくる日本軍は多い。防御を固め、ミッドウェー島が日本軍の手に落ちないよう陣地を死守しなければならない。
dialogue_2155=空母艦隊は敵の攻撃を牽制してくれ。
dialogue_2156=敵の防御は固い。我々の部隊は甚大なダメージを被った。
dialogue_2157=指揮ミスにより、艦隊は次から次へと撃沈された。失敗はもう免れないんだ。
dialogue_2158=日本軍の動きは迅速だ。彼らの空港は完成した。しかも多くの防御陣地を構築した。
dialogue_2159=指揮官閣下、我はガダルカナル島の北方向から攻撃を仕掛けて、彼らの注意を分散する。その間、貴官は速やかに上陸して島の守備軍を消滅してください。
dialogue_2160=わが艦隊は敵の奇襲を受けている。
dialogue_2161=指揮官閣下、日本軍は病気に苦しんでいて士気が低下している。今は絶好の攻撃チャンスだ。
dialogue_2162=連合軍は三つの方向から攻撃を仕掛け、できるだけ早くマンダレーを制圧する。
dialogue_2163=敵はマンダレーを占領した。これは悲報だ。
dialogue_2164=これは最後の戦いだ。もう退く道はない。突撃せよ！
dialogue_2165=上陸部隊を掩護するために、連合軍は数多くの海軍を投入した。必ずやフィリピンを奪還する。
dialogue_2166=ここはすでに帝国に占領された。マッカーサーを太平洋に追い払う。
dialogue_2167=我らの偵察機が敵の空母部隊を発見した。彼らの空母部隊を消滅してくれ!
dialogue_2168=小沢が敵の空母部隊を食い止めた。
dialogue_2169=艦隊は撃沈された。帝国の海軍はもう存在していない。
dialogue_2170=陣地を死守し、死ぬ前に少なくとも10名の敵を倒し、最後の一兵まで戦うのだ。
dialogue_2171=指揮官閣下、この島を落とせば、日本本土を直接爆撃できる。
dialogue_2172=情報により、この島の防御力は尋常じゃない。この島を落とすには甚大な被害を被ることになる。よく考えてから行動してください。
dialogue_2173=武士にとって戦場で倒れるのはもの凄く光栄な事だ。
dialogue_2174=指揮官閣下、早く前方の日本軍を解決して米軍より先に日本本土を攻撃しなければならない。
dialogue_2175=ソ連軍は帝国の本土に攻勢を仕掛けようと考えていた。ここで彼れを食い止めなければならない。
dialogue_2176=指揮官閣下、もう我々に残された時間はない。空港を占領すると攻勢を強めることができる。
dialogue_2177=指揮官閣下、日本人は最後まで戦うつもりだ。日本本土に攻撃を行うので、我の作戦に協力してください。
dialogue_2178=早く上陸して防御施設を建築する必要がある。我々の相手は日本だけではないかもしれない。
dialogue_2179=日本は投降した。この土地はソ連のものだ。アメリカ人をここから追い払ってくれ！
dialogue_2180=ソ連の野望はすでに知っている。指揮官閣下、我々の相手は二つの国だ。これは紛れもなく厳しい戦いだ。

dialogue_2181=わが部隊は上陸作戦を完成した。前線陣地を守るために、より多くの増援部隊が必要だ。
dialogue_2182=これから王立艦隊は敵の港に対して攻撃を開始する。そして同時に陸軍を派遣し、貴官を援護する
dialogue_2183=指揮官閣下、NATO援軍の動向に気をつけてください。敵が上陸する前に徹底的に彼らを消滅するのだ。
dialogue_2184=NATOの計画は失敗した。反撃の時が来た！
dialogue_2185=ソ連人の軍隊がコーカシア地域に集結している。我らの進軍ルートはもう断たれている。
dialogue_2186=わが艦隊はソ連海軍に攻撃を仕掛けて敵の地面部隊を牽制する。
dialogue_2187=指揮官閣下、われと一緒に敵の先頭部隊を倒し、トルコへの侵攻に準備を整えてください。
dialogue_2188=指揮官閣下、トルコに侵攻する時が来た。
dialogue_2189=わが艦隊と連携してトルコの防衛線を迂回して先に沿岸に滞在している米軍を消滅する。
dialogue_2190=NATOの部隊はアンカラに進軍している。わが部隊だけで太刀打ちできない。
dialogue_2191=指揮官閣下、アンカラを守るために早く援軍を送ってください。
dialogue_2192=増援としてわが部隊は前線に赴いている。
dialogue_2193=機は熟した。NATOの地面部隊の殆どが壊滅した。次の狙いはトルコの全土を占領することだ。
dialogue_2194=敵は厳密な防衛線を敷いた。アンカラを制圧してそれを拠点としてトルコに侵攻する。
dialogue_2195=敵は我々の奥地まで攻めてきた。何としても彼らを食い止めなければならない。
dialogue_2196=NATOは西ヨーロッパで連合軍を作って2つの方向から我々に対して大規模な攻勢を仕掛けようとしていた。
dialogue_2197=兵士たちよ、我々の力を見せる時がきた。ソ連人を追い払うのだ。
dialogue_2198=指揮官閣下、敵の同盟は強大だ。戦機を掴んで次々と敵を倒し、ベルリンで合流しよう。
dialogue_2199=われは最後まで死守する。ワルシャワには危険が迫っている。
dialogue_2200=西ヨーロッパにあるNATOの部隊は我々を奇襲した。我々の同盟軍は甚大な被害を受けている。
dialogue_2201=われは最後まで死守する。ワルシャワには危険が迫っている。
dialogue_2202=指揮官閣下、自らの行為に対価を支払わせてやる。赤い嵐はヨーロッパを一掃する！
dialogue_2203=情報より、米軍からの援軍は西海岸からアジアに向かっている。
dialogue_2204=わが空軍は付近の海域でソ連軍の大部隊を発見した。直ちに行動を中止し、陸上に撤退してください。
dialogue_2205=指揮官閣下、敵の輸送船を迎撃して上陸する時の障害を減らしてください。
dialogue_2206=敵の上陸を阻止できなかったが、これ以上一歩たりとも進ませてはいけない。
dialogue_2207=NATOの海軍は我々の背後に現れた。我らを包囲しようとしている。
dialogue_2208=指揮官閣下、我々の行動は敵に気付かれた。できるだけ早くアメリカ本土に上陸しなければならない。
dialogue_2209=兵士たちよ、進め！海洋上で敵を粉砕するのだ。
dialogue_2210=NATOは失敗した。アメリカ人は最後の抵抗をしている。
dialogue_2211=我ら援軍はまもなく東海岸に到着する。陣地を守って友軍を連携してアメリカを徹底的に倒してください。
dialogue_2212=わが艦隊は敵の援軍を食い止める。貴官は力を集中して陸上のソ連軍を潰してください。星条旗は永遠なれ！
dialogue_2213=戦争が終わり、ヨーロッパ諸国は甚大な被害を受けていた。この機に乗じて攻勢を仕掛けて領土を拡大する
dialogue_2214=ソ連人は大部隊を集結してヨーロッパを侵攻しようとしていた。彼らを食い止めなければならない。
dialogue_2215=ドイツはソ連の猛攻を受けている。彼らを支援しなければならない。
dialogue_2216=ドイツはもう終わりだ。進め！今回は楽勝だ。
dialogue_2217=ドイツを包囲攻撃するようにオランダとベルギーを説得した。
dialogue_2218=ソ連の支持で北朝鮮が戦争を起こし、ソウルを占領した。我々は部隊を派遣して仁川に上陸し、南朝鮮の部隊に合わせて反攻を行うのだ。
dialogue_2219=連合軍は南朝鮮に到着した。部隊を調達して彼らを消滅してください。この作戦は失敗するわけにはいかない。
dialogue_2220=今は追い討ちをかけるべく、ソ連人の野心を徹底的に消滅するのだ。
dialogue_2221=ソ連はキューバの付近で大量のミサイルを配置した。彼らは何時でも核ミサイルを発射することができる。指揮官閣下、いかなる代価をも惜しまずに、ミサイル発射口を潰さなければならない。
dialogue_2222=大統領はソ連人の挑発を許せない。
dialogue_2223=攻撃せよ！アメリカ人を痛い目に遭わせてやる。
dialogue_2224=ソ連人はスエズ運河を封鎖して中東地域の石油資源を独り占めしようとしていた。決して彼らの思う通りにはさせてはいけない。
dialogue_2225=攻撃せよ。中東地域の石油基地を制圧してヨーロッパ人を追い払うのだ。
dialogue_2226=ソ連の動きが速い。状況は我々にとって不利だ。
dialogue_2227=ソ連軍の兵力は巨大だ。われはイギリス軍と共に北側で敵の主力部隊を牽制する。指揮官閣下、南側で敵を背後から奇襲して彼らを包囲してください。
dialogue_2228=アメリカからの援軍が間もなく到着する。総攻撃を仕掛けて彼らの援軍が来る前に勝利を収めるのだ。
dialogue_2229=爆撃を開始せよ！立ち直る隙を与えてはいけない。
dialogue_2230=NATOの部隊は多いが、進軍の速度が遅い。部隊を集結して次の攻撃に備える。
dialogue_2231=どうやら我々は間に合わなかった。ソ連軍は都市を幾つか制圧した。指揮官閣下、ソ連軍が整備する内に攻撃を仕掛けて失った土地を取り戻すのだ。
dialogue_2232=指揮官閣下、偵察機より南部戦線でソ連人が防御工事を建築することが分かった。これはチャンスだ。
dialogue_2233=南極に位置するソ連軍の基地がこれほどの規模になるとは思わなかった。今度こそ、彼らを徹底的に潰すのだ！
dialogue_2234=陣地を死守する。これは反撃を発動する最後のチャンスだ。
dialogue_2235=ミサイルを発射して敵軍をぶっ飛ばしてやれ。反撃の時が来た！

dialogue_2236=敵の攻勢は非常に猛烈だ。情報により、油田が占領されただけでなく、多くの国の重要都市も攻撃を受けている。
dialogue_2237=もう遅いよ。攻撃を続けろ！間もなく我々はこの海湾地域の主となるのだ。
dialogue_2238=我々の友軍は恐らく長く持ち堪えない。指揮官閣下、直ちに部隊を派遣して海湾地域の危機を解除してください。
dialogue_2239=優勢を占めている我々の前にいくら抵抗しても無駄だ。
dialogue_2240=敵の目標はバグダードだ。敵部隊は今そこに集結している。指揮官閣下、どんな犠牲を払っても敵の計画を破壊してください。
dialogue_2241=残りの都市を占領したら、英国に進軍を始めよう。まもなく全欧州を手に入れる。
dialogue_2242=敵軍は多方面より攻撃を仕掛けてきた。多くの都市は制圧された。指揮官閣下、早く上陸してヨーロッパを危機から救い出してください。
dialogue_2243=今回は一時撤退するだけだ。また戻ってくるぞ。
dialogue_2244=今回の転移は見事に成功した。ソ連人は弱すぎようだ。まもなく我々はモスクワに到着する！
dialogue_2245=敵は幾つかの都市を占領したら、この戦争に勝てると思っているが、これは大間違いだ。今までソ連は一度も負けたことがない。そして今回も負けたりはしないんだ！
dialogue_2246=ドニエプル川は敵に封鎖されている。ソ連人は劣勢を強いられている。先にキエフを奪還してスモレンスクからモスクワに進軍する。
dialogue_2247=ハルキウの友軍を救援しなければならない。スターリングラードとモスクワを奪還する時に彼らの力を借りなければならない。
dialogue_2248=モスクワ西方向の防御陣地は破壊した。ここのソ連軍は我々に太刀打ちできない。
dialogue_2249=ハルキウは落ちた。敵部隊は間もなくモスクワに到着する。決戦の時が来た。
dialogue_2250=モスクワは危機に瀕している。わが部隊は貴官に協力してキエフを奪還する。
dialogue_2251=ヨーロッパでの失敗を気にしないでください。今度こそ北アメリカを占領する。全員出撃せよ。
dialogue_2252=指揮官閣下、敵の攻勢はだいぶ弱くなったが、兵力において我々を上回っている。貴官の協力が必要だ。
dialogue_2253=ニューヨークでの敵は消滅された。勝利の曙光が見えた。
dialogue_2254=ニューヨークは我々の手に落ちた。直ちに陣地を敷いて敵の反撃を備えろ！
dialogue_2255=敵の数が多すぎる。援助が間に合わなかったせいでワシントンは危機に瀕している。
dialogue_2256=まさか東南アジアとオーストラリアがテロ分子に制圧されたとは思わなかった。しかし、我々が来たことは戦局も挽回すると意味している。
dialogue_2257=海上で我に挑むのは貴様が初めての、そして最後の人だ。
dialogue_2258=群島の一部を制圧した。これからわが装甲部隊は出発してオーストラリアでの友軍を援助する。
dialogue_2259=指揮官閣下、この島が敵に手に落ちないよう頑張ってください。
dialogue_2260=敵の援軍は多方向より攻めてきた。
dialogue_2261=島上の守備隊では持ち堪えない。わが艦隊は直ちに帰還して防戦に参戦する。
dialogue_2262=ダーウィンは敵に占領された。オーストラリアの部隊は敗退している。
dialogue_2263=指揮官閣下、ダーウィンを奪還してオーストラリア本土を守ってください。
dialogue_2264=指揮官閣下、敵の防御が非常に強固で、我々は力を合わせて敵を逐一撃破すべきだ。
dialogue_2265=シベリアは我々の基地でもある。ここを攻撃することを後悔させてやる。
dialogue_2266=全軍攻撃せよ。激しい砲火で敵を消滅する。
dialogue_2267=貴様らの行動は破滅を招くだけだ。わが怒りを感じるのがいい。
dialogue_2268=敵はシベリアでの基地を失ったものの、攻勢を弱めていない。全面的な反撃を行って敵に休憩時間を与えてはいけない。
dialogue_2269=アジアでは我々の部隊は敗退し続けているが、ここに残った諸君は皆エリート中のエリートだ。ソ連人は自分の無謀な行動に対して代償を支払うのだ。
dialogue_2270=指揮官閣下、ここは敵の最後の基地だ。決戦の時が来た。彼らを消滅してください。
dialogue_2271=ここまで来るとは思わなかった。しかし、ここまでだ。彼らを消滅してくれ。
dialogue_2272=ここに来たら、もう生きて帰れると思うなよ。
dialogue_2273=敵の動きは迅速だ。しかし、もう逃してはいけない。追撃せよ！
dialogue_2274=ここは彼らの大本営だ。いずれにせよ、今回は最後の戦いだ！
dialogue_2275=我々の研究はまもなく完成だ。身の程知らずの奴らに真の力について思い知らせてやる！
dialogue_2276=なぜこの時にソ連軍が現れるのか？しかし、敵の敵は味方だ。勝利するにはソ連軍の力を頼らなければならない。
dialogue_2277=敵は混乱に陥っている。勝利は目の前だ。こんな事態を引き起こした技術を封印しなければならないのだ。
dialogue_2278=ここの技術はソ連の財産だ。他人に渡してはいけない。
dialogue_2279=永遠の友達や永遠の敵はいない。あるのは永遠の利益だけだ。
dialogue_2280=テロ分子にわが基地を利用されたとは思わなかった。指揮官閣下、テロ分子を消滅してください。こういった技術を奴らの手に渡してはいけないのだ。


