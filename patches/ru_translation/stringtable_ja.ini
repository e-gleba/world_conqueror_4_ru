feat_desc_75_Lv3=攻撃した目標の周囲1マス以内の友軍部隊の士気が上昇、攻撃力+{1}%、3ターン継続。
feat_desc_76_Lv4=攻撃範囲が3になり、複数の敵部隊を攻撃可能。他の目標へのダメージは減少しない。攻撃時、{1}%の確率で敵が反撃不可、1ターン継続、クールダウン2ターン。目標マスは100%の確率で着火状態になる。
feat_desc_78_Lv3=回避およびスモークの効果を無視、城防へのダメージが{1}%増加
feat_desc_79_Lv4=スモーク弾を発射し、自身をスモーク状態にする。陸軍・海軍からの攻撃を受けず、{1}%の確率で追加攻撃可能、1ターン継続、クールダウン2ターン。50%の確率で敵の回避を無視する。
feat_desc_80_Lv4=スモーク状態中、攻撃時に目標の防御力を{1}%無視する
feat_desc_81_Lv4=ミサイルを発射する時、三相弾頭を装填できる。初期所持数は2で、{1}ターンごとに1つ回復。最大で5つまで。攻撃時に必ず放射線効果が発動する
feat_desc_82_Lv4=大陸間弾道ミサイルを発射可能。毎ターン2回まで発射可能。通常攻撃の代わりとなる。
