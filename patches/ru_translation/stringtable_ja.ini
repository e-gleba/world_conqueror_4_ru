dialogue_3304=迅速に他の者と連絡を取り、指定された座標の基地で合流せよ。
dialogue_3305=正体不明の武装勢力が戦場に突如出現した！和平交渉は破綻した。直ちに攻撃を開始せよ！
dialogue_3306=通信が復旧した。オズボーン、生きていたのか！？周囲は多国籍軍に囲まれ、中には大量のドイツ軍もいる！
dialogue_3307=私は死を恐れない。常に自分の信念のために戦ってきたからだ。これがコールソンと私の暗号だ。オズボーン、後は任せたぞ。
dialogue_3308=私は失敗したが、いずれ必ず成功する！君たちの犠牲は無駄にはならない！
dialogue_3309=なぜウィリアムズがそこにいるんだ？彼らはどちら側なんだ？あれは何の武器だ？
dialogue_3310=援軍はすでに戦場に到着した。しかし、道中のドイツ軍による空襲が行軍速度を大幅に遅らせた。
dialogue_3311=基地周辺の味方との連絡は確立され、すべての施設が正常に稼働している。今こそ、亡き戦友の復讐を果たす時だ。
dialogue_3312=レティシアの領土紛争は今や全面戦争に拡大した。我々はコロンビアを勝利に導き、ドイツの勢力を世界中に広げるのだ。
dialogue_3313=この形態の紛争と戦争はここで何度も繰り返されてきた。これが初めてではないし、決して最後でもないだろう。
dialogue_3314=なぜペルー軍が我々に発砲しているんだ！我々は武器を捨てて降伏するつもりはない。
dialogue_3315=しまった、先ほどあなたが指揮した小隊がコロンビア軍とペルー軍を同時に攻撃してしまった。今すぐあなたを安全な場所に移動させなければ。
dialogue_3316=安全な場所を知っている。三国の国境付近にあるジャングルの中だ。
dialogue_3317=お前たちか！なるほど、そういうことか。
dialogue_3318=周囲のドイツ軍部隊を優先的に殲滅し、コールソンたちに通路を確保せよ。
dialogue_3319=お前は誰だ？なぜ我々を助ける？
dialogue_3320=お前たちの無知のため、そしてその勇気のためだ。
dialogue_3321=お前をどこかで見た気がする。
dialogue_3322=
dialogue_3323=いずれにせよ、一つだけ確かなことがある。すべてお前のせいで、我々はこのような状況に陥ったのだ。
dialogue_3324=他の脅威を排除したら、基地ですべてを説明しよう。
dialogue_3325=輸送機の支援を受け、フランコのアフリカ軍団は無事に前線に到着した。彼らは南からマドリードに向けて攻撃を開始するだろう。
dialogue_3326=情報によると、ドイツ軍のコンドル軍団が主力を投入している。敵の大規模な空襲の中、ビルバオは早々に陥落する恐れがある。
dialogue_3327=マドリードとバルセロナを死守せよ。反乱軍に挟撃されることを絶対に許すな！
dialogue_3328=予想通り、内戦が勃発した。すべてがオズボーンの言った通りだ。
dialogue_3329=前進を加速し、マドリードを包囲するため、我が空軍は北部で抵抗を続ける共和国軍を排除する。
dialogue_3330=情報によると、イタリア軍の精鋭部隊が東部から上陸している。彼らの行動経路を見る限り、砂漠を越えて我々の後方に潜入するつもりのようだ。
dialogue_3331=後退するな。装甲部隊を用いて歩兵を支援し、東側の防衛線を強化せよ。
dialogue_3332=間に合っていればいいが。イギリス側の計画は非常に順調に進んでいる。
dialogue_3333=フランコは我々が撃退した。しかし、反乱軍は南部から次々と送り込まれてきている。
dialogue_3334=我々の意図は察知されたが、敵軍の防御態勢も混乱に陥った。作戦を中止し、撤退する時だ。
dialogue_3335=迅速な支援に感謝する。しかし私の判断によれば、共和国軍はこの戦争に負けつつあるだろう。
dialogue_3336=部隊は甚大な損害を受けている。司令部は全志願部隊に東へ集結し、撤退の準備を命じる。
dialogue_3337=また会うことになるだろう。君たちの救済主義的な情熱が深みに嵌らないことを祈るよ。
dialogue_3338=スペインの黄金時代は歴史の彼方に消えた。かつての植民地と同じように、循環の中に陥っている。我々の出口はどこにあるのだろうか。
dialogue_3339=植民者、軍閥、資本家に支配された時代は終わった。この世界には変革が必要だ。それには私が必要であり、私には君たちが必要だ。
dialogue_3340=アメリカを支持するイラン政府は、中東における地理的および戦略的優位性をアメリカにもたらすだろう。我々は朝鮮戦争の失敗を繰り返してはならない。
dialogue_3341=我々はアイゼンハワーとその同盟者たちをよく理解している。だからこそ、対策は準備済みだ。さあ、行動を開始しよう。
dialogue_3342=ソ連軍にしてやられた！奴らはすでにテヘランや北部の他の都市を掌握し、さらにはイラクとトルコにも侵攻している。
dialogue_3343=計画通りに進めよう、こちらにも切り札がある。
dialogue_3344=ルーカスはよく君たちのことを話していた。君たちの立場で、今回はどんな行動を取るのか非常に興味がある。
dialogue_3345=石油ビジネスのおかげで、我々は中東の多くの国で裕福な友人を得た。我々には共通の敵がいる。それだけで十分だ。
dialogue_3346=君の言う通りだ。しかし、今回は表向きには中立を保たなければならない。少額の軍資金くらいは出せるがね。
dialogue_3347=我々は自ら兵を出すことはないが、君たちの部隊に物資を継続的に支援するつもりだ。
dialogue_3348=情報機関は既にこの点を考慮している。傭兵と武装人員は、主要な都市の周囲に事前に潜伏させてある。
dialogue_3349=これは何の火砲だ？
dialogue_3350=私の特許だ。設計の原理は後でゆっくり説明してやる。
dialogue_3351=ソ連軍の全面攻撃が我々の基地を脅かしている。今すぐ反撃を開始せよ。
dialogue_3352=テヘランでの作戦は成功を収めた。確かな情報によれば、敵は攻撃の重点をイランに移し、大量の援軍を派遣する予定だ。
dialogue_3353=ソ連の勢力は我々によってこの地から追い出されつつある。
dialogue_3354=衛星の制御権は成功裏に奪取された。衛星兵器がオンラインになった。
dialogue_3355=周囲のソ連軍部隊を殲滅せよ。我々があなたの安全を保証する。
dialogue_3356=南米での作戦は我々の存在を明らかにした。もう偽装の必要はない。
dialogue_3357=反乱分子が我々の樺太研究基地を占領した。兵力を集めて奪還せよ。
dialogue_3358=ソ連軍内部の者が情報を提供したとしても、こんな短期間で奪取を完了するのは不可能だ。君は一体どうやったんだ？
dialogue_3359=身分不相応な宝は災いを招く。研究協力は成果を挙げていたが、それが身の危険を呼び込むことになるとは。
dialogue_3360=新しい日米安保条約は我々の利益を売り渡した！我々は勝利か死か、どちらかに至るまで戦い続ける！
dialogue_3361=日本国内の反乱がアメリカ軍の注意を逸らしている。これこそ撤退の好機だ。
dialogue_3362=いや、反乱軍の指導者も我々の救出目標の一人だ。
dialogue_3363=男たるもの、広い天地の中でくすぶり続け、人の下に居続けるわけにはいかない。
dialogue_3364=大志はまだ果たされていないが、天命には逆らえない。
dialogue_3365=敵軍の主要拠点を制圧した。我々に加われ、単独で戦うのは勝ち目がない。
dialogue_3366=時勢を見極める者こそ俊傑であり、機を読み変化に対応する者こそ英雄だ。私は君たちに加わることができる。我々の戦いはまだ終わっていない。
dialogue_3367=今や四海を彷徨い、身を置く場所がない。皆に救われたおかげで、安住の地を得ることができた。
dialogue_3368=分離主義者たちはオズボーンの扇動によって連盟の団結を破壊し続けている。東欧の黒蠍勢力を根絶するために行動を起こすのだ。
dialogue_3369=東側内部で分裂が生じており、ソ連軍はこれを武力で解決する計画を既に立てているだろう。
dialogue_3370=任務は順調に完了し、私と我が家族の実力を証明した。もし必要であれば、いくつかの追加の軍事サービスも提供できる。
dialogue_3371=ソ連軍は越境した。我々は自国領土内に他国軍を駐留させることを断じて容認しない。
dialogue_3372=永遠の友も敵もいない。直ちに援軍を派遣し、ユーゴスラビアとルーマニアを支援せよ。ただし、黒蠍の部隊には注意を払え。
dialogue_3373=ソ連軍の情報によると、ワグナーは黒蠍組織に寝返ったという。直ちに行動を起こさねばならない。
dialogue_3374=そんなことがあり得るのか！
dialogue_3375=ソ連軍のために戦うのか、それとも自分自身のために戦うのか。選択は君の手に委ねられている。
dialogue_3376=くそっ、またお前たちか！答えが欲しいなら教えてやる。
dialogue_3377=全てを予見する者はいないし、一人の力で戦争の結果を決められる者もいない。
dialogue_3378=どうやら私を見逃すつもりはないようだな。
dialogue_3379=攻撃を続けろ。この火砲は私の手で最大限の威力を発揮させる。
dialogue_3380=ポーランドのソ連軍を制圧した。私の部隊はさらに東へ攻撃を仕掛ける。
dialogue_3381=局地的な勝利では、アメリカとソ連のヨーロッパにおける勢力を揺るがすことはできない。
dialogue_3382=それは当然だが、我々は敵同士を消耗させるあらゆる機会を逃さない。
dialogue_3383=東部の戦況は白熱化しており、カリフォルニアとテキサスの反乱軍が同盟を結び、徐々に優勢を得ている。
dialogue_3384=アメリカには弱腰な大統領など必要ない。
dialogue_3385=戦術において破れないものはなく、ただ速度こそが破れない要素である。
dialogue_3386=反乱軍の後方本部を最初に制圧すれば、この戦争を早期に終結させることができる。
dialogue_3387=東部の戦局はすでに取り返しがつかない。ここでも新たな変化が起こりそうだ。
dialogue_3388=そろそろ適切なタイミングで攻撃を止め、防御に転じるべきかもしれない。
dialogue_3389=まずはメキシコの基地に撤退し、テキサスのアメリカ軍の東方動向を監視する。
dialogue_3390=ワシントンは反乱軍同盟に占領された。この世界は再び我々の決意と力を目撃することになるだろう。
dialogue_3391=お前がどんなアメリカ人であろうと、オズボーンと彼の黒蠍は我々の敵だ。アメリカ軍はお前を地の果てまで追い詰めるだろう。
dialogue_3392=そういうことなら、かかってこい。
dialogue_3393=国内の情勢が安定するにつれ、より多くの同盟者が黒蠍に対抗するために我々に加わった。
dialogue_3394=南極遺跡に関する技術解析は大きな進展を遂げた。どの勢力も南極に足を踏み入れさせるわけにはいかない。
dialogue_3395=我々の研究は間もなく完成する。これら無謀な者たちに本当の力を見せてやれ！
dialogue_3396=いや、こんなことがあり得るのか。
dialogue_3397=我々の一連の行動ではソ連軍の開発を遅らせることができなかったようだ。しかし、まだ時間はある。
dialogue_3398=黒蠍基地のデータが無事に復元された。資料によれば、我々は未来からの攻撃を受けている。しかし、オズボーンに関する情報は見つからなかった。
dialogue_3399=艦隊は諸島の東側海域を封鎖し、黒蠍部隊間の連絡を断ち切った。
dialogue_3400=南極にいるすべての敵を殲滅せよ。ここから生きて帰れる者はいない。
dialogue_3401=新型戦車の試作機が完成した。この武器の威力は南米での戦いで十分に証明されている。
dialogue_3402=ソ連軍の研究は成功を収めた。これが量産されれば、その結果は想像を絶するものとなるだろう。
dialogue_3403=今ならまだ間に合う。我々と共にソ連軍を止めるのだ。
dialogue_3404=これらの先進軍事装備に加え、さらに驚くべき技術が存在する。
dialogue_3405=オズボーン、無知こそが君の真の武器だったのだな。
dialogue_3406=大軍は灰燼に帰し、世界は私の足元で燃えている。
dialogue_3407=オズボーン、大丈夫か？様子が少しおかしいぞ。
dialogue_3408=遥か未来には、戦争しかない。
dialogue_3409=彼はまるで別人になってしまったかのようだ。
dialogue_3410=他の12個の暗号はすべて集まり、無事だった。今回は私の勝ちだ！
dialogue_3411=戦争は決して変わらない。


event_209=黒蠍の台頭

