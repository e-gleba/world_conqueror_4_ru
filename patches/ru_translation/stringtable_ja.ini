dialogue_4366=ドイツ軍はすでに城下に迫っているが、彼らが直面しているのは決して空虚な都市ではない。彼らは速度によって戦争を終結させようとしているが、我々は意志をもって彼らを消耗させ、打ち砕くのである。
dialogue_4367=赤の広場の将兵たちよ、敵に思い知らせよ――奴らが一歩前に進むたび、必ず血の代償を支払うことになるのだ。
dialogue_4368=敵軍はすでに南北両翼から挟撃の態勢を整えており、これを許せば我が防衛線は分断されてしまう。陣線を堅持し、各個に撃破して、敵の包囲を阻止せよ。
dialogue_4369=外周の最後の防衛線は突破された。私はすでに、クレムリン宮殿の屋根に輝く赤い星を目にしている。
dialogue_4370=鋼鉄の奔流の前進を阻むものは何もない。道は踏み平らされ、防衛線は引き裂かれ、いかなる抵抗も結果を変えることはできない。
dialogue_4371=ジューコフ将軍が前線に到着した。各部隊は持ち場を死守し、敵軍を攻勢の中で消耗させ続けよ。時間は我らの味方である。
dialogue_4372=戦術的観点から見れば、戦局は次第に我らに有利に傾きつつあり、モスクワはすでに目前に迫っている。
dialogue_4373=しかし現実的に見れば、我が装甲部隊は着実に消耗しつつあり、気温は継続的に低下している。その結果、車両の始動および整備に要する時間は著しく増加し、燃料や弾薬の補給も計画どおりには到達していない。
dialogue_4374=補給なくして機動なし。機動を失えば、装甲部隊はその存在意義を失う。
dialogue_4375=マンシュタイン将軍およびルントシュテット将軍が命令を受け、モスクワ方面の支援に向けて部隊を率い前進中である。前線の各部隊は陣地を死守し、戦線を安定させ、決して一歩たりとも後退してはならない。
dialogue_4376=情報により、日本が短期間内にソ連へ侵攻する可能性はないことが確認された。極東からの増援部隊が間もなく戦場に到着する。
dialogue_4377=現在の条件は決して我々にとって有利と言えない。しかし、モスクワはいまだに決定的な戦略的意義を持つ唯一の目標であり、たとえ成功の可能性が低下しようとも、これに代わる行動方針を見出すことはできないのだ。
dialogue_4378=いかなる犠牲を払ってでも、モスクワへ向けて進撃を続行せよ！
dialogue_4379=ナポレオンの教訓を彼らは忘れたのだろうか。否、もちろん覚えている。彼らはそれを研究し、分析し、そしてかつての失敗を嘲笑いさえしたに違いない。
dialogue_4380=彼らもまた、かつてのナポレオンと同様に、自分たちだけは例外になれると信じていたにすぎない。
dialogue_4381=敵軍は後退を余儀なくされたが、その主力はなお健在だ。しかし、この事実だけでもドイツ軍が決して無敵ではないことは十分に証明された。「電撃戦」という神話は、ここに終焉を迎えた。

