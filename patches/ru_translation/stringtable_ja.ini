feat_desc_43_Lv3=行動後に再行動可能、再行動時の行動力+{2}、クールダウン1ターン。2回目の行動で敵を殲滅すると{1}%の確率で再度攻撃可能（1回限り）
feat_desc_46_Lv3=クリティカルの確率+{1}%、1ターン継続、クールダウン2ターン。
feat_desc_47_Lv4=友軍1体のHPを{1}回復し、さらに毎ターンその対象のHPを100回復、2ターン継続。スキル使用時に自身もHPを{2}回復。クールダウン1ターン。
