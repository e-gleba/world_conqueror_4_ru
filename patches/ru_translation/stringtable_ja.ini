elite_intro_91=M142 HIMARSロケット砲は、トラックのシャーシーを基盤に開発され、その優れた高機動性、精密攻撃能力、迅速な展開能力によって、現代の戦場で非常に脅威的な兵器システムの一つとなっている。このシステムは多種類のロケット弾を発射でき、即応部隊による遠距離精密攻撃任務を支援するために広く使用されている。その卓越した戦場適応性により、現代戦争において極めて重要な役割を果たしている。

