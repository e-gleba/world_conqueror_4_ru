elite_intro_93=88ミリ36式高射砲は、第二次世界大戦中にドイツが広く使用した多用途砲である。本来は対空砲として設計されたが、優れた徹甲性能により対戦車戦にも広く用いられた。特に北アフリカ戦線でイギリス軍の装甲部隊に対して圧倒的な戦果を挙げ、「戦車キラー」として連合軍兵士から恐れられた。高い命中精度と威力により、ドイツ軍の象徴的な兵器の一つとなった。


