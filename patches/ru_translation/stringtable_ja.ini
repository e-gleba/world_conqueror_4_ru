event_buff_name_27=放射線
event_buff_name_28=鼓舞
event_buff_name_29=挑発

event_buff_desc_27=攻撃時、30%の確率で地域に継続的な2ターンの放射線効果を与え、放射地域の部隊は毎ターン現在の体力の10％を失う
event_buff_desc_28=ユニットが挟まれていない場合、毎ターン開始時に、自身の混乱と士気低下状態を80％の確率で解除
event_buff_desc_29=攻撃後、将軍の指揮下にある部隊は、1 ターンの間、1 ヘクス内の友軍が敵の陸軍および海軍の攻撃対象にならないようにする効果を発動する確率が 20% あります。

event_stage_intro_20501=戦争は変わらない。米軍の行動が再び半島のバランスを破壊した。敵は国境を越えている、目前の脅威を消滅させるため、友軍支援の部隊を直ちに編成せよ。新兵器を有効に使い、敵にその無謀さの代償を払わせるのだ！
event_stage_intro_20502=米国は日本と手を組み、ソ連港周辺海域と樺太島南部を掌握した。我々は米国の侵略の決意を甘く見ていたようだが、敵は我々の力を過小評価している。偉大なる祖国に挑戦する者は、誰であれ破滅に至ることを教えてやろう。
event_stage_intro_20503=米軍の野望が明るみになった。敵の拡張に対応するため、千島列島近海に防衛軍を配備させている。この機会を逃さぬよう、日本北部の戦力を排除せよ。
event_stage_intro_20504=カムチャツカ半島南部が米軍の攻撃を受けている。ここはアリューシャン列島の近くに位置し、米国とわが国の領土が隣接している。指揮部はアラスカ進攻作戦を計画しているが、米軍の奇襲攻撃によってその後の計画が乱されることがあってはなるまい。
event_stage_intro_20505=情報によると、米軍はより爆発力のある核兵器を開発中だそうだ。彼らはアラスカの深海港を切り開くために核兵器を使用することまで計画している。 アンカレジの研究施設が今回のターゲットだ。敵が撤退する前に周辺地域を制圧せよ。
event_stage_intro_20506=アンカレジの守備軍は依然として悪あがきをしているが、我々も米軍の守備を簡単に突破することはできない。目下は敵の動きを警戒せよ。同時に内陸に攻め込み、守備軍を三方から包囲して退路を断て。
event_stage_intro_20507=米軍は我々の攻撃を受けて退却している。防衛線は破られ続けているが、敵はこの時間を利用して西海岸に向けて軍隊を集結させている。最終決戦がもうすぐ始まるだろう。目の前の障害はすべて取り除いてみせる。
event_stage_intro_20511=米軍の行動が再び半島のバランスを破壊した。敵は国境を越えている、目前の脅威を消滅させるため、友軍支援の部隊を直ちに編成せよ。新兵器を有効に使い、敵にその無謀さの代償を払わせるのだ！
event_stage_intro_20512=米国は日本と手を組み、ソ連港周辺海域と樺太島南部を掌握した。我々は米国の侵略の決意を甘く見ていたようだが、敵は我々の力を過小評価している。偉大なる祖国に挑戦する者は、誰であれ破滅に至ることを教えてやろう。
event_stage_intro_20513=米軍の野望が明るみになった。敵の拡張に対応するため、千島列島近海に防衛軍を配備させている。この機会を逃さぬよう、日本北部の戦力を排除せよ。
event_stage_intro_20514=カムチャツカ半島南部が米軍の攻撃を受けている。ここはアリューシャン列島の近くに位置し、米国とわが国の領土が隣接している。指揮部はアラスカ進攻作戦を計画しているが、米軍の奇襲攻撃によってその後の計画が乱されることがあってはなるまい。
event_stage_intro_20515=情報によると、米軍はより爆発力のある核兵器を開発中だそうだ。彼らはアラスカの深海港を切り開くために核兵器を使用することまで計画している。 アンカレジの研究施設が今回のターゲットだ。敵が撤退する前に周辺地域を制圧せよ。
event_stage_intro_20516=アンカレジの守備軍は依然として悪あがきをしているが、我々も米軍の守備を簡単に突破することはできない。目下は敵の動きを警戒せよ。同時に内陸に攻め込み、守備軍を三方から包囲して退路を断て。
event_stage_intro_20517=米軍は我々の攻撃を受けて退却している。防衛線は破られ続けているが、敵はこの時間を利用して西海岸に向けて軍隊を集結させている。最終決戦がもうすぐ始まるだろう。目の前の障害はすべて取り除いてみせる。

