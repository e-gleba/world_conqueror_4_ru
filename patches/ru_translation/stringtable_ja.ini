armygroup_event_desc_1=ドイツは多兵種機動化の電撃戦術を採用。1939年に迅速にポーランドを侵略し、それが英仏によるドイツへの宣戦布告を引き起こすこととなり、第二次世界大戦が正式に勃発する。
armygroup_event_desc_2=アメリカはイギリスとフランスに多大な軍事援助を提供し、二国の武器装備への重要な支援となった。
armygroup_event_desc_3=ソ連は厳しい冬季にフィンランド攻略へと踏み出した。勝利を収めたソ連だが、同時に巨大な代償を払うことになる。
armygroup_event_desc_4=ドイツはノルウェーとデンマークに対して攻撃を開始。
armygroup_event_desc_5=ルーマニアの豊富な石油資源はドイツに戦略的な燃料支援を提供し、枢軸国の戦闘能力に重要な影響を与えた。
armygroup_event_desc_6=ドイツは電撃戦を用いて低地諸国に侵攻し、迅速にオランダとベルギーの防衛線を突破する。
armygroup_event_desc_7=マンシュタイン計画は1940年5月に開始。アルデンヌの森林を通過することでマジノ線を迂回し、英仏連合軍を包囲する形勢に至った。
armygroup_event_desc_8=チャーチルがイギリスの首相に就任。彼のリーダーシップと激励的な演説はイギリスの抵抗精神を固めることとなる。
armygroup_event_desc_9=ドイツ軍に包囲された状況下、連合軍はダンケルクの海岸で大規模な撤退作戦を行う。軍用、民間の海路を通じて約33万人の兵士をイギリスに帰還させ、その後の反撃の鍵となる基盤を築いた。
armygroup_event_desc_10=フランス軍は縦深防御行動および遅滞戦術を実行し、ドイツ軍部隊に対して大きな損耗を与えた。
armygroup_event_desc_11=第二次世界大戦中、スウェーデンはドイツに大量の高品質の鉄鉱石を供給することで、枢軸国の軍事力強化に重要な役割を果たす。
armygroup_event_desc_12=パリの陥落はフランスの敗北を象徴し、西ヨーロッパ戦線はドイツの全面的な勝利で終わりを告げた。これは戦争初期におけるドイツの重要な戦略的勝利を意味していた。
armygroup_event_desc_13=1940年にドイツ軍は、英国の軍事力を海上および空中からの攻撃により破壊することを目指した包括的な「アシカ作戦」を策定。
armygroup_event_desc_14=1940年、イギリス上空で展開された決定的な空中戦は、イギリス王立空軍がドイツ空軍の侵攻を成功裏に阻止し、連合軍がヨーロッパ戦線で重要な勝利を収めたことを示した。
armygroup_event_desc_15=ドイツ海軍は潜水艦の協力行動を通じて、敵艦隊や商船に無差別攻撃を行い、連合国の船団に対する脅威となった。
armygroup_event_desc_16=第二次世界大戦中、大西洋で激しい海上戦闘が発生し、ドイツの潜水艦はウルフパック戦術を用いて連合国の船舶を攻撃。一方、連合国は護衛と対潜作戦を採用した。
armygroup_event_desc_17=イタリアはイギリスおよびフランスに宣戦布告し、30万人の軍隊を動員してアルプス山脈およびニース地域への攻撃を開始した。
armygroup_event_desc_18=ポーランド軍は防御を主体とする作戦計画を策定し、西方領土の堅守を重点とし、西部戦線における連合軍のドイツへの攻撃を待機した。
armygroup_event_desc_19=枢軸国の軍隊は各方面からユーゴスラビアに侵攻し、極めて短時間で複数の防衛線を突破し、ベオグラードに対して挟撃攻勢を仕掛けた。
armygroup_event_desc_20=C集団軍は大量の火砲と人員を動員し、ライン川を越えてマジノ線に対して正面攻撃を開始した。
armygroup_event_desc_21=ドイツとイタリアの連合軍は北アフリカ戦線に兵力を集結し、エジプトに対して大規模な攻撃を開始し、イギリス軍が支配するスエズ運河を脅かした。
armygroup_event_desc_22=イギリス軍は「コンパス作戦」を発動し、エジプトに駐留するイタリア軍に対して奇襲を仕掛け、その防衛線を迅速に撃破してリビア国境まで進出し、北アフリカ戦局を覆した。
armygroup_event_desc_23=ロンメルはドイツ・イタリア連合軍を指揮して激しい反攻を開始し、イギリス軍の防衛線を突破、アレクサンドリア港を占領することに成功し、スエズ運河を脅かした。
armygroup_event_desc_24=ドイツ・イタリア連合軍は攻勢をかけ、トブルク港を包囲し、英連邦軍の補給線を断とうとしたが、オーストラリア軍は陣地を堅守し、戦況は膠着状態に陥った。
armygroup_event_desc_25=イギリス軍は「バトルアックス作戦」を発動し、複数方向からドイツ・イタリア陣地を攻撃したが、初期には進展を得たものの、ロンメルの反撃に遭い、作戦は最終的に失敗した。
armygroup_event_desc_26=英連邦軍は「クルセイダー作戦」を発動し、大量の戦車部隊を集結させ全面反攻を開始。ロンメルを撃退し、トブルクの包囲を解除、北アフリカ戦線は転機を迎えた。
armygroup_event_desc_27=ロンメルはその卓越した戦功により元帥の称号を授与され、ドイツ軍の士気は大きく高まり、彼は不敗の象徴とされた。
armygroup_event_desc_28=地中海におけるイギリス軍の補給線を弱体化させるため、枢軸国空軍はスペイン領空を通過してジブラルタル港へ夜間爆撃を行った。大きな被害は与えられなかったものの、イギリス軍に防御強化を強いた。
armygroup_event_desc_29=ロンメルの攻勢はエジプト本土に迫り、イギリス軍はエル・アラメインに防衛線を築いて死守した。両軍は激戦を繰り広げたが決着はつかず、北アフリカ戦線は膠着状態となった。
armygroup_event_desc_30=米英連合軍はフランス領北アフリカの三地点に同時上陸し、「トーチ作戦」を展開。フランス植民地政権は動揺し、枢軸国の西部防衛線は深刻な脅威にさらされた。
armygroup_event_desc_31=モントゴメリーはイギリス第8軍を指揮して全面反攻を開始し、ロンメル部隊を撃破。枢軸国の北アフリカでの攻勢は完全に崩壊し、戦局は逆転に向かい始めた。
armygroup_event_desc_32=連合軍部隊は「トーチ作戦」を発動し、モロッコとアルジェリアに多方面から上陸。これによりヴィシー政権のフランス軍は停戦を余儀なくされ、枢軸国は四面楚歌となり、チュニジア戦線の圧力は一気に高まった。
armygroup_event_desc_33=「トーチ作戦」後、ヴィシー政権下のフランス軍は連合軍側に寝返り、「自由フランス」の勢力は急速に拡大。北アフリカにおける枢軸国の状況はますます不利となった。
armygroup_event_desc_34=連合軍は東西からチュニジアを挟撃し、ドイツ・イタリア連合軍は甚大な損害を被り、数十万の兵が降伏を余儀なくされ、チュニジアからの撤退を強いられた。
armygroup_event_desc_35=ロンメルはドイツ軍装甲部隊を率いてカセリン峠を奇襲。アメリカ軍は初の大規模戦闘に直面し、指揮の混乱により大きな損害を被り、前線は後退を余儀なくされた。
armygroup_event_desc_36=連合軍は北アフリカにおけるドイツ軍の補給線を遮断し、燃料や弾薬が深刻に不足。アフリカ軍団の戦闘能力は大幅に低下し、戦局は次第に悪化していった。
armygroup_event_desc_37=イギリス軍はスエズ運河から前線までの補給線を回復させ、大量の物資と装備が到着。前線部隊の戦闘力は急速に回復した。
armygroup_event_desc_38=連合軍は地中海を渡って上陸作戦を敢行し、イタリア軍の防衛線を速やかに突破、西シチリア全域を占領。枢軸国の南翼が露出し、イタリア本土戦線が幕を開けた。
armygroup_event_desc_39=バルカン半島でのイタリア軍の敗北を受け、ドイツ軍は「マリタ作戦」を発動。ギリシャとユーゴスラビアを電撃的に制圧し、バルカン全域の掌握を目指した。
armygroup_event_desc_40=ドイツ軍空挺部隊はクレタ島に強襲上陸を敢行。激しい抵抗に遭いながらも最終的に島を制圧したが、甚大な損失を被った。



