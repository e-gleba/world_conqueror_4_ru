army_buff_desc_1362=劣化ウラン弾：会心率が30%増加し、攻撃時に対象の45%の装甲を無視する。
army_buff_desc_1363=劣化ウラン弾：会心率が40%増加し、攻撃時に対象の60%の装甲を無視する。
army_buff_desc_1371=ヘルファイアミサイル ：目標1マス範囲内の他の標的に25%の追加ダメージを与える。
army_buff_desc_1372=ヘルファイアミサイル ：目標1マス範囲内の他の標的に50%の追加ダメージを与える。
army_buff_desc_1373=ヘルファイアミサイル ：目標1マス範囲内の他の標的に80%の追加ダメージを与える。
