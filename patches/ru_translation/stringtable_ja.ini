event_intro_490=ドイツ軍需産業の鉄鉱石供給を確保するため、1940年4月9日未明、ドイツ軍は「ヴェーザー演習作戦」を発動した。デンマークは開戦直後に降伏。ノルウェーは地形の利点と連合軍の支援を受けていたが、6月10日に陥落。この戦いでドイツは北海とバルト海の要衝を掌握し、スカンジナビアの鉄鉱石輸送路を完全に確保した。
event_intro_491=ナルヴィクはスウェーデン産鉄鉱石の北大西洋不凍港として重要だったため、ノルウェー戦役開始後、連合軍とドイツ軍は激しい争奪戦を展開。1940年4月9日、ドイツはナルヴィクを占領した。英軍は直ちに奪還を試み、4月10日と13日に海戦が勃発。しかし地上戦準備が不十分で、英軍は独艦を複数撃沈したものの、港の占領には失敗した。
event_intro_492=1945年4月16日、ソ連軍は3個主力方面軍を集結させベルリンへの最終攻勢（ベルリンの戦い）を開始。籠城するドイツ軍上層部は徹底抗戦したが、ソ連軍の砲撃で防衛線は崩壊。4月30日、総統地下壕で銃声が響いた。2日後、ベルリン防衛司令官ヴァイトリングが降伏文書に署名し、第三帝国は完全に滅びた。
event_intro_493=真珠湾攻撃後に落ち込んだアメリカ国民の士気を高めるため、1942年4月18日、空母「ホーネット」から発艦した16機のB-25ミッチェル爆撃機が東京など複数の都市への空襲を成功させた。1機はソ連領内に不時着し、残りは浙江省など中国各地で墜落またはパラシュート降下した。この作戦自体による被害は大きくなかったものの、日本軍に強い衝撃を与えた。
event_intro_494=枢軸国の北アフリカにおける最後の拠点を除くため、1943年4月22日、連合軍は「ヴァルカン作戦」を開始。イギリス軍はチュニスを攻撃し、アメリカ軍はビゼルトへ進撃した。ドイツとイタリア軍は山岳陣地を拠点に抵抗したが、補給の不足と制空権の喪失により、5月6日に防衛線が崩壊し、最終的に5月13日に25万人が降伏。この戦いは地中海の航路の安全を確保し、2ヶ月後の「ハスキー作戦」開始へとつながった。
event_intro_495=1943年9月にイタリアが降伏した後、ドイツ軍はエーゲ海諸島の防衛を全面的に引き継いだ。ノルマンディー上陸作戦の欺瞞作戦の一環として、1944年4月24日、イギリス海軍特殊ボート隊（SBS）はサントリーニ島を襲撃し、ドイツ軍の沿岸監視所と無線中継設備を破壊した。この奇襲はドイツ軍のエーゲ海航行監視を妨害し、同地の防衛強化を強いたことで地中海戦域の主力作戦を間接的に支援した。
event_intro_496=1944年4月28日、ノルマンディー上陸演習中、連合軍の通信不備により、ドイツ軍のEボート9隻がライム湾でT-4護衛部隊を奇襲。LST揚陸艦2隻が撃沈、1隻が大破し、749人以上が死亡。これは上陸作戦前の連合軍にとって最も大きな一回の損害であり、この教訓から通信周波数の統一がなされ、本番の作戦での指揮連携の確保につながった。
event_intro_497=ボルネオ戦役は南西太平洋戦域における連合軍の最後の戦いだった。1945年5月1日から7月21日まで、オーストラリア第1軍は段階的にタラカン、ブルネイ湾、バリクパパンへの上陸を実施し、油田と飛行場の確保を目的とした。だが、事前の爆撃でインフラが破壊され、加えて日本軍主力は戦略的撤退を済ませており、最終的な軍事的効果は限定的だった。
event_intro_498=南太平洋の戦略主導権を握るため、日本軍はMO作戦を発動し、海上からポートモレスビーを攻撃。米軍は情報を傍受し、第17・第11任務部隊を派遣して迎撃。1942年5月4日、史上初の空母同士の戦い「珊瑚海海戦」が勃発。米軍は祥鳳を撃沈、翔鶴を大破させ、日本軍はレキシントンを失い、ヨークタウンを損傷。戦術的には損害が拮抗していたが、日本軍の作戦目的は挫かれ、戦略的には連合軍の勝利となった。
event_intro_499=1940年5月10日、ドイツ軍は「マンシュタイン計画」を発動した。B軍集団がオランダおよびベルギー中央部へ陽動攻撃を仕掛ける一方、主力のA軍集団はアルデンヌの森を突破し、連合軍防衛線の弱点を突いた。連合軍は「D計画」に基づいてフランス第1軍集団とイギリス海外派遣軍をディル＝ブレダ防衛線へ前進させたが、5月14日にドイツ第19装甲師団がスダンを突破して西進し、35万人の連合軍を包囲することに成功した。主要な交通拠点を失い、防衛線が崩壊したことで、ベルギー国王レオポルド3世は5月28日、単独で降伏を決断した。
event_intro_4100=1942年5月12日、ソ連軍は冬季反攻で得た戦果を拡大するために第二次ハリコフ攻勢を開始した。最初はハリコフの市街近郊まで前進したものの、南側の防御が脆弱だったため、5月17日にはドイツ軍の「フレデリクス作戦」による北と南からの挟撃を受け、わずか3日間で約24万人のソ連兵が包囲された。5月28日には損害が20万人を超え、南部戦線は崩壊。これによりドイツ軍は6月に「ブラウ作戦」を発動し、コーカサスへ急速に進撃したことが、東部戦線における戦略的転換点をもたらす大きな契機となった。
event_intro_4101=1941年5月15日、イギリス軍はリビアのソルーム線に対して攻勢をかけ、一時的にハルファヤ峠とカプッツォ砦を占領した。しかし、ドイツ軍が迅速に増援を送り反撃を行い、砦を奪回。5月27日にはハルファヤ峠を再奪還し、連合軍はハルファヤ峠を取り戻すため「バトルアクス作戦」を開始せざるを得なくなった。
event_intro_4102=1941年5月20日、ドイツ軍は史上初の大規模空挺作戦「マーキュリー作戦」を発動し、クレタ島を制圧してバルカン空襲の拠点を断とうとした。約1.3万の空挺兵と山岳部隊が島内3空港を攻撃し、英連邦とギリシャ軍の激しい抵抗に遭う。戦術的勝利を収めたが、空挺兵の損害は甚大で、ドイツ軍は以後このような作戦を行わなかった。一方で、連合軍は後の空挺作戦に必要な経験を得た。
event_intro_4103=1940年5月22日、ドイツ第10装甲師団はカレーを包囲。4000人の守備隊は古城を死守し、26日までドイツ軍と激戦を展開。200人の負傷者を除き、全員が戦死または捕虜となった。この戦いでドイツ軍を3日間牽制し、ダンケルク防衛線を強化、「ダイナモ作戦」の時間的余裕を確保した。
event_intro_4104=1940年5月、改訂された「黄色作戦」を実行したドイツ軍はスダンでフランス防衛線を突破し、北側に配置されていた連合軍30万以上をフランドル地方で包囲した。ドイツ軍による全滅を避けるため、連合軍は5月26日、「ダイナモ作戦」を発動し、9日間でダンケルクから33万8千人を撤退させることに成功。こうして主力戦力と、将来の反攻による解放への希望を守り抜いた。
event_intro_4105=1940年5月28日、ドイツ軍はリールにいたフランス第1軍団4万人を包囲。守備隊は激しく抵抗し、ドイツの中将を捕虜にするなど奮戦したが、6月1日に降伏。この戦いでドイツ軍7個師団を拘束し、ダンケルク撤退作戦を10万人以上多く救出することに貢献した。
event_intro_4106=1942年5月31日から6月8日にかけて、日本海軍はオーストラリアとアメリカ間の戦略物資輸送を妨害するため、潜水艦部隊によるシドニー港への連続攻撃を実施。攻撃目標は連合軍艦船だったが、9日間で沈めたのは補給艦1隻にとどまった。しかし、この襲撃を契機に豪州軍は港湾防衛体制を全面的に強化し、太平洋戦争後半における防衛能力の基盤となった。

dialogue_3016=攻撃こそが勇気だと思っているだろうが、本当の勇気とは、敵が目の前にいると知りながらも、冷静に一発一発を撃ち込めることだ。
dialogue_3017=敵の兵力と戦力は確かに圧倒的だが、我々の意志はそれ以上に揺るぎない。この地の一寸一寸には、フィンランドの誇りと尊厳が宿っているのだ。
dialogue_3018=やつらの防線は堅固に見えるが、我々には信念と決意がある。退却の縁に立っているのではない、歴史の始まりに立っているのだ！
dialogue_3019=計画は予想外の抵抗に遭っている。戦略の修正を考えねば、長期戦に陥るのは避けたい。
dialogue_3020=イギリスもフランスも我々を守ると誓い、ソ連も侵略しないと約束した。とんだ茶番だな。
dialogue_3021=ソ連・ポーランド不可侵条約など、ソ連にとってはただの紙切れにすぎなかった。奴らはドイツよりも狡猾で、西部戦線が崩壊するのを待ってから背後から襲いかかってきたのだ。
dialogue_3022=「不可侵」の意味を教えてくれて感謝するよ、ソ連。攻撃しないのは、攻撃したくなるまで、ってことだろ？次に「平和」を語るやつを誰が信じる？
dialogue_3023=フランスが10年かけて築いた防線を、我々は10日で迂回した。
dialogue_3024=どの戦術プランにも、こんな状況は想定されていなかった……完全に騙された。我々は間違った場所を防衛していたんだ！
dialogue_3025=既に時を失ったが、意志まで失うわけにはいかない。総員ただちに集結し、前線を安定させろ。敵を押しとどめるんだ。まだ戦える。フランスはそう簡単に陥落しない！

