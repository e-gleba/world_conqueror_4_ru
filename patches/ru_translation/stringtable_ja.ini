;战役对话
dialogue_2281=フィンランドは我々の領土要求を拒否した。奴らを待ち受けているのは、最新鋭の武器と大胆不敵の精神を備えた兵士たちであり、わが軍の勝利によってまもなく終結する戦争である。
dialogue_2282=われわれはソ連の権益を尊重するが、わが国の領土と主権を侵害するいかなる者も容赦しない。
dialogue_2283=戦争に行くのは良い経験ではないが、もし我々が戦場に行かなければ、誰がこの土地を守るのだろうか？
dialogue_2284=フィンランドの地形はわが軍の行軍に適していない。戦争は過酷なものであり、自己満足や無謀によって過ちを犯してはならない。我が軍はもっと慎重に、賢明に指揮を執る必要がある。敵の実力と脅威を軽視してはならない。
dialogue_2285=貴様らは我々の実力と覚悟を甘く見るべきでは無い。フィンランド国民は誰の圧力や脅しにも屈しない。
dialogue_2286=われわれは、互いの対立が平和的な交渉によって解決されることを望んでいるが、必要であれば、わが国を防衛するためにあらゆる手段を講じる。
dialogue_2291=ポーランドがグライヴィッツの独ラジオ局を攻撃したことは、ドイツ人にとって許しがたい挑発行為であり、われわれは必ずや、より断固とした手段で対応する。
dialogue_2292=この事件はドイツが勝手に引き起こしたものだ。我々は、ドイツ人による戦争の可能性に警戒する必要がある。
dialogue_2293=ブランデンブルク特殊部隊が敵地に展開済みで、我々と共同攻撃を仕掛ける予定だ。攻撃の準備をしてください！
dialogue_2294=敵の大将は撃破され、敵の戦意は失墜した。攻撃を続行せよ、勝利は手の届くところにある。
dialogue_2295=ポーランドはドイツとの戦争で混乱し、瓦解した。その結果、ポーランドとの間のこれまでのソ連の協定はすべて無効となった。
dialogue_2296=ソ連軍は、ポーランドのロシア系民族を保護し、彼らに安寧をもたらすために越境する。
dialogue_2301=低地諸国の資源と軍事施設は帝国の拡張計画にとって潜在的な脅威であるため、英仏に先駆けてこれらの領土を帝国の土地にすることが不可欠なのだ。
dialogue_2302=ソ連に侵攻する前に、ドイツ軍は西ヨーロッパの脅威をすべて取り除かなければならない。
dialogue_2303=マジノ線は難攻不落のように見えるかもしれないが、それでも我々の前進を止めることはできない。連合軍は機械化部隊の実力を真に理解しておらず、我々の戦車は敵が予想もしないような場所から攻撃を仕掛けていくことになる。
dialogue_2304=ドイツ軍の主力部隊がマジノ線を迂回してアルデンヌの森に現れたことで、我々は意表を突かれた。
dialogue_2305=我々はこの奇襲攻撃で打ち負かされることはない。必要なあらゆる手段を講じて、最後の瞬間までドイツの攻撃に断固として抵抗する。
dialogue_2306=アルデンヌの森での攻撃は、予想外の抵抗を受けているようだ。発想を転換し、多方面から攻撃する必要がある！
dialogue_2307=私たちはあまりにも多くの苦難を経験し、多くの家族や友人を失った。しかし、我々はあきらめてはならない。戦い続けなければならない。勝利は目前だ。
dialogue_2308=ソ連に侵攻する部隊が集結した。中央軍集団として、初戦に勝利し、一挙にミンスクを占領しなければならない！
dialogue_2309=ドイツ軍がモロトフ＝リッベントロップ協定に違反してソ連の領土に侵略してきた。戦車のエンジン音が聞こえてくる、防衛のため、全戦線で態勢を立て直せ！
dialogue_2310=ソ連におけるドイツの攻勢は止められない。フィンランドも自国の領土を取り戻し、カレリア地峡を奪還しなければならない。
dialogue_2311=ドイツ軍は南部での我々の作戦に協力してくれるだろう。
dialogue_2312=ラドガ湖の空港は防御が手薄だ。この空港を占領することが重要である。
dialogue_2313=ミンスクでの勝利は、電撃戦の成功を再び証明した。敵はわが装甲集団の攻撃を止めることはできない。
dialogue_2314=敵にもう一歩も前進させてはならない。スモレンスクを死守しなければならない！
dialogue_2315=敵軍は多数とはいえ、積極的な攻撃態勢をとることはできない。
dialogue_2316=キエフはコーカサスへの玄関口である。挟撃作戦でキエフを占領せよ！
dialogue_2317=レニングラードは敵の守りが堅いため、いったん包囲してから、一歩一歩攻勢をかけていく必要がある。
dialogue_2318=フィンランド軍は北部で我々と合流し、攻撃を開始する。
dialogue_2319=ソ連はラドガ湖を通じてレニングラードに安定的に物資を送っているが、これを阻止しなければならない。
dialogue_2320=補給線を断ち、奴らを殲滅する！
dialogue_2321=悪い知らせは、戦車部隊が撤退してしまったことで、今のところ使えるのは歩兵部隊と砲兵部隊だけであるということだ。
dialogue_2322=良い知らせは、母国からのグスタフ列車砲が援護してくれることだ。
dialogue_2323=80cm列車砲を味あわせてやれ。これでセヴァストポリは震え上がるだろう！
dialogue_2324=敵がハリコフから工場設備を疎開させる前に、街を占領しなければならない！
dialogue_2325=敵のロケット砲に注意せよ。彼らの火器管制により、我々は大きな損害を被った。
dialogue_2326=敵はモスクワに100万人以上の軍隊を集めている。これほどの兵力と凍てつく冬は、我々にとって大きな脅威となる。
dialogue_2327=バルバロッサ作戦が成功するかどうかは、この戦いにかかっている！
dialogue_2328=前進し続けろ！双眼鏡からクレムリンの頂上に赤い星が見える。
dialogue_2329=もう失うものは何もない。一歩も引くわけにはいかない。これは祖国ソ連の存亡をかけた戦いだ！
dialogue_2330=スターリングラードの工場と資源は我々にとって非常に重要だ。司令部からの指令により、この都市を占領しなければならない！
dialogue_2331=この壮麗な都市を放棄してはならない。我々はこの街の名にかけて戦うのだ！
dialogue_2332=南へ進軍し、西の我が軍集団に合流せよ。
dialogue_2333=ワルシャワは占領された。総司令官、ソ連軍を駆逐することで、ポーランド全土は我々のものとなる。
dialogue_2334=閣下、奴らの防衛は瓦解しました。南から迂回攻撃を仕掛けます
dialogue_2335=パリに向かって前進せよ！
dialogue_2336=南方軍と合流せよ。我々はパリを掃討する！
dialogue_2337=決して諦めずに踏みとどまるんだ！必ずこの街を掌握してみせる。
dialogue_2338=司令官、南方から攻撃を開始してください。北から友軍がクルスクを包囲するために我々を支援します。
dialogue_2339=赤軍がブダペストを包囲しました。司令官、軍を率いてソ連の攻勢からブダペストを守ってください。
dialogue_2340=街に押し寄せるソビエト軍を何としても撃退せよ。彼らはドイツ人を捕虜として生かしてはおかないだろう。戦うか死ぬかだ！
dialogue_2341=多勢に無勢すぎる。これ以上持ちこたえることはできない
dialogue_2342=流れが変わりつつあります。ブダペストは陥落寸前です。 司令官、脱出と避難の指揮をお願いします。敵に退路を断たれてはならない。
dialogue_2343=司令官閣下、イギリス軍が東から上陸し、閣下の攻撃を援護します。共にチュニジアを攻撃し、ナチス共をアフリカから追い出すのです！
dialogue_2344=敵の守備隊は軟弱だ。今しかない！シチリア上陸の好機を逃すな。
dialogue_2345=シチリアは我々の支配下にある。我々は敵を掌握している。これは決定的な勝利だ。
dialogue_2346=2年以上の準備期間を経て、この輝かしい瞬間が近づいている。司令官閣下、連合軍を率いて海岸に上陸し、ノルマンディー地方を掌握せよ。
dialogue_2347=突撃！全力で攻撃しろ！連合軍の上陸を成功させるな。
dialogue_2348=フィリピンは我々にとって重要極まりない。我々はルソン島に上陸し、攻撃する計画だ。閣下、マッカーサー元帥は我々を援護してくれます。ルソンを占領し、フィリピンの統治権を回復し、太平洋における日本の戦力を弱体化させてください。
dialogue_2349=首都マニラはすでに我々が占領している。閣下、どうか無謀なことはなさらずに、残存する日本軍の追撃を続けてください。
dialogue_2350=橋を破壊し、道を封鎖してアメリカ軍の進軍を阻止せよ。
dialogue_2351=ドイツ軍は我々よりはるかに劣勢だ。敵は自らの死を求めている。この戦いを早く終わらせるのだ。
dialogue_2352=何ということだ。先遣隊はあまりに無謀で、敗走してしまった。司令官閣下、どうか事態を収拾するよう導いてください。
dialogue_2353=ドイツは止められない。兵士達よ、前進せよ！我々の目標はモスクワだ！
dialogue_2354=モスクワを狙うなどとはナチス共は傲慢だ。その驕りの報いを受けるだろう。司令官、人民を指揮して首都を守るのだ。
dialogue_2355=無敵のドイツ電撃戦の神話は打ち砕かれようとしている。勝利はソ連のものである。
dialogue_2356=我々は勝利目前ではあるが、勝利の代償は大きい。国のために命を捧げたソ連兵のことを常に忘れないでほしい。
dialogue_2357=このような大規模な装甲部隊では、激しい戦いになるだろう。司令官閣下、ドイツ軍の攻勢に対し、我々を指揮して勝利してください。
dialogue_2358=ドイツ軍の北からの挟撃に注意せよ！あらゆる戦力を投入して防御陣形を維持せよ。
dialogue_2359=反撃の狼煙が上がった。残存するドイツ軍を追撃、撃破せよ！
dialogue_2360=ソビエト連邦の失地回復とナチス・ドイツへの反撃の狼煙を上げるために、閣下が先陣を切ってください！
dialogue_2361=ベラルーシは解放された。われわれが成し遂げた勝利は称賛に値する。勝利の希求を続け、西側の失地ををさらに奪回しよう。
dialogue_2362=司令官閣下、我々はベルリンに入城しようとしています。米英軍が攻勢を支援してくれるでしょう。
dialogue_2363=敵がベルリンに侵入するのを何としても阻止し、総統を守らなければならない！
dialogue_2364=ドイツは崩壊した。この戦争を終わらせる時だ。
dialogue_2365=敵に退路はない。これが奴らの末路だ。
dialogue_2366=兵士諸君、持ちこたえろ！援軍は必ず到着する。
dialogue_2367=イギリスの援軍だ！攻撃に戦力を集中しろ 奴らに付け入る隙を与えるな！
dialogue_2368=イギリス軍は数では我々を上回るが、攻撃は稚拙で不完全だ。司令官閣下、敵の攻勢を攪乱し、我々を勝利に導いてください。
dialogue_2369=兵力を結集し、側面から後方へ奇襲攻撃を仕掛けて敵に大打撃を与えよう！
dialogue_2370=イギリスの防衛線はガザラの海岸から南に向かって広がっており、西から正面攻撃を仕掛ければ、間違いなく大きな損害を被る。司令官閣下、我々を率いて敵の後方に迂回し、奇襲攻撃を仕掛けてください。
dialogue_2371=ドイツ軍だ！一体なぜ後ろにいるんだ？！
dialogue_2372=トブルクは陥落した。兵士諸君、退却せよ！
dialogue_2373=司令官閣下、カイロに進軍し、連合国軍がエジプトを固める前にわれわれを支援してください。
dialogue_2374=敵の抵抗は激しい。兵士諸君、オール・オア・ナッシングだ。敵に打ち勝つという信条を持ちたまえ！
dialogue_2375=あれは敵の増援部隊だ！司令官、イギリス軍の包囲網を突破するよう軍勢を指揮してください。
dialogue_2376=敵の増援と物資が絶えず到着している。我々は苦境に立たされている
dialogue_2377=ドイツ帝国は必ず復活する！


lacklegion_desc=以下種類の部隊を召募する必要があります。

event_301=グデーリアンの試練
event_302=マーシャルの試練
event_303=ジューコフの試練
event_304=ロンメルの試練
event_305=モントゴメリーの試練
event_306=アイゼンハワーの試練
event_307=マンシュタインの試練
event_308=コーネフの試練

event_501=友軍の救援
event_502=陣地防御
event_503=敵の殲滅
event_504=物資の蓄積
event_511=友軍の救援-精鋭
event_512=陣地防御-精鋭
event_513=敵の殲滅-精鋭
event_514=物資の蓄積-精鋭

eventgeneral_rule=将軍の試練ルール
eventgeneral_rule_1=1. イベントキャンペーンは期間限定で開催されます。ステージをクリアして報酬を手に入れるため、指揮官は余裕を持ったスケジュールを立てることをお勧めします。
eventgeneral_rule_2=2.このイベントは「伝記」モードのハード難易度ですが、「伝記」をクリアしなくても挑戦可能です。
eventgeneral_rule_3=3.敵軍は2つの強化状態を獲得します（イベント開始時にランダムに2つ選ばれ、イベント終了まで継続）。各指揮官はシナリオに挑戦する際、行軍ルートを慎重に計画してください。
eventgeneral_rule_4=4.ステージクリア後、最高クリア星数が記録され、一定数の星を累積するとステージ報酬を受け取れます。
eventgeneral_rule_5=5.区間の報酬は、リボン報酬とエリート部隊の破片の2種類に分かれており、報酬を受け取る時ランダムで一定量の報酬をもらえます。

challenge_rule=チャレンジイベントのルール
challenge_rule_1=1. 本イベントのチャレンジステージは期間限定で開催されます。各指揮官は時間配分を適切に計画し、クリアして報酬の獲得を目指してください。
challenge_rule_2=2. イベントのチャレンジステージには普通モードと困難モードがあり、困難モードは普通モードをクリアすると開放されます。
challenge_rule_3=3. 困難モードのチャレンジステージでは、敵軍は2つの強化状態を獲得します（イベント開始時にランダムに2つ選ばれ、イベント終了まで持続します）。
challenge_rule_4=4. イベントのチャレンジステージは4つのタイプに分かれており、「友軍支援」、「陣地防衛」、「敵軍殲滅」、「資材蓄積」があります。各回のイベントでは一つのタイプのチャレンジステージが開催されます。
challenge_rule_5=5. 指定のステージをクリアすると、ステージ報酬を受け取ることができます。ステージ報酬は固定報酬です。
challenge_rule_6=6. イベントのチャレンジステージでは、防衛施設を建設することはできません。

achievement 3801=イベントモード「将軍の試練」を1章突破
achievement 3802=イベントモード「将軍の試練」を3章突破
achievement 3803=イベントモード「将軍の試練」を5章突破
achievement 3804=イベントモード「将軍の試練」を8章突破

title_name_1009=狩猟者
title_desc_1009=「精鋭部隊」装甲の指揮時、攻撃力+12、移動力+2

general_stage_name_141=エル・アラメインの戦い
general_stage_name_142=シチリア上陸作戦
general_stage_name_143=ノルマンディー上陸作戦
general_stage_name_144=マーケット・ガーデン作戦
general_stage_name_145=バルジの戦い

general_stage_intro_141=1942年10月、「狩猟者」モントゴメリー将軍の指揮下、連合国はドイツ軍の防衛線を突破し、エジプト北部で一連の重要な勝利を収めた。アラメイン会戦は第二次世界大戦中の北アフリカ戦線の転換点であり、連合国がドイツ軍を北アフリカから駆逐する礎となる。
general_stage_intro_142=1943年、連合国はシチリア島で大規模な海上上陸作戦を実行、急速に島占拠しドイツ軍の駆逐に成功する。この作戦はイタリアの解放への道を開いただけでなく、地中海戦域での連合国の重要な勝利の象徴となった。
general_stage_intro_143=最高司令官の一人、モントゴメリーはノルマンディーで連合軍の大規模上陸を指揮。空挺、海上からの上陸及び地上推進により橋頭堡を築き、ドイツ軍防衛線を突破し、欧州解放の重要な足がかりを築いた。
general_stage_intro_144=連合軍はオランダの重要な橋を占拠し、迅速にドイツの内陸に進出する。大規模な空挺作戦と、陸上部隊と協力作戦を進行したが、予期せぬ事態とドイツ軍の強固な抵抗に遭遇。そこにどのような試練が待ち受けるのか？
general_stage_intro_145=1944年末、ドイツ軍は厳しい寒さの中で攻勢をかけ、連合国の補給線を断つことを試みた。しかし、連合軍は陣地を守りきり反撃に転じ、最終的にドイツ軍を窮地に追い込み、次の進軍に向けて道を開いた。

dialogue_2401=進撃を加速しろ！イギリス軍が到着する前にノルウェーの防衛軍を打ち負かすのだ。
dialogue_2402=敵は我々を分断し包囲しようとしています。これらの封鎖を突破し、彼らの行動を止めましょう。
dialogue_2403=ギリシャの援軍は陸路からの攻撃で協力します。ドイツ軍を完全にギリシャから徹底的に駆逐しましょう。
dialogue_2404=海軍と協力して敵の増援を撃退し、海上で排除しましょう。
dialogue_2405=敵装甲部隊の第一波は私が食い止めます。 敵軍の増援をいち早く迎撃してください。
dialogue_2406=マッカーサーの撤退を支援するため、アメリカ軍のほうから攻撃を仕掛けてきました。
dialogue_2407=側面の敵艦隊に注意し、敵軍主力の撤退を阻止してください。
dialogue_2408=日本陸軍の進攻を全力で阻止し、ニューギニアの拠点を守りましょう。
dialogue_2409=もはや日本軍に退路なし。全速前進！敵艦隊の主力を壊滅させるのだ！
dialogue_2410=北大西洋同盟の部隊が上陸を完了しました。海上からの敵の第二波攻撃に注意してください。
dialogue_2411=敵がアジアで足場を築くことは許されません。彼らの空母群を壊滅させましょう。
dialogue_2412=敵の装甲部隊が南北両方から攻撃を仕掛けています。支援が必要です。
dialogue_2413=敵軍が我々の裏庭に大規模なミサイル基地を建設しました。
dialogue_2414=敵の艦隊を阻止し、敵のミサイル基地が我々にもたらす脅威を完全に排除しましょう。
dialogue_2415=フィンランドの軍隊が我々に奇襲をかけました。援軍部隊が到着するまで必ず持ちこたえましょう！
dialogue_2416=敵軍の北アフリカ補給線は切断されました。東進し、ドイツ軍の防衛線を圧縮しましょう。
dialogue_2417=ドイツ軍が大西洋を封鎖し、まもなく本土に対する全面的な攻撃を仕掛けて来ます。
dialogue_2418=西部戦線の連合国は幾重もの防衛ラインを突破しました。もはや我々には退路が残されていません。
dialogue_2419=敵の攻撃前に先制的に反撃を仕掛け、不意打ちを狙いましょう！
dialogue_2420=我々はイギリス軍に包囲されています。できるだけ早く敵の封鎖線を突破し、援軍と合流しましょう。
dialogue_2421=新たな部隊を速やかに結集し、イギリス軍の進攻を全力で押しとどめましょう。
dialogue_2422=日本軍は正面衝突を諦めました。現在、我々の背後にまわり二つの方向から浸透してきています。
dialogue_2423=敵の急襲を阻止しましょう。我々の装甲部隊は立ちはだかるものすべてを壊滅させます。
dialogue_2424=ソ連軍に包囲されています。陣地を堅守し、海軍の援軍を待ちましょう。
dialogue_2425=盟友たちがソ連軍の攻撃に対抗するのを支援しましょう。私はこの機を利用し、進撃を続けます。
dialogue_2426=アメリカ軍は我々との決戦に全戦力を集中しています。まさに敵軍を徹底的に壊滅させる絶好の機会です。我々を打ち破ることはできません！
dialogue_2427=我々の退路は断たれました。援軍の到着まで全力で持ちこたえましょう。
dialogue_2428=フランス軍はまだ抵抗を諦めていません。敵艦隊の主力を壊滅させ、連合軍を地中海から追い出しましょう。
dialogue_2429=ドイツ軍はもはや我々の上陸を阻止する能力を持っていません。全速前進し、ヨーロッパ全体を解放しましょう。
dialogue_2430=イギリス軍の艦隊が勢いを増しています。我々が敵の艦隊を食い止めます、いち早く敵の援軍を阻止してください。
dialogue_2431=敵の増援部隊が前線に到着しています。日本軍の後方が手薄なうちに、不意打ちを仕掛けましょう。
dialogue_2432=日本軍の艦隊はほとんど残っていません、本土にいる敵の残党を壊滅し、この戦争を早く終結させましょう。
dialogue_2433=我々の撤退経路はアメリカ軍に切断されました。唯一の生存の希望は敵の空母主力を壊滅させることです。
dialogue_2434=危機は勝手に解消されません。我々はただ座して待つわけにはいかず、自発的に行動を起こすのです。
dialogue_2435=アメリカ軍は既に上陸し、連合軍と協力して敵の主要拠点を占拠しています。
dialogue_2436=敵軍は前線に兵力を増強し続け、今や戦場のバランスは崩れつつあります。彼らの勢力拡大を全力で食い止めなければなりません。
dialogue_2437=北アフリカのイタリア軍の補給線は我々によって切断されました。彼らの拠点を占拠し、補給線を確立しましょう。
dialogue_2438=イギリス軍がこの地の工場を支配しています。これらの拠点を奪取しなければ、この戦争を生き残ることはできません。
dialogue_2439=敵軍は我々の都市を占拠しています。我が部隊はすでに準備万端、いつでも反撃を開始できます。
dialogue_2440=ドイツ軍は今や絶望的な状況に追い込まれています。我々と協力して攻撃を開始し、北アフリカの敵を排除しましょう。
dialogue_2441=敵の進攻を遅らせ、可能な限り物資を確保し、将来の反撃に備えましょう。
dialogue_2442=日本軍が我々の連絡を遮断しました。敵軍の急襲に注意し、慎重に進みましょう。
dialogue_2443=敵の中心部に進出しました。まもなく敵軍主力への包囲が完了します。
dialogue_2444=上陸作戦は成功しました、我々の艦隊と協力して敵軍を完全に駆逐しましょう。
dialogue_2445=我々にはもう後退の余地がありません。勝利の望みは防御を堅持するのみです。
dialogue_2446=新たな世界の構造が形成されました。この混乱した時局で生き残るために、私たちは独自の道を探求しなければなりません。

dialogue_2447=敵の火力は非常に強力です。指揮官、敵の防御線の突破口を見つけ、我が軍に進攻を命じてください。
dialogue_2448=イギリス軍がより深い防御線を突破しないように、全力で抵抗し、後方の援軍を待ちましょう。
dialogue_2449=後方支援まで持ちこたえられません、撤退しましょう。
dialogue_2450=兵士たちよ、我々はまもなく偉大な勝利を手にする。気を引き締め、枢軸国をアフリカ大陸から駆逐せよ！
dialogue_2451=敵が兵力を集結できていないうちに、島の東部と南部から上陸しましょう。
dialogue_2452=連合軍がシチリア島に大規模上陸を果たしました。全部隊を出動させ、彼らが島の中心地に深く進入することを阻止しましょう。
dialogue_2453=北側の敵の海上援軍部隊に注意を！
dialogue_2454=同盟軍は初期上陸を終え、拠点を確立しました。指揮官、どうか我々を率いてノルマンディー地方へと深く進軍してください。
dialogue_2455=どんな犠牲を払っても、同盟軍の前進を阻止し、彼らが奥地に侵入するのを防ぐのです！
dialogue_2456=北に進軍してください。味方の空挺部隊が敵の背後に降下し、敵を挟み撃ちにします。
dialogue_2457=連合軍の計画を傍受しました。兵士たちよ、橋を守り、彼らの目的を阻止するのです！
dialogue_2458=戦いのカギとなる橋を制圧できない場合、空中の友軍は無駄に命を落とすことになります。指揮官、どうか我々に力を貸してください。
dialogue_2459=友軍が敵の包囲網に囲まれています、指揮官閣下、彼らを安全に保護するために兵を派遣してください。
dialogue_2460=幸いなことに、イギリス人の助けのおかげで大きな損失は免れました。兵士たちよ、気を立て直し反撃ののろしをあげましょう！
dialogue_2461=ドイツ軍に戦場を分割されないよう注意を払い、兵力を集結させて最後の一撃を与えてください。

elite_intro_63=アルピーニは1872年に設立され、イタリア陸軍に所属する。この部隊は当時比較的先進的な武器装備を備え、第一次世界大戦と第二次世界大戦の間の戦闘で優れたパフォーマンスを発揮した。
elite_intro_64=B-4榴弾砲は特殊な二重往復式システムを採用しており、砲口径は203ミリメートル。第二次世界大戦中、B-4榴弾砲はコンクリートで補強された大型堡塁に対抗する際に重要な役割を果たし、その敵からは「スターリンの槌」と呼ばれていた。

feat_name_62=牽制
feat_name_63=攻略

feat_desc_62=自身の周り1マスの範囲内の敵兵を1ターン動けなくする。クールダウン3ターン。3人以上の目標に効果を与える場合、クールダウンは1ターン。
feat_desc_63=城防に対するダメージを{1}%増加させる。2ターン継続。クールダウン3ターン。

