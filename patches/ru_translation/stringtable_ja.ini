;;normal texts,tips
;__font_type[font_text_1]
tips_1=技術をレベルアップさせると、部隊の戦闘力は上がります。
tips_2=シナリオをクリアすることとチャレンジステージに挑戦することで奇観を獲得できます。
tips_3=一部の奇観を建造すると、ゴールドやエネルギー、工業、技術などの資源を獲得できます。
tips_4=新たに出現した貿易市場で色んな資源を交換できます。
tips_5=シナリオ以外のステージでより多くの資源やボーナスを獲得できます。
tips_6=空挺部隊を使いこなせば、作戦の効率は大幅に上がります。
tips_7=原子兵器はミサイルや戦略爆撃機に搭載して発射できます。ミサイル基地を有する都市はミサイルを発射できます。
tips_8=対空施設は空襲やミサイルによるダメージを大幅に減少できる。
tips_9=要塞を建造すると、作戦の効率は上がるが、建造に時間がかかります。
tips_10=水上エリアに入る時に輸送船を搭乗する必要があります。輸送船はなるべく戦闘を避けるべきです。
tips_11=将軍の能力が強ければ強いほど、任務を完成する時にもらえるボーナスも多くなります。
tips_12=司令部のレベルが上がると、より多くの将軍席を獲得できます。
tips_13=上級スキルは戦闘で目標ポイントを獲得することで習得できます。
tips_14=敵部隊を消滅すると、一定の確率で士気は上がります。この時、部隊の戦闘力は大幅に上昇します。
tips_15=敵部隊の士気が下がったら、積極的に攻撃してください。
tips_16=挟み撃ちされたら、部隊の士気は下がります。部隊が包囲されると、士気は大幅に下がります。
tips_17=空母の攻撃範囲と空軍の攻撃範囲は同じです。それらの攻撃範囲を拡大するには、それぞれの空軍技術をレベルアップさせる必要があります。
tips_18=巡洋艦や空母のような大型戦艦を相手するには、潜水艇が一番良いです。
tips_19=工兵特性を持つ歩兵部隊は地雷によるダメージを大幅に減少できる。
tips_20=将軍やターン数、都市の数などが征服の最終評価に影響を与えます。
tips_21=建物のレベルが高ければ、よりレベルの高い部隊を生産できます。
tips_22=司令部で自分の部隊を雇って演習や侵入や会戦などに参戦できます。


