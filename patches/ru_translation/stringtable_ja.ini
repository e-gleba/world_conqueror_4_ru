event_stage_intro_20901=基地は自滅し、我々が最後の撤退部隊となった。臨時設定した座標が正確であれば、次の拠点となる南米のジャングル近くに到達するだろう。今回は時間をかけて計画を立て直すことができる。
event_stage_intro_20902=スペイン内戦は全面的に勃発し、ドイツ、イタリア、ソ連の介入により、不干渉協定は事実上破綻した。かつての「太陽の沈まぬ国」は崩壊し、新たな帝国も同じ運命を辿るだろう。戦いの結末を変えることはできないが、私たちは参戦しなければならない。そこに戦友がいるからだ。
event_stage_intro_20903=第二次世界大戦後、マーシャル・プランによりアメリカはトルコという重要な同盟国を得た。しかし、ソ連の煽動によるイランの民族主義の高まりが石油生産を困難にし、こちらの利益を大きく脅かしている。新大統領アイゼンハワーの承認のもと、CIAとMI6は協力して政変を計画している。この作戦は成功させなければならない。失敗は許されない。
event_stage_intro_20904=オズボーンの計画によって、各勢力は南米のジャングルで入り乱れて戦闘を繰り広げることになった。日本とソ連の民族主義者たちも、この混乱の隙を突いて在日米軍基地を攻撃したという。どうやらソ連軍は衛星兵器を開発中らしい、今こそその技術を奪取する絶好の機会だ！ユディンツェフは通信衛星の専門家を手配しており、樺太のソ連軍基地付近で我々と合流する予定だ。
event_stage_intro_20905=マーシャル・プランは西ヨーロッパの再建を加速させ、各国の経済は急速に発展した。しかし、最近ではイタリア国内で汚職が蔓延し、社会不安が拡大、ついには首相が暗殺される事態にまで至った。同時に、ソ連軍はチェコスロバキア全域を迅速に占領し、バルカン半島への増派を続けている。この東欧という火薬庫に我々が火をつけたことで、ヨーロッパの勢力図がまもなく再編されることになる。
event_stage_intro_20906=アメリカの分離主義者たちは、大統領の再選に不満を抱き武装蜂起を開始した。不思議なことに、我々は今回の選挙に介入しておらず、記憶を振り返っても類似した戦争の前例はない。それにもかかわらず、大統領はこの反乱を鎮圧するために我々に助けを求めてきた。この作戦は予測不可能な要素に満ちており、各地の米軍部隊の動向を常に注視する必要がある。
event_stage_intro_20907=連合軍はその勢いで南下し、我々のメキシコにある軍事施設を奇襲した。敵はすでに太平洋諸島の基地座標を把握しており、妨害装置はもはや役に立たない。南極のソ連軍もいずれ我々の基地を発見する可能性が高い。現在、状況は非常に緊迫している。すべての可動部隊を直ちに集結させ、ソ連軍の南極研究所に対して攻撃を開始する必要がある。
