feat_desc_49=HPが最大の敵に与えるダメージが{1}%増加する。
feat_desc_50=複数の敵を攻撃する。他の敵へのダメージは減少しない。
feat_desc_51=次の攻撃で射程が+2され、対象の都市または要塞のHPを{1}%(最大1200)、守備隊のHPを{2}%(最大500)低下させる。クールダウン3ターン
