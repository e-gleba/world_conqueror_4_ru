skill_info_162=艦船を指揮している時、士気は低下しない。艦船攻撃で致命的一撃を与えた時、ダメージが[#00FF00#%d%%]上昇する。艦船を指揮している時、周囲2マスに友軍空母があるか、または自身が空母である場合、自身が空軍・ミサイル・核弾を使用する時、ダメージが30%%上昇する。周囲2マスの友軍空母は、空軍を使用する時、ダメージが15%%上昇する。
skill_info_163=艦船を指揮している時、攻撃および空襲を使用する時に[#00FF00#%d%%]の確率で致命的一撃を与える（このスキルを所持している場合、艦隊指揮官および空軍指揮官の効果は無効となる）
skill_info_164=精鋭歩兵を指揮する時、1マス範囲内の友軍（自身も含む）が陸上ユニットに与えるダメージ+10%%（精鋭部隊のレベルが9以上の場合、効果は15%%に上昇）。範囲内の友軍精鋭部隊が１つ増えるごとに、さらに[#00FF00#%d%%]加算、合計上限は25%%
skill_info_165=歩兵を指揮して攻撃した後、与えたダメージの[#00FF00#%d%%]分のHPを回復する。周囲1マスに友軍の装甲または砲兵が存在する時、自身の攻撃および反撃の射程+1


