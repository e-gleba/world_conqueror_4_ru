elite_intro_97=ハリアー戦闘機は、西側陣営を代表する多用途の垂直／短距離離着陸機であり、世界で初めて実戦化され、体系的な運用が確立されたV/STOLジェット機である。回転式ノズルを備えた独自の設計により、従来型滑走路に依存することなく、前線の簡易飛行場や臨時の発着地点から柔軟に運用できる点が大きな特長。この特性は生存性と機動力を大きく向上させ、さらに安定したホバリング性能と低空機動能力によって、近接航空支援および対地攻撃任務において、高価値目標を継続的に制圧する能力を発揮する。

elite_intro_98=Su-30Vは、冷戦期にスホーイ設計局がワルシャワ条約機構陣営向けに極秘裏に開発した垂直／短距離離着陸戦闘機計画。その外形および基本構造は、Su-27・Su-30系列の成熟したプラットフォームを継承しつつ、推進系統および飛行制御アーキテクチャは根本的に再設計されている。本機は双発の推力偏向ノズルと分流式揚力システムを採用し、滑走路を欠く前線地域からの短距離離着陸を可能とするとともに、低高度でのホバリング能力を備える。これにより、地上部隊に対して持続的な近接航空支援と強力な対地火力を提供することができる。


