legend_intro_10101=フランス戦場において、第7装甲師団は「幽霊師団」の名で四方に威名を轟かせたが、1940年5月21日のアラスの戦いこそ、その名を確立する過程で最も重要な試練であった。この日、同師団は先鋒部隊としてアラスを迂回し北進するよう命じられたが、予想外にも英仏連合軍の準備された反撃戦力と遭遇し、激戦となった。突如として側面を脅かされた第7装甲師団は一時的に劣勢に陥った。しかし、ロンメル将軍の機敏かつ果断な指揮の下で、ドイツ軍はついに戦局を逆転し、危機を打開したのである。この一戦を経て「幽霊師団」の名声はいよいよ高まった。
legend_intro_10102=戦争の進路転換とともに、第7装甲師団もまたモスクワへ向かう戦いを開始した。しかしその最初の戦いとなった「アリートゥスの戦い」は、すでに苛烈な未来を予兆していた。第7装甲師団はソ連第5装甲師団とアリートゥスで戦車戦を繰り広げたのである。第7装甲師団は、200両を超える戦車を擁するソ連第5装甲師団を撃退し、アリートゥスを確保してビルニュスへ向かう通路を切り開いた。
legend_intro_10103=1941年10月2日、第7装甲師団はソ連軍の正面を突破し、補充に投入されたソ連戦車部隊を撃破、第4装甲集団所属の第10装甲師団と共にヴャジマ包囲環を完成させた。こうしてソ連西部戦線の防衛を粉砕し、バルバロッサ作戦の最終目標――モスクワへと一歩近づいたのである。
legend_intro_10104=吹きすさぶ風雪の中、モスクワの冬はこれまで以上に厳しかった。長大な補給線はドイツ軍を疲弊させ、モスクワ攻略の望みをこの最後の一撃に託さざるを得なかった。1941年11月15日、第7装甲師団を隷下に持つ第3装甲集団はモスクワ突破を開始した。機動力と柔軟な戦術を頼みに、彼らは次々とクリンやヤフロマを攻略し、一時はクレムリンを遥かに望むところまで迫った。しかし最終的にはソ連軍の奔流の前に力尽き、志半ばにして挫折したのである。
legend_intro_10105=1943年、クルスク戦役。久経戦場の第7装甲師団は、此時、一つの偏師として第4装甲集団軍の主力部隊を掩護していた。それでも彼らはなお側面戦場でソ連軍防衛線を突破し、ソ連親衛第7集団軍を牽制することに成功した。しかしその努力もはや戦局を左右するには至らなかった。主力部隊がプロホロフカで敗北を喫すると、第7装甲師団もまた撤退を余儀なくされたのである。戦場の態勢は変わり、彼らがかつてのように縦横無尽に戦場を駆け巡ることは二度と叶わなかった。
legend_intro_10106=第二次キエフ戦役は、第7装甲師団が東部戦線で最後に大規模機動作戦を遂行した戦いであった。ソ連軍が絶対的兵力優勢をもって攻勢を仕掛けたため、第7装甲師団はキエフから撤退し、ファスチフ＝ジトーミル一線で機敏にソ連軍を阻撃した。そして援軍と共に、一時は失陥したジトーミルを奪回することに成功したのである。戦線全体の劣勢を覆すことはできなかったが、ドイツ軍の後退と再編のために貴重な時間を稼ぐこととなった。
legend_intro_20101=アメリカ第3装甲師団の戦歴はノルマンディー上陸作戦から始まった。上陸後、ドイツ軍が準備した生け垣障害がこの鋼鉄の軍団を一時的に阻んだ。だが1944年7月の「コブラ作戦」において、アメリカ軍は数千機の爆撃機を動員してドイツ軍陣地に「絨毯爆撃」を加えた。直後に第3装甲師団――「スピアヘッド師団」が進撃し、装甲機動の優位をもって潰走するドイツ軍防衛線を切り裂き、作戦級の突破を実現し、ノルマンディーの膠着を打破したのである。
legend_intro_20102=「コブラ作戦」の突破に成功した後、第3装甲師団は北上を命じられ、直ちにファレーズ地域へ突入した。そこでは北から南へ進撃するカナダ軍・ポーランド軍と合流し、包囲の態勢を形成した。追い詰められたドイツ軍は生き延びるために何度も突破攻撃を仕掛けたが、第3装甲師団の戦線を破ることはできなかった。この戦いでドイツ軍の2個集団軍はほぼ壊滅し、第3装甲師団は再び烈火の試練の中で、連合軍の最も鋭利な槍の一つであることを証明したのである。
legend_intro_20103=1944年秋、第3装甲師団は第1集団軍の先鋒として電撃的にジークフリート防衛線を突破し、アーヘン城下に迫った。約2週間に及ぶ激烈な市街戦の末、アーヘンはついに10月21日に完全攻略された。短い休養の後、第3装甲師団は11月にヒュルトゲンの森攻略に着手したが、複雑な森林地形は装甲機動を制約し、多くの兵士がこの戦場に倒れた。苛烈な市街戦と果てしなき密林での試練を経て、この部隊はもはや単なる攻撃の矛先ではなく、あらゆる状況に適応する堅韌な師団へと鍛え上げられたのである。
legend_intro_20104=1944年12月16日、ドイツ軍はアルデンヌの森で奇襲反攻を開始した。アメリカ第3装甲師団は第1集団軍の精鋭予備隊として急遽北部戦線に投入され、各地の要衝で他部隊と連携して迅速に反撃を展開し、ドイツ軍の攻勢を見事に瓦解させた。
legend_intro_20105=1945年3月、第3装甲師団は第1集団軍の先鋒としてレマゲン橋頭堡から東方へ全速で突撃し、ドイツ軍ルール工業地帯の包囲を目指した。4月1日、本師団はリップシュタットで北方のアメリカ軍と会合し、モーデル元帥率いる32万のドイツ軍を「ルール・ポケット」に閉じ込めることに成功した。半月に及ぶ掃討の末、ドイツ軍の抵抗は崩壊し、モーデルは自決、18日には大規模な投降が行われた。この戦いは西部戦線におけるドイツ軍主力を完全に粉砕したのである。第3装甲師団は高速機動によって勝利を決定づけたが、同時にロース少将という師団長を失い、その犠牲は勝利の碑に最も深く刻まれる栄光となった。
legend_intro_20106=1991年2月、第3装甲師団は第7軍の主力としてサウジ北部からイラク防衛線へ突入した。M1A1戦車の技術的優位を活かし、同師団は昼夜260キロを疾走しつつ、イラク軍第9装甲旅団および共和国防衛隊「タワカルナ師団」を次々と撃破した。ノーフォーク戦車戦では、極めて小さな代償で大量のT-72戦車を撃破したのである。わずか百時間のうちに、同師団は友軍と協同してイラク軍10個以上の師団を殲滅し、サッダームの精鋭を粉砕した。その戦績はほぼゼロに近い損害であり、現代装甲部隊の絶対的な支配力を証明するとともに、地上戦の様相を一新するものであった。
legend_intro_30101=1942年秋、黒海艦隊の水兵によって編成された海軍歩兵第255旅団は、緊急にコーカサス戦線へと派遣された。トゥアプセ方面の山林地帯において、彼らは銃剣・手榴弾・モシン＝ナガン小銃を手に陣地を死守し、ドイツ軍の「アッティカ」攻勢を粉砕した。重火器を欠く不利な状況下で、夜襲や迂回戦術を駆使し、血戦の末に1942年12月13日、同旅団は赤旗勲章を授与された。彼らの鮮血は、ドイツ軍の黒海進出の道を断ち切ったのである。
legend_intro_30102=1943年2月6日、海軍歩兵第255旅団は命を受け、ノヴォロシースク近郊のメスハコ地区に強行上陸し、後に「小地」と呼ばれる上陸地点を奪取・死守した。ドイツ軍航空機と重砲による昼夜を分かたぬ猛攻に直面しながらも、我ら水兵は陸軍の同志とともにこの狭隘な土地に塹壕を掘って死守し続け、大量のドイツ軍兵力を釘付けにした。この戦いは後続のコーカサスおよびタマン半島解放のための決定的な基盤を築いたのである。
legend_intro_30103=1943年9月10日未明、海軍歩兵第255旅団は艦砲射撃の援護を受けてノヴォロシースク港南側に強行上陸した。ドイツ軍の密集した地雷原・鉄条網・沿岸砲火に直面しながらも、彼らは一寸一寸と浜頭陣地を食い破り、後続部隊のために突破口を切り開いた。最終的に第18集団軍との協同作戦の下、9月16日に市全域を攻略した。この戦いはソ連軍がタマン半島を奪取し、コーカサス戦役を完全に終結させるための基盤を築いたものであり、同旅団はこの功績により「タマン旅団」の名誉称号を授与された。
legend_intro_30104=1943年11月、「タマン旅団」は嵐の夜にケルチ半島アルディンゲン浜頭へ強襲を敢行した。ドイツ軍の探照灯と砲火封鎖の中、彼らは血に染まりながら上陸地点を奪取し、36昼夜にわたり死守した。弾薬と糧食が尽きる中でも、将兵は手榴弾と銃剣をもって数十回に及ぶ反撃を撃退し、コステンコ上級軍曹は銃口を塞いで壮烈に戦死した。この戦いは代償こそ甚大であったが、ドイツ軍主力を見事に牽制し、北方ソ連軍によるクリミア解放の礎を築いたのである。
legend_intro_30105=1944年5月、「タマン旅団」は独立沿海集団軍隷下の黒海艦隊精鋭として、セヴァストポリ解放の復讐戦に参加した。この戦いは、クリミアにおけるドイツ軍最後の堡塁を完全に粉砕し、1942年に要塞が陥落した屈辱を雪いだのである。
legend_intro_30106=1944年8月、「タマン旅団」はヤシ＝キシニョフ攻勢においてドニエストル川を強行渡河し、アッカーマン（現ベルゴロド＝ドニエストロフスキー）の浜頭を夜襲した。彼らはドイツ軍の密集した沿岸防御火力に晒されながら防衛線を切り裂き、第46集団軍と協同して攻撃を遂行した。激烈な市街戦の末、8月23日に要塞を攻略し、ドイツ軍の沿岸退路を遮断、多数の捕虜を獲得した。この戦いにより「タマン旅団」は二級クトゥーゾフ勲章を授与され、海軍歩兵による両棲強襲の致命的な鋭さを示したのである。


