armygroup_event_desc_41=日属太平洋連邦は、アラモゴードの一つの廃棄された軍事試験場において、偶然にも遺留された地下実験室を発見した。その内部には、第二次世界大戦期のアメリカ・マンハッタン計画の核心的研究成果が収蔵されており、初期の核分裂反応装置および高濃縮ウランのサンプルが含まれていた。情報が流出した後、ドイツ側は日本側が戦後の力の均衡を破ろうとしていると非難し、その施設の接収を強硬に要求した。日本側は支配権の引き渡しを拒否し、「枢軸共同防衛」を理由として核技術の共有を求めたが、新ローマ帝国も同様の要求を表明し、いずれもベルリンにより断固拒否された。最終的に、日本とイタリアの両国は新たな同盟を結び、ドイツと全面的に決裂した。
armygroup_event_desc_42=独属アメリカ帝国航空工業部は、「白色隼号」超音速長距離旅客機が大西洋横断の初飛行を無事に完了したと発表した。ベルリンからニューヨークまでの所要時間はわずか180分であった。帝国は、この技術が「文明効率の頂点」を体現するものであると宣言した。
armygroup_event_desc_43=独属アメリカにおいて、ハドソン湾の核心区域に巨大な人工島――フロストクラウン島が建設され、最新のV系列ミサイル発射シーケンスが配備された。その射程はアメリカ大陸北境全域および北極航路を覆い、帝国の厳重なる北境防衛線を構築した。
armygroup_event_desc_44=新ローマ帝国は、自由アメリカ軍団南部のチワワ砂漠補給線を遮断しようとしたが、行動計画が事前に漏洩し、待ち伏せを受けた。これにより、新ローマ帝国の北進の意図は挫折した。
armygroup_event_desc_45=新ローマ審判軍団は「異端の浄化」を名目に、メキシコ領内で大規模な粛清行動を発動し、古代文明の遺跡に対して体系的な破壊を加え、アステカ文化の精神的根基を徹底的に断ち切ろうとした。
armygroup_event_desc_46=自由アメリカの秘密特工が策動した森林火災は急速に拡大し、カリフォルニア南部地域を火海に陥れた。火勢は最終的にロサンゼルス市街へと延焼し、都市の秩序は濃煙と混乱の中で静かに崩壊していった。
armygroup_event_desc_47=ドイツ軍が米東全域を完全に掌握した後、「新秩序全球計画」の推進を加速させるために、帝国は自由の女神像の視線の先に世界最高の電磁放送信号塔を建設することを決定した。それを「秩序の塔」と命名し、帝国の意志が新世界全体の情報を掌握することを象徴した。
armygroup_event_desc_48=日属太平洋衛戍軍はアルバータ油砂資源を全面的に掌握し、その核心区域に巨大な「精製輸送センター」を設立した。これにより、パイプラインを通じて太平洋西海岸へ直結し、太平洋艦隊に絶え間ない燃料補給を提供した。
armygroup_event_desc_49=韓国光復軍が派遣した潜伏小隊はバンクーバーにおいて秘密襲撃を敢行し、付近の送油パイプラインを爆破することに成功したうえ、都市の主電力塔を破壊した。これにより、日本側のエネルギー輸送および西岸防衛体系に深刻な打撃を与えた。
armygroup_event_desc_50=北境自由楓葉反抗軍はバンフ地域の奥深くに秘匿された山岳拠点を築き、長期にわたり雪嶺と密林の間に潜伏した。彼らは地形の優位を活用して帝国軍に対し持続的な遊撃・破壊行動を展開し、北方戦線において根絶し難い暗影の脅威となった。
armygroup_event_desc_51=帝国の文化統合政策を推進するため、新ローマ聖火軍団はメキシコにて「味覚統一計画」と題した食品改良プログラムを試験導入した。しかし、アステカ太陽軍団は供給網への潜入に成功し、食堂や食材調達部門に工作員を送り込んだ。さらに、一部の食材には特殊な毒剤が混入されていた。
armygroup_event_desc_52=独属カリブ海軍艦隊は「水門作戦」を発動し、パナマ運河に対して攻撃を仕掛けた。船閘の支配権を奪取し、この重要な航路を独占することで、カリブ海全域における戦略的主導権を確立しようとした。
armygroup_event_desc_53=ソ連とキューバ革命勢力は秘密裏に軍事協定を結び、ソ連残存の軍艦および潜水艦を動員し、キューバ現地のハバナ軍団と連携して、フロリダおよびメキシコ湾沿岸のドイツ属重鎮に対し海上遊撃的な速撃を敢行した。帝国南部に突破口を切り開こうとしたのである。
armygroup_event_desc_54=独属アメリカはヒューストンに「帝国宇宙研究センター」を設立し、衛星測位・軌道攻撃および高高度偵察システムの開発に専念した。天基優位をもって戦場の主導権を掌握し、アメリカ大陸全域を覆う戦術監視・攻撃ネットワークを構築しようとしたのである。
armygroup_event_desc_55=独属アメリカ帝国軍団はワシントンに所在する石碑および白色宮殿建築群を倒壊させ、さらに美東の首府をニューヨークへ移転することを宣言した。これは、ドイツによるアメリカ東部大陸に対する全面的な主権再構築を標示するものであった。
armygroup_event_desc_56=アルゴンキン遊撃軍団は、独属アメリカがエリー湖に建設した「帝国水壁」大ダムへ潜入し、その核心閘門システムの破壊に成功した。これにより深刻な構造的不均衡が引き起こされ、その後の洪水は東岸に沿って急速に拡大し、クリーブランドが真っ先に襲われた。
armygroup_event_desc_57=独属アメリカ大西洋艦隊が迫る中、英国流亡艦隊の司令官は坐して死を待つことを拒んだ。彼は旗艦に全速で敵に突入するよう命じ、怒りと鋼鉄の轟音の中で敵艦を巻き添えに海底へと沈めた。
armygroup_event_desc_58=フランス復興軍団はケベックのフランス系指導者と手を携えて『新ガリア宣言』を共同で発表し、「ガリア自由防線」を正式に結成した。フランス語文明と文化的アイデンティティを守り抜くことを誓い、帝国の高圧的支配と強制的同化に断固として抗い続けるとした。
armygroup_event_desc_59=日本太平洋艦隊の旗艦「大和」戦艦はニューヨーク港に到着し、三日間にわたる帝国訪問を開始した。公式には「文化親善交流」と宣言されたが、実際には暗流が渦巻き、この行動は太平洋枢軸勢力が初めて大西洋の心臓部に触れたことを示すものであった。
armygroup_event_desc_60=暁の先鋒軍は中部平原において大規模な農場主蜂起を成功裏に策動し、独属アメリカによる土地と食糧の強制徴用に反対した。数百棟の穀倉および軍用食糧車が暴動の中で焼き払われ、帝国中部の食糧配給体系は一時的に全面的な麻痺に陥った。
armygroup_event_desc_61=独属アメリカ帝国は東部において高圧的統治を施し、核心都市を「犯罪も衝突もない」帝国の模範区域へと作り上げた。しかし、その平穏の裏には遍在する秘密警察と徹底した思想浄化機構が潜み、あらゆる反対の声は密かに抹消されていた。
armygroup_event_desc_62=日属太平洋艦隊は、真珠湾海軍基地において「八岐」号伊400型遠洋潜水空母の正式な進水を発表した。同艦は大洋横断の深潜能力を備え、探知されることなくカリブ海あるいは南米沿岸に到達し、水中からの空襲一体化を実現することが可能である。
armygroup_event_desc_63=ドイツ軍の高級将領がサンフランシスコ訪問中に自由アメリカ独立軍の遠距離狙撃によって殺害された。日属太平洋憲兵軍は緊急に街区を封鎖したものの、犯人を捕らえることはできなかった。本事件はドイツ側の強い反発を招き、日本側の警備失態を糾弾する事態となり、これによって独日枢軸の間に亀裂が生じた。
armygroup_event_desc_64=フロリダ地域は名目上ドイツ軍の管轄下にあるものの、住民は妥協を拒み、各地で地方武装の暴動が頻発した。ドイツ軍は長期的な抵抗の泥沼に陥り、情勢は引き続き動揺し続けた。
armygroup_event_desc_65=日本軍はイエローストーンの地下岩層に「火山ガス精製装置」を配備し、地熱エネルギー中から戦術用途に利用可能な有毒ガスを抽出しようとした。しかし装置の異常により硫化水素が大量に漏出し、周辺の地下水脈と大気系を広範に汚染し、生態的災厄が急速に拡大した。
armygroup_event_desc_66=自由楓葉反抗軍は犬ぞりを用いて極地氷原を踏破し、さらに潜水によって帝国のソナーと沿岸防衛システムを迂回した。彼らは霜冕島への奇襲に成功し、独属アメリカが同島に配備していたV型ミサイル基地を破壊した。これにより、北境戦線には反攻の希望が燃え上がった。
armygroup_event_desc_67=独属アメリカ帝国はジャズおよび黒人文化の発信を全面的に禁止した。しかしニューオーリンズの地下楽師たちは「エコー計画」を組織し、夜間の短波放送で禁じられた曲目を流すことで、民衆の反抗意識を呼び覚ました。


