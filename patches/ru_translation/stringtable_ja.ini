elite_intro_48=ブランデンブルク師団は特別な訓練を受け、独自の装備を持っている。彼らは幅広い任務を遂行し、高度な柔軟性がある。そのため、敵の背後で秘密作戦を実行し、敵に混乱と損失を与えることができる。
elite_intro_49=ホークアイは、並外れた忍耐力と冷静さを備えた高精度の射撃技術で知られている。彼らの主な任務は、敵の指揮系統を混乱させ、敵の戦闘能力を低下させるために、スナイパーライフルを駆使して敵の重要な目標を撃つことである。
elite_intro_50=衛生兵は、戦場で非常に困難で危険な場面に直面する。彼らはしばしば、敵の銃撃や爆発の中で負傷者の応急処置を命がけで行い、卓越した能力を発揮する。彼らの献身とプロフェッショナリズムは、戦場で負傷した兵士たちに希望をもたらしている。
elite_intro_51=M7プリーストはアメリカが開発した自走砲で、第二次世界大戦中の多くの戦闘で重要な役割を果たした。105mm榴弾砲を搭載し、砲塔を車体後部に配置することで、砲手が目標を見やすく、狙いやすくした。
elite_intro_52=80㎝列車砲「グスタフ」は、第二次世界大戦中のドイツの重砲における代表的な傑作であった。口径800ミリの砲身を備え、重量は1,350トン。7トンの砲弾を47キロ離れた目標に発射することができた。その絶大な威力から、この列車砲は主に要塞や都市などの重要な目標を攻撃するために使用された。
elite_intro_53=BM-21「グラート」ロケットランチャーは、冷戦期にソ連が設計した122mm口径の多連装ロケットランチャーである。トラックのシャーシに搭載され、迅速な展開と退避が可能である。また、短期間で目標地域に一斉射撃を行うことができ、味方の援護と敵の制圧を同時に行うことができた。
elite_intro_54=T-44戦車はT-34戦車シリーズの改良型である。火力、機動性、防御力を高めるよう設計された。特筆すべきは、T-34の自慢の傾斜装甲を受け継いだことで、その設計は後の戦車開発に多大な影響を与えた。
elite_intro_55=キングタイガー重戦車は、連合軍戦車の装甲を容易に貫通する88mm口径戦車砲を装備していた。その強力な火力と重装甲は戦車技術のさらなる進歩を示し、第二次世界大戦中のドイツ戦車設計の最高峰となった。
elite_intro_56=M26パーシング重戦車は、ドイツのタイガー戦車に対抗するため、第二次世界大戦末期にアメリカ陸軍が考案した。口径90ミリの戦車砲を装備し、機動性も十分だった。戦後も、いくつかの紛争や軍事作戦で使用された。
elite_intro_57=スピットファイアは優れた操縦性、速度、火力で有名だった。不断の改良の末、バトル・オブ・ブリテンでその名を轟かせ、ヨーロッパ、北アフリカ、アジア戦線でも活躍し第二次世界大戦における英国を代表する重要な戦闘機のひとつとなった。
elite_intro_58=スツーカ爆撃機のユニークな二つ折り翼構造は、急降下爆撃の際に優れた安定性と精度をもたらした。第二次世界大戦初期には強力な対地攻撃能力を発揮した。着陸装置の「ジェリコ・トランペット」は独特のサイレン音を発し、敵を震え上がらせた。
elite_intro_59=スカイトレインという名で知られるC-47は、さまざまな過酷な条件下でも輸送任務を遂行できる、信頼性と適応性に優れた航空機である。兵士、物資、装備品の輸送に広く使用され、第二次世界大戦中の多くの戦闘で重要な役割を果たした。
elite_intro_60=Ⅶ型潜水艦は、その優れた潜航能力と戦闘能力で、大西洋の海戦で重要な役割を果たした。複数の潜水艦が共同して連合国の艦隊や商船に攻撃を仕掛ける群狼戦術を採用し、輝かしい戦果をあげた。
elite_intro_61=プリンス・オブ・ウェールズは第二次世界大戦中のイギリス海軍所属の主力戦艦である。その強力な火力と堅固な装甲により、海戦において強力な火力支援と防御能力を発揮した。同艦はビスマルクに損害を与え、撤退に追い込むことに成功した。





