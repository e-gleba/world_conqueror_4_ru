dialogue_2543=上陸部隊は米軍の襲撃を受け、MI作戦は露顕してしまった。
dialogue_2544=準備は整った、計画通りに作戦を続けよ。
dialogue_2545=日本の空母を発見した！ 直ちに攻撃し、連合艦隊の主力部隊を撃滅せよ。
dialogue_2546=アメリカ艦隊の規模と空母の数は予想以上で、予備役が直ちに増援に動員された。
dialogue_2547=敵空母の撃沈を確認、追跡を続行せよ！
dialogue_2548=太平洋艦隊は万全の準備を整えており、我々の敗北はもはや取り返しがつかない。
dialogue_2549=我が艦隊はガダルカナル島周辺を攻撃する。上陸部隊は既に配置についた、日本の援軍が到着する前にガダルカナル島を占領するのだ。
dialogue_2550=我々はアメリカ軍の襲撃を受けた。フリゲート艦と増援部隊はガダルカナル島奪還のため直ちに出発せよ。
dialogue_2551=米艦隊は我々の補給路を掌握しており、このまま部隊を輸送し続ければ大きな損害を被ることになるだろう。
dialogue_2552=複数の島が米軍の攻撃を受けている。効果的な反撃のために艦隊を編成せよ。
dialogue_2553=我が艦隊は到着している。各艦隊は連携しながら総攻撃をしかけ、日本人をソロモン諸島から駆逐せよ。
dialogue_2554=敵の増援が着々とガダルカナル島に迫っている。事前に防御を整え、海上で敵を切り崩せ。
dialogue_2555=私はポートモレスビーへの攻撃に最後の全力を尽くす。私と協力してアメリカの増援を食い止めよ。
dialogue_2556=敵の攻撃はより激化している、我が部隊も長くは持ちこたえられないだろう。
dialogue_2557=日本艦隊は空母の援護を受けずに攻撃した。直ちに艦隊を増派せよ。
dialogue_2558=我々はココダを再び奪還した、日本軍の攻勢もやがて崩壊するだろう。
dialogue_2559=敵は我々の防衛線を突破した。すぐに援軍をラエに向かわせる。
dialogue_2560=援軍が来た、反撃開始だ。
dialogue_2561=次の作戦に備えて、サイパンの飛行場を占領を優先せよ。
dialogue_2562=我々は決して降伏しない。
dialogue_2563=我々は最後まで戦った。
dialogue_2564=マリアナ諸島の日本軍は逃げ場がない。我が艦隊は、すべての日本軍の連携を断ち切るだろう。
dialogue_2565=アメリカ軍はサイパンとテニソンを次々と占領した。敵上陸部隊をグアムから遠ざけなければならない。
dialogue_2566=連合艦隊は完全に破壊された、我々の艦隊が上陸部隊を援護する。
dialogue_2567=ついに帰ってきたぞ！我が軍隊の両足は再びフィリピンの地に立っている。
dialogue_2568=アメリカ軍がレイテ島の南に上陸した。海路で敵の増援を断つため、攻勢を開始せよ。
dialogue_2569=アメリカ軍がレイテ島の南に上陸した。海からの敵の増援を断つために攻勢が開始せよ。
dialogue_2570=追撃を続けよ、敵の海軍はひとたまりもないだろう。
dialogue_2571=北へ退却し、敵艦隊の本隊をレイテ湾から引きずり出せ。
dialogue_2572=海岸を利用して守備を再編成し、連合軍の上陸を阻止せよ。
dialogue_2573=イギリス太平洋艦隊が到着した、我々は空軍数で決定的な優位に立っている。
dialogue_2574=我々の目標はただ一つ、島の守備隊を全滅させることだ。
dialogue_2575=敵の海軍が再び主導権を握ったのだ。この状況で攻撃を仕掛けたら勝ち目はない。
dialogue_2576=戦艦大和を撃沈したぞ！
dialogue_2577=戦局はもはや挽回不可能だ。最後の一兵一卒まで進攻し続けよ。
dialogue_2578=突撃！力を合わせて攻撃を続けるのだ。
dialogue_2579=日本全土は航空部隊の射程圏内にある。
dialogue_2580=敵の防衛力は軽視できない。我々の第一目標は、日本を占領し、降伏させることに変わりはない。
dialogue_2581=日本軍がまだ抵抗を続けている、奴等の海上防衛線を破壊するのだ。
dialogue_2582=我々は上陸部隊に砲兵と航空支援を提供する。
dialogue_2583=ソ連は直接上陸作戦を開始し、日本本土を攻撃する準備は整っているようだ。
dialogue_2584=ソ連軍は北部で攻勢を開始した。後続の上陸部隊の迎撃に注意せよ。
dialogue_2585=敵は東京に向かって走っている。私の部隊は援軍を提供するためにすぐに出発する。
dialogue_2586=我々は東と南の海岸から上陸作戦を開始し、敵の防衛重心を撹乱する。
dialogue_2587=周辺の島の守備隊を排除する。島にある飛行場を活用し、上陸作戦の援護を行う。
dialogue_2588=作戦は予想以上に順調だ。イギリス軍より先にメッシーナを占領することができるだろう。
dialogue_2589=連合軍は上陸を開始し、すぐに予備兵を送って前線を支援せよ。
dialogue_2590=メッシーナが危機に瀕している。島の守備隊にすぐに戻るよう命令せよ。私の空軍が援護する。
dialogue_2591=島の守備隊は我々によって分断された。彼らの退路を断ち、可能な限り敵の戦力を一掃せよ。
dialogue_2592=我が軍は絶対的な優位に立っている。南から北へ、海路と陸路で、ドイツ軍をイタリアから追い出すのだ。
dialogue_2593=ターラントの守備は脆弱だ、上陸したら全速力で北に押し上げる。
dialogue_2594=イタリア政府はすでに我々と降伏に関する事項を内密に協議しているが。この降伏を利用して、イタリア国内のドイツ軍を一挙に壊滅させよ。
dialogue_2595=連合国の電文を傍受した。イタリアが停戦を求めている！連合国の軍事動向に注意しなければ。
dialogue_2596=我々は連合国側と、部隊を連合軍の戦線に撤退させることで合意に達した。
dialogue_2597=予想通り、イタリアが降伏した。直ちに主要都市を制圧せよ、これ以上の損失の拡大を許すな。
dialogue_2598=空挺部隊と連携し、海岸の敵の防衛線を挟み撃ちせよ。
dialogue_2599=上陸後、彼らは多くの友軍を支援し、橋頭堡を完成させ、海岸のドイツ軍を全滅させた。
dialogue_2600=大量の連合軍がノルマンディーに上陸し、敵の進撃を遅らせるために反攻作戦を組織せよ。
dialogue_2601=私の砲兵部隊は連合軍の攻撃を抑えるだろう！
dialogue_2602=上陸部隊は盤石だ、次はカーンへの攻撃を開始せよ。
dialogue_2603=攻撃は順調に進んでいる。パリの解放までそう時間はかからないだろう！
dialogue_2604=シェルブールは失われ、半島全体が連合軍の手に落ちた。
dialogue_2605=ローマは陥落した、連合軍がマルセイユに簡単に上陸することを許すな。
dialogue_2606=後続部隊の上陸に備え、速やかに陣地を整えよ。
dialogue_2607=この攻勢を維持し続ければ、我々の解放は目前だ！
dialogue_2608=連合軍の攻勢は異常なほど迅速だ。マルセイユ奪還のために機甲部隊を動員せよ。
dialogue_2609=このまま抵抗し続けても意味がない。すぐに撤退し、再整備せよ。
dialogue_2610=空挺部隊は指定された位置に上陸し、速やかに合流せよ。本隊が到着するまで、要所の橋を守ってくれるだろう。
dialogue_2611=援軍が向かってくる。これらの空挺部隊を排除し、ライン川の防御ノードを確実に制圧しなければならない。
dialogue_2612=地上戦が阻まれた！ドイツ軍の反撃を受けている！
dialogue_2613=連合軍を阻止し、ライン川の向こうの敵の主力部隊を止めよ。
dialogue_2614=空挺部隊がライン川の橋を奪取に成功した。前進を加速せよ、奴等はドイツ軍の後方で長くは防衛できないだろう。
dialogue_2615=アントワープ港周辺の海域はすでに我々の支配下にある。補給は改善されるだろう。
dialogue_2616=連合軍は我々の攻撃に備えていない。この機会を利用して、英米主力部隊の連携を断ち切れ。
dialogue_2617=防衛線を維持せよ！我々の軍隊をドイツ軍に分散させるな。
dialogue_2618=連合軍の増援が次々と戦場に到着している。攻撃速度を加速させろ！
dialogue_2619=形勢は逆転した、今度はこちらが攻める番だ！
dialogue_2620=連合軍が次の攻撃を開始する前に、ジークフリート線まで撤退し、守備を再編成せよ。
dialogue_2621=追撃を続け、敵を一人でも逃がすな。
dialogue_2622=敵の補給は我々が断ち切った、勝利は目前だ！
dialogue_2623=全速前進だ！ソ連軍と合流し、敵の守備隊を切り離せ。
dialogue_2624=ドイツ軍は降伏するつもりがない。ベルリンへの攻撃を続けろ 我が軍は北部を掃討する。
dialogue_2625=すべての防衛線が突破され、連合軍が各地からベルリンに向かっている。
dialogue_2626=勝利は我々のものだ！攻撃を続け、抵抗しているドイツ軍をすべて殲滅せよ！
dialogue_2627=我が軍は最後まで戦い続ける。


general_stage_name_171=カリーニンの反攻
general_stage_name_172=第四次ハリコフ攻防戦
general_stage_name_173=ドニエプル川の戦い
general_stage_name_174=ヴィスワ＝オーデル攻勢
general_stage_name_175=ベルリンの戦い
general_stage_intro_171=カリーニンの反攻は、ドイツ軍のモスクワ包囲に直面したソ連赤軍による大規模な反攻であり、モスクワを救っただけでなく、ソ連に重要な戦略的優位をもたらし、その後のスターリングラード攻防戦やクルスクの戦いの基礎を築いた。
general_stage_intro_172=1943年8月、ソ連は第4次ハリコフ攻防戦を開始した。この作戦は、ドイツ軍の防衛線に対する大規模な砲撃で始まった。ドイツ軍の粘り強い反撃もソ連軍を止めることはできず、ソ連軍は最終的にハリコフを奪還した。
general_stage_intro_173=これは第二次世界大戦最大の軍事作戦のひとつであり、ソ連赤軍は4ヶ月以内にドニエプル川東岸をドイツ軍から解放し、数多くの渡河攻撃を行い、西岸にいくつかの橋頭堡を築き、その後のキエフの戦いでの勝利の基礎を築いた。
general_stage_intro_174=第二次世界大戦末期、ソ連赤軍が展開した大規模な軍事作戦である。1月12日、赤軍はポーランドのドイツ軍防衛線を突破し、ドイツ国境まで急速に前進した。この攻勢は終戦を大きく早め、ソ連軍がベルリンを占領する道を開いた。
general_stage_intro_175=ヴィスワ＝オーデル攻勢終了後、ソ連赤軍はベルリンの東60kmの進撃を食い止め、3月にはドイツはベルリン防衛計画を策定したが、それでもソ連が4月に攻勢を再開し、ベルリン総攻撃を開始するのを防ぐことはできなかった。

dialogue_2628=兵士たちよ、東へ一気に進軍せよ。我々の目標はスターリングラードを奪取することだ。
dialogue_2629=ソ連の土地は不可侵だ、祖国からナチスを駆逐する！
dialogue_2630=敵の守備が弱くなっている、一気に反撃を仕掛ける良い機会だ！
dialogue_2631=指揮官殿、私は砲兵部隊を率いてドイツ軍陣地に砲撃を開始します。今度こそ、ナチスからハリコフを奪い返しましょう。
dialogue_2632=敵の包囲に注意せよ。ドイツ軍の増援に包囲されれば、計り知れない代償を払うことになる。
dialogue_2633=敵の海上援軍は脅威となるほどではない、危険を排除するために速やかに排除せよ。
dialogue_2634=ソ連軍はドニエプル川の東岸に進出している。最高司令部から指令があった、何があっても西岸を守り、川を渡らせるな。
dialogue_2635=敵の守備隊は強力なので、やみくもに攻撃しないように。西岸に陣取り、反撃の機会を待とう。
dialogue_2636=ドイツ軍の盲目的攻撃は大きな損害をもたらした。敵が弱体化した今、直ちに川を渡り、西岸に橋頭堡を築くのだ！
dialogue_2637=ソ連軍の攻勢が激しい、一時撤退だ！
dialogue_2638=どんな犠牲を払ってでも敵を阻止し、ドイツに侵入させるな！
dialogue_2639=兵士たちよ、これは偉大な勝利だ。我々はドイツ国境内へと戦線を押し込んでいる。首都ベルリンを占領するのも時間の問題だろう！
dialogue_2640=南から攻めてくる友軍と共に挟撃し、挟撃攻勢を形成し、ベルリンに進撃せよ！
dialogue_2641=敵はすでに市街地に迫っている！ドイツ帝国はかつてない危機に直面している！何があっても、首相の安全を守るべきだ！
dialogue_2642=ベルリンは陥落し、我々はもうすぐ祖国の防衛戦争勝利する！これは偉大な日だ。

event_104=エル・アラメインの戦い
event_intro_104=第二次世界大戦が始まってすぐ、戦場は北アフリカに広がった。ヨーロッパとアジアを結ぶ重要な海上連絡線であるスエズ運河と、中東の豊富な石油資源に関係する戦略的な位置にあった。1940年、イタリアは北アフリカのイギリス軍に攻撃を開始したが、戦略の失敗により期待された前進はできなかった。翌年、ドイツ軍アフリカコルプスの介入により、北アフリカの戦況はどのように変化するのか？

dialogue_2643=ドイツの友軍が戦場への配備を完了し、勝利の天秤が次に我々に傾いた！
dialogue_2644=枢軸国の目標は、防衛線を突破してアレクサンドリア港を占領することである。もし彼らが成功すれば、北アフリカ全域が敵の支配下に置かれることになり、我々は彼らの陰謀を阻止する必要がある。
dialogue_2645=敵の猛烈な攻勢により、戦場は膠着状態に陥っています。指揮官殿、我々は地中海の補給艦隊を頼りに、彼らと長い消耗戦を繰り広げることができるでしょう。
dialogue_2646=敵の海上補給線を破壊し、息つく暇を与えるな！
dialogue_2647=枢軸国軍隊の補給線が長すぎるため、物資不足の状況に陥っている。この機会を利用して反撃しよう！
dialogue_2648=ドイツ軍中央戦線の防御は堅牢です。指揮官殿、どうか南の戦場から我々を率いて、イタリア軍の脆弱な守備を突破し、北上してください。


