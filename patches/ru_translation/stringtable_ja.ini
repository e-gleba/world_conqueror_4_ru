event_stage_intro_20613=ドイツ軍は絶えずドニエプル川両岸の工事を強化しているが、大規模な防衛線を短期間で完成させることは不可能だ。この機会を利用して、ドニエプル下流川で大規模な攻勢をかけ、キエフを奪取し、戦線をさらに西へと進めよう。ドイツ軍の反攻に注意し、攻撃の主力をしっかりと保持するのだ。
event_stage_intro_20614=部隊はすでにレニングラード周辺に集結し、この三年間包囲されていた英雄都市は完全解放を目前にしている。しかし、ドイツ軍は西側に堅固な防衛線を築いている。攻勢をかけ、北方軍集団を打ち破り、西への進路を開かなければならない。
event_stage_intro_20615=クリミアはドイツ軍にとっても我々にとっても非常に重要な軍事的価値を持っている。目の前の防衛線を突破すれば、陸路でクリミア全体を孤立させ、北側とケルチ半島の東側から攻撃を開始できる。敵の敗北は時間の問題に過ぎない。セバストポリの要塞は最終的に我々の手に落ちるだろう。
event_stage_intro_20616=クルスク、ドニエプル下流、クリミア攻防戦の後、陸軍中央集団は露呈した。 同時に、ドイツ軍は我々の欺瞞的行動に惑わされ、軍の一部を南部の北ウクライナ軍集団に再配置した。 兵力が集結した今こそ、全戦線で攻撃を仕掛け、敵に三年前の愚行を償わせる時である！
event_stage_intro_20617=西部戦線の連合軍はライン川の手前で足止めされ、ドイツ軍は死闘に備えて東部戦線に最後の兵力を集結させていた。 しかし、敵は精鋭をすべて失い、西部戦線の連合軍に一刻も早く合流するため、急速に西へ進軍していた。 ベルリンの運命は既に決まっている。

dialogue_2900=近距離戦は非常に効果的で、ドイツ軍は市内で身動きが取れなくなっている。
dialogue_2901=ドイツ軍の側面に位置するルーマニア軍の陣地に攻撃を開始し、敵の防衛線を突破して、パウルスの第6軍団を完全に包囲せよ。
dialogue_2902=ソ連軍がまだ大規模な攻撃を仕掛けられるだけの兵力を持っているのは驚きだ。 直ちにスターリングラード方面を強化し、パウルスにスターリングラードから部隊を撤退させるように伝えよ。
dialogue_2903=敵の装甲集団がスターリングラードに向かってドン河を遡上している。 全力で食い止めてみせよう。
dialogue_2904=ルーマニア軍の防衛線は我々によって突破された。この包囲網を完成させ、スターリングラードのドイツ軍を徹底的に殲滅せよ。
dialogue_2905=パウルスは脱出の機を逸し、救出作戦は失敗に終わった。 西に退却し、守備を再編成せよ。
dialogue_2906=我々にはもはや後退する余地はない。
dialogue_2907=ドイツ軍陣地への攻撃を開始せよ！ 敵の攻勢を妨害するのだ。
dialogue_2908=ソ連軍の砲兵を恐れるな。 要塞計画を継続せよ。 北と南のソ連軍の防御を突破するのだ。
dialogue_2909=援軍が到着した。ベルゴロド方面でのドイツ軍の突破を阻止するために、どんな犠牲も厭わない。
dialogue_2910=北と南へのドイツ軍の攻撃を阻止せよ。 オリョールを解決する時間を稼ぐ！
dialogue_2911=オリョールは失われ、ソ連軍は間もなく新たな攻勢を開始するだろう。
dialogue_2912=直ちに撤退し、ブリャンスクの東で新たな防衛線を築くんだ。
dialogue_2913=ソ連軍の数は予想をはるかに上回る。我々の装甲車は大きな損害を受け、もはや攻撃を続けることはできない。
dialogue_2914=勝利の波に乗れ！ ベルゴロドとハリコフを奪還せよ。
dialogue_2915=ドイツ軍はドニエプル川沿いにいくつかの橋頭堡を築いた。 敵の要塞は時間が経つにつれて強固になるばかりだった。
dialogue_2916=左岸のドイツ軍を速やかに排除せよ。 ドニエプル川沿いに兵力を広げ、大規模な総攻撃を開始せよ。
dialogue_2917=左岸の陣地は次々と失われ、新たな要塞を築くには遅すぎた。
dialogue_2918=ドニエプル川沿いに増援を送れ、この天然の防衛線をソ連軍に容易に突破されてはならない。
dialogue_2919=キエフは我々によって奪還され、西への進攻の道は開かれた。
dialogue_2920=我々はラドガ湖からレニングラード周辺に多数の部隊を輸送し、攻撃の備えている。
dialogue_2921=ナルバ周囲の防衛線はすでに完全な状態にあり、この防衛線によって北部のソ連の攻撃を食い止めることができる。
dialogue_2922=レニングラード以北のドイツ軍は排除されたが、海へのアクセスがドイツ艦隊に阻まれており、私の部隊が戦線に到達するには時間がかかる。
dialogue_2923=海上の脅威は取り除かれた。 我が軍はドイツ軍の最後の防衛線に対して総攻撃を開始する。
dialogue_2924=ソ連軍は多勢に無勢で、予想以上に激しい攻撃を仕掛けてきた。 レニングラード周辺の要塞の守備隊は、ナルバの防衛線に向かって退却するよう通達せよ。
dialogue_2925=司令部は我々の撤退計画を承認しなかった。ソ連軍の部隊が絶え間なくクリミア地域へと押し寄せている。
dialogue_2926=ドイツ軍に息つく暇を与えず、攻撃を継続し、クリミアから外部への陸路を遮断するのだ。
dialogue_2927=ケルソンに撤退し、防衛線を再編成せよ。 ドニエプル川沿いのソ連軍の攻撃を阻止するぞ。
dialogue_2928=我が軍は西への攻撃を続け、ドイツ軍をドニエプル右岸に追い返す。
dialogue_2929=セバストポリの要塞を攻撃せよ。 ドイツ軍を一人も逃すな。
dialogue_2930=ドイツ軍はまだクリミアに軍隊を送っている、敵の海上輸送ルートを破壊しなければならない。
dialogue_2931=敵は我々の主攻撃の方向を見誤っている。 この機会をとらえて、ミンスク周辺のドイツ軍を迅速に包囲、撃破せよ。
dialogue_2932=ソ連の進撃はあまりに激しい。我が軍は直ちに出発し、ミンスク方面に全速力で増援する。
dialogue_2933=我々は作戦の主目的を達成したが、ドイツ軍の防御も崩壊した。 この機会に西への急速な前進を続けよう。
dialogue_2934=ソ連は北部でも攻勢を開始した。 援軍はリガ方面に送られ、敵に出海口を容易に手に入れさせてはならない。
dialogue_2935=ドイツ軍は我々の激しい攻撃に歯が立たず、後退している！
dialogue_2936=戦略的防衛の絶好の機会を逃してしまった。 しかし、兵士として、私は国のために最後まで戦うつもりだ。
dialogue_2937=全速前進！ アメリカ軍と合流し、敵の守備隊を切り離せ。
dialogue_2938=ドイツ軍は最後まで戦う準備ができている。 ベルリンへの攻撃を続行せよ。 我が軍は北の障害物を除去する。
dialogue_2939=勝利は我々のものだ！ 攻撃を続け、抵抗しているドイツ軍をすべて撃破せよ！
dialogue_2940=防衛線はすべての箇所で突破され、連合軍はすべての地点からベルリンへと移動している。
dialogue_2941=我が軍は最後まで戦い続ける。
dialogue_2942=失敗なんて怖くない。ベルリンの運命は決まった。
dialogue_2943=連合軍は捕虜収容所の解放に成功し、我々は自由になった！さらに進撃し、ドイツ軍を殲滅せよ！

