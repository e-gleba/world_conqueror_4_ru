general_stage_intro_151=第二次世界大戦の北アフリカ戦線での最後の戦闘。アイゼンハワーが連合軍の指揮官として北アフリカにおける枢軸国防衛線に対する攻撃を指揮し、成功を収めた。最終的に1943年5月にチュニジアを奪還。
general_stage_intro_152=連合国各国の指導者は、次の目標はイタリアであると見解を一致させた。1943年7月、アイゼンハワーはシチリア上陸作戦の最高司令官に任命され、連合国の上陸と戦闘を指揮しわずか1か月余りでシチリア島全体を占領した。
general_stage_intro_153=1944年6月、連合国はドイツを欺き、ノルマンディーで第二次世界大戦中最大規模の上陸作戦を突如実行。最高司令官アイゼンハワーの指導の下、連合国はノルマンディーに橋頭堡を築き、その後のヨーロッパ大陸での戦いの基盤となった。
general_stage_intro_154=ノルマンディー上陸成功後、アイゼンハワーはさらにフランス南部でドラグーン作戦を指揮。この作戦において、連合国はヨーロッパの第2の戦線を開くことに成功し、ドイツ軍を兵力分散させ、その敗北を加速させた。
general_stage_intro_155=バルジの戦いに勝利した後、アイゼンハワーはすぐにソ連軍と合流しライン川に向けて進撃。 1945年、ルール・ポケットが始まる。この戦闘はほとんど西部戦線の最終局面となり、最終的勝利への基盤となった。
general_stage_intro_161=1941年10月、ドイツ軍がクリミア半島に侵攻した後、第11軍団はマンシュタインの指揮の下セバストポリを攻撃。 この戦闘はマンシュタインの軍事キャリアの重要な成果の一つであり、同時に彼に元帥の杖をもたらした。
general_stage_intro_162=セバストポリ戦の勝利を収めたマンシュタインは大いに輝きを放ち、最高司令部よりレニングラードへの増援を命じられる。1942年8月、マンシュタインは第11軍団を率いて近代史上最も長い包囲戦となるレニングラードの戦いに参加した。
general_stage_intro_163=レニングラードの戦いが続く中、最高司令部はマンシュタインに第6集団軍の包囲を解くためにスターリングラードに向かうよう命じる。果たして彼は此度の任務を成功に導けるのか？
general_stage_intro_164=スターリングラード攻防戦の勝利により、ソ連軍は西進を続け、ハルキウの奪取を目論む。しかし、マンシュタインが巧妙に計画した反撃により、彼の軍事的な才能が光り、ドイツ軍に重要な勝利をもたらす。
general_stage_intro_165=過酷な環境と兵力不足の中であるにも関わらず、マンシュタインは部隊を率いてソ連軍の防衛線を突破し、南部の敵軍を次々に撃退させる。北部の戦友と協力し、この第二次世界大戦の最大の戦車戦において最終勝利を収めることができるのか？

