elite_intro_73=RPGロケット兵は対戦車ロケットランチャー（RPG）を装備した歩兵部隊で、通常は装甲目標や城防衛目標に対して使用される。敵に向けてロケット弾を発射し、大ダメージを与えることができる。RPGロケット兵はその携帯性と大ダメージを与える能力から、現代戦において重要な役割を果たしている。
elite_intro_74=センチュリオン戦車は、第二次世界大戦末期にイギリスが設計・製造し、第二次世界大戦後に就役した主力戦車である。先進的な設計と技術を採用し、煙幕発射装置を備え、強力な火力と防御力を有していた。冷戦時代や多くの軍事作戦で重要な役割を果たし、多くの国の軍隊の主力戦車の一つとなる。
elite_intro_75=タイフーン級原子力潜水艦は、冷戦時代にソ連が建造した弾道ミサイル原子力潜水艦であり、人類が建造した潜水艦としては世界最大のトン数を誇る。「相互確証破壊」の原則を実現するため、この潜水艦は複数の核弾頭を搭載しており、タイフーンはそれと同じ半球内の任意目標も攻撃できる射程距離を持っている。同時に、この潜水艦は複合二重船体を持ち、強力な深度能力と打撃耐性を備えている。
elite_intro_76=Mi-24 ハインドはソ連製のヘリコプターガンシップである。強力な火力を持ち、地上の目標を効果的に攻撃できる。また、高い機動性を持ち、ある程度の敵の砲火をかわすことができる。その優れた性能と信頼性から、このヘリコプターは多くの国の軍隊で運用され、さまざまな複雑な環境下で活躍してきた。

