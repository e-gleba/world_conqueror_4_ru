army_buff_desc_1275=誘敵：周囲の友軍のダメージ＋15%
army_buff_desc_1281=鼓舞：自身は毎ターンの開始時に80%の確率で混乱と士気低下を解除。
army_buff_desc_1291=挑発：周囲の友軍は敵の陸軍と海軍によって選択されません。
army_buff_desc_1301=ロケット攻撃：攻撃範囲が2に変更されました、複数の敵部隊を攻撃できる。攻撃時、60%の確率で敵軍の反撃を無効にする。
army_buff_desc_1302=ロケット攻撃：攻撃範囲が2に変更されました、複数の敵部隊を攻撃できる。攻撃時、80%の確率で敵軍の反撃を無効にする。
army_buff_desc_1303=ロケット攻撃：攻撃範囲が2に変更されました、複数の敵部隊を攻撃できる。攻撃時、100%の確率で敵軍の反撃を無効にする。
army_buff_desc_1311=煙幕弾：地上部隊からの主動攻撃を受けない。
