conquest_event_desc_1=中国軍と日本軍は、上海及び蘇州河周辺で激しい戦闘を交わした。この戦闘により、日本軍はその主要な戦略的焦点を移すことを余儀なくされ、「3ヶ月で中国を滅ぼす」という日本の計画は打ち砕かれることとなった。
conquest_event_desc_2=武漢で堅守する中国軍は、日本軍の攻撃に抵抗し、困難な状況での不屈の意志を示した。中国の抗日戦争は、戦略的防御から戦略的拮抗へと移行する。
conquest_event_desc_3=ドイツは多兵種機動化の電撃戦術を採用。1939年に迅速にポーランドを侵略し、それが英仏によるドイツへの宣戦布告を引き起こすこととなり、第二次世界大戦が正式に勃発する。
conquest_event_desc_4=第二次世界大戦初期、イギリス、フランスとドイツの間には相対的な静止状態があった。双方は宣戦布告はしたものの戦闘には至らず、大規模な戦闘行動は行われなかった。これにより短期間の軍事的な僵局に陥った。
conquest_event_desc_5=ソ連と日本の軍はそれぞれモンゴル国と満州国の代理として戦争に参加した。 戦後、日本とソ連は「日ソ中立条約」を締結し、その後第二次世界大戦の大部分の期間にわたって平和状態を維持した。
conquest_event_desc_6=アメリカはイギリスとフランスに多大な軍事援助を提供し、二国の武器装備への重要な支援となった。
conquest_event_desc_7=ソ連は厳しい冬季にフィンランド攻略へと踏み出した。勝利を収めたソ連だが、同時に巨大な代償を払うことになる。
conquest_event_desc_8=ドイツはノルウェーとデンマークに対して攻撃を開始。
conquest_event_desc_9=ルーマニアの豊富な石油資源はドイツに戦略的な燃料支援を提供し、枢軸国の戦闘能力に重要な影響を与えた。
conquest_event_desc_10=ドイツは電撃戦を用いて低地諸国に侵攻し、迅速にオランダとベルギーの防衛線を突破する。
conquest_event_desc_11=マンシュタイン計画は1940年5月に開始。アルデンヌの森林を通過することでマジノ線を迂回し、英仏連合軍を包囲する形勢に至った。
conquest_event_desc_12=第二次世界大戦中、スウェーデンはドイツに大量の高品質の鉄鉱石を供給することで、枢軸国の軍事力強化に重要な役割を果たす。
conquest_event_desc_13=チャーチルがイギリスの首相に就任。彼のリーダーシップと激励的な演説はイギリスの抵抗精神を固めることとなる。
conquest_event_desc_14=ドイツ侵攻の中、マジノ線はドイツ軍を効果的に阻止することができず、フランス北部の戦線崩壊につながった。
conquest_event_desc_15=パリの陥落はフランスの敗北を象徴し、西ヨーロッパ戦線はドイツの全面的な勝利で終わりを告げた。これは戦争初期におけるドイツの重要な戦略的勝利を意味していた。
conquest_event_desc_16=ドイツ軍に包囲された状況下、連合軍はダンケルクの海岸で大規模な撤退作戦を行う。軍用、民間の海路を通じて約33万人の兵士をイギリスに帰還させ、その後の反撃の鍵となる基盤を築いた。
conquest_event_desc_17=1940年にドイツ軍は、英国の軍事力を海上および空中からの攻撃により破壊することを目指した包括的な「アシカ作戦」を策定。
conquest_event_desc_18=1940年、イギリス上空で展開された決定的な空中戦は、イギリス王立空軍がドイツ空軍の侵攻を成功裏に阻止し、連合軍がヨーロッパ戦線で重要な勝利を収めたことを示した。
conquest_event_desc_19=ドイツ海軍は潜水艦の協力行動を通じて、敵艦隊や商船に無差別攻撃を行い、連合国の船団に対する脅威となった。
conquest_event_desc_20=第二次世界大戦中、大西洋で激しい海上戦闘が発生し、ドイツの潜水艦はウルフパック戦術を用いて連合国の船舶を攻撃。一方、連合国は護衛と対潜作戦を採用した。
conquest_event_desc_21=
conquest_event_desc_22=ドイツ、イタリア、および日本は共通の政治的および軍事的利益に基づいて協力を強化し、軍事同盟を結成した。
conquest_event_desc_23=日本に侵攻されたタイは、日本と協力することを選択し、後に正式に枢軸国に加入する。
conquest_event_desc_24=ドイツは部隊を北アフリカに派遣し、イタリア軍と協力関係を結ぶ。その地域でのイタリアの作戦を支援し、イギリス軍に対して強力な勢力の形成を目論んだ。
conquest_event_desc_25=1941年、ドイツはソ連との不侵犯条約を破棄し、正式にソ連への侵攻を開始。ヨーロッパ東部戦線の幕開けとなる。
conquest_event_desc_26=1941年、スペインはブルーディビジョンを派遣してドイツのバルバロッサ作戦を支援し、ソ連での戦闘に参加した。
conquest_event_desc_27=ポルトガルは中立立場により貿易関係を維持することに成功。国家の相対的な安定を確保した。
conquest_event_desc_28=1941年、アメリカとイギリスの指導者は大西洋憲章に署名し、第二次世界大戦中の連合国の原則ルールを確立した。
conquest_event_desc_29=シェンノート将軍率いるアメリカ航空志願隊は、中国で「フライング・タイガース」を設立。中印ビルマ戦線での航空支援任務を遂行し、日本の侵略に対抗した。
conquest_event_desc_30=ソ連の都市レニングラードがドイツ軍に包囲され、市内の住民は厳しい飢餓と寒さの中で頑強に生き延び、同時に継続するドイツ軍の砲撃と空襲に直面した。
conquest_event_desc_31=ドイツ軍がモスクワを攻撃する中、ソ連の市民と軍は厳しい寒冷の冬の中でドイツ軍の侵略に対抗するために奮起した。
conquest_event_desc_32=1941年11月、ソ連のモスクワで赤の広場で閲兵式が行われた。数十万の赤軍兵士が主席台を通過し、ソ連の指導者による閲兵を受けた後、すぐに西部戦線に向かった。
conquest_event_desc_33=厳しい冬の寒さ、物資不足とソ連の頑強な抵抗を受け、ドイツ軍の物資消耗は悪化し士気が低下した。
conquest_event_desc_34=1941年12月、日本海軍はアメリカ太平洋艦隊に対して奇襲攻撃を行い、アメリカ軍の一部の艦隊を破壊した。この事件によりアメリカの戦争参加への意思が高まり、正式に第二次世界大戦に参戦する原因となる。
conquest_event_desc_35=真珠湾攻撃の後、太平洋戦争が全面的に勃発。アメリカと連合国の盟友たちは最終的に島嶼跳躍戦略を通じて戦線を日本本土に進展させ、日本に重大な打撃を与えた。

