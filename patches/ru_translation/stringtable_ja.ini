event_stage_intro_21001=戦争の形勢は塗り替えられた。ソ軍の西海岸への攻勢は成功裏に阻止されている。敵は補給線の過度な延伸により戦術的な攻撃力が徐々に低下しているが、軍集団レベルの兵力優位は依然として存在している。あらかじめ構築された陣地を活用し、段階的な防御を実施して援軍の集結地点を死守して戦略的反攻の開始を待つ。
event_stage_intro_21002=我々が秘密裏に訓練した部隊は、すでに攻撃準備を完了している。タスクフォースは水陸両用作戦でピッグズ湾を制圧しつつ、地域の防空網を無力化する予定だ。地下レジスタンスも我々の行動に呼応する。CIAは、今回の奇襲が完全に成功すると保証している。
event_stage_intro_21003=ソ連北方艦隊の混成部隊はニューヨーク沖を封鎖したが、形勢はまだ覆せる。直ちに緊急通信プロトコルを起動し、「要塞除去作戦」を実施せよ。各地の部隊と連絡を取り、再編成された攻撃集団を編成し、東海岸のソ軍の戦力を削げ。
event_stage_intro_21004=ソ連軍による本土への直接攻撃は、我々の一連の反撃により阻止された。だが敵は作戦の重点を切り替え、周辺諸国や領土への攻勢に移っている。ヨーロッパはすでに防衛体制を取っていたものの、ソ連軍は極めて短時間でアイスランドを制圧した。次の目標はグリーンランドとカナダだ。
event_stage_intro_21005=カナダの反乱軍は国内の反対勢力と連合して連合軍を結成し、五大湖地域を掌握して東部に向けて進軍している。我々が部隊を集結させている隙に、ソ軍は再び上陸を果たした。情報によれば、反乱軍とソ軍は協同作戦を行っておらず、この二つの勢力が衝突する隙を突いて、各地の友軍を援護し、反乱を鎮圧し外敵を駆逐せよ。
event_stage_intro_21006=ヨーロッパとソ連の衝突は全面戦争に発展した。ソ連北方艦隊の急速な進撃により我々は不意を突かれ、最も重要な同盟国であるイギリスも、本土の多くの地域がソ連に占領され苦境に立たされている。ヨーロッパは今すぐ我々の支援を必要としている。タスクフォースと戦略輸送機は万全の準備を整え、いつでも大規模展開が可能だ！
event_stage_intro_21007=ソ軍は最後の戦略予備兵力を結集し、死にものぐるいの抵抗を試みている。方面軍の指揮系統には明らかな綻びが見られ、構成国家の間にも我々が思っているほどの結束はないかもしれない。我々は結集できるすべての力を結集し、東へと進軍してソ連人を自国の地へと追い返さねばならない。これはヨーロッパにおける我々の影響力を拡大する絶好の機会だ。
event_stage_intro_21011=戦争の形勢は塗り替えられた。ソ軍の西海岸への攻勢は成功裏に阻止されている。敵は補給線の過度な延伸により戦術的な攻撃力が徐々に低下しているが、軍集団レベルの兵力優位は依然として存在している。あらかじめ構築された陣地を活用し、段階的な防御を実施して援軍の集結地点を死守して戦略的反攻の開始を待つ。
event_stage_intro_21012=我々が秘密裏に訓練した部隊は、すでに攻撃準備を完了している。タスクフォースは水陸両用作戦でピッグズ湾を制圧しつつ、地域の防空網を無力化する予定だ。地下レジスタンスも我々の行動に呼応する。CIAは、今回の奇襲が完全に成功すると保証している。
event_stage_intro_21013=ソ連北方艦隊の混成部隊はニューヨーク沖を封鎖したが、形勢はまだ覆せる。直ちに緊急通信プロトコルを起動し、「要塞除去作戦」を実施せよ。各地の部隊と連絡を取り、再編成された攻撃集団を編成し、東海岸のソ軍の戦力を削げ。
event_stage_intro_21014=ソ連軍による本土への直接攻撃は、我々の一連の反撃により阻止された。だが敵は作戦の重点を切り替え、周辺諸国や領土への攻勢に移っている。ヨーロッパはすでに防衛体制を取っていたものの、ソ連軍は極めて短時間でアイスランドを制圧した。次の目標はグリーンランドとカナダだ。
event_stage_intro_21015=カナダの反乱軍は国内の反対勢力と連合して連合軍を結成し、五大湖地域を掌握して東部に向けて進軍している。我々が部隊を集結させている隙に、ソ軍は再び上陸を果たした。情報によれば、反乱軍とソ軍は協同作戦を行っておらず、この二つの勢力が衝突する隙を突いて、各地の友軍を援護し、反乱を鎮圧し外敵を駆逐せよ。
event_stage_intro_21016=ヨーロッパとソ連の衝突は全面戦争に発展した。ソ連北方艦隊の急速な進撃により我々は不意を突かれ、最も重要な同盟国であるイギリスも、本土の多くの地域がソ連に占領され苦境に立たされている。ヨーロッパは今すぐ我々の支援を必要としている。タスクフォースと戦略輸送機は万全の準備を整え、いつでも大規模展開が可能だ！
event_stage_intro_21017=ソ軍は最後の戦略予備兵力を結集し、死にものぐるいの抵抗を試みている。方面軍の指揮系統には明らかな綻びが見られ、構成国家の間にも我々が思っているほどの結束はないかもしれない。我々は結集できるすべての力を結集し、東へと進軍してソ連人を自国の地へと追い返さねばならない。これはヨーロッパにおける我々の影響力を拡大する絶好の機会だ。

dialogue_3412=ソ軍の攻勢は、長すぎる補給線によって疲弊の兆しを見せている。
dialogue_3413=増援部隊は各地から戦場に続々と到着中だ。集結地点を死守せよ。
dialogue_3414=攻撃を続けろ！我々の鋼鉄の奔流の前に敵を震え上がらせてやれ！
dialogue_3415=主力部隊はすでに集結済みだ。反撃の時が来た。
dialogue_3416=米軍の反撃が我々の戦線に突破口を開いた。周辺の戦力を動員して、この侵攻部隊を殲滅せよ。
dialogue_3417=米軍の要塞はすでに我々により突破された。敵の援軍はもはや戦場に到達できない！
dialogue_3418=作戦開始だ！私の艦隊が後続の援軍の上陸を援護する。
dialogue_3419=ナッソーに駐留するイギリス軍の周辺に増援部隊を配備し、カリブ海を封鎖してイギリス海軍の増援を阻止せよ。
dialogue_3420=くそっ、ソ連軍は事前に準備を整えていたのか！こちらには重火器が不足していて、敵の機甲攻勢をまったく歯が立たない。
dialogue_3421=作戦は失敗だ。もし英軍が包囲を突破し、ソ軍の兵力配置を分散させられれば、我々にも勝機はある。
dialogue_3422=敵の空挺部隊に警戒せよ。各地の守備隊は防御協調体制を整えろ。
dialogue_3423=敵の上陸部隊と援軍はすでに撃退された。ハバナ南部地域は再び我々の手に戻った。
dialogue_3424=米軍はこの海域を思ったほど掌握していない。怯むな、進撃を続けろ。
dialogue_3425=我々の目的は達成された。いったん前線部隊を撤収し、この地域の状況を再評価した後、必ずメキシコ湾に戻ってくる。
dialogue_3426=アラスカのソ軍は我々によってベーリング海峡まで追い返された。だが、それは目くらましだった。ソ連軍は東海岸で再び動き出している。
dialogue_3427=キューバの事件は米軍の注意を見事に逸らした。ワシントンにはもう動かせる部隊はほとんど残っていない。
dialogue_3428=情報は何度も誤っていた。これからは戦場の状況を自ら判断するしかない。援軍が来るまで、私はこの場所を死守する。
dialogue_3429=タイフーン級潜水艦が突然こちらとの連絡を一方的に断ち切った。直ちに潜水艦部隊を派遣し、追跡に当たれ。
dialogue_3430=ニューヨークは陥落した。今こそ最も危険な時だ。進撃の速度を上げなければならない。
dialogue_3431=ソ連のタイフーン級潜水艦の指揮権は我々に移された。これを活用して、敵の要塞群を壊滅させろ。
dialogue_3432=後方の米軍はまだ集結していない。今こそ、ソ軍が体制を整える前に先制攻撃を仕掛ける時だ！
dialogue_3433=グリーンランドが援助を必要としている！
dialogue_3434=ソ軍に完全に占領される前に、我々はさらに多くの部隊を派遣して守りを固める。
dialogue_3435=ソ軍の攻撃拠点がまた一つ減った。艦隊はレイキャビク方面への攻撃を続行する。
dialogue_3436=米軍が我々の補給線をまた一つ断ち切った。そろそろ撤退を考えるべき時かもしれない。
dialogue_3437=グリーンランド周辺の艦隊を再編成し、アイスランド方面へ撤退せよ。
dialogue_3438=ソ連艦隊にはもはや退路はない。だが、ヨーロッパの敵も何か動きを見せている。迅速に決着をつけるのだ！
dialogue_3439=北米の反乱軍が絶妙なタイミングで攻勢をかけてきた。上陸作戦にはほとんど抵抗がなかった。米軍は我々の動きに構っていられない。
dialogue_3440=ソ軍は我々の味方ではない。だが今は、共通の敵がいる。
dialogue_3441=反乱軍の攻勢は極めて迅速だ。
dialogue_3442=敵は東海岸へ向けて急速に進軍している。
dialogue_3443=我々には敵の進撃を止める力がない。
dialogue_3444=前線部隊がこんなにもあっさり敗れるとはどういうことだ！カナダへの部隊配備を増強し、同盟国に代わって国内の反乱を鎮圧するぞ。
dialogue_3445=ニューヨークへ進撃するソ軍を全力で阻止しろ。西側の反乱軍は俺の部隊が片付ける。
dialogue_3446=オズボーンはたった今撃破されたはずなのに、なぜまたあそこに出現したんだ？この地域を徹底的に捜索するためにさらなる部隊を派遣する。
dialogue_3447=これで終わると思うな。必ず我々の遺産を取り戻してみせる。
dialogue_3448=米軍はアイスランドを拠点にノルウェーへ兵力を集めている。再びヨーロッパへ進軍するつもりだ。
dialogue_3449=グリーンランドでの行動が、我々に北欧と英国を奇襲するチャンスをもたらした。
dialogue_3450=ソ連軍の迅速な二正面作戦により我々は追い詰められ、短期間で効果的に兵力を分割して救援を行うことが不可能になった。
dialogue_3451=早急に我々の主攻方向を決定しなければならない。
dialogue_3452=ソ連軍の大部隊が既に上陸した。今すぐ迎撃しなければ、結果は想像を絶するものになるだろう。
dialogue_3453=今すぐに行動を起こさなければ、事態は取り返しがつかなくなる。
dialogue_3454=英米連合軍の増援艦隊に注意せよ。我々がノルウェーとスウェーデン全土を占領するまで、必ず敵援軍を足止めしろ。
dialogue_3455=ソ連の侵攻を食い止めて北へ進軍を続けろ。アメリカがヨーロッパに干渉する隙を与えるな。
dialogue_3456=ソ連の先鋒部隊がすでに西ドイツとデンマークに侵入している。
dialogue_3457=我々にはもう退路がない。前進あるのみだ！NATO軍が展開する前に、やつらの攻撃空間を圧縮しろ。
dialogue_3458=何があろうとも、フランスの抵抗の炎は消えてはならないし、決して消えない！
dialogue_3459=近くの脅威は排除した。各部隊は出撃準備を整えよ。
dialogue_3460=ソ連はもはや我々を制御できていない。ドイツの統一は誰にも止められない。
dialogue_3461=東へ進軍だ。今度こそ敗北はしない！
dialogue_3462=ソ連がいずれ戻ってくるのなら、今こそ反撃を開始し、一気に決着をつける時だ。
dialogue_3463=NATO連合軍が我々の第二防衛線を突破した。兵力を再集結して防御陣地を奪還しろ。
dialogue_3464=オスロが陥落した。状況は我々にとって非常に不利だ。
dialogue_3465=ソ連はバルト海周辺の兵力をほとんど引き上げている。今こそ我々の出番だ。
dialogue_3466=これは私の予想とは違っていた。調整するためには、さらなる作戦データが必要だ。
dialogue_3467=フランスも敗れた。このままでは我々連合軍は崩壊する。
dialogue_3468=気を確かに持て。進撃を続けろ。一時の敗北で希望を捨てるな！

