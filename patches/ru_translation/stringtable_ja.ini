elite_intro_65=IS-3重戦車はソ連が第二次世界大戦末期に開発した重戦車で、強力な122ミリ砲を搭載。「楔形装甲」の設計で知られ、装甲防護において顕著な優位性を持つ。冷戦時代にもある程度の威力を保持していた。
elite_intro_66=ヴルフラーメン40は、ドイツ軍が半装軌車両から改造した多管火箭砲です。友軍の前線部隊に低コスト、操作が簡単で、高機動性を備えた大規模な砲火支援を提供するために使用された。
elite_intro_67=フランス歴史上有名な緋色の枢機卿リシュリューの名前にちなんで命名された戦艦。2つの四連装380ミリ主砲塔を搭載。装甲と水中保護の面で当時の先進レベルにあり、日本の大和型戦艦に僅かに劣る程度だった。
elite_intro_68=赤城は、日本海軍第一航空艦隊の旗艦航空母艦であり、機動部隊の象徴と見なされていた。その艦載機のパイロットはすべて精鋭で揃えられ、真珠湾攻撃、インド洋での戦闘、ミッドウェー海戦など、複数の重要な戦闘に参加。
elite_intro_70=エンタープライズは、「グレイゴースト」、「ビッグE」という愛称で知られ、第二次世界大戦中の太平洋におけるアメリカ海軍のほぼ全ての重要な戦闘に参加。敵艦71隻を沈め、192隻に損害を与え、敵機911機を撃墜した。今日に至るまで、アメリカ海軍の他のどの軍艦もこれに匹敵する戦績を残していない。

