elite_intro_82=「幽霊部隊」は、世界のトップ兵士から成る精鋭部隊で、その静かな戦術、先進的なファントム技術、卓越した作戦効率で知られている。極限の環境下でも迅速かつ正確に敵を打撃する能力があり、空挺作戦による迅速な展開と撤収の能力も持っている。この部隊は、世界で最も致命的な精鋭部隊の一つとみなされている。
elite_intro_83=M1A1主力戦車はアメリカ軍の主力装甲戦闘車両であり、世界初の広範囲に配備された劣化ウラン弾と劣化ウラン装甲を搭載した戦車である。その120mm滑腔砲は高い貫通力を持つ劣化ウラン弾を発射し、弾薬の高密度と自鋭化特性により、敵の重装甲目標を容易に破壊できる。M1A1は劣化ウラン複合装甲を採用しており、防御能力を大幅に向上させている。これにより、貫通弾や高爆発武器に対しても卓越した生存能力を維持できている。
elite_intro_84=B-52戦略爆撃機は、アメリカ空軍の長距離重爆撃機で、1950年代から運用されている。その優れた航続距離、大きな搭載量、多用途の作戦能力により、世界中の空軍力の重要な要素となっている。B-52は、通常爆弾、精密誘導兵器、そして核兵器を搭載可能で、多様な任務に対応できる。現代のアップグレードによってもその競争力は維持されており、冷戦から現在に至るまで最も長く使用されている爆撃機プラットフォームの一つである。巨大な機体と長い離陸距離の要求により、空母の限られた甲板スペースや離陸条件には適合しない。
elite_intro_85=AH-64アパッチは、世界で最も象徴的な攻撃ヘリコプターであり、その強力な火力、先進的な電子システム、卓越した機動性で知られている。アパッチは30mmチェーンガン、空対地ミサイル、そして先進的な光学および赤外線センサーを装備する。その強力な防護システムにより、高威脅環境での戦闘が可能であり、戦場での致命的な空中打撃力となっている。アパッチの多機能性と継続的な近代化により、現代陸軍航空兵の主要な作戦プラットフォームの一つとして位置付けられている。


