feat_desc_144=歩兵ユニットへのダメージが{1}%増加する。
feat_desc_144_Lv2=歩兵ユニットへのダメージが{1}%増加する。敵軍を殲滅した場合、100%の確率で再攻撃が可能。
feat_desc_144_Lv3=歩兵ユニットへのダメージが{1}%増加する。敵軍を殲滅した場合、100%の確率で再攻撃が可能。
feat_desc_144_Lv4=歩兵ユニットへのダメージが{1}%増加する。敵軍を殲滅した場合、100%の確率で再攻撃が可能。
feat_desc_145=1マス範囲内にドローンを展開する。展開されたドローンは即座に移動および攻撃が可能で、独立したユニットとして、1ターンに1回のみ敵を攻撃できる。1ターン継続。クールダウン1ターン。
feat_desc_145_Lv2=1マス範囲内にドローンを展開する。展開されたドローンは即座に移動および攻撃が可能で、独立したユニットとして、1ターンに1回のみ敵を攻撃できる。2ターン継続。クールダウン1ターン。
feat_desc_145_Lv3=2マス範囲内にドローンを展開できる。展開されたドローンは即座に移動・攻撃が可能で、独立したユニットとして、1ターンに1回のみ敵を攻撃できる。2ターン継続。クールダウン1ターン。
feat_desc_145_Lv4=2マス範囲内にドローンを展開できる。1ターンに2回まで使用可能。展開されたドローンは即座に移動・攻撃が可能で、独立したユニットとして、1ターンに1回のみ敵を攻撃できる。2ターン継続。クールダウン1ターン。
feat_desc_146=HPを{1}回復し、電磁沈黙状態に入る。この状態の間、自身は装甲・砲兵・海軍ユニットからの能動攻撃を受けない。1ターン継続。攻撃を行うと沈黙状態は解除される。クールダウン2ターン。
feat_desc_146_Lv2=HPを{1}回復し、電磁沈黙状態に入る。この状態の間、自身は装甲・砲兵・海軍ユニットからの能動攻撃を受けない。1ターン継続。攻撃を行うと沈黙状態は解除される。クールダウン2ターン。
feat_desc_146_Lv3=HPを{1}回復し、電磁沈黙状態に入る。この状態の間、自身は装甲・砲兵・海軍ユニットからの能動攻撃を受けない。1ターン継続。攻撃を行っても沈黙状態は解除されない。クールダウン2ターン。
feat_desc_146_Lv4=HPを{1}回復し、電磁沈黙状態に入る。この状態の間、自身は装甲・砲兵・海軍ユニットからの能動攻撃を受けない。1ターン継続。攻撃を行っても沈黙状態は解除されない。クールダウン2ターン。
feat_desc_147=装甲・砲兵・海軍ユニットへの与ダメージ+{1}%
feat_desc_148=自爆プログラムを起動し、自身の全HPを消費する。周囲1マス範囲の対象（敵味方を問わず）に、自爆前のドローンHPの{1}%のダメージを与える。

army_buff_desc_1511=電磁沈黙：装甲・砲兵・海軍ユニットからの能動攻撃を受けない

