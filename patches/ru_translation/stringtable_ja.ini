armygroup_event_desc_98=ワルシャワ条約機構の装甲集団軍がライン川北岸へ激しい突撃を開始し、48時間以内に西ドイツの「ライン防衛帯」を突破しようとしている。アメリカ工兵部隊は進撃速度を遅らせるため、やむなく一部の橋梁を早期爆破した。
armygroup_event_desc_99=北大西洋条約機構の多国籍艦隊が北海で協同対潜作戦を展開し、双方は至近距離で数度にわたり交戦。ソ連の複数の潜水艦が損傷を受けた。海峡沿岸の各都市は第一級防衛態勢に突入した。
armygroup_event_desc_100=東西ベルリンで同時に市街戦が勃発し、東ドイツ守備軍はビルや工場を拠点として多重の火点を構築した。西ベルリン守備軍は、アメリカ軍の空中投下による支援を受けつつ迂回突破を試みた。ベルリンは、欧州大陸で最も激しい戦火が集中する地域の一つとなった。
armygroup_event_desc_101=ソ連空挺師団が早朝、ブリュッセル東方の空港を急襲し、北大西洋条約機構の補給中枢を麻痺させようとした。これに対し、ベルギーおよびオランダの装甲旅団が急行して反撃を展開し、激戦の結果、欧州最大級の弾薬庫の一部が爆発する事態となった。
armygroup_event_desc_102=ソ連砲兵集団が高密度の火砲射撃で西ドイツ前線陣地を覆い、いわゆる「灰燼の火力線」を形成した。西ドイツの都市インフラは深刻な被害を受けた。
armygroup_event_desc_103=ワルシャワ条約機構部隊が進路を変えてチェコ南西部へ突進し、高速装甲突破によって北大西洋条約機構南部補給線の切断を狙った。これに対し、イタリア軍とフランス軍が機動部隊を派遣して増援に向かった。
armygroup_event_desc_104=北大西洋条約機構空軍がワルシャワ条約機構の通信中枢であるブダペストに対して精密爆撃を実施した。これを受け、ハンガリー人民軍は市内に多層の防空陣地を急速に展開し、夜空は数百発の防空ロケットによって赤く染め上げられた。ブダペスト全域は二日以内に戦時封鎖へと移行した。
armygroup_event_desc_105=ルーマニア砲兵連隊とソ連軍はカルパチア山脈において共同で縦深陣地を構築し、イタリアおよび南ドイツからの増援路を封鎖しようとしている。北大西洋条約機構の山岳部隊はやむなく険峻極まる代替ルートで突破を図っており、補給線は危機的状況に陥っている。
armygroup_event_desc_106=北大西洋条約機構がオデッサに封鎖措置を実施し、ソ連南部の補給線を断とうとしている。これに対し、ワルシャワ条約機構軍はミサイルを発射して反封鎖作戦を展開。沿岸各所でミサイルの航跡が確認され、オデッサの防空網は甚大な負荷に晒されている。
armygroup_event_desc_107=スウェーデン、デンマーク、そしてドイツ海軍が協力してバルト海の出口を封鎖した。ソ連バルト艦隊はリガとカリーニングラードの二方向から同時突破を試みたが、北大西洋条約機構の偵察機にリアルタイムで捕捉され、両地点で同時に海空戦闘が勃発した。
armygroup_event_desc_108=ソ連長距離航空軍がロンドンに対して飽和型ミサイル攻撃を実施し、テムズ川南岸には複数の火災帯が発生した。英国戦時内閣は全国に最高度の戦備態勢を発令し、ロンドンの指揮中枢は一時的に通信途絶に陥った。
armygroup_event_desc_109=マンチェスターが占領され、都市周辺の工業地帯は操業停止を余儀なくされた。英国の軍需産業は短期間で「重要部品の欠乏」に直面し、北大西洋条約機構は急遽カナダとアメリカの産業能力を動員して同時補填に入った。
armygroup_event_desc_110=リヴァプールの陥落により、北大西洋条約機構の大西洋補給航路が制限を受けた。アメリカ軍海上輸送司令部は急遽アイスランド経由の航路へ切り替え、西側戦線全体の補給ペースが強制的に再編されることとなった。
armygroup_event_desc_111=ソ連航空兵がバルト海方面から深く侵入し、イェーテボリの港湾施設に甚大な打撃を与えた。スウェーデン全土は最高度の防空警戒態勢に移行した。
armygroup_event_desc_112=コペンハーゲンがワルシャワ条約機構の突撃旅団に占領され、デンマーク海峡の制海権はソ連軍の手に渡った。北大西洋条約機構はバルト海への出口能力を喪失した。
armygroup_event_desc_113=ワルシャワ条約機構のミサイルがシャンゼリゼ大通り上空で爆発し、巨大な衝撃波が大通り全体を薙ぎ払った。エリゼ宮は直後に対外通信を断たれ、大統領は緊急で地下指揮所へ移行した。
armygroup_event_desc_114=ワルシャワ条約機構の突撃部隊がブリュッセル外縁を突破し、北大西洋条約機構本部が直接的脅威にさらされた。機密情報の流出を避けるため、北大西洋条約機構は「暗夜作戦」を発動し、一部の極秘文書を緊急焼却処分した。
armygroup_event_desc_115=ロッテルダム港が重ミサイルと砲撃の集中攻撃を受け、多数の石油タンクとコンテナ区域が火海と化した。北大西洋条約機構の海上輸送能力は大幅に低下し、前線部隊の補給は全域で遅延が発生している。
armygroup_event_desc_116=ヴェネツィアは海空からの挟撃を受け、歴史地区の多くが避難を余儀なくされた。イタリア軍は必死の防戦を続けているものの、東欧方面から迫る装甲部隊の進撃を食い止めるのは困難を極めている。
armygroup_event_desc_117=セヴァストポリが陥落し、黒海艦隊は全線で北方へ撤退を余儀なくされた。これによりソ連軍南翼防衛線には深刻な空白が生じている。
armygroup_event_desc_118=ミンスクが陥落し、ワルシャワ条約機構中部戦線の支柱は完全に失われた。赤軍司令部は緊急移転を開始し、スモレンスク回廊全域が一挙に不穏な気配に包まれた。
armygroup_event_desc_119=ワルシャワが北大西洋条約機構軍に占領され、ポーランド正面戦区は瞬時に瓦解した。ソ連軍とポーランド人民軍の主力はブレスト方面へと潰走を余儀なくされ、ワルシャワ条約機構西翼全体が敵の火力にさらされることとなった。
armygroup_event_desc_120=キエフが北大西洋条約機構の手に落ち、ソ連軍の複数の方面軍集団はドニエプル川の彼方へ撤退して再編を余儀なくされた。これにより南中部戦線全域に巨大な空白地帯が生じている。
armygroup_event_desc_121=ロンドンが陥落し、英国全土は戒厳令下に置かれた。英倫の要衝を失ったことで北大西洋条約機構西翼は動揺し、海峡防衛線の崩壊は北海および大西洋方面の勢力均衡を根底から覆す事態となった。
armygroup_event_desc_122=ワルシャワ条約機構が中欧方面に大規模な電子妨害を展開し、北大西洋条約機構のレーダー網は数十キロにわたって完全に沈黙した。


skill_name_170=後手からの一撃
skill_name_171=大鎌作戦
skill_name_172=戦争動員
skill_name_173=マーシャルプラン
skill_name_174=精鋭潜水艦
skill_name_175=深海潜航回避

skill_info_170=装甲部隊を指揮している場合、与えるダメージが[#00FF00#%d%%]上昇し、攻撃後に与えたダメージの10%%分のHPを回復する。自身が強化状態を保持している時、会心率が10%%上昇し、敵軍の防御を30%%無視する。攻撃後に目標を撃破できなかった場合でも再度攻撃できる（毎ターン1回）。さらに、指揮下の部隊は移動時に敵部隊による進路阻止の影響を受けず。
skill_info_171=装甲部隊を指揮している場合、士気が低下しない。攻撃時、敵軍が反撃できなくなる確率が[#00FF00#%d%%]上昇し、敵を殲滅すると1ターン持続の「収穫」を獲得する（効果：与えるダメージ+20%%、回避を無視）。さらに、指揮装甲部隊の攻撃力が30上がるごとに会心ダメージ+5%%、攻撃力が180以上の時、自身の射程+1。
skill_info_172=歩兵部隊を指揮している場合、[#00FF00#%d%%]の確率で会心ダメージを与え、毎ターンHPを最大値の15％まで回復する。また、歩兵を指揮している時、自身および周囲2マス以内の友軍歩兵ユニットは与えるダメージ+30%%、受けるダメージ-25%%（このスキルを所持している場合、歩兵指揮官の効果は無効となる）
skill_info_173=陸上部隊を指揮している際、ターン中に消費した経済の[#00FF00#%d%%]を次ターンに回収できる（上限1200）。さらに、指揮陸上部隊の周囲3マス以内で敵軍が殲滅されると、工業40と科学点4を獲得する（毎ターン最大3回まで）
skill_info_174=潜水艦（原子力潜水艦を除く）を指揮している場合、敵軍の防御を無視する、攻撃時の射程が1増加します。また、指揮潜水艦が敵を殲滅すると[#00FF00#%d%%]の確率で再攻撃が発生し、会心ダメージを与えた場合は再攻撃発生率が追加で25%%上昇する。
skill_info_175=潜水艦を指揮している場合、受けるダメージが[#00FF00#%d%%]減少し、空軍およびミサイルによる攻撃に対して50%%の確率で回避する。さらに、指揮潜水艦部隊は毎ターンHPを最大値の5%%回復する。

army_buff_desc_1631=収穫：与えるダメージ+20%、回避を無視



