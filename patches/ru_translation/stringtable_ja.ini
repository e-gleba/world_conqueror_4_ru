event_intro_101=フィンランドは10年の歳月をかけて、マンネルハイム線を完全な要塞システムとして構築した。マンネルハイム線はカレリア地峡に建設され、沼地や湖といった自然の障壁を囲むように複数の防衛区域が設けられた。陣地はソリと木製の射撃陣地を備えた多数の固定要塞で構築された。マンネルハイム線の背後には、フィンランドを侵略しようとするいかなる敵にも立ち向かおうとする白きフィンランドの戦士たちが待ち構えていた。

event_intro_102=ドイツの台頭は欧州全土に不安と懸念を呼び起こし、その果てしない領土拡張は欧州全土に戦争の予兆をもたらした。ポーランドには広大な国境を持つ避けようのない標的となったが、イギリスやフランスといった連合国の盟友からの強い後ろ盾があったため、それほど心配する必要はなかった。しかし、ドイツだけがポーランドを狙っていたのだろうか？

event_intro_103=数十億フランを投じて建設されたマジノ線は、空爆や 大口径砲など、さまざまな攻撃に耐えることができた。内部には、あらゆる種類の大砲、塹壕、工場、病院、その他の軍事施設や生活施設があった。しかし、果たしてドイツ軍の指揮官たちは、この要塞化された防衛線に直接対峙するのだろうか？それとも、低地諸国を経由してフランスを攻撃することに重きを置くのだろうか？それとも別の計画があったのだろうか？

event_stage_intro_20101=西ヨーロッパ全体がドイツの支配下に入った。司令部はバルバロッサ作戦を策定し、ソ連を転覆させることを望んでいる。ミンスクは我々の第一目標であり、その占領はソ連に大きな打撃を与え、我が軍の士気向上に不可欠である。

event_stage_intro_20102=ドイツ軍の大規模なソ連侵攻は、フィンランドにとって絶好のチャンスである。我々はドイツ軍と共同作戦を展開し、レニングラード以北に攻勢をかけ、冬戦争中にソ連が占領した領土を奪還する。

event_stage_intro_20103=電撃戦の効果は、ソビエトを油断させたミンスクでの勝利で再確認された。我々の機甲師団は足踏みするわけにはいかない。スモレンスクを制圧すれば、この地域の補給の中心地と軍事拠点を支配できる。そうすれば、その後の攻勢によりよい補給と後方支援ができる。

event_stage_intro_20104=ウクライナ地方はソビエト連邦の穀倉地帯であり、工業の中心地でもある。キエフを制圧することは、大量の資源と産業を掌握することを意味する。我が機甲部隊は、キエフ包囲網を完成させ、同市を占領し、ソ連の防衛を一層攪乱する必要がある。

event_stage_intro_20105=ソ連にとってバルト海沿岸地域で最も重要な港であるレニングラードは、ソ連の重要な経済的、文化的、歴史的中心地でもあった。レニングラードの占領は、ソ連の防衛力を弱めるだけでなく、ソ連国内の士気と自信にも大きな影響を与えるだろう。

event_stage_intro_20106=クリミアは黒海の真珠として軍事的に重要である。我々の機甲師団は中央軍集団に移管され、現在は歩兵と砲兵しか使えない。しかし、グスタフ列車砲のおかげで、セヴァストポリの要塞を突破することができる。

event_stage_intro_20107=我々の攻撃は止められない。ハリコフは重要な工業都市であり、攻勢を強めなければならない。我々がハリコフを占領する前に、ソビエトに工場や設備を疎開させてはならない。

event_stage_intro_20108=ブリャンスクとヴャジマはモスクワへの道に立ちはだかる最後の障壁だ。モスクワ攻撃に備えて、敵の防衛力を削いで攻撃可能な地域を拡大する必要がある。

event_stage_intro_20109=ヴォルガ川沿いのスターリングラードは、石油と天然ガスの資源が豊富なコーカサス地方の主要工業都市である。敵は防衛のために多数の部隊を展開していた。スターリングラードを占領することによってのみ、ソ連の戦意を喪失させ、東部戦線での勝利への道を開くことができる。

event_stage_intro_20110=モスクワの凍てつく冬は、我々の輸送と兵站物資に深刻な影響を与えた。敵の抵抗は当初よりはるかに激しくなっている。それでも我々の進撃は止まらない。我々はクレムリンで勝利の美酒を味わうだろう。

event_stage_intro_20111=西ヨーロッパ全体がドイツの支配下に入った。司令部はバルバロッサ作戦を策定し、ソ連を転覆させることを望んでいる。ミンスクは我々の第一目標であり、その占領はソ連に大きな打撃を与え、我が軍の士気向上に不可欠である。

event_stage_intro_20112=ドイツ軍の大規模なソ連侵攻は、フィンランドにとって絶好のチャンスである。我々はドイツ軍と共同作戦を展開し、レニングラード以北に攻勢をかけ、冬戦争中にソ連が占領した領土を奪還する。

