feat_desc_70_Lv3=攻撃時、目標の1マス範囲内の他の目標に{1}%の追加ダメージ、1ターン継続、クールダウン2ターン。
feat_desc_71_Lv4=攻撃後に追加攻撃可能、最大{1}回発動。ターン中に攻撃するたび、次の攻撃のダメージが20%増加し、最大3回まで重ねがけ可能。
feat_desc_72_Lv4=輸送機を除き、飛行場でほとんどの航空機を使用でき、最大{1}航空機ポイントまで使用可能です。
