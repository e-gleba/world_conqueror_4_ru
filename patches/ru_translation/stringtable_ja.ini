feat_desc_141=空軍・空中停止ユニットからの被ダメージ{2}%減少。砂漠地形での被ダメージ{1}%減少。
feat_desc_142=1マス範囲内の敵に対する攻撃・反撃時、与ダメージ{1}%減少。2マス以上離れた装甲・砲兵・空中停止ユニットに対して攻撃・反撃する際、与ダメージ{2}%増加。
feat_desc_143=攻撃・反撃時、回避およびスモーク効果を無効化する。
feat_desc_143_Lv2=攻撃・反撃時、回避・スモーク効果を無視する。空中停止ユニットに対する攻撃・反撃時、追加で{1}%のダメージ増加。
feat_desc_143_Lv3=攻撃・反撃時、回避・スモーク・防御装置の効果をすべて無視する。空中停止ユニットに対しては追加で{1}%のダメージ増加。


