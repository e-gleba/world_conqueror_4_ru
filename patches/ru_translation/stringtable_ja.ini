skill_name_146=対決
skill_name_147=協同反撃
skill_name_148=縦深攻撃
skill_name_149=指導者
skill_name_150=戦場の直感
skill_name_151=老将

skill_info_145=装甲部隊を指揮中、周囲2マス以内に敵軍が1ついるごとに与えるダメージ+[#00FF00#%d%%]（最高50%%）。さらに、装甲部隊が士気高揚状態の時、被ダメージが20%%減少する。
skill_info_146=装甲部隊を指揮中、敵の精鋭部隊に与えるダメージ+[#00FF00#%d%%]
skill_info_147=火砲部隊を指揮中、自身は反撃不可のスキル効果を受けない。さらに、周囲1マスの味方が反撃を行う際、自身も[#00FF00#%d%%]の確率で反撃に参加する。
skill_info_148=火砲部隊を指揮している時、攻撃および反撃で、2マス以上離れた敵に与えるダメージ+[#00FF00#%d%%]
skill_info_149=部隊を指揮中、陸上ユニットに与えるダメージ+[#00FF00#%d%%]。さらに、敵都市を占領した際、自身と周囲3マス以内の味方部隊は「嘉賞」を獲得し、攻撃力が15%%上昇、効果は3ターン継続。
skill_info_150=部隊を指揮している間、スモーク弾・電磁沈黙・回避効果・ステルスを無視して攻撃を行い、HPが半分以下の敵に対して与えるダメージ+[#00FF00#%d%%]
skill_info_151=部隊を指揮中、HP上限+[#00FF00#%d%%]。さらに、部隊のHPが半分以上であれば士気が混乱しない。


dialogue_3138=我が軍の兵力は日本軍を大きく上回っている。シンガポールで敵を必ず殲滅し、アメリカとソ連に英国の威厳と栄光を示すのだ！
dialogue_3139=東岸は地形が平坦で上陸しやすい。日本軍がここから上陸するのを厳重に防ぐのだ！
dialogue_3140=我が軍の兵力と補給はイギリス軍に遠く及ばない。戦術を駆使して彼らを降伏に追い込む必要がある。消耗戦に持ち込ませるな！
dialogue_3141=敵軍がこれほど脆弱とは。一気に攻め込み、抵抗の意志を粉砕せよ！
dialogue_3142=ブキッ・ティマは我が軍が占領した。お前たちの食糧庫も水源ももう守れない。こんな無意味で絶望的な抵抗をやめるのだ！
dialogue_3143=精鋭部隊、全力でブキッ・ティマを奪還せよ！物資が尽きれば、我々は戦いを続けることができなくなる！
dialogue_3144=イギリス軍の反攻部隊を殲滅せよ！補給が尽きれば、無条件降伏に応じるだろう！
dialogue_3145=シンガポールの物資が尽きてしまった。これ以上戦えない。日本軍に降伏の意思を伝えろ。
dialogue_3146=この作戦では主力艦隊を安全にドイツの港へ送り届けることが最優先だ。海峡を通過できる機会は限られている。急げ！
dialogue_3147=徹底的に捜索し、必ず彼らを撃沈せよ！戦時中に敵艦がイギリス海峡を通過することなど許されない！
dialogue_3148=目標艦隊を発見！撃沈せよ！
dialogue_3149=チュニジア中部の各峠は東部平原攻撃の拠点だ。各部隊、必ず守り抜け、ミスは許されない！
dialogue_3150=部隊を二手に分け、一方は南部からスィディ ブジドを攻撃し、もう一方は北西へ進攻。この峠を敵に渡すわけにはいかない！
dialogue_3151=敵軍が撤退を始めた。攻撃を続け、奴らの立て直しを許すな！
dialogue_3152=情報によれば、日本海軍連合艦隊の主力艦がトラックに停泊中だ。兵士たち、真珠湾の借りを返させる時だ！
dialogue_3153=日本軍の上陸部隊は砲火で制圧された。上陸を許可する！
dialogue_3154=諸君、最後の時が来た！ここでより多くの敵を葬るのだ！
dialogue_3155=地上部隊に告ぐ：日本軍は火力を隠すためにバンカーを使用している。警戒を怠るな！警戒せよ！
dialogue_3156=発砲！発砲！万歳突撃は禁止だ！全員、陣地を守り抜き、最後の瞬間まで戦うのだ！
dialogue_3157=数でも質でも優勢な陸海空の攻撃に直面し、全力を尽くしましたが、重要地点はすべて敵の手に落ちました。申し訳ありません。
dialogue_3158=ドイツ軍が我が軍の南北を包囲している。攻撃の邪魔をさせないためにも、奴らを排除する必要がある！
dialogue_3159=全力を尽くしたが、情勢には逆らえん。今は、ただ尊厳ある最期を願うのみ。
dialogue_3160=スラバヤ方面に敵艦隊を発見。奴らを叩き潰せば、ジャワ島は我々のものだ！
dialogue_3161=各艦に告ぐ、日本艦隊がスラバヤに接近中。戦闘準備を整えろ！
dialogue_3162=敵の火力は激しい。損傷した艦は修理のため先に撤退せよ。
dialogue_3163=故郷の海で沈むわけにはいかない！
dialogue_3164=ラエの前線は現在兵員が不足している。この部隊が到着すれば状況が改善される。必ず安全に送り届けよ！
dialogue_3165=各部隊に告ぐ、日本軍の輸送船が出航した。叩き潰せ！前線の負担を軽減するのだ。
dialogue_3166=我が軍は補給が不足している。防衛線での消耗戦は避けねばならない。出撃し、防衛線の前で敵を撃退せよ！
dialogue_3167=兵士たち、警戒を怠るな！敵軍がまもなく攻撃を仕掛けてくる。物資が十分でない彼らは長くは持たない！
dialogue_3168=これ以上戦えば、残った兵力ではマレスラインを守れなくなる。全軍撤退せよ！
dialogue_3169=戦士たち、日本軍がまもなく攻撃を開始する。陣地を守り抜き、規律を厳守せよ。我々は必ず勝利を収める！
dialogue_3170=心配するな、空中補給が十分我々を支えてくれる。インパールを守り抜け。広大な密林が敵軍の補給を崩壊させる！
dialogue_3171=インパールを奪還せよ！
dialogue_3172=日本軍は補給不足で攻勢はどんどん弱まっている。戦士たち、勇気を示し、日本軍が決して無敵ではないことを証明しよう！
dialogue_3173=日本軍はもはや抵抗する力がない。島内の日本軍を掃討し、ミンダナオ島を解放せよ！
dialogue_3174=「永久抵抗」戦略を維持し、どんな拠点も簡単に放棄してはならない！
dialogue_3175=フランスの防衛線はまだ十分信頼できる。防衛線を守り抜けば、我々は敗北しない！
dialogue_3176=正面から圧力を維持し、機動部隊が防衛線の左側から攻撃を仕掛けるのを待て。「左フック」で防衛線を突破するのだ！
dialogue_3177=くそっ、イギリス軍はどうやって防衛線の右側に到達したんだ？全軍に告ぐ、防衛線を放棄し、北へ撤退せよ！
dialogue_3178=この防衛線はもう守れない。マレットの守備隊は迅速に後退し、敵軍と無駄な交戦をするな！
dialogue_3179=攻撃せよ、奴らを完全に撃破するのだ！
dialogue_3180=私は王のために最後の一滴まで血を流した。栄光と呼ぶには十分な人生だ。
dialogue_3181=海面は制圧済みだ。フィリピン中部の諸島も必ず我々の支配下に置くのだ！
dialogue_3182=島を守る部隊はあらゆる手段を尽くして敵を引き付け、全力で島の奪取を阻止せよ！
dialogue_3183=東部平原の安全を確保し、敵軍が防衛線を突破することを絶対に許すな！
dialogue_3184=敵軍の防衛線を突破し、戦線を東部平原へと押し進めよ！
dialogue_3185=降伏しろ。さもなくば、包囲網内のドイツ軍を捕虜として扱わない！
dialogue_3186=第1装甲軍は西へ撤退し、西南への突破を装い、随時西北からの援軍に対応せよ！
dialogue_3187=私を解任するだと？あの愚か者め！そもそもあいつの無茶苦茶な指揮がなければ、こんな状況にはならなかったんだ！
dialogue_3188=西北方向にドイツ軍の援軍がいるだと？阻止せよ、そこを突破口にさせるわけにはいかない。
dialogue_3189=出撃！この戦いで東洋艦隊を殲滅するのだ！
dialogue_3190=敵軍がこちらに向かっているだと？進軍せよ、敵の主力艦をすべて撃沈するのだ！
dialogue_3191=貴様らは愚か者か？敵に沈められるとは何事だ！撤退し、港へ戻って態勢を整えるのだ。
dialogue_3192=沖縄は日本本土攻撃の重要な足場だ。これを制圧すれば、この戦争を早く終わらせることができる。
dialogue_3193=敵が自爆攻撃を仕掛けてきた。回避せよ！
dialogue_3194=イタリアのゲリラ部隊が我々を支援してくれる。この山脈を越えれば平原が広がる！進軍し、イタリアを解放せよ！
dialogue_3195=我が国の残る領土を守るため、我が軍はドイツ軍と協力して防衛に当たる。
dialogue_3196=ガルダ湖周辺の峠を封鎖せよ。敵軍を逃がすな、一網打尽にするのだ！
dialogue_3197=くそっ、どこから湧いてきた暴徒だ！鎮圧せよ。軍政に干渉する者は全員逮捕するのだ！
dialogue_3198=私はイタリア軍の最高指導者だ。イタリア軍を代表して降伏する。


