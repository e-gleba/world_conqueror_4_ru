synergy_tactics_6_1=・すべての「電撃師団」ユニットは、本ターンに移動していない場合、ターン終了時に自身へ「塹壕構築」状態を付与する。（塹壕構築：防御力+30%。移動すると自動解除。）
synergy_tactics_6_2=・長空の電撃：「電撃師団」ユニットの3マス以内で敵軍が空軍の攻撃を受けた場合、本ターン中の攻撃力+20。
synergy_tactics_6_3=・軽装機動：「電撃師団」歩兵ユニットが本ターンに移動していない場合、ターン終了時、周囲2マス以内の「電撃師団」ユニットに次ターン行動力+6を付与する。
synergy_tactics_6_4=・対戦車戦術：「電撃師団」砲兵ユニットの2マス以内に「電撃師団」歩兵ユニットが存在する場合、装甲ユニットに与えるダメージ+30%。

