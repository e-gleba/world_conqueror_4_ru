dialogue_2770=この作戦の目的は、ガダルカナルとその近隣の島々の空港を占領することである。 これにより、ソロモン諸島を奪還する！
dialogue_2771=なぜアメリカ軍がそこに？ 必ずや飛行場を奪還すると、全編隊に伝達せよ！
dialogue_2772=ドイツ軍はカーンから追い出された。この勢いに乗り、防衛線を突破せよ！
dialogue_2773=将軍たちよ、戦線を固めろ！ 後方は我々の命綱だ！
dialogue_2774=よし！このまま深く進んでファレーズを取る！
dialogue_2775=全力で攻撃し、彼らを裂け目に押し込むのだ！
dialogue_2776=兵士たち、ドイツ軍はすでに袋のねずみだ。攻撃を続け、完全に粉砕せよ！
dialogue_2777=全兵士に告ぐ、着実に前進し、Bグループを包囲網の中に封じ込め！
dialogue_2778=元首の命令により：全力で反撃し、敵の進撃を阻止せよ！
dialogue_2779=戦況はすでに挽回不可能、全軍撤退し、戦力を温存せよ！
dialogue_2780=ドイツ軍の動きが変わった。東部の部隊は迅速に包囲せよ、敵を逃がすな！
dialogue_2781=全軍整備！今回こそ、故土を取り戻すのだ！
dialogue_2782=この作戦では、全ての港を確保し、物資の供給を確保する必要がある。
dialogue_2783=連合軍の攻勢が激しい！Gグループ軍全体は後退し、戦力を保全せよ。
dialogue_2784=この作戦では、ディエップ防衛線を突破し、ドイツ軍の海岸防衛情報を入手する必要がある。
dialogue_2785=警戒を怠らず、巡回を強化せよ！連合軍はいつ上陸してもおかしくない！
dialogue_2786=この作戦でキエフを包囲し、南西方面を完全に破壊するのだ！
dialogue_2787=私の部隊はチェルニゴフから南へ進攻する。
dialogue_2788=私の部隊は、クレスティからチェルカースィ-クレメンチュークのラインを北へ進攻する。
dialogue_2789=最高指揮部からの命令：全力で陣地を守れ！逃げず守り続け、必要なら犠牲となるのだ。
dialogue_2790=包囲網を完成し、敵軍を全力で殲滅せよ！
dialogue_2791=西北方面軍の命令：バルト艦隊と第10歩兵軍はタリン港からレニングラードへ撤退せよ。
dialogue_2792=砲兵隊は海岸沿いを封鎖。空軍部隊は敵艦船を全力で爆撃。ソ連軍の海上撤退を阻止するのだ！
dialogue_2793=北部は陽動、南部は攻撃。 この戦いで第8軍団を撃破する！
dialogue_2794=戦車を陣地に固定せよ。アラム・エル・ハルファを守り抜き、必ずや勝利を収める！
dialogue_2795=機動戦闘、迅速行動を行い、英仏が反応する前にポーランドを占領せよ！
dialogue_2796=我が軍は攻撃を支援し、ポーランド回廊の通行を確保する。
dialogue_2797=我が軍は主攻撃を担当し、必ずポーランドの核心部に素早く侵入する。
dialogue_2798=将士たちよ、持ちこたえろ！イギリスとフランスが介入すれば戦局は逆転するだろう。
dialogue_2799=全軍、命令を聞け！ウクライナとベラルーシの住民を守るため、ポーランド地域の混乱武装を掃討せよ！
dialogue_2800=ソ連が条約を破ってポーランドに侵攻しただと？どうやらポーランドは敗北したようだが、我々は決して降伏しない！
dialogue_2801=この戦闘はまず「足の裏 」から行い、敵の主力部隊の動きを鈍らせる。我が主力はその後、サレルノに上陸し、ナポリを占領する。
dialogue_2802=アメリカ軍がドイツ軍がタランティーノに重点的に防衛すると信じているなら、そうさせておけばいい。我々は行動を迅速にし、上陸支援を最大限に行う。
dialogue_2803=連合軍の主攻方向はおそらく「足の裏 」に置かれないだろう。我々はローマ周辺に兵力を集中し、防衛ラインを展開する必要がある。
dialogue_2804=イギリス軍が戦闘を始めている 。いざ出発、サレルノに上陸せよ！
dialogue_2805=良い知らせだ！ イタリアが降伏を表明した。
dialogue_2806=イタリア軍の武装を解除しろ、我々の支配下に置く。
dialogue_2807=エジプトへの進軍計画は既に2度延期された、首相はこれ以上の延期はできないと考えている。
dialogue_2808=備蓄が完全ではないが、標的に対して充分だろう。エジプトに向けて進撃！
dialogue_2809=柔軟に封じ込めるのだ、攻撃のために十分な力を蓄える時間稼ぎが必要だ。
dialogue_2810=素晴らしい、この調子で前進を続けろ！
dialogue_2811=同志諸君、反攻の時が来た！ リガを解放するのだ！
dialogue_2812=将士たち、東プロイセンはまだラトビアと結びついており、支援は途絶えない。陣地を防衛せよ！
dialogue_2813=ドイツの抵抗は頑強だ。 クライペダを攻撃し、リガと東プロイセンの連絡を断つほうが得策だろう。
dialogue_2814=くそ！段階的にリガから撤退し、クールラントで防衛ラインを再編成するのだ。
dialogue_2815=第1空挺部隊が到着した。彼らは近くの橋を奪い防衛する。なるべく早く支援せよ！
dialogue_2816=兵士たちよ、速やかに前進し、アメリカ人に我々の力を見せつけよ！
dialogue_2817=各部隊は橋を確保し、確保できなければ全力で破壊せよ。装甲部隊がすぐに支援する！
dialogue_2818=アルンヘムの橋が失陥した。ライン川を渡ってルール地方に侵攻することができない。
dialogue_2819=ヒュルトゲンの森方面に進攻し、アーヘン地域のドイツ軍への支援を阻止しろ！
dialogue_2820=ジークフリート線を基盤に防御し、必ずアメリカ軍の進撃を止め、ルールダムを守る！
dialogue_2821=アーヘンは陥落した、部隊は前進を続けろ！
dialogue_2822=アーヘンが陥落しても、我々は決して諦めない。防衛を続ければ、まだ機会がある！
dialogue_2823=どうやら、向こうはこちらの好意を受け入れたくないようだ。
dialogue_2824=問題ありません。計画通り、武力行使に移るほかないようです。
dialogue_2825=攻撃開始、メス地区のドイツ軍を殲滅し、メスを占領する！
dialogue_2826=メスの守備隊、砦の防御力を頼りに、アメリカ軍の進撃を妨害せよ！
dialogue_2827=第2軍団はブリャンスクの北西から突破、第2装甲軍はセフスクからオリョールへ進撃。この戦いで、ブリャンスク戦線を一網打尽にする！
dialogue_2828=同志諸君、モスクワは我々の後方にある。必ずや敵を阻止するのだ。すべては祖国と人民のために！
dialogue_2829=敵は我々を包囲しようとしている、全軍突破せよ！
dialogue_2830=全力で攻撃し、敵を撃破せよ！
dialogue_2831=元首の命令だ、第15軍団はあらゆる代価を厭わず、スヘルデ河口を守るのだ。
dialogue_2832=カナダ第1軍団はスヘルデ川の開削を担当、連合軍は適宜に支援をする。
dialogue_2833=ワルヘレンへの通路はあらゆる代償を払っても確保しなければならない。近隣の連隊よ、支援を急げ！

event_206=大祖国戦争

