event_4110=キャンプ地の戦い

event_intro_4107=ソ連軍は厳重な作戦偽装を実施し、夜間の部隊移動や偽陣地の構築などの手段を用いて主力部隊の秘匿集結に成功した。1942年11月19日、ソ連軍はドイツ軍両翼を防衛していたルーマニア軍の陣地に対して大規模な攻勢を開始し、短時間で防衛線を突破した。ドイツ軍はソ連軍の攻勢の規模と意図を誤って判断したため、南北両方面から進撃したソ連軍が順調に会合し、最終的にドイツ第6軍および第4装甲軍の一部部隊を完全に包囲する結果となった。この戦いは東部戦線の戦略的状況を一変させる転機となった。
event_intro_4108=1943年11月20日、アメリカ軍は強力な海空火力の支援のもと、タラワ環礁において上陸作戦を実施した。予想を大きく下回る潮位のため、多くの部隊が海岸から遠く離れた地点で下船を余儀なくされ、浅瀬を歩いて上陸することとなった。その一方で、日本軍は上陸作戦を想定して島の防御を強化しており、上陸地点でアメリカ軍に甚大な損害を与えた。四日間に及ぶ激戦の末、アメリカ軍は多大な犠牲を払って守備隊を全滅させた。この戦いはアメリカ軍にとって貴重な上陸作戦の経験となり、潮汐予報と水文調査の重要性がかつてないほど高く評価される契機となった。
event_intro_4109=東南アジアの戦略資源を確保し、アメリカによる経済制裁と石油禁輸を打破するため、日本海軍は1941年12月7日、アメリカ・ハワイの真珠湾海軍基地に対して奇襲攻撃を行った。日本軍は六隻の航空母艦を出撃させ、二波にわたる空襲を実施し、わずかな損害でアメリカ太平洋艦隊に甚大な打撃を与えた。多数の艦船と航空機を撃破したものの、アメリカ軍の三隻の航空母艦はいずれも港外にあったため被害を免れた。翌日、アメリカは日本に宣戦を布告し、太平洋戦争が勃発した。
event_intro_4110=イタリア軍はエジプトへ侵攻した後、シディ・バラニで攻勢を停止し、防御陣地の構築と複数の野営地の設置を行いながら後続支援を待っていた。1940年12月8日、イギリス軍は同地のイタリア軍陣地に対して奇襲を仕掛けた。作戦は事前に厳重な秘密保持のもとで実施されたため、イタリア軍は不意を突かれ、混乱の中で応戦を余儀なくされ、多数の兵士が捕虜となった。この戦いの成果は予想をはるかに上回り、イギリス軍はその勢いを駆って攻勢を拡大し、奇襲を「コンパス作戦」と呼ばれる戦略的反攻へと発展させた。

dialogue_4146=艦砲の援護の下、全力で上陸を完遂せよ！
dialogue_4147=潮位が予想より低い！上陸艇の吃水が深く、これ以上接岸できない。
dialogue_4148=島内の日本軍は既に分断され、我が軍は絶対的優位を握っている。警戒を強め、最後の敵を殲滅せよ。
dialogue_4149=日本軍が突如、上陸部隊に激烈な反撃を仕掛けてきた。
dialogue_4150=今回は演習ではない！イタリア軍の野営地へ突入し、不意を突け！
dialogue_4151=敵の主攻方向に注意せよ。英軍主力は我が背後の砂漠に展開している。
dialogue_4152=敵は全面的に崩壊している。攻撃を継続し、戦果を拡大せよ！
dialogue_4153=イタリア軍の主要な兵営が次々と陥落し、全線の防御が揺らぎ、部隊は次第に混乱に陥っている。


skill_name_166=遠征軍司令官
skill_name_167=覇王作戦
skill_name_168=大縦深戦術
skill_name_169=救火隊長

skill_info_166=艦船部隊の行動力＋5。反撃不能の効果を受けない。指揮下の部隊は、行動力が3ポイント上昇するごとに、攻撃および反撃ダメージが[#00FF00#%d%%]上昇する。
skill_info_167=自身の周囲3マス以内の敵軍は被ダメージが35%%増加し、傾斜装甲・防護装置・挑発・拘束・共闘の効果が無効になる。指揮下の艦船部隊が敵を撃破した際、[#00FF00#%d%%]の確率で再攻撃を行う。
skill_info_168=陸上部隊を指揮している際、周囲3マス以内の敵が撃破されると、自身の士気が上昇し、さらに「突破集群」状態を獲得する。（与ダメージが[#00FF00#%d%%]上昇し、最大42%%まで累積可能）ステージ終了まで持続する。
skill_info_169=砲兵部隊を指揮している際、行動力＋3。敵を撃破した時、[#00FF00#%d%%]の確率で再攻撃を行う。さらに、部隊のHPが200ポイントごとに再攻撃発動率が追加で10%%上昇する。

promotion_desc_4=研修後、将軍の能力上限が上昇する。研修を行うと、将軍が所持していた固定スキルはリセットされ、習得および強化に使用した費用が全額返還される。
army_buff_desc_1591=突破集群：与ダメージが%d%%上昇
army_buff_desc_1592=突破集群：与ダメージが%d%%上昇
army_buff_desc_1593=突破集群：与ダメージが%d%%上昇


dialogue_4121=午前四時、嵐はまだ収まらない。全員が一つの答えを待っている——延期か、出撃か。
dialogue_4122=参謀たちは潮汐や雲、月のことを議論し続けている。数か月にわたる演習がこの瞬間のためだったことを知っているのはこの私のみ。躊躇は敵の砲火よりも致命的だ。
dialogue_4123=出発だ。神よ、我らに憐れみを。
dialogue_4124=波が高く、哨戒機ですら離陸できない。参謀部からの電文にはこうあった：「連合軍はこの悪天候では行動しない」。
dialogue_4125=今日の海霧はひときわ濃い。……霧の向こうに見えるのは何だ？漁船か？一隻、二隻……待て、なんということだ、海面全体が動いている！
dialogue_4126=連合艦隊！連合艦隊だ！この天候で行動するだと？奴らは狂っている！ただちに警報を鳴らせ！全員、第一戦闘配備につけ！砲兵と機銃手に配置につくよう伝達しろ――上陸だ！奴らが上陸してくる！
dialogue_4127=パラシュート隊か？突破口を見つけたつもりか。あの地は浅瀬と水たまりだらけで、元帥が前もって仕掛けた罠である。彼らが飛行機から飛び降りた瞬間に、もはや勝敗は決していた。
dialogue_4128=よし、泥の中を泳がせてやれ！帝国は奴等の「冒険心」を歓迎する。
dialogue_4129=沿岸防御線は我々の予想よりも頑強で、敵の機銃火はまるで鉄の幕のようだ！戦艦と航空部隊に告げよ、あの掩蔽陣地を粉砕しろ！
dialogue_4130=我が兵士たちがまだ水中でもがいている！救難艇を出せ、どんな代償を払っても構わない！彼らをこの海に孤独に沈めはしない！
dialogue_4131=浜辺の一寸一寸、塹壕の一本一本、砦の一つ一つ､すべてヨーロッパ大陸へ通ずる鍵である。奪取せよ！それこそ我らの帰る道だ。
dialogue_4132=艦隊との連絡を維持せよ。くそっ、我々は航空支援を必要としている！取り決めどおり、我が軍の機に識別マークを付けろ！
dialogue_4133=全軍注意！ドイツ軍の装甲集団が集結している！これは彼らの最後の反撃であり、我々の勝敗を決する時だ！
dialogue_4134=彼らはまだ上陸している……数え切れない艦艇が、波のように次々と押し寄せる。なんてことだ、奴らは狂っているのか？防衛線が崩れつつある！我々はもう持ちこたえられない！命令を求む……命令を求む……！
dialogue_4135=ロンメル元帥は今ベルリンにいる……命令を下せる者はいない。援軍もない。我々は、自分たちの力で戦うしかない！
dialogue_4136=ロンメル元帥が既に前線に到着した！今こそ我らの反撃の番だ！イギリス海峡は敵の墓場となるだろう！
dialogue_4137=兵士たちよ、今こそ彼らに思い知らせる時だ──ドイツの兵士は、たとえ倒れても膝を屈しない。たとえ一人になろうとも、この砂浜を容易く渡させはしない。
dialogue_4138=兵士たちは祈っている。もはや檄を飛ばす者はいなく、ただ生き延びたいと願っている……空気には火薬とガソリン、海水、焦げた肉の臭いが混ざり合っている。
dialogue_4139=海岸は陥落し、上陸は失敗した……伝令、全軍に撤収せよ、艦上へ戻れ。我々はこの戦役に敗れたが、戦争そのものに敗れたわけではない。いつの日か、我々は必ずここへ戻ってくるだろう。
dialogue_4140=それが我々の最大の過ちだった……崩壊寸前の帝国が放つ最後の反撃を、侮っていたのだ。
dialogue_4141=我々はこの戦いに勝利したように見える。だが私は考える、我々が守ったのは本当に祖国なのか、それともすでに魂を失った幻なのか。総統は遠く離れた場所で国境線を描いているが、倒れてゆく兵士たちの姿を一度たりとも見たことはない。
dialogue_4142=盲目的な服従は兵士の本能だ。だが、理性的な疑問を抱くことこそ、人間に与えられた権利でもある。いつの日か、すべての人が自ら考えることを学んだときこそ、帝国は真に救われるだろう。
dialogue_4143=あの対岸の人々を憎んだことは一度もない。彼らもまた、命令に従い死地へと向かわされた父であり、息子にすぎない。もしかすると我々の最大の違いとは、ただ運命によって異なる方向に立たされたということだけかもしれない。
dialogue_4144=この戦いが戦争の終わりではなく、帝国再生の始まりであることを願う。
dialogue_4145=私は軍人としての誓いを果たした……敵にベルリンの土地を一寸たりとも踏ませるな。

event_107=ノルマンディー防衛線
event_intro_107=1944年の夏、連合軍はイギリスにかつてない規模の兵力を集結させた。砲火と鋼鉄が怒涛のごとくうねりをなし、彼らは再びイギリス海峡の対岸を踏みしめる準備を整えていた。ドイツ軍はフランス北岸に展開し、いずれ訪れる嵐を前に、兵士たちは砂丘とコンクリートの堡塁の間で息をひそめていた。6月6日の夜明け、ノルマンディーの海面は無数の上陸艇によって灰白に染まり、空には爆音が響き渡った。ドイツ軍にとって、それは単なる防衛戦ではなく、運命との闘いであった。轟く砲火の下、ヨーロッパの命運はこの海岸で揺れ動き、ドイツ兵たちは西部戦線で最も長く、そして最も孤独な一日を迎えることとなった。

dialogue_4154=これは限定的な襲撃であり、最優先任務はシディ・バラニおよびその周辺のイタリア軍拠点を殲滅し、速やかにシディ・バラニ海岸を奪回・制圧することだ。
dialogue_4155=シディ・バラニを攻略し、英軍は多数のイタリア軍部隊を捕虜とした。
dialogue_4156=攻撃を続行せよ。イタリア・リビア軍集団が大規模に捕虜となり、敵の準備は不十分だろう。今こそ戦果をさらに拡大するのだ！
dialogue_4157=各軍団は海岸線を厳守せよ。キレナイカを決して失ってはならない。
dialogue_4158=英軍の攻勢があまりにも激しい。第10軍団をキレナイカに置き去りにするわけにはいかない。各部隊、整備を整え、キレナイカからの撤収準備をせよ。
dialogue_4159=あるいは、我々は砂漠を横断してバンガジー守備隊が西へ逃れるのを阻止できるかもしれない。
dialogue_4160=“狐”は開けた地で討たれた。
dialogue_4161=バンガジ部隊は壊滅した。全軍、全力を挙げてキレナイカを占領せよ。
dialogue_4162=西部砂漠の敵軍を撃破し、彼らをトブルクの西方へ押し返せ。
dialogue_4163=カプッツォ要塞を占領することに成功した。
dialogue_4164=ドイツ軍は「88ミリ砲」とハルファヤ峠の地形を活かし、英軍の攻勢を見事に食い止めた。
dialogue_4165=第15装甲師が迅速にカプッツォを支援し、第5軽師団は英軍の背後から迂回してハルファヤ隘路を援護した。
dialogue_4166=ドイツ軍が我々の退路を封鎖しようとしている。部隊を包囲させてはならない。前線に通告せよ：作戦目標を放棄し、速やかに撤退せよ。
dialogue_4167=英軍はハルファヤ峠の奪還に成功し、海岸道路の要衝を再びその手中に収めた。
dialogue_4168=よし、そのまま海岸道路に沿って前進せよ。
dialogue_4169=各部隊に通報せよ。作戦計画を調整する：ハルファヤ隘口への支援を停止し、隘口以西にいる敵部隊を全力で包囲殲滅せよ。
dialogue_4170=この戦いで我々は必ずドイツ軍を撃破し、トブルクの包囲を解かねばならない。
dialogue_4171=第7装甲師団に告ぐ、諸君の任務はシディ・レゼグ空港を奪取し、機を見てトブルクに向けて攻勢をかけることだ。
dialogue_4172=シディ・レゼグを奪取に成功し、トブルク守備隊は突囲の準備を。
dialogue_4173=トブルクへの直接攻撃計画を放棄し、包囲線を維持せよ。速やかにシディ・レゼグを奪還し、彼らに空爆で包囲を脅かされてはならない。
dialogue_4174=戦士たちよ、耐え抜くのだ！援軍が向かっている。ここで“狐”に血を流させるのだ！
dialogue_4175=英軍の攻撃部隊はあまりに多い。正面突破は困難、英軍の後方を攻撃して撤退を強いよ。
dialogue_4176=装甲部隊に告ぐ：南方の砂漠を迂回してエジプトへ回り込み、英軍の後方補給拠点を徹底的に破壊し、国境の堡塁を救出せよ。
dialogue_4177=機動部隊は迅速にシディ・レゼグを支援し、主力部隊は海岸沿いに全力でトブルクに向けて推進する。
dialogue_4178=バルディア部隊はトブルク方面へ撤退し、トブルク包囲線を強化せよ。
dialogue_4179=全軍、計画通り行動せよ：南部は陽動で敵の注意を引き、北部に戦力を集中して敵主力を殲滅するのだ。
dialogue_4180=私は欧州へ戻り静養する必要がある。敵は近く大規模な行動に出る可能性がある、必ず防御計画に則って厳格に行動するのだ。
dialogue_4181=伊独装甲軍の臨時指揮官が戦死した。ロンメル元帥は北アフリカへ戻り、再び軍の指揮を執る。
dialogue_4182=私は装甲軍の指揮権を再び手にした。装甲部隊を北方へ集中させ、失地奪回に備えよ！
dialogue_4183=南部防線を放棄し、秩序立てて北部海岸線へ撤退せよ。
dialogue_4184=第7装甲師団を北部へ転用し主攻に参加させよ。増圧作戦を開始する。
dialogue_4185=輸送タンカーが撃沈され、枢軸軍は燃料危機に陥った。
dialogue_4186=燃料補給の不足により部隊は甚大な損耗を被っている。撤退し、戦力を温存せねば。
dialogue_4187=攻撃を続行し、海岸平原に突入して敵の補給線を破壊せよ！
dialogue_4188=海岸平原は目前だ。短時間の休息を取り、海岸平原への攻撃に備えよ！
dialogue_4189=装甲部隊を出動させよ。海岸平原の補給線は絶対に確保せねばならない！
dialogue_4190=戦場は突如砂嵐に見舞われ、双方とも視界不良の窮地に陥った。
dialogue_4191=チュニジア情勢は不利に傾いた。チュニジアでの敗北がロンメルの威信を損ない、ひいては国民感情を動揺させるのを避けるため、ロンメルは北アフリカを離れる手配がなされた。
dialogue_4192=我々は残存するドイツ軍を代表して連合軍に降伏する。
dialogue_4193=ドイツ軍が崩壊した後、イタリアはメッセに対して降伏命令を発した。
dialogue_4194=我はイタリア第1軍を代表して連合軍に降伏する。
dialogue_4195=事前の空爆と海軍砲撃の抑えがなければ、ドイツ軍は我々の奇襲の時期を把握できない。出撃！奇襲でドイツ軍の防線を打ち破れ！
dialogue_4196=攻撃を中止せよ！貴様らを迎える準備は万全だ。
dialogue_4197=クラークの誤った企図により、上陸部隊は不利な状況に陥った。
dialogue_4198=くそっ！敵は今回の攻撃を予測していた。直ちに海軍へ通報し、砲撃で敵の反撃を抑えよ！
dialogue_4199=海軍砲撃の援護を得て、連合軍はサレルノに上陸することに成功した。
dialogue_4200=各部隊は山地防御に依拠し、敵の前進を足止めするのだ。
dialogue_4201=ナポリを放棄し、各部隊は冬季防衛線へ撤退せよ。

