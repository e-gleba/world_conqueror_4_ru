dialogue_2834=同志たちよ、クルジュを解放し、ドイツとハンガリーの連合軍をルーマニアから追い出せ！
dialogue_2835=デブレツェンに進軍し、敵を完全に壊滅させろ！
dialogue_2836=北東に進攻し、カリーニンを奪取せよ！モスクワとヤロスラブリの連絡をさらに断つことを目指せ。
dialogue_2837=同志コーネフが率いるカリーニン戦線は、ドイツ軍のカリーニン突破を阻止しなければならない！ モスクワは、支援のために最善を尽くす。
dialogue_2838=各部隊に注意せよ！全方位から積極的にドイツ軍を攻撃して戦力を消耗させ、敵の前進を阻止せよ！
dialogue_2839=敵の抵抗が非常に激しい！必ず戦線を維持し、後方が遮断されないように注意せよ。
dialogue_2840=モスクワは目の前だ。赤軍は疲弊している。敵の防線を突破し、モスクワに突入するのだ！
dialogue_2841=同志たちよ、敵がモジャイスク防衛線に迫っている。ここを守り抜かなければならない——我々の背後にはモスクワがある。
dialogue_2842=同志たちよ、敵の国土は目の前にある。復讐の時が来たのだ。 攻撃！ 敗北の屈辱を晴らし、戦死した者たちの霊に報いよ！
dialogue_2843=兵士たちよ、プロイセンの栄光のため、我々の故郷のために、最後の一瞬まで犠牲を恐れずに抵抗せよ！
dialogue_2844=全艦隊に告ぐ！日本の海上戦力を一掃し、上陸のためのスペースを提供する。フィリピンを落とせば、日本海軍はもはや脅威ではなくなる！
dialogue_2845=兵士たちよ、島に乗り込み、敵を殺し、雪辱を晴らせ！
dialogue_2846=諸君、どんな犠牲を払っても、我々はこの戦いに勝たなければならない！ フィリピンを失えば、海軍は二度と役に立たなくなる。
dialogue_2847=諸君、引き続き奮闘してくれ。我が部隊が敵を引き離す！
dialogue_2848=我々の物資は敵よりはるかに優れている！歩兵で道を切り開き、戦車で敵を撃破するのだ。この戦いに必ず勝つ！
dialogue_2849=私が戻るまで、地雷地帯を利用して防御してくれ。物資を節約して補給を待つのだ。
dialogue_2850=補給艦がもうすぐ到着する。装甲部隊は陣地奪還に備え、北に集中させよ！
dialogue_2851=朗報だ。イギリス空軍がトゥブルクの敵補給艦を破壊した！
dialogue_2852=補給不足による軍隊の損失はあまりにも大きい。もはや戦い続けることはできない。 全軍退却！
dialogue_2853=ギリシャ軍の装備は我々よりはるかに劣っている！ 兵士たちよ、イタリアの栄光を示し、ギリシャを占領せよ！
dialogue_2854=ギリシャ軍は非常に粘り強いが、我々を止めることはできない。
dialogue_2855=前線を守れ、敵に陣地を奪還させるな！
dialogue_2856=エンプレス・オーガスタ湾を手に入れ、死守するのだ！
dialogue_2857=日本軍の海上からの増援を阻止せよ！
dialogue_2858=南部の部隊が火力を引き付け、北部の部隊が主攻をかける。同志たちよ、キエフ解放の時が来た！
dialogue_2859=どんな犠牲を払ってでもキエフを守れ！戦線はこれ以上後退することは許されない！
dialogue_2860=キエフに閉じ込められるわけにはいかない、迅速に南西へ撤退せよ！
dialogue_2861=キエフは解放された。引き続きドイツ軍を追え！
dialogue_2862=反撃だ！敵軍の進撃を阻止せよ！
dialogue_2863=この作戦は3つの並行経路に分かれている。現地の守備軍は弱体だが、港が破壊されるのを防ぐためには迅速に動くことが重要だ。
dialogue_2864=イタリア王立海軍は現在タラントに停泊している。この機会を逃さず、必ずや奴らを壊滅させろ！
dialogue_2865=防空砲で反撃し、空襲を回避せよ！
dialogue_2866=海軍は陸軍の上陸を支援し、空港を必ず奪回せよ！
dialogue_2867=偵察機からの報告：日本軍がガダルカナル島に接近している。戦闘準備を整えよ！
dialogue_2868=日本の援軍が来た、油断するな！
dialogue_2869=南部の敵の防備が手薄だ。ここから迂回し、包囲部隊を引き付けて、トゥブルクを解放せよ！
dialogue_2870=トゥブルクを包囲している部隊は戦い続けろ。他の部隊は陣地を守り、補給を待て。
dialogue_2871=トゥブルクが制圧された、ここから全力で反撃だ！
dialogue_2872=攻撃を続け、ロストフを制圧せよ！
dialogue_2873=前進し、包囲の準備を整えよ。この戦いで、ドイツ第1装甲軍団を大きく打撃する！
dialogue_2874=部隊をここで壊滅するわけにはいかない。第1装甲軍団はロストフから撤退せよ。
dialogue_2875=同志たち、反撃の時が来た。攻撃だ、我々の陣地を取り戻せ！
dialogue_2876=防衛線を守れ、陣地を一つも放棄するな！
dialogue_2877=同志たちよ、彼らをドイツに引き渡し、レニングラードに危険をもたらすわけにはいかない。攻撃せよ！レニングラードが安全になるまで続けるのだ！
dialogue_2878=同胞の諸君、我々はフィンランドの独立と祖国の安全のために最後まで戦う！
dialogue_2879=ナロ＝フォミンスクの攻略に集中し、モスクワ方面への戦線を推進するのだ！
dialogue_2880=同志たちよ、私たちはこの防線を守り抜かなければならない。敵のモスクワ侵入を許すな！
dialogue_2881=砲兵の支援は整っている。同志たちよ、今こそカリーニンを奪回しよう！
dialogue_2882=各部隊注意：戦線を基にして河沿いに防御し、カリーニンを守り抜くのだ！

dialogue_3000=先頭部隊は敵の陸上増援を遮断し、スターリングラードの包囲を成功させた。
dialogue_3001=第三帝国の運命は私たちの手の中にある。我々は機械のように冷徹に敵を粉砕し、スターリングラードは我々の不滅の証人となるだろう！
dialogue_3002=ヴォルガ川を背にすれば、後戻りはできない！ 離反者は処刑され、生き残った兵士は特進の栄誉を授かるだろう！
dialogue_3003=たとえ私が前線を離れることになっても、心は常に諸君と共にある。逆境は我々の意志を試す試練に過ぎない。 それを乗り越えれば、勝利は我々のものだ。
dialogue_3004=私がここに来たのは撤退を援護するためではなく、敵を徹底的に打ち破るためだ。我々は、すべての街道、すべての工場、すべての廃墟で敵の攻撃を阻止する。
dialogue_3005=高空から見下ろせば、敵はただのチェスの駒に過ぎない。ひとたび降下すれば、それは敵に対する審判となる！
dialogue_3006=敵は自分たちが戦局を掌握していると思っているが、本当の力が迫っていることに気づいていない。反攻の嵐が奴らを完全に混乱に陥れるだろう。
dialogue_3007=敵は自分たちが揺るぎない存在だと思っているようだが、我々はその傲慢さを完全に打ち砕いた。カラチを制圧すれば、それは敵の悪夢の始まりとなるだろう。
dialogue_3008=敵の包囲は一時的なものに過ぎない。 増援部隊が到着すれば、敵の勝利の夢は完全に打ち砕かれるだろう。どんな犠牲を払ってでも、スターリングラードに向けて増援を送れ！
dialogue_3009=すべての一歩は勝利への道を整えるためであり、すべての一撃が敵に対する終焉の鐘を鳴らす。
dialogue_3010=戦場で私がすることはただ一つ——敵が息を引き取る瞬間を決めることだ。
dialogue_3011=軍人として、私は自分の義務を全うするために最善を尽くしたが、絶望的な状況の前では、我々に残された選択肢はほとんどない。
dialogue_3012=我が兵士たちを誇りに思う。彼らは最も厳しい条件下で比類なき勇気を示した。ここで犠牲となった兵士たちが安らかに眠れるように。
dialogue_3013=スターリングラードの一つ一つの石が、敵の墓石となる！
dialogue_3014=空から一羽の鷲が地に落ち、私の運命もここで終わる。たとえ倒れようとも、私は最後の光を燃やすだろう。
dialogue_3015=すべてが...終わったというのか？たとえこの銃弾が我が命を奪おうとも、我らの復讐の怒りは永遠に消えはしない。


