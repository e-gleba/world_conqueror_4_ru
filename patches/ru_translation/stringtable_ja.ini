event_4113=ラバウルの戦い

event_intro_4111=1942年12月31日、バレンツ海において、英軍護衛艦隊とドイツ海軍迎撃艦隊の間で海戦が勃発した。火力ではドイツ艦隊が優勢であったが、護衛艦隊は迅速な対応と的確な増援により、ソ連へ向かう輸送船団を見事に護り抜いた。ドイツ艦隊は一隻の輸送船も撃沈できず、この敗北は海軍総司令官レーダーの辞任へ直結し、後任としてデーニッツが就任した。これを機に、ドイツ海軍の戦略重点は潜水艦戦へと完全に移行することとなった。
event_intro_4112=ヴィスワ・オーデル攻勢は、ソ連赤軍が実施した大規模な戦略攻勢である。アルデンヌ方面で苦境に立つ西側連合軍に呼応するため、赤軍は当初の計画を8日前倒しし、1945年1月12日、ヴィスワ河沿いの橋頭堡から攻撃を開始した。ジューコフ及びコーネフ元帥の指揮下、二つの方面軍は圧倒的兵力でドイツ軍防衛線を突破し、ワルシャワやクラクフなどの都市を解放。戦線をドイツ本土深くへと押し進め、最終的なベルリン攻略へ至る決定的な基盤を築いた。
event_intro_4113=ラバウル戦役は、日本軍が南太平洋における戦略的要衝を掌握するために展開した重要な軍事行動。1942年1月初旬、日本軍の空母艦載機による空襲がラバウルに対して開始された。1月23日には日本軍地上部隊が順調に上陸し、迅速にラバウルを占領。その後、同地を堅固な海空の要塞とした。連合軍にとって、ラバウルの陥落はオーストラリアとの連絡線に直接の脅威をもたらすものであり、日本軍にとっては極めて重要な前進拠点の確保に成功したことを意味した。この拠点の獲得により、ソロモン諸島およびニューギニア方面への日本軍のさらなる行動が著しく容易となった。

dialogue_4253=潜水艦部隊が英国輸送船団の動向を捕捉した。
dialogue_4254=艦隊を二手に分け、英軍護衛艦を誘き寄せたのち、全力で輸送船団を殲滅せよ。
dialogue_4255=英軍艦艇が北西に展開するドイツ艦隊を発見。迎撃に向かうと同時に、護衛艦隊は煙幕を展開し、輸送船団を戦域から離脱させた。
dialogue_4256=ドイツ軍の兵力はもはや僅か、対して我々の援軍は尽きることがない。
dialogue_4257=ワルシャワ周辺の防衛線は突破され、ドイツ軍は総崩れとなっている。追撃を続けろ、全速前進！
dialogue_4258=クラクフのドイツ軍はすでに崩壊した。敵は陣地を放棄し、西へと撤退を始めている。
dialogue_4259=我々は圧倒的優勢を握っている。島にいる豪軍を逃がすな。退路を完全に封鎖せよ。
dialogue_4260=多数の日本軍上陸部隊を前に、オーストラリア守備隊は兵力が著しく不足しており、南へ撤退せざるを得なくなった。
dialogue_4261=通信効率が大幅に向上し、戦闘機は地上部隊の空襲要請により迅速に応じられるようになった。空の優勢を最大限に活かせ。今日は戦闘機のための一日だ。
dialogue_4262=戦況に誤差が生じたが、まだ挽回の余地はある。
dialogue_4263=最高総司令部から直命が下り、前進中止を命じられた。
dialogue_4264=後続の攻勢に備え、いくつかの「強行偵察」行動を先行して実施すべきだ。装甲部隊はそのまま前進を続けよ。
dialogue_4265=この……この空襲の規模ではドイツ軍の地上攻撃を阻止するには到底足りない。
dialogue_4266=この惨敗の原因は一体どこにあるのか？
dialogue_4267=アルフレートが戦死し、戦況は予想から大きく外れている。次こそは、もっと早く行動を掌握すべきかもしれない。
dialogue_4268=敗北はもはや覆らない。だがその代償は、必ずおまえたちに払わせる。
dialogue_4269=私は必ず戻る。
dialogue_4270=ロンメルの部隊は、すでに我々によって包囲されている。
dialogue_4271=軍人が祖国を守ろうとする決意を決して侮るな。撤退だ。
dialogue_4272=ドイツ軍はなおも無意味な抵抗を続けている。カーンを奪取し、敵の防衛線を完全に叩き潰せ。
dialogue_4273=君たちの意思は称賛に値する。
dialogue_4274=軍人の名誉のために、そしてドイツのために、我々は戦い続ける。
dialogue_4275=自分たちを救えるのは、私たち自身だけだ。国を救えるのも同じだ。
dialogue_4276=悪天候は双方にとって大きな障害だ。目標を達成するには、進撃の速度をさらに上げるしかない。
dialogue_4277=プロイセンの将軍に降伏など存在しない。
dialogue_4278=吹雪は止んだ。反撃は今からだ。
dialogue_4279=アルデンヌの森を刺すような冷気が貫く。ここで何度倒れたか、もう覚えていない。
dialogue_4280=愚かでありながら、同時に敬意に値する敵たちよ。お前たちの讃歌は勇気そのものだ。
dialogue_4281=黒蠍は太陽要塞での実験に成功した。
dialogue_4282=やり方が少々強引すぎるかもしれない。いずれ奴らにも知られるだろう。
dialogue_4283=そうかもな。だが、それでも私はアルフレートを信じる道を選ぶ。
dialogue_4284=我々はここで敵の戦力を削り、お前たちの時間を可能な限り稼いでみせる。
dialogue_4285=太陽要塞の記録によれば、南米にある三つのビーコン増幅器は、十回の実験サイクル後に調整が完了する。
dialogue_4286=結末は最初から知っていた。私は自分が辿るべき道を決めている。
dialogue_4287=最後に残ったビーコン増幅器の調整が完了した。影響を受けた者の自律的な意識は次第に抑制され、最終的には再び黒蠍に加わった。
dialogue_4288=我々はこの災禍を食い止めることには成功した。しかし、災いの根はまだ断たれていない。
dialogue_4289=部隊を立て直し、我々の要塞を奪い返すぞ。
dialogue_4290=黒蠍のメキシコにある遺跡「太陽要塞」は突破され、ビーコン増幅器は占領された。世界各地の秘密基地の所在がすべて露見し、黒蠍は戦略的次元において全面的に受動の立場に追い込まれた。
dialogue_4291=黒蠍のコロンビアにある遺跡「エコー堡塁」は突破され、ビーコン増幅器は占領された。遺跡内の各種施設はすでに自壊していた。しかし残されたアクセス記録によれば、当該施設の再起動時点は1933年とされていた。
dialogue_4292=黒蠍のブラジルにある遺跡「インカの眼」は突破され、ビーコン増幅器は占領された。多くの特殊兵器装備は移送も破壊も間に合わず、さらにはこれまで見たことのない新型軍備の設計図までもが残されていた。
dialogue_4293=黒蠍のブラジルにある遺跡「星軌神殿」は突破され、ビーコン増幅器は占領された。米ソは大量の暗号化資料を押収し、黒蠍の世界各地における人員名簿と軍事配備が完全に暴露された。
dialogue_4294=黒蠍の全ての遺跡施設は占領され、カウントダウンは停止した。黒蠍の南米における計画は完全に挫折した。
dialogue_4295=オズボーンは徹底的に撃破され、カウントダウンは停止した。黒蠍の南米における計画は完全に挫折した。


