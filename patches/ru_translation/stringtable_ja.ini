feat_desc_50_Lv3=敵複数部隊を攻撃、他の目標に対するダメージが減少せず、与えるダメージ+{2}%、会心ダメージ+{1}%
feat_desc_51_Lv3=このターンの攻撃射程+2、攻撃時に対象の都市または要塞のHPを{1}%減少（最大1200）、守備部隊のHPを{2}%（最大500）、クールダウン2ターン。
feat_desc_52_Lv3=陸軍や海軍の攻撃を受けた際、{0}%の確率でそのダメージを回避、1ターン継続、クールダウン2ターン。
feat_desc_53_Lv3=装甲・火砲ユニットに対するダメージ+{1}%、1ターン継続、クールダウン2ターン。
feat_desc_54_Lv3=火砲ユニットに対するダメージ+{1}%、1ターン継続、クールダウン2ターン。
feat_desc_55_Lv3=空軍ユニットの建造にかかる資金消費が{1}%減少
feat_desc_56_Lv3=攻撃時、{0}%の確率で敵ユニットの士気を低下させ、同確率で目標を着火状態にする。
feat_desc_57_Lv3=歩兵、装甲車、野戦砲、榴弾砲のいずれかを目標地点に空輸。輸送中にHP{1}%回復、防空兵器を無視する。
feat_desc_58_Lv3=全艦船への攻撃ダメージが{1}%増加
feat_desc_59_Lv3=要塞ユニットに対するダメージ+{1}%、陸上ユニットへのダメージ+{2}%
feat_desc_60_Lv3=2マス以内に最大2個の感応機雷を設置可能、クールダウン1ターン。
feat_desc_61_Lv3=次の攻撃で目標の1マス範囲内の敵2体に追加ダメージ、クールダウン2ターン。
feat_desc_62_Lv3=拘束・混乱状態の目標に対するダメージが200%増加する。発動時に周囲1マス以内の敵を士気無視の混乱状態に、1ターン継続、クールダウン3ターン。影響対象が2体以上の場合、クールダウン1ターン。
feat_desc_63_Lv4=城防へのダメージが{1}%増加
feat_desc_64_Lv3=クリティカル率が上限を超えた分は追加ダメージに転換される。{2}%ごとに{1}%の追加ダメージを与え、攻撃時に対象の防御を20%無視する。
