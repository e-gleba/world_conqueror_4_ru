skill_info_156=装甲部隊を指揮している際、士気は低下せず、ダメージ+[#00FF00#%d%%]。敵部隊を殲滅すると「英雄」状態を得る、クリティカルダメージの確率が10％上昇、1ターン継続。
skill_info_157=装甲部隊を指揮中、都市守備隊以外の非建築ユニットに対して与えるダメージ+20%%。攻撃後に攻撃および移動不可の場合、[#00FF00#%d%%]の確率で再攻撃できる（1ターンに1回のみ）。さらに、このターン内で敵を撃破するたびに確率が20%%ずつ上昇し（最大100%%）、効果が再行動に変化する。
skill_info_158=陸上部隊を指揮中、攻撃後に[#00FF00#%d%%]の確率で自分と周囲1マスの友軍に1ターン継続の「協調」状態を付与する。「協調」状態の部隊は与ダメージ+15%%、デバフ効果（士気低下による効果を除く）を受けた際に、それを無効化し「協調」を解除する。
skill_info_159=自領内では攻撃力+15、クリティカルダメージを受ける確率が[#00FF00#%d%%]低下。


