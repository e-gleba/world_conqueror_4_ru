conquest_event_desc_69=第二次世界大戦末期、ソ連は占領していたイラン北部から合意通りに撤退することができなかった。 国際的な外交圧力と交渉の末、ソ連は最終的に軍を撤退させ、イランの領土保全を保証した。 この危機は、中東における米ソ対立の始まりとなった。
conquest_event_desc_70=枢軸国軍の撤退により、ギリシャでは権力の空白が生じた。 内戦はギリシャの政府軍隊と民主的な力の間で、ギリシャの社会および多数の市民犠牲者を深く裂いた起因して起こった。 この内戦により、ギリシャは戦後西側陣営に加わり、北大西洋条約機構の加盟国となった。
conquest_event_desc_71=英海軍の駆逐艦2隻がクラジ海峡で不注意から機雷に衝突し、数十人の死傷者を出した。 その後、イギリス軍艦が海峡に派遣され、機雷除去作戦を行ったが、アルバニアはこれに強く抗議した。
conquest_event_desc_72=1952年、エジプト自由将校団がエジプト国王の君主制を打倒し、共和制を樹立した。 この出来事により、長らく続いた君主制に終止符が打たれ、エジプトの近代化が始まった。
conquest_event_desc_73=キューバ国内の革命運動は独裁政権を打倒し、社会主義国家を樹立することに成功した。 この革命により、キューバは冷戦期における世界政治の主要な焦点のひとつとなった。
conquest_event_desc_74=1956年、ハンガリーではソ連と自国の政権に反対する大規模な蜂起が起きたが、結局は軍によって鎮圧され、失敗に終わった。
conquest_event_desc_75=スエズ運河の支配権奪回を目指し、英仏などが共同でエジプトに軍事攻勢をかけた。 最初はうまくいったものの、イギリスとフランスはアメリカやソ連の強い反対と外交的圧力を受け、最終的には撤退を余儀なくされた。 この戦争は、世界の支配者としてのイギリスとフランスの終焉を意味した。
conquest_event_desc_76=ポルトガルの若い将校たちが軍事クーデターを起こし、ポルトガルの長年にわたる権威主義的な支配体制を打倒した。 革命が成功した後、ポルトガルはすぐに民主主義に転換し、アフリカとアジアの植民地を放棄し、数世紀にわたるポルトガルの植民地支配に終止符を打った。
conquest_event_desc_77=1961年、アメリカの支援を受けたキューバの亡命者たちがキューバに侵攻した。 しかし、キューバ南部のピッグス湾に上陸した侵略者たちは、キューバ軍によってすぐに敗北した。 この事件は米キューバ関係の緊張を高め、キューバ指導部の支配を確固たるものにした。
conquest_event_desc_78=アメリカがイタリアとトルコに弾道ミサイルを配備したことに対抗するため、ソ連はキューバに同様の弾道ミサイルを配備した。この措置により、米ソ間の緊張はかつてないほど高まり、核戦争の瀬戸際に立たされた。
conquest_event_desc_79=ソ連はアフガニスタンの反政府勢力を鎮圧するため、軍隊をアフガニスタンに送り込んだ。 この侵攻は多数の死傷者と難民の移住を招き、アフガニスタンに大きな破壊をもたらした。 その結果、ソ連は国際社会から強く非難された。
conquest_event_desc_80=1965年、ドミニカ共和国が第二のキューバになることを恐れたアメリカは、アメリカ国民の保護を口実に同国に軍隊を派遣した。 この動きは国際世論の強い非難を招き、北大西洋条約機構に加盟するいくつかの国も公に反対を表明した。
conquest_event_desc_81=イスラエルによるエジプト、シリア、ヨルダンのアラブ諸国に対する先制攻撃は、中東の地政学的状況を劇的に変化させた。 戦争の結果は、アラブ・イスラエル紛争の長期化と中東の継続的な不安定化を引き起こした。
conquest_event_desc_82=主権争いの結果、アルゼンチンはフォークランド諸島を占領し、イギリスは艦隊を派遣して反撃に出た。 この戦争で双方とも数百人の命を失い、政治、文化、経済、スポーツの分野で両国の敵対関係はさらに深まった。
conquest_event_desc_83=1972年、ウォーターゲイト・ビルに盗聴器を仕掛けていたアメリカ当局関係者が逮捕された。 捜査が深まるにつれ、政府による数々の違反行為や隠蔽工作が明らかになり、最終的にはアメリカ史上初のスキャンダルによる大統領辞任にまで発展した。
conquest_event_desc_84=正式には「欧州復興計画」と呼ばれ、第二次世界大戦後の戦禍に見舞われた西ヨーロッパ諸国に対し、アメリカ合衆国が経済援助と復興支援を行った歴史的なプログラムである。 この構想は、ヨーロッパ諸国の発展と世界経済の展望に多大な影響を与えた。
conquest_event_desc_85=米ソの戦略的対立は、双方が核兵器とミサイル技術で比較優位を保とうとする大規模な軍拡競争によって特徴づけられた。 双方は大規模な核兵器能力を保有することで、互いの軍事行動を抑止しようとした。
conquest_event_desc_86=ソ連の先進防空システムの脅威に対抗するため、アメリカは世界初の量産型ステルス戦闘機であるF-117「ナイトホーク」を成功裏に開発した。
conquest_event_desc_87=ソ連は世界初の大陸間弾道ミサイル（ICBM）の発射に成功した。この発射は、人類史上初めて人工物が宇宙への打ち上げに成功したことを示すものでもあった。 ICBMの出現は、冷戦時代の軍事戦略的状況を一変させた。
conquest_event_desc_88=第二次世界大戦後、米国が支援する南ベトナムと北ベトナムは絶えず対立し、やがて長く大規模なゲリラ戦に発展した。 この戦争はまた、米国内の社会的分裂と強力な反戦運動に火をつけた。
conquest_event_desc_89=1970年、中国は初の人工衛星の発射に成功し、1970年代の国防科学技術の分野で大きな功績を残した。 同時に、中国は自力で人工衛星を発射できる世界で5番目の国となった。
conquest_event_desc_90=中国は1964年、独自に開発した初の原子爆弾「ミス秋」の爆発に成功した。 この成果は、中国が世界で5番目に核兵器を保有する国となったことを示すとともに、国際政治と安全保障の舞台における中国の立場に大きな影響を与えた。
conquest_event_desc_91=1967年、中国初の水素爆弾の爆発が成功した。 これは中国にとって、最初の原子爆弾の成功に続く、国防研究の分野での新たな飛躍であった。 原爆の開発から水爆の開発まで、中国はわずか2年8カ月しかかからず、核兵器開発の歴史に奇跡をもたらした。
conquest_event_desc_92=1984年、ロサンゼルスは民間方式でオリンピックを開催し、前回のオリンピックで発生した巨額の損失を覆した。この大会の投資成功は、後のオリンピックの模範となった。中国はこの大会で初めて金メダルを獲得した。
conquest_event_desc_93=韓国の軍事政権指導部による民主化活動への厳しい弾圧が、光州地域での大規模な抗議活動を引き起こし、多数の市民や学生の死傷者を出した。 この事件は、ドイツ人ジャーナリストが撮影したビデオ映像によって広く知られることになった。
conquest_event_desc_94=1964年、日本は東京オリンピックの開幕に先立ち、東京と大阪を結ぶ東海道新幹線を正式に開通させた。この鉄道は、世界初の商業運行される高速鉄道システムとなった。
conquest_event_desc_95=1946年、米国は世界初の大型電子デジタル・コンピュータENIACの開発に成功した。それ以来数十年間、コンピュータ技術は驚異的なスピードで発展し、科学、産業、日常生活に多大な影響を及ぼしてきた。
conquest_event_desc_96=東ヨーロッパが劇的に変化した後、国内外からの圧力を受けた東ドイツ政府は、国境を開放し、人々がベルリンの壁を自由に越えられるようにすると発表した。 この出来事は、ヨーロッパと世界の政治情勢に大きな影響を与えた。

