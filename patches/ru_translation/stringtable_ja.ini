event_stage_intro_20201=連合国の包囲網が我々の経済と戦略的資源を完全に封鎖しています。これが長続きすれば、帝国はアメリカに消耗戦で敗北してしまうでしょう。戦争が避けられないというなら、先制攻撃を行う他ありません。太平洋艦隊の主力を真珠湾での空襲で壊滅させましょう。
event_stage_intro_20202="Z作戦" の成功により南方作戦の障害は取り除かれました。しかし、イギリス軍は新たにシンガポールの守備隊に増援艦隊を派遣しています。敵の数は多いですが、部隊の機動性は我々に比べてはるかに劣ります。マレーシアのイギリス軍に対して挟撃作戦を実行し、できるだけ速くシンガポールを占拠しましょう。
event_stage_intro_20203=フィリピンにいるアメリカ軍は訓練不足で、武器装備も不十分です。多数の場所から上陸作戦を実施し、敵を南北に分散させます。航空艦隊が上陸作戦を支援してくれます。
event_stage_intro_20204=東インド諸島は非常に豊富な資源を持っており、連合国の連合艦隊がここに増援を集結させています。異なる国に所属しているため、調整効率が低く統一指揮が不足しています。上陸作戦の成功を優先し、その後ジャワ海域の艦隊を解決しましょう。
event_stage_intro_20205=連合国の艦隊は南太平洋で次々に敗退し、ポートモレスビーを反撃の拠点として兵力を絶えず集結させています。敵軍の警戒が不足している隙をついてMO作戦を発動させ、連合国に反撃の機会を与えないようにしてください。
event_stage_intro_20206=アメリカ軍は珊瑚海での我々の攻撃を阻止し、海上の防衛を強化しています。当面の目標はモレスビーの奪取です。防御が薄いニューブリテンを占領し、ラエ方面へ進軍して、そこから最終的な陸上攻撃を開始しましょう。
event_stage_intro_20207=太平洋防衛サークルがついに完成し、アメリカ軍は本土への後退を余儀なくされています。しかし情報によると、敵国は核兵器の研究開発で重大な突破を達成したとのことです。実戦が始まると、戦局が逆転する可能性が非常に高く、我々に残された時間はわずかです。
event_stage_intro_20211=連合国の包囲網が我々の経済と戦略的資源を完全に封鎖しています。これが長続きすれば、帝国はアメリカに消耗戦で敗北してしまうでしょう。戦争が避けられないというなら、先制攻撃を行う他ありません。太平洋艦隊の主力を真珠湾での空襲で壊滅させましょう。
event_stage_intro_20212="Z作戦" の成功により南方作戦の障害は取り除かれました。しかし、イギリス軍は新たにシンガポールの守備隊に増援艦隊を派遣しています。敵の数は多いですが、部隊の機動性は我々に比べてはるかに劣ります。マレーシアのイギリス軍に対して挟撃作戦を実行し、できるだけ速くシンガポールを占拠しましょう。
event_stage_intro_20213=フィリピンにいるアメリカ軍は訓練不足で、武器装備も不十分です。多数の場所から上陸作戦を実施し、敵を南北に分散させます。航空艦隊が上陸作戦を支援してくれます。
event_stage_intro_20214=東インド諸島は非常に豊富な資源を持っており、連合国の連合艦隊がここに増援を集結させています。異なる国に所属しているため、調整効率が低く統一指揮が不足しています。上陸作戦の成功を優先し、その後ジャワ海域の艦隊を解決しましょう。
event_stage_intro_20215=連合国の艦隊は南太平洋で次々に敗退し、ポートモレスビーを反撃の拠点として兵力を絶えず集結させています。敵軍の警戒が不足している隙をついてMO作戦を発動させ、連合国に反撃の機会を与えないようにしてください。
event_stage_intro_20216=アメリカ軍は珊瑚海での我々の攻撃を阻止し、海上の防衛を強化しています。当面の目標はモレスビーの奪取です。防御が薄いニューブリテンを占領し、ラエ方面へ進軍して、そこから最終的な陸上攻撃を開始しましょう。
event_stage_intro_20217=太平洋防衛サークルがついに完成し、アメリカ軍は本土への後退を余儀なくされています。しかし情報によると、敵国は核兵器の研究開発で重大な突破を達成したとのことです。実戦が始まると、戦局が逆転する可能性が非常に高く、我々に残された時間はわずかです。

dialogue_2462=第一波攻撃は成功です！しかし、港湾で敵空母を見つけられませんでした。
dialogue_2463=敵空母を発見！我が艦隊は第三波攻撃を発動し、彼らを全力で壊滅させます！
dialogue_2464=敵戦艦を撃沈し、敵海軍を完全に麻痺させ、南方作戦がスムーズに進行することを確保します。
dialogue_2465=空母群が帰港中です！速く防御を組織し、反撃の準備を随時整えてください。
dialogue_2466=ここからは反撃です！必ず日本軍に第三波攻撃の代償を払わせましょう。
dialogue_2467=最初の二波の攻撃は米軍基地内に大きな被害を与えましたが、我々も一定の損害を受けました。
dialogue_2468=日本軍はマレー半島北部での集結を完了しました。敵軍の南下を遅らせるため、援軍の到着まで時間を稼がなければなりません。
dialogue_2469=航空攻撃の効果があり、プリンス・オブ・ウェールズにもはや逃げ場なし！全速前進！
dialogue_2470=プリンス・オブ・ウェールズが撃沈されました！残りの英国海軍を壊滅させ、マラヤ周辺の海域を制圧しましょう。
dialogue_2471=英国人を捕虜にしている時間などありません。今は攻勢を加速させ、敵に防衛態勢を整える時間を与えないようにしなければ。
dialogue_2472=日本軍の進軍速度を甘く見ていました。シンガポール北部の防衛線が、我々の最後の防壁となるでしょう。
dialogue_2473=シンガポールはすぐそこです。周辺海域を封鎖し敵の退路を断ち切り、陸軍部隊により敵に最後の一撃を与えましょう。
dialogue_2474=シンガポールは陥落しました、我々の敗北です。
dialogue_2475=偵察機が周辺海域で大規模な敵軍艦隊を発見しました。私が英軍進攻を足止めしている隙に、速やかに敵艦隊の退路を断ってください。
dialogue_2476=陸軍部隊はルソン西岸とマニラ東南海域で上陸作戦を開始します。私の航空艦隊は海上の障害を排除します。
dialogue_2477=日本軍は複数の地で上陸作戦を展開しています。私はマニラ北部を守りますので、速やかにルソン北部の友軍を支援するための予備隊を召集してください。
dialogue_2478=日本軍の攻勢が激しいため、今はマニラ方向に撤退し、防衛ラインを再編成するほかないでしょう。
dialogue_2479=マニラ北部の防衛ラインはもうすぐ突破されるでしょう。先ほど大統領の命令を受けました。バターンに撤退しましょう。
dialogue_2480=バターンを離れるが、いずれ必ず戻ってくる。
dialogue_2481=マッカーサーが撤退しました。残りのアメリカ軍も砂のように脆弱でしょう。
dialogue_2482=ラモン湾の部隊は上陸を完了し、マニラ南部から協力攻撃を開始します。
dialogue_2483=私はできる限り速やかに上陸を完了し、バリクパパンを占拠します。我が部隊を支援してボルネオの連合軍を掃討してください。
dialogue_2484=艦隊を迅速に集結し、日本軍がジャワ海に侵入する前に彼らを阻止してください。
dialogue_2485=アメリカ、イギリス、オランダ、オーストラリアの連合艦隊がジャワ海で集結しています。これは連合軍の海上戦力を壊滅させる絶好の機会です。
dialogue_2486=オランダ軍のボルネオ島における防衛線を壊滅させました。ジャワ海での敵艦の排除と共に、スラバヤとジャカルタへの攻撃を開始しましょう。
dialogue_2487=ボルネオ島の守備隊は次第に撤退しており、今やジャワ海はスマトラ島とジャワ島を守る最後の防衛線です。
dialogue_2488=連合艦隊の主力は撃沈され、残された船舶も脅威には及びません。速やかに排除し、海上上陸の障害を取り除いてください。
dialogue_2489=連合軍の敗北は確定となりました。東インド諸島の資源開発に備えてください。
dialogue_2490=日本軍の最終目標はポート・モレスビーです。珊瑚海で敵を阻止し、日本の艦隊のさらなる侵入を阻止しましょう。
dialogue_2491=アメリカ軍に動きを察知されました。珊瑚海での決戦に向けて、連合艦隊を即座に結集し備えてください。
dialogue_2492=ソロモン諸島は我々の支配下にあります。ガダルカナル島の空港を拠点として航空支援を提供してください。
dialogue_2493=機動部隊艦隊が到着しました。現存戦力を統合し、反撃に備えてください。
dialogue_2494=アメリカ軍は警戒態勢に入っています。敵援軍による奇襲に注意してください。
dialogue_2495=全力前進！引き続き戦果を拡大せよ！
dialogue_2496=日本軍の艦隊が速すぎます！残された選択肢は撤退のみです。
dialogue_2497=敵の進攻を止めることができませんでした。今は撤退するほかありません。
dialogue_2498=ラバウルは陥落しました。日本軍の行動がニューブリテン島に影響を及ぼし、ニューギニア、さらにはオーストラリア本土にまで脅威をもたらす可能性があります。
dialogue_2499=島の守備隊は崩壊し始めています。私はこれよりラエの東海域を封鎖し、連合軍の撤退ルートを切ります。
dialogue_2500=敵海軍がニューブリテン全域を包囲しています！ニューブリテン守備隊の撤退を確実にするために、さらなる援軍が必要です。
dialogue_2501=ニューギニアでの拠点を築きました。次の主要目標はココダ・トラックを制圧することです。
dialogue_2502=ココダ・トラック周辺の地形は複雑で、進軍は困難です。急がず慎重に進むべきです。
dialogue_2503=ニューブリテン南部海域の制圧を失いつつあります。東海岸の防衛を強化し、日本軍に侵攻を与えないよう注意してください。
dialogue_2504=日本軍はすでにココダを占拠し、ポート・モレスビーに向かっています。
dialogue_2505=陣地を守り、敵の攻勢の足止めをしてください。援軍がすぐに到着します！
dialogue_2506=敵の核兵器の開発が完成間近です。アメリカの強力な工業力を考えれば、量産が始まれば現在の世界秩序に大きな変化をもたらす可能性が極めて高いでしょう。
dialogue_2507=各艦隊は陸軍の上陸作戦を支援し、優先的に海上防衛ライン上の敵軍の防御陣地を排除してください。
dialogue_2508=日本軍の上陸部隊がバンクーバー西岸に現れました。追加の増援が必要です。
dialogue_2509=ロサンゼルスも攻撃を受けています、すぐに増援に向かうため出発してください。
dialogue_2510=カリフォルニアでの日本軍の上陸阻止には成功しました。しかし、引き続き敵の後続増援に注意してください。
dialogue_2511=防御だけでは消耗戦で敗北します。私は装甲部隊で一度奇襲を仕掛け、核兵器の研究に時間を稼ぎます。
dialogue_2512=実験爆発は成功しましたが、大量生産は短期間では難しいです。
dialogue_2513=西海岸の陸軍を阻止し、研究成果を守りましょう。

dialogue_2514=枢軸国はもはや逃げ場がありません、チュニジアに向けて進軍し、彼らをアフリカ大陸から駆逐しましょう！
dialogue_2515=第2軍団の作戦が失敗しました、無謀に進攻して敵の罠にはまらないよう注意してください。
dialogue_2516=ドイツ軍の正面防御は非常に堅固です、海上の兵力を活用し、突破口を見つけてください。イギリス兵も協力してくれます。
dialogue_2517=敵の海岸線の突破口を見つけ、一気に上陸しましょう。
dialogue_2518=ドイツ軍はイタリア本土に撤退しようとしています、それを許してはいけません！
dialogue_2519=兵士たちよ、前例のない規模の上陸作戦がまもなく始まる。無限の栄光が君たちを迎えるだろう。
dialogue_2520=連合軍がなぜここに？くそっ、情報が誤っていたようだ。敵軍の迎撃に備えよ！
dialogue_2521=敵軍の海岸部隊は薄弱です。今すぐ上陸し、橋頭堡を築いてヨーロッパ大陸への戦線を開きましょう。
dialogue_2522=連合軍が上陸しないように、全軍を結集し、やつらを海上で迎撃しましょう！
dialogue_2523=敵軍の海岸防衛線は非常に堅固です。空軍の機動力を活かし、地上部隊と協力して要塞を占拠しましょう。
dialogue_2524=リヨンを占拠すれば、我々はこの戦闘で勝利を収めることになります。
dialogue_2525=ルールはドイツの西部工業地帯で、これを制圧すればこの戦争で計り知れない優位性を得られます。
dialogue_2526=南北から敵の背後に回り込み、敵の退路を断ち切りましょう。包囲網が完成すれば、ルールを容易に制圧し、ドイツ軍を捕虜にできるでしょう。
dialogue_2527=我々は南部のアメリカ軍と協力して挟撃攻撃を実行します。
dialogue_2528=今です！包囲網を畳んでください、敵は袋の鼠です。
dialogue_2529=司令官、我々に前進を命じ、半島西部に駐留するソ連勢力を排除させてください。
dialogue_2530=セバストポリ要塞以外、クリミア半島全域が我々の手中にあります。油断せず、最後の領土まで攻略しましょう。
dialogue_2531=敵の海上補給線は遮断され、この消耗戦で優位に立つことができました。
dialogue_2532=グスタフの砲火で道を切り開け！
dialogue_2533=最高司令部はレニングラードを占拠する決意をしました。これは激しい戦闘になるでしょう。フィンランドの軍隊も北からの支援に参加します。
dialogue_2534=リスクを冒してでも兵力を引き抜き、敵の湖上補給線を優先的に断たなければなりません。それが戦局を直接左右します。
dialogue_2535=東方に進軍し、敵の兵力を引きつけ、第6軍団が突破する時間を稼ぎましょう。
dialogue_2536=総攻撃を仕掛け、スターリングラードを制圧せよ、勝利の兆しは目前だ！
dialogue_2537=ハリコフを奪回するためなら、いかなる代償も惜しまない。
dialogue_2538=敵の前衛部隊が前進しすぎています、包囲する絶好の機会です。
dialogue_2539=機甲部隊の機動力を活かしてソ連軍の側面を攻撃し、敵の補給線を切断しましょう。
dialogue_2540=司令官、南からの進撃を率いてください。計画通り、北方の友軍と共にクルスクを挟撃しましょう。
dialogue_2541=敵の抵抗がますます激しくなっている、兵士たちよ、気を緩めるな。
dialogue_2542=北方の連合軍が我々の支援を必要としています。彼らを失えば、クルスクに対する牽制力も失ってしまうでしょう。

