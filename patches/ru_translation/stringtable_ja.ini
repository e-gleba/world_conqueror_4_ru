feat_desc_53=機甲部隊と砲兵部隊に与えるダメージが{1}%増加する。1ラウンド継続。クールダウン2ターン
feat_desc_54=砲兵に与えるダメージが{1}%増加する。1ラウンド継続。クールダウン2ターン
feat_desc_55=空軍ユニットでの攻撃にかかる費用が{1}%減少する。
feat_desc_56={0}%の確率で敵の士気を下げ、同確率で攻撃時に対象を発火させる。
feat_desc_57=歩兵、機甲部隊、野戦砲及び曲射砲を目標地点まで輸送する。
feat_desc_58=輸送船への攻撃時にダメージが{1}%増加する。
feat_desc_58_Lv2=船への攻撃時にダメージが{1}%増加する。
feat_desc_59=要塞への与ダメージが{1}%増加し、陸軍への与ダメージが{2}%増加する。
feat_desc_60=自軍の周囲1マスに高級機雷を敷設する。クールダウン1ターン
feat_desc_61=次の攻撃時に、目標とした部隊の1マス以内の敵1体に追加攻撃を与えることができ、2体目の敵に与えるダメージは50%減少する。クールダウン2ターン


