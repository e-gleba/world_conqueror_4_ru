skill_info_152=空中停止状態のユニットを指揮する時、回避率[#00FF00#%d%%]上昇、行動力4上昇。空軍からのダメージを30%%軽減。空中停止状態のユニットが攻撃する時、回避率が1%%アップするごとに会心の一撃ダメージが1%%アップする。
skill_info_153=空軍（空挺部隊を除く）とミサイルを指揮する際に資源消費を20%%削減。空軍とミサイル攻撃を指揮した後、「梯次攻勢」を獲得する。空軍やミサイルで攻撃する際、敵の防御を[#00FF00#%d%%]無視し、最終防御力が20未満の敵には必ず会心の一撃を与える（核兵器には無効）。ターン終了時に効果が解除される。
skill_info_154=指揮する部隊の周囲1マス以内に敵軍がいない場合、経済および工業収入+[#00FF00#%d]
skill_info_155=部隊を指揮して攻撃した後、対象およびその周囲1マス以内の敵軍2体に[#00FF00#%d%%]の確率で「疲労」状態を付与、1ターン継続。「疲労」状態の部隊は攻撃や空襲を受けた際、HPがさらに6%%減少し士気も低下する。すでに士気が崩壊している部隊には効果がない。

army_buff_desc_1461=梯次攻勢：空軍およびミサイル攻撃を指揮する際に、敵の防御を15%無視し、最終防御力が20未満の敵には必ずクリティカルを与える。
army_buff_desc_1462=梯次攻勢：空軍およびミサイル攻撃を指揮する際に、敵の防御を30%無視し、最終防御力が20未満の敵には必ずクリティカルを与える。
army_buff_desc_1463=梯次攻勢：空軍およびミサイル攻撃を指揮する際に、敵の防御を45%無視し、最終防御力が20未満の敵には必ずクリティカルを与える。
army_buff_desc_1464=梯次攻勢：空軍およびミサイル攻撃を指揮する際に、敵の防御を60%無視し、最終防御力が20未満の敵には必ずクリティカルを与える。
army_buff_desc_1465=梯次攻勢：空軍およびミサイル攻撃を指揮する際に、敵の防御を75%無視し、最終防御力が20未満の敵には必ずクリティカルを与える。
army_buff_desc_1471=疲労：攻撃や空襲を受けた際に追加でHPが6%減少し、士気も低下する。士気が混乱している部隊には疲労効果は発動しない。

