conquest_event_desc_97=黒蠍組織は、その巨大なスパイネットワークと高度な政治操作を駆使し、綿密な計画を実行。北大西洋条約機構とワルシャワ条約機構を巧妙に誘導することで、世界規模での代理戦争や地域紛争を引き起こすことに成功した。これにより、世界は再び陣営を再編することを余儀なくされ、新たな対立構造が形成された。この動きは、世界を和解不可能な対立と軍拡競争の渦へと引き込んでいく結果となった。
conquest_event_desc_98=アジア太平洋の黒蠍は、「ポセイドンの怒り」と名付けられた作戦を開始した。この作戦では、潜水艦による奇襲、ドローンの攻撃、そして特殊部隊の上陸を組み合わせた多方面の協同作戦が展開された。結果として、アメリカ太平洋艦隊を完全に麻痺させ、真珠湾の占領に成功した。この勝利は、アジア太平洋地域へのさらなる浸透と影響力拡大に有利な条件をもたらした。
conquest_event_desc_99=アジア太平洋の黒蠍は密かに北ベトナム軍を支援し、先進的な宇宙技術による兵器を提供した。この支援により、北ベトナム軍はアメリカ軍を撃退することに成功し、戦場の勢力図を大きく塗り替えた。その結果、状況は予測不可能な方向へと進展していった。
conquest_event_desc_100=アジア太平洋の黒蠍は、マリアナ海溝付近に極秘の深海実験施設を建設した。この施設は、宇宙技術を用いた兵器が極限の深海圧力下でどのように性能を発揮するかをテストするために使用されている。この動きは、アジア太平洋諸国の警戒を招く結果となった。
conquest_event_desc_101=アジア太平洋の黒蠍は、オーストラリアのエネルギー産業に深く浸透し、石炭鉱山の生産や港湾輸送ネットワークを正確に妨害した。この戦略により、主要な輸出ルートを断ち切り、政府に妥協を強いることで、地元のエネルギー企業に対する完全な支配を実現した。
conquest_event_desc_102=アジア太平洋の黒蠍は現地の過激派を支援し、世論を操作して暴力的な衝突を引き起こすことにより、光州事件の発生を誘発した。この混乱の中で、黒蠍は韓国軍に巧みに浸透、大統領は戒厳令を発布。政府の暴力を用いて市民を弾圧することで、政治的な混乱と社会の分裂をさらに深刻化させた。
conquest_event_desc_103=アジア太平洋の黒蠍は、フィリピン南部の島々をテロ攻撃によって掌握し、それを東南アジアの重要な拠点に変えた。この行動により、マラッカ海峡の貿易航路に脅威を与えている。
conquest_event_desc_104=アジア太平洋の黒蠍は太平洋全域の海上貿易を掌握し、その勢力を拡大させた結果、黒蠍組織内で最強の派閥となった。この動きは他の黒蠍勢力の不満を引き起こし、彼らは結束して反撃を開始。これにより、黒蠍内部で激しい派閥争いが勃発した。
conquest_event_desc_105=中東の黒蠍は現地の組織を密かに操り、複数の石油精製所を爆破することに成功し、深刻なエネルギー危機を引き起こした。
conquest_event_desc_106=中東の黒蠍はスエズ運河で精密な爆破を実行し、複数の貨物船を沈めて運河を完全封鎖した。この結果、英仏が支配する海上貿易ルートが寸断され、両国は航行権を取り戻すために譲歩を余儀なくされた。
conquest_event_desc_107=中東の黒蠍はアフガニスタンの山岳地帯に秘密のハイテク基地を設立し、複雑な地形における宇宙兵器の影響をテストしていた。これに対しソ連軍が攻撃を仕掛けたが、黒蠍はこれを成功裏に撃退した。
conquest_event_desc_108=中東の黒蠍は、サウジアラビアの一部の砂漠地帯を居住可能な「オアシス都市」に改造する計画を進めている。このプロジェクトにより、さらなる勢力が黒蠍の資源と技術に依存するようになることを狙っている。
conquest_event_desc_109=中東の黒蠍は世界の石油資源を独占し、「石油同盟」の設立を宣言した。この同盟を通じてエネルギー供給を断つことで他の勢力を脅かそうとしたが、この行動は他の黒蠍派閥の不満を招いた。結果として、彼らは結束して反撃を開始し、黒蠍内部で激しい派閥争いが勃発した。
conquest_event_desc_110=ヨーロッパの黒蠍は東ドイツに秘密裏に浸透し、現地住民を扇動して「ヨーロッパ自由軍」を結成させた。この動きにより、黒蠍の軍事産業に新たな突破口を開き、その勢力を徐々にヨーロッパ大陸全域へと拡大していった。
conquest_event_desc_111=ヨーロッパの黒蠍は、東欧の重要な鉄道拠点で連続爆破を計画し、ソ連による交通と物資の統制を麻痺させた。この混乱を利用して勢力を全面的に浸透させ、東欧支配への足掛かりを築いた。
conquest_event_desc_112=ヨーロッパの黒蠍は、その広範なスパイネットワークと情報操作能力を駆使して、イギリス軍艦の航路を正確に計算。海峡に機雷を配置し、この作戦によりイギリス海軍の駆逐艦2隻がコルフ海峡で触雷した。
conquest_event_desc_113=ヨーロッパの黒蠍はチェコの改革派を装い、「プラハの春」の抗議活動を秘密裏に推進。混乱を引き起こすことで、ソ連の東欧支配と影響力を弱体化させることを狙った。
conquest_event_desc_114=ヨーロッパの黒蠍は精鋭の潜水部隊を派遣し、北海油田に潜入。重要な設備を掌握し、英国とノルウェーのエネルギー供給を断絶した。この行動を通じてエネルギー危機を引き起こし、両国の経済と戦略的影響力を弱体化させようとした。
conquest_event_desc_115=ヨーロッパの黒蠍はイタリアの複数のマフィア組織と秘密裏に接触し、金銭、武器、情報の取引を通じて関係を構築。その結果、ヨーロッパ内での浸透力を拡大した。
conquest_event_desc_116=ヨーロッパの黒蠍は高性能の衛星群を極秘裏に発射し、軍事通信、ナビゲーション、気象システムを含む全球衛星通信システムを掌握。この行動は他の黒蠍派閥の不満を招き、彼らの連携による反撃を引き起こし、組織内部で激しい争いが勃発した。
conquest_event_desc_117=アメリカの黒蠍はウォーターゲート・ビルに潜入し、精密な盗聴を通じて機密情報を取得。この結果、世論の圧力で大統領が辞任する事態を招いた。この政治的混乱は、黒蠍がアメリカ大陸での軍事拡張と浸透を加速させる契機となった。
conquest_event_desc_118=アメリカの黒蠍は、南太平洋の「ポイント・ネモ」に秘密の海上技術開発基地を設立。隠密なプロジェクトを通じて、この遠隔地を世界で最も戦略的に重要な海上研究センターへと変貌させた。
conquest_event_desc_119=アメリカの黒蠍は、キューバ亡命者を操りアメリカに虚偽の情報を提供することで、綿密に計画されたピッグス湾事件を引き起こした。この行動で米国とキューバの対立を煽り、冷戦の緊張をさらに激化させると同時に、世界の経済と資源の支配から莫大な利益を得た。
conquest_event_desc_120=アメリカの黒蠍は秘密ルートを通じてキューバ政府と協定を結び、島内に隠密なミサイル発射システムを構築するのを支援した。この行動の目的は、キューバに高度なミサイル施設を配備することで、アメリカおよびラテンアメリカ地域の安全を脅かすことだった。
conquest_event_desc_121=アメリカの黒蠍はアルゼンチン政府に浸透し、軍事支援を提供することで、誤った判断を促し、フォークランド諸島への攻撃を引き起こした。この作戦は、イギリスの遠洋攻撃能力を試す目的も兼ねていた。
conquest_event_desc_122=アメリカの黒蠍はアマゾン熱帯雨林に秘密の研究基地を設立し、宇宙技術を活用した実験を行い、小型核反応装置の開発を進めた。
conquest_event_desc_123=アメリカの黒蠍は、ブラジルとアルゼンチンの金融市場を秘密裏に操り、大規模な資本移動、虚偽情報の拡散、通貨操作を行った。これにより市場の混乱を引き起こし、現地通貨の急激な下落を誘発した。
conquest_event_desc_124=アメリカの黒蠍は、精密な金融操作と経済的脅迫を駆使し、世界主要国に高額な金融課税を強制。これにより世界経済を掌握した。この行動は他の黒蠍派閥の不満を招き、彼らの連携による反撃を引き起こし、組織内で激しい争いが勃発した。
conquest_event_desc_125=アフリカの黒蠍は、コンゴ鉱山地域の武装勢力を密かに支援し、豊富なウラン鉱石と銅鉱石の資源を掌握した。これにより、宇宙技術の研究に必要な重要な原材料を確保した。
conquest_event_desc_126=アフリカの黒蠍は東アフリカの軍事指導者を支援してクーデターを実行し、紅海の貿易ルートの支配権を獲得した。この行動はイギリスとエジプトが築いてきた紅海地域の安定を破壊し、地域の地政学的勢力図を再編した。
conquest_event_desc_127=アフリカの黒蠍は、ナイル川流域の水資源を秘密裏に操作し、この地域の水源支配権を徐々に確立させた。その結果、北アフリカ諸国は深刻な水不足と農業崩壊に直面し、社会的不安がさらに悪化した。
conquest_event_desc_128=アフリカの黒蠍は、ナミビアのナミブ砂漠の奥深くに秘密のハイテク研究基地を設立。ここで宇宙エネルギー技術と核融合技術を組み合わせた実験を専門的に行っている。
conquest_event_desc_129=アフリカの黒蠍は、砂粒を高純度のシリコン材料に変換する技術を開発し、超低コストで高性能の半導体とチップを製造。この成果により、チップ供給を完全に独占した。この行動は他の黒蠍派閥の不満を招き、彼らの連携による反撃を引き起こし、組織内で激しい争いが勃発した。

