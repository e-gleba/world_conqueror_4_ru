legend_intro_40101=イギリス第7装甲師団は、エジプト駐屯の機動部隊を基に改編され、駐屯地で飼われていた跳ねネズミを象徴として「砂漠のネズミ」と呼ばれるようになった。1940年12月、ウェーベル将軍によるコンパス作戦では、装甲部隊としての高い機動力を発揮し、攻撃の主力としてバルディアやトブルクなどの要地を次々と攻略した。さらに、大胆な砂漠縦断によってベンガジから撤退するイタリア軍団を包囲・撃破し、多数の捕虜を得るなど、目覚ましい戦果を上げた。この戦いで第7装甲師団はキレナイカ全域を縦横に駆け抜け、その名「砂漠のネズミ」は北アフリカ戦線に轟き渡った。
legend_intro_40102=1941年、ロンメル率いるアフリカ軍団に包囲されたトブルクを救出するため、イギリス軍は「バトルアクス作戦」を発動した。この戦いで第7装甲師団は攻撃の矛先として高い機動力と突撃力を発揮し、カプッツォ要塞を攻略、一時はドイツ軍防衛線を突破することに成功した。しかし、友軍の攻撃が頓挫し、ドイツ軍の激しい反撃に遭ったため、最終的に戦況を覆すには至らなかった。それでも第7装甲師団は逆境の中で秩序ある撤退を実現し、主力を温存して北アフリカ戦線における後の反攻へとつながる重要な戦力を維持した。
legend_intro_40103=経験と教訓を踏まえ、1941年11月18日、新任の中東方面総司令オーキンレックは「クルセーダー作戦」を立案した。目標は、トブルクを包囲するドイツ装甲部隊を一挙に殲滅し、トブルクを解放することであった。第7装甲師団は攻撃の主力としてシディ・レゼグへ迅速に進撃した。ロンメルは包囲網の突破を阻止するため、装甲部隊を集結させてシディ・レゼグに対し猛烈な反撃を行った。包囲の危機に直面しながらも、第7装甲師団は卓越した粘り強さと戦闘力を発揮し、ドイツ軍の攻撃を食い止めると同時に、砂漠地帯で果敢な機動戦を展開して敵の指揮・補給線を打撃した。この戦いでの奮闘は、連合軍の勝利の礎を築く重要な一歩となった。
legend_intro_40104=第二次アラメイン戦において、イギリス第7装甲師団は第8軍の鋭い矛先として、その卓越した機動力と突撃力を遺憾なく発揮した。戦闘初期、同師団は戦線南部で敵軍を牽制し、戦況が膠着すると、英軍司令部は主攻正面の兵力を強化するため第7装甲師団を北方へ転進させた。決定的な「スーパーチャージ作戦」において、第7装甲師団は兄弟部隊とともにドイツ・イタリア連合軍の防衛線深くへ激しい突撃を敢行し、最終的に防線を突破することに成功した。その後、第1装甲師団、第10装甲師団と協力して広大な砂漠での追撃戦に参加し、連合軍がこの重要な戦いに勝利する上で極めて重要な役割を果たした。
legend_intro_40105=チュニジア戦において、イギリス第7装甲師団は連合軍の先鋒として1943年3月、マーレト防衛線に対して最初の突撃を敢行した。同師団は優れた機動戦術を駆使し、険しい地形をものともせずに敵の防衛線を突破、巧みに迂回してドイツ軍の側面を突いた。さらにワディ・アカリートの戦いでは、砂漠戦における熟練した戦闘能力を発揮し、精確な装甲突撃でイタリア軍の陣地を切り裂いた。やがて第7装甲師団はチュニジア市へ最初に突入したイギリス軍部隊となり、「砂漠のネズミ」はその卓越した装甲協同戦術と迅速な進撃によって、北アフリカにおける枢軸国勢力の壊滅に決定的な戦功を挙げ、その輝かしい戦史に新たな一章を刻んだ。
legend_intro_40106=1943年、イタリア戦線へ転じた第7装甲師団は、広大な砂漠から狭隘な山岳地帯へと戦場を移し、まったく異なる環境での戦いに直面した。しかし、この「砂漠のネズミ」は驚異的な適応力と攻撃力を発揮した。サレルノ上陸後、彼らはドイツ軍の激しい反撃を耐え抜き、さらに北へと進撃してナポリを攻略、イタリアの戦線離脱を加速させる上で重要な役割を果たした。その戦いぶりは、彼らが名実ともに精鋭中の精鋭であることを改めて証明するものであった。

synergy_tactics_4_1=・すべての「砂漠のネズミ」部隊は、砂漠マス上を移動する際の移動力消費-1；
synergy_tactics_4_2=・砲撃制圧：砲兵ユニットが攻撃を行った後、自身の周囲2マス以内にいる敵ユニットは「砲撃制圧」状態になる；「砲撃制圧」：「砂漠のネズミ」部隊から攻撃を受けた際に被ダメージが10％増加。
synergy_tactics_4_3=・装甲猟行：装甲ユニットは、「砲撃制圧」バフを受けている敵ユニットを撃破するたびに、次のターンの行動力＋2。最大行動力を20まで増加させる。
synergy_tactics_4_4=・機械整備：ターン終了時、「砂漠のネズミ」所属の歩兵ユニットの1マス以内にいる「砂漠のネズミ」所属の砲兵および装甲ユニットは、HPを50回復。

army_buff_desc_1581=砲撃制圧：「砂漠のネズミ」部隊から攻撃を受けた際、被ダメージが10％増加。

