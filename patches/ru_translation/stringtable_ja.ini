skill_info_55=装甲ユニットを指揮する場合、敵部隊の防御力を[#00FF00#%d%%]無視する
skill_info_56=空軍やミサイルで攻撃する時、敵部隊の防御力を[#00FF00#%d%%]無視する
skill_info_57=空軍で攻撃する時、資源の消耗が-[#00FF00#%d%%]される
skill_info_58=ミサイルで攻撃する時、資源の消耗が-[#00FF00#%d%%]される
skill_info_59=火砲ユニットを指揮して攻撃する時、敵部隊を殲滅すると[#00FF00#%d%%]の確率で再攻撃を行う
skill_info_60=火砲ユニットを指揮する時、防御力が+[#00FF00#%d%%]される
skill_info_100=歩兵ユニットを指揮する時に[#00FF00#%d%%]の確率で致命的な一撃を与え、攻撃時に歩兵の射程が+1される（このスキルを所持している場合、歩兵指揮官の効果は無効となる）
skill_info_101=歩兵ユニットを指揮する際、[#00FF00#%d%%]の確率で周囲にいる未攻撃の歩兵ユニット2体と共に攻撃を行う。（1ターンに1回のみ発動可能）
skill_info_102=火砲ユニットを指揮する場合、敵部隊の防御力を[#00FF00#%d%%]無視する
skill_info_103=陸軍部隊が海上にいる際、移動力＋[#00FF00#%d]
skill_info_104=指揮する部隊は敵陸軍部隊からのダメージを[#00FF00#%d%%]軽減し、敵に与えたダメージの20%%の分のHPを回復する
skill_info_105=装甲部隊を指揮する際にHPが半分以下になると、次のターンに最大HPの[#00FF00#%d%%]を回復する
skill_info_106=敵に致命傷を与えた後、1ターンの間敵ユニットの攻撃力を[#00FF00#%d%%]減少させる
skill_info_107=歩兵部隊を指揮する際、HPが半分以下になった場合次のターンに最大HPの[#00FF00#%d%%]を回復する
skill_info_108=部隊の士気は低下しない。また1マス以内に友軍がいる場合に、自分が敵から受けるダメージを[#00FF00#%d%%]減少させる。
skill_info_109=海軍部隊を指揮するとき、[#00FF00#%d%%]の確率で被ダメージを20%%減少させる
skill_info_110=攻撃後に30%%の確率で士気が上昇する。士気高揚時、与ダメージが+[#00FF00#%d%%] される
skill_info_111=空軍で攻撃する時に[#00FF00#%d%%]の確率で対空兵器を無視する。ステルス機とB-52戦略爆撃機指揮時に与えるダメージが20%%増加する
skill_info_112=海軍を指揮する際、与ダメージが[#00FF00#%d%%]増加する。攻撃後、最大HPを5%%回復する(1ターンに1回のみ発動)
skill_info_113=火砲ユニットを指揮する際、[#00FF00#%d%%]の確率で周囲にいる未攻撃の火砲ユニット1体と共に攻撃を行う。（1ターンに1回のみ発動可能）
