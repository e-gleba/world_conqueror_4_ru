feat_name_115=制圧

feat_desc_110=山岳および森林地形において、受けるダメージが{1}%減少する
feat_desc_111=複数の近距離ミサイルを発射し、対象に対して近距離ミサイルの{1}%のダメージを与え、対象周囲の敵に{2}%のダメージを与える。クールダウン3ターン。
feat_desc_111_Lv2=複数の近距離ミサイルを発射し、対象に対して近距離ミサイルの{1}%のダメージを与え、対象周囲の敵に{2}%のダメージを与える。クールダウン2ターン。
feat_desc_111_Lv3=複数の中距離ミサイルを発射し、対象に対して中距離ミサイルの{1}%のダメージを与え、対象周囲の敵に{2}%のダメージを与える。クールダウン2ターン。
feat_desc_112=各ターン開始時に最大HPの{1}%を回復する。HPが満タンの時、受けるダメージが{2}%減少する。
feat_desc_113=非建造物ユニットに対するダメージが{1}%増加する
feat_desc_114=攻撃後、敵が{0}%の確率で通常攻撃および反撃ができない状態になる。効果は1ターン継続。
feat_desc_115=敵を殲滅した後、目標周囲1マス以内の他の敵の士気が{1}%の確率で低下する。

army_buff_desc_1391=火器管制妨害：通常攻撃および反撃ができなくなる（固定翼機からの攻撃、ミサイル攻撃、及び掃射・制圧攻撃は影響を受けない）


dialogue_2883=諸君、グアムは今や無防備だ。速やかに奪取せよ！
dialogue_2884=第4装甲軍はスターリングラードに突撃し、第6軍を必ず救出せよ！
dialogue_2885=陣地を安定させ、包囲網を確実に維持せよ！
dialogue_2886=第6軍、この好機を逃さず、速やかに突破せよ！
dialogue_2887=我々の補給はもはや底を尽きた。全軍に告ぐ、包囲突破を断念し、救援を待て。
dialogue_2888=敵軍の防線を突破し、アルデンヌ山地を越えてアントウェルペンへ突撃せよ！
dialogue_2889=陣線を維持しろ、絶対にドイツ軍に補給線を脅かさせてはならない！
dialogue_2890=各部隊に告ぐ、ディナンに集結し、ドイツ軍の攻勢を阻止せよ！
dialogue_2891=補給は整った！兵士たちよ、今が復讐の時だ。突出部のすべての敵を殲滅せよ！
dialogue_2892=軍隊はもはや計画を完遂する力がない。全軍撤退し、戦力を温存せよ。
dialogue_2893=バストーニュを確保し、部隊の安全なアルデンヌ山地通過を保障せよ！
dialogue_2894=バストーニュを死守せよ。第3軍が間もなく増援に来る！
dialogue_2895=速やかに突撃し、バストーニュの包囲を解け！
dialogue_2896=同志たちよ、敵軍の力はすでに弱まっている！南方軍集団を撃破し、ウクライナを解放せよ！
dialogue_2897=各部隊は最後の一刻まで堅守せよ、絶対に後退するな！
dialogue_2898=元首の命令により、私が指揮を引き継ぐ。各部隊は防線を強化し、交替で後退しながら戦力を温存せよ。
dialogue_2899=ヴァトゥーチン大将は療養のため前線を離れる。私が指揮を引き継ぐ。全軍に告ぐ、攻撃を続行せよ！
dialogue_3100=ドイツ軍のシャルンホルストが出撃し、我が護衛艦隊を捜索中だ。撃沈せよ！これで北極航路は安全となる。
dialogue_3101=同志たちよ、敵は我々の同胞を虐殺し、戦友を殺害した。彼らの仇を取るのだ！全軍進撃！
dialogue_3102=敵は降伏勧告を装い、我々を完全に殲滅しようとするつもりだ。将士たち、都市を死守し救援を待て。勝利は必ず我々のものだ！
dialogue_3103=ブダペストはもはや防衛不能だ。突破できる者は突破し、無理なら降伏せよ。祖国は我々の犠牲を忘れないだろう。
dialogue_3104=敵軍の主力はすでに北へ移動している！弱点を狙い、ストラスブールを奪取せよ！
dialogue_3105=アルザス地区の兵力は手薄だ。厳重に防御せよ。必要に応じて部隊はヴォージュ山脈まで後退し、防衛線を構築せよ。
dialogue_3106=ストラスブールを奪取し、敵をヴォージュ山脈から追い出せ！
dialogue_3107=陣線を死守するのだ、アルデンヌ山地の部隊が支援に向かっている！
dialogue_3108=援助はアメリカから到着中だ。数千の兵士と数百機の航空機が派遣されている。我々の部隊は援軍が到着するまで堅守しなければならない。もはや後退は許されない。
dialogue_3109=今は撤退するが、必ず戻ってくるぞ！
dialogue_3110=老兵は決して死なない、ただゆっくりと消えていくのだ。
dialogue_3111=たとえお前たちは私を捕らえ、バターンが陥落したとしても、自由を愛する世界中の人々の精神は決して打ち砕かれない！
dialogue_3112=フィリピン、私は戻ってきた！各部隊は上陸後、東南へ進軍し、マニラを解放せよ！
dialogue_3113=海岸から離れて戦闘を行い、敵艦からの砲撃支援を避けよ。守りきれない場合は山岳地帯に撤退し、消耗戦に持ち込め！
dialogue_3114=同志たち、レニングラードの人々は800日以上も包囲に耐えてきた。この状況をこれ以上許すことはできない！攻撃せよ！レニングラードを解放せよ！
dialogue_3115=レニングラードの包囲は解かれた。ドイツ軍は正義の勝利を阻むことはできない！同志たち、追撃を続けよ！
dialogue_3116=キュヒラー将軍は解任された。これより私が指揮を執る。前線部隊は戦線を縮小し、段階的にペイプシ湖の西側へ撤退せよ。
dialogue_3117=少数部隊で左側から敵の注意を引きつけ、主力部隊は右側の山岳地帯から攻撃を仕掛けろ。「右フック」で防衛線を突破するのだ！
dialogue_3118=山岳と渓谷を拠点に防衛線を構築し、いかなる陣地も絶対に放棄するな！
dialogue_3119=カッシーノの修道院は敵軍の観測所である可能性が高い。空軍の爆撃が間もなく到着する。兵士たち、あの陣地を奪取せよ！
dialogue_3120=兵士たち、攻撃開始！フランスの領土を取り戻せ！
dialogue_3121=第19軍は直ちに撤退せよ、敵に包囲殲滅されるな。
dialogue_3122=この戦いの最優先任務は敵の殲滅だ。まず南北両側から包囲を完成し、包囲網内の敵に攻撃を開始せよ。
dialogue_3123=包囲網は完成した。同志たち、攻撃開始！包囲された敵を殲滅せよ！
dialogue_3124=速やかに突破せよ！包囲網外の部隊も急いで攻撃を開始し、突破を支援せよ！
dialogue_3125=突出部の部隊は迅速に撤退して再編を行い、他の部隊は陣地を堅固に防衛せよ。
dialogue_3126=まずはオウル周辺の町にいる敵軍を制圧し、その後南部の敵軍に対抗する。戦士たち、戦え！独立したフィンランドのために！
dialogue_3127=ドイツからの支援はすでに到着している。敵軍の訓練水準は我々に及ばない。戦士たち、攻撃せよ！
dialogue_3128=敵にも援軍があるのか？戦士たち、補給線を切断し、援軍の到着を遅らせよ。勝利は必ず我々のものだ！
dialogue_3129=私は国外で戦いを続ける。独立し平和なフィンランドが誕生するその日まで！
dialogue_3130=たとえロシアの助けで勝利を得たとしても、それではフィンランドは真の独立を勝ち取ることはできない！
dialogue_3131=日本軍の防御は手薄だ。この戦いでアメリカ海軍の力を思い知らせてやろう！
dialogue_3132=艦載機、発進！その身をもって空母の威力を思い知らせてやれ！
dialogue_3133=各部隊に告ぐ、敵の支援部隊が到着した。行動速度を上げろ！
dialogue_3134=同志たち、敵は河岸を防御して最後の抵抗を試みている。我々の砲火で思い知らせてやろう、正義が必ず勝利することを！
dialogue_3135=我々は今、祖国の領土の境界に立っている。いかなる後退も戦火を空と水路を通じてドイツへと引き込むことになる。我々は決して後退しない！
dialogue_3136=同志たち、敵はかつて我々の進軍を阻んだ。しかし今度は、彼らは兵を他へ割かねばならない。防衛線を突破するのは、まさにこの戦いだ！
dialogue_3137=将士たち、我々はかつて敵軍の攻勢を食い止めた。今回も、必ずやり遂げることができる！祖国のために！

event_208=黒蠍の起源

