feat_desc_107_Lv4=このターン、攻撃時に対象の1マス範囲内の他の敵に{1}%の追加ダメージを与える。クールダウン2ターン。
feat_desc_108_Lv4=複数の敵部隊を攻撃可能。戦車・火砲ユニットへのダメージが{1}%増加する。敵を撃破すると再度攻撃可能。
