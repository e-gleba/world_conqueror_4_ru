elitepass_rule=精鋭パスポートのルール
elitepass_rule_1=1.精鋭パスポートは各シーズン28日間開催され、終了の24時間前より高級精鋭パスポートと特級精鋭パスポートが購入できなくなります。
elitepass_rule_2=2.デイリーチャレンジは、ゲームへの登録を含む固定のクエストと、2つのランダムに生成されるクエストから成ります。チャレンジは1日に3回までリセットできます。
elitepass_rule_3=3.次のシーズンの精鋭パスポートを開始すると、前のシーズンで未受け取りの報酬は精鋭パスポートを開く際に自動的に受け取ることができます。
elitepass_rule_4=4.未使用の高級精鋭パスポートと特級精鋭パスポートの開放回数は、次のシーズンの精鋭パスポートを開始した後に使用できます。
elitepass_rule_5=5.精鋭チャレンジのクエストに関するクリアイベントの統計は、現在のシーズン開始後のクリア回数を基準とします。
elitepass_rule_6=6.すべての精鋭パスポートの報酬を開放した後、60ポイントごとに追加の報酬を獲得できます。報酬は累積可能です。
