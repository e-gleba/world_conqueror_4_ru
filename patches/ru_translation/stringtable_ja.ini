;战役简介
;__font_type[font_text_]
stage_intro_10001=このステージでは、ユニットの移動と攻撃、ユニットの建造、ユニットに将軍を派遣することと指令の撤回及び如何に勝利することについてご紹介します。
stage_intro_10002=このステージでは、士気が部隊に対する影響、対空施設の建造、都市への制圧、ランドマーク建造物及び都市情報を確認することについてご紹介します。
stage_intro_10003=このステージでは、地形による影響、戦闘機の使い方、原子爆弾の生産、ミサイルの使用及び海上作戦をご紹介します。
stage_intro_10004=このステージでは、精英部隊のスキル、緑サークル（二次的要所）及び退避ポイントの機能をご紹介します。
stage_intro_10101=最高司令部はポーランドに攻勢を仕掛けることを決意した。司令部の命令により、貴官の部隊は最速でポーランドの辺境を突破しなけれならない。勝利の朗報を期待している。
stage_intro_10102=最新情報によるとイギリスはノルウェーに侵攻し、わが国の鉄鋼輸入を停止すると脅かしてくるかもしれない。司令部は「ヴェーザー演習作戦」の名義でノルウェーとデンマークに軍隊を派遣し、帝国に必要とされる資源を確保すると命令した。
stage_intro_10103=フランスを徹底的に倒すため、今度の戦いの目標をフランスの首都「パリ」に決めた。フランス人は強固な防衛線「マジノ線」を構築したが、うまく迂回すれば、マジノ線はただの飾りものになってしまう。
stage_intro_10104=フランスはすでに降伏した。イギリスは帝国の最大の敵となっている。彼らがいる限り、我々は安心して東に進軍できない。そして今、最高司令部はイギリス海峡を横断し、イギリスを徹底的に倒し、ヨーロッパ大陸に対する脅威を追い払ってくれと命令した。
stage_intro_10105=最近、地中海でのイギリス海軍の活動がより活発になったため、北アフリカへの作戦はともかく、わが領土の安全も脅かされている。首相は地中海の制御権を奪還すると命令した。これはわが国や我らの盟友に対して、重要な意味を持っている。
stage_intro_10106=連合国の一連の勝利は首相に大きな自信を与えてくれた。彼はローマの栄光を再現するように決心した。首相の領土拡大政策によると、我々は最初バルカン半島で軍事行動を展開することになる。我らの盟友ルーマニアとブルガリアは協力してくれる。首相は貴官から勝利の朗報を聞けるように期待している！
stage_intro_10107=最高司令部はバルバロッサ作戦を実行することを決意した。この作戦の最終目標はソ連の首都「モスクワ」を制圧することだ。東に進軍する時に、我々は引き続き「電撃戦」を駆使し、最速でソ連を撃破するようと目論む。帝国はソ連で豊富な石油資源や大量な労働力を手に入れる。これらは我々が切実に必要とする資源だ。
stage_intro_10108=連合軍の侵攻には我らのスエズ運河及びアレクサンドリア港への制圧作戦を邪魔されてきた同時に、補給も非常に困難になってしまう。そこに駐屯している連合軍を撃退し、彼らの補給線を切断しなければならない。成功すれば、すべての北アフリカを支配することができる。
stage_intro_10109=レニングラードはソ連の最も重要な都市の一つである。重要性を考えるとモスクワより高いと最高司令部は思っている。この都市を奪取することは帝国にとって非常に重大な戦略的意義がある。司令部はすべての北方軍集団を結集させた。それに、フィンランド軍は側面で我らの行動をサポートする。
stage_intro_10110=パウルス将軍の第6軍はソ連軍の重囲に陥った。最高司令部はいかなる代価も惜しまず、今すぐ救援に向かってくれと命令した。司令部は周辺の部隊を集中させて救援に向かわせた。救出に成功し、レニングラードへの制御権を取得してほしい。
stage_intro_10111=バルバロッサ作戦の一部の失敗は敵軍の侮ったからだ。最高司令部は今回の失敗がヨーロッパを征服する計画に影響していないと考えている。帝国が今、ヨーロッパを征服するまで後一歩。モスクワを制圧し、バルバロッサ作戦でやり遂げなかった部分を完成してださい。
stage_intro_10201=ドイツ機械化部隊の速やかな攻勢を前にして連合軍は崩壊の寸前になってしまった。連合軍の主力は今、ダンケルクでドイツ軍に囲まれ、後ろのイギリス海峡は唯一の退路だ。司令部はいかなる代価も惜しまずドイツ軍を食い止め、主力部隊が撤退できるための時間を稼んでくれと命令した。
stage_intro_10202=ダンケルクでの撤退でほとんどの重装備をなくした我々はドイツ軍の猛烈な攻勢を前にして防御に専念するしかできない。司令部はわずかな優れた装備を貴官と周辺部隊に渡した。君たちはブリテン最後の希望だ。
stage_intro_10203=チュニジアに向かうドイツ軍の補給艦数隻を撃沈した。今、北アフリカに駐屯するドイツ軍は十分な補給を受けられない状況に陥っている。今は彼らを北アフリカから追い払うチャンスだが、ドイツ軍が完璧な防衛線を構築した。そのため、今回の戦いは決して楽なものではない。
stage_intro_10204=北アフリカの枢軸国の部隊は我々に倒された。イタリアを戦争から退出させたら、地中海の制御権が連合軍の手の中にあることを確保できる。司令部からの命令では、貴官の部隊はシチリア島に攻撃することになる。これは連合軍がヨーロッパ大陸を解放する第一歩となる。
stage_intro_10205=司令部からの情報によると、ドイツ軍は大量な火砲や戦車を結集した。彼らは間もなく我々に大規模な攻勢を仕掛けてくる。今回の戦いは今後の形勢にも影響を与える。祖国のために、今度の戦いを勝利に導いてください。
stage_intro_10206=ドイツ軍の放送局はいつも自分は無敵だと揚言するが、一連の失敗の前で、彼らの言ってることがすべて可笑しくなっている。司令部はキエフを奪還すると命令した。部隊の被害を抑えるために、我々は集中砲火で貴官の行動を援護する。
stage_intro_10207=我々の先頭部隊はベロルシアに到達した。今度の目標は国内のドイツ軍を完全消滅することだ。ドイツは後備部隊を動員し、失った兵力を補おうとしている。彼らの援軍が到達する前に防衛線を突破し、祖国を解放したほうが良いと思う。
stage_intro_10208=戰爭を一刻も早く終わらせるために、ヨーロッパで新たな戦場を開拓する必要がある。そして司令部は最後に攻撃地点をノルマンディーに決めることになった。今回の上陸作戦のために、我々は色々準備してきた。貴官の生涯で一番大きな戦いとなるだろう。
stage_intro_10209=我々は段階的な勝利を収めた。司令部からの最新命令によると、貴官の部隊はフランス南部の全領土を回収し、まだフランスで抵抗するドイツ軍を徹底的に消滅することになる。南部に位置する港の機能を復旧することが今回の戦いに重要な影響を与えると思う。
stage_intro_10210=ライン川を横断してベルリンまで進軍するために、司令部は大規模な空挺作戦を実施するのを決めた。しかし、ドイツ軍はきっと最後の自然の障壁を放棄したりはしない。そのため、作戦が始まると貴官の部隊は地獄の端で歩くことになる。
stage_intro_10211=ドイツ軍は最後の力を結集して首都ベルリンを守ろうとしていた。連合軍の兵力はドイツ軍を遥かに上回っているが、窮地に陥るドイツ軍は必ず必死に反抗する。司令部は他の国より先にベルリンを占領してほしい。
stage_intro_10301=アメリカの太平洋艦隊は帝国の最大の障害となっていた。彼らを倒さなければならない。まもなく我々は大本営が計画した奇襲作戦を実行し、アメリカの真珠湾に位置する海軍基地を攻撃する。帝国の空母艦隊は協力してくれる。ハワイを攻め落とし、米軍の太平洋艦隊を消滅してください。
stage_intro_10302=ドイツに侵攻されてるイギリスはアジア地域での出来事に構う余裕はない。より多くの資源を獲得するために、大本営はイギリスの植民地であるマレー半島を攻撃し、シンガポールを占領すると命令した。イギリス海軍に気をつけてください。彼らは強力な火力を有している。
stage_intro_10303=イギリス軍は現地人の助けでとある道路を建築した。この道路で沢山の物資を獲得した。イギリスに対抗するために、大本営はビルマを攻撃し、彼らの補給線を断つと命じていた。目標を奪取したら、陣地を死守して、その道路が帝国の手にあることを確保してください。
stage_intro_10304=大本営は次の目標をオーストラリアに決めた。しかし、オーストラリアを侵攻する前に、周辺地域を占領し、一連の防御施設を建設してアメリカとオーストラリア間の補給線を切断する必要がある。われらの艦隊が指定地域に到達する時、上陸作戦は正式に開始する。
stage_intro_10305=機は熟した。今はオーストラリアに侵攻する最高のチャンスだ。大本営は貴官に陸から攻勢を仕掛け、沿海都市をすべて制圧すると命令した。帝国海軍は海上から全面的に支援してくれる。しかし、我々の兵力は手薄で、被害を最小限に抑える必要がある。
stage_intro_10306=帝国のインパールへの侵攻作戦はすでに失敗した。我らの部隊は甚大な被害を受けた。しかし、イギリス軍はまだ我らの後ろを追いかけている。総崩れになりかねないこの状況で、大本営はその場で防衛線を構築し、敵の攻撃を食い止めると命令した。
stage_intro_10307=ドイツとソ連の戰爭は最終段階に突入した。ソ連をできるだけ早く倒すために、ドイツは我々に極東地域でソ連軍に攻勢を仕掛けてシベリアでのソ連軍の主力部隊を牽制してほしい。しかし、正面からソ連軍の装甲部隊と対抗しないようご注意ください。
stage_intro_10308=ドイツ軍の行動に合わせて北アメリカを攻撃するために、大本営はまずカナダに攻勢を仕掛けると決めた。今回の作戦行動は今まで我々が実施した海上行動の中で距離的に一番遠かった。そして、貴官の艦隊はカナダの海岸防衛線を突破する必要がある。最後にアメリカに気をつけてください。彼らに見つかったら、前後から攻撃を受けるハメになる。
stage_intro_10309=この間の戦いで帝国は辉かしい战果を取得したが、強大なアメリカはまだ敗れていない。情報より、アメリカ人は凄まじい威力を持つ武器を開発した。この武器によって戰爭の行き先は変わるかもしれない。大本営は直ちにアメリカ本土に侵攻すると決めた。もう、我々に残された時間は多くない。
stage_intro_10401=日本は真珠湾に奇襲を仕掛けた。これは我々に対しての明らかな宣戦布告だ。我々の空港は爆破された。港に停泊している艦船も戦力を失った。今頼れるのは外でパトロールしている艦隊だ。彼らは我々の最後の希望だ。
stage_intro_10402=日本軍の強攻によって帝国の部隊はマレー半島で甚大なダメージを受けた。これは紛れもなくイギリス史上最大の災難である。日本軍は今、シンガポールで新たな攻勢を仕掛けようと企んでいる。これは指揮部にとって堪忍できない行為だ。反撃を開始せよ。ロイヤルネイビーは戦場に到着するとすぐに戦闘に参加する。
stage_intro_10403=日本軍の情報を解除したことで、日本軍はまもなくミッドウェー島に侵攻すると分かった。司令部は援軍が到達する前にミッドウェー島を死守すると命令した。われらの空母艦隊は最速で支援に駆けつけているので、十分な準備を整えてほしい。
stage_intro_10404=司令部はガダルカナル島に侵攻し、そこの日本軍基地を制圧すると命令した。そこを支配すれば、われらの空軍は太平洋におけるすべての日本軍基地を空襲し、フィリピンへの反攻に備えることができる。マッカーサー将軍はもうその日の到来を待っていられないと思う。
stage_intro_10405=日本人のインパールを奪取する作戦はすでに失敗した。連合軍はこの機に乗じて反攻を仕掛けようと考えていた。指揮部は雨季が終わったらビルマに駐屯する日本軍を攻撃すると命じた。日本人は病気に苦しんでいる。今は絶好の攻撃チャンスだ。
stage_intro_10406=全面的反攻はすでに始まった。マッカーサー将軍はフィリピンを占領し、日本軍の輸送線を切断することを勧めた。司令部は彼のアドバイスを聞き入れ、マッカーサー将軍と一緒に今度の作戦を完成させると貴官に命令した。
stage_intro_10407=我らの「空中要塞」に日本本土をより効率的に爆撃させるために、司令部は硫黄島を占領し、日本軍の空軍基地を奪取すると命令した。
stage_intro_10408=米軍はまもなく日本本土に最後の攻勢を仕掛ける。しかし、司令部は我々が目の前の敵軍に足を引っ張られることを容認できない。この敵部隊を早く消滅し、米軍より先に日本本土に攻撃しなければならない。我々に残された時間はもう多くない。
stage_intro_10409=我々のスーパー兵器によって日本は壊滅的なダメージを受けたが、まだ降伏していない。司令部は日本本土に侵攻することを決めた。苦しい戦いになると思い、日本への強行上陸は我々に甚大なダメージを与えるだろう。その同時にソ連は北から攻撃を始めるが、彼らの目標は日本だけではないかも知れない。
stage_intro_10501=NATOの艦隊はインド洋に現れた。司令部は彼らの目的はペルシャ湾に侵入してコーカシア地域にある我らの油田を攻撃するのではないかと考えている。彼らを撃退せよ。中東地域に駐屯する部隊は今回の作戦に協力してくれる。
stage_intro_10502=NATOは昔からコーカサス地域に位置する我らの油田を狙ってた。情報によると、敵軍はトルコで結集し、我らの油田に攻撃を仕掛けようとしていた。司令部は部隊を率いてコーカサス地域に向かい、そこのNATO軍を消滅してトルコに進軍すると命令した。
stage_intro_10503=トルコが我々に占領されることに対して、NATOは絶対に座視しない。彼らは地中海で艦隊を集結し、我らの軍事行動を阻止しようとしていた。トルコを占領し、NATOの艦隊を消滅すれば、地中海の支配権は我らの手の中に落ちると司令部は考えている。
stage_intro_10504=NATOは我々の北アフリカや地中海での行動がヨーロッパ諸国の利益に侵害したと考えている。そのため、アメリカをはじめとするヨーロッパ諸国は我々に攻撃を仕掛けようとしていた。形勢は我々にとって非常に不利なので、ヨーロッパ諸国の軍事力に直面しなければならない。
stage_intro_10505=ヨーロッパの盟友を失った後、アメリカは狙いをアジアに定め、アジアで新たな盟友や勢力を作ろうとしていた。アジアで新たな勢力を作られたら、我々は更なる脅威に脅かされることになる。そのため、司令部は貴官にアメリカの西海岸に攻撃し、アジアとの線路を切断してほしい。
stage_intro_10506=NATOに対する作戦を勝利に導いた後、我々の勢力はヨーロッパ、アジアやアフリカに広がっていた。アメリカは我々の最後の目標だ。アメリカを倒せば、この戦争に勝利する。しかし、貴官の相手はこの世で一番強力な軍事力を有することを忘れないでください。
stage_intro_10601=東線でドイツを徹底的に倒したソ連は更なる野心を持ち始め、ヨーロッパ諸国がまだ回復していない内により多くの利益を獲得しようとしていた。今のヨーロッパではソ連と対抗できる国はないため、ヨーロッパ諸国と手を組んでソ連に対抗しなければならない。
stage_intro_10602=朝鮮半島で全面戦争が勃発し、韓国の首都ソウルはすでに陥落した。司令部はマッカーサー将軍のアドバイスを聞き入れ、援軍を派遣し、仁川に上陸すると決めた。警戒を怠らないでください。我々の敵は北朝鮮だけではない。
stage_intro_10603=情報によると、ソ連は最近、キューバとカリブ海付近で大量なミサイルを配置した。そのため、わが国は巨大な脅威に晒されている。司令部は直ちに部隊を率いてキューバに向かい、そににいる敵駐屯軍を消滅してミサイルサイロを奪取すると命令した。
stage_intro_10604=中東の石油を奪取するために、ソ連はスエズ運河を封鎖した。彼らの行為は地中海及び中東地域での我々の利益に大きな影響を与えた。司令部はわれらの盟友イギリスと連合し、中東地域を支援してソ連軍を中東地域から追い払い、スエズ運河の機能を復旧させると命令した。
stage_intro_10605=情報より、ソ連軍は数週間でポーランドに大量な戦車を結集させた。司令部はソ連軍がまもなく総攻撃を仕掛けると考えている。我々はヨーロッパを支援しなければならない。指揮官閣下、強大なソ連軍に直面するしかない。
stage_intro_10606=ソ連を撃退したが、ソ連がこんなに潔く降伏することに疑問を持つようになった。情報によると、ソ連は昔から南極で密かに新兵器の研究を始めていた。司令部は南極に赴き、彼らを見つけ出して消滅すると命令した。
stage_intro_10701=中東地域の油田は攻撃を受け、占領された。これによって国際石油価格は信じられない価格に上昇した。指揮官閣下、情報を掴まずに迂闊に攻撃を仕掛けるのは重篤な結果を招くかもしれないが、一刻も早くそれらの油田を奪還しなければ、より多くの国は深刻な危機に陥る。
stage_intro_10702=不明勢力の攻撃でヨーロッパは非常にまずい状況に陥っている。世界経済の中心としてヨーロッパは一刻も早く平和を取り戻さなければならない。指揮官閣下、部隊を率いてヨーロッパに向かい、そこにいる不明勢力を徹底的に消滅してください。
stage_intro_10703=西欧で失敗した後、彼らは部隊を東方向に移動させた。経済が崩壊寸前になっているソ連にとって巨大な危機に等しい。指揮官閣下、ソ連を倒されてはいけない。彼らは将来、敵に反攻する重要な力になる。
stage_intro_10704=北アメリカは最初に攻撃を受けて甚大な被害を被った地域の一つなので、ニューヨークも重点攻撃の対象となっていた。ヨーロッパ戦場で勝利したあかげでニューヨークに対する敵の攻撃は緩んでいた。司令部はこの機に乗じて反撃を行い、ニューヨークから敵を徹底的に追い払うと決めた。
stage_intro_10705=国連は不明勢力をテロリストに定義した。我らの安全は彼らに脅かされてる。彼らの世界各地に潜む勢力を消滅しなければならない。一連の勝利を得たおかげで、我々は更なる支持を獲得した。彼らを消滅するのは時間の問題だ。
stage_intro_10706=シベリアには豊富な資源が存在している。情報によると、テロリストはそこで秘密基地を建設し、後ほどアジア各国を攻撃しようとしていた。司令部はこの基地を潰さなければならないと考えているが、シベリアの過酷な環境は彼らを守る壁となっている。今度の戦いは想像より難しいかもしれない。
stage_intro_10707=彼らの行動は我々の想像より速かった。シベリアの基地を潰された後、彼らは残った部隊を結集し、アジアに位置する我らの各基地に攻撃を仕掛けた。彼らの残った部隊は人数的に多くないが、エリート部隊ばかりなので、非常に手ごわい戦いになると思う。
stage_intro_10708=ワシントンから撤退したテロリストは分散して最後に南アメリカに集結した。司令部はすでに彼らの大本営はそこにあると確信した。指揮官閣下、決戦の時が来た。世界平和のために、彼らを消滅してください！
stage_intro_10709=我々は迂闊だった。彼らはソ連が南極に残した軍事基地を利用しようとすることを気付けなかった。そして、彼らは同時ソ連が完成できなかった研究を完成させた。今の南極基地はまるで難攻不落の要塞だ。しかし、我々は攻めるしかない。あの研究の成果をテロリストの手に渡してはいけない。



;序章对话
;__font_type[font_text_]
stage_dialogue_1=指揮官閣下、戦場に入る前に、ガイドバトルで作戦のノウハウを知ることができます。
stage_dialogue_2=作戦に関する知識を詳しく教えます。
stage_dialogue_3=戦闘に慣れているお方はこの部分をスキップしても構いません。
stage_dialogue_4=最高司令部により、作戦命令が下りました。わが軍隊は続々と前線に赴いています。敵軍は我らの新戦術に慣れず、次々と敗退しています。将来、帝国の版図はどんどん拡大していくと思います。指揮官閣下、間もなく戦場で栄誉を手に入れます。
stage_dialogue_5=ドイツ軍の装甲部隊はすでにマジノ線を迂回し、多くの都市は敵軍に占領されました。指揮官閣下、ドイツ軍は我らを囲もうとしていて、今の状況は非常に危険です。我々は今、新たな防衛線を構築する必要があります。我々を勝利に導いてください。
stage_dialogue_6=アメリカ人はまだ我らに宣戦布告していないが、わが国に対して物資輸出禁止の方針を決めました。このままだと戦争を維持することができなくなり、率先してアメリカに攻勢を仕掛けなければなりません。指揮官閣下、生き延びるにはアメリカの太平洋艦隊を消滅しなければなりません。帝国の運命がかかっています。
stage_dialogue_7=日本は極東地域で大規模な軍事行動を展開し、盟友の領土を沢山占領しました。彼らの次の目標はこの太平洋地域です。指揮官閣下、彼らを阻止しなければなりません。大統領は総動員という命令を発布しました。正義の力は必ず勝利します。
stage_dialogue_8=アメリカは西ヨーロッパにある幾つの国と組んで新たな軍事同盟を作りました。これは明らかに我々に対する行為です。そして彼らの指導者も公開演説で我らに対する敵意を表しました。指揮官閣下、事務総長は彼らのやり方に対して非常に不満を抱いております。彼らに対して戦争を含めたいかなる手段を取ることができます。
stage_dialogue_9=長い間戦争は消えたが、ソ連の工廠は新兵器の開発を絶えることなく行っています。ソ連軍が有する戦車の数は世界で一番多く、戦争が勃発すると、ヨーロッパはパニック状態に陥ります。そして最近、彼らは我らの近くでミサイルを配置しました。指揮官閣下、国の安全を守るために何らかの手段を取る必要があります。
stage_dialogue_10=当時、彼らがまだ小さいな組織で、各国の注意を引いていないです。
stage_dialogue_11=しかし、世界経済が衰える時に、彼らは一気に立ち上がって、宗教の名義で多くの平民や退役軍人を募集しました。
stage_dialogue_12=各国の死の商人から武器を購入し、科学技術者を応募してハイテク装備の開発も始めました。
stage_dialogue_13=そして数年後、一連の暗殺や戰爭で彼らは多くの国や地域を支配しました。
stage_dialogue_14=今、彼らの勢力は世界に広がっています。指揮官閣下、各国の指導者は手を組んで彼らに宣戦布告することを決意しました。
stage_dialogue_15=真の平和を獲得するには、彼らを倒さなければなりません。




