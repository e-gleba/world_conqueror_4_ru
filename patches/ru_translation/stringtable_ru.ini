feat_desc_144=Урон по пехоте увеличен на {1}%.
feat_desc_144_Lv2=Урон по пехоте увеличен на {1}%. При уничтожении противника есть 100% шанс атаковать снова.
feat_desc_144_Lv3=Урон по пехоте увеличен на {1}%. При уничтожении противника есть 100% шанс атаковать снова.
feat_desc_144_Lv4=Урон по пехоте увеличен на {1}%. При уничтожении противника есть 100% шанс атаковать снова.
feat_desc_145=Развертывает дрон в радиусе 1 клетки. После развертывания он может двигаться и атаковать немедленно. Дрон действует как независимый отряд и может атаковать 1 раз за ход. Время жизни дрона: 1 ход. Перезарядка: 1 ход.
feat_desc_145_Lv2=Развертывает дрон в радиусе 1 клетки. После развертывания он может двигаться и атаковать немедленно. Дрон действует как независимый отряд и может атаковать 1 раз за ход. Время жизни дрона: 2 хода. Перезарядка: 1 ход.
feat_desc_145_Lv3=Развертывает дрон в радиусе 2 клеток. После развертывания он может двигаться и атаковать немедленно. Дрон действует как независимый отряд и может атаковать 1 раз за ход. Время жизни дрона: 2 хода. Перезарядка: 1 ход.
feat_desc_145_Lv4=Развертывает дрон в радиусе 2 клеток (до 2 раз за раунд). После развертывания он может двигаться и атаковать немедленно. Дрон действует как независимый отряд и может атаковать 1 раз за ход. Время жизни дрона: 2 хода. Перезарядка: 1 ход.
feat_desc_146=Восстанавливает {1} ОЗ и переходит в режим маскировки (EMCON). В этом режиме отряд не может быть выбран как цель для атаки бронетехникой, артиллерией или кораблями в течение 1 хода. Перезарядка: 2 хода. Атака отменяет режим EMCON.
feat_desc_146_Lv2=Восстанавливает {1} ОЗ и переходит в режим маскировки (EMCON). В этом режиме отряд не может быть выбран как цель для атаки бронетехникой, артиллерией или кораблями в течение 1 хода. Перезарядка: 2 хода. Атака отменяет режим EMCON.
feat_desc_146_Lv3=Восстанавливает {1} ОЗ и переходит в режим маскировки (EMCON). В этом режиме отряд не может быть выбран как цель для атаки бронетехникой, артиллерией или кораблями в течение 1 хода. Перезарядка: 2 хода. Режим EMCON не отменяется после атаки.
feat_desc_146_Lv4=Восстанавливает {1} ОЗ и переходит в режим маскировки (EMCON). В этом режиме отряд не может быть выбран как цель для атаки бронетехникой, артиллерией или кораблями в течение 1 хода. Перезарядка: 2 хода. Режим EMCON не отменяется после атаки.
feat_desc_147=Урон по бронетехнике, артиллерии и кораблям увеличен на {1}%.
feat_desc_148=Запускает самоуничтожение: отряд погибает, нанося урон, равный {1}% от оставшихся ОЗ дрона, всем целям (включая союзников) в радиусе 1 клетки.

