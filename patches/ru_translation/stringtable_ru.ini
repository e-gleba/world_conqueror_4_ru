event_intro_4125=После того как советские войска последовательно прорвали оборонительные рубежи и овладели Выборгом, финская армия, усиленная немецкими бронетанковыми частями, организовала упорную оборону на линии ВКТ. 25 июня 1944 года советские войска возобновили наступление, однако штурм был остановлен плотным огнём финской артиллерии и не достиг прорыва. Эта неудача убедила советское верховное командование в том, что цена полного завоевания Финляндии окажется чрезмерной, и побудила добровольно прекратить наступление и предложить мирные переговоры.
event_intro_4126=Для полного освобождения Украины и выхода в Польшу Ставка Верховного Главнокомандования приказала 1-му Украинскому фронту маршала Конева перейти в наступление с целью уничтожения немецкой группы армий «Северная Украина». 13 июля 1944 года советские войска начали Львовско-Сандомирскую операцию. Успешно прорвав немецкую оборону, советская армия завершила окружение и уничтожение крупной группировки противника, освободив Львов. Созданный в ходе сражения Сандомирский плацдарм стал важнейшим исходным рубежом для последующей Висло-Одерской стратегической наступательной операции.
event_intro_4127=Для обеспечения передовой стратегической базы бомбардировок Японских островов американские войска 24 июля 1944 года атаковали остров Тиниан, расположенный всего в пяти морских милях от Сайпана. Десант применил отвлекающий манёвр, успешно стянув значительные японские силы к юго-западному побережью, в то время как главные силы беспрепятственно высадились на слабо защищённом северо-западном берегу. Полностью овладев Тинианом, американцы быстро превратили его в крупную базу бомбардировочной авиации. Для расчистки наземных препятствий и ускорения темпа операции в этом бою впервые в боевых условиях был применён напалм.
event_intro_4128=11 августа 1945 года советские войска начали наступление с северной части Сахалина. Однако, подчиняясь строгому приказу японской 5-й армии «оборонять Сахалин до последнего человека», гарнизон острова продолжал сопротивление даже после объявления Японией капитуляции. Советские войска осуществили морскую десантную операцию и в итоге овладели Тоёхарой — административным центром Южного Сахалина, что вынудило все японские войска на острове сложить оружие. В ходе кампании в плен было взято около 18 000 японских солдат. Советский Союз положил конец сорокалетнему японскому владычеству над Южным Сахалином.
event_intro_4129=Для возвращения Гуадалканала и уничтожения американского авианосного флота японское командование направило на юг соединение из трёх авианосцев, нанеся 24 августа авиаудар по аэродрому Хендерсон-Филд. После взаимного обнаружения флотов японский лёгкий авианосец «Рюдзё» был потоплен, а американский авианосец «Энтерпрайз» получил тяжёлые повреждения. Японцы потеряли в этом бою больше палубной авиации, а их конвой с подкреплениями из-за утраты воздушного прикрытия был вынужден повернуть назад. Американские силы сохранили контроль над морем и аэродромом Хендерсон-Филд, закрепив стратегическую инициативу в южной части Тихого океана.
dialogue_4578=Финские войска получили существенную военную помощь от Германии. Мы должны сделать всё возможное, чтобы прорвать этот оборонительный рубеж до подхода вражеских подкреплений.
dialogue_4579=Оборонительный рубеж вот-вот будет прорван! Немедленно контратакуйте и отбросьте советское наступление.
dialogue_4580=Во избежание полного окружения основные силы немцев начали отход на юго-запад.
dialogue_4581=Сжать кольцо окружения. Не дайте главным силам немцев уйти.
dialogue_4582=Наши подкрепления непрерывно прибывают на поле боя. Продолжайте наступление и преследуйте отступающего противника.
dialogue_4583=Советские войска начали полномасштабное наступление на львовском направлении, и войска Оси стали отходить к Карпатам.
dialogue_4584=Японские силы отвлечены десантной операцией на юго-западе и перебрасывают войска для отражения ложной высадки американцев.
dialogue_4585=Американские войска успешно высадились на северо-западном побережье. Японские силы начали усиливать оборонительные рубежи на Тиниане.
dialogue_4586=Не страшитесь советского наступления. Мы будем оборонять Сахалин до последнего человека!
dialogue_4587=Пока советские войска наступают одновременно с моря и суши, воздушно-десантные части также начали выброску.
dialogue_4588=Мы будем сражаться изо всех сил до самого последнего мгновения.
dialogue_4589=Советские войска перешли в полномасштабное наступление. Эвакуируйте как можно больше людей на Хоккайдо.
dialogue_4590=«Уосп» срочно отозван. Мы должны остановить продвижение японского флота и уничтожить как можно больше палубной авиации и авианосцев противника.
dialogue_4591=«Энтерпрайз» получил тяжёлые повреждения. Продолжаем уничтожать оставшиеся авианосцы.
dialogue_4592=Авиация с Хендерсон-Филд нанесла тяжёлый урон японским десантным силам и кораблям сопровождения, и они начали отходить на север.
