feat_desc_116=Выберите цель в радиусе 3 клеток для ракетного удара. Наносит урон и снижает защиту цели на {2}% на 2 хода. Перезарядка: 3 хода.
feat_desc_116_Lv2=Выберите цель в радиусе 3 клеток для ракетного удара. Наносит урон и снижает защиту цели на {2}% на 2 хода. Перезарядка: 2 хода.
feat_desc_116_Lv3=Выберите цель в радиусе 4 клеток для запуска ракет {1}. Наносит урон и снижает защиту цели на {2}% на 2 хода. Эта атака игнорирует 50% брони цели. Перезарядка: 2 хода.
feat_desc_117=Если у цели осталось не менее {1}% ОЗ, атака гарантированно нанесет критический урон.
feat_desc_118=Пока прочность отряда превышает 50%, получаемый урон снижается на {2}%.
feat_desc_119=При атаке или ответном огне есть {0}% шанс повергнуть цель в состояние хаоса на 2 хода.
feat_desc_120=При атаке оба ствола выпускают по одному снаряду. Каждый снаряд поражает цель независимо, нанося {1}% от базового урона за попадание.

