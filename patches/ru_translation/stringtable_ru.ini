event_4112=Висло-Одерская операция
event_4113=Битва за Рабаул

event_intro_4111=31 декабря 1942 года в суровых водах Баренцева моря произошло столкновение между британским конвоем и ударной эскадрой немецкого флота. Несмотря на подавляющее превосходство немецких линкоров в огневой мощи, эскорт конвоя, благодаря блестящему маневрированию и вовремя подоспевшему подкреплению, смог защитить транспортные суда, направлявшиеся в СССР. Немцы не смогли потопить ни одного транспорта. Этот провал взбесил Гитлера и привел к отставке главнокомандующего ВМФ Эриха Редера. На его место был назначен Карл Дёниц, и стратегический фокус Кригсмарине полностью сместился на подводную войну.
event_intro_4112=Висло-Одерская операция — колоссальное стратегическое наступление Красной Армии. Учитывая тяжелое положение западных союзников во время битвы в Арденнах, советское командование перенесло дату удара на восемь дней раньше. 12 января 1945 года советские войска обрушились на позиции вермахта с плацдармов на реке Висла. Под командованием маршалов Георгия Жукова и Ивана Конева два советских фронта сокрушили немецкую оборону, освободили Варшаву и Краков и прорвались прямо к сердцу Германии, подготовив плацдарм для решающего штурма Берлина.
event_intro_4113=Битва за Рабаул стала ключевой операцией японских войск по захвату стратегически важного узла в южной части Тихого океана. В начале января 1942 года японские авианосцы начали массированные налеты на Рабаул. 23 января морская пехота успешно высадилась на берег и в короткие сроки захватила город, превратив его в неприступную военно-морскую и авиационную базу. Для союзников потеря Рабаула означала прямую угрозу коммуникациям с Австралией. Японцы же получили важнейший передовой плацдарм, который позволил им развернуть масштабное наступление на Соломоновых островах и Новой Гвинее.

dialogue_4253=Наши подлодки засекли передвижение британского конвоя.
dialogue_4254=Флот разделен на две ударные группы. Отвлекши британский эскорт, мы нанесем сокрушительный удар по транспортным судам.
dialogue_4255=Британские корабли обнаружили немецкую эскадру на северо-западе. Выдвигаемся на перехват. Эскорт ставит дымовую завесу, чтобы прикрыть отход транспортов.
dialogue_4256=Силы немцев на исходе, а наши резервы неисчерпаемы!
dialogue_4257=Немецкая оборона под Варшавой рухнула, они отступают. Продолжайте преследование! Наступать на максимальной скорости!
dialogue_4258=Немецкая группировка в Кракове полностью разгромлена, враг бросил позиции и бежит на запад.
dialogue_4259=У нас абсолютное преимущество. Не дайте австралийским войскам сбежать с острова — перережьте им все пути к эвакуации!
dialogue_4260=Столкнувшись с многократно превосходящими силами японского десанта и острой нехваткой людей, австралийский гарнизон был вынужден отступить на юг.
dialogue_4261=Системы связи модернизированы. Теперь авиация будет быстрее реагировать на запросы сухопутных войск о поддержке.
dialogue_4262=Хотя ситуация на фронте ухудшилась, у нас всё еще есть шанс переломить ход боя.
dialogue_4263=От Ставки получен прямой приказ: немедленно остановить наступление.
dialogue_4264=Перед началом основного удара мы обязаны провести разведку боем.
dialogue_4265=Масштаб этого авианалета даже близко не смог остановить продвижение немецких танков!
dialogue_4266=Откуда только берутся все эти проблемы?
dialogue_4267=Альфред погиб в бою. Ситуация на фронте развивается совсем не так, как мы планировали.
dialogue_4268=Наше поражение неизбежно, но вы заплатите за него кровью!
dialogue_4269=Я еще вернусь.
dialogue_4270=Мы уже взяли армию Роммеля в клещи.
dialogue_4271=Никогда не недооценивайте ярость солдат, защищающих свою родину.
dialogue_4272=Немцы всё еще пытаются оказывать бесполезное сопротивление. Захватить Кан и стереть их линию обороны в порошок!
dialogue_4273=Ваша сила воли и впрямь вызывает уважение.
dialogue_4274=Ради чести наших солдат и ради Германии — мы будем сражаться до конца!
dialogue_4275=Только мы сами можем спасти себя, только мы можем спасти нашу страну.
dialogue_4276=Отвратительная погода сковывает маневры обеих сторон. Если мы хотим выполнить боевую задачу, нужно ускорить темп наступления.
dialogue_4277=Ни один прусский генерал не сдастся в плен!
dialogue_4278=Снежная буря стихла. Начинаем контрнаступление!
dialogue_4279=Снег в Арденнских лесах пробирает до костей. У меня чувство, будто я уже умирал здесь бесчисленное множество раз.
dialogue_4280=Я запомню вас, мои глупые, но благородные враги.
dialogue_4281=Эксперимент Империи Скорпиона в Крепости Солнца завершился успехом.
dialogue_4282=Возможно, однажды до них всё-таки дойдет.
dialogue_4283=Может быть. Но даже в таком случае я всё равно доверяла бы Альфреду.
dialogue_4284=Мы сделаем всё, чтобы обескровить врага прямо здесь и выиграть для вас как можно больше времени.
dialogue_4285=Данные из Крепости Солнца показывают: три усилителя маяков в Южной Америке будут полностью настроены после 10 экспериментальных циклов.
dialogue_4286=Я знал финал с самого начала, и давно выбрал путь, по которому должен пойти.
dialogue_4287=Зараженные постепенно теряют собственную волю и в итоге переходят на сторону Скорпиона.
dialogue_4288=Мы предотвратили катастрофу, но корень проблемы так и не был уничтожен.
dialogue_4289=Я обязан перегруппировать войска и вернуть нашу крепость любой ценой.
dialogue_4290=Крепость Солнца Империи Скорпиона, скрытая в мексиканских руинах, прорвана, а усилитель маяка захвачен. Координаты секретных баз по всему миру полностью раскрыты — Скорпион теперь абсолютно уязвим.
dialogue_4291=Бункер «Эхо» Империи Скорпиона в колумбийских джунглях захвачен, усилитель маяка изъят. База была запрограммирована на самоуничтожение, но уцелевшие логи доступа показали: объект функционировал еще в 1933 году.
dialogue_4292=Око Инков, древние руины Скорпиона в Бразилии, захвачены, усилитель маяка конфискован. Скорпионы не успели уничтожить свои арсеналы, и мы захватили чертежи абсолютно нового, не имеющего аналогов оружия.
dialogue_4293=США и СССР захватили колоссальный объем зашифрованных данных. Личный состав и глобальные дислокации войск Империи Скорпиона теперь как на ладони.
dialogue_4294=Все базы Скорпиона в руинах захвачены, обратный отсчет остановлен. Планы Черного Скорпиона в Южной Америке окончательно разрушены.
dialogue_4295=Осборн полностью разбит, обратный отсчет остановлен. Операции Скорпиона в Южной Америке провалились.

