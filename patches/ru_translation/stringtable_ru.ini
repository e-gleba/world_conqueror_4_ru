dialogue_2543=Американцы атаковали наши десантные силы! Операция «MI» раскрыта!
dialogue_2544=Жребий брошен. Продолжаем действовать по плану.
dialogue_2545=Немедленно атакуйте и уничтожьте основные силы Объединенного флота!
dialogue_2546=Масштаб американского флота и количество их авианосцев превзошли все наши ожидания!
dialogue_2547=Подтверждено потопление вражеского авианосца! Продолжайте преследование!
dialogue_2548=Тихоокеанский флот США был готов к нашему удару. Это катастрофа.
dialogue_2549=Мой флот нанесет удар у Гуадалканала. Десантные силы готовы захватить остров до прибытия японских подкреплений.
dialogue_2550=Американцы высадились на острове! Кораблям сопровождения и подкреплениям — немедленно выдвинуться и отбить Гуадалканал!
dialogue_2551=Американский флот перерезал наши линии снабжения. Если мы продолжим переброску войск, потери будут колоссальными.
dialogue_2552=Американцы атакуют сразу несколько островов! Нам необходимо собрать флот для организации массированного контрудара.
dialogue_2553=Мой флот прибыл! Всем эскадрам: приготовиться к скоординированной атаке, чтобы вышвырнуть японцев с Соломоновых островов!
dialogue_2554=Вражеские подкрепления непрерывным потоком прибывают на Гуадалканал. Укрепите оборону и перехватывайте их конвои прямо в море!
dialogue_2555=Я предприму последнюю попытку прорваться к Порт-Морсби. Поддержите меня и свяжите боем американские подкрепления!
dialogue_2556=Натиск врага усиливается. Боюсь, мои войска долго не продержатся.
dialogue_2557=Японский флот пошел в атаку без прикрытия авианосцев!
dialogue_2558=Мы отбили Кокоду! Японское наступление захлебывается.
dialogue_2559=Враг прорвал нашу линию обороны! Срочно отправляйте подкрепления в Лаэ!
dialogue_2560=Подкрепления прибыли. Начинаем контрнаступление!
dialogue_2561=Приоритетная задача — захват аэродромов на Сайпане. Это наш плацдарм для дальнейших операций.
dialogue_2562=Мы никогда не сдадимся!
dialogue_2563=Мы будем сражаться до последнего вздоха.
dialogue_2564=Наш флот отрежет им связь с остальными японскими базами.
dialogue_2565=Армия США захватила Сайпан и Тиниан.
dialogue_2566=Объединенный флот полностью уничтожен! Наша эскадра обеспечит прикрытие высадке десанта.
dialogue_2567=Наши войска снова на земле Филиппин!
dialogue_2568=Американцы высадились к югу от Лейте! Атакуйте немедленно и отрежьте им пути снабжения с моря.
dialogue_2569=Вражеские сухопутные войска стремительно наступают. Мы обязаны усилить удары с моря, чтобы сорвать высадку их второго эшелона!
dialogue_2570=Продолжайте преследование! Вражеский флот абсолютно беззащитен.
dialogue_2571=Отступаем на север! Выводим основные силы флота из залива Лейте.
dialogue_2572=Опирайтесь на береговые укрепления и не дайте союзникам завершить высадку.
dialogue_2573=Прибыл Британский Тихоокеанский флот. Теперь у нас абсолютное превосходство в воздухе!
dialogue_2574=У нас только одна цель: уничтожить всех до единого защитников острова.
dialogue_2575=В таких условиях эта атака — билет в один конец.
dialogue_2576=Мы потопили «Ямато»!
dialogue_2577=Бой проигран, но мы продолжим атаку и будем сражаться до последнего человека!
dialogue_2578=Концентрируйте огонь и продолжайте давить врага!
dialogue_2579=Вся территория Японии теперь находится в радиусе действия нашей стратегической авиации.
dialogue_2580=Наша главная цель — оккупация Японии и полная капитуляция японского правительства.
dialogue_2581=Японцы все еще сопротивляются! Сровняйте с землей их береговые батареи!
dialogue_2582=Мы обеспечим артиллерийскую и авиационную поддержку десанту.
dialogue_2583=Появились советские войска. Они готовятся к прямой десантной высадке на японские острова.
dialogue_2584=Советские войска начали наступление на севере. Отслеживайте и перехватывайте их десантные конвои.
dialogue_2585=Враг прорывается к Токио! Мои войска немедленно выдвигаются на подмогу.
dialogue_2586=Мы высадимся на восточном и южном побережьях, чтобы растянуть оборону противника.
dialogue_2587=Используйте аэродромы на островах для воздушного прикрытия высадки.
dialogue_2588=Наступление идет лучше, чем ожидалось. Мы сможем взять Мессину раньше британцев.
dialogue_2589=Союзники начали высадку! Срочно бросайте резервы на передовую!
dialogue_2590=Прикажите гарнизону острова немедленно отступать. Моя авиация прикроет их отход.
dialogue_2591=Мы рассекли силы защитников острова. Отрежьте им пути к отступлению и уничтожьте как можно больше живой силы!
dialogue_2592=У нас абсолютное преимущество: на суше, на море и в воздухе. Мы полностью вышвырнем немцев из Италии!
dialogue_2593=Сразу после высадки я начну стремительное наступление на север.
dialogue_2594=Итальянское правительство уже тайно ведет с нами переговоры о капитуляции.
dialogue_2595=Мы перехватили шифровки союзников! Италия просит у них перемирия!
dialogue_2596=Мы достигли соглашения с союзниками. Итальянские части отходят за линию фронта союзных войск.
dialogue_2597=Мы должны быстро взять под контроль крупные города. Нельзя допустить бессмысленного роста потерь.
dialogue_2598=Поддержите десант! Уничтожьте береговые укрепления противника!
dialogue_2599=Десант высадился. Помогите им закрепиться на плацдарме и выбить немцев с побережья.
dialogue_2600=Огромные силы союзников высадились в Нормандии! Срочно организуйте контратаку, чтобы сбросить их в море!
dialogue_2601=Моя артиллерия смешает их десант с песком!
dialogue_2602=Плацдарм удержан! Начинаем наступление на Кан!
dialogue_2603=Наступление идет отлично. Скоро мы освободим Париж!
dialogue_2604=Шербур пал, весь полуостров в руках союзников!
dialogue_2605=Рим сдан! Нельзя позволить союзникам так же легко высадиться в Марселе!
dialogue_2606=Быстро зачистите плацдарм, чтобы подготовить его для высадки следующих эшелонов!
dialogue_2607=Не сбавляйте темп! Наш народ близок к освобождению!
dialogue_2608=Бросайте танковые дивизии на отвоевание Марселя!
dialogue_2609=Держаться больше нет смысла. Немедленно отступаем для перегруппировки!
dialogue_2610=Десантники высадились в заданных точках. Они будут удерживать ключевые мосты до подхода наших основных сил.
dialogue_2611=Этот десант должен быть уничтожен! Мосты через Рейн должны остаться в наших руках любой ценой!
dialogue_2612=Сухопутное наступление захлебнулось! Нас контратакуют немецкие танки!
dialogue_2613=Сдерживайте союзников! Мы должны остановить их основные силы на том берегу Рейна!
dialogue_2614=Десантникам удалось захватить мост через Рейн. Ускорьте продвижение! Они не смогут долго держаться в тылу врага.
dialogue_2615=Акватория порта Антверпен теперь под нашим контролем. Скоро ситуация со снабжением наладится.
dialogue_2616=Воспользуйтесь этой возможностью, чтобы вбить клин между британскими и американскими армиями!
dialogue_2617=Мы не можем позволить немцам разделить наши силы!
dialogue_2618=К союзникам подходят свежие резервы. Нам нужно ускорить наступление!
dialogue_2619=Теперь наша очередь атаковать!
dialogue_2620=Отступаем на Линию Зигфрида! Мы должны перегруппироваться до того, как союзники начнут новую атаку.
dialogue_2621=Продолжайте преследование! Не дайте им уйти!
dialogue_2622=Мы перерезали им снабжение. Победа близка!
dialogue_2623=Соединитесь с советскими войсками и разорвите вражескую оборону на части!
dialogue_2624=Немцы не собираются сдаваться. Продолжайте штурм Берлина, а мои войска зачистят северное направление.
dialogue_2625=Оборона прорвана на всех участках. Войска союзников со всех сторон стягиваются к Берлину.
dialogue_2626=Продолжайте наступление! Уничтожайте все немецкие части, которые продолжают оказывать сопротивление!
dialogue_2627=Мои солдаты будут сражаться до последнего.

general_stage_name_171=Калининская оборонительная операция
general_stage_name_172=Белгородско-Харьковская операция
general_stage_name_173=Битва за Днепр
general_stage_name_174=Висло-Одерская операция
general_stage_name_175=Битва за Берлин
general_stage_intro_171=Калининская оборонительная и наступательная операция — серия сражений Красной Армии в период битвы за Москву. Они не только помогли отстоять столицу, но и обеспечили СССР важнейшее стратегическое преимущество, заложив фундамент для будущих побед под Сталинградом и Курском.
general_stage_intro_172=В августе 1943 года советские войска начали Белгородско-Харьковскую наступательную операцию (операция «Румянцев»). Мощнейшая артподготовка смела немецкие оборонительные рубежи. Яростные контрудары вермахта не смогли остановить продвижение Красной Армии, которая в итоге освободила Харьков.
general_stage_intro_173=Одна из крупнейших военных операций Второй мировой войны. За 4 месяца Красная Армия полностью очистила от немцев Левобережную Украину, сходу форсировала Днепр и захватила плацдармы на его западном берегу. Это подготовило почву для блестящей победы и освобождения Киева.
general_stage_intro_174=Масштабная стратегическая наступательная операция Красной Армии на заключительном этапе войны. Начав наступление 12 января 1945 года, советские войска молниеносно прорвали немецкую оборону в Польше и вышли к границам Германии. Эта операция стала смертельным ударом по вермахту и открыла путь на Берлин.
general_stage_intro_175=После завершения Висло-Одерской операции Красная Армия остановилась всего в 60 километрах от Берлина. В марте немцы разработали отчаянный план обороны столицы, но это не остановило советское командование. В апреле начался грандиозный финальный штурм Берлина.

dialogue_2628=Солдаты, немедленно выдвигаемся на восток. Наша цель — Сталинград!
dialogue_2629=Мы вышвырнем фашистов с нашей Родины!
dialogue_2630=Вражеские фланги ослаблены. Это идеальный момент для сокрушительного контрудара!
dialogue_2631=Товарищ командующий, я лично возглавлю артиллерийский обстрел немецких позиций. На этот раз мы обязаны выбить нацистов из Харькова!
dialogue_2632=Если немецкие танковые резервы возьмут нас в кольцо, мы заплатим за это страшную цену.
dialogue_2633=Морских подкреплений противника недостаточно, чтобы представлять для нас угрозу. Потопите их немедленно, чтобы избежать проблем в будущем.
dialogue_2634=Советские войска вышли к восточному берегу Днепра. Приказ Верховного командования: удержать западный берег любой ценой и не дать им форсировать реку!
dialogue_2635=Вражеский гарнизон слишком силен. Не лезьте на рожон! Закрепитесь на западном берегу и ждите возможности для контратаки.
dialogue_2636=Бессмысленные атаки немцев дорого им обошлись, их силы истощены. Немедленно форсируем реку и захватываем плацдарм на западном берегу!
dialogue_2637=Наступление Советов слишком мощное! Приказываю временно отступить!
dialogue_2638=Остановите их любой ценой! Не дайте им ступить на землю Германии!
dialogue_2639=Солдаты, это великая победа! Мы перенесли войну на территорию Германии. Падение Берлина — лишь вопрос времени!
dialogue_2640=Мы скоординируем действия с южной группировкой и возьмем Берлин в стальные клещи!
dialogue_2641=Враг уже в городе! Рейх на пороге катастрофы. Безопасность Фюрера должна быть обеспечена любой ценой!
dialogue_2642=Берлин пал! Мы стоим на пороге великой Победы в Отечественной войне! Это исторический день.

event_104=Битва при Эль-Аламейне
event_intro_104=Вскоре после начала Второй мировой войны пламя конфликта перекинулось в Северную Африку. Стратегическое значение региона было огромно: он давал контроль над Суэцким каналом — важнейшей артерией между Европой и Азией, а также открывал путь к нефтяным месторождениям Ближнего Востока. В 1940 году Италия атаковала британские войска в Египте, но потерпела позорное поражение. Ситуация кардинально изменилась в следующем году, когда в Африку прибыл немецкий Африканский корпус под командованием Эрвина Роммеля.

dialogue_2643=Слава богу, немецкие союзники полностью развернулись на поле боя. Теперь чаша весов склонится на нашу сторону!
dialogue_2644=Цель войск Оси — прорвать нашу оборону и захватить Александрию. Если им это удастся, вся Северная Африка окажется в их руках. Мы обязаны остановить их!
dialogue_2645=Натиск врага слишком силен, на фронте возник позиционный тупик. Командир, благодаря нашему флоту мы можем рассчитывать на бесперебойное снабжение. Давайте измотаем их в войне на истощение!
dialogue_2646=Уничтожьте морские линии снабжения противника! Не дайте им ни единого шанса на передышку!
dialogue_2647=Линии снабжения сил Оси растянуты до предела. У них уже заканчиваются боеприпасы и топливо.
dialogue_2648=Господин командующий, ведите нас вперед! Мы прорвем слабые итальянские позиции на юге, а затем нанесем удар на север!


