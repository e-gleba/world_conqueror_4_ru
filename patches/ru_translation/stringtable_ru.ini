dialogue_4500=Гарнизон Ванкувера полностью разгромлен, пути снабжения Западного побережья вновь полностью открыты.
dialogue_4501=Начать операцию! Уничтожить советские ракетные базы, развёрнутые по всей Кубе.
dialogue_4502=Наши истребительные соединения уже вылетели с базы. Продолжайте атаку. У нас абсолютное воздушное превосходство.
dialogue_4503=Немедленно выслать подкрепления для возвращения Нью-Йорка. Я же буду оборонять позицию любой ценой до их прибытия.
dialogue_4504=Это тщательно спланированный мятеж! Ни при каких обстоятельствах нельзя дать мятежникам уйти!
dialogue_4505=Подкрепления НАТО прибыли в район операции, имея первоочередной задачей прорыв окружения Гренландии.
dialogue_4506=Идёт аннексия. Компромисс равносилен провалу — а мы не провалимся!
dialogue_4507=Наступление десанта развивается непросто, и мы направили новейшие истребители для немедленной поддержки.
dialogue_4508=На этом притворство заканчивается. Наша главная задача — сдержать продвижение американских войск на север и создать условия для наступления Осборна на восток.
dialogue_4509=Часть войск на передовой в последний момент перешла на сторону противника! Боюсь, канадцам с этими проблемами не справиться, поэтому мы должны сделать всё возможное, чтобы подавить мятеж.
dialogue_4510=Мы получили приказ быстро прийти на помощь Норвегии и перерезать морские пути снабжения Советской армии.
dialogue_4511=Нижние земли захвачены Советской армией, и боюсь, что Западная Германия и Франция долго не продержатся.
dialogue_4512=Вокруг Ленинграда появилось большое количество мятежных сил, и мы на грани полного окружения!
dialogue_4513=Ближайшая угроза нейтрализована. Отбросим все советские силы обратно в Балтийское море.
dialogue_4514=Перекрыть пути отхода советского флота и на полной скорости выдвигаться в акваторию Балтийского моря. Нельзя снова дать Осборну ускользнуть!
dialogue_4515=Разблокирован высший уровень допуска базы. Будущее таит в себе бесконечные возможности, и теперь, даже оставшись в одиночестве, я могу своими руками довести всё это до конца.
dialogue_4516=Мы всё же отстали на один шаг.
dialogue_4517=Не вступать с ним в контакт. Приоритет — захват бункера «Эхо».
dialogue_4518=Как и следовало от вас ожидать. Не верится, что вы сумели зайти так далеко. Теперь остался лишь один вариант.
dialogue_4519=Усилитель маяка вот-вот будет активирован. В результате поражённые постепенно утратят свободу воли, пока в итоге не примкнут к «Чёрному скорпиону».
dialogue_4520=Силы Мартини уже близко к Советской армии. Как можно скорее помогите ей снять осаду. Тем временем Осборн может появиться в любой момент.
dialogue_4521=Мы благодарны за своевременную помощь. Однако из-за вмешательства неизвестных сил опасаемся, что можем проигрывать эту войну.
dialogue_4522=Ситуация в Британии полностью урегулирована, так что теперь мы можем напрямую вмешаться в эту войну.
dialogue_4523=Пересмотреть оперативный план! Уничтожение Осборна — наша главная задача.
dialogue_4524=Трансграничные действия немецкой армии уже угрожают нам. Немедленно наступать на Барселону и остановить там немецкие и итальянские силы.
dialogue_4525=Ни немецко-итальянскому союзу, ни Советскому Союзу нельзя позволить закрепиться здесь. Уничтожить их.
dialogue_4526=Переворот удался. Британские и американские операции были чрезвычайно скрытными: они внедрили сюда множество шпионов и агентов специальных операций.
dialogue_4527=Осборн использует их ресурсы для воплощения своего замысла. Мы не должны допустить дальнейшего усложнения обстановки здесь.
dialogue_4528=Народу не нужен новый король. Силы Осборна должны быть изгнаны.
dialogue_4529=Хотя мы получили приказ отступать, мои силы продолжат вас поддерживать.
dialogue_4530=Операции на юге Ирана прошли исключительно успешно, британо-американские коалиционные силы отошли к Ормузскому проливу. Овайран, мы полагаемся на ваше верное решение.
dialogue_4531=Американские военные уже пронизаны агентурой Осборна, и мы отказываемся безучастно наблюдать за происходящим.
dialogue_4532=Разведуправление недооценило сложность обстановки в регионе. Первоочередная задача — выявить стоящие за этим силы. Отступаем!
dialogue_4533=Дождаться подхода войск Юдинцева и согласовать отход! Мы сдержим советскую атаку.
dialogue_4534=Сосредоточить усилия на уничтожении всех типов пусковых установок, чтобы снизить давление на ПВО при отходе. Мы не можем позволить себе терять здесь людей.
dialogue_4535=В разных регионах обстановка внешне спокойна, однако подспудно зреют скрытые течения. Как только всё распадётся, силы Осборна внутри США и СССР можно будет уничтожить.
dialogue_4536=Кто понимает время — тот мудр, кто приспосабливается к переменам — тот герой. Совершим краткий отход, чтобы собраться с силами. Наша битва только начинается.
dialogue_4537=Советские силы перешли черту, и мы не станем вступать в союз ни с Варшавским договором, ни с НАТО.
dialogue_4538=Разумеется, мы не упустим ни одной возможности уничтожить Осборна.
dialogue_4539=Это очевидно.
dialogue_4540=Внутренние разногласия Восточного блока дали нам шанс.
dialogue_4541=Нет ни вечных друзей, ни вечных врагов. Это наш шанс.
dialogue_4542=Сотрудничество Осборна с американскими военными становится всё теснее, и всё НАТО втягивается в бесконечную войну.
dialogue_4543=Положение на востоке неисправимо, и зачинщиком всего этого хаоса является именно Осборн.
dialogue_4544=Мы достигли соглашения с Новым Калифорнийским альянсом. Перейти в полномасштабное наступление. Эта война должна завершиться быстро.
dialogue_4545=Пора отойти. Мои войска сдержат наступление противника здесь. Как можно скорее положите конец этому хаосу.
dialogue_4546=Никто не превосходит нас в искусстве внезапных налётов.
dialogue_4547=Осборн спешно отступает в направлении Солнечной крепости!
dialogue_4548=Вести непрерывное наблюдение за передвижениями американских сил в Техасе; мы продолжим преследование на юг и уничтожим силы Осборна.
dialogue_4549=Соединённые Штаты не могут позволить себе слабого президента. Проявите инициативу и продвигайтесь к Западному побережью!
dialogue_4550=Всё так знакомо, но на этот раз коротких путей не будет.
dialogue_4551=Войска «Чёрного скорпиона» наступают одновременно с суши и моря. Наше время на исходе.
dialogue_4552=Как и другие базы, район острова Призрак находится под усиленной охраной.
dialogue_4553=Эти бездушные оболочки нам не ровня.
dialogue_4554=Он давно перестал быть тем Осборном, каким был прежде. Наша миссия — положить всему этому конец.
dialogue_4555=Этот кошмар длится слишком долго.
dialogue_4556=Ещё не поздно объединиться с нами и остановить его сейчас.
dialogue_4557=Я не сожалею о прошлых решениях, и прочие члены «Чёрного скорпиона» будут сражаться до конца!
dialogue_4558=Противник обезглавлен и растерян, победа близка. А технологию, породившую все эти события, надлежит запечатать навсегда.
dialogue_4559=Полностью уничтожить оставшиеся силы противника и вернуть антарктическую базу!
dialogue_4560=Управление спутником успешно перехвачено. Спутниковое вооружение приведено в боевую готовность.
dialogue_4561=Иракская армия под прикрытием немецкой авиации предприняла последовательные волны атак на наш лагерь.
dialogue_4562=По возможности избегать ненужных боестолкновений и на полной скорости выдвигаться для деблокады союзных сил в Хаббании.
dialogue_4563=Мы соединились с дружественными войсками. После нейтрализации окрестных угроз продолжили наступление на Эль-Фаллуджу.
dialogue_4564=Противник более не имеет воздушного преимущества.
dialogue_4565=Бомбардировщикам не удалось разрушить мост, и немецкие бронетанковые силы форсируют Маас под прикрытием авиации.
dialogue_4566=Артиллерия и авиация противника нейтрализованы. Полный вперёд!
dialogue_4567=Французская армия отступает. Немедленно прорваться для перехвата главных сил противника.
dialogue_4568=Союзники задействовали значительное количество танков и начали атаку немецких позиций южнее Арраса.
dialogue_4569=Поскольку броню британских танков не пробить, выдвинуть 88-мм орудия в качестве противотанковых пушек!
dialogue_4570=У союзников больше нет достаточных бронетанковых сил для поддержания темпа наступления. Начинаем контратаку!
dialogue_4571=Главные силы 8-го корпуса скованы на фронте. Наступать на Тобрук и отрезать противнику пути отхода.
dialogue_4572=Остриё немецкого наступления уже прорвалось к нам в тыл. Если не отойти сейчас, мы окажемся в полном окружении.
dialogue_4573=Наших нынешних сил недостаточно, чтобы вновь удержать Тобрук. Отходить на восток.
dialogue_4574=Вооружение и техника немецкой армии постепенно прибывают на передовую. Продолжим укреплять оборонительную линию ВКТ до начала советского наступления.
dialogue_4575=Преградить путь отступающим финнам; не дать им уйти на следующий оборонительный рубеж.
dialogue_4576=Выборг успешно взят, однако наше наступление неоднократно застревало у укреплённой линии ВКТ.
dialogue_4577=1 сентября 1939 года, после тайного подписания Советским Союзом и Германией пакта о ненападении, немецкая армия нагло вторглась в Польшу.
