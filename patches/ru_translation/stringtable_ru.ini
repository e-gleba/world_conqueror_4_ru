elite_intro_73=Гранатометчики с РПГ — это пехотные отряды, вооруженные ручными противотанковыми гранатометами (РПГ) и предназначенные для поражения бронетехники или городских укреплений. Их кумулятивные гранаты наносят сокрушительный урон. Благодаря своей портативности и высокой разрушительной силе расчеты РПГ играют важнейшую роль в современной войне.
elite_intro_74=A41 «Центурион» — британский основной боевой танк, разработанный в конце Второй мировой войны и поступивший на вооружение в послевоенный период. Он сочетал в себе передовую конструкцию, систему постановки дымовых завес, мощное орудие и надежную броню. «Центурион» сыграл важную роль в годы холодной войны, принял участие во множестве локальных конфликтов и стал основой бронетанковых сил многих стран.
elite_intro_75=Атомные подводные лодки класса «Тайфун» (проект 941 «Акула») — советские ракетные подводные крейсеры стратегического назначения периода холодной войны и самые большие подводные лодки в истории человечества. В рамках доктрины «гарантированного взаимного уничтожения» субмарина несла баллистические ракеты с разделяющимися ядерными боеголовками, способные поразить цель в любой точке полушария. Двойной композитный корпус обеспечивал ей огромную глубину погружения и невероятную устойчивость к повреждениям.
elite_intro_76=Ми-24 (по классификации НАТО — Hind / «Лань») — советский ударный вертолет. Обладает колоссальной огневой мощью для эффективного уничтожения наземных целей. Отличается высокой маневренностью, что позволяет ему успешно уклоняться от зенитного огня врага. Благодаря выдающимся летно-техническим характеристикам и высочайшей надежности, Ми-24 состоит на вооружении многих стран и отлично показывает себя в самых суровых боевых условиях.

