armygroup_event_desc_247=Танковая армия Варшавского договора нанесла яростный удар по северному берегу Рейна, стремясь прорвать «Рейнский оборонительный пояс» Западной Германии в течение 48 часов. Американские сапёры были вынуждены уничтожить несколько мостов, чтобы замедлить продвижение.
armygroup_event_desc_248=Многонациональный флот НАТО провёл скоординированную противолодочную операцию в Северном море; стороны неоднократно сходились в ближнем бою, повредив несколько советских подводных лодок. Прибрежные города пролива приведены в первую степень боевой готовности.
armygroup_event_desc_249=Уличные бои вспыхнули одновременно в Восточном и Западном Берлине; восточногерманские войска использовали здания и заводы для создания множества огневых точек. Гарнизон Западного Берлина при поддержке американских воздушных поставок предпринял фланговый манёвр с целью прорыва. Берлин стал одной из самых ожесточённых арен сражений на Европейском континенте.
armygroup_event_desc_250=На рассвете советские воздушно-десантные дивизии внезапно атаковали аэропорт к востоку от Брюсселя с целью вывести из строя ключевой узел снабжения НАТО. Бельгийские и нидерландские бронетанковые бригады спешно перешли в контрнаступление; в ходе ожесточённого боя произошёл взрыв части одного из крупнейших в Европе складов боеприпасов.
armygroup_event_desc_251=Советская артиллерия массированным сосредоточенным огнём насытила передовые рубежи Западной Германии, образовав «пояс пепла». Городская инфраструктура Западной Германии понесла тяжёлый урон.
armygroup_event_desc_252=Войска Варшавского договора стремительно перенаправили наступление на юго-запад Чехословакии, нанеся скоростной бронетанковый удар с целью перерезать южную линию снабжения НАТО. Французские и итальянские силы выдвинули части быстрого реагирования в качестве подкрепления.
armygroup_event_desc_253=Авиация НАТО нанесла точечные бомбовые удары по Будапешту — узлу связи Варшавского договора. Венгерская народная армия немедленно задействовала многочисленные средства ПВО. Сотни зенитных ракет осветили ночное небо. В результате весь город был переведён на военное положение в течение двух суток.
armygroup_event_desc_254=Румынский артиллерийский полк совместно с советскими войсками создал глубоко эшелонированную оборону в Карпатах с целью блокировать пути подхода подкреплений из Италии и южной Германии. Горные части НАТО были вынуждены прорываться по крайне труднопроходимым обходным маршрутам; их линии снабжения оказались на грани развала.
armygroup_event_desc_255=НАТО установило блокаду Одессы, стремясь перерезать южные пути снабжения Советского Союза. ОВД нанесло ракетные удары для контрблокадных действий. Траектории ракет были зафиксированы в нескольких точках побережья, что создало колоссальную нагрузку на систему ПВО Одессы.
armygroup_event_desc_256=ВМС Швеции, Дании и Германии совместно блокировали выходы из Балтийского моря. Советский Балтийский флот предпринял попытку одновременного прорыва из Риги и Калининграда, однако был в реальном времени отслежен разведывательной авиацией НАТО, что привело к морским и воздушным столкновениям в обоих районах.
armygroup_event_desc_257=Советская дальняя авиация нанесла массированный ракетный удар по Лондону, вызвав обширные пожары на южном берегу Темзы. Британский военный кабинет срочно приказал привести страну в высшую степень готовности; связь с командным узлом Лондона была кратковременно потеряна.
armygroup_event_desc_258=Манчестер пал, промышленные районы вокруг города были вынуждены остановить производство. В британской оборонной промышленности быстро возник острый дефицит ключевых компонентов, что заставило НАТО срочно задействовать канадские и американские производственные мощности для восполнения нехватки.
armygroup_event_desc_259=Падение Ливерпуля серьёзно ограничило атлантические пути снабжения НАТО. Командование военно-морских перевозок США временно перенаправило маршруты через Исландию, вынудив весь Западный фронт пересмотреть схему снабжения.
armygroup_event_desc_260=Советские ВВС осуществили глубокий прорыв со стороны Балтийского моря, нанеся тяжёлый урон портовым сооружениям Гётеборга. Швеция приведена в высшую степень готовности ПВО.
armygroup_event_desc_261=Копенгаген занят ударной бригадой Варшавского договора, стратегический контроль над Датскими проливами перешёл к Советской армии. НАТО утратило возможность выхода из Балтийского моря.
armygroup_event_desc_262=Ракета Варшавского договора взорвалась над Елисейскими Полями, вызвав мощную ударную волну, прокатившуюся по всему проспекту. Елисейский дворец немедленно потерял всякую внешнюю связь, президент был срочно доставлен в подземный командный центр.
armygroup_event_desc_263=После прорыва штурмовых частей Варшавского договора через окраины Брюсселя над штабом НАТО нависла непосредственная угроза. Для предотвращения утечки разведданных НАТО провело операцию «Ночная», в ходе которой в качестве экстренной меры была уничтожена часть секретных документов.
armygroup_event_desc_264=Порт Роттердама подвергся массированному ракетно-артиллерийскому обстрелу, превратившему множество нефтехранилищ и контейнерных терминалов в огненный ад. Возможности морских перевозок НАТО значительно снизились, что вызвало повсеместные задержки снабжения передовых частей.
armygroup_event_desc_265=Венеция подвергается атаке с моря и с воздуха, ряд исторических кварталов пришлось эвакуировать. Итальянские войска ведут ожесточённый бой, однако с трудом сдерживают бронетанковые силы, наступающие с востока.
armygroup_event_desc_266=С падением Севастополя Черноморский флот был вынужден к полномасштабному отходу на север, в южном оборонительном фланге Советской армии образовалась серьёзная брешь.
armygroup_event_desc_267=Минск пал, центральный опорный пункт Варшавского договора уничтожен. Командование Красной армии начало экстренную эвакуацию, весь Смоленский коридор охвачен паникой.
armygroup_event_desc_268=С занятием Варшавы войсками НАТО польский главный фронт мгновенно рухнул. Основные силы Советской армии и Войска Польского были вынуждены отходить к Бресту, оставив весь западный фланг Варшавского договора открытым под огнём противника.
armygroup_event_desc_269=Киев пал под ударами НАТО, что вынудило несколько советских армий отойти за Днепр для перегруппировки, оставив громадный стратегический вакуум на всём южно-центральном фронте.
armygroup_event_desc_270=Лондон пал. Вся Великобритания переведена на военное положение. С утратой плацдарма в Британии западный фланг НАТО оказался на грани краха, а крушение обороны Ла-Манша нарушило баланс сил в Северном море и Атлантике.
armygroup_event_desc_271=Варшавский договор провёл широкомасштабную операцию радиоэлектронного подавления на Центрально-Европейском фронте, выведя из строя все радары НАТО в радиусе десятков километров.
armygroup_event_desc_272=Исконный геополитический баланс Европы оказался жестоко разрушен. Долго таившийся легион «Чёрный скорпион» сбросил маскировку на северном и южном фронтах. Это хорошо оснащённое вооружённое формирование с загадочным тыловым обеспечением нарушило нейтралитет и насильно вклинилось в линию противостояния США и СССР. Некогда ясный двухполюсный конфликт мгновенно рассыпался, и зона боевых действий окончательно погрузилась в новую, неизведанную и жестокую реальность.
armygroup_event_desc_273=Стратегический баланс на Черноморском побережье резко сместился. Крымский легион «Чёрный скорпион» официально сбросил маскировку, объявив о включении в боевой порядок Южной группы войск Варшавского договора. Прежнее командование береговой обороной полуострова насильственно отстранено, и это загадочное формирование, действуя как союзник СССР, полностью перестраивает черноморскую систему обороны Восточного блока.
armygroup_event_desc_274=Баланс на южной оконечности Европы полностью перекроен внешними силами. Предальпийское подразделение «Чёрный скорпион» завершило обратное проникновение в командную структуру НАТО, войдя в основной боевой порядок под легальным статусом. Незарегистрированные технологии будущего, замаскированные под вооружение эпохи холодной войны, насильно берут под контроль оборонительную матрицу театра, и историческая точка начинает фиксироваться.
armygroup_event_desc_275=По мере продолжающегося расширения Варшавского договора на всех операционных направлениях исходный стратегический баланс на европейском театре полностью разрушен. Легион «Чёрный скорпион» Осборна, развёрнутый во Фьорде Штормов Балтийского моря, официально прекратил нейтралитет и завершил координацию развёртывания с подразделениями «Чёрного скорпиона» в Южной Франции и Крыму для нанесения совместных ударов по тыловым коммуникациям и флангам Варшавского договора.
armygroup_event_desc_276=С непрерывным расширением НАТО на европейском театре региональный стратегический баланс полностью разрушен. Легион «Чёрный скорпион», развёрнутый Осборном во Фьорде Студёных Ветров Балтийского моря, официально прекратил нейтралитет, завершил координацию с силами «Чёрного скорпиона» в Южной Франции и Крыму и совместно перешёл к враждебным действиям против НАТО. Западный блок немедленно оказался под прямой угрозой.
armygroup_event_desc_277=Зафиксировано критическое падение жизненных показателей Осборна, пассивно активирован протокол экстренной телепортации. Будущее, которое Осборн ранее пытался изменить, осталось в своей основе неизменным. Вместо этого две противоборствующие стороны с ещё большей жестокостью погрузились в новую бездну конфронтации, развязав беспрецедентную по масштабу гонку передовых вооружений.
