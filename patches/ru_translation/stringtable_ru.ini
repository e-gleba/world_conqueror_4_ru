event_intro_4107=Советские войска мастерски провели скрытное сосредоточение главных сил, используя строжайшие меры маскировки: переброску войск только ночью и создание ложных позиций. 19 ноября 1942 года СССР начал масштабное наступление на позиции румынских войск, прикрывавших фланги немецкой армии. Оборона была прорвана мгновенно. Немецкое командование недооценило масштабы удара, что позволило советским клиньям с севера и юга соединиться у Калача-на-Дону. В гигантском котле оказались заперты 6-я полевая армия и часть сил 4-й танковой армии вермахта. Эта операция коренным образом изменила ход войны на Восточном фронте.
event_intro_4108=20 ноября 1943 года при поддержке мощного огня корабельной артиллерии и авиации американские войска начали высадку на атолл Тарава. Из-за неожиданно низкого прилива десантные катера сели на рифы, и морпехам пришлось брести до берега по грудь в воде под шквальным пулеметным огнем. Японский гарнизон превратил остров в неприступную крепость, нанеся американцам тяжелейшие потери. Лишь после четырех дней кровавой мясорубки защитники были уничтожены. Эта битва стала жестоким уроком для США: командование осознало критическую важность точного прогнозирования приливов и гидрографической разведки перед высадкой.
event_intro_4109=Стремясь захватить контроль над ресурсами Юго-Восточной Азии и прорвать американское нефтяное эмбарго, 7 декабря 1941 года Императорский флот Японии нанес внезапный удар по военной базе США в Пёрл-Харборе на Гавайях. Авианосное соединение из шести кораблей атаковало двумя волнами, нанеся Тихоокеанскому флоту США катастрофический урон при минимальных потерях для себя. Были потоплены линкоры и уничтожены сотни самолетов, но главная цель — американские авианосцы — уцелели, так как в тот день находились в море. На следующий день США объявили войну Японии, что стало началом Тихоокеанской кампании.
event_intro_4110=Вторгнувшись в Египет, итальянская армия остановила наступление у Сиди-Баррани. Ожидая подкреплений, они окопались и создали сеть укрепленных лагерей. 8 декабря 1940 года британские войска нанесли внезапный удар по этим лагерям. Благодаря строжайшей секретности британцы застали итальянцев врасплох. Оборона рухнула, и в плен сдались десятки тысяч солдат. Успех операции превзошел все ожидания командования. Британцы немедленно развили наступление, превратив локальный рейд в масштабное стратегическое контрнаступление, вошедшее в историю как операция «Компас».

dialogue_4146=Под прикрытием корабельных орудий мы должны во что бы то ни стало высадиться на берег!
dialogue_4147=Прилив оказался слишком низким! Наши катера садятся на рифы, мы не можем подойти ближе к берегу!
dialogue_4148=Японские войска на острове отрезаны друг от друга. У нас абсолютное преимущество. Будьте бдительны и зачистите оставшиеся очаги сопротивления!
dialogue_4149=Японцы пошли в яростную банзай-атаку на наш плацдарм!
dialogue_4150=Ударим по итальянским лагерям, пока они не опомнились!
dialogue_4151=Главные силы британцев вышли из пустыни прямо у нас в тылу!
dialogue_4152=Вражеский фронт рушится! Продолжайте наступление, не давайте им опомниться!
dialogue_4153=Ключевые итальянские форты пали один за другим. Вся их линия обороны трещит по швам.


skill_name_166=Командир экспедиционных сил
skill_name_167=Операция «Оверлорд»
skill_name_168=Теория глубокой операции
skill_name_169=Командир пожарной команды

skill_info_166=При командовании кораблем: +5 к мобильности и иммунитет к эффектам, запрещающим ответный огонь. При командовании любым отрядом: урон от атаки и ответного огня увеличивается на [#00FF00#%d%%] за каждые 3 единицы мобильности.
skill_info_167=Вражеские войска в радиусе 3 клеток получают на 35% больше урона и теряют эффекты наклонной брони, защитных экранов, провокации, маскировки и поддержки. При уничтожении врага кораблем есть шанс [#00FF00#%d%%] атаковать снова.
skill_info_168=При командовании сухопутными войсками: при каждом уничтожении врага в радиусе 3 клеток ваша мораль повышается, и вы получаете эффект «Ударная группа» (наносимый урон увеличивается на [#00FF00#%d%%], эффект складывается до 42%%). Действует до конца боя.
skill_info_169=При уничтожении врага есть шанс [#00FF00#%d%%] атаковать снова. Шанс увеличивается на дополнительные 10% за каждые 200 ОЗ вашего отряда.

promotion_desc_4=Базовые навыки генерала будут сброшены, а все медали, потраченные на их изучение и улучшение, будут возвращены.
army_buff_desc_1591=Ударная группа: наносимый урон увеличен на %d%%
army_buff_desc_1592=Ударная группа: наносимый урон увеличен на %d%%
army_buff_desc_1593=Ударная группа: наносимый урон увеличен на %d%%

dialogue_4121=Четвертое утро. Буря всё еще бушует, и мы все ждем последнего слова: отложить или начинать.
dialogue_4122=Штабные офицеры всё еще спорили о приливах, облачности и фазах луны. Я был единственным, кто понимал, что месяцы изнурительных тренировок вели именно к этому моменту. Колебания командования смертоноснее вражеских снарядов.
dialogue_4123=Да смилуется над нами Господь.
dialogue_4124=Разведка сообщает, что союзные войска не решатся на десантную операцию в таких отвратительных погодных условиях.
dialogue_4125=Сегодня морской туман необычайно густой. ... Погодите, что это сквозь туман? Рыбацкие лодки? Одна лодка, две лодки... О боже, да тут весь океан кишит ими!
dialogue_4126=Это флот союзников! Союзники на подходе! Начать высадку в такую погоду? Они, должно быть, безумцы! Поднять тревогу! Всем занять боевые посты! Немедленно передайте артиллеристам и пулеметчикам занять позиции! Это десант! Они идут на берег!
dialogue_4127=Они думали, что нашли брешь в нашей обороне. Но этот участок, состоящий из мелководья и затопленных низин, — именно та ловушка, которую фельдмаршал приготовил для них заранее.
dialogue_4128=Отлично! Пусть барахтаются в грязной воде! Рейх горячо приветствует их «дух авантюризма».
dialogue_4129=Береговая оборона оказалась жестче, чем мы ожидали. Плотный пулеметный огонь врага превратился в сплошную стальную стену!
dialogue_4130=Я вижу, как мои люди всё еще барахтаются в воде! Немедленно вышлите спасательные катера, чего бы это ни стоило! Я не брошу их тонуть в этом проклятом море!
dialogue_4131=Каждый дюйм этого плацдарма, каждый окоп, каждый бункер — это ключ ко всему европейскому континенту.
dialogue_4132=Свяжитесь с флотом, черт возьми! Нам нужна поддержка с воздуха!
dialogue_4133=Внимание всем частям! Немецкая танковая группа перегруппировывается! Это их последняя попытка контратаки. Именно сейчас решается исход сражения!
dialogue_4134=Они всё лезут и лезут на берег... Бесчисленные суда прибывают волна за волной. Боже мой, они что, сумасшедшие? Наша линия обороны рушится! Мы не сможем продержаться долго! Запрашиваю приказы... Повторяю, запрашиваю приказы!
dialogue_4135=Фельдмаршал Роммель сейчас в Берлине... Никто не может отдать нам приказ, подкреплений не будет. Мы можем рассчитывать только на себя!
dialogue_4136=Фельдмаршал Роммель прибыл на передовую! Теперь наша очередь контратаковать! Ла-Манш станет их братской могилой!
dialogue_4137=Солдаты! Мы обязаны заставить их понять: немецкий солдат может пасть в бою, но он никогда не встанет на колени. Даже если останется только один из нас, они не получат этот берег просто так.
dialogue_4138=Солдаты молятся. Они больше не кричат патриотические лозунги; они просто хотят выжить... Воздух пропитан тошнотворным запахом пороха, солярки, морской воды и горелой плоти.
dialogue_4139=Мы потеряли пляж. Высадка провалилась... Приказываю всем войскам отступить к кораблям. Мы проиграли эту битву, но не проиграли войну. Однажды мы обязательно вернемся.
dialogue_4140=Это была самая фатальная ошибка, которую мы могли совершить... Мы недооценили силу ярости Империи, загнанной в угол и стоящей на краю гибели.
dialogue_4141=Кажется, мы выиграли эту битву. Но я задаюсь вопросом: мы действительно защищаем нашу Родину, или это лишь пустая иллюзия? Бесплодная мечта, давно потерявшая душу? Фюрер чертит границы на картах издалека, но он никогда не видел, как его солдаты гибнут один за другим.
dialogue_4142=Слепое повиновение — инстинкт солдата, но способность мыслить — фундаментальное право человека. Только когда наступит день, в который каждый научится думать самостоятельно, Рейх сможет быть спасен.
dialogue_4143=Я никогда не испытывал ненависти к тем, кто находится по ту сторону прицела. Они тоже чьи-то отцы и сыновья, которых чужие приказы погнали на верную смерть.
dialogue_4144=Пусть эта битва станет не концом нашей войны, а началом возрождения Рейха.
dialogue_4145=Я сдержал свою солдатскую клятву... Ни один враг не ступит ни на дюйм ближе к Берлину.

event_107=Нормандская оборонительная линия
event_intro_107=Летом 1944 года союзники сосредоточили в Британии армаду беспрецедентной мощи. Артиллерия, техника и люди слились в единую стальную волну, готовую обрушиться на противоположный берег Ла-Манша. Немецкие войска, оборонявшие северное побережье Франции, готовились к шторму, который неминуемо должен был разразиться. Солдаты, затаив дыхание, ждали в бетонных бункерах и траншеях среди дюн. Утром 6 июня море у берегов Нормандии покрылось свинцово-серым ковром из тысяч десантных судов, а небо содрогнулось от рева моторов тысяч самолетов. Для немцев это было больше, чем просто оборона рубежа — это была битва с самой судьбой. Под непрекращающимся шквалом огня баланс сил во всей Европе висел на волоске на этих нормандских пляжах, а будущее континента зависело от стойкости немецких солдат в этот «самый длинный день».

dialogue_4154=Это точечная наступательная операция. Наша главная цель — ликвидировать итальянские укрепления в районе Сиди-Баррани и быстро восстановить контроль над береговой линией.
dialogue_4155=Мы успешно захватили Сиди-Баррани и взяли в плен огромное количество итальянских солдат.
dialogue_4156=Развивайте наступление! Итало-ливийские части деморализованы и сдаются целыми полками. Враг абсолютно не готов к сопротивлению. Мы обязаны использовать это преимущество!
dialogue_4157=Всем частям! Бдительно охраняйте береговую линию. Киренаика не должна пасть.
dialogue_4158=Британцы наступают с невероятной яростью. Я не могу допустить, чтобы 10-я армия оказалась заперта в котле в Киренаике. Всем частям: перегруппироваться и готовиться к отступлению из региона.
dialogue_4159=Возможно, нам стоит совершить марш-бросок через пустыню, чтобы перерезать пути отхода бенгазийской группировке итальянцев.
dialogue_4160=Лиса поймана в ловушку посреди открытой местности.
dialogue_4161=Отличная работа! Передайте всем частям: группировка в Бенгази ликвидирована. Бросайте все силы на захват Киренаики!
dialogue_4162=Разгромите войска противника в Западной пустыне, а затем отбросьте их к западу от Тобрука.
dialogue_4163=Форт Капуццо успешно взят.
dialogue_4164=Немецкая армия, грамотно используя 88-мм зенитные орудия и сложный рельеф перевала Хальфайя, успешно остановила наступление британцев.
dialogue_4165=15-я танковая дивизия стремительно выдвинулась на поддержку форта Капуццо, в то время как 5-я легкая дивизия обошла британские позиции, чтобы укрепить оборону перевала Хальфайя.
dialogue_4166=Немцы вот-вот перережут нам пути отхода! Мы не можем позволить взять наши войска в котел. Передайте на передовую: прекратить выполнение задачи и немедленно отступать!
dialogue_4167=Британские войска отбили перевал Хальфайя. Этот важнейший узловой пункт на прибрежном шоссе снова под нашим контролем.
dialogue_4168=Отлично, продолжайте продвигаться по прибрежному шоссе.
dialogue_4169=Внимание всем частям: план операции изменен. Прекратить попытки захвата перевала Хальфайя. Сконцентрировать все силы на окружении и уничтожении вражеской группировки к западу от перевала.
dialogue_4170=В этом бою мы обязаны разбить немецкие войска и снять осаду с Тобрука.
dialogue_4171=Приказываю захватить аэродром Сиди-Резег и ожидать подходящего момента для удара на Тобрук.
dialogue_4172=Аэродром Сиди-Резег захвачен. Гарнизон Тобрука готовится к прорыву навстречу нашим частям.
dialogue_4173=Аэродром Сиди-Резег захвачен. Гарнизон Тобрука готовится к прорыву навстречу нашим частям.
dialogue_4174=Солдаты, держитесь! Подкрепление уже в пути. Мы заставим «Лиса» истечь кровью на этом аэродроме!
dialogue_4175=Британские силы превосходят нас числом. У нас нет выбора: нужно нанести удар им в тыл и заставить их отступить.
dialogue_4176=Внимание, танкистам: обойти с фланга через южную пустыню и войти в Египет. Уничтожить тыловые склады британцев и деблокировать пограничные форты!
dialogue_4177=Мобильные группы срочно выдвигаются к Сиди-Резегу, в то время как основные силы двигаются вдоль побережья в сторону Тобрука.
dialogue_4178=Гарнизон Бардии отступил к Тобруку, усилив кольцо блокады вокруг города.
dialogue_4179=Вся армия действует по плану: на юге мы проводим ложную атаку, чтобы отвлечь внимание врага, а на севере концентрируем ударный кулак для уничтожения их основных сил.
dialogue_4180=В ближайшее время противник может предпринять масштабное наступление. Приказываю строго придерживаться оборонительного плана.
dialogue_4181=Исполняющий обязанности командующего итало-немецким танковым корпусом погиб в бою. Эрвин Роммель экстренно возвращается в Северную Африку, чтобы взять командование на себя.
dialogue_4182=Я восстановил управление танковыми частями. Мы перегруппировываемся на севере и готовимся отбить утраченные позиции.
dialogue_4183=Сдать южный рубеж обороны. Всем войскам организованно отступить к северному побережью.
dialogue_4184=7-я бронетанковая дивизия переброшена на северный фланг, чтобы возглавить главное наступление.
dialogue_4185=Нефтяной танкер потоплен. Армии Оси столкнулись с катастрофической нехваткой горючего.
dialogue_4186=Горючее на исходе, потери огромны. Нам придется отступить, чтобы сохранить хоть какую-то боеспособность.
dialogue_4187=Продолжайте наступление! Выйдите на прибрежные равнины и перережьте линии снабжения противника!
dialogue_4188=Прибрежная равнина уже в поле зрения. Дайте людям передохнуть и готовьтесь к маршу к морю!
dialogue_4189=Бронетанковые части выдвинулись! Линия снабжения на побережье должна оставаться в безопасности!
dialogue_4190=Внезапная песчаная буря накрыла поле боя, лишив обе стороны видимости и сковав маневры.
dialogue_4191=Из-за катастрофической ситуации в Тунисе немецкое командование отозвало Роммеля из Северной Африки. Они боялись, что позорное поражение уничтожит его репутацию непобедимого генерала и подорвет боевой дух на родине.
dialogue_4192=От лица всех оставшихся немецких войск в Африке я объявляю о капитуляции перед войсками союзников.
dialogue_4193=После капитуляции немецкой армии итальянское правительство приказало генералу Мессе сложить оружие.
dialogue_4194=От лица 1-й итальянской армии я сдаюсь войскам союзников.
dialogue_4195=Без предварительной артиллерийской подготовки и бомбардировок немцы ни за что не догадаются, где и когда мы нанесем удар.
dialogue_4196=Мы во всеоружии и готовы встретить вас свинцом.
dialogue_4197=Из-за грубых тактических ошибок генерала Кларка десантные войска оказались в критическом положении.
dialogue_4198=Проклятье! Враг знал о высадке заранее! Немедленно запросите артиллерийскую поддержку флота, чтобы подавить их контратаку!
dialogue_4199=Под плотным прикрытием корабельной артиллерии союзные войска успешно высадились в Салерно.
dialogue_4200=Всем частям: немедленно занять оборону в горной местности и замедлить продвижение противника!
dialogue_4201=Всем подразделениям — отступить на «Зимнюю линию» обороны!

