;新版本对话
dialogue_2281=Финляндия отвергла наши территориальные претензии. Их ждут солдаты с самым современным оружием и железной волей. Эта война быстро завершится триумфом нашей армии.
dialogue_2282=Мы уважаем интересы Советского Союза, но не потерпим посягательств на нашу территорию и суверенитет.
dialogue_2283=Война — это всегда трагедия, но если мы не выйдем на поле боя, кто защитит нашу землю?
dialogue_2284=Ландшафт Финляндии крайне неблагоприятен для наступления. Война не прощает ошибок, вызванных самоуверенностью и безрассудством. Нам необходимо действовать осмотрительно и грамотно руководить войсками. Нельзя недооценивать противника.
dialogue_2285=Финский народ не поддастся давлению и угрозам. Мы будем сражаться за каждый дюйм своей земли.
dialogue_2286=Мы надеялись решить разногласия за столом переговоров, но теперь предпримем все возможные меры для защиты нашей страны.
dialogue_2291=Нападение поляков на немецкую радиостанцию в Глайвице — непростительная провокация. Мы ответим на неё самыми жесткими мерами.
dialogue_2292=Этот инцидент явно срежиссирован немцами. Мы должны быть готовы к полномасштабному вторжению.
dialogue_2293=Спецподразделения «Бранденбург» уже переброшены в тыл врага и поддержат наше наступление.
dialogue_2294=Вражеское командование уничтожено, боевой дух поляков сломлен. Продолжайте наступление, победа близка!
dialogue_2295=В ходе войны с Германией польское государство фактически распалось. В связи с этим все ранее заключенные советско-польские соглашения утратили силу.
dialogue_2296=Советские войска пересекают границу, чтобы взять под защиту этническое население и обеспечить восстановление мирной жизни.
dialogue_2301=Ресурсы и военная инфраструктура стран Бенилюкса представляют угрозу для планов экспансии Рейха. Мы обязаны включить эти территории в состав Империи раньше, чем это сделают Британия и Франция.
dialogue_2302=Прежде чем начать вторжение в Советский Союз, мы обязаны ликвидировать любую угрозу со стороны Западной Европы.
dialogue_2303=Линия Мажино кажется неприступной, но она нас не остановит. Союзникам еще только предстоит познать мощь механизированных войск. Наши танки ударят оттуда, откуда их не ждут.
dialogue_2304=Мы совершенно не ожидали, что основные силы немцев обойдут Линию Мажино и прорвутся через Арденнский лес.
dialogue_2305=Этот внезапный удар не сломит нас. Мы предпримем все возможные меры и будем сдерживать немецкое наступление до последней капли крови.
dialogue_2306=Наше наступление в Арденнах столкнулось с неожиданно жестким сопротивлением. Необходимо менять тактику и атаковать сразу с нескольких направлений!
dialogue_2307=Мы пережили слишком много страданий и потеряли так много близких. Но мы не имеем права сдаваться. Мы должны продолжать борьбу. Победа уже близка.
dialogue_2308=Армии вторжения в Советский Союз развернуты. Мы, группа армий «Центр», должны выиграть первую битву и взять Минск стремительным ударом!
dialogue_2309=Немецкие войска вторглись на советскую территорию, вероломно нарушив пакт Молотова-Риббентропа. Я уже слышу рев их танков! Срочно организуйте оборону по всему фронту!
dialogue_2310=Немецкое наступление на СССР набирает обороты. Финляндия должна воспользоваться моментом и вернуть себе Карельский перешеек.
dialogue_2311=Немецкие части поддержат наше наступление на южном направлении.
dialogue_2312=Аэродром на Ладожском озере охраняется слабо. Это наш шанс.
dialogue_2313=Взятие Минска в очередной раз доказало эффективность блицкрига. Враг не в силах остановить наши танковые клинья.
dialogue_2314=Враг не должен сделать ни шагу вперед. Смоленск нужно удержать любой ценой!
dialogue_2315=Хотя силы противника многочисленны, они дезорганизованы и не способны к активным действиям.
dialogue_2316=Киев — это ключ к Кавказу. Используйте танковые клинья, чтобы взять город в котел!
dialogue_2317=Ленинград сильно укреплен. Нам нужно взять его в плотное кольцо и планомерно сжимать осаду.
dialogue_2318=На севере к нашему наступлению присоединится финская армия.
dialogue_2319=Советы наладили постоянное снабжение Ленинграда по льду Ладожского озера. Это недопустимо!
dialogue_2320=Перережьте их линии снабжения и уничтожьте конвои!
dialogue_2321=Плохие новости: танки переброшены на другой участок. В нашем распоряжении только пехота и артиллерия.
dialogue_2322=Хорошие новости: для огневой поддержки прибыло сверхтяжелое орудие «Дора».
dialogue_2323=Пусть Севастополь содрогнется от попаданий 800-мм снарядов! Огонь!
dialogue_2324=Мы должны захватить Харьков до того, как противник успеет эвакуировать заводское оборудование!
dialogue_2325=Остерегайтесь вражеских реактивных минометов. Их огонь на подавление наносит нам колоссальные потери.
dialogue_2326=Противник стянул к Москве более миллиона солдат. Такая численность в сочетании с суровой зимой представляет для нас смертельную угрозу.
dialogue_2327=Успех всей операции «Барбаросса» зависит от исхода этой битвы!
dialogue_2328=В бинокль я уже вижу красные звезды на башнях Кремля.
dialogue_2329=Нам нечего терять и отступать некуда. Это битва за само существование Советского Союза!
dialogue_2330=Промышленность и ресурсы Сталинграда критически важны для нас. Приказ командования: город должен быть взят!
dialogue_2331=Мы не имеем права сдать этот величественный город.
dialogue_2332=Наступайте на юг и соединитесь с нашей западной группировкой.
dialogue_2333=Командир, как только мы уничтожим советскую армию, вся Польша окажется под нашим контролем.
dialogue_2334=Господин командующий, их оборона дезорганизована. Мы начнем атаку, обойдя их позиции с юга.
dialogue_2335=Курс на Париж! Никаких остановок!
dialogue_2336=Мы пройдем победным маршем по улицам Парижа!
dialogue_2337=Не отступать! Держите позиции, мы обязательно захватим город.
dialogue_2338=Господин командующий, начинайте наступление с юга. Союзные войска на севере помогут нам замкнуть кольцо вокруг Курска.
dialogue_2339=Господин командующий, возглавьте армию и удержите город. Не дайте советам прорваться.
dialogue_2340=Они не пощадят никого. В плен сдаваться бессмысленно.
dialogue_2341=Врагов слишком много, мы больше не сможем удерживать рубежи.
dialogue_2342=Будапешт вот-вот падет. Господин командующий, организуйте отступление и эвакуацию. Нельзя позволить советским войскам отрезать нам пути отхода.
dialogue_2343=Командир, британские войска высадятся на востоке, чтобы поддержать наступление. Вместе мы ударим по Тунису и вышвырнем нацистов из Африки!
dialogue_2344=Враг истощен. Настал идеальный момент для высадки на Сицилии.
dialogue_2345=Сицилия под нашим контролем. Мы взяли врага за горло. Это блестящая победа!
dialogue_2346=Мы готовились к этому более двух лет. Господин командующий, возглавьте высадку союзников на пляжах Нормандии и захватите плацдарм.
dialogue_2347=Атакуйте! Сбросьте их в море! Не дайте союзникам закрепиться на берегу!
dialogue_2348=Филиппины имеют стратегическое значение. План: высадка и штурм Лусона. Генерал Макартур будет сражаться плечом к плечу с вами. Захватите остров, верните Филиппины и подорвите господство Японии в Тихом океане.
dialogue_2349=Столица Манила уже в наших руках. Господин командующий, избегайте неоправданного риска и продолжайте зачистку оставшихся японских сил.
dialogue_2350=Взрывайте мосты и минируйте дороги, чтобы замедлить продвижение американской армии.
dialogue_2351=Немцев в разы меньше, они обречены. Давайте покончим с этим как можно быстрее.
dialogue_2352=Это катастрофа. Авангард действовал слишком самоуверенно и был разбит. Господин командующий, вы должны исправить ситуацию.
dialogue_2353=Третий Рейх не остановить! Солдаты, вперед! Наша цель — Москва!
dialogue_2354=Нацисты осмелились посягнуть на Москву. Они умоются кровью за свою дерзость. Товарищ командир, ведите народ на защиту столицы.
dialogue_2355=Миф о непобедимости немецкого блицкрига сейчас рухнет. Победа будет за Советским Союзом!
dialogue_2356=Мы одержали победу, но цена её колоссальна. Никогда не забывайте советских солдат, отдавших жизни за Родину.
dialogue_2357=Товарищ командир, организуйте оборону и остановите немецкое наступление.
dialogue_2358=Внимание! Немецкие танковые клинья заходят с севера! Бросайте все резервы на удержание оборонительных рубежей.
dialogue_2359=Прозвучал сигнал к контрнаступлению. Преследуйте и уничтожайте отступающих немцев!
dialogue_2360=Товарищ командир, вы поведете нас в бой за освобождение советской земли. Это начало великого контрнаступления против нацистской Германии!
dialogue_2361=Белоруссия освобождена. Мы одержали великую победу! Продолжаем преследование врага и возвращаем наши западные территории.
dialogue_2362=Мы входим в Берлин, господин командующий. Американские и британские войска поддержат наш штурм.
dialogue_2363=Мы обязаны не допустить их в Берлин любой ценой. Фюрер должен быть под надежной защитой!
dialogue_2364=Германия пала. Пора ставить точку в этой войне.
dialogue_2365=Врагу некуда отступать, здесь они найдут свой конец.
dialogue_2366=Солдаты, держитесь! Подкрепление уже в пути.
dialogue_2367=Сконцентрируйте огонь на наступающих частях, не дайте им перехватить инициативу!
dialogue_2368=Британцы превосходят нас числом, но их атаки неуклюжи и предсказуемы.
dialogue_2369=Перегруппируйте силы и нанесите внезапный удар с флангов и с тыла! Раздавите их!
dialogue_2370=Британская линия обороны тянется на юг от побережья Эль-Газалы. Фронтальная атака с запада приведет к огромным потерям.
dialogue_2371=Это немецкие танки! Как они оказались у нас в тылу?!
dialogue_2372=Тобрук пал! Всем частям — отступать!
dialogue_2373=Выдвигайтесь на Каир, господин командующий. Помогите нам захватить Египет до подхода союзных резервов.
dialogue_2374=Солдаты, сейчас решается всё! Верьте в свои силы, и мы разгромим врага!
dialogue_2375=Командир, ведите нас на прорыв британского окружения!
dialogue_2376=К врагу непрерывно подходят подкрепления и боеприпасы. Мы в критической ситуации!
dialogue_2377=Третий Рейх обязательно нанесет ответный удар!



;关卡介绍
event_intro_101=Финляндия 10 лет строила линию Маннергейма — мощную систему укреплений на Карельском перешейке. Несколько оборонительных рубежей были грамотно вписаны в естественные преграды: болота и озера. На линии было возведено множество ДОТов и ДЗОТов (дерево-земляных огневых точек). Опираясь на эту систему, финские войска были готовы дать жесткий отпор любому врагу, осмелившемуся вторгнуться на их землю.
event_intro_102=Возвышение Германии вызвало тревогу во всей Европе, а ее неуемная территориальная экспансия сделала большую войну неизбежной. Из-за своей протяженной границы Польша стала первой целью. Однако поляки не спешили паниковать, полагаясь на твердые гарантии поддержки со стороны Великобритании и Франции. Вот только была ли Германия единственной страной, имеющей виды на Польшу?
event_intro_103=Линия Мажино, обошедшаяся Франции в миллиарды франков, могла выдержать массированные авианалеты и обстрелы из крупнокалиберной артиллерии. Но рискнет ли немецкое командование штурмовать этот оборонительный рубеж в лоб? Или предпочтет обойти его и нанести удар через Нидерланды? А может, у вермахта есть совершенно иной план?
event_stage_intro_20101=Западная Европа оказалась под контролем Германии. Верховное командование утвердило план «Барбаросса» и переключило свое внимание на Советский Союз. Нашей первой целью стал Минск. Его захват нанесет серьезный удар по СССР и значительно поднимет боевой дух наших войск.
event_stage_intro_20102=Масштабное вторжение немецкой армии в Советский Союз — отличный шанс для Финляндии. Мы проведем совместную операцию с вермахтом и начнем наступление к северу от Ленинграда, чтобы вернуть территории, утраченные во время Зимней войны.
event_stage_intro_20103=Успех под Минском застал СССР врасплох и в очередной раз доказал эффективность блицкрига. Наши танки не должны останавливаться! Захват Смоленска даст нам контроль над важнейшим транспортным узлом и стратегическим плацдармом, что обеспечит бесперебойную логистику для дальнейшего наступления.
event_stage_intro_20104=Украина — это житница и важнейший промышленный центр Советского Союза. Контроль над Киевом даст нам доступ к колоссальным ресурсам. Наши танковые клинья должны замкнуть кольцо окружения вокруг города и окончательно обрушить советскую оборону на юге.
event_stage_intro_20105=Ленинград — это не только важнейший советский порт на Балтике, но и крупный экономический, исторический и культурный центр СССР. Падение Ленинграда не только пробьет брешь в советской обороне, но и нанесет сокрушительный удар по моральному духу всей страны.
event_stage_intro_20106=Крым — жемчужина Черного моря, имеющая огромное стратегическое значение. Наши танковые дивизии были переброшены в группу армий «Центр», поэтому сейчас мы располагаем только пехотой и артиллерией. Однако прибытие сверхтяжелого орудия «Толстый Густав» поможет нам взломать неприступные форты Севастополя.
event_stage_intro_20107=Наше наступление не остановить. Харьков — важнейший индустриальный узел, и мы обязаны нарастить темп продвижения. Нельзя позволить Советам эвакуировать заводы и оборудование до того, как мы возьмем город штурмом.
event_stage_intro_20108=Брянск и Вязьма — последние рубежи на пути к Москве. Нам необходимо сокрушить оборону противника и выйти на оперативный простор, чтобы подготовить плацдарм для решающего броска на советскую столицу.
event_stage_intro_20109=Сталинград на Волге — это крупнейший промышленный узел и ворота к кавказской нефти. Враг стянул для его защиты огромные силы. Только взятие Сталинграда способно окончательно деморализовать Советский Союз и проложить нам путь к триумфу на Восточном фронте.
event_stage_intro_20110=Суровая московская зима серьезно осложнила логистику и подвоз припасов. Сопротивление врага стало гораздо более ожесточенным, чем в начале кампании. Но это не остановит наше победоносное продвижение. Совсем скоро мы откроем победное шампанское прямо в Кремле.
event_stage_intro_20111=Западная Европа оказалась под контролем Германии. Верховное командование утвердило план «Барбаросса» и переключило свое внимание на Советский Союз. Нашей первой целью стал Минск. Его захват нанесет серьезный удар по СССР и значительно поднимет боевой дух наших войск.
event_stage_intro_20112=Масштабное вторжение немецкой армии в Советский Союз — отличный шанс для Финляндии. Мы проведем совместную операцию с вермахтом и начнем наступление к северу от Ленинграда, чтобы вернуть территории, утраченные во время Зимней войны.
event_stage_intro_20113=Успех под Минском застал Советы врасплох и в очередной раз доказал эффективность блицкрига. Наши танки не должны останавливаться! Захват Смоленска даст нам контроль над важнейшим транспортным узлом и стратегическим плацдармом, что обеспечит бесперебойную логистику для дальнейшего наступления.
event_stage_intro_20114=Украина — это житница и важнейший промышленный центр Советского Союза. Контроль над Киевом даст нам доступ к колоссальным ресурсам. Наши танковые клинья должны замкнуть кольцо окружения вокруг города и окончательно обрушить советскую оборону на юге.
event_stage_intro_20115=Ленинград — это не только важнейший советский порт на Балтике, но и крупный экономический, исторический и культурный центр СССР. Падение Ленинграда не только пробьет брешь в советской обороне, но и нанесет сокрушительный удар по моральному духу всей страны.
