event_buff_name_27=Радиация
event_buff_name_28=Воодушевление
event_buff_name_29=Прикрытие

event_buff_desc_27=При атаке есть 30% шанс наложить эффект Радиации на клетку цели (длится 2 хода). Войска, находящиеся на зараженной клетке, каждый ход теряют 10% от своего текущего запаса ОЗ.
event_buff_desc_28=Если отряд не окружен, в начале каждого хода он с вероятностью 80% снимает с себя негативные эффекты «Хаос» и «Падение духа».
event_buff_desc_29=После атаки отряд под командованием генерала с вероятностью 20% накладывает на все союзные войска в радиусе 1 клетки эффект Защиты, блокирующий урон от атак наземных и морских сил противника в течение 1 хода.

event_stage_intro_20501=Война никогда не меняется. Действия армии США в очередной раз нарушили хрупкий баланс на Корейском полуострове. Враг пересек границу, и мы обязаны нейтрализовать эту угрозу. Срочно отправляйте войска на помощь союзникам! Используйте наше новейшее оружие и заставьте врага дорого заплатить за свою безрассудность!
event_stage_intro_20502=США объединили силы с Японией, чтобы взять под контроль акваторию вокруг Советской Гавани и южного Сахалина. Мы недооценили их готовность к вторжению, но они в корне недооценили нашу мощь. Каждый, кто осмелится бросить вызов Великой Родине, будет уничтожен!
event_stage_intro_20503=Амбиции Соединенных Штатов теперь очевидны всем. Предвидя их экспансию, мы заранее развернули силы обороны в районе Курильских островов. Используйте эту возможность, чтобы нанести сокрушительный удар по их базам на севере Японии.
event_stage_intro_20504=Войска США атаковали южную часть полуострова Камчатка со стороны Алеутских островов, где проходит граница между нашими странами. Командование уже разработало план вторжения на Аляску, и мы не позволим американцам сорвать его этой внезапной атакой.
event_stage_intro_20505=По данным разведки, армия США разрабатывает ядерное оружие повышенной мощности и даже планирует применить его для создания глубоководного порта на Аляске. Наша текущая цель — исследовательский центр в Анкоридже. Этот район должен быть взят под наш полный контроль до того, как враг успеет эвакуировать персонал.
event_stage_intro_20506=Защитники Анкориджа сражаются с отчаянием обреченных. Прорвать американскую оборону с ходу не удастся. Внимательно следите за маневрами врага. Параллельно нанесите глубокий обходящий удар, возьмите их в клещи с трех сторон и отрежьте пути к отступлению!
event_stage_intro_20507=Армия США отступает под натиском наших войск. Хотя мы прорываем один рубеж обороны за другим, враг выигрывает время для стягивания резервов к Западному побережью. Грядет решающая битва. Любые преграды на нашем пути будут сметены!
event_stage_intro_20511=Война никогда не меняется. Действия армии США в очередной раз нарушили хрупкий баланс на Корейском полуострове. Враг пересек границу, и мы обязаны нейтрализовать эту угрозу. Срочно отправляйте войска на помощь союзникам! Используйте наше новейшее оружие и заставьте врага дорого заплатить за свою безрассудность!
