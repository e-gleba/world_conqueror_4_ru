eliteskin_intro_58_1=Когда вопль разрывает воздух, разум врага поглощает страх.
eliteskin_intro_49_1=Тишина — не милость, а последняя учтивость охотника к добыче.
eliteskin_intro_53_1=Одни звуки рассеиваются ветром, другим суждено звучать сквозь время.
eliteskin_intro_100_1=Не всякий свет пронзает тьму.
eliteskin_intro_70_1=У иных путей нет конца, ибо ответ — в самом поиске.
eliteskin_intro_61_1=Сумерки ложатся на океан, но не скрывают дальний курс.
dialogue_4593=По данным разведки, к юго-востоку расположен японский запасной аэродром. Сначала выведем его из строя, чтобы не дать противнику мешать нашему продвижению с воздуха.
dialogue_4594=Японские силы получили разведданные и спешно направили подкрепления на полуостров Уилломец. Обеспечить беспрепятственную эвакуацию западной группировки.
dialogue_4595=Отлично! Теперь у противника нет поблизости пригодных аэродромов. Полным ходом на юг! Нельзя дать им уйти!
dialogue_4596=Большая часть японских сил с западного направления уже отошла на восточную сторону полуострова Уилломец, сорвав первоначальные замыслы американского командования.
dialogue_4597=Новый приказ штаба: прекратить перехват и занять полуостров Уилломец, чтобы ограничить район действий японских сил.
dialogue_4598=Японская армия вновь нарастила подкрепления, поклявшись обеспечить отход главных сил.
dialogue_4599=Огневая поддержка корабельной артиллерии завершена. Десант может выдвигаться.
dialogue_4600=Как тихо. На побережье почти нет вражеских позиций. Какая разительная перемена по сравнению с прошлым.
dialogue_4601=Хм... возможно, на этот раз обстрел был более основательным, и всё обращено в пепел?
dialogue_4602=Японские войска выходят из подземных укрытий и немедленно обрушивают яростную контратаку на американский десант.
dialogue_4603=Откуда ведётся этот обстрел? Разве они не должны были все погибнуть? Противник атакует! В укрытие!
dialogue_4604=Нет, при таком темпе потерь нам одним не взять этот остров. Нужны подкрепления!
dialogue_4605=81-я пехотная дивизия на позиции. В первую очередь эвакуировать раненых. 1-я дивизия морской пехоты понесла тяжелейшие потери!
dialogue_4606=Обстрел побережья завершён, подготовка к высадке закончена. Сухопутные войска могут выдвигаться.
dialogue_4607=Эта редкая линия обороны... почему это так знакомо? Берегись засады, ребята!
dialogue_4608=Я так и знал! Будьте начеку, парни! Вернёмся домой живыми!
dialogue_4609=Большая часть японской обороны на Окинаве захвачена.
dialogue_4610=Началась операция «Кикусуй I», американские силы успешно потопили «Ямато».
dialogue_4611=Замок Наха эвакуирован. Сохраняйте повышенную боеготовность! Они наверняка готовятся дать последний бой на тыловых рубежах!
dialogue_4612=Японский командный центр уничтожен, наступление временно приостановлено.
dialogue_4613=Северная Окинава полностью захвачена. Американские силы с севера вскоре направятся на юг для усиления.
dialogue_4614=Боевая задача: освободить город Кувейт и захватить международный аэропорт Кувейта. Уничтожить все силы противника на пути.
dialogue_4615=Кувейт успешно освобождён. Далее — зачистка оставшихся иракских сил в Кувейте и обеспечение безопасности нефтяных месторождений.
dialogue_4616=Потерпев поражение от коалиционных сил, Ирак планировал поджечь кувейтские нефтяные скважины перед отводом войск из страны.
dialogue_4617=Сообщение из штаба: противник планомерно поджигает нефтяные месторождения. Мы должны действовать быстрее.
dialogue_4618=Итак, все, флот, возможно, попытается эвакуировать нас морем, но для этого мы должны действовать сообща.
dialogue_4619=Итак, первоочередное — дисциплина. Занять позиции вокруг Сен-Валери. Мы удержим восточный и западный фланги, французы прикроют юг.
dialogue_4620=Сэр, мы перерезали дорогу на Гавр.
dialogue_4621=Отлично. Теперь атакуйте Сен-Валери и уничтожьте окружённого противника.
dialogue_4622=Морские транспорты подошли к берегу, началась эвакуация. Немецкие силы также направили бомбардировщики для ударов по транспортам. Эвакуация шла с огромными трудностями.
dialogue_4623=Исчерпав боеприпасы и припасы и утратив возможность эвакуации, французские войска капитулировали перед немцами раньше англичан.
dialogue_4624=Чёрт возьми! Немедленно вернуть порт. Но если не удастся... сдаваться ли? Надо всё обдумать.
dialogue_4625=Довольно, всё кончено. Радируйте немцам, мы согласны на капитуляцию.
dialogue_4626=Преодолеть минное поле и закрепиться! Контратака противника будет яростной, но вы должны продержаться до подхода бронетанковых сил.
dialogue_4627=Довести до передовых позиций: прочно удерживать передовые рубежи и всеми силами препятствовать разминированию противника. Ни в коем случае не допустить прохода вражеских бронетанковых сил через минное поле.
dialogue_4628=Верховный командующий немецкими силами у Эль-Аламейна скоропостижно скончался от сердечного приступа, и Берлин срочно направил Роммеля обратно на фронт для принятия командования.
dialogue_4629=Проход в минном поле расчищен. Бронетанковые силы, вперёд — прорвать оборону противника.
dialogue_4630=Я добился от Рима пополнения боеприпасов и топлива, так что снабжение пока обеспечено.
dialogue_4631=Судя по текущей обстановке, следующий удар противника будет нанесён на севере. Мы должны перехватить инициативу и уничтожить их плацдарм, подготовленный для наступления.
dialogue_4632=Донесение в Берлин: наши силы полностью истощены и не способны оказать эффективного сопротивления следующему прорыву противника. Продолжение боя грозит полным уничтожением.
dialogue_4633=Ответ Берлина: удерживать позиции и бросить в бой всю артиллерию и личный состав.
dialogue_4634=Вы требуете невозможного!
dialogue_4635=Приказы верховного командования больше не следует исполнять. Надо спасать то, что ещё можно спасти.
dialogue_4636=После высадки все части должны стремительно наступать на север для освобождения Катании, первоочередная задача — захват аэропорта Катании.
dialogue_4637=В полной мере использовать горную местность для манёвра против противника. Штаб не оставит Сицилию, подкрепления непременно прибудут.
dialogue_4638=Немецкие подкрепления прибыли на Сицилию.
dialogue_4639=Всеми средствами замедлять продвижение противника и держать путь на Мессину открытым.
dialogue_4640=Продолжать наступление на север. Мы должны взять Мессину раньше янки.
dialogue_4641=После поражения в Сицилийской кампании в Риме вспыхнул переворот, и командование Оси пребывает в нерешительности.
dialogue_4642=Сражение за Сицилию, как ожидается, завершится поражением, поэтому я должен заранее подготовить эвакуацию.
dialogue_4643=Наши силы полностью освободили западную Сицилию. Теперь необходимо согласовать штурм Мессины, чтобы отрезать Оси пути отхода.
dialogue_4644=Всем частям — огневой вал! Мы должны сокрушить оборону противника сегодня.
dialogue_4645=Передовым частям — уплотнить рубеж! Мы должны удержать противника севернее Фалеза!
dialogue_4646=Продолжать наступление на Фалез, в авангарде — бронетанковые части, отрезать пути отхода противника, пока он не опомнился.
dialogue_4647=Нельзя допустить дальнейшего продвижения союзников. Если они возьмут Фалез, последствия будут немыслимыми.
dialogue_4648=12-я дивизия СС стремительно выдвинулась на север, чтобы любой ценой не допустить продвижения противника на юг.
dialogue_4649=Они станут лишь очередным рядом зон поражения в стволе моего «Тигра».
dialogue_4650=Виттман уничтожен. Легенда танкового аса завершилась здесь.
dialogue_4651=Немцы восстановили оборонительные рубежи у Фалеза. Шансы взять Фалез силами одного этого сражения невелики.
dialogue_4652=Операция начинается! Американские силы совместно с нами окружат противника с юга. В этом сражении мы должны уничтожить немецкие силы к западу от Рейна!
dialogue_4653=Как и ожидалось, противник избрал направление удара через самый северный слабый участок линии Зигфрида.
dialogue_4654=Ввести в действие запасной план: открыть дамбы на Руре, чтобы остановить американское наступление. Гарнизонным частям — всеми силами сдерживать противника на севере.
dialogue_4655=Немцы открыли дамбы на Руре, вызвав резкий подъём уровня воды. Американская операция «Гренада» была вынужденно отложена.
dialogue_4656=Получено донесение: немецкие силы перерезали американский маршрут продвижения. Передовым частям готовиться к отражению вражеских подкреплений.
dialogue_4657=Выдвигайтесь на юг для усиления войск на участке Гоха.
dialogue_4658=После перегруппировки продолжить движение на юг и подготовиться к окружению противника совместно с американскими силами.
dialogue_4659=Самый северный участок линии Зигфрида всё же прорван. Радируйте в Берлин: необходимо отойти на восточный берег Рейна и обороняться вдоль реки.
dialogue_4660=Ответ Берлина: использовать период несогласованности в действиях противника для нанесения удара. Отступление лишь отсрочит неизбежное сражение.
dialogue_4661=Он вообще понимает обстановку на фронте? Как это вообще возможно?
dialogue_4662=Артиллерийская подготовка началась. Всем частям — ускорить форсирование реки.
dialogue_4663=Противник начал переправу! Всем оборонительным рубежам — к бою!
dialogue_4664=Переправившиеся части успешно создали первый плацдарм.
dialogue_4665=Связаться с соседними частями, проникать в глубину обороны противника и перерезать его коммуникации.
dialogue_4666=Резерв, вперёд. Зачистить плацдарм противника и сохранить целостность оборонительного рубежа.
dialogue_4667=Успешное соединение с парашютистами. Воздушно-десантное подразделение будет действовать совместно с нашими силами.
dialogue_4668=Воздушно-десантные силы на позициях, узлы связи противника уничтожены. Всем частям — приготовиться к поддержке.
army_buff_desc_1751=Бдительность: снижает получаемый урон на 40% при атаке противника; исчезает после получения удара.
army_buff_desc_1761=Атака: атака +20%, исчезает после нанесения удара.
army_buff_desc_1771=Манёвр прикрытия: защита +%d%%, мобильность +%d%%.
army_buff_desc_1781=Штурмовое прикрытие: если после атаки не получен ответный удар, накладывает на цель усиление «Поспешный ответ» на 1 ход.
army_buff_desc_1791=Поспешный ответ: атака снижена на %d%%.
