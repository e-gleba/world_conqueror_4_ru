card_desc_10=Улучшает ракетную шахту на 1 уровень.
card_desc_11=Улучшает порт на 1 уровень.
card_desc_12=Улучшает город на 1 уровень.
card_desc_13=Использует орбитальное оружие для нанесения удара.
card_desc_14=Блокирует использование любых стратегий противником на 2 хода.
card_desc_15=Выберите вражеский город и заблокируйте производство любых ресурсов в нём на 2 хода.
card_desc_16=Все бонусы от заводов, институтов и складов снабжения увеличиваются на 20%. Эффект длится 2 хода.
card_desc_17=Найм следующего отряда подкрепления будет стоить на 8 очков заслуг меньше, но его начальный боевой дух будет сильно снижен.
card_desc_18=Выберите вражескую цель и временно отключите эффекты её дымовой завесы и уклонения на 1 ход.
card_desc_19=Берет под ваш контроль выбранный вражеский элитный отряд (до 9 уровня), в котором нет генерала.
card_desc_20=В этом ходу получаемые очки заслуг удваиваются.
card_desc_21=Улучшает аэропорт на 1 уровень.


