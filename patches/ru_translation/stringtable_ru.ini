;; Боевые инструктажи
;__font_type[font_text_1,font_text_2]
dialogue_1001=Товарищ командующий, краткий инструктаж перед вашим первым боем.
dialogue_1002=Белый круг под соединением — готовность к действию. Ход не израсходован.
dialogue_1003=При выборе соединения: мигающие клетки — зона марша, красные кольца — цели в зоне поражения. Осторожно: мины отнимают ОЗ при движении.
dialogue_1004=Тип доступных войск зависит от здания. Чем выше уровень — тем мощнее соединения на выходе.
dialogue_1005=Соединение включает от 1 до 4 отрядов. Больше стволов — выше огневая мощь.
dialogue_1006=Назначьте командира соединению — его навыки резко повысят боеспособность войск.
dialogue_1007=Ошибка в манёвре? Немедленно отмените — отряд вернётся на исходную.
dialogue_1008=Внимание: стратегический объект. Кто его удержит — тот решит исход сражения.
dialogue_1009=Завершить ход — кнопка с песочными часами, правый нижний угол.
dialogue_1010=Командующий, карта перед вами. Время завоёвывать.
dialogue_1011=Товарищ командующий, дополнительная тактическая сводка.
dialogue_1012=Боевой дух — хребет армии. Окружение и фланговый удар ломают его мгновенно.
dialogue_1013=Отряд в панике (Хаос) не способен атаковать. Он — мишень, не солдат.
dialogue_1014=Деморализованный противник не ведёт ответный огонь. Добивайте без сожалений.
dialogue_1015=Укрепления — основа обороны. Возводятся только на своей территории и стоят ресурсов.
dialogue_1016=Объекты ПВО гасят урон от авиаударов и ракетных обстрелов. Прикройте ключевые позиции.
dialogue_1017=Город взят — все прилегающие территории переходят под ваш контроль автоматически.
dialogue_1018=Город 3-го уровня открывает строительство монументов с глобальными и локальными бонусами.
dialogue_1019=Разведка вражеского города — откройте панель города для детальной информации.
dialogue_1020=Командующий, приказ получен. Выполняйте.
dialogue_1021=Товарищ командующий, сводка по продвинутым тактикам.
dialogue_1022=Горы и леса — естественное укрытие. Урон от бронетехники и артиллерии по укрывшимся войскам значительно ниже.
dialogue_1023=Аэродром в городе — ваш кулак: авиаудары и десант в глубокий тыл противника.
dialogue_1024=Ядерный реактор в городе открывает производство ядерного оружия. Используйте с умом.
dialogue_1025=Ядерная боеголовка на ракете — опустошительный удар по площади. Одно попадание меняет ход войны.
dialogue_1026=При морском переходе армия грузится на транспорт. Боевые параметры ограничены характеристиками судна — войска уязвимы.
dialogue_1027=Порты — верфи вашего флота. Здесь строятся и ремонтируются боевые корабли.
dialogue_1028=Командующий, войска ждут приказа. В бой!


dialogue_1029=Чтобы уничтожить вражеский отряд, нужно свести его ОЗ (очки здоровья) к нулю. Нет ОЗ — нет противника.
dialogue_1030=Товарищ командующий, ещё несколько важных механик.
dialogue_1031=Элитные войска владеют активными навыками. К примеру, медики способны лечить союзников прямо на поле боя, восстанавливая им ОЗ.
dialogue_1032=Клетки с зелёным свечением — сюжетные точки. Их захват активирует особые события или открывает спецнавыки, изученные в Штабе.
dialogue_1033=Тоннели, проложенные инженерными войсками, позволяют пехоте и лёгкой технике быстро переброситься через всё поле боя.
dialogue_1034=Тоннель даёт бонус к дальности марша, даже если очки движения исчерпаны. Но число проходов ограничено — расходуйте с умом.
dialogue_1035=Синие кольца — точки эвакуации. Через них можно вывести только ключевые цели, отмеченные красными кольцами.
dialogue_1036=Командующий, приоритет миссии — доставить ключевые цели к точке эвакуации. Каждая минута на счету.

dialogue_1037=Товарищ командующий, о формировании армий и развёртывании на карте.
dialogue_1038=В нижней панели показаны доступные войска и их количество. Серые значки — соединения, недоступные в этой операции.
dialogue_1039=Одно нажатие разворачивает один отряд. Повторные нажатия наращивают соединение до максимального размера (стака).
dialogue_1040=Потери в бою безвозвратны. Гибель крупного соединения — ощутимый удар по всей армии. Восполнить потери можно только в режиме Господства.
dialogue_1041=Командующий, приказ — немедленное наступление. Уничтожить силы противника.
dialogue_1042=Кнопка «Сброс» отменяет расстановку войск. Бой не начнётся, пока вы не нажмёте «Начать битву».


;; Боевые диалоги кампании
;__font_type[font_text_1,font_text_2]
dialogue_2001=Командир, моя танковая армия прорвёт их оборону в считанные часы.
dialogue_2002=У меня нет времени на церемонии.
dialogue_2003=Северная группировка разгромлена. Падение Варшавы — вопрос времени.
dialogue_2004=Командир, подводный флот ликвидирует угрозу с моря.
dialogue_2005=Командир, полюбуйтесь — они бьются в агонии.
dialogue_2006=Северные порты наши. Их флот — на дне.
dialogue_2007=В поддержку наступления моя артиллерия открывает огонь по линии Мажино.
dialogue_2008=Командир, танковые дивизии готовы к обходному манёвру.
dialogue_2009=Союзники разбиты. Теперь мы можем рассчитывать только на себя.
dialogue_2010=Не сбавлять темп! Наступление продолжается!
dialogue_2011=Откуда они взялись?! Столице срочно нужны подкрепления!
dialogue_2012=Командир, добейте остатки и форсируйте Ла-Манш.
dialogue_2013=Мои войска ударят с запада. Высадка на британское побережье — одновременно.
dialogue_2014=Пора покончить с британской угрозой. Раз и навсегда.
dialogue_2015=Войны не выигрываются отступлениями. Но это отступление станет залогом победы.
dialogue_2016=Вражеский флот уничтожен. Идеальный момент для высадки.
dialogue_2017=Стоять насмерть. Ни шагу назад!
dialogue_2018=Британский флот на дне Ла-Манша. Здесь, в Средиземноморье, они дадут последний бой.
dialogue_2019=Враг укрепился на островах и ставит минные заграждения, чтобы сковать наш манёвр.
dialogue_2020=Нельзя отдать Италии контроль над Средиземноморьем.
dialogue_2021=Этот порт стратегически важен — враг бросит на его защиту весь флот. Обеспечьте господство в акватории.
dialogue_2022=Наша территория атакована! Резервный флот на подходе.
dialogue_2023=Западный фланг прорван! Немедленно перебросить туда резервы!
dialogue_2024=Авангард закрепился на Балканах. Командир, поддержите сухопутное наступление.
dialogue_2025=Враг наступает по всем фронтам. Держать строй! Сбросить их в море!
dialogue_2026=Их флот слаб, но горнострелковые дивизии крайне опасны. Поддержите союзников и удержите крепость.
dialogue_2027=Контрудар врага захлебнулся. Время для генерального наступления!
dialogue_2028=Бейте единым бронированным кулаком. Не распылять силы!
dialogue_2029=Советская армия огромна — но она рассыплется перед элитой Рейха.
dialogue_2030=Моя пехота прорвала северный рубеж обороны Ленинграда.
dialogue_2031=Киев под ударом! Тяжелейшие потери, запрашиваю поддержку!
dialogue_2032=Первая линия смята! Цель — Смоленск! За мной, камрады!
dialogue_2033=Командир, жду не дождусь встречи в Москве.
dialogue_2034=Отступать некуда — позади Москва! Стоять насмерть!
dialogue_2035=Киев пал. Немедленно выстроить новый рубеж восточнее.
dialogue_2036=Командир, расчистите плацдарм и обеспечьте коридор для конвоев снабжения.
dialogue_2037=Солдаты! Перережьте их линии снабжения и наращивайте численное превосходство.
dialogue_2038=Стремительным броском — захватить порт и уничтожить береговую охрану!
dialogue_2039=Танковые дивизии рвутся к Александрии. Флот зайдёт с моря.
dialogue_2040=Последний морской бастион потерян. Александрия — под прицелом вражеской артиллерии.
dialogue_2041=Подкреплений не будет. Удержать Каир любой ценой.
dialogue_2042=Ленинград — неприступная твердыня. Лобовой штурм обойдётся слишком дорого.
dialogue_2043=Командир, первоочередная задача — захватить пригороды и замкнуть кольцо блокады.
dialogue_2044=Враг стягивает силы к Ленинграду. Товарищи, ускоренным маршем на передовую!
dialogue_2045=Командир, северные подступы блокированы. Ждём приказа на соединение с вашими силами.
dialogue_2046=Удар по восточному флангу Ленинграда! Удержите последнюю артерию снабжения!
dialogue_2047=Кольцо сомкнулось. Пора ставить точку.
dialogue_2048=Враг умоется кровью за всё, что совершил.
dialogue_2049=Армия Паулюса в котле под Сталинградом! Ставка приказывает — немедленно деблокировать!
dialogue_2050=Немецкий фронт растянут до предела. Им не хватит сил удержать оба фланга.
dialogue_2051=Румыны и венгры на южном фланге несут тяжёлые потери. Долго не продержатся.
dialogue_2052=Командир, прорывайте северное крыло советской обороны!
dialogue_2053=Котёл вокруг 6-й армии закрыт наглухо. Главное — не дать немцам прорваться к своим.
dialogue_2054=Фронт сковал немецкие резервы. Время добить 6-ю армию!
dialogue_2055=Армия Паулюса уничтожена. Плацдарм для наступления на Сталинград потерян.
dialogue_2056=До покорения Европы — один шаг. Москва на горизонте. За мной, солдаты — к вечной славе!
dialogue_2057=Враг берёт Москву в клещи. Но прежде мы напомним им, чья это земля!
dialogue_2058=Координация с союзниками ускорит продвижение.
dialogue_2059=Сдерживать натиск, пока не эвакуируем последнюю дивизию!
dialogue_2060=В атаку! Взять все порты и сбросить врага в море!
dialogue_2061=Союзники прислали подкрепления. Отлично.
dialogue_2062=Первая линия прорвана! Вперёд, пленных не брать!
dialogue_2063=Отходим к порту, круговая оборона! Эвакуация с минуты на минуту.
dialogue_2064=Немцы на нашей земле! Срочное подкрепление!
dialogue_2065=Ни шагу назад! Ещё одно усилие — и вся Британия у наших ног!
dialogue_2066=Мы пережили налёты Люфтваффе. Пора нанести ответный удар!
dialogue_2067=Победа — во славу Британской Империи!
dialogue_2068=Наш флот перерезал немецкие коммуникации. Идеальный момент для контрудара.
dialogue_2069=Радиоперехват: корпус Роммеля движется на южные города. Боевая тревога! Стянуть артиллерию!
dialogue_2070=Немецкий фронт прорван! Наступаем на Тунис.
dialogue_2071=Танковым дивизиям — стремительное наступление! Смять врага!
dialogue_2072=Эффект внезапности утерян. Операция теряет смысл.
dialogue_2073=Цель — захват Сицилии. Вывести Италию из войны.
dialogue_2074=Первая масштабная совместная операция союзников. Мой флот обеспечит огневую поддержку.
dialogue_2075=Всё по плану. Взять Палермо раньше британцев!
dialogue_2076=Натиск союзников сокрушителен! Нужны срочные подкрепления из-за пролива!
dialogue_2077=Форсировать пролив! Добить Италию в её собственном логове!
dialogue_2078=Сходящимися ударами — взять советские армии в клещи под Курском!
dialogue_2079=Окопаться! Выбить их бронетехнику и ждать момента для контрудара!
dialogue_2080=Сжечь их танки и гнать до самого Берлина!
dialogue_2081=Господство в воздухе на севере — наше. Начинаем совместную атаку.
dialogue_2082=Триумф под Курском сломал хребет немецкому наступлению. Инициатива — в наших руках!
dialogue_2083=Глухая оборона — путь к поражению. Я поведу войска в контратаку.
dialogue_2084=Корпус Штадлера разбит. Мой план рухнул.
dialogue_2085=Тревога Северо-Западной группе армий! Срочно на выручку Киеву!
dialogue_2086=Командир, цель — отбить оккупированный Минск.
dialogue_2087=Я сделал всё, что мог. Фронт рушится.
dialogue_2088=Прорыв удался, Минск по курсу! Готовьтесь к яростным контратакам.
dialogue_2089=Месяцы подготовки позади. Этот день войдёт в историю как величайшая десантная операция!
dialogue_2090=Американцы слишком быстро продвигаются. Не отставать!
dialogue_2091=Положение критическое! Организовать контрудар — сбросить союзников в море!
dialogue_2092=Нас не остановить!
dialogue_2093=Для поддержки французского наступления — внезапный удар по немецким гарнизонам на юге Франции.
dialogue_2094=Мои части утопят десант в крови прямо на пляжах!
dialogue_2095=Я недооценил их числа... Бросайте танковые резервы, задержите их!
dialogue_2096=Остатки немецкой армии больше не представляют организованной силы.
dialogue_2097=Командир, если план сработает — наши танки ворвутся в сердце Германии. Победа близка.
dialogue_2098=Плацдарм потерян! Резервы — немедленно!
dialogue_2099=Продолжать зачистку! Уничтожить последние очаги сопротивления!
dialogue_2100=Берлин должен быть нашим! Моя артиллерия обеспечит огневой вал.
dialogue_2101=Танковые клинья сметут любые преграды на севере.
dialogue_2102=Берлин перед нами! Победа будет за нами!
dialogue_2103=Моё поражение уже ничего не изменит. Берлин обречён.
dialogue_2104=Внезапный удар увенчался успехом!
dialogue_2105=Почему разведка проспала манёвры японского флота?!
dialogue_2106=Командир, берите их в клещи — устроим котёл прямо на острове.
dialogue_2107=Враг подтягивает резервы. Мои субмарины отправят их на дно.
dialogue_2108=Авиаразведка засекла главные силы британского флота. Волчьи стаи готовы к торпедной атаке.
dialogue_2109=Сингапур — ключ ко всей Азии. Он не должен достаться японцам!
dialogue_2110=Командир, начинайте высадку! Мой флот свяжет их эскадры боем.
dialogue_2111=Добивайте, пока не оправились от шока!
dialogue_2112=Японцы на подступах к Сингапуру! Все резервы в бой — город не сдавать!
dialogue_2113=Британский фронт рухнул. Янгон станет нашим плацдармом для захвата всей Бирмы.
dialogue_2114=Командир, пока вы штурмуете Янгон — выделите мобильный отряд перерезать пути снабжения.
dialogue_2115=Мы не сдержим натиск! Отступаем! Новый рубеж — вокруг Мандалая!
dialogue_2116=Британцы дрогнули! Немедленно на выручку!
dialogue_2117=Их главные силы увязли на передовой. Идеальный момент для рейда по тылам.
dialogue_2118=Британцы в Бирме разбиты. Сомкнуть ряды, добить оставшиеся опорные пункты!
dialogue_2119=Командир, захватите Порт-Морсби! Я обеспечу поддержку с воздуха.
dialogue_2120=Палубная авиация ударит по Соломоновым островам и прикроет десант.
dialogue_2121=Следите за вражескими подкреплениями. Не допускайте бессмысленных потерь при высадке.
dialogue_2122=Японцы прорвали последний рубеж! Австралия беззащитна!
dialogue_2123=Командир, силы на исходе. Наступайте только под прикрытием корабельной артиллерии.
dialogue_2124=Выживет тот, кто не боится смерти! Мы — последняя надежда на Тихом океане.
dialogue_2125=Они всё ещё надеются вернуть свои земли. Наивные.
dialogue_2126=Пока жив Тихоокеанский флот — жива надежда на победу.
dialogue_2127=Отступление сейчас перечеркнёт все наши жертвы.
dialogue_2128=Потери катастрофические, войска истощены. Ставка приказывает свернуть операцию. Всем частям — отход!
dialogue_2129=Командир, сдерживайте британский авангард. Мы ещё вернёмся с ответным ударом.
dialogue_2130=Импхал наш. Но пока на этой земле остаётся хоть один японский солдат — битва продолжается.
dialogue_2131=Японский флот отступает! Наш шанс вернуть острова!
dialogue_2132=Британцев не остановить. Судьба Мандалая на волоске.
dialogue_2133=Советы увязли на западе. Сибирская кампания изменит мировой порядок!
dialogue_2134=Командир, используйте манёвр. Избегайте лобовых столкновений с советскими танками — берите слабозащищённые города.
dialogue_2135=Мои армии ударят по нескольким направлениям, чтобы оттянуть их силы.
dialogue_2136=Воевать на два фронта мы не можем. Уничтожить главные силы японцев — как можно скорее.
dialogue_2137=Вражеские танковые клинья идут прямо на мои позиции!
dialogue_2138=Командир, прорвите береговую оборону и обеспечьте высадку!
dialogue_2139=Японский флот превосходит числом. Объединяйтесь с союзниками — сбросьте их десант в море!
dialogue_2140=Закрепиться на рубежах! Отбить атаку!
dialogue_2141=Выиграть время любой ценой! Проекту супероружия нужны считанные недели.
dialogue_2142=Американцы решили атаковать первыми? Какая дерзость! Что ж — пустим их флот на дно.
dialogue_2143=Командир, уничтожьте их исследовательские центры, пока я связываю боем главные силы.
dialogue_2144=Настоящий солдат не сдаётся, пока жив хотя бы один шанс.
dialogue_2145=Радиограмма: японцы вероломно атаковали Пёрл-Харбор! Флот несёт тяжёлые потери! Немедленно разворачивайте эскадру!
dialogue_2146=Командир, мы перехватили японский авангард. Немедленно на выручку Пёрл-Харбору!
dialogue_2147=Удар удался! Готовим третью волну — похороним Тихоокеанский флот США навсегда!
dialogue_2148=Вражеские резервы подошли! Огонь главного калибра с линкоров!
dialogue_2149=Штурмовые части обескровлены. Такая «победа» хуже поражения.
dialogue_2150=Сингапур — ключевой пункт Императорской ставки. Город должен пасть до подхода британских резервов!
dialogue_2151=Японцы готовят штурм Сингапура. К бою! Эту цитадель мы не сдадим!
dialogue_2152=Командир, эскадра на позиции. Начинаем артподготовку.
dialogue_2153=Срочно резервы! Позиции не удержим!
dialogue_2154=Японцы прут волна за волной! Держать оборону! Мидуэй — любой ценой!
dialogue_2155=Авианосным группам: кильватерный строй, подавить атаку авиагруппами!
dialogue_2156=Их оборона оказалась слишком крепкой. Мы умылись кровью на этих пляжах.
dialogue_2157=Бездарное командование! Флот идёт от поражения к поражению!
dialogue_2158=Японцы не теряли времени — бетонные доты и аэродромы уже возведены.
dialogue_2159=Командир, я ударю по северо-востоку Гуадалканала, отвлеку резервы на себя.
dialogue_2160=Моя эскадра попала под массированный удар!
dialogue_2161=Командир, японцы скошены тропической лихорадкой, дух сломлен. Добивайте.
dialogue_2162=Союзники наносят удар по трём сходящимся направлениям.
dialogue_2163=Мандалай пал. Ситуация катастрофическая.
dialogue_2164=Последний рубеж. Отступать некуда.
dialogue_2165=Союзники стянули колоссальную армаду для прикрытия десанта.
dialogue_2166=Сбросьте Макартура в океан — пусть плывёт до Калифорнии!
dialogue_2167=Разведка обнаружила японское авианосное соединение! Отправим их на дно — раз и навсегда!
dialogue_2168=Адмирал Одзава увёл за собой главные силы их палубной авиации. Манёвр удался.
dialogue_2169=Флот разгромлен... Объединённого флота Империи больше нет.
dialogue_2170=Каждый солдат Императора заберёт с собой десятерых! Стоять до последнего вздоха!
dialogue_2171=Командир, захватите остров — и наши «Крепости» начнут ровнять Токио с землёй.
dialogue_2172=Разведка докладывает: эшелонированная оборона. Этот клочок скалы обойдётся дорого.
dialogue_2173=Смерть в бою — высшая честь самурая!
dialogue_2174=Командир, надо смять их оборону и высадиться на Японских островах раньше американцев!
dialogue_2175=Советы вторгаются на земли Империи! Сбросить их в море!
dialogue_2176=Командир, время против нас. Захват аэродрома даст господство в воздухе.
dialogue_2177=Командир, японцы бьются с фанатизмом обречённых. Начинаем штурм метрополии. Присоединяйтесь!
dialogue_2178=Немедленно высаживаться и окапываться! Наш главный враг здесь — не только Япония.
dialogue_2179=Япония капитулировала! Это зона влияния Советского Союза! Вышвырните янки!
dialogue_2180=Командир, перед нами войска двух сверхдержав. Это будет кровавая мясорубка.


dialogue_2181=Десант закрепился, но без резервов плацдарм не удержать.
dialogue_2182=Королевский флот ударит по порту, а я параллельно переброшу сухопутные дивизии.
dialogue_2183=Командир, перехватите конвои НАТО! Топите транспорты — не дайте им ступить на берег!
dialogue_2184=План НАТО рухнул! Время для масштабного контрудара!
dialogue_2185=Советы стянули колоссальную группировку на Кавказ. Наступление захлебнулось.
dialogue_2186=Моя эскадра свяжет боем советский флот, пока вы добиваете их на суше.
dialogue_2187=Командир, обломайте им атаку вместе с моими частями — и готовьтесь к вторжению в Турцию!
dialogue_2188=Командир, пора преподать туркам урок.
dialogue_2189=Используйте флот для обхода турецких укреплений. Главная цель — уничтожить американскую морскую пехоту!
dialogue_2190=Танки НАТО рвутся к Анкаре! В одиночку не удержу.
dialogue_2191=Командир, все резервы — на Анкару! Город не сдавать!
dialogue_2192=Мои дивизии на марше к передовой. Держитесь!
dialogue_2193=Силы НАТО обескровлены. Следующая цель — полный контроль над Турцией.
dialogue_2194=У них эшелонированная оборона, но мы возьмём Анкару и сделаем её плацдармом!
dialogue_2195=Враг на нашей земле! Остановим их здесь, чего бы это ни стоило!
dialogue_2196=НАТО сколотило коалицию в Западной Европе. Готовят удар с двух направлений.
dialogue_2197=Солдаты, покажите им мощь нашего оружия! Вдавите Советов за железный занавес!
dialogue_2198=Командир, коалиция выглядит грозно, но они разрозненны. Бейте по частям!
dialogue_2199=Буду драться до последнего патрона. Варшава не сдастся!
dialogue_2200=НАТО нанесло вероломный удар на западе! Союзники истекают кровью!
dialogue_2201=Буду драться до последнего патрона. Варшава не сдастся!
dialogue_2202=Командир, они заплатят за всё. Красный шторм очистит Европу!
dialogue_2203=Разведка: с западного побережья США вышел новый конвой с войсками в Азию.
dialogue_2204=Авиаразведка засекла крупную ударную группу советского флота! Немедленно свернуть операцию — отход к своим берегам!
dialogue_2205=Командир, перехватите транспортные конвои и зачистите акваторию для нашего десанта.
dialogue_2206=Сбросить десант в море не удалось, но дальше пляжей они не пройдут!
dialogue_2207=Внутренний флот НАТО ударил в спину! Берут в клещи!
dialogue_2208=Командир, внезапность утрачена! Высаживаться в Штатах немедленно — пока нас не потопили в океане.
dialogue_2209=В атаку! Пустите их хвалёный флот на дно!
dialogue_2210=Силы НАТО в Европе разгромлены, но американцы ещё огрызаются.
dialogue_2211=Удержите позиции — вместе с союзниками поставим Америку на колени!
dialogue_2212=Мой флот отрезал пути отхода. Пора раздавить советскую армаду. Звёздно-полосатый будет развеваться вечно!
dialogue_2213=Европа обескровлена. Идеальный момент расширить жизненное пространство!
dialogue_2214=Советы сконцентрировали огромную ударную группировку. Готовят бросок в Европу!
dialogue_2215=Германия трещит по швам! Мы обязаны вмешаться!
dialogue_2216=Оборона Германии прорвана! В атаку — это будет лёгкая прогулка.
dialogue_2217=Бельгия и Нидерланды убеждены присоединиться к блокаде Германии.
dialogue_2218=Советы натравили Северную Корею. Сеул пал. Высаживаемся в Инчхоне — спасать южан.
dialogue_2219=Войска ООН в Корее! Поднять дивизии по тревоге — сбросить их в море! Поражение недопустимо.
dialogue_2220=Развить успех и навсегда похоронить советские амбиции в регионе.
dialogue_2221=Советы развернули ракетные базы на Кубе. Ядерный удар возможен в любую минуту. Командир, уничтожьте шахты любой ценой!
dialogue_2222=Президент не потерпит этой наглости. Пусть попробуют своё же лекарство.
dialogue_2223=Преподайте янки кровавый урок!
dialogue_2224=Советы перекрыли Суэц, чтобы наложить лапу на ближневосточную нефть.
dialogue_2225=Вперёд! Захватить нефтяные вышки и вышвырнуть европейцев!
dialogue_2226=Советский блицкриг застал нас врасплох. Ситуация критическая.
dialogue_2227=Командир, дождитесь момента — ударьте по слабому южному флангу. Возьмите в котёл!
dialogue_2228=Американские резервы на подходе. Закончить всё до их появления!
dialogue_2229=Не давать передышки! Давите!
dialogue_2230=Войск НАТО здесь хватает, но движутся они слишком медленно.
dialogue_2231=Мы опоздали — Советы уже заняли ключевые города. Командир, пока не окопались — контрудар!
dialogue_2232=Командир, разведка докладывает: советский южный фланг совершенно не укреплён.
dialogue_2233=Кто бы мог подумать, что советская база в Антарктиде разрастётся до таких масштабов!
dialogue_2234=Это наш последний шанс переломить ход войны!
dialogue_2235=Ключ на старт! Вдавим их в каменный век! Пора платить по счетам!

dialogue_2236=Разведка: террористы захватили нефтяные вышки и атакуют мегаполисы в нескольких странах!
dialogue_2237=Вы опоздали. Наше наступление не остановить. Скоро весь Персидский залив — наш!
dialogue_2238=Командир, немедленно в залив — подавить восстание!
dialogue_2239=Наше превосходство абсолютно. Сопротивление бесполезно.
dialogue_2240=Их цель — Багдад! Все силы стягиваются туда. Командир, сорвите их планы любой ценой!
dialogue_2241=Зачистите оставшиеся города и готовьте бросок через Ла-Манш. Скоро вся Европа — у наших ног!
dialogue_2242=Командир, задача — стремительная высадка. Спасти Европу от катастрофы.
dialogue_2243=Мы вернёмся. Это лишь тактическое отступление.
dialogue_2244=Ротация прошла успешно. Советские части на этом участке — лёгкая добыча.
dialogue_2245=Они решили, что пара городов принесёт им победу? Глупцы! Советский Союз ещё никто не ставил на колени!
dialogue_2246=Днепр форсирован, юг в тяжёлом положении. Приоритет — деблокада Киева, затем рывок от Смоленска к Москве!
dialogue_2247=Поддержать гарнизон Харькова! Это наш трамплин для возвращения Сталинграда и Москвы!
dialogue_2248=Западный рубеж Москвы рухнул. Ополченцам нас не остановить.
dialogue_2249=Харьков пал. Танки врага рвутся к Москве. Грядёт генеральное сражение.
dialogue_2250=Мои армии помогут отбить Киев. Готовьтесь к контрнаступлению по всему фронту.
dialogue_2251=Потеря Европы — досадная помеха. Мы выжжем Северную Америку дотла! Вперёд, закончим быстро!
dialogue_2252=Командир, натиск ослаб, но их всё ещё больше!
dialogue_2253=Группировка в Нью-Йорке уничтожена! Рассвет победы близок!
dialogue_2254=Стоять насмерть! Не дать им развить контрнаступление!
dialogue_2255=Их слишком много! Где воздушная поддержка?!
dialogue_2256=Террористы в Юго-Восточной Азии и Австралии? Безумие... Но наше прибытие изменит ход войны.
dialogue_2257=В открытом океане у меня нет соперников.
dialogue_2258=Мои танковые дивизии немедленно на выручку союзникам в Австралии!
dialogue_2259=Командир, полный контроль над островом — любой ценой.
dialogue_2260=Они лезут отовсюду! Мы в огневом мешке!
dialogue_2261=Моя эскадра на подходе. Вернём этот плацдарм!
dialogue_2262=Дарвин пал! Австралийцы в беспорядочном отступлении!
dialogue_2263=Командир, приоритет — отбить Дарвин и удержать континент!
dialogue_2264=Командир, оборона слишком плотная. Сконцентрируем огонь — выбьем по одному!
dialogue_2265=Сибирь — наша цитадель. Вы серьёзно решили сунуться сюда?!
dialogue_2266=В атаку! Смешайте их с землёй под прикрытием моей артиллерии!
dialogue_2267=Вы лишь отсрочили неизбежное.
dialogue_2268=Сибирская база потеряна, но они огрызаются. Тотальное наступление — не дать им перевести дух!
dialogue_2269=Союзники в Азии отступают, но мы — элита из элит! Советы захлебнутся кровью!
dialogue_2270=Командир, это их последнее логово. Финальный штурм. Выжечь заразу!
dialogue_2271=Надо же, добрались... Но здесь ваша история закончится. В расход!
dialogue_2272=Вы зашли слишком далеко. Обратного пути нет.
dialogue_2273=Враг пытается ускользнуть! В клещи — раздавить и уничтожить!
dialogue_2274=Их главная база. Сегодня — финальная точка в этой войне!
dialogue_2275=Покажем этим слепым фанатикам нашу истинную мощь!
dialogue_2276=Сейчас враг моего врага — мой друг. Победа зависит от действий Советов.
dialogue_2277=Враг обезглавлен, победа за нами. Но технология, из-за которой всё началось, должна быть засекречена навсегда.
dialogue_2278=Эти технологии — собственность Советского Союза! Никто не смеет диктовать нам условия!
dialogue_2279=Нет вечных союзников и вечных врагов. Есть только вечные интересы.
dialogue_2280=Командир, мы уничтожим террористов и проследим, чтобы это оружие больше никому не досталось.


