skill_info_170=При командовании бронетехникой наносимый урон увеличивается на [#00FF00#%d%%]. После каждой атаки отряд восстанавливает ОЗ в размере 10% от нанесенного урона. Пока на отряд действует любой бафф, шанс критического удара бронетехники увеличивается на 10%, а атаки игнорируют 30% защиты цели. Отряд игнорирует зону контроля противника и может свободно перемещаться. Если цель выживает после атаки, отряд может провести одну дополнительную атаку (срабатывает 1 раз за ход).
skill_info_171=При командовании бронетехникой ее мораль не может быть снижена. При атаке есть шанс [#00FF00#%d%%], что враг не сможет ответить огнем. При уничтожении врага отряд получает эффект «Жатва» на 1 ход (урон увеличивается на 20%, уклонение цели игнорируется). За каждые 30 атак вашей бронетехники критический урон генерала увеличивается на 5%.
skill_info_172=При командовании пехотой есть шанс [#00FF00#%d%%] нанести критический удар. Каждый ход отряд восстанавливает 15% от максимального запаса ОЗ. Командир и вся союзная пехота в радиусе 2 клеток наносят на +30% больше урона и получают на -25% меньше урона. (Если у генерала есть этот навык, эффекты от навыка «Командир пехоты» не суммируются).
skill_info_173=При командовании сухопутными войсками [#00FF00#%d%%] ресурсов экономики, потраченных в этом ходу, будет возвращено в следующем (максимум до 1200). При уничтожении врага в радиусе 3 клеток от генерала вы получаете +40 Промышленности и +4 Технологий (срабатывает до 3 раз за ход).
skill_info_174=При командовании подводными лодками (кроме атомных субмарин) их атаки игнорируют защиту врага, а дальность стрельбы увеличивается на +1. При уничтожении врага есть шанс [#00FF00#%d%%] атаковать снова (шанс увеличивается на +25%, если атака была критической).
skill_info_175=При командовании подводными лодками получаемый урон снижается на [#00FF00#%d%%], а шанс уклониться от авиаудара или ракетной атаки составляет 50%. Подводная лодка восстанавливает 5% максимальных ОЗ каждый ход.

army_buff_desc_1631=Жатва: наносимый урон увеличивается на 20%, уклонение противника игнорируется.

