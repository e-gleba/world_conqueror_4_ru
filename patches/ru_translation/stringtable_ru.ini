armygroup_event_desc_173=Немецко-итальянские силы сосредоточили войска на Североафриканском театре и предприняли крупное наступление на Египет, угрожая Суэцкому каналу, находившемуся под британским контролем.
armygroup_event_desc_174=Британские силы начали операцию «Компас» внезапной атакой на итальянский гарнизон в Египте, стремительно разрушив его оборонительные рубежи и выйдя к ливийской границе, переломив ситуацию в Северной Африке.
armygroup_event_desc_175=Роммель командовал немецко-итальянскими силами и предпринял яростное контрнаступление. Они прорвали британскую оборону, успешно захватили Александрию и создали угрозу Суэцкому каналу, из-за чего ситуация в Северной Африке резко ухудшилась.
armygroup_event_desc_176=Немецко-итальянские силы начали наступление, осадив порт Тобрук в попытке перерезать линии снабжения британских оккупационных сил Содружества. Австралийские части стойко оборонялись, и противостояние переросло в затяжную борьбу.
armygroup_event_desc_177=Британская армия начала операцию «Боевой топор», нанеся многовекторные удары по позициям немецко-итальянских сил. Несмотря на первоначальный успех, вскоре они были контратакованы генералом Роммелем, и операция в итоге была сорвана.
armygroup_event_desc_178=Британские оккупационные силы Содружества начали операцию «Крестоносец», собрав крупные танковые силы для полномасштабного контрнаступления. Они успешно отбросили Роммеля и сняли осаду Тобрука, что стало переломным моментом на Североафриканском театре.
armygroup_event_desc_179=За выдающиеся военные заслуги Роммелю было присвоено звание германского генерал-фельдмаршала. Боевой дух немецкой армии взлетел, и его стали считать символом непобедимости.
armygroup_event_desc_180=Для ослабления британской средиземноморской линии снабжения авиация Оси провела ночные бомбардировки Гибралтара через испанское воздушное пространство. Хотя серьёзного ущерба нанести не удалось, британцев вынудили усилить оборону.
armygroup_event_desc_181=Наступление Роммеля неумолимо продвигалось к центру Египта. Британские силы возвели оборонительные рубежи у Эль-Аламейна и упорно удерживали их. Обе стороны вели ожесточённые бои без решающего успеха, что привело к затяжной патовой ситуации в Североафриканской кампании.
armygroup_event_desc_182=Монтгомери командовал британской Восьмой армией и начал полное контрнаступление, сокрушившее силы Роммеля, что привело к полному краху наступления стран Оси в Северной Африке. Импульс войны начал смещаться.
armygroup_event_desc_183=Союзные силы начали операцию «Факел», высадившись в нескольких точках Марокко и Алжира и вынудив вишистские французские силы прекратить огонь. Страны Оси оказались под угрозой с нескольких сторон, давление на тунисский фронт резко возросло.
armygroup_event_desc_185=Атакованные союзными силами с востока и запада, немецко-итальянские силы в Тунисе понесли тяжёлые потери, что вынудило сотни тысяч военнослужащих сдаться в плен. В конечном счёте они оставили Тунис.
armygroup_event_desc_186=Роммель повёл германские бронетанковые силы в внезапную атаку на стратегический горный проход Кассерин, где американские войска впервые приняли участие в крупномасштабном бою. Из-за просчётов командования они понесли тяжёлые потери, что вынудило союзный фронт приостановить действия.
armygroup_event_desc_187=Союзники перерезали линии снабжения немецкого Африканского корпуса в Северной Африке, из-за чего нехватка топлива и боеприпасов становилась всё острее. Боеспособность корпуса резко упала, а общая военная обстановка постепенно ухудшалась.
armygroup_event_desc_188=Британские силы успешно восстановили линию снабжения от Суэцкого канала до передовой; прибытие большого количества припасов и техники привело к быстрому восстановлению боеспособности фронтовых частей.
armygroup_event_desc_189=Союзники пересекли Средиземное море для проведения десантной операции, стремительно прорвали итальянские оборонительные рубежи и овладели всей Сицилией, обнажив южный фланг стран Оси и положив начало кампании на материковой Италии.
armygroup_event_desc_190=Стремясь поддержать итальянские силы после поражения на Балканах, германская армия начала операцию «Марита» с целью молниеносного наступления на Грецию и Югославию и в итоге захвата контроля над всем Балканским полуостровом.
armygroup_event_desc_191=Немецкие парашютисты предприняли яростный штурм Крита и, несмотря на ожесточённое сопротивление, в конечном счёте захватили весь остров, хотя и ценой тяжёлых потерь.
armygroup_event_desc_192=Нестабильность на Североафриканском театре продолжает нарастать, приближаясь к порогу системного дисбаланса. Скрытые вооружённые формирования, давно внедрённые и не учтённые ни одной из известных сторон, начали масштабное снятие маскировки и вступление в активные боевые действия. Структура поля боя переписана. Всем существующим фракциям предстоит столкнуться с противником, никогда не зафиксированным в истории.
armygroup_event_desc_193=Конфликт отклонился от заданной траектории. Продвижение Оси превысило критические пороги, и прогнозируется скорый крах союзных сил в Северной Африке. Для сохранения временной структурной стабильности иберийские силы «Чёрного скорпиона» начнут вмешательство и приведут в исполнение протокол интервенции.
armygroup_event_desc_194=Конфликт вышел за пределы стабильного диапазона. Темпы продвижения союзников превысили установленные пределы, нарушив временные допуски. Североафриканская система Оси стремительно распадается, и в историческом каркасе появились признаки структурного разрыва. Сахельские силы «Чёрного скорпиона» активируются и будут развёрнуты на поле боя для выполнения коррекции исходной точки.
armygroup_event_desc_195=Потеря сигнала подтверждена: сущность Осборна полностью исчезла. Исходная закреплённая временная точка отказала. Стабильность рухнула, и историческая линия претерпевает необратимое отклонение. Существующие правила более не применимы. Система «Чёрный скорпион» приняла полное управление конфликтом. Все узлы переходят в единый режим завоевания. Запущен протокол «Новая эпоха».
