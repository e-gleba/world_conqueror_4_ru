general_stage_intro_151=Это было последнее и решающее сражение Североафриканской кампании. Генерал Эйзенхауэр в качестве главнокомандующего союзными силами возглавил наступление американо-британских войск на оборонительные рубежи Оси в Северной Африке. Кампания увенчалась полным успехом, и в мае 1943 года Тунис был полностью освобожден.
general_stage_intro_152=В июле 1943 года Эйзенхауэр был назначен командующим вторжением на Сицилию. Он блестяще руководил объединенными силами во время высадки морского десанта и последующего наступления, захватив весь остров всего за один месяц.
general_stage_intro_153=В июне 1944 года, обманув немецкое командование искусной дезинформацией, союзники начали крупнейшую десантную операцию в истории войн — высадку в Нормандии. Под верховным командованием Эйзенхауэра войска союзников успешно захватили и удержали плацдарм, открыв долгожданный Второй фронт в Европе.
general_stage_intro_154=Вслед за триумфом в Нормандии Эйзенхауэр спланировал и провел еще одну масштабную десантную операцию на юге Франции — «Драгун». Это заставило немцев растянуть свои силы на два фронта, что значительно ускорило крах гитлеровской Германии.
general_stage_intro_155=После разгрома немцев в Арденнах Эйзенхауэр приказал стремительно продвигаться к Рейну, чтобы как можно скорее соединиться с наступающими с востока советскими войсками. В 1945 году началось окружение Рурского промышленного района. Рурский котел стал последней крупной битвой на Западном фронте, окончательно сломившей сопротивление вермахта.
general_stage_intro_161=В октябре 1941 года, после прорыва немецких войск в Крым, 11-я армия под командованием Манштейна начала штурм Севастополя. Эта битва стала одним из величайших достижений в его полководческой карьере и принесла ему звание генерал-фельдмаршала.
general_stage_intro_162=Блестящая победа под Севастополем сделала Манштейна героем Рейха. Гитлер немедленно приказал перебросить его на север, чтобы прорвать оборону Ленинграда. В августе 1942 года Манштейн во главе 11-й армии прибыл под Ленинград, присоединившись к самой кровопролитной и продолжительной осаде в современной истории.
general_stage_intro_163=В самый разгар боев под Ленинградом Верховное командование срочно отозвало Манштейна на юг, приказав любой ценой деблокировать окруженную под Сталинградом 6-ю армию Паулюса.
general_stage_intro_164=Окрыленные триумфом под Сталинградом, советские войска стремительно рвались на запад, намереваясь освободить Харьков. Однако Манштейн организовал гениальный контрудар, продемонстрировав выдающееся тактическое мастерство и одержав одну из последних крупных побед Германии на Восточном фронте.
general_stage_intro_165=Несмотря на суровые погодные условия и нехватку резервов, Манштейну удалось прорвать советскую оборону и заставить противника отступить на южном фасе Курского выступа. Сможет ли он соединиться с ударной группировкой Моделя, наступающей с севера, и одержать победу в величайшем танковом сражении в истории?

