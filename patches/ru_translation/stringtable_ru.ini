feat_desc_76=Дальность атаки увеличивается до 2. Может атаковать несколько целей. Вероятность {1}% лишить вражеские отряды возможности контратаковать. Длится 1 ход, перезарядка: 2 хода.
feat_desc_76_Lv3=Дальность атаки увеличивается до 2. Может атаковать несколько целей (урон по дополнительным целям не снижается). Вероятность {1}% лишить вражеские отряды возможности контратаковать. Длится 1 ход, перезарядка: 2 хода.
feat_desc_77=Снижает получаемый от бронетехники урон на {1}%.
feat_desc_78=Игнорирует эффекты уклонения и дымовой завесы. Урон по городским укреплениям увеличивается на {1}%.
feat_desc_79=Выпускает дымовую шашку, создавая дымовую завесу. Находясь в ней, отряд не может быть атакован сухопутными войсками. Длится 1 ход, перезарядка: 3 хода.
feat_desc_79_Lv2=Выпускает дымовую шашку, создавая дымовую завесу. Находясь в ней, отряд не может быть атакован сухопутными войсками. Длится 1 ход, перезарядка: 2 хода.
feat_desc_79_Lv3=Выпускает дымовую шашку, создавая дымовую завесу. Отряд не может быть атакован сухопутными войсками. С вероятностью {1}% позволяет провести еще 1 атаку в этом ходу. Длится 1 ход, перезарядка: 2 хода.
feat_desc_80=Находясь под действием дымовой завесы, атаки игнорируют {1}% защиты противника.
feat_desc_81=При запуске ракет можно использовать атомные боеголовки. Изначально доступно 2 шт., восстанавливается по 1 шт. каждые {1} хода. Максимум 4 шт.
feat_desc_81_Lv2=При запуске ракет можно использовать водородные боеголовки. Изначально доступно 2 шт., восстанавливается по 1 шт. каждые {1} хода. Максимум 4 шт.
feat_desc_81_Lv3=При запуске ракет можно использовать термоядерные боеголовки. Изначально доступно 2 шт., восстанавливается по 1 шт. каждые {1} хода. Максимум 4 шт.
feat_desc_82=Может запускать баллистические ракеты малой дальности до 2 раз за ход. Заменяет обычную атаку.
feat_desc_82_Lv2=Может запускать баллистические ракеты средней дальности до 2 раз за ход. Заменяет обычную атаку.
feat_desc_82_Lv3=Может запускать баллистические ракеты средней дальности до 2 раз за ход. Заменяет обычную атаку.
feat_desc_83=Субмарина не может быть атакована сухопутными войсками. Получаемый урон от авиации снижен на {1}%.
feat_desc_84=Выберите направление для марш-броска по прямой на расстояние до {1} клеток (конечная клетка должна быть свободна; воздушные юниты не блокируют путь). Наносит урон всем целям на пути. Перезарядка: 2 хода.
feat_desc_85=Может взлетать в радиусе 1 клетки от авианосца. Игнорирует штрафы к подвижности от любых типов местности и мин. Вражеские войска не могут контратаковать. Боевая эффективность не падает при снижении запаса ОЗ.
feat_desc_87=При атаке со стороны наземных или морских сил есть {1}% вероятность полностью уклониться от урона.

event_105=Нападение на Пёрл-Харбор
event_intro_105=К началу Второй мировой войны амбиции Японии в Азиатско-Тихоокеанском регионе стремительно росли. На фоне агрессивной экспансии Японской империи США ввели жесткое эмбарго на поставки нефти, стали и других стратегических ресурсов. Эти санкции грозили парализовать японскую военную машину. В ответ японское командование пошло на радикальный шаг — нанести внезапный сокрушительный удар по Пёрл-Харбору, чтобы одним махом уничтожить Тихоокеанский флот США.

army_buff_desc_1271=Приманка: увеличивает урон союзных войск поблизости на 3%.
army_buff_desc_1272=Приманка: увеличивает урон союзных войск поблизости на 6%.
army_buff_desc_1273=Приманка: увеличивает урон союзных войск поблизости на 9%.
army_buff_desc_1274=Приманка: увеличивает урон союзных войск поблизости на 12%.
army_buff_desc_1275=Приманка: увеличивает урон союзных войск поблизости на 15%.
army_buff_desc_1281=Воодушевление: в начале каждого хода есть 80% вероятность снять с себя эффекты Хаоса (Паники) и Падения духа.
army_buff_desc_1291=Прикрытие: союзные войска в радиусе 1 клетки не могут быть атакованы вражескими сухопутными и морскими силами.
army_buff_desc_1301=Ракетный удар: дальность атаки увеличивается до 2 (можно поражать несколько целей). С вероятностью 60% лишает врага возможности контратаковать.
army_buff_desc_1302=Ракетный удар: дальность атаки увеличивается до 2 (можно поражать несколько целей). С вероятностью 80% лишает врага возможности контратаковать.
army_buff_desc_1303=Ракетный удар: дальность атаки увеличивается до 2 (можно поражать несколько целей). Со 100% вероятностью лишает врага возможности контратаковать.
army_buff_desc_1311=Дымовая завеса: отряд не может быть атакован сухопутными и морскими силами.
