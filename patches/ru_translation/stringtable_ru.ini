glory_challenge_desc_11601=В испытании «Завоевание 1943», играя за Германию, захватить Москву в течение 6 раундов, командуя танком «Королевский тигр».
glory_challenge_desc_11701=В испытании «Завоевание 1939», играя за Финляндию, победить Мерецкова в течение 3 раундов, командуя «Ястребиным глазом».
glory_challenge_desc_11801=В сценарии/Тихоокеанский ТВД/03/Битва за Мидуэй (режим испытания), командуя «Энтерпрайзом», уничтожить 3 авианосца и одержать победу на 3 звезды.
glory_challenge_desc_11901=В сценарии/Холодная война/05/Рассвет с востока (режим испытания), командуя РСЗО БМ-21, уничтожить не менее 20 врагов и одержать победу на 3 звезды.
glory_challenge_desc_12001=В сценарии/Европейский ТВД/03/План «Гельб» (режим испытания) развернуть «Штуку» 12 раз и одержать победу на 3 звезды.
