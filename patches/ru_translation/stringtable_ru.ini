dialogue_2670=Мы прорвем их линию обороны и двинемся прямо на советскую базу.
dialogue_2671=Развертывание ракет завершено. Мы готовы нанести удар по силам противника!
dialogue_2672=Задействуйте наше новейшее разрушительное оружие. Мы сотрем врага в порошок!
dialogue_2673=Немедленно начинайте контрнаступление, чтобы отбить Сеул!
dialogue_2674=Наступление Советов создало критическую угрозу. Мы обязаны срочно принять контрмеры.
dialogue_2675=Операция увенчалась огромным успехом, но расслабляться рано. Мы должны быть готовы отразить советский контрудар в любую минуту.
dialogue_2676=Уничтожьте советские военно-морские базы и не дайте вражескому флоту перегруппироваться!
dialogue_2677=Армия США начала полномасштабное вторжение. У нас заканчивается время.
dialogue_2678=Не дайте американцам захватить Советскую Гавань! Мои подкрепления уже на подходе.
dialogue_2679=Американская группировка огромна, и они наступают с невероятной скоростью.
dialogue_2680=Я буду держать оборону и ждать подкреплений, чтобы затем перейти в контрнаступление.
dialogue_2681=Советские войска заняли плацдарм для высадки и перегруппировывают силы, чтобы блокировать Татарский пролив.
dialogue_2682=Десантные силы сосредоточены и в любой момент готовы начать операцию по захвату острова.
dialogue_2683=Начинайте прямую атаку на вражеские базы на Хоккайдо. Защитники Южных Курил выиграют время для нашей операции.
dialogue_2684=Наше наступление захлебнулось из-за потери ключевого плацдарма. Отступаем на Хоккайдо!
dialogue_2685=Немедленно вышвырните советский флот из прилегающих вод!
dialogue_2686=Армия США атакует нас одновременно на трех фронтах. Удерживайте города и крепости всеми силами. Ждите удобного момента для контрудара.
dialogue_2687=Подкрепления так и не смогли пробиться. Мы снова остались одни.
dialogue_2688=Советская оборона здесь слаба. Зачистка оставшихся советских баз на полуострове Камчатка не займет много времени.
dialogue_2689=Прошу, помогите передовым отрядам отступить за линию обороны.
dialogue_2690=Союзный флот движется к нам со стороны Берингова моря. Остерегайтесь высадки их второго эшелона!
dialogue_2691=Наша первоочередная задача — связать боем вражеских генералов и организовать оборону, опираясь на выгодный рельеф.
dialogue_2692=Мы вернули себе инициативу. Восстановление снабжения на островах станет отличным началом.
dialogue_2693=Американцы стянули все свои силы для обороны Анкориджа. Сейчас идеальный момент для высадки десанта!
dialogue_2694=Союзный флот нанесет удар с юга Берингова пролива, чтобы прорвать этот «ледяной занавес».
dialogue_2695=Помогите союзным войскам пересечь Берингов пролив и быстро возьмите под контроль район Анкориджа.
dialogue_2696=Все линии обороны прорваны! Оставаться на позициях — значит обречь себя на верную смерть.
dialogue_2697=Перехватите инициативу и отбейте наши позиции!
dialogue_2698=Советская армия, наступая одновременно с суши и с моря, закрепилась на Аляске.
dialogue_2699=Пути к отступлению практически перерезаны советскими войсками. Наш единственный шанс — выстроить новую оборону, используя сложный рельеф Аляски.
dialogue_2700=Мы возьмем на себя американские войска к западу от Анкориджа. Вы продолжайте наступление на восток и замкните кольцо окружения.
dialogue_2701=Мы ворвались во вражеские опорные пункты. Пути назад у них нет.
dialogue_2702=Немедленно бросайте в бой все резервы, чтобы спасти Анкоридж!
dialogue_2703=Исследовательский центр под нашим контролем. Используйте все возможности, чтобы ускорить уничтожение врага!
dialogue_2704=Советские войска прорвали нашу самую мощную крепость. Аляска полностью потеряна.
dialogue_2705=Мы обязаны перехватить инициативу и отбить Фэрбанкс, если хотим выжить.
dialogue_2706=Стремительно берите советские войска в кольцо! Не дайте им развернуть свои боевые порядки.
dialogue_2707=Вражеская оборона отрезала нас от союзников. Мы должны прорвать этот барьер до прибытия подкреплений!
dialogue_2708=Нам удалось разорвать связь между советскими частями. Используйте глубину нашей обороны, чтобы полностью измотать противника.
dialogue_2709=Защитники Ванкувера уничтожены! Путь на Западное побережье открыт.
dialogue_2710=Подкрепления уже на подходе. Защищайте Сиэтл до последней капли крови! Мои войска начнут контрнаступление в сторону Ванкувера.
dialogue_2711=Пусть враг трепещет перед нашим стальным потоком!

dialogue_2651=Войска союзников собраны в единый кулак! Теперь чаша весов склонится на нашу сторону!
dialogue_2652=У союзников гораздо больше ресурсов и техники, чем у нас. Это будет очень тяжелая битва.
dialogue_2653=Замаскируйте 88-мм зенитные орудия в пустыне и окопах, чтобы устроить врагу смертоносную засаду!
dialogue_2654=Враг и не думает сдаваться! Нам придется полагаться на морские конвои в Средиземном море, чтобы вести против них долгую войну на истощение!
dialogue_2655=Держите береговую оборону! Не дайте их подкреплениям ни единого шанса на высадку!
dialogue_2656=Италия подверглась мощному удару союзников! Немецкое командование требует срочно оказать им поддержку!
dialogue_2657=Держитесь, командир! Мы сможем отступить без потерь!

dialogue_2658=Отменить еженедельное воскресное патрулирование Пёрл-Харбора. Наши пилоты должны хорошо отдохнуть.
dialogue_2659=От исхода этой битвы зависит судьба Японской империи. Все офицеры и солдаты обязаны выполнить свой долг с максимальной самоотдачей!
dialogue_2660=«...местами переменная облачность, над горами плотные облака. Видимость в гавани хорошая. Ветер северный, около десяти узлов». В сводке погоды из Гонолулу не было ничего необычного. Враг ни о чем не догадывается.
dialogue_2661=Это не учебная тревога! Пёрл-Харбор атакуют японцы!
dialogue_2662=Тора! Тора! Тора!
dialogue_2663=Задействуйте все средства ПВО! Защитите наши корабли и гавань любой ценой!
dialogue_2664=Лучше бы меня убили одним выстрелом в начале этой атаки, чтобы я не видел этого позора.
dialogue_2665=Боюсь, всё, что мы сделали — это разбудили спящего гиганта и наполнили его страшной решимостью.
dialogue_2666=То... То... То... Всем в атаку!


