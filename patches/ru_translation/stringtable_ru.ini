cp_challenge_8_1=Одержать победу за страну 2★ в режиме «Завоевание 1960» не более чем за [#00FF00#%d] ходов.
cp_challenge_8_2=Одержать победу за страну 3★ в режиме «Завоевание 1960» не более чем за [#00FF00#%d] ходов.
