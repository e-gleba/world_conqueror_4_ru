event_intro_437=6 октября 1944 года войска 2-го Украинского фронта начали Дебреценскую наступательную операцию. Разгромив немецко-венгерскую группировку в Румынии, советские войска освободили Дебрецен и продвинулись вглубь территории на 160 километров. Эта операция серьезно подорвала обороноспособность противника в Венгрии и открыла путь для штурма Будапешта.
event_intro_438=10 октября 1941 года 3-я танковая группа вермахта нанесла удар в направлении Калинина. Немецкое командование планировало захватить город с ходу, а затем обойти Москву с северо-запада. В ответ советское командование спешно сформировало Калининский фронт. Развернулись тяжелые оборонительные бои. Хотя немцам и удалось ворваться в город, ожесточенное сопротивление Красной Армии и суровая зима истощили их силы. Наступление захлебнулось, и фронт стабилизировался.
event_intro_439=В июле 1941 года началось строительство Можайской линии обороны — системы укреплений на западных подступах к Москве. Однако к октябрю, когда к ней подошли передовые части вермахта, линия всё еще не была достроена. 13 октября немцы прорвали южный фланг и захватили Калугу, после чего взломали и центральную зону обороны, заняв ряд ключевых городов. Несмотря на то что остановить врага не удалось, бои на Можайской линии выиграли драгоценное время для переброски резервов и организации защиты самой столицы.
event_intro_440=Осенью 1944 года группа армий «Север» оказалась заперта в Курляндском котле. Чтобы предотвратить деблокаду со стороны Восточной Пруссии и перенести боевые действия на территорию Германии, советское командование бросило в бой войска 3-го Белорусского фронта. Наступление началось 16 октября после мощной артподготовки. Однако густые леса, болота и мощнейшие немецкие укрепления замедлили продвижение Красной Армии. За две недели тяжелейших боев советские войска смогли пробиться лишь к Гумбиннену. Понеся серьезные потери, командование было вынуждено приостановить наступление.
event_intro_441=С 23 по 26 октября 1944 года в заливе Лейте у берегов Филиппин развернулось самое масштабное морское сражение в истории. Союзники стремились перерезать линии снабжения между Японией и ее гарнизонами в Юго-Восточной Азии. В ходе битвы Объединенный флот Японии был практически полностью уничтожен. Японская империя навсегда потеряла превосходство на море и в воздухе, окончательно уступив инициативу американцам.
event_intro_442=Вторая битва при Эль-Аламейне (23 октября — 3 ноября 1942 года) стала решающим поворотным моментом Североафриканской кампании. Опираясь на колоссальный численный перевес в людях и танках, а также абсолютное господство в воздухе, британская 8-я армия под командованием Монтгомери сокрушила итало-немецкие войска Роммеля. Разгромленные силы Оси были вынуждены начать безостановочное отступление вплоть до самого Туниса.
event_intro_443=Итало-греческая война началась 28 октября 1940 года со вторжения итальянской армии с территории Албании. Ожидая легкой победы, Муссолини просчитался: греческая армия не только остановила наступление, но и перешла в мощную контратаку, отбросив итальянцев назад. К декабрю греки контролировали почти четверть территории Албании. Спасать союзника от полного позора пришлось Гитлеру: 6 апреля 1941 года вермахт вторгся в Югославию и Грецию, предрешив исход кампании.
event_intro_444=Бугенвильская кампания — серия затяжных сражений между союзниками и Японией на Соломоновых островах, продолжавшаяся с ноября 1943 года до самой капитуляции Японии в августе 1945 года. На первом этапе американские войска захватили плацдарм на мысе Торокина и выстроили мощную оборону. На втором этапе австралийские части начали методичное уничтожение изолированного японского гарнизона, укрывшегося в джунглях.
event_intro_445=Утром 3 ноября 1943 года советские войска после мощнейшей артиллерийской подготовки перешли в наступление с Лютежского плацдарма к северу от Киева. Немецкое командование спешно попыталось организовать контратаку, но было сметено стремительным танковым ударом Красной Армии. Опасаясь окружения, вермахт бросил город. 6 ноября Киев был полностью освобожден. Эта блестящая победа деморализовала противника и открыла путь для освобождения всей Правобережной Украины.
event_intro_446=Выполняя обязательства перед СССР по открытию Второго фронта, союзники разработали операцию «Факел» — масштабную высадку во французской Северной Африке. 8 ноября 1942 года американо-британский десант атаковал Касабланку, Оран и Алжир. Войска вишистской Франции практически не оказали сопротивления. К 16 ноября все ключевые порты оказались в руках союзников, став главными логистическими базами для окончательного разгрома итало-немецкой группировки в Африке.
event_intro_447=Для нейтрализации итальянского флота в Средиземном море британское командование спланировало дерзкую операцию. В ночь на 11 ноября 1940 года торпедоносцы «Сордфиш», взлетевшие с авианосца «Илластриес», нанесли сокрушительный удар по итальянским линкорам, стоявшим на якоре в бухте Таранто. За одну ночь Италия потеряла половину своих линейных сил. Это был первый в истории успешный удар палубной авиации по тяжелым кораблям в защищенной базе. Опыт Таранто был тщательно изучен японцами при подготовке атаки на Пёрл-Харбор.
event_intro_448=Морское сражение за Гуадалканал (12–15 ноября 1942 года) стало кульминацией борьбы за контроль над водами Соломоновых островов. Японский флот предпринял отчаянную попытку доставить подкрепления гарнизону и обстрелять аэродром Хендерсон-Филд. В ходе серии жестоких ночных боев обе стороны понесли тяжелые потери, но союзникам удалось сорвать планы противника. После этого поражения Япония лишилась возможности снабжать свои войска и вскоре была вынуждена эвакуировать гарнизон Гуадалканала.
event_intro_449=18 ноября 1941 года британские войска начали операцию «Крусейдер». Целью наступления была деблокада осажденного гарнизона Тобрука и разгром сил Оси в Ливии. В пустыне развернулись ожесточенные маневренные танковые бои. Обе стороны несли огромные потери, но британцам удалось истощить ресурсы Африканского корпуса. Роммель был вынужден снять осаду Тобрука и отступить, что стало первой крупной победой британской армии над немецкими сухопутными войсками.
event_intro_450=Битва за Ростов (17 ноября — 2 декабря 1941 года) стала одним из первых успешных контрударов Красной Армии в войне. Наряду с битвой под Москвой, она разрушила миф о непобедимости вермахта. Немецкие танковые части группы армий «Юг» сумели ворваться в Ростов, но оказались в огневом мешке. Советские войска нанесли мощные фланговые удары, грозя окружением, что вынудило генерала Клейста отдать приказ об отступлении и оставить город.
event_intro_451=В ноябре 1942 года советское командование начало масштабную операцию «Марс», целью которой было окружение и уничтожение 9-й немецкой армии в Ржевском выступе. Наступление велось сразу с нескольких направлений. Однако операция потерпела крах. Красная Армия столкнулась с глубоко эшелонированной обороной и понесла катастрофические потери в людях и технике, так и не добившись значимых территориальных успехов. В советской историографии об этой трагической битве долгие годы предпочитали умалчивать.
event_intro_452=Зимняя война (Советско-финляндская война) началась 30 ноября 1939 года. СССР стремился отодвинуть границу от Ленинграда, но финская армия оказала яростное сопротивление на «Линии Маннергейма». Из-за плохой подготовки, суровых морозов и тактики финских лыжников-снайперов Красная Армия понесла огромные потери. Несмотря на прорыв финской обороны в феврале 1940 года, победа досталась СССР слишком высокой ценой. 13 марта был подписан Московский мирный договор, по которому Финляндия сохранила независимость, но уступила часть своих территорий.
event_intro_453=1 декабря 1941 года немецкая группа армий «Центр» предприняла последнюю попытку прорваться к Москве, нанеся удар в районе Наро-Фоминска. На этом участке оборону держали немногочисленные части советской 33-й армии. Немцы быстро прорвали фронт и продвинулись вглубь на несколько километров. Однако командование Западного фронта оперативно перебросило резервы и нанесло фланговые контрудары. К 5 декабря немецкая группировка была отброшена на исходные позиции. Наступление на Москву окончательно захлебнулось.
event_intro_454=5 декабря 1941 года, когда измотанные немецкие войска перешли к обороне под Москвой, советский Калининский фронт перешел в решительное контрнаступление. В первые дни немцы оказывали яростное сопротивление, сдерживая продвижение Красной Армии. Однако тридцатиградусные морозы, обморожения и критическая нехватка зимнего обмундирования сломили боевой дух вермахта. 16 декабря Калинин был полностью очищен от врага, и советские войска устремились в преследование отступающего противника.

