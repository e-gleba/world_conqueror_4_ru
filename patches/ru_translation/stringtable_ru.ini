countrytech_desc_122=Пехота восстанавливает 15% от максимального запаса ОЗ каждый ход.
countrytech_desc_123=Элитная пехота при атаке может вызвать удар штурмовика (1 раз за раунд).
countrytech_desc_124=Элитная пехота при атаке имеет 10% шанс повергнуть врага в состояние хаоса на 2 хода.
countrytech_desc_125=Элитная пехота получает на 50% меньше урона от бронетехники и артиллерии.
