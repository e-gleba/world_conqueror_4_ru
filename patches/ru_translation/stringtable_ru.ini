;;normal texts,tips
;__font_type[font_text_1]
tips_1=Улучшение технологий делает ваши войска значительно сильнее.
tips_2=Чудеса света открываются за прохождение сценариев и испытаний.
tips_3=Построив определенные чудеса света, вы будете ежедневно получать золото, промышленность, энергию и технологии.
tips_4=На торговом рынке можно обменивать одни ресурсы на другие.
tips_5=Проходя испытания и побочные миссии, вы сможете получить больше ресурсов и наград.
tips_6=Грамотное использование воздушного десанта способно переломить ход любой битвы.
tips_7=Ядерное оружие можно доставлять с помощью ракет или стратегических бомбардировщиков.
tips_8=Системы ПВО эффективно снижают урон от вражеских авиаударов и ракетных обстрелов.
tips_9=Строительство фортификаций улучшает оборону, но требует времени на возведение.
tips_10=При перемещении по воде сухопутные войска находятся на транспортных судах. Транспортам следует избегать прямого столкновения с флотом противника.
tips_11=Чем выше звание генерала, назначенного на миссию, тем выше шанс на успех и лучше награды.
tips_12=Повышайте уровень штаба, чтобы увеличить лимит генералов, которых можно нанять.
tips_13=Продвинутые навыки можно открыть, захватывая особые ключевые точки в сценариях.
tips_14=При уничтожении вражеского отряда есть вероятность повышения боевого духа ваших войск, что увеличит их эффективность.
tips_15=Если боевой дух противника упал, это идеальный момент для решительной атаки.
tips_16=Боевой дух войск падает, когда они зажаты с флангов или попадают в полное окружение.
tips_17=Радиус действия палубной авиации авианосцев зависит от уровня технологий ваших ВВС.
tips_18=Подводные лодки — лучшее средство для борьбы с крупными кораблями, такими как крейсеры и авианосцы.
tips_19=Пехота с навыком «Сапер» получает значительно меньше урона от наземных мин.
tips_20=Количество ходов, количество захваченных городов и наличие генералов влияют на итоговый ранг в Завоевании.
tips_21=Уровень технологий штаба ограничивает максимальный уровень зданий в городах, а от уровня зданий зависит тип доступных для найма войск.
tips_22=Войска из штаба используются для участия в учениях, вторжениях и других специальных битвах.


challenge_2=Защитите наши ключевые точки и уничтожьте ключевые точки противника.
challenge_3=Не дайте врагу захватить наши ключевые точки.
challenge_4=Уничтожьте ключевые точки противника как можно скорее.


