dialogue_4366=Немецкая армия стоит у наших ворот, но их ждет вовсе не пустой город. Они рассчитывают на быструю победу, но мы остановим их своей непоколебимой решимостью.
dialogue_4367=Солдаты, уходящие в бой прямо с парада на Красной площади, заставили врага понять: за каждый шаг вперед немцы заплатят реками крови!
dialogue_4368=Враг пытается взять нас в клещи с севера и юга. Если им это удастся, наша линия обороны будет прорвана. Мы обязаны удержать позиции, разбить их по частям и не дать замкнуть кольцо!
dialogue_4369=Я уже могу разглядеть красную звезду на башне Кремля.
dialogue_4370=Их дороги будут стерты в пыль, их оборона — разорвана в клочья. Никакое сопротивление не сможет изменить исход этой войны.
dialogue_4371=Генерал Жуков прибыл на передовую. Всем подразделениям: удерживать позиции и заставить врага истечь кровью в бесплодных атаках. Время работает на нас.
dialogue_4372=С тактической точки зрения ситуация складывается в нашу пользу, а Москва уже совсем близко.
dialogue_4373=Если смотреть правде в глаза, наши танковые дивизии тают на глазах, а температура продолжает падать. На запуск двигателей и обслуживание техники уходит слишком много времени, а подвоз топлива и боеприпасов безнадежно отстает от графика.
dialogue_4374=Без логистики не может быть маневренной войны; а без маневров само существование бронетанковых войск теряет всякий смысл.
dialogue_4375=Фельдмаршал фон Рундштедт и генерал фон Манштейн получили приказ перебросить войска для усиления фронта под Москвой.
dialogue_4376=Разведка подтверждает: Япония не собирается нападать на Советский Союз в ближайшее время. Свежие сибирские дивизии с Дальнего Востока уже на подходе!
dialogue_4377=Мы должны признать, что обстоятельства складываются не в нашу пользу, но Москва остается единственной целью решающего стратегического значения. Даже если наши шансы на успех тают, других вариантов просто нет.
dialogue_4378=Продолжайте прорываться к Москве любой ценой!
dialogue_4379=Конечно, они помнят историю. Наверняка они изучали, анализировали и даже высмеивали то поражение Наполеона.
dialogue_4380=Просто они, как и Наполеон в свое время, свято верят в то, что станут исключением из правил.
dialogue_4381=У врага не было иного выхода, кроме как отступить, хотя их основные силы так и не были уничтожены. Однако и этого было достаточно, чтобы развеять миф о непобедимости немецкой армии и навсегда похоронить концепцию блицкрига.

