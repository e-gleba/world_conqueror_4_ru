;Правила Боевой зоны
warzone_rule=Правила Боевой зоны
warzone_rule_1=Каждая Боевая зона разделена на обычные этапы и этап с боссом. Босс открывается только после прохождения всех обычных этапов. На обычных этапах показаны типы войск, которые в основном будут противостоять вам.
warzone_rule_2=Для смены или сброса Боевой зоны требуются очки командования, которые восстанавливаются ежедневно в строгое время (в 08:00 и 20:00 по времени UTC+8).
warzone_rule_3=Очки начисляются за нанесение урона войскам противника (включая укрепления и любые вызванные ими подкрепления). После завершения этапа его нельзя пройти повторно. Генералы, использованные в предыдущих боях текущей зоны, не могут быть выставлены снова. Рекомендуется заранее планировать распределение генералов между этапами.
warzone_rule_4=Когда ваш исторический рекорд очков в Боевой зоне достигает определенной отметки, вы получаете разовую награду за достижения. При каждом прохождении этапа босса вы также получаете награду в виде медалей, размер которой зависит от вашего суммарного счета за текущий проход (нажмите на сундук, чтобы узнать условия).
warzone_rule_5=Когда ваши суммарные рекорды по всем Боевым зонам достигнут определенного порога, откроется функция «Зачистка». Потратив Билеты зачистки, вы сможете моментально завершать уровни и получать медали.

mission_to_tutorial=Перед прохождением миссий настоятельно рекомендуем пройти три обучающих этапа, чтобы получить бесплатного генерала.

skill_unlock=Условие разблокировки: Сценарий \\ {0} \\ {1} \\ Этап {2} \\ {3} {4} Захватить зеленую цель
general_stage_unlock=Пройдите кампанию «Тихий океан» (Вторая мировая война), чтобы открыть этот режим.
general_src_cp=Условие получения: Вызов Завоевания \\ Боевой пропуск Завоевания
general_src_sp=Условие получения: Событие \\ Пропуск новичка
general_src_dr=Условие получения: Событие \\ Награды за вход

invade_teaching=Обучение вторжениям
starter_entry=По достижении 10-го уровня Штаба кнопка быстрого входа исчезнет, но вы всё ещё сможете войти через меню Событий.
warzone_lock_tips2=Пройдите кампанию «Европа» (Вторая мировая война) и наймите не менее 8 генералов.


skill_name_160=Финансы
skill_name_161=Модернизация ВВС
skill_info_160=Если экономический доход города, в котором находится генерал, составляет не менее 100 ед. (если у генерала есть навыки «Экономист» или «Промышленник», порог снижается до 70 ед.), то в начале каждого хода вы получаете дополнительно [#00FF00#%d] единиц золота.
skill_info_161=При нанесении критического урона авиацией или ракетами урон увеличивается на [#00FF00#%d%%].

disband=Распустить
disband_the_army=Распущенные войска исчезнут навсегда. Вы уверены, что хотите продолжить?

dialogue_3536=Мы обеспечим ваши войска бесперебойным снабжением.
dialogue_3537=Предстоящие сражения будут более жестокими, чем всё, с чем вы сталкивались ранее.
dialogue_3538=Выглядит знакомо? Прямо сейчас такие сцены происходят по всему миру. Вы можете стать следующими.
dialogue_3539=Наше контрнаступление начинается сейчас!
dialogue_3540=Враг начал одновременное наступление со всех направлений. Многие города уже пали.
dialogue_3541=Я покажу всем, что у меня достаточно сил и мужества, чтобы сражаться за свободу!
dialogue_3542=Наш штаб получил множество разведданных о вражеских силах, их технике и вооружении. Командиры, добывшие эти данные, будут сражаться бок о бок с нами в будущих операциях.
dialogue_3543=Это лучшие бойцы, что у нас есть. Вы знаете, что делать.
dialogue_3544=Мы совершенно не в состоянии сдержать их наступление.
dialogue_3545=Сначала эвакуируйте войска с дальневосточных баз, а затем внимательно следите за маневрами Советов.
dialogue_3546=Согласно разведданным Альфреда, оборонительная система противника на Суматре уязвима.
dialogue_3547=Мы начнем рейд здесь, чтобы выйти на след Осборна.
dialogue_3548=Крайне подозрительно, что британцы осмелились атаковать Сингапур такими малыми силами.
dialogue_3549=Удерживайте периметр вокруг ядерного объекта! Мы не имеем права отдать его Советам!
dialogue_3550=Мы начнем наступление с моря и отрежем противнику пути к отступлению.
dialogue_3551=Высаживайтесь как можно скорее, чтобы сокрушить вражеские силы на юге.
dialogue_3552=Тот, кто понимает время — мудр, а тот, кто видит возможности — отважен.
dialogue_3553=Вы не оставили мне выбора.
dialogue_3554=Скоординируйте действия с союзниками, возьмите береговую оборону в клещи и уничтожьте её.
dialogue_3555=Похоже, основных сил вражеского флота здесь нет. Мы пустим на дно каждую вражескую посудину в этом секторе!
dialogue_3556=Я буду удерживать позиции до прибытия подкреплений.
dialogue_3557=Ваша победа ничего не значит. Мы еще вернемся.
dialogue_3558=Данные с базы «Черного скорпиона» успешно восстановлены, но информации об Осборне там нет.
dialogue_3559=Альфред, в прошлом бою ты уже доказал нам свою преданность. Я уверен, ты найдешь способ покончить с Осборном раз и навсегда.
dialogue_3560=Предоставьте это мне.
dialogue_3561=Пора начинать!
dialogue_3562=«Черный скорпион» уже давно терпит неудачу за неудачей. Возможно, их было куда больше, чем мы думаем.
dialogue_3563=Как ты здесь оказался?
dialogue_3564=Чтобы стать свидетелем твоей гибели — той самой, ради которой ты был готов пожертвовать всеми нами.
dialogue_3565=Я помогу тебе достичь желаемого.
dialogue_3566=Я — это другая версия тебя. Увидимся на той стороне.
dialogue_3567=Я никогда не сомневаюсь в своих решениях.
dialogue_3568=Силы врага значительно превосходят мои расчеты.
dialogue_3569=Это зов судьбы.
dialogue_3570=Наша битва еще далека от завершения.
dialogue_3571=Операция выполнена, пора отступать.
dialogue_3572=Давайте на этом и закончим.
dialogue_3573=США и Советский Союз крепко держатся за свое превосходство.
dialogue_3574=Разведка снова ошиблась. Придется оценивать обстановку на месте.
dialogue_3575=Альфред, ты успешно завершил всё... но на самом деле ты ничего не закончил.
dialogue_3576=Установки запущены, мы уже давно готовы к отправке.
dialogue_3577=Эти устройства отсканируют тебя и создадут новую версию, сохранив все твои навыки и воспоминания.
dialogue_3578=Ты всего лишь пережиток старого мира, и ты сгинешь здесь вместе со мной.
dialogue_3579=Возможно, ты прав. Но даже в самых страшных кошмарах я останусь верен самому себе.
dialogue_3580=Возможно, мы скоро увидимся вновь.
dialogue_3581=Теперь вы все можете приступать.
dialogue_3582=Нам очень жаль, что правда оказалась именно такой.
dialogue_3583=Уничтожьте все оставшиеся силы врага и верните контроль над базой в Антарктике!

