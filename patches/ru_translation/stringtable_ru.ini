elite_intro_86=Межконтинентальная баллистическая ракета «Тополь-М» — модернизированная версия советского ракетного комплекса РТ-2ПМ «Тополь». Благодаря мощной тяге трехступенчатого твердотопливного двигателя ракета развивает скорость свыше 20 махов, а её дальность позволяет поражать цели на всей территории США с баз в России.
elite_intro_87=Эскадренные миноносцы типа «Арли Бёрк» — основа надводного флота ВМС США и одни из самых мощных боевых кораблей в мире. Оснащены установками вертикального пуска Mk 41, позволяющими вести огонь зенитными ракетами и крылатыми ракетами «Томагавк» для одновременного поражения множества целей. Отлично зарекомендовали себя в миссиях эскорта, войне с терроризмом и Второй войне в Персидском заливе.

feat_name_110=Маскировка на местности
feat_name_111=Массированный удар
feat_name_112=Нано-ремонт
feat_name_113=Лазерное наведение
feat_name_114=Помехи СУО
feat_name_115=Подавление

feat_desc_110=При нахождении в горах или лесах получаемый урон снижается на {1}%.
feat_desc_111=Запускает серию баллистических ракет малой дальности. Наносит {1}% урона от базового урона ракет основной цели и {2}% урона соседним целям. Перезарядка: 3 хода.
feat_desc_111_Lv2=Запускает серию баллистических ракет малой дальности. Наносит {1}% урона от базового урона ракет основной цели и {2}% урона соседним целям. Перезарядка: 2 хода.
feat_desc_111_Lv3=Запускает серию баллистических ракет средней дальности. Наносит {1}% урона от базового урона ракет основной цели и {2}% урона соседним целям. Перезарядка: 2 хода.
feat_desc_112=Восстанавливает {1}% от максимального запаса ОЗ в начале хода. При полном запасе ОЗ получаемый урон снижается на {2}%.
feat_desc_113=Урон по любым целям, кроме зданий, увеличен на {1}%.
feat_desc_114=При атаке есть {0}% шанс наложить на врага эффект, блокирующий возможность нормальной атаки и ответного огня на 1 ход.
feat_desc_115=При уничтожении вражеского отряда есть {1}% шанс снизить боевой дух остальных противников в радиусе 1 клетки.

army_buff_desc_1391=Сбой систем управления огнем (СУО): невозможно совершить атаку или открыть ответный огонь (не влияет на авиацию и ракетные удары).


dialogue_2883=Господа, Гуам беззащитен. Мы обязаны взять его в кратчайшие сроки!
dialogue_2884=4-я танковая армия прорывается к Сталинграду для деблокирования 6-й армии Паулюса!
dialogue_2885=Держать позиции! Котел не должен быть прорван!
dialogue_2886=6-я армия, немедленно идите на прорыв навстречу нашим танкам!
dialogue_2887=Всем частям — занять глухую оборону! Откажитесь от попыток прорыва и ждите деблокады.
dialogue_2888=Смять их оборону! Через Арденны — прямо на Антверпен!
dialogue_2889=Немцы не должны перерезать наши линии снабжения!
dialogue_2890=Всем подразделениям: стянуть силы к Динану и остановить немецкое наступление!
dialogue_2891=Солдаты, время возмездия! Уничтожьте всю их группировку на выступе!
dialogue_2892=Продолжение наступления бессмысленно. Всем частям отступить и сохранить личный состав.
dialogue_2893=Мы обязаны взять Бастонь, чтобы обеспечить безопасный проход войск через Арденны!
dialogue_2894=Бастонь, держитесь! 3-я армия уже спешит на помощь!
dialogue_2895=Нанести стремительный удар и деблокировать Бастонь!
dialogue_2896=Товарищи, враг обескровлен. Разгромите группу армий «Юг» и освободите Украину!
dialogue_2897=Стоять насмерть! Ни шагу назад!
dialogue_2898=Всем частям: закрепиться на рубежах, отступать только перекатами и беречь людей.
dialogue_2899=Генерал Ватутин ранен. Я принимаю командование. Вся армия — по моему сигналу, продолжаем наступление!
dialogue_3100=Немецкий линкор «Шарнхорст» охотится на наши конвои. Пустите его на дно! После этого арктический маршрут будет безопасен.
dialogue_3101=Товарищи, враг жег наши дома и расстреливал наших братьев. Время расплаты пришло! В атаку!
dialogue_3102=Враг лицемерно предлагает нам сдаться, но их цель — наше полное уничтожение. Солдаты, держите город! Подкрепления в пути, победа будет за нами!
dialogue_3103=Будапешт обречен. Кто может — прорывайтесь, кто не может — сдавайтесь. Страна не забудет вашей жертвы.
dialogue_3104=Враг двинулся на север! Ударьте в слабое место и возьмите Страсбург!
dialogue_3105=Эльзас почти не защищен. Мы должны уйти в глухую оборону. В случае необходимости — отходить в Вогезы и строить там новый рубеж.
dialogue_3106=Взять Страсбург и вышвырнуть врага из Вогезов!
dialogue_3107=Части из Арденн идут нам на помощь!
dialogue_3108=Из США переброшены тысячи солдат и сотни самолетов. Мы обязаны продержаться до их прибытия. Отступать больше некуда.
dialogue_3109=Я ушел, но я вернусь!
dialogue_3110=Старые солдаты не умирают, они просто растворяются в истории.
dialogue_3111=Вы можете взять меня в плен, Батаан может пасть, но дух свободных людей вам не сломить!
dialogue_3112=Десант на берег! Наступаем на юго-восток для освобождения Манилы!
dialogue_3113=Если не можете удержать фронт — отходите в горы и начинайте партизанскую войну!
dialogue_3114=Товарищи, ленинградцы держались долгие месяцы. Мы обязаны разорвать кольцо! В атаку! Освободите Ленинград!
dialogue_3115=Блокада Ленинграда прорвана! Немцам нас не остановить!
dialogue_3116=Генерал фон Кюхлер отстранен. Группа армий переходит под мое командование.
dialogue_3117=Малые группы отвлекут противника на левом фланге, а основные силы обойдут их справа и пробьют оборону сокрушительным ударом!
dialogue_3118=Используйте горы и реки для выстраивания обороны. Не сдавать ни одной позиции!
dialogue_3119=Монастырь Монтекассино наверняка используется врагом как наблюдательный пункт. Начинаем авианалет. Солдаты, готовьтесь к штурму руин!
dialogue_3120=Солдаты, в атаку! Вернем территорию Франции!
dialogue_3121=19-я армия, немедленный отход! Избегайте окружения!
dialogue_3122=Наша главная задача — уничтожение вражеской группировки. Замкнуть кольцо с севера и юга, затем приступить к ликвидации окруженных.
dialogue_3123=Котел закрыт! Товарищи, в атаку! Уничтожьте их!
dialogue_3124=Ударьте снаружи и помогите нашим прорвать кольцо окружения!
dialogue_3125=Части на выступе должны немедленно отойти для перегруппировки. Остальным — стабилизировать фронт.
dialogue_3126=Сначала разгромите врага в окрестностях Оулу, затем перенесите удар на юг.
dialogue_3127=Немецкие подкрепления уже на позициях. Враг не ожидает удара такой силы.
dialogue_3128=Солдаты, перережьте их коммуникации и задержите резервы! Исход битвы предрешен!
dialogue_3129=Я уеду за границу и буду продолжать борьбу, пока Финляндия не станет независимой и свободной!
dialogue_3130=Вы не добьетесь независимости Финляндии, даже если победите при поддержке Советов!
dialogue_3131=Японская оборона здесь слаба. Мы покажем им всю мощь американского флота!
dialogue_3132=Палубная авиация в воздухе. Сейчас они на собственной шкуре узнают, что такое удар с авианосца!
dialogue_3133=Всем подразделениям: к врагу подошли резервы. Ускорить выполнение задачи!
dialogue_3134=Товарищи, враг окопался на том берегу. Артиллерия, покажите им, на чьей стороне правда!
dialogue_3135=Мы стоим на границе Рейха. Любое отступление перенесет войну на землю Германии.
dialogue_3136=Товарищи, враг уже задерживал наше наступление, но в этот раз им придется растянуть свои резервы.
dialogue_3137=Солдаты, мы уже отбивали их атаки. В этот раз мы сделаем это ради Родины!

event_208=Зарождение Империи Скорпиона

