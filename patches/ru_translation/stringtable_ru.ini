feat_desc_152=При атаке на сухопутные или военно-морские силы шанс уклониться от урона составляет {1}%. При атаке на воздушные цели шанс уклониться составляет {2}% (не защищает от ракет и ядерного оружия).
feat_desc_153=После любого перемещения ваша мобильность на следующий ход снижается на {2} (но не может упасть ниже 2 клеток). Полная мобильность восстанавливается после 1 хода бездействия, если отряд находится в радиусе 1 клетки от союзного города или инженерных войск.
feat_desc_153_Lv2=После любого перемещения ваша мобильность на следующий ход снижается на {2} (но не может упасть ниже 2 клеток). Полная мобильность восстанавливается после 1 хода бездействия, если отряд находится в радиусе 1 клетки от союзного города или инженерных войск.
feat_desc_153_Lv3=После любого перемещения ваша мобильность на следующий ход снижается на {2} (но не может упасть ниже 2 клеток). Полная мобильность восстанавливается после 1 хода бездействия, если отряд находится в радиусе 2 клеток от союзного города или инженерных войск.
feat_desc_153_Lv4=После любого перемещения ваша мобильность на следующий ход снижается на {2} (но не может упасть ниже 2 клеток). Полная мобильность восстанавливается после 1 хода бездействия, если отряд находится в радиусе 2 клеток от союзного города или инженерных войск.
feat_desc_154=Урон по бронетехнике и артиллерии увеличен на {0}%. Если после атаки цель выжила, её мобильность снижается на 1 ход. Если цель уничтожена, вы можете атаковать снова, но урон каждой последующей атаки будет снижен на {1}%. Максимум дополнительных атак за ход: {2}.
feat_desc_154_Lv2=Урон по бронетехнике и артиллерии увеличен на {0}%. Если после атаки цель выжила, её мобильность снижается на 1 ход. Если цель уничтожена, вы можете атаковать снова, но урон каждой последующей атаки будет снижен на {1}%. Максимум дополнительных атак за ход: {2}.
feat_desc_154_Lv3=Урон по бронетехнике и артиллерии увеличен на {0}%. Если после атаки цель выжила, её мобильность снижается на 1 ход. Если цель уничтожена, вы можете совершить еще одно действие, но урон каждой последующей атаки будет снижен на {1}%. Максимум дополнительных действий за ход: {2}.
feat_desc_154_Lv4=Урон по бронетехнике и артиллерии увеличен на {0}%. Если после атаки цель выжила, её мобильность снижается на 1 ход. Если цель уничтожена, вы можете совершить еще одно действие, но урон каждой последующей атаки будет снижен на {1}%. Максимум дополнительных действий за ход: {2}.
feat_desc_155=Урон по бронетехнике, артиллерии и кораблям увеличен на {2}%.
feat_desc_155_Lv2=Дальность атаки увеличена на {1}. Урон по бронетехнике, артиллерии и кораблям увеличен на {2}%.
feat_desc_155_Lv3=Дальность атаки увеличена на {1}. Урон по бронетехнике, артиллерии и кораблям увеличен на {2}%.
feat_desc_155_Lv4=Дальность атаки увеличена на {1}. Урон по бронетехнике, артиллерии и кораблям увеличен на {2}%.
feat_desc_156=В этом ходу ваша атака наносит {2}% сплеш-урона максимум {1} вражеским отрядам в радиусе 1 клетки от цели. Приоритет отдается пехоте и небронированным целям. Действует 1 ход. Перезарядка: 3 хода.
feat_desc_156_Lv2=В этом ходу ваша атака наносит {2}% сплеш-урона максимум {1} вражеским отрядам в радиусе 1 клетки от цели. Приоритет отдается пехоте и небронированным целям. Действует 1 ход. Перезарядка: 3 хода.
feat_desc_156_Lv3=В этом ходу ваша атака наносит {2}% сплеш-урона максимум {1} вражеским отрядам в радиусе 2 клеток от цели. Приоритет отдается пехоте и небронированным целям. Действует 1 ход. Перезарядка: 2 хода.
feat_desc_156_Lv4=В этом ходу ваша атака наносит {2}% сплеш-урона максимум {1} вражеским отрядам в радиусе 2 клеток от цели. Приоритет отдается пехоте и небронированным целям. Действует 1 ход. Перезарядка: 2 хода.
feat_desc_157=После атаки вы можете атаковать еще раз (максимум до {1} раз).
feat_desc_157_Lv4=После атаки вы можете атаковать еще раз (максимум до {1} раз). С каждой атакой, совершенной в этом ходу, урон следующей атаки увеличивается на 20% (эффект суммируется до 3 раз).

