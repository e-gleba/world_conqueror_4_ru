card_desc_1=Выберите союзный отряд, чтобы повысить боевой дух всех союзников в радиусе 3 клеток.
card_desc_2=Выберите вражеский город или крепость, чтобы заблокировать им возможность найма войск на 2 хода.
card_desc_3=Выберите вражеский отряд и повергните его в состояние Хаоса на 2 хода.
card_desc_4=Выберите союзный отряд и восстановите 30% его ОЗ.
card_desc_5=Стоимость найма следующих подкреплений (в очках заслуг) снижена на 2.
