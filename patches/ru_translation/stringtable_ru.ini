armygroup_event_desc_204=Серия операций «Скорпиона» на территории США была сорвана одна за другой, и вся армия начала широкомасштабное отступление на юг. При содействии США и СССР несколько стран вышли из-под контроля «Чёрного скорпиона».
armygroup_event_desc_205=Осборн одновременно активировал пять усилителей маяка, запустив финальный отсчёт. Через 15 циклов любой, лишённый твёрдой решимости, вновь примкнёт к империи «Скорпиона». США, СССР, Великобритания и Франция направили свои элитные силы и совместно с соседними странами нанесли удары по руинам «Скорпиона» по всему миру.
armygroup_event_desc_206=Солнечная крепость империи «Скорпион» в мексиканских руинах прорвана, усилитель маяка захвачен. Расположение тайных баз по всему миру полностью раскрыто, стратегическое положение империи «Скорпион» стало полностью уязвимым.
armygroup_event_desc_207=Бункер «Эхо» империи «Скорпион» в колумбийских руинах прорван, усилитель маяка захвачен. Все объекты в руинах были настроены на самоуничтожение. Однако сохранившиеся журналы доступа указывают, что объект был вновь активирован в 1933 году.
armygroup_event_desc_208=Древние руины империи «Скорпион» в Бразилии, Око Инки, прорваны, усилитель маяка захвачен. Крайне важно, что множество специализированного вооружения и техники не было своевременно вывезено или уничтожено; обнаружены даже ранее не встречавшиеся чертежи новых образцов военной техники.
armygroup_event_desc_209=Храм звёздных троп империи «Скорпион» в бразильских руинах прорван, усилитель маяка захвачен. По итогам боя США и СССР захватили большое количество зашифрованных данных, полностью раскрыв глобальные списки личного состава и военные планы империи «Скорпион».
armygroup_event_desc_210=Ураганный маяк империи «Скорпион» в руинах Бразилии прорван, усилитель маяка захвачен. Связь между главными силами империи «Скорпион» и её членами по всему миру временно прервана.
armygroup_event_desc_211=С течением времени США и СССР решили объединить усилия для искоренения этой угрозы. Варшавский договор и НАТО временно приостановили боевые действия и образовали новый военный союз.
armygroup_event_desc_212=Осборн потерпел сокрушительное поражение, отсчёт остановлен. Планы «Скорпиона» в Южной Америке также полностью сокрушены.
armygroup_event_desc_213=Все объекты руин, принадлежавшие империи «Скорпион», заняты, отсчёт остановлен. Планы «Чёрного скорпиона» в Южной Америке полностью сорваны.
armygroup_event_desc_214=Осборн потерпел сокрушительное поражение, отсчёт остановлен. Планы «Скорпиона» в Южной Америке также полностью сокрушены. Все услышали зов свободы.
armygroup_event_desc_215=Все объекты руин, принадлежавшие империи «Скорпион», заняты, отсчёт остановлен. Планы «Чёрного скорпиона» в Южной Америке полностью сорваны. Все услышали зов свободы.
armygroup_event_desc_216=Последний оставшийся усилитель маяка полностью развёрнут. Из-за длительного скрытого распространения «Скорпионом» наномедицины с примесью Q30 в зоне контроля с ударом колокола поражённые постепенно утрачивают самостоятельное сознание, возвращаясь в итоге на сторону «Скорпиона».
armygroup_event_desc_217=Среди руин майя обнаружены новые хрустальные черепа. Это не простые артефакты, а накопители, записывающие сведения о храме и исторические данные неизвестных цивилизаций.
armygroup_event_desc_218=Корпус Новой Швабии появился в южноамериканских джунглях с вооружением «Скорпиона». Возможно, они заключили с ним военный союз, или же «Скорпион» является движущей силой их существования.
armygroup_event_desc_219=Советский Союз поставил Венесуэле большое количество танков для создания бронетанкового оборонительного рубежа против наступления американских войск и их союзников.
armygroup_event_desc_220=«Скорпион» вооружил пиратов, позволив им грабить торговые суда разных стран в нескольких морях. Это вызвало ответные действия как США, так и СССР. Нарастив военно-морские силы, флоты различных государств объединились для полномасштабной кампании против пиратов.
armygroup_event_desc_221=Военно-морские силы «Скорпиона» используют «акустический туман» для нарушения работы радаров, непрерывно совершая налёты на судоходные пути в районе Панамского канала. Линии снабжения вооружённых сил различных стран серьёзно нарушены.
armygroup_event_desc_222=США тайно перебросили по воздуху компоненты ракет в Бразилию этим маршрутом через Колумбию и Перу, успешно избежав обнаружения «Скорпионом» и Советским Союзом.
armygroup_event_desc_223=Куба вновь подверглась атаке, региональное равновесие снова нарушено. Тем временем СССР оперативно оказал Кубе массированную военную помощь.
armygroup_event_desc_224=США развернули в восточной части Карибского моря мощную гидроакустическую систему для обнаружения и слежения за советскими подводными лодками.
armygroup_event_desc_225=Советское испытание экспериментального аппарата колебания земной коры вызвало землетрясение в районе стыка границ Чили, Боливии и Аргентины. Из-за крайней неуправляемости исследования этого оружия были в итоге прекращены.
armygroup_event_desc_226=Советский Союз испытал на Кубе метеорологическое оружие «Око бури», успешно направив ураган на Флориду.
armygroup_event_desc_227=В странах региона, находящихся под контролем «Скорпиона», стали появляться радиостанции, созданные антискорпионовскими организациями. Они непрерывно передают призывы к народу оккупированных территорий объединиться и свергнуть власть империи «Скорпион».
armygroup_event_desc_228=С целью не допустить всесторонней разведки южноамериканского региона спутниками-шпионами США и СССР «Скорпион» создал станции помех на островах в крупнейших океанах мира для подавления и перехвата сигналов, перехватывая спутниковые данные США и СССР.
armygroup_event_desc_229=Королевский флот обнаружил в районе Бермуд немецкую атомную подводную лодку времён Второй мировой войны под названием «Наутилус». Эта субмарина полностью отличается от построенного позже американским флотом «Наутилуса». Несмотря на постройку во время Второй мировой, лодка осталась неповреждённой, а технический уровень её оборудования далеко превосходит ту эпоху — и даже современные технологии.
armygroup_event_desc_230=Открытие крупного нефтяного месторождения в бразильском тропическом лесу вызвало ожесточённую борьбу за права на добычу между США, СССР и империей «Скорпион» на перуано-бразильской границе.
armygroup_event_desc_231=После изгнания фракции «Скорпиона» из Северной Америки американские военные использовали технологии с объектов «Скорпиона» для возобновления Филадельфийского эксперимента. Новый «Элдридж» вновь исчез на глазах у всех.
armygroup_event_desc_232=Советский Союз построил в Боливии экспериментальную установку «Земной телескоп» для зондирования ядра Земли, случайно открыв канал в мантию и получив доступ к богатым подземным ресурсам.
armygroup_event_desc_233=Бассейн Амазонки внезапно охватила вспышка жёлтой лихорадки, что привело к снижению боеспособности войск различных стран. При этом ни среди сил «Скорпиона», ни среди американских и советских войск заражений отмечено не было.
armygroup_event_desc_234=При оценке разведданных союзников США обнаружили в цепочках принятия государственных решений скрытые узлы, действующие вне контроля американских военных. Подлинный контроль над рядом стран и регионов уже незаметно перешёл в другие руки.
armygroup_event_desc_235=Осборн одновременно активировал пять усилителей маяка, запустив финальный отсчёт. Через 15 циклов любой, лишённый твёрдой решимости, вновь примкнёт к империи «Скорпиона». США, СССР, Великобритания и Франция направили свои элитные силы и совместно с соседними странами нанесли удары по руинам «Скорпиона» по всему миру.
armygroup_event_desc_236=Пока война шла вдали от родины, американские военно-промышленные гиганты воспользовались хаосом для сброса вооружений в несколько стран. В краткосрочной перспективе это значительно усилило военные возможности союзников США, однако также привело к утечке некоторых передовых вооружений в руки организации «Чёрный скорпион» по серым каналам.
armygroup_event_desc_237=Разведслужбы США и СССР обнаружили, что методы проникновения и контроля, использованные «Чёрным скорпионом» в ряде южноамериканских стран, поразительно схожи с приёмами немецких разведорганов времён Второй мировой войны, что послужило поводом для расследования его исторических корней.
armygroup_event_desc_238=Редкое полное солнечное затмение, словно вопреки предсказаниям цикла Сароса, аномально накрыло небо экваториальной зоны боевых действий. За три минуты темноты силы нескольких стран погрузились в хаос из-за внезапной потери воздушной разведки и связи.
armygroup_event_desc_239=Альтернативно-исторический роман захлестнул западный мир. В нём Британия после войны сохраняет колониальную империю и продолжает колонизацию Восточной Азии, а США заключают союз с другими восточноазиатскими странами. В итоге Британия и США вступают в войну за гегемонию. При нейтралитете СССР Британия одерживает победу, становясь единственным мировым колониальным гегемоном.
armygroup_event_desc_240=Советский Союз провёл серию крупномасштабных наступлений на восточном побережье Южной Америки, непрерывно оттесняя линию фронта на запад и создав Красный оборонительный рубеж.
armygroup_event_desc_241=Глубоко в тропическом лесу близ Ока Инки обнаружен объект биологического клонирования «Чёрного скорпиона». В нём находились не только множество спящих клонов-солдат, но и генетические образцы нескольких давно погибших полководцев, а также несколько уже опустевших инкубационных капсул.
armygroup_event_desc_242=Фракция «Скорпиона» вновь стремительно расширилась, что побудило США и СССР объединить усилия для искоренения этой угрозы. Варшавский договор и НАТО временно приостановили боевые действия и образовали новый военный союз.
armygroup_event_desc_243=В последние мгновения провала проекта «Чёрный скорпион» сработали заранее заданные оборонительные протоколы различных руин. Был испущен мощный продолжительный импульс психического воздействия, накрывший большую часть зоны боевых действий. Действия всех бойцов, не принадлежащих к «Чёрному скорпиону», подвергались постоянным помехам.
armygroup_event_desc_244=В последние мгновения провала проекта «Чёрный скорпион» сработали заранее заданные оборонительные протоколы различных руин. Был испущен мощный продолжительный импульс психического воздействия, накрывший большую часть зоны боевых действий. Действия всех бойцов, не принадлежащих к «Чёрному скорпиону», подвергались постоянным помехам.
armygroup_event_desc_245=В последние мгновения провала проекта «Чёрный скорпион» сработали заранее заданные оборонительные протоколы различных руин. Был испущен мощный продолжительный импульс психического воздействия, накрывший большую часть зоны боевых действий. Действия всех бойцов, не принадлежащих к «Чёрному скорпиону», подвергались постоянным помехам.
armygroup_event_desc_246=В последние мгновения провала проекта «Чёрный скорпион» сработали заранее заданные оборонительные протоколы различных руин. Был испущен мощный продолжительный импульс психического воздействия, накрывший большую часть зоны боевых действий. Действия всех бойцов, не принадлежащих к «Чёрному скорпиону», подвергались постоянным помехам.
