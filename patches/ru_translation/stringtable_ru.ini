armygroup_event_desc_153=Применив тактику межвидовой мобильной молниеносной войны, Германия в 1939 году стремительно вторглась в Польшу, что побудило Британию и Францию объявить войну Германии и привело к официальному началу Второй мировой войны.
armygroup_event_desc_154=США оказали значительную помощь Британии и Франции вооружениями, что стало важной поддержкой их военного оснащения.
armygroup_event_desc_155=Советский Союз попытался завоевать Финляндию в холодные зимние месяцы, и хотя победа осталась за СССР, она была достигнута огромной ценой.
armygroup_event_desc_156=Германия нанесла удар по Норвегии и Дании.
armygroup_event_desc_157=Богатые нефтяные ресурсы Румынии обеспечивали стратегическое топливное снабжение Германии и оказывали существенное влияние на боевые возможности стран Оси.
armygroup_event_desc_158=Германия применила тактику блицкрига для вторжения в Нижние земли, быстро прорвав оборону Нидерландов и Бельгии.
armygroup_event_desc_159=Подготовленный к осуществлению в мае 1940 года план Манштейна предусматривал окружение англо-французских союзных сил путём перехода через Арденнский лес в обход линии Мажино.
armygroup_event_desc_160=Черчилль стал премьер-министром Великобритании, и его руководство и вдохновляющие речи укрепили британский дух сопротивления.
armygroup_event_desc_161=Перед лицом немецкого окружения союзники провели масштабный отход на пляжах Дюнкерка, переправив около 330 000 солдат обратно в Британию военными и гражданскими морскими путями, что заложило важнейшую основу для последующего контрнаступления.
armygroup_event_desc_162=Французские войска применяли глубоко эшелонированную оборону и тактику сдерживания, нанося немецким войскам значительный урон.
armygroup_event_desc_163=Швеция сыграла ключевую роль в усилении военной мощи стран Оси во время Второй мировой войны, поставляя Германии большое количество высококачественной железной руды.
armygroup_event_desc_164=Падение Парижа символизировало поражение Франции, а Западноевропейский театр завершился полной победой Германии, дав ей стратегически важный успех в начале войны.
armygroup_event_desc_165=Немецкое командование разработало план «Морской лев» для полномасштабного вторжения в Британию в 1940 году, намереваясь сокрушить британскую военную мощь ударами с моря и воздуха.
armygroup_event_desc_166=Решающее воздушное сражение над Британией в 1940 году, в ходе которого Королевские ВВС успешно отразили наступление люфтваффе, стало важнейшей победой союзников на европейском театре.
armygroup_event_desc_167=Кригсмарине угрожало союзным конвоям посредством скоординированных действий подводных лодок и неизбирательных атак на вражеские флоты и торговые суда.
armygroup_event_desc_168=В Атлантическом океане в годы Второй мировой войны развернулись ожесточённые морские столкновения: немецкие подводные лодки атаковали союзные флоты тактикой волчьих стай, в то время как союзники прибегали к конвойной и противолодочной борьбе.
armygroup_event_desc_169=Италия объявила войну Британии и Франции, развернув 300 000 военнослужащих для наступления в Альпийском регионе и в районе Ниццы.
armygroup_event_desc_170=Польская армия разработала преимущественно оборонительную оперативную стратегию, сосредоточившись на обороне западных территорий в ожидании наступления западных союзников на Германию.
armygroup_event_desc_171=Войска Оси вторглись в Югославию со всех направлений, в кратчайшие сроки прорвав несколько оборонительных рубежей и начав клещевое наступление на Белград.
armygroup_event_desc_172=Группа армий «Ц» задействовала значительные артиллерийские орудия и живую силу, форсировав Рейн для фронтального штурма линии Мажино.
