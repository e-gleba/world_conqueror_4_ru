countrytech_desc_221=Легкие и средние танки можно перебрасывать транспортными самолетами.
countrytech_desc_222=Мобильность бронетехники +4.
countrytech_desc_223=При атаке элитная бронетехника наносит 20% дополнительного урона врагам в радиусе 1 клетки от цели.
countrytech_desc_224=Элитная бронетехника не получает штрафов к атаке, защите и мобильности при нахождении на воде (при посадке на транспорт).
countrytech_desc_316=Реактивная артиллерия наносит на 30% больше урона вторичным целям.
countrytech_desc_317=Мобильность артиллерии +3.
countrytech_desc_318=При атаке элитная артиллерия наносит 30% дополнительного урона врагам в радиусе 1 клетки от цели.
countrytech_desc_319=Запас ОЗ артиллерии +20%.
countrytech_desc_320=Артиллерия наносит на 20% больше урона за каждую дополнительную клетку расстояния до цели.
countrytech_desc_321=Дальность стрельбы элитной реактивной артиллерии +1.
countrytech_desc_322=Элитную реактивную артиллерию можно перебрасывать транспортными самолетами.
countrytech_desc_417=Мобильность эсминцев, крейсеров и линкоров +4.
countrytech_desc_418=Дальность атаки авианосцев +3.
countrytech_desc_419=Дальность стрельбы эсминцев, крейсеров и линкоров +1.
countrytech_desc_420=Авианосцы наносят на 30% больше урона городам и укреплениям.
countrytech_desc_421=Эсминцы, крейсера и линкоры имеют 100% шанс на повторную атаку после уничтожения врага.
countrytech_desc_422=При каждой атаке элитный авианосец со 100% вероятностью наносит по цели удар из Ионного орудия II уровня.
countrytech_desc_517=Атаки истребителей и бомбардировщиков имеют 50% шанс наложить эффект ионизирующего излучения.
countrytech_desc_518=Вертолеты (винтокрылые машины) восстанавливают 15% от максимального запаса ОЗ каждый ход.
countrytech_desc_519=Стоимость производства самолетов снижена на 20%.
