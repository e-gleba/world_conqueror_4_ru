;Правила режима "Кошмар"
operation_nightmare_rule_1=Командирам рекомендуется грамотно рассчитывать время, чтобы успеть получить награды за прохождение этапов.
operation_nightmare_rule_2=В кампании на сложности «Кошмар» войска противника получают 4 баффа (выбираются случайно в начале события и действуют до его завершения). Товарищи командиры, тщательно планируйте маршрут наступления.
operation_nightmare_rule_3=На любой сложности генералы, погибшие на этапе, не могут быть использованы в следующих боях. Вернуть их в строй можно только путем полного сброса прогресса.
operation_nightmare_rule_4=После победы на этапе сохраняется ваш лучший результат прохождения для текущей сложности. За прохождение определенных этапов выдаются специальные награды.
operation_nightmare_rule_5=Сброс прогресса обнуляет результаты только для текущего уровня сложности.

defensive_nightmare_rule_1=Командирам рекомендуется грамотно рассчитывать время, чтобы успеть получить награды за прохождение этапов.
defensive_nightmare_rule_2=В кампании на сложности «Кошмар» войска противника получают 4 баффа (выбираются случайно в начале события и действуют до его завершения). Товарищи командиры, тщательно продумывайте свои действия.
defensive_nightmare_rule_3=Независимо от победы или поражения на этапе, игра сохраняет максимальное количество ходов, в течение которых вы удерживали оборону. За достижение определенных рубежей по ходам выдаются поэтапные награды (все награды будут разблокированы досрочно, если вы уничтожите все вражеские отряды на карте).
defensive_nightmare_rule_4=Победа достигается только при удержании всех ключевых областей. Этапы можно переигрывать многократно, однако досрочный выход из боя не сохранит ваш текущий рекорд по продержавшимся ходам.

achievement 4101=Пройдите кампанию на сложности «Кошмар» в любой главе режима событий
achievement 4102=Пройдите кампанию на сложности «Кошмар» в 2 разных главах режима событий
achievement 4103=Пройдите кампанию на сложности «Кошмар» в 4 разных главах режима событий
