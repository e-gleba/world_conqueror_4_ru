countrytech_desc_115=Пехота имеет 30% вероятности игнорировать эффекты уклонения и уменьшения ущерба при атаке; РПГ-ракеты наносят на 30% больше ущерба.
countrytech_desc_116=Атака и оборона не уменьшаются, когда элитная пехота идет в море.
countrytech_desc_117=Уменьшает ущерб пехоты на 20%.
countrytech_desc_216=Движимость брони +4.
countrytech_desc_217=У бронетанковых атак есть 30% вероятность игнорирования эффектов уклонения и уменьшения ущерба.
countrytech_desc_314=Артиллерийские атаки имеют 30% вероятность игнорировать эффекты уклонения и уменьшения ущерба.
countrytech_desc_315=Уменьшает ущерб артиллерии на 20%.
countrytech_desc_413=Ядерные подводные лодки ядерные бомбы запасы капкана +2.
countrytech_desc_414=Ядерные атаки атомной подводной лодки не наносят ущерба дружественным силам при атаке.
countrytech_desc_415=Уровень боеголовки, несущейся атомной подводной лодкой +1.
countrytech_desc_416=Уменьшает ущерб транспортных судов на 30%.
countrytech_desc_509=Вероятность того, что воздушные соединения, летящие в воздухе, избегают удара, увеличилась на 20%, иммунные к устойчивому повреждению.
countrytech_desc_510=Плавучие воздушные подразделения преобразуют 5% нанесенного ущерба в собственные HP при атаке.
countrytech_desc_511=Ущерб плавающих воздушных подразделений увеличился на 30% при атаке бронетанковых и артиллерийских подразделений.
countrytech_desc_512=Ущерб от атаки спутника увеличился на 150%.
countrytech_desc_513=Спутниковые атаки наносят 50% щелевого повреждения целям в радиусе одного квадрата вокруг них.
countrytech_desc_514=Ущерб, нанесенный ракетами, увеличился на 20%.
countrytech_desc_515=Снижается на 20% расход при запуске ракет.
countrytech_desc_516=Дальность ракетной атаки +3.

