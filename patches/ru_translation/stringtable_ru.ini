elite_intro_101=Авианосец «Адмирал Кузнецов» — один из последних крупных надводных кораблей, построенных в советскую эпоху, и самый узнаваемый флагман российского флота. Оснащённый трамплинной взлётной палубой, он способен нести палубную авиацию — Су-33 и МиГ-29К, а также мощные комплексы противокорабельного и зенитного ракетного вооружения. Сочетает возможности авиационного удара, противовоздушной обороны соединения и океанского сдерживания. В нём в полной мере воплощена конструкторская философия советского ВМФ — баланс тяжёлого надводного вооружения и авиационной мощи.
feat_name_163=Воздушный охотник
feat_name_164=Непрерывное преследование
feat_name_165=Контрперехват
feat_desc_163=Выпускает по цели ракету «Гранит», нанося {1}% ракетного урона цели и {2}% урона по площади целям в радиусе 1 клетки от неё. Накладывает эффект «Помехи управлению огнём». Перезарядка — 1 ход.
feat_desc_163_Lv2=Выпускает по цели ракету «Гранит», нанося {1}% ракетного урона цели и {2}% урона по площади целям в радиусе 1 клетки от неё. Накладывает эффект «Помехи управлению огнём». Перезарядка — 1 ход.
feat_desc_163_Lv3=Выпускает по цели ракету «Гранит», нанося {1}% ракетного урона цели и {2}% урона по площади целям в радиусе 1 клетки от неё. Накладывает эффект «Помехи управлению огнём». Перезарядка — 1 ход.
feat_desc_163_Lv4=Выпускает по цели ракету «Гранит», нанося {1}% ракетного урона цели и {2}% урона по площади целям в радиусе 1 клетки от неё. Накладывает эффект «Помехи управлению огнём». Перезарядка — 1 ход.
feat_desc_164=После уничтожения цели палубной авиацией с вероятностью {0}% атакует повторно. Повышает критический урон следующей атаки палубной авиации на {1}%, суммируется до {2} раз. Действует 1 ход.
feat_desc_164_Lv2=После уничтожения цели палубной авиацией с вероятностью {0}% атакует повторно. Повышает критический урон следующей атаки палубной авиации на {1}%, суммируется до {2} раз. Действует 1 ход.
feat_desc_164_Lv3=После уничтожения цели палубной авиацией с вероятностью {0}% атакует повторно. Повышает критический урон следующей атаки палубной авиации на {1}%, суммируется до {2} раз. Действует 1 ход.
feat_desc_164_Lv4=После уничтожения цели палубной авиацией с вероятностью {0}% атакует повторно. Повышает критический урон следующей атаки палубной авиации на {1}%, суммируется до {2} раз. Действует 1 ход.
feat_desc_165=Повышает урон палубной авиации на {1}%. Когда любое дружественное корабельное подразделение в радиусе 3 клеток от авианосца подвергается атаке противника, с вероятностью {0}% немедленно запускает контрперехват, нанося урон палубной авиацией исходному атакующему (критический урон не наносится).
feat_desc_165_Lv2=Повышает урон палубной авиации на {1}%. Когда любое дружественное корабельное подразделение в радиусе 4 клеток от авианосца подвергается атаке противника, с вероятностью {0}% немедленно запускает контрперехват, нанося урон палубной авиацией исходному атакующему (критический урон не наносится).
feat_desc_165_Lv3=Повышает урон палубной авиации на {1}%. Когда любое дружественное подразделение (кроме зданий) в радиусе 4 клеток от авианосца подвергается атаке противника, с вероятностью {0}% немедленно запускает контрперехват, нанося урон палубной авиацией исходному атакующему (критический урон не наносится).
feat_desc_165_Lv4=Повышает урон палубной авиации на {1}%. Когда любое дружественное подразделение (кроме зданий) в радиусе 4 клеток от авианосца подвергается атаке противника, с вероятностью {0}% немедленно запускает контрперехват, нанося урон палубной авиацией исходному атакующему (критический урон не наносится).
army_buff_desc_1741=Непрерывное преследование: критический урон палубной авиации повышен на 40%% (макс.)
army_buff_desc_1742=Непрерывное преследование: критический урон палубной авиации повышен на 60%% (макс.)
army_buff_desc_1743=Непрерывное преследование: критический урон палубной авиации повышен на 80%% (макс.)
army_buff_desc_1744=Непрерывное преследование: критический урон палубной авиации повышен на 100%% (макс.)
dialogue_4669=Японские отвлекающие силы, не получив приказа о переносе операции, начали атаку передовых позиций на побережье.
dialogue_4670=Японская армия начала атаку передовых позиций. Немедленно усилить оборону!
dialogue_4671=Главные японские силы начали наступление, пытаясь захватить аэродром Хендерсон-Филд.
dialogue_4672=Бездарная координация. Разворачивайте орудия, ребята, — они сами роют себе могилу!
dialogue_4673=Чёрт возьми! Эти сволочи не так глупы! Бойцы, кончайте быстрее. Нельзя допустить, чтобы наши братья на восточном фланге держали рубеж до последнего в одиночку!
dialogue_4674=Уплотнить строй! Уплотнить строй! Противник пришёл подготовленным! Нельзя допустить захвата аэродрома!
dialogue_4675=Упреждающий удар и перерезание путей японских подкреплений полностью сорвут японский план.
dialogue_4676=Бойцы, после высадки на остров стремительно наступайте на аэродром. Уничтожить всех врагов на аэродроме!
dialogue_4677=Японские силы запросили подкрепление из штаба в Рабауле по воздуху, японская авиационная поддержка из Рабаула скоро прибудет.
dialogue_4678=Японские силы на западном фланге стягиваются к аэродрому, намереваясь удержать его.
dialogue_4679=Аэродром пал. Японские силы направляют подкрепления к аэродрому, пытаясь отбить его.
dialogue_4680=Оборонять периметр аэродрома! Не дать противнику ни единого шанса на возврат!
dialogue_4681=Японские силы отказались от плана возврата и приготовились к отходу из западной части Новой Британии.
dialogue_4682=Зачистить прилегающий район! Не дать им нанести ответный удар!
dialogue_4683=После высадки стремительно наступайте на юг. Главные силы на западе острова отходят на восток. Мы должны двигаться быстро, чтобы перехватить их!
