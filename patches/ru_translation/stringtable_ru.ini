event_intro_455=8 декабря 1941 года, на следующий день после нападения на Пёрл-Харбор, японские войска нанесли внезапный удар по Гуаму. Застигнутый врасплох немногочисленный американский гарнизон был быстро смят. К 10 декабря защитники капитулировали, и остров перешел под контроль Японии.
event_intro_456=Чтобы деблокировать окруженную в Сталинграде 6-ю армию Паулюса, 12 декабря 1942 года 4-я танковая армия Вермахта начала операцию «Зимняя гроза». Немецкий удар застал Красную армию врасплох, позволив врагу продвинуться в первый же день. Однако из-за советской операции «Малый Сатурн» и жесткой обороны немцы увязли в боях и были вынуждены свернуть попытки прорыва.
event_intro_457=Арденнская операция (наступление фон Рундштедта) проходила с 16 декабря 1944 по 25 января 1945 года. Это было последнее крупномасштабное наступление Германии на Западном фронте. Цель — прорвать англо-американскую оборону в Бельгии и захватить Антверпен. На раннем этапе немцы добились успеха и нанесли тяжелые потери армии США. Однако из-за острой нехватки горючего и растянутых коммуникаций наступление захлебнулось. Союзники стабилизировали фронт и отбросили остатки немецких сил за «Линию Зигфрида».
event_intro_458=Осада Бастони (20–27 декабря 1944 г.) стала ключевым эпизодом Арденнской операции. Через этот небольшой бельгийский городок проходили семь главных дорог, и контроль над ним был жизненно важен для немецкого наступления. Окружив американские части, немцы попытались взять город штурмом. Несмотря на нехватку боеприпасов и зимние холода, американцы удержали позиции до подхода танков 3-й армии генерала Паттона.
event_intro_459=24 декабря 1943 года советские войска начали грандиозную Днепровско-Карпатскую операцию для освобождения Правобережной Украины и Молдавии. В ходе наступления Красная Армия разгромила группу армий «Юг», отвоевала огромные территории и вышла к государственным границам с Румынией.
event_intro_460=Бой у Нордкапа произошел 26 декабря 1943 года у северного побережья Норвегии. Немецкая эскадра попыталась перехватить арктический конвой союзников, идущий в СССР. Из-за расшифровки радиоперехватов британский флот был готов к бою и пустил на дно немецкий линейный крейсер «Шарнхорст». После этого Германия больше не рисковала выводить крупные надводные корабли для охоты на конвои.
event_intro_461=26 декабря 1944 года советские войска замкнули кольцо вокруг Будапешта. Переговоры о капитуляции гарнизона провалились, а советские парламентеры были убиты. После этого начался ожесточенный штурм, длившийся 50 дней. Советские войска перемололи немецкие резервы, включая элитные части СС, захватили город и открыли себе путь на Вену.
event_intro_462=Воспользовавшись тем, что Арденнская операция оттянула резервы союзников на север, 1 января 1945 года немцы нанесли удар по ослабленному участку фронта в Эльзасе (операция «Нордвинд»). Их целью был Страсбург. Несмотря на тяжелые бои и отступление союзников на начальном этапе, Страсбург удалось удержать. Немцы заняли часть Эльзаса, но своей стратегической цели не достигли.
event_intro_463=В декабре 1941 года японцы вторглись на Лусон. Из-за плохой подготовки обороны японо-американские силы были оттеснены на полуостров Батаан. 7 января 1942 года начался решающий штурм полуострова. Из-за критической нехватки припасов гарнизон был обречен. Генерал Макартур был эвакуирован, а 9 апреля 1942 года, после трех месяцев упорного сопротивления, оставшиеся защитники капитулировали.
event_intro_464=После катастрофы в заливе Лейте японские силы на Филиппинах были изолированы. 9 января 1945 года при тотальном превосходстве в воздухе и на море союзники высадились в заливе Лингаен и начали наступление на Манилу. 3 марта столица была освобождена, а японцы отступили в горы для партизанской войны, которая продолжалась вплоть до капитуляции Японии в августе.
event_intro_465=14 января 1944 года войска Ленинградского, Волховского и 2-го Прибалтийского фронтов начали Ленинградско-Новгородскую стратегическую операцию. Спустя две недели был восстановлен контроль над железной дорогой Москва–Ленинград. 26 января немцы были отброшены, и блокада Ленинграда была полностью снята. К 1 марта советские войска вышли к реке Луга.
event_intro_466=После высадки союзников в Италии немцы возвели укрепленную «Линию Густава». 17 января 1944 года союзники начали штурм её ключевого узла — горы Монте-Кассино, где находился старинный монастырь, обеспечивавший немцам идеальный обзор. Серия кровопролитных штурмов и массированных бомбардировок монастыря в конечном итоге позволила союзникам прорвать линию, но победа далась им колоссальной ценой.
event_intro_467=20 января 1945 года союзники нанесли удар по Кольмарскому выступу во французском Эльзасе с севера и юга. Операция завершилась успешным окружением и разгромом немецкой 19-й армии, а Кольмар был освобожден.
event_intro_468=Корсунь-Шевченковская операция (часть Днепровско-Карпатской). В январе 1944 года 1-й и 2-й Украинские фронты нанесли сходящиеся удары, окружив крупную группировку немцев. 28 января кольцо замкнулось. Попытки немцев вырваться из «котла» привели к чудовищным потерям — окруженные дивизии были уничтожены, бросив всю тяжелую технику.
event_intro_469=После обретения Финляндией независимости страна раскололась на «белых» и «красных». 27 января 1918 года финская Красная гвардия захватила южные города и промышленные центры. Правительственные войска отступили на север. Однако благодаря немецкой военной помощи и лучшей организации «белые» разгромили Красную Финляндию.
event_intro_470=1 февраля 1942 года авианосные соединения ВМС США нанесли удары по японским базам на Маршалловых островах и островах Гилберта. Хотя военный ущерб был умеренным, этот первый наступательный рейд после Пёрл-Харбора имел огромное пропагандистское значение и поднял боевой дух американцев.
event_intro_471=В январе 1944 года Красная Армия вышла к реке Нарва. Чтобы прорваться в Эстонию, 2 февраля началось тяжелейшее наступление, известное как Битва за Нарву. Немцы яростно контратаковали, остановив продвижение. Лишь в июле, на фоне катастрофы группы армий «Центр» в Белоруссии, советские войска взяли Нарву, после чего немцы отошли на рубеж «Танненберг».


dialogue_3201=Немцы пробивают коридор к побережью. Нам нужно готовиться к отступлению.
dialogue_3202=Пусть союзные части отходят к Ла-Маншу первыми. Мои танки сделают всё, чтобы задержать немецкий клин.
dialogue_3203=Королевские ВВС прикроют эвакуацию с воздуха.
dialogue_3204=Позиционная война ушла в прошлое! Полный вперед! Оставьте пленных пехоте.
dialogue_3205=Этот... этот авианалет даже близко не смог остановить немецкие танковые колонны.
dialogue_3206=Мои дивизии обескровлены. Бросайте всё лишнее и отступайте на максимальной скорости!
dialogue_3207=Нас разбили, но наши разработки не должны достаться врагу.
dialogue_3208=Держать периметр! Уничтожить британские и французские части внутри котла.
dialogue_3209=Я Бентек. Мне приказано обеспечить вашу эвакуацию.
dialogue_3210=Мой приказ — держать позиции до отхода основных сил! Я не оставлю рубеж без приказа командования, какой бы безнадежной ни была ситуация.
dialogue_3211=Вам предначертано большее. Ваш путь только начинается, и впереди вас ждут великие дела. Но если вы настаиваете — я уважаю ваше решение. Выбор за вами.
dialogue_3212=Лилль пал. Немцы ускоряют ликвидацию котла.
dialogue_3213=Мы наемники. Выполнить контракт и выжить — вот наша единственная цель.
dialogue_3214=Доверьтесь его решениям.
dialogue_3215=Немцы согнали пленных в импровизированные лагеря. Осборн должен быть там.
dialogue_3216=Еще пара дней в этом аду, и я бы всерьез задумался о переходе в Вермахт.
dialogue_3217=Кто вы такие? Откуда вы взялись? Ладно, плевать! Главные силы врага ударили на юге. Это наш единственный шанс вытащить их!
dialogue_3218=Решил сбежать? Из тюрем Третьего рейха не сбегают! Я прикончу тебя прямо здесь, чтобы не рисковать. Может, после этого меня вернут на фронт!
dialogue_3219=Спасение прошло гладко. Теперь самое сложное — пробиться на юг, через границу в Испанию, а оттуда морем в Англию.
dialogue_3220=Похоже, наши пути расходятся. Часть экспедиционного корпуса зажата в Гавре. Я должен пробиться к ним как можно скорее.
dialogue_3221=Отходите на юг. В районе Меца есть брешь — там вы сможете присоединиться к войскам генерала де Голля.
dialogue_3222=Мы ведем переговоры о перемирии с Германией. Всем частям оставаться на позициях и ждать инструкций.
dialogue_3223=Франция пала. Нас сокрушили танковые клинья, отличные командиры и молниеносная скорость. Бронетанковые войска — вот будущее войны!
dialogue_3224=Синтез передовых технологий и мощной производственной базы — вот истинное лицо военной мощи.
dialogue_3225=Правительство Петена предало свой народ. Я буду сражаться за Францию до конца!
dialogue_3226=Оборона разбита! Дорога на Париж открыта, победа в наших руках!
dialogue_3227=Немцы наступают на пятки. У вас мало времени на эвакуацию.
dialogue_3228=Американская техника доставлена передовым частям без происшествий. Не стоит благодарности. Жду вашего финального доклада в штабе.
dialogue_3229=Немцы прорвали оборону под Эль-Аламейном! Наши танковые части могут оказаться в котле в любую минуту!
dialogue_3230=Альфред, твоя храбрость во Франции впечатляет! Но война в пустыне — не то же самое, что война в небе. Этот песок собьет с тебя спесь и сожрет твою самоуверенность. Посмотрим, как ты справишься с этой мясорубкой!
dialogue_3231=Масштаб наступления превзошел все ожидания. Сворачиваем оборону, главная цель — сорвать их прорыв. Подкрепления уже в пути.
dialogue_3232=Эль-Аламейн потерян. Откуда у них столько бронетехники и кораблей? Нас берут в кольцо!
dialogue_3233=Не знал, что вы умеете командовать флотом. Уведите корабли обратно в Александрию. Резервы на подходе.
dialogue_3234=У нас только один шанс: ударить по Каиру синхронно с итальянцами и сломить дух союзников.
dialogue_3235=Цель — Каир. Перерезать артерии снабжения союзников.
dialogue_3236=Это всё, что у нас осталось. Наступление захлебнулось. Единственный выход — отступление!
dialogue_3237=Мои парни ударят до того, как они успеют понять, что происходит.
dialogue_3238=Я вышвырну Роммеля из Африки любой ценой.
dialogue_3239=Два новых корпуса лишены недостатков прототипа. Теперь мы сможем использовать мощь этого орудия даже в жестоких условиях пустыни.
dialogue_3240=Десант высадился в заданном квадрате. Немедленно атакуйте их тылы и разрушьте береговую оборону!
dialogue_3241=Свяжите их боем, пока десант дробит их оборону изнутри.
dialogue_3242=Сектор «Голд» слабо защищен. Моя позиция выгодна. Работайте со мной, и мы быстро захватим плацдарм.
dialogue_3243=Плацдарм обеспечен. Начинаем наступление на Кан.
dialogue_3244=Я всего лишь специалист по танковому вооружению, куда мне до этих боев?
dialogue_3245=На передовой всем плевать, кто ты. Можешь остаться, только не путайся под ногами.
dialogue_3246=Мы — стена. Союзники не должны пройти.
dialogue_3247=Союзники высадили огромные силы в Нормандии. Мы обязаны контратаковать и сбросить их в море!
dialogue_3248=Моя артиллерия смешает их с землей!
dialogue_3249=Иногда мне кажется, что я главный герой этой войны и должен быть на обложках пропагандистских плакатов.
dialogue_3250=Используйте этот шанс, чтобы вбить клин между британскими и американскими войсками!
dialogue_3251=С таким вооружением мы ничего не сделаем. Окруженные части обречены.
dialogue_3252=Мы будем просто смотреть, как они вырезают Бастонь?
dialogue_3253=Два варианта: ударить в тыл немцам и отрезать им коммуникации, либо принять лобовой удар и ждать американские подкрепления.
dialogue_3254=Подкрепления могут задержаться, но они обязательно прибудут.
dialogue_3255=Паттон давно развернул армию. Как только подойдут резервы, мы перейдем в контрнаступление!
dialogue_3256=Верь в товарищей, а главное — верь в себя. Действуй!
dialogue_3257=Я никогда не ошибаюсь. Ситуация вот-вот изменится в нашу пользу.
dialogue_3258=Британцы ударили в тыл! Если они перережут пути отхода — это конец.
dialogue_3259=Отойти к «Линии Зигфрида». Восстановить оборону до следующей волны их атак.
dialogue_3260=Мы были в шаге от победы, но всё оказалось напрасно.
dialogue_3261=Падение Бастони сильно ударило по морали союзников, но у нас не осталось сил, чтобы продолжать наступление.
dialogue_3262=Осборн поспешил на помощь и попал под удар немецких танков.
dialogue_3263=Нет времени на разбор полетов, момент упущен.
dialogue_3264=Советы вернулись! Они контролируют половину Мексиканского залива и пересекли границу с Мексикой. Ситуация катастрофическая.
dialogue_3265=Мы всегда тесно работали с армией США, этот план безупречен. Тебя выбрали, потому что мы вместе прошли Западный фронт.
dialogue_3266=Говорят, в этот раз нам выдали кучу секретной техники и спецназ.
dialogue_3267=Дело не в секретности. Я не доверяю этим интриганам из Вашингтона, но тебе, Лукас, доверяю полностью.
dialogue_3268=Мы на месте. Цель — уничтожить советские ракетные базы и ядерные объекты. Пора за работу!
dialogue_3269=Никто не посмеет бросить мне вызов в небе.
dialogue_3270=Конечно, мы припасли кое-что и для вас.
dialogue_3271=Стоп. В горах скрыты комплексы, которые совершенно не похожи на советские базы.
dialogue_3272=Судя по технологиям, эти люди опережают нас на десятилетия.
dialogue_3273=Почему войска на передовой стреляют по своим?!
dialogue_3274=Они словно под гипнозом... некоторые даже передали нам коды управления своей техникой.
dialogue_3275=Альфред, я не могу здесь задерживаться. Забирай этот броневик и прорывайся на юг.
dialogue_3276=Черт, что происходит? Связь рухнула! Альфред, ты как?!
dialogue_3277=Похоже, мы отправляемся в Южную Америку. Говорят, там пороховая бочка.
dialogue_3278=Работаем по плану, пока Советы не опомнились.
dialogue_3279=В рядах британцев замечена неизвестная бронетехника. Мы видели такое оружие раньше. Дело принимает дурной оборот.
dialogue_3280=Сдавайтесь. Ваш план обречен, а открытая атака только сыграет на руку третьей стороне.
dialogue_3281=Меня эвакуировали. База в вашем распоряжении.
dialogue_3282=Они перешли в открытое наступление. Мы должны перехватить инициативу, пока не стало слишком поздно.
dialogue_3283=США используют свои военные базы для мгновенной переброски войск и навязывают свою волю через грубую силу.
dialogue_3284=Война никогда не меняется. Сильные диктуют условия, остальные вынуждены выбирать сторону.
dialogue_3285=Советские войска замечены на периметре. Они идут на штурм базы.
dialogue_3286=Пути назад нет. Захватите плацдарм в Южной Америке, и мы начнем с чистого листа.
dialogue_3287=Неважно, как они на тебя вышли — ты уже в их списках.
dialogue_3288=Враг владеет технологиями контроля сознания. Если мы не сможем использовать их сами, эти объекты должны быть стерты с лица земли.
dialogue_3289=Осборн, тебе больше некуда бежать.
dialogue_3290=Я знал, чем всё кончится. И давно сделал свой выбор.
dialogue_3291=Я всегда был верен только себе и своим братьям по оружию. Осборн, ты перестал быть нашим братом.
dialogue_3292=Возможно, мы слишком долго терпели этот миропорядок и давно хотели всё изменить.
dialogue_3293=У тебя ведь еще остался тот генератор помех? Я доверяю твоему чутью. Лучше иметь союзников, чем плодить врагов.
dialogue_3294=Вперед, шоу начинается!
dialogue_3295=Возможно, вы победите в Южной Америке, но помните: мы следим за вами.
dialogue_3296=Лукас, это все элитные части, что у нас остались.
dialogue_3297=Они засядут в фортах. Если мы пойдем в лоб, нас перебьют поодиночке.
dialogue_3298=Единственный способ остановить этих фанатиков — заключить временное перемирие с Советами.
dialogue_3299=Меня не остановят ни американцы, ни русские! Я не позволю Рейху снова проиграть!
dialogue_3300=Наши агенты давно в тени, они тайно направляли ход истории, чтобы создать новый мировой порядок.
dialogue_3301=Мы не выдержим их натиска! Каир потерян, линии снабжения отрезаны!
dialogue_3302=Самолеты заправлены. Я возвращаюсь в небо.
dialogue_3303=Всем эскадрильям: отход на базы в Британии для дозаправки!

promotable_generals=Следующие генералы могут использовать этот предмет для улучшения:

skill_name_145=Героический рывок
skill_name_146=Борьба за превосходство
skill_name_147=Скоординированный контрудар
skill_name_148=Глубокая операция
skill_name_149=Прирожденный лидер
skill_name_150=Интуиция на поле боя
skill_name_151=Ветеран

skill_info_145=При командовании бронетехникой: урон +[#00FF00#%d%%] за каждого врага в радиусе 2 клеток (максимум 50%). Если у отряда высокий боевой дух, получаемый урон снижается на 20%%.
skill_info_146=При командовании бронетехникой: урон по вражеским элитным подразделениям +[#00FF00#%d%%].
skill_info_147=При командовании артиллерией: на отряд не действуют эффекты, блокирующие ответный огонь. Если соседний союзный отряд открывает ответный огонь, есть шанс [#00FF00#%d%%] присоединиться к контратаке.
skill_info_148=При командовании артиллерией: урон по целям на расстоянии 2 и более клеток увеличен на [#00FF00#%d%%].
skill_info_149=При захвате вражеского города накладывает эффект «Воодушевление» на себя и союзников в радиусе 3 клеток, увеличивая урон на 15%% на 3 хода.
skill_info_150=Отряд игнорирует эффекты дымовой завесы, маскировки, уклонения и радиоэлектронного подавления (РЭБ). Урон по целям, у которых осталось меньше половины ОЗ, увеличен на [#00FF00#%d%%].
skill_info_151=Максимальный запас ОЗ отряда +[#00FF00#%d%%]. Если у отряда больше половины ОЗ, он иммунен к состоянию хаоса (паники).


dialogue_3138=Пусть США и СССР увидят истинную доблесть и честь Британии!
dialogue_3139=Восточный берег пологий, высадка пройдет легко. Смотрите в оба, чтобы не попасть под встречный японский десант!
dialogue_3140=Наши войска сильно уступают британцам в численности и снабжении. Мы должны использовать маневренную тактику, чтобы принудить их к сдаче. Никакой войны на истощение!
dialogue_3141=Ударьте всеми силами и сломите их волю к сопротивлению!
dialogue_3142=Наши части заняли Букит-Тимах. Ваши склады и источники воды теперь под нашим контролем. Прекратите это бессмысленное сопротивление и сдавайтесь!
dialogue_3143=Элитным частям — бросить все силы на возврат Букит-Тимаха! Иначе мы останемся без припасов и война будет проиграна!
dialogue_3144=Как только у британцев закончится продовольствие, они капитулируют безоговорочно!
dialogue_3145=Запасы Сингапура исчерпаны, мы не можем продолжать сопротивление. Сообщите японцам, что мы согласны на капитуляцию.
dialogue_3146=Цель операции — безопасно провести основные силы флота в немецкие порты. Пропускная способность канала ограничена, мы должны действовать быстро!
dialogue_3147=Во время войны ни один вражеский флот не пройдет через Ла-Манш!
dialogue_3148=Флот противника в зоне видимости! Пустить их на дно!
dialogue_3149=Горные перевалы в центре Туниса станут плацдармом для нашего прорыва на восточные равнины.
dialogue_3150=Разделите группировку надвое: одна часть атакует Сиди-Бузид с юга, другая — с северо-запада.
dialogue_3151=Продолжайте наступление! Сровняйте их с землей!
dialogue_3152=По данным разведки, основные силы Объединенного флота Японии бросили якорь на атолле Трук.
dialogue_3153=Японские войска на берегу подавлены артиллерийским огнем. Начинайте высадку!
dialogue_3154=Господа, настал наш последний час. Мы должны забрать с собой как можно больше врагов!
dialogue_3155=Внимание наземным частям: японцы оборудовали скрытые бункеры. Берегитесь засад.
dialogue_3156=Огонь! Огонь! Никаких самоубийственных «банзай-атак»! Каждый обязан держать позиции и сражаться до последнего патрона!
dialogue_3157=Наши войска подвергаются атакам с земли, с моря и с воздуха. Противник превосходит нас числом и качеством. Я сделал всё, что мог, но критически важные перевалы потеряны.
dialogue_3158=Немецкие части зажимают нас с севера и юга. Мы обязаны отбросить их, чтобы они не сорвали наше наступление!
dialogue_3159=Я сделал всё, что было в моих силах. Ситуация безнадежна. Всё, о чем я прошу — это встретить смерть с честью.
dialogue_3160=Вражеский флот замечен в районе Сурабаи. Покончите с ними, и Ява наша!
dialogue_3161=Всем кораблям боевая готовность! Японская эскадра приближается к Сурабае.
dialogue_3162=Огонь противника был слишком плотным. Поврежденные корабли должны отойти на ремонт первыми.
dialogue_3163=Разве я могу пойти ко дну в родных водах?
dialogue_3164=Прибытие этих дивизий переломит ситуацию. Мы обязаны обеспечить их безопасную высадку!
dialogue_3165=Всем эскадрильям: японские транспортные конвои вышли в море. Перехватите их и снимите давление с передовой.
dialogue_3166=Наши запасы на исходе. Мы не потянем войну на истощение, сидя в обороне. В атаку! Отбросьте врага от линии фронта!
dialogue_3167=Солдаты, будьте начеку. Враг скоро бросится в атаку. Без нормального снабжения их запал быстро иссякнет!
dialogue_3168=Нет. Если мы продолжим наступление, у нас не останется резервов для удержания линии Марет.
dialogue_3169=Солдаты, японцы готовятся к штурму. Держите строй и сохраняйте дисциплину, победа будет за нами!
dialogue_3170=Не волнуйтесь, грузы с самолетов обеспечат нас всем необходимым. Держите Импхал. Непроходимые джунгли уничтожат логистику противника за нас!
dialogue_3171=Отбить Импхал!
dialogue_3172=Японская армия истощена, их натиск будет только слабеть. Солдаты, докажите им, что их миф о непобедимости — ложь!
dialogue_3173=Японцы здесь совершенно беззащитны. Зачистите остров и освободите Минданао!
dialogue_3174=Переходим к тактике вязкой обороны. Мы не сдадим ни пяди земли без боя!
dialogue_3175=Линия обороны французов всё еще держится.
dialogue_3176=Поддерживайте огневое давление по фронту и ждите маневренную группу. Она ударит слева и прорвет их оборону «левым хуком»!
dialogue_3177=Проклятье! Как британцы оказались на нашем правом фланге?! Всем частям — приказ: оставить рубеж и отходить на север!
dialogue_3178=Защитники линии Марет отступают, избегая прямого столкновения!
dialogue_3179=В атаку! Сметите их полностью!
dialogue_3180=Я пролил за короля последнюю каплю крови. Моя жизнь была прожита с честью.
dialogue_3181=Акватория зачищена. Центральные острова Филиппин переходят под наш контроль!
dialogue_3182=Гарнизону острова: использовать любые средства, чтобы связать противника боем и максимально усложнить им захват!
dialogue_3183=Восточные равнины необходимо удержать. Враг не должен прорвать нашу оборону!
dialogue_3184=Прорвать вражеские рубежи и выйти на восточные равнины!
dialogue_3185=Сдавайтесь, или из этого котла не выйдет живым ни один немец.
dialogue_3186=1-я танковая армия отходит на запад, имитируя прорыв на юго-запад, чтобы соединиться с подходящими резервами с северо-запада!
dialogue_3187=Идиот! Не отдай он этот самовольный приказ, ничего бы этого не случилось!
dialogue_3188=Немецкие подкрепления идут с северо-запада? Остановите их. Котел не должен быть прорван.
dialogue_3189=В этом бою мы уничтожим Восточный флот раз и навсегда!
dialogue_3190=Враг идет прямо на нас. Вперед! Пустите на дно их флагманы!
dialogue_3191=Тупые свиньи! Как вы позволили себя потопить?! Отступаем! Возвращаемся в порт для ремонта.
dialogue_3192=Окинава — критически важный трамплин для вторжения в Японию. Её захват позволит нам завершить эту войну.
dialogue_3193=Враг начал самоубийственную атаку!
dialogue_3194=За этим хребтом — прямой путь! Вперед, освободите Италию!
dialogue_3195=Ради сохранения наших оставшихся территорий, мы будем координировать свои действия с немецкой обороной.
dialogue_3196=Противник не должен уйти! Уничтожить их всех!
dialogue_3197=Черт возьми, откуда взялся этот сброд? Подавить мятеж! Арестовать всех, кто пытается вмешаться в работу военной администрации!
dialogue_3198=Я, верховный главнокомандующий итальянской армией, капитулирую от лица всех вооруженных сил Италии.

