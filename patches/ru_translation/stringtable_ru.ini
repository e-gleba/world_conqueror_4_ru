armygroup_event_desc_68=Серия операций «Скорпиона» в США была сорвана одна за другой, и вся его армия начала масштабное отступление на юг. При поддержке США и СССР несколько стран смогли освободиться от контроля «Черного Скорпиона».
armygroup_event_desc_69=Осборн одновременно активировал пять усилителей маяков, начав финальный отсчет. Спустя 20 циклов любой, у кого не хватит силы воли сопротивляться, подчинится Империи Скорпиона. США, СССР, Великобритания и Франция отправили свои элитные силы, чтобы совместно с местными армиями начать штурм руин Скорпиона по всему миру.
armygroup_event_desc_70=Крепость Солнца Империи Скорпиона, скрытая в мексиканских руинах, была прорвана, а усилитель маяка захвачен. Координаты секретных баз по всему миру были полностью раскрыты, оставив Скорпиона в крайне уязвимом стратегическом положении.
armygroup_event_desc_71=Бункер «Эхо» Империи Скорпиона в колумбийских руинах был захвачен, а усилитель маяка конфискован. База была запрограммирована на саморазрушение, но уцелевшие журналы доступа показали пугающий факт: объект был активен еще в 1933 году.
armygroup_event_desc_72=Око Инков, древние руины Империи Скорпиона в Бразилии, были прорваны, а усилитель маяка захвачен. Скорпионы не успели вывезти или уничтожить передовое оружие, и в руки союзников попали чертежи абсолютно новой, невиданной ранее боевой техники.
armygroup_event_desc_73=США и СССР захватили огромный массив зашифрованных данных, полностью раскрывающих глобальные списки личного состава и военные развертывания Империи Скорпиона.
armygroup_event_desc_74=Ураганный маяк Империи Скорпиона в бразильских руинах был уничтожен, а усилитель маяка конфискован. Связь между главными силами Скорпиона и его агентами по всему миру временно прервана.
armygroup_event_desc_75=Стремительное расширение влияния Скорпиона вынудило США и СССР объединить усилия для искоренения этой угрозы. НАТО и Варшавский договор временно приостановили вражду и сформировали новый глобальный военный альянс.
armygroup_event_desc_76=Осборн потерпел сокрушительное поражение, обратный отсчет остановлен. Планы Скорпиона в Южной Америке окончательно разрушены.
armygroup_event_desc_77=Все руины Империи Скорпиона захвачены, обратный отсчет остановлен. Планы Черного Скорпиона в Южной Америке полностью сорваны.
armygroup_event_desc_78=Осборн полностью разбит, обратный отсчет остановлен. Планы Скорпиона в Южной Америке рухнули. Весь мир услышал зов свободы.
armygroup_event_desc_79=Все базы в руинах Скорпиона захвачены, обратный отсчет остановлен. Планы Черного Скорпиона в Южной Америке уничтожены. Весь мир услышал зов свободы.
armygroup_event_desc_80=Из-за длительного распыления нанороботов Q30 на подконтрольных Скорпиону территориях, с каждым ударом часов зараженные люди постепенно теряют свободу воли, в конечном итоге пополняя армию Скорпиона.
armygroup_event_desc_81=В руинах майя были найдены новые хрустальные черепа. Это оказались не обычные артефакты, а высокотехнологичные устройства хранения данных, содержащие информацию о Храме и историю неизвестных цивилизаций.
armygroup_event_desc_82=В джунглях Южной Америки появился корпус «Новая Швабия», оснащенный военной техникой Скорпиона. Возможно, они заключили военный союз, а возможно — Скорпион и есть та сила, что стоит за их существованием.
armygroup_event_desc_83=СССР перебросил в Венесуэлу огромное количество танков, создав бронированный щит против наступления войск США и их союзников.
armygroup_event_desc_84=Скорпион вооружил пиратов современным оружием, натравив их на торговые суда по всему миру. Это вызвало жесткие ответные меры со стороны военно-морских сил США и СССР.
armygroup_event_desc_85=Флот Скорпиона использует генераторы «акустического тумана», чтобы глушить радары противника, безнаказанно совершая набеги на судоходные маршруты в районе Панамского канала.
armygroup_event_desc_86=США тайно перебрасывают компоненты ракет в Бразилию через Колумбию и Перу, успешно избегая обнаружения как Скорпионом, так и советской разведкой.
armygroup_event_desc_87=Куба вновь подверглась нападению, и баланс сил в регионе нарушен. В ответ СССР экстренно отправил на остров масштабную военную помощь.
armygroup_event_desc_88=США развернули в восточной части Карибского моря гигантскую сонарную сеть для обнаружения и слежения за советскими подводными лодками.
armygroup_event_desc_89=Испытания советского сейсмического оружия вызвали мощное землетрясение на стыке границ Чили, Боливии и Аргентины. Из-за абсолютной непредсказуемости последствий проект был свернут.
armygroup_event_desc_90=СССР успешно испытал климатическое оружие «Око Бури» на Кубе, искусственно направив разрушительный ураган на побережье Флориды.
armygroup_event_desc_91=В странах, контролируемых Скорпионом, начали вещание подпольные радиостанции Сопротивления. Они круглосуточно призывают жителей оккупированных территорий сбросить тиранию Империи Скорпиона.
armygroup_event_desc_92=Чтобы ослепить спутники-шпионы США и СССР, Скорпион установил на океанских островах мощные генераторы помех. Они не только глушат сигнал, но и перехватывают сверхсекретные данные сверхдержав.
armygroup_event_desc_93=Королевский флот Великобритании обнаружил в Бермудском треугольнике немецкую подводную лодку времен Второй мировой войны под названием «Наутилус». Она не имеет ничего общего с одноименной американской атомной субмариной. Несмотря на свой возраст, лодка в идеальном состоянии, а её технологии превосходят даже современные разработки.
armygroup_event_desc_94=Открытие гигантского нефтяного месторождения в джунглях Амазонки спровоцировало ожесточенную войну за ресурсы на границе Перу и Бразилии между США, СССР и Скорпионом.
armygroup_event_desc_95=Выбив Скорпиона из Северной Америки, военные США использовали захваченные технологии для возобновления «Филадельфийского эксперимента». Новый эсминец «Элдридж» вновь растворился в воздухе на глазах у сотен свидетелей.
armygroup_event_desc_96=СССР построил в Боливии гигантский «Земной бур» для исследования мантии. Они случайно пробили канал к ядру планеты, открыв доступ к неисчерпаемым источникам геотермальной энергии.
armygroup_event_desc_97=В бассейне Амазонки внезапно вспыхнула эпидемия неизвестного штамма желтой лихорадки, резко снизив боеспособность местных армий. При этом ни среди войск Скорпиона, ни в частях США и СССР случаев заражения не зафиксировано.

