dialogue_3500=Разгромив основные силы британской армии, мы уверенно держим позиции. Инициатива в наших руках!
dialogue_3501=Остановите наступление. Мы продолжим, как только подойдут резервы!
dialogue_3502=Советское наступление захлебнулось. План контрудара фюрера оказался не просто иллюзией!
dialogue_3503=Перегруппировать войска. Я обязательно спасу Берлин!
dialogue_3504=Мы прорвались к логистическому узлу армии США. Враг остался без припасов!
dialogue_3505=Вскрыть резервные склады. Линейным частям — держать позиции любой ценой!
dialogue_3506=Обеспечьте мою безопасность, и народ Италии будет служить союзникам.
dialogue_3507=Свяжитесь с его адъютантом, мы должны успокоить итальянцев.
dialogue_3508=Передовым частям — стягиваться к Кану!
dialogue_3509=Южный фронт рушится. Бросайте резервы, чтобы остановить их прорыв. Передайте в штаб: нам нужно больше войск, чтобы удержать линию.
dialogue_3510=Ситуация на передовой критическая, мы обязаны сохранить свои силы.
dialogue_3511=Наконец-то мы обломали острие их наступления. Чаша весов склоняется в нашу пользу!
dialogue_3512=Держать строй и продолжать давить! Второго шанса у нас не будет!
dialogue_3513=Бастонь под нашим контролем. Кризис снабжения в Арденнах преодолен.
dialogue_3514=С момента их высадки мы терпели одно поражение за другим. Но в этой битве я обязан одержать победу.
dialogue_3515=Сохраняйте спокойствие и возвращайтесь в порт. Я беру командование акваторией на себя!
dialogue_3516=Я уже пережил подобную катастрофу на Филиппинах, и не позволю ей повториться!
dialogue_3517=Для успешного контрнаступления нашей армии нужна поддержка корейского народа.
dialogue_3518=Наш флот установил господство на море. Владивосток и советские ракетные базы захвачены!
dialogue_3519=В этот раз я не просто вернулся — я заставил Советы познать вкус поражения!
dialogue_3520=Верните контроль над Южными Курилами и обезопасьте порты!
dialogue_3521=Прошу поддержки в захвате прибрежных портов! Флоту нужна передовая оперативная база в Охотском море!
dialogue_3522=Отлично! Флот скоро выйдет на позиции, и мы вместе с армией вернем контроль над Охотским морем!
dialogue_3523=Держите береговую линию обороны! Подкрепления прибудут в кратчайшие сроки!
dialogue_3524=Остров Святого Лаврентия пал. Мы ни при каких обстоятельствах не должны позволить им закрепиться на материке!
dialogue_3525=Удерживать побережье больше нет смысла. Сообщите в тыл: мы отступаем. Перенаправьте резервы на укрепление линии обороны Анкориджа.
dialogue_3526=Подкрепления прибыли, боекомплект полон. Мы подождем, пока они выдохнутся, а затем раздавим их!
dialogue_3527=Продолжайте сопротивление, переломный момент уже близок!
dialogue_3528=Как только мы установим связь с союзниками и наладим логистику — мы освободим Соединенные Штаты!
dialogue_3529=Эта война зашла слишком далеко. Сражаться за американцев больше нет смысла. Свяжитесь с Советами — мы выходим из игры!
dialogue_3530=Канада хочет выйти из войны? Предатели! Прикажите нашим войскам удерживать линию внутри их границ. Отступать? У них нет права голоса!
dialogue_3531=Всем штабам: оказывайте помощь любым потенциальным союзникам. Мы приветствуем всех, кто готов сражаться на нашей стороне!
dialogue_3532=Ради выживания нашей нации у меня просто нет другого выбора.
dialogue_3533=Солдаты, во имя свободы — вернем наши земли!
dialogue_3534=Пламя войны пожирает нашу страну. Стоит ли эта война того, чтобы её продолжать?
dialogue_3535=Наше государство в опасности. Солдаты, защитите родину!

