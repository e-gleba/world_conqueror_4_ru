event_buff_desc_38=Отряд не может быть уничтожен уроном по площади (сплэшем) или отраженным уроном.
event_buff_desc_39=При атаке есть 15% вероятность снизить боевой дух цели. Урон по целям с упавшим духом или в состоянии хаоса увеличен на 15%.
event_buff_desc_40=Урон по городским укреплениям и зданиям увеличен на 200%.
event_buff_desc_41=Дальность атаки всех войск +1.
event_buff_desc_42=После атаки есть 20% вероятность повышения боевого духа отряда.
event_buff_desc_43=При уничтожении отряда с союзных элитных войск в радиусе 2 клеток снимаются все дебаффы, и они восстанавливают 10% от максимального запаса ОЗ.
event_buff_desc_44=Эффект снижения получаемого урона от рельефа местности увеличен на 100%.
event_buff_desc_45=Урон от контратак элитных войск увеличен на 30%.
event_buff_desc_46=Получаемый урон от ядерного оружия снижен на 65%.


