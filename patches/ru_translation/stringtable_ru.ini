elite_intro_82=«Фантом» — элитное подразделение, сформированное из лучших оперативников со всего мира. Известны бесшумной тактикой, передовыми системами маскировки и высочайшей боевой эффективностью. Способны быстро и точно ликвидировать цели в экстремальных условиях, а также мгновенно развертываться и эвакуироваться по воздуху. Считаются одним из самых смертоносных спецподразделений в мире.
elite_intro_83=M1A1 «Абрамс» — основной боевой танк армии США и первый в мире танк, массово использующий броню и снаряды из обедненного урана. Его 120-мм гладкоствольное орудие ведет огонь бронебойными оперенными подкалиберными снарядами (БОПС) с урановым сердечником. Благодаря высокой плотности и свойству самозатачивания, эти снаряды с легкостью прошивают тяжелобронированные цели противника.
elite_intro_84=B-52 Stratofortress — американский стратегический бомбардировщик-ракетоносец. Благодаря огромному радиусу действия и высочайшей боевой нагрузке, B-52 является основой глобальной ударной мощи ВВС США с 1950-х годов. Способен нести обычные бомбы, высокоточное оружие и ядерный арсенал. Постоянные модернизации сохраняют его боевую актуальность, делая B-52 одной из самых долгоживущих платформ в истории военной авиации. Из-за огромных габаритов и длинной взлетно-посадочной полосы непригоден для палубного базирования.
elite_intro_85=AH-64 Apache — самый узнаваемый ударный вертолет в мире, славящийся сокрушительной огневой мощью, передовой авионикой и маневренностью. Оснащен 30-мм автоматической пушкой, ракетами «воздух-поверхность» (Hellfire), а также тепловизионными и электронно-оптическими датчиками. Мощные системы самообороны позволяют «Апачу» выживать в зонах с плотной ПВО, делая его идеальным охотником за бронетехникой. Постоянные модификации закрепляют за ним статус главной ударной платформы современной армейской авиации.


