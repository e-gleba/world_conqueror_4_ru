event_stage_intro_20701=Дуче требует немедленного наступления на британские позиции. Однако из-за слабой моторизации и острой нехватки снабжения этот удар может быстро выдохнуться. Пока что мы вынуждены компенсировать эти недостатки численным превосходством. Вперед, на Египет!
event_stage_intro_20702=Стремительность британского контрудара ошеломляет, но враг недооценил нашу группировку. Их силы выдохлись, а у нас достаточно резервов, чтобы рассечь и смять оборону союзников в Киренаике. Наша главная цель — уничтожить их живую силу. Вперед, на максимальной скорости! Пленных не брать!
event_stage_intro_20703=Союзники выбиты из Греции. Остров Крит остается их последним крупным плацдармом в Средиземноморье. Захватив его, мы превратим Крит в трамплин для броска на Кипр и ударов по Египту с моря.
event_stage_intro_20704=Британцы начали новое наступление, чтобы деблокировать осажденный Тобрук. Мы укрепили позиции и возвели новые рубежи обороны, чтобы остановить их прорыв. Снабжение и резервы уже в пути. Как только они прибудут, мы вернем контроль над всей Северной Африкой.
event_stage_intro_20705=Осада Тобрука близится к финалу. У нас не хватает ресурсов для масштабного штурма, но британцы сами пошли нам навстречу, покинув свои укрепления. Это наш шанс разгромить их в полевом сражении, уничтожив их живую силу и решив проблему растянутых линий снабжения.
event_stage_intro_20706=Наши коммуникации растянуты до предела. Британские ВМС и ВВС безнаказанно хозяйничают в Средиземном море. Союзники непрерывно получают подкрепления через Красное море и Суэцкий канал. Ситуация критическая. Это будет наша последняя битва в Северной Африке, и она решит нашу судьбу.
event_stage_intro_20707=Союзники перегруппировались в Марокко и Алжире. Американцы стремительно наступают по суше, а британский флот концентрирует силы в Тунисском заливе. Местные гарнизоны Виши уже готовы переметнуться к врагу. Кризис неизбежен. Мы будем удерживать Тунис до последнего солдата, ожидая подхода основных сил Роммеля.
event_stage_intro_20711=Дуче требует немедленного наступления на британские позиции. Однако из-за слабой моторизации и острой нехватки снабжения этот удар может быстро выдохнуться. Пока что мы вынуждены компенсировать эти недостатки численным превосходством. Вперед, на Египет!
