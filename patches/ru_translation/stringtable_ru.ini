legend_intro_10101=На полях сражений во Франции 7-я танковая дивизия внушала ужас как грозная «Дивизия-призрак», и битва при Аррасе 21 мая 1940 года стала важнейшим испытанием на её пути к славе. В тот день дивизии было приказано обойти Аррас и наступать на север в качестве авангарда. Однако она неожиданно столкнулась со спланированным контрударом англо-французских войск, что привело к ожесточенным боям. Из-за внезапной угрозы флангу 7-я танковая дивизия ненадолго перешла к обороне. Но благодаря гибкому и решительному командованию генерала Эрвина Роммеля немцы в итоге переломили ход сражения и предотвратили кризис. Этот бой еще сильнее закрепил за ними пугающую репутацию «Дивизии-призрака».
legend_intro_10102=По мере смещения фокуса войны 7-я танковая дивизия присоединилась к наступлению на Москву. Но уже первое столкновение — битва за Алитус — показало, насколько жестокой будет эта кампания. 7-я танковая дивизия вермахта и 5-я танковая дивизия СССР сошлись в масштабном танковом сражении. Немцам удалось разгромить советскую дивизию, насчитывавшую более 200 танков, захватить Алитус и открыть дорогу на Вильнюс.
legend_intro_10103=2 октября 1941 года 7-я танковая дивизия начала лобовую атаку на позиции советских войск и разгромила только что прибывшие танковые подкрепления. Совместно с 10-й танковой дивизией из состава 4-й танковой группы она замкнула кольцо окружения под Вязьмой. Этот прорыв сокрушил Западный фронт советской обороны и на шаг приблизил немецкую армию к главной цели операции «Барбаросса» — Москве.
legend_intro_10104=Выл ветер, мела метель — зима под Москвой оказалась еще суровее, чем в прошлые годы. Растянутые линии снабжения сильно истощили немецкую армию, заставив командование возложить все надежды на один решающий удар. 15 ноября 1941 года 3-я танковая группа, в состав которой входила 7-я танковая дивизия, начала прорыв к Москве. Благодаря стремительному наступлению и гибким маневрам они захватили Клин и Яхрому, а в какой-то момент даже смогли разглядеть Кремль в бинокли. Однако в итоге их наступление захлебнулось под сокрушительным давлением советских резервов.
legend_intro_10105=В 1943 году во время битвы на Курской дуге опытная, но понесшая тяжелые потери 7-я танковая дивизия использовалась как вспомогательная сила для прикрытия основных частей 4-й танковой армии. Дивизия все еще могла прорывать советские линии на флангах и сковывать силы 7-й гвардейской армии, но эти локальные успехи уже не могли изменить общий ход сражения. После разгрома главных сил немцев под Прохоровкой им тоже пришлось отступать. Изменившиеся реалии войны означали, что они больше не смогут безнаказанно доминировать на поле боя, как раньше.
legend_intro_10106=Вторая битва за Киев стала последней крупномасштабной маневренной операцией 7-й танковой дивизии на Восточном фронте. Из-за подавляющего численного превосходства советских войск дивизия оставила Киев и начала вести маневренные сдерживающие бои на рубеже Фастов-Житомир. Дождавшись подкреплений, им даже удалось вернуть временно утраченный Житомир. И хотя они не смогли остановить общее обрушение фронта, их действия выиграли драгоценное время для отступления и перегруппировки немецких войск.
legend_intro_20101=Боевой путь 3-й бронетанковой дивизии США начался с высадки в Нормандии в июне 1944 года. Густые живые изгороди («бокажи») сильно замедлили продвижение этой мощной танковой силы. Лишь в июле 1944 года, в ходе операции «Кобра», американское командование бросило тысячи бомбардировщиков для ковровой бомбардировки немецких позиций. После этого 3-я бронетанковая дивизия, получившая прозвище «Острие копья» (Spearhead), рванула вперед. Используя высокую мобильность, они прорвали рассыпающуюся немецкую оборону, обеспечив стратегический прорыв и выйдя из позиционного тупика в Нормандии.
legend_intro_20102=После успешного прорыва в рамках операции «Кобра» 3-й бронетанковой дивизии было приказано повернуть на север и ударить прямо в район Фалеза, чтобы замкнуть кольцо окружения навстречу наступающим канадским и польским войскам. Окруженные немецкие части бросались в отчаянные прорывы, но так и не смогли пробить стальную стену 3-й дивизии. В этом сражении были практически полностью уничтожены две немецкие армии, а 3-я бронетанковая дивизия вновь доказала, что является одним из самых острых клинков союзников.
legend_intro_20103=Осенью 1944 года 3-я бронетанковая дивизия, как авангард 1-й армии США, мощным ударом прорвала Линию Зигфрида и вышла к предместьям Ахена. После почти двух недель тяжелейших уличных боев город пал 21 октября. После короткой передышки в ноябре дивизия начала наступление в Хюртгенском лесу. Сложный лесной рельеф сковал действия танков, и на этом поле боя погибло множество солдат. Пройдя через жестокие городские бои и непроходимые чащи, дивизия доказала, что она может быть не только «острием» наступления, но и стойкой силой, способной сражаться в любых условиях.
legend_intro_20104=16 декабря 1944 года немецкая армия начала внезапное контрнаступление в Арденнах. 3-я бронетанковая дивизия США, находившаяся в резерве 1-й армии, была экстренно переброшена на северный участок фронта. Скоординировав действия с другими частями, они нанесли фланговые контрудары в ключевых точках и успешно сорвали немецкое наступление.
legend_intro_20105=В марте 1945 года 3-я бронетанковая дивизия стремительно двинулась на восток от Ремагенского моста, чтобы окружить промышленное сердце Германии — Рур. 1 апреля дивизия соединилась с американскими войсками северного фронта в районе Липпштадта, заперев в Рурском котле 320 000 немецких солдат. После двух недель зачисток сопротивление немцев было сломлено: Вальтер Модель покончил с собой, а 18 апреля последовала массовая капитуляция. Это сражение окончательно разгромило основные силы вермахта на Западном фронте. 3-я дивизия обеспечила эту победу своими высокоскоростными маневрами, но потеряла своего командира — генерал-майора Роуза, навечно вписав свой триумф и тяжелую утрату в историю.
legend_intro_20106=В феврале 1991 года 3-я бронетанковая дивизия, будучи главной ударной силой 7-го корпуса США, перешла границу Саудовской Аравии и обрушилась на оборону Ирака. Используя технологическое превосходство танков M1A1 «Абрамс», дивизия за несколько суток продвинулась на 260 километров, поочередно разгромив 9-ю бронетанковую бригаду Ирака и дивизию Республиканской гвардии «Тавакална». В битве при Норфолке они уничтожили огромное количество танков Т-72 с минимальными для себя потерями. За сто часов наступления дивизия при поддержке союзников уничтожила более десятка иракских дивизий.
legend_intro_30101=Осенью 1942 года из моряков Черноморского флота была сформирована 255-я бригада морской пехоты. Её срочно перебросили на помощь Кавказскому фронту. В гористой и лесистой местности под Туапсе морпехи, вооруженные лишь винтовками Мосина, гранатами и штыками, стояли насмерть, сорвав немецкую операцию «Аттика». Не имея тяжелого вооружения, они изматывали врага ночными рейдами и фланговыми обходами. 13 декабря бригада была награждена орденом Красного Знамени за то, что ценой собственной крови остановила прорыв немцев к Черному морю.
legend_intro_30102=6 февраля 1943 года 255-я бригада морской пехоты получила приказ высадиться в районе Мысхако под Новороссийском и захватить плацдарм, который позже войдет в историю как «Малая Земля». Под непрерывными дневными и ночными бомбежками Люфтваффе и шквальным огнем тяжелой артиллерии наши братья по оружию вгрызлись в землю. Они удержали этот крошечный клочок берега, сковав огромную группировку немецких войск, чем заложили фундамент для последующего освобождения Кавказа и Таманского полуострова.
legend_intro_30103=Ранним утром 10 сентября 1943 года под прикрытием корабельной артиллерии 255-я бригада морской пехоты пошла на штурм южной части Новороссийского порта. Преодолевая минные поля, ряды колючей проволоки и ураганный огонь береговых батарей, они метр за метром расширяли плацдарм, прокладывая путь для основных сил. В итоге, благодаря совместным усилиям с 18-й армией, 16 сентября город был полностью освобожден. Эта блестящая победа предрешила освобождение Таманского полуострова и завершение битвы за Кавказ. Впоследствии бригада была удостоена почетного наименования «Таманская».
legend_intro_30104=В ноябре 1943 года штормовой ночью Таманская бригада обрушилась на вражеский берег у поселка Эльтиген на Керченском полуострове. Под слепящим светом немецких прожекторов и артиллерийским огнем они вплавь по ледяной воде добрались до берега, захватили плацдарм и удерживали его 36 дней и ночей. Когда закончились боеприпасы и продовольствие, бойцы отбивали десятки контратак штыками и саперными лопатками. Именно здесь сержант Костенко совершил свой подвиг, закрыв грудью амбразуру вражеского дзота.
legend_intro_30105=В мае 1944 года Таманская бригада — элита Черноморского флота — в составе Отдельной Приморской армии приняла участие в решающем штурме Севастополя. Эта операция уничтожила последний немецкий бастион в Крыму и смыла горечь потери этого стратегически важного города в 1942 году.
legend_intro_30106=В августе 1944 года, во время Ясско-Кишинёвской операции, Таманская бригада совершила дерзкий ночной бросок через Днестровский лиман и высадилась у стен Аккермана (ныне Белгород-Днестровский). Под шквальным огнем береговой обороны они прорвали немецкие позиции и соединились с наступающими частями 46-й армии. В ходе ожесточенных уличных боев 23 августа крепость пала. Морпехи перерезали пути отхода немецкой группировке на побережье, захватив множество пленных. За эту операцию бригада была награждена орденом Кутузова II степени, доказав высочайшее мастерство советской морской пехоты в десантных операциях.

