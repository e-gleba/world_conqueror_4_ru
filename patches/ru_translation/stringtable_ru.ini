skill_info_115=Урон от ядерного оружия увеличивается на [#00FF00#%d%%].
skill_info_116=При атаке любым отрядом есть шанс [#00FF00#%d%%] наложить на цель метку наведения, если цель не была уничтожена. Отряды с меткой наведения получают на 20% больше урона. Эффект длится 1 ход.
skill_info_117=При уничтожении вражеского отряда есть шанс [#00FF00#%d%%] снизить боевой дух двух вражеских отрядов в радиусе 1 клетки.
skill_info_118=При перемещении отряда урон от его следующей атаки в этом ходу увеличивается на [#00FF00#%d%%] (но не более 50%) за каждую пройденную клетку.
skill_info_119=При нанесении удара авиацией есть шанс [#00FF00#%d%%], что один из ваших свободных отрядов в радиусе 1 клетки от цели присоединится к атаке (за один раз срабатывает только для 1 отряда).
skill_info_120=При нанесении авиаудара цель впадает в состояние Ужаса, а вероятность ее контратаки снижается на [#00FF00#%d%%] на 1 ход.
skill_info_121=При командовании бронетехникой получаемый отрядом урон снижается на [#00FF00#%d%%].
skill_info_122=Если в радиусе 1 клетки от генерала погибает союзный отряд, ваш отряд впадает в состояние Жажды мести: показатель атаки увеличивается на [#00FF00#%d] на 2 хода.
skill_info_123=При атаке с корабля вероятность того, что враг не сможет ответить огнем, составляет [#00FF00#%d%%].
skill_info_124=При командовании кораблем ваш отряд получает иммунитет к эффекту «Хаос». Показатель атаки вашего отряда и всех союзников в радиусе 1 клетки увеличивается на [#00FF00#%d].
skill_info_125=При получении урона ваш отряд возвращает врагу [#00FF00#%d%%] от полученного урона (срабатывает только 1 раз за атаку).
skill_info_126=При командовании кораблем наносимый вами урон от авиации и ракет увеличивается на [#00FF00#%d%%].
skill_info_127=После атаки отряд получает статус «Ложная цель» на 1 ход. Союзники в радиусе 1 клетки (кроме самого генерала) наносят на [#00FF00#%d%%] больше урона.
skill_info_128=При атаке кораблем есть шанс [#00FF00#%d%%], что один из союзных кораблей, еще не совершавших действие в этом ходу, присоединится к атаке (срабатывает один раз за ход).
skill_info_129=Если бронетехника под командованием уничтожает цель, она наносит дополнительные [#00FF00#%d%%] сплеш-урона всем врагам вокруг уничтоженной цели.
skill_info_130=Наносит на [#00FF00#%d%%] больше урона врагам с пониженной моралью или находящимся в состоянии Хаоса.
skill_info_131=Урон увеличивается на [#00FF00#%d%%], если генерал командует одиночным (однозвездным) отрядом.
skill_info_132=При контратаке восстанавливает [#00FF00#%d] ед. ОЗ вашему отряду и союзникам вокруг него.
skill_info_133=Находясь на своей территории, генерал увеличивает прирост экономики, промышленности и технологий страны на [#00FF00#%d%%].

