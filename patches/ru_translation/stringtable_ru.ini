glory_intro_1=Получен облик элитного подразделения\nЭлитное подразделение: Королевский тигр\nОблик: Меловой период\nЭффект: усиление черты истребителя танков: дополнительный урон 5% по бронетанковым частям и артиллерии.
glory_intro_2=Получен облик элитного подразделения\nЭлитное подразделение: Ястребиный глаз\nОблик: Белая смерть\nЭффект: критический урон +5%
glory_intro_3=Получен облик элитного подразделения\nЭлитное подразделение: Энтерпрайз\nОблик: Ковчег, гонящийся за солнцем\nЭффект: лимит авиационных очков +2
glory_intro_4=Получен облик элитного подразделения\nЭлитное подразделение: БМ-21\nОблик: Органное эхо\nЭффект: шанс критического удара +5%
glory_intro_5=Получен облик элитного подразделения\nЭлитное подразделение: Штука\nОблик: Иерихонская труба\nЭффект: число вылетов +2
glory_intro_6=Открыта привилегия: лимит генералов в штабе +5.
glory_intro_7=Открыта привилегия: в режимах «Завоевание» и «Армейская группа» фракции Оси могут использовать дивизию «Призрак», дивизию «Молния» и дивизию «Великая Германия».
glory_intro_8=Открыта привилегия: в режимах «Завоевание» и «Армейская группа» все фракции Союзников могут использовать Таманскую бригаду, дивизию «Остриё копья», «Пустынных крыс», дивизию Леклерка, 4-ю гвардейскую танковую дивизию, 1-ю дивизию морской пехоты и 51-ю Хайлендскую дивизию.
glory_intro_9=Открыта привилегия: легендарные подразделения могут использоваться в оборонительных событиях и военных операциях.
glory_intro_10=Открыта привилегия: испытание генерала можно проходить повторно.
glory_intro_11=Открыта привилегия: Виттман может пройти углублённую подготовку.
glory_challenge_desc_10101=Получить 3 звезды на всех уровнях дивизии «Призрак» в режиме «Легенда».
glory_challenge_desc_10102=Получить 3 звезды на всех уровнях дивизии «Молния» в режиме «Легенда».
glory_challenge_desc_10103=Получить 3 звезды на всех уровнях Таманской дивизии в режиме «Легенда».
glory_challenge_desc_10104=Получить 3 звезды на всех уровнях дивизии «Остриё копья» в режиме «Легенда».
glory_challenge_desc_10201=Дивизия «Молния» захватила Александрию в испытании «Завоевание 1943».
glory_challenge_desc_10202=Дивизия «Великая Германия» заняла Москву в испытании «Завоевание 1939».
glory_challenge_desc_10203=Части 4-й гвардейской танковой дивизии взяли Берлин в испытании «Завоевание 1943».
glory_challenge_desc_10204=Войска 1-й дивизии морской пехоты заняли Пхеньян в испытании «Завоевание 1950».
glory_challenge_desc_10205=Силы дивизии «Остриё копья» заняли Басру в испытании «Завоевание 1950».
glory_challenge_desc_10206=Дивизия Леклерка заняла Тунис в испытании «Завоевание 1943».
glory_challenge_desc_10301=Завершить испытание «Завоевание» любым легендарным подразделением.
glory_challenge_desc_10401=После атаки артиллерийской части дивизии «Великая Германия» у противника осталось менее 5 мобильности.
glory_challenge_desc_10501=Мобильность бронетанковой части «Пустынные крысы» достигает 42 или выше.
