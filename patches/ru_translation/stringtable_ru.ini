synergy_tactics_6_1=Окопная война: В конце хода все отряды дивизии «Фольгоре», которые не перемещались, получают эффект «Закрепление» (+30% к защите, эффект пропадает при любом движении).
synergy_tactics_6_2=Небесная кара: Если враг в радиусе 3 клеток от отряда дивизии «Фольгоре» получает урон от авиаудара, атака этого отряда «Фольгоре» увеличивается на +20 до конца хода.
synergy_tactics_6_3=Гибкий маневр: Если пехота дивизии «Фольгоре» не перемещалась в течение хода, то в конце хода все союзные отряды дивизии в радиусе 2 клеток получают +6 к мобильности на следующий ход.
synergy_tactics_6_4=Противотанковая тактика: Когда пехота дивизии «Фольгоре» находится в радиусе 2 клеток от союзной артиллерии дивизии, урон этой артиллерии по бронетехнике увеличивается на +30%.

army_buff_desc_1651=Закрепление: Защита увеличена на +30%. Эффект сбрасывается при передвижении.

