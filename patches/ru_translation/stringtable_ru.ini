legend_stage_50106=Бросок на Страсбург

legend_intro_50101=История дивизии Леклерка началась с непоколебимого патриотизма одного человека. В 1940 году Филипп Леклерк прибыл в Северную Африку и убедил губернатора Чада сформировать добровольческий отряд — «Колонну Леклерка». Чтобы поддержать силы «Свободной Франции», в 1941 году Леклерк провел свои войска через суровые пески Сахары и внезапно атаковал итальянский гарнизон в оазисе Куфра на юге Ливии. После захвата аэродрома Леклерк и его солдаты дали торжественную клятву: они не сложат оружие до тех пор, пока французский флаг не взовьется над Страсбургом. Так начался их легендарный боевой путь.
legend_intro_50102=Одержав ряд побед в Северной Африке, «Колонна Леклерка» прославилась на весь мир. В 1943 году, получив подкрепления, она присоединилась к британской 8-й армии в Тунисской кампании. Во время сражений при Меденине и на Линии Марет французы героически отбили серию мощных атак немецких танков. Позже, вместе с союзниками, они с триумфом вошли в Тунис, поставив победную точку в Североафриканской кампании.
legend_intro_50103=После победы в Северной Африке «Колонна Леклерка» была переформирована во 2-ю бронетанковую дивизию Свободной Франции. Командование сохранил Филипп Леклерк. В 1944 году дивизия высадилась во Франции, чтобы исполнить клятву, данную в Куфре. Во время боев за Фалезский котел 2-я бронетанковая дивизия в составе 3-й армии Паттона нанесла удар с юга, захлопнув ловушку для немецких войск. Они практически полностью уничтожили 9-ю танковую дивизию вермахта, заложив фундамент для освобождения всей Франции.
legend_intro_50104=После разгрома немцев в Фалезском котле дивизия Леклерка подошла вплотную к столице. Желая как можно скорее освободить город, Леклерк настойчиво требовал от верховного командования союзников разрешения на штурм. После долгих политических споров приказ был получен. В самом Париже уже полыхало восстание. 24 августа 2-я бронетанковая дивизия стремительно ворвалась в город, соединившись с отрядами Сопротивления. Под давлением французских и союзных сил 25 августа немецкий гарнизон капитулировал. В тот день над Парижем вновь гордо взвился флаг свободы.
legend_intro_50105=После освобождения Парижа 2-я бронетанковая дивизия получила приказ освободить Эльзас и Лотарингию. В начале сентября французские танкисты, при мощной поддержке американской штурмовой авиации, загнали неопытную 112-ю танковую бригаду вермахта в серию смертельных засад у Домпара. Блестяще координируя действия с бомбардировщиками, дивизия Леклерка уничтожила немецкую бригаду практически без потерь со своей стороны. Немцы были вынуждены отступить, а их планы по контрнаступлению в Лотарингии рухнули.
legend_intro_50106=22 ноября, получив одобрение верховного командования союзников, 2-я бронетанковая дивизия совместно с 1-й французской армией начала наступление на Страсбург. Дивизия мощным ударом пробилась через Савернский перевал и стремительно двинулась вперед, сминая немецкую оборону в Северном Эльзасе. 23 ноября 1944 года Страсбург был освобожден. Клятва, данная в раскаленных песках Куфры, была исполнена.

synergy_tactics_5_1=• После атаки любого отряда дивизии Леклерка все союзные войска этой дивизии в радиусе 2 клеток получают эффект «Клятва освобождения» на 1 ход.
synergy_tactics_5_2=• Боевое воодушевление: когда бронетехника дивизии Леклерка уничтожает врага, находясь под эффектом «Клятва освобождения», мораль союзных войск дивизии в радиусе 2 клеток повышается на 1 уровень. Эффект может сработать только 1 раз за ход для каждого отряда.
synergy_tactics_5_3=• Координация огня: когда артиллерия дивизии Леклерка, находящаяся под эффектом «Клятва освобождения», атакует город или укрепление, её урон увеличивается на 10%, если в радиусе 1 клетки от цели находится пехота или бронетехника дивизии Леклерка.
synergy_tactics_5_4=• Поддержка преследования: когда пехота дивизии Леклерка совершает атаку, находясь под эффектом «Клятва освобождения», союзные войска дивизии в радиусе 2 клеток получают +5 к мобильности в этом ходу.

dialogue_4204=Континентальная Франция пала под немецкой оккупацией, но однажды мы вернем свободу нашей Родине.
dialogue_4205=У итальянцев есть военный аэродром в Куфре, и мы обязаны его захватить. Докажите всему миру, что дух Франции не сломлен!
dialogue_4206=Итальянцы упрямо обороняют крепость и пытаются вызвать подкрепления по радио.
dialogue_4207=Враг стянул все силы в форт! Давите на них и не дайте им дождаться подкрепления!
dialogue_4208=Итальянский гарнизон прекратил сопротивление и начал переговоры о капитуляции. После победы Леклерк произнес свою историческую клятву.
dialogue_4209=Я торжественно клянусь: мы не сложим оружие до тех пор, пока наш прекрасный флаг не взовьется над Страсбургским собором!
dialogue_4210=По данным разведки, немецкая 9-я танковая дивизия завтра нанесет удар через Ксар-Гилан. Я настоятельно рекомендую вашим войскам отступить на 80 километров, чтобы избежать разгрома.
dialogue_4211=Наши войска останутся на позициях и примут бой, но нам жизненно необходима поддержка с воздуха!
dialogue_4212=Не дайте им уйти безнаказанно!
dialogue_4213=Подпустите их на дистанцию эффективного огня, и только потом бейте!
dialogue_4214=Отлично! Скоро здесь пройдет союзная колонна. Прикройте их фланги и присоединяйтесь к штурму бреши Тебага!
dialogue_4215=Немедленно отступайте! Мы не должны позволить врагу взять нас в кольцо!
dialogue_4216=Наступайте на север к Аржантану! Соединитесь с канадскими войсками и захлопните немецкие армии в котле!
dialogue_4217=Вперед! Освободим нашу землю!
dialogue_4218=Перебросьте 352-ю пехотную дивизию в Алансон, чтобы остановить прорыв союзников.
dialogue_4219=Из-за нашего натиска немцы отказались от планов контрнаступления и перешли в глухую оборону.
dialogue_4220=Отправьте 116-ю танковую дивизию к Аржантану! Нам нужно любой ценой удержать коридор для отступления!
dialogue_4221=1-я польская танковая дивизия успешно захватила хребет Мон-Ормель, перерезав последний путь к отступлению для немецких войск.
dialogue_4222=Я принял командование. Внимание Группе армий «Б»: оставить позиции и немедленно прорываться на восток!
dialogue_4223=После жесткого давления со стороны французского командования союзники согласились позволить 2-й французской бронетанковой дивизии и 4-й пехотной дивизии США войти в Париж, чтобы поддержать восстание и предотвратить бойню, подобную Варшавской.
dialogue_4224=Не ждите американцев, выступайте немедленно! Восстание в Париже уже началось, мы не можем бросить их на растерзание!
dialogue_4225=Танки Леклерка достигли пригородов Парижа и установили контакт с бойцами Сопротивления.
dialogue_4226=Прорвите оборону в пригородах и покажите немцам нашу ярость! Пусть жители Парижа знают, что мы уже здесь! Париж вновь обретет свободу!
dialogue_4227=4-я пехотная дивизия стремительно рвется к Парижу, чтобы убедиться, что лавры освободителей не достанутся одним лишь французам.
dialogue_4228=Немецкий гарнизон получил строгий приказ из Ставки: удерживать Париж любой ценой. Город ни в коем случае не должен достаться врагу, пока он не будет превращен в груду пепла.
dialogue_4229=Он хочет принести нас в жертву! Арестуйте этого безумца. Передайте в штаб: мы выполним приказ.
dialogue_4230=Мы начнем переговоры о сдаче союзникам. Никто из нас не собирается умирать ради чужих амбиций!
dialogue_4231=Гарнизон Парижа подписал акт о капитуляции, прекратив кровопролитие в городе. Однако немецкие части в пригородах не получили этот приказ и продолжали ожесточенно сражаться с союзниками.
dialogue_4232=Париж был унижен, Париж был разорен, Париж был истерзан, но, наконец, Париж свободен!
dialogue_4233=По данным разведки, враг перебросил элитную танковую бригаду для удара по Миркуру. Мы должны немедленно выдвинуться в Домпер, чтобы перехватить их.
dialogue_4234=Ситуация в Миркуре критическая! Мы обязаны срочно укрепить линию фронта.
dialogue_4235=Немцы наступают от Виттеля, чтобы перерезать нам путь. Мы должны разбить их сейчас, иначе, когда прибудет их подкрепление, мы окажемся в ловушке.
dialogue_4236=Немцы наступают от Виттеля, чтобы перерезать нам путь. Мы должны разбить их сейчас, иначе, когда прибудет их подкрепление, мы окажемся в ловушке.
dialogue_4237=Мы прибыли слишком поздно! Нужно срочно пробиваться к Миркуру, чтобы американцы не оказались зажаты в клещи.
dialogue_4238=Огонь!
dialogue_4239=В укрытие! Открывайте ответный огонь!
dialogue_4240=Мы в полном окружении! Бросайте танки и немедленно отступайте!
dialogue_4241=Продолжайте наступление, чтобы зачистить западный берег Мозеля от немцев!
dialogue_4242=Страсбург уже перед нами! Клятва скоро будет исполнена. Вперед, солдаты! Да здравствует Франция!
dialogue_4243=Вогезы надежно укреплены. Нам придется найти скрытые горные тропы, чтобы ударить им в тыл.
dialogue_4244=Отойти в горы Вогезы! Они не должны пройти!
dialogue_4245=Как, черт возьми, им удалось перевалить через Вогезы?!
dialogue_4246=Оставьте зачистку котлов американцам! Врываемся в Страсбург на полном ходу!
dialogue_4247=Радиограмма в Страсбург: Линия в Вогезах прорвана!
dialogue_4248=Страсбург свободен! Мы сдержали свою клятву!
dialogue_4249=Захватите окружающие форты, Страсбург не должен пасть снова!
dialogue_4250=Усиливайте натиск в Вогезах! Не дайте немецким войскам прорваться к ним на помощь!
dialogue_4251=Итальянские подкрепления пришли в движение.
dialogue_4252=В Ксар-Гилане повисла тяжелая тишина. Старина Леклерк был хорошим командиром... но теперь всё кончено, мы его больше никогда не увидим.
dialogue_4296=У врага полное превосходство в воздухе. Мы не удержим позицию. Немедленно отступаем!
dialogue_4297=Итальянский гарнизон прекратил попытки вызвать подмогу и намертво окопался в форте.
dialogue_4298=Усилить огонь! Сломите их волю к сопротивлению!
dialogue_4299=Немецкий гарнизон в центре Парижа капитулировал, город освобожден. Однако части в пригородах еще не получили этот приказ и продолжают вести бои.


