event_stage_intro_20901=База самоуничтожилась, и мы оказались последней группой, успевшей эвакуироваться. Временные координаты, введенные в последний момент, должны привести нас к убежищу в джунглях Южной Америки. На этот раз у нас будет больше времени на планирование.
event_stage_intro_20902=Гражданская война в Испании полыхает в полную силу. Из-за вмешательства Германии, Италии и СССР пакт о невмешательстве превратился в пустой звук. Некогда могучая Британская империя уже распалась, и новые империи пойдут по её стопам. И хотя исход этой войны не изменить, мы обязаны сражаться. Потому что там наши товарищи.
event_stage_intro_20903=После Второй мировой войны план Маршалла сделал Турцию главным союзником США на Ближнем Востоке. Однако, подстрекаемый Советами, в Иране поднимает голову национализм, что ставит под угрозу бесперебойную добычу нефти. Это прямой удар по нашим интересам! С одобрения президента Эйзенхауэра ЦРУ и МИ-6 подготовили план государственного переворота. Эта операция не имеет права на провал.
event_stage_intro_20904=План Осборна сработал идеально: группировки в джунглях Южной Америки вцепились друг другу в глотки. Японские и советские националисты воспользовались хаосом и атаковали военные базы США в Японии. По слухам, Советы создали орбитальное оружие — это наш шанс заполучить эти технологии! Юдинцев договорился о встрече с экспертом по спутниковой связи недалеко от советской базы на Сахалине.
event_stage_intro_20905=План Маршалла форсировал восстановление Западной Европы, дав старт стремительному экономическому росту. Однако недавние коррупционные скандалы в Италии спровоцировали массовые беспорядки и привели к убийству премьер-министра. Тем временем советская армия оккупировала Чехословакию и продолжает стягивать войска на Балканы. Мы подожгли пороховую бочку под Восточной Европой, и политическая карта континента скоро изменится навсегда.
event_stage_intro_20906=Американские сепаратисты, возмущенные переизбранием президента, подняли вооруженный мятеж. Как ни странно, в эти выборы мы не вмешивались, и, насколько мне известно, таких конфликтов здесь раньше не случалось. Теперь президент обратился к нам за помощью в подавлении восстания. Операция крайне непредсказуема, нам придется постоянно отслеживать перемещения армейских частей США.
event_stage_intro_20907=Воспользовавшись ситуацией, союзники нанесли внезапный удар по нашим объектам в Мексике. Враг завладел координатами наших тихоокеанских баз, сделав генераторы помех бесполезными. Советские части в Антарктиде с минуты на минуту обнаружат наш комплекс. Ситуация критическая. Соберите все доступные силы и немедленно атакуйте советскую исследовательскую станцию!
event_stage_intro_20911=База самоуничтожилась, и мы оказались последней группой, успевшей эвакуироваться. Временные координаты, введенные в последний момент, должны привести нас к убежищу в джунглях Южной Америки. На этот раз у нас будет больше времени на планирование.
