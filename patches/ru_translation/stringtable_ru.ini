event_stage_intro_20201=Эмбарго со стороны союзников полностью перекрыло нам доступ к стратегическим ресурсам и душит нашу экономику. Если так пойдет и дальше, Империя неизбежно проиграет Соединенным Штатам в войне на истощение. Поскольку война неизбежна, мы обязаны нанести упреждающий удар. Наша цель: внезапный авианалет для уничтожения основных сил Тихоокеанского флота США в Пёрл-Харборе.
event_stage_intro_20202=Успешная «Операция Z» устранила угрозу нашему южному направлению. Однако британцы отправили флот для усиления своего гарнизона в Сингапуре. Хотя враг и превосходит нас численно, мы превосходим его в маневренности. Мы нанесем стремительный удар в самое сердце британской обороны в Малайе, а затем захватим Сингапур в кратчайшие сроки.
event_stage_intro_20203=Американские войска на Филиппинах плохо обучены и слабо вооружены. Мы проведем серию морских десантов в разных точках, чтобы растянуть силы противника между севером и югом. Авианосный флот обеспечит поддержку высадки с воздуха.
event_stage_intro_20204=Ост-Индия невероятно богата ресурсами, но именно здесь собирается объединенный флот союзников. Из-за того, что они принадлежат к разным странам, их координация оставляет желать лучшего, а единое командование отсутствует. Наша главная задача — обеспечить успешную высадку десанта, а затем пустить на дно вражеский флот в Яванском море.
event_stage_intro_20205=Флот союзников в южной части Тихого океана терпит одно поражение за другим. Сейчас они перегруппировывают силы, рассчитывая использовать Порт-Морсби как плацдарм для контрнаступления. Мы обязаны воспользоваться слабостью их обороны и начать «Операцию МО». Мы не оставим союзникам ни единого шанса на реванш.
event_stage_intro_20206=Американцы успешно отразили наше наступление в Коралловом море и усилили оборону побережья. Нашей главной стратегической целью остается захват Порт-Морсби. Воспользовавшись слабостью гарнизона, мы захватим Новую Британию, а затем продвинемся к Лаэ, подготовив плацдарм для решающего сухопутного наступления.
event_stage_intro_20207=Тихоокеанский оборонительный периметр, наконец, выстроен. У американцев не остается иного выбора, кроме как отступить для защиты материка. Однако, согласно данным разведки, враг совершил прорыв в разработке ядерного оружия. Если оно будет применено в бою, ход войны кардинально изменится. У нас заканчивается время.
event_stage_intro_20211=Эмбарго со стороны союзников полностью перекрыло нам доступ к стратегическим ресурсам и душит нашу экономику. Если так пойдет и дальше, Империя неизбежно проиграет Соединенным Штатам в войне на истощение. Поскольку война неизбежна, мы обязаны нанести упреждающий удар. Наша цель: внезапный авианалет для уничтожения основных сил Тихоокеанского флота США в Пёрл-Харборе.
