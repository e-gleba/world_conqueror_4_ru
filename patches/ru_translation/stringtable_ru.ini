event_intro_4120=В мае 1941 года Германия подстрекла премьер-министра Ирака атаковать британские военные базы в попытке перерезать нефтяное снабжение. Британские силы обороняли аэродром Хаббания и, подтянув подкрепления со всего региона, перешли в контрнаступление. В итоге британцы подвергли бомбардировке базу в Мосуле и вышли к Багдаду, овладев городом 30 мая. Эта операция сорвала экспансию стран Оси на Ближнем Востоке, обеспечила жизненно важные для Британии пути снабжения нефтью и стала решающей победой на Ближневосточном театре Второй мировой войны.
event_intro_4121=12 мая 1940 года германская армия начала операцию «Гельб», нанеся внезапный удар по Седану через Арденны. Люфтваффе массированными бомбардировками сломили французскую оборону, а наземные части стремительно форсировали реку Маас и создали плацдарм. В дальнейшем немецкая армия успешно окружила главные британо-французские силы. Эта операция стала ключевым звеном успешной германской тактики блицкрига, непосредственно приведя к крушению союзных сил в северной Франции, предопределив последующее падение Франции и коренным образом изменив ход боевых действий на Западном фронте Второй мировой войны.
event_intro_4122=21 мая 1940 года союзники предприняли контрудар у Арраса с целью прорвать немецкое окружение. Первоначально британские части, оснащённые многочисленными танками «Матильда», прорвали немецкие порядки, однако Роммель оперативно выдвинул 88-мм зенитные орудия для стрельбы прямой наводкой, уничтожив британские танки и переломив ход боя. Хотя союзники были отброшены, их ожесточённое сопротивление заставило немцев переоценить численность противостоящих сил, что привело к возможной 24-часовой паузе в германском наступлении и дало критически важное время для Дюнкеркской эвакуации. Эта операция стала одним из немногих тактических контрударов союзников в ходе Французской кампании, а также продемонстрировала грозные противотанковые возможности этих орудий.
event_intro_4123=26 мая 1942 года Роммель повёл войска Оси в наступление в районе Газалы в Ливии. Немецкие силы обошли оборону союзников с юга; несмотря на кратковременное окружение, они контратаковали на запад и восстановили линии снабжения. Несмотря на ожесточённое сопротивление сил Свободной Франции у Бир-Хакейма, после отхода главных британских сил на восток пал Тобрук, что привело к сдаче в плен более 30 000 союзных военнослужащих. Итогом стало смещение британского командующего и назначение Монтгомери. Войска Оси выдвинулись в Египет, спровоцировав первое сражение при Эль-Аламейне.
event_intro_4124=10 июня 1944 года с целью вывода Финляндии из войны и устранения угрозы Ленинграду советские войска начали Выборгскую наступательную операцию. Ленинградский фронт сосредоточил превосходящие силы и при поддержке мощного артиллерийского огня в течение десяти дней прорвал две финские оборонительные линии, овладев Выборгом 20 июня. Однако финские войска отошли на оборонительную линию ВКТ и оказали упорное сопротивление, не позволив советским силам достичь цели по уничтожению финской армии. Эта операция стала четвёртым из «десяти сталинских ударов», устранила угрозу северному флангу Ленинграда и ускорила выход Финляндии из войны.
armygroup_rule_8=8. Соответствующий боевой рейтинг начисляется только за победы в сложном режиме.
