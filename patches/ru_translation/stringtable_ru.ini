army_buff_desc_2002=Блокада снабжения: город не производит никаких ресурсов.
army_buff_desc_2003=Осветительный снаряд: временно отключает эффекты дымовых завес и уклонения.

event_rule=Правила
;Правила режима Группы армий
armygroup_rule=Правила режима «Группа армий»
armygroup_rule_1=Командирам рекомендуется грамотно рассчитывать время, чтобы успеть получить награды за прохождение этапов.
armygroup_rule_2=Завершая достижения группы армий, вы зарабатываете очки достижений. Как только будет набрано необходимое количество очков, вы сможете забрать соответствующие награды.
armygroup_rule_3=Масштаб и сложность игры за каждую группу армий отличаются. После победы вы получите награды, соответствующие выбранной стороне.
armygroup_rule_4=Для победы в режиме «Группа армий» необходимо разгромить все армии вражеской коалиции. Группа армий считается уничтоженной только после захвата всех её зданий и уничтожения всех её войск. Объявление войны другой группе армий вашей же коалиции сделает вас враждебным ко всем бывшим союзникам.
armygroup_rule_5=Каждая группа армий имеет уникальные подкрепления и технологии. Разгромив вражескую группу армий, вы получаете доступ к её войскам для найма, а победа над определенными армиями открывает новые военные технологии.
armygroup_rule_6=Уничтожение вражеских войск и захват зданий приносят очки заслуг. Используйте их для вызова подкреплений и улучшения военных технологий.
armygroup_rule_7=Если уровень лояльности группы армий падает ниже 15%, вы захватили необходимое количество территорий, а у вражеской группы армий не осталось ни одного города, вы можете активировать опцию капитуляции, принудив её сдаться.

