event_108=Битва за Москву
event_intro_108=Осенью 1941 года немецкая армия, сокрушая все на своем пути на Восточном фронте, рвалась к столице Советского Союза. Гитлер рассчитывал захватить Москву одним молниеносным ударом, принудив СССР к капитуляции. Но чем дальше продвигался вермахт, тем сильнее растягивались их линии снабжения, а на пороге стояла суровая русская зима. Находясь на краю пропасти, Советский Союз стянул к столице свои последние резервы, обратив само время, ледяные морозы и беспримерное самопожертвование солдат в самое смертоносное оружие. Блицкриг, задуманный как триумфальный марш, превратился в кровавую мясорубку на истощение. Отступать было некуда: позади была Москва — только победа или смерть.

