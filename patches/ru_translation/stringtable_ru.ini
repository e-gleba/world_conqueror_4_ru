feat_desc_149=В течение этого хода: после уничтожения {1} врагов дальность атаки увеличивается на +{2}. Действует 1 ход.
feat_desc_149_Lv2=В течение этого хода: после уничтожения {1} врагов дальность атаки увеличивается на +{2}. Действует 1 ход.
feat_desc_149_Lv3=В течение этого хода: после уничтожения {1} врагов дальность атаки увеличивается на +{2}. Действует 1 ход.

feat_desc_150=При нанесении критического урона есть шанс {0}%, что цель получит дополнительно {1}% урона.

feat_desc_151=Переходит в режим штурма: наносимый урон увеличивается на {1}%, а штрафы к мобильности от рельефа местности игнорируются. Эффект действует 1 ход. Перезарядка: 3 хода.
feat_desc_151_Lv2=Переходит в режим штурма: наносимый урон увеличивается на {1}%, а штрафы к мобильности от рельефа местности игнорируются. Эффект действует 1 ход. Перезарядка: 2 хода.
feat_desc_151_Lv3=Переходит в режим штурма: наносимый урон увеличивается на {1}%, штрафы к мобильности от рельефа местности, а также дебафы при погружении в воду игнорируются. Эффект действует 1 ход. Перезарядка: 2 хода.

