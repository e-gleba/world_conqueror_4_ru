elite_intro_97=«Харриер» — легендарный западный многоцелевой штурмовик вертикального/укороченного взлёта и посадки (СВВП), ставший первым в мире серийным самолётом этого класса. Благодаря поворотным соплам, обеспечивающим управление вектором тяги, он способен действовать без стационарных взлётно-посадочных полос. Это позволяет базироваться на передовых аэродромах подскока и даже лесных опушках, значительно повышая выживаемость самолета. Обладая режимом зависания и превосходной маловысотной манёвренностью, «Харриер» идеально подходит для непосредственной авиационной поддержки и штурмовки наземных сил врага.
elite_intro_98=Су-30В — засекреченный проект истребителя вертикального взлёта и посадки (СВВП), разработанный в ОКБ Сухого для стран Варшавского договора в годы холодной войны. В его основу легли проверенные платформы Су-27 и Су-30, однако двигатели и системы управления были полностью переработаны. Истребитель оснащён двигателями с управляемым вектором тяги и дополнительными подъемными вентиляторами. Это позволяет ему взлетать с поврежденных фронтовых аэродромов без ВПП и зависать на малых высотах, обрушивая на противника сокрушительный огонь с воздуха.

