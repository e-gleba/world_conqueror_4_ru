feat_desc_88=Устанавливает мину в радиусе 1 клетки, которая может нанести {1} ед. урона. Перезарядка: 1 ход.
feat_desc_88_Lv3=Устанавливает мину в радиусе 2 клеток, которая может нанести {1} ед. урона. Перезарядка: 1 ход.
feat_desc_89=Прокладывает тоннель от вашей текущей позиции к выбранной клетке в радиусе 4 клеток. Конечная клетка не может быть горами или морем. Через тоннель может перемещаться ваша пехота, легкие и средние танки, бронеавтомобили, реактивная и полевая артиллерия, а также гаубицы. После прохода через тоннель отряд получает дополнительное действие (максимум 3 раза для одного тоннеля). При прокладке нового тоннеля предыдущий исчезает. Перезарядка: 2 хода.
feat_desc_89_Lv2=Прокладывает тоннель от вашей текущей позиции к выбранной клетке в радиусе 7 клеток. Конечная клетка не может быть горами или морем. Через тоннель может перемещаться ваша пехота, легкие и средние танки, бронеавтомобили, реактивная и полевая артиллерия, а также гаубицы. После прохода через тоннель отряд получает дополнительное действие (максимум 3 раза для одного тоннеля). При прокладке нового тоннеля предыдущий исчезает. Перезарядка: 2 хода.
feat_desc_90=Здания в радиусе 1 клетки восстанавливают {1} ОЗ. Срабатывает 1 раз за ход.
feat_desc_92=Атака отряда увеличивается на {2} ед. за каждые потерянные {1} ОЗ.
feat_desc_92_Lv2=Дальность атаки +1. Атака отряда увеличивается на {2} ед. за каждые потерянные {1} ОЗ.
feat_desc_92_Lv3=Дальность атаки +1. Атака отряда увеличивается на {2} ед. за каждые потерянные {1} ОЗ.
feat_desc_93=При получении смертельного урона запас ОЗ не может опуститься ниже 1 ед. в течение 2 ходов. Перезарядка: {2} хода.
feat_desc_93_Lv2=При получении смертельного урона запас ОЗ не может опуститься ниже 1 ед. в течение 2 ходов. Перезарядка: {2} хода.
feat_desc_93_Lv3=При получении смертельного урона запас ОЗ не может опуститься ниже 1 ед. в течение 3 ходов. Перезарядка: {2} хода.
feat_desc_94=При нахождении на своей или союзной территории наносимый урон увеличивается на {1}%.
feat_desc_95=При атаке и контратаке игнорирует штрафы к урону от рельефа местности.
feat_desc_95_Lv2=При атаке и контратаке игнорирует штрафы к урону от рельефа местности. Снижает защиту и подвижность противника на 1 ход.
feat_desc_95_Lv3=При атаке и контратаке игнорирует штрафы к урону от рельефа местности. Снижает защиту и подвижность противника на 1%.
feat_desc_96=Полученный прямой урон распределяется между этим отрядом и союзными войсками поблизости. За каждую {1} ед. распределенного или заблокированного урона базовая атака увеличивается на {2} ед. Максимальный бонус к атаке ограничен 100%.
feat_desc_96_Lv2=Полученный прямой урон распределяется между этим отрядом и союзными войсками поблизости. За каждую {1} ед. распределенного или заблокированного урона базовая атака увеличивается на {2} ед. Максимальный бонус к атаке ограничен 100%.
feat_desc_96_Lv3=Полученный прямой урон распределяется между этим отрядом и союзными войсками поблизости. За каждую {1} ед. распределенного или заблокированного урона базовая атака увеличивается на {2} ед. Максимальный бонус к атаке ограничен 200%.
feat_desc_97=При атаке авиации есть {1}% вероятность полностью избежать урона.

