dialogue_4000=Обойдя Аррас, мы должны как можно скорее захватить мосты через реку Скарп. 5-я танковая дивизия уже получила приказ и скоро прибудет на подмогу.
dialogue_4001=В это время французская и британская армии получили приказ готовиться к контрнаступлению под Аррасом.
dialogue_4002=Мне нужно, чтобы они прекратили эти хаотичные вылазки и координировали свои действия с дивизией.
dialogue_4003=Нажмите кнопку «Формирование легиона».
dialogue_4004=Нажмите на легион, который хотите сформировать.
dialogue_4005=Нажмите на отряд, который нужно включить в состав.
dialogue_4006=Нажмите кнопку «Подтвердить формирование».
dialogue_4007=25-й танковый полк! Приказываю продвигаться с осторожностью, беречь технику и во взаимодействии с пехотой захватить и удержать мост.
dialogue_4008=Проклятье! Броня их танков слишком толстая! Срочно передайте на передовую: развернуть 88-мм зенитки и бить прямой наводкой по танкам!
dialogue_4009=Прямой лобовой удар? Это обойдется нам дорого. Но иногда самый прямолинейный ход способен спутать врагу все карты!
dialogue_4010=Французские войска выдвинулись для прикрытия правого фланга британской армии, но из-за путаницы в связи приняли англичан за врага.
dialogue_4011=После непродолжительной стычки обе стороны опознали друг друга, и французская армия продолжила наступление.
dialogue_4012=Огонь противника невероятно плотный. Нашему подразделению срочно нужна авиаподдержка.
dialogue_4013=Всем частям: преследовать врага и захватить Аррас!
dialogue_4014=Стремительно наступайте вдоль берега Немана и захватите Алитус.
dialogue_4015=Отлично! Защитите мост в Алитусе! Не позвольте Советам отбить его ни при каких обстоятельствах!
dialogue_4016=Тем временем советская 5-я танковая дивизия на всех парах мчится на помощь гарнизону Алитуса.
dialogue_4017=Основные силы советской 5-й танковой дивизии прибыли в Алитус.
dialogue_4018=Я в курсе ситуации в Алитусе. Я уже запросил воздушную поддержку Люфтваффе. Ваше подразделение обязано удержать Алитус любой ценой!
dialogue_4019=Главный приоритет — атаковать мосты в верховьях Немана, чтобы заставить противника разделить свои силы.
dialogue_4020=Советские подкрепления разбиты! Передайте всем частям: атаковать всеми силами и занять города к западу от Немана!
dialogue_4021=Прикажите 3-й и 4-й танковым группам прорвать советскую оборону фронтальным ударом и замкнуть кольцо окружения в тылу Вязьмы!
dialogue_4022=Прорвитесь через стык между 19-й и 30-й армиями, а затем соединитесь с 4-й танковой группой в тылу Вязьмы.
dialogue_4023=Бросайте в бой танковые резервы 19-й, 30-й и 49-й армий! Окружить вражеский прорыв и не дать им продвинуться дальше!
dialogue_4024=Передайте передовым частям приказ на немедленный отход, иначе они окажутся в котле.
dialogue_4025=4-я танковая группа смяла Резервный фронт Будённого и подготовилась к наступлению на Вязьму.
dialogue_4026=Соединение с 4-й танковой группой прошло успешно. Вяземский котел замкнут.
dialogue_4027=Прорываемся на восток всеми силами! Не дайте немцам взять нас в кольцо!
dialogue_4028=Не думайте ни о чем другом. У вас одна задача: взять Яхрому и открыть путь на Москву с севера!
dialogue_4029=Солдаты, война достигла переломного момента. Мы обязаны победить. Победа — наш единственный выход!
dialogue_4030=Ледяной сибирский ветер и снег ослепляют. Ужасная погода серьезно снижает обзор и боеспособность немецких войск.
dialogue_4031=Взятие Клина 7-й танковой дивизией еще сильнее сузило северный оборонительный периметр Москвы.
dialogue_4032=Передайте Рокоссовскому: 16-я армия обязана любой ценой перехватить немецкие части, идущие на Клин!
dialogue_4033=После падения Яхромы немцы подготовили плацдарм для масштабного охвата Москвы с севера.
dialogue_4034=1-я ударная армия должна удержать рубеж любой ценой! Немцы не должны прорваться через Красноармейск!
dialogue_4035=Силуэт Кремля уже виднеется на горизонте, но горючее и боеприпасы 3-й танковой группы практически на исходе.
dialogue_4036=Невероятно! 7-я танковая дивизия ворвалась в черту Москвы. Но именно здесь она столкнулась с самым отчаянным сопротивлением.
dialogue_4037=Гарнизон Московской зоны обороны занял позиции и уничтожит любого врага, который посмеет ступить на улицы столицы!
dialogue_4038=Внимание группе армий «Юг»: используя 4-ю танковую армию как главную ударную силу и группу Кемпфа для прикрытия флангов, уничтожить 6-ю гвардейскую армию.
dialogue_4039=7-я танковая дивизия из состава армейской группы Кемпфа получила приказ готовиться к наступлению к востоку от Белгорода.
dialogue_4040=7-я танковая дивизия успешно форсировала Северский Донец и создала плацдарм на линии обороны 7-й гвардейской армии.
dialogue_4041=Приказ 7-й гвардейской армии: сковать боем вражеский плацдарм и не дать им перебросить туда основные силы.
dialogue_4042=Плацдарм расширен и теперь может обеспечить безопасную переправу для наших основных сил.
dialogue_4043=Срочная шифровка в Генштаб: враг готовится начать наступление на Прохоровку. Срочно требуются танковые резервы.
dialogue_4044=Ваша часть обязана любой ценой остановить их прорыв!
dialogue_4045=Откуда у Советов столько танков?! Отступаем! Иначе мы здесь все ляжем!
dialogue_4046=После артподготовки вся армия переходит в наступление. Сегодня мы возьмем Киев!
dialogue_4047=Киев нам больше не удержать. 7-я танковая дивизия должна срочно отойти к Фастову. Мы не можем позволить врагу отрезать нам пути отхода.
dialogue_4048=Всем войскам: отступить к Фастову и занять оборону, чтобы остановить наступление противника.
dialogue_4049=Всем войскам — отступать к Белой Церкви.
dialogue_4050=Телеграмма в Берлин: Мы сдали Киев.
dialogue_4051=Срочно возвращайтесь для защиты Житомира! Этот железнодорожный узел не должен достаться врагу!
dialogue_4052=48-й танковый корпус начал наступление к северу от Фастова. Мы должны замкнуть кольцо у Житомира, чтобы остановить советский каток.
dialogue_4053=Всем частям: держать фронт! Не недооценивайте противника и не лезьте на рожон!
dialogue_4054=Авиация уже на подходе! Ковровые бомбардировки превратят их линию обороны в пыль, а затем мы ударим напролом!
dialogue_4055=Бомбардировка закончилась раньше расчетного времени!
dialogue_4056=Резервы — вперед! Закройте брешь! Они не должны прорвать нашу оборону!
dialogue_4057=3-я танковая дивизия успешно прорвала оборону, вынудив немцев стягивать фланги.
dialogue_4058=Перебросьте 2-ю и 116-ю танковые дивизии на помощь. Мы обязаны остановить их продвижение.
dialogue_4059=Сжимайте кольцо шаг за шагом. Не дайте им вырваться из котла!
dialogue_4060=Организованно отходите на восток! Не дайте им замкнуть окружение!
dialogue_4061=Я сделал всё, что мог. Пора заканчивать эту войну. Её продолжение принесет Германии лишь катастрофу.
dialogue_4062=Фон Клюге отстранен. Командование принимает Модель.
dialogue_4063=Начните масштабное наступление на кольцо окружения снаружи, чтобы пробить коридор для запертых войск!
dialogue_4064=Кольцо сжалось. Окруженные немецкие части пошли на последний, отчаянный прорыв.
dialogue_4065=Ахен имеет колоссальное политическое значение. Его падение сломает моральный дух врага.
dialogue_4066=Дайте людям немного передохнуть, а затем начинайте штурм Хюртгенского леса.
dialogue_4067=Свяжитесь с тылом, требуйте маршевые пополнения! Мы обязаны остановить врага в Хюртгенском лесу.
dialogue_4068=Сложный рельеф Хюртгенского леса измотал 3-ю танковую дивизию.
dialogue_4069=Части СС уже спешат на подмогу.
dialogue_4070=Эта битва решит судьбу нации. Принимается только победа, поражение недопустимо!
dialogue_4071=Вся армия переходит в наступление! Прорвемся через Арденны и возьмем Антверпен!
dialogue_4072=Бронетанковые части союзников стремительно вошли в Арденны и остановили прорыв противника.
dialogue_4073=Теперь, когда северный и южный фланги скованы боями, а войска скопились в центре, необходимо прорвать фронт через Арденнский лес.
dialogue_4074=Мы не можем позволить какому-то городку застопорить наше наступление.
dialogue_4075=101-я воздушно-десантная дивизия отказалась капитулировать и продолжает удерживать Бастонь.
dialogue_4076=Немедленно поддержать Бастонь! Немцы не должны захватить этот транспортный узел!
dialogue_4077=Оставив Бастонь за спиной, немецкие части снабжения смогли беспрепятственно продвигаться, усиливая натиск наступления.
dialogue_4078=Прорвав линию обороны на Рейне, 1-я армия ударила с юга, чтобы отрезать Рурский промышленный район.
dialogue_4079=3-й танковой дивизии приказано стремительно наступать на Липпштадт для соединения с 9-й армией.
dialogue_4080=Обращение к окруженным войскам: сложите оружие и сдавайтесь.
dialogue_4081=Как фельдмаршал Рейха, я не могу отдать приказ о капитуляции. Но я сделаю всё возможное, чтобы дать солдатам шанс выжить.
dialogue_4082=Мой последний приказ: Группа армий «Б» распущена. Всем частям предписывается либо прорываться из котла, либо сложить оружие и разойтись по домам.
dialogue_4083=По крайней мере, я сражался до последнего вздоха.
dialogue_4084=Командир 3-й танковой дивизии пал в бою, но его храбрость воодушевила солдат сражаться дальше.
dialogue_4085=Не желая сдаваться в плен, Вальтер Модель застрелился.
dialogue_4086=24 февраля 1991 года началась операция «Буря в пустыне». 3-я бронетанковая дивизия США, как ударный авангард, перешла границу Ирака.
dialogue_4087=Кувейт освобожден. Войска Коалиции стремительно наращивают темп наступления.
dialogue_4088=Американцы включили системы радиоэлектронного подавления, парализовав связь иракской армии.
dialogue_4089=Большая часть иракской армии уничтожена. Коалиция одержала сокрушительную победу, а правительство Ирака официально запросило мир.
dialogue_4090=255-я бригада морской пехоты отправлена на стык 56-й и 18-й армий, чтобы сдержать натиск немецких войск.
dialogue_4091=Немецкая армия начала операцию «Аттика» по захвату Туапсе.
dialogue_4092=Передовые немецкие части вышли на окраины Туапсе. Срочно запрашиваем подкрепления!
dialogue_4093=Туапсе захвачен. Советская армия стягивает силы, чтобы взять немецкий гарнизон в кольцо.
dialogue_4094=Отбив Туапсе, советские войска на волне успеха перешли в масштабное контрнаступление.
dialogue_4095=255-я бригада морской пехоты захватила плацдарм, куда командование спешно перебрасывает значительные резервы.
dialogue_4096=Гарнизон Новороссийска поднят по тревоге, чтобы не дать советской армии расширить плацдарм.
dialogue_4097=Наступление советских войск выдохлось. Командование приказало окопаться на плацдарме и использовать его как трамплин для будущих операций.
dialogue_4098=Немцы бросили в бой дополнительные силы, чтобы сбросить десант в море и ликвидировать плацдарм.
dialogue_4099=Вместе с припасами на плацдарм прибыл политрук, вдохновивший бойцов стоять за Малую землю насмерть.
dialogue_4100=255-я бригада морской пехоты получила приказ высадиться в порту Новороссийска, чтобы ударить по вражеской обороне с тыла.
dialogue_4101=Десант успешно прорвал внешнюю оборону порта и завязал с немецкими войсками тяжелые уличные бои.
dialogue_4102=Внешний обвод Новороссийска пал. Советские войска постепенно берут город под свой контроль.
dialogue_4103=После освобождения Новороссийска немецкие части начали отход на северо-запад, преследуемые по пятам советскими войсками.
dialogue_4104=18-я армия прорвала оборонительную линию севернее Новороссийска, создав угрозу окружения с севера.
dialogue_4105=Десант 18-й армии прорвал морскую блокаду и высадился в Эльтигене.
dialogue_4106=Эльтигенский десант успешно оттянул на себя главные силы немцев. Этим воспользовалась 56-я армия, высадив мощный десант к северо-востоку от Керчи.
dialogue_4107=Во время штурма береговых укреплений, под шквальным пулеметным огнем, сержант Костенко отдал жизнь за родину.
dialogue_4108=Пока Керченский плацдарм на севере укреплялся, немецкие войска начали генеральный штурм Эльтигена.
dialogue_4109=Стремительным маневром советские войска нанесли внезапный удар по Керчи, заставив командование Оси спешно перебрасывать резервы.
dialogue_4110=После взятия Балаклавы немецкий 49-й горный корпус на Сапун-горе оказался в котле.
dialogue_4111=49-й горный корпус был выбит советскими войсками с Сапун-горы и откатился к оборонительным рубежам Севастополя.
dialogue_4112=Мекензиевы горы взяты! Северная оборонительная линия противника рухнула.
dialogue_4113=После освобождения Севастополя немецкие войска были загнаны на западное побережье в ожидании эвакуации по морю.
dialogue_4114=Румынский флот разгромлен, боевой дух отступающих войск уничтожен.
dialogue_4115=Окруженные в городе войска Оси приготовились стоять до последнего солдата.
dialogue_4116=255-й бригаде морской пехоты приказано форсировать Днестровский лиман под покровом ночи и создать плацдарм для 46-й армии.
dialogue_4117=Береговая оборона Оси засекла десант! Бой на побережье неизбежен.
dialogue_4118=Северный плацдарм успешно закреплен, орудия Аккермана подавлены. Путь для основных сил открыт.
dialogue_4119=Город Аккерман освобожден. Враг был вынужден бросить оборонительные позиции в устье реки.
dialogue_4120=На северном фланге советская 37-я армия совершила крупный прорыв. Враг начал поспешный отход, спасаясь от окружения.

