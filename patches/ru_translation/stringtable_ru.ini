general_stage_intro_141=В октябре 1942 года под командованием генерала Монтгомери, прозванного «Охотником на лис», союзникам удалось прорвать немецкую оборону и одержать ряд важнейших побед в Северном Египте. Битва при Эль-Аламейне стала поворотным моментом Североафриканской кампании, заложив фундамент для окончательного изгнания войск Оси из Африки.
general_stage_intro_142=В 1943 году союзники провели масштабную морскую высадку на Сицилии, быстро захватив остров и разгромив немецко-итальянские войска. Эта операция не только открыла путь к освобождению континентальной Италии, но и стала ключевой победой союзников на Средиземноморском театре военных действий.
general_stage_intro_143=Являясь одним из верховных главнокомандующих, Монтгомери возглавил масштабную операцию союзников по высадке в Нормандии. Воздушный и морской десанты, а также мощное сухопутное наступление позволили успешно захватить плацдармы и прорвать немецкую оборону. Эта победа предоставила ключевую возможность для освобождения всей Европы.
general_stage_intro_144=Стремясь быстро прорваться вглубь Германии, союзники начали масштабную воздушно-десантную операцию по захвату ключевых мостов в Нидерландах, планируя соединиться с наступающими наземными войсками. Однако они не предполагали, с какими трудностями и ожесточенным сопротивлением немцев им предстоит столкнуться.
general_stage_intro_145=В конце 1944 года суровой зимой немецкая армия начала внезапное контрнаступление в Арденнах, пытаясь перерезать линии снабжения союзников. Однако союзные войска выстояли и нанесли мощный ответный удар, загнав немцев в угол и проложив путь к окончательному вторжению в Германию.

dialogue_2401=Разгромите норвежские войска обороны до прибытия британских подкреплений.
dialogue_2402=Враг пытается расчленить и окружить нас! Прорвите кольцо блокады и остановите их!
dialogue_2403=Подкрепления из Греции нанесут наземный удар совместно с нами, чтобы раз и навсегда выбить немцев с греческой территории.
dialogue_2404=Взаимодействуйте с флотом, чтобы перехватить подкрепления врага и уничтожить их еще в море.
dialogue_2405=Пожалуйста, перехватите вражеские подкрепления как можно скорее.
dialogue_2406=Чтобы прикрыть отступление Макартура, американская армия взяла инициативу в свои руки и нанесла удар первой.
dialogue_2407=Следите за вражеским флотом на флангах и не дайте их основным силам уйти!
dialogue_2408=Приложите все усилия, чтобы остановить наступление японских сухопутных войск и удержать наши позиции на Новой Гвинее!
dialogue_2409=Японцам отступать некуда! Полный вперед, уничтожьте основные силы вражеского флота!
dialogue_2410=Силы НАТО завершили высадку. Будьте готовы ко второй волне морского десанта противника.
dialogue_2411=Мы не должны позволить врагу закрепиться в Азии. Уничтожьте их авианосные ударные группы!
dialogue_2412=Вражеские танковые клинья наносят удар с севера и юга!
dialogue_2413=Враг построил огромную ракетную базу прямо у нас под боком!
dialogue_2414=Сдержите вражеский флот и раз и навсегда устраните угрозу от их ракетной базы.
dialogue_2415=Финская армия нанесла по нам внезапный удар. Мы должны продержаться до прибытия подкреплений!
dialogue_2416=Мы перерезали линии снабжения противника в Северной Африке.
dialogue_2417=Немцы блокировали Атлантику и готовятся к полномасштабному вторжению на нашу территорию.
dialogue_2418=Союзники прорвали несколько линий обороны на Западном фронте. Нам отступать некуда.
dialogue_2419=Нанесите упреждающий удар до того, как враг перейдет в наступление, и застаньте их врасплох!
dialogue_2420=Мы окружены британской армией! Как можно скорее прорвите линию блокады и соединитесь с нашими подкреплениями.
dialogue_2421=Срочно соберите резервы! Мы сделаем всё возможное, чтобы остановить британское наступление.
dialogue_2422=Японцы отказались от фронтального штурма. Они проникают нам в тыл с двух флангов!
dialogue_2423=Наши танковые клинья сметут всё на своем пути!
dialogue_2424=Советские войска взяли нас в кольцо. Удерживайте позиции и ждите подкрепления!
dialogue_2425=Я воспользуюсь этой возможностью, чтобы нарастить темп наступления.
dialogue_2426=Американская армия бросила все свои силы против нас. Это идеальная возможность полностью уничтожить врага. Мы непобедимы!
dialogue_2427=Мы будем держаться изо всех сил, пока не прибудут резервы.
dialogue_2428=Французы всё еще не сдались. Уничтожьте их флот и навсегда выбейте союзников из Средиземного моря!
dialogue_2429=Немцы больше не в силах остановить нашу высадку. Полный вперед! Мы освободим всю Европу!
dialogue_2430=Британский флот на подходе! Мы свяжем их боем, а вы как можно скорее перехватите их конвои с подкреплением!
dialogue_2431=Враг стягивает силы на передовую. Воспользуйтесь брешами в японском тылу и нанесите им внезапный удар!
dialogue_2432=От японского флота мало что осталось. Уничтожьте их последние корабли и покончите с этой войной!
dialogue_2433=Только уничтожив основные силы вражеских авианосцев, мы получим шанс на выживание.
dialogue_2434=Кризис не разрешится сам собой. Мы не можем просто сидеть и ждать — нужно брать инициативу в свои руки.
dialogue_2435=Американские войска успешно высадились и координируют действия с союзниками для захвата ключевых укреплений противника.
dialogue_2436=Непрерывное стягивание вражеских сил на фронт нарушило баланс сил. Мы обязаны приложить все усилия, чтобы сдержать их наступление.
dialogue_2437=Мы отрезали итальянскую армию от снабжения в Северной Африке. Захватите их крепости и прорвитесь к нашим конвоям.
dialogue_2438=Только захватив эти базы, мы сможем продолжать эту войну.
dialogue_2439=Враг оккупировал наш город. Мои войска готовы перейти в контрнаступление в любую минуту.
dialogue_2440=Координируйте действия с нами и перейдите в наступление, чтобы очистить Северную Африку от врага!
dialogue_2441=Задержите наступление противника, соберите как можно больше припасов и готовьтесь к масштабному контрудару.
dialogue_2442=Японцы разорвали дистанцию. Остерегайтесь их внезапных атак и продвигайтесь вперед шаг за шагом, закрепляясь на рубежах.
dialogue_2443=Мы вклинились глубоко в оборону врага и вскоре замкнем кольцо вокруг его основных сил.
dialogue_2444=Высадка прошла успешно! Совместно с нашим флотом мы полностью выбьем противника с побережья.
dialogue_2445=Единственный наш шанс на победу — удержать эти позиции!
dialogue_2446=Чтобы выжить в эти трудные времена, мы должны найти свой собственный путь.

dialogue_2447=Командир, пожалуйста, найдите брешь в обороне противника и возглавьте наш прорыв!
dialogue_2448=Не дайте британцам прорвать нашу линию обороны! Держитесь изо всех сил и ждите подкреплений с тыла!
dialogue_2449=У нас нет времени ждать подкреплений с тыла!
dialogue_2450=Солдаты, мы на пороге великой победы! Вышвырнем войска Оси с Африканского континента раз и навсегда!
dialogue_2451=Высаживайтесь на южном и восточном побережьях острова и атакуйте, пока враг не успел стянуть свои резервы!
dialogue_2452=Союзники начали массированную высадку на Сицилии! Бросайте все войска на их перехват, не дайте им продвинуться вглубь острова!
dialogue_2453=Следите за морем на северном фланге — враг может прислать подкрепления!
dialogue_2454=Господин командующий, ведите нас вглубь Нормандии!
dialogue_2455=Остановите продвижение союзников любой ценой! Не дайте им прорваться вглубь континента!
dialogue_2456=Продолжайте наступление на север! Наши десантники высадятся в тылу врага, и мы возьмем их в клещи!
dialogue_2457=Мы перехватили планы союзников. Солдаты, удерживайте плацдарм! Не дайте им добиться успеха!
dialogue_2458=Если мы не сможем захватить этот ключевой мост, наши десантники погибнут зря!
dialogue_2459=Господин командующий, срочно отправьте войска на помощь нашим десантникам, чтобы обеспечить их безопасность!
dialogue_2460=Отлично! Благодаря поддержке британцев нам удалось избежать тяжелых потерь. Солдаты, все как один — в контратаку!
dialogue_2461=Действуйте осторожно, не дайте немцам рассечь наши порядки и сконцентрировать силы для решающего удара.

elite_intro_63=Альпийские стрелки (Alpini) — элитные горнострелковые войска итальянской армии, основанные в 1872 году. Оснащенные передовым для своего времени снаряжением, они покрыли себя славой как в Первой, так и во Второй мировых войнах, сражаясь в самых суровых условиях.
elite_intro_64=Гаубица Б-4 калибра 203 мм оснащена уникальной гусеничной ходовой частью и двойной системой отката. Во время Второй мировой войны это орудие сыграло решающую роль при штурме тяжелых бетонных дотов и укреплений, за что враги прозвали его «Кувалдой Сталина».

feat_name_62=Препятствия
feat_name_63=Осада

feat_desc_62=Лишает вражеские отряды в радиусе 1 клетки возможности передвигаться на 1 ход. Перезарядка: 3 хода.
feat_desc_63=Урон по укреплениям городов увеличивается на {1}% в течение 2 ходов. Перезарядка: 3 хода.

