event_stage_intro_21015=Канадские мятежники объединились с нашей внутренней оппозицией, захватив контроль над регионом Великих озер и начав наступление на восток. Пока мы перебрасывали войска для подавления бунта, советская армия воспользовалась нашей уязвимостью и провела новую высадку десанта. Разведка сообщает, что между мятежниками и Советами нет никакой координации. Мы обязаны использовать их стычки, чтобы быстро усилить наши части, подавить восстание и вышвырнуть захватчиков.
event_stage_intro_21016=Конфликт между Европой и СССР перерос в полномасштабную войну. Стремительный прорыв советского Северного флота застал нас врасплох. Даже наш главный союзник — Великобритания — сейчас страдает от оккупации части своих территорий. Европе срочно нужна наша помощь. Наши экспедиционные силы и транспортная авиация находятся в полной боевой готовности и ждут приказа на развертывание!
event_stage_intro_21017=Советская армия бросает в бой свои последние стратегические резервы, сражаясь как загнанный в угол зверь. В их системе фронтового командования видны явные трещины, а единство стран Варшавского договора не так прочно, как кажется. Мы должны собрать все доступные силы и начать генеральное наступление на восток, чтобы отбросить советские войска к их границам. Это идеальный шанс расширить наше влияние в Европе.

dialogue_3412=Из-за растянутых коммуникаций советское наступление уже выдыхается.
dialogue_3413=Резервы стягиваются со всех сторон. Удерживайте точку сбора!
dialogue_3414=Пусть враг трепещет перед нашей стальной лавиной!
dialogue_3415=Основные силы собраны в кулак. Пора переходить в контрнаступление.
dialogue_3416=Американский контрудар пробил брешь в нашем фронте. Перегруппируйте силы и уничтожьте эту атакующую группировку!
dialogue_3417=Мы прорвались к укреплениям американцев. Теперь их подкрепления не смогут выйти на поле боя!
dialogue_3418=Мой флот обеспечит прикрытие, пока резервы не завершат высадку.
dialogue_3419=Стянуть дополнительные силы к британскому гарнизону в Нассау и установить блокаду Карибского моря, чтобы перехватить флот Британии.
dialogue_3420=Черт, Советы ждали нас! Нашим людям не хватает тяжелого вооружения, они просто не могут остановить их танки.
dialogue_3421=Если британские войска смогут прорвать окружение и сорвать развертывание советских войск, у нас еще останется шанс на победу.
dialogue_3422=Берегитесь вражеского десанта. Гарнизоны всех секторов должны координировать оборону.
dialogue_3423=Мы перехватили вражеский десант и их резервы, вернув контроль над южной частью Гаваны.
dialogue_3424=Контроль американцев над этим сектором не так силен, как мы думали. Не сбавляйте темп, продолжайте атаковать!
dialogue_3425=Как только мы оценим здесь обстановку, мы обязательно вернемся в Мексиканский залив.
dialogue_3426=Советские войска на Аляске были отброшены к Берингову проливу, но это была лишь уловка — они снова начали наступление на Восточном побережье.
dialogue_3427=Кризис на Кубе успешно отвлек внимание американцев. У правительства США почти не осталось свободных резервов.
dialogue_3428=Разведка снова ошиблась. Нам придется самим оценивать обстановку на месте.
dialogue_3429=Подлодка класса «Тайфун» внезапно прекратила выход на связь и самовольно сменила курс. Немедленно отправьте субмарины на перехват!
dialogue_3430=Нью-Йорк пал. Ситуация стала критической.
dialogue_3431=Коды управления советскими подлодками класса «Тайфун» теперь у нас. Используйте их, чтобы стереть вражеские фортификации с лица земли.
dialogue_3432=Пока советская армия не успела закрепиться, мы можем перехватить инициативу!
dialogue_3433=Гренландия нуждается в нашей помощи!
dialogue_3434=Мы должны перебросить туда подкрепления до того, как Советы полностью оккупируют остров.
dialogue_3435=Советская армия потеряла еще один стратегический рубеж. Мой флот продолжит наступление на Рейкьявик.
dialogue_3436=Американцы перерезали еще одну линию снабжения. Пора задуматься об отступлении.
dialogue_3437=Свернуть блокаду Гренландии и отвести флот к Исландии.
dialogue_3438=Советскому флоту больше некуда отступать. Но враг в Европе, похоже, начал действовать. Мы должны покончить с этим быстро!
dialogue_3439=Североамериканские повстанцы ударили в самый подходящий момент — их десант почти не встретил сопротивления.
dialogue_3440=Советы нам не союзники, но прямо сейчас у нас один общий враг.
dialogue_3441=Натиск мятежников оказался невероятно яростным.
dialogue_3442=Враг стремительно рвется к Восточному побережью.
dialogue_3443=Мы совершенно не в состоянии сдержать их наступление.
dialogue_3444=Увеличьте группировку войск в Канаде. Мы подавим это восстание от лица наших союзников.
dialogue_3445=Мои люди займутся союзными силами повстанцев на западе.
dialogue_3446=Осборн только что потерпел поражение. Откуда он снова там взялся? Отправьте войска для полной зачистки сектора.
dialogue_3447=В конце концов, я верну свое наследие.
dialogue_3448=Американцы, используя Исландию как плацдарм, начали переброску сил в Норвегию. Они снова вторгаются в Европу.
dialogue_3449=Операция в Гренландии дала нам возможность нанести внезапный удар по Северной Европе и Великобритании.
dialogue_3450=Стремительное наступление Советов на два фронта загнало нас в угол. У нас нет возможности быстро разделить силы для поддержки.
dialogue_3451=Мы должны немедленно определить направление главного удара.
dialogue_3452=Крупные силы советской армии уже высадились на берег. Если мы не перехватим их прямо сейчас, последствия будут катастрофическими.
dialogue_3453=Если не принять меры немедленно, ситуация станет необратимой.
dialogue_3454=Берегитесь объединенного англо-американского флота, который идет к ним на выручку. Задержите их подкрепления, пока мы не оккупируем Норвегию и Швецию.
dialogue_3455=Остановите советское вторжение и продолжайте наступление на север. Не дайте американцам возможности вмешиваться в дела Европы!
dialogue_3456=Авангард советских войск уже вторгся в Западную Германию и Данию.
dialogue_3457=Не дайте силам НАТО развернуться! Заприте их на плацдармах!
dialogue_3458=Что бы ни случилось, пламя французского сопротивления никогда не угаснет!
dialogue_3459=Всем частям — приготовиться к атаке.
dialogue_3460=Советская армия утратила над нами контроль. Никто не остановит объединение Германии!
dialogue_3461=Наступаем на восток! На этот раз мы не проиграем!
dialogue_3462=Если Советы всё равно рано или поздно вернутся, мы должны начать контрнаступление и решить эту проблему раз и навсегда.
dialogue_3463=Войска НАТО уже прорвали нашу вторую линию обороны! Немедленно бросайте резервы на возврат позиций!
dialogue_3464=Осло уже пал. Ситуация для нас критическая.
dialogue_3465=Советские войска почти полностью покинули Балтику. Настало наше время действовать.
dialogue_3466=Это не вписывается в мои расчеты. Мне нужно больше боевых данных для корректировки стратегии.
dialogue_3467=Такими темпами от нашего альянса ничего не останется.
dialogue_3468=Не позволяйте временным неудачам сломить вашу веру в победу!


