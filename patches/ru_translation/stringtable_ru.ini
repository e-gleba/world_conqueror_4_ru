item_name_130=Фрагмент «Юкикадзе»

elite_intro_78=Инженерные войска играют важнейшую роль в вооруженных силах любой страны, отвечая за строительство и обслуживание военной инфраструктуры: баз, аэродромов, дорог, мостов и других объектов. В военное время они обеспечивают оперативное возведение и ремонт сооружений, гарантируя бесперебойное снабжение и мобильность войск на передовой. Инженерные части незаменимы не только на поле боя, но и в обеспечении национальной безопасности, отвечая за надежность стратегических объектов.
elite_intro_79=AuF1 — французская 155-мм самоходная артиллерийская установка на шасси танка AMX-30, отличающаяся высокой маневренностью и сокрушительной огневой мощью. Принятая на вооружение в конце 1970-х годов, она обеспечивает быструю и точную огневую поддержку благодаря автомату заряжания и передовой системе управления огнем. AuF1 способна эффективно действовать в самых разных боевых условиях и обладает хорошей бронезащитой, что делает её важнейшим элементом огневой поддержки французской армии в современной войне.
elite_intro_80=Т-72 «Урал» — советский основной боевой танк, разработанный в начале 1970-х годов. Оснащен мощной 125-мм гладкоствольной пушкой с автоматом заряжания и передовой системой управления огнем. Т-72 отличается не только превосходной маневренностью и надежной броней, но и невысокой стоимостью производства, а также простотой в обслуживании. Благодаря этим качествам он стал одним из самых массовых танков в мире и основой бронетанковых войск многих стран как в период холодной войны, так и в наши дни.
elite_intro_81=Эсминец «Юкикадзе» относился к типу «Кагэро» Императорского флота Японии. Несмотря на колоссальные потери японского флота на Тихоокеанском театре военных действий, этот корабль продемонстрировал феноменальную удачливость. «Юкикадзе» участвовал в более чем дюжине крупных сражений, включая битву за Мидуэй и сражение в заливе Лейте. Почти все крупные корабли, которые он сопровождал, были потоплены или тяжело повреждены, но сам эсминец каждый раз возвращался невредимым. Единственное прямое попадание в корабль за всю войну обернулось неразорвавшимся снарядом.

