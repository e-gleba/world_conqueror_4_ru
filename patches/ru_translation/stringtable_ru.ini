help_hq_desc_1=Штаб — центр управления армией. Здесь можно просматривать, улучшать и нанимать генералов. Лимит генералов растет с уровнем Штаба. Опыт Штаба дается за Сценарии, Завоевание и Господство.
help_hq_desc_2=Повышение звания и ранга увеличивает ОЗ отряда, базовые характеристики и силу навыков генерала. Лимит развития повышается после полного прохождения кампаний.
help_hq_desc_3=Медали усиливают навыки генерала. Один генерал может носить до 3 медалей. Сменить медали можно в Коллекции.
help_hq_desc_4=Ленты — дополнительное снаряжение генерала. С повышением ранга открываются слоты под ленты, до 3. Три одинаковые ленты можно объединить в ленту более высокого уровня.
help_hq_desc_5=Технологии постоянно усиливают ваши войска во всех режимах.
help_hq_desc_6=Объекты открываются за Маневры в Господстве. Их можно строить в городах для глобальных бонусов.
help_hq_desc_7=Чудеса дают сильные пассивные бонусы и ежедневные ресурсы. Они открываются за особые этапы Господства.
help_hq_desc_8=Элитные войска — особые мощные отряды. Для открытия и улучшения нужны фрагменты из событий и магазина. В бою можно нанять только один отряд каждого типа, кроме авиации.
help_hq_desc_9=В Досье можно пройти путь знаменитых полководцев. Завершите 5 этапов досье генерала, чтобы получить эксклюзивный титул и уникальное снаряжение.

help_battle_1=Движение
help_battle_2=Отмена хода
help_battle_3=Атака
help_battle_4=Условия победы
help_battle_5=Назначение генерала
help_battle_6=Наем войск
help_battle_7=Захват городов
help_battle_8=Укрепления
help_battle_9=Влияние рельефа
help_battle_10=Боевой дух

help_battle_desc_1=Выберите отряд, чтобы увидеть его зону перемещения. Движение по сложному рельефу (горы, леса) требует больше очков мобильности.
help_battle_desc_2=После перемещения отряда вы можете отменить ход, вернув его на исходную позицию. Отмена невозможна, если отряд уже совершил атаку или если вы сняли с него выделение.
help_battle_desc_3=Враги в радиусе поражения отмечаются красным маркером. Если ваш отряд атакует цель, находящуюся в зоне её ответного огня, он получит урон. Если враг уничтожен вашей атакой, ответного удара не будет.
help_battle_desc_4=В начале каждого боя показаны условия победы, лимит генералов и доход ресурсов. Ключевые объекты на карте отмечены красным — их удержание критически важно для победы.
help_battle_desc_5=Выбрав отряд, вы можете назначить генерала его командиром. Это многократно повысит характеристики и боевую мощь подразделения.
help_battle_desc_6=В городах без гарнизона можно нанимать новые войска. Для базовых отрядов требуются военные заводы нужного уровня, а Элитные войска можно вызывать независимо от уровня зданий.
help_battle_desc_7=Когда здоровье вражеского города (ОЗ укреплений) падает до нуля и гарнизон уничтожен, вы можете ввести туда свой отряд, чтобы захватить город и получать с него ресурсы.
help_battle_desc_8=На своей территории можно строить объекты ПВО для снижения урона от авиаударов, а также возводить бункеры, минные поля и радары для усиления наземной обороны.
help_battle_desc_9=Горы, леса и города дают отрядам бонус к укрытию, снижая получаемый урон. Бонусы текущей клетки отображаются в левом верхнем углу экрана.
help_battle_desc_10=Боевой дух (Мораль) влияет на урон отряда. Если отряд окружен или зажат с флангов, его мораль падает. При критическом падении морали отряд впадает в панику («Хаос») и полностью теряет способность атаковать или отвечать на огонь.

help_system_1=Облачное сохранение
help_system_2=Язык
help_system_3=Боевой пропуск
help_system_4=Достижения
help_system_5=Ограниченное предложение

help_system_desc_1=В меню настроек доступна функция Облачного сохранения. Вы можете загружать свой прогресс на сервер, чтобы синхронизировать игру между разными устройствами.
help_system_desc_2=Язык игры можно изменить в настройках главного меню.
help_system_desc_3=Боевой пропуск — отличный способ получить множество ценных наград за игру. Он делится на бесплатную и премиум-линию. Доступ к нему можно получить через меню любого боевого режима.
help_system_desc_4=В меню Достижений собраны глобальные игровые испытания. За их выполнение выдаются самые щедрые награды в игре.
help_system_desc_5=Появление этой иконки означает, что в Магазине временно доступны для покупки мощные эксклюзивные генералы. Не упустите шанс!

