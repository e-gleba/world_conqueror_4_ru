eventgeneral_rule=Правила «Испытания генералов»
eventgeneral_rule_1=Событие длится ограниченное время. Командирам следует грамотно планировать свое время, чтобы успеть завершить этапы и получить награды.
eventgeneral_rule_2=Сложность события соответствует «Сложному» режиму Биографий, однако для участия в этом событии предварительно проходить Биографии не требуется.
eventgeneral_rule_3=Силы противника получают 2 случайных баффа (они определяются на старте события и действуют до его завершения). Товарищи командиры, тщательно планируйте маршрут своих войск!
eventgeneral_rule_4=За победу на уровне фиксируется максимальное количество полученных звезд. Накопив определенное количество звезд, вы сможете забрать награды за этап.
eventgeneral_rule_5=Награды за этапы делятся на два типа: медали и фрагменты элитных войск. Они выдаются при достижении определенного количества звезд.

challenge_rule=Правила «Событий-испытаний»
challenge_rule_1=События-испытания доступны в течение ограниченного времени. Товарищи командиры, пожалуйста, грамотно планируйте свое время, чтобы успеть пройти уровни и получить награды.
challenge_rule_2=Уровни испытаний делятся на «Обычную» и «Высокую» сложность. Чтобы разблокировать высокую сложность, необходимо сначала пройти обычную.
challenge_rule_3=На высокой сложности войска противника получают 2 случайных баффа (они определяются на старте события и действуют до его завершения).
challenge_rule_4=Испытания делятся на 4 типа: поддержка союзников, удержание позиций, уничтожение вражеских сил и сбор припасов. Каждое событие посвящено одному из этих типов.
challenge_rule_5=За прохождение определенных уровней вы можете получить награды за этапы.
challenge_rule_6=В Событиях-испытаниях запрещено строительство любых оборонительных сооружений.

