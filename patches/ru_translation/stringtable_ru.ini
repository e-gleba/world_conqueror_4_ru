event_stage_intro_20801=Немцы застали нас врасплох, обойдя линию Мажино. Страны Бенилюкса пали одна за другой. Командование начало операцию «Динамо», приказав нам прикрывать отход основных французских сил и экспедиционного корпуса к Дюнкерку и Кале. В эту эпоху грубой силы последствия политики умиротворения расхлебывать придется нам. Как бы ни было тяжело на фронте, мы выполним приказ! Ради чести наших семей! Ради братьев по оружию! Ради Королевских ВВС! Во славу Британской империи!
event_stage_intro_20802=Мы упустили свой шанс на эвакуацию. Альфред был сбит в воздушном бою, и его судьба неизвестна. Однако до нас дошли слухи от местных жителей: Альфреда и других пленных летчиков удерживают в небольшом горном городке, чтобы вскоре переправить в Берлин. Время на исходе. Насколько бы сомнительной ни была эта информация, мы обязаны попытаться. Мы не бросаем своих братьев.
event_stage_intro_20803=Разгром союзников на Западном фронте доказал, что исход этой войны решается на суше, а ключ к победе — бронетанковые войска. Ситуация в Северной Африке столь же плачевна, как и в Европе. Единственная разница: хотя немцы всё еще стремительно наступают, здесь у нас есть колоссальное преимущество в технике и снабжении. Наши танковые дивизии станут несокрушимой силой на североафриканском театре!
event_stage_intro_20804=Операция по дезинформации «Фортитьюд» сработала: укрепления немцев в Нормандии еще не достроены, а на пляжах нет тяжелой артиллерии! Это наш шанс! Я быстро зачищу плацдарм, чтобы расчистить путь для десанта союзников. Сегодня мы будем сражаться плечом к плечу. Это станет началом нашего возвращения и началом нашей победы!
event_stage_intro_20805=Откуда у немцев всё еще столько сил для организации такого массированного наступления? Защитники Бастони уже попали в окружение, и шансов вырваться у них почти нет. Если наши резервы не смогут предугадать маневры врага и вовремя прийти на помощь, нам останется надеяться только на британцев.
event_stage_intro_20806=Война навсегда перекроила карту мира. США и СССР стали новыми сверхдержавами-гегемонами. Колонии обрели независимость, наша империя рушится, а былая слава осталась лишь в учебниках истории. Рано или поздно, при новом правительстве, мы станем лишь вассалами Соединенных Штатов. Однако угроза куда ближе: Советы захватили восток Мексики и продвигаются на север, готовясь к прямому вторжению в США. Начинается война новой эпохи, и мы обязаны создать собственные вооруженные силы, чтобы сохранить последние остатки имперского достоинства.
event_stage_intro_20807=Обнаружение древних руин привлекло внимание и США, и Советского Союза. Хранящихся там технологий и оружия эпохального уровня достаточно, чтобы перевернуть весь мир с ног на голову. Обе сверхдержавы уже пришли в движение. Однако, следуя за загадочным сигналом, наш передовой отряд опередил их и нашел скопление руин в Южной Америке. Кем бы ни были те люди, их цель совпадает с моей: разрушить старую систему и выстроить абсолютно новый мировой порядок.
event_stage_intro_20811=Немцы застали нас врасплох, обойдя линию Мажино. Страны Бенилюкса пали одна за другой. Командование начало операцию «Динамо», приказав нам прикрывать отход основных французских сил и экспедиционного корпуса к Дюнкерку и Кале. В эту эпоху грубой силы последствия политики умиротворения расхлебывать придется нам. Как бы ни было тяжело на фронте, мы выполним приказ! Ради чести наших семей! Ради братьев по оружию! Ради Королевских ВВС! Во славу Британской империи!
event_stage_intro_20812=Мы упустили свой шанс на эвакуацию. Альфред был сбит в воздушном бою, и его судьба неизвестна. Однако до нас дошли слухи от местных жителей: Альфреда и других пленных летчиков удерживают в небольшом горном городке, чтобы вскоре переправить в Берлин. Время на исходе. Насколько бы сомнительной ни была эта информация, мы обязаны попытаться. Мы не бросаем своих братьев.
event_stage_intro_20813=Разгром союзников на Западном фронте доказал, что исход этой войны решается на суше, а ключ к победе — бронетанковые войска. Ситуация в Северной Африке столь же плачевна, как и в Европе. Единственная разница: хотя немцы всё еще стремительно наступают, здесь у нас есть колоссальное преимущество в технике и снабжении. Наши танковые дивизии станут несокрушимой силой на североафриканском театре!
event_stage_intro_20814=Операция по дезинформации «Фортитьюд» сработала: укрепления немцев в Нормандии еще не достроены, а на пляжах нет тяжелой артиллерии! Это наш шанс! Я быстро зачищу плацдарм, чтобы расчистить путь для десанта союзников. Сегодня мы будем сражаться плечом к плечу. Это станет началом нашего возвращения и началом нашей победы!
event_stage_intro_20815=Откуда у немцев всё еще столько сил для организации такого массированного наступления? Защитники Бастони уже попали в окружение, и шансов вырваться у них почти нет. Если наши резервы не смогут предугадать маневры врага и вовремя прийти на помощь, нам останется надеяться только на британцев.
event_stage_intro_20816=Война навсегда перекроила карту мира. США и СССР стали новыми сверхдержавами-гегемонами. Колонии обрели независимость, наша империя рушится, а былая слава осталась лишь в учебниках истории. Рано или поздно, при новом правительстве, мы станем лишь вассалами Соединенных Штатов. Однако угроза куда ближе: Советы захватили восток Мексики и продвигаются на север, готовясь к прямому вторжению в США. Начинается война новой эпохи, и мы обязаны создать собственные вооруженные силы, чтобы сохранить последние остатки имперского достоинства.
event_stage_intro_20817=Обнаружение древних руин привлекло внимание и США, и Советского Союза. Хранящихся там технологий и оружия эпохального уровня достаточно, чтобы перевернуть весь мир с ног на голову. Обе сверхдержавы уже пришли в движение. Однако, следуя за загадочным сигналом, наш передовой отряд опередил их и нашел скопление руин в Южной Америке. Кем бы ни были те люди, их цель совпадает с моей: разрушить старую систему и выстроить абсолютно новый мировой порядок.

