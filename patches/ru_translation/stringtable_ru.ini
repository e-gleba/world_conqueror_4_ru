dialogue_2770=Эта операция направлена на захват аэродромов Гуадалканала и соседних островов, благодаря чему мы вернем Соломоновы острова!
dialogue_2771=Прикажите всем формированиям убедиться, что аэродром был отбит!
dialogue_2772=Немцы были изгнаны из Кана, давайте преследовать и выйти за эту линию обороны!
dialogue_2773=Солдаты, стабилизируйте линию, тыл - наша спасательная линия!
dialogue_2774=Продолжайте идти глубоко и возьмите Фалайз!
dialogue_2775=Нападайте со всей силой и оттесните их обратно в пролом!
dialogue_2776=Солдаты, немцы в кармане, продолжайте атаковать и полностью разгромите их!
dialogue_2777=Все солдаты, поступательно продвигайтесь, чтобы запечатать Heeresgruppe B в окружении!
dialogue_2778=По приказу Фюрера: контрнаступайте всеми силами и не позволяйте врагу продолжать наступление!
dialogue_2779=Битва была необратимой, и вся армия отступила, чтобы сохранить силы!
dialogue_2780=Немецкое движение изменилось, восточные армии должны быстро закрыться, им нельзя позволить сбежать!
dialogue_2781=Вся армия готова, и на этот раз мы вернем нашу родину!
dialogue_2782=В этой операции крайне важно захватить все порты и обеспечить поставки.
dialogue_2783=Все войска группы G отступают, чтобы сохранить свои силы.
dialogue_2784=В этой операции мы прорвемся через линию Диеппе и получим информацию о немецкой береговой обороне.
dialogue_2785=Оставайтесь в состоянии боевой готовности и усиливайте патрулирование!
dialogue_2786=Мы окружим Киев и полностью уничтожим Юго-Западный фронт в этой операции!
dialogue_2787=Моя дивизия нанесет удар на юг от Чернигова.
dialogue_2788=Клест из моей дивизии нападет на север с черкасско-кременчукской линии.
dialogue_2789=Приказ Ставки: держите позицию любой ценой! выпрямитесь, держитесь и при необходимости жертвуйте.
dialogue_2790=Окружение завершено, задушите врага всеми силами!
dialogue_2791=Приказ Северо-Западного фронта: Балтийский флот и 10-я пехотная армия выводятся из порта Таллинна в Ленинград.
dialogue_2792=Артиллерийские батальоны блокируют побережье, воздушные части бомбят вражеские корабли всеми силами, мы должны предотвратить отход советских войск по морю!
dialogue_2793=На севере - финты, на юге - тяжелые, а в этой битве 8-я армия должна быть побеждена!
dialogue_2794=Защитите танки в очереди, удержите гребень Алам-эль-Хальфа, мы победим!
dialogue_2795=Маневрируйте и быстро действуйте, чтобы аннексировать Польшу, прежде чем Великобритания и Франция смогут отреагировать!
dialogue_2796=Наша армия отвечает за помощь в нападении и обеспечение открытия Польского коридора.
dialogue_2797=Наша армия отвечает за основное наступление и должна быстро проникнуть в польское ядро.
dialogue_2798=Когда Англия и Франция вмешаются, ситуация изменится.
dialogue_2799=Войска, послушайте, для защиты украинского и белорусского населения мы очистим польские регионы от дезорганизованных вооруженных сил!
dialogue_2800=Как Советский Союз осмелился разорвать Антанту и вторгнуться в Польшу? кажется, что Польша проиграла войну. но мы никогда не сдадимся!
dialogue_2801=Битва должна вестись в первую очередь с "стоп" для того, чтобы замедлить основные силы противника.
dialogue_2802=Поскольку американцы считают, что немцы будут сосредоточены на укреплении Таранто, пусть так и будет.
dialogue_2803=Основное нападение союзников не должно быть на "стопы", и мы должны сосредоточить наши силы на обороне вокруг Рима.
dialogue_2804=Британская армия начала боевые действия, отправляется, высаживается в Салерно!
dialogue_2805=Италия объявила о своей капитуляции.
dialogue_2806=Разоружим итальянскую армию, и Италия будет под нашим контролем.
dialogue_2807=Марш в Египет был отложен дважды, и премьер-министр считает, что его больше не можно отложить.
dialogue_2808=Несмотря на недостаточные запасы, правильные запасы соответствуют правильным целям.
dialogue_2809=Нам нужно выиграть время, чтобы накопить достаточно энергии для начала атаки.
dialogue_2810=Отлично, продолжайте с устойчивым прогрессом!
dialogue_2811=Товарищи, пришло время для контрнаступления для освобождения Риги!
dialogue_2812=Солдаты, Восточная Пруссия все еще находится в контакте с Латвией.Поддержка не будет прекращена.Удерживайте позиции!
dialogue_2813=Немецкое сопротивление упорное, поэтому нам, вероятно, следует атаковать Клайпеду и разорвать контакт между Ригой и Восточной Пруссией.
dialogue_2814=Эвакуируйте Ригу пошаговыми действиями и реорганизуйте линию обороны в Курляндии.
dialogue_2815=Первые десантные войска находятся на своих местах, они захватят и удержат близлежащие мосты, пожалуйста, поддержите их как можно скорее!
dialogue_2816=Солдаты, толкайте быстро и покажите янки, из чего мы сделаны!
dialogue_2817=Все подразделения возьмите под контроль мост, если не можете, уничтожите его всеми силами, бронетанковые подразделения вскоре придут на помощь!
dialogue_2818=Мост в Арнемме был потерян, и мы не можем вторгнуться в Рур с другой стороны Рейна.
dialogue_2819=Нападение в направлении Хютгенского леса, убедившись, что немецкие силы в районе Аахен не получат поддержки!
dialogue_2820=Опираясь на оборону линии Зигфрида, необходимо остановить наступление армии США и защитить плотину Рур!
dialogue_2821=Аахен был захвачен, и войска двигаются дальше!
dialogue_2822=Хотя Аахен и упал, мы не можем сдаться, если мы держимся, мы все еще можем повернуть угол!
dialogue_2823=Простите, но, похоже, другая сторона не хочет принимать наши добрые намерения.
dialogue_2824=Согласно плану, мы должны будем заставить их силой.
dialogue_2825=Напасть, разбить немцев в районе Меца и захватить Мец!
dialogue_2826=Метцский гарнизон, опираясь на оборону форта, успешно отсрочил американское продвижение!
dialogue_2827=2-я армейская группа прорвалась к северо-западу от Брянска, а 2-я бронетанковая группа продвигалась от Шевска до Орла.В этом бою мы окружим Брянский фронт!
dialogue_2828=Товарищи, Москва за нами, враг должен быть сдержан ради Родины и народа!
dialogue_2829=Враг окружит нас, все вы, проникните!
dialogue_2830=Нападайте со всей своей силой и разгромите их!
dialogue_2831=Фюрер приказал 15-й армейской группе любой ценой удерживать устье Шелды.
dialogue_2832=Первая канадская армия отвечала за прорыв реки Шелд, при соответствующей союзной поддержке.
dialogue_2833=Коридор до Вальхерена должен оставаться открытым любой ценой.

