elite_intro_91=Реактивная система залпового огня (РСЗО) M142 HIMARS на колесном шасси стала одной из самых грозных систем вооружения на современном поле боя благодаря высочайшей мобильности, быстрому развертыванию и возможности наносить высокоточные удары. Система способна запускать различные типы ракет и широко применяется силами быстрого реагирования для точечного поражения удаленных целей. Исключительная адаптивность делает HIMARS критически важным элементом современной войны.

