skill_info_162=При командовании кораблем мораль не снижается. При нанесении критического урона на море наносимый урон увеличивается на [#00FF00#%d%%]. Если союзный авианосец находится в радиусе 2 клеток или генерал сам командует авианосцем, урон от авиаударов, ракет и ядерных бомб увеличивается на +30%. Все союзные авианосцы в радиусе 2 клеток наносят на +15%% больше урона авиаударами.
skill_info_163=При командовании кораблем шанс нанести критический урон при атаке или авиаударе составляет [#00FF00#%d%%] (если у генерала есть этот навык, эффекты от навыков «Командир флота» и «Командир ВВС» не суммируются).
skill_info_164=При командовании элитной пехотой союзные войска (включая собственный отряд) в радиусе 1 клетки наносят на +10%% больше урона сухопутным войскам (если уровень элитного отряда 9 или выше, бонус увеличивается до 15%%).
skill_info_165=При атаке пехотой генерал восстанавливает ОЗ в размере [#00FF00#%d%%] от нанесенного урона. Если в радиусе 1 клетки находится союзная бронетехника или артиллерия, дальность атаки и ответного огня вашей пехоты увеличивается на +1.

