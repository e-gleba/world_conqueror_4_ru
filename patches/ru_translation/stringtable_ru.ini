synergy_tactics_9_1=• Все подразделения 1-й дивизии морской пехоты игнорируют штрафы к подвижности при высадке на берег.
synergy_tactics_9_2=• Разведдозор: после атаки пехоты 1-й дивизии морской пехоты подразделения той же дивизии в радиусе 2 клеток получают усиление «Бдительность». (Бдительность: получаемый урон −40%; исчезает после первого попадания.)
synergy_tactics_9_3=• Шквальный огонь: после атаки артиллерии 1-й дивизии морской пехоты подразделения той же дивизии в радиусе 2 клеток получают усиление «Натиск». (Натиск: атака +20%, исчезает после совершения атаки.)
synergy_tactics_9_4=• Бой на любой местности: если в радиусе 2 клеток есть пехота 1-й дивизии морской пехоты, бронетехника той же дивизии игнорирует снижение урона от рельефа при атаке.
synergy_tactics_10_1=• Все подразделения 51-й горской дивизии имеют 25% шанс уклониться от контратаки при нанесении удара.
synergy_tactics_10_2=• Рассекающий удар: все подразделения 51-й горской дивизии получают +15% к атаке по окружённому противнику.
synergy_tactics_10_3=• Перекрёстное прикрытие: после атаки пехоты 51-й горской дивизии подразделения той же дивизии в радиусе 2 клеток получают усиление «Прикрывающий манёвр» на 1 ход. (Прикрывающий манёвр: защита +6, подвижность +2. Суммируется до 3 раз.)
synergy_tactics_10_4=• Подавляющий обстрел: после атаки артиллерии 51-й горской дивизии подразделения той же дивизии в радиусе 2 клеток получают усиление «Штурмовое прикрытие» на 1 ход. (Штурмовое прикрытие: если цель не ответила контратакой, она получает «Поспешный ответ» на 1 ход; Поспешный ответ: атака −10%, суммируется до 5 раз.)
