conquest_event_desc_1=Китайская армия оказала ожесточенное сопротивление японским захватчикам в Шанхае и вдоль реки Сучжоухэ. Битва заставила Японию сместить вектор главного удара и полностью разрушила их планы по «завоеванию Китая за три месяца».
conquest_event_desc_2=Китайские войска насмерть стояли в Ухане, продемонстрировав железную волю к сопротивлению. Война в Китае перешла от стратегической обороны к затяжному стратегическому тупику.
conquest_event_desc_3=Используя тактику молниеносной маневренной войны — блицкрига, Германия стремительно вторглась в Польшу в 1939 году. Это вынудило Великобританию и Францию объявить войну Германии, что ознаменовало официальное начало Второй мировой войны.
conquest_event_desc_4=Период затишья между объявлением войны и реальными боевыми действиями. Отсутствие масштабных операций привело к временному позиционному тупику на Западном фронте.
conquest_event_desc_5=После боев на Халхин-Голе СССР и Япония заключили пакт о нейтралитете, благодаря которому две страны сохраняли мир на протяжении почти всей Второй мировой войны.
conquest_event_desc_6=Соединенные Штаты предоставили Великобритании и Франции масштабную военную помощь, обеспечив их жизненно важным вооружением.
conquest_event_desc_7=Советский Союз развернул наступление на Финляндию суровой зимой. Несмотря на итоговую победу СССР, финская армия заставила их заплатить за нее огромную цену.
conquest_event_desc_8=Германия начала стремительное вторжение в Норвегию и Данию.
conquest_event_desc_9=Богатейшие нефтяные месторождения Румынии стали главной топливной артерией для Германии, что критически повлияло на боеспособность войск Оси.
conquest_event_desc_10=Германия применила тактику блицкрига для вторжения в Нидерланды, мгновенно прорвав голландские и бельгийские оборонительные линии.
conquest_event_desc_11=План Манштейна, реализованный в мае 1940 года, заключался в прорыве танковых клиньев через Арденнский лес. Немцы обошли линию Мажино и взяли англо-французские войска в гигантский котел.
conquest_event_desc_12=Швеция сыграла важнейшую роль в усилении военной машины Оси, поставляя в Германию огромные объемы высококачественной железной руды.
conquest_event_desc_13=Уинстон Черчилль стал премьер-министром Великобритании. Его жесткое руководство и зажигательные речи укрепили британский дух сопротивления.
conquest_event_desc_14=Неприступная Линия Мажино оказалась абсолютно бесполезной, так как немецкие войска просто обошли её. Это привело к стремительному краху северного фронта Франции.
conquest_event_desc_15=Падение Парижа символизировало капитуляцию Франции. Кампания в Западной Европе завершилась триумфальной победой Германии, обеспечив ей подавляющее стратегическое преимущество на раннем этапе войны.
conquest_event_desc_16=Оказавшись в окружении, союзники провели масштабную эвакуацию с пляжей Дюнкерка. Около 330 000 солдат были спасены силами военного и гражданского флота Британии, сохранив костяк армии для будущих сражений.
conquest_event_desc_17=Немецкое командование разработало операцию «Морской лев» — план полномасштабного вторжения на Британские острова, намереваясь сначала сокрушить оборону с воздуха и с моря.
conquest_event_desc_18=Величайшее воздушное сражение 1940 года, в котором Королевские ВВС Великобритании (RAF) успешно отразили массированные налеты Люфтваффе. Это стало первой крупной победой союзников в Европе.
conquest_event_desc_19=Кригсмарине поставила под угрозу жизненно важные конвои союзников, используя скоординированные группы подлодок («волчьи стаи») для уничтожения боевых и торговых кораблей.
conquest_event_desc_20=В водах Атлантики развернулась жестокая борьба: немецкие подводные лодки топили конвои тактикой «волчьей стаи», в то время как союзники бросали все силы на противолодочную оборону и эскорт.
conquest_event_desc_21=
conquest_event_desc_22=Германия, Италия и Япония постепенно расширяли сотрудничество и в итоге образовали военный блок на основе общих политических амбиций.
conquest_event_desc_23=После вторжения Японии правительство Таиланда решило сотрудничать с агрессором и официально присоединилось к странам Оси.
conquest_event_desc_24=Германия перебросила Африканский корпус в Северную Африку, чтобы спасти итальянскую армию от разгрома и бросить серьезный вызов британцам в этом регионе.
conquest_event_desc_25=В 1941 году Германия разорвала пакт о ненападении и начала полномасштабное вторжение в Советский Союз, открыв Восточный фронт в Европе.
conquest_event_desc_26=В 1941 году франкистская Испания отправила «Голубую дивизию» добровольцев на Восточный фронт, чтобы поддержать немецкую операцию «Барбаросса».
conquest_event_desc_27=Сохраняя строгий нейтралитет, Португалии удалось сохранить торговые связи с обеими сторонами конфликта и обеспечить внутреннюю стабильность.
conquest_event_desc_28=Лидеры США и Великобритании подписали Атлантическую хартию в 1941 году, заложив принципы, объединившие страны антигитлеровской коалиции.
conquest_event_desc_29=Американские пилоты-добровольцы под командованием генерала Шеннолто сформировали эскадрилью «Летающие тигры». Они обеспечивали воздушное прикрытие китайских войск на театре боевых действий Китай-Бирма-Индия.
conquest_event_desc_30=Советский город Ленинград оказался в тисках немецкой блокады. Его жители героически боролись за жизнь, умирая от жесточайшего голода и холода под непрерывными бомбежками.
conquest_event_desc_31=Когда немцы рвались к Москве, солдаты и ополченцы Красной Армии встали насмерть, защищая столицу в условиях суровой зимы.
conquest_event_desc_32=В ноябре 1941 года прямо во время осады на Красной площади состоялся исторический военный парад. Войска проходили маршем мимо советского руководства и отправлялись прямо на передовую.
conquest_event_desc_33=Суровая русская зима, нехватка зимнего обмундирования, растянутые коммуникации и фанатичное сопротивление Красной Армии подорвали боевой дух немецких войск и остановили блицкриг.
conquest_event_desc_34=В декабре 1941 года авианосный флот Японии нанес сокрушительный внезапный удар по базе ВМС США. Это вынудило Соединенные Штаты официально вступить во Вторую мировую войну.
conquest_event_desc_35=После Пёрл-Харбора разразилась полномасштабная война на Тихом океане. Используя тактику «лягушачьих прыжков», США и союзники начали отвоевывать острова, неуклонно приближая фронт к берегам Японии.

