general_stage_intro_101=В сентябре 1939 года Хайнц Гудериан, командующий 19-м моторизованным корпусом, продемонстрировал тактику блицкрига во время вторжения в Польшу. В то же время советские войска нанесли удар с востока, взяв Польшу в клещи. Государство было обречено.
general_stage_intro_102=В мае 1940 года Гудериан вновь возглавил 19-й моторизованный корпус, на этот раз против Франции. Немецкие танковые клинья прорвались через Арденнский лес, обошли линию Мажино с севера и стремительно продвинулись вглубь французской территории, ошеломив противника.
general_stage_intro_103=В сентябре 1941 года немецкая армия замкнула кольцо вокруг Ленинграда на севере Советского Союза. Началась 900-дневная блокада, в ходе которой город подвергался непрерывным бомбардировкам и столкнулся с чудовищным голодом.
general_stage_intro_104=Курская битва стала крупнейшим танковым сражением Второй мировой войны и ключевым поворотным моментом на Восточном фронте. Гудериан инспектировал бронетанковые войска в этом наступлении, пытаясь прорвать глубоко эшелонированную советскую оборону.
general_stage_intro_105=Октябрь 1944 года. Советские войска взяли в плотное кольцо столицу Венгрии, Будапешт. Смогут ли окруженные немецкие части вырваться из котла под шквальным огнем советской артиллерии?
general_stage_intro_111=Тунис оставался последним оплотом сил Оси в Северной Африке. В ноябре 1942 года союзные англо-американские войска нанесли удары с востока и запада, разгромили немецкую группировку и взяли Тунис. Это положило конец Североафриканской кампании.
general_stage_intro_112=В июле 1943 года союзники провели масштабную десантную операцию на Сицилии, чтобы вывести Италию из войны. Эта победа открыла союзникам путь для дальнейшего вторжения на континентальную часть Италии.
general_stage_intro_113=В июне 1944 года союзники осуществили грандиозную высадку в Нормандии для открытия Второго фронта и освобождения Франции. Успешный десант подорвал стратегическое положение Германии на западе и ознаменовал начало конца Третьего рейха.
general_stage_intro_114=Это было самое масштабное сухопутное сражение на Тихоокеанском театре военных действий, которое закончилось сокрушительным разгромом японской императорской армии на Филиппинах.
general_stage_intro_115=В декабре 1944 года в Арденнском лесу развернулось жестокое сражение. Немцы предприняли отчаянную попытку масштабного зимнего наступления, чтобы переломить ход войны, но встретили ожесточенное сопротивление союзников.
general_stage_intro_121=В октябре 1941 года, когда немецкая армия рвалась к Москве, Георгий Жуков был назначен командующим Западным фронтом. Благодаря жесткой обороне и своевременному контрнаступлению Красная Армия отбросила врага и отстояла столицу.
general_stage_intro_122=Сражение, длившееся с августа 1942 года по февраль 1943-го, стало самой кровопролитной битвой Второй мировой войны, унесшей жизни более двух миллионов человек с обеих сторон. Жуков, в качестве заместителя Верховного Главнокомандующего, координировал действия фронтов при обороне и контрнаступлении.
general_stage_intro_123=В июле 1943 года Германия предприняла свое последнее крупное наступление на Восточном фронте под Курском. Жуков координировал действия советских войск, которые измотали противника в обороне, а затем перешли в мощное контрнаступление, окончательно лишив вермахт стратегической инициативы.
general_stage_intro_124=Грандиозное стратегическое наступление советских войск, начавшееся в июне 1944 года с целью освобождения Белоруссии и восточной Польши. Операция завершилась полным разгромом немецкой группы армий «Центр» и освобождением огромных территорий.
general_stage_intro_125=Берлинская операция в апреле 1945 года стала финальным аккордом войны в Европе. Жуков, командуя войсками 1-го Белорусского фронта, возглавил штурм столицы Третьего рейха, который вынудил нацистскую Германию к безоговорочной капитуляции.
general_stage_intro_131=В апреле 1941 года Африканский корпус Роммеля осадил англо-австралийский гарнизон в крепости Тобрук, но столкнулся с ожесточенным сопротивлением. Британцы предприняли несколько безуспешных попыток деблокировать гарнизон.
general_stage_intro_132=В июне 1941 года состоялось первое крупное танковое сражение между немецкими и британскими войсками в Северной Африке. Роммель блестяще провел маневренную оборону, разгромив британские силы и разрушив их планы по деблокаде Тобрука.
general_stage_intro_133=Спустя год после неудачной осады Тобрука, в мае 1942 года, Роммелю представился шанс взять реванш. Пришло время увидеть тактический гений, который принес ему самую славную победу в его военной карьере.
general_stage_intro_134=Силы Оси стремились захватить Египет и Суэцкий канал, чтобы отрезать Британию от её колоний и получить доступ к ресурсам Ближнего Востока. Решающая битва при Эль-Аламейне развернулась в октябре 1942 года. Смогут ли союзники похоронить амбиции Оси в песках Египта?
general_stage_intro_135=Последнее крупное сражение Североафриканской кампании. В ноябре 1942 года союзные войска зажали итало-немецкую группировку в Тунисе. Опираясь на подготовленные рубежи, силы Оси отчаянно сопротивлялись, несмотря на подавляющее превосходство союзников в ресурсах и живой силе.

