elite_intro_93=8.8 cm Flak 36 — легендарное многоцелевое артиллерийское орудие, широко применявшееся Германией во время Второй мировой войны. Изначально спроектированное как зенитное, оно обладало превосходной бронепробиваемостью, что сделало его смертоносным противотанковым средством. Оно проявило себя особенно эффективно против британской бронетехники в Северной Африке. За невероятную мощь и точность солдаты союзников прозвали её «убийцей танков». Эта пушка стала одним из главных символов немецкой военной мощи.

