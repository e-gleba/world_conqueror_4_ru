operation_rule_1=1. Планируйте время — награды привязаны к этапам.
operation_rule_2=2. Два режима: Норма и Натиск. Натиск открывается после прохождения Нормы.
operation_rule_3=3. В Натиске враг получает 2 случайных усиления (действуют до конца события). Планируйте маршрут наступления с учётом баффов.
operation_rule_4=4. На любой сложности: если отряд командира уничтожен на этапе — он выбывает из кампании до сброса прогресса.
operation_rule_5=5. Сохраняется лучший результат. За ключевые этапы — отдельные награды.
operation_rule_6=6. Поэтапные награды: ленты и фрагменты элитных войск. Количество случайное.
operation_rule_7_1=7. Сброс откатывает прогресс текущей сложности и поэтапные награды. Первый сброс за событие — бесплатно. За медали — ещё один сброс (лимит 1, общий для Нормы и Натиска).
operation_rule_7=7. Сброс откатывает только прогресс текущей сложности.

defensive_rule_1=1. Планируйте время — награды привязаны к этапам.
defensive_rule_2=2. Два режима: Норма и Натиск. Натиск открывается после прохождения Нормы.
defensive_rule_3=3. В Натиске враг получает 2 случайных усиления (действуют до конца события). Стройте оборону с учётом баффов.
defensive_rule_4=4. Фиксируется рекорд удержания (в ходах) вне зависимости от исхода. Награды — за достижение порогов. Уничтожение всех сил врага открывает все награды этапа.
defensive_rule_5=5. Условие победы: удержать все ключевые точки. Переигрывать можно, но при досрочном выходе рекорд не сохранится.
defensive_rule_6=6. Поэтапные награды: ленты и фрагменты элитных войск. Количество случайное.


