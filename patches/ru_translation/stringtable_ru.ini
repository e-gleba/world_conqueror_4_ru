help_conquest_desc_6=В режиме испытаний Завоевания командиры могут прокачивать ветку технологий своей страны. Для разблокировки передовых национальных технологий необходимо набрать нужное количество очков исследований. Начальный уровень технологий и их максимальный предел зависят от выбранной вами страны.
help_conquest_desc_7=В режиме испытаний Завоевания доступна Дипломатия. Вы можете объявлять войну нейтральным странам или своим бывшим союзникам, а также принуждать враждебные государства к капитуляции. На лояльность страны напрямую влияет потеря ею городов и армий по сравнению со стартовыми показателями. Шанс успешного принуждения к капитуляции зависит от соотношения ваших сил к силам противника, количества захваченных у него городов и его текущего уровня лояльности. Принудить страну к сдаче можно только в том случае, если вы имеете с ней общую сухопутную границу на протяжении как минимум 20 ходов.
help_conquest_desc_8=В режиме испытаний Завоевания периодически происходят исторические события. Они могут оказывать как сильное положительное, так и отрицательное влияние на экономику и боеспособность конкретных стран.

induce_info_1=Эту страну невозможно принудить к капитуляции.
induce_info_2=Чтобы принудить эту страну к капитуляции, вы должны иметь с ней общую границу.
induce_info_3=Принуждение к капитуляции провалилось.

