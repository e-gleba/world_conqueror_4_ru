synergy_tactics_1_1=• Все отряды «Дивизии-призрака» получают +3 к мобильности.
synergy_tactics_1_2=• Совместное наступление: за каждый союзный отряд «Дивизии-призрака» в радиусе 2 клеток бронетехника наносит на 2% больше урона при атаке.
synergy_tactics_1_3=• Преследование бегущего врага: если в этом ходу соседний союзный отряд «Дивизии-призрака» уничтожил врага, пехота может двигаться снова (срабатывает 1 раз за ход).
synergy_tactics_1_4=• Передовое целеуказание: если рядом находится союзная пехота «Дивизии-призрака», артиллерия наносит на +10% больше урона.
synergy_tactics_2_1=• Все отряды «Острия копья» получают +10 к атаке.
synergy_tactics_2_2=• Координация пехоты и танков: если рядом находится союзная пехота «Острия копья», бронетехника получает +20% к критическому урону.
synergy_tactics_2_3=• Маневры роем: за каждый союзный отряд «Острия копья» в радиусе 2 клеток мобильность пехоты увеличивается на +2.
synergy_tactics_2_4=• Поддержка оборонительных позиций: если рядом находится союзный отряд «Острия копья», артиллерия получает на -15% меньше урона.
synergy_tactics_3_1=• Все сухопутные отряды «Таманской дивизии» получают 10% шанс на уклонение (игнорируется авиаударами).
synergy_tactics_3_2=• Амфибийные операции: если сухопутный отряд «Таманской дивизии» находится в радиусе 2 клеток от союзного корабля, он игнорирует штраф к мобильности при посадке в воду и получает +2 к мобильности.
synergy_tactics_3_3=• Корректировка огня: за каждый союзный отряд «Таманской дивизии» в радиусе 2 клеток шанс критического удара артиллерии увеличивается на +4%.
synergy_tactics_3_4=• Огневая поддержка: если рядом находится союзный отряд «Таманской дивизии», дальность стрельбы пехоты увеличивается на +1, но урон на максимальной дистанции снижается на -15%.

