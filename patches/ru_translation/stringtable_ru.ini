elite_intro_96=Leopard 2 — основной боевой танк третьего поколения, разработанный в Германии. Он славится своей сбалансированной конструкцией, высочайшей надежностью и широким применением по всему миру. Его культовая 120-мм гладкоствольная пушка обладает превосходной скорострельностью и точностью. Она способна вести огонь различными типами бронебойных снарядов, обеспечивая сокрушительную огневую мощь на дальних дистанциях.

