synergy_tactics_7_1=• Все подразделения дивизии «Гроссдойчланд» получают +2 к атаке за каждого противника в радиусе 2 клеток (не более +20).
synergy_tactics_7_2=• Элитный гарнизон: если пехота «Гроссдойчланд» находится в 1 клетке от артиллерии или бронетехники той же дивизии, в конце хода все подразделения дивизии в радиусе 1 клетки получают усиление «Гарнизон» на 1 ход. (Гарнизон: за каждое союзное подразделение в радиусе 1 клетки — защита +3, урон контратаки +3%)
synergy_tactics_7_3=• Бронетанковый прорыв: если бронетехника «Гроссдойчланд» стоит в 1 клетке от пехоты той же дивизии и после атаки в радиусе 2 клеток не осталось противника, все подразделения дивизии в радиусе 2 клеток получают +5 к подвижности на этот ход. (Не суммируется)
synergy_tactics_7_4=• Огневое оглушение: если артиллерия «Гроссдойчланд» находится в 2 клетках от бронетехники той же дивизии, любая атака этой артиллерии накладывает на цель «Оглушение» на 1 ход. (Оглушение: подвижность −3 на текущий ход, суммируется до трёх раз)
synergy_tactics_8_1=• В начале хода каждое подразделение 4-й гвардейской танковой дивизии получает +2 к подвижности за каждое другое подразделение той же дивизии в радиусе 1 клетки (не более +6).
synergy_tactics_8_2=• Огневая разведка: когда пехота 4-й гвардейской танковой дивизии атакует, бронетехника той же дивизии в радиусе 2 клеток получает усиление «Огневая подготовка» на 1 ход. (Огневая подготовка: урон следующей атаки +40%, после применения сразу исчезает.)
synergy_tactics_8_3=• Прорыв и сбор: когда бронетехника 4-й гвардейской танковой дивизии уничтожает противника, все подразделения дивизии в радиусе 2 клеток получают усиление «Сбор» на 1 ход. (Сбор: 30% получаемого урона распределяется на соседние подразделения дивизии. Невосприимчиво к «Отклонению снарядов».)
synergy_tactics_8_4=• Артиллерийская подготовка: после атаки артиллерии 4-й гвардейской танковой дивизии все противники в радиусе 1 клетки от цели получают статус «Дезорганизация» на 1 ход. (Дезорганизация: при атаке этих целей пехотой или танками дивизии их боевой дух снижается на 1 уровень. Срабатывает единожды и не может быть наложено повторно в тот же ход.)
legend_chapter_7=Дивизия «Гроссдойчланд»
legend_chapter_8=4-я гвардейская танковая дивизия
legend_army_7=Дивизия «Гроссдойчланд»
legend_army_8=4-я гвардейская танковая дивизия
dialogue_4382=Преследовать отходящего противника и стремительно прорвать его порядки. Как можно скорее завершить окружение Москвы!
dialogue_4383=Держать строй и организованно отходить. Подставить врагу спину — самоубийство!
dialogue_4384=Собрать войска и выстроить оборону по Туле. Задача одна: не дать противнику пройти восточнее Тулы!
dialogue_4385=Товарищ Ерёменко, вы отлично справились с отводом войск. Принимайте командование рубежом — не пропустить противника.
dialogue_4386=Задача будет выполнена!
dialogue_4387=Держаться, товарищи! Каждый день, что стоит Тула, даёт Москве ещё один день на подготовку контрнаступления!
dialogue_4388=Срочно усилить тульский рубеж! Сдержать противника и выиграть время для контрнаступления!
dialogue_4389=Продолжать наступление на восток и сокрушить их оборону!
dialogue_4390=Ввести в бой 10-ю армию для усиления Тулы. Не допустить выхода противника к южному обводу обороны Москвы.
dialogue_4391=Бойцы, рвите их порядки и окружайте Тулу!
dialogue_4392=Товарищи, мы должны перерезать немецкие подкрепления западнее Харькова. Нельзя допустить, чтобы братья со Степного фронта несли излишнее давление!
dialogue_4393=Товарищи, задача трудна, но слава ещё выше! Уничтожить армейскую группу Кемпфа и освободить Харьков!
dialogue_4394=Передовые части делают всё возможное для удержания рубежа. Я дам знать в тыл — подкрепления скоро прибудут.
dialogue_4395=Продолжать удар на юг и перерезать магистраль Полтава — Харьков. Лишившись подвоза, харьковский гарнизон неизбежно рухнет!
dialogue_4396=Ввести резервы! Нельзя допустить перерезания наших коммуникаций; движение в районе Харькова должно оставаться свободным!
dialogue_4397=Белгород успешно отбит! Скорее зачистить остатки оборонявшихся и готовиться к наступлению на Харьков!
dialogue_4398=Телеграмма Ставки: Белгород пал. Всем частям гарнизона — стремительно отходить к Харькову.
dialogue_4399=Немецкие силы выбиты, Харьков вновь в руках его жителей!
dialogue_4400=Мы проиграли это сражение. Отвести рубежи, собрать силы и готовиться к оставлению Харьковского района.
dialogue_4401=Наша элитная танковая дивизия на позиции. Готовиться к контрнаступлению и срезать вражеский выступ!
dialogue_4402=Ржевский выступ давно угрожает Москве; эта операция должна покончить с ним раз и навсегда.
dialogue_4403=Противник подтянул новые войска. Запрошу у тылового командования дополнительную поддержку. Продолжать оборону по установленному рубежу. Мы непременно устоим.
dialogue_4404=Я привёл элитные части с других театров. На этот раз мы должны уничтожить 9-ю армию!
dialogue_4405=Воистину грозный противник. Продолжать натиск! Припасы врага ограничены — долго столь ожесточённой обороны им не выдержать.
dialogue_4406=Резервы — вперёд, быстро закрыть брешь! Нас мало — нельзя позволить им беспрепятственно растягивать фронт!
dialogue_4407=Штурмовые части рвутся вперёд, безжалостно расширяя эту рану!
dialogue_4408=Наращивать натиск, чтобы противник не мог снимать войска для обороны!
dialogue_4409=Отвести рубеж и обеспечить пути отхода. Не дать противнику окружить нас.
dialogue_4410=Настал момент сокрушить оборону на Днепре! Вперёд — отбросить их за реку!
dialogue_4411=Боевые порядки Советской армии непрерывно растягиваются, в них неизбежно появятся разрывы. Настало время контрудара!
dialogue_4412=Стремительно вырваться и отходить к Харькову, собрать силы для отражения вражеского контрнаступления.
dialogue_4413=Богодухов вновь под нашим контролем. Продолжать наступление и преследовать отходящего противника!
dialogue_4414=Гарнизон Харькова отходит за реку. Оставшимся частям — держать оборону. Строй не нарушать, ни шагу назад!
dialogue_4415=Из-за самонадеянности противника мы вернули город и не вправе повторить его ошибку. Продолжать наступление и уничтожить как можно больше вражеских сил!
dialogue_4416=Отличные вести! Наконец-то я перехватил инициативу в Харьковском районе.
dialogue_4417=Прежнее чрезмерное продвижение сильно подорвало боеспособность наших войск. Необходимо собрать силы и подготовиться к следующей операции.
dialogue_4418=Вашей части поручено наступать прямо на Курск. Оборона противника хорошо укреплена — готовьтесь к ожесточённому наступлению.
dialogue_4419=Сначала пехотными рубежами истощить боеспособность противника. Затем, когда враг выдохнется, ввести бронетанковые силы и добить его.
dialogue_4420=Советские бронетанковые силы пока не обнаружены. Сохранять бдительность на случай внезапного удара.
dialogue_4421=Враг выдыхается. Немедленно ввести бронетанковые части и уничтожить вражеские танки!
dialogue_4422=Отправить телеграмму в штаб армии: при нынешней численности выполнить поставленные задачи будет трудно. Нужны подкрепления!
dialogue_4423=Им не переправиться. Ввести резервы! Держать их на том берегу!
dialogue_4424=В районе Прохоровки появилось множество вражеских танков, а дополнительных частей для поддержки выделить нельзя. Остаётся лишь действовать с предельной осторожностью.
dialogue_4425=Вас понял! Приложим все силы для выполнения задачи!
dialogue_4426=В атаку! Взять Полтаву и отбросить немецкие силы за реку!
dialogue_4427=Полтава — последний ключевой опорный пункт перед Кременчугом. Поэтому мы должны максимально использовать её для сдерживания вражеского наступления.
dialogue_4428=Стремительно отходить к Кременчугу; всей армии — занять оборону западнее реки, используя её как рубеж.
dialogue_4429=Преследовать отходящего противника; затем наступать на Кременчуг!
dialogue_4430=Полтава под угрозой окружения. Немедленно оставить Полтаву и отойти на противоположный берег.
dialogue_4431=Довести до передовых частей: нанести стремительный удар по Кременчугу и попытаться отрезать противнику пути отхода.
dialogue_4432=Ваша важнейшая задача — оборонять Кременчуг и уйти последними. Сумеете выполнить задачу?
dialogue_4433=Задача будет выполнена!
dialogue_4434=Товарищи! Соотечественники! Вчера немецкая армия чинила несправедливые зверства на нашей земле; сегодня мы воздадим им железом и кровью!
dialogue_4435=Нельзя допустить, чтобы враг занял нашу славную Пруссию! Солдаты, за родину — сражаться до последнего вздоха!
dialogue_4436=Быстро отходить к следующему опорному пункту! Только оставшись в живых, мы сможем и дальше сдерживать врага!
dialogue_4437=Оставить часть сил для закрепления в городе и освобождения концлагерей. Главные силы продолжают наступление!
dialogue_4438=Братья по оружию, сражаясь рядом с вами до конца, я умираю без сожалений. Держите рубеж — за дом, за страну!
dialogue_4439=Связаться с соседними частями и запросить их поддержку в наступлении. Нельзя позволить врагу встать на пути окончания войны!
dialogue_4440=Черняховский пал в бою. Действия 3-го Белорусского фронта приостановлены до вступления в командование нового командующего.
dialogue_4441=Принимаю командование на себя. Все разведданные докладывать мне, прежний план остаётся в силе.
dialogue_4442=Товарищи! Прежнее поражение ничего не значит. Теперь мы должны вернуть утраченную славу и позиции. Вперёд! Отбить Житомир!
dialogue_4443=Стремительно стабилизировать фронт. Нельзя допустить, чтобы враг вновь сокрушил с таким трудом созданную оборону.
dialogue_4444=Быстро отойти, кратко перегруппироваться и подготовить контрудар по острию советского наступления.
dialogue_4445=Продолжать наступление; ни при каких обстоятельствах не дать врагу вновь захватить Киев!
dialogue_4446=Угрозы южнее Киева нейтрализованы. Продолжать движение на юг, чтобы создать достаточно широкую буферную зону.
dialogue_4447=Нельзя допустить дальнейшего расширения зоны контроля противника: слишком велик риск окружения. Немедленно ввести резервы и всеми силами перехватить вражеские части.
dialogue_4448=Штурмовые части выдвинулись навстречу их передовым элементам и сдерживают продвижение.
dialogue_4449=Начать наступление и стремительно перерезать железную дорогу Львов — Одесса. Лишь перерезав её, можно изолировать и окружить противника.
dialogue_4450=Удержать железную дорогу во что бы то ни стало. Западную Украину уже не отстоять. Как только я уговорю его отойти, мы сможем отступить этим путём.
dialogue_4451=Как можно дольше не давать противнику перерезать дорогу Тернополь — Проскуров. Пока линия цела, у нас остаётся возможность быстрой переброски войск!
dialogue_4452=Нанести удар по Тернополю и постараться застать противника врасплох!
dialogue_4453=Крупный город-крепость ещё не пал — надежда есть! Поднять резервы, отбить городки вдоль линии и восстановить железную дорогу.
dialogue_4454=Отлично! Теперь враг не сможет использовать эту дорогу для переброски сил. Скорее взять оба крупных города и окончательно сокрушить их надежды.
dialogue_4455=Чёрт бы всё побрал! 1-я танковая армия уже не может отойти с этой позиции. Сдерживать врага любой ценой и выиграть время для эвакуации.
dialogue_4456=Зачистить остатки оборонявшихся и не дать противнику вернуть позиции. Тем временем наш авангард продолжает наступление. Окружить и уничтожить 1-ю танковую армию!
dialogue_4457=Этим наступлением мы освободим Польшу и расчистим путь на Берлин. Пусть военный преступник испытает мощь нашей армии!
dialogue_4458=По мере наступления мы будем освобождать южную Польшу, особенно Силезский промышленный район, чьё освобождение подорвёт промышленную мощь Германии.
dialogue_4459=Продолжать наступление, взять Катовице и овладеть всей Верхней Силезией!
dialogue_4460=Варшава освобождена, польский народ наконец может вернуться в свою столицу!
dialogue_4461=Стремительно отойти и вновь выстроить оборону вдоль гор. Использовать горную местность, чтобы как можно дольше сдерживать врага.
dialogue_4462=Попытаться ворваться в Нижнюю Силезию; если не удастся — блокировать их на горном перевале. Главные силы продолжили наступление на Берлин, однако ключевой целью остаётся Верхняя Силезия.
dialogue_4463=Когда советские войска полностью овладели Верхнесилезским промышленным районом, промышленная мощь Германии была серьёзно подорвана.
dialogue_4464=Немецкая армия на грани краха. В атаку! Взять Берлин! Уничтожить фашизм!
dialogue_4465=Я сделаю всё возможное, чтобы остановить продвижение советских войск, исполняя солдатский долг.
dialogue_4466=А как же Штайнер? Почему он не идёт на помощь? Берлин долго не продержится!
dialogue_4467=Господин рейхсканцлер, армейская группа Штайнера не выходит на связь.
dialogue_4468=Чёрт!
dialogue_4469=Советская армия успешно соединилась с американской на реке Эльбе. У оборонявших Берлин не осталось пространства для манёвра.
dialogue_4470=Война окончена. От имени берлинского гарнизона заявляю о безоговорочной капитуляции.
dialogue_4471=Берлин освобождён! Передать приказ о капитуляции и зачистить остатки сопротивления.
dialogue_4472=Группа армий «Центр», закрепившаяся в южном районе, сдаваться не намерена; напротив, она рассчитывает опереться на Чехословакию и продолжать упорное сопротивление.
dialogue_4473=Товарищи, мы должны стремительно освободить Прагу; восставшие ждут нашей поддержки!
dialogue_4474=Товарищи, перевалив через эти горы, мы сокрушим последнее фашистское сопротивление в этом сражении.
dialogue_4475=Пражский гарнизон должен как можно скорее подавить восстание, чтобы оно не сказалось на фронте.
dialogue_4476=Скорее мобилизовать ресурсы Праги для поддержки фронта. Они слишком долго нас задерживают — сначала конфисковать их имущество для пополнения военных запасов!
dialogue_4477=Мы всё ещё движемся слишком медленно. Взять Прагу и отомстить за павших товарищей!
dialogue_4478=Товарищи пражане, с этого дня наш город вновь принадлежит своему народу!
dialogue_4479=Теперь, когда Прага пала, сколько мы ещё продержимся с оставшимися городками?
dialogue_4480=Граждане, хотя вы и претерпели жестокие гонения, все ваши жертвы в конечном счёте обеспечили освобождение Праги!
dialogue_4481=Если бы не эта толпа, мы, возможно, сумели бы сдержать их севернее гор. Но теперь любые слова напрасны.
army_buff_desc_1691=Укрепление: за каждое дружественное подразделение в радиусе 1 клетки защита повышается на 3, урон от контратаки — на 3%.
army_buff_desc_1701=Оглушение: -%d мобильности в этом раунде.
army_buff_desc_1711=Огневая подготовка: следующая атака наносит на 40% больше урона, после чего эффект прекращается.
army_buff_desc_1721=Сплочение: распределяет 30% получаемого урона на соседние подразделения 4-й гвардейской танковой дивизии. Не может быть целью «Баллистического отклонения».
army_buff_desc_1731=Дезорганизация: при атаке пехотных или бронетанковых частей 4-й гвардейской танковой дивизии теряет 1 уровень боевого духа. Эффект срабатывает один раз и не может быть наложен повторно в течение этого хода.
legend_stage_70101=Битва за Тулу
legend_stage_70102=Операция «Марс»
legend_stage_70103=Битва на Донце
legend_stage_70104=Битва на Курской дуге
legend_stage_70105=Полтавско-Кременчугская оборонительная операция
legend_stage_70106=Восточно-Прусская наступательная операция
legend_stage_80101=Операция «Румянцев»
legend_stage_80102=Житомирско-Бердичевская наступательная операция
legend_stage_80103=Проскуровско-Черновицкая наступательная операция
legend_stage_80104=Висло-Одерская наступательная операция
