feat_desc_98=Отряд переходит в состояние Маскировки: он не может быть атакован силами сухопутных войск и флота. Перезарядка: 2 хода. Находясь в маскировке, мобильность увеличивается на {1}, эффект длится 1 ход. Любая атака немедленно снимает маскировку.
feat_desc_99=Ваша атака не вызывает ответного огня. Урон по вражеским войскам увеличивается на {1}% (в состоянии маскировки урон увеличивается на {2}%). Урон по зданиям снижен на 50%.
feat_desc_100=Запрашивает воздушную эвакуацию: вертолет перебрасывает ваш отряд в любую свободную точку в радиусе 5 клеток. Перезарядка: 2 хода.
feat_desc_100_Lv2=Запрашивает воздушную эвакуацию: вертолет перебрасывает ваш отряд в любую свободную точку в радиусе 9 клеток. Перезарядка: 2 хода.
feat_desc_101=Если отряд потерял более половины прочности (ОЗ), на следующем ходу он восстанавливает {1}% от своего максимального запаса ОЗ.
feat_desc_102=При атаке в текущем ходу: шанс критического удара +{1}%, атака игнорирует {2}% брони цели. Перезарядка: 2 хода.
feat_desc_103=Повышает показатель защиты на {1}%.
feat_desc_104=Иммунитет к ответному огню от зенитных орудий (ПВО не достает до высоты бомбометания).
feat_desc_105=Каждая атака наносит дополнительный урон по площади ({1}%) вокруг основной цели.
feat_desc_106=Урон от применения ядерного оружия увеличен на {1}%.
feat_desc_107=При атаке в текущем ходу: наносит {1}% дополнительного урона всем целям в радиусе 1 клетки от основной цели. Перезарядка: 2 хода.
feat_desc_108=Отряд способен атаковать сразу несколько вражеских целей. Урон по танкам и артиллерии увеличен на {1}%.
feat_desc_109=Снимает большинство положительных эффектов (баффов) со всех вражеских отрядов в радиусе 1 клетки. Перезарядка: 3 хода.
feat_desc_109_Lv2=Снимает большинство положительных эффектов (баффов) со всех вражеских отрядов в радиусе 2 клеток. Перезарядка: 2 хода.

army_buff_desc_1351=Маскировка: мобильность +2. Невозможно атаковать силами сухопутных войск или флота.
army_buff_desc_1352=Маскировка: мобильность +4. Невозможно атаковать силами сухопутных войск или флота.
army_buff_desc_1353=Маскировка: мобильность +6. Невозможно атаковать силами сухопутных войск или флота.
army_buff_desc_1361=Снаряды с обедненным ураном: шанс критического удара +20%, атака игнорирует 30% брони цели.
army_buff_desc_1362=Снаряды с обедненным ураном: шанс критического удара +30%, атака игнорирует 45% брони цели.
army_buff_desc_1363=Снаряды с обедненным ураном: шанс критического удара +40%, атака игнорирует 60% брони цели.
army_buff_desc_1371=Hellfire: наносит дополнительный урон (25%) всем целям в радиусе 1 клетки от основной.
army_buff_desc_1372=Hellfire: наносит дополнительный урон (50%) всем целям в радиусе 1 клетки от основной.
army_buff_desc_1373=Hellfire: наносит дополнительный урон (80%) всем целям в радиусе 1 клетки от основной.
army_buff_desc_1381=Замыкание (Шок): снижает мобильность на 30% (эффекты не суммируются).
army_buff_desc_1382=Замыкание (Шок): снижает мобильность на 40% (эффекты не суммируются).
army_buff_desc_1383=Замыкание (Шок): снижает мобильность на 50% (эффекты не суммируются).
army_buff_desc_1384=Замыкание (Шок): снижает мобильность на 60% (эффекты не суммируются).
army_buff_desc_1385=Замыкание (Шок): снижает мобильность на 70% (эффекты не суммируются).

