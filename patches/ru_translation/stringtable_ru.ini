glory_challenge_desc_11301=Гудериан (должен быть генералом игрока), командуя «Королевским тигром», уничтожил 100 врагов.
glory_challenge_desc_11302=Маннергейм (должен быть генералом игрока), командуя «Ястребиным глазом», уничтожил 100 врагов.
