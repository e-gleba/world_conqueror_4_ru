skill_info_156=При командовании бронетехникой: уничтожив врага, генерал получает статус «Герой», который увеличивает шанс критического удара на 10%% на 1 ход.
skill_info_157=При командовании бронетехникой: урон по любым целям (кроме зданий и городских гарнизонов) увеличен на +20%. Если после атаки отряд лишен возможности двигаться или атаковать, есть [#00FF00#%d%%] шанс получить возможность повторной атаки (срабатывает 1 раз за раунд). Каждое убийство в этом ходу увеличивает этот шанс на 20%% (максимум до 100%%), улучшая эффект до полноценного дополнительного действия.
skill_info_158=После атаки наземного отряда под вашим командованием есть [#00FF00#%d%%] шанс наложить статус «Координация» на себя и союзников в радиусе 1 клетки на 1 раунд. Отряды с «Координацией» наносят на +15%% больше урона. Если отряд получает негативный эффект (кроме снижения боевого духа), этот эффект отменяется ценой снятия «Координации».
skill_info_159=Атака на собственной территории +15. Шанс получить критический урон от врага снижен на [#00FF00#%d%%].

