dialogue_3199=Мы обязаны захватить Данию и стратегически важные норвежские порты до того, как британцы успеют отреагировать.
dialogue_3600=Флот мобилизован. Порт должен быть под нашим контролем!
dialogue_3601=Дания капитулировала. Всем частям сохранять боевую готовность и продолжать наступление на Норвегию!
dialogue_3602=Нападение британцев не было случайностью.
dialogue_3603=Будьте начеку. Британцы не смирятся с тем, что незамерзающие порты достанутся нам.
dialogue_3604=Я сделал всё возможное для подготовки обороны. Надеюсь, мы выдержим этот удар.
dialogue_3605=Наш путь до Берлина короче! Честь взятия города будет принадлежать нам!
dialogue_3606=Самый короткий путь и самый жестокий бой. Мы можем стать первыми, кто войдет в Берлин!
dialogue_3607=Моя танковая дивизия расчистит северное направление для подхода основных сил.
dialogue_3608=Фронт рухнул. Теперь мой главный приоритет — спасти жизни солдат.
dialogue_3609=Защитникам Берлина: фюрер мертв. Прекратить огонь, хватит бессмысленных жертв!
dialogue_3610=Ваша задача — сопроводить эскадрилью полковника Дулиттла до точки взлета. Как только бомбардировщики поднимутся в воздух, флот должен немедленно отступить на полном ходу! Никаких боестолкновений с японцами! Не теряйте ни секунды!
dialogue_3611=Японцы обнаружили наш флот. Мы должны начать операцию раньше срока!
dialogue_3612=Эскадрилья Дулиттла в воздухе. Немедленно ложимся на обратный курс!
dialogue_3613=Приказ всем частям: прорвать вражескую оборону вглубь, сначала взять в кольцо Тунис, затем захватить Бизерту.
dialogue_3614=От имени Африканского корпуса я сдаюсь войскам союзников.
dialogue_3615=Дальнейшее сопротивление бессмысленно. От имени 1-й итальянской армии я принимаю вашу безоговорочную капитуляцию.
dialogue_3616=Нельзя позволить силам Оси закрепиться в Эгейском море. Спецназ должен высадиться на острова, уничтожить гарнизоны, наблюдательные пункты и радиостанции.
dialogue_3617=Союзники стягивают огромные силы к берегам Девона. Отправьте торпедные катера в обход патрулей Ла-Манша для проведения вооруженной разведки боем.
dialogue_3618=Освободить Борнео! Вернуть под наш контроль аэродромы и нефтяные месторождения!
dialogue_3619=Вице-адмирал Иноуэ, эти три авианосные ударные группы переходят под ваше командование для проведения операции «МО»! Десант должен высадиться в Порт-Морсби любой ценой!
dialogue_3620=Немедленно перебросить все доступные авианосцы (4 единицы) в Коралловое море! Японское наступление должно быть сорвано!
dialogue_3621=По данным воздушной разведки, японцы уже отправили главные ударные силы. Атакуйте и пустите их на дно в проливе Джомард!
dialogue_3622=Я прикрою «Сёкаку» и «Дзуйкаку». Мы раздавим этих захватчиков!
dialogue_3623=Приказ группе армий «Б»: имитировать главный удар через Нидерланды, чтобы выманить основные британо-французские силы на север, в Бельгию. Это откроет коридор для решающего удара группы армий «А»!
dialogue_3624=Приказ группе армий «А»: Арденны — главная ось наступления. Выйти к побережью Фландрии, замкнуть котел и уничтожить главные силы союзников!
dialogue_3625=Выйти к реке Маас на третий день и форсировать её с ходу на следующий!
dialogue_3626=Войскам Северного фронта: немедленно выдвигаться в Бельгию и занять рубежи обороны. Немцы не должны прорваться ни при каких обстоятельствах!
dialogue_3627=По приказу маршала Петена Франция подписала перемирие с Германией. Всем частям сохранить текущую структуру и организованно отойти в назначенные зоны.
dialogue_3628=Я отправляюсь в Лондон, чтобы возглавить французский народ и продолжить борьбу!
dialogue_3629=Товарищи! Используем Изюм-Барвенковский выступ как плацдарм для наступления и освободим Харьков!
dialogue_3630=Внимание, группе армий «Юг»: советские войска стягивают огромные резервы под Харьков. Наступление неизбежно.
dialogue_3631=Нанести удар по Изюму. Координировать действия с 1-й танковой армией для ликвидации Изюмского выступа!
dialogue_3632=
dialogue_3633=7-я бронетанковая бригада наступает через пустыню на фланге. 22-я гвардейская бригада штурмует перевал Хальфайя и форт Капуццо. Береговая колонна захватывает Эс-Саллум.
dialogue_3634=Я немедленно переброшу войска из Тобрука вам на помощь!
dialogue_3635=Отбейте форт Капуццо и перевал Хальфайя! Мы должны обезопасить тылы наших осаждающих войск!
dialogue_3636=Войскам у Капуццо: отступайте к перевалу Хальфайя. Избегайте прямого столкновения с немецкими танками.
dialogue_3637=Приоритет ВДВ — захват целевого аэродрома. После этого немедленно организовать прием подкреплений и припасов по воздуху.
dialogue_3638=Королевский флот блокирует акваторию. Японские транспорты не должны подойти к берегу!
dialogue_3639=2-я бронетанковая дивизия наносит главный удар по Булони. 1-я и 10-я бронетанковые дивизии наступают по расходящимся направлениям для совместного штурма Кале!
dialogue_3640=Защитникам Кале: вы обязаны удерживать город 48 часов любой ценой! Каждый выигранный вами час спасает десятки тысяч жизней наших солдат при эвакуации!
dialogue_3641=Королевские ВВС подняты в воздух. Приоритетная цель — перехват пикировщиков Stuka для прикрытия отхода армии!
dialogue_3642=Группам армий «А» и «Б»: возобновить наступление! Немедленно замкнуть прибрежный котел, враг не должен уйти!
dialogue_3643=Бельгия капитулировала?! Проклятье! Срочно сократить линию обороны вдоль реки Лис и закрыть брешь на фланге!
dialogue_3644=Стремительный бросок на Дюнкерк! Не дайте им эвакуироваться!
dialogue_3645=Приказ 1-й французской армии: сжечь мосты, ни шагу назад!
dialogue_3646=Наше наступление не должно захлебнуться здесь!
dialogue_3647=Я обязан вырваться из этого котла, чтобы продолжить защищать нашу родину на других фронтах!
dialogue_3648=Нанесите внезапный удар по вражеским портам. Перережьте их морские линии снабжения и парализуйте логистику!

