skill_info_136=Конвертирует часть нанесенного урона в лечение. Сила лечения зависит от уровня Элитной артиллерии ([#00FF00#%d%%]). Критический урон Элитной артиллерии под вашим командованием увеличивается на 25%.
skill_info_137=После получения урона от вражеской атаки снижает весь получаемый урон на 10%. Эффект длится 1 ход и может суммироваться до 3 раз.
skill_info_138=При атаке есть шанс [#00FF00#%d%%] наложить на цель эффект «Провокация».
skill_info_139=При командовании бронетехникой на территории противника: шанс критического удара для вашего отряда и всех союзников в радиусе 1 клетки увеличивается на [#00FF00#%d%%].
skill_info_140=Если ваша атака снижает боевой дух цели, есть шанс [#00FF00#%d%%] атаковать её повторно. Если боевой дух цели падает до состояния «Хаос» (Паника), шанс повторной атаки равен 100% (не срабатывает на врагах, уже находящихся в Хаосе).
skill_info_141=При атаке морскими силами есть шанс 50% наложить на цель эффект «Шок» (замыкание), снижающий её мобильность на [#00FF00#%d%%] на 2 хода. При командовании авианосцем «Энтерпрайз»: стоимость всех самолетов (кроме истребителей) снижена на 1.
skill_info_142=Когда отряд успешно уклоняется от атаки, он восстанавливает [#00FF00#%d%%] от своего максимального запаса ОЗ (срабатывает не более 1 раза за ход).
skill_info_143=При командовании бронетехникой на своей или союзной территории получаемый урон снижается на [#00FF00#%d%%]. При получении урона от вражеских генералов возвращает 50% от нанесенного ими урона.
skill_info_144=При атаке есть шанс [#00FF00#%d%%] наложить метку наведения на основную цель и всех врагов в радиусе 1 клетки вокруг неё. Отряды с меткой наведения получают на 20% больше урона. Эффект длится 1 ход.

