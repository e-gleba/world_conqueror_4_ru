feat_desc_43_Lv2=После атаки можно совершить еще одно действие. Перезарядка: 1 ход. При уничтожении вражеского отряда вторым действием есть шанс {1}% атаковать еще раз (только один раз за ход).
feat_desc_47_Lv3=Восстанавливает {1} ед. ОЗ союзнику и накладывает на него эффект регенерации: дополнительно восстанавливает по 50 ОЗ в течение 2 ходов. При использовании навыка ваш отряд теряет {2} ед. ОЗ. Перезарядка: 1 ход.
feat_desc_50_Lv2=Урон по вторичным целям от сплеша не снижается. Критический урон увеличивается на {1}%.
feat_desc_51_Lv2=В следующей атаке дальность стрельбы увеличивается на +2. Атака наносит дополнительный урон городу/крепости в размере {1}% от максимального запаса прочности (не более 1200 ед.), а также снижает ОЗ гарнизона на {2}% (не более 500 ед.). Перезарядка: 2 хода.
feat_desc_57_Lv2=Перебрасывает союзный отряд (пехоту, бронеавтомобиль, полевую артиллерию или гаубицу) в выбранную точку. Во время транспортировки восстанавливается {1}% ОЗ отряда.
feat_desc_60_Lv2=Устанавливает контактную морскую мину в радиусе 2 клеток. Перезарядка: 1 ход.
feat_desc_61_Lv2=При следующей атаке наносит урон 1 дополнительной цели вокруг основной. Перезарядка: 2 хода.
feat_desc_62_Lv2=Погружает все вражеские отряды в радиусе 1 клетки в состояние «Хаос» на 1 ход. Перезарядка: 3 хода.
feat_desc_64=Избыточный шанс критического удара конвертируется в дополнительный урон: каждые {2}% шанса крита свыше ста дают +{1}% к урону.
feat_desc_65=Игнорирует {1}% брони/защиты врага.
feat_desc_66=Увеличивает урон по бронетехнике на {1}% в этой атаке. Перезарядка: 2 хода.
feat_desc_67=Урон от контратаки увеличен на {1}%.
feat_desc_68=Если враг был уничтожен в результате вашей атаки, есть {0}% шанс совершить еще одно действие. Максимум {2} раз(а) за ход.
feat_desc_69=Когда враг в радиусе 1 клетки от вас подвергается атаке союзника, есть {0}% шанс совершить совместную атаку поддержки.
feat_desc_69_Lv2=Когда враг в радиусе 1 клетки от вас подвергается атаке союзника, есть {0}% шанс совершить совместную атаку поддержки, при этом урон поддержки увеличивается на {1}%.
feat_desc_70=При атаке наносит {1}% дополнительного сплеш-урона соседним целям в радиусе 1 клетки от основной. Перезарядка: 2 хода.
feat_desc_71=Позволяет совершить до {1} дополнительных атак(и) за ход.
feat_desc_72=Позволяет вызывать с авианосца любые стандартные самолеты (лимит: {1} Очков Авиации).
feat_desc_72_Lv3=Позволяет вызывать с авианосца любые стандартные самолеты, кроме транспортных (лимит: {1} Очков Авиации).
feat_desc_73=Увеличивает базовый урон бронетехники на {1}%.

