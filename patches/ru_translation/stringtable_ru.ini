operation_stage_name_21016=Северное море
operation_stage_name_21017=Северная Европа

event_stage_intro_21001=Характер войны изменился. Советское наступление на Западном побережье успешно остановлено. Тактические возможности врага неуклонно снижаются из-за растянутых линий снабжения, однако их численное превосходство сохраняется. Мы должны опираться на укрепленные рубежи для организации эшелонированной обороны и защищать точки сбора резервов до начала нашего стратегического контрнаступления.
event_stage_intro_21002=Наши тайные агенты готовы к действиям. Ударная группа проведет высадку в Заливе Свиней и парализует сеть ПВО в регионе. Местное подполье поддержит нас изнутри. ЦРУ гарантирует, что операция пройдет безупречно.
event_stage_intro_21003=Ударная группировка советского Северного флота завершила блокаду акватории Нью-Йорка, но ситуацию еще можно спасти. Немедленно активируйте протоколы экстренной связи и начните уничтожение вражеских фортификаций. Свяжитесь с частями в других секторах, чтобы перегруппировать наступательные силы и прорвать советскую блокаду Восточного побережья.
event_stage_intro_21004=Прямое вторжение советской армии на нашу территорию было сорвано серией контрударов. Теперь враг сменил тактику, перенаправив удары на соседние страны. Хотя Европа уже перешла к обороне, советские войска успели молниеносно захватить Исландию. Их следующие цели — Гренландия и Канада.
event_stage_intro_21005=Канадские мятежники объединились с нашей внутренней оппозицией, захватив контроль над регионом Великих озер и начав наступление на восток. Пока мы перебрасывали войска для подавления бунта, советская армия воспользовалась нашей уязвимостью и провела новую высадку десанта. Разведка сообщает, что между мятежниками и Советами нет никакой координации. Мы обязаны использовать их стычки, чтобы быстро усилить наши части, подавить восстание и вышвырнуть захватчиков.
event_stage_intro_21006=Конфликт между Европой и СССР перерос в полномасштабную войну. Стремительный прорыв советского Северного флота застал нас врасплох. Даже наш главный союзник — Великобритания — сейчас страдает от оккупации части своих территорий. Европе срочно нужна наша помощь. Наши экспедиционные силы и транспортная авиация находятся в полной боевой готовности и ждут приказа на развертывание!
event_stage_intro_21007=Советская армия бросает в бой свои последние стратегические резервы, сражаясь как загнанный в угол зверь. В их системе фронтового командования видны явные трещины, а единство стран Варшавского договора не так прочно, как кажется. Мы должны собрать все доступные силы и начать генеральное наступление на восток, чтобы отбросить советские войска к их границам. Это идеальный шанс расширить наше влияние в Европе.
event_stage_intro_21011=Характер войны изменился. Советское наступление на Западном побережье успешно остановлено. Тактические возможности врага неуклонно снижаются из-за растянутых линий снабжения, однако их численное превосходство сохраняется. Мы должны опираться на укрепленные рубежи для организации эшелонированной обороны и защищать точки сбора резервов до начала нашего стратегического контрнаступления.
