cp_challenge_7_0=Одержите победу в режиме испытаний Завоевания 1950 года за страну с 1 звездой не более чем за [#00FF00#%d] ходов.
cp_challenge_7_1=Одержите победу в режиме испытаний Завоевания 1950 года за страну с 2 звездами не более чем за [#00FF00#%d] ходов.
cp_challenge_7_2=Одержите победу в режиме испытаний Завоевания 1950 года за страну с 3 звездами не более чем за [#00FF00#%d] ходов.
cp_challenge_7_5=Одержите победу в режиме испытаний Завоевания 1950 года, сыграв за [#00FF00#%d] разных стран.
cp_challenge_7_6=Одержите победу в режиме испытаний Завоевания 1950 года, удерживая под контролем не менее [#00FF00#%d] городов.
cp_challenge_7_7=Одержите победу в режиме испытаний Завоевания 1950 года, заключив союз с [#00FF00#%d] нейтральными странами.

elite_pass=Элитный пропуск
elitepass_not_started=Сезон Элитного пропуска еще не начался.
elitepass_rule=Правила Элитного пропуска
elitepass_rule_1=Сезон Элитного пропуска длится 28 дней. Премиум-пропуск и Ультимативный пропуск нельзя купить за 24 часа до завершения сезона.
elitepass_rule_2=Помимо фиксированного ежедневного задания за вход в игру, вам будут доступны 2 случайных задания. Вы можете бесплатно обновлять список заданий до 3 раз в день.
elitepass_rule_3=Если вы не забрали свои награды в прошлом сезоне, они будут автоматически начислены вам при первом входе в меню нового сезона Элитного пропуска.
elitepass_rule_4=Очки и неиспользованные купоны от Премиум/Ультимативного пропуска переносятся на следующие сезоны.
elitepass_rule_5=Статистика для элитных заданий (например, прохождение этапов) начинает учитываться только с момента старта текущего сезона.
elitepass_rule_6=После разблокировки всех наград Элитного пропуска вы будете получать бонусный сундук за каждые 60 заработанных очков.
