legend_intro_70101=Дивизия «Великая Германия» возникла вместе с подъёмом Третьего рейха и в конечном счёте разделила его конец. Её истоки восходят к 1939 году, когда Берлинский караульный полк был преобразован в пехотную дивизию «Великая Германия». В составе полка соединение участвовало во Французской кампании и операции «Барбаросса». Во время битвы за Тулу ещё не развёрнутый в дивизию пехотный полк «Великая Германия» действовал в составе 2-й танковой группы, в течение месяца осаждая Тулу. В условиях усиливавшихся метелей и решительного советского сопротивления наступление в итоге застопорилось, и полк был вынужден отступить в ходе советского контрнаступления. Этот бой стал для полка последним перед переформированием в дивизию, закрепив за ним прозвище «Пожарная команда Восточного фронта».
legend_intro_70102=В начале августа 1942 года для укрепления непрочного Ржевского фронта моторизованная дивизия «Великая Германия» была срочно снята с операции «Блау» и передана в резерв 9-й армии Моделя. К этому времени советские войска на участке перешли от обороны к наступлению — Жуков планировал масштабную операцию «Марс», намереваясь одним ударом уничтожить 9-ю армию и ликвидировать Ржевский выступ. В ходе ожесточённой обороны долины реки Лучесы дивизия «Великая Германия» выдержала многократные атаки крупных советских соединений. Несмотря на чудовищный уровень потерь, достигавший 90%, она удержала позиции, упрочив свою репутацию «Пожарной команды Восточного фронта».
legend_intro_70103=Победа под Сталинградом ознаменовала переход Красной армии к полномасштабному стратегическому контрнаступлению, что резко обострило кризис на южном фланге германского фронта. Моторизованная дивизия «Великая Германия», едва пережив боевое крещение в операции «Марс» под Ржевом, без передышки получила приказ выдвигаться на юг. К февралю 1943 года безостановочное стремительное наступление советских войск начало вскрывать их фатальную слабость — растянутые пути снабжения и невозможность устойчивого тылового обеспечения. Манштейн зорко уловил этот момент и решительно нанёс контрудар под Харьковом. В этой кампании «Великая Германия», действуя как главный таран наряду с танковым корпусом СС, не только помогла вернуть Харьков, но и во взаимодействии с другими частями отбила Белгород. Эта победа вписала ещё одну славную страницу в легенду «Пожарной команды Восточного фронта».
legend_intro_70104=После успеха харьковского контрнаступления южный фронт замер в неустойчивом равновесии. Воодушевлённые победой, немцы планировали перехватить инициативу, ликвидировав Курский выступ. 5 июля 1943 года началась операция «Цитадель». Танково-гренадерская дивизия «Великая Германия», в июне переименованная из моторизованной, наступала на Курск в составе XLVIII танкового корпуса. Преодолевая последовательные советские оборонительные рубежи, дивизия непрерывно прорывалась вперёд. Однако задержка начала операции дала советским войскам достаточно времени на подготовку обороны внутри выступа. Скованная последовательными ударами элитных советских частей, дивизия так и не смогла соединиться с частями, наступавшими с северного фаса, из-за чего операция «Цитадель» завершилась провалом.
legend_intro_70105=Провал Курской битвы окончательно лишил вермахт стратегической инициативы, после чего на всём фронте развернулось сокрушительное советское наступление. В конце августа 1943 года дивизия «Великая Германия» была спешно брошена на оборону полтавского рубежа в попытке остановить советское продвижение к Днепру. Однако стремительно ухудшавшаяся обстановка заставила дивизию вскоре перейти от обороны к прикрытию, обеспечивая отход главных сил на западный берег Днепра. После падения ключевого опорного пункта Полтавы немецкие главные силы были вынуждены ускорить отход на запад, а «Великая Германия» получила беспощадный приказ: удерживать Кременчуг до последнего человека, чтобы соседние части успели отойти за Днепр. Вновь эта элитная часть, именуемая «Пожарной командой Восточного фронта», в отчаянном положении проявила поразительную тактическую стойкость, упорно исполняя роль арьергарда. Однако перед пожаром, охватившим весь фронт — пожаром, во многом ею же и разожжённым, — усилия одной «пожарной команды» были каплей в море.
legend_intro_70106=Когда антифашистская война полностью перешла в стадию стратегического контрнаступления, дивизия «Великая Германия», как и государство, которому она служила, скатывалась в бездну гибели. В январе 1945 года в ледяных пустошах Восточной Пруссии эта элитная часть, некогда именуемая «Пожарной командой Восточного фронта», приняла свой последний бой. К этому моменту советские войска, движимые яростной волей к возмездию, катились вперёд всесокрушающим валом, безжалостно сметая наспех возведённую немецкую оборону. Как ни отчаянно сопротивлялась «Великая Германия», ведя сдерживающие бои на каждом шагу, всё тактическое мастерство и боевой дух оказались бессильны перед абсолютным неравенством сил. Дивизию неумолимо отжимали на запад, пока она не оказалась зажатой в кёнигсбергском котле, где с трудом держалась в окружении. В конце концов соединение, поднявшееся вместе с рейхом, обратилось в прах в руинах истории, погребённое вместе с тем преступным государством, которому служило.
legend_intro_80101=4-я гвардейская танковая дивизия ведёт свою историю от заслуженного 4-го гвардейского танкового корпуса времён Второй мировой войны. В августе 1943 года корпус был передан Воронежскому фронту и брошен в стратегическое контрнаступление, развернувшееся после победы под Курском. В ходе операции «Румянцев» 4-й гвардейский танковый корпус действовал во взаимодействии с 27-й армией. Части корпуса последовательно прорвали тщательно подготовленную оборону немецкого XLVIII танкового корпуса, обеспечив фланг главных сил, штурмовавших Белгород. Их яростный натиск создал прямую угрозу важнейшей магистрали Полтава — Харьков, вынудив немецкое командование срочно бросить в бой элитные соединения, включая дивизии «Великая Германия» и «Дас Райх», в отчаянной попытке затупить остриё советского наступления. Эта кампания в полной мере продемонстрировала сокрушительную ударную мощь и оперативную стойкость 4-го гвардейского танкового корпуса.
legend_intro_80102=Провал под Курском вынудил немцев к общему отходу, а советские войска, развивая успех, преследовали их до самого днепровского рубежа. Пытаясь переломить ход войны, Манштейн нанёс контрнаступление, которое не только временно сдержало советский порыв, но даже ставило целью вернуть Киев. Чтобы сорвать этот замысел, советское командование стремительно начало Житомирско-Бердичевскую наступательную операцию. В декабре 1943 года 4-й гвардейский танковый корпус, действуя в составе 3-й гвардейской танковой армии, совместно с соседними частями отразил немецкие контрудары и освободил Житомир. Попытка Манштейна восстановить сплошной фронт по Днепру окончательно рухнула под яростным напором советского бронетанкового тарана.
legend_intro_80103=После крушения днепровского рубежа советские войска, развивая успех, стремились решительным ударом сокрушить немецкую группу армий «Юг». К марту 1944 года главные силы группы армий «Юг» оказались зажаты в котле на юго-западе Украины. Советское командование немедленно начало Проскуровско-Черновицкую наступательную операцию, призванную окружить и изолировать главные немецкие силы. Действуя как ударный авангард в составе 60-й армии, 4-й гвардейский танковый корпус во взаимодействии с соседними частями нанёс яростный удар по оборонительному рубежу Тернополь — Проскуров. Он не только надёжно сковал немецкие подвижные резервы, но и перерезал жизненно важную железнодорожную магистраль Львов — Одесса, создав решающие условия для окружения. К 17 апреля корпус овладел Тернополем, успешно завершив масштабное наступление, сокрушившее немецкую оборону западнее Днепра.
legend_intro_80104=К январю 1945 года советские войска в основном освободили восточную Польшу и стояли у ворот собственно Германии, тогда как немецкие силы на Восточном фронте были истощены непрерывными ударами. Для нанесения последнего удара по Берлину и завершения войны советское командование 12 января начало грандиозную Висло-Одерскую наступательную операцию, призванную одним рывком распахнуть ворота на Берлин. На Сандомирско-Силезском направлении 4-й гвардейский танковый корпус, действуя как подвижная ударная сила совместно с 59-й и 60-й армиями, 22 января освободил древний Краков. За героизм и выдающиеся заслуги в этой операции корпус был награждён орденом Ленина. С завершением кампании большая часть Польши была освобождена, дорога на Берлин — открыта, и заря победы наконец занялась.
legend_intro_80105=16 апреля 1945 года 4-й гвардейский танковый корпус развернулся вдоль реки Нейсе в составе 1-го Украинского фронта, вступив в последнюю битву, которая поставит империю на колени. После массированной артиллерийской подготовки бронетанковый таран форсировал Нейсе и устремился в последний победный бросок на Берлин. В ходе этой операции 4-му гвардейскому танковому корпусу поручалась ликвидация немецких остатков в южной части Берлина. Хотя корпус не участвовал непосредственно в штурме центра, он вошёл в историю как одно из первых соединений, форсировавших Эльбу и осуществивших триумфальную встречу с западными союзниками. 2 мая Берлин пал, Третий рейх рухнул. Однако для 4-го гвардейского танкового корпуса долгий марш ещё не был окончен.
legend_intro_80106=Едва стихла артиллерийская канонада Берлинской битвы, как весть о победе воспламенила волю к сопротивлению в Праге. 5 мая 1945 года жители Праги подняли вооружённое восстание. Чтобы помочь восставшим братьям и окончательно уничтожить отходившую в Чехословакию немецкую группу армий «Центр», советские войска начали последнюю крупную наступательную операцию Восточного фронта. 6 мая 4-й гвардейский танковый корпус, действуя в авангарде 1-го Украинского фронта, влился в главные силы, превратившись в стремительный стальной поток. Преодолев труднопроходимые Рудные горы, он рванулся прямо на Прагу. 9 мая Прага была освобождена, а к 11 мая остатки группы армий «Центр» капитулировали. Так 4-й гвардейский танковый корпус завершил свой путь во Второй мировой войне у конечной точки победы. В июне того же года заслуженное соединение было официально преобразовано в 4-ю гвардейскую танковую Кантемировскую дивизию. Её наименование и слава навечно вписаны в военную историю, и по сей день она остаётся важнейшей бронетанковой ударной силой Российской армии.
event_109=Битва за Берлин
event_intro_109=В 1945 году границы рейха рушились под чередой сокрушительных поражений. Армия, некогда прокатившаяся по всей Европе, была сжата в своём последнем оплоте — Берлине. Мстительный красный вал уже перешёл Одер, надвигаясь на столицу подавляющей огневой мощью. На Западном фронте союзники подходили всё ближе; ни время, ни пространство больше не принадлежали Германии. Верховное командование продолжало отдавать приказы сражаться до конца, надеясь, что упорное сопротивление сотворит чудо. Смерть Рузвельта даже подпитывала их отчаянные фантазии о расколе между западными союзниками и СССР. Однако действительность не знала пощады. В условиях разрушенных цепей управления и хаотичных порядков остатки немецких сил отчаянно сколачивали последние оборонительные рубежи. От закалённых ветеранов до наспех призванных юнцов — все были неумолимо втянуты в этот необратимый финал.
dialogue_4482=Товарищи красноармейцы, мы пришли от Волги; мы пришли из огня и руин. Мы видели нашу землю, обращённую в пепел, слышали плач матерей и детей. Враг полагал, что сумеет поставить нас на колени, но он ошибся!
dialogue_4483=Теперь Берлин перед нами. Здесь началась эта война, здесь начались все страдания. Сегодня настал час возмездия. Покончим с этим раз и навсегда!
dialogue_4484=Берлин не входит в наши нынешние стратегические задачи. Наступление на него поведут силы Восточного фронта. Мы не станем платить лишнюю цену в жизнях за один город. Подлинная победа — это когда по окончании войны как можно больше наших людей вернутся домой.
dialogue_4485=Продолжать продвижение в сердце Рурского промышленного района и подорвать промышленные и снабженческие возможности противника!
dialogue_4486=Быть может, этот план я выбрал бы не сам; будь моя воля, я продолжил бы наступление на восток.
dialogue_4487=Солдаты Рура! Обстановка не оставляет места иллюзиям. Мы окружены, снабжение перерезано. Продолжение борьбы приведёт лишь к новым напрасным жертвам.
dialogue_4488=Я отказываюсь исполнять бессмысленные приказы фюрера о выжженной земле. Германия и без того довольно настрадалась от войны; незачем сжигать всё собственными руками.
dialogue_4489=От вас более не требуется сражаться. Части могут расходиться самостоятельно. Сохраняйте жизни, как сможете, и положите конец этой уже оконченной войне.
dialogue_4490=Как фельдмаршал я не могу допустить, чтобы мой путь завершился пленом. Раз выхода нет, я сам опущу занавес.
dialogue_4491=Наступление Восточного фронта застопорилось, и ход войны изменился. Чтобы завершить войну как можно скорее, приказываю союзным войскам немедленно выдвигаться на Берлин! В ходе операции точно определять положение советских войск во избежание огня по своим.
dialogue_4492=Наконец настал миг, которого мы ждали. Солдаты, всем частям — в атаку!
dialogue_4493=Это французы напротив нас? Да, это дивизия «Шарлемань»! Они сопротивляются ещё ожесточённее немцев!
dialogue_4494=Я не могу понять их выбор и не могу принять их позицию. Пока они продолжают сопротивление, они должны быть уничтожены. Продолжать атаку!
dialogue_4495=Пасть в наступлении — высшая честь для солдата. Продолжайте... продолжайте продвижение...
dialogue_4496=Фюрер покончил с собой, бросив всех, кто клялся ему в верности. Мы уже сражались до последнего мгновения в этом городе-руине, но это не изменило исхода — дальнейшее сопротивление бессмысленно.
dialogue_4497=Каждый час продолжения боёв продлевает чудовищные страдания берлинских гражданских и раненых. Поэтому по согласованию с советским верховным командованием приказываю всем войскам немедленно прекратить сопротивление. Это последний приказ рейха.
