item_name_139=Фрагмент Бронеавтомобиля «Улей»

elite_intro_94=Бронеавтомобиль «Улей» разработан для высокоинтенсивных конфликтов современной войны. Эта тактическая машина способна запускать вооруженные беспилотники с двумя режимами: точечных микроволновых ударов и терминального самоуничтожения. Используя передовые алгоритмы координации роя и систему разведки в реальном времени, эта платформа может прорывать оборону, разрушать построения противника и наносить ювелирные удары. Являясь мобильным огневым центром («ульем»), она представляет собой по-настоящему разрушительную силу на современном поле боя.

