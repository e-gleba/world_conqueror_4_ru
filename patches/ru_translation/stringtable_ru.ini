;; Оперативные сводки кампаний
;__font_type[font_text_]
stage_intro_10001=В этой миссии вы освоите азы тактики: манёвр, огонь, развёртывание резервов, назначение командиров и главное — искусство побеждать.
stage_intro_10002=Разберём влияние боевого духа, организацию ПВО (противовоздушной обороны), захват городов, возведение стратегических объектов и работу с разведданными.
stage_intro_10003=Отработаем использование рельефа, вызов авиации, применение ядерного арсенала, пуски баллистических ракет и морские операции.
stage_intro_10004=Спецнавыки элитных подразделений, второстепенные цели и точки эвакуации.
stage_intro_10101=Ставка утвердила вторжение в Польшу. Приказ: возглавить ударную группировку и прорвать оборону противника. Ждём доклада о победе.
stage_intro_10102=Разведка: британцы готовят десант в Норвегии. Угроза поставкам железной руды. Ставка приказывает — операция «Везерюбюнг». Захватить Данию и Норвегию. Обеспечить Рейх ресурсами.
stage_intro_10103=Цель Французской кампании — Париж. Линия Мажино неприступна в лоб, но бронетанковый обход с фланга превратит эту бетонную стену в декорацию.
stage_intro_10104=Франция пала. Осталась Британия. Без контроля над западом наступление на восток — самоубийство. Приказ: форсировать Ла-Манш и ликвидировать британскую угрозу.
stage_intro_10105=Британский флот блокирует Средиземноморье. Операции в Северной Африке парализованы, южные границы под угрозой. Дуче требует немедленно вернуть контроль над акваторией. Вопрос выживания.
stage_intro_10106=Успехи вскружили Дуче голову — он жаждет возродить Римскую империю. Начинаем Балканскую кампанию. Румыния и Болгария поддержат. Провал недопустим.
stage_intro_10107=Ставка утвердила директиву «Барбаросса». Конечная цель — Москва. Блицкриг должен сокрушить СССР одним ударом. Рейх получит ресурсы и нефть Кавказа.
stage_intro_10108=Британские контратаки сорвали захват Суэца и Александрии. Коммуникации растянуты. Смять оборону, перерезать снабжение, зачистить Северную Африку.
stage_intro_10109=Ленинград — промышленное сердце СССР. Фюрер считает его захват важнее Москвы. Группа армий «Север» и финны на позициях. Сомкните кольцо.
stage_intro_10110=6-я армия Паулюса заперта в Сталинградском котле. Ставка требует деблокировать любой ценой. Резервы в пути. Прорвать кольцо и завершить зачистку Сталинграда.
stage_intro_10111=Осечка «Барбароссы» — результат недооценки противника. Но Ставка уверена: это не остановит Рейх. До победы один шаг. Взять Москву — закончить войну.

stage_intro_10201=Немецкие танки смяли оборону союзников. Войска заблокированы в Дюнкерке. Единственный шанс — эвакуация. Держать периметр до последнего, пока основные силы грузятся на суда.
stage_intro_10202=В Дюнкерке брошено всё тяжёлое вооружение. Люфтваффе методично стирает нас в порошок. Штаб передаёт лучшие из уцелевших частей. Вы — последний щит Британии.
stage_intro_10203=По пути в Тунис мы пустили на дно логистику Роммеля. Африканский корпус обескровлен. Шанс вышвырнуть Ось из Африки. Но рельеф и бетонные доты превратят штурм в бойню.
stage_intro_10204=Африка зачищена. Для контроля над Средиземноморьем нужно вывести Италию из игры. Задача — высадка на Сицилии, операция «Хаски». Первый шаг на континент.
stage_intro_10205=Немцы стянули под Курск беспрецедентный бронетанковый кулак. Эта битва решит исход Восточного фронта. Ни шагу назад. Выстоять и сломать им хребет.
stage_intro_10206=Миф о непобедимости Вермахта рухнул. Приказ: форсировать Днепр и освободить Киев. Огневой вал сбережёт пехоту. Сметите их.
stage_intro_10207=Передовые части вошли в Белоруссию — операция «Багратион». Время раздавить группу армий «Центр». Враг судорожно стягивает резервы. Рвите оборону, пока не окопались.
stage_intro_10208=Второй фронт неизбежен. Штаб утвердил Нормандию — там, где не ждут. Самая грандиозная и самая кровавая десантная операция в истории.
stage_intro_10209=Приказ: высадка на юге Франции, разгром немецкой группировки, захват глубоководных портов. Коалиции критически нужна логистическая пропускная способность.
stage_intro_10210=Для форсирования Рейна штаб санкционировал беспрецедентный воздушный десант. Немцы будут драться за последний естественный рубеж с яростью обречённых. Готовьтесь к аду.
stage_intro_10211=Немцы бросают в мясорубку последние резервы и ополчение. Загнаны в угол, будут драться за столицу фанатично. Взять Берлин штурмом до подхода союзников.

stage_intro_10301=Тихоокеанский флот США мешает экспансии Империи. Генштаб утвердил удар по Пёрл-Харбору. Объединённый флот обеспечит прикрытие. Стереть Гавайи в пыль, пустить их корабли на дно.
stage_intro_10302=Британия увязла в войне с Германией, азиатские колонии беззащитны. Ради ресурсов берём Малайю и Сингапур. Остерегайтесь Королевского флота — их орудия всё ещё смертоносны.
stage_intro_10303=Британцы снабжают Китай по Бирманской дороге. Перерезать эту артерию. Вторгнуться в Бирму, захватить узловые точки, удерживать магистраль любой ценой.
stage_intro_10304=Следующая цель — Австралия. Сначала — захват архипелагов и рубежей, отрезающих австралийцев от США. Десант пойдёт, когда флот зачистит акваторию.
stage_intro_10305=Время высадки в Австралии. Приказ Генштаба: захватить побережье. Флот обеспечит полную поддержку. Ресурсы Империи на исходе — не допускать бессмысленных потерь.
stage_intro_10306=Штурм Импхала захлебнулся, потери тяжелейшие. Британцы перешли в преследование. Немедленно организовать жёсткую оборону и остановить прорыв.
stage_intro_10307=Война Германии и СССР в решающей фазе. Берлин требует удар по советскому Дальнему Востоку. Русские перебросят дивизии в Сибирь и оголят европейский фронт.
stage_intro_10308=Германия и Япония начинают совместное вторжение в Северную Америку. Цель — береговая оборона Канады. Крупнейшая морская операция в истории Империи. Главное — скрытность.
stage_intro_10309=Империя непобедима, но США не сломлены. Разведка: американцы создали супероружие, способное переломить ход войны. Упреждающий удар по материку. Медлить нельзя.

stage_intro_10401=Японцы вероломно ударили по Пёрл-Харбору. Аэродромы в огне, линкоры заперты в гавани. Надежда на уцелевшие патрульные эскадры — задержать их до подхода резервов.
stage_intro_10402=Британские силы разгромлены в Малайе. Враг готовит штурм Сингапура. Сдача города недопустима. Круговая оборона. С подходом Королевского флота — контрнаступление.
stage_intro_10403=Шифры взломаны. Япония готовит массированный удар по Мидуэю. Приказ: держать позиции. Авианосные группы на подходе. Это сражение изменит всё.
stage_intro_10404=Приказ: захватить недостроенный аэродром на Гуадалканале. Господство в воздухе на юге Тихого океана и путь на Филиппины. Макартур ждёт этого дня.
stage_intro_10405=Японский прорыв к Импхалу обернулся для них катастрофой. Враг обескровлен. Командование даёт зелёный свет на контрнаступление по всему фронту.
stage_intro_10406=Макартур возвращается на Филиппины — перерезать транспортные артерии Империи. Задача: обеспечить успех десанта и прикрыть фланги.
stage_intro_10407=Иводзима нужна как аэродром подскока для бомбардировок Токио. Остров — сплошной бетонный бункер. За каждый дюйм придётся платить кровью.
stage_intro_10408=Подготовка к вторжению в Японию, но островные гарнизоны дерутся с фанатизмом смертников. Времени на осаду нет. Уничтожить группировку, расчистить путь к метрополии.
stage_intro_10409=Даже после ядерных ударов Япония не сдаётся. Штаб утвердил операцию «Даунфол» — наземное вторжение. С севера бьют Советы, и Токио — не единственная их цель...

stage_intro_10501=Ударные группы НАТО вошли в Индийский океан. Цель: Персидский залив и наши кавказские нефтепромыслы. Не допустить.
stage_intro_10502=НАТО стягивает бронетехнику в Турцию для броска на Кавказ. Приказ Ставки ОВД: разгромить авангард и перенести бой на турецкую территорию.
stage_intro_10503=НАТО перебросило флот в Средиземноморье — перерезать наши коммуникации в Турции. Топить корабли, брать турецкий берег. Выдавить Альянс из региона навсегда.
stage_intro_10504=Брюссель заявил, что наше присутствие в Африке угрожает Европе. США и союзники объединились. Нам предстоит столкнуться с единой машиной всего капиталистического блока.
stage_intro_10505=Потеряв Европу, Вашингтон сколачивает альянсы в Азии. Приказ: удар по западному побережью США. Перерезать логистику на Тихом океане.
stage_intro_10506=ОВД контролирует Евразию и Африку. Остались Штаты. Генеральное сражение с самой технологичной армией мира. Победитель заберёт всё.

stage_intro_10601=Разгромив Рейх, СССР обнажил амбиции. Красная армия готова поглотить обескровленную Европу. В одиночку не выстоять. Создаём единый фронт.
stage_intro_10602=Коммунисты перешли 38-ю параллель, Сеул пал. Вызов свободному миру. Макартур высаживается в Инчхоне. За спиной Пхеньяна — серьёзные игроки.
stage_intro_10603=Аэрофотосъёмка подтвердила: СССР тайно развернул ядерные ракеты на Кубе. США под прицелом. Приказ: высадка, зачистка, демонтаж шахт.
stage_intro_10604=Просоветские силы перекрыли Суэцкий канал — мировая логистика и нефть парализованы. Объединиться с британцами, подавить сопротивление, разблокировать фарватер.
stage_intro_10605=Спутники фиксируют беспрецедентное скопление советских танков в Польше. Вторжение неизбежно. Упреждающий удар. Командир, вам предстоит остановить величайшую армию в истории.
stage_intro_10606=Капитуляция СССР была уловкой. Разведка обнаружила секретные базы в Антарктиде — там куют супероружие. Южный полюс. Выжечь калёным железом.

stage_intro_10701=Высокотехнологичный террористический синдикат захватил ключевые нефтепромыслы Ближнего Востока. Мировая экономика в пике. Немедленно вернуть контроль.
stage_intro_10702=Европа в огне. Скоординированные удары парализовали финансовые центры. Сердце цивилизации не отдадим фанатикам. Перебрасывать элиту, выбивать из столиц!
stage_intro_10703=Потерпев неудачу на Западе, террористы ударили по России. Экономика в руинах, но русские будут стоять насмерть. Поддержите их — они станут остриём контрудара.
stage_intro_10704=США приняли страшный удар: Нью-Йорк практически стёрт. Но победы в Европе заставили врага ослабить хватку. Приказ: контрнаступление. Зачистить территорию!
stage_intro_10705=Совбез ООН объявил тотальную войну. Глобальная зачистка. С каждым городом коалиция крепнет. Их уничтожение — вопрос времени.
stage_intro_10706=Враг возвёл мегабазу в Сибири для выкачки ресурсов. Стереть в пыль. Сибирские морозы — их щит. Готовьтесь к тяжелейшим условиям.
stage_intro_10707=Лишившись Сибири, они бросили всё на наши азиатские базы. Тяжеловооружённые фанатики, которым нечего терять. Бой на истощение. Ни шагу назад.
stage_intro_10708=Глобальный командный центр синдиката обнаружен в джунглях Южной Америки. Финальный штурм. Вырвать им сердце, вернуть миру покой!
stage_intro_10709=Ошибка. Синдикат проник на заброшенные советские объекты в Антарктиде и завладел технологиями супероружия. Атаковать цитадель. Это оружие не должно достаться безумцам!

;; Пролог
;__font_type[font_text_]
stage_dialogue_1=Командир, перед отправкой на передовую рекомендую пройти тактический инструктаж.
stage_dialogue_2=Я разъясню все аспекты управления подразделениями в бою.
stage_dialogue_3=Если у вас уже есть боевой опыт — можете пропустить.
stage_dialogue_4=Ставка отдала приказ. Войска на исходных рубежах. Противник сломлен и беспорядочно отступает. Границы Империи будут расширены. Командир, ведите нас к славе!
stage_dialogue_5=Танки Вермахта обошли линию Мажино. Города падают один за другим. Враг берёт в клещи. Необходима глубоко эшелонированная оборона. Судьба Франции в ваших руках.
stage_dialogue_6=США ввели нефтяное эмбарго. Война — вопрос времени. Бить первыми. Командир, если Тихоокеанский флот не пойдёт ко дну — Империя задохнётся в блокаде.
stage_dialogue_7=Японская экспансия перешла все границы. Они захватывают союзников и рвутся к гегемонии на Тихом океане. Президент подписал мобилизацию. Остановим их здесь и сейчас!
stage_dialogue_8=США и Западная Европа сколотили военный блок. Мы понимаем, против кого. Генсек предельно ясен: готовы нанести превентивный удар всеми средствами.
stage_dialogue_9=Война позади, но советский ВПК на полных оборотах. Стальные армады раскатают Европу за недели. Баллистические ракеты — у наших границ. Свободный мир обязан защищаться.
stage_dialogue_10=Сначала они были кучкой маргиналов. Никто не воспринимал всерьёз.
stage_dialogue_11=С глобальным кризисом они подняли голову. Под прикрытием идеологии завербовали миллионы отчаявшихся и ветеранов войн.
stage_dialogue_12=Скупали чёрный рынок на корню, переманивали учёных для создания высокотехнологичного оружия.
stage_dialogue_13=Перевороты, локальные конфликты, политические убийства — целые регионы оказались под их властью.
stage_dialogue_14=Командир, мировые лидеры приняли беспрецедентное решение: объединить армии в единый кулак.
stage_dialogue_15=Мы обязаны выжечь этот синдикат. Иначе — мрак.




