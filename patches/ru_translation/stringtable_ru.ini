help_scenario_desc_1=Здесь вы можете принять участие в классических сражениях со времен Второй мировой войны. Завершите все миссии в текущей кампании, чтобы разблокировать следующую.
help_scenario_desc_2=В кампаниях «Вторая мировая война в Европе», «Вторая мировая война в Тихом океане» и «Холодная война» можно выбрать одну из двух противоборствующих фракций.
help_scenario_desc_3=Каждая миссия имеет несколько уровней сложности. Чтобы разблокировать высокую сложность, необходимо сначала пройти текущую.
help_scenario_desc_4=Зоны боевых действий — это особый режим, в котором можно добывать медали и ленты. Он открывается, когда у вас появится минимум 8 генералов. Награды зависят от вашего счета: чем больше врагов вы уничтожите, тем он выше. Зону можно проходить несколько раз. Смена или обновление зоны стоит 1 Командный пункт. Важно: после начала кампании в зоне генералы, отправленные в бой, закрепляются за своими отрядами и не могут быть переназначены до обновления зоны, поэтому выбирайте командиров с умом.
help_scenario_desc_5=Режим «Граница» — это хардкорное испытание, которое разблокируется после прохождения кампании «Европа» на базовой сложности. Здесь вас ждут мощные вражеские крепости и бесконечные волны подкреплений противника. Прохождение этого режима принесет вам ценные награды.

help_conquest_1=Выбор страны
help_conquest_2=Дипломатия
help_conquest_3=Технологии
help_conquest_4=Строительство
help_conquest_5=Условия победы

help_conquest_desc_1=В режиме Завоевания страны делятся на три категории (от 1 до 3 звезд). Чем больше звезд, тем сильнее экономика и армия страны на старте, и тем легче за нее играть.
help_conquest_desc_2=В меню «Дипломатия» в верхней части экрана вы можете отправлять ресурсы союзникам или объявлять войну нейтральным странам.
help_conquest_desc_3=Развитие вашей страны ограничено уровнем Технологий. Зарабатывая очки исследований в Институте, вы также получаете опыт, необходимый для повышения общего технологического уровня государства.
help_conquest_desc_4=Вы можете развивать города, возводя различные здания. При достижении нужного уровня технологий нажмите кнопку «Строительство», чтобы увидеть доступные постройки и их стоимость.
help_conquest_desc_5=Итоговый ранг за победу в Завоевании зависит от набранных очков. На счет влияют: количество захваченных городов, потраченные ходы, сложность выбранной страны и задействованные генералы.

help_domination_1=Задачи
help_domination_2=Резерв
help_domination_3=Легенды
help_domination_4=Вторжения
help_domination_5=Торговля
help_domination_6=Маневры

help_domination_desc_1=Отправляйте генералов на задания и получайте ресурсы. Чем больше совпадений с условиями миссии, тем выше награда. Типы заданий: Разведка, Парад, Пропаганда и Строительство. Список обновляется в 8:00 и 20:00 UTC.
help_domination_desc_2=Для Вторжений, Маневров и битв с Легендами нужны собственные войска. Нанимайте и улучшайте их в меню «Резерв» справа вверху.
help_domination_desc_3=Побеждайте Легендарных генералов в особых боях, чтобы открыть их найм в штабе. Прохождение сложных этапов снижает цену найма.
help_domination_desc_4=Во Вторжениях вы сражаетесь резервными войсками и получаете медали за победу. Вторжения обновляются в 8:00 и 20:00 UTC.
help_domination_desc_5=На Бирже можно обменять лишние ресурсы на нужные.
help_domination_desc_6=В Маневрах вы сражаетесь своими войсками, оттачиваете тактику и получаете медали за победу.help_hq_1=Генералы
