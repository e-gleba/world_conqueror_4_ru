feat_desc_141=Снижает урон от авиации и ВДВ на 2%, а получаемый урон при нахождении в пустыне снижается на 1%.
feat_desc_142=При атаке или ответном огне по врагам в радиусе 1 клетки наносимый урон снижается на {1}%. При атаке или ответном огне по бронетехнике, артиллерии или кораблям на дистанции от 2 клеток наносимый урон увеличивается на {2}%.
feat_desc_143=При атаке или ответном огне игнорирует эффекты уклонения и дымовых завес.
feat_desc_143_Lv2=При атаке или ответном огне игнорирует эффекты уклонения и дымовых завес. При атаке или ответном огне по вертолетам наносит на {1}% больше урона.
feat_desc_143_Lv3=При атаке или ответном огне игнорирует эффекты уклонения, дымовых завес и защитных экранов. При атаке или ответном огне по вертолетам наносит на {1}% больше урона.

