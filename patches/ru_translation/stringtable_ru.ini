elite_intro_48=Бойцы спецподразделения «Бранденбург» проходили особую подготовку и получали уникальное снаряжение. Обладая высочайшей гибкостью применения, они выполняли широчайший спектр секретных задач за линией фронта, сея хаос и нанося невосполнимый урон врагу.
elite_intro_49=Отряд «Соколиный глаз» славится своей меткостью, феноменальной выдержкой и хладнокровием. Их главная задача — точечное устранение важных целей снайперским огнем для разрушения системы командования и снижения боеспособности противника.
elite_intro_50=Полевые медики работают в тяжелейших условиях передовой. Они часто рискуют жизнью, оказывая первую помощь раненым под шквальным огнем и взрывами. Их самоотверженность и профессионализм дарят надежду солдатам на поле боя.
elite_intro_51=M7 Priest — американская самоходная артиллерийская установка (САУ), сыгравшая важную роль во многих сражениях Второй мировой войны. Она оснащалась 105-мм гаубицей в открытой рубке, что обеспечивало расчету отличный обзор для наведения на цель.
elite_intro_52=Сверхтяжелое железнодорожное артиллерийское орудие «Дора» (Schwerer Gustav) представляло собой вершину немецкой тяжелой артиллерии. При калибре 800 мм и весе 1350 тонн оно могло забрасывать 7-тонные снаряды на 47 км. Из-за своей чудовищной мощи применялось для разрушения тяжелых фортификаций и осады городов.
elite_intro_53=БМ-21 «Град» — советская реактивная система залпового огня (РСЗО) калибра 122 мм, созданная в годы Холодной войны. Размещенная на шасси грузовика, она обладает высокой мобильностью. За короткое время система способна выпустить сокрушительный залп, накрывая огромную площадь и уничтожая силы противника.
elite_intro_54=Т-44 создавался как глубокая модернизация и развитие идей танка Т-34. Были значительно улучшены огневая мощь, маневренность и защита. Танк унаследовал рациональные углы наклона брони Т-34, что оказало огромное влияние на послевоенное танкостроение.
elite_intro_55=Тяжелый танк «Королевский тигр» (King Tiger) оснащался мощнейшим 88-мм орудием, легко пробивавшим броню любых танков союзников. Сочетание превосходной огневой мощи и толстой брони сделало его вершиной немецкого танкостроения периода Второй мировой войны.
elite_intro_56=Тяжелый танк M26 Pershing был разработан армией США на заключительном этапе войны для противостояния немецким «Тиграм». Вооруженный 90-мм пушкой и обладающий хорошей маневренностью, он продолжал нести службу и в послевоенных конфликтах.
elite_intro_57=Британский истребитель Spitfire прославился в Битве за Британию. Пройдя множество модернизаций, он успешно сражался на Европейском, Североафриканском и Азиатском театрах военных действий, став настоящей легендой Второй мировой войны.
elite_intro_58=Уникальная конструкция крыла типа «обратная чайка» обеспечивала пикирующему бомбардировщику Ju 87 Stuka отличную стабильность и точность. Знаменитые сирены, известные как «Иерихонские трубы», издавали в пике леденящий душу вой, подавляя боевой дух противника.
elite_intro_59=Военно-транспортный самолет C-47 Skytrain отличался высочайшей надежностью. Он массово применялся для переброски войск, техники и снабжения в самых суровых условиях, сыграв важнейшую логистическую роль в годы войны.
elite_intro_60=Немецкие подлодки Типа VII стали главной ударной силой Кригсмарине в Битве за Атлантику. Используя тактику «волчьих стай», они координированно атаковали конвои союзников, нанося колоссальный урон судоходству.
elite_intro_61=HMS Prince of Wales — британский линейный корабль типа «Кинг Джордж V». Его мощное вооружение и крепкая броня обеспечивали надежную огневую поддержку. Во время сражения в Датском проливе линкор нанес фатальные повреждения «Бисмарку», вынудив того прервать рейдерскую операцию.

