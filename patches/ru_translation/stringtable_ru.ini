event_intro_490=Чтобы обеспечить бесперебойные поставки шведской железной руды для своей военной машины, 9 апреля 1940 года Германия начала операцию «Везерюбунг». Дания капитулировала в первые же часы. Норвегия, несмотря на сложный рельеф и помощь союзников, пала 10 июня. В результате Германия взяла под контроль стратегические позиции в Северном и Балтийском морях, полностью обезопасив скандинавские транспортные маршруты.
event_intro_491=Нарвик был критически важным незамерзающим портом, через который шла отгрузка шведской руды. С началом норвежской кампании там завязались тяжелейшие бои. 9 апреля 1940 года немцы захватили город. Британский флот немедленно контратаковал, уничтожив 10 и 13 апреля немецкую эскадру в фьордах. Однако из-за слабой организации наземных сил британцам так и не удалось закрепить успех и удержать порт.
event_intro_492=16 апреля 1945 года советские войска (силами трех фронтов) начали генеральное наступление на столицу Третьего рейха — Битву за Берлин. Окруженный немецкий гарнизон оказывал фанатичное сопротивление, но советская артиллерия и танки методично перемалывали их оборону. 30 апреля в фюрербункере прозвучал роковой выстрел, ознаменовавший крах нацистской Германии.
event_intro_493=Чтобы поднять боевой дух американцев после Пёрл-Харбора, 18 апреля 1942 года 16 бомбардировщиков B-25 под командованием Джеймса Дулиттла взлетели с палубы авианосца «Хорнет» и нанесли первый в войне удар по Токио и другим японским городам. Хотя материальный ущерб был незначительным, рейд стал колоссальным психологическим шоком для японского командования. Большинство самолетов после бомбежки разбилось в Китае, один совершил посадку в СССР.
event_intro_494=Для уничтожения последних плацдармов Оси в Северной Африке, 22 апреля 1943 года союзники начали операцию «Вулкан». Британцы наступали на Тунис, американцы — на Бизерту. Немцы и итальянцы отчаянно оборонялись в горах, но из-за острой нехватки припасов и тотального господства авиации союзников их фронт рухнул 6 мая. 13 мая 250 000 солдат Оси капитулировали. Эта победа открыла союзникам путь для вторжения на Сицилию.
event_intro_495=После выхода Италии из войны в сентябре 1943 года немцы взяли под контроль острова Эгейского моря. 24 апреля 1944 года, в рамках дезинформационной кампании перед высадкой в Нормандии, британская Особая лодочная служба (SBS) совершила дерзкий рейд на остров Санторини. Уничтожение радиостанций и постов наблюдения заставило немцев оттянуть дополнительные резервы для защиты островов, что косвенно помогло операциям союзников в Средиземноморье.
event_intro_496=28 апреля 1944 года во время учений «Тигр» (подготовка к высадке в Нормандии) в заливе Лайм произошла катастрофа. Из-за путаницы в радиочастотах конвой T-4 остался без должного охранения и был атакован девятью немецкими торпедными катерами (шнелльботами). Два десантных корабля LST затонули, один получил тяжелые повреждения, погибло не менее 749 американских солдат. Трагедия заставила союзников жестко стандартизировать протоколы связи перед «Днем Д».
event_intro_497=Борнейская операция (1 мая – 21 июля 1945 года) стала последней крупной кампанией союзников на юго-западе Тихого океана. Австралийские войска высадились в Таракане, заливе Бруней и Баликпапане, чтобы захватить нефтяные вышки и лишить Японию топлива. Однако предварительные массированные бомбардировки союзников превратили инфраструктуру в руины. К тому же основные японские силы уже покинули регион, из-за чего стратегическая ценность операции оказалась минимальной.
event_intro_498=Сражение в Коралловом море (4–8 мая 1942 года) стало первым в истории столкновением авианосных соединений, где корабли не видели друг друга и не сделали ни одного артиллерийского выстрела. Японцы планировали захватить Порт-Морсби (операция «МО»), но американская разведка перехватила их планы. В бою американцы потопили легкий авианосец «Сёхо» и повредили «Сёкаку», но сами потеряли авианосец «Лексингтон» (и тяжелые повреждения получил «Йорктаун»). Тактически это была ничья, но стратегически — победа США, сорвавшая японское наступление.
event_intro_499=10 мая 1940 года вермахт начал реализацию плана «Гельб» (План Манштейна). Группа армий «Б» нанесла отвлекающий удар по Нидерландам и Бельгии, вынудив французские и британские войска выдвинуться навстречу по плану «Д». Тем временем бронетанковый кулак группы армий «А» прошел сквозь «непроходимые» Арденны. Прорвав французскую оборону под Седаном 14 мая, немецкие танки рванули к Ла-Маншу, отрезав в северной Фландрии более 300 тысяч солдат союзников. 28 мая король Бельгии подписал акт о капитуляции.
event_intro_4100=12 мая 1942 года советские войска начали Вторую битву за Харьков, надеясь развить зимний успех под Москвой. Войска вклинились в немецкую оборону, создав Барвенковский выступ. Однако из-за просчетов советского командования немцы нанесли мощные фланговые удары (операция «Фридерикус»). 17 мая кольцо начало сжиматься, а к 28 мая в котле погибло или попало в плен более 200 000 солдат Красной Армии. Эта катастрофа открыла немцам путь на Кавказ и к Сталинграду (план «Блау»).
event_intro_4101=15 мая 1941 года британцы начали операцию «Бревити» с целью деблокирования Тобрука и захвата приграничных фортов. Они быстро взяли перевал Хальфайя и форт Капуццо, однако немцы молниеносно перебросили резервы и выбили англичан. 27 мая Роммель окончательно вернул контроль над перевалом, что заставило союзников планировать более масштабную операцию («Баттлакс»).
event_intro_4102=20 мая 1941 года Германия начала операцию «Меркурий» — первую в истории масштабную воздушно-десантную операцию. Около 13 000 немецких десантников и горных егерей высадились на Крите для захвата аэродромов. Британские, греческие и австралийские части оказали яростное сопротивление. Хотя немцы выиграли битву, чудовищные потери (выкосившие элиту ВДВ) заставили Гитлера навсегда отказаться от крупных воздушных десантов.
event_intro_4103=22 мая 1940 года 10-я танковая дивизия вермахта осадила порт Кале, который защищал гарнизон из 4000 британских и французских солдат. Бои продолжались до 26 мая. В живых осталось лишь около 200 эвакуированных раненых, остальные погибли или попали в плен. Героическая оборона Кале связала немецкие танковые дивизии на три важнейших дня, дав время на организацию эвакуации из Дюнкерка (операция «Динамо»).
event_intro_4104=В мае 1940 года немецкий прорыв под Седаном отрезал британский экспедиционный корпус и французские части (более 300 000 человек) во Фландрии. Оказавшись прижатыми к морю, союзники 26 мая начали операцию «Динамо» — беспрецедентную по масштабам эвакуацию из порта Дюнкерк. За девять дней под непрерывными бомбежками в Британию было вывезено 338 000 солдат. Техника была брошена, но сохраненная армия стала залогом будущего освобождения Европы.
event_intro_4105=28 мая 1940 года 40 000 солдат 1-й французской армии оказались в окружении под Лиллем. Несмотря на безвыходное положение, французы ожесточенно сопротивлялись, сумев даже взять в плен немецкого генерала. Гарнизон капитулировал лишь 1 июня. Эта задержка сковала сразу семь немецких дивизий, выиграв драгоценное время для Дюнкеркской эвакуации и позволив спасти дополнительно более 100 000 солдат союзников.
event_intro_4106=С 31 мая по 8 июня 1942 года японские сверхмалые подводные лодки предприняли серию атак на гавань Сиднея (Австралия). Целью было нарушение логистики между США и Австралией. Хотя японцам удалось потопить лишь одно плавучее общежитие, эта дерзкая акция вызвала шок и заставила австралийцев экстренно модернизировать береговую и противолодочную оборону всех стратегических портов.

dialogue_3016=Вы думаете, что наступление — это воплощение мужества. Но истинная храбрость — это железная дисциплина: сохранять хладнокровие и прицельно вести огонь, даже когда враг уже врывается на твои позиции.
dialogue_3017=Враг превосходит нас числом и техникой, но наша воля крепче. На этой земле каждый дюйм пропитан гордостью и достоинством Финляндии.
dialogue_3018=Их оборона кажется неприступной, но наша решимость непоколебима. Мы стоим не на грани поражения, мы стоим на пороге великой победы!
dialogue_3019=Наш план столкнулся с непредвиденным сопротивлением. Необходимо срочно пересмотреть тактику, чтобы не увязнуть в затяжных боях.
dialogue_3020=Англия и Франция клялись нас защитить, а Советы обещали не вторгаться в нашу страну.
dialogue_3021=Советско-польский пакт о ненападении оказался для них лишь клочком бумаги. Они оказались хитрее немцев — дождались, пока наш западный фронт рухнет, и ударили в спину.
dialogue_3022=Мы очень благодарны Советам за их трактовку слова «ненападение» — они не нападают ровно до тех пор, пока им самим этого не захочется.
dialogue_3023=Французы строили эту линию обороны десять лет. Нам хватило десяти дней, чтобы обойти её с фланга.
dialogue_3024=Ни один из наших планов не предусматривал такого сценария... Нас полностью обвели вокруг пальца — мы всё это время защищали не те рубежи!
dialogue_3025=Мы уже потеряли время, но мы не имеем права потерять решимость! Всем частям: немедленно перегруппироваться и стабилизировать фронт! Мы должны их удержать. Франция так легко не сдастся!

