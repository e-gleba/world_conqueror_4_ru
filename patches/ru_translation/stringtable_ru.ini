event_stage_intro_20715=Осада Тобрука близится к финалу. У нас не хватает ресурсов для масштабного штурма, но британцы сами пошли нам навстречу, покинув свои укрепления. Это наш шанс разгромить их в полевом сражении, уничтожив их живую силу и решив проблему растянутых линий снабжения.
event_stage_intro_20716=Наши коммуникации растянуты до предела. Британские ВМС и ВВС безнаказанно хозяйничают в Средиземном море. Союзники непрерывно получают подкрепления через Красное море и Суэцкий канал. Ситуация критическая. Это будет наша последняя битва в Северной Африке, и она решит нашу судьбу.
event_stage_intro_20717=Союзники перегруппировались в Марокко и Алжире. Американцы стремительно наступают по суше, а британский флот концентрирует силы в Тунисском заливе. Местные гарнизоны Виши уже готовы переметнуться к врагу. Кризис неизбежен. Мы будем удерживать Тунис до последнего солдата, ожидая подхода основных сил Роммеля.

dialogue_2944=Британские резервы уже на подходе! Форсируйте марш на Мерса-Матрух и не задерживайтесь!
dialogue_2945=Итальянцы превосходят нас числом. Приказ передовым частям: отступать с боями. Как только подойдут резервы — перейдем в контрнаступление.
dialogue_2946=Всем частям: главная задача — удержать линию фронта. Не допустить прорыва британцев!
dialogue_2947=Мне нужны подкрепления, чтобы сдержать натиск итальянцев!
dialogue_2948=Мой флот устранит угрозу с моря.
dialogue_2949=Стремительный бросок на восток! Мы должны полностью вычистить британские войска из Киренаики.
dialogue_2950=Наша задача — максимально задержать противника. Если придется, оставим позиции и отойдем на восток.
dialogue_2951=Немецкий танковый клин дошел до Бенгази. Мы отходим к Тобруку, где наш гарнизон уже выстроил мощную линию обороны.
dialogue_2952=Наступление идет по плану. Мои войска продолжат марш на Бардию.
dialogue_2953=Парашютисты выброшены в заданном периметре и захватили ключевые узлы. Защитники Крита будут уничтожены до подхода британских подкреплений.
dialogue_2954=Флот немедленно атакует точки сбора противника на южном побережье, чтобы отрезать им пути к отступлению.
dialogue_2955=Немецкий десант высадился на острове! Удерживайте позиции и инфраструктуру, помощь уже в пути.
dialogue_2956=Гарнизон дрался до последнего патрона, но резервов для защиты Крита больше нет.
dialogue_2957=Мой флот не выдерживает ударов Люфтваффе. Боюсь, нам остается только отступление.
dialogue_2958=Британский контрудар был яростным, но они не смогли сконцентрировать тяжелую технику для прорыва в одной точке.
dialogue_2959=Британцы пытаются взять наши танки в клещи. Отойдите к линии обороны, пополните боекомплект и готовьтесь к контрудару.
dialogue_2960=У британцев еще много бронетехники. Прорвать их оборону южнее Саллума будет непросто.
dialogue_2961=Стяните силы к Саллуму и восстановите фронт. Мы обязаны остановить продвижение немцев на восток.
dialogue_2962=Наше наступление захлебнулось. Теперь мы обязаны бросить всё на уничтожение немецкого авангарда и возвращение Саллума.
dialogue_2963=Британцы грамотно использовали рельеф и окопались на перевалах.
dialogue_2964=Мои танки ударят южнее Тобрука и разрежут оборону союзников пополам.
dialogue_2965=У врага перевес в бронетехнике. В открытом бою нам их не разбить. Отходим на тыловые рубежи, опираемся на ДОТы и минные поля.
dialogue_2966=Немцы вклинились в нашу территорию! Немедленно перебросить резервы к Тобруку и укрепить периметр!
dialogue_2967=Мы катастрофически недооценили численность немцев. У нас нет сил защищать весь регион, но и бросить Тобрук мы не имеем права.
dialogue_2968=Продолжайте перебрасывать резервы в район Эль-Аламейна. Там состоится генеральное сражение с Роммелем.
dialogue_2969=Мои войска нанесут удар в самое сердце Египта, обойдя Эль-Аламейн с юга.
dialogue_2970=Контрнаступление идет отлично! Мы смяли итальянские позиции. Продолжаем давить!
dialogue_2971=Враг рвется к Суэцкому каналу. Нам нужны резервы, чтобы удержать фронт севернее Каира!
dialogue_2972=У британцев всё еще остались укрепленные узлы вокруг Каира. Продолжайте наступление на восток и отслеживайте перемещение их резервов.
dialogue_2973=Заблокируйте Суэцкий канал! Вражеский флот не должен прорваться в Суэцкий залив!
dialogue_2974=Союзники доминируют в воздухе и на море, непрерывно уничтожая наши конвои снабжения и транспортные колонны.
dialogue_2975=Разгромить союзников без подкреплений — утопия. Но отступление станет катастрофой. Мои бронетанковые части сделают всё, чтобы удержать Тунис.
dialogue_2976=Мы давно сделали свой выбор. Солдаты, в бой за Францию!
dialogue_2977=Прорвите их фронт и восстановите связь с защитниками Туниса!
dialogue_2978=Если основные силы немцев успеют перегруппироваться, последствия будут фатальными. Время работает против нас. Продолжайте штурм Туниса!
dialogue_2979=Перевес союзников подавляющий. Нам некуда отступать.
dialogue_2980=Зачистить Тунис! Наше контрнаступление вот-вот начнется.

event_106=Сталинградская битва
event_intro_106=В 1941 году Германия начала операцию «Барбаросса», вторгнувшись на территорию Советского Союза. Красная Армия вела тяжелые оборонительные бои, отступая вглубь страны. К 1942 году немецкая стальная лавина докатилась до самого сердца СССР. Сталинград, возвышающийся на берегу Волги, стал последним рубежом обороны. Для советского народа битва за город стала не просто тактической задачей, а вопросом выживания нации. Вся страна, как натянутая струна, ждала развязки величайшего сражения в истории.

