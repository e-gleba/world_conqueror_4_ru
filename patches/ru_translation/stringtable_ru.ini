glory_challenge_desc_10901=Виттман завершил 5 завоеваний.
glory_challenge_desc_11001=В любой победной кампании «Завоевание» Виттман, командуя «Королевским тигром», уничтожил 50 бронетанковых частей.
glory_challenge_desc_11101=В испытании «Завоевание 1943», играя за Германию, захватить Курск в течение 5 раундов, при этом Виттман командует танком «Королевский тигр».
glory_challenge_desc_11201=«Королевский тигр» достигает 9 уровня.
glory_challenge_desc_11202=«Ястребиный глаз» достигает 9 уровня.
