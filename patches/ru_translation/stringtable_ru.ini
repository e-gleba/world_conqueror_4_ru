skill_info_152=При командовании авиацией: шанс уклонения +[#00FF00#%d%%], мобильность +4, получаемый отрядный урон снижен на 30%. При атаке вражеской авиации критический урон увеличивается на 1% за каждый 1% шанса уклонения.
skill_info_153=Снижает стоимость авиационных (кроме ВДВ) и ракетных ударов на 20%. При командовании авиацией и ракетами накладывает эффект «Эшелонированное наступление»: игнорирует [#00FF00#%d%%] защиты противника и всегда наносит критический урон целям, у которых итоговая защита ниже 20 (не действует на ядерные удары). Эффект срабатывает в конце хода.
skill_info_154=Экономический и промышленный доход города +[#00FF00#%d], если в радиусе 1 клетки от генерала нет вражеских войск.
skill_info_155=При атаке цель и 2 вражеских отряда в радиусе 1 клетки от нее имеют вероятность [#00FF00#%d%%] получить эффект «Усталость» на 1 ход. Войска с «Усталостью» теряют дополнительно 6% ОЗ от атак и авиаударов, а их боевой дух падает. Эффект не действует на войска, которые уже деморализованы.

army_buff_desc_1461=Эшелонированное наступление: при авиа- и ракетных ударах игнорирует 15% защиты противника и наносит 100% критический урон целям с итоговой защитой ниже 20.
army_buff_desc_1462=Эшелонированное наступление: при авиа- и ракетных ударах игнорирует 30% защиты противника и наносит 100% критический урон целям с итоговой защитой ниже 20.
army_buff_desc_1463=Эшелонированное наступление: при авиа- и ракетных ударах игнорирует 45% защиты противника и наносит 100% критический урон целям с итоговой защитой ниже 20.
army_buff_desc_1464=Эшелонированное наступление: при авиа- и ракетных ударах игнорирует 60% защиты противника и наносит 100% критический урон целям с итоговой защитой ниже 20.
army_buff_desc_1465=Эшелонированное наступление: при авиа- и ракетных ударах игнорирует 75% защиты противника и наносит 100% критический урон целям с итоговой защитой ниже 20.
army_buff_desc_1471=Усталость: получаемый урон от атак и авиаударов увеличен на 6% ОЗ, боевой дух отряда падает. Эффект не действует на уже деморализованные войска.

