dialogue_2834=Товарищи, освободите Клуж и вышвырните немецко-венгерские части из Румынии!
dialogue_2835=Наступление на Дебрецен! Уничтожьте вражескую группировку раз и навсегда!
dialogue_2836=Удар на северо-восток! Взять Калинин!
dialogue_2837=Калининский фронт товарища Конева обязан не допустить прорыва немцев к Калинину! Москва перебросит все доступные резервы.
dialogue_2838=Всем частям: непрерывно контратаковать немцев со всех направлений. Измотать врага и сорвать их наступление!
dialogue_2839=Сопротивление ожесточенное. Мы должны стабилизировать фронт, иначе они прорвут наши тылы.
dialogue_2840=Москва близко. Советские войска обескровлены. Прорвать их оборону и начать штурм столицы!
dialogue_2841=Товарищи, враг увяз на Можайской линии обороны. Мы обязаны выстоять — позади Москва!
dialogue_2842=Товарищи, логово врага перед нами. Пришло время возмездия! В атаку! За павших товарищей и смытый позор отступлений!
dialogue_2843=Солдаты, ради чести Восточной Пруссии и нашей Родины — стоять насмерть! Ни шагу назад!
dialogue_2844=Командующим эскадрами: зачистить акваторию и обеспечить плацдарм для десанта. Возьмем Филиппины — и японский флот перестанет существовать!
dialogue_2845=Десант на берег! Вдавить врага в джунгли и смыть кровью наш позор!
dialogue_2846=Господа, эта битва должна быть выиграна любой ценой. Потеряем Филиппины — и наш флот окажется заперт в базах.
dialogue_2847=Продолжайте давить! Моя дивизия стянет их резервы на себя!
dialogue_2848=Наше снабжение бесперебойно. Пехота пробивает бреши, танки идут в прорыв. Эта битва за нами!
dialogue_2849=Опирайтесь на минные поля, берегите боекомплект и ждите подкреплений. Я скоро вернусь.
dialogue_2850=Бронетанковые части концентрируются на севере для подготовки контрудара.
dialogue_2851=Отличные новости! Королевские ВВС пустили на дно их транспорт снабжения в Тобруке!
dialogue_2852=Мы не удержим позиции. Всем частям — общий отход!
dialogue_2853=Греческая армия держится на честном слове. Солдаты, во славу Италии — взять Грецию!
dialogue_2854=Греки дрались отчаянно, но нашу сталь им не сдержать.
dialogue_2855=Не дайте им вернуть потерянные рубежи!
dialogue_2856=Захватить залив Императрицы Августы и закрепиться!
dialogue_2857=Японские подкрепления идут с моря! Топите их на подходе!
dialogue_2858=Южная группировка обеспечит огневой вал, северная нанесет главный удар.
dialogue_2859=Удержать Киев любой ценой! Дальше фронт не отступит ни на шаг!
dialogue_2860=Котел закрывается! Немедленный прорыв на юго-запад!
dialogue_2861=Киев освобожден! Продолжать преследование противника!
dialogue_2862=Свяжите их боем! Остановите продвижение их колонн!
dialogue_2863=Местный гарнизон малочислен. Мы обязаны ударить стремительно, пока они не взорвали портовую инфраструктуру.
dialogue_2864=Королевский флот Италии бросил якорь в Таранто. Это наш шанс пустить их на дно прямо в гавани.
dialogue_2865=Зенитным батареям — заградительный огонь! Остальным — в укрытия!
dialogue_2866=Флот прикроет десант. Мы обязаны вернуть аэродром!
dialogue_2867=Доклад авиаразведки: к Гуадалканалу приближается японская ударная группа.
dialogue_2868=Подкрепления японцев высадились. Боевая готовность!
dialogue_2869=Обойдем их укрепления, ударим в тыл осаждающей группировке и деблокируем Тобрук!
dialogue_2870=Продолжать штурм Тобрука! Остальным частям — закрепиться и ждать подвоза боеприпасов.
dialogue_2871=Тобрук взят. Перегруппироваться и готовиться к контрнаступлению!
dialogue_2872=Развить успех и взять Ростов!
dialogue_2873=Здесь мы переломаем хребет 1-й танковой армии Вермахта!
dialogue_2874=Наши части здесь обречены. 1-й танковой армии приказано оставить Ростов.
dialogue_2875=Товарищи, время контрудара! В штыковую! Вернуть наши рубежи!
dialogue_2876=Держать строй! Ни пяди родной земли врагу!
dialogue_2877=Товарищи, эти плацдармы не должны достаться немцам. Это прямая угроза Ленинграду.
dialogue_2878=Сограждане, мы будем биться до последнего патрона за независимость Финляндии!
dialogue_2879=Сконцентрировать удар на Наро-Фоминске и выровнять фронт на московском направлении!
dialogue_2880=Товарищи, мы обязаны удержать этот рубеж! Они не пройдут к Москве!
dialogue_2881=Артиллерия на позициях. Вперед, вернем Калинин!
dialogue_2882=Всем частям: занять оборону по руслу реки. Калинин не сдавать!

dialogue_3000=Передовые части перерезали коммуникации противника. Кольцо вокруг Сталинграда замкнулось.
dialogue_3001=Мы перемелем их с безжалостностью конвейера. Сталинград станет памятником нашей стойкости!
dialogue_3002=Трусов расстреливать на месте. Выжившим — награды и повышения!
dialogue_3003=Я покидаю передовую, но мои мысли с вами. Этот ад — лишь проверка нашей воли. Выстоим — и победа будет нашей.
dialogue_3004=Мы заставим их истекать кровью за каждую улицу, каждый цех, за каждый битый кирпич.
dialogue_3005=С этой высоты они — лишь мишени. Каждое пике — это приговор!
dialogue_3006=Они думали, что диктуют условия. Они еще не поняли, какая стальная лавина на них надвигается.
dialogue_3007=Они мнили себя непобедимыми. Мы вобьем их спесь в землю.
dialogue_3008=Это окружение временное. Как только подойдут резервы, мы разорвем их кольцо в клочья.
dialogue_3009=Каждый шаг приближает победу. Каждый залп — похоронный звон для врага.
dialogue_3010=На поле боя у меня одна задача — убедиться, что враг сделал свой последний вдох.
dialogue_3011=Я выполнил свой долг до конца. Но перед лицом этой катастрофы у нас не осталось выбора.
dialogue_3012=Я горд своими солдатами. Они дрались как львы в абсолютном аду.
dialogue_3013=Каждый камень Сталинграда станет для них надгробием.
dialogue_3014=Меня сбили. Мой полет окончен.
dialogue_3015=Эта пуля оборвет мою жизнь, но огонь нашего возмездия ей не погасить.



