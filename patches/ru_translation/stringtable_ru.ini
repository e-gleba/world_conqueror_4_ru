event_stage_intro_20216=Американцы успешно отразили наше наступление в Коралловом море и усилили оборону побережья. Нашей главной стратегической целью остается захват Порт-Морсби. Воспользовавшись слабостью гарнизона, мы захватим Новую Британию, а затем продвинемся к Лаэ, подготовив плацдарм для решающего сухопутного наступления.
event_stage_intro_20217=Тихоокеанский оборонительный периметр, наконец, выстроен. У американцев не остается иного выбора, кроме как отступить для защиты материка. Однако, согласно данным разведки, враг совершил прорыв в разработке ядерного оружия. Если оно будет применено в бою, ход войны кардинально изменится. У нас заканчивается время.

dialogue_2462=Первый удар увенчался успехом! Однако в гавани не обнаружено ни одного американского авианосца.
dialogue_2463=Мой флот нанесет третью волну ударов и сделает всё возможное, чтобы уничтожить их всех!
dialogue_2464=Уничтожьте их линкоры и полностью парализуйте вражеский флот! Это гарантирует успех нашей кампании на юге.
dialogue_2465=Авианосная ударная группа возвращается на базу! Срочно организовать оборону и приготовиться к контрудару.
dialogue_2466=Мы заставим японскую армию дорого заплатить за эту третью волну атаки!
dialogue_2467=Первые две волны нанесли тяжелый урон американским кораблям в гавани, но и мы понесли потери.
dialogue_2468=Японцы стянули войска на север Малайи. Мы должны сделать всё, чтобы замедлить их продвижение на юг и выиграть время до прибытия подкреплений.
dialogue_2469=Авиаудары оказались крайне эффективны. «Принц Уэльский» никуда не уйдет!
dialogue_2470=Добейте остатки британского флота и установите полный контроль над территориальными водами Малайи!
dialogue_2471=Нам не угнаться за этими отступающими британцами. Мы обязаны ускорить наступление, пока враг не успел организовать надежную оборону!
dialogue_2472=Мы сильно недооценили скорость японского наступления. Северный рубеж обороны Сингапура станет нашим последним барьером.
dialogue_2473=Сингапур совсем рядом. Блокируйте прилегающие воды, чтобы отрезать врагу пути к отступлению. Наши сухопутные силы нанесут решающий удар.
dialogue_2474=Сингапур пал. Мы потерпели поражение.
dialogue_2475=Я буду сдерживать наступление британцев, а вы срочно перехватите вражеский флот и отрежьте ему путь к бегству!
dialogue_2476=Наши сухопутные войска высадятся на западном побережье Лусона и к юго-востоку от Манилы. Мой авианосный флот расчистит для них путь с моря.
dialogue_2477=Я обеспечу оборону северной части Манилы и мобилизую резервы для экстренной поддержки наших союзников на севере Лусона.
dialogue_2478=Японское наступление слишком мощное! Нам нужно отступить к Маниле и перегруппироваться.
dialogue_2479=Я только что получил прямой приказ от президента: мы должны немедленно отступить на Батаан.
dialogue_2480=Я покинул Батаан, но я еще вернусь.
dialogue_2481=Остатки американских войск рассеяны и полностью дезорганизованы.
dialogue_2482=Высадка в заливе Ламон успешно завершена. Они будут координировать действия с нами и нанесут удар по Маниле с юга.
dialogue_2483=Прошу поддержать наступление моих войск, чтобы окончательно стереть союзников с лица Борнео.
dialogue_2484=Срочно собирайте флот и перехватите японскую эскадру до того, как она войдет в Яванское море!
dialogue_2485=Объединенный флот США, Британии, Нидерландов и Австралии (ABDA) собрался в Яванском море. Это идеальный шанс уничтожить все военно-морские силы союзников одним ударом!
dialogue_2486=Взаимодействуйте с флотом, чтобы потопить вражеские корабли в Яванском море, а затем начинайте штурм Сурабаи и Джакарты.
dialogue_2487=Яванское море — наш последний рубеж обороны перед Суматрой и Явой.
dialogue_2488=Костяк союзного флота пущен на дно, а оставшиеся корабли — просто неорганизованный сброд. Добейте их и расчистите путь для нашего десанта!
dialogue_2489=Поражение союзников неизбежно. Готовьтесь в любой момент начать эксплуатацию ресурсов Ост-Индии.
dialogue_2490=Мы обязаны перехватить врага в Коралловом море и остановить дальнейшее вторжение японского флота.
dialogue_2491=Немедленно собирайте объединенную эскадру! Мы дадим японцам генеральное сражение в Коралловом море!
dialogue_2492=Используйте аэродром на Гуадалканале в качестве базы для авиаподдержки.
dialogue_2493=Закрепитесь на текущих позициях, перегруппируйтесь и готовьтесь к контрнаступлению.
dialogue_2494=Американцы давно готовились к этому моменту. Остерегайтесь их подкреплений и засад.
dialogue_2495=Продолжайте развивать успех!
dialogue_2496=Японские корабли слишком быстрые!
dialogue_2497=Мы не смогли остановить вражеское наступление. Пора менять планы и готовиться к организованному отступлению.
dialogue_2498=Японская база на Новой Британии создает прямую угрозу Новой Гвинее и даже материковой Австралии.
dialogue_2499=Я заблокирую акваторию к востоку от Лаэ, чтобы отрезать союзникам пути к отступлению.
dialogue_2500=Враг взял в кольцо всю Новую Британию! Мне нужно больше резервов, чтобы гарнизон смог отступить в порядке.
dialogue_2501=Мы успешно закрепились на Новой Гвинее. Теперь наша главная цель — взять под контроль путь Кокода.
dialogue_2502=Рельеф в районе пути Кокода невероятно сложный, продвигаться тяжело. Двигайтесь с осторожностью и не рвитесь вперед без разведки.
dialogue_2503=Укрепите оборону на восточном побережье! Не дайте японцам прорваться!
dialogue_2504=Японцы захватили Кокоду и сейчас стремительно наступают на Порт-Морсби!
dialogue_2505=Удерживайте позиции любой ценой и замедлите продвижение врага. Мои подкрепления уже на подходе!
dialogue_2506=Учитывая колоссальную промышленную мощь США, как только они наладят массовое производство, ход мировой войны может кардинально измениться.
dialogue_2507=Всем кораблям: прикрыть высадку десанта огнем! В первую очередь уничтожайте береговые укрепления противника.
dialogue_2508=Японский десант высадился на побережье к западу от Ванкувера!
dialogue_2509=Лос-Анджелес также под ударом! Срочно отправляйтесь им на помощь!
dialogue_2510=Мы успешно сорвали высадку японцев в Калифорнии, но сохраняйте бдительность — враг может прислать подкрепление.
dialogue_2511=Мои танковые дивизии нанесут внезапный удар, чтобы выиграть время для завершения разработки ядерного оружия.
dialogue_2512=Испытательный взрыв прошел успешно, но мы не сможем наладить их серийное производство в ближайшее время.
dialogue_2513=Защитите Западное побережье любой ценой и спасите результаты наших исследований!

dialogue_2514=Войскам Оси некуда деваться! Наступаем на Тунис и сбросим их с африканского континента!
dialogue_2515=Наступление II корпуса провалилось. Действуйте осмотрительно, чтобы не попасть в ловушку врага.
dialogue_2516=Лобовая оборона немцев слишком крепка! Задействуйте флот, чтобы найти брешь, а британские войска поддержат нас с фланга.
dialogue_2517=Найдите слабое место в береговой обороне противника и начните решающую высадку на остров.
dialogue_2518=Немецкие войска пытаются эвакуироваться в материковую Италию. Не дайте им уйти!
dialogue_2519=Солдаты, эта десантная операция станет величайшей в истории. Мы начинаем!
dialogue_2520=Откуда здесь войска союзников?! Проклятье, разведка крупно облажалась. Приготовиться к отражению атаки!
dialogue_2521=Береговая оборона противника крайне уязвима. Сейчас самое время высадиться, захватить плацдарм и открыть Второй фронт в Европе!
dialogue_2522=Соберите все наши силы и перехватите их конвои прямо в море!
dialogue_2523=Используйте авиацию для поддержки наземных войск при штурме их ключевых укреплений.
dialogue_2524=Захватите Лион, и победа в этой битве будет нашей.
dialogue_2525=Рур — это промышленное сердце Германии на Западном фронте. Если мы захватим его, исход войны будет предрешен.
dialogue_2526=Обойдите врага с севера и юга, чтобы отрезать ему пути к отступлению. Как только кольцо замкнется, мы без труда возьмем Рур и заставим немцев капитулировать.
dialogue_2527=Мы скоординируем действия с американскими войсками на юге и возьмем врага в клещи!
dialogue_2528=Сжимайте кольцо! Враг в ловушке, как легкая добыча!
dialogue_2529=Господин командующий, ведите нас в бой! Мы должны уничтожить окопавшиеся советские войска на западном побережье полуострова!
dialogue_2530=Кроме крепости в Севастополе, весь Крымский полуостров уже в наших руках. Не расслабляться, пока не зачистим последнюю пядь земли!
dialogue_2531=Линии снабжения врага перерезаны, что дает нам явное преимущество в этой войне на истощение.
dialogue_2532=Используйте орудие «Дора», чтобы разбить их бункеры и проложить нам путь!
dialogue_2533=Верховное командование полно решимости взять Ленинград, но это будет кровавая битва. Финская армия поддержит нас ударом с севера.
dialogue_2534=Мы должны рискнуть, снять часть сил с других участков и сконцентрировать удар на озерах, чтобы перерезать линии снабжения врага. Это решит исход всей битвы!
dialogue_2535=Нам нужно начать наступление на востоке, чтобы отвлечь внимание врага и выиграть время для прорыва 6-й армии.
dialogue_2536=Начинаем генеральное наступление! Мы должны взять Сталинград сходу!
dialogue_2537=Мы обязаны отбить Харьков у Советов любой ценой!
dialogue_2538=Передовые части противника оторвались от основных сил! Это идеальная возможность взять их в котел.
dialogue_2539=Используйте высокую маневренность наших танковых дивизий: ударьте по флангам советских войск и перережьте им пути снабжения!
dialogue_2540=Господин командующий, ведите нас вперед! Мы будем планомерно прорывать советскую оборону с юга. По плану наши союзники на севере поддержат нас, и мы возьмем Курск в клещи.
dialogue_2541=Сопротивление врага становится всё более фанатичным!
dialogue_2542=Без них мы не сможем создать никакой угрозы Курску.

