elite_intro_65=Тяжелый танк ИС-3 («Иосиф Сталин») был разработан в СССР в самом конце Второй мировой войны. Он оснащен мощнейшим 122-мм орудием и отличается уникальной конструкцией лобовой брони — «щучьим носом». Благодаря выдающимся показателям бронирования, ИС-3 оставался грозной боевой машиной на протяжении многих лет холодной войны.
elite_intro_66=Wurfrahmen 40, более известная в войсках как «Штука цу Фусс» (Пешая Штука) — это немецкая реактивная система залпового огня, смонтированная на базе полугусеничного бронетранспортера. Система была недорогой в производстве и обеспечивала мобильную, разрушительную огневую поддержку передовых частей по площадям.
elite_intro_67=Французский линкор «Ришелье», названный в честь знаменитого кардинала, обладал уникальной компоновкой: орудия главного калибра (380-мм) размещались в двух четырехорудийных башнях на носу корабля. По уровню бронирования и подводной защиты «Ришелье» был одним из самых совершенных линкоров своего времени, уступая лишь японским гигантам типа «Ямато».
elite_intro_68=Авианосец «Акаги» был гордостью и флагманом 1-го Авианосного флота Императорского флота Японии, символом их военно-морской мощи. Палубная авиация «Акаги» состояла из лучших элитных пилотов. Корабль принимал участие во всех крупнейших операциях японского флота: нападении на Пёрл-Харбор, рейде в Индийский океан и роковой для себя битве при Мидуэе.
elite_intro_70=Американский авианосец USS Enterprise (CV-6), известный под прозвищами «Серый Призрак» и «Большой Э», прошел через всю Тихоокеанскую войну, приняв участие почти во всех крупных морских сражениях. На его счету 71 потопленный и 192 поврежденных вражеских корабля, а также 911 сбитых самолетов противника.

