conquest_event_desc_36=Группа бомбардировщиков под командованием Дулиттла взлетела с авианосца в 650 милях от Японии и нанесла удар по японским городам. Это стало первым ответом Америки на нападение на Пёрл-Харбор.
conquest_event_desc_37=Китай направил экспедиционный корпус в Бирму, чтобы помочь британским войскам остановить наступление японской армии.
conquest_event_desc_38=Китайская армия провела серию ожесточенных сражений с японскими захватчиками за город Чанша. В итоге им удалось отстоять город и сорвать японское наступление.
conquest_event_desc_39=У атолла Мидуэй состоялось колоссальное морское сражение между флотами США и Японии. Японский авианосный флот понес невосполнимые потери.
conquest_event_desc_40=Кровопролитнейшее сражение между вермахтом и Красной Армией в руинах Сталинграда унесло миллионы жизней. Поражение Германии коренным образом изменило баланс сил на Восточном фронте.
conquest_event_desc_41=Норвежские диверсанты и британские коммандос атаковали завод по производству тяжелой воды в Норвегии, разрушив планы нацистов по созданию ядерного оружия.
conquest_event_desc_42=Войска Содружества под командованием Монтгомери нанесли сокрушительное поражение немецко-итальянским силам у Эль-Аламейна, страдавших от острой нехватки топлива и припасов.
conquest_event_desc_43=Высадившись в ключевых портах Северной и Западной Африки, американские войска открыли второй фронт на континенте, оттянув на себя часть сил Роммеля и поддержав британцев.
conquest_event_desc_44=Для восполнения нехватки рабочих рук из-за войны США открыли границы для мексиканских рабочих. Это увеличило доходы Мексики и обеспечило Штаты важнейшими ресурсами и рабочей силой.
conquest_event_desc_45=США улучшили отношения со странами Латинской Америки с помощью «политики доброго соседа». Это побудило многие латиноамериканские страны присоединиться к антигитлеровской коалиции.
conquest_event_desc_46=Вокруг Гуадалканала и соседних островов развернулись многомесячные ожесточенные бои на суше, море и в воздухе между союзниками и Японией.
conquest_event_desc_47=Союзные войска остановили наступление японцев в суровых джунглях и горах Новой Гвинеи на пути Кокода, вынудив врага отступить.
conquest_event_desc_48=Германия и СССР бросили в бой колоссальное количество бронетехники, сойдясь в величайшем танковом сражении в истории — на Курской дуге.
conquest_event_desc_49=Американская разведка расшифровала японские радиограммы и успешно устроила засаду на самолет адмирала Ямамото. Гибель главнокомандующего нанесла тяжелый удар по боевому духу Японии.
conquest_event_desc_50=Высадка на Сицилии кардинально изменила ситуацию на Средиземноморском театре. Это привело к падению режима Муссолини, капитуляции Италии и её объявлению войны Германии.
conquest_event_desc_51=На Каирской конференции лидеры США, Великобритании и Китая подписали совместную декларацию, подтвердив намерение вести войну против Японии до её безоговорочной капитуляции.
conquest_event_desc_52=Лидеры «Большой тройки» (СССР, США, Великобритания) встретились в Тегеране для обсуждения стратегии окончательного разгрома Германии и послевоенного устройства мира.
conquest_event_desc_53=Масштабная скоординированная высадка союзных войск в Нормандии ознаменовала открытие долгожданного Второго фронта в Европе.
conquest_event_desc_54=Союзные десантники под командованием Монтгомери высадились в Нидерландах с целью захвата мостов через Рейн. Однако из-за плохой погоды, ошибок разведки и яростного сопротивления немцев операция провалилась.
conquest_event_desc_55=Используя стратегию «лягушачьих прыжков», США захватывали ключевые острова в Тихом океане, обходя мощные узлы обороны, и вплотную приблизились к Японии.
conquest_event_desc_56=В Филиппинском море состоялось крупнейшее авианосное сражение в истории. Японская палубная авиация понесла катастрофические потери в бою, который американцы иронично назвали «Великой марианской охотой на индюков».
conquest_event_desc_57=Группа немецких офицеров-заговорщиков попыталась убить Гитлера. Хотя взрыв в ставке состоялся, фюрер выжил, а заговорщики были жестоко казнены.
conquest_event_desc_58=В заливе Лейте состоялось грандиозное морское сражение. Объединенный флот Японии был разгромлен союзными силами, после чего навсегда утратил боеспособность.
conquest_event_desc_59=Немецкая баллистическая ракета Фау-2 стала первым в мире оружием такого класса, примененным в бою. Хотя военный ущерб Лондону был незначительным, это оказало огромное психологическое влияние.
conquest_event_desc_60=Немцы нанесли внезапный удар в Арденнах, пытаясь расколоть американо-британский фронт. Несмотря на тяжелые потери в начале операции, союзникам удалось отразить наступление.
conquest_event_desc_61=Болгария, изначально выступавшая на стороне Оси, вовремя оценила ход войны и перешла на сторону антигитлеровской коалиции, что помогло стране избежать масштабных разрушений.
conquest_event_desc_62=Советские войска взяли Будапешт в кольцо. Город обороняли немецкие и венгерские части, оказавшие яростное и фанатичное сопротивление.
conquest_event_desc_63=Красная Армия прорвалась к Вене и вступила в жестокие уличные бои с немецким гарнизоном. Захват столицы Австрии стал тяжелейшим ударом для Рейха.
conquest_event_desc_64=В Ялте состоялась вторая встреча лидеров СССР, США и Великобритании. Они согласовали планы по разделу Германии и послевоенному устройству Европы.
conquest_event_desc_65=Красная Армия начала масштабный генеральный штурм столицы Третьего рейха — Берлина.
conquest_event_desc_66=США, Великобритания и Китай выпустили совместную декларацию с требованием безоговорочной капитуляции Японии, угрожая ей «быстрым и полным уничтожением».
conquest_event_desc_67=Соединенные Штаты в строжайшей секретности собрали лучших ученых мира для создания атомной бомбы. Первое успешное испытание прошло в пустыне Аламогордо.
conquest_event_desc_68=Американская авиация сбросила атомные бомбы на города Хиросима и Нагасаки. Сотни тысяч погибших вынудили Японию объявить о безоговорочной капитуляции.

event_stage_intro_20301=Нам удалось частично расшифровать японские радиограммы. Враг планирует устроить засаду у атолла Мидуэй и уничтожить наши основные силы. Однако авианосец «Йорктаун» прошел экстренный ремонт, а авиабаза на Мидуэе пополнена самолетами. Мы сделали всё, что в наших силах. Теперь осталось лишь дождаться прибытия Объединенного флота.
event_stage_intro_20302=После битвы при Мидуэе Объединенный флот Японии лишился своей мощи. Однако враг начал строить аэродромы на Гуадалканале и Тулаги, чтобы закрепиться на Соломоновых островах. Если мы захватим эти базы, то получим плацдарм для контрнаступления и вернем контроль над регионом.
event_stage_intro_20303=Лишившись поддержки авианосцев, японцы на Новой Гвинее замедлили свое продвижение. Операция «Сторожевая башня» заставила врага оттянуть часть сил на Соломоновы острова. Пришло время для контрудара. Начиная от пути Кокода, мы должны сбросить японские войска в море!
event_stage_intro_20304=Вектор атаки сместился с Новой Гвинеи на Филиппины, но японские базы в центральной части Тихого океана остаются серьезной угрозой. Захват Марианских островов даст нам плацдарм для атаки на Филиппины и откроет путь для ковровых бомбардировок самой Японии.
event_stage_intro_20305=Японский оборонительный периметр прорван, а их Объединенный флот разгромлен в Филиппинском море. Мы полностью господствуем в воздухе и на море в западной части Тихого океана. Час пробил. Мы возвращаемся на Филиппины!
event_stage_intro_20306=Поражение на Иводзиме японцев не остановило. Битва за Окинаву будет еще более кровопролитной — там больше войск, а их сопротивление будет фанатичным. Однако подкреплений с материка они уже не получат.
event_stage_intro_20307=Несмотря на ядерные удары, Япония отказывается капитулировать. Командование приняло решение начать операцию «Даунфол» — полномасштабное вторжение на японские острова. Советские войска нанесут одновременный удар с севера. Это наш последний бой. Победа уже близка!
event_stage_intro_20311=Нам удалось частично расшифровать японские радиограммы. Враг планирует устроить засаду у атолла Мидуэй и уничтожить наши основные силы. Однако авианосец «Йорктаун» прошел экстренный ремонт, а авиабаза на Мидуэе пополнена самолетами. Мы сделали всё, что в наших силах. Теперь осталось лишь дождаться прибытия Объединенного флота.
event_stage_intro_20312=После битвы при Мидуэе Объединенный флот Японии лишился своей мощи. Однако враг начал строить аэродромы на Гуадалканале и Тулаги, чтобы закрепиться на Соломоновых островах. Если мы захватим эти базы, то получим плацдарм для контрнаступления и вернем контроль над регионом.
event_stage_intro_20313=Лишившись поддержки авианосцев, японцы на Новой Гвинее замедлили свое продвижение. Операция «Сторожевая башня» заставила врага оттянуть часть сил на Соломоновы острова. Пришло время для контрудара. Начиная от пути Кокода, мы должны сбросить японские войска в море!
event_stage_intro_20314=Вектор атаки сместился с Новой Гвинеи на Филиппины, но японские базы в центральной части Тихого океана остаются серьезной угрозой. Захват Марианских островов даст нам плацдарм для атаки на Филиппины и откроет путь для ковровых бомбардировок самой Японии.
event_stage_intro_20315=Японский оборонительный периметр прорван, а их Объединенный флот разгромлен в Филиппинском море. Мы полностью господствуем в воздухе и на море в западной части Тихого океана. Час пробил. Мы возвращаемся на Филиппины!
event_stage_intro_20316=Поражение на Иводзиме японцев не остановило. Битва за Окинаву будет еще более кровопролитной — там больше войск, а их сопротивление будет фанатичным. Однако подкреплений с материка они уже не получат.
event_stage_intro_20317=Несмотря на ядерные удары, Япония отказывается капитулировать. Командование приняло решение начать операцию «Даунфол» — полномасштабное вторжение на японские острова. Советские войска нанесут одновременный удар с севера. Это наш последний бой. Победа уже близка!
event_stage_intro_20401=Чтобы вывести Италию из войны, командование решило выбить войска Оси из Средиземноморья. Используя наше превосходство на море и в воздухе, мы должны провести масштабную высадку десанта и захватить Сицилию.
event_stage_intro_20402=Итальянское правительство уже тайно ведет с нами переговоры о капитуляции. Однако немецкая армия предвидела это и давно взяла под свой контроль все ключевые итальянские военные объекты.
event_stage_intro_20403=Операция по дезинформации «Фортитьюд» сработала: немцы не ждут нас в Нормандии, и их укрепления еще не достроены. Мы готовы перевернуть ход войны, открыв Второй фронт в Европе!
event_stage_intro_20404=Немцы разбиты в Нормандии, их оборона во Франции рушится, а мы перебрасываем всё новые силы. Однако возникли проблемы со снабжением. Чтобы решить их, командование приказало захватить порты на юге Франции.
event_stage_intro_20405=Высадки прошли успешно. Теперь командование планирует прорваться вглубь Германии. Наземные войска должны скоординировать действия с воздушным десантом, чтобы захватить мосты через Рейн — последний естественный барьер немцев.
event_stage_intro_20406=Масштабное наступление немцев в Арденнах застало нас врасплох. Но плохая погода замедлила и их продвижение. Мои войска спешно переброшены на север и идут на помощь. Будьте готовы к тяжелому бою.
event_stage_intro_20407=Немцы потеряли своих лучших солдат, но стянули в Берлин последние резервы для отчаянного сопротивления. Оставьте Берлин русским. Продвигайтесь на восток так быстро, как только сможете. Судьба Берлина уже предрешена.
event_stage_intro_20411=Чтобы вывести Италию из войны, командование решило выбить войска Оси из Средиземноморья. Используя наше превосходство на море и в воздухе, мы должны провести масштабную высадку десанта и захватить Сицилию.
event_stage_intro_20412=Итальянское правительство уже тайно ведет с нами переговоры о капитуляции. Однако немецкая армия предвидела это и давно взяла под свой контроль все ключевые итальянские военные объекты.
event_stage_intro_20413=Операция по дезинформации «Фортитьюд» сработала: немцы не ждут нас в Нормандии, и их укрепления еще не достроены. Мы готовы перевернуть ход войны, открыв Второй фронт в Европе!
event_stage_intro_20414=Немцы разбиты в Нормандии, их оборона во Франции рушится, а мы перебрасываем всё новые силы. Однако возникли проблемы со снабжением. Чтобы решить их, командование приказало захватить порты на юге Франции.
event_stage_intro_20415=Высадки прошли успешно. Теперь командование планирует прорваться вглубь Германии. Наземные войска должны скоординировать действия с воздушным десантом, чтобы захватить мосты через Рейн — последний естественный барьер немцев.
event_stage_intro_20416=Масштабное наступление немцев в Арденнах застало нас врасплох. Но плохая погода замедлила и их продвижение. Мои войска спешно переброшены на север и идут на помощь. Будьте готовы к тяжелому бою.
