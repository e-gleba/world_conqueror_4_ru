legend_stage_40106=Итальянская кампания

legend_intro_40101=Британская 7-я бронетанковая дивизия, сформированная из мобильных частей в Египте, получила свое легендарное прозвище «Пустынные крысы» благодаря тушканчику, изображенному на их эмблеме. Во время операции «Компас», начатой генералом Уэйвеллом в декабре 1940 года, дивизия стала главной ударной силой британцев, блестяще используя мобильность своих танков. Они последовательно сокрушали укрепленные базы врага, такие как Бардия и Тобрук. Совершив дерзкий марш-бросок через пустыню, они отрезали пути отхода итальянскому корпусу из Бенгази и взяли десятки тысяч пленных. В этой кампании 7-я бронетанковая дивизия стальным катком прошлась по Киренаике, а имя «Пустынные крысы» навсегда стало символом ужаса для сил Оси в Северной Африке.
legend_intro_40102=В 1941 году британцы начали операцию «Баттлакс», чтобы прорвать осаду Тобрука, окруженного Африканским корпусом Роммеля. «Пустынные крысы» вновь оказались на острие атаки. Продемонстрировав выдающуюся мобильность и натиск, они успешно захватили форт Капуццо и ненадолго прорвали немецкие линии обороны. И хотя операция не увенчалась стратегическим успехом из-за мощных немецких контратак, 7-я бронетанковая дивизия смогла организованно отступить под шквальным огнем. Они сохранили свои основные силы, которые впоследствии сыграли решающую роль в контрнаступлении союзников.
legend_intro_40103=18 ноября 1941 года, извлекши уроки из прошлых неудач, новый главнокомандующий на Ближнем Востоке генерал Окинлек начал операцию «Крусейдер». Целью было уничтожение немецких танков, осаждавших Тобрук, и деблокада города. 7-я бронетанковая дивизия стремительно прорвалась к Сиди-Резегу. Чтобы не допустить деблокады гарнизона, Роммель стянул все свои бронетанковые резервы и обрушился на позиции британцев у аэродрома Сиди-Резег в жесточайшем танковом сражении.
legend_intro_40104=Во время Второй битвы при Эль-Аламейне 7-я бронетанковая дивизия действовала как ударный кулак 8-й британской армии. На начальном этапе сражения дивизия сковывала силы противника на южном фасе фронта. Когда наступление застопорилось, британское командование перебросило дивизию на север, чтобы усилить главный удар. В ходе решающей операции «Суперчардж» 7-я дивизия вместе с другими частями прорвала глубоко эшелонированную немецко-итальянскую оборону и, соединившись с 1-й и 10-й бронетанковыми дивизиями, бросилась в преследование отступающего врага, сыграв ключевую роль в окончательной победе в Египте.
legend_intro_40105=Весной 1943 года во время Тунисской кампании 7-я бронетанковая дивизия пошла на штурм укрепленной Линии Марет. Используя свой опыт пустынной войны, они совершили мастерский фланговый обход по сложнейшему рельефу и ударили немцам в тыл. В битве при Вади-Акарите «Пустынные крысы» вновь показали свой профессионализм, точными ударами танковых клиньев вскрыв итальянскую оборону. Став первым британским подразделением, вошедшим в столицу Туниса, они поставили победную точку в Североафриканской кампании сил Оси.
legend_intro_40106=Осенью 1943 года 7-я бронетанковая дивизия высадилась в Италии и столкнулась с абсолютно новыми условиями: вместо плоских равнин пустыни им предстояло воевать в узких долинах и горах. Однако «Пустынные крысы» доказали, что умеют адаптироваться. Пережив кровавую высадку в Салерно и отбив яростные контратаки немцев, они с боями продвинулись на север и успешно захватили Неаполь. Этот триумф ускорил капитуляцию Италии и еще раз подтвердил их статус элитного ударного соединения.

synergy_tactics_4_1=• При передвижении по пустыне все отряды «Пустынных крыс» тратят на 1 единицу мобильности меньше.
synergy_tactics_4_2=• Артиллерийское подавление: после атаки артиллерии «Пустынных крыс» все враги в радиусе 2 клеток получают эффект «Артиллерийское подавление». Враги с этим эффектом получают на 10% больше урона от любых атак «Пустынных крыс».
synergy_tactics_4_3=• Танковый марш: если бронетехника «Пустынных крыс» уничтожает врага с эффектом «Артиллерийское подавление», она получает +2 к мобильности на следующий ход. Максимальный бонус к мобильности: +20.
synergy_tactics_4_4=• Полевой ремонт: в конце каждого хода вся союзная бронетехника и артиллерия «Пустынных крыс», находящаяся в радиусе 1 клетки от пехоты «Пустынных крыс», восстанавливает 50 ОЗ.

army_buff_desc_1581=Артиллерийское подавление: этот отряд получает на 10% больше урона при атаках подразделений «Пустынных крыс».

