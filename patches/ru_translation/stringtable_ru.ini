armygroup_event_desc_98=Танковые армии Варшавского договора начали яростное наступление на северный берег Рейна. Их цель — прорвать Западную оборонительную линию НАТО за 48 часов.
armygroup_event_desc_99=Объединенный флот НАТО провел масштабную противолодочную операцию в Северном море. Произошло несколько прямых столкновений, в результате которых несколько советских подлодок получили тяжелые повреждения.
armygroup_event_desc_100=Уличные бои вспыхнули одновременно в Восточном и Западном Берлине. Войска ГДР превратили жилые здания и заводы в огневые точки. Западноберлинский гарнизон при поддержке американского десанта попытался пойти на фланговый прорыв. Берлин превратился в самую кровавую мясорубку в Европе.
armygroup_event_desc_101=На рассвете советские ВДВ высадились на аэродроме восточнее Брюсселя, нанеся удар по ключевому узлу снабжения НАТО. Бельгийские и голландские бронетанковые бригады бросились в контратаку. В ходе жесточайшего боя сдетонировала часть одного из крупнейших складов боеприпасов в Европе.
armygroup_event_desc_102=Советская артиллерия обрушила на передовые позиции в Западной Германии чудовищный шквал огня, превратив всю линию фронта в сплошной «пояс пепла».
armygroup_event_desc_103=Силы Варшавского договора стремительно перенесли удар на юго-запад Чехословакии, совершив глубокий танковый прорыв с целью перерезать южную линию снабжения НАТО. Франция и Италия срочно перебрасывают туда силы быстрого реагирования.
armygroup_event_desc_104=Авиация НАТО нанесла точечные удары по Будапешту, важнейшему узлу связи Варшавского договора. Венгерская народная армия немедленно развернула комплексы ПВО. Сотни зенитных ракет озарили ночное небо. В городе на два дня введено военное положение.
armygroup_event_desc_105=Румынская артиллерия совместно с советскими частями возвела глубоко эшелонированную оборону в Карпатах, блокируя подход подкреплений из Италии и южной Германии. Горнострелковым частям НАТО приходится пробиваться по опасным обходным тропам, их логистика на грани коллапса.
armygroup_event_desc_106=НАТО установило морскую блокаду Одессы, пытаясь перерезать южные маршруты снабжения СССР. В ответ силы Варшавского договора запустили противокорабельные ракеты. Радары зафиксировали пуски по всему побережью, что создало огромную нагрузку на систему ПВО Одессы.
armygroup_event_desc_107=Советский Балтийский флот попытался одновременно прорваться из Риги и Калининграда, но был засечен самолетами-разведчиками НАТО, что спровоцировало масштабные морские и воздушные бои на обоих направлениях.
armygroup_event_desc_108=Дальняя авиация СССР нанесла массированный ракетный удар по Лондону. Вдоль южного берега Темзы полыхают пожары. Британский кабинет министров ввел наивысший уровень угрозы; связь с командным центром в Лондоне была временно потеряна.
armygroup_event_desc_109=Оборонная промышленность Великобритании столкнулась с критической нехваткой ключевых компонентов. НАТО экстренно задействует производственные мощности США и Канады, чтобы покрыть дефицит.
armygroup_event_desc_110=Падение Ливерпуля катастрофически сократило возможности снабжения войск НАТО через Атлантику. Командование морских перевозок США временно перенаправляет конвои через Исландию, вынуждая весь Западный фронт перестраивать логистику.
armygroup_event_desc_111=Советская авиация совершила глубокий рейд со стороны Балтийского моря, нанеся тяжелый урон портовой инфраструктуре Гётеборга. ПВО Швеции приведена в полную боевую готовность.
armygroup_event_desc_112=Ударные бригады Варшавского договора оккупировали Копенгаген. Советская армия взяла под полный контроль Датские проливы.
armygroup_event_desc_113=Ракета сил Варшавского договора взорвалась над Елисейскими полями. Ударная волна прокатилась по всему проспекту. Елисейский дворец полностью лишился внешней связи, а президента экстренно эвакуировали в подземный бункер.
armygroup_event_desc_114=Штурмовые части Варшавского договора прорвались к пригородам Брюсселя, создав прямую угрозу штаб-квартире НАТО. Чтобы избежать утечки разведданных, командование инициировало операцию «Наступление ночи», экстренно уничтожив все секретные архивы.
armygroup_event_desc_115=Порт Роттердама подвергся тяжелым ракетно-артиллерийским ударам. Нефтехранилища и контейнерные терминалы превратились в пылающий ад. Пропускная способность портов НАТО критически упала, что привело к тотальным перебоям в снабжении всей линии фронта.
armygroup_event_desc_116=Венеция подвергается ударам с моря и воздуха, проводится эвакуация исторических районов. Итальянская армия несет тяжелейшие потери, пытаясь сдержать бронетанковые клинья, наступающие с востока.
armygroup_event_desc_117=С падением Севастополя Черноморский флот был вынужден полностью отойти на север. В южном оборонительном рубеже Советской армии образовалась зияющая брешь.
armygroup_event_desc_118=Минск пал. Центральный бастион обороны Варшавского договора рухнул. Командование Красной Армии начало экстренную эвакуацию, весь Смоленский коридор охвачен паникой.
armygroup_event_desc_119=Основные силы Советской армии и Войска Польского были разбиты и отброшены к Бресту. Весь западный фланг Варшавского договора остался беззащитным перед ударами врага.
armygroup_event_desc_120=Киев захвачен войсками НАТО. Несколько советских армий вынуждены отступить за Днепр для перегруппировки, оставив огромную брешь на всем южно-центральном направлении фронта.
armygroup_event_desc_121=Лондон пал. На всей территории Великобритании введено военное положение. Потеряв британский плацдарм, западный фланг НАТО оказался на грани коллапса, а прорыв обороны Ла-Манша полностью изменил баланс сил в Северном море и Атлантике.
armygroup_event_desc_122=Варшавский договор применил массированные системы РЭБ на центральноевропейском фронте, полностью ослепив все радары НАТО в радиусе десятков километров.

