skill_info_182=Повышает урон на [#00FF00#%d%%] при командовании пехотными частями. После командования воздушно-десантными пехотными частями получает статус «Прыжок»: при атаке игнорирует 50%% защиты цели и при уничтожении врага наносит 15%% урона противникам в радиусе 1 клетки от цели. (Не действует на море)
skill_info_183=При командовании пехотными частями без дебаффов наносимый урон +[#00FF00#%d%%], а после уничтожения врага восстанавливает 10%% максимального запаса здоровья.
skill_info_184=При командовании бронетанковыми частями, если в радиусе 2 клеток нет дружественных подразделений, атака армии +40%%. Если при командовании бронетанковыми частями в радиусе 2 клеток есть вражеские подразделения, урон от контратаки +[#00FF00#%d%%].
skill_info_185=При командовании пехотными частями критический урон +[#00FF00#%d%%], шанс критического удара +10%% для себя и пехоты в радиусе 1 клетки.
skill_info_186=При командовании бронетанковыми частями атака не снижается с уменьшением здоровья. Когда здоровье подчинённых бронетанковых частей ниже 50%%, атака +[#00FF00#%d], защита +20.
skill_info_187=При командовании бронетанковыми частями игнорирует [#00FF00#%d%%] защиты противника, а также снижение урона от местности и генеральских лент. После уничтожения врага мобильность +3 в следующем ходу. При командовании бронетанковыми частями за каждые 2 единицы мобильности шанс критического удара повышается на 1%%, а критический урон — на 3%%.
army_buff_desc_1801=Прыжок: игнорирует 50% защиты цели при атаке. При уничтожении цели наносит 15% урона противникам в радиусе 1 клетки от цели. (Не действует на море)
