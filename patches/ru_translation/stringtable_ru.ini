feat_desc_43_Lv3=Позволяет действовать повторно. Мобильность +{2}. Перезарядка: 1 ход. Если вторым действием уничтожен враг, есть шанс {1}% атаковать снова (срабатывает только 1 раз за ход).
feat_desc_46_Lv3=Шанс критического удара +{1}%. Действует 1 ход, перезарядка: 2 хода.
feat_desc_47_Lv4={1} Восстанавливает выбранному союзнику 100 ОЗ каждый ход в течение 2 ходов. При использовании навыка отряд также восстанавливает {2} ОЗ себе. Перезарядка: 1 ход.
feat_desc_49_Lv3=Урон по наземным целям с полным запасом ОЗ увеличен на {1}%.
feat_desc_50_Lv3=Урон по вторичным целям не снижается. Критический урон увеличен на {1}%, базовый урон +{2}%.
feat_desc_51_Lv3=Дальность атаки +2 на этот ход. Наносит дополнительный урон, отнимая {1}% ОЗ у целевого города или крепости (макс. 1200) и {2}% ОЗ у гарнизона (макс. 500). Перезарядка: 2 хода.
feat_desc_52_Lv3=При получении урона от наземных или морских сил есть {0}% шанс уклониться. Действует 1 ход, перезарядка: 2 хода.
feat_desc_53_Lv3=Урон по бронетехнике и артиллерии увеличен на {1}%. Действует 1 ход, перезарядка: 2 хода.
feat_desc_54_Lv3=Урон по артиллерии увеличен на {1}%. Действует 1 ход, перезарядка: 2 хода.
feat_desc_55_Lv3=Стоимость производства авиации снижена на 1%.
feat_desc_56_Lv3={0}% шанс снизить боевой дух вражеского отряда и такой же шанс поджечь клетку с целью.
feat_desc_57_Lv3=Позволяет перебросить по воздуху пехоту, бронемашины, полевую артиллерию или гаубицы в выбранную точку. При транспортировке отряд восстанавливает {1}% ОЗ и игнорирует огонь ПВО.
feat_desc_58_Lv3=Урон по всем типам кораблей увеличен на {1}%.
feat_desc_59_Lv3=Урон по крепостям увеличен на {1}%, урон по наземным отрядам увеличен на {2}%.
feat_desc_60_Lv3=Устанавливает 2 морские контактные мины в радиусе 2 клеток. Перезарядка: 1 ход.
feat_desc_61_Lv3=При следующей атаке поражает 2 дополнительных врагов вокруг основной цели. Перезарядка: 2 хода.
feat_desc_62_Lv3=Урон по целям в состоянии паралича или хаоса увеличен на 200%. Повергает врагов в радиусе 1 клетки в хаос на 1 ход. Перезарядка: 3 хода (если поражено 2 или более целей, перезарядка сокращается до 1 хода).
feat_desc_63_Lv4=Урон по городским укреплениям увеличен на {1}%.
feat_desc_64_Lv3=Избыточный шанс критического удара конвертируется в урон: за каждые {2}% шанса свыше 100% наносится {1}% дополнительного урона.
feat_desc_65_Lv3=Игнорирует {1}% защиты противника.
feat_desc_66_Lv3=Урон по бронетехнике увеличен на {1}%. Действует 1 ход, перезарядка: 2 хода.
feat_desc_67_Lv4=Урон при ответном огне увеличен на {1}%.
feat_desc_68_Lv4=Если цель уничтожена, есть шанс {0}% на повторное действие (до {2} раз за ход).
feat_desc_69_Lv3=Если союзник в радиусе 1 клетки атакует врага, есть шанс {0}% присоединиться к атаке с увеличением урона на {1}% (не работает при эффектах навигации).
feat_desc_70_Lv3=При атаке наносит {1}% дополнительного урона врагам в радиусе 1 клетки от цели. Перезарядка: 2 хода.
feat_desc_71_Lv4=После каждой атаки в течение хода урон от следующей атаки возрастает на 20% (складывается до 3 раз).
feat_desc_72_Lv4=Позволяет использовать большинство самолетов на аэродроме (кроме транспортных) с лимитом очков авиации: {1}.
feat_desc_73_Lv4=Урон палубной авиации по бронетехнике увеличен на {1}%.
feat_desc_74_Lv4=Шанс {1}% уничтожить ПВО города и шанс {2}% проигнорировать снижение урона от зенитного огня.
feat_desc_75_Lv3=Повышает боевой дух союзников в радиусе 1 клетки от цели. Их урон увеличивается на {1}% на 3 хода.
feat_desc_76_Lv4=Дальность атаки становится равна 3. Атака бьет по площади, поджигает цель со 100% вероятностью и имеет шанс {1}% заблокировать ответный огонь врага на 1 ход. Перезарядка: 2 хода.
feat_desc_78_Lv3=Игнорирует эффекты уклонения и дымовых завес. Урон по городским укреплениям увеличен на 1%.
feat_desc_79_Lv4=Выпускает дымовую гранату, скрывающую отряд от наземных атак. Дает {1}% шанс на дополнительную атаку и 50% шанс проигнорировать уклонение врага. Действует 1 ход. Перезарядка: 2 хода.
feat_desc_80_Lv4=Находясь под прикрытием дымовой завесы, отряд игнорирует {1}% защиты противника.
feat_desc_81_Lv4=Позволяет запускать ракеты с термоядерными боеголовками. Изначальный боезапас: 2. Восстанавливает 1 боеголовку каждые {1} ходов.
feat_desc_82_Lv4=Позволяет запускать МБР до 2 раз за ход вместо обычной атаки.
feat_desc_83_Lv4=Отряд не может быть атакован наземными силами. Получаемый урон от авиации снижен на {1}%.
feat_desc_84_Lv4=Наносит кинетический удар по прямой на дистанцию {1} клеток (цель должна быть на открытой местности, блокируется авиацией), нанося урон всем на линии огня. Перезарядка: 1 ход. Если кинетический удар уничтожает цель, можно нанести еще один подавляющий удар (до {2} раз за раунд).
feat_desc_85_Lv2=Может взлетать в радиусе 1 клетки от авианосца. Игнорирует штрафы местности к мобильности, невосприимчив к наземным и морским минам. Враг не может открыть ответный огонь. Боевая эффективность не падает при снижении ОЗ. Урон по наземным целям увеличен на {1}%.
feat_desc_89_Lv3=Прокладывает туннель на расстояние до 7 клеток (нельзя строить в горах и на воде). Пехота, танки, РСЗО, БТР и артиллерия могут перемещаться по туннелю, получая после выхода дополнительное действие (макс. 5 раз на туннель). При постройке нового туннеля старый исчезает. Перезарядка: 2 хода.
feat_desc_90_Lv4=Здания в радиусе 2 клеток восстанавливают {1} ОЗ. Срабатывает один раз за раунд.
feat_desc_92_Lv4=Дальность атаки +1. За каждые потерянные {1} ОЗ урон отряда возрастает на {2} ед.
feat_desc_93_Lv4=Боевая эффективность не падает при потере ОЗ. При получении смертельного урона ОЗ не опускается ниже 1 в течение 3 ходов. По окончании действия щита восстанавливает 30% ОЗ. Перезарядка: {2} ходов.
feat_desc_94_Lv4=При нахождении на своей или союзной территории первая атака за ход наносит на {1}% больше урона, дальность атаки +1.
feat_desc_95_Lv4=Игнорирует штрафы к мобильности и защитные бонусы местности у противника. Снижает защиту и мобильность цели на 1%.
feat_desc_96_Lv4=Получаемый прямой урон распределяется между отрядом и союзниками вокруг. За каждую {1} ед. распределенного или заблокированного урона базовая атака возрастает на {2} ед. (макс. бонус +300%).
feat_desc_97_Lv4={1}% шанс уклониться от урона при атаке авиации.
feat_desc_98_Lv4=Переходит в состояние маскировки (невидим для наземных и морских сил). Мобильность +{1}. Действует 1 ход, не спадает после атаки. Перезарядка: 2 хода.
feat_desc_99_Lv4=Блокирует ответный огонь. Урон по вражеским отрядам увеличен на {1}% (в состоянии маскировки на {2}%). Урон по зданиям снижен на 50%.
feat_desc_100_Lv3=Вызывает вертолет для переброски в любую точку в радиусе 9 клеток. Не тратит очки авиации. Применяется 1 раз за ход. Перезарядка: 2 хода.
feat_desc_102_Lv4=Шанс критического удара +{1}%, игнорирует {2}% защиты цели. За каждого убитого в этом ходу врага шанс крита растет на 4%. Перезарядка: 2 хода.
feat_desc_103_Lv4=Защита увеличена на {1}%, урон от вражеской авиации снижен на {2}%.
feat_desc_105_Lv4=Каждая атака наносит 1% дополнительного урона по целевой области.
feat_desc_106_Lv4=Урон от ядерных ударов увеличен на 1%.
feat_desc_107_Lv4=В этом ходу при атаке наносит {1}% дополнительного урона врагам в радиусе 1 клетки от цели. Перезарядка: 2 хода.
feat_desc_108_Lv4=Атакует по площади. Урон по бронетехнике и артиллерии увеличен на 1%. Может атаковать повторно после уничтожения цели.
feat_desc_109_Lv3=Снимает большинство положительных эффектов с врагов в радиусе 2 клеток и резко снижает их боевой дух. Перезарядка: 2 хода.
feat_desc_110_Lv4=При нахождении в горах или лесах получаемый урон снижен на {1}%.
feat_desc_111_Lv4=Запускает серию дальнобойных ракет: наносит {1}% урона основной цели и {2}% урона врагам вокруг неё. Перезарядка: 2 хода.
feat_desc_117_Lv4=Все атаки наносят критический урон.

feat_desc_121=При захвате вражеского города боевой дух ваших и союзных войск в радиусе 3 клеток повышается на 2 хода.
feat_desc_122=Союзники в радиусе 2 клеток восстанавливают {1} ОЗ после получения прямого урона.
feat_desc_123=За каждый {1}% потерянных ОЗ получаемый урон снижается на {2}% (максимум до 25%).
feat_desc_124=Перенаправляет {1}% полученного прямого урона на врагов в радиусе 1 клетки.
feat_desc_125=Защита союзников в радиусе 2 клеток увеличена на {1}%.
feat_desc_126=При нанесении урона наземному врагу есть шанс {0}%, что урон перекинется на любую цель в радиусе 1 клетки (кроме атакующего).
feat_desc_127=За каждую {1} ед. защиты цели наносимый ей урон увеличивается на {2}%.
feat_desc_128=Атака накладывает на врага эффект: цель теряет 10% от текущего запаса ОЗ каждый ход (длится 2 хода).
feat_desc_129=Урон возрастает на {1}% за каждого уничтоженного врага. Складывается до {2} раз, длится 2 хода.
feat_desc_130=Находясь под дымовой завесой, дальность атаки врагов в радиусе 2 клеток снижается до {1} (если враг игнорирует дым, эффект не работает).
feat_desc_131=На своей или союзной территории мобильность +{1}.
feat_desc_132=После высадки десанта урон в текущем ходу увеличен на {1}%.
feat_desc_133=Если отряд не двигался в этом ходу, мобильность на следующий ход +{1}.
feat_desc_134=Можно перебрасывать транспортными самолетами.
feat_desc_135=Запускает торпеды максимум по {1} целям в радиусе 2 клеток. Перезарядка: 2 хода.
feat_desc_136=Восстанавливает {1}% ОЗ в конце каждого раунда.
feat_desc_137=Игнорирует уклонение, дымовые завесы, маскировку и РЭБ.
feat_desc_138=Урон по цели увеличен на {1}%.
feat_desc_139=При бомбардировке игнорирует {1}% защиты цели.
feat_desc_140=В начале хода снижает мобильность врагов в радиусе 1 клетки на {1}%.

army_buff_desc_1023=Снайперский огонь: шанс критического удара +90%.
army_buff_desc_1043=Мега-орудие: дальность атаки +2, наносит дополнительный урон по фортификациям и гарнизонам.
army_buff_desc_1053=Наклонная броня: 100% шанс уклониться от урона.
army_buff_desc_1063=Убийца брони: в этом ходу урон по бронетехнике и артиллерии увеличен на 55%.
army_buff_desc_1073=Охотник на артиллерию: в этом ходу урон по артиллерии увеличен на 65%.
army_buff_desc_1083=Истребитель танков: в этом ходу урон по бронетехнике увеличен на 65%.
army_buff_desc_1093=Огневое подавление: наносит дополнительный удар по 2 случайным врагам в радиусе 1 клетки.
army_buff_desc_1202=Экстренная реанимация: восстанавливает 100 ОЗ за ход.
army_buff_desc_1253=Ковровое бомбометание: наносит 100% урона целям в радиусе 1 клетки от эпицентра.
army_buff_desc_1304=Ракетный удар: дальность атаки равна 3, бьет по площади, 100% шанс заблокировать ответный огонь.
army_buff_desc_1314=Дымовая завеса: защищает от атак с земли и моря. Дает 100% шанс на дополнительную атаку и 50% шанс проигнорировать уклонение врага.
army_buff_desc_1323=Сплоченность: атака увеличена на %d.
army_buff_desc_1332=Защитный экран: ОЗ не опускается ниже 1. При окончании действия восстанавливает 30% ОЗ.
army_buff_desc_1364=Снаряды с обедненным ураном: шанс крита +50%, игнорирует 70% брони. Каждое сражение увеличивает шанс крита на 4%.
army_buff_desc_1374=Ракеты Hellfire: наносят 100% урона всем целям в радиусе 1 клетки от основной.
army_buff_desc_1421=Непрерывное подавление: отряд теряет 10% ОЗ каждый ход.
army_buff_desc_1431=Усиление огневой мощи: атака увеличена на %d%%.
army_buff_desc_1441=Визуальные помехи: дальность атаки снижена до 1.
army_buff_desc_1451=Быстрое развертывание: наносимый урон увеличен на 100%.
army_buff_desc_1481=Воздушно-десантный штурм: атака увеличена на 10%.


