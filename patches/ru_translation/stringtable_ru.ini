event_stage_intro_20601=Немецкая армия в Сталинграде находится в конце своего пути. Каждое здание - наша крепость и опорный пункт, и этот героический город удерживал самые ожесточенные немецкие атаки! Наши войска собираются, и наша сила и сила врага перевернулись. Приближается время контрнаступления.
event_stage_intro_20602=Немцы восстановили Харьков. разведывательные данные указывают на то, что они собирают большое количество бронетанковых подразделений, намереваясь начать масштабное наступление для ликвидации наших защитников в Курском выступа. Мы построим несколько сильных оборонительных линий и разместим большое количество войск в этих оборонительных глубинах, чтобы застать немцев врасплох.
event_stage_intro_20603=Немцы постоянно укрепляют обе стороны Днепра, но массивная линия обороны никогда не будет завершена в ближайшее время. воспользуйтесь этой возможностью, чтобы начать крупное наступление в Нижнем Днепре, чтобы взять Киев и продолжить линию на запад.
event_stage_intro_20604=Войска врага сгруппировались вокруг Ленинграда, и героический город, осажденный почти три года, вот-вот будет полностью освобожден, но немцы установили сильную линию обороны на западе.
event_stage_intro_20605=Крым имеет большую военную ценность как для немцев, так и для нас. Пробивая оборону перед нами, мы сможем изолировать весь Крым по суше и одновременно начать атаку с севера и востока Керченского полуострова. Поражение врага - это только вопрос времени, и крепость Севастополь в конечном итоге будет отбита.
event_stage_intro_20606=После Курского, Нижнего Днепра и Крымского наступлений, группа армий Центр была разоблачена.В то же время немцы, введенные в заблуждение нашими обманчивыми действиями, перебросили часть своих сил в группу армий Северная Украина на юге.Войска были собраны, и теперь пришло время атаковать на всех фронтах и заставить врага заплатить за глупость, которую они совершили три года назад!
event_stage_intro_20607=Союзники на Западном фронте задерживаются перед Рейном, а немцы собирают свои последние силы на Восточном фронте в подготовке к борьбе на смерть.Но враг потерял все свои элитные силы, поэтому мы должны быстро продвинуться на запад, чтобы присоединиться к союзникам на Западном фронте как можно скорее.Судьба Берлина запечатана.
event_stage_intro_20611=Немецкая армия в Сталинграде находится в конце своего пути, каждое здание - наша крепость и опорный пункт, и этот героический город удерживал самые ожесточенные немецкие атаки!
event_stage_intro_20612=Немцы восстановили Харьков. разведывательные данные указывают на то, что они собирают большое количество бронетанковых подразделений, намереваясь начать масштабное наступление для ликвидации наших защитников в Курском выступа. Мы построим несколько сильных оборонительных линий и разместим большое количество войск на этой оборонительной глубине, чтобы застать немцев врасплох.
event_stage_intro_20613=Немцы постоянно укрепляют обе стороны Днепра, но массивная линия обороны никогда не будет завершена в ближайшее время. воспользуйтесь этой возможностью, чтобы начать крупное наступление в Нижнем Днепре, чтобы взять Киев и продолжить линию на запад.
event_stage_intro_20614=Войска сплотились вокруг Ленинграда, и героический город, осажденный почти три года, вот-вот будет полностью освобожден, но немцы установили сильную линию обороны на западе.
event_stage_intro_20615=Крым имеет большую военную ценность как для немцев, так и для нас. Пробивая оборону перед нами, мы сможем изолировать весь Крым по суше и одновременно начать атаку с севера и востока Керченского полуострова. Поражение врага - это только вопрос времени, и крепость Севастополь в конечном итоге будет отнята нами.
event_stage_intro_20616=После Курской, Нижней Днепрской и Крымской наступательных действий, Heeresgruppe Mitte была разоблачена.В то же время немцы, введенные в заблуждение нашими обманчивыми действиями, перебросили часть своих сил в Heeresgruppe Nordukraine на юге.Войска были собраны, и теперь пришло время атаковать на всех фронтах и заставить врага заплатить за глупость, которую они совершили три года назад!
event_stage_intro_20617=Союзники на Западном фронте задерживаются перед Рейном, а немцы собирают свои последние силы на Восточном фронте в подготовке к борьбе на смерть.Но враг потерял всю свою элиту, и мы должны быстро продвинуться на запад, чтобы присоединиться к союзникам на Западном фронте как можно скорее.Судьба Берлина была запечатана.

dialogue_2900=Бой на близком расстоянии настолько эффективен, что немцы находятся в пределах одного дюйма от своей жизни внутри города.
dialogue_2901=Начните атаку на позиции румынской армии на немецком фланге, пробивайтесь через обороны врага и полностью окружите 6-ю группу армий Паулюса.
dialogue_2902=Неожиданно, что у советских войск еще достаточно войск для начала масштабного нападения.Немедленно укрепите направление Сталинграда и скажите Паулюсу вывести свои войска из Сталинграда.
dialogue_2903=Бронированные группировки противника поднялись по Дону в сторону Сталинграда.Я сделаю все возможное, чтобы их отдержать.
dialogue_2904=Мы прорвали румынскую оборону, завершите это окружение и полностью уничтожите немецкую армию в Сталинграде.
dialogue_2905=Паулюс не смог сбежать с самого начала, спасательная операция провалилась, отступить на запад и реорганизовать оборонительную линию.
dialogue_2906=У нас нет места для отступления.
dialogue_2907=Начните атаку на немецкие позиции, препятствуйте наступлению противника.
dialogue_2908=Не бойтесь советской артиллерии, продолжайте операцию "Цитадель", пробивайтесь через советскую оборону на севере и юге.
dialogue_2909=Мы должны остановить немецкий прорыв в направлении Белгорода любой ценой.
dialogue_2910=Задержите немецкие атаки на севере и юге, выиграйте время для решения проблемы Орловского выступа!
dialogue_2911=Орёл был потерян, и советским войскам не потребовалось много времени, чтобы начать новое наступление.
dialogue_2912=Немедленно отступите и реорганизуйте оборонительную линию к востоку от Брянска.
dialogue_2913=Число советских войск намного превысило наши ожидания, и мои бронетанковые части понесли тяжелые потери и больше не могли продолжать атаку.
dialogue_2914=Езжайте на волне победы, восстанавливайте Белгород и Харьков.
dialogue_2915=Немцы установили несколько мостовых голов вдоль реки Днепр.
dialogue_2916=Быстро разойдите немецкие войска на левом берегу, разверните наши силы вдоль Днепра и начните масштабное полномасштабное наступление.
dialogue_2917=Позиции на левом берегу терялись одна за другой, и мы были слишком поздно, чтобы построить новые укрепления.
dialogue_2918=Эта естественная линия обороны не должна быть легко прорвана советскими войсками.
dialogue_2919=Мы восстановили Киев, и путь открыт для атаки с запада.
dialogue_2920=Мы перебросили большое количество войск с Ладожского озера на периметр Ленинграда, готовых атаковать в любой момент.
dialogue_2921=Оборонная система вокруг Нарвы уже более полная, и мы можем с этой линией удержать советские атаки на севере.
dialogue_2922=Немецкие войска к северу от Ленинграда были ликвидированы, но морская граница все еще блокируется немецким флотом, и моим войскам потребуется некоторое время, чтобы достичь фронта.
dialogue_2923=Угроза на море устранена, и мои войска начнут тотальную атаку на последние немецкие оборонительные сооружения.
dialogue_2924=Советские войска были в меньшинстве и атаковали более яростно, чем ожидалось.Защитники в крепостных укреплениях вокруг Ленинграда были проинформированы о отступлении к оборонительной линии у Нарвы.
dialogue_2925=Штаб не одобрил наш план вывода, советские войска вторгаются в Крым.
dialogue_2926=Не давайте немцам шанс надышаться, продолжить атаку и отрезать сухопутный маршрут из Крыма в остальную Европу.
dialogue_2927=Отступить к Херсону и реорганизовать оборонительную линию, остановить советское наступление вдоль Днепра.
dialogue_2928=Мои войска продолжат наступление на западе и вытеснят немцев обратно на правый берег Днепра.
dialogue_2929=Нападите на крепости в Севастополе, не дайте ни одному немцу сбежать.
dialogue_2930=Немцы по-прежнему отправляют войска в Крым, и необходимо уничтожить морские пути противника.
dialogue_2931=Враг ошибочно догадался, в каком направлении будет идти наше главное наступление, поэтому воспользуйтесь этой возможностью, чтобы быстро окружить и уничтожить немецкие войска вокруг Минска.
dialogue_2932=Советское продвижение было слишком быстрым, и мои войска немедленно уйдут, чтобы поддержать полную скорость в направлении Минска.
dialogue_2933=Мы достигли главной цели операции, а немецкая оборона также рухнула. воспользуйтесь этой возможностью, чтобы продолжить быстрое продвижение на запад.
dialogue_2934=Советские войска также начали наступление на севере, подкрепления были направлены в направлении Риги, и врагу не должно быть позволено легко получить доступ к морской границе.
dialogue_2935=Немцы отступают, а враг просто не может выдержать нашу приливную волну атак!
dialogue_2936=Мы упустили лучший момент для стратегической обороны, но как солдат я буду сражаться за свою страну до конца.
dialogue_2937=Встречайтесь с армией США и разорвете вражеские защитники на части.
dialogue_2938=Немецкие войска готовы сражаться с нами до конца, продолжайте атаку на Берлин, мои войска уберут препятствия на севере.
dialogue_2939=Продолжайте атаку и уничтожайте все немецкие войска, которые все еще сопротивляются!
dialogue_2940=Линии обороны были прорваны во всех точках, и войска союзников движутся в Берлин.
dialogue_2941=Мои войска будут продолжать бороться до последней минуты.
dialogue_2942=Мой провал ничего не значит, Берлин обречен на падение.
dialogue_2943=Союзникам удалось освободить лагерь военнопленных.Мы свободны!Продолжайте атаку и уничтожайте немцев!

