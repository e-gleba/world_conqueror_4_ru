elite_intro_72=P-40 — американский одноместный одномоторный поршневой истребитель-моноплан. На азиатском театре военных действий эскадрилья «Летающие тигры», основанная американским генералом Клэром Шеннолтом, успешно летала на P-40 против превосходящих сил японской армии. Знаменитая акулья пасть, нарисованная на носу фюзеляжа, стала самым узнаваемым символом P-40.

