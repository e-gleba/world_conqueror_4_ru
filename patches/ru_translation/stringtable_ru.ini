elitepass_desc=Премиум-пропуск открывает платную ветку наград. Для их получения потребуется повышать уровень пропуска, выполняя задания. При покупке Ультимативного пропуска вы мгновенно получите 600 бонусных очков и фрагменты Элитных войск. Внимание: вы можете приобрести только один из двух пропусков на сезон!
