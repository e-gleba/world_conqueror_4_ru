armygroup_event_desc_123=Советские войска перехватили инициативу, прорвали ледовую блокаду в северной части Берингова пролива, высадились на Аляске и захватили Ном.
armygroup_event_desc_124=Силы НАТО во главе с США, Великобританией и Францией начали наступление на Северную Корею при поддержке армий Японии и Южной Кореи. Корейская народная армия оказала фанатичное сопротивление. В это же время СССР стягивает на Дальний Восток огромные резервы, чтобы удержать линию фронта вокруг Советской Гавани.
armygroup_event_desc_125=Воспользовавшись хаосом, «Черный Скорпион» задействовал свои спящие ячейки на Дальнем Востоке и Аляске. В координации с лояльными группировками они нанесли серию болезненных ударов по тылам враждующих сверхдержав.
armygroup_event_desc_126=Флоты США, Великобритании, Австралии и СССР, преследуя корабли Скорпиона в Беринговом море, попали в аномальную электромагнитную бурю. В самом ее центре обнаружился неизвестный ранее остров с высокотехнологичной базой. В ту же минуту Тихоокеанский штаб Скорпиона был взят в осаду многонациональной эскадрой.
armygroup_event_desc_127=Объединенные оперативные группы США, Великобритании, Австралии и СССР нанесли скоординированный ракетно-бомбовый удар по базам Скорпиона в акватории Берингова моря, стерев с лица земли несколько мощных укрепрайонов.
armygroup_event_desc_128=После уничтожения командного центра Легиона «Мороз», Арктический добровольческий корпус остался без финансирования и военной поддержки. Оказавшись в безвыходном положении, они капитулировали и вернулись в состав Варшавского договора.
armygroup_event_desc_129=Цепочка командования Легиона «Вечная ночь» рухнула, погрузив Северо-восточный альянс свободы в полнейший хаос. Массовое дезертирство заставило остатки Альянса сложить оружие и перейти на сторону НАТО.
armygroup_event_desc_130=Оказавшись в полном окружении многонациональной коалиции, Тихоокеанский фронт освобождения был вынужден сдаться и интегрироваться в структуру НАТО.
armygroup_event_desc_131=Стремительное возрождение Империи Скорпиона заставило США и СССР объединить усилия перед лицом глобальной угрозы. НАТО и Варшавский договор объявили о перемирии и создании новой объединенной коалиции.
armygroup_event_desc_132=Осборн потерпел сокрушительное поражение, а планы Черного Скорпиона на Дальнем Востоке были окончательно сорваны. Однако недобитые ячейки организации всё еще скрываются в глуши, представляя постоянную угрозу для региона.
armygroup_event_desc_133=Советский летчик угнал новейший сверхсекретный перехватчик МиГ-25 «Фоксбэт» и приземлился в Японии. США предоставили ему политическое убежище. Американские и японские инженеры разобрали самолет до винтика, чтобы завладеть советскими технологиями.
armygroup_event_desc_134=Около полудня небо над Якутией внезапно почернело и оставалось таким несколько часов. Плотный дым от катастрофических лесных пожаров ветром отнесло на восток, что парализовало действия авиации и войск в зоне конфликта.
armygroup_event_desc_135=В ответ на советское вторжение на Аляску войска США и Канады перешли в масштабное контрнаступление. К северу от Анкориджа завязались тяжелые встречные бои, значительно ослабившие ударный потенциал советского наступления.
armygroup_event_desc_136=Северо-восточный альянс свободы, тайно спонсируемый Скорпионом, ударил в спину американским войскам, одновременно атаковав авиабазу Фэрбенкс и порт Анкоридж. В то же время советская армия начала лобовой штурм, стремясь захватить Аляску.
armygroup_event_desc_137=В районе реки Подкаменная Тунгуска прогремел новый колоссальный взрыв. Ударная волна от метеорита повалила сотни гектаров тайги. Несколько дней подряд ночное небо над Азией и Европой светилось жутким багровым светом. Спутники зафиксировали необъяснимые аномалии в зоне эпицентра.
armygroup_event_desc_138=Спецназ Великобритании и Франции обнаружил и уничтожил секретный узел связи Скорпиона на Курильских островах. Это полностью парализовало координацию между Легионом «Темный прилив» и Тихоокеанским фронтом.
armygroup_event_desc_139=В районе острова Святого Лаврентия в Беринговом проливе развернулось колоссальное морское и воздушное сражение между флотами США и СССР. В небе столкнулись сотни истребителей и бомбардировщиков.
armygroup_event_desc_140=Затяжная война спровоцировала жестокие политические чистки как в США, так и в СССР. Паранойя и поиск шпионов, а также агентов Скорпиона внутри собственных рядов, привели к волне ложных доносов и расстрелам невиновных.
armygroup_event_desc_141=Советская атомная подводная лодка с ядерным оружием на борту, направлявшаяся в Берингово море, внезапно разорвала связь с командованием и легла на курс к Острову-призраку, контролируемому Скорпионом.
armygroup_event_desc_142=Перед отступлением из Саппоро бойцы Легиона «Темный прилив» устроили диверсию на местной АЭС. В океан хлынули тонны радиоактивной воды, что вызвало массовую гибель морской фауны и привело к закрытию портов на долгие годы.
armygroup_event_desc_143=При поддержке авиации союзников советская армия начала штурм стратегической ракетной базы в районе Магадана, которую удерживал Арктический добровольческий корпус. Город охвачен кровавыми уличными боями.
armygroup_event_desc_144=Тихоокеанский фронт освобождения нанес скоординированный удар к югу от Саппоро и в районе Хакодате, перерезав транспортное сообщение между Хоккайдо и главным японским островом Хонсю.
armygroup_event_desc_145=Армия Южной Кореи, под руководством американских военных советников, нанесла неожиданный удар по Советской Гавани — важнейшему дальневосточному порту СССР на побережье Татарского пролива.
armygroup_event_desc_146=На полуострове Камчатка одновременно проснулись несколько вулканов. Потоки раскаленной лавы, текущие прямо по ледникам, парализовали передвижение войск всех сторон конфликта.
armygroup_event_desc_147=Серия мощных землетрясений сотрясла Аляску и Берингово море. Гигантское цунами обрушилось на побережье, смыв в океан военные базы, радары и технику.
armygroup_event_desc_148=Аномальное северное сияние вспыхнуло над Фэрбенксом. Все электронные приборы в зоне его действия, включая радары систем ПВО и электронику истребителей, полностью вышли из строя.
armygroup_event_desc_149=Аномальный арктический циклон накрыл Чукотку, вызвав катастрофическое падение температуры. Армии всех сторон пытались бороться с обморожениями, но потери в личном составе и технике оказались колоссальными.
armygroup_event_desc_150=Перед лицом угрозы советских стратегических бомбардировщиков и баллистических ракет, США и Канада объединили свои системы раннего предупреждения, протянув радарную сеть от Аляски до глубинки Канады. Так родилось Командование воздушно-космической обороны Северной Америки (NORAD).
armygroup_event_desc_151=Гонка вооружений дала колоссальный толчок развитию электроники, вычислительной техники и аэрокосмической отрасли. Эти военные технологии стали внедряться в гражданский сектор через технопарки в Калифорнии, что обеспечило США неоспоримое технологическое и экономическое доминирование.
armygroup_event_desc_152=Через Совет экономической взаимопомощи (СЭВ) СССР направил масштабную экономическую и энергетическую поддержку Монголии и Северной Корее, укрепив экономические связи и зацементировав влияние социалистического лагеря на Дальнем Востоке.


event_4114=Операция «Зонненблюм»
event_4115=Третья битва за Харьков
event_4116=Весеннее наступление
event_4117=Сражение у мыса Матапан
event_4118=Операция «Кикусуй-1»
event_4119=Битва за Голландию

event_intro_4114=Видя катастрофическое положение итальянской армии в Северной Африке, 6 февраля 1941 года немецкое верховное командование решило вмешаться, чтобы спасти союзника от полного разгрома. В последующие месяцы немецкие войска (позже объединенные в знаменитый Африканский корпус) волнами прибывали в Ливию, остановив паническое бегство итальянцев. Решение генерала Роммеля немедленно перейти в контрнаступление увенчалось блестящим тактическим успехом, однако чрезмерно растянутые линии снабжения предвещали долгую и изнурительную войну на истощение.
event_intro_4115=После триумфа под Сталинградом советские войска, стремясь развить успех, стремительно рвались на запад. Однако фельдмаршал фон Манштейн проявил тактический гений: он отказался от жесткой позиционной обороны, позволил советскому Юго-Западному фронту опрометчиво вырваться вперед, а затем ударил во фланги мощными танковыми клиньями. Разгромив советские передовые части, Манштейн повернул на север и после ожесточенных уличных боев отбил Харьков. Операция, начавшаяся 19 февраля 1943 года, нанесла Красной Армии тяжелые потери, но не смогла кардинально изменить расстановку сил на Восточном фронте. Однако именно в результате этой битвы образовался «Курский выступ», ставший ареной величайшего танкового сражения несколько месяцев спустя.
event_intro_4116=К марту 1941 года итало-греческая война зашла в глухой позиционный тупик. 9 марта итальянский диктатор Муссолини лично отдал приказ о начале «Весеннего наступления», надеясь поднять боевой дух армии и выбить греческие войска из оккупированной итальянцами Албании. В ходе этой операции итальянская артиллерия обрушила на узкий участок фронта более 100 000 снарядов, а потери составили свыше 10 000 человек, но прорвать греческую оборону так и не удалось. Провал этого наступления вынудил Германию вмешаться в балканский конфликт, что навсегда изменило ход войны в регионе.
event_intro_4117=В конце марта 1941 года британским криптографам впервые удалось взломать шифры военно-морской «Энигмы», которую использовал флот Италии. Получив доступ к секретным данным о перемещении итальянских эскадр, 27 марта Королевский флот организовал засаду у мыса Матапан. Британцы потопили несколько тяжелых крейсеров, нанеся ВМС Италии сокрушительный удар и навсегда лишив их господства в Восточном Средиземноморье.
event_intro_4118=Во время битвы за Окинаву, пытаясь отвлечь авиацию союзников и обеспечить успех массовым атакам камикадзе, Объединенный флот Японии сформировал специальное ударное соединение во главе с суперлинкором «Ямато». План был отчаянным: линкор должен был прорваться к берегам Окинавы, выброситься на мель и превратиться в непотопляемую артиллерийскую батарею, сражаясь до последнего снаряда и матроса. Однако «Ямато» был перехвачен сотнями американских палубных самолетов и потоплен в ходе массированных авианалетов. Это сражение ознаменовало окончательную гибель Императорского флота Японии как организованной боевой силы.
event_intro_4119=Чтобы прорвать оборону японцев на Новой Гвинее, 22 апреля 1944 года американские войска начали масштабную десантную операцию. Используя тактику дезинформации и мощную поддержку корабельной артиллерии и авиации, американцы успешно высадились на берег и молниеносно захватили аэродромы и порты. Перерезав пути снабжения, они заперли основную группировку японских войск в котле. Эта операция стала блестящим примером тактики «лягушачьих прыжков»: союзники обошли мощные узлы обороны врага на востоке Новой Гвинеи, достигнув стратегических целей с минимальными потерями.

dialogue_4312=Усиливайте натиск! Британцы дезорганизованы и не смогут быстро организовать контрудар.
dialogue_4313=Советские войска слишком растянули свои фланги! Немедленно атакуйте, перережьте им линии снабжения и берите Харьков в кольцо.
dialogue_4314=Немецкое наступление слишком мощное! Наши войска больше не могут удерживать оборону на Харьковском направлении.
dialogue_4315=Немедленно поднимите авиацию на перехват противника, а остальные корабли пусть готовятся к бою на ближней дистанции!
dialogue_4316=Линкор «Ямато» потоплен! Японская эскадра отступает.
dialogue_4317=У нас абсолютное превосходство в воздухе и на море. Японская система обороны трещит по швам.

skill_name_176=Линия Марет
skill_name_177=Падающая звезда
skill_name_178=Неизбежная ловушка
skill_name_179=Сетецентрическая война

skill_info_176=Находясь в горах или в пустыне, вы и ваши союзники в радиусе 1 клетки получаете на [#00FF00#%d%%] меньше урона. При командовании сухопутными войсками шанс срабатывания навыка «Слух» увеличивается на 25%. В конце хода, если в радиусе 2 клеток есть враги с пониженной моралью или в состоянии «Хаоса», вы и союзники в радиусе 1 клетки восстанавливаете 10% от максимального запаса ОЗ.
skill_info_177=При атаке любым отрядом есть шанс [#00FF00#%d%%] нанести по цели орбитальный удар (Спутник 2-го уровня). Если вы командуете авианосцем, урон от орбитального удара увеличивается на дополнительные 30%.
skill_info_178=Защита всех врагов в радиусе 3 клеток от генерала снижается на [#00FF00#%d%%]. Кроме того, они получают на 20% больше урона от ядерного оружия, орбитальных ударов и тактических беспилотников.
skill_info_179=При атаке или нанесении авиаудара есть шанс [#00FF00#%d%%] нанести критический урон.

dialogue_4318=Удивительно, но итальянцам действительно удалось переубедить Фюрера. На этот раз мы не должны повторять старых ошибок.
dialogue_4319=Авиаудары завершены, первая волна десанта уже на позициях. Желаем успешной операции!
dialogue_4320=Вражеская атака! Поднять по тревоге все боеспособные части! Удерживайте аэродром любой ценой! Запросите у Королевского флота экстренную помощь для обороны Мальты!
dialogue_4321=Орудия Королевского флота обеспечивают плотное огневое прикрытие для нашего десанта.
dialogue_4322=Вторая волна десанта успешно высадилась! Мы должны захватить Валлетту как можно скорее!
dialogue_4323=Валлетта пала! Мальта наша!
dialogue_4324=Королевский флот прикроет нашу эвакуацию!
dialogue_4325=Мы обязаны гарантировать, что наши ВВС смогут взлетать без помех.
dialogue_4326=Южная группировка — наш главный ударный кулак. Мы должны сделать всё, чтобы они прорвали оборону врага.
dialogue_4327=Враг ударил с юга, как мы и предвидели. Все части действуют по плану: опираясь на наши укрепления, мы отбили их атаку.
dialogue_4328=Они успешно захватили британские позиции, открыв дорогу для продвижения наших танков.
dialogue_4329=Сэр, передовые части докладывают о критической нехватке горючего. Наступление захлебывается.
dialogue_4330=Мы были так близки, но в последний момент потерпели неудачу! Прикажите передовым частям остановить наступление, занять оборону и ждать снабжения.
dialogue_4331=Пришло время для контратаки! Всем войскам — вперед, вернем наши позиции!
dialogue_4332=Мы — элита итальянской армии! Мы обязаны удержать эту высоту и доказать союзникам, что с нами нужно считаться!
dialogue_4333=Высоты Дейр-эль-Мунассиб имеют критическое значение для наших дальнейших операций.
dialogue_4334=Как итальянцы могут драться с такой яростью?! Танки, срочно выдвигайтесь на поддержку! Задавите их контратаку артиллерийским огнем!
dialogue_4335=Используйте эту позицию как плацдарм! Сохраняйте шквальный огонь и продолжайте захватывать соседние рубежи!
dialogue_4336=Пытаясь вернуть позиции, дивизия «Фольгоре» по радио запросила поддержку с тыла.
dialogue_4337=Наши позиции в Дейр-эль-Мунассиб под угрозой! Бронетехнике — немедленно оказать поддержку!
dialogue_4338=Роммель на больничном. Лучшего времени для нашего удара не найти.
dialogue_4339=Внимание всем частям! Полная боевая готовность! Не дайте врагу прорвать нашу линию обороны!
dialogue_4340=Они успешно закрепились на передовой и, используя захваченный плацдарм, продолжили развивать наступление.
dialogue_4341=Как только артобстрел закончится — немедленно отбить позиции!
dialogue_4342=Артиллерия быстро развернулась на позициях, значительно снизив давление на наши передовые отряды.
dialogue_4343=Оборона врага слишком крепка! Запрашиваю артиллерийскую поддержку!
dialogue_4344=Роммель вернулся. Кризис на северном фасе фронта миновал.
dialogue_4345=Враг стягивает силы! Мы обязаны нанести упреждающий удар, чтобы обезопасить Линию Марет!
dialogue_4346=С боем вырывайтесь с Линии Марет, уничтожая по пути как можно больше союзников!
dialogue_4347=Разведка докладывает: враг готовится к штурму.
dialogue_4348=Отличная работа! Держитесь насмерть и по возможности пробивайте коридоры для отхода союзных частей!
dialogue_4349=Первая линия обороны на юге прорвана! Резервы, в бой! Мы ни в коем случае не должны сдать Меденин!
dialogue_4350=Нужно отступать, иначе у нас просто не останется людей для обороны Линии Марет.
dialogue_4351=Войскам на передовой — удержать позиции! Резервам — атаковать и отбить Меденин!
dialogue_4352=Британцы захватили ключевые высоты у Энфидавиля! Немедленно выбить их оттуда! Эта оборонительная линия не должна пасть!
dialogue_4353=Враг отбил высоты Тебурба и запрашивает подкрепления с тыла.
dialogue_4354=Слава богу, подкрепление прибыло! Что, больше никого не будет? Значит, остались только мы.
dialogue_4355=Артиллерия накрыла вершину горы, вынудив противника отступить. Как только обстрел прекратится, мы немедленно займем высоту.
dialogue_4356=В результате давление на оборону у высот Тебурба многократно возросло.
dialogue_4357=Мы сделали всё, что было в наших силах. Держитесь, возможно, скоро подойдет подмога.
dialogue_4358=В атаку! Враг больше не получит подкреплений! Захватим высоты, и Линия Энфидавиль рухнет как карточный домик!
dialogue_4359=Солдаты, Дуче обеспечил нас всем необходимым для этой битвы!
dialogue_4360=Продолжайте наступление! Усилить огонь!
dialogue_4361=Проклятье! Эти греки из железа сделаны, что ли?! Они продолжают контратаковать даже под таким плотным обстрелом!
dialogue_4362=По данным разведки, итальянский флот уже на подходе. Готовьтесь к бою! Мы обязаны уничтожить их одним решающим ударом!
dialogue_4363=Пошлите крейсера в ложную атаку, чтобы выманить врага на дистанцию огня наших линкоров, а затем разорвите их главным калибром!
dialogue_4364=Мы не можем позволить нашему флоту нести такие потери.
dialogue_4365=Войска с обеих сторон успешно высадились и стремительно продвигаются вглубь суши, зачищая аэродром от японских частей.

legend_intro_60101=185-я парашютная дивизия «Фольгоре» (Молния) была элитным подразделением, созданным в Италии специально для воздушно-десантных операций. Изначально дивизия готовилась к операции «Геркулес» (С3) — совместному с немцами воздушному штурму Мальты. Однако после катастрофических потерь немецких десантников на Крите итальянское командование отложило операцию, намеченную на июль 1942 года. После падения Тобрука от планов захвата Мальты окончательно отказались. Дивизию «Фольгоре» срочно перебросили в Северную Африку, и этим элитным парашютистам так и не довелось совершить ни одного боевого прыжка с парашютом.
legend_intro_60102=В июле 1942 года 185-я дивизия «Фольгоре» оказалась в раскаленных песках Северной Африки. Элита ВДВ, чьей задачей было обрушиваться на врага с небес, словно удар молнии, теперь была вынуждена ковать свою славу в изнурительной окопной войне. 29 августа они приняли свой первый бой в битве при Алам-эль-Халфе. Их задачей было прикрытие флангов немецких танковых клиньев. Парашютисты блестяще справились: захватили ключевые высоты и создали мощный плацдарм прямо внутри позиций союзников.
legend_intro_60103=29 сентября 1942 года, готовясь ко Второй битве при Эль-Аламейне, британцы начали операцию «Браганза», пытаясь смять позиции дивизии «Фольгоре». Столкнувшись с массированной танковой атакой, десантники проявили чудеса стойкости. Опираясь на грамотно выстроенную сеть траншей и исключительную тактическую гибкость, парашютисты, вооруженные лишь легким стрелковым оружием и скудной артиллерией, сожгли десятки танков и успешно отбили штурм, доказав свой статус элитного подразделения.
legend_intro_60104=23 октября 1942 года грянула Вторая битва при Эль-Аламейне. Дивизии «Фольгоре» было поручено удерживать южный сектор обороны. На них обрушился мощнейший удар британского 13-го корпуса, в авангарде которого шли легендарные «Пустынные крысы» — 7-я бронетанковая дивизия. Четверо суток парашютисты стояли насмерть, отбивая атаки танков бутылками с зажигательной смесью и гранатами. Их фанатичное сопротивление вынудило Монтгомери отказаться от прорыва на юге. Но, несмотря на массовый героизм, из-за общего обрушения фронта дивизии пришлось отступить вместе с остальными силами Оси, понеся в ходе отхода колоссальные потери.
legend_intro_60105=После Эль-Аламейна выжившие бойцы «Фольгоре» были отброшены к Линии Марет, чтобы задержать продвижение союзников. Пытаясь сорвать подготовку британской 8-й армии к штурму, в марте 1943 года силы Оси начали операцию «Капри», ударив по британским резервам у Меденина. Из-за утечки данных система «Ультра» предупредила британцев, и атаки Оси захлебнулись в крови под шквальным артиллерийским огнем. И хотя парашютистам «Фольгоре» удалось прорвать оборону на своем участке, из-за провала соседей им пришлось с горечью отступить.
legend_intro_60106=На заключительном этапе Тунисской кампании силы Оси отступали от одного оборонительного рубежа к другому. 20 апреля 1943 года союзники захватили тактически важные высоты у Такруны. Чтобы стабилизировать фронт, командование Оси бросило в бой последние горстки парашютистов из дивизии «Фольгоре». Десантники яростным ударом выбили врага с высот и удерживали их целый день без малейшей поддержки артиллерии и авиации. Они сдались лишь тогда, когда у них кончились патроны. Так легендарная дивизия, рожденная для небес, сгорела в огне безнадежных сражений среди раскаленных песков Африки.

