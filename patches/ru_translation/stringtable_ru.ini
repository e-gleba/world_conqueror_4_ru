legend_intro_90101=1-я дивизия морской пехоты — старейшее и крупнейшее соединение Корпуса морской пехоты США, известное как «Старая гвардия». Надпись «ГУАДАЛКАНАЛ» на эмблеме дивизии увековечивает Гуадалканальскую кампанию — первое крупное сражение, в котором дивизия участвовала после своего формирования. Одним из самых ожесточённых столкновений стала битва за аэродром Хендерсон-Филд. 23 октября 1942 года японские войска, сосредоточив около 20 000 человек, переброшенных по «Токийскому экспрессу», под покровом ночи предприняли яростный штурм аэродрома. Воспользовавшись слабой координацией японских частей, морские пехотинцы отразили несколько последовательных атак. После этого боя японцы понесли тяжёлые потери и полностью отказались от попыток вернуть Гуадалканал, а 1-я дивизия морской пехоты впервые заявила о себе на Тихоокеанском театре военных действий.
legend_intro_90102=После взятия Гуадалканала американские войска быстро использовали его как плацдарм для наступления в западной части Тихого океана, последовательно ликвидируя японские опорные пункты. 26 декабря 1943 года для зачистки японских сил на острове Новая Британия 1-й дивизии морской пехоты было приказано захватить два аэродрома близ мыса Глостер, оборонявшиеся подразделениями японской 17-й дивизии. Закалённая в боях за Гуадалканал, 1-я дивизия морской пехоты отлично владела тактикой боевых действий в джунглях и в течение пяти дней овладела аэродромами. Однако японские войска отступили в густой лес и, опираясь на местность, оказывали упорное сопротивление. Зачистка района вокруг аэродромов продолжалась до февраля 1944 года, когда бои окончательно стихли.
legend_intro_90103=Не сумев вернуть аэродром мыса Глостер на западе Новой Британии и в условиях ужесточавшейся блокады, японские силы на западной части острова начали отход на восток к Рабаулу для облегчения снабжения. Обнаружив этот манёвр, американское командование сформировало боевую группу «А» на основе 5-го полка морской пехоты 1-й дивизии с задачей высадиться на полуострове Уилломец в центральной части острова и перерезать пути отхода противника. 6 марта 1944 года под прикрытием авиаударов боевая группа «А» успешно высадилась и немедленно начала продвижение к взлётно-посадочной полосе на полуострове. Японский гарнизон отреагировал быстро, подтянув подкрепления и прилагая все усилия для сдерживания американских войск. После четырёх дней ожесточённых боёв основные японские силы наконец завершили отход. Тем не менее боевая группа «А» закрепилась на полуострове Уилломец, используя его как базу для непрерывного беспокойства отступавших японских войск.
legend_intro_90104=Для захвата передового плацдарма перед наступлением на оккупированные японцами Филиппины американские войска 15 сентября 1944 года начали операцию «Стейлмейт II», нацеленную на острова Палау. К этому времени американское командование было уверено в успехе: за месяцы боёв была выработана проверенная тактика прорыва японской противодесантной обороны. Однако японцы, потерпев ряд поражений, полностью сменили тактику: отказавшись от обороны побережья, они создали глубокоэшелонированную систему укреплений в глубине острова, втянув 1-ю дивизию морской пехоты в жестокую войну на истощение. Первоначальная высадка прошла исключительно гладко, но при продвижении вглубь острова наступление американцев было серьёзно замедлено последовательными рубежами обороны. Операция, рассчитанная всего на четыре дня, превратилась в двухмесячную изнурительную борьбу. В конечном счёте ценой потерь, превысивших треть личного состава дивизии, 1-я дивизия морской пехоты во взаимодействии с 81-й пехотной дивизией уничтожила японские силы на острове. Национальный музей Корпуса морской пехоты называет это сражение «самой ожесточённой битвой войны для морской пехоты».
legend_intro_90105=1 апреля 1945 года отдохнувшая и переформированная 1-я дивизия морской пехоты высадилась на Окинаве — крупнейшей мясорубке Тихоокеанского театра Второй мировой войны. В этом сражении, учтя кровавый опыт Пелелиу и Иводзимы, японцы, как обычно, оставили побережье, превратив южную часть Окинавы в комплекс укреплений, превосходивший по мощи иводзимский. Американские войска без труда заняли северную часть острова, однако при продвижении на юг немедленно оказались втянуты в жестокую позиционную войну на истощение. Несмотря на опыт предыдущих изнурительных боёв, 1-я дивизия морской пехоты сочла это сражение исключительно тяжёлым. В конечном счёте ценой 50 000 потерь американские войска овладели Окинавой. Пройдя через это сражение-чистилище, 1-я дивизия морской пехоты закалилась как сталь, заслужив блестящую боевую репутацию и став после Второй мировой войны наиболее востребованными силами быстрого реагирования американской армии.
legend_intro_90106=27 февраля 1991 года для отражения иракского вторжения в Кувейт и освобождения города Эль-Кувейт американские войска начали сражение за международный аэропорт Кувейта. Являясь одной из главных сил на поле боя, 1-я дивизия морской пехоты наступала совместно со 2-й дивизией морской пехоты, продвигаясь с неудержимой мощью, обеспеченной сетецентрической тактикой. Ценой всего 5 убитых и 48 раненых они разгромили 7 иракских дивизий и захватили более 8 000 пленных. Эта эталонная победа с почти нулевыми потерями ознаменовала превращение 1-й дивизии морской пехоты из пехотной дивизии «старой гвардии», ведшей кровавые бои в джунглях Второй мировой, в современные амфибийные элитные силы, способные сокрушать противника информационным и механизированным превосходством.
legend_intro_100101=51-я Хайлендская дивизия, сформированная в 1908 году, с отличием сражалась в обеих мировых войнах. Однако на раннем этапе Второй мировой это грозное соединение понесло крупное унижение. В начале июня 1940 года линия Вейгана рухнула, и поражение Франции стало неизбежным. Для сохранения боевой мощи Хайлендской дивизии был отдан приказ об эвакуации из Гавра. Но немецкие войска быстро перерезали дороги на Гавр, и лишь 154-я пехотная бригада с приданными подразделениями сумела достичь порта. Основная часть Хайлендской дивизии вместе с войсками французского IX корпуса была вынуждена отойти к небольшому прибрежному порту Сен-Валери-ан-Ко и спешно организовать оборону. Из-за малых размеров порта и неблагоприятного рельефа спасательная операция столкнулась с огромными трудностями. В итоге союзникам удалось эвакуировать из Сен-Валери чуть более 3 000 человек, а основные силы Хайлендской дивизии численностью более 10 000 офицеров и солдат, сдерживавших противника, попали в плен. Тем не менее именно благодаря их отчаянному сопротивлению совместно с французским IX корпусом у Сен-Валери союзники успешно эвакуировали из Гавра более 10 000 военнослужащих, сохранив драгоценное ядро для будущего контрнаступления.
legend_intro_100102=После тяжёлых потерь, понесённых в ходе операции «Сайкл», 51-я Хайлендская пехотная дивизия была воссоздана в Соединённом Королевстве. Почти два года оборонительной и боевой подготовки спустя дивизия была направлена на Североафриканский театр для участия в решающем Втором сражении при Эль-Аламейне. Ночью 23 октября 1942 года под прикрытием мощного артиллерийского огня 51-я Хайлендская дивизия начала ожесточённый штурм немецких минных позиций. Ей удалось создать передовые позиции и отразить первые немецкие контратаки, выиграв критически важное время для проделывания сапёрами проходов в минных полях для бронетехники. Через эти проходы союзные бронетанковые дивизии смогли продвинуться вперёд, заложив основу победы. После последующих ожесточённых боёв немецкие войска были вынуждены отступить. Эта пехотная дивизия, некогда понёсшая сокрушительные удары от немецкой армии, победой при Эль-Аламейне восстановила свою репутацию. С этого начался её путь возмездия — от Эль-Аламейна до Туниса, положивший конец контролю стран Оси над Северной Африкой.
legend_intro_100103=После Североафриканской кампании 51-я Хайлендская дивизия была немедленно включена в состав Восьмой армии для участия в операции «Хаски». 10 июля 1943 года дивизия высадилась на юго-восточном побережье Сицилии и продвинулась на север, последовательно захватив такие опорные пункты, как Виццини и Франкофонте. Действуя совместно с главными силами по прорыву оборонительных рубежей противника, она в конечном итоге содействовала американским войскам во взятии Мессины, успешно завершив освобождение Сицилии.
legend_intro_100104=После операции «Хаски» 51-я Хайлендская дивизия более полугода проходила отдых и переформирование, прежде чем вновь отправиться в бой — на высадку в Нормандии. Однако это воссозданное элитное соединение, казалось, было плохо приспособлено к условиям Западноевропейского театра, столь отличным от североафриканской пустыни. Её действия на начальном этапе высадки были невыразительными, и лишь в ходе операции «Тоталайз» дивизия вернула былую славу. Ночью 7 августа 1944 года 2-й канадский корпус начал операцию «Тоталайз». Являясь одной из главных сил, 51-я Хайлендская дивизия под прикрытием артиллерийского огня успешно прорвала немецкие оборонительные позиции к югу от Кана, открыв путь в глубину вражеской обороны для последующих бронетанковых сил. Её передовые части в какой-то момент находились чуть более чем в десяти километрах от Фалеза. Это сражение ознаменовало полную адаптацию дивизии к правилам боя на открытой местности и в густых лесах.
legend_intro_100105=К февралю 1945 года линия фронта вышла к германской границе. Для прорыва линии Зигфрида и зачистки западного берега Рейна союзники 8 февраля начали операцию «Веритабл». 51-я Хайлендская дивизия, действуя в качестве главной силы, под прикрытием артиллерийского огня успешно прорвала немецкую оборону и продвинулась на юго-восток. 18 февраля дивизия начала общий штурм Гоха — ключевого узла линии Зигфрида. После нескольких дней ожесточённых боёв 21 февраля город был полностью взят, а поставленная задача — выполнена. В ходе этой кампании немецкие войска взорвали дамбы на реке Рур, вызвав обширное затопление, что задержало американскую операцию «Гренада» и оставило 51-ю Хайлендскую дивизию на какое-то время в одиночку сдерживать давление немецких сил на фланге. Лишь 23 февраля, когда американские и британские войска соединились, немецкая оборона на западном берегу Рейна была окончательно сломлена, открыв союзникам путь к форсированию реки.
legend_intro_100106=К концу марта 1945 года все приготовления к форсированию реки были завершены. Ночью 23-го под грохот артиллерийского огня 51-я Хайлендская дивизия с боем форсировала Рейн, создав плацдарм на восточном берегу после кровопролитного боя с оборонявшимися. С этого момента дорога на Берлин была открыта, окружение Рура обрело форму, и начался обратный отсчёт для Третьего рейха. Впоследствии 51-я Хайлендская дивизия наступала на Бремен в составе XXX корпуса, приняв там капитуляцию немецких войск и встретив известие о победе в Европе. После Второй мировой войны в условиях продолжавшегося сокращения британских вооружённых сил 51-я Хайлендская дивизия была в конечном счёте расформирована, но её история переплелась с шотландским национальным духом, а наследие передаётся из поколения в поколение.
