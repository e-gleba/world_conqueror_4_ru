event_intro_401=4 июня 1942 года к северо-западу от атолла Мидуэй развернулось решающее морское сражение между США и Японией. Благодаря взлому японских военно-морских радиокодов, американцы смогли устроить засаду. Меньшими силами они нанесли Императорскому флоту катастрофический урон: были потоплены 4 тяжелых авианосца (включая «Акаги»). Япония навсегда потеряла стратегическую инициативу на Тихом океане.
event_intro_402=6 июня 1944 года союзники начали масштабную десантную операцию. Благодаря грамотной дезинформации врага, мощной артиллерийской поддержке с моря и массированным бомбардировкам, почти 160 000 солдат успешно пересекли Ла-Манш и высадились на пяти секторах побережья Нормандии, открыв Второй фронт.
event_intro_403=10 июня 1940 года Италия объявила войну Великобритании и Франции, бросив 300 000 солдат в наступление на Альпы и Ниццу. Однако итальянская армия быстро завязла, столкнувшись с ожесточенным сопротивлением французов на южном участке Альпийской линии и линии Мажино.
event_intro_404=15 июня 1941 года британцы начали операцию в Киренаике, чтобы деблокировать осажденный силами Оси гарнизон в Тобруке. Британские ВВС попытались завоевать превосходство в воздухе, однако бронетанковые части союзников не смогли прорвать немецкие позиции, понесли тяжелые потери и сами оказались под угрозой окружения. Операция провалилась.
event_intro_405=15 июня 1944 года под прикрытием корабельной артиллерии американцы высадились на острове Сайпан. Японский гарнизон отказался сдаваться, оказав фанатичное сопротивление. В критический момент остатки защитников пошли в самоубийственную банзай-атаку. Победа досталась армии США высокой ценой.
event_intro_406=Это сражение стало крупнейшим окружением на первом этапе операции «Барбаросса». 22 июня 1941 года группа армий «Центр» нанесла сокрушительный удар на направлении Белосток — Минск — Смоленск. Стремительный прорыв немецких танковых клиньев отрезал огромную группировку советских войск. Несмотря на катастрофическое положение, Красная Армия продолжала сражаться, и около 250 000 человек смогли вырваться из котла.
event_intro_407=Эта операция стала ключевым этапом наступления «Багратион». 25 июня 1944 года силы 1-го Прибалтийского и 3-го Белорусского фронтов успешно взяли в кольцо немецкую группировку под Витебском. Оборона вермахта рухнула, Витебск и Орша были освобождены, что открыло путь для дальнейшего продвижения советских войск.
event_intro_408=28 июня 1942 года Советский Союз перебросил резервы к Воронежу, чтобы не дать немецким войскам выйти к Сталинграду на плечах отступающей армии. На улицах города вспыхнули ожесточенные бои. И хотя немцам в итоге удалось захватить Воронеж, Красная Армия выиграла драгоценное время для подготовки обороны Сталинграда.
event_intro_409=Первая битва при Эль-Аламейне стала войной на истощение. 1 июля 1942 года Африканский корпус Роммеля попытался прорвать оборону союзников, но увяз. Вскоре британцы перешли в контрнаступление. Линия фронта стабилизировалась, и битва зашла в позиционный тупик.
event_intro_410=Воспользовавшись успехом первых недель плана «Барбаросса», немецкие войска стремительно продвигались по равнинам Восточной Европы. Советское командование поручило маршалу Семену Тимошенко организовать новую линию обороны под Смоленском и нанести контрудары. Несмотря на ожесточенное сопротивление, Красной Армии не удалось полностью остановить продвижение вермахта к Москве.
event_intro_411=9 июля 1943 года союзные войска США и Великобритании начали десантную операцию «Хаски». Целями были обезопасить морские коммуникации в Средиземноморье, ускорить падение режима Муссолини и оттянуть немецкие резервы с Восточного фронта. Операция увенчалась полным успехом, и хотя немецкие войска смогли эвакуироваться с острова, Муссолини был свергнут.
event_intro_412=Это сражение стало кульминацией советского контрнаступления под Курском. 12 июля 1943 года Красная Армия, обладая подавляющим численным превосходством, ударила по немецкому Орловскому выступу (операция «Кутузов»). Под угрозой полного окружения вермахт был вынужден оставить позиции. Орел был освобожден, и стратегическая инициатива окончательно перешла к СССР.
event_intro_413=Сражение под Уманью — крупная операция на окружение, проведенная группой армий «Юг» летом 1941 года. Немецкие бронетанковые части прорвались южнее Киева и севернее Умани, замкнув клещи. Из-за ошибок советского командования в оценке направлений главного удара, приказ на отход опоздал, в результате чего в плен попали десятки тысяч красноармейцев.
event_intro_414=После высадки в Нормандии союзники натолкнулись на мощную немецкую оборону вокруг Кана. 18 июля 1944 года британские и канадские войска начали операцию «Гудвуд» — массированную танковую атаку к югу от города. Немцы, грамотно используя рельеф и артиллерию, нанесли огромный урон союзной бронетехнике, вынудив их свернуть наступление.
event_intro_415=В июле 1942 года, после неудачи в Коралловом море, японцы попытались взять Порт-Морсби с суши, перейдя горы по тракту Кокода. Их цель — захватить Новую Гвинею и перерезать коммуникации между США и Австралией. Австралийские войска с трудом сдерживали натиск превосходящих сил врага, но благодаря сложному рельефу джунглей и логистическому коллапсу у японцев, союзники заставили их отступить.
event_intro_416=Чтобы вырваться из позиционного тупика в Нормандии, союзники провели серию отвлекающих атак, сковав основные бронетанковые резервы немцев на британском секторе фронта. 25 июля 1944 года американские войска сконцентрировали силы у Сен-Ло и обрушили на врага всю мощь авиации (операция «Кобра»). Нехватка резервов и обрушение фронта привели к краху немецкой обороны на западе Нормандии.
event_intro_417=Развивая успех операции «Кобра», 30 июля 1944 года британские силы начали наступление «Блюкот», чтобы не дать отступающим немецким танковым дивизиям перегруппироваться. Они успешно сковали резервы противника на восточном фланге, что способствовало срыву немецкого контрудара и последующему окружению сил вермахта в Фалезском котле.
event_intro_418=3 августа 1943 года Красная Армия перешла в масштабное наступление (операция «Полководец Румянцев») на южном фасе Курской дуги с целью освобождения Белгорода и Харькова. Несмотря на упорное сопротивление, немецкая армия была вынуждена отступить, и Харьков был окончательно освобожден. Это поражение лишило Германию последних надежд на перехват инициативы на Восточном фронте.

event_intro_419=Битва за Гуадалканал стала первым крупным сухопутным наступлением союзников против Японской империи. 7 августа 1942 года американская морская пехота высадилась на островах Гуадалканал, Тулаги и Флорида. Японцы, бросая в бой всё новые силы, предприняли множество попыток отбить острова, но понесли катастрофические потери и были вынуждены эвакуироваться.
event_intro_420=После взятия Кана канадские войска начали операцию «Тоталайз». В ночь на 8 августа 1944 года они прорвали оборону немцев с помощью тяжелых бомбардировщиков и бронетранспортеров, вклинившись в глубь вражеских позиций. Наступление остановилось всего в семи милях к северу от Фалеза.
event_intro_421=Фалезский котел стал решающим эпизодом Нормандской кампании. С 12 по 21 августа 1944 года союзники взяли в клещи и уничтожили большую часть немецкой группы армий «Б» к западу от Сены. В плен попало свыше 50 000 солдат, что открыло союзникам прямую дорогу на Париж.
event_intro_422=Чтобы решить логистический кризис после высадки в Нормандии, 15 августа 1944 года союзники начали операцию «Драгун» по захвату глубоководных портов Южной Франции. Всего за четыре недели большая часть юга страны была освобождена, а немецкая группа армий «Г», понеся тяжелые потери, отступила к Вогезам.
event_intro_423=19 августа 1942 года союзники провели разведку боем — высадку в порту Дьепп (операция «Юбилей»). Нападение обернулось катастрофой: десант попал под шквальный огонь, уровень потерь достиг 68%. Несмотря на провал, этот жестокий урок помог союзному командованию избежать многих ошибок при планировании высадки в Нормандии.
event_intro_424=Битва за Киев (1941) вошла в историю как крупнейшая операция на окружение. С 23 августа по 26 сентября немецкие группы армий «Центр» и «Юг» замкнули клещи восточнее Киева. В котле оказалось более 700 000 советских солдат. Это стало колоссальным триумфом вермахта и величайшей трагедией для Красной Армии в начале войны.
event_intro_425=Таллин, главная база Балтийского флота, оказался под угрозой захвата в первые же месяцы войны. 27 августа 1941 года советское командование начало эвакуацию защитников города морем в Кронштадт. Немецкая авиация, финские батареи и плотные минные поля превратили залив в ад. Погибло более 10 000 человек и около 50 судов, однако ядро флота удалось спасти для обороны Ленинграда.
event_intro_426=Битва при Алам-эль-Халфе стала последней попыткой сил Оси прорваться в Египет. 30 августа 1942 года Эрвин Роммель атаковал позиции 8-й британской армии. Однако Бернард Монтгомери заранее расшифровал планы немцев благодаря «Ультре» и выстроил идеальную противотанковую оборону. Лишившись горючего и инициативы, Роммель отступил.
event_intro_427=Эта операция положила начало Второй мировой войне. 1 сентября 1939 года немецкая армия вероломно вторглась в Польшу, используя тактику блицкрига. 17 сентября советские войска пересекли восточную границу. Зажатая между двумя сверхдержавами, польская армия была разбита, а правительство бежало из страны.
event_intro_428=3 сентября 1943 года союзники высадились в континентальной Италии. Чтобы запутать немцев, британцы провели отвлекающий маневр на юге, в то время как основные силы высадились в Салерно для броска на Неаполь. Кессельринг разгадал план и оказал жесточайшее сопротивление. Лишь ценой больших потерь союзники смогли удержать плацдарм в Салерно.
event_intro_429=Вторжение Италии в Египет открыло Североафриканскую кампанию. Изначально Муссолини планировал стремительный бросок к Суэцкому каналу. Но 9 сентября 1940 года итальянские войска пересекли границу, продвинулись всего до Сиди-Баррани, после чего остановились строить укрепленные лагеря, ожидая подвоза припасов. Это промедление стоило им инициативы.
event_intro_430=Осенью 1944 года Красная Армия начала мощное стратегическое наступление (Прибалтийская операция), чтобы освободить Эстонию, Латвию и Литву. Несмотря на яростное сопротивление, немецкая группа армий «Север» понесла тяжелые потери, была отрезана от Восточной Пруссии и заблокирована в Курляндском котле вплоть до конца войны.
event_intro_431=17 сентября 1944 года союзники начали операцию «Маркет Гарден» — амбициозный план по обходу «Линии Зигфрида» и прорыву в Рурский промышленный район. Тысячи десантников высадились в Нидерландах, чтобы захватить мосты от Эйндховена до Арнема. Однако из-за проблем с разведкой и связью британские парашютисты в Арнеме были разбиты танковыми дивизиями СС.
event_intro_432=Сражение в Хюртгенском лесу стало самым долгим в истории армии США (с 19 сентября 1944 по февраль 1945). Пытаясь защитить фланги и не дать немцам взорвать плотины на реке Рур, американцы втянулись в мясорубку в густом осеннем лесу. Немецкая оборона и артиллерия превратили лес в ад. США потеряли более 33 000 солдат, немцы — около 28 000.
event_intro_433=Операция «Угроза» (23–25 сентября 1940 г.) — неудачная попытка союзников захватить стратегически важный порт Дакар (Сенегал), лояльный вишистской Франции. Генерал де Голль надеялся убедить гарнизон перейти на сторону «Свободной Франции», но губернатор Дакара ответил огнем. После артиллерийской дуэли и неудачной высадки союзный флот отступил.
event_intro_434=Битва за Мец — кровопролитное сражение между 3-й армией США и немецкими войсками на границе Франции. Опираясь на старинные, но мощные укрепления Меца, немцы навязали американцам изнурительную позиционную войну. Осада длилась с августа по декабрь 1944 года и завершилась лишь после полного истощения немецкого гарнизона.
event_intro_435=Орловско-Брянская операция (сентябрь-октябрь 1941) — важный эпизод наступления вермахта на Москву. Немецкая 2-я танковая группа Гудериана прорвала фронт, взяв в кольцо войска советского Брянского фронта. Однако упорное сопротивление окруженных частей связало немецкие дивизии, выиграв время для подготовки обороны на подступах к Москве.
event_intro_436=Чтобы открыть глубоководный порт Антверпена для логистики, в октябре 1944 года союзники начали серию сложных операций по зачистке устья Шельды от немецкой 15-й армии. Противник успел укрепиться, так как союзники ранее увлеклись планом «Маркет Гарден». В итоге канадская армия ценой более 20 000 жизней выбила немцев из затопленных польдеров Шельды.


dialogue_2712=Уничтожьте силы противника, наша цель - Москва!
dialogue_2713=Товарищи, Москва прямо за нами, мы должны полностью изгнать врага!
dialogue_2714=Командир, рядом с Лепелем собираются различные силы противника, они приближаются к нашим противотанковым системам обороны.
dialogue_2715=Хотя контрнаступление в Лепеле провалилось, мы будем сражаться до последнего!
dialogue_2716=Витебск захвачен, и 3-я гвардейская танковая армия может помочь нам окружить Смоленск.
dialogue_2717=Можайская линия обороны была прорвана, будьте готовы к нападению на Смоленск!
dialogue_2718=Поздравляю с выдающейся победой! командир, мы просим сотрудничество 3-й гвардейской танковой армии для окружения Смоленска.
dialogue_2719=Солдаты, быстро маршируйте и оккупируйте Кокоду!
dialogue_2720=Солдаты, ради безопасности Порт-Морсби мы должны удержаться на Кокоде!
dialogue_2721=Контролируйте окрестности и откройте дорогу в Порт-Морсби.
dialogue_2722=Более сильная поддержка уже на пути; давайте вернемся к Кокоде!
dialogue_2723=Прибыли подкрепления! сражайтесь всеми силами, солдаты! еще подкрепления придут!
dialogue_2724=Согласно плану, наши силы и британская армия высадились бы вблизи Ликата и Сиракузы, чтобы контролировать южные аэродромы.С юга на север мы будем продвигаться шаг за шагом, и победа будет нашей!
dialogue_2725=Войска, несмотря на неблагоприятный сильный ветер перед высадкой, враг еще менее вероятно, что он предвидит нашу атаку.
dialogue_2726=Линия фронта рухнула, и нам нужно подготовиться к эвакуации из Мессины, чтобы сохранить наши силы.
dialogue_2727=Южное побережье очищено, а провизии доставлены вдоль береговой линии.
dialogue_2728=Командир, в этой операции нашим войскам трудно получить поставки из оккупированной зоны.Пожалуйста, сделайте захват Ликата приоритетом для обеспечения поддержки.
dialogue_2729=Командир, я прошу немедленно атаковать Мессину, чтобы отрезать отступление сил Оси.
dialogue_2730=Солдаты, наше оборудование было модернизировано, а наши ВВС подавили воздушные силы и линии снабжения противника.
dialogue_2731=Наши резервы недостаточны; мы должны ждать подходящего момента, чтобы нанести смертельный удар.
dialogue_2732=Нападите на левый фланг врага и приготовьтесь окружить его.
dialogue_2733=Продолжайте наступление, расширяйте наши военные завоевания и снимите осаду Тобрука!
dialogue_2734=Солдаты, быстро продвигайтесь и ликвидируйте советские войска как на северной, так и на южной стороне Белостока, окружив их!
dialogue_2735=Товарищи, бесстыдные немецкие захватчики вошли в нашу страну, выгоните их на нашу родину и Советский Союз!
dialogue_2736=Продолжайте прорыв у Барановичей и приготовьтесь окружить Минск.
dialogue_2737=Товарищи, сократите оборонительную линию! Реорганизуйте наш фронт с Минском в качестве ядра.
dialogue_2738=Ставка Верховного верховного командования приказывает Юго-Западному фронту: обеспечивая безопасность, приложить все усилия, чтобы нейтрализовать немецкое наступление и любой ценой удержать линию реки Днепр.
dialogue_2739=Советская армия превосходит нас численно, сначала уничтожить их эффективную армию, а затем прорвать их линию обороны!
dialogue_2740=Ставка Верховного верховного командования приказывает Юго-Западному фронту сократить линию фронта, избежать окружения и защищаться вдоль линии обороны реки Днепр.
dialogue_2741=Вражеские войска отступают от окружения, действуйте быстро и уничтожайте их!
dialogue_2742=В соответствии с приказами Верховного командования освободите Харьков и уничтожите 4-ю танковую армию и армейский детектив Кемпф.
dialogue_2743=Подготовьтесь к следующему наступлению, чтобы полностью разбить советские силы.
dialogue_2744=Нападите на Боходухив и окружите Харьков!
dialogue_2745=Поражение было ошибочным в оценке советских войск, защищавшие Харьков войска быстро отступили к линии Днепра.
dialogue_2746=Основные силы французской армии отступают под натиском немецких бронетанковых подразделений. значительное количество резервных сил было передислоцировано на север. сейчас подходящий момент для начала полномасштабного наступления.
dialogue_2747=Продолжайте продвижение вдоль береговой линии и начните атаку в сторону Ниццы.
dialogue_2748=У японской армии нет шансов на победу, но и они не сдадутся.Мы должны оставаться бдительными, пока весь остров не будет оккупирован.
dialogue_2749=Наступление немецкой армии полностью провалилось, и наше освобождение неизбежно.
dialogue_2750=Окружить немецкие войска в выпуклости и освободить Витебск и Оршу.
dialogue_2751=Немецкая оборонительная линия постепенно рушится, и мы готовимся открыть дорогу в Минск.
dialogue_2752=Не задерживайтесь слишком долго, быстро пробивайтесь через советские линии обороны и продвигайтесь к Сталинграду.
dialogue_2753=Перехватить немецкие силы и помешать им легко пересечь оборонительную зону.
dialogue_2754=Советская армия рушится, сосредоточьте наши силы и пробивайте оборонительные силы врага.
dialogue_2755=Британская армия укрепила свои позиции в регионе Эль-Аламейн, фактически препятствуя продвижению в сторону Александрии.
dialogue_2756=Мы имеем преимущество в снабжении, отложим наступление Германии и будем готовы к началу операции контрнаступления в любой момент.
dialogue_2757=Наше продвижение препятствует, и мы втянуты в битву износ.
dialogue_2758=Немцы ожидали нашего нападения, но оно оказалось тщетным.
dialogue_2759=Используйте наше численное превосходство и запустите неустанные наступления, чтобы прорваться через оборонительные силы противника, как приливная волна.
dialogue_2760=Советские войска начали полномасштабное наступление на нас, и как только наша оборона будет прорвана, войска в Орле могут быть окружены в любой момент!
dialogue_2761=Численность противника подавляющая, мы должны отступить в сторону Брянска.
dialogue_2762=Немецкие позиции в южной части Кана представляют собой наибольшее препятствие нашему продвижению.При такой интенсивной воздушной бомбардировке противнику будет трудно организовать эффективные контрнаступления.
dialogue_2763=Запустите полномасштабное наступление и атакуйте позиции противника во всех районах к югу от Кана!
dialogue_2764=Не бойтесь бронетанковых сил союзников, танки врага не могут противостоять нам.
dialogue_2765=Немецкая оборонительная сила была сдержанной и ослабленной, ищите прорыв в позициях противника и сосредоточьте наши силы, чтобы разорвать всю их оборонную линию.
dialogue_2766=Доступные резервные силы сокращаются; мы должны полагаться на наши существующие силы, чтобы сдержать союзническую бронетанковую группировку.
dialogue_2767=Не будет долго, прежде чем мы освободим всю Нормандию и продвинемся к немецкой границе.
dialogue_2768=Наша задача - координировать с ними действия и продвигаться на юг, удерживая восточный фланг немецкой армии привязанным.
dialogue_2769=Хорошо использовать наземные мины и оборонительные сооружения, чтобы остановить продвижение сил союзников.


