elite_intro_99=Линкор «Бисмарк» был одним из главных капитальных кораблей германского кригсмарине времён Второй мировой войны, известным своей подавляющей огневой мощью главного калибра, тяжёлым бронированием и выдающимися океанскими боевыми качествами. Оснащённый 380-мм орудиями главного калибра, способными наносить высокоточные удары по дальним целям, он обладал также превосходными скоростью и защитой. Это была тяжёлая морская боевая платформа, сочетавшая наступательную мощь и живучесть, олицетворявшая вершину достижений германского флота в создании крупных надводных кораблей.
elite_intro_100=«Дельта» — одно из самых элитных подразделений специального назначения армии США, специализирующееся на контртерроризме, точечной нейтрализации и задачах повышенного риска с проникновением. Его бойцы проходят чрезвычайно жёсткий отбор и подготовку, превосходно действуя в условиях быстрого развёртывания, скрытного проникновения и высокоточных ударов. Как правило, они оснащены передовым вооружением и системами связи и способны стремительно поражать особо важные цели в сложной обстановке, что делает их одним из лучших формирований для выполнения критически значимых задач в современной войне.
feat_name_158=Бортовой залп
feat_name_159=Одиночный рывок
feat_name_160=Несгибаемая воля
feat_name_161=Маскировочное укрытие
feat_name_162=Обезглавливающий удар
feat_desc_158=Атаки гарантированно становятся критическими, критический урон повышается на {1}%. Действует 1 ход, перезарядка — 2 хода.
feat_desc_159=Если в радиусе 3 клеток нет дружественных корабельных подразделений, атака этого подразделения повышается на {1}%, однако получаемый урон также увеличивается на {2}%.
feat_desc_159_Lv2=Если в радиусе 3 клеток нет дружественных корабельных подразделений, атака этого подразделения повышается на {1}%, однако получаемый урон также увеличивается на {2}%.
feat_desc_159_Lv3=Если в радиусе 2 клеток нет дружественных корабельных подразделений, атака этого подразделения повышается на {1}%, однако получаемый урон также увеличивается на {2}%.
feat_desc_159_Lv4=Если в радиусе 2 клеток нет дружественных корабельных подразделений, атака этого подразделения повышается на {1}%, однако получаемый урон также увеличивается на {2}%.
feat_desc_160=При уничтожении цели восстанавливает {1}% максимального запаса здоровья.
feat_desc_161=Не может быть выбрана целью активных навыков прямого урона. Невосприимчива ко всем дебаффам. Получаемый урон снижен на {1}% при атаке с дистанции 1 клетки и на {2}% при атаке с дистанции 2–3 клеток.
feat_desc_162=Отмечает {1} целей в радиусе 2 клеток, игнорируя их уклонение, дымовые шашки и скрытность. Урон по каждой отмеченной цели повышается на 60% в течение одного хода, перезарядка — 2 хода. Если отмеченная цель уничтожена отрядом «Дельта», даётся дополнительная атака с повышением урона на 20%.
feat_desc_162_Lv2=Отмечает {1} целей в радиусе 2 клеток, игнорируя их уклонение, дымовые шашки и скрытность. Урон по каждой отмеченной цели повышается на 70% в течение одного хода, перезарядка — 2 хода. Если отмеченная цель уничтожена отрядом «Дельта», даётся дополнительная атака с повышением урона на 25%.
feat_desc_162_Lv3=Отмечает {1} целей в радиусе 2 клеток, игнорируя их уклонение, дымовые шашки и скрытность. Урон по каждой отмеченной цели повышается на 80% в течение одного хода, перезарядка — 2 хода. Если отмеченная цель уничтожена отрядом «Дельта», даётся дополнительная атака с повышением урона на 30%.
feat_desc_162_Lv4=Отмечает {1} целей в радиусе 2 клеток, игнорируя их уклонение, дымовые шашки и скрытность. Урон по каждой отмеченной цели повышается на 90% в течение одного хода, перезарядка — 2 хода. Если отмеченная цель уничтожена отрядом «Дельта», даётся дополнительная атака с повышением урона на 40%.
army_buff_desc_1671=Бортовой залп: атаки всегда критические, критический урон повышен на 30%.
army_buff_desc_1672=Бортовой залп: атаки всегда критические, критический урон повышен на 40%.
army_buff_desc_1673=Бортовой залп: атаки всегда критические, критический урон повышен на 50%.
army_buff_desc_1674=Бортовой залп: атаки всегда критические, критический урон повышен на 65%.
army_buff_desc_1681=Удар обезглавливания: при атаке отряда «Дельта» уклонение, дымовые шашки и скрытность отключаются, получаемый урон повышен.
army_buff_desc_1682=Удар обезглавливания: при атаке отряда «Дельта» уклонение, дымовые шашки и скрытность отключаются, получаемый урон повышен.
army_buff_desc_1683=Удар обезглавливания: при атаке отряда «Дельта» уклонение, дымовые шашки и скрытность отключаются, получаемый урон повышен.
army_buff_desc_1684=Удар обезглавливания: при атаке отряда «Дельта» уклонение, дымовые шашки и скрытность отключаются, получаемый урон повышен.
skill_name_180=Система Даудинга
skill_name_181=Британский орёл
skill_info_180=При командовании подразделениями на своей территории каждый ход даёт [#00FF00#%d] технологии, игнорирует уклонение противника, а вражеские средства ПВО на вашей территории нейтрализуются.
skill_info_181=При командовании подразделениями в городе после уничтожения вражеских частей «Спитфайром» со 100%% вероятностью восстанавливает 1 вылет. При нанесении авиаударов по зависшим вражеским подразделениям (кроме ядерных бомб) урон повышается на [#00FF00#%d%%].
armygroup_achievement_1901=Использовать 1-й британский экспедиционный корпус для захвата Берлина в течение 8 ходов.
armygroup_achievement_1902=Использовать румынскую группу армий для захвата Бреста в течение 8 ходов.
armygroup_achievement_1903=Получить ранг S, используя одну армейскую группу с одной звездой. (Сложный режим)
armygroup_achievement_1904=Получить ранг S, используя две армейские группы с одной звездой. (Сложный режим)
