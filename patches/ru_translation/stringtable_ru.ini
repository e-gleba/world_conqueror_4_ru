event_intro_472=8 февраля 1942 года японские войска высадились на северо-западе Сингапура — наименее защищенном участке побережья. Несмотря на численное превосходство и обилие припасов, британским частям не хватало боевого опыта. Японцы стремительно захватили Букит-Тимах, взяв под контроль продовольственные склады, нефтехранилища и резервуары с питьевой водой. Оказавшись в безвыходном положении, 15 февраля войска союзников безоговорочно капитулировали.
event_intro_473=Операция «Цербер» («Прорыв в Ла-Манше»). С 11 по 13 февраля 1942 года, чтобы избежать авианалетов, немецкие линейные корабли «Шарнхорст», «Гнейзенау» и тяжелый крейсер «Принц Ойген» совершили дерзкий переход из французского Бреста в порты Германии прямо через Ла-Манш. Под прикрытием люфтваффе и миноносцев эскадра прорвалась сквозь британскую оборону, нанеся Королевскому флоту тяжелое моральное поражение.
event_intro_474=Чтобы сорвать наступление союзников на прибрежные равнины и не дать им разрезать тунисский плацдарм пополам, 14 февраля 1943 года немецкие войска нанесли упреждающий удар через перевал Фаид. Наступление обрушилось на позиции американцев у Сиди-Бу-Зид и нанесло союзникам тяжелейшие потери.
event_intro_475=Операция «Хэйлстоун». 17–18 февраля 1944 года авианосное соединение ВМС США нанесло массированный удар по атоллу Трук — главной базе японского Объединенного флота в центральной части Тихого океана. Хотя большинство тяжелых боевых кораблей японцев успели покинуть гавань до атаки, американцы уничтожили огромное количество транспортных и вспомогательных судов, нанеся непоправимый урон японской морской логистике.
event_intro_476=Битва за Иводзиму (19 февраля – 26 марта 1945 года). Понимая невозможность остановить десант на побережье, японский гарнизон отказался от защиты пляжей. Вместо этого они превратили весь остров в гигантскую сеть подземных туннелей и дотов. Это сделало штурм острова сущим адом: вместо запланированной недели бои затянулись больше чем на месяц. Поднятие американского флага на горе Сурибати стало одним из самых знаковых символов войны на Тихом океане.
event_intro_477=Восточно-Померанская операция. Чтобы обезопасить правый фланг советских войск от контрудара немецкой группы армий «Висла» во время будущего наступления на Берлин, 24 февраля 1945 года Ставка приказала войскам 1-го и 2-го Белорусских фронтов (под командованием Рокоссовского) разгромить померанскую группировку противника и выйти к побережью Балтийского моря.
event_intro_478=Сражение в Яванском море (27 февраля 1942 года). В попытке остановить японское вторжение на остров Ява объединенная эскадра союзников (ABDA) вступила в бой с японским флотом. Двухдневное сражение завершилось полным разгромом союзников — большинство их крейсеров и эсминцев было пущено на дно, что открыло японцам беспрепятственный путь для захвата острова.
event_intro_479=Битва в море Бисмарка. В начале 1943 года союзники перешли в наступление на Новой Гвинее. Чтобы переломить ситуацию, японское командование отправило из Рабаула крупный конвой для переброски 6900 солдат в Лаэ. Однако разведка союзников расшифровала радиограммы противника. Со 2 по 3 марта американская и австралийская авиация непрерывно бомбила конвой, полностью уничтожив все транспортные суда.
event_intro_480=Битва за Меденин. Чтобы сорвать подготовку британцев к штурму Линии Марет, 6 марта 1943 года Эрвин Роммель нанес удар по их позициям под Меденином. Однако британская радиоразведка «Ультра» заранее перехватила план атаки. Британцы стянули мощную противотанковую артиллерию и встретили немцев шквальным огнем. Потеряв более 50 танков, Роммель прекратил бессмысленные атаки и отвел войска.
event_intro_481=Импхальская операция. 8 марта 1944 года японская армия начала наступление в Индии, чтобы захватить Импхал, перерезать пути снабжения союзников и создать буферную зону для защиты Бирмы. Операция обернулась для японцев абсолютной катастрофой: войска увязли в джунглях и были уничтожены голодом и болезнями. Главной причиной провала стал авантюрный план генерала Мутагути. В Японии слово «Импхал» до сих пор является синонимом безрассудной и обреченной авантюры.
event_intro_482=Битва за Минданао (Операция VICTOR V). С 10 марта по 15 августа 1945 года американские войска при массированной поддержке филиппинских партизан проводили операцию по освобождению острова Минданао от японской оккупации. Благодаря грамотной тактике остров был полностью зачищен с минимальными потерями для армии США.
event_intro_483=Прорыв Линии Марет. 16 марта 1943 года британская 8-я армия начала генеральное наступление на укрепленную Линию Марет в Тунисе. Пока часть сил проводила сковывающую фронтальную атаку, подвижная новозеландская группировка совершила глубокий обход через труднопроходимый перевал Тебага-Фатема, ударив немцам в тыл. Под угрозой полного окружения силы Оси были вынуждены бросить укрепления и спешно отступать на север.
event_intro_484=Битва за Висайские острова. Вслед за высадкой на Минданао, 18 марта 1945 года генерал Макартур отдал приказ об освобождении центральной части Филиппинского архипелага. Благодаря масштабному партизанскому движению на островах, японцы не смогли организовать сплошную береговую оборону и были заперты в нескольких крупных городах, что значительно упростило задачу американскому десанту.
event_intro_485=Битва при Эль-Геттаре. 23 марта 1943 года II корпус армии США (под командованием генерала Паттона) попытался прорвать позиции сил Оси, чтобы выйти в тыл Линии Марет. Американцы успешно сбили передовые дозоры, но немцы ответили мощной контратакой 10-й танковой дивизии. В долине завязались тяжелые встречные бои, которые перешли в позиционный тупик, пока союзники не прорвали фронт на других направлениях.
event_intro_486=Каменец-Подольский котёл (Проскуровско-Черновицкая операция). 25 марта 1944 года войска 1-го и 2-го Украинских фронтов мощными сходящимися ударами окружили 1-ю танковую армию Вермахта. Понимая безнадежность ситуации, немецкое командование (ОКВ) разрешило прорыв. Немцам удалось вырваться из «котла», но они бросили практически всю тяжелую технику и артиллерию, навсегда потеряв способность удерживать фронт на Украине.
event_intro_487=Рейд в Индийский океан. 31 марта 1942 года ударное авианосное соединение японского флота вошло в Индийский океан для уничтожения британского Восточного флота и обеспечения безопасности Бирманской кампании. Японская авиация нанесла сокрушительные удары по базам на Цейлоне (Шри-Ланке). Британский флот понес тяжелые потери в крейсерах и авианосцах, после чего был вынужден спешно отступить к берегам Восточной Африки.
event_intro_488=Битва за Окинаву (Операция «Айсберг»). 1 апреля 1945 года американцы высадились на Окинаве — последнем рубеже перед вторжением на Японские острова. Легко заняв северную часть, на юге армия США столкнулась с фанатичным сопротивлением. Японцы создали колоссальную сеть пещер и дотов (Линия Сюри). Бои превратились в кровавую мясорубку. Потери США составили около 12 000 убитыми, Япония потеряла более 77 000 солдат. Чудовищные потери в этой операции стали одной из причин решения США применить ядерное оружие.
event_intro_489=Северо-Итальянская операция (Операция «Грейпшот»). Последнее масштабное наступление союзников в Италии. 6 апреля 1945 года войска прорвали немецкую «Готскую линию» и начали стремительное продвижение в долину реки По. Одновременно вспыхнуло всеобщее восстание итальянских партизан. Немецкий фронт рухнул, и 2 мая 1945 года остатки сил Оси в Италии капитулировали.

