countrytech_desc_522=Вертолеты имеют 100% шанс на повторную атаку после уничтожения врага.
countrytech_desc_523=Урон от ракетных ударов +30%.


dialogue_3304=Срочно свяжитесь с остальными группами и встречайтесь на базе по этим координатам.
dialogue_3305=В зоне боевых действий внезапно появилась неизвестная армия! Мирные переговоры сорваны. Немедленно открывайте огонь!
dialogue_3306=Осборн, ты жив! Я в окружении многонациональных сил, здесь даже немцы!
dialogue_3307=Я не боюсь смерти, потому что всегда сражался за то, во что верил. Это секретный ключ для меня и Колсона. Остальное — за тобой.
dialogue_3308=Я уже однажды потерпел неудачу, но в этот раз я обречен на успех!
dialogue_3309=Откуда там Уильямс? На чьей они стороне? Что это вообще за оружие?!
dialogue_3310=На поле боя прибыли резервы, но немецкие авианалеты серьезно замедлили наш марш.
dialogue_3311=Связь с союзными частями вокруг базы установлена, все системы функционируют штатно.
dialogue_3312=Мы поможем Колумбии победить и распространим немецкое влияние по всему миру.
dialogue_3313=Здесь постоянно вспыхивают подобные конфликты. Это не первая война, и уж точно не последняя.
dialogue_3314=Почему армия Перу стреляет по нам?! Мы не собираемся складывать оружие и сдаваться!
dialogue_3315=Черт, ты только что командовал отрядом, который атаковал и колумбийскую, и перуанскую армию!
dialogue_3316=Я знаю безопасное место прямо в джунглях, недалеко от пересечения границ трех стран.
dialogue_3317=Так это вы, ребята!
dialogue_3318=Приоритетная задача — прорыв немецкого оцепления. Мы должны пробить коридор для Колсона и его людей.
dialogue_3319=Кто вы такие и почему помогаете нам?
dialogue_3320=Из-за твоего невежества и твоей храбрости.
dialogue_3321=Кажется, мы уже где-то встречались.
dialogue_3322=
dialogue_3323=В любом случае, ясно одно: мы оказались в этой ситуации по вашей вине.
dialogue_3324=Я всё объясню на базе, как только мы устраним остальные угрозы.
dialogue_3325=Африканская армия Франко успешно переброшена на передовую транспортными самолетами. Они начнут наступление на Мадрид с юга.
dialogue_3326=По данным разведки, немецкий легион «Кондор» развернут в полном составе. Боюсь, под их массированными ударами Бильбао быстро падет.
dialogue_3327=Защищайте Мадрид и Барселону до последней капли крови. Не дайте мятежникам взять нас в клещи!
dialogue_3328=Гражданская война действительно началась. Всё произошло в точности так, как предсказывал Осборн.
dialogue_3329=Чтобы ускорить продвижение и замкнуть кольцо вокруг Мадрида, моя авиация выжжет остатки республиканских сил на севере.
dialogue_3330=По данным разведки, на востоке высадились элитные итальянские части. Судя по вектору движения, они планируют пересечь пустыню и ударить нам во фланг.
dialogue_3331=Ни шагу назад! Используйте бронетехнику для поддержки пехоты и укрепления восточного фланга!
dialogue_3332=Надеюсь, я не опоздал. Операция в Англии идет по плану.
dialogue_3333=Мы отбросили армию Франко, но мятежники продолжают подтягивать резервы с юга.
dialogue_3334=Они разгадали наш замысел, но мы успели нарушить их оборонительные порядки. Операция завершена. Пора уходить.
dialogue_3335=Спасибо за своевременную поддержку, но, боюсь, республиканцы эту войну уже проиграли.
dialogue_3336=Командование приказало всем добровольческим отрядам собраться на востоке и готовиться к эвакуации.
dialogue_3337=Надеюсь, твой «комплекс спасителя» не затянет тебя в эту трясину с головой.
dialogue_3338=Золотой век Испании давно миновал. Страна застряла во временной петле, как и её бывшие колонии.
dialogue_3339=Эпоха колонизаторов, военачальников и капиталистов подошла к концу. Мир жаждет перемен, и ему нужен я. А мне нужны вы.
dialogue_3340=Проамериканское правительство Ирана дает США геостратегическое преимущество на Ближнем Востоке. Мы не должны повторить ошибок Корейской войны.
dialogue_3341=Мы прекрасно знаем методы Эйзенхауэра и его союзников, поэтому наши контрмеры были готовы заранее.
dialogue_3342=Советы нас подставили! Они взяли под контроль Тегеран и города на севере, и даже вторглись в Ирак и Турцию!
dialogue_3343=Действуем по плану. У нас есть свои козыри.
dialogue_3344=Лукас много о вас рассказывал. Учитывая вашу позицию, мне очень интересно, что вы предпримете на этот раз.
dialogue_3345=Нефтяной бизнес подарил нам много богатых друзей на Ближнем Востоке. И у нас есть общий враг — этого вполне достаточно.
dialogue_3346=Но сейчас нам нужно сохранить видимость нейтралитета. Впрочем, мы вполне можем оплатить этот небольшой военный счет.
dialogue_3347=Мы не будем открыто вводить войска, но обеспечим ваши силы бесперебойным снабжением.
dialogue_3348=Наемники и вооруженные отряды уже тайно заняли позиции вокруг крупных городов.
dialogue_3349=Что это за артиллерия?!
dialogue_3350=Позже я с удовольствием прочитаю вам лекцию о её конструкции.
dialogue_3351=Тотальное наступление советских войск угрожает нашей базе!
dialogue_3352=По достоверным данным, враг смещает направление главного удара и перебрасывает крупные резервы в Иран.
dialogue_3353=Мы выжжем советскую власть с этой земли.
dialogue_3354=Управление спутником перехвачено. Орбитальное оружие активировано.
dialogue_3355=Советские части в вашем секторе будут уничтожены. Мы обеспечим вашу безопасность.
dialogue_3356=Уничтожьте советские войска вокруг себя, и мы гарантируем вам безопасность.
dialogue_3357=Повстанцы захватили наш исследовательский институт на Сахалине. Мы мобилизуем все силы для его возвращения.
dialogue_3358=Даже имея на руках данные от советских «кротов», организовать похищение в такие сроки было невозможно.
dialogue_3359=Наши совместные исследования уже давали плоды, и я не заметил, как за моей спиной организовали покушение.
dialogue_3360=Новый договор о безопасности между США и Японией — это предательство наших интересов! Мы будем сражаться до победы или смерти!
dialogue_3361=Мятеж в Японии отвлек на себя внимание американских военных. Это идеальный момент для нашего отхода.
dialogue_3362=Нет. Лидер повстанцев — одна из наших главных целей для эвакуации.
dialogue_3363=Разве может человек, рожденный свободным, вечно пресмыкаться перед другими?
dialogue_3364=Впереди еще много работы. Воле Господа противиться нельзя.
dialogue_3365=Главные опорные пункты врага уничтожены. Присоединяйтесь к нам. В одиночку нам эту войну не выиграть.
dialogue_3366=Мудрый видит время, храбрый видит возможность. Я в деле. Наша борьба еще далека от завершения.
dialogue_3367=Спасибо, что вытащили меня. Теперь мне есть где укрыться.
dialogue_3368=Эти сепаратисты под руководством Осборна разрывают Союз на части. Пора вырвать ядовитое жало «Черного Скорпиона» из тела Восточной Европы.
dialogue_3369=В Восточном блоке нарастает раскол, и я боюсь, что Советы давно планировали решить эти проблемы силой оружия.
dialogue_3370=Контракт выполнен, я доказал полезность себя и своей семьи. Если понадобятся дополнительные военные услуги — обращайтесь.
dialogue_3371=Советская армия перешла все границы. Мы не потерпим чужих войск на нашей территории.
dialogue_3372=В политике нет вечных друзей и вечных врагов. Немедленно перебросить подкрепления в Югославию и Румынию! И берегитесь агентов «Черного Скорпиона».
dialogue_3373=Советская разведка докладывает: Вагнер переметнулся к «Черному Скорпиону».
dialogue_3374=Как такое возможно?!
dialogue_3375=Сражайтесь за Советы или сражайтесь за себя. Выбор за вами.
dialogue_3376=Если вам нужен ответ — вы его получите.
dialogue_3377=Никто не может предвидеть всё. Никто не в силах единолично решить исход войны.
dialogue_3378=Похоже, вы просто так меня не отпустите.
dialogue_3379=В моих руках эта артиллерия раскроет свой истинный потенциал.
dialogue_3380=Советская группировка в Польше разгромлена. Мои войска продолжат наступление на восток.
dialogue_3381=Даже серия локальных побед не смогла пошатнуть гегемонию США и СССР в Европе.
dialogue_3382=Это так. Но мы не упустим ни единого шанса заставить наших врагов обескровить друг друга.
dialogue_3383=Война на Восточном побережье в самом разгаре. Повстанцы Калифорнии и Техаса создали альянс и постепенно перехватывают инициативу.
dialogue_3384=Америке не нужен слабый президент.
dialogue_3385=В любой тактике есть изъяны. Неуязвима только скорость.
dialogue_3386=Если мы первыми захватим тыловой штаб мятежников, война закончится быстрее.
dialogue_3387=Положение на Восточном побережье безнадежно. Боюсь, ситуация здесь тоже скоро выйдет из-под контроля.
dialogue_3388=Возможно, пришло время остановиться и перейти от нападения к глухой обороне.
dialogue_3389=Отходим на наши базы в Мексике и следим за маневрами американской армии в Техасе.
dialogue_3390=Вашингтон взят альянсом повстанцев! Мир в очередной раз узрит нашу волю и нашу мощь!
dialogue_3391=К какой бы фракции Америки ты ни принадлежал, Осборн и его «Черный Скорпион» — наши общие враги.
dialogue_3392=Пусть будет так. Приступаем.
dialogue_3393=По мере того как ситуация в стране стабилизируется, всё больше сил присоединяется к нашему крестовому походу против «Черного Скорпиона».
dialogue_3394=Мы добились колоссального прорыва в анализе антарктических артефактов. Ни одна чужая армия не должна ступить на льды Антарктиды!
dialogue_3395=Наши исследования близки к завершению. Пора показать этим невеждам нашу истинную силу!
dialogue_3396=Нет! Как такое возможно?!
dialogue_3397=Похоже, наши диверсии не сильно замедлили советскую программу разработки, но время у нас еще есть.
dialogue_3398=Базы данных «Черного Скорпиона» успешно восстановлены. Данные доказывают: мы подверглись нападению из будущего! Но следов Осборна нет.
dialogue_3399=Флот заблокировал акваторию к востоку от архипелага. Связь между базами «Черного Скорпиона» отрезана.
dialogue_3400=Зачистить Антарктиду. Никто не должен уйти отсюда живым.
dialogue_3401=Разработка новых прототипов ОБТ завершена. Их разрушительная мощь была блестяще доказана во время конфликта в Южной Америке.
dialogue_3402=Советские исследования увенчались успехом. Если это оружие пойдет в серию, последствия будут катастрофическими.
dialogue_3403=Еще не поздно остановить советскую военную машину. Мы сделаем это вместе.
dialogue_3404=Помимо этого передового вооружения, существует еще одна, куда более невероятная технология.
dialogue_3405=Осборн, оказывается, твое главное оружие — это твое невежество.
dialogue_3406=Армия обратилась в пепел. Мир горит у моих ног.
dialogue_3407=Осборн, ты в порядке?
dialogue_3408=В мрачной тьме далекого будущего есть только война.
dialogue_3409=Его словно подменили.
dialogue_3410=Двенадцать ключей собраны воедино, а я всё еще жив.
dialogue_3411=Война никогда не меняется.

