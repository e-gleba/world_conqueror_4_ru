skill_info_170=When commanding armored units, damage dealt is increased by [#00FF00#%d%%]. After each attack, the unit restores HP equal to 10%% of the damage dealt. While any buff is active, the armored units' critical hit chance increases by 10%% and its attacks ignore 30%% of the enemy’s defense. Units can move unimpeded by enemy blocking. If a target survives an attack, the unit may make one additional attack (once per turn).
skill_info_171=When commanding armored units, its morale cannot diminish. When attacking, there is a [#00FF00#%d%%] chance the enemy cannot counterattack. After eliminating an enemy, gains the "Reaping" effect for 1 turn (effect increases damage dealt by 20%% and ignores dodge). For every 30 attack of armored units under command, increases critical attack damage by 5%%. If the unit’s attack reaches at least 180, its range is increased by 1.
skill_info_172=When commanding infantry units, there is a [#00FF00#%d%%] chance to deal a critical attack and recovers 15%% of your maximum HP each turn. At the same time, the commander and all infantry units within a 2-hex radius deal 30%% more damage and receive 25%% less damage. (If the general has this skill, the effects of Infantry Leader are inapplicable.)
skill_info_173=When commanding land units, [#00FF00#%d%%] of the economy spent during the turn will be regained in the next turn (up to 1200). When commanding land units, for each enemy eliminated within 3 hexes of the commanding units, you gain 40 Industry and 4 Technology (can be triggered up to 3 times per turn).
skill_info_174=Submarine units under command (excluding nuclear submarines) ignores enemy defense, and their attack range is increased by 1; after eliminating an enemy, there is a [#00FF00#%d%%] chance to attack again, and the chance can be increased by an additional 25%% if a critical attack is dealt.
skill_info_175=Submarine units under command receive [#00FF00#%d%%] less damage and have a 50%% chance to dodge when attacked by airstrike or missile. Submarine recover 5%% of its maximum HP each turn.

