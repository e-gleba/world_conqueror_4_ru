skill_info_152=Boosts [#00FF00#%d%%] dodge rate and 4 mobility when commanding an air hover unit, and decreases 30%% taken damage from air forces. Boost critical strike damage 1%% based on 1%% dodge rate when air hovering units attack.
skill_info_153=Reduces air force command (except airborne troops) and missile consumption by 20%%. Gain “Echeloned Offensive” after commanding air force and missile attacks. When the air force and missile attack, ignores enemy [#00FF00#%d%%] defense and inflicts critical strikes on any enemy with less than 20 final defense (nukes are ineffective), and effect is clear at the end of the turn.
skill_info_154=Economic and industrial income +[#00FF00#%d] when the commanding force with no enemy troops at 1 square around.
skill_info_155=After commanding a unit attack, it causes the target and 2 enemy units 1 square around it to have a [#00FF00#%d%%] probability of getting “Fatigue” for 1 turn. Troops with “Fatigue” have an additional 6%% HP reduction from attacks and air strikes, and their morale is lowered. The Fatigue effect does not apply to troops that are already demoralized.

army_buff_desc_1461=Echeloned Offensive: when commanding air force and missile attacks, 15% of the enemy's defense is ignored, and will always deal critical strikes to any enemy with less than 20 final defense.
army_buff_desc_1462=Echeloned Offensive: when commanding air force and missile attacks, 30% of the enemy's defense is ignored, and will always deal critical strikes to any enemy with less than 20 final defense.
army_buff_desc_1463=Echeloned Offensive: when commanding air force and missile attacks, 45% of the enemy's defense is ignored, and will always deal critical strikes to any enemy with less than 20 final defense.
army_buff_desc_1464=Echeloned Offensive: when commanding air force and missile attacks, 60% of the enemy's defense is ignored, and will always deal critical strikes to any enemy with less than 20 final defense.
army_buff_desc_1465=Echeloned Offensive: when commanding air force and missile attacks, 75% of the enemy's defense is ignored, and will always deal critical strikes to any enemy with less than 20 final defense.
army_buff_desc_1471=Fatigue: after being attacked and air strikes, reduces an additional 6% HP, and the morale is lowered. The Fatigue effect does not take effect on units that have been demoralized.

