dialogue_3138=Our troops are far superior to the Japanese, we must destroy them in Singapore. Let U.S. and Soviets see the dignity and honor of Britain!
dialogue_3139=The east bank is flat, making it easy to land. Be sure to guard against the Japanese landing from here!
dialogue_3140=Our troops are far inferior to the British in strength and supplies, and we must use tactics to force them to surrender, rather than fight a war of attrition with them!
dialogue_3141=The enemy is so vulnerable. Attack with all might and shatter their will to resist!
dialogue_3142=Our troops have occupied Bukit Timah. Your granaries and water sources are no longer secure. Just give up this pointless, desperate resistance!
dialogue_3143=The elite troops shall make every effort to retake Bukit Timah! Otherwise, when the supplies run out, we'll never be able to continue the fight!
dialogue_3144=Eliminate the elite British counter-attack force! When the British run out of supplies, they will agree to surrender unconditionally!
dialogue_3145=Singapore's supplies are exhausted. We can't fight any longer. Inform the Japanese that we agree to surrender.
dialogue_3146=This operation is to deliver the main fleet safely to a German port. The opportunity to pass through the channel is limited, so we must be quick!
dialogue_3147=Search them carefully. They must be sunk! No enemy fleet can pass through the English Channel in wartime!
dialogue_3148=Target fleet in sight! Sink them!
dialogue_3149=The mountain passes in central Tunisia are the fulcrum of our attack on the eastern plains. The troops must hold on to them, and no failure is accepted!
dialogue_3150=Split the army in two, one attacking Sidi Bouzid from the south, the other to the northwest. We cannot leave these passes to the enemy!
dialogue_3151=The enemy is beginning to retreat. Continue the attack and beat them to a foothold!
dialogue_3152=We have an intel that the main ships of the Japanese Combined Fleet are anchored at Truk. Soldiers, it's time for Japan to pay back the interest on Pearl Harbor!
dialogue_3153=The Japanese beachhead forces had been silenced by artillery fire and you are permitted to land!
dialogue_3154=Gentlemen, the final hour has come! We must bury more enemies here!
dialogue_3155=Attention to the land troops: the Japanese have bunkers to hide their firepower. Be alerted! Be alerted!
dialogue_3156=Fire! Fire! No one is permitted to Banzai charge. Everyone must hold their ground and fight to the last!
dialogue_3157=In the face of quantitatively and qualitatively superior land, sea, and air attacks, I have done my best, but now I am very sorry for losing the critical passes to the hands of the enemy.
dialogue_3158=German units are surrounding our army in the north and south, and to prevent them from impeding the attack we must clear them!
dialogue_3159=I've done my best, but the situation is overwhelming. Now, all I ask for is a dignified ending.
dialogue_3160=Enemy fleet sighted in the direction of Surabaya. Finish them off and Java is ours!
dialogue_3161=Attention all ships. The Japanese fleet is approaching Surabaya, preparing for battle!
dialogue_3162=The enemy fire was so fierce that the damaged ships retreated first for repairs.
dialogue_3163=How can I sink in my home waters?
dialogue_3164=The Lae front is now in desperate need of troops. The arrival of these troops will alleviate the situation, and it is important to ensure their safe delivery!
dialogue_3165=Attention all units, the Japanese troop carriers have moved out. Finish them off! Take the pressure off the front line.
dialogue_3166=Our army is short of supplies. We can't fight a war of attrition on the defense line. Attack, and make sure to beat the enemy back before the defense line!
dialogue_3167=Soldiers, be on guard! The enemy will attack soon. Without enough supplies, they won't last long!
dialogue_3168=No, if we keep fighting, there won't be enough troops left to defend the Mareth Line. All troops retreat!
dialogue_3169=Soldiers, the Japanese are about to attack. Hold your positions and be disciplined. We will surely be victorious!
dialogue_3170=Don't worry, the airdrops will be enough to keep us supplied. Hold Imphal. The vast dense forests are enough to collapse the enemy's supplies!
dialogue_3171=Take back Imphal!
dialogue_3172=The Japanese army is running low on supplies and the offensive will only get weaker. Soldiers, let's show our courage and prove that the Japanese are by no means invincible!
dialogue_3173=The Japanese army is defenseless. Clear Japanese troops on the island and liberate Mindanao!
dialogue_3174=Adhere to the strategy of “permanent resistance” and never give up any stronghold easily!
dialogue_3175=The French defense line is still quite reliable. Hold the line and we won't lose!
dialogue_3176=Keep the pressure on the front and wait for the maneuvering force to attack from the left side of the line and break the line with the “left hook”!
dialogue_3177=Damn it! How did the British get to the right side of the line? All troops listen to the order. Abandon the defense line and retreat to the north.
dialogue_3178=This defense line can no longer be held. The Mareth defenders retreat quickly and don't tangle with the enemy!
dialogue_3179=Attack and crush them completely!
dialogue_3180=I shed my last drop of blood for the King. My life has been honorable enough.
dialogue_3181=The sea has been cleared, and the central islands of the Philippines shall be under our control!
dialogue_3182=The troops defending the island must use all means to tangle with the enemy and do their utmost to prevent the enemy from seizing the island!
dialogue_3183=The eastern plains must be secured. The enemy must not be allowed to break through our defenses!
dialogue_3184=Breaking through enemy lines and advancing the front into the eastern plains!
dialogue_3185=Surrender or we will take no German in the pocket as a prisoner.
dialogue_3186=The 1st Panzer Army retreat to the west, making a pose to break out to the southwest, ready to echo reinforcements from the northwest!
dialogue_3187=Dismiss me? That idiot! Without his haphazard command, none of this would have happened!
dialogue_3188=There are German reinforcements to the northwest? Stop them. We can't let that be a breach.
dialogue_3189=Attack! This battle will wipe out the Eastern Fleet!
dialogue_3190=The enemy is coming towards us? Advance and sink all the enemy's main ships!
dialogue_3191=Are you stupid pigs? How dare you get sunk by the enemy! Retreat! Go back to the harbor first for repairs.
dialogue_3192=Okinawa is an important springboard for an attack on the Japanese mainland, and taking it will allow us to end this war as quickly as possible.
dialogue_3193=The enemy has launched a suicide attack. Evasive action!
dialogue_3194=The Italian partisans will support us. Beyond this ridge, there's a flat path! Advance and liberate Italy!
dialogue_3195=For the sake of our remaining territory, our army will cooperate with the German defense.
dialogue_3196=Seal off the passes around Lake Garda. The enemy cannot be allowed to escape, they must be eliminated!
dialogue_3197=Damn it, where did that mob come from? Suppress them. Arrest anyone who interferes with the military administration!
dialogue_3198=I am the supreme leader of the Italian army. I surrender on behalf of the Italian army.


