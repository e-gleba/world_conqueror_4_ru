dialogue_4121=Four in the morning, and the storm rages on. Everyone awaits the final word—postponement, or go.
dialogue_4122=The staff officers were still debating the tides, the cloud coverage, and the moon. I was the only one who realized that months of drills had all led to this very moment. Hesitation is far more deadly than enemy shells.
dialogue_4123=Let's depart. May God have mercy on us all.
dialogue_4124=The seas are too rough; even the patrol planes cannot take off. The staff headquarters’ message indicates that the Allied forces will not conduct operations in such adverse weather conditions.
dialogue_4125=The sea fog is exceptionally thick today. … What’s that behind the fog? Fishing boats? One boat, two boats… Wait a second—oh my goodness, the entire sea is trembling!
dialogue_4126=It’s the Allied fleet! It’s the Allied fleet! Launching an operation in this weather? They must be out of their minds! Sound the alarm—now! All personnel, assume Level One combat readiness! Immediately notify the artillery and machine gunners to take their positions—this is a landing operation! They’re coming ashore!
dialogue_4127=Paratroopers? They thought they had found a breakthrough. That stretch of land, entirely made up of shallow waters and waterlogged ground, was precisely the trap the Marshal had set in advance. They lost the instant they leapt from the plane.
dialogue_4128=Excellent! Let them swim in the muddy water! The Reich welcomes their "adventurous spirit."
dialogue_4129=The coastal defense line is tougher than we expected, and the enemy’s machine gun fire is laying down a curtain of steel! Tell the battleships and the air force to blast those bunkers off the map!
dialogue_4130=I can see my men still struggling in the water! Send the rescue boats at once—whatever it takes! I won’t leave them to drown alone in this sea!
dialogue_4131=Every inch of the beachhead, every trench, every bunker is a key to the European continent. Retake them! That is our way home.
dialogue_4132=Keep in contact with the fleet—damn it, we need air support! Mark our aircraft as agreed!
dialogue_4133=All units, attention! The German armored group is assembling! This is their final counterattack, and it's our moment to determine victory or defeat!
dialogue_4134=They’re still coming ashore… countless vessels, coming in waves one after another. My God, are they insane? The defense line is collapsing! We can’t hold them off much longer! Requesting orders… I repeat, requesting orders…
dialogue_4135=Field Marshal Rommel is in Berlin at this very moment... No one can give us any orders now, and there are no reinforcements; we can only rely on ourselves!
dialogue_4136=Marshal Rommel has arrived at the front line! Now it's our turn to counterattack! The English Channel will become their grave!
dialogue_4137=Soldiers, now we must make them understand: a German soldier may fall, but he never kneels; even if only one remains, this shore will not be taken easily.
dialogue_4138=The soldiers are praying. They no longer chant slogans; they merely want to live… The air is filled with the stench of gunpowder, gasoline, seawater, and charred flesh.
dialogue_4139=We’ve lost the beach. The landing has failed… Order all troops to retreat to the ships. We lost this battle, but we will not lose the war. One day, we shall return.
dialogue_4140=This was the gravest mistake we committed... underestimating the final retaliation of an empire on the brink of collapse.
dialogue_4141=It seems we have won this battle, yet I wonder: are we truly defending our fatherland, or just a soulless illusion? or just a dream that has long lost its soul? The Führer draws borders from afar, but has never witnessed how the soldiers fall, one by one.
dialogue_4142=Blind obedience is a soldier’s instinct, but rational doubt is also a fundamental human right. When the day comes that everyone learns to think, then—and only then—can the Reich be saved.
dialogue_4143=I have never hated those on the opposing side; they too are fathers and sons compelled by orders to go to their deaths. Perhaps our only difference lies in which side fate placed us.
dialogue_4144=May this battle not be the end of the war, but the beginning of the Reich's rebirth.
dialogue_4145=I have kept my soldier’s oath… Do not let the enemy set foot in Berlin—not one inch.

event_107=The Normandy Defensive Line
event_intro_107=In the summer of 1944, the Allies amassed an unprecedented force in Britain, with artillery and steels combining into a raging tide, ready to set foot once again on the opposite shore of the English Channel. The German army was defending the northern coast of France, facing a storm that was bound to come sooner or later. The soldiers waited with bated breath among dunes and concrete bunkers. On the morning of June 6th, the sea off Normandy was transformed into a gray-white expanse by countless landing craft, and the skies reverberated with the roar of aircraft. For the Germans, this was more than a mere defensive action; it was a struggle against fate itself. Amid unrelenting bombardment, Europe’s fate hung in the balance on these beaches, as German soldiers faced their longest and most forsaken day on the Western Front.

dialogue_4154=This is a limited raid operation with the primary objective of eliminating the Italian strongholds in and around Sidi Barrani, and to swiftly recapture and control the coastline of Sidi Barrani.
dialogue_4155=We successfully captured Sidi Barrani and captured a large number of Italian troops.
dialogue_4156=Press the offensive. The Italian-Libyan forces have been captured in large numbers, and the enemy is utterly unprepared. We must press our advantage further!
dialogue_4157=All legions, guard the coastline vigilantly. Cyrenaica must not fall.
dialogue_4158=The British offensive is extremely fierce. I cannot let the 10th Army get pinned down in Cyrenaica. All units, reorganize and prepare for withdrawal from Cyrenaica.
dialogue_4159=Perhaps, we could consider traversing the desert to block the defending troops in Benghazi from retreating west.
dialogue_4160=A fox was hunted down in a wide-open area.
dialogue_4161=Alright, notify all units: the Benghazi forces have been eliminated, proceed with full force to attack and occupy Cyrenaica.
dialogue_4162=Defeat the enemy forces in the Western Desert, then drive them back to the west of Tobruk.
dialogue_4163=Fort Capuzzo was successfully captured.
dialogue_4164=The German army, taking advantage of the 88mm Flak guns and Halfaya Pass’s strategic terrain, successfully held back the British offensive.
dialogue_4165=The 15th Panzer Division swiftly reinforced Fort Capuzzo, while the 5th Light Division advanced behind British lines to reinforce the Halfaya Pass.
dialogue_4166=The German forces are about to cut off our retreat. We must not let our troops get encircled. Inform the front line: abandon the operational objectives and retreat immediately.
dialogue_4167=The British forces recaptured the Halfaya Pass. The crucial choke point on the coastal road returned to British control.
dialogue_4168=Great, keep moving along the coastal road.
dialogue_4169=Notify all units: The battle plan has been adjusted. Halt all support for Halfaya Pass and focus all efforts on encircling and eliminating the enemy forces west of the pass.
dialogue_4170=In this battle, we must defeat the German forces and break the siege of Tobruk.
dialogue_4171=7th Armored Division, attention! You are hereby ordered to capture the Sidi Rezegh Airfield and stand by for the opportune moment to launch an offensive against Tobruk.
dialogue_4172=After successfully capturing Sidi Rezegh, the Tobruk garrison is preparing for a breakout.
dialogue_4173=After successfully capturing Sidi Rezegh, the Tobruk garrison prepares for a breakout.
dialogue_4174=Soldiers, hold on! Reinforcements are coming. We must let the "fox" bleed at this airfield!
dialogue_4175=The British attacking forces were overwhelmingly large in number. We have no choice but to strike their rear to force their withdrawal.
dialogue_4176=Attention, panzers: flank from the southern desert into Egypt, destroy the British supply stations at the rear with all force, and relieve the border fortresses.
dialogue_4177=The mobile forces rapidly support Sidi Rezegh, while the main forces advance all-out along the coast toward Tobruk.
dialogue_4178=The Bardia forces withdrew toward Tobruk, strengthening the siege of Tobruk.
dialogue_4179=The entire army carries out the plan: in the south, we launch a feint to divert the enemy’s attention; in the north, we concentrate superior strength to destroy the enemy’s main force.
dialogue_4180=I need to go back to Europe to recuperate. The enemy may have large-scale actions in the near future, and it is necessary to strictly follow the defense plan to carry out the operation.
dialogue_4181=The acting commander of the Italo-German Armored Corps was killed in action; Rommel returned to North Africa to once again assume command of the forces.
dialogue_4182=I have resumed command of the panzers. The panzers are regrouping in the north, preparing to recapture those positions.
dialogue_4183=Withdraw from the southern defense line and retreat in an orderly manner toward the northern coastline.
dialogue_4184=The 7th Armored Division is redeployed to the north to spearhead the main offensive. Operation Supercharge is launched.
dialogue_4185=The oil tanker sank, plunging the Axis armies into a fuel crisis.
dialogue_4186=With our fuel supplies running low and our forces suffering heavy losses, we must retreat to maintain our fighting strength.
dialogue_4187=Continue the attack, push into the coastal plains, and destroy the enemy’s supply lines!
dialogue_4188=The coastal plain is within sight. Take a short break and prepare to advance into the coastal plain!
dialogue_4189=Armored units have moved out; the supply line on the coastal plain must remain secure!
dialogue_4190=A sudden sandstorm struck the battlefield, plunging both warring sides into a predicament of poor visibility.
dialogue_4191=Given the deteriorating situation in Tunisia, Rommel was recalled from North Africa to prevent the defeat there from tarnishing his prestige and, in turn, undermining morale on the home front.
dialogue_4192=On behalf of the remaining German forces in Africa, I hereby surrender to the Allies.
dialogue_4193=Following the collapse of the German army, Italy issued a surrender order to General Messe.
dialogue_4194=On behalf of the 1st Italian Corps, I hereby surrender to the Allies.
dialogue_4195=Without prior airstrikes and naval artillery bombardment, the Germans cannot anticipate when we will launch a surprise attack. Attack! Use a surprise attack to shatter the German lines!
dialogue_4196=Give up your attack! We are fully prepared to face you.
dialogue_4197=Due to Clark's flawed planning, the landing troops were placed at a disadvantage.
dialogue_4198=Damn it! The enemy already anticipated this attack. Immediately notify the navy to open artillery fire to subdue the enemy's counterattack!
dialogue_4199=Under the cover of naval gunfire support, the Allied forces successfully landed at Salerno.
dialogue_4200=All units establish defenses in mountainous terrain to slow the enemy’s advance.
dialogue_4201=Abandon Naples. All units are to retreat toward the Winter Line.

