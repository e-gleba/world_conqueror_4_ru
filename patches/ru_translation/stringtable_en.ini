armygroup_event_desc_98=The Warsaw Pact armored group army launched a fierce assault toward the north bank of the Rhine, aiming to break through West Germany’s “Rhine Defense Belt” within 48 hours. U.S. combat engineers were forced to destroy several bridges to slow the advance.
armygroup_event_desc_99=A multinational NATO fleet carried out coordinated an anti-submarine operation in the North Sea, where the two sides engaged in several close-range battles, damaging multiple Soviet submarines. The strait’s coastal cities have entered a first-level defense readiness.
armygroup_event_desc_100=Street fighting erupted simultaneously in East and West Berlin, with East German troops using buildings and factories to establish multiple firing positions. The West Berlin garrison, supported by U.S. airdrops, launched a flanking maneuver to break through. Berlin became one of the fiercest battlegrounds on the European continent.
armygroup_event_desc_101=At dawn, Soviet Airborne Divisions launched a surprise attack on an airport east of Brussels, aiming to cripple a key NATO supply hub. Belgian and Dutch armored brigades rushed to mount a counteroffensive, leading to fierce fighting that triggered an explosion in part of one of Europe’s largest ammunition depots.
armygroup_event_desc_102=The Soviet artillery forces employed heavy concentrations of artillery fire to saturate the frontlines of West Germany, forming a "belt of ashes." Urban infrastructure across West Germany was severely damaged.
armygroup_event_desc_103=Warsaw Pact forces swiftly redirected their offensive into southwestern Czechoslovakia, launching a high-speed armored thrust to sever NATO’s southern supply line. French and Italian forces dispatched rapid deployment forces as reinforcements.
armygroup_event_desc_104=The NATO air force conducted precision bombing on Budapest, the Warsaw Pact’s communication hub. The Hungarian People’s Army immediately deployed multiple air defense installations. Hundreds of anti-aircraft rockets lit up the night sky. As a result, the entire city was placed under martial law within two days.
armygroup_event_desc_105=The Romanian artillery regiment joined forces with Soviet forces to construct in-depth defensive lines in the Carpathian Mountains, aiming to block the reinforcement routes from Italy and southern Germany. NATO mountain troops were forced to break through along exceedingly rugged alternative routes, their supply lines on the brink of collapse.
armygroup_event_desc_106=NATO imposed a blockade on Odessa, attempting to cut off the Soviet Union's southern supply lines. WTO launched missiles to conduct counter-blockade operations. Missile trajectories were detected at multiple points along the coastline, placing enormous pressure on Odessa's air defense system.
armygroup_event_desc_107=The navies of Sweden, Denmark, and Germany jointly blockaded the Baltic Sea’s exits. The Soviet Baltic Fleet attempted a simultaneous breakthrough from Riga and Kaliningrad, but was tracked in real time by NATO reconnaissance aircraft, triggering naval and aerial clashes in both locations.
armygroup_event_desc_108=The Soviet Long-Range Aviation Forces launched a saturation missile attack on London, causing widespread fires along the south bank of the Thames. The British wartime cabinet urgently ordered the nation to enter the highest level of readiness, and communication with London’s command hub was briefly lost.
armygroup_event_desc_109=Manchester fell, and the industrial areas surrounding Manchester were forced to halt production. A critical shortfall of key components quickly emerged in the British defense industry, prompting NATO to urgently coordinate with Canadian and American industrial capacities to fill this shortage.
armygroup_event_desc_110=The fall of Liverpool significantly restricted NATO’s Atlantic supply routes. The U.S. Military Sealift Command temporarily rerouted via Iceland, forcing the entire Western Front to revise its supply operations.
armygroup_event_desc_111=The Soviet Air Force carried out a deep incursion from the Baltic Sea, inflicting heavy damage on the port facilities in Gothenburg. Sweden has been placed on its highest level of air defense alert.
armygroup_event_desc_112=Copenhagen was occupied by the Warsaw Pact shock brigade, and strategic control of the Danish Straits was seized by the Soviet Army. NATO lost its ability to exit the Baltic Sea.
armygroup_event_desc_113=A Warsaw Pact missile exploded over the Champs-Élysées, unleashing a massive shockwave that swept through the entire avenue. The Élysée Palace immediately lost all external communications, and the President was rushed to an underground command center.
armygroup_event_desc_114=After the Warsaw Pact assault troops broke through the outskirts of Brussels, NATO headquarters faced an impending threat. To prevent intelligence leaks, NATO carried out “Operation Nocturnal," during which some secret files were destroyed as an emergency measure.
armygroup_event_desc_115=The Port of Rotterdam came under heavy missile and artillery bombardment, turning a large number of oil depots and container terminals into an inferno. NATO’s sealift capacity has significantly decreased, leading to widespread supply delays for frontline units across the board.
armygroup_event_desc_116=Venice is under attack from both sea and air, with multiple historic districts having had to be evacuated. The Italian military is locked in a fierce struggle, yet still struggles to hold back the armored forces approaching from the east.
armygroup_event_desc_117=With the fall of Sevastopol, the Black Sea Fleet was forced into a full-scale withdrawal northwards, leaving a serious breach in the Soviet Army’s southern defensive flank.
armygroup_event_desc_118=Minsk has fallen, causing the destruction of the Warsaw Pact’s central stronghold. The Red Army command initiated an emergency evacuation, leaving the entire Smolensk corridor in a state of panic.
armygroup_event_desc_119=With Warsaw occupied by NATO, the Polish main front collapsed instantly. The principal forces of the Soviet Army and the Polish People's Army were forced into a rout towards Brest, leaving the entire western flank of the Warsaw Pact exposed to enemy fire.
armygroup_event_desc_120=Kiev fell to NATO, which forced several Soviet armies to retreat across the Dnieper River to regroup, leaving a massive strategic vacuum across the entire south-central front.
armygroup_event_desc_121=London has fallen. The entire United Kingdom is now under martial law. With its foothold in Britain lost, NATO’s western flank stands on the verge of collapse, and the collapse of the English Channel defenses has upended the balance across the North Sea and the Atlantic.
armygroup_event_desc_122=The Warsaw Pact conducted large-scale electronic jamming operations along the Central European front, rendering all NATO radars within a radius of dozens of kilometers inoperable.


