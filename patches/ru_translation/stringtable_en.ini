event_stage_intro_20801=The Germans surprised us by bypassing the Maginot Line and the Low Countries fell successively. Command launched Operation Dynamo, ordering us to cover the retreat of the main French army and the Expeditionary Force towards Dunkirk and Calais. In this age of force worshiping, the consequences of appeasement can only be borne by us. No matter how dangerous the front may be, we will diligently carry out our orders! For the honor of the family! For the sake of our comrades in arms! For the Royal Air Force! For the British Empire!
event_stage_intro_20802=We missed the best chance to retreat. Alfred bailed out during the air battle, and his fate is uncertain. However, eyewitness information has been whispered to us - Alfred and other captured comrades are held temporarily in a mountain town and will soon be transferred to Berlin. Time is running out, and no matter how uncertain the intelligence is, we have to give it a try, we can't give up on our brothers.
event_stage_intro_20803=The defeat of the Allies on the Western Front proved that the ground battlefield is critical to the current war, and the armor units are the key to the ground battlefield. The defeat of the army in North Africa is just like the defeat of the European battlefield at the same time. The difference is that the Germans are still attacking rapidly, but we have an advantage in the supply of equipment and men. Our armored divisions will be invincible in North African theatre.
event_stage_intro_20804=Operation Fortitude has worked successfully, and the German fortifications in Normandy have not yet been completed! And no enemy heavy firepower has been found on the golden beaches before us. The opportunity is at hand! I will quickly clear a beachhead to pave the way for a friendly landing. This is the moment we will fight together and embark on the journey to regain victory!
event_stage_intro_20805=Why do the Germans still have so many troops to organize a massive attack? The defenders of Bastogne are already trapped within the encirclement, with little possibility of withdrawal. Unless reinforcements can anticipate the enemy's movements and support us in time, we can only pin our last hope on the British.
event_stage_intro_20806=The war has completely rewritten the world landscape, and the two poles of the United States and the Soviet Union have become the new hegemonists. The colonies have become independent, the empire is shrinking, and the glory and splendor of the past are in the past. Sooner or later, under the new government, we will become a vassal of the United States. However, a threat has been looming - the Soviets have now taken over eastern Mexico and are traveling north by land intending to invade the United States. The war of the new era has begun, and we must have an armed force of our own to defend the last vestiges of imperial dignity.
event_stage_intro_20807=The discovery of the relics has attracted the attention of both the United States and the Soviet Union at the same time. These epochal weapons and technologies are enough to turn the world upside down, and now the powers are both on the move. However, guided by a mysterious signal, our advanced team got a head start and discovered a cluster of ruins in South America. Whoever those people are, their purpose seems to be the same as mine: to break the existing pattern and re-establish a whole new world order.
