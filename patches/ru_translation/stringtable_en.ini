dialogue_3412=Due to the strain of overextended supply lines, the Soviet offensive has already shown signs of fatigue.
dialogue_3413=Reinforcements are continuously arriving on the battlefield from all directions. Defend our assembly point.
dialogue_3414=Keep advancing! Let the enemy tremble before our iron torrent!
dialogue_3415=The main force has fully assembled; it's time to counterattack.
dialogue_3416=The U.S. counteroffensive opened a gap on our front. Organize the forces around you to destroy this attacking force.
dialogue_3417=We have breached the US military's fortress, and their reinforcements can no longer reach the battlefield!
dialogue_3418=The operation has begun! My fleet will provide cover for the reinforcements to complete their landing.
dialogue_3419=Deploy additional troops around the British garrison in Nassau and blockade the Caribbean Sea to intercept British naval reinforcements.
dialogue_3420=Damn it, the Soviet army had prepared in advance! Our men lacked heavy weapons and were completely unable to stop the enemy's armored offensive.
dialogue_3421=The operation has essentially failed. If the British forces can break out of the encirclement and disrupt the Soviet troop deployments, then we may still have hope for victory.
dialogue_3422=Beware of enemy airborne forces; defense forces in all regions must coordinate their defenses effectively.
dialogue_3423=We have intercepted both the enemy's landing forces and reinforcements and have recaptured southern Havana.
dialogue_3424=The U.S. military's control over this area is not as strong as we expected, so don't be afraid and continue to attack.
dialogue_3425=Our goal has been achieved; temporarily withdraw the frontline troops. After reassessing the situation here, we will certainly return to the Gulf of Mexico.
dialogue_3426=The Soviet forces in Alaska have been pushed back to the Bering Strait. However, it was indeed a decoy; the Soviets have once again mounted a renewed offensive on the East Coast.
dialogue_3427=The events in Cuba have successfully diverted the attention of the U.S. military, and the U.S. government now has very few forces left to deploy.
dialogue_3428=Intelligence has repeatedly been wrong, and we must make our own judgment about the battlefield situation. I will hold my position until reinforcements arrive.
dialogue_3429=A Typhoon-class submarine suddenly cut off contact with us of its own accord; immediately dispatch submarine forces to give chase.
dialogue_3430=New York has fallen, and now we have reached the most dangerous time. We must accelerate our offensive.
dialogue_3431=The command of the Soviet Typhoon-class submarines has been handed over to us, use it well and destroy the enemy's fortress complexes.
dialogue_3432=The U.S. troops in the rear have not yet fully assembled. Now, while the Soviet army hasn't established a firm foothold, we can seize the initiative!
dialogue_3433=Greenland requires our assistance!
dialogue_3434=We will dispatch more troops to protect the area before the Soviet army fully occupies the area.
dialogue_3435=The Soviet army has lost yet another strategic point in their offensive, and my fleet will continue to launch attacks towards Reykjavik.
dialogue_3436=The US military has severed yet another of our supply lines. It is time to consider the matter of retreat.
dialogue_3437=Regroup the fleet surrounding Greenland. Withdraw towards Iceland.
dialogue_3438=The Soviet fleet has nowhere left to retreat. However, the enemy in Europe seems to be taking action. We must engage swiftly and bring this to a quick conclusion!
dialogue_3439=The North American rebels launched their attack at the right moment, and the amphibious assault encountered little resistance. The American forces were already too preoccupied to attend to our actions.
dialogue_3440=The Soviet Army is not our ally, but at present we share the same enemy.
dialogue_3441=The rebel offensive was extremely swift and ferocious.
dialogue_3442=The enemy is advancing rapidly towards the eastern coast.
dialogue_3443=We are utterly unable to hold back the enemy's offensive.
dialogue_3444=How could our frontline troops be defeated so easily! Let's increase troop deployments towards Canada, and we will suppress the domestic rebellion on behalf of our allies.
dialogue_3445=Make every effort to stop the Soviet forces from attacking New York. My men will deal with the allied rebel forces in the west.
dialogue_3446=Osborne had just been defeated. How could he have suddenly reappeared there? We will dispatch more troops to conduct a thorough search of the area.
dialogue_3447=This matter will not just end like this. I will eventually reclaim our inheritance.
dialogue_3448=The US military, using Iceland as its base, has begun continuously mobilizing forces toward Norway, once again advancing into Europe.
dialogue_3449=The Greenland operation provided us with the opportunity to launch surprise attacks on Northern Europe and the United Kingdom.
dialogue_3450=The Soviet forces' rapid two-pronged offensive forced us, making it impossible to effectively split our forces to provide relief in a short period of time.
dialogue_3451=We must rapidly decide on the direction of our main offensive.
dialogue_3452=A large number of Soviet Army troops have already made landfall; unless we intercept them immediately, the consequences will be unimaginable.
dialogue_3453=If action isn't taken immediately, the situation will be irreversible.
dialogue_3454=Beware of the Anglo-American allied fleet coming to provide support, and ensure that you hold off enemy reinforcements before we have occupied all of Norway and Sweden.
dialogue_3455=Block the invading Soviet forces and continue the northward offensive. Do not give the U.S. military an opportunity to interfere in European affairs.
dialogue_3456=The Soviet vanguard troops have already invaded West Germany and Denmark.
dialogue_3457=We have nowhere left to retreat. Advance! Before NATO forces can deploy, restrict their offensive space!
dialogue_3458=No matter what happens, the flame of French resistance cannot be extinguished and will never be extinguished!
dialogue_3459=The nearby threat has been neutralized. All units, prepare to attack.
dialogue_3460=The Soviet Army has already lost control of us. No one can stop the unification of Germany.
dialogue_3461=Advance eastward, this time we will never fail again!
dialogue_3462=If the Soviet army is bound to make a comeback sooner or later, then we should now launch a counteroffensive and resolve this problem once and for all.
dialogue_3463=NATO allied forces have already breached our second line of defense; deploy troops immediately to reclaim our defensive positions.
dialogue_3464=Oslo has already fallen; the situation is dire for us.
dialogue_3465=The Soviet Army around the Baltic Sea has mostly been withdrawn; the time for us to make our move has arrived.
dialogue_3466=This does not meet my expectations and requires more combat data to make adjustments.
dialogue_3467=France has also been defeated. At this rate, our alliance will be no more.
dialogue_3468=Pull yourself together and keep up the attack. Don't let a temporary setback shake your confidence!

