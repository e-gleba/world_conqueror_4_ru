warzone_rule=War Zone Rules
warzone_rule_1=1. Each battle zone is divided into normal levels and a boss level. The boss level is unlocked only after all normal levels have been completed. Normal levels will display the main combat units featured in the current level.
warzone_rule_2=2. Switching or resetting the battle zone requires Command Points, which are restored at fixed times each day (UTC+8 at 08:00 and 20:00).
warzone_rule_3=3. The warzone levels use a point-based system. You earn points by dealing damage to enemy forces (including fortresses and any reinforcements they summon). Once a level is completed, it cannot be re-entered. Generals who have been deployed once in previous turns cannot be redeployed in any coming turns. It is advisable to strategize general deployment in advance.
warzone_rule_4=4. When your all-time highest score in each warzone reaches a certain threshold, you can receive a one-time achievement reward. Each time you clear a boss level, you will also receive a medal reward based on your current total score. (You can view the specific requirements by clicking on the Treasure Chest.)
warzone_rule_5=5. Once your accumulated best scores in each war zone reach a certain threshold, you can unlock the Raid function. By consuming a specified number of raid tickets, you can immediately skip the levels and receive the medals.

mission_to_tutorial=The mission cannot be started without a general. We recommend you clear the three tutorial levels first to obtain a general, then proceed with the mission.

