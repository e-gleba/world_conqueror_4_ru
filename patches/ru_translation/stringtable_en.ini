feat_desc_152=When attacked by land or naval forces, there is a {1}% probability of dodging the damage. When attacked by air strike, there is a {2}% probability of dodging the damage (excluding Missiles and Nuclear Bombs).
feat_desc_153=Damage is increased by {1}% against helicopters. After moving each turn, the next turn’s mobility is reduced by {2} (with minimum movement of 2 tiles) Full mobility are restored after resting for 1 turn within 1 tile of a friendly city or engineering unit.
feat_desc_153_Lv2=Damage is increased by {1}% against helicopters. After moving each turn, the next turn’s mobility is reduced by {2} (with minimum movement of 2 tiles) Full mobility are restored after resting for 1 turn within 1 tile of a friendly city or engineering unit.
feat_desc_153_Lv3=Damage is increased by {1}% against helicopters. After moving each turn, the next turn’s mobility is reduced by {2} (with minimum movement of 2 tiles) Full mobility are restored after resting for 1 turn within 2 tiles of a friendly city or engineering unit.
feat_desc_153_Lv4=Damage is increased by {1}% against helicopters. After moving each turn, the next turn’s mobility is reduced by {2} (with minimum movement of 2 tiles) Full mobility are restored after resting for 1 turn within 2 tiles of a friendly city or engineering unit.
feat_desc_154=Damage dealt to armored and artillery units is increased by {0}%. After attacking a target, if the target is not eliminated, it is inflicted with a Impede effect that lasts for 1 turn. If the target is eliminated, you can immediately attack again, but the damage for each subsequent attack is reduced by {1}%, up to {2} times per turn.
