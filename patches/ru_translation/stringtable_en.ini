feat_desc_89_Lv2=Within 7 squares, dig a tunnel from your current location to the target plot. The target plot cannot be mountainous or oceanic. Your infantry, light tank, medium tank, rocket artillery, armored vehicles, field artillery and howitzers can pass through the tunnel. Gain additional actions after passing through tunnels, with a maximum of 3 times per tunnel. When a new tunnel is dug, the original tunnel disappears, with a cooldown of 2 turns.
