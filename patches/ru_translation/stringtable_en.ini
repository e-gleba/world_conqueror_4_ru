synergy_tactics_1_1=• All Ghost Division units receive +3 mobility.
synergy_tactics_1_2=• Joint Offensive: For each friendly "Ghost Division" unit within 2 hexes, tank units deals an additional 2% damage when attacking.
synergy_tactics_1_3=• Pursue the Fleeing Enemy: If an adjacent friendly “Ghost Division” unit has eliminated an enemy this turn, the infantry units can move again. (Trigger once per turn)
synergy_tactics_1_4=• Frontier Observations: If an adjacent friendly “Ghost Division” infantry unit is present, artillery units damage +10%.
synergy_tactics_2_1=• All "Spearhead" units attack +10.
synergy_tactics_2_2=• Infantry-Tank Coordination: If an adjacent friendly "Spearhead" infantry unit is present, Tank units critical damage +20%.
synergy_tactics_2_3=• Swarm Maneuvers: For each friendly "Spearhead" unit within 2 hexes, infantry units mobility +2.
synergy_tactics_2_4=• Defensive Position Support: If an adjacent friendly “Spearhead” unit is present, artillery units damage received -15%.
synergy_tactics_3_1=• All "Taman Division" land units gain a 10% chance to dodge (can be bypassed by airstrike).
synergy_tactics_3_2=• Amphibious Operations: Friendly “Taman Division” land units within 2 hexes of another naval unit ignore the mobility penalty when embarking, mobility +2.
synergy_tactics_3_3=• Fire Guidance: For each friendly "Taman Division" unit within 2 hexes, artillery units critical attack chance +4%.
synergy_tactics_3_4=• Firepower Support: If an adjacent friendly "Taman Division" unit is present, infantry units range +1 but damage -15% at maximum range.


