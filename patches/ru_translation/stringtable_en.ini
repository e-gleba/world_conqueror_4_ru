dialogue_2944=British reinforcements are gathering. Advance quickly towards Marsa Matruh! Avoid stopping too much.
dialogue_2945=The Italian army greatly outnumbers us. Inform the front troops to fight and retreat. Concentrate on launching a counterattack when reinforcements arrive.
dialogue_2946=The forward attack is blocked, and our supplies can't sustain an offensive of this magnitude. All units prioritize maintaining the line and not letting the British breakthrough.
dialogue_2947=I need more support to hold off the Italian army.
dialogue_2948=Reinforcements are arriving in small groups. My fleet will take care of the threat at sea.
dialogue_2949=The main force has successfully arrived in Libya. We'll push east as fast as we can to clear the Cyrenaica area of British troops.
dialogue_2950=Our reinforcements have not yet arrived. Now we can only do our best to stall the enemy, and if necessary, we can abandon our positions and retreat eastward.
dialogue_2951=The spearhead of the German attack is about to reach Benghazi. Retreat now to Tobruk, where our defenders will construct a strong line of defense.
dialogue_2952=The attack is proceeding smoothly, and my troops will continue toward Badia. The main force of the British army will be left to you.
dialogue_2953=The paratroops arrived at the perimeter of their intended position and quickly captured the enemy's stronghold city, eliminating the defenders on Crete before British reinforcements arrived.
dialogue_2954=British forces are massing in the waters south of Crete. My fleet will immediately attack the enemy's rallying points on the southern coast to stop their retreat.
dialogue_2955=German paratroopers have landed on the island. Hold on to the positions and installations throughout the island; naval reinforcements will be arriving soon.
dialogue_2956=The defenders fought to the last, but there were no more troops left to defend Crete from the Germans.
dialogue_2957=My fleet cannot hold the attacks from the Germans at sea. I'm afraid the only option left now is to retreat.
dialogue_2958=The British counterattack was fierce, but the enemy did not assemble a heavy force to attack at one point.
dialogue_2959=The British are trying to encircle our armored units. Pull back to the defense line first to re-supply and prepare for a counterattack.
dialogue_2960=The British still have a considerable number of armored units, and it may not be easy to break through the line at southern part of Sallum.
dialogue_2961=Rally towards Sallum to re-establish a defense line to stop the Germans advancing eastwards.
dialogue_2962=Our offensive has been a complete failure. We must now concentrate our remaining forces on routing the German vanguard and retaking Sallum.
dialogue_2963=The British army has already taken advantage of the terrain and set up heavy defenses at the various passes. It would be costly to break through from the front.
dialogue_2964=My armored forces will launch an attack from the south of Tobruk, splitting the Allied defense.
dialogue_2965=The enemy has a large armored force. We'll have no chance of winning against them head-on. Retreat to the rear positions and defend with fortresses and minefields.
dialogue_2966=The Germans have penetrated our hinterland and we must immediately support Tobruk and fortify our defenses.
dialogue_2967=The size of the German army has been grossly misjudged. But even if the available forces are insufficient to defend the entire area, we cannot simply abandon Tobruk.
dialogue_2968=The enemy is at the end of his tether. Continue to send reinforcements to the El-Alamein area, where we will have a decisive fight with the Germans.
dialogue_2969=My forces will attack the heart of Egypt from the south of El-Alamein.
dialogue_2970=The counterattack is going very well. We have broken through the Italian positions, so let's keep attacking.
dialogue_2971=The enemy is approaching the Suez Canal. We need more troops to hold the line north of Cairo.
dialogue_2972=The British still have several fortresses and strongholds around Cairo. Continue to push east and beware of subsequent enemy reinforcements.
dialogue_2973=Blockade the Suez Canal and don't let the enemy fleet sail into the Gulf of Suez!
dialogue_2974=The Allies, using their naval and air superiority in the Mediterranean, are constantly interfering with our supply lines and troop movements.
dialogue_2975=I'm afraid it's not realistic to try to completely defeat the Allies with insufficient reinforcements, and a retreat would be extremely difficult. My armored units will do their best to hold Tunisia.
dialogue_2976=We made a deal with the Allies a long time ago. Soldiers, fight for France.
dialogue_2977=Full speed ahead. Break through enemy lines and re-establish contact with the Tunisian defenders.
dialogue_2978=Once the main German force succeeds in coming back to the rescue, the consequences will be unimaginable. We are in a race against time, so continue our attack on Tunisia.
dialogue_2979=The Allied forces are too large, and we have no way back.
dialogue_2980=Eliminate all enemies in Tunisia, our counterattack is about to begin.

event_106=Battle of Stalingrad
event_intro_106=In 1941, Germany launched Operation Barbarossa, sweeping across the vast territories of the Soviet Union. The Red Army struggled for survival in a series of retreats as their homeland was destroyed and their lands were occupied. By 1942, the German forces were closing in like a dark tide of steel surging towards the heart of the Soviet Union. Stalingrad, standing tall on the banks of the Volga River, became the most critical defense line for the nation's very existence. For the Soviet Union, this battle was not just about defending a city but also about safeguarding its destiny and dignity. The entire country was like a tightly strung chord, awaiting the fate that was about to unfold in the decisive battle of Stalingrad.

