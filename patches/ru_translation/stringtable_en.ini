dialogue_3500=Having successfully defeated the British army’s core force, we continue to stand firm—now the tide has turned!
dialogue_3501=The struggle of the Germans was only in vain. Pause the advance, and continue the offensive once the reserve corps is in place!
dialogue_3502=The Soviet offensive forces were halted, and the Führer’s counteroffensive plan was no mere illusion!
dialogue_3503=Reorganize the army, Berlin, I am bound to win!
dialogue_3504=It's a miracle! We managed to break through the logistics transit station of the US army, and the enemy is now unarmed!
dialogue_3505=Activate the reserve depot. Frontline units, hold position. Supplies are en route.
dialogue_3506=I brought all the troops I could control. Keep me safe, the people of Italy will serve the Allies.
dialogue_3507=Curses! Fetch his adjutant, we must reassure the Italians.
dialogue_3508=Frontline units, converge on Caen! Halt the enemy advance.
dialogue_3509=Southern front’s collapsing. Commit the reserves to halt their advance. Signal the headquarters: More troops are needed to hold the line.
dialogue_3510=Headquarters has deployed our unit to provide support. The situation at the front is deteriorating, and we must conserve our strength.
dialogue_3511=The spearhead of the enemy’s offensive has been shattered, and the scales of victory are beginning to tip in our favor!
dialogue_3512=Maintain the front and continue the offensive. We don't have the next chance!
dialogue_3513=Bastogne has been secured, and the supply situation in the Ardennes region is no longer an issue.
dialogue_3514=Ever since the enemy troops landed, we have suffered one defeat after another. But for this battle, I must prevail.
dialogue_3515=Rest assured and return to the port; I will take over the waters from here!
dialogue_3516=I experienced such a failure once in the Philippines, and I am not afraid to do it again.
dialogue_3517=The crisis is solved! Our army needs the support of the Korean people to launch a counteroffensive.
dialogue_3518=Our forces have established naval supremacy, taken Vladivostok, and seized the Soviet missile base!
dialogue_3519=This time, not only did I come back, but I also gave the Soviets a taste of defeat!
dialogue_3520=Regain control of the Southern Kuril Islands and ensure the security of the ports!
dialogue_3521=Please assist in seizing the coastal ports; the Navy requires a forward operating base in the Sea of Okhotsk!
dialogue_3522=Excellent! The fleet will soon be in position, and we will recapture the Sea of Okhotsk in conjunction with the army!
dialogue_3523=Stand firm on the coastal defense line; reinforcements will arrive as quickly as possible.
dialogue_3524=St. Lawrence Island has already fallen; under no circumstances can we allow the enemy to secure a foothold on the mainland!
dialogue_3525=Continuing to support the coastal defense line is no longer meaningful. Notify the rear reinforcements to withdraw and redeploy, and fortify the Anchorage defense line.
dialogue_3526=Reinforcements have arrived. Full supplies secured. We rest while they exhaust themselves—then we crush them!
dialogue_3527=European reinforcements are crossing the ocean. Continue to resist, and a turning point soon emerges.
dialogue_3528=Once we've successfully established contact with friendly forces and secured our supplies, we will liberate the United States!
dialogue_3529=This war has gone too far. There's no point fighting alongside the Americans anymore. Contact the Soviets—we're withdrawing!
dialogue_3530=Canada wants out? Traitors! Order our forces to hold the line inside their borders. Withdrawing? They don't get to choose!
dialogue_3531=Per Central Command: Aid all potential allies. We welcome them to fight alongside us!
dialogue_3532=For the nation’s survival, I have no other choice.
dialogue_3533=European reinforcements have arrived! Soldiers, for freedom—retake our territory!
dialogue_3534=The flames of war have burnt our soil. Is it worth continuing this fight?
dialogue_3535=Our nation stands in peril. Soldiers, defend our homeland!


