event_stage_intro_21001=The tide of the war has shifted. The Soviet offensive on the western coast has been successfully halted. The enemy's tactical offensive capabilities have been steadily declining due to overextended supply lines, but their army group-level numerical superiority remains. It is imperative to utilize prepared fortifications to implement echeloned defense and defend the rally points of reinforcements until the initiation of the strategic counteroffensive.
event_stage_intro_21002=Our covertly trained units are ready for the offensive. The task force will carry out an amphibious seizure of the Bay of Pigs while ensuring the paralysis of the region's air defense network. The underground resistance will also coordinate with our action. The C.I.A. has given assurances that the raid will be flawless.
event_stage_intro_21003=The Soviet Northern Fleet Task Force has completed the blockade off New York's waters, but the situation is still salvageable. Activate emergency communication protocols immediately and commence fortress removal operations. Contact forces across all regions to reorganize offensive groups and weaken the Soviet forces on the East Coast.
event_stage_intro_21004=The Soviet army's direct assault on our homeland have been thwarted by a series of our counterattacks. Now the enemy has shifted their focus, redirecting their attacks toward neighboring countries and territories. Though Europe had already initiated defensive measures, the Soviet army nonetheless seized Iceland in an extremely short time. Greenland and Canada are now their next objectives.
event_stage_intro_21005=The Canadian rebels have formed a coalition with opposition forces within our country, seizing control of the Great Lakes region and launching an offensive eastward. While we were mobilizing our troops, the Soviet army took advantage of our vulnerability and initiated another landing. Intelligence indicates there's no coordination between rebels and the Soviet forces. We should exploit the window of opportunity during the conflicts between these two forces to swiftly reinforce our friendly forces across various regions, quell the rebellion, and expel the foreign invaders.
event_stage_intro_21006=The conflict between Europe and the Soviet Union has escalated into a full-scale war. The rapid advance of the Soviet Northern Fleet caught us off guard, and even our foremost ally, the United Kingdom, now suffering from Soviet's occupation of multiple regions across mainland Britain. Europe needs our immediate assistance. Our task forces and strategic transport aircraft are fully prepared and stand ready to mass deploy at a moment's notice!
event_stage_intro_21007=The Soviet army is committing the last of its strategic reserves to fight like a desperate cornered beast. There are clear cracks in their front command system, and their allied nations may not be as united as we think. We must rally all forces we can unite and launch an eastward offensive to drive the Soviet forces back to their borders. This is a golden opportunity to expand our influence in Europe.
event_stage_intro_21011=The tide of the war has shifted. The Soviet offensive on the western coast has been successfully halted. The enemy's tactical offensive capabilities have been steadily declining due to overextended supply lines, but their army group-level numerical superiority remains. It is imperative to utilize prepared fortifications to implement echeloned defense and defend the rally points of reinforcements until the initiation of the strategic counteroffensive.
event_stage_intro_21012=Our covertly trained units are ready for the offensive. The task force will carry out an amphibious seizure of the Bay of Pigs while ensuring the paralysis of the region's air defense network. The underground resistance will also coordinate with our action. The C.I.A. has given assurances that the raid will be flawless.
event_stage_intro_21013=The Soviet Northern Fleet Task Force has completed the blockade off New York's waters, but the situation is still salvageable. Activate emergency communication protocols immediately and commence fortress removal operations. Contact forces across all regions to reorganize offensive groups and weaken the Soviet forces on the East Coast.
event_stage_intro_21014=The Soviet army's direct assault on our homeland have been thwarted by a series of our counterattacks. Now the enemy has shifted their focus, redirecting their attacks toward neighboring countries and territories. Though Europe had already initiated defensive measures, the Soviet army nonetheless seized Iceland in an extremely short time. Greenland and Canada are now their next objectives.
