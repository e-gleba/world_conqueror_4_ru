event_intro_490=To secure iron ore supplies for Germany’s military industry, the German military launched "Operation Weserübung" in the early hours of April 9, 1940. Denmark surrendered shortly after the war began. Despite Norway’s geographical advantages and Allied support, it fell on June 10. This campaign allowed Germany to control strategic positions in the North Sea and Baltic Sea, fully securing Scandinavia’s iron ore transport routes.
event_intro_491=As Narvik was a vital ice-free port in the North Atlantic for Swedish iron ore shipments, fierce battles erupted between Allied and German forces after the Norwegian campaign began. Germany successfully occupied Narvik on April 9, 1940. British forces immediately attempted to retake it, triggering naval battles on April 10 and 13. However, due to insufficient ground preparations, the British failed to capture the port despite sinking multiple German warships.
event_intro_492=On April 16, 1945, the Soviet Army amassed three main fronts to launch the final offensive against Berlin, known as the Battle of Berlin. Trapped German leadership resisted fiercely, but Soviet artillery gradually shattered their defenses. On April 30, a gunshot echoed in the Führerbunker. Two days later, Berlin’s defense commander, Weidling, signed the surrender, marking the Third Reich’s collapse.
event_intro_493=To boost the morale of the American public after the Pearl Harbor attack, on April 18, 1942, 16 B-25 bombers took off from the USS Hornet and successfully raided Tokyo and other cities. One plane crash-landed in the Soviet Union, while the others either parachuted or crash-landed in places like Zhejiang, China. Although the operation caused minimal physical damage, it shocked the Japanese military.
event_intro_494=In order to eliminate the Axis' last footholds in North Africa, the Allies launched Operation Vulcan on April 22, 1943. The British forces focused on capturing Tunis, while the American forces advanced towards Bizerte. The German and Italian troops put up a fierce resistance, relying on their mountain fortifications, but due to supply shortages and the Allies' absolute air superiority, their defensive lines collapsed on May 6. Ultimately, on May 13, 250,000 troops surrendered. This battle eliminated the threat to Mediterranean sea lanes, paving the way for the Allies to launch Operation Husky two months later.
event_intro_495=Following Italy surrendered in September 1943, the German military took full control of the defense of the Aegean Islands. On April 24, 1944, to carry out strategic deception operations in coordination with the Normandy landings, the British Royal Navy Special Boat Service (SBS) raided the island of Santorini, destroying the German coastal observation post and radio relay facility. This raid effectively disrupted German maritime surveillance in the Aegean Sea, forcing the Germans to deploy additional troops to garrison the islands, thereby indirectly aiding the Allied operations in the Mediterranean theater.
event_intro_496=On April 28, 1944, during an exercise for the Normandy landings, due to a fatal communication breakdown within the Allied forces, nine German E-boats successfully ambushed the Allied T-4 convoy in Lyme Bay, sinking two LSTs naval vessels and severely damaging another, resulting in at least 749 deaths. This was the deadliest single incident involving Allied casualties prior to the Normandy landings. This tragedy forced the Allies to standardize their communication frequencies, ensuring effective command coordination during the Normandy landings.
event_intro_497=The Borneo Campaign was the Allies' final campaign in the Southwest Pacific theater. From May 1 to July 21, 1945, the Australian I Corps carried out phased landings at Tarakan, Brunei Bay, and Balikpapan, aiming to seize oil fields and airfields to cut off the fuel supply to the Japanese forces. However, Allied pre-invasion bombings and destructions led to severe damage to the island's infrastructure. Moreover, by the time the campaign began, the main Japanese forces had already strategically withdrawn, resulting in limited actual military gains.
event_intro_498=In order to seize the strategic initiative in the South Pacific, the Japanese military decided to launch Operation MO, attacking Port Moresby from the sea. After decrypting Japanese intelligence, the U.S. Navy dispatched Task Force 17 and Task Force 11 to intercept. Thus, on May 4, 1942, the Battle of the Coral Sea—the first carrier-versus-carrier battle in history—broke out. In this battle, the U.S. Navy sank the Japanese light carrier IJN Shōhō, which was covering the landing forces, and severely damaged IJN Shōkaku; the Japanese Navy sank USS Lexington and severely damaged USS Yorktown. Although both sides suffered comparable losses at the tactical level, the Allies successfully thwarted the Japanese operational objectives and achieved a strategic victory.
event_intro_499=On May 10, 1940, the German army launched the "Manstein Plan." Army Group B conducted feint attacks on the Netherlands and central Belgium, while the main force of Army Group A advanced through the Ardennes Forest to breach the weak points of the Allied defense line. Following "Plan D," the Allies advanced the French 1st Army Group and the British Expeditionary Force to the Dyle-Breda defensive line. However, after the German 19th Panzer Division broke through at Sedan on May 14 and advanced westward, they successfully encircled 350,000 Allied troops. With key transportation hubs lost and defensive line collapsed, King Leopold III of Belgium unilaterally surrendered on May 28.
event_intro_4100=On May 12, 1942, the Soviet Army launched the Second Battle of Kharkov in an attempt to expand the gains of the winter counteroffensive. Initially, the Soviet forces advanced to the outskirts of Kharkov, but due to weak defenses on the southern flank, on May 17 they were caught in a pincer movement by the German "Operation Fredericus" from the north and south. Within just three days, 240,000 Soviet troops were encircled, and by May 28, total amount of casualties exceeded 200,000, which led to the collapse of the southern front. This defeat allowed the Germans to launch "Case Blue" in June, making a rapid advance towards the Caucasus, which became a key catalyst for the strategic turning point on the Eastern Front.
event_intro_4101=On May 15, 1941, British forces launched an assault against the Libyan Sollum Line, briefly capturing the Halfaya Pass and Fort Capuzzo. However, German army reinforce swiftly and counterattacked to reclaim the fort, and on May 27, they recaptured the Halfaya Pass, forcing the Allies to launch Operation Battleaxe to recapture the Halfaya Pass.
event_intro_4102=On May 20, 1941, the German army launched "Operation Mercury," the first large-scale airborne operation in history, aiming to seize Crete and block the Allied air threats in the Balkans. Approximately 13,000 German paratroopers and mountain troops launched a fierce assault on three airfields on the island, met with staunch resistance from Commonwealth and Greek defenders. Although the Germans achieved their strategic objectives in this battle, the heavy casualties among the paratroopers led them to cease similar operations thereafter. Yet, this battle provided critical tactical experience for subsequent Allied airborne operations.
event_intro_4103=On May 22, 1940, the German 10th Panzer Division besieged Calais, where 4,000 garrisons held the ancient city in a desperate last stand from the German forces until May 26th. Apart from 200 wounded soldiers who were evacuated, the remaining troops were either killed or captured. This battle successfully delayed and restrained German forces for three days, allowing the defensive line at Dunkirk to be fortified and creating a time window for the subsequent Operation Dynamo.
event_intro_4104=In May 1940, utilizing the revised "Case Yellow", the German army broke through the French defenses at Sedan, encircling over 300,000 Allied troops of the northern flank in the Flanders region. To avoid being annihilated by the Germans, on May 26, the Allies launched "Operation Dynamo," a massive evacuation operation, successfully evacuating 338,000 troops from Dunkirk over nine days, preserved the core fighting force and hope of liberation for future counterattacks.
event_intro_4105=On May 28, 1940, the German army completed the encirclement of 40,000 troops of the French First Army at Lille. The defenders of Lille resisted tenaciously, even capturing a German lieutenant general during the fierce fighting, and only surrendered on June 1. This battle effectively diverted seven German divisions, which bought valuable time for the Dunkirk evacuation, allowing the Allies to evacuate at least 100,000 Additional troops.
event_intro_4106=From May 31 to June 8, 1942, the Japanese military dispatched submarine forces to launch multiple raids on Sydney Harbour in an attempt to sever the strategic supply lines between Australia and the United States by targeting Allied warships. Although the Japanese sank only one naval replenishment ship during the nine-day offensive, the attack unexpectedly prompted the Australian military to comprehensively upgrade its harbor defense systems, providing critical defensive experience for later operations in the Pacific Theater.

dialogue_3016=You think offensive action is an embodiment of courage. Yet true valor only lies in steady trigger discipline—maintaining your composure to place every round with purpose, even as the enemy closes on your position.
dialogue_3017=The enemy's numbers and strength are indeed formidable, but our will is far more resilient than theirs. On this land we defend, every inch bears the pride and dignity of Finland.
dialogue_3018=Their defenses may appear formidable, but we have our determination and conviction. We are not standing on the brink of retreat, but the beginning of a great history!
dialogue_3019=Our plan encountered unexpected resistance; therefore, we must urgently consider adjusting our strategy to avoid getting drawn into a protracted conflict.
dialogue_3020=Britain and France swore to protect us. The Soviets pledged not to invade us. What a farce.
dialogue_3021=The Soviet–Polish Non-Aggression Pact was like a scrap of paper in the eyes of the Soviets. They were more cunning than the Germans. They waited until our western front collapsed before stabbing us in the back.
dialogue_3022=We thank the Soviets for redefining the standard of "non-aggression"—they won't attack us until they feel like it. Will anyone in the future still believe the "peace" the Soviets talk about?
dialogue_3023=Ten years the French spent on building their defense line. Ten days for us to flank it.
dialogue_3024=None of our contingency plans anticipated this situation... We've been completely deceived; we've been defending the wrong position all this time!
dialogue_3025=We have already lost time; we cannot afford to lose resolve as well. All troops, assemble immediately and stabilize the front line. We must hold them off; we can still fight. France shall not easily fall!

