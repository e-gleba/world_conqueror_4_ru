conquest_event_desc_97=The Scorpion organization, leveraging its vast espionage network and sophisticated political maneuvers, has successfully orchestrated proxy wars and regional conflicts between NATO and the WTO on a global scale. Their meticulous planning has forced the world to re-align into new factions, creating a novel confrontational landscape and plunging the globe into an irreconcilable vortex of opposition and arms race.
conquest_event_desc_98=The Asia-Pacific Scorpion launched an operation codenamed "Poseidon's Fury." Through submarine raids, drone strikes, and special forces landings, they coordinated multi-front attacks, completely crippling the U.S. Pacific Fleet and successfully capturing Pearl Harbor, in order to create favorable conditions for further infiltration into the Asia-Pacific region.
conquest_event_desc_99=The Asia-Pacific Scorpion secretly supported the North Vietnamese army, assisting them in repelling U.S. forces with advanced alien technology weapons. This significantly altered the battlefield dynamics, sending the current situation in an unpredictable direction.
conquest_event_desc_100=The Asia-Pacific Scorpion secretly constructed a deep-sea laboratory near the Mariana Trench, dedicated to testing the performance of alien technology weapons under extreme deep-sea pressure. This action raised alarms among Asia-Pacific nations.
conquest_event_desc_101=The Asia-Pacific Scorpion deeply infiltrated Australia's energy industry, precisely sabotaging coal production and port transportation networks, cutting off major export channels, and forcing the government to compromise, thus achieving full control over local energy enterprises.
conquest_event_desc_102=The Asia-Pacific Scorpion supported local radicals, manipulated public opinion, and incited violent conflicts, leading to the Gwangju Incident. Amid the chaos, the Scorpion successfully infiltrated the South Korean military, prompting the president to declare martial law and make use of the government's authority to suppress the populace, further intensifying political turmoil and social division.
conquest_event_desc_103=The Asia-Pacific Scorpion controlled the southern islands of the Philippines through terrorist attacks, transforming the islands into a key stronghold in Southeast Asia and threatening the trade routes near the Strait of Malacca.
conquest_event_desc_104=The Asia-Pacific Scorpion seized control of the entire Pacific maritime trade, expanding its influence to become the strongest faction within the global Scorpion organization. This move provoked dissatisfaction among other Scorpion factions, which joined forces to launch a united attack, leading to internal conflicts within the organization.
conquest_event_desc_105=The Middle East Scorpion secretly manipulated various local organizations, successfully detonating multiple oil refineries and creating a severe energy crisis.
conquest_event_desc_106=The Middle East Scorpion executed precise demolitions in the Suez Canal, sinking several cargo ships and causing a complete blockade of the canal. This cut off the maritime trade routes controlled by Britain and France, forcing both countries to make concessions in exchange for the right of navigation.
conquest_event_desc_107=The Middle East Scorpion established a secret high-tech base in the mountains of Afghanistan to test the effects of alien weapons on complex terrain. After a Soviet army surprise raid, they successfully repelled the attack.
conquest_event_desc_108=The Middle East Scorpion plans to transform parts of the desert in Saudi Arabia into habitable "Oasis Cities," attracting more factions to rely on Scorpion's resources and technology.
conquest_event_desc_109=The Middle East Scorpion monopolized global oil resources and announced the formation of the "Petroleum alliance," threatening other factions by cutting off energy supplies. This move provoked dissatisfaction among other Scorpion factions, which joined forces to launch a united attack, leading to internal conflicts within the organization.
conquest_event_desc_110=The European Scorpion secretly infiltrated East Germany, inciting locals to form the "Free European Army," creating a breach for Scorpion's military industry and gradually expanding its influence across the European continent.
conquest_event_desc_111=The European Scorpion orchestrated a series of explosions at key railway junctions in Eastern Europe, crippling Soviet control over transportation and supplies in the region. This chaos allowed Scorpion's forces to fully infiltrate and pave the way for further dominance in Eastern Europe.
conquest_event_desc_112=The European Scorpion utilize its extensive espionage network and information manipulation tactics, they precisely calculated the routes of British warships and laid mines in the channel. This action led to two British Navy destroyers striking mines in the Corfu Channel.
conquest_event_desc_113=The European Scorpion, disguised as Czech reformists, secretly propelled the Prague Spring protests, aiming to weaken Soviet control and influence over Eastern Europe amidst the turmoil.
conquest_event_desc_114=The European Scorpion deployed elite diving teams to infiltrate the North Sea oilfields, taking control of crucial equipment and cutting off energy supplies between the UK and Norway. They attempted to create an energy crisis to weaken the economic and strategic influence of both nations.
conquest_event_desc_115=The European Scorpion secretly contacted several Italian mafia, establishing connections through money, weapons, and intelligence exchanges to expand its influence in Europe.
conquest_event_desc_116=The European Scorpion secretly launched a group of high-performance satellites, successfully controlling global satellite communication systems, including military communications, navigation, and weather systems. This move provoked dissatisfaction among other Scorpion factions, which joined forces to launch a united attack, leading to internal conflicts within the organization.
conquest_event_desc_117=The Americas Scorpion successfully infiltrated the Watergate complex in the United States, obtaining classified information through precise surveillance, leading to the President's resignation under public pressure. The political turmoil in the U.S. accelerated Scorpion's military expansion and infiltration in the Americas.
conquest_event_desc_118=The Americas Scorpion chose "Point Nemo" deep in the South Pacific as its secret maritime technology research base. Through a series of covert operations, they transformed this remote area into the world's most strategically significant maritime research center.
conquest_event_desc_119=The Americas Scorpion orchestrated the Bay of Pigs invasion by manipulating Cuban exiles and providing false intelligence to the U.S., sparking U.S.-Cuba conflicts and intensifying Cold War tensions, while reaping significant benefit from global economic and resource control.
conquest_event_desc_120=The Americas Scorpion reached a secret agreement with the Cuban government, assisting them in establishing a covert missile launch system on the island. This move aimed to threaten the security of the U.S. and the Latin American region by deploying advanced missile facilities in Cuba.
conquest_event_desc_121=The Americas Scorpion infiltrated the Argentine government and provided military support, prompting Argentina to launch an attack on the Falkland Islands under misjudgment, testing the British long-range strike military capabilities.
conquest_event_desc_122=The Americas Scorpion established a secret research base in the Amazon rainforest, utilizing alien technology to conduct experiments and develop small nuclear reactors.
conquest_event_desc_123=The Americas Scorpion secretly manipulated the financial markets in Brazil and Argentina, using large-scale capital transfers, false information dissemination, and currency manipulation to create market panic, leading to a sharp devaluation of local currencies.
conquest_event_desc_124=The Americas Scorpion, through precise financial manipulation and economic threats, successfully forced major global nations to pay high financial taxes, bringing the world economy under its control. This move provoked dissatisfaction among other Scorpion factions, which joined forces to launch a united attack, leading to internal conflicts within the organization.
conquest_event_desc_125=The African Scorpion covertly supported armed forces in the Congo's mining areas, gaining control over abundant uranium and copper resources, providing crucial materials for their alien technology research.
conquest_event_desc_126=The African Scorpion backed East African military leaders in launching coups to gain control over the Red Sea trade route, disrupting the stability maintained by Britain and Egypt in the region and reshaping the geopolitical landscape.
conquest_event_desc_127=The African Scorpion secretly manipulated water resources in the Nile basin, gradually gaining control over the region's water supply. Northern African countries faced severe water shortages and agricultural collapse, leading to further social unrest.
conquest_event_desc_128=The African Scorpion established a secret high-tech research base deep in the Namib Desert of Namibia, dedicated to experiments combining alien energy technology with nuclear fusion.
conquest_event_desc_129=The African Scorpion successfully developed technology to convert sand into high-purity silicon materials, manufacturing ultra-high-performance semiconductors and chips at extremely low costs, thereby monopolizing the chip supply. This move provoked dissatisfaction among other Scorpion factions, which joined forces to launch a united attack, leading to internal conflicts within the organization.

