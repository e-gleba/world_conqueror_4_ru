event_intro_455=This battle is also known as the Japanese conquest of Guam. On December 8, 1941, the day after the attack on Pearl Harbor, the Japanese forces seized the opportunity to launch a surprise assault on Guam. Caught off guard, the island’s defenders were quickly overwhelmed and defeated. By December 10, the Guam garrison surrendered, and the Japanese gained control of the island.
event_intro_456=To rescue the encircled 6th Army in Stalingrad, on December 12, 1942, the German 4th Panzer Army launched an assault on the city. The German offensive caught the Red Army off guard and achieved significant progress on the first day. However, with the Soviet Operation Little Saturn underway and strong defensive measures around Stalingrad, the Germans were unable to advance further and had to abandon their efforts to rescue the 6th Army.
event_intro_457=The Battle of the Bulge, also known as the Ardennes Offensive, took place from December 16, 1944, to January 25, 1945. This was a major offensive by Germany during the end of World War II in the Ardennes region of Belgium, aimed at breaking through the Anglo-American Allied lines and recapturing Antwerp. In the early stages, the German forces achieved some successes, inflicting heavy losses on the American troops stationed there. However, due to a lack of supplies, they were unable to advance further, allowing the Allied forces to stabilize and begin their counteroffensive. Ultimately, the German forces suffered significant casualties, with the remnants retreating to the Siegfried Line and the Rhine River.
event_intro_458=The Siege of Bastogne, fought from December 20 to 27, 1944, was a crucial conflict between American and German forces in the small town of Bastogne, Belgium, as part of the Battle of the Bulge. With seven major roads through the Ardennes Mountains converging at Bastogne, the German forces aimed to secure the town to ensure their safe passage. Encircling the American defenders stationed there, the Germans sought to capture Bastogne. Despite being surrounded, the American troops held their ground fiercely, maintaining control of Bastogne. Eventually, they were relieved by units from George Patton's Third Army, securing a great victory.
event_intro_459=To liberate Ukraine and Moldova, on December 24, 1943, the Soviet forces launched the Dnieper-Carpathian Offensive. In this battle, the Soviets successfully reclaimed most of Ukraine and all of Moldova, crushing the German Army Group South and pushing the front lines forward to the Poland-Romania axis.
event_intro_460=The Battle of North Cape took place on December 26, 1943, off the coast of Norway's North Cape. In this battle, a German naval task force attempted to locate and attack Allied convoys transporting war supplies to the Soviet Union. However, due to leaked intelligence, they encountered the well-prepared Royal Navy, resulting in the sinking of the German battleship Scharnhorst. After this battle, Germany could no longer deploy large battleships to harass the Allies' northern routes. The northern sea routes became relatively secure until the war's end.
event_intro_461=On December 26, 1944, the Soviet forces completed the encirclement of Budapest and quickly began negotiations for the Budapest garrisons' surrender. On the 29th, the negotiations broke down, and the Soviet envoy was killed by German forces. After burying the envoy, the Soviet troops launched their assault. The Siege of Budapest had begun. The Soviets besieged Budapest for 50 days straight, exhausting German resources, particularly those of the Waffen-SS, ultimately capturing the city and bringing the Eastern Front closer to Berlin.
event_intro_462=Due to the Ardennes Offensive drawing large Allied forces northward, the Germans planned an assault on the loosely defended Alsace region to weaken the enemy. On January 1, 1945, the Germans launched an offensive toward Strasbourg. Despite the Allies retreating under pressure, they ultimately held Strasbourg. After the offensive ended, the Germans occupied approximately 40% of Alsace, shortening the Western Front but failing to achieve their goal of weakening the strength of the Allies.
event_intro_463=In December 1941, the Japanese launched an offensive on Luzon. Due to poor initial defenses, the Japanese successfully breached the coastal lines, forcing American and Filipino garrisons to retreat to the Bataan Peninsula for a final stand. On January 7, 1942, the Japanese began their assault on Bataan. Lacking supplies, the defenders gradually fell back, and the supreme commander, MacArthur, evacuated the Philippines. After three months of firm resistance, on April 9, 1942, the remaining defenders surrendered to the Japanese, marking the end of the Battle of Bataan.
event_intro_464=Following the Battle of Leyte Gulf, the Japanese military presence in the Philippines suffered heavy losses. Utilizing their air and sea superiority, the Allies planned to retake Luzon. On January 9, 1945, Allied landing forces, under naval escort, landed at Lingayen Gulf and cleared the coastal defenses, advancing towards Manila. By March 3, Manila was liberated, with remaining Japanese forces retreating to the mountains to continue their resistance. On August 15, Japan announced its unconditional surrender, and the remaining Japanese troops on Luzon gradually accepted the ceasefire order, bringing the Battle of Luzon to an end.
event_intro_465=On January 14, 1944, the Soviet forces gathered the Leningrad Front, the 2nd Baltic Front, and the Volkhov Front to launch the Leningrad-Novgorod Offensive. About two weeks later, the Red Army regained control of the Moscow-Leningrad railway. On January 26, 1944, the Germans were expelled from the Leningrad region, lifting the siege of Leningrad. The Soviet forces continued their pursuit until March 1, pushing the front line to the Luga River.
event_intro_466=After the Allies landed in Italy in September 1943, the Germans established the "Winter Line" to prevent the Allied advance. To continue their push and liberate Rome, on January 17, 1944, the Allies launched an attack on the core "Gustav Line." The monastery on Monte Cassino became the focal point of the battle due to its strategic position, allowing the Germans to control the surrounding area. The Allies made multiple attempts to capture the monastery but faced fierce resistance. Eventually, the Allies gained control of the area, achieving victory at a high cost and casualty.
event_intro_467=To eliminate the Colmar Pocket, the Allies launched an attack from the north and south sides of the salient on January 20, 1945, successfully encircling and heavily damaging the German 19th Army, as well as liberating Colmar.
event_intro_468=The Korsun-Cherkassy Offensive was part of the Dnieper-Carpathian Offensive. In early January 1944, the 1st and 2nd Ukrainian Fronts surrounded the German salient northeast of Cherkassy from both the north and south. To annihilate the six German divisions in the salient, the Soviets launched an attack from both sides on January 24; by the 28th, the two fronts met, forming an encirclement. The Germans quickly attempted to break out but suffered heavy casualties in officers and all heavy firearms.
event_intro_469=At the end of World War I, Finland sought independence, leading to the formation of two political factions: "White Finland" and "Red Finland." Both sides aimed for Finnish independence, but ideological differences escalated conflicts. On January 27, 1918, hostilities began as Red Finland mobilized the workers, occupying nearly all southern towns and industrial centers, while White Finland retreated to the northern rural areas. However, due to a lack of military training, Red Finland was ultimately defeated by White Finland, which received military aid from Germany.
event_intro_470=On February 1, 1942, the U.S. Navy conducted air raids and bombardments against the Imperial Japanese Navy garrisons on the Marshall and Gilbert Islands, causing light to moderate damage to the Japanese troops stationed there. Although this battle had little impact on the overall Pacific Front, it significantly boosted the morale of the U.S. Navy and the public following the attack on Pearl Harbor and the fall of Wake Island.
event_intro_471=In January 1944, the Soviet forces advanced to the Narva River line. To penetrate Estonia and secure a base for attacking Finland and East Prussia, the Soviets launched a series of attacks on the Narva Isthmus, known as the Battle of Narva. This battle lasted from February 2 to August 10, 1944. Initially, the Germans fiercely counterattacked, slowing the Soviet advance. It wasn't until July, in coordination with the Lvov-Sandomierz Offensive, that the Soviets captured Narva. The Germans retreated to the Tannenberg Line, where they once again stalled the Soviet advances.


dialogue_3201=The Germans are about to open a corridor towards the coast direction. Now our retreat must be prepared.
dialogue_3202=Let the friendly forces retreat towards the Channel first, and my panzers will do their best to slow down the German attack.
dialogue_3203=Hold your positions! The RAF will continue to provide air cover for the retreat.
dialogue_3204=Positional warfare is no longer appropriate for these times! Full speed ahead. Leave the prisoners to the friendly forces behind.
dialogue_3205=This… the scale of this air raid is not even close to halt the German ground offensive. Where did such a failure originate?
dialogue_3206=My legions can no longer continue to fight. Leave everything at hand and retreat at full speed.
dialogue_3207=Our army has failed, but the results of the research must not fall into the hands of the Germans.
dialogue_3208=The corridor to the Channel has been opened. Maintain the line of battle and eliminate the main British and French forces from the encirclement.
dialogue_3209=You're Osborn? I'm Benteke. I've been ordered to protect you with the evacuation.
dialogue_3210=But the orders I received were to hold on until the main force had successfully withdrawn! Even if the situation is critical, I can't leave the position without authorization.
dialogue_3211=Your destiny is much more than that, your journey has just begun, and countless possibilities await you in the future. But if you insist, I will respect your decision. The choice is yours.
dialogue_3212=Lille is also lost. The Germans are beginning to speed up the contraction of the encirclement. Alfred, we have to retreat.
dialogue_3213=Don't forget, we're mercenaries. Finish the mission and come back alive - that's our only goal.
dialogue_3214=Trust the decisions he makes.
dialogue_3215=The Germans held the captured men in several makeshift prisons, and Osborn must have been among them.
dialogue_3216=What took you so long? A few more days and I'd really consider joining the Wehrmacht.
dialogue_3217=Who the hell are you? Why are you here? But we can't care about that now! The enemy's main force has attacked to the south. This is our only chance to rescue them!
dialogue_3218=How dare you try to escape? No prisoner can escape from the Drittes Reich prison! Why don't we just finish you off here, in case there are other opportunities for you to run. Maybe I can still make it back to the front to join the war!
dialogue_3219=The rescue went very well but then came the hard part. Head south across the line to Spain, from where you can get to England by boat.
dialogue_3220=It looks like we're going to have to split up here. There is still a portion of the expeditionary force trapped and under threat in Le Havre, and I must get there as soon as possible to join them.
dialogue_3221=Perhaps you have another option. Withdraw from the south, a gap will be opened up in the direction of Metz, and you can join General de Gaulle, who is holding out there.
dialogue_3222=We are in the process of negotiating with the Germans on matters pertaining to the Armistice Agreement. All units stand by and wait for new instructions.
dialogue_3223=France lost. Defeated by the German armored clusters, by good commanders, and by the lightning speed of the attack. Armored forces that can determine the direction of the frontal battlefield are the future of warfare!
dialogue_3224=The combination of advanced military technology and stable and sufficient production capacity is the direction of military power. There is hope for us!
dialogue_3225=Pétain's government has abandoned the French people. I will fight for France until the end!
dialogue_3226=Once again the French troops are divided by us. The gates of Paris are now wide open, and victory is close at hand!
dialogue_3227=Trust him, but move fast. The Germans have left you little time before the French evacuate themselves safely.
dialogue_3228=The American equipment for the frontline troops has arrived without incident. No need to thank me. I'll be waiting for your latest report at the rear.
dialogue_3229=Our reinforcements have arrived! But the Germans have broken through the defense line at El Alamein, and the armored units there are in danger of being surrounded at any moment!
dialogue_3230=Alfred, I was impressed by your valor in France! But fighting on land is nothing like in the air, and this raised grit will smooth your edges and consume your sharpness. Let me see if you can adapt to the brutality here!
dialogue_3231=The scale of the enemy attack did exceed expectations. Readjust our defense strategy and prioritize defusing the enemy's attack. More reinforcements will arrive soon.
dialogue_3232=El Alamein has been lost. How can the enemy have so many armored and naval units? We're about to be surrounded.
dialogue_3233=I didn't realize you could command a navy. Pull the fleet back to Alexandria harbor first. Reinforcements will arrive soon.
dialogue_3234=The offense isn't moving fast enough. Don't forget we only have one chance. Take Cairo in conjunction with the Italian attack and demoralize the Allies.
dialogue_3235=Target Cairo, and cut off Allied troop soldier supplies.
dialogue_3236=These troops are all we have. Since the offensive has failed, there's only one option left. Retreat!
dialogue_3237=The blade has been unsheathed. My men will strike before the enemy can react.
dialogue_3238=I will do everything in my power to drive Rommel out of Africa.
dialogue_3239=The two newly designed hulls have succeeded in improving on the shortcomings of the prototype, allowing it to fully utilize the power of the gun even in the harsh environment of the North African battlefield.
dialogue_3240=The airborne units have arrived at the designated positions. Launch an immediate attack to disrupt the enemy's defensive deployment behind the sea defenses.
dialogue_3241=Rapid landing! Collaborate with airborne forces to pin down and disintegrate enemy forces on positions.
dialogue_3242=Golden Beach is weakly defended and my position is relatively favorable. You can fully cooperate with me to quickly clear a beachhead position.
dialogue_3243=The landing force has taken hold and now launches an attack on Caen.
dialogue_3244=It's Rommel and his armored units again! I'm just an expert on chariot armament, how come all these hard battles are caught up by me?
dialogue_3245=No one cares about others' identities on the battlefield. You can stay here, just stay out of the way of our charge.
dialogue_3246=We are a solid barrier in the line. The Allies must not be allowed to pass through here. I will fight to the death.
dialogue_3247=A large number of Allied troops have landed in Normandy, and a counteroffensive have to be organized to slow down the enemy's advance.
dialogue_3248=My artillery units will stall the Allied attack!
dialogue_3249=Sometimes I really feel like I'm the protagonist of these battles and should be printed on posters and on the covers of brochures.
dialogue_3250=The Allies are unprepared for our attack. Use this opportunity to cut the link between the British and American main forces.
dialogue_3251=There's nothing we can do with the weapons we have at hand. I'm afraid the friendly forces that are surrounded are in a bad case.
dialogue_3252=Speed up the support! Can we just watch Bastogne fall?
dialogue_3253=There are now two options to choose from. Strike directly at the German rear and cut off the enemy's supply of troops. Or block the main German attack from the front and wait for American reinforcements to arrive.
dialogue_3254=I'm here to help you! Reinforcements will be late, but never absent.
dialogue_3255=General Patton has long ago mobilized his forces in advance and launch a counterattack as soon as the main body of reinforcements arrive!
dialogue_3256=Believe in your comrades. More importantly, believe in yourself. Take action!
dialogue_3257=I never doubt my judgment. The tables are about to turn, and our advantage is coming.
dialogue_3258=The British launched a surprise attack on our rear, and once the retreat is cut off, the consequences will be unimaginable.
dialogue_3259=Pull back to the Siegfried Line and reorganize the defenses before the Allies launch the next wave of attacks.
dialogue_3260=We were once one step away from victory, but in the end, it was all for naught. Retreat.
dialogue_3261=The capture of Bastogne has dealt a heavy blow to Allied morale. But we don't have any more troops to sustain such an offensive.
dialogue_3262=Bastogne has been lost. Osborn, who had rushed to support, was trapped by German armor.
dialogue_3263=Now is not the time to analyze the battle, our opportunity is fleeting.
dialogue_3264=The Soviets have once again made a comeback and have now taken over half of the Gulf of Mexico! The ground army has also crossed the U.S.-Mexico border. The situation is desperate.
dialogue_3265=We've always had close cooperation with the U.S. Army, and this course of action is absolutely foolproof. You are also chosen because we have fought side by side on the Western Front.
dialogue_3266=I heard that many new types of equipment and special combatants were also provided this time.
dialogue_3267=Their words can only be half believed. This time it's not so much a black op. Those slick guys in America don't deserve my trust, but you, Lucas, I trust completely.
dialogue_3268=We have arrived at the intended location. Objective: Destroy Soviet missile bases and nuclear factories. It's time for you to show yourselves!
dialogue_3269=No one dares to challenge me in the sky.
dialogue_3270=Of course, we've got one for you, too.
dialogue_3271=Wait, there seems to be some kind of building facility in the mountains that doesn't look like a Soviet military base.
dialogue_3272=There seems to be a figure there. Raise the attention! Judging by the traces left behind, these people's level of technology has far surpassed ours.
dialogue_3273=What's happening? Why are the troops on the front line firing on friendly forces?
dialogue_3274=It's as if the Soviet troops are being controlled. Some of them even gave us control of their troops' equipment.
dialogue_3275=Alfred, I can't stay here much longer. Make use of this chariot and continue south. We need your help.
dialogue_3276=Damn it, what just happened? Communications were suddenly cut off! Alfred, are you guys okay?
dialogue_3277=It looks like we might have to take a trip to South America. I've heard that the situation there is quite complicated and that war could break out at any time.
dialogue_3278=There was a bigger crisis to deal with right now. Continue with the battle plan before the Soviets can react.
dialogue_3279=Strange armored fighting vehicles have been found among the British troops. We have seen similar weapons before, and now the problem has become complicated.
dialogue_3280=Give it up. Your plan won't work. Launching an attack on a frontal battlefield will only allow other forces to reap the benefits.
dialogue_3281=I've been evacuated from the base. This place is now in your hands.
dialogue_3282=The Soviets have long been reaching into South America. Now that they have launched an all-out attack, we must pre-empt the situation before it becomes irreversible.
dialogue_3283=The U.S. military relies on its many overseas military bases to accomplish the mobilization of large numbers of troops in a short period. By force of arms, it threatens local regimes.
dialogue_3284=Look at the world, war never changes. Only the strong have a voice and the others are forced to take sides.
dialogue_3285=Three specific coordinates have been located. Soviet troops have been spotted in the vicinity of the closest one, and they appear to be trying to capture it by force.
dialogue_3286=Now that you're here, there's no turning back. Secure the base in South America and we'll start over here.
dialogue_3287=Alfred, we didn't invite you here. Regardless of how these people contacted you, you're already listed as one of them.
dialogue_3288=The enemy has advanced weapons that can even alter the minds of people. If they cannot be used to our advantage, they must be completely destroyed at the first opportunity.
dialogue_3289=We'll be back with a vengeance. Osborn, you'll have nowhere to run in the end.
dialogue_3290=I knew the end from the beginning, and I had long ago chosen the path I would surely take. The question is, what about you?
dialogue_3291=I've always been loyal only to myself and my brothers. And Osborn, you've been our brother long before.
dialogue_3292=Maybe there is no such thing as mind control. Maybe it's that we've seen the status quo for a long time and have wanted to make changes for a long time.
dialogue_3293=You still have your signal-jamming device, right? I trust my judgment of you. Many friends are better than many enemies.
dialogue_3294=Come on, the show's on!
dialogue_3295=Maybe you can win in South America. But remember, we're on to you.
dialogue_3296=Lucas, this is all the elite we have. You know what to do.
dialogue_3297=These troops are grouping around their forts. Neither of us will do well if we keep this up.
dialogue_3298=Right now the enemy of my enemy is my friend. I'm afraid the only way to contain these people is to have a temporary truce with the Soviets.
dialogue_3299=No one can stop me. Not the American army, not the Soviet army, not anyone. I will never let the defeat of the Reich be repeated!
dialogue_3300=Our warriors have long been lurking about, covertly pushing various military operations to change the landscape of the new world.
dialogue_3301=We cannot resist the enemy's attack. Cairo is lost, and the supply line is in danger of being cut off!
dialogue_3302=The defensive line can no longer be maintained. Now that the aircraft have been refueled, I will continue to fulfill my mission as a member of the Air Force.
dialogue_3303=All aircraft, pull back to mainland Britain for refueling. We need more air cover for the upcoming evacuations

