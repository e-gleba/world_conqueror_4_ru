event_stage_intro_20901=The base has self-destructed, and we are the last group to successfully evacuate. The temporary coordinates set at the final moment should lead us to a base near the South American jungle. This time, we will have more time to plan everything.
event_stage_intro_20902=The Spanish Civil War has erupted in full force. With the intervention of Germany, Italy, and the Soviet Union, the non-intervention agreement is now just an empty shell. The once-mighty British Empire has already crumbled, and the new empire will follow in its footsteps. Even though the outcome of this war cannot be changed, we must still fight. For our comrades are there.
event_stage_intro_20903=After World War II, the Marshall Plan secured Turkey as an ally for the U.S. in the Middle East. However, under Soviet instigation, Iranian nationalism is on the rise, making oil production in Iran increasingly difficult. This severely threatens our interests! With the approval of the new President Eisenhower, the CIA and MI6 have cooperated to plan a coup. This mission must succeed.
event_stage_intro_20904=Osborn's plan has successfully turned the factions into fierce combatants in the South American jungle. Japanese and Soviet nationalists also took advantage of this turmoil to launch attacks on the U.S. bases in Japan. It is said that the Soviets have developed satellite weapons—this is our perfect opportunity to seize this technology! Yudintsev has arranged for a communications satellite expert to meet us near the Soviet base on Sakhalin Island.
event_stage_intro_20905=The Marshall Plan accelerated the reconstruction of Western Europe, with economies of European countries developing rapidly. However, recent corruption in Italy has led to social unrest, even resulting in the assassination of the Prime Minister. Meanwhile, the Soviet army has swiftly occupied the entirety of Czechoslovakia and continues to deploy troops to the Balkan Peninsula. We have ignited the powder keg of Eastern Europe, and the European landscape is about to be redefined.
event_stage_intro_20906=American separatists, dissatisfied with the President's re-election, have launched an armed uprising. Strangely, we did not interfere in this election, and to my knowledge, no similar conflict has occurred before. Now, the President has reached out to us to quell this rebellion. This mission is filled with unpredictability, so we must constantly monitor the movements of various U.S. military armies.
event_stage_intro_20907=The Allies took advantage of the situation and launched a surprise attack on our military facilities in Mexico. The enemy has obtained the coordinates of our bases on the Pacific islands, rendering our jamming devices useless. The Soviet forces in Antarctica will soon discover our base. The situation is urgent; immediately gather all available troops and launch an attack on the Soviet research station in Antarctica.
event_stage_intro_20911=The base has self-destructed, and we are the last group to successfully evacuate. The temporary coordinates set at the final moment should lead us to a base near the South American jungle. This time, we will have more time to plan everything.
event_stage_intro_20912=The Spanish Civil War has erupted in full force. With the intervention of Germany, Italy, and the Soviet Union, the non-intervention agreement is now just an empty shell. The once-mighty British Empire has already crumbled, and the new empire will follow in its footsteps. Even though the outcome of this war cannot be changed, we must still fight. For our comrades are there.
event_stage_intro_20913=After World War II, the Marshall Plan secured Turkey as an ally for the U.S. in the Middle East. However, under Soviet instigation, Iranian nationalism is on the rise, making oil production in Iran increasingly difficult. This severely threatens our interests! With the approval of the new President Eisenhower, the CIA and MI6 have cooperated to plan a coup. This mission must succeed.
event_stage_intro_20914=Osborn's plan has successfully turned the factions into fierce combatants in the South American jungle. Japanese and Soviet nationalists also took advantage of this turmoil to launch attacks on the U.S. bases in Japan. It is said that the Soviets have developed satellite weapons—this is our perfect opportunity to seize this technology! Yudintsev has arranged for a communications satellite expert to meet us near the Soviet base on Sakhalin Island.
event_stage_intro_20915=The Marshall Plan accelerated the reconstruction of Western Europe, with economies of European countries developing rapidly. However, recent corruption in Italy has led to social unrest, even resulting in the assassination of the Prime Minister. Meanwhile, the Soviet army has swiftly occupied the entirety of Czechoslovakia and continues to deploy troops to the Balkan Peninsula. We have ignited the powder keg of Eastern Europe, and the European landscape is about to be redefined.
event_stage_intro_20916=American separatists, dissatisfied with the President's re-election, have launched an armed uprising. Strangely, we did not interfere in this election, and to my knowledge, no similar conflict has occurred before. Now, the President has reached out to us to quell this rebellion. This mission is filled with unpredictability, so we must constantly monitor the movements of various U.S. military armies.
event_stage_intro_20917=The Allies took advantage of the situation and launched a surprise attack on our military facilities in Mexico. The enemy has obtained the coordinates of our bases on the Pacific islands, rendering our jamming devices useless. The Soviet forces in Antarctica will soon discover our base. The situation is urgent; immediately gather all available troops and launch an attack on the Soviet research station in Antarctica.


