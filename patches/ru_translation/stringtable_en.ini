elite_intro_97=The Harrier is the most representative multi-role V/STOL aircraft in the West and the world’s first V/STOL jet to become fully operational and systematically deployed. Thanks to its rotating nozzle design, which enables vector-thrust control, it can operate without relying on traditional runways, allowing flexible deployment at forward makeshift airfields or temporary landing sites and significantly enhancing its survivability and maneuverability. With stable hovering and low-altitude maneuvering capabilities, the Harrier excels in close air support and ground attack missions, providing a sustained advantage in suppressing high-value targets.

elite_intro_98=The Su-30V fighter jet was a secret vertical take-off and landing (VTOL) project developed by the Sukhoi Design Bureau for the Warsaw Pact during the Cold War. Its appearance and structure are derived from the proven Su-27 and Su-30 platforms, but its power system and flight control architecture have been thoroughly redesigned. The aircraft features twin-engine thrust-vectoring nozzles and an augmented lift system, enabling it to perform short take-offs and landings (STOL) in frontline areas lacking runways and also hover at low altitudes to provide sustained aerial fire support for ground forces.


