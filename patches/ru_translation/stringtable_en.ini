feat_desc_156_Lv3=During this turn, when your attack deals damage, it will also deal {2}% damage to up to {1} units within a 2-tiles radius of the target, prioritizing non-infantry units. This effect lasts for 1 turn. Cooldown of 2 turns.
feat_desc_156_Lv4=During this turn, when your attack deals damage, it will also deal {2}% damage to up to {1} units within a 2-tiles radius of the target, prioritizing non-infantry units. This effect lasts for 1 turn. Cooldown of 2 turns.
feat_desc_157=After making an attack, you can make one additional attack. This effect can trigger up to {1} times.
feat_desc_157_Lv4=After making an attack, you can make one additional attack. This effect can trigger up to {1} times. For each attack you make during your turn, the next attack’s damage is increased by 20%, stacking up to three times.

