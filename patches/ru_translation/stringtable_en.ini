event_4111=Battle of the Barents Sea
event_4112=Vistula–Oder Offensive
event_4113=Battle of Rabaul

event_intro_4111=On 31 December 1942, a naval battle broke out in the Barents Sea between the British escort fleet and the German Navy’s raiding force. Despite the German ships’ superior firepower, the escort fleet, through quick reactions and timely reinforcements, successfully protected the convoy bound for the Soviet Union. The German fleet failed to sink a single transport ship, and this defeat directly led to the resignation of Erich Raeder, the Commander-in-Chief of the German Navy, with Karl Dönitz taking over. As a result, the strategic focus of the Kriegsmarine fully shifted to submarine warfare.
event_intro_4112=The Vistula-Oder Offensive was a large-scale strategic offensive conducted by the Soviet Red Army. In response to the difficulties faced by the Western Allies during the Battle of the Bulge, the Red Army advanced its planned attack by eight days, launching assaults from the Vistula River bridgeheads on January 12, 1945. Under the command of Marshal Georgy Zhukov and Marshal Ivan Konev, two Soviet Fronts broke through German defenses with overwhelming force and liberated cities such as Warsaw and Kraków, pushing the front directly into the German heartland and paving the way for the final capture of Berlin.
event_intro_4113=The Battle of Rabaul was a crucial operation launched by the Japanese forces to seize a strategic hub in the South Pacific. In early January 1942, Japanese carrier-based aircraft began air raids on Rabaul. On January 23, Japanese ground troops successfully landed and swiftly captured Rabaul, then fortifying it as a naval and air stronghold. From the Allied perspective, the loss of Rabaul posed a direct threat to their lines of communication with Australia. The Japanese successfully secured a vital forward base, greatly facilitating their further operations in the Solomon Islands and New Guinea.

dialogue_4253=The submarine force spotted the movements of the British transport convoy.
dialogue_4254=The fleet was divided into two divisions, and after luring away the British escort ships, then we launch a full-scale assault on the transport fleet.
dialogue_4255=The British warships detected the German fleet in the northwest. While advancing to intercept, the escort fleet laid a smoke screen to cover the transport convoy’s withdrawal from the battlefield.
dialogue_4256=The Germans’ troop strength is nearly exhausted, yet our reinforcements are inexhaustible.
dialogue_4257=The defenses in the Warsaw area have been breached, and the Germans are retreating. Continue the pursuit! Advance at full speed!
dialogue_4258=The German troops in Kraków have disintegrated. The enemy has abandoned their positions and has begun moving westward.
dialogue_4259=We hold an absolute advantage. Do not allow the Australian troops on the island to escape. Seal off their evacuation routes.
dialogue_4260=Facing the overwhelming Japanese landing forces and suffering from a severe manpower shortage, the Australian defenders were consequently forced to withdraw south.
dialogue_4261=Communications systems have significantly improved, enabling fighter jets to respond more quickly to airstrike requests from ground forces. By fully leveraging air superiority, today belongs to the fighter jets.
dialogue_4262=While the battle situation has taken a turn for the worse, there is still a chance to turn things around.
dialogue_4263=The High Command issued a direct order, instructing us to cease our advance.
dialogue_4264=We should carry out some "strong reconnaissance" operations in advance for subsequent attacks. The armored forces continued to advance.
dialogue_4265=This… the scale of this air raid is not even close to halt the German ground offensive.
dialogue_4266=Where did such a failure originate?
dialogue_4267=Alfred has been killed in action, and the course of the battle has deviated significantly from what we anticipated. Perhaps next time, we should tkae over the command earlier.
dialogue_4268=This failure is a foregone conclusion. But you will pay for this.
dialogue_4269=I’ll be back.
dialogue_4270=We have already surrounded Rommel’s forces.
dialogue_4271=Never underestimate soldiers’ determination to defend their homeland. Retreat!
dialogue_4272=The German forces continue to put up futile resistance. Take Caen and completely crush the enemy’s defensive lines.
dialogue_4273=All of your willpower is truly admirable.
dialogue_4274=For our soldiers’ honor and for Germany, we will continue to fight.
dialogue_4275=We alone can rescue ourselves. We alone can rescue our country.
dialogue_4276=Harsh weather severely disadvantages both sides. To achieve our intended objectives, we must increase the tempo of the offensive.
dialogue_4277=No Prussian generals shall be taken prisoner.
dialogue_4278=The blizzard is over. The counteroffensive begins now.
dialogue_4279=The snow in the forests of the Ardennes is piercingly cold. I feel as if I have collapsed here countless times.
dialogue_4280=I will remember you—foolish yet admirable adversaries. Your anthem is indeed a tribute to courage.
dialogue_4281=The Scorpion Empire’s experiment at the Fortress of the Sun has been proven successful.
dialogue_4282=Such an approach might be overly direct. Perhaps one day they’ll eventually realize it.
dialogue_4283=Perhaps so, but even then, I would still trust Alfred.
dialogue_4284=We will do our utmost to weaken the enemy’s capabilities right here to provide you with as much time as possible.
dialogue_4285=Records from the Fortress of the Sun indicate that the three beacon amplifiers in South America will complete the debugging process after 10 experimental cycles.
dialogue_4286=I knew the end from the beginning, and I had long ago chosen the path I would surely take.
dialogue_4287=The last remaining beacon amplifier has been completely set up. Those affected gradually lose their autonomous consciousness, ultimately returning to the sides of the Scorpion.
dialogue_4288=We have successfully averted the disaster, but the source of the trouble has yet to be eradicated.
dialogue_4289=I must regroup my forces and retake our fortress.
dialogue_4290=The Scorpion Empire’s Solar Fortress in the Mexican ruins has been breached, and the beacon amplifier has been seized. The locations of secret bases worldwide have been fully exposed, leaving Scorpion Empire in a fully vulnerable strategic position.
dialogue_4291=The Scorpion Empire's Echo Bunker at the ruins in Colombia has been breached, and the beacon amplifier has been seized. All facilities in the ruins were set to self-destruct. However, remaining access records indicate that the facility was reactivated in 1933.
dialogue_4292=The Scorpion Empire's ancient ruin in Brazil, the Eye of the Inca, has been breached, and the beacon amplifier has been seized. Critically, many specialized weapons and equipment were not transferred or destroyed in time, and there are even previously unseen blueprints for new military hardware.
dialogue_4293=The Scorpion Empire's Temple of Star Trail ruins in Brazil, has been breached, and the beacon amplifier has been seized. In the aftermath, the US and the Soviet Union seized a large amount of encrypted data, fully exposing Scorpion Empire's global personnel lists and military deployments.
dialogue_4294=All of the ruin facilities belonging to Scorpion Empire have been occupied, and the countdown has stopped. Black Scorpion’s plans in South America have been thoroughly thwarted.
dialogue_4295=Osborn was utterly defeated, halting the countdown. The Scorpion’s South American plans were also utterly crushed.


