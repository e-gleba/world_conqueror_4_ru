skill_info_162=When commanding ship units, morale will not diminish. When dealing a naval critical attack, increase damage by [#00FF00#%d%%]. If a friendly carrier within 2 hexes or if the commander is deployed on a carrier, air strikes, missiles, and nuclear bombs deals +30%% damage. All friendly aircraft carriers within 2 hexes gain +15%% air strike damage.
skill_info_163=While commanding ship units, there is a [#00FF00#%d%%] chance to deal a critical attack when attacking or launching airstrikes. (If the general has this skill, the effects of Fleet Leader and Airforce Leader are inapplicable.)
skill_info_164=When commanding an infantry elite force, friendly units (including the commanding unit itself) within a 1-hex radius deal +10%% damage to land units (If the elite force's level is at least 9, the bonus becomes 15%%). For each additional friendly elite force within range, an additional [#00FF00#%d%%] damage bonus is applied, up to 25%%.
skill_info_165=After commanding infantry to attack, recover HP equal to [#00FF00#%d%%] of the damage dealt. If a friendly armored unit or artillery is within 1 hex, infantry unit’s attack and counterattack range +1.


