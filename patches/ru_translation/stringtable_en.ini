dialogue_2834=Comrades, liberate Cluj, and drive the German-Hungarian allies out of Romania!
dialogue_2835=Advance on Debrecen, and destroy the enemy once and for all!
dialogue_2836=Attack to the northeast and capture Kalinin! Aim to cut off Moscow and Yaroslavl even further.
dialogue_2837=The Kalinin Front, led by Comrade Konev, must prevent the Germans from breaking through to Kalinin! Moscow will do its best to mobilize resources to support it.
dialogue_2838=Attention all units: assault the Germans from all directions in an aggressive manner to deplete their strength and stop the enemy's continued advance!
dialogue_2839=The enemy resistance is fierce. We must stabilize the line to avoid a break in the rear.
dialogue_2840=Moscow is close at hand. The Soviets are exhausted. Rip through their defenses and storm Moscow!
dialogue_2841=Comrades, the enemy has been closed to the Mozhaysk defense line. We must hold it - Moscow is behind us!
dialogue_2842=Comrades, the enemy's land is at hand, and the time for vengeance has come. Attack! Wash away the shame of defeat and console the fallen!
dialogue_2843=Soldiers, for the honor of East Prussia and for our homeland, resist to the last moment without fear of sacrifice!
dialogue_2844=Attention all fleets, we'll clear the Japanese sea power and provide space for the landings. Take the Philippines and the Japanese navy will no longer be a threat!
dialogue_2845=Soldiers, board the island, kill the enemy, and wash away our shame!
dialogue_2846=Gentlemen, no matter the sacrifice, we must win this battle! Lose the Philippines and the navy will be useless again.
dialogue_2847=All of you continue to fight, while my division will draw the enemy away!
dialogue_2848=Our supplies are far superior to the enemy's. Infantry will lead the way, tanks will destroy the enemy, and this battle will be won!
dialogue_2849=Until I return, rely on the minefield for defense. Save your supplies and wait for resupply.
dialogue_2850=The supply ship will arrive soon. Armored units are assembling to the north in preparation for retaking positions.
dialogue_2851=Good news. The RAF destroyed the enemy supply ship at Tobruk!
dialogue_2852=Supplies are running low, and the losses of the troops are too great. We can no longer continue to fight. All army, full retreat!
dialogue_2853=The Greek army is far less equipped than ours! Soldiers, represent the glory of Italy and occupy Greece!
dialogue_2854=The Greeks were quite resilient, but still couldn't hold us off.
dialogue_2855=Hold the ranks. We can't let them retake the position!
dialogue_2856=Take Empress Augusta Bay and hold it!
dialogue_2857=A wave of Japanese reinforcements came from the sea, we need to stop them!
dialogue_2858=The southern units will draw fire, the northern units will make the main attack. Comrades, the liberation of Kyiv is at stake in this battle!
dialogue_2859=Hold Kyiv at any costs. The battle front will not be allowed to move back any further!
dialogue_2860=We can't be trapped in Kyiv. Quickly retreat to the southwest!
dialogue_2861=Kyiv has been liberated. Continue to pursue the Germans!
dialogue_2862=Counterattack! Stop the enemy from continuing their advance!
dialogue_2863=The operation was divided into three parallel paths. Although the local garrison is weak, it is important to move quickly to prevent the harbor from being destroyed.
dialogue_2864=The Royal Italian Navy is now anchored at Taranto. This is a great opportunity. We must destroy them at this battle.
dialogue_2865=Anti-aircraft guns counterattack, others dodge air raids!
dialogue_2866=The Navy is covering the landings of the Army. It is imperative that the airfield be recaptured!
dialogue_2867=A report came from a reconnaissance plane: Japanese troops are approaching Guadalcanal. Prepare for battle!
dialogue_2868=Japanese reinforcements are here. Be on guard!
dialogue_2869=The enemy's defenses in the south are empty. We'll bypass the defenses here, draw in the besieging forces and liberate Tobruk!
dialogue_2870=The forces besieging Tobruk continue to fight. Other troops defend their positions and wait for supplies.
dialogue_2871=Tobruk has been taken, and now it's all hands on deck for a counterattack!
dialogue_2872=Continue the offense and take Rostov!
dialogue_2873=Push forward and prepare for encirclement. In this battle, we're going to hit the German 1st Panzer Army hard!
dialogue_2874=Troops can't be destroyed here. the German 1st Panzer Army withdraws from Rostov.
dialogue_2875=Comrades, the time to strike back has come. Attack and retake our positions!
dialogue_2876=Hold the defense line and never give up any of your positions!
dialogue_2877=Comrades, we can't allow them to fall into Germany's and bring danger to Leningrad. Attack until Leningrad is safe!
dialogue_2878=Compatriots, we will fight to the end for Finland's independence and for the safety of our homeland!
dialogue_2879=Concentrate forces on capturing Naro-Fominsk and continue the front towards Moscow!
dialogue_2880=Comrades, we must hold this line of defense and shall not let the enemy break into Moscow!
dialogue_2881=Artillery support is in place. Comrades, let's take back Kalinin!
dialogue_2882=Attention all units: rely on the line and defend along the river to ensure Kalinin's security!

dialogue_3000=The vanguard has cut off the enemy's land reinforcements and successfully completed the siege of Stalingrad.
dialogue_3001=The fate of the Third Reich is in our hands. We will crush the enemy as cold as a machine, and Stalingrad will bear witness to our immortality!
dialogue_3002=With the Volga behind, there is no turning back! Any defectors will be executed, and soldiers who survive will be promoted beyond ranks!
dialogue_3003=Although I will leave the front line, my heart is still with you. Adversity is just a test of our will; get through it and victory will be ours.
dialogue_3004=I'm not here to cover a retreat, but to defeat the enemy completely. We will block the enemy's attack behind every street, every factory, every crumbling wall.
dialogue_3005=Looking down from above, the enemy is nothing more than pawns on a chessboard. Every dive will be a judgment on the enemy!
dialogue_3006=They thought they were in control of the battle situation, but they didn't realize the real power was closing in on them. The frenzy of the counterattacks would plunge them into trouble.
dialogue_3007=The enemy used to think they were untouchable, but we have completely shattered their arrogance. Taking Kalach will be the beginning of the enemy's nightmare.
dialogue_3008=The enemy's siege is only temporary. Once our reinforcements arrive, their dreams of victory will be completely shattered. Reinforcements towards Stalingrad at any costs!
dialogue_3009=Every step paves the way to victory, every strike is a death knell for the enemy.
dialogue_3010=On the battlefield, I do only one thing - confirm the moment when the enemy takes his last breath.
dialogue_3011=As a soldier, I did my best to fulfill my duty, but in the face of desperate situation, we are left with few options.
dialogue_3012=I am proud of my soldiers, who showed unparalleled courage under the most difficult conditions. May the soldiers who died here rest in peace.
dialogue_3013=Every brick and stone in Stalingrad will be turned into an enemy's grave.
dialogue_3014=The sky has lost an eagle, my destiny ends here. Even if I fall, I will burn to the last flare.
dialogue_3015=Is it... all over? This bullet may take my life, but it will never extinguish the fury of our vengeance.

