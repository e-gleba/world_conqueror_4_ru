legend_chapter_4=Desert Rats

legend_army_4=Desert Rats

legend_stage_40101=Operation Compass
legend_stage_40102=Operation Battleaxe
legend_stage_40103=Operation Crusader
legend_stage_40104=Breakthrough at El Alamein
legend_stage_40105=Tunisian campaign
legend_stage_40106=Pursuit in Italy

legend_intro_40101=The British 7th Armored Division, reformed from the mobile forces stationed in Egypt, earned the nickname “Desert Rats” from their jerboa mascot. During Operation Compass, launched by General Wavell in December 1940, the division fully leveraged its armored mobility and became the main attacking force. They captured key strongholds such as Bardia and Tobruk in succession and, with daring maneuvers across the desert, successfully intercepted the Italian corps retreating from Benghazi, capturing a large number of enemy troops. In this campaign, the 7th Armored Division swept across Cyrenaica and, with their outstanding achievements, made the name “Desert Rats” echo across the North African battlefield for the first time.
legend_intro_40102=In 1941, to rescue Tobruk from the siege by Rommel’s Africa Corps, the British launched Operation Battleaxe. In this battle, the 7th Armored Division served as the spearhead of the attack, demonstrating remarkable mobility and assault capabilities by successfully capturing Fort Capuzzo and briefly breaking through the German lines. Ultimately, the operation fell short of turning the tide, but despite setbacks in allied attacks and a strong German counteroffensive, the 7th Armored Division successfully withdrew in the face of adversity, preserving its main force and retaining a critical force for subsequent counterattacks in the North African theatre.
legend_intro_40103=After drawing on lessons learned from previous campaigns, on November 18, 1941, the newly appointed Commander-in-Chief in the Middle East, General Auchinleck, devised Operation Crusader with the aim of destroying the German armored forces surrounding Tobruk and liberating the city. The 7th Armored Division, serving as the spearhead of the offensive, swiftly advanced to Sidi Rezegh. To prevent the Allies from breaking out of the encirclement, Rommel concentrated his armored units to launch a fierce assault on Sidi Rezegh. Facing the German encirclement, the 7th Armored Division displayed extraordinary tenacity and fighting capability, not only withstanding the German counterattacks but also executing rapid maneuvers in the desert to strike at enemy command and logistics lines, laying the groundwork for an Allied victory.
legend_intro_40104=During the Second Battle of El Alamein, the British 7th Armored Division served as the tip of the spear of the British 8th Army, demonstrating exceptional mobility and assault capabilities. In the early stages of the battle, the division held enemy forces in check on the southern sector of the front. When the situation reached a stalemate, the British command decisively redeployed the 7th Armored Division northward to reinforce the main offensive direction. In the decisive "Operation Supercharge", the 7th Armored Division, along with its brother units, launched a fierce assault into the depths of the German defensive line. They ultimately succeeded in breaking through the combined German-Italian Axis defenses and joined the 1st and 10th Armored Divisions in a wide-ranging desert pursuit, thus making a critical contribution to the Allies’ ultimate victory in this pivotal battle.
legend_intro_40105=During the Tunisian campaign, acting as the vanguard of the Allied forces, the British 7th Armored Division launched a bold assault on the Mareth Line in March 1943. Drawing on exceptional maneuver tactics, they swiftly and skillfully broke through enemy lines in the harsh, rugged terrain and successfully flanked the German forces. In the Battle of the Wadi Akarit River, the 7th Armored Division once again demonstrated its desert warfare expertise by launching precise armored assaults that tore through the Italian positions. As the first British unit to enter Tunisia, the “Desert Rats” showcased their adept armored coordination and rapid advancement capabilities, contributing significantly to the eventual defeat of the Axis powers in North Africa and adding another brilliant chapter to their distinguished combat record.
legend_intro_40106=In 1943, after redeploying to Italy, the 7th Armored Division faced an entirely new challenge: transitioning from open desert to rugged mountainous terrain, a completely different combat environment. However, this “Desert Rats” division demonstrated remarkable adaptability and offensive capabilities. After landing at Salerno, they not only withstood fierce German counterattacks but also advanced northward, successfully capturing Naples. This achievement significantly hastened Italy’s withdrawal from the war, once again proving they were worthy of their reputation as a formidable elite force.

