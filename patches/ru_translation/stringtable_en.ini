dialogue_3304=Quickly make contact with the others and rendezvous at the base of the coordinate location.
dialogue_3305=Unidentified armed forces have suddenly appeared in the war zone! Peace talks have been compromised. Launch an attack immediately!
dialogue_3306=Communications are back up. Osborne, you're alive! I'm surrounded by multinational forces, even a large number of Germans!
dialogue_3307=I do not fear death because I have always fought for what I believe in. This is the secret key to Coulson and me. Osborn, the rest is yours.
dialogue_3308=I failed long ago, but I am also destined to succeed! Your sacrifices will not be in vain.
dialogue_3309=Why is Williams there? What side are they on? What are those weapons?
dialogue_3310=Reinforcements have arrived on the battlefield. German air raids along the road have seriously slowed our march.
dialogue_3311=Contact has been made with friendly forces around the base and the facilities are functioning normally. Now it's time to avenge the deaths of our comrades.
dialogue_3312=The territorial strife in Leticia is now expanding into all-out war. We will assist Colombia in its victory and spread German power throughout the world.
dialogue_3313=This form of conflict and war is constantly being played out here. This is not the first time, and it will certainly not be the last.
dialogue_3314=Why is the Peruvian army firing at us!? We are not going to lay down our arms and surrender.
dialogue_3315=Damn it, just now you commanded a squad that attacked both the Colombian and Peruvian armies. Now we have to get you to a safe place.
dialogue_3316=I know a safe place, right in the rainforest near the triple junction.
dialogue_3317=It's you guys! So it is.
dialogue_3318=Prioritize the elimination of the surrounding German units to open a path for Coulson and his men.
dialogue_3319=Who are you? Why are you helping us?
dialogue_3320=For your ignorance and your courage.
dialogue_3321=I seem to have seen you somewhere.
dialogue_3322=
dialogue_3323=In any case, one thing is quite certain. It's because of you that we're in this situation.
dialogue_3324=I'll explain it all to you at the base when the other threats have been cleared.
dialogue_3325=Franco's Afrika Korps had successfully reached the front line with the assistance of transport planes. They will attack from the south towards Madrid.
dialogue_3326=Intelligence indicates that the German Condor Legion is out in full force, and it is feared that Bilbao will be quickly lost under a massive enemy air attack.
dialogue_3327=Defend Madrid and Barcelona to the death. Don't let the rebels pinch us from both sides.
dialogue_3328=The Civil War did break out, and everything was exactly as Osborne described it.
dialogue_3329=In order to accelerate the advance and form an encirclement of Madrid, my air units will clear the Republican forces still resisting in the north.
dialogue_3330=Intelligence indicates that an elite unit of Italian troops has landed from the east. Judging from their course of action, it appears to be an attempt to cross the desert and infiltrate our hinterland.
dialogue_3331=Do not step back, use armored units to assist the infantry defense and consolidate the eastern flank.
dialogue_3332=I hope I didn't arrive too late. The program over in England is going very well.
dialogue_3333=Franco has been repulsed by us. But the rebels still keep coming from the south.
dialogue_3334=Our intentions have been detected, but the enemy's defense deployment has been disrupted. The operation is terminated. It's time to retreat.
dialogue_3335=Thank you for your timely support. But in my judgment, I'm afraid the Republican armies are losing the war.
dialogue_3336=The troops have sustained a large number of casualties. The command ordered all volunteer units to assemble to the east and prepare for retreat.
dialogue_3337=We'll see you again. I hope your savior complex doesn't get you deeper and deeper into it.
dialogue_3338=Spain's golden age is long gone, and it is stuck in a cycle like its own colonies of the past. Where exactly is our way out?
dialogue_3339=The era of being controlled by colonizers, warlords, and capitalists is over. The world needs a change, and it needs me. And I need you.
dialogue_3340=A pro-U.S. Iranian government helps the U.S. gain geographic and strategic advantage in the Middle East. We must not repeat the mistakes of the Korean theater.
dialogue_3341=We know Eisenhower and his allies very well. Therefore, we have long since prepared a countermeasure. Now let's get moving.
dialogue_3342=We have been set up by the Soviets! They've taken control of Tehran and other northern towns. Even invaded Iraq & Turkey.
dialogue_3343=Continue with the plan. We have our own cards.
dialogue_3344=Lucas talks about you guys a lot. I'm curious, given your position, what kind of action you guys take this time.
dialogue_3345=The oil business has allowed us to make many rich friends in the countries of the Middle East. And we have a common enemy, and that alone is enough.
dialogue_3346=You're right. But this time we must remain neutral on the surface. Such a small military bill is still affordable.
dialogue_3347=We will not volunteer troops but will provide ongoing supplies for your forces.
dialogue_3348=The Intelligence Agency has long taken this into account. Mercenaries and armed men have been lurking around the major cities in advance.
dialogue_3349=What kind of artillery is this?
dialogue_3350=This is my patent. I can gradually explain the design principles to you later.
dialogue_3351=An all-out Soviet attack has threatened our base. Counterattacks will now begin immediately.
dialogue_3352=The Tehran operation has been a success. According to reliable information, the enemy is about to shift the center of gravity of its attack and send substantial reinforcements to Iran.
dialogue_3353=Soviet power is being driven out of this land by us.
dialogue_3354=Satellite control has been successfully hijacked. Satellite weapons are online.
dialogue_3355=The Soviet units around you are eliminated and we'll make sure you're safe.
dialogue_3356=Eliminate the Soviet units around you and we make sure you're safe.
dialogue_3357=The insurgents took over our research base on the Sakhalin, we shall mobilize our forces to retake it.
dialogue_3358=Even with the information provided by Soviet insiders, it was still impossible to complete the hijacking in such a short period of time. How the hell did you do it?
dialogue_3359=The precious stone lands its innocent possessor in jail. Originally, cooperation in scientific research has already yielded results, but I didn't see the killing coming after me.
dialogue_3360=The new U.S.-Japan security treaty betrays our interests! We will keep on fighting until victory or death.
dialogue_3361=The domestic uprising in Japan has distracted the U.S. Army, which is a good time for us to retreat.
dialogue_3362=No, the insurrection leader is also one of our rescue targets.
dialogue_3363=A man is born between heaven and earth, how can he be depressed living inferiorly to others for a long time?
dialogue_3364=The great work is yet to be done, and God's will is hard to disobey.
dialogue_3365=The enemy's main strongholds have been suppressed. Join us. Fighting alone is bound to give us no chance of victory.
dialogue_3366=Those who know the times are wise, and those who understand the opportunities are valiant. I can join you. Our fight is far from over.
dialogue_3367=Now I'm drifting in all directions with no place to stay. Fortunately, you guys have saved me and I have a place to stay.
dialogue_3368=These separatists, incited by Osborn, continue to undermine the unity of the Union. Action must be taken to root out the Black Scorpion forces in Eastern Europe.
dialogue_3369=The Eastern Bloc is creating divisions within itself, and I am afraid that the Soviets have long planned to resolve these issues by force.
dialogue_3370=The mission was successfully completed and I have proven myself and our family. I can also provide some additional military services if you need them.
dialogue_3371=The Soviet army has crossed the line, and we will not tolerate anyone stationing troops on our territory.
dialogue_3372=There are no permanent friends and no permanent enemies. Send reinforcements immediately to aid Yugoslavia and Romania. Beware of the Black Scorpion's forces.
dialogue_3373=Soviet intelligence indicates that Wagner has defected to the Black Scorpion organization. Immediate action must be taken.
dialogue_3374=How is that possible!
dialogue_3375=Fight for the Soviets or fight for yourself. The choice is now yours.
dialogue_3376=Damn, it's you guys again! If you want an answer, I'll give you guys one.
dialogue_3377=No one can foresee everything, no one can decide the outcome of a war on their own.
dialogue_3378=It looks like you guys won't let me go.
dialogue_3379=Continue the attack. This artillery will be at its maximum power in my hands.
dialogue_3380=The Soviets in Poland have been suppressed by us, and my men will continue their attack eastward.
dialogue_3381=Nor could localized victories shake the power of the U.S. and Soviets in Europe.
dialogue_3382=That's for sure, but we're not going to pass up any opportunity to let our enemies wear each other down.
dialogue_3383=The war in the East heated up, and the insurgents in California and Texas formed an alliance there that gradually gained the upper hand.
dialogue_3384=America does not need a weak president.
dialogue_3385=No tactic under the sun can't be broken, only fast.
dialogue_3386=Being the first to take control of the insurgents' rear headquarters would have ended the war ahead of schedule.
dialogue_3387=The war in the East is irreparable. I fear that the situation here will also take a new turn.
dialogue_3388=Maybe it's time to call it quits at the right time, and switch from offense to defense.
dialogue_3389=Let's pull back to our bases in Mexico and keep an eye on the eastward direction of the U.S. Army in Texas.
dialogue_3390=Washington has been captured by the Insurgent Alliance. The world will bear witness to our resolve and strength once again.
dialogue_3391=No matter what kind of American you are, Osborn and his Black Scorpion are our enemies. The U.S. Army will hunt you down to the ends of the earth.
dialogue_3392=As it is, let's do it.
dialogue_3393=As the situation in the country stabilizes, more allies join us in the fight against the Black Scorpion.
dialogue_3394=Significant progress has been made in the technical analysis of the Antarctic relics. No force should be allowed to set foot in the Antarctic.
dialogue_3395=We're nearing the completion of our research, so let's show these ignorant people some true power!
dialogue_3396=No, how could it be.
dialogue_3397=It seems that our series of actions have not slowed down the Soviet R&D process. But we still have time.
dialogue_3398=The data in the Black Scorpion base has been successfully recovered, and the information indicates that we are under attack from the future. But no information on Osborn has been found.
dialogue_3399=The fleet has blocked the waters to the east of the island complex, and contact between the Black Scorpion forces was cut off.
dialogue_3400=Destroy every enemy in the Antarctic. No one gets out of here alive.
dialogue_3401=New prototypes of the battle tanks have been completed. The power of these weapons has been fully demonstrated in the First World War in South America.
dialogue_3402=The Soviet research is successful, and once it is put into mass production, the consequences are unimaginable.
dialogue_3403=It's not too late to stop the Soviets with us now.
dialogue_3404=In addition to this advanced military equipment, there is another even more amazing technology.
dialogue_3405=Osborn, it turns out that ignorance is your real weapon.
dialogue_3406=The army's gone up in smoke. The world's burning at my feet.
dialogue_3407=Osborn, are you okay? You're in a bit of a strange state.
dialogue_3408=In the distant future, there is only war.
dialogue_3409=It is as if he has become a different person.
dialogue_3410=All the other twelve secret keys have been collected and I still survive. I win this time!
dialogue_3411=War never changes.

