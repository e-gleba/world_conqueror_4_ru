feat_desc_154_Lv4=Damage dealt to armored and artillery units is increased by {0}%. After attacking a target, if the target is not eliminated, it is inflicted with a Impede effect that lasts for 1 turn. If the target is eliminated, you can immediately operate again, but the damage for each subsequent attack is reduced by {1}%, up to {2} times per turn.
feat_desc_155=Increases damage dealt to armored units, artillery units, and naval units by {2}%.
