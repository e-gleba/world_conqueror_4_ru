armygroup_event_desc_68=The Scorpion's series of operations in the United States were thwarted one after another, and its entire army undertook a major retreat to the south. With the assistance of the United States and the Soviet Union, several countries broke away from Black Scorpion’s control.
armygroup_event_desc_69=Osborn simultaneously activated five beacon amplifiers, initiating the final countdown. After 20 cycles, anyone lacking firm resolve would rejoin the Scorpion Empire. The United States, Soviet Union, United Kingdom, and France each dispatched their respective elite forces, in concert with neighboring countries, to launch raids on the Scorpion's ruins worldwide.
armygroup_event_desc_70=The Scorpion Empire’s Solar Fortress in the Mexican ruins has been breached, and the beacon amplifier has been seized. The locations of secret bases worldwide have been fully exposed, leaving Scorpion Empire in a fully vulnerable strategic position.
armygroup_event_desc_71=The Scorpion Empire's Echo Bunker at the ruins in Colombia has been breached, and the beacon amplifier has been seized. All facilities in the ruins were set to self-destruct. However, remaining access records indicate that the facility was reactivated in 1933.
armygroup_event_desc_72=The Scorpion Empire's ancient ruin in Brazil, the Eye of the Inca, has been breached, and the beacon amplifier has been seized. Critically, many specialized weapons and equipment were not transferred or destroyed in time, and there are even previously unseen blueprints for new military hardware.
armygroup_event_desc_73=The Scorpion Empire's Temple of Star Trail ruins in Brazil, has been breached, and the beacon amplifier has been seized. In the aftermath, the US and the Soviet Union seized a large amount of encrypted data, fully exposing Scorpion Empire's global personnel lists and military deployments.
armygroup_event_desc_74=The Scorpion Empire's Hurricane Lighthouse in the ruins of Brazil, has been breached, and the beacon amplifier has been seized. Communication between Scorpion Empire’s main forces and its members worldwide was temporarily cut off.
armygroup_event_desc_75=The Scorpion faction has once again rapidly expanded, prompting the United States and the Soviet Union to join forces to eradicate this threat. The Warsaw Pact and NATO have temporarily suspended hostilities and formed a new military alliance.
armygroup_event_desc_76=Osborn was utterly defeated, halting the countdown. The Scorpion’s South American plans were also utterly crushed.
armygroup_event_desc_77=All of the ruin facilities belonging to Scorpion Empire have been occupied, and the countdown has stopped. Black Scorpion’s plans in South America have been thoroughly thwarted.
armygroup_event_desc_78=Osborn was utterly defeated, halting the countdown. The Scorpion’s South American plans were also utterly crushed. Everyone heard freedom’s call.
armygroup_event_desc_79=All of the ruin facilities belonging to Scorpion Empire have been occupied, and the countdown has stopped. Black Scorpion’s plans in South America have been thoroughly thwarted. Everyone has heard the call of freedom.
armygroup_event_desc_80=The last remaining beacon amplifier has been completely set up. Due to Scorpion’s long-term covert release of Q30-laced nanomedicine in the control area, with the bell’s toll, those affected by the nanomedicine gradually lose their autonomous consciousness, ultimately returning to the sides of the Scorpion.
armygroup_event_desc_81=New crystal skulls have been discovered among the Maya ruins. Far from being ordinary artifacts, they are storage devices that record information about the temple and historical data on unknown civilizations.
armygroup_event_desc_82=The Neuschwabenland Korps appeared in the South American jungle, carrying Scorpion’s military equipment. Perhaps they have formed a military alliance with the Scorpion, or maybe Scorpion is the driving force behind their existence.
armygroup_event_desc_83=The Soviet Union delivered large quantities of tanks to Venezuela to establish an armored defensive line against offensives by the US military and its allies.
armygroup_event_desc_84=The Scorpion armed the pirates, enabling them to plunder merchant ships from various countries across multiple seas. This provoked retaliation from both the United States and the Soviet Union. By further bolstering their naval capabilities, fleets from various nations joined forces to launch a full-scale campaign against the pirates.
armygroup_event_desc_85=The Scorpion's naval forces use "acoustic fog" to disrupt radar systems, continuously raiding the shipping lanes around the Panama Canal. The supply lines of various nations' militaries have been significantly impacted.
armygroup_event_desc_86=The United States secretly airlifted missile components to Brazil along this route via Colombia and Peru, successfully evading detection by the Scorpion and the Soviet Union.
armygroup_event_desc_87=Cuba was once again attacked, and the regional equilibrium was once again disrupted. Meanwhile, the Soviet Union swiftly provided massive military aid to Cuba.
armygroup_event_desc_88=The United States deployed a massive sonar array in the eastern Caribbean to detect and track Soviet submarines.
armygroup_event_desc_89=The Soviet Union’s testing of an experimental crustal oscillation apparatus triggered an earthquake in the tri-border area of Chile, Bolivia, and Argentina. Because of its extremely uncontrollable nature, research on this weapon was ultimately terminated.
armygroup_event_desc_90=The Soviet Union tested the “Storm’s Eye” weather-control weapon in Cuba, successfully guiding a hurricane to strike Florida.
armygroup_event_desc_91=Radio stations established by anti-Scorpion organizations have gradually appeared in countries under Scorpion’s control throughout the region. These stations repeatedly broadcast appeals for the people living in the occupied territories to unite and overthrow Scorpion Empire’s rule.
armygroup_event_desc_92=For the purpose of preventing spy satellites from the United States and the Soviet Union from conducting comprehensive reconnaissance of the South American region, the Scorpion established jamming stations on islands across the world’s major oceans to jam and hijack signals, thereby intercepting satellite data from the United States and the Soviet Union.
armygroup_event_desc_93=The Royal Navy discovered a German nuclear-powered U-boat named Nautilus from World War II in the Bermuda region. This submarine is entirely different from the later U.S. Navy–built Nautilus. Although constructed during World War II, the U-boat remains intact, and its onboard equipment’s technological level far surpasses that era—even surpassing modern-day technology.
armygroup_event_desc_94=The discovery of a massive oil field in the Brazilian rainforest has sparked fierce competition for extraction rights among the United States, the Soviet Union, and the Scorpion Empire at the Peru–Brazil border.
armygroup_event_desc_95=After the Scorpion faction were expelled from North America, the U.S. military leveraged the technology from the Scorpion’s facilities to restart the Philadelphia Experiment. The new USS Eldridge, once again vanished before everyone’s eyes.
armygroup_event_desc_96=The Soviet Union constructed an experimental device called an "Earth Telescope" in Bolivia to probe the Earth's core, accidentally opening a channel to the mantle and successfully tapping into the abundant underground resources.
armygroup_event_desc_97=The Amazon River Basin was suddenly hit by an outbreak of yellow fever, leading to a decline in the combat effectiveness of various national forces. However, no infections were reported among the Scorpion forces or the American and Soviet troops.

