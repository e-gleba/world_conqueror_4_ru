event_stage_intro_20701=The Prime Minister has repeatedly urged us to launch an attack on the British forces. However, due to our low level of mechanization and lack of sufficient equipment and supplies, this offensive is bound to be unsustainable. For now, we must rely on our numerical superiority to compensate for these shortcomings. Let's advance towards Egypt.
event_stage_intro_20702=The speed of the British counterattack is astonishing, but the enemy has underestimated the size of our forces. They are now a spent force, and we possess ample strength to divide and break through the defenses of Cyrenaica. Our primary objective is to annihilate the effective strength of the British forces. Advance at full speed and spare no enemy soldier!
event_stage_intro_20703=The Allied forces in Greece have all been defeated by us, and Crete is now the enemy's last significant stronghold in the Mediterranean. Once we capture the island, we can use it as a springboard to seize Cyprus and even launch an attack on Egypt from the sea.
event_stage_intro_20704=The British forces have launched a new offensive to open a path to Tobruk. We have already reinforced our existing fortifications and constructed new positions to counter the British advance. Supplies and reinforcements will continue to arrive. By then, we will be able to regain control of the North African theater.
event_stage_intro_20705=The encirclement of Tobruk and its surrounding areas is nearing completion. However, we currently lack the resources and equipment needed for a large-scale offensive. The good news is the British initiative plays into our hands, providing an opportunity for a swift and decisive victory by eliminating the enemy's effective strength and avoiding the problems associated with overextended supply lines.
event_stage_intro_20706=Our supply lines are stretched to the limit. The enemy's naval and air forces in the Mediterranean pose a significant threat. Allied forces, led by the British, are continuously receiving reinforcements through the Red Sea and the Suez Canal. The situation is dire, but this will be our final battle in North Africa, a decisive moment that will determine our fate.
event_stage_intro_20707=The Allied forces have regrouped in Morocco and Algeria. The U.S. forces are accelerating their advance by land, while the British Navy is mustering its full strength in the Gulf of Tunis, where local Vichy French forces may have made contact with the Allies. The crisis is looming, but we will hold out in Tunis to the last moment with our remaining strength, awaiting the arrival of Rommel's main forces.
event_stage_intro_20711=The Prime Minister has repeatedly urged us to launch an attack on the British forces. However, due to our low level of mechanization and lack of sufficient equipment and supplies, this offensive is bound to be unsustainable. For now, we must rely on our numerical superiority to compensate for these shortcomings. Let's advance towards Egypt.
