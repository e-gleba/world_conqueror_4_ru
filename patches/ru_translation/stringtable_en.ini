feat_desc_145_Lv3=Deploy a drone within 2 hexes. After deployment, it can move and attack immediately. The drone operates as an independent and can attack only once per turn. It lasts for 2 turn. 1-turn cooldown.
feat_desc_145_Lv4=Deploy a drone within 2 hexes, up to 2 times per turn. After deployment, it can move and attack immediately. The drone operates as an independent and can attack only once per turn. It lasts for 2 turn. 1-turn cooldown.
