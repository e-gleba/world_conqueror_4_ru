legend_intro_10101=On the battlefields of France, the 7th Panzer Division instilled fear across the region as the formidable "Ghost Division," and the Battle of Arras on May 21, 1940, became the most pivotal test in its rise to fame. That day, the division was ordered to bypass Arras and advance northward as the vanguard but unexpectedly encountered a planned counterattack from the Anglo-French forces, triggering intense combat. Confronted by a sudden threat to its flank, the 7th Panzer Division briefly found itself on the defensive. However, under the flexible and decisive command of General Rommel, the German forces ultimately reversed the tide and averted the crisis. This engagement further cemented the "Ghost Division's" fearsome reputation.
legend_intro_10102=As the war’s focus shifted, the 7th Panzer Division also commenced its offensive toward Moscow. However, the first engagement, the “Battle of Alytus,” already signaled a brutal future. The 7th Panzer Division and the Soviet 5th Armored Division clashed in a large-scale tank battle at Alytus. The 7th Armored Division managed to repel the Soviet 5th Armored Division—which fielded more than 200 tanks—thereby seizing Alytus and thus opening the path to Vilnius.
legend_intro_10103=On October 2, 1941, the 7th Panzer Division launched a frontal attack on the Soviet forces and defeated the newly arrived Soviet tank reinforcements. Together with the 10th Panzer Division of Panzer Group 4, it completed the encirclement at Vyazma. This advance successfully shattered the Soviet western defenses, bringing the German forces one step closer to the final battlefield of Operation Barbarossa—Moscow.
legend_intro_10104=The wind and snow howled as Moscow’s winter proved even more severe than in previous years. The long supply lines had severely strained the German army, thereby forcing them to pin their hopes of capturing Moscow on this decisive strike. On November 15, 1941, Panzer Group 3, to which the 7th Panzer Division belonged, began its breakthrough toward Moscow. With rapid offensives and agile maneuvers, they successively captured Klin and Yakhroma, at one point even glimpsing the Kremlin. However, they ultimately faltered under the overwhelming tide of Soviet forces.
legend_intro_10105=In 1943, during the Battle of Kursk, the battle-hardened but understrength 7th Panzer Division serve as a secondary force to cover the main units of the 4th Panzer Army. They were still able to break through Soviet lines on the flank and tie down the Soviet 7th Guards Army, but such efforts could no longer alter the overall tide of the battle. With the main German forces defeated at Prokhorovka, they too had to retreat. The changing battlefield conditions meant they could no longer freely range across the battlefield as they once had.
legend_intro_10106=The Second Battle of Kyiv was the last large-scale maneuver operation carried out by the German 7th Panzer Division on the Eastern Front. Due to the Soviet forces’ overwhelming numerical superiority, the division withdrew from Kyiv and mounted flexible blocking maneuvers along the Fastiv–Zhytomyr line, eventually recapturing Zhytomyr with reinforcements after its temporary loss. Although they could not stem the overall decline of the front, they bought valuable time for the German forces to retreat and reorganize.
legend_intro_20101=The combat history of the U.S. 3rd Armored Division began with the Normandy landings in June 1944. Following the landings, the German-prepared hedgerow obstacles initially hindered this formidable armored force. It wasn’t until Operation Cobra in July 1944 that the U.S. military mobilized thousands of bombers to conduct carpet bombing on German positions. The 3rd Armored Division—known as the “Spearhead Division”—then advanced, exploiting its armored mobility advantage to tear through the disintegrating German defenses, thus achieving an operational-level breakthrough and breaking the stalemate in Normandy.
legend_intro_20102=After the successful breakthrough of Operation Cobra, the 3rd Armored Division was ordered to sweep northward, plunging straight into the Falaise region, forming an encirclement with the Canadian and Polish forces advancing from the north. The encircled German troops launched wave after wave of breakout attempts and assaults in a desperate bid for survival, but they were unable to penetrate the 3rd Armored Division’s lines. This battle nearly annihilated two German armies, and the 3rd Armored Division once again proved itself to be one of the Allies’ sharpest spears in this trial by fire.
legend_intro_20103=In the fall of 1944, the 3rd Armored Division, as the vanguard of the 1st Army, broke through the Siegfried Line with thunderous momentum and reached the outskirts of Aachen. After nearly two weeks of fierce street fighting, Aachen was finally completely captured on October 21. Following a brief respite, the 3rd Armored Division began its assault on the Hürtgen Forest in November. The complex forest terrain limited armored mobility, and many soldiers fell in battle on this battlefield. After enduring brutal urban warfare and the vast dense woods, this unit became not just the spearhead of any offensive, but also a tenacious force able to adapt to a wide range of combat conditions.
legend_intro_20104=On December 16, 1944, the German army launched a surprise counterattack in the Ardennes Forest. The U.S. 3rd Armored Division, as an elite reserve of the 1st Army, was urgently dispatched to the northern front. It quickly coordinated with other units at several key strategic points to launch a counteroffensive, successfully disrupting the German offensive.
legend_intro_20105=In March 1945, the 3rd Armored Division, serving as the vanguard of the 1st Army, launched a full-speed drive eastward from the Remagen bridgehead to encircle the German Ruhr industrial region. On April 1st, our division linked up with American forces from the northern front at Lippstadt, successfully trapping Field Marshal Model’s 320,000 German troops in the “Ruhr Pocket.” After two weeks of mopping-up operations, German resistance collapsed, Model committed suicide, and on the 18th, a large-scale surrender followed. This battle completely crushed the main forces of the German army on the Western Front. The 3rd Armored Division secured victory through high-speed maneuvering but lost its commander, Major General Rose, forever enshrining their profound glory and sacrifice in the annals of victory.
legend_intro_20106=In February 1991, the 3rd Armored Division, serving as the main force of the 7th Army, launched an offensive from northern Saudi Arabia into Iraqi defenses. Leveraging the technological superiority of the M1A1 tanks, the division advanced 260 kilometers day and night, successively defeating the Iraqi 9th Armored Brigade and the Republican Guard’s Tawakalna Division. During the Battle of Norfolk, they destroyed a large number of T-72 tanks at minimal cost. Within a hundred hours, in coordination with allied forces, the division annihilated over ten Iraqi divisions, crushed Saddam’s elite forces, and effectively demonstrated the absolute dominance of modern armored units with nearly zero casualties, reshaping modern ground warfare.
legend_intro_30101=In the autumn of 1942, sailors from the Black Sea Fleet formed the 255th Naval Infantry Brigade and were urgently deployed to aid the Caucasus front. In the forested region near Tuapse, they resolutely held their ground with bayonets, grenades, and Mosin–Nagant rifles, shattering the German “Attika” offensive. Despite lacking heavy weapons, they fought a bloody battle, employing night raids and flanking tactics. On December 13, they were awarded the Order of the Red Banner for having blocked the German path to the Black Sea at the cost of their own blood.
legend_intro_30102=On February 6, 1943, the 255th Naval Infantry Brigade was ordered to conduct an amphibious landing in the Myskhako area near Novorossiysk, seize and hold the landing site later known as “Malaya Zemlya.” In the face of relentless day-and-night bombardment by German aircraft and heavy artillery, our naval and land army brothers dug trenches and held fast on this tiny patch of land, pinning down a large contingent of German forces and thereby laying a crucial foundation for the subsequent liberation of the Caucasus and the Taman Peninsula.
legend_intro_30103=In the early hours of September 10, 1943, the 255th Naval Infantry Brigade mounted a landing assault on the southern side of Novorossiysk port under naval artillery cover. Facing dense German minefields, barbed wire, and coastal artillery fire, they painstakingly captured the beachhead inch by inch, paving the way for subsequent forces. Ultimately, with the coordinated efforts of the 18th Army, they managed to seize the entire city on September 16. This decisive victory laid the foundation for the Soviet forces to capture the Taman Peninsula and bring an end to the Caucasus campaign. The brigade subsequently received the honorary title “Taman Brigade.”
legend_intro_30104=In November 1943, the “Taman Brigade” launched a fierce assault on the Eltigen beachhead on the Kerch Peninsula during a tempestuous night. Braving German searchlights and artillery, they waded through bloodstained waters to seize the landing site, holding it for 36 days and nights. With their ammunition and supplies exhausted, the soldiers repelled dozens of counterattacks with grenades and bayonets, and Sergeant Kostenko gave his life by blocking the muzzle of an enemy gun with his body. Although the battle exacted a heavy toll, it successfully held in check the main German forces, laying the groundwork for the Soviet forces on the northern front to liberate Krym.
legend_intro_30105=In May 1944, the “Taman Brigade,” an elite unit of the Black Sea Fleet operating under the command of the Independent Coastal Army, participated in a retaliatory offensive to liberate Sevastopol. This operation decisively defeated the last German stronghold in Crimea, avenging the humiliation caused by the fall of this strategically vital fortress in 1942.
legend_intro_30106=In August 1944, during the Jassy–Kishinev Offensive, the "Taman Brigade" boldly forced its way across the Dniester Estuary and launched a nighttime assault on the Akkerman (now Bilhorod-Dnistrovskyi) beachhead. Under heavy German coastal defensive fire, they tore through the German lines and coordinated with the 46th Army for a joint offensive. After fierce urban combats, they seized the fortress on August 23, cutting off the German coastal retreat route and taking a large number of prisoners. This operation earned the "Taman Brigade" the Second Class Order of Kutuzov, demonstrating the lethal effectiveness of Soviet naval infantry in amphibious operations.


