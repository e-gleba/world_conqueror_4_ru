event_4118=Operation Kikusui I
event_4119=Battle of Hollandia

event_intro_4114=Due to repeated setbacks faced by the Italian army against the British forces on the North African theatre, the German High Command decided on February 6 to intervene in order to stabilize the situation. In the following months, German troops (later reorganized into the Afrika Korps) arrived in successive waves in North Africa, decisively reversing the Italian retreat. Rommel's decision to launch an offensive achieved great success, but the overstretched supply lines ultimately foreshadowed a prolonged war of attrition.
event_intro_4115=After the Soviet victory in the Battle of Stalingrad, they pressed their advantage. Manstein abandoned frontal defense, first concentrating armored forces to rout the rashly advancing Soviet Southwestern Front, then turned north to retake Kharkov through fierce street fighting. The entire operation began on February 19, 1943. The Soviets suffered heavy casualties but failed to change the overall disadvantage on the Eastern Front. The "Kursk Salient" resulting from this operation directly led to the unprecedentedly large-scale Battle of Kursk a few months later.
event_intro_4116=In March 1941, as the Italo-Greek War reached a stalemate, the Italian dictator Mussolini personally ordered the “Spring Offensive” on March 9 to boost morale and expel Greek forces from the Italian-controlled region of Albania. During this operation, the Italian army fired over 100,000 artillery shells at the front lines, resulting in more than 10,000 casualties, yet failed to achieve any strategic breakthrough. The failure of this offensive directly led to Germany’s forced intervention in the conflict in the Balkans, which fundamentally changed the course of the Italo-Greek War.
event_intro_4117=At the end of March 1941, British intelligence agencies successfully deciphered the Enigma code used by the Italian Navy for the first time, thereby gaining insight into the Italian fleet’s movements. On March 27, using intelligence gleaned from the deciphered code, the Royal Navy carried out an interception near Cape Matapan, sinking several Italian ships and expelling the Italian fleet from the Eastern Mediterranean.
event_intro_4118=During the Battle of Okinawa, to divert Allied naval and air forces and increase the chances of success for kamikaze attacks, the Combined Fleet formed a kamikaze special attack force with the battleship Yamato as its flagship. The plan was for it to break into the waters near Okinawa and, after running aground, serve as a stationary artillery platform to support the defense and carry out a suicide attack. Yamato was eventually sunk during multiple waves of airstrikes by hundreds of U.S. carrier-based aircraft. This battle marked the final destruction of Japan’s primary naval force, leaving the Combined Fleet largely incapable of further operations.
event_intro_4119=To break through the Japanese defenses in New Guinea, the U.S. military launched an amphibious landing operation on April 22, 1944. Through tactical deception and intense naval and air bombardment, the U.S. forces successfully landed and quickly captured the airfields and ports, cutting off Japanese reinforcements and encircling the enemy, effectively trapping them. This operation was a successful example of “island-hopping,” bypassing the main body of Japanese troops in eastern New Guinea, and allowing US forces to achieve strategic objectives at a relatively low cost.



dialogue_4312=Press the attack, for the British forces can no longer swiftly mount an effective counterattack.
dialogue_4313=The Soviet Army’s flanks were already severely overextended. Attack immediately, then cut off their supply lines, and encircle Kharkov.
dialogue_4314=The German offensive is extremely fierce, and our forces can no longer maintain a defense in the direction of Kharkov. Let's retreat east for now.
dialogue_4315=The Japanese fleet is advancing towards Okinawa. Immediately deploy air forces to halt the enemy, and have other vessels ready for maritime interception.
dialogue_4316=The battleship Yamato has been sunk, and the Japanese fleet is in retreat.
dialogue_4317=We have absolute naval and air superiority, and the Japanese defense system is on the verge of collapse. Land immediately.


