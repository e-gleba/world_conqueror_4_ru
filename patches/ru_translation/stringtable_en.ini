dialogue_3536=We will provide ongoing supplies for your forces.
dialogue_3537=Prepare yourselves! The battles ahead will be more brutal than any you've ever faced before.
dialogue_3538=Look familiar? Scenes like these are happening all over the world right now. You could be the next.
dialogue_3539=The enemy is not invincible! Our counteroffensive begins now!
dialogue_3540=The enemy launched simultaneous offensives from all directions, and many cities have already been overrun.
dialogue_3541=I will show everyone that I have both the power and the courage to strive for freedom!
dialogue_3542=Our HQ has received a large amount of intelligence regarding enemy forces and their weapons and equipment. The commanders who provided intelligence will also fight alongside us in subsequent operations.
dialogue_3543=This is all the elite we have. You know what to do.
dialogue_3544=We are utterly unable to hold back the enemy's offensive.
dialogue_3545=Withdraw troops from the bases in the Far East first. Then keep a close watch on the Soviet forces there.
dialogue_3546=According to the intelligence provided by Alfred, the enemy’s defenses in Sumatra are significantly weaker.
dialogue_3547=We will launch a raid here to pin down Osborn.
dialogue_3548=It is extremely suspicious that the British forces would dare to mount an offensive against Singapore with only such a small number of troops.
dialogue_3549=Defend the defense line around the nuclear facility! The Soviet army must not be allowed to occupy it!
dialogue_3550=We will launch an offensive at sea and seal off the enemy’s paths of retreat.
dialogue_3551=Implement the landing operation as soon as possible to eliminate the enemy forces in the south. We will launch a counterattack northward from here.
dialogue_3552=Those who know the times are wise, and those who understand the opportunities are valiant.
dialogue_3553=You have left me with no choice.
dialogue_3554=Attack along the coastline! Coordinate with allied forces to launch a pincer attack and neutralize the coastal defenders.
dialogue_3555=It appears that the enemy navy’s main force is not here. We will eliminate all enemy fleets in this area.
dialogue_3556=I will hold my position until reinforcements arrive.
dialogue_3557=Your victory means nothing. We will come back.
dialogue_3558=The data in the Black Scorpion base has been successfully recovered. But no information on Osborn has been found.
dialogue_3559=Alfred, during the previous battle, you have already proven your worth to us. I am confident you can find a way to completely defeat Osborn.
dialogue_3560=Leave it to me.
dialogue_3561=It's time. Let's get started!
dialogue_3562=The Black Scorpion has long experienced multiple failures—perhaps far more than just two.
dialogue_3563=How come you’re here?
dialogue_3564=In order to witness your end—the very end for which you would not hesitate to sacrifice us all.
dialogue_3565=I will help you achieve your own wishes.
dialogue_3566=I am your other self. See you on the other side.
dialogue_3567=I never doubt my judgment.
dialogue_3568=The enemy’s strength greatly exceeds my estimates.
dialogue_3569=Destiny summons.
dialogue_3570=Our fight is far from over.
dialogue_3571=The operation is terminated. It's time to retreat.
dialogue_3572=Leave it at that.
dialogue_3573=The United States and the Soviet Union maintain their dominance firmly.
dialogue_3574=Intelligence has repeatedly been wrong, and we must make our own judgment about the battlefield situation.
dialogue_3575=Alfred, you’ve successfully brought everything to a close; yet, in fact, you have ended nothing at all.
dialogue_3576=The facilities are now operational, and we’ve been ready to leave for quite some time. Farewell, my other self.
dialogue_3577=Devices here will give you a scan and then create a new version of you only, retaining all your previous characteristics and memories.
dialogue_3578=You are merely a vestige of the old world, and you will vanish here with me.
dialogue_3579=Perhaps you're right, but even in the worst nightmares, I still think I'll stay true to who I am.
dialogue_3580=Maybe we'll see each other again soon.
dialogue_3581=You all can get started now.
dialogue_3582=We feel sorry about this truth.
dialogue_3583=Thoroughly annihilate all remaining enemy forces and recapture the Antarctic base!

