dialogue_2883=Gentlemen, Guam is now defenseless and must be taken as soon as possible!
dialogue_2884=The 4th Panzer Group raids towards Stalingrad and must free the 6th Army!
dialogue_2885=Hold your position and make sure the encirclement is intact!
dialogue_2886=6th Army, seize the opportunity to break out as soon as possible!
dialogue_2887=We've run out of supplies. All troops, on your mark, abandon the breakout and wait for help.
dialogue_2888=Breaking through the enemy lines, the assault on Antwerp through the Ardennes mountains!
dialogue_2889=Hold the line. The Germans must not be allowed to threaten the supply lines!
dialogue_2890=Attention all units. Concentrate on Dinant to hold off the German offensive!
dialogue_2891=Supplies are in place! Soldiers, the time for vengeance has come. Destroy all enemies in the salient!
dialogue_2892=The army is no longer capable of completing the plan. The entire army, retreats and preserves the strength.
dialogue_2893=Bastogne must be taken to guarantee the safe passage of troops through the Ardennes mountains!
dialogue_2894=Hold Bastogne. The 3rd Army will soon reinforce!
dialogue_2895=Launch a quick blitz to relieve Bastogne!
dialogue_2896=Comrades, the enemy is weakened, crush Army Group South and liberate Ukraine!
dialogue_2897=All units must hold until the last moment and never retreat!
dialogue_2898=By order of the Führer, I'm taking over command. All units, secure your defences, alternate retreats, and conserve your strength.
dialogue_2899=General Vatutin will recover from his wounds first. I'll take over. The whole army on my mark, and continue the attack!
dialogue_3100=The German Scharnhorst is out and searching for our convoy. Sink it! The Arctic route will be safe from now on.
dialogue_3101=Comrades, the enemy has brutalized our compatriots and killed our comrades. We must avenge them! All troops attack!
dialogue_3102=The enemy hypocritically beckons us to surrender, but in reality, they want to destroy us completely. Soldiers, hold on to the city, wait for rescue, and victory will surely be ours!
dialogue_3103=Budapest is beyond defense. Break out if you can, or surrender if you can't. The country will remember our sacrifice.
dialogue_3104=The enemy army has moved north! Aim for the weak spot and take Strasbourg!
dialogue_3105=The Alsace region is weak. Our attention should be paid to rigorous defenses. If necessary, the troops can be withdrawn to the Vosges Mountains to reorganize a defensive line.
dialogue_3106=Take Strasbourg and drive the enemy out of the Vosges Mountains!
dialogue_3107=Hold the line. Troops from the Ardennes have set out in support!
dialogue_3108=Aid is coming from the United States, and thousands of soldiers and hundreds of aircraft are being sent. Our troops must hold out until these reinforcements arrive. There can be no more retreat.
dialogue_3109=I escaped, but I shall return!
dialogue_3110=Veterans never die, they just slowly fade away.
dialogue_3111=You may capture me, and Bataan may fall, but the spirit of freedom-loving people all over the world will not be crushed!
dialogue_3112=Philippines, I'm back! Troops disembark and push southeast to liberate Manila!
dialogue_3113=Fight away from the coast to avoid support from enemy ships. If you can't hold them, withdraw to the mountains and fight wars of attrition!
dialogue_3114=Comrades, the people of Leningrad have resisted the siege for more than 800 days. We cannot allow this situation to continue! Attack! Liberate Leningrad!
dialogue_3115=The siege of Leningrad has been lifted. The Germans can't stop the victory of justice! Comrades, continue the pursuit!
dialogue_3116=General Küchler has been relieved of his duties and the army is now under my command. The front-line troops contract your lines and gradually withdraw to the west of Lake Peipsi.
dialogue_3117=Small units drew the enemy's attention from the left, while the main force attacked from the right side of the mountains, using a ‘right hook’ to penetrate the defense line!
dialogue_3118=Relying on the mountains and river valleys to organize the line of defense, no position can be abandoned!
dialogue_3119=Cassino's monastery is probably an enemy observation point. The air force bombardment will be in place immediately. Soldiers, take that position!
dialogue_3120=Soldiers, attack! Take back French territory!
dialogue_3121=The 19th Army withdraws immediately. You cannot be sieged by the enemy.
dialogue_3122=The first priority in this battle was to destroy the enemy. The encirclement was to be completed first from the north and south, and then an attack was to be launched against the enemy within the encirclement.
dialogue_3123=The encirclement has been formed. Comrades, attack! Destroy the enemy in the encirclement!
dialogue_3124=Rapid breakout! Troops outside the encirclement circle attack quickly to assist in the breakout!
dialogue_3125=The salient forces shall quickly withdraw for recuperation, while the other troops stabilize their positions.
dialogue_3126=First crush the enemy in the towns around Oulu, then fight the enemy in the south. Soldiers, fight! For an independent Finland!
dialogue_3127=German support is in place. The enemy is not as well trained as we are. Soldiers, attack!
dialogue_3128=Does the enemy have reinforcements too? Soldiers, cut off the transport lines, delay their reinforcement support, and victory will surely be ours!
dialogue_3129=I will go abroad and continue the struggle until an independent and peaceful Finland is born!
dialogue_3130=You will not be able to win Finland's independence even if you are victorious with the help of Russia!
dialogue_3131=The Japanese defenses are weak, and this battle will show them what the U.S. Navy can do!
dialogue_3132=The ship's planes are out. And the enemies will physically verify the power of the aircraft carrier with their bodies!
dialogue_3133=Attention all units. Enemy support units have arrived. Speed up your operations!
dialogue_3134=Comrades, the enemy is trying to defend the riverbank and resist. Let's use artillery fire to show the enemy why justice will prevail!
dialogue_3135=We are standing on the border of our motherland territory, and any retreat will lead the war to Germany by air and by water. We will never retreat!
dialogue_3136=Comrades, the enemy has once impeded our advance. But this time, they must divide their forces elsewhere. The battle to overcome their defense is at hand!
dialogue_3137=Soldiers, we once held off an enemy attack. This time, we can still do it! For the sake of the motherland!


