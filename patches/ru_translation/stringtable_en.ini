event_108=The Defense of Moscow
event_intro_108=In the autumn of 1941, the German army scored successive victories on the Eastern Front, rapidly closing in on the Soviet capital, Moscow. They sought to end the war with lightning speed and iron might, forcing the Soviet Union to collapse through a decisive victory. However, as the front line extended, supplies became increasingly strained, and the bitter winter was quietly closing in. Facing this imminent crisis head-on, the Soviet Union committed its last forces to Moscow, turning time, winter, and sacrifice into weapons. This offensive, originally intended to be swift, was being drawn into a grueling battle of attrition and will. There was no retreat—only life or death.


