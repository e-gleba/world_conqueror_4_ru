operation_nightmare_rule_1=1. The event campaign is opened for a limited time. Commanders are suggested to schedule time reasonably, in order to obtain rewards by passing stages.
operation_nightmare_rule_2=2. In nightmare difficulty campaign, enemy force will gain 4 buffs (4 random buffs when the event is opened until it ends), so fellow commanders, please plan your marching route cautiously.
operation_nightmare_rule_3=3. In each difficulty, generals eliminated in each stage cannot deploy on the next stage, only by resetting progress can deploy these generals again.
operation_nightmare_rule_4=4. After achieving stage victory, the current difficulty of the highest passing result will be recorded. Passing the specific stage can receive section rewards.
operation_nightmare_rule_5=5. Resetting progress can only reset current difficulty progress.

defensive_nightmare_rule_1=1. The event campaign is opened for a limited time. Commanders are suggested to schedule time reasonably, in order to obtain rewards by passing stages.
defensive_nightmare_rule_2=2. In nightmare difficulty campaign, enemy force will gain 4 buffs (4 random buffs when the event is opened until it ends), so fellow commanders, please plan your marching route cautiously.
defensive_nightmare_rule_3=3. No matter defeat or victory in the stage, the current highest turns of defending will be recorded. Achieving a certain defending turns can claim respective section reward (all phase rewards will be unlocked if every enemy unit is eliminated).
defensive_nightmare_rule_4=4. You can only win by defending all key areas. Stage can be played repeatedly, but quitting during the stage battle will not record current highest defending turns.

