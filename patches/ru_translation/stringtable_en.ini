dialogue_3199=Commence operations! We must secure all of Denmark and occupy strategic Norwegian ports before the British catch on.
dialogue_3600=The fleet is mobilized; the port must be under our control!
dialogue_3601=Denmark has surrendered. All units remain combat-ready and advance into Norway!
dialogue_3602=The British attack was no isolated incident. Hold Narvik at all costs!
dialogue_3603=Stay vigilant, the British won’t tolerate our seizure of ice-free ports. Prepare defenses thoroughly!
dialogue_3604=I have completed all possible preparations, hoping to withstand the enemy’s attack.
dialogue_3605=Our shorter route to Berlin means the glory of capturing it belongs to us!
dialogue_3606=Shortest path, toughest fight. The first to take Berlin might yet be us!
dialogue_3607=My armored division will clear obstacles in the north for the main force.
dialogue_3608=The front has collapsed. My priority is saving lives now.
dialogue_3609=Berlin defenders: The Führer is dead. Cease fire, no more futile sacrifices!
dialogue_3610=Your mission is to escort Colonel Doolittle to the takeoff point. Once the bombers lift off, the fleet will retreat at full speed! Do not engage with the Japanese forces! Don't waste even a second!
dialogue_3611=The fleet has been spotted by the Japanese forces; we must act ahead of schedule! Bomber squadron, attention! Board the planes immediately!
dialogue_3612=The entire Doolittle Squadron has been deployed; retreat immediately!
dialogue_3613=The enemy forces have lost strategic flexibility, and the campaign has entered its final stage. Orders to all units: Reduce the depth of the enemy's defenses; first siege Tunis; then seize Bizerte.
dialogue_3614=On behalf of the Afrika Korps, I surrender to the Allied Forces.
dialogue_3615=There is no need to continue the offensive; on behalf of the Italian 1st Army, I accept your unconditional surrender.
dialogue_3616=We cannot permit the Axis to accumulate strength in the Aegean Sea. Special forces must be deployed to assault the island garrison, and destroy the naval observation posts and radio stations.
dialogue_3617=The Allies have recently mobilized a large-scale operations near the coast of Devon. Dispatch German S-boats conduct armed reconnaissance, bypassing the Channel defenses.
dialogue_3618=The Japanese navy is no longer a threat. Liberate Borneo and recover its airfields and oil fields!
dialogue_3619=Vice Admiral Inoue, these three carrier groups are placed under your command to execute Operation MO! Ensure that the landing forces reach Port Moresby!
dialogue_3620=Intelligence indicates that the Japanese are planning to attack Port Moresby in the near future. Immediately transfer all 4 aircraft carriers that can be mobilized to the Coral Sea, and be sure to thwart the Japanese attempt!
dialogue_3621=According to reconnaissance aircraft intelligence, the main forces of the Japanese attack have been dispatched. Strike and bury your enemies in the Jormard Channel!
dialogue_3622=I will protect Shokaku and Zuikaku, and ensure they utterly crush all invading enemies!
dialogue_3623=Army Group B, orders: Carry out a strategic feint towards the Low Countries to lure the main British and French forces north into Belgium, to create a window of opportunity for Army Group A to engage in a decisive battle!
dialogue_3624=Army Group A, Orders: The Ardennes Forest will be the main axis of attack. Establish an encirclement in Flanders and annihilate the main Allied forces!
dialogue_3625=Armored clusters assault at full speed! Arrive at the Maas River on the third day, and force the Maas River to cross the next day!
dialogue_3626=Troops on the northern front, immediately advance into Belgium and establish a blocking defensive line. Under no circumstances allow the German army to break through!
dialogue_3627=Following Marshal Pétain's orders, France has signed an armistice with Germany. All units are to maintain their current organizational structures and proceed in an orderly fashion to designated areas.
dialogue_3628=The war is not over, and neither is France's resistance! I will go to London to lead the French people to continue the fight!
dialogue_3629=Comrades! Take the Izyum salient and Vovchansk as the offensive axis and take Kharkov!
dialogue_3630=Attention, Southern Army Group: The Soviet army is massing in large numbers on the Kharkov front, which indicates an imminent Soviet attack. Make thorough preparations for defense.
dialogue_3631=Assault Izyum and coordinate with the 1st Armored Army to close the encirclement of Izyum.
dialogue_3632=
dialogue_3633=The 7th Armoured Brigade advanced along the desert flank; the 22nd Guards Brigade spearheaded the attack on Halfaya Pass and Capuzzo; and the Coastal Column captured Sollum.
dialogue_3634=Hold the line and defend Fort Capuzzo at all costs! I will immediately redeploy troops from Tobruk to support!
dialogue_3635=Recapture Fort Capuzzo and the Halfaya Pass; we must ensure the besieging troops are relieved from the threats they continue to face in the rear!
dialogue_3636=Troops near Capuzzo, fall back to the Halfaya Pass; do not engage with German forces.
dialogue_3637=Airborne troops prioritize seizing the target airport and, after occupation, rapidly deploy supplies and reinforcement troops.
dialogue_3638=The Royal Navy has blockaded the surrounding waters, strictly preventing enemy transport ships from landing!
dialogue_3639=The 2nd Armored Division leads the main attack on Boulogne; the 1st and 10th Armored Divisions advance along separate routes to jointly attack Calais! We must quickly capture the Channel ports!
dialogue_3640=To all defenders of Calais: You must hold the city at all costs for 48 hours! Every hour you delay the German forces will buy tens of thousands of our allied forces time to evacuate!
dialogue_3641=The Royal Air Force has deployed, focusing on intercepting the Stuka dive bomber formations to cover the army's withdrawal!
dialogue_3642=Army Groups A and B, resume the offensive, swiftly form a coastal encirclement, and do not let the enemy escape under any circumstances!
dialogue_3643=Belgium has surrendered? Damn it! Immediately shorten the defensive line along the Lys River and fill the gap left by Belgium!
dialogue_3644=Advance rapidly towards Dunkirk; do not allow the enemy to escape!
dialogue_3645=French 1st Army Corps, heed the order: Burn the boats and never retreat! We must defend our homeland!
dialogue_3646=Capture Lille swiftly! Our advance must not be bogged down here!
dialogue_3647=I must break through the encirclement and continue defending our nation on other battlefields!
dialogue_3648=Launch a surprise attack on enemy ports, sever their maritime supply lines, and cripple their strategic logistics capabilities!

