dialogue_4366=Although the German army stands at our gates, they face anything but an empty city. They seek to end the war swiftly, but we will wear them down with our unwavering resolve.
dialogue_4367=The soldiers of Red Square made the enemy understand: every step they took forward, they had to pay the price of bloodshed!
dialogue_4368=The enemy forces have formed a pincer formation from both the north and the south. If they succeed, our defensive line will be cut off. We must hold the line, defeat them in detail, and prevent them from completing their encirclement!
dialogue_4369=The final outer defense has been breached. I can already see the red star on the Kremlin’s rooftop.
dialogue_4370=Utterly unstoppable, nothing can halt the advance of the steel torrent. Roads will be crushed, defenses torn asunder, and no resistance can alter the outcome.
dialogue_4371=General Zhukov has arrived at the front line. All units at the front, maintain your positions and let the enemy exhaust themselves in their attacks. Time is on our side.
dialogue_4372=From a tactical standpoint, the situation seems to be turning in our favor, with Moscow not far ahead.
dialogue_4373=From a realistic standpoint, our armored units are gradually being worn down and temperatures keep dropping. In addition, vehicle start-up and maintenance times have significantly increased, while fuel and ammunition supplies cannot reach us as planned.
dialogue_4374=Without logistical support, there can be no maneuver; without maneuver, armored forces will lose their very reason to exist.
dialogue_4375=Generals Manstein and Rundstedt have been ordered to move in and reinforce the Moscow front. Frontline units must hold their ground, maintain stability, and under no circumstances retreat!
dialogue_4376=Intelligence confirms that Japan will not attack the Soviet Union in the near future. Meanwhile, reinforcements from the Far East are on the verge of arriving on the battlefield!
dialogue_4377=We must acknowledge that the current circumstances are not in our favor, but Moscow remains the only objective of decisive strategic importance. Even if the likelihood of success diminishes, no viable alternative course of action is available.
dialogue_4378=Keep pressing toward Moscow by any means necessary!
dialogue_4379=Have they forgotten Napoleon's lesson? No, they certainly remember. They must have studied, analyzed, and even ridiculed that defeat from back then.
dialogue_4380=It is simply that, just as Napoleon did in his time, they believe they will be the exception to the rule.
dialogue_4381=The enemy troops had no choice but to retreat, but their main forces remained intact. However, this alone was sufficient to demonstrate that the German army was not invincible, and the myth of Blitzkrieg was thus brought to an end.

