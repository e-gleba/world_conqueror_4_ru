skill_info_145=When commanding armored units, for every enemy within 2 hexes, dealt damage +[#00FF00#%d%%] (Maximum 50%%). When armored units have high morale, lower damage received by 20%%
skill_info_146=When commanding armored units, dealt damage to enemy elite force +[#00FF00#%d%%]
skill_info_147=When commanding artillery units, the unit is not affected by skill effect that disable counterattack. When a surrounding friendly unit counterattacks, there is [#00FF00#%d%%] chance to join the counterattack
skill_info_148=When commanding artillery units, dealt damage +[#00FF00#%d%%] to enemies 2 or more hexes away
skill_info_149=Dealt damage of commanded units against land units +[#00FF00#%d%%]. When capturing an enemy city, grant "commendation" to friendly units within 3 hexes and yourself, increasing attack of the unit by 15%%, lasts for 3 turns
