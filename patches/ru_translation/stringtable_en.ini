event_intro_4107=The Soviet forces successfully completed the covert assembly of their main forces by implementing rigorous operational deception, including measures such as moving units at night and constructing dummy positions. On November 19, 1942, the Soviet forces launched a large-scale offensive against Romanian troops on the flanks of the German army, quickly breaking through the defenses. The German forces misjudged the scale and intent of the Soviet attack, allowing Soviet forces from the north and south to link up successfully, ultimately completely encircling the German 6th Army and elements of the 4th Panzer Army. This operation decisively reversed the strategic situation on the Eastern Front.
event_intro_4108=On November 20, 1943, supported by powerful naval and air firepower, the U.S. forces conducted an amphibious landing on Tarawa Atoll. Due to unexpectedly low tides, many units were forced to wade ashore far from the coast. Meanwhile, the Japanese forces had bolstered the island’s defenses in preparation for the amphibious assault, inflicting heavy casualties on the U.S. forces as they landed. After four days of fierce fighting, the U.S. forces annihilated the defenders at a steep cost. This battle offered the U.S. forces invaluable lessons in amphibious warfare, greatly raising the importance of tidal forecasting and hydrographic surveying to new heights.
event_intro_4109=To seize strategic resources in Southeast Asia and break the U.S. economic sanctions and oil embargo, the Japanese Navy launched a surprise attack on the U.S. naval base at Pearl Harbor, Hawaii, on December 7, 1941. The Japanese Navy deployed six aircraft carriers and conducted air raids in two waves, inflicting significant damage on the U.S. Pacific Fleet with minimal losses. Although many aircraft and ships were destroyed, all three American aircraft carriers escaped as they were not in the harbor. The following day, the United States declared war on Japan, thus beginning the Pacific War.
event_intro_4110=After the Italian army invaded Egypt, they halted their advance at Sidi Barrani, focusing instead on constructing fortifications and establishing multiple camps while awaiting further reinforcements. On December 8, 1940, the British forces launched a surprise attack on the Italian camps in the area. Because of the operation’s strict secrecy beforehand, the Italians were caught off guard and responded hastily, resulting in a large number of troops being captured. The success of this engagement exceeded expectations, prompting the British to immediately capitalize on their victory and expand the raid into a strategic counteroffensive known as “Operation Compass.”

dialogue_4146=Under the cover of naval gunfire, go all out to complete the amphibious landing!
dialogue_4147=The tide is lower than expectation. Because the landing craft has a relatively deep draft, we cannot get any closer.
dialogue_4148=The Japanese forces on the island have been split. We hold absolute advantage. Stay alert and wipe out the remaining resistance.
dialogue_4149=The Japanese have launched a fierce counterattack against our landing forces.
dialogue_4150=This time it is not a drill! Strike barracks of the Italian army and catch them off guard!
dialogue_4151=Be mindful of the enemy’s primary direction of attack. The main body of British forces is positioned in the desert to our rear.
dialogue_4152=The enemy is collapsing across the front. Continue the offensive and expand the gains!
dialogue_4153=The Italian army’s key strongholds fell one after another, causing the entire defensive line to begin to falter. The troops were gradually thrown into disarray.


