elite_intro_82=The Phantom Force is an elite force comprised of top soldiers from around the globe, renowned for their silent tactics, advanced phantom technology, and exceptional operational efficiency. They are capable of swiftly and accurately striking enemies in various extreme environments and possess the ability to rapidly deploy and extract through airborne operations. They are also considered as one of the most deadly elite forces in the world.
elite_intro_83=The M1A1 Abrams Main Battle Tank is the primary armored unit of the U.S. military and the world's first tank widely equipped with depleted uranium ammunition and armor. Its 120mm smoothbore gun can fire highly penetrative depleted uranium ammunition, easily destroying enemy heavy armored targets with the ammunition's high density and self-sharpening properties. The M1A1 utilizes depleted uranium composite armor, greatly enhancing its defensive capabilities, and allowing it to maintain excellent survivability against armor-piercing rounds and high-explosive weapons.
elite_intro_84=The B-52 Stratofortress is a U.S. Air Force long-range strategic bomber. With its exceptional range, massive payload capacity, and versatile operational capabilities, the B-52 has been a critical component of global air power since the 1950s. The B-52 is capable of carrying conventional bombs, precision-guided weapon munitions, and nuclear weapons to meet a vast variety of mission requirements. Modern upgrades have kept the B-52 competitive, making it one of the most enduring bomber platforms in military history since the Cold War. Due to its large size and longer takeoff requirements, it is not suitable for carrier-based operations with limited deck space and launch conditions.
elite_intro_85=The AH-64 Apache is the world's most iconic attack helicopter, renowned for its potent firepower, advanced electronic systems, and superb maneuverability. The Apache is equipped with a 30mm chain gun, air-to-ground missiles, and advanced electro-optical and infrared sensors. Its robust defensive systems enable it to operate in high-threat environments, making it a lethal airborne strike force on the battlefield. The Apache's versatility and continual modernization upgrades have solidified its position as one of the core combat platforms in modern army aviation.


