skill_info_176=While on mountainous or desert terrain, you and allies in a 1-tile radius take [#00FF00#%d%%] less damage. When commanding land units, the activation chance of the "Rumor" skill increases by 25%%. At the end of the turn, if there are any enemies within 2 tiles with lowered morale or in chaos, you and the allies in a 1-tile radius recover 10%% of their maximum HP.
skill_info_177=When commanding troops to attack, there is a [#00FF00#%d%%] chance to trigger a Level II satellite strike on the target. When commanding air hover units, the damage dealt by this satellite strike is increased by an extra 30%%.
skill_info_178=Enemy units within 3 tiles of the commanding unit have their defense reduced by [#00FF00#%d%%] and also take 20%% increased damage from nuclear bombs, satellite strikes, and drone tactical explosion.
skill_info_179=When commanding troops to attack and carry out airstrikes, there is a [#00FF00#%d%%] chance of dealing a critical attack.


dialogue_4318=It’s unbelievable that the Italians did indeed manage to persuade the Führer. This time, we must not let the same mistake happen again.
dialogue_4319=The aerial bombardment has ended, and the first contingent of paratroopers is already in position. We wish the operation every success!
dialogue_4320=Enemy attack! Alert all combat-ready units to assume combat readiness. Hold the airport at all costs! Notify the Royal Navy to swiftly reinforce Malta!
dialogue_4321=Royal Navy gunfire support provides covering fire for the landing forces.
dialogue_4322=The second batch of airborne troops is in place to capture Valletta as soon as possible!
dialogue_4323=Valletta has fallen. Now, Malta is ours!
dialogue_4324=Fall back to the northwest corner immediately. The Royal Navy will cover our evacuation!
dialogue_4325=Recapture the airport immediately. We must ensure that our air force can launch unhindered.
dialogue_4326=The southern army is the main force in conquering the enemy, and it is imperative to ensure that the southern army breaks through the enemy’s defensive lines.
dialogue_4327=The enemy attacked from the south as previously assumed, and all units proceeded according to the plan. Relying on their defensive positions, they repelled the enemy attack.
dialogue_4328=They successfully seized the British Army positions, enabling the armored units to advance further.
dialogue_4329=Sir, the frontline troops report that our fuel is no longer sufficient to sustain the offensive.
dialogue_4330=We were so close, but we fell short at the last moment! Order the frontline troops to halt the offensive, hold the line, and await resupply.
dialogue_4331=The enemy’s fuel is nearly exhausted! Now is the time for our counterattack! All army out, and recapture our positions!
dialogue_4332=As Italy’s elite forces, we absolutely must defend this commanding height and must never allow ourselves to become a laughingstock in our allies’ eyes.
dialogue_4333=The heights of Deir el Munassib are crucial for the subsequent operations. Warriors, seize that position!
dialogue_4334=How can the Italians’ firepower be so fierce?! Armored units, move in quickly and provide support! Use artillery fire to suppress their counterattack!
dialogue_4335=The enemy is putting up a tenacious resistance. Use this position as a standpoint, maintain suppressive fire, and continue capturing other positions.
dialogue_4336=In an effort to retake the position, the Lightning Division radioed the rear for support.
dialogue_4337=The position at Deir el Munassib is in danger; armored units are quickly providing support!
dialogue_4338=Rommel was now on sick leave, and this was the best time to raid. Attack, we want to defeat them in this battle!
dialogue_4339=Enemy attack! All units, move to combat readiness now! We must not let the enemy break through our positions!
dialogue_4340=They successfully seized the frontline positions and, relying on the newly seized territory, continued to push forward.
dialogue_4341=Artillery barrage covers the lost positions! As soon as it ends, immediately recapture the positions!
dialogue_4342=The artillery units were rapidly deployed to the battlefield, thereby relieving pressure on the forward positions.
dialogue_4343=Enemy defenses are heavily fortified. Request artillery support!
dialogue_4344=Rommel has returned, and the situation on the northern theatre has eased. Stand firm. A turning point is just around the corner.
dialogue_4345=The enemy is massing its troops, and we must launch a preemptive strike to defend the Mareth Line.
dialogue_4346=Break out from the Mareth Line, destroying as many Allied troops as possible.
dialogue_4347=News came from the intelligence service: the enemy was about to attack. Get ready for battle!
dialogue_4348=Excellent! Hold your ground and create a breach for the friendly forces as much as possible.
dialogue_4349=The southern front’s first line of defense has collapsed. The reserves have stepped in. Under no circumstances can we allow the enemy to break into Medenine.
dialogue_4350=The armored units have taken heavy losses. We must retreat, or else we won't have enough troops to defend the Mareth Line.
dialogue_4351=The front-line troops stabilize your positions. Reserve forces attack and retake Medenine!
dialogue_4352=The British forces have seized the crucial commanding heights of the Enfidaville Line. Retake those commanding heights immediately—under no circumstances can we let this defensive line fall!
dialogue_4353=The enemy has recaptured the Tebourba Heights and requested reinforcements from the rear.
dialogue_4354=That’s great, the reinforcements have finally arrived! Are there any other reinforcements? No? Then I guess it’s just us.
dialogue_4355=The artillery unit aimed at the mountaintop and opened fire, forcing the enemy to abandon the mountaintop position. After the bombardment ended, we shall swiftly retake the heights.
dialogue_4356=The German positions have collapsed. As a result, the defensive pressure on the Tebourba Heights has intensified.
dialogue_4357=We’ve done all we can. Stay strong—perhaps additional reinforcements will arrive soon.
dialogue_4358=Attack! The enemy will have no further reinforcements. Capture the heights, and the Enfidaville Line will be as good as undefended!
dialogue_4359=Warriors, our leader has prepared ample war supplies for us. Under the leader's guidance, we are bound to win this battle!
dialogue_4360=Continue the assault and intensify your firepower! You must capture Hill 731!
dialogue_4361=Damn! Are these Greeks made of iron?! They still launch a counteroffensive despite the intense bombardment!
dialogue_4362=According to intelligence, the Italian fleet has been sighted. Prepare for battle and make every effort to wipe them out in a single decisive strike!
dialogue_4363=We have spotted the British cruiser fleet. Launch the cruisers’ probing attack to lure the enemy closer to our battleships, then destroy them with the battleships’ main guns!
dialogue_4364=Retreat immediately! We must not let our fleet suffer any more losses.

dialogue_4365=Troops from both locations have successfully completed their landings. They are swiftly advancing inland to neutralize the Imperial Japanese Army around the airport.

legend_intro_60101=The 185th Parachute Division was a unit specifically formed by Italy to carry out airborne operations. In its early stages, the division conducted training for Operation C3, a plan to coordinate with German forces in an airborne assault to seize Malta. However, due to the heavy losses suffered during the airborne invasion of Crete, the high command postponed the operation originally scheduled for July 1942. After Tobruk fell on November 11 of that same year, Operation C3 was ultimately canceled. By that time, the 185th Airborne Division had already been transferred to the North African theatre in July and never again had the opportunity to conduct airborne operations.
legend_intro_60102=In July 1942, the 185th Parachute Division was deployed to the North African desert battlefield. These elite troops, originally meant to execute airborne assaults like lightning from the sky, were now tasked with forging their renown amid the endless desert sands. On August 29, this "Lightning Division" fought their first engagement in North Africa. During the Battle of Alam el Halfa, they were responsible for covering the flank of the German armor, capturing several strategic heights and establishing a strong bridgehead within the Allied lines. Later, during the Allied "Operation Beresford," the division successfully repelled the Allied forces’ attempts to reclaim their positions, showcasing their outstanding operational proficiency and combat effectiveness.
legend_intro_60103=On September 29, 1942, in preparation for the upcoming Second Battle of El Alamein, the Allies launched “Operation Braganza,” aiming to seize the positions garrisoned by the 185th Lightning Division. When confronted with the Allies’ armored offensive, the Folgore Division successfully repelled the assault through the use of a well-constructed trench system and flexible and agile tactical deployment, primarily relying on light infantry and limited artillery firepower, thereby showcasing their remarkable defensive fighting prowess.
legend_intro_60104=On October 23, 1942, the Second Battle of El Alamein officially commenced. The 185th Lightning Division was ordered to hold the southern section of the line and faced a fierce offensive launched by the British XIII Corps, which included the renowned "Desert Rats" of the 7th Armoured Division. During four days and three nights of intense defensive combat, the division tenaciously held its ground, forcing Montgomery to abandon his plans for a southern breakthrough and redirect his main offensive. Despite showing remarkable tactical resilience in localized defensive operations, the Lightning Division ultimately had to retreat along with Axis forces as the overall situation rapidly deteriorated, suffering heavy losses in the course of the retreat.
legend_intro_60105=After the Battle of El Alamein, the remnants of the 185th Lightning Division were transferred to the Mareth Line to hold back the Allied advance. To stall the British Eighth Army’s preparations for an assault on the Mareth Line, Axis forces launched Operation Capri in March 1943, striking at British troops gathering in the Medenine area. Due to operational intelligence having been compromised, most of the Axis forces’ attacks failed, undermining the overall operation. Although the Lightning Division achieved a local breakthrough, it was forced to retreat due to a lack of follow-up support.
legend_intro_60106=Towards the end of the Tunisian campaign, Axis forces had withdrawn behind connected defensive lines to make their final stand. On April 20, 1943, the Allied forces captured the Tebourba Heights on the Enfidaville Line. To stabilize the front and delay the Allied advance, the Axis command dispatched the last remaining troops of the 185th Lightning Division to launch a counterattack aimed at retaking the heights and halting the enemy advance. This final paratrooper unit successfully recaptured the Tebourba Heights and held their ground for an entire day in the absence of support, only surrendering when their ammunition ran out. Thus, this elite force, originally intended for airborne assaults, was ultimately lost in a series of ill-fated operations, fading away in the scorching sands of North Africa.

