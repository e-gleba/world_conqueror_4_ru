event_rule=Rules
;集团军模式规则
armygroup_rule=Army Group Event Rules
armygroup_rule_1=1. The event campaign is opened for a limited time. Commanders are suggested to schedule time reasonably, in order to obtain rewards by passing stages.
armygroup_rule_2=2. By completing army group achievements, you can earn achievement points. Once you reach the required point threshold, you can then claim the corresponding stage rewards.
armygroup_rule_3=3. The scale and difficulty of each army group vary, and after clearing the stage, you will then receive the corresponding stage-clear rewards.
armygroup_rule_4=4. In Army Group mode, players need to defeat all the armies of the opposing faction in order to achieve victory. The army group will be defeated only after all buildings have been captured and all units have been eliminated. Upon declaring war against other Army Groups of the same country, you will become hostile with all allied forces.
armygroup_rule_5=5. Each army group has its own unique reinforcement and technology. Once you defeat an enemy army group, you gain access to its reinforcements. Defeating certain army groups unlocks the corresponding military technology.
armygroup_rule_6=6. After destroying enemy units and capturing enemy buildings, you will earn merit value and increase merit points. Spend the corresponding merit points to recruit reinforcements and upgrade troop technology.
armygroup_rule_7=7. Eliminating enemy units and occupying enemy structures will reduce the Loyalty of the corresponding Army Group. When Loyalty drops below 15%, if the player has occupied a certain scale of territories, and all cities of the enemy Army Group have been lost, the surrender function can be activated to force the Army Group to capitulate.

