legend_chapter_5=Leclerc Division

legend_army_5=Leclerc Division

legend_stage_50101=Kufra Raid
legend_stage_50102=Operation Faustschlag
legend_stage_50103=Falaise Pocket
legend_stage_50104=Liberation of Paris
legend_stage_50105=Battle of Dompaire
legend_stage_50106=Strasbourg Dash

legend_intro_50101=The Leclerc Division traces its origins to one man’s unwavering patriotic fervor. In 1940, Leclerc arrived in North Africa and successfully persuaded the governor of Chad to form the “Leclerc Column.” To bolster the Free French Forces, in 1941, Leclerc led his troops across the desert to launch a surprise attack on the Italian-controlled Kufra airfield in Libya. After they seized the airfield, Leclerc and his soldiers swore on the spot to one day raise the French national flag in Strasbourg. This marked the beginning of their legendary journey.
legend_intro_50102=Following a series of military victories by Free France in North Africa, the "Leclerc Column" gained greater prominence. In 1943, the Leclerc Column received reinforcements and joined the British Eighth Army in the Tunisian Campaign. During the Battles of Medenine and the Mareth Line, the column successfully repelled repeated German armored offensives. Later, it advanced with the Allies into Tunisia, thus ending the North African Campaign.
legend_intro_50103=After the North African campaign, the "Leclerc Column" was reorganized into the French 2nd Armored Division, still led by Leclerc and also known as the "Leclerc Division." In 1944, this unit set out for France, embarking on a journey to honor its vow. During the Falaise Pocket, the 2nd Armored Division followed Patton's Third Army to encircle the German forces from the south, nearly destroying the German 9th Panzer Division and other units, laying a solid foundation for the liberation of France.
legend_intro_50104=After the Falaise Pocket, the Leclerc Division had already reached a position quite close to Paris. Eager to liberate the city as soon as possible, Leclerc resolutely requested permission from the Allied high command to advance on Paris, which was granted after political negotiations. Leclerc immediately moved toward Paris, where an uprising had already begun. On August 24, with the cooperation of insurgents inside the city, the "Leclerc Division" entered Paris. Under Allied pressure, the German garrison stationed in Paris surrendered on August 25. From that day onward, the flag of freedom once again flew over Paris.
legend_intro_50105=After the recapture of Paris, the French 2nd Armored Division under Leclerc was assigned to join the operation to recapture the Alsace-Lorraine region. In early September, the inexperienced German 112th Panzer Brigade was caught in a series of ambushes launched by the French 2nd Armored Division, which was supported by American air power. Working in coordination with American bombers, the French 2nd Armored Division destroyed most of the German brigade with minimal Allied casualties. The German forces were forced to retreat, delaying their originally planned counteroffensive in Lorraine.
legend_intro_50106=On November 22, with the approval of the Allied High Command, the French 2nd Armored Division, along with the French 1st Army, launched an offensive against Strasbourg. The 2nd Division forcibly broke through the Saverne Gap and boldly advanced, shattering the German defenses in northern Alsace. On November 23, 1944, they liberated Strasbourg, thus fulfilling the “Kufra Oath.”

synergy_tactics_5_1=• After all “Leclerc Division” units launch an attack, they grant the “Restoration Oath” to all “Leclerc Division” units within a two-tile radius for one turn. Restoration Oath: They cannot be Confused.
synergy_tactics_5_2=• Combat Inspiration: When a Leclerc Division armored unit destroys an enemy unit while under the "Restoration Oath" effect, the morale of Leclerc Division units in a two-tile radius around increases by 1 level. This effect can occur 1 time per unit 1 turn.
synergy_tactics_5_3=• Coordinated Support: When Leclerc Division artillery units are under the Restoration Oath status, and attack a city or fortress, if there is a Leclerc Division infantry or armored unit within one hex of the target, increase their dealt damage by 10%.
synergy_tactics_5_4=• Supporting Pursuit: When "Leclerc Division" infantry units attack while under the "Restoration Oath" status, "Leclerc Division" units within 2 tiles gain +5 mobility for this turn.

dialogue_4204=The French mainland has already fallen under German occupation; one day, we shall restore freedom to our homeland.
dialogue_4205=Italy has a military airfield in Kufra, and we need to capture it. Prove to the world France's unyielding spirit.
dialogue_4206=The Italian troops are steadfastly defending the fortress and attempting to contact reinforcements.
dialogue_4207=The enemy has consolidated their forces in the fortress. Keep up the pressure and prevent them from calling in reinforcements.
dialogue_4208=The Italian forces ceased resistance and negotiated a surrender with the French forces. Afterwards, Leclerc swore the "Kufra Oath" at Kufra.
dialogue_4209=I solemnly swear: Only on the day our beautiful flag—our flag—flies above the Strasbourg Cathedral shall we lay down our arms.
dialogue_4210=We have received news that the German 9th Panzer Division will attack tomorrow through Ksar Ghirane. I suggest your forces retreat 80 kilometers to avoid the attack.
dialogue_4211=No, retreating now is out of the question—it would leave us vulnerable to pursuit. Our troops will hold our current positions for defense, but we need air support.
dialogue_4212=Pursue! Don’t let them escape easily!
dialogue_4213=It's time. Let them get within effective firing range before launching the attack.
dialogue_4214=Good job! A unit of troops will be passing through soon. Cover their flanks and join them in attacking the Tebaga Gap.
dialogue_4215=Has the Tebaga Gap fallen? Retreat immediately. We must not allow ourselves to be surrounded by the enemy.
dialogue_4216=Advance northward to Argentan, join forces with the Canadian troops, and encircle the German forces in a pocket!
dialogue_4217=Forward! Liberate more of our land!
dialogue_4218=Deploy the 352nd Infantry Division to Alençon. Prevent the Allies from advancing any further.
dialogue_4219=Alençon was successfully captured, and an important German supply base was subsequently seized. As a result, the Germans abandoned their counteroffensive plans and thus switched to a defensive posture.
dialogue_4220=Deploy the 116th Panzer Division to Argentan and protect our line of retreat.
dialogue_4221=The 1st Polish Armored Division successfully secured a position on Mont Ormel Ridge, blocking the last German route of retreat.
dialogue_4222=I have taken command. Army Group B now listens to the order: Abandon your positions and withdraw east. Reinforcements will provide full support.
dialogue_4223=After persistent lobbying by the French forces, the Allies eventually agreed to allow the French 2nd Armored Division and the U.S. 4th Infantry Division to operate together to support the Paris insurgents and prevent another tragedy like the one in Warsaw from happening again.
dialogue_4224=Don’t wait for the U.S. forces any longer. Move in immediately! The rebels in Paris have already begun to act, and we cannot leave them without support!
dialogue_4225=The Leclerc Armored Division arrived at the outskirts of Paris and made contact with the Parisian resistance fighters.
dialogue_4226=Defeat the suburban defenses and demonstrate to the Germans! Tell the people of Paris that we are here! Paris will regain its freedom!
dialogue_4227=The 4th Infantry Division swiftly advanced on Paris, ensuring the French did not claim all the acclaim.
dialogue_4228=The German garrison received strict orders from headquarters to defend Paris at all costs. Paris must never be allowed to fall into enemy hands unless it has first been reduced to a heap of ruins.
dialogue_4229=This is going to sacrifice us! Stall that madman. Call back headquarters: we will comply.
dialogue_4230=We want to negotiate the terms of surrender with the Allied Forces. We must not throw our lives away for others!
dialogue_4231=The German garrison in Paris eventually negotiated its surrender with the Allies, bringing an end to the fighting within the city. However, the German garrison stationed in the suburbs was unaware of the negotiated surrender and continued fighting the Allies.
dialogue_4232=Paris was humiliated! Paris was brutally ravaged! Paris was tormented! But at last, Paris is free!
dialogue_4233=We’ve received intelligence that the enemy has deployed an elite armored brigade to support the enemy forces at Mirecourt. We must move out at once for Dompaire to intercept the enemy reinforcements.
dialogue_4234=The situation in Mirecourt is dire; we must urgently reinforce the front lines.
dialogue_4235=The German forces led by Vitale are coming to stop us, and we must deal with them swiftly. Otherwise, once reinforcements arrive, we will be at a disadvantage.
dialogue_4236=The German forces led by Vittel are coming to stop us, and we must deal with them swiftly. Otherwise, once reinforcements arrive, we will be at a disadvantage.
dialogue_4237=We arrived too late, so we must quickly support Mirecourt to prevent the US forces from being caught in a pincer attack from both within and without.
dialogue_4238=Now, fire!
dialogue_4239=Take cover, fight back freely!
dialogue_4240=We are already surrounded. Abandon the tanks and retreat at once!
dialogue_4241=Continued the offensive to eliminate the Germans on the west bank of the Moselle.
dialogue_4242=Strasbourg is within sight, and the oath is about to be fulfilled. Warriors, fight on! Long live France!
dialogue_4243=The Vosges Mountains are under heavy guard, and we need to find an unguarded route to break through to the rear lines.
dialogue_4244=Withdraw into the Vosges Mountains. They will not pass!
dialogue_4245=How on earth did they manage to get through the Vosges Mountains?!
dialogue_4246=Leave the toughest challenges to the U.S. forces, then push on to Strasbourg at full speed!
dialogue_4247=Telegram to Strasbourg: The Vosges Mountains have been breached—prepare defenses at once!
dialogue_4248=Strasbourg is free! We have kept our oath!
dialogue_4249=Seize the surrounding strongholds, and Strasbourg must not fall!
dialogue_4250=Keep up the pressure on the Vosges Mountains and do not allow the German forces to support their rear lines.
dialogue_4251=The Italian reinforcement troops mobilized.
dialogue_4252=The atmosphere over there at Ksar Ghirane is definitely tense. That dear old Leclerc—he truly was a good man. But now everything is over, and we will never see him again.
dialogue_4296=The enemy has seized complete air superiority. This position is untenable. Withdraw immediately.
dialogue_4297=The Italian garrison has given up calling for reinforcements and now clings to the fortress.
dialogue_4298=Raise the firepower and crush their will to resist!
dialogue_4299=The German garrison in Paris surrendered to the Allied forces, and the city was liberated; however, German troops in the suburbs, having not received the news, were still engaged in combat with the Allies.



