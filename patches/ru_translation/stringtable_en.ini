dialogue_4000=By quickly bypassing Arras, we must seize the bridges over the Scarpe River as soon as possible. The 5th Armored Division has already received orders and will soon arrive to provide support.
dialogue_4001=At this time, the French and British armies respectively received orders to prepare to launch a counteroffensive at Arras.
dialogue_4002=Contact the 25th Panzer Regiment. I need them to halt their free search operations and coordinate their operations with the division.
dialogue_4003=Click the "Legion Formation" button.
dialogue_4004=Click on the legion you want to form.
dialogue_4005=Click the unit that needs to be included.
dialogue_4006=Click the "Confirm Formation" button.
dialogue_4007=The 25th Panzer Regiment, listen, you are hereby ordered to advance with caution, preserve your strength, and coordinate with the main infantry force to capture and secure the bridge.
dialogue_4008=Damn it! The enemy tank’s armor is too thick! Notify the front lines immediately! Flatten the 88mm gun and use it as an anti-tank weapon!
dialogue_4009=A direct frontal strike? That will cost. Yet sometimes, the most direct route can throw off all of the enemy’s schemes!
dialogue_4010=The French forces advanced to protect the British army’s right flank, but due to a communication breakdown, they also mistakenly identified the British army as the enemy.
dialogue_4011=After the confrontation, both sides have confirmed that they are friendly forces, and the French army continues to advance.
dialogue_4012=Alert the Air Force. The enemy offensive is extremely intense, and our unit requires airstrike support.
dialogue_4013=The enemy is retreating. All units, pursue! Seize Arras!
dialogue_4014=Swiftly advance along the bank of the Nemunas River and capture Alytus.
dialogue_4015=Excellent! Defend the bridge in Alytus, and under no circumstances let the Soviet Army retake it!
dialogue_4016=Meanwhile, the Soviet 5th Panzer Division is swiftly moving to reinforce Alytus. Its first advance guard is about to arrive.
dialogue_4017=The main force of the Soviet 5th Panzer Division arrived in Alytus.
dialogue_4018=I am fully aware of the situation in Alytus. I have also informed the airstrike support from the Air Force. Your unit must hold Alytus at all costs!
dialogue_4019=Air force reconnaissance indicates substantial reinforcements in Alytus. The main priority is to attack the bridges in the upper reaches of the Nemunas River, compelling the enemy to divide units to support.
dialogue_4020=Worthy of being the "Ghost Division"! Soviet reinforcements have been defeated. Notify other troops, attack with all their might, and occupy the towns west of the Nemunas River!
dialogue_4021=Order the 3rd and Panzer Group 4 to break through the Soviet defenses in a frontal assault and complete the encirclement from the rear of Vyazma.
dialogue_4022=Break through from the combined troop between the 19th Army and the 30th Army, then link up with Panzer Group 4 in the rear of Vyazma.
dialogue_4023=Deploy the tank units of the 19th, 30th, and 49th Armies to encircle the enemy forces. Prevent them from making any further breakthroughs!
dialogue_4024=Inform the frontline troops to withdraw from their positions and retreat immediately to avoid enemy encirclement.
dialogue_4025=Panzer Group 4 repelled the Soviet Reserve Front under the command of Budyonny and prepared to advance on Vyazma.
dialogue_4026=The successful link-up with Panzer Group 4 thereby formed the encirclement at Vyazma.
dialogue_4027=Break through to the east with all our might; we must not let the German forces capture us!
dialogue_4028=This is the closest we have come to victory. Do not think about anything else; you have only one task: capture Yakhroma and advance into Moscow from the north!
dialogue_4029=Soldiers! The war has reached its decisive point. We must win—victory is our only choice!
dialogue_4030=In Siberia, the snow-laden wind howls. The harsh weather severely impacted the German forces’ field of vision and combat effectiveness.
dialogue_4031=The capture of Klin by the 7th Panzer Division has further constricted Moscow’s northern defensive perimeter.
dialogue_4032=Notify Rokossovsky: At all costs, the 16th Army must intercept the enemy forces heading towards Klin! They must not be allowed to break into Moscow!
dialogue_4033=After Yakhroma was defeated, the German forces set the stage for the large-scale encirclement of Moscow from the north.
dialogue_4034=The 1st Shock Army must hold the defensive line at all costs—absolutely must not let the German Army break through Krasnoarmeysk!
dialogue_4035=The silhouette of the Kremlin is barely visible, but Panzer Group 3's fuel and ammunition have been all but exhausted. The possibility of breaking into Moscow is left to the miracles.
dialogue_4036=Unbelievable! The 7th Panzer Division has stormed into the city of Moscow. But this also triggered the fiercest resistance from within the city.
dialogue_4037=The Moscow City Defense Army is in place and has destroyed all enemies who set foot in Moscow. The glorious time has come! We are Moscow!
dialogue_4038=Attention, Army Group South: With the 4th Panzer Army as the main force and the Army Detachment Kempf covering the flanks, destroy the 6th Guards Army.
dialogue_4039=The 7th Panzer Division, under Army Detachment Kempf, has also received orders to prepare for an offensive to the east of Belgorod.
dialogue_4040=The 7th Panzer Division has successfully forced a crossing of the Severskiy Donets and established a bridgehead along the 7th Guards Army’s defensive line.
dialogue_4041=Notify the 7th Guards Army: Pin down the enemy and do not let them reinforce their main force in any possible way.
dialogue_4042=Having expanded further, the bridgehead can now provide cover for the main body of troops.
dialogue_4043=Send a telegram to the Chief of the General Staff: The enemy is about to launch an offensive against Prokhorovka. Request tank reinforcements.
dialogue_4044=The 5th Guards Army has been deployed to provide support. Your unit is strictly ordered to stop the enemy from continuing their breakthrough at all costs!
dialogue_4045=Where on earth did the Soviet army get so many tanks? Retreat! Don’t let all our troops get trapped!
dialogue_4046=After suppressing with the artillery, the whole army attacks. Today, we want to take Kyiv!
dialogue_4047=We can no longer hold Kyiv. The 7th Panzer Division must swiftly reinforce Fastiv. We must not allow the enemy to cut off our retreat route.
dialogue_4048=All troops, withdraw to Fastiv and establish a defensive line to halt the enemy’s advance.
dialogue_4049=All troops are withdrawing to Bila Tserkva.
dialogue_4050=A telegram to Berlin: We have lost Kyiv.
dialogue_4051=Swiftly return to reinforce Zhytomyr and ensure the railway hub does not fall into enemy hands.
dialogue_4052=The 48th Panzer Corps launched a northward offensive from Fastiv; we must form an encirclement at Zhytomyr to halt the Soviet forces’ further advance.
dialogue_4053=Break through quickly. All units, hold the front line. Do not underestimate the enemy or push forward rashly!
dialogue_4054=The Air Force carpet bombing is about to be in place, and after the bombing, it will directly break through the enemy defense line!
dialogue_4055=The bombing has ended—advance!
dialogue_4056=The reserves must push forward to fill the breach; we must not allow them to break through the defensive line.
dialogue_4057=The 3rd Panzer Division successfully broke through the defensive lines, forcing the Germans to shorten their own lines.
dialogue_4058=Redeploy the 2nd Panzer Division and the 116th Division as reinforcements. We must prevent the enemy from making further advances.
dialogue_4059=Proceed step by step and tighten the net. Do not let the enemy break out of the encirclement.
dialogue_4060=Withdraw east in an orderly manner. Do not let them complete their encirclement.
dialogue_4061=I have done all I can, and now it is high time to end this war. If it continues any longer, it will only spell disaster for Germany.
dialogue_4062=A bomb assassination attempt has taken place. Kluge was relieved of duty, and Model assumed command.
dialogue_4063=Launch an all-out offensive on the enemy’s encirclement to open a path for the besieged troops to escape.
dialogue_4064=With the encirclement established, the trapped German troops mounted a last-ditch breakout attempt.
dialogue_4065=Aachen is of great political significance. Capture it, and the enemy’s morale will be blown greatly.
dialogue_4066=We’ve secured Aachen! Take a short rest and launch an offensive on the Hürtgen Forest.
dialogue_4067=Notify the rear to recruit more line-filling troops, and we must hold back the enemy in the Hürtgen Forest
dialogue_4068=The Hürtgen Forest’s complex, rugged terrain severely weakened the 3rd Panzer Division.
dialogue_4069=Hold the fortress! The SS is on its way to reinforce.
dialogue_4070=This is a critical battle that will decide the nation’s fate. Only victory is permitted; defeat is not an option!
dialogue_4071=The entire army launches an offensive, pushing through the Ardenne region to seize Antwerp!
dialogue_4072=Armored units swiftly advanced to the Ardenne Forest to provide support, halting the enemy’s advance.
dialogue_4073=Now that the northern and southern fronts are blocked, with troops massing in the center, it is imperative to break out through the Ardenne forest.
dialogue_4074=Seize Bastogne. We must not let that city stand in the way of our advance.
dialogue_4075=The 101st Airborne Division has refused to surrender and continues to defend Bastogne.
dialogue_4076=Immediately reinforce Bastogne; under no circumstances allow the Germans to control the critical transportation hub.
dialogue_4077=With Bastogne lost, German support units can now move quickly, further intensifying the German offensive.
dialogue_4078=After breaking through the Rhine defensive line, the 1st Army has proceeded from the south to seal off the Ruhr industrial region.
dialogue_4079=The 3rd Panzer Division was ordered to advance swiftly on Lippstadt and link up with units of the 9th Army.
dialogue_4080=Broadcast to the encircled troops: Lay down your arms and surrender. The Allies will guarantee the rights of prisoners of war.
dialogue_4081=As the Marshal of the Reich, I cannot authorize a surrender; however, I will do my utmost to preserve a chance for the soldiers to escape.
dialogue_4082=Issue my orders: Army Group B is to be disbanded. All combat units are to either break out of the encirclement in an organized formation or lay down their arms and return home.
dialogue_4083=At least I fought until my last breath.
dialogue_4084=The commander of the 3rd Panzer Division fell in battle, but his valiant fighting spirit has inspired the troops to fight on.
dialogue_4085=Refusing to surrender, Model shot himself.
dialogue_4086=On February 24, 1991, Operation Desert Storm began. As one of the principal U.S. Army units, the 3rd Armored Division launched an offensive against Iraq.
dialogue_4087=Kuwait was captured; as a result, the United Nations forces saw their momentum surge.
dialogue_4088=The U.S. military activated its electronic jamming system, failing the Iraqi Army’s electronic communications systems.
dialogue_4089=Most of the Iraqi army was destroyed, and the coalition forces achieved an overwhelming victory. The Iraqi government formally requested surrender.
dialogue_4090=The 255th Marine Infantry Brigade is dispatched to the junction of the 56th and 18th Armies to halt the advance of the German Army.
dialogue_4091=The German Army launched Operation Attica in order to capture Tuapse.
dialogue_4092=German vanguard troops have reached the outskirts of Tuapse. Please return for reinforcements immediately.
dialogue_4093=Tuapse has been seized by German forces, and the Soviet Army massed its forces to besiege the German garrison.
dialogue_4094=After recapturing Tuapse, the Soviet army seized the momentum and launched a counteroffensive against German forces.
dialogue_4095=The 255th Marine Infantry Brigade successfully established a bridgehead. The Soviet Army quickly deployed significant reinforcements.
dialogue_4096=The defenders of Novorossiysk have been mobilized to prevent the Soviet army from further expanding the bridgehead.
dialogue_4097=The Soviet forces' offensive reached its culminating point, and they prepared to fortify the bridgehead to serve as a staging point for their next operation.
dialogue_4098=To eliminate the enemy’s bridgehead, the German forces increased their attacking forces.
dialogue_4099=The bridgehead was being suppressed. A political commissar arrived alongside the incoming supplies, inspiring the soldiers to hold on to Malaya Zemlya.
dialogue_4100=The 255th Naval Infantry Brigade was ordered to land at the port of Novorossiysk, with the objective of breaching the enemy lines from the inland side.
dialogue_4101=The troops successfully broke through the outer defenses and subsequently engaged in the urban combat phase with German forces.
dialogue_4102=The outer fortifications of Novorossiysk were captured, and the Soviet army gradually gained control of this city.
dialogue_4103=The successful liberation of Novorossiysk led the German troops to retreat to the northwest, and the Soviet forces seized the momentum to pursue them.
dialogue_4104=The 18th Army successfully broke through the defensive line on the northern side of Novorossiysk, establishing a northern encirclement.
dialogue_4105=The 18th Army’s landing forces successfully broke through the naval blockade and landed at Eltigen. The Axis forces immediately massed their troops to launch a counterattack.
dialogue_4106=The Eltigen salient successfully tied down the main German forces. The 56th Army’s landing forces seized the momentum and launched an assault, carrying out a landing operation in northeastern Kerch.
dialogue_4107=During the onslaught from the enemy’s coastal defense forces, which unleashed intense firepower, Sergeant Kostenko made the sacrifice for his country.
dialogue_4108=The northern Kerch bridgehead is being fortified, while German forces are mounting an all-out offensive against Eltigen.
dialogue_4109=In a swift maneuver, Soviet forces employed an unexpected tactic to launch a surprise attack on Kerch, prompting Axis troops to hastily provide reinforcements.
dialogue_4110=With the successful capture of Balaklava, the 49th Mountain Corps in the Sapun Heights was encircled.
dialogue_4111=The 49th Mountain Corps stationed at the Sapun Ridge was repulsed by Soviet forces and consequently withdrew to the Sevastopol defensive line.
dialogue_4112=The Mackenzie Heights have been captured. The enemy’s northern defensive line has collapsed.
dialogue_4113=With the liberation of Sevastopol, the German forces were forced to retreat westward and prepare to evacuate by sea.
dialogue_4114=The Romanian fleet was driven back, and the morale of the withdrawing troops crumbled.
dialogue_4115=The Soviet Army completed its blockade of Sevastopol. The besieged Axis troops, trapped inside the city, were determined to defend to the last man.
dialogue_4116=The 255th Naval Infantry Brigade was ordered to cross the Dniester Estuary under the cover of darkness to establish a bridgehead for the 46th Army’s main forces.
dialogue_4117=The Axis coastal defense forces detected the landing forces, and a beach assault was on the verge of erupting.
dialogue_4118=Successfully established the northern tidal-flat position. Neutralize Akkerman, thereby clearing the position for the main forces.
dialogue_4119=The city of Akkerman was liberated, and the enemy forces were forced to abandon their defenses at the river mouth.
dialogue_4120=On the northern front, the Soviet 37th Army achieved a major breakthrough. The enemy forces have begun retreating to avoid encirclement.

