---
name: Bug Report
description: Report a build failure, broken APK, crash, or wrong in-game behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Fill every section so the bug can be reproduced fast.
  - type: input
    id: stage
    attributes:
      label: Pipeline stage
      description: Where it fails — CMake target, script, or in-game
      placeholder: "e.g. decompile, sync, build, deploy, wc4_crypt.py, in-game"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host OS and version
      placeholder: "e.g. Ubuntu 24.04, Fedora 40"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Tool versions
      description: Output of `cmake --version`, `python3 --version`, `java -version`
      placeholder: "CMake 4.2.0, Python 3.12.3, OpenJDK 21"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal commands from clean clone to failure
      placeholder: |
        1. git clone ...
        2. cmake --preset default -Dapk_input=wc4.apk
        3. cmake --build build --target decompile
        4. Error occurs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      description: Paste full terminal output or logcat. No screenshots of text.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-report checks
      options:
        - label: I searched existing issues (open + closed)
          required: true
        - label: I tested on latest `main` branch
          required: true
        - label: I verified the base APK is unmodified (build failures only)
          required: false
