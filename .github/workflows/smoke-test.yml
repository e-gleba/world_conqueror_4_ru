name: smoke-test

on:
  workflow_dispatch:
    inputs:
      apk_artifact_name:
        description: 'Artifact name to test (taken from the latest successful ci run on this branch)'
        required: false
        type: string
        default: 'wc4_wc4-aligned-debugSigned'
  workflow_call:
    inputs:
      apk_artifact_name:
        description: 'Artifact name to test'
        required: false
        type: string
        default: 'wc4_wc4-aligned-debugSigned'
      source_run_id:
        description: 'Run ID with the APK artifacts — callers pass github.run_id'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  emulator:
    # GitHub-hosted. Was [self-hosted, waydroid]: with that runner offline
    # the job queued forever and blocked release.yml's publish job. API 31
    # x86_64 google_apis translates the game's ARM-native libs (ARM
    # translation ships in API 30+ emulator images) and predates API 34's
    # low-targetSdk install block.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The smoke logic lives in scripts/smoke_test.sh —
      # android-emulator-runner executes each `script` line as a separate
      # `sh -c` process, so anything beyond one line must be a file.
      # Checkout first: it must not wipe the downloaded apks/ afterwards.
      - uses: actions/checkout@v7

      # Called from ci.yml / release.yml, the artifacts live in the
      # caller's run — passed in explicitly via source_run_id. (Reusable
      # workflows inherit the CALLER'S event_name — pull_request, push,
      # ... — so event_name cannot detect a reusable call.) Dispatched
      # standalone, take the latest successful ci run on this branch: no
      # run IDs to paste, and a green-only source can never be mid-build.
      - name: Resolve artifact source run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ inputs.source_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&branch=${{ github.ref_name }}&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::no successful ci run on '${{ github.ref_name }}' to take artifacts from"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Artifacts in run $RUN_ID:"
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | "- \(.name) (expired: \(.expired))"'

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.src.outputs.run_id }}
          name: ${{ inputs.apk_artifact_name }}
          path: apks

      # The runner user is not in the kvm group by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # One line only — see the checkout comment. The emulator is killed
      # when the script ends, so all adb work happens inside it. The
      # app-scoped logcat is printed to stdout by the script itself.
      - name: Boot emulator, install APK, 10-second crash watch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          script: cd "$GITHUB_WORKSPACE" && bash scripts/smoke_test.sh
