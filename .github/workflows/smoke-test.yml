name: smoke-test

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'GitHub Actions run ID containing APK artifacts'
        required: true
        type: string
      apk_artifact_name:
        description: 'Artifact name to test'
        required: true
        type: choice
        options:
          - wc4_ru-aligned-debugSigned
          - wc4_ru_mod-aligned-debugSigned
        default: 'wc4_ru_mod-aligned-debugSigned'

jobs:
  waydroid:
    runs-on: [self-hosted, waydroid]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            CMakeLists.txt
            CMakePresets.json
          sparse-checkout-cone-mode: false

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.apk_artifact_name }}
          path: build/

      - name: Run CMake smoke_test target
        run: |
          cmake --preset ci
          cmake --build build --target smoke_test

      - name: Upload logcat
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: waydroid-logcat-${{ inputs.apk_artifact_name }}-${{ github.run_id }}
          path: build/smoke_test.log
          retention-days: 14
