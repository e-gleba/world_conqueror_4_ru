name: smoke-test

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'GitHub Actions run ID containing APK artifacts'
        required: true
        type: string
      apk_artifact_name:
        description: 'Artifact to test (wc4-ru-localized, wc4-ru-money, wc4-ru-unlock_all)'
        required: true
        type: string
        default: 'wc4-ru-unlock_all'

jobs:
  waydroid:
    runs-on: [self-hosted, waydroid]
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.apk_artifact_name }}
          path: apks

      - name: Ensure Waydroid session
        run: |
          waydroid session start &
          sleep 5

      - name: Install APK
        run: |
          APK=$(ls apks/*.apk | head -1)
          echo "Installing: $APK"
          waydroid app remove com.easytech.wc4 || true
          waydroid app install "$APK"

      - name: Launch & 10-second crash watch
        run: |
          adb logcat -c || true
          adb shell am start -n com.easytech.wc4/android.app.NativeActivity || \
          adb shell am start -n com.easytech.wc4/com.easytech.wc4.android.WC4Activity || true
          echo "⏳ Watching logcat for 10 seconds..."
          sleep 10
          adb logcat -d -s AndroidRuntime:E DEBUG:E AndroidRuntime:D '*:S' > crash.log || true

      - name: Analyze logcat for crashes
        run: |
          if grep -iE "fatal|crash|exception|kill.*wc4|native.*crash" crash.log; then
            echo "❌ Crash or fatal exception detected in 10s window."
            cat crash.log
            exit 1
          else
            echo "✅ No crash detected in 10s window."
          fi

      - name: Upload logcat
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: waydroid-logcat-${{ inputs.apk_artifact_name }}-${{ github.run_id }}
          path: crash.log
          retention-days: 14
