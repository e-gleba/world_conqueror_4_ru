name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.24.2_ru3)'
        required: true
        type: string

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/build-env

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare builder image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || \
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Download base APK from first release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base-apk
          gh release download v1.24.2_ru \
            --repo ${{ github.repository }} \
            -p 'original.apk' \
            -D base-apk \
            --skip-existing || \
          gh release download v1.24.2_ru \
            --repo ${{ github.repository }} \
            -p '*.apk' \
            -D base-apk \
            --skip-existing
          ls -la base-apk/

      - name: Build APKs in container
        run: |
          BASE_APK=$(ls base-apk/*.apk | head -1)
          echo "Using base APK: $BASE_APK"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "
              cmake --preset default \
                -Dapk_input=/workspace/$BASE_APK \
                -Dapk_pkg=com.easytech.wc4 && \
              cmake --build build --target build
            "

      - name: Stage release assets
        run: |
          cp build/wc4_ru-aligned-debugSigned.apk     wc4_ru.apk
          cp build/wc4_ru_mod-aligned-debugSigned.apk wc4_ru_mod.apk
          ls -la *.apk

      - name: Create tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}
          gh release create ${{ inputs.version }} \
            --generate-notes \
            --title "${{ inputs.version }}" \
            wc4_ru.apk wc4_ru_mod.apk
