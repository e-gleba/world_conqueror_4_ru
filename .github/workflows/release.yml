name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.24.2_ru3)'
        required: true
        type: string

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/build-env
  BASE_RELEASE: v1.24.2_ru

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare builder image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || \
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Download base APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base-apk
          gh release download ${{ env.BASE_RELEASE }} \
            --repo ${{ github.repository }} \
            -p 'original.apk' \
            -D base-apk \
            --skip-existing || \
          gh release download ${{ env.BASE_RELEASE }} \
            --repo ${{ github.repository }} \
            -p '*.apk' \
            -D base-apk \
            --skip-existing
          ls -la base-apk/

      - name: Cache decompiled source & tools
        uses: actions/cache@v5
        with:
          path: |
            decompiled
            build/tools
          key: wc4-build-${{ env.BASE_RELEASE }}-${{ hashFiles('CMakeLists.txt', 'diff/**', 'diff_mod/**') }}
          restore-keys: |
            wc4-build-${{ env.BASE_RELEASE }}-

      - name: Build APKs in container
        run: |
          BASE_APK=$(ls base-apk/*.apk | head -1)
          echo "Using base APK: $BASE_APK"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "
              cmake --preset default \
                -Dapk_input=/workspace/$BASE_APK && \
              cmake --build build --target decompile && \
              cmake --build build --target build
            "

      - name: Validate APK outputs
        run: |
          ls -la build/*.apk
          for apk in build/*.apk; do
            test -f "$apk" || { echo "Missing $apk"; exit 1; }
            test -s "$apk" || { echo "$apk is empty"; exit 1; }
            file "$apk"
          done
          echo "✅ All APKs validated."

      - name: Create tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}
          gh release create ${{ inputs.version }} \
            --generate-notes \
            --title "${{ inputs.version }}" \
            build/*.apk
