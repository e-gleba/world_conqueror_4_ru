name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.28.0_ru)'
        required: true
        type: string

permissions:
  contents: write
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/build-env

jobs:
  # One decompiled APK, two patch combinations driven by the WC4_PATCH_*
  # toggles: mod = all patches, clean = extras off.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [mod, clean]
        include:
          - variant: mod
            cmake_args: ''
          - variant: clean
            cmake_args: '-DWC4_PATCH_EXTRAS=OFF'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare builder image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || \
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      # The base APK, its SHA-256 and the tool versions are pinned in
      # CMakeLists.txt — cmake downloads and verifies them itself, so the
      # workflow has nothing to duplicate.
      - name: Cache base APK, decompiled source & tools
        uses: actions/cache@v6
        with:
          path: |
            build/original.apk
            build/tools
            decompiled
          key: wc4-build-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'patches/**') }}
          restore-keys: |
            wc4-build-

      - name: Build APK in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "\
              cmake --preset default ${{ matrix.cmake_args }} && \
              cmake --build build --target apks \
            "

      - name: Validate APK output
        run: |
          ls -la build/*.apk
          apk=build/wc4_wc4-aligned-debugSigned.apk
          test -f "$apk" || { echo "Missing $apk"; exit 1; }
          test -s "$apk" || { echo "$apk is empty"; exit 1; }
          file "$apk"
          echo "✅ ${{ matrix.variant }} APK validated."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wc4-${{ matrix.variant }}-aligned-debugSigned
          path: build/wc4_wc4-aligned-debugSigned.apk
          compression-level: 0
          retention-days: 7

  smoke:
    needs: build
    uses: ./.github/workflows/smoke-test.yml
    with:
      apk_artifact_name: wc4-mod-aligned-debugSigned
      source_run_id: ${{ github.run_id }}

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download mod APK
        uses: actions/download-artifact@v8
        with:
          name: wc4-mod-aligned-debugSigned
          path: dist

      - name: Download clean APK
        uses: actions/download-artifact@v8
        with:
          name: wc4-clean-aligned-debugSigned
          path: dist

      - name: Create tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # both artifacts are named wc4_wc4-...; rename per variant
          mv dist/wc4-mod-aligned-debugSigned/wc4_wc4-aligned-debugSigned.apk \
             dist/wc4-mod-aligned-debugSigned/wc4_mod-aligned-debugSigned.apk
          mv dist/wc4-clean-aligned-debugSigned/wc4_wc4-aligned-debugSigned.apk \
             dist/wc4-clean-aligned-debugSigned/wc4_clean-aligned-debugSigned.apk
          git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}
          gh release create ${{ inputs.version }} \
            --generate-notes \
            --title "${{ inputs.version }}" \
            dist/wc4-mod-aligned-debugSigned/wc4_mod-aligned-debugSigned.apk \
            dist/wc4-clean-aligned-debugSigned/wc4_clean-aligned-debugSigned.apk
