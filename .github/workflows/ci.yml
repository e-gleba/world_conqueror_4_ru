name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/logo.png'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/logo.png'

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/build-env
  BASE_RELEASE: v1.24.2_ru

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull published image if available; otherwise build inline (cold start).
      - name: Prepare builder image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || \
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      # Download the base (vanilla) APK pinned to the first release for reproducible builds.
      - name: Download base APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base-apk
          gh release download ${{ env.BASE_RELEASE }} \
            --repo ${{ github.repository }} \
            -p 'original.apk' \
            -D base-apk \
            --skip-existing || \
          gh release download ${{ env.BASE_RELEASE }} \
            --repo ${{ github.repository }} \
            -p '*.apk' \
            -D base-apk \
            --skip-existing
          ls -la base-apk/

      # Cache expensive intermediate artifacts across runs.
      # Key includes the base-release version so a new APK invalidates the cache.
      - name: Cache decompiled source & tools
        uses: actions/cache@v4
        with:
          path: |
            decompiled
            build/tools
          key: wc4-build-${{ env.BASE_RELEASE }}-${{ hashFiles('CMakeLists.txt', 'diff/**', 'diff_mod/**') }}
          restore-keys: |
            wc4-build-${{ env.BASE_RELEASE }}-

      # The build target expects decompiled/ to exist (created by the decompile target).
      # We run decompile first (idempotent — skips if already present), then build.
      - name: Configure & build APKs in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c '
              cmake --preset default \
                -Dapk_input=/workspace/base-apk/original.apk && \
              cmake --build build --target decompile && \
              cmake --build build --target build
            '

      - name: Validate APK outputs
        run: |
          ls -la build/*.apk
          test -f build/wc4_ru-aligned-debugSigned.apk || { echo "Missing RU APK"; exit 1; }
          test -f build/wc4_ru_mod-aligned-debugSigned.apk || { echo "Missing MOD APK"; exit 1; }
          test -s build/wc4_ru-aligned-debugSigned.apk || { echo "RU APK is empty"; exit 1; }
          test -s build/wc4_ru_mod-aligned-debugSigned.apk || { echo "MOD APK is empty"; exit 1; }
          file build/wc4_ru-aligned-debugSigned.apk
          file build/wc4_ru_mod-aligned-debugSigned.apk
          echo "✅ Both APKs built and validated."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wc4-apks-${{ github.run_id }}
          path: |
            build/wc4_ru-aligned-debugSigned.apk
            build/wc4_ru_mod-aligned-debugSigned.apk
          retention-days: 7
