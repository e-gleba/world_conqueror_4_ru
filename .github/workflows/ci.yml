name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/logo.png'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/logo.png'

permissions:
  contents: read
  packages: read

env:
  registry: ghcr.io
  image_name: ${{ github.repository }}/build-env
  base_release: v1.24.2_ru

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare builder image
        run: |
          docker pull ${{ env.registry }}/${{ env.image_name }}:latest 2>/dev/null || \
          docker build -t ${{ env.registry }}/${{ env.image_name }}:latest .

      - name: Download base APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base-apk
          gh release download ${{ env.base_release }} \
            --repo ${{ github.repository }} \
            -p 'original.apk' \
            -D base-apk \
            --skip-existing || \
          gh release download ${{ env.base_release }} \
            --repo ${{ github.repository }} \
            -p '*.apk' \
            -D base-apk \
            --skip-existing
          ls -la base-apk/

      - name: Cache decompiled source & tools
        uses: actions/cache@v5
        with:
          path: |
            decompiled
            build/tools
          key: wc4-build-${{ env.base_release }}-${{ hashFiles('CMakeLists.txt', 'diff/**', 'diff_mod/**') }}
          restore-keys: |
            wc4-build-${{ env.base_release }}-

      - name: Configure & build APKs in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.registry }}/${{ env.image_name }}:latest \
            bash -c '
              cmake --preset ci \
                -Dapk_input=/workspace/base-apk/original.apk && \
              cmake --build build --target decompile && \
              cmake --build build --target build
            '

      - name: Validate APK outputs
        run: |
          ls -la build/*.apk
          for apk in build/wc4_ru-aligned-debugSigned.apk build/wc4_ru_mod-aligned-debugSigned.apk; do
            test -f "$apk" || { echo "Missing $apk"; exit 1; }
            test -s "$apk" || { echo "$apk is empty"; exit 1; }
            file "$apk"
          done
          echo "✅ Both debug-signed APKs built and validated."

      - name: Upload wc4_ru-aligned-debugSigned APK
        uses: actions/upload-artifact@v6
        with:
          name: wc4_ru-aligned-debugSigned
          path: build/wc4_ru-aligned-debugSigned.apk
          compression-level: 0
          retention-days: 7

      - name: Upload wc4_ru_mod-aligned-debugSigned APK
        uses: actions/upload-artifact@v6
        with:
          name: wc4_ru_mod-aligned-debugSigned
          path: build/wc4_ru_mod-aligned-debugSigned.apk
          compression-level: 0
          retention-days: 7

  smoke_test:
    name: smoke-test
    needs: build
    runs-on: [self-hosted, waydroid]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            CMakeLists.txt
            CMakePresets.json
          sparse-checkout-cone-mode: false

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: wc4_ru_mod-aligned-debugSigned
          path: build/

      - name: Run CMake smoke_test target
        run: |
          cmake --preset ci
          cmake --build build --target smoke_test
