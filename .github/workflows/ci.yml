name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/logo.png'
      - '.github/logo.svg'
      - '.github/dependabot.yml'
      - '.github/renovate.json'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/logo.png'
      - '.github/logo.svg'
      - '.github/dependabot.yml'
      - '.github/renovate.json'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      cmake_args:
        description: 'Extra cmake args, e.g. -DWC4_PATCH_EXTRAS=OFF or -DWC4_PATCHES=ru_translation;expose_saves'
        required: false
        type: string
        default: ''

# actions: read is for the called smoke-test workflow — a reusable
# workflow's token is capped by the caller's permissions, and listing /
# downloading artifacts needs actions: read.
permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/build-env

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare builder image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null || \
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      # The base APK, its SHA-256 and the tool versions are pinned in
      # CMakeLists.txt — cmake downloads and verifies them itself, so CI
      # has nothing to duplicate. CMakeLists.txt is in the cache key, so
      # bumping the APK or a tool busts the cache automatically.
      - name: Cache base APK, decompiled source & tools
        uses: actions/cache@v6
        with:
          path: |
            build/original.apk
            build/tools
            decompiled
          key: wc4-build-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'patches/**') }}
          restore-keys: |
            wc4-build-

      - name: Configure & build APKs in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c '\
              cmake --preset default ${{ inputs.cmake_args }} && \
              cmake --build build --target apks
            '

      - name: Run patch tests (ctest)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ctest --preset default

      - name: Validate APK output
        run: |
          ls -la build/*.apk
          apk=build/wc4_wc4-aligned-debugSigned.apk
          test -f "$apk" || { echo "Missing $apk"; exit 1; }
          test -s "$apk" || { echo "$apk is empty"; exit 1; }
          file "$apk"
          echo "✅ debug-signed APK built and validated."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wc4_wc4-aligned-debugSigned
          path: build/wc4_wc4-aligned-debugSigned.apk
          compression-level: 0
          retention-days: 7

  # Extended test on the build: boot the freshly built APK in an emulator
  # and watch it for crashes. Same reusable workflow release.yml calls.
  smoke:
    needs: build
    uses: ./.github/workflows/smoke-test.yml
    with:
      apk_artifact_name: wc4_wc4-aligned-debugSigned
